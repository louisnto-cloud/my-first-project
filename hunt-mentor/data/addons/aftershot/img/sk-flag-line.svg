<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Seen from above: a pin where you shot, a flag where the deer stood, white paper on every blood spot, and a flag at the tree where you last saw it. Together they make a line that shows the direction of travel.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<path d="M0 0 H400 V300 H0 Z" fill="#dfe6d3" opacity=".5"/><text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">Mark it: make a line you can see</text><circle cx="50" cy="250" r="10" fill="#e8590c"/><text x="66" y="256" font-size="14" font-weight="bold" fill="#23261f">1 Pin where you shot</text><line x1="50" y1="250" x2="140" y2="130" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="140" y1="130" x2="140" y2="106" stroke="#23261f" stroke-width="2"/><path d="M140 106 L156 112 L140 118 Z" fill="#e8590c"/><text x="40" y="84" font-size="14" font-weight="bold" fill="#23261f">2 Flag where it stood</text><circle cx="170" cy="140" r="4" fill="#b3261e"/><line x1="172" y1="136" x2="172" y2="112" stroke="#23261f" stroke-width="2"/><path d="M172 112 L188 118 L172 124 Z" fill="#ffffff"/><circle cx="200" cy="128" r="4" fill="#b3261e"/><line x1="202" y1="124" x2="202" y2="100" stroke="#23261f" stroke-width="2"/><path d="M202 100 L218 106 L202 112 Z" fill="#ffffff"/><circle cx="232" cy="140" r="4" fill="#b3261e"/><line x1="234" y1="136" x2="234" y2="112" stroke="#23261f" stroke-width="2"/><path d="M234 112 L250 118 L234 124 Z" fill="#ffffff"/><circle cx="262" cy="126" r="4" fill="#b3261e"/><line x1="264" y1="122" x2="264" y2="98" stroke="#23261f" stroke-width="2"/><path d="M264 98 L280 104 L264 110 Z" fill="#ffffff"/><text x="230" y="206" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">3 Paper or tape on</text><text x="230" y="224" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">every blood spot</text><g fill="#2f3a2b"><polygon points="330,120 342,86 354,120"/><rect x="339" y="120" width="6" height="10"/></g><line x1="318" y1="132" x2="318" y2="108" stroke="#23261f" stroke-width="2"/><path d="M318 108 L334 114 L318 120 Z" fill="#e8590c"/><text x="300" y="60" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">4 Flag last seen</text><path d="M140 130 C 200 120, 260 124, 318 132" fill="none" stroke="#23261f" stroke-width="1.5" stroke-dasharray="2 5"/><text x="200" y="290" font-size="14" text-anchor="middle" fill="#2f3a2b">Now the flags point the way it went</text>
</svg>
