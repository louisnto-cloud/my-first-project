<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 442" font-family="sans-serif" role="img" aria-label="Blood sign chart: what the blood looks like, what was hit, and how long to wait before you follow. Pink, frothy blood with bubbles: lungs, wait 30 minutes. Bright red, lots of it: heart or a big artery, wait 30 minutes. Dark red with no bubbles: liver, wait 4 to 6 hours. Thin, green brown with food bits and a smell: gut, wait 6 to 8 hours. Thin, patchy blood while the deer keeps running: muscle or leg, wait 30 to 60 minutes. Opinion from hunter education, not law (70%).">
<rect width="400" height="442" fill="#fffaf0"/>
<!-- the three steps -->
<g data-tip="Flag the spot|Mark the exact spot where the animal stood with flagging tape before you move." data-tip-dot="120,12">
<rect x="8" y="8" width="122" height="38" rx="19" fill="#2f3a2b"/>
<circle cx="27" cy="27" r="11" fill="#e8590c"/><text x="27" y="32" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">1</text>
<text x="44" y="32" font-size="15" font-weight="bold" fill="#fffaf0">Flag spot</text>
</g>
<rect x="139" y="8" width="122" height="38" rx="19" fill="#2f3a2b"/>
<circle cx="158" cy="27" r="11" fill="#e8590c"/><text x="158" y="32" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text>
<text x="175" y="32" font-size="15" font-weight="bold" fill="#fffaf0">Read blood</text>
<g data-tip="Wait, then track|Sources disagree on liver and gut. Every source agrees those waits are hours, longer than a lung hit, and gut is the longest." data-tip-dot="382,12">
<rect x="270" y="8" width="122" height="38" rx="19" fill="#2f3a2b"/>
<circle cx="289" cy="27" r="11" fill="#e8590c"/><text x="289" y="32" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">3</text>
<text x="306" y="32" font-size="15" font-weight="bold" fill="#fffaf0">Wait</text>
</g>
<text x="16" y="66" font-size="14" font-weight="bold" fill="#6b5b4b">BLOOD: LIKELY HIT</text>
<text x="386" y="66" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="end">WAIT</text>
<g data-tip="Lungs|Bright pink or crimson, frothy, with bubbles. A deer usually goes under 100 m. Wait 30 minutes." data-tip-dot="300,82">
<rect x="8" y="74" width="384" height="62" rx="8" fill="#f4eedf"/>
<circle cx="38" cy="105" r="23" fill="#e7dcc4" stroke="#cdbf9f" stroke-width="1"/>
<g transform="translate(38 105)"><path d="M-14 2 C-14 -10 -4 -14 3 -13 C14 -11 15 0 11 7 C7 14 -6 15 -11 10z" fill="#ef8f8f"/><circle cx="-5" cy="-3" r="3.4" fill="#fff" fill-opacity=".9"/><circle cx="4" cy="2" r="2.8" fill="#fff" fill-opacity=".9"/><circle cx="6" cy="-6" r="2.2" fill="#fff" fill-opacity=".9"/><circle cx="-2" cy="6" r="2.2" fill="#fff" fill-opacity=".9"/><circle cx="-8" cy="4" r="1.6" fill="#fff" fill-opacity=".9"/></g>
<text x="72" y="99" font-size="17" font-weight="bold" fill="#2f3a2b">Lungs</text>
<text x="72" y="124" font-size="15" fill="#6b5b4b">pink, frothy, bubbles</text>
<rect x="314" y="80" width="72" height="28" rx="14" fill="#2f6e3b"/>
<text x="350" y="99" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">30 min</text>
</g>
<g data-tip="Heart or artery|Bright red, lots of it: the heart, a big artery, or a leg. Wait 30 minutes." data-tip-dot="300,150">
<rect x="8" y="142" width="384" height="62" rx="8" fill="#fffaf0" stroke="#efe6d2"/>
<circle cx="38" cy="173" r="23" fill="#e7dcc4" stroke="#cdbf9f" stroke-width="1"/>
<g transform="translate(38 173)"><path d="M-17 2 C-17 -12 -5 -17 3 -15 C17 -14 19 0 14 8 C8 17 -7 18 -14 12z" fill="#c62828"/><circle cx="18" cy="-12" r="3" fill="#c62828"/><circle cx="-16" cy="13" r="2.4" fill="#c62828"/></g>
<text x="72" y="167" font-size="17" font-weight="bold" fill="#2f3a2b">Heart, artery</text>
<text x="72" y="192" font-size="15" fill="#6b5b4b">bright red, lots of it</text>
<rect x="314" y="148" width="72" height="28" rx="14" fill="#2f6e3b"/>
<text x="350" y="167" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">30 min</text>
</g>
<g data-tip="Liver|Dark red, no bubbles. It beds within a few hundred metres. Back out quietly and wait hours." data-tip-dot="292,218">
<rect x="8" y="210" width="384" height="62" rx="8" fill="#f4eedf"/>
<circle cx="38" cy="241" r="23" fill="#e7dcc4" stroke="#cdbf9f" stroke-width="1"/>
<g transform="translate(38 241)"><path d="M-13 2 C-13 -9 -4 -13 3 -12 C13 -10 14 0 10 6 C6 13 -5 14 -10 9z" fill="#5d1414"/></g>
<text x="72" y="235" font-size="17" font-weight="bold" fill="#2f3a2b">Liver</text>
<text x="72" y="260" font-size="15" fill="#6b5b4b">dark red, no bubbles</text>
<rect x="306" y="216" width="80" height="28" rx="14" fill="#e8590c"/>
<text x="346" y="235" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">4 to 6 h</text>
</g>
<g data-tip="Gut|Thin, greenish brown, bits of food, smells. Back out quietly: pushing the animal early is how it gets lost." data-tip-dot="292,286">
<rect x="8" y="278" width="384" height="62" rx="8" fill="#fffaf0" stroke="#efe6d2"/>
<circle cx="38" cy="309" r="23" fill="#e7dcc4" stroke="#cdbf9f" stroke-width="1"/>
<g transform="translate(38 309)"><path d="M-17 4 C-12 -6 2 -9 14 -4 C20 0 14 8 4 8 C-6 9 -14 10 -17 4z" fill="#7a6a2a"/><rect x="-6" y="-3" width="5" height="4" fill="#c9b79c"/><rect x="5" y="1" width="4" height="3" fill="#a9c27a"/><path d="M-4 -12 c-3 -4 3 -6 0 -10 M5 -11 c-3 -4 3 -6 0 -10" stroke="#9a8c6a" stroke-width="1.3" fill="none"/></g>
<text x="72" y="303" font-size="17" font-weight="bold" fill="#2f3a2b">Gut</text>
<text x="72" y="328" font-size="15" fill="#6b5b4b">thin, green brown, food bits, smells</text>
<rect x="306" y="284" width="80" height="28" rx="14" fill="#c0392b"/>
<text x="346" y="303" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">6 to 8 h</text>
</g>
<g data-tip="Muscle or leg|Thin and patchy, and the animal keeps a normal pace. Wait 30 to 60 minutes, then track hard." data-tip-dot="252,354">
<rect x="8" y="346" width="384" height="62" rx="8" fill="#f4eedf"/>
<circle cx="38" cy="377" r="23" fill="#e7dcc4" stroke="#cdbf9f" stroke-width="1"/>
<g transform="translate(38 377)"><circle cx="-12" cy="-8" r="3" fill="#c62828"/><circle cx="2" cy="-2" r="2.4" fill="#c62828"/><circle cx="12" cy="8" r="2" fill="#c62828"/><circle cx="-4" cy="10" r="1.8" fill="#c62828"/><circle cx="10" cy="-12" r="1.6" fill="#c62828"/></g>
<text x="72" y="371" font-size="17" font-weight="bold" fill="#2f3a2b">Muscle, leg</text>
<text x="72" y="396" font-size="15" fill="#6b5b4b">thin, patchy, deer runs on</text>
<rect x="267" y="352" width="119" height="28" rx="14" fill="#2f6e3b"/>
<text x="326.5" y="371" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">30 to 60 min</text>
</g>
<text x="200" y="432" font-size="14" fill="#6b5b4b" text-anchor="middle">Opinion from hunter education, not law (70%)</text>
</svg>
