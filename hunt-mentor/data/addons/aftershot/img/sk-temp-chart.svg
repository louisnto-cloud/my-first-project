<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 432" font-family="sans-serif" role="img" aria-label="Thermometer chart of meat temperatures, from food safety sources, not BC law, 80 to 95 percent. Cook all wild game to at least 71 degrees Celsius (160 F). The danger zone is 4 to 60 degrees (40 to 140 F), where bacteria can double every 20 minutes. Target for the carcass: below 4 degrees (40 F), fast. Aging: 1 to 3 degrees (34 to 37 F) for 7 to 14 days at most. Freezer: minus 18 degrees (0 F), game keeps about a year.">
<rect width="400" height="432" fill="#fffaf0"/>
<text x="14" y="26" font-size="18" font-weight="bold" fill="#2f3a2b">Meat temperatures to know</text>
<rect x="27" y="46" width="26" height="358" rx="13" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<rect x="33" y="54" width="14" height="58" rx="4" fill="#f6d5d0"/>
<rect x="33" y="112" width="14" height="100" fill="#e8908a"/>
<rect x="33" y="212" width="14" height="192" fill="#cddff0"/>
<rect x="33" y="254" width="14" height="18" fill="#4a7fb0"/>
<circle cx="40" cy="404" r="19" fill="#4a7fb0" stroke="#2f3a2b" stroke-width="2"/>
<line x1="27" y1="70" x2="53" y2="70" stroke="#2f3a2b" stroke-width="1.6"/>
<line x1="27" y1="112" x2="53" y2="112" stroke="#2f3a2b" stroke-width="1.6"/>
<line x1="27" y1="212" x2="53" y2="212" stroke="#2f3a2b" stroke-width="1.6"/>
<line x1="27" y1="340" x2="53" y2="340" stroke="#2f3a2b" stroke-width="1.6"/>
<path d="M60 112 h8 V212 h-8" fill="none" stroke="#c0392b" stroke-width="2.4"/>
<path d="M53 70 H74 L80 70" stroke="#c0392b" stroke-width="1.8" fill="none"/>
<text x="86" y="76" font-size="18" font-weight="bold" fill="#c0392b">71°C (160°F)</text>
<text x="86" y="97" font-size="15" fill="#2f3a2b">Cook all wild game to at least this</text>
<path d="M68 162.0 H74 L80 150" stroke="#c0392b" stroke-width="1.8" fill="none"/>
<text x="86" y="156" font-size="18" font-weight="bold" fill="#c0392b">4 to 60°C (40 to 140°F)</text>
<text x="86" y="177" font-size="15" fill="#2f3a2b">Danger zone: bacteria can</text>
<text x="86" y="196" font-size="15" fill="#2f3a2b">double every 20 min</text>
<path d="M53 212 H74 L80 226" stroke="#2f6e3b" stroke-width="1.8" fill="none"/>
<text x="86" y="232" font-size="18" font-weight="bold" fill="#2f6e3b">Below 4°C (40°F)</text>
<text x="86" y="253" font-size="15" fill="#2f3a2b">Target for the carcass, fast</text>
<path d="M53 263.0 H74 L80 284" stroke="#4a7fb0" stroke-width="1.8" fill="none"/>
<text x="86" y="290" font-size="18" font-weight="bold" fill="#4a7fb0">1 to 3°C (34 to 37°F)</text>
<text x="86" y="311" font-size="15" fill="#2f3a2b">Aging, 7 to 14 days max</text>
<path d="M53 340 H74 L80 342" stroke="#4a7fb0" stroke-width="1.8" fill="none"/>
<text x="86" y="348" font-size="18" font-weight="bold" fill="#4a7fb0">Minus 18°C (0°F)</text>
<text x="86" y="369" font-size="15" fill="#2f3a2b">Freezer: game keeps about a year</text>
<text x="86" y="402" font-size="14" fill="#6b5b4b">Food safety sources, not BC law</text>
<text x="86" y="421" font-size="14" fill="#6b5b4b">(80 to 95%)</text>
</svg>
