<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Hide step 3 of 4: the head. Turn the ears inside out, split the lips and eyelids, and leave about 2.5 cm of nose cartilage, so salt can reach every layer. Or leave the head in the hide and get it to a taxidermist fast.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Hide 3 of 4: head</text><ellipse cx="200" cy="150" rx="80" ry="64" fill="#1d1d1b"/><ellipse cx="140" cy="94" rx="20" ry="22" fill="#1d1d1b"/><ellipse cx="260" cy="94" rx="20" ry="22" fill="#1d1d1b"/><ellipse cx="200" cy="180" rx="34" ry="24" fill="#8b6a4a"/><circle cx="140" cy="94" r="9" fill="none" stroke="#e8590c" stroke-width="3"/><circle cx="260" cy="94" r="9" fill="none" stroke="#e8590c" stroke-width="3"/><circle cx="176" cy="140" r="9" fill="none" stroke="#e8590c" stroke-width="3"/><circle cx="224" cy="140" r="9" fill="none" stroke="#e8590c" stroke-width="3"/><circle cx="200" cy="196" r="9" fill="none" stroke="#e8590c" stroke-width="3"/><text x="80" y="80" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Ears: turn</text><text x="320" y="80" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Ears: turn</text><text x="100" y="150" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Eyelids</text><text x="330" y="200" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Lips, nose</text><rect x="8" y="256" width="384" height="36" rx="8" fill="#2f3a2b"/><text x="200" y="280" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Turn ears, split lips and eyelids.</text>
</svg>
