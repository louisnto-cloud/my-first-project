<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 461" font-family="sans-serif" role="img" aria-label="Six cards: Region 3 special rules, synopsis pages 10, 32 and 33. No feeding or baiting: ungulates, within 200 m of a dwelling, school yard or playground, new. CWD (Chronic Wasting Disease) testing: submit deer, elk and moose heads, whole region. Bovine TB (tuberculosis) testing: submit heads from MUs 3-12, 3-19 and 3-20. Gates and fences: leave them as you found them. Bison on public land: report to RAPP (Report All Poachers and Polluters) 1 877 952 7277, new. Coquihalla, Highway 5: no single projectile within 400 m, Hope to Kamloops.">
