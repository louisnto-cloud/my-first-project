<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 443" font-family="sans-serif" role="img" aria-label="Region 8 deer bag limits, synopsis page 67, and page 14 for the province. All deer together, in one licence year: 3. Antlerless: at most 2, and only 1 of each species. Mule deer: 1. Antlerless mule deer: draw only, by LEH, Limited Entry Hunting. White tailed deer: 2, at most 1 buck and 1 antlerless. Province wide: 1 mule deer buck from Regions 3, 4, 5, 6, 7A, 7B and 8 combined.">
<rect width="400" height="443" fill="#fffaf0"/>
<text x="14" y="30" font-size="15" font-weight="bold" fill="#6b5b4b" letter-spacing="1">REGION 8, PAGE 67</text>
<line x1="187" y1="25" x2="392" y2="25" stroke="#d8cfb8" stroke-width="1.4"/>
<rect x="8" y="40" width="384" height="58" rx="6" fill="#f4eedf"/>
<text x="64" y="77.6" font-size="24" font-weight="bold" fill="#c2410c" text-anchor="middle">3</text>
<text x="130" y="64" font-size="16" fill="#2f3a2b">All deer together, one licence</text>
<text x="130" y="85" font-size="16" fill="#2f3a2b">year</text>
<text x="64" y="137.6" font-size="24" font-weight="bold" fill="#c2410c" text-anchor="middle">2</text>
<text x="130" y="124" font-size="16" fill="#2f3a2b">Antlerless at most, only 1 of</text>
<text x="130" y="145" font-size="16" fill="#2f3a2b">each species</text>
<rect x="8" y="160" width="384" height="44" rx="6" fill="#f4eedf"/>
<text x="64" y="190.6" font-size="24" font-weight="bold" fill="#8b5a2b" text-anchor="middle">1</text>
<text x="130" y="187.5" font-size="16" fill="#2f3a2b">Mule deer</text>
<text x="64" y="236.6" font-size="24" font-weight="bold" fill="#8b5a2b" text-anchor="middle">LEH</text>
<text x="130" y="233.5" font-size="16" fill="#2f3a2b">Antlerless mule deer: draw only</text>
<rect x="8" y="252" width="384" height="58" rx="6" fill="#f4eedf"/>
<text x="64" y="289.6" font-size="24" font-weight="bold" fill="#4a7fb0" text-anchor="middle">2</text>
<text x="130" y="276" font-size="16" fill="#2f3a2b">White tailed deer: at most 1 buck,</text>
<text x="130" y="297" font-size="16" fill="#2f3a2b">1 antlerless</text>
<text x="14" y="338" font-size="15" font-weight="bold" fill="#6b5b4b" letter-spacing="1">PROVINCE, PAGE 14</text>
<line x1="194" y1="333" x2="392" y2="333" stroke="#d8cfb8" stroke-width="1.4"/>
<rect x="8" y="348" width="384" height="58" rx="6" fill="#f4eedf"/>
<text x="64" y="385.6" font-size="24" font-weight="bold" fill="#c0392b" text-anchor="middle">1</text>
<text x="130" y="372" font-size="16" fill="#2f3a2b">Mule deer buck from Regions 3,</text>
<text x="130" y="393" font-size="16" fill="#2f3a2b">4, 5, 6, 7A, 7B and 8 combined</text>
<text x="14" y="432" font-size="14" fill="#6b5b4b">LEH: Limited Entry Hunting (the draw)</text>
</svg>
