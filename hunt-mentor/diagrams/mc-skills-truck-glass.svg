<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two trucks. Left: glassing from the truck with a rifle inside, a question mark, ask a conservation officer first. Right: glassing with no firearm, scouting only. Hunting includes searching for wildlife while in possession of a firearm, page 3, and hunting from a motor vehicle is unlawful, item 22. Study aid only; the regulations are the law.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Glassing from the truck: ask first</text><rect x="14" y="44" width="180" height="190" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><rect x="206" y="44" width="180" height="190" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><rect x="34" y="120" width="110" height="40" rx="8" fill="#7a8a99"/><rect x="94" y="100" width="50" height="26" rx="6" fill="#7a8a99"/><circle cx="56" cy="162" r="12" fill="#23261f"/><circle cx="126" cy="162" r="12" fill="#23261f"/><rect x="226" y="120" width="110" height="40" rx="8" fill="#7a8a99"/><rect x="286" y="100" width="50" height="26" rx="6" fill="#7a8a99"/><circle cx="248" cy="162" r="12" fill="#23261f"/><circle cx="318" cy="162" r="12" fill="#23261f"/><rect x="46" y="132" width="50" height="8" rx="3" fill="#6b4f35"/><text x="70" y="196" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Rifle inside</text><text x="160" y="110" font-size="40" fill="#e8590c" text-anchor="middle" font-weight="bold">?</text><text x="104" y="218" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Ask a CO first</text><g transform="translate(358 92) scale(0.7)"><rect x="-22" y="-12" width="18" height="30" rx="6" fill="#23261f"/><rect x="4" y="-12" width="18" height="30" rx="6" fill="#23261f"/><rect x="-6" y="-6" width="12" height="10" fill="#23261f"/><circle cx="-13" cy="20" r="8" fill="#4a7fb0"/><circle cx="13" cy="20" r="8" fill="#4a7fb0"/></g><text x="296" y="196" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">No firearm</text><text x="296" y="218" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Scouting only</text><text x="200" y="262" font-size="14" fill="#6b4f35" text-anchor="middle">CO: conservation officer. Rule Book page 3 and item 22</text><text x="200" y="284" font-size="14" fill="#e8590c" text-anchor="middle">Study aid only. The regulations are the law</text>
</svg>
