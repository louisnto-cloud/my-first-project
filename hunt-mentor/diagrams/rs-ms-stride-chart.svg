<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif" role="img" aria-label="Bar chart of walking stride ranges from North Dakota Game and Fish, in centimetres: bobcat 15 to 36, coyote 34 to 43, wolf 33 to 61, white tail 33 to 66, mule deer 38 to 64, black bear 43 to 64, elk 46 to 89, cougar 48 to 81, moose 71 to 112.">
<rect x="0" y="0" width="400" height="320" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Walking stride, cm</text>
<text x="200" y="50" font-size="14" fill="#6b4f35" text-anchor="middle">North Dakota Game and Fish ranges</text>
<text x="112" y="84" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Bobcat</text><rect x="148.5" y="72" width="39.9" height="16" rx="4" fill="#8a9a6b"/><text x="192.39999999999998" y="85" font-size="14" fill="#23261f" text-anchor="start">15 to 36</text><text x="112" y="109" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Coyote</text><rect x="184.6" y="97" width="17.099999999999998" height="16" rx="4" fill="#8a9a6b"/><text x="205.7" y="110" font-size="14" fill="#23261f" text-anchor="start">34 to 43</text><text x="112" y="134" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Wolf</text><rect x="182.7" y="122" width="53.199999999999996" height="16" rx="4" fill="#8a9a6b"/><text x="239.89999999999998" y="135" font-size="14" fill="#23261f" text-anchor="start">33 to 61</text><text x="112" y="159" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">White tail</text><rect x="182.7" y="147" width="62.699999999999996" height="16" rx="4" fill="#e8590c"/><text x="249.39999999999998" y="160" font-size="14" fill="#23261f" text-anchor="start">33 to 66</text><text x="112" y="184" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Mule deer</text><rect x="192.2" y="172" width="49.4" height="16" rx="4" fill="#e8590c"/><text x="245.6" y="185" font-size="14" fill="#23261f" text-anchor="start">38 to 64</text><text x="112" y="209" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Black bear</text><rect x="201.7" y="197" width="39.9" height="16" rx="4" fill="#8a9a6b"/><text x="245.6" y="210" font-size="14" fill="#23261f" text-anchor="start">43 to 64</text><text x="112" y="234" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Elk</text><rect x="207.39999999999998" y="222" width="81.7" height="16" rx="4" fill="#8a9a6b"/><text x="293.1" y="235" font-size="14" fill="#23261f" text-anchor="start">46 to 89</text><text x="112" y="259" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Cougar</text><rect x="211.2" y="247" width="62.699999999999996" height="16" rx="4" fill="#8a9a6b"/><text x="277.9" y="260" font-size="14" fill="#23261f" text-anchor="start">48 to 81</text><text x="112" y="284" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Moose</text><rect x="254.9" y="272" width="77.89999999999999" height="16" rx="4" fill="#8a9a6b"/><text x="336.79999999999995" y="285" font-size="14" fill="#23261f" text-anchor="start">71 to 112</text><line x1="120.0" y1="66" x2="120.0" y2="296" stroke="#c9c9b9" stroke-width="1"/><text x="120.0" y="310" font-size="14" fill="#6b4f35" text-anchor="middle">0 cm</text><line x1="215.0" y1="66" x2="215.0" y2="296" stroke="#c9c9b9" stroke-width="1"/><text x="215.0" y="310" font-size="14" fill="#6b4f35" text-anchor="middle">50 cm</text><line x1="310.0" y1="66" x2="310.0" y2="296" stroke="#c9c9b9" stroke-width="1"/><text x="310.0" y="310" font-size="14" fill="#6b4f35" text-anchor="middle">100 cm</text>
</svg>
