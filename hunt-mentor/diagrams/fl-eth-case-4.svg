<rect x="75.0" y="104" width="90" height="36" rx="6" fill="#b3261e" stroke="#ffffff" stroke-width="2"/>
<text x="120" y="126" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">POSTED</text><rect x="10" y="196" width="380" height="58" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="220" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Lean:</text><text x="200" y="242" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Stop. Ask the owner, or call an officer.</text>
</svg>
