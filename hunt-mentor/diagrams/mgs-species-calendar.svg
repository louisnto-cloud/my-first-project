th="48.0" height="22" rx="4" fill="#7aa6c9"/><text x="400" y="194" font-size="12" fill="#23261f" text-anchor="middle"></text><text x="132" y="230" font-size="13.5" font-weight="bold" fill="#23261f" text-anchor="end">Snow, Skagit WA</text><rect x="261.6" y="214" width="86.4" height="22" rx="4" fill="#c8d9e8"/><text x="400" y="230" font-size="12" fill="#23261f" text-anchor="middle"></text><text x="132" y="266" font-size="13.5" font-weight="bold" fill="#23261f" text-anchor="end">White fronted</text><rect x="140" y="250" width="64" height="22" rx="4" fill="#b07d4f"/><rect x="364" y="250" width="32" height="22" rx="4" fill="#b07d4f"/><text x="400" y="266" font-size="12" fill="#23261f" text-anchor="middle"></text><text x="200" y="292" font-size="13.5" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Snow dates 80%. Migrant and white front bars: Tip</text>
