<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart, September to April, of when each goose is in BC. Local Canada geese: all year, 85 percent. Migrant Canada geese: September to November, a Tip. Cackling geese: passing in fall and again in spring, 75 percent. Snow geese on the Fraser delta: October to mid December, then back mid March to April, 80 percent; most shift to the Skagit in Washington late December to February. White fronted geese: passing in early fall and spring, a Tip, 60 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
