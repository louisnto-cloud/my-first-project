<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 258" font-family="sans-serif" role="img" aria-label="Moose senses ranked. Nose: excellent, wind at your back ends the stalk. Ears: very good, the big ears swivel and catch a snapped twig far away. Eyes: poor, they see motion but not detail. A moose often stands and stares instead of running.">
<rect x="0" y="0" width="400" height="258" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Moose senses</text><text x="8" y="78.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Nose</text><rect x="80" y="56" width="222.9" height="34" rx="4" fill="#e8590c"/><text x="307.8571428571429" y="78.0" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">excellent</text><text x="8" y="134.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Ears</text><rect x="80" y="112" width="178.3" height="34" rx="4" fill="#4a7fb0"/><text x="263.2857142857143" y="134.0" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">very good</text><text x="8" y="190.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Eyes</text><rect x="80" y="168" width="66.9" height="34" rx="4" fill="#8a9a6b"/><text x="151.85714285714286" y="190.0" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">poor: motion only</text><text x="200" y="246" font-size="14" fill="#6b4f35" text-anchor="middle">A staring moose has seen you (hunter lore).</text>
</svg>
