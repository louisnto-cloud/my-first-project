<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Barrel lengths from the RCMP reference table for Type 56 SKS records: standard 520 mm non restricted; 478 mm non restricted; 419 mm restricted; a 400 mm cut barrel prohibited. A dashed line marks 470 mm, the restricted line for semi automatic centrefire rifles.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Barrel length decides the class</text>
<rect x="20.0" y="66.0" width="218.4" height="16.0" rx="0" fill="#3A403C" stroke="#17201A" stroke-width="1"/><text x="246.4" y="79.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">520 mm standard</text><text x="20.0" y="100.0" font-size="14" font-weight="bold" fill="#2E7D4F" text-anchor="start">Non restricted</text><rect x="20.0" y="112.0" width="200.8" height="16.0" rx="0" fill="#3A403C" stroke="#17201A" stroke-width="1"/><text x="228.8" y="125.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">478 mm</text><text x="20.0" y="146.0" font-size="14" font-weight="bold" fill="#2E7D4F" text-anchor="start">Non restricted</text><rect x="20.0" y="158.0" width="176.0" height="16.0" rx="0" fill="#3A403C" stroke="#17201A" stroke-width="1"/><text x="204.0" y="171.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">419 mm</text><text x="20.0" y="192.0" font-size="14" font-weight="bold" fill="#FF6A13" text-anchor="start">Restricted</text><rect x="20.0" y="204.0" width="168.0" height="16.0" rx="0" fill="#B3261E" stroke="#17201A" stroke-width="1"/><text x="196.0" y="217.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">400 mm cut</text><text x="20.0" y="238.0" font-size="14" font-weight="bold" fill="#B3261E" text-anchor="start">Prohibited</text><line x1="217.4" y1="56.0" x2="217.4" y2="250.0" stroke="#FF6A13" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><text x="217.4" y="266.0" font-size="14" font-weight="bold" fill="#FF6A13" text-anchor="middle">470 mm line</text>
<text x="200.0" y="288.0" font-size="14" fill="#17201A" text-anchor="middle">Never cut the barrel.</text>
</svg>
