<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Circles drawn to scale: an adult male black bear home range is typically 25 to 150 square kilometres, a female 5 to 25 square kilometres, from the BC government account. Big males roam widely; a sow stays in a smaller area.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Home range: boar vs sow (to scale)</text><circle cx="150" cy="170" r="100" fill="#8b5a2b" opacity=".18"/><circle cx="150" cy="170" r="41" fill="#8b5a2b" opacity=".35"/><circle cx="320" cy="200" r="41" fill="#8a9a6b" opacity=".45"/><circle cx="320" cy="200" r="18" fill="#8a9a6b" opacity=".8"/><text x="150" y="80" font-size="15" font-weight="bold" fill="#8b5a2b" text-anchor="middle">Boar 25 to 150 km2</text><text x="320" y="150" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Sow 5 to 25 km2</text><text x="16" y="290" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Big males roam; a sow stays put (90%)</text>
</svg>
