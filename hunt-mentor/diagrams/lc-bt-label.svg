<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 292" font-family="sans-serif" role="img" aria-label="A freezer package with a label that reads: Mule deer buck, backstrap, 600 g, 18 Oct 2026, Heffley. Label species, cut, weight, date and which animal. At minus 18 degrees Celsius, about a year of quality.">
