<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Look back: on the way in, turn around at every trail junction and landmark so you know what it looks like on the way out, and drop a GPS pin at the truck and each junction.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Look back: the way home looks new</text><rect x="0" y="40" width="400" height="260" rx="0" fill="#dfe6d3"/><path d="M40 260 C120 220 160 170 220 150 S330 90 360 70" fill="none" stroke="#8b5a2b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8"/><rect x="20" y="252" width="46" height="24" rx="4" fill="#4a7fb0"/><text x="44" y="292" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">truck</text><circle cx="120" cy="222" r="9.0" fill="#e8590c"/><circle cx="220" cy="150" r="9.0" fill="#e8590c"/><circle cx="320" cy="92" r="9.0" fill="#e8590c"/><line x1="295" y1="116" x2="298" y2="98" stroke="#2f3a2b" stroke-width="4.2" stroke-linecap="round"/><line x1="305" y1="116" x2="302" y2="98" stroke="#2f3a2b" stroke-width="4.2" stroke-linecap="round"/><rect x="293" y="82" width="13" height="18" rx="3.5999999999999996" fill="#e8590c"/><line x1="294" y1="84" x2="289" y2="97" stroke="#2f3a2b" stroke-width="3.5999999999999996" stroke-linecap="round"/><line x1="306" y1="84" x2="311" y2="97" stroke="#2f3a2b" stroke-width="3.5999999999999996" stroke-linecap="round"/><circle cx="300" cy="76" r="6.0" fill="#d9b48f"/><line x1="286" y1="76" x2="258" y2="84" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="250,86 259,88 256,79" fill="#e8590c"/><text x="140" y="100" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Turn around at each</text><text x="140" y="120" font-size="15" fill="#2f3a2b" text-anchor="middle">junction. Drop a GPS pin</text>
</svg>
