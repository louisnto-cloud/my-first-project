<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 285" font-family="sans-serif" role="img" aria-label="Thermometer chart from a 1986 study of two captive moose in Alberta. In summer breathing speeds up from about 14 degrees Celsius and open mouth panting starts about 20 degrees. In late winter, with the winter coat on, heat stress signs started about minus 5 degrees. Later work says there is no single threshold.">
<rect x="0" y="0" width="400" height="285" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Built for cold: heat stress starts early</text><rect x="60" y="50" width="26" height="200" rx="13" fill="#dfe6d3" stroke="#23261f" stroke-width="2"/><circle cx="73" cy="262" r="20" fill="#c0392b"/><rect x="66" y="120" width="14" height="140" fill="#c0392b"/><path d="M86 86 L110 86 L122 65" stroke="#23261f" stroke-width="2" fill="none"/><text x="126" y="70" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">20°C summer</text><text x="126" y="88" font-size="14" fill="#23261f" text-anchor="start">open mouth panting</text><path d="M86 117 L110 117 L122 125" stroke="#23261f" stroke-width="2" fill="none"/><text x="126" y="130" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">14°C summer</text><text x="126" y="148" font-size="14" fill="#23261f" text-anchor="start">breathing speeds up</text><path d="M86 214 L110 214 L122 195" stroke="#23261f" stroke-width="2" fill="none"/><text x="126" y="200" font-size="15" fill="#4a7fb0" text-anchor="start" font-weight="bold">about minus 5°C</text><text x="126" y="218" font-size="14" fill="#23261f" text-anchor="start">late winter, coat on</text><text x="200" y="252" font-size="14" fill="#6b4f35" text-anchor="middle">Two captive moose, 1986 (70%)</text><text x="200" y="269" font-size="14" fill="#6b4f35" text-anchor="middle">Later work: no single number</text>
</svg>
