<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A mountain cut into colour bands from bottom to top: bunchgrass in the valley bottoms, then ponderosa pine and Douglas fir, then montane spruce, then subalpine fir and spruce, then alpine at the top. Low is dry and warm, high is cold and snowy. The bands overlap and shift with aspect and rainfall.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Elevation bands near Kamloops</text><clipPath id="rl-eb-bands-c"><path d="M0 268 L40 250 L120 200 L190 120 L230 70 L260 60 L300 90 L360 170 L400 210 L400 268 Z"/></clipPath><g clip-path="url(#rl-eb-bands-c)"><rect x="0" y="232" width="400" height="36" fill="#e7dfb8"/><rect x="0" y="186" width="400" height="46" fill="#cfd8a8"/><rect x="0" y="138" width="400" height="48" fill="#a9bd8c"/><rect x="0" y="96" width="400" height="42" fill="#8fa877"/><rect x="0" y="40" width="400" height="56" fill="#eef0ee"/></g><path d="M0 268 L40 250 L120 200 L190 120 L230 70 L260 60 L300 90 L360 170 L400 210 L400 268 Z" fill="none" stroke="#2f3a2b" stroke-width="2.5"/><text x="8" y="250" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="start">Bunchgrass: valley bottoms</text><text x="8" y="210" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="start">Ponderosa pine and Douglas fir</text><text x="8" y="162" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="start">Montane spruce</text><text x="8" y="118" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="start">Subalpine fir and spruce</text><text x="8" y="74" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="start">Alpine</text><text x="392" y="262" font-size="13" fill="#2f3a2b" text-anchor="end">low and dry</text><text x="392" y="52" font-size="13" fill="#2f3a2b" text-anchor="end">high, cold, snowy</text><text x="200" y="292" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bands overlap; aspect and rainfall move them</text>
</svg>
