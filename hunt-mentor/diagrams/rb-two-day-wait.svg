<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 224" role="img" aria-label="Three day boxes: issue day not valid, next day not valid, valid from 2 days after the date of issue. This wait applies to bobcat, caribou, cougar, lynx, mountain goat, mountain sheep and wolverine species licences. Deer, moose, elk, black bear and bison have no wait." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="224" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#23261f" text-anchor="middle" font-weight="bold">Some licences wait 2 days</text>
<rect x="14" y="42" width="118" height="92" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<text x="73" y="66" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Issue day</text>
<path d="M60 87 L86 113 M86 87 L60 113" stroke="#c92a2a" stroke-width="5" stroke-linecap="round"/>
<rect x="140" y="42" width="118" height="92" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<text x="199" y="66" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Next day</text>
<path d="M186 87 L212 113 M212 87 L186 113" stroke="#c92a2a" stroke-width="5" stroke-linecap="round"/>
<rect x="266" y="42" width="118" height="92" rx="10" fill="#ffffff" stroke="#5c7a3a" stroke-width="2.5"/>
<text x="325" y="66" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">2 days after</text>
<path d="M309 100 L320.2 111.2 L341 87.2" fill="none" stroke="#5c7a3a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="200" y="160" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Bobcat, caribou, cougar, lynx,</text>
<text x="200" y="180" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">mountain goat, mountain sheep, wolverine</text>
<text x="200" y="208" font-size="15" fill="#5c7a3a" text-anchor="middle" font-weight="bold">Deer, moose, elk, black bear, bison: no wait.</text>
</svg>
