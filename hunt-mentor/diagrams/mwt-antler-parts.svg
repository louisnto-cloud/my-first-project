<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Side view of one white tailed deer antler. A single main beam rises from the base and sweeps forward. A short brow tine, G1, sticks up near the base. Tines G2, G3 and G4 rise straight up off the top of the main beam. A note says hunters count tines about 2.5 cm or longer plus the beam tip." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">White tail antler: one beam, tines rise</text><path d="M300 262 C 300 215 282 172 232 146 C 192 126 142 128 98 146" fill="none" stroke="#6b4f35" stroke-width="9" stroke-linecap="round"/><path d="M297 222 l-14 -40" stroke="#6b4f35" stroke-width="7" stroke-linecap="round"/><path d="M252 158 l-3 -62" stroke="#6b4f35" stroke-width="7" stroke-linecap="round"/><path d="M204 134 l-3 -66" stroke="#6b4f35" stroke-width="7" stroke-linecap="round"/><path d="M156 132 l-3 -52" stroke="#6b4f35" stroke-width="7" stroke-linecap="round"/><ellipse cx="305" cy="270" rx="22" ry="9" fill="#c9b79c" stroke="#23261f" stroke-width="1.5"/><text x="330" y="290" font-size="14" fill="#23261f" text-anchor="middle">Base (burr)</text><text x="312" y="190" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">Brow tine</text><text x="312" y="208" font-size="14" fill="#e8590c" text-anchor="start">(G1)</text><text x="264" y="100" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">G2</text><text x="214" y="74" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">G3</text><text x="166" y="88" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">G4</text><text x="20" y="104" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Main beam</text><text x="20" y="122" font-size="14" fill="#23261f" text-anchor="start">sweeps forward</text><rect x="16" y="196" width="196" height="88" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="26" y="218" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Count the points:</text><text x="26" y="238" font-size="14" fill="#23261f" text-anchor="start">tines 2.5 cm (1 in) or</text><text x="26" y="256" font-size="14" fill="#23261f" text-anchor="start">longer, plus beam tip</text><text x="26" y="274" font-size="14" fill="#6b4f35" text-anchor="start">(hunter scoring, Tip)</text>
</svg>
