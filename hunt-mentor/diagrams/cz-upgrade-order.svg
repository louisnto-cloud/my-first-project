<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 338" font-family="sans-serif" role="img" aria-label="Upgrade order for the CZ 457, cheapest wins first: 1 an ammunition test with 3 or 4 kinds; 2 a rimfire scope and 11 mm rings, from about 260 dollars; 3 a sling on the factory swivels, 30 to 45 dollars; 4 a spare 10 round magazine, 16 to 80 dollars; 5 a hard case and lock for transport and storage, price to be checked. Canadian prices, entry tier, checked 2026-10-23."><rect x="0" y="0" width="400" height="338" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Upgrade in this order</text><rect x="14" y="44" width="372" height="44" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="36" cy="66" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="36" y="71" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><text x="58" y="63" font-size="15" font-weight="bold" text-anchor="start" fill="#17201A">Ammo test</text><text x="58" y="81" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">3 or 4 kinds, a box each</text><text x="374" y="72" font-size="14" font-weight="bold" text-anchor="end" fill="#1F3D2B">Tip</text><rect x="14" y="96" width="372" height="44" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="36" cy="118" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="36" y="123" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text><text x="58" y="115" font-size="15" font-weight="bold" text-anchor="start" fill="#17201A">Scope and rings</text><text x="58" y="133" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Rimfire scope, 11 mm rings</text><text x="374" y="124" font-size="14" font-weight="bold" text-anchor="end" fill="#1F3D2B">$260+</text><rect x="14" y="148" width="372" height="44" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="36" cy="170" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="36" y="175" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text><text x="58" y="167" font-size="15" font-weight="bold" text-anchor="start" fill="#17201A">Sling</text><text x="58" y="185" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">On the factory swivels</text><text x="374" y="176" font-size="14" font-weight="bold" text-anchor="end" fill="#1F3D2B">$30 to $45</text><rect x="14" y="200" width="372" height="44" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="36" cy="222" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="36" y="227" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4</text><text x="58" y="219" font-size="15" font-weight="bold" text-anchor="start" fill="#17201A">Spare magazine</text><text x="58" y="237" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">10 round steel or polymer</text><text x="374" y="228" font-size="14" font-weight="bold" text-anchor="end" fill="#1F3D2B">$16 to $80</text><rect x="14" y="252" width="372" height="44" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="36" cy="274" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="36" y="279" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">5</text><text x="58" y="271" font-size="15" font-weight="bold" text-anchor="start" fill="#17201A">Hard case, lock</text><text x="58" y="289" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Transport and storage law</text><text x="374" y="280" font-size="14" font-weight="bold" text-anchor="end" fill="#1F3D2B">VERIFY</text><text x="16" y="326" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Prices CAD, entry tier, checked 2026-10-23 (65%).</text></svg>
