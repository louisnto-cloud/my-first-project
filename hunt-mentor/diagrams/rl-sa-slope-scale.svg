<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four slope lines drawn from one corner: 10 degrees is 18 percent, 20 degrees is 36 percent, 30 degrees is 58 percent, 45 degrees is 100 percent. Caption: 45 degrees is 100 percent, 1 m up for 1 m along.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Degrees and percent</text><path d="M30 260 H390" stroke="#2f3a2b" stroke-width="2"/><path d="M30 260 L355 203" stroke="#8a9a6b" stroke-width="5" stroke-linecap="round"/><text x="350.98655849402866" y="194.69610136991298" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">10° = 18%</text><path d="M30 260 L340 147" stroke="#f2c70c" stroke-width="5" stroke-linecap="round"/><text x="336.0985648593498" y="139.13335270252932" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">20° = 36%</text><path d="M30 260 L316 95" stroke="#e03131" stroke-width="5" stroke-linecap="round"/><text x="311.78838324886476" y="87.00000000000003" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">30° = 58%</text><path d="M30 260 L240 50" stroke="#8e44d6" stroke-width="5" stroke-linecap="round"/><text x="236.00000000000003" y="42" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">45° = 100%</text><text x="200" y="292" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">45 degrees is 100 percent: 1 m up for 1 m along</text>
</svg>
