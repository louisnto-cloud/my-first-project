<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 299" role="img" aria-label="Grid: Region 2 deer bag limits. Black tailed deer a licence year: 2. Of those, antlerless at most: 1. White tailed deer: 0. Bowen and Texada islands: 3(2): 3. Buck, 2-5 and 2-12, Sept 10 to Nov 30: 1. Province wide, never more deer a year: 3." font-family="sans-serif">
<rect x="0" y="0" width="400" height="299" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Region 2 deer bag limits</text>
<text x="200" y="47" font-size="14" fill="#8b5a2b" text-anchor="middle">Pages 14, 27 and 28</text>
<rect x="6.0" y="69" width="124.0" height="106" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<text x="68.0" y="103" font-size="26" font-weight="bold" fill="#e8590c" text-anchor="middle">2</text>
<text x="68.0" y="127" font-size="14" fill="#23261f" text-anchor="middle">Black tailed</text>
<text x="68.0" y="145" font-size="14" fill="#23261f" text-anchor="middle">deer a licence</text>
<text x="68.0" y="163" font-size="14" fill="#23261f" text-anchor="middle">year</text>
<rect x="138.0" y="69" width="124.0" height="106" rx="9" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
<text x="200.0" y="103" font-size="26" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1</text>
<text x="200.0" y="127" font-size="14" fill="#23261f" text-anchor="middle">Of those,</text>
<text x="200.0" y="145" font-size="14" fill="#23261f" text-anchor="middle">antlerless at</text>
<text x="200.0" y="163" font-size="14" fill="#23261f" text-anchor="middle">most</text>
<rect x="270.0" y="69" width="124.0" height="106" rx="9" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<text x="332.0" y="103" font-size="26" font-weight="bold" fill="#c92a2a" text-anchor="middle">0</text>
<text x="332.0" y="127" font-size="14" fill="#23261f" text-anchor="middle">White tailed</text>
<text x="332.0" y="145" font-size="14" fill="#23261f" text-anchor="middle">deer</text>
<rect x="6.0" y="183" width="124.0" height="106" rx="9" fill="#ffffff" stroke="#8b5a2b" stroke-width="2.5"/>
<text x="68.0" y="217" font-size="26" font-weight="bold" fill="#8b5a2b" text-anchor="middle">3</text>
<text x="68.0" y="241" font-size="14" fill="#23261f" text-anchor="middle">Bowen and</text>
<text x="68.0" y="259" font-size="14" fill="#23261f" text-anchor="middle">Texada islands:</text>
<text x="68.0" y="277" font-size="14" fill="#23261f" text-anchor="middle">3(2)</text>
<rect x="138.0" y="183" width="124.0" height="106" rx="9" fill="#ffffff" stroke="#8b5a2b" stroke-width="2.5"/>
<text x="200.0" y="217" font-size="26" font-weight="bold" fill="#8b5a2b" text-anchor="middle">1</text>
<text x="200.0" y="241" font-size="14" fill="#23261f" text-anchor="middle">Buck, 2-5 and</text>
<text x="200.0" y="259" font-size="14" fill="#23261f" text-anchor="middle">2-12, Sept 10</text>
<text x="200.0" y="277" font-size="14" fill="#23261f" text-anchor="middle">to Nov 30</text>
<rect x="270.0" y="183" width="124.0" height="106" rx="9" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<text x="332.0" y="217" font-size="26" font-weight="bold" fill="#c92a2a" text-anchor="middle">3</text>
<text x="332.0" y="241" font-size="14" fill="#23261f" text-anchor="middle">Province wide,</text>
<text x="332.0" y="259" font-size="14" fill="#23261f" text-anchor="middle">never more deer</text>
<text x="332.0" y="277" font-size="14" fill="#23261f" text-anchor="middle">a year</text>
</svg>
