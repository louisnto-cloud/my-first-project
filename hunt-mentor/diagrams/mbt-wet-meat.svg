<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 322" font-family="sans-serif" role="img" aria-label="Meat in the rain. Quarters hang in game bags under a tarp set as a roof with an air gap, off the ground with air all around. Wipe meat dry with clean towels and get it below 4 degrees Celsius fast. No plastic on warm meat.">
<rect width="400" height="322" fill="#EEF1EA"/>
<text x="200" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Keep meat cool, clean and dry</text>
<path d="M40 84 L200 64 L360 84 L360 90 L200 70 L40 90 Z" fill="#5b7fa6" stroke="#1F3D2B" stroke-width="1"/><line x1="120" y1="76" x2="120" y2="110" stroke="#17201A" stroke-width="2"/><line x1="280" y1="76" x2="280" y2="110" stroke="#17201A" stroke-width="2"/><rect x="94" y="110" width="52" height="110" rx="14" fill="#f4efe2" stroke="#8a9a6b" stroke-width="2"/><rect x="254" y="110" width="52" height="110" rx="14" fill="#f4efe2" stroke="#8a9a6b" stroke-width="2"/><g data-tip="Tarp roof|A tarp as a roof, with an air gap. Never wrapped (80%)." data-tip-dot="200,66"><text x="200" y="56" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Tarp as a roof, air gap</text></g><g data-tip="Game bags|Game bags, not plastic. No plastic or tarps on meat before it is chilled (80%)." data-tip-dot="280,190"><text x="200" y="150" font-size="15" text-anchor="middle" font-weight="bold" fill="#17201A">Game bags,</text><text x="200" y="170" font-size="15" text-anchor="middle" font-weight="bold" fill="#17201A">not plastic</text></g><line x1="30" y1="236" x2="370" y2="236" stroke="#8b5a2b" stroke-width="3"/><text x="200" y="256" font-size="14" text-anchor="middle" font-weight="bold" fill="#17201A">Off the ground, air all around</text><g data-tip="Cool fast|Get meat below 4 °C (40 °F) as fast as you can (80%)." data-tip-dot="96,279"><text x="200" y="284" font-size="15" text-anchor="middle" font-weight="bold" fill="#FF6A13">Below 4 °C (40 °F) fast</text></g><text x="200" y="308" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Wipe dry with clean towels (80%)</text>
</svg>
