<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 288" font-family="sans-serif" role="img" aria-label="Comparison. Cougar: stalks, little chase, bites neck and head, drags to cover, covers the kill neatly, eats organs first, tidy. Wolf: chases, bites hindquarters and flanks, feeds at the kill, cracks big bones, messy. Bear: short charge, bites spine, head and neck, rakes dirt over the kill, ground torn up. Coyote: throat bites, smaller bones broken, small prey.">
<rect x="0" y="0" width="400" height="288" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Who killed it?</text>
<text x="200" y="50" font-size="14" fill="#6b4f35" text-anchor="middle">Livestock investigation guide (85%)</text>
<text x="20" y="76" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start"></text><text x="120" y="76" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Attack</text><text x="260" y="76" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Site</text><rect x="8" y="86" width="384" height="44" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="113.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Cougar</text><text x="120" y="101" font-size="14" fill="#23261f" text-anchor="start">neck, head</text><text x="120" y="117" font-size="14" fill="#23261f" text-anchor="start">little chase</text><text x="260" y="101" font-size="14" fill="#23261f" text-anchor="start">drag, covered</text><text x="260" y="117" font-size="14" fill="#23261f" text-anchor="start">tidy</text><rect x="8" y="134" width="384" height="44" rx="6" fill="#f3f1e6" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="161.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Wolf</text><text x="120" y="149" font-size="14" fill="#23261f" text-anchor="start">rear, flanks</text><text x="120" y="165" font-size="14" fill="#23261f" text-anchor="start">long chase</text><text x="260" y="149" font-size="14" fill="#23261f" text-anchor="start">at kill, messy</text><text x="260" y="165" font-size="14" fill="#23261f" text-anchor="start">bones cracked</text><rect x="8" y="182" width="384" height="44" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="209.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Bear</text><text x="120" y="197" font-size="14" fill="#23261f" text-anchor="start">spine, head</text><text x="120" y="213" font-size="14" fill="#23261f" text-anchor="start">short charge</text><text x="260" y="197" font-size="14" fill="#23261f" text-anchor="start">raked mound</text><text x="260" y="213" font-size="14" fill="#23261f" text-anchor="start">ground torn</text><rect x="8" y="230" width="384" height="44" rx="6" fill="#f3f1e6" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="257.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Coyote</text><text x="120" y="245" font-size="14" fill="#23261f" text-anchor="start">throat</text><text x="120" y="261" font-size="14" fill="#23261f" text-anchor="start">small prey</text><text x="260" y="245" font-size="14" fill="#23261f" text-anchor="start">at kill</text><text x="260" y="261" font-size="14" fill="#23261f" text-anchor="start">small bones</text>
</svg>
