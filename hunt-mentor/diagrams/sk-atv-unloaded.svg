<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="An all terrain vehicle with a cased rifle and the magazine removed. Chamber empty and magazine off before you touch the ATV. A round in the chamber or in an attached magazine counts as loaded.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">Rifle and ATV: unloaded, every time</text><g transform="translate(160 168)"><circle cx="-60" cy="40" r="26" fill="#2f3a2b"/><circle cx="60" cy="40" r="26" fill="#2f3a2b"/><circle cx="-60" cy="40" r="10" fill="#9a9a8a"/><circle cx="60" cy="40" r="10" fill="#9a9a8a"/><path d="M-96 18 L-70 -4 L70 -4 L98 18 L90 30 L-90 30 Z" fill="#4a7fb0" stroke="#23261f" stroke-width="2.5"/><rect x="-14" y="-16" width="44" height="14" rx="5" fill="#23261f"/><path d="M-56 -4 L-50 -32 M-62 -32 L-38 -32" stroke="#23261f" stroke-width="4" stroke-linecap="round"/><rect x="-100" y="-12" width="44" height="8" fill="none" stroke="#23261f" stroke-width="2.5"/><rect x="56" y="-12" width="44" height="8" fill="none" stroke="#23261f" stroke-width="2.5"/></g><rect x="220" y="62" width="150" height="24" rx="10" fill="#6b4f35" stroke="#23261f" stroke-width="2"/><text x="295" y="79" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">cased rifle</text><rect x="250" y="102" width="26" height="34" rx="3" fill="#9a9a8a" stroke="#23261f" stroke-width="2"/><text x="286" y="118" font-size="14" font-weight="bold" fill="#23261f">magazine</text><text x="286" y="134" font-size="14" font-weight="bold" fill="#23261f">out</text><text x="20" y="60" font-size="15" font-weight="bold" fill="#2e7d32">Chamber empty,</text><text x="20" y="78" font-size="15" font-weight="bold" fill="#2e7d32">magazine off</text><text x="20" y="100" font-size="14" fill="#23261f">before you touch the ATV</text><text x="200" y="266" font-size="14" font-weight="bold" text-anchor="middle" fill="#b3261e">Loaded = round in the chamber</text><text x="200" y="284" font-size="14" font-weight="bold" text-anchor="middle" fill="#b3261e">or in an attached magazine</text>
</svg>
