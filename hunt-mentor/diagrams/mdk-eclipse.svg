<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Timeline June to December. June to mid September: drakes in eclipse plumage look like hens. Mid September to mid November: colour comes back. From mid November: full colour; about 90 percent of mallard drakes in a California study were in full colour by mid November, 75 percent. The wing patch stays the same all season, 80 percent. An early season brown drake: read the wing, the bill and the size, not the head."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Drake colour: summer to winter</text><text x="45.5" y="60" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Jun</text><text x="96.5" y="60" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Jul</text><text x="147.5" y="60" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Aug</text><text x="198.5" y="60" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Sep</text><text x="249.5" y="60" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Oct</text><text x="300.5" y="60" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Nov</text><text x="351.5" y="60" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Dec</text><defs><linearGradient id="mdk-eclipse-g" x1="0" x2="1"><stop offset="0" stop-color="#8b5a2b"/><stop offset="1" stop-color="#2f6e3b"/></linearGradient></defs><rect x="20" y="72" width="178.5" height="40" rx="6" fill="#8b5a2b"/><text x="109.25" y="98" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Eclipse: looks like a hen</text><rect x="198.5" y="72" width="102" height="40" rx="0" fill="url(#mdk-eclipse-g)"/><text x="249.5" y="98" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Colour back</text><rect x="300.5" y="72" width="76.5" height="40" rx="6" fill="#2f6e3b"/><text x="338.75" y="98" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Full</text><line x1="300.5" y1="118" x2="300.5" y2="150" stroke="#e8590c" stroke-width="3" fill="none"/><text x="250" y="168" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">90% of mallard drakes in colour</text><text x="250" y="186" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">by mid November (75%)</text><rect x="10" y="204" width="380" height="84" rx="8" fill="#dfe6d3"/><text x="200" y="230" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Wing patch: the same all season (80%)</text><text x="200" y="254" font-size="14" fill="#2f3a2b" text-anchor="middle">Early season brown drake? Read the wing,</text><text x="200" y="274" font-size="14" fill="#2f3a2b" text-anchor="middle">the bill and the size. Not the head.</text></svg>
