<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Flowchart after you find an animal in your binoculars: 1 freeze and keep eyes on it; 2 pick two landmarks near it; 3 judge with the scope whether it is legal; 4 watch where it beds; 5 plan wind, cover and route. Then move, not before.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Found one: now what?</text><rect x="60" y="44" width="280" height="38" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="84" cy="63" r="13" fill="#e8590c"/><text x="84" y="68" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">1</text><text x="106" y="69" font-size="15" fill="#23261f" text-anchor="start">Freeze. Eyes on it</text><line x1="200" y1="82" x2="200" y2="92" stroke="#e8590c" stroke-width="2"/><polygon points="200.0,92.0 195.7,83.0 204.3,83.0" fill="#e8590c"/><rect x="60" y="92" width="280" height="38" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="84" cy="111" r="13" fill="#e8590c"/><text x="84" y="116" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">2</text><text x="106" y="117" font-size="15" fill="#23261f" text-anchor="start">Pick 2 landmarks</text><line x1="200" y1="130" x2="200" y2="140" stroke="#e8590c" stroke-width="2"/><polygon points="200.0,140.0 195.7,131.0 204.3,131.0" fill="#e8590c"/><rect x="60" y="140" width="280" height="38" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="84" cy="159" r="13" fill="#e8590c"/><text x="84" y="164" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">3</text><text x="106" y="165" font-size="15" fill="#23261f" text-anchor="start">Judge: legal?</text><line x1="200" y1="178" x2="200" y2="188" stroke="#e8590c" stroke-width="2"/><polygon points="200.0,188.0 195.7,179.0 204.3,179.0" fill="#e8590c"/><rect x="60" y="188" width="280" height="38" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="84" cy="207" r="13" fill="#e8590c"/><text x="84" y="212" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">4</text><text x="106" y="213" font-size="15" fill="#23261f" text-anchor="start">Watch where it beds</text><line x1="200" y1="226" x2="200" y2="236" stroke="#e8590c" stroke-width="2"/><polygon points="200.0,236.0 195.7,227.0 204.3,227.0" fill="#e8590c"/><rect x="60" y="236" width="280" height="38" rx="8" fill="#f6d7c3" stroke="#8a9a6b" stroke-width="2"/><circle cx="84" cy="255" r="13" fill="#e8590c"/><text x="84" y="260" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">5</text><text x="106" y="261" font-size="15" fill="#23261f" text-anchor="start">Plan wind, cover, route</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Then move. Not before (Tip)</text>
</svg>
