<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="sans-serif" role="img" aria-label="Required kit on a motor boat up to 6 metres, as a 3 by 3 grid: a PFD for each person, a heaving line of 15 metres, a reboarding ladder, a watertight flashlight or 3 flares, paddle or anchor with 15 metres of line, a bailer or pump, a whistle or horn, navigation lights in the dark, and a compass unless seamarks are in sight.">
  <rect width="400" height="330" fill="#fffaf0"/>
  <g fill="#dfe6d3" stroke="#8a9a6b" stroke-width="1.5">
    <rect x="8" y="8" width="124" height="100" rx="8"/><rect x="138" y="8" width="124" height="100" rx="8"/><rect x="268" y="8" width="124" height="100" rx="8"/>
    <rect x="8" y="114" width="124" height="100" rx="8"/><rect x="138" y="114" width="124" height="100" rx="8"/><rect x="268" y="114" width="124" height="100" rx="8"/>
    <rect x="8" y="220" width="124" height="100" rx="8"/><rect x="138" y="220" width="124" height="100" rx="8"/><rect x="268" y="220" width="124" height="100" rx="8"/>
  </g>
  <path d="M50 20 L90 20 L96 70 L44 70 Z" fill="#e8590c"/><line x1="70" y1="20" x2="70" y2="70" stroke="#2f3a2b" stroke-width="2"/>
  <circle cx="200" cy="45" r="24" fill="none" stroke="#e3b23c" stroke-width="7"/>
  <g stroke="#2f3a2b" stroke-width="4"><line x1="316" y1="20" x2="316" y2="72"/><line x1="344" y1="20" x2="344" y2="72"/><line x1="316" y1="32" x2="344" y2="32"/><line x1="316" y1="48" x2="344" y2="48"/><line x1="316" y1="64" x2="344" y2="64"/></g>
  <rect x="50" y="134" width="40" height="22" rx="4" fill="#2f3a2b"/><path d="M90 136 L110 128 L110 162 L90 154 Z" fill="#ffd34d"/>
  <path d="M175 128 L225 176" stroke="#6b4f35" stroke-width="7" stroke-linecap="round"/><ellipse cx="226" cy="178" rx="9" ry="14" fill="#6b4f35" transform="rotate(-45 226 178)"/>
  <path d="M306 134 L354 134 L346 172 L314 172 Z" fill="#4a7fb0"/><rect x="350" y="138" width="16" height="6" fill="#4a7fb0"/>
  <path d="M48 246 L86 246 L94 262 L48 266 Z" fill="#2f3a2b"/><circle cx="56" cy="256" r="5" fill="#dfe6d3"/>
  <circle cx="186" cy="254" r="10" fill="#c0392b"/><circle cx="214" cy="254" r="10" fill="#2f6e3b"/>
  <circle cx="330" cy="256" r="22" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/><polygon points="330,238 324,256 336,256" fill="#c0392b"/>
  <g font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">
    <text x="70" y="90">PFD each</text><text x="200" y="90">Line 15 m</text><text x="330" y="90">Reboard ladder</text>
    <text x="70" y="196">Flashlight</text><text x="200" y="196">Paddle, anchor</text><text x="330" y="196">Bailer, pump</text>
    <text x="70" y="302">Whistle, horn</text><text x="200" y="302">Lights in dark</text><text x="330" y="302">Compass</text>
