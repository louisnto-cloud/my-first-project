<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 344" role="img" aria-label="Four vehicle closure cards for Region 1. Parksville Qualicum Beach Wildlife Management Area, Management Unit 1-5, Map A16: no motor vehicles all year. Willow Creek, 1-6, Map A17: no motor vehicles all year. Block 1392 on Green Mountain, 1-5: no motor vehicles all year, to protect Vancouver Island marmot habitat. Nanaimo River Camp, Zone B of 1-5, Map A12: no all terrain vehicle or snowmobile, 1 September to 31 December." font-family="sans-serif">
