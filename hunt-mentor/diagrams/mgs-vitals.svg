<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side view of a goose with three zones. Head and neck, shaded orange: the aim point on close decoying birds, a Tip. Heart and lungs in the front of the body, 80 percent. The rear gut area grey: hits there make cripples. Use steel BB, birds feet down, inside 35 metres, 38 yards, a Tip.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Where a pellet kills a goose</text><g transform="translate(-10 10)"><path d="M60 170 Q40 150 70 125 Q110 100 190 105 L250 100 Q262 60 285 40 Q300 30 318 38 L340 44 L318 50 Q300 50 292 70 Q282 100 290 130 Q300 175 250 195 Q180 215 110 205 Q75 198 60 170Z" fill="#efe6d6" stroke="#2f3a2b" stroke-width="2"/></g><path d="M250 112 Q262 70 285 50 Q300 40 318 48 L340 54 L318 60 Q300 60 292 80 Q282 110 290 140" fill="none" stroke="#e8590c" stroke-width="18" opacity=".35"/><ellipse cx="225" cy="148" rx="45" ry="32" fill="#e8590c" opacity=".45"/><ellipse cx="120" cy="170" rx="55" ry="30" fill="#9e9e9e" opacity=".35"/><text x="330" y="96" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Head and neck</text><text x="330" y="112" font-size="14" fill="#23261f" text-anchor="middle">(Tip: aim here)</text><text x="225" y="150" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Heart, lungs</text><text x="225" y="166" font-size="14" fill="#23261f" text-anchor="middle">(80%)</text><text x="115" y="172" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Gut: cripples</text><rect x="20" y="232" width="360" height="60" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="254" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Steel BB, feet down, inside 35 m (38 yd)</text><text x="200" y="276" font-size="14" fill="#23261f" text-anchor="middle">(Tip, from the quick lesson)</text>
</svg>
