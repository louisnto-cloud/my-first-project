<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 488" font-family="sans-serif" role="img" aria-label="Trajectory sketch for a .308 Winchester, 150 grain bullet, zeroed at 100 yards. Approximate, with the drop exaggerated to show the shape. The dashed line of sight runs straight from the scope; the bullet path starts below it, meets it at the zero, 91 m (100 yd), then falls away: about 10 cm low at 183 m (200 yd) and about 37 cm low at 274 m (300 yd). Source: Federal Power Shok 150 grain at 2,820 feet per second from a factory test barrel. Your 20 inch barrel is slower, so expect more drop. Confirm on paper.">
