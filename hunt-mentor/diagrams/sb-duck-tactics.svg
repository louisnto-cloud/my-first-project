  <text x="299" y="54" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">B: Jump a creek</text>
  <path d="M210 96 Q260 60 300 84 T390 70" stroke="#4a7fb0" stroke-width="10" fill="none"/><g transform="translate(250 108) scale(1.0)"><circle r="9" fill="#e8590c"/></g><g transform="translate(330 112) scale(0.6)"><ellipse rx="18" ry="5" fill="#8b5a2b"/><circle cx="18" cy="-1" r="4.5" fill="#8b5a2b"/><path d="M8 -3 Q2 -20.0 -10 -32.0 Q-8 -16.0 -8 -3Z" fill="#8b5a2b"/><path d="M8 3 Q2 20.0 -10 32.0 Q-8 16.0 -8 3Z" fill="#8b5a2b"/><path d="M-16 0 L-26 -5 L-26 5Z" fill="#8b5a2b"/></g>
