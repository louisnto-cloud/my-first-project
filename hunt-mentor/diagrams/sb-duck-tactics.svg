<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 366" font-family="sans-serif" role="img" aria-label="Four ways to hunt ducks as a 2 by 2 grid. A, decoys on a pond: close birds, best identification, best for a beginner, starred. B, jump shooting a creek: no gear, fast shots, sneak in from downwind, starred. C, dry field over decoys: big flocks, dry feet, needs permission. D, pass shooting a flight line: long shots and cripples, skip it this year. My lean, Tip: A or B where you can fetch the bird.">
  <rect width="400" height="366" fill="#fffaf0"/>
