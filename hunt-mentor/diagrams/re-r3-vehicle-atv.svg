<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 438" font-family="sans-serif" role="img" aria-label="ATV and snowmobile closures in Region 3, synopsis page 33. ATV means All Terrain Vehicle. No ATV for hunting 1 September to 10 December in MUs 3-28, 3-29, 3-30 and the Map C3 part of 3-17. No snowmobile for hunting in 3-45 and 3-46 year round, and in 3-28 from 1 April to 14 December; trappers exempt. Stake Lake ski trails: no vehicles, motorbikes, ATVs or snowmobiles, all year. Caribou snowmobile closures: about 1 million hectares, maps online only.">
