<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 311" role="img" aria-label="Cards: ATV and snowmobile closures. No ATV for hunting: Sept 1 to Dec 10: MUs 3-28, 3-29, 3-30, and the Map C3 part of 3-17. No snowmobile for hunting: 3-45, 3-46 year round. 3-28: Apr 1 to Dec 14. Trappers exempt. Stake Lake ski trails: No vehicles, motorbikes, ATVs or snowmobiles, all year. Caribou snowmobile closures: About 1 million hectares. Maps online only." font-family="sans-serif">
