<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A choke tube in cross section. The inside narrows near the muzzle. Cylinder has no squeeze, improved cylinder a little, modified more, full the most. Notches on the rim tell you which one is fitted.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">What a choke does</text>
<rect x="20" y="80" width="250" height="80" fill="#3b4045"/>
<rect x="20" y="92" width="250" height="56" fill="#cfd5d8"/>
<path d="M270 80 L380 80 L380 160 L270 160 Z" fill="#a7aeb3" stroke="#17201A"/>
<path d="M270 92 L310 92 L345 102 L380 102 L380 138 L345 138 L310 148 L270 148 Z" fill="#e7ebed" stroke="#17201A"/>
<line x1="110.0" y1="72.0" x2="110.0" y2="92.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="110.0" cy="92.0" r="3" fill="#1F3D2B"/><rect x="86.9" y="49.0" width="46.2" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="110.0" y="66.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">bore</text>
<line x1="330.0" y1="72.0" x2="330.0" y2="80.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="330.0" cy="80.0" r="3" fill="#1F3D2B"/><rect x="283.3" y="49.0" width="93.3" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="330.0" y="66.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">choke tube</text>
<line x1="345.0" y1="170.0" x2="345.0" y2="138.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="345.0" cy="138.0" r="3" fill="#1F3D2B"/><rect x="279.1" y="169.0" width="101.9" height="23.0" rx="5" fill="#ffffff" stroke="#FF6A13" stroke-width="1.3"/><text x="330.0" y="186.0" font-size="14" font-weight="bold" fill="#FF6A13" text-anchor="middle">the squeeze</text>
<text x="30.0" y="214.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Cylinder</text>
<text x="250.0" y="214.0" font-size="14" fill="#17201A" text-anchor="start">0</text>
<text x="30.0" y="233.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Improved cylinder</text>
<text x="250.0" y="233.0" font-size="14" fill="#17201A" text-anchor="start">.010 in</text>
<text x="30.0" y="252.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Modified</text>
<text x="250.0" y="252.0" font-size="14" fill="#17201A" text-anchor="start">.020 in</text>
<text x="30.0" y="271.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Full</text>
<text x="250.0" y="271.0" font-size="14" fill="#17201A" text-anchor="start">.030 in</text>
<text x="200.0" y="294.0" font-size="13" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Typical squeeze. Makers differ.</text>
</svg>
