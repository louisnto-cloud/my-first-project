<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Signs the snow is unstable: recent avalanches especially in the last 48 hours, whumpfs where the snow collapses, shooting cracks running from your feet, hollow drum sounds, avalanches triggered from a distance, and heavy new snow, wind or warming. No signs does not mean safe.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Signs the snow is unstable</text><rect x="8" y="48" width="124" height="80" rx="10" fill="#fff3d6" stroke="#e8590c" stroke-width="2"/><text x="70" y="82" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Recent slides</text><text x="70" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">last 48 hours</text><rect x="137" y="48" width="124" height="80" rx="10" fill="#fff3d6" stroke="#e8590c" stroke-width="2"/><text x="199" y="82" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Whumpf</text><text x="199" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">snow collapses</text><rect x="266" y="48" width="124" height="80" rx="10" fill="#fff3d6" stroke="#e8590c" stroke-width="2"/><text x="328" y="82" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Shooting cracks</text><text x="328" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">from your feet</text><rect x="8" y="144" width="124" height="80" rx="10" fill="#fff3d6" stroke="#e8590c" stroke-width="2"/><text x="70" y="178" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hollow sound</text><text x="70" y="200" font-size="14" fill="#2f3a2b" text-anchor="middle">drum under you</text><rect x="137" y="144" width="124" height="80" rx="10" fill="#fff3d6" stroke="#e8590c" stroke-width="2"/><text x="199" y="178" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Remote trigger</text><text x="199" y="200" font-size="14" fill="#2f3a2b" text-anchor="middle">slides from afar</text><rect x="266" y="144" width="124" height="80" rx="10" fill="#fff3d6" stroke="#e8590c" stroke-width="2"/><text x="328" y="178" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Heavy new snow</text><text x="328" y="200" font-size="14" fill="#2f3a2b" text-anchor="middle">or wind, warming</text><rect x="68" y="254" width="265" height="30" rx="6" fill="#2f3a2b"/><text x="200" y="275" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">No signs does not mean safe</text>
</svg>
