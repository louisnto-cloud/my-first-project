<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 2: tilt the mirror until the bright spot of sunlight falls on your fingers and through the V toward the aircraft. Tip.">
