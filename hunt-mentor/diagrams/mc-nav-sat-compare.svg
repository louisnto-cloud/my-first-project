<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Table of satellite help. iPhone 14 or later: emergency SOS texting with responders, free for 2 years. A satellite messenger such as a Garmin inReach: two way texting, needs a paid plan. A personal locator beacon: SOS only, one way, no plan. Apple 95 percent, Garmin 65 percent, PLB guides 60 percent.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Satellite help: three kinds</text><rect x="20" y="42.0" width="360" height="55.0" rx="4" fill="#2f3a2b"/><text x="28" y="75.0" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">Device</text><text x="178" y="75.0" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">Two way text</text><text x="288" y="75.0" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">Plan</text><rect x="20" y="100.0" width="360" height="55.0" rx="4" fill="#dfe6d3"/><text x="28" y="133.0" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">iPhone 14+ SOS</text><text x="178" y="133.0" font-size="15" fill="#23261f" text-anchor="start">With SOS</text><text x="288" y="133.0" font-size="15" fill="#23261f" text-anchor="start">Free 2 years</text><rect x="20" y="158.0" width="360" height="55.0" rx="4" fill="#eef2e6"/><text x="28" y="191.0" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">inReach type</text><text x="178" y="191.0" font-size="15" fill="#23261f" text-anchor="start">Yes</text><text x="288" y="191.0" font-size="15" fill="#23261f" text-anchor="start">Paid plan</text><rect x="20" y="216.0" width="360" height="55.0" rx="4" fill="#dfe6d3"/><text x="28" y="249.0" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">PLB beacon</text><text x="178" y="249.0" font-size="15" fill="#23261f" text-anchor="start">No, SOS only</text><text x="288" y="249.0" font-size="15" fill="#23261f" text-anchor="start">No plan</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Apple (95%), Garmin (65%), PLB guides (60%)</text>
</svg>
