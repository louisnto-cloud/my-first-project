<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="sans-serif">
  <rect x="0" y="0" width="400" height="440" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Four layers, inside to outside</text>
  <!-- body -->
  <rect x="20" y="50" width="40" height="370" rx="8" fill="#6b4f35" fill-opacity="0.3" stroke="#23261f" stroke-width="2"/>
  <text x="40" y="240" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold" transform="rotate(-90 40 240)">Skin</text>
  <!-- layers -->
  <rect x="64" y="50" width="22" height="370" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/>
  <rect x="90" y="50" width="30" height="370" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2"/>
  <rect x="124" y="50" width="44" height="370" fill="#6b4f35" stroke="#23261f" stroke-width="2"/>
  <rect x="172" y="50" width="20" height="370" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/>
  <!-- labels -->
  <text x="206" y="80" font-size="16" font-weight="bold" fill="#23261f">1. Base</text>
  <text x="206" y="100" font-size="14" fill="#23261f">Thin wool or synthetic.</text>
  <text x="206" y="118" font-size="14" fill="#23261f">Moves sweat off skin.</text>
  <line x1="75" y1="90" x2="200" y2="90" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="206" y="170" font-size="16" font-weight="bold" fill="#23261f">2. Mid</text>
  <text x="206" y="190" font-size="14" fill="#23261f">Fleece or wool.</text>
  <text x="206" y="208" font-size="14" fill="#23261f">Warm while walking.</text>
  <line x1="105" y1="180" x2="200" y2="180" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="206" y="260" font-size="16" font-weight="bold" fill="#23261f">3. Insulation</text>
  <text x="206" y="280" font-size="14" fill="#23261f">Puffy jacket.</text>
  <text x="206" y="298" font-size="14" fill="#23261f">On when you sit still.</text>
  <line x1="146" y1="270" x2="200" y2="270" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="206" y="350" font-size="16" font-weight="bold" fill="#23261f">4. Shell</text>
  <text x="206" y="370" font-size="14" fill="#23261f">Blocks wind and rain.</text>
  <text x="206" y="388" font-size="14" fill="#23261f">Waterproof for Mission.</text>
  <line x1="182" y1="360" x2="200" y2="360" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="296" y="432" font-size="14" fill="#23261f" text-anchor="middle">No cotton in any layer.</text>
</svg>
