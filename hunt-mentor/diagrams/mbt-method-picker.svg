<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 325" font-family="sans-serif" role="img" aria-label="Three ways to hunt black tailed deer. 1 still hunt the timber: slow, quiet, short shots, best on wet quiet days. 2 watch a cutblock edge at first and last light; cold sitting, keep layers. 3 partner walk to a stander, on foot only; agree zones of fire. Pick by weather and ground.">
<rect width="400" height="325" fill="#EEF1EA"/>
<text x="200" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Three ways to hunt them</text>
<rect x="14" y="48" width="372" height="72" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="38" cy="72" r="13" fill="#1F3D2B" stroke="none"/><text x="38" y="77" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text><text x="62" y="76" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Still hunt the timber</text><text x="62" y="98" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">+ Slow, quiet, short shots</text><text x="62" y="116" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">Watch: Best on wet, quiet days</text><rect x="14" y="130" width="372" height="72" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="38" cy="154" r="13" fill="#1F3D2B" stroke="none"/><text x="38" y="159" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text><text x="62" y="158" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Watch a cutblock edge</text><text x="62" y="180" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">+ First and last light</text><text x="62" y="198" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">Watch: Cold sitting; keep layers</text><rect x="14" y="212" width="372" height="72" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="38" cy="236" r="13" fill="#1F3D2B" stroke="none"/><text x="38" y="241" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text><text x="62" y="240" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Partner walk to a stander</text><text x="62" y="262" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">+ On foot only (99%)</text><text x="62" y="280" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">Watch: Agree zones of fire</text><text x="200" y="310" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Pick by weather and ground (Tip)</text>
</svg>
