<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif" role="img" aria-label="Six black bear rules from synopsis page 11, all unlawful. Hunting a black bear under 2 years old, or any bear in its company. Hunting the white or blue colour phase. Hunting bears with bait or a dead animal as bait. Intentionally feeding bears. Leaving the edible meat behind. Trafficking in bear galls, or paws separated from the carcass or hide. And there is no open season on grizzly bears.">
<rect x="0" y="0" width="400" height="320" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Black bear rules (page 11)</text><rect x="8" y="40" width="188" height="78" rx="8" fill="#fffaf0" stroke="#c92a2a" stroke-width="1.5"/><circle cx="42" cy="79" r="22" fill="none" stroke="#c92a2a" stroke-width="4"/><line x1="26" y1="95" x2="58" y2="63" stroke="#c92a2a" stroke-width="4"/><text x="74" y="74" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Bear under 2,</text><text x="74" y="94" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">or one with it</text><rect x="204" y="40" width="188" height="78" rx="8" fill="#fffaf0" stroke="#c92a2a" stroke-width="1.5"/><circle cx="238" cy="79" r="22" fill="none" stroke="#c92a2a" stroke-width="4"/><line x1="222" y1="95" x2="254" y2="63" stroke="#c92a2a" stroke-width="4"/><text x="270" y="74" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">White or blue</text><text x="270" y="94" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">colour phase</text><rect x="8" y="126" width="188" height="78" rx="8" fill="#fffaf0" stroke="#c92a2a" stroke-width="1.5"/><circle cx="42" cy="165" r="22" fill="none" stroke="#c92a2a" stroke-width="4"/><line x1="26" y1="181" x2="58" y2="149" stroke="#c92a2a" stroke-width="4"/><text x="74" y="160" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Bait, or a dead</text><text x="74" y="180" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">animal as bait</text><rect x="204" y="126" width="188" height="78" rx="8" fill="#fffaf0" stroke="#c92a2a" stroke-width="1.5"/><circle cx="238" cy="165" r="22" fill="none" stroke="#c92a2a" stroke-width="4"/><line x1="222" y1="181" x2="254" y2="149" stroke="#c92a2a" stroke-width="4"/><text x="270" y="160" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Feeding bears</text><text x="270" y="180" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">on purpose</text><rect x="8" y="212" width="188" height="78" rx="8" fill="#fffaf0" stroke="#c92a2a" stroke-width="1.5"/><circle cx="42" cy="251" r="22" fill="none" stroke="#c92a2a" stroke-width="4"/><line x1="26" y1="267" x2="58" y2="235" stroke="#c92a2a" stroke-width="4"/><text x="74" y="246" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Leaving the meat</text><text x="74" y="266" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">take it out</text><rect x="204" y="212" width="188" height="78" rx="8" fill="#fffaf0" stroke="#c92a2a" stroke-width="1.5"/><circle cx="238" cy="251" r="22" fill="none" stroke="#c92a2a" stroke-width="4"/><line x1="222" y1="267" x2="254" y2="235" stroke="#c92a2a" stroke-width="4"/><text x="270" y="246" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Selling galls</text><text x="270" y="266" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">or loose paws</text><text x="200" y="310" font-size="14" font-weight="bold" fill="#c92a2a" text-anchor="middle">All six are unlawful. Grizzly: no season at all.</text>
</svg>
