<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side view of a slope. A deer beds on a bench in the top third, near trees, with the wind coming from behind and over the ridge so it can smell above and see below.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The classic day bed (Tip)</text>
<path d="M0 270 L120 200 L170 190 L230 150 L260 100 L300 80 L400 70 V300 H0 Z" fill="#cfdcb5"/><g transform="translate(300 82) scale(0.6)"><rect x="-3" y="-10" width="6" height="12" fill="#6b4f35"/><path d="M0 -50 L16 -10 L-16 -10 Z" fill="#8a9a6b"/></g><g transform="translate(330 76) scale(0.5)"><rect x="-3" y="-10" width="6" height="12" fill="#6b4f35"/><path d="M0 -50 L16 -10 L-16 -10 Z" fill="#8a9a6b"/></g><g transform="translate(250 104) scale(0.5)"><rect x="-3" y="-10" width="6" height="12" fill="#6b4f35"/><path d="M0 -50 L16 -10 L-16 -10 Z" fill="#8a9a6b"/></g><ellipse cx="205" cy="168" rx="22" ry="7" fill="#8b5a2b"/><text x="205" y="156" font-size="14" fill="#fff" text-anchor="middle" stroke="#2f3a2b" stroke-width="3" paint-order="stroke">bed</text><line x1="0" y1="167" x2="400" y2="167" stroke="#c9c9b9" stroke-width="1" stroke-dasharray="4 4"/><text x="350" y="186" font-size="14" font-weight="bold" fill="#6b4f35" text-anchor="middle">top third</text><path d="M360 62 Q262 80 236 132" fill="none" stroke="#4a7fb0" stroke-width="3"/><line x1="238" y1="128" x2="226" y2="148" stroke="#4a7fb0" stroke-width="3"/><path d="M226.0 148.0 L226.9 138.0 L234.4 142.5 Z" fill="#4a7fb0"/><text x="335" y="130" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">wind from</text><text x="335" y="147" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">behind</text><line x1="190" y1="172" x2="60" y2="230" stroke="#e8590c" stroke-width="2"/><path d="M60.0 230.0 L66.5 222.4 L70.0 230.3 Z" fill="#e8590c"/><text x="70" y="260" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">view below</text>
