<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A downed deer lying on its side. The hunter comes in from behind its back, the spine side, with the rifle ready, never from the legs side.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">1  Come in from behind its back</text><g transform="translate(200 140)"><g stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"><path d="M-55 22 L-80 56 L-68 60 L-43 26 Z" fill="#6b4f35"/><path d="M-42 22 L-64 56 L-52 60 L-30 26 Z" fill="#6b4f35"/><path d="M48 22 L24 56 L36 60 L60 26 Z" fill="#6b4f35"/><path d="M62 22 L40 56 L52 60 L74 26 Z" fill="#6b4f35"/><path d="M-62 -10 L-98 -44 L-84 -56 L-44 -22 Z" fill="#6b4f35"/><ellipse cx="0" cy="0" rx="85" ry="34" fill="#6b4f35"/><ellipse cx="-106" cy="-50" rx="19" ry="10" fill="#6b4f35"/><path d="M-92 -58 L-82 -74 L-84 -54 Z" fill="#6b4f35"/></g><path d="M-96 -59 L-98 -86 M-98 -74 L-108 -82 M-98 -80 L-88 -92" fill="none" stroke="#6b4f35" stroke-width="3.5" stroke-linecap="round"/></g><path d="M350 66 C 310 60, 262 70, 232 100" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="7 5"/><circle cx="350" cy="66" r="9" fill="#e8590c"/><text x="336" y="50" font-size="14" font-weight="bold" text-anchor="end" fill="#e8590c">You: rifle ready</text><text x="250" y="96" font-size="13" font-weight="bold" text-anchor="end" fill="#2f3a2b">back</text><text x="200" y="250" font-size="14" font-weight="bold" text-anchor="middle" fill="#b3261e">Not from the legs side: a live</text><text x="200" y="268" font-size="14" font-weight="bold" text-anchor="middle" fill="#b3261e">deer can kick or jump up</text><path d="M310 210 L330 230 M330 210 L310 230" stroke="#b3261e" stroke-width="4" stroke-linecap="round"/><text x="200" y="292" font-size="14" text-anchor="middle" fill="#2f3a2b">Watch the chest for breathing (Tip)</text>
</svg>
