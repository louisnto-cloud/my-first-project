<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 351" font-family="sans-serif" role="img" aria-label="Timeline from 1 October to 31 January. Today is 11 October. First hunts are mid to late October. Deer buck seasons close on 10 December. A 12 week plan started today ends about 3 January; weeks 1 to 8 land before 10 December. So start now and peak for the late season and next year. Tip.">
