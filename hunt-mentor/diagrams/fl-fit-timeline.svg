<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Timeline from October to January. Today is 11 October. First hunts mid to late October. Buck seasons run to 10 December. A 12 week plan started today ends about 3 January. So this plan pays off in the late season and next year.">
  <rect x="0" y="0" width="400" height="250" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Your hunts and the 12 week plan</text>
<line x1="20" y1="120" x2="380" y2="120" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/>
<line x1="49.26829268292683" y1="86" x2="49.26829268292683" y2="154" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/>
<circle cx="49.26829268292683" cy="120" r="8" fill="#e8590c" stroke="#ffffff" stroke-width="2"/>
<text x="49.26829268292683" y="78" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="start">Today</text>
<text x="49.26829268292683" y="174" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Oct 11</text>
<line x1="93.17073170731707" y1="64" x2="93.17073170731707" y2="176" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/>
<circle cx="93.17073170731707" cy="120" r="8" fill="#2f3a2b" stroke="#ffffff" stroke-width="2"/>
<text x="93.17073170731707" y="56" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">First hunts</text>
<text x="93.17073170731707" y="196" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">mid to late Oct</text>
<line x1="224.8780487804878" y1="86" x2="224.8780487804878" y2="154" stroke="#6b4f35" stroke-width="3" stroke-linecap="round"/>
<circle cx="224.8780487804878" cy="120" r="8" fill="#6b4f35" stroke="#ffffff" stroke-width="2"/>
<text x="224.8780487804878" y="78" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6b4f35" text-anchor="middle">Bucks close</text>
<text x="224.8780487804878" y="174" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Dec 10</text>
<line x1="295.1219512195122" y1="64" x2="295.1219512195122" y2="176" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/>
<circle cx="295.1219512195122" cy="120" r="8" fill="#e8590c" stroke="#ffffff" stroke-width="2"/>
<text x="295.1219512195122" y="56" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Week 12</text>
<text x="295.1219512195122" y="196" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">about Jan 3</text>
<text x="20" y="236" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">Oct 1</text>
<text x="380" y="236" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="end">Jan 31</text>
</svg>
