<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Why corrosive ammunition rusts: old primers contain chlorate; firing leaves salt; the salt pulls water from the air; rust follows within hours. Water dissolves the salt; oil does not. Clean the same day.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Corrosive ammo in 4 boxes</text>
<rect x="8.0" y="90.0" width="88.0" height="80.0" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="52.0" y="124.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Primer</text><text x="52.0" y="146.0" font-size="14" fill="#17201A" text-anchor="middle">chlorate</text><line x1="96.0" y1="130.0" x2="100.0" y2="130.0" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><polygon points="106.0,130.0 95.2,135.2 95.2,124.8" fill="#FF6A13" stroke="#FF6A13" stroke-width="1" stroke-linejoin="round"/><rect x="106.0" y="90.0" width="88.0" height="80.0" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="150.0" y="124.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Fired</text><text x="150.0" y="146.0" font-size="14" fill="#17201A" text-anchor="middle">leaves salt</text><line x1="194.0" y1="130.0" x2="198.0" y2="130.0" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><polygon points="204.0,130.0 193.2,135.2 193.2,124.8" fill="#FF6A13" stroke="#FF6A13" stroke-width="1" stroke-linejoin="round"/><rect x="204.0" y="90.0" width="88.0" height="80.0" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="248.0" y="124.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Salt</text><text x="248.0" y="146.0" font-size="14" fill="#17201A" text-anchor="middle">pulls water</text><line x1="292.0" y1="130.0" x2="296.0" y2="130.0" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><polygon points="302.0,130.0 291.2,135.2 291.2,124.8" fill="#FF6A13" stroke="#FF6A13" stroke-width="1" stroke-linejoin="round"/><rect x="302.0" y="90.0" width="88.0" height="80.0" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="2"/><text x="346.0" y="124.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Rust</text><text x="346.0" y="146.0" font-size="14" fill="#17201A" text-anchor="middle">in hours</text><text x="200.0" y="214.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">Water dissolves the salt. Oil does not.</text><text x="200.0" y="238.0" font-size="14" fill="#17201A" text-anchor="middle">Clean the same day you shoot it.</text>
</svg>
