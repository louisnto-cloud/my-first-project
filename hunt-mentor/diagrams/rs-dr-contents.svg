<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="What the contents mean. Berries and seeds: bear or coyote in a berry patch. Green grass: spring bear or a grazer. Deer hair and bone: wolf or cougar, deer nearby. Mouse hair and tiny bones: coyote or fox. Insect parts: bear tearing logs. Sawdust like fibre: hare, or moose in winter.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The contents are the menu</text>
<rect x="10" y="62" width="380" height="32" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="83" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Berries, seeds</text><text x="200" y="83" font-size="14" fill="#23261f" text-anchor="start">bear or coyote in a berry patch</text><rect x="10" y="100" width="380" height="32" rx="6" fill="#f3f1e6" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="121" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Grass, green</text><text x="200" y="121" font-size="14" fill="#23261f" text-anchor="start">spring bear, or grazer</text><rect x="10" y="138" width="380" height="32" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="159" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Deer hair, bone</text><text x="200" y="159" font-size="14" fill="#23261f" text-anchor="start">wolf or cougar: deer nearby</text><rect x="10" y="176" width="380" height="32" rx="6" fill="#f3f1e6" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="197" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Mouse hair, tiny bones</text><text x="200" y="197" font-size="14" fill="#23261f" text-anchor="start">coyote or fox</text><rect x="10" y="214" width="380" height="32" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="235" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Insect parts</text><text x="200" y="235" font-size="14" fill="#23261f" text-anchor="start">bear tearing logs, ants</text><rect x="10" y="252" width="380" height="32" rx="6" fill="#f3f1e6" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="273" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Sawdust like fibre</text><text x="200" y="273" font-size="14" fill="#23261f" text-anchor="start">hare, moose in winter</text>
</svg>
