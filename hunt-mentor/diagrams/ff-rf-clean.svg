<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Cleaning a .22: the rod and brush go in from the chamber end and push through to the muzzle. Push the brush all the way through before reversing; never change direction inside the bore. The CZ manual says this protects the muzzle.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Clean a .22 from the chamber end</text><rect x="60" y="130" width="300" height="30" rx="0" fill="#9a9e96" stroke="#2f3a2b" stroke-width="2"/><rect x="20" y="140" width="120" height="10" rx="0" fill="#6b4f35" stroke="none" stroke-width="2"/><circle cx="18" cy="145" r="8" fill="#6b4f35" stroke="none" stroke-width="2"/><line x1="150" y1="112" x2="330" y2="112" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><path d="M321.9 115.9 L330 112 L321.9 108.1" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="100" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">chamber to muzzle</text><text x="200" y="210" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Brush all the way through,</text><text x="200" y="229" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">then back. Never reverse mid bore.</text><text x="200.0" y="284" font-size="13" fill="#2f3a2b" text-anchor="middle">CZ manual: protects the muzzle crown</text>
</svg>
