<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Decision list, five yeses then shoot. 1: Can I name it? 2: Is it under its limit today? 3: Is it inside 35 metres, 38 yards? 4: Is it safe, not over my partner? 5: Can I fetch it? Any no means pass. All yes: pick one bird and shoot."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Five yeses, then shoot</text><rect x="10" y="36" width="270" height="40" rx="8" fill="#dfe6d3"/><text x="24" y="62" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">1. Can I name it?</text><rect x="290" y="36" width="100" height="40" rx="8" fill="#e8590c"/><text x="340" y="62" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">No: pass</text><rect x="10" y="82" width="270" height="40" rx="8" fill="#dfe6d3"/><text x="24" y="108" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">2. Under its limit today?</text><rect x="290" y="82" width="100" height="40" rx="8" fill="#e8590c"/><text x="340" y="108" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">No: pass</text><rect x="10" y="128" width="270" height="40" rx="8" fill="#dfe6d3"/><text x="24" y="154" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">3. Inside 35 m (38 yd)?</text><rect x="290" y="128" width="100" height="40" rx="8" fill="#e8590c"/><text x="340" y="154" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">No: pass</text><rect x="10" y="174" width="270" height="40" rx="8" fill="#dfe6d3"/><text x="24" y="200" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">4. Safe: not over my partner?</text><rect x="290" y="174" width="100" height="40" rx="8" fill="#e8590c"/><text x="340" y="200" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">No: pass</text><rect x="10" y="220" width="270" height="40" rx="8" fill="#dfe6d3"/><text x="24" y="246" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">5. Can I fetch it?</text><rect x="290" y="220" width="100" height="40" rx="8" fill="#e8590c"/><text x="340" y="246" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">No: pass</text><rect x="10" y="266" width="380" height="30" rx="8" fill="#8a9a6b"/><text x="200" y="287" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">All yes: pick one bird, shoot</text></svg>
