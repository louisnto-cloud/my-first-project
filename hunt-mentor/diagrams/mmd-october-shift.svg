<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four week columns for October. Week 1: hard antlers, bachelor groups split up. Week 2: sparring, rubs, bushes thrashed. Week 3: first snow up high pushes deer down. Week 4: bucks check doe groups at dawn and dusk. This is the pre rut; the rut peaks in mid November. The weeks are a rough guide.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">What changes in October</text><rect x="8" y="44" width="92" height="186" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="54" y="70" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">Week 1</text><text x="54" y="104" font-size="14" fill="#23261f" text-anchor="middle">Hard antlers</text><text x="54" y="126" font-size="14" fill="#23261f" text-anchor="middle">Bachelor groups</text><text x="54" y="148" font-size="14" fill="#23261f" text-anchor="middle">split up (80%)</text><rect x="106" y="44" width="92" height="186" rx="8" fill="#efe6d6" stroke="#8a9a6b" stroke-width="2"/><text x="152" y="70" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">Week 2</text><text x="152" y="104" font-size="14" fill="#23261f" text-anchor="middle">Sparring, rubs,</text><text x="152" y="126" font-size="14" fill="#23261f" text-anchor="middle">bushes thrashed</text><text x="152" y="148" font-size="14" fill="#23261f" text-anchor="middle">(70 to 90%)</text><rect x="204" y="44" width="92" height="186" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="250" y="70" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">Week 3</text><text x="250" y="104" font-size="14" fill="#23261f" text-anchor="middle">First snow up</text><text x="250" y="126" font-size="14" fill="#23261f" text-anchor="middle">high pushes deer</text><text x="250" y="148" font-size="14" fill="#23261f" text-anchor="middle">down (85%)</text><rect x="302" y="44" width="92" height="186" rx="8" fill="#efe6d6" stroke="#8a9a6b" stroke-width="2"/><text x="348" y="70" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">Week 4</text><text x="348" y="104" font-size="14" fill="#23261f" text-anchor="middle">Bucks check</text><text x="348" y="126" font-size="14" fill="#23261f" text-anchor="middle">doe groups at</text><text x="348" y="148" font-size="14" fill="#23261f" text-anchor="middle">dawn, dusk (70%)</text><rect x="8" y="240" width="384" height="50" rx="8" fill="#2f3a2b"/><text x="200" y="261" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Pre rut. Rut peaks mid November (80%).</text><text x="200" y="280" font-size="14" fill="#fffaf0" text-anchor="middle">Weeks are a rough guide (Tip)</text>
</svg>
