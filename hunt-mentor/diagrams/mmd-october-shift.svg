<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four week columns for October. Week 1: hard antlers, bachelor groups split up. Week 2: sparring, rubs, bushes thrashed. Week 3: first snow up high pushes deer down. Week 4: bucks check doe groups at dawn and dusk. This is the pre rut; the rut peaks in mid November. The weeks are a rough guide.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">What changes in October</text><rect x="8" y="42" width="384" height="42" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="18" y="69" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Week 1</text><text x="86" y="69" font-size="14" fill="#23261f" text-anchor="start">Hard antlers; bachelor groups split (80%)</text><rect x="8" y="90" width="384" height="42" rx="8" fill="#efe6d6" stroke="#8a9a6b" stroke-width="2"/><text x="18" y="117" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Week 2</text><text x="86" y="117" font-size="14" fill="#23261f" text-anchor="start">Sparring, rubs, thrashed bushes (70%)</text><rect x="8" y="138" width="384" height="42" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="18" y="165" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Week 3</text><text x="86" y="165" font-size="14" fill="#23261f" text-anchor="start">First snow up high pushes deer down (85%)</text><rect x="8" y="186" width="384" height="42" rx="8" fill="#efe6d6" stroke="#8a9a6b" stroke-width="2"/><text x="18" y="213" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Week 4</text><text x="86" y="213" font-size="14" fill="#23261f" text-anchor="start">Bucks check doe groups at dawn, dusk (70%)</text><rect x="8" y="240" width="384" height="50" rx="8" fill="#2f3a2b"/><text x="200" y="261" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Pre rut. Rut peaks mid November (80%).</text><text x="200" y="280" font-size="14" fill="#fffaf0" text-anchor="middle">Weeks are a rough guide (Tip)</text>
</svg>
