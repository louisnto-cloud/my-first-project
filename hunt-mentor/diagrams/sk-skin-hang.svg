<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A deer hung head down by its hind legs on a gambrel through the hock tendons. Cut around the hocks, down the inside of the legs and up the belly, then pull the hide off with your fist, using the knife as little as possible. The head comes off at the atlas joint, the first joint behind the skull.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">Skinning: hang it by the hind legs</text><line x1="130" y1="52" x2="270" y2="52" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="200" y1="40" x2="200" y2="52" stroke="#2f3a2b" stroke-width="3"/><g stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"><path d="M150 54 L176 110 L190 104 L162 50 Z" fill="#8a9a6b"/><path d="M250 54 L224 110 L210 104 L238 50 Z" fill="#8a9a6b"/><ellipse cx="200" cy="160" rx="40" ry="70" fill="#8a9a6b"/><path d="M170 212 L150 262 L162 266 L182 220 Z M230 212 L250 262 L238 266 L218 220 Z" fill="#8a9a6b"/><path d="M190 226 L192 262 L208 262 L210 226 Z" fill="#8a9a6b"/><ellipse cx="200" cy="276" rx="11" ry="16" fill="#8a9a6b"/></g><circle cx="156" cy="60" r="8" fill="none" stroke="#e8590c" stroke-width="3"/><circle cx="244" cy="60" r="8" fill="none" stroke="#e8590c" stroke-width="3"/><path d="M160 70 L196 130 L200 210 M240 70 L204 130" fill="none" stroke="#e8590c" stroke-width="3.5" stroke-dasharray="8 5"/><line x1="186" y1="254" x2="214" y2="254" stroke="#b3261e" stroke-width="3.5" stroke-dasharray="5 3"/><text x="20" y="52" font-size="13" font-weight="bold" fill="#23261f">Gambrel through</text><text x="20" y="68" font-size="13" font-weight="bold" fill="#23261f">the hock tendon</text><text x="270" y="96" font-size="13" font-weight="bold" fill="#23261f">Cut around</text><text x="270" y="112" font-size="13" font-weight="bold" fill="#23261f">the hocks, down</text><text x="270" y="128" font-size="13" font-weight="bold" fill="#23261f">the inside of the</text><text x="270" y="144" font-size="13" font-weight="bold" fill="#23261f">legs, up the belly</text><text x="20" y="150" font-size="13" font-weight="bold" fill="#23261f">Then fist and pull.</text><text x="20" y="166" font-size="13" fill="#23261f">Knife as little</text><text x="20" y="182" font-size="13" fill="#23261f">as possible.</text><text x="270" y="230" font-size="13" font-weight="bold" fill="#b3261e">Head off at the</text><text x="270" y="246" font-size="13" font-weight="bold" fill="#b3261e">atlas joint, first</text><text x="270" y="262" font-size="13" font-weight="bold" fill="#b3261e">joint behind skull</text>
</svg>
