<line x1="198" y1="84" x2="256.3" y2="72.5" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="198" cy="84" r="3" fill="#2f3a2b"/><rect x="256.3" y="50.0" width="135.7" height="45.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="324.171" y="69" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Gambrel through</text>
<text x="324.171" y="87" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">the hock tendon</text>
<line x1="158" y1="134" x2="210.8" y2="151.5" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="158" cy="134" r="3" fill="#2f3a2b"/><rect x="210.8" y="120.0" width="181.2" height="63.0" rx="5" fill="#fffaf0" stroke="#e8590c" stroke-width="1.2"/>
<text x="301.38" y="139" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">Cut around the hocks,</text>
<text x="301.38" y="157" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">down the inside of the</text>
<text x="301.38" y="175" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">legs, up the belly</text>
<line x1="148" y1="330" x2="250.2" y2="337.5" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="148" cy="330" r="3" fill="#2f3a2b"/><rect x="250.2" y="306.0" width="141.8" height="63.0" rx="5" fill="#fffaf0" stroke="#c0392b" stroke-width="1.2"/>
<text x="321.121" y="325" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Head off at the</text>
<text x="321.121" y="343" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">atlas joint, first</text>
<text x="321.121" y="361" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">joint behind skull</text>

<text x="14" y="256" font-size="15" font-weight="bold" fill="#2f3a2b">Then fist</text><text x="14" y="275" font-size="15" font-weight="bold" fill="#2f3a2b">and pull.</text>
<text x="392" y="256" font-size="15" fill="#2f3a2b" text-anchor="end">Knife as little</text><text x="392" y="275" font-size="15" fill="#2f3a2b" text-anchor="end">as possible.</text>
</svg>
