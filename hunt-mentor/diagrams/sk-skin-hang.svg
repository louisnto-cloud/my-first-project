<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="sans-serif" role="img" aria-label="A deer hung head down by its hind legs on a gambrel through the hock tendons, belly toward you. Cut around the hocks, down the inside of the legs and up the belly, then pull the hide down with your fist, using the knife as little as possible. The hide is shown peeled off the hind quarters. The head comes off at the atlas joint, the first joint behind the skull.">
<rect width="400" height="380" fill="#fffaf0"/>
<text x="200" y="28" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Skinning: hang it by the hind legs</text>
