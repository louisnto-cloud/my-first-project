 fill="#23261f" text-anchor="middle" font-weight="bold">Ribs</text><path d="M228 140 L250 102 L266 106 L250 150 Z" fill="#e89a9a" stroke="#23261f"/><line x1="300" y1="112" x2="258" y2="120" stroke="#e8590c" stroke-width="1.5"/><text x="320" y="110" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Neck</text><text x="200" y="270" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Plus tenderloins inside, under the spine</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Four quarters, loins, neck, ribs (99%)</text>
</svg>
