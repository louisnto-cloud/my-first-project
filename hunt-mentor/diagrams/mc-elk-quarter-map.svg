<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Elk outline with the edible portions marked: two front quarters, two hind quarters, the backstraps along the spine, the ribs, the neck, and the tenderloins inside under the spine. BC rules require all edible portions to come out: four quarters, loins, neck and ribs.">
<rect width="400" height="300" fill="#fffaf0"/>
