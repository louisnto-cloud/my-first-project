<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Pump field strip step 4: push the carrier up, press the left shell latch inside the receiver, and slide the fore end with the action bars, slide and bolt forward off the magazine tube.">
<rect width="400" height="300" fill="#EEF1EA"/>
<circle cx="24" cy="22" r="15" fill="#1F3D2B"/><text x="24" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="46" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Fore end and bolt off</text>
<path d="M10 84 L102 90 L102 112 L80 120 L10 124 Z" fill="#6b5a45" stroke="#17201A" stroke-width="0.8"/><rect x="102" y="86" width="56" height="30" rx="3" fill="#5d646b" stroke="#17201A" stroke-width="0.8"/>
<rect x="158" y="106" width="150" height="8" rx="3" fill="#5d646b" stroke="#17201A" stroke-width="0.8"/>
<rect x="120" y="180" width="90" height="18" rx="5" fill="#6b5a45" stroke="#FF6A13" stroke-width="2.5"/>
<rect x="80" y="184" width="40" height="10" rx="3" fill="#a7aeb3" stroke="#FF6A13" stroke-width="2.5"/>
<rect x="71.2" y="219.0" width="157.6" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="150.0" y="236.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">fore end, bars, bolt</text>
<line x1="174.8" y1="76.0" x2="124.0" y2="116.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="124.0" cy="116.0" r="3" fill="#1F3D2B"/><rect x="174.8" y="53.0" width="170.3" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="260.0" y="70.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">press left shell latch</text>
<text x="200.0" y="290.0" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Trigger plate: leave it in (Tip).</text>
