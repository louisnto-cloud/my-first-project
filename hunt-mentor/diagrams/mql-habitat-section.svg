<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Cross section of a South Okanagan valley side from the lake up to the pine. Riparian brush by the lake and orchard edges: quail. Brushy draws on the lower benches: quail. Farm benches and stubble: maybe gray partridge. Steep rock and cheatgrass slopes: chukar. Open pine above: few quail. Quail breed mostly from 250 to 500 metres and rarely above 750 metres, BC Breeding Bird Atlas, 85 percent.">
