<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 372" font-family="sans-serif" role="img" aria-label="The dot game card: six orange dots, three 5 cm dots and three 2.5 cm dots, one shot each at 50 m. One shot per dot from a new position each time. A hit scores one point, a total out of 6. Log it and try to beat it."><rect x="0" y="0" width="400" height="372" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Game 1: the dot card</text><rect x="20" y="44" width="360" height="230" fill="#FFFFFF" stroke="#1F3D2B"/><circle cx="80" cy="100" r="25" fill="#FF6A13"/><text x="80" y="106" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><circle cx="200" cy="100" r="25" fill="#FF6A13"/><text x="200" y="106" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text><circle cx="320" cy="100" r="25" fill="#FF6A13"/><text x="320" y="106" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text><circle cx="80" cy="210" r="13" fill="#FF6A13"/><text x="80" y="216" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4</text><circle cx="200" cy="210" r="13" fill="#FF6A13"/><text x="200" y="216" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">5</text><circle cx="320" cy="210" r="13" fill="#FF6A13"/><text x="320" y="216" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">6</text><text x="40" y="150" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">5 cm dots: 1 shot each</text><text x="40" y="260" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">2.5 cm dots: 1 shot each</text><circle cx="26" cy="295" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="300" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><text x="42" y="300" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">1 shot per dot, a new position each</text><circle cx="26" cy="319" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="324" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text><text x="42" y="324" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Hit = 1 point. Miss = 0. Max 6</text><circle cx="26" cy="343" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="348" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text><text x="42" y="348" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Log the score. Beat it next week</text></svg>
