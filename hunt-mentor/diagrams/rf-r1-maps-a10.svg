<text x="14" y="282" font-size="14" fill="#23261f" text-anchor="start">grouse, deer and bear</text>
<text x="14" y="300" font-size="14" fill="#23261f" text-anchor="start">seasons. No snowmobile,</text>
<text x="14" y="318" font-size="14" fill="#23261f" text-anchor="start">e bike or ATV, Sept 1</text>
