<text x="14" y="142" font-size="14" fill="#23261f" text-anchor="start">special antlerless</text>
<text x="14" y="160" font-size="14" fill="#23261f" text-anchor="start">season. Michael Lake no</text>
<text x="14" y="178" font-size="14" fill="#23261f" text-anchor="start">shooting</text>
<rect x="204" y="40" width="190" height="150" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<path d="M204 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#e8590c"/>
<text x="299" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">A11 Englishman River</text>
