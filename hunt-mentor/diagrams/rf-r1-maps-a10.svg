<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="sans-serif" role="img" aria-label="Table for Maps A10 to A15 near Nanaimo and Ladysmith, with columns No Shooting Area, shot only or bow area, and special antlerless mule deer season. A10 Nanaimo and Ladysmith: No Shooting Area, bow or shot only area, special antlerless mule deer season east of the powerline, and Michael Lake no shooting. A11 Englishman River: No Shooting Area, MU 1-5. A12 Nanaimo River Camp: closed during the bow only seasons for grouse, deer and black bear, and no snowmobiles, electric bicycles or all terrain vehicles 1 September to 31 December. A13 Ladysmith and Malahat: shot only or bow, special antlerless season. A14 Nanaimo: No Shooting Area, shot only or bow, special antlerless season. A15 York Lake: No Shooting Area, MU 1-5.">
