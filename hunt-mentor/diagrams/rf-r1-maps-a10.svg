<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 504" role="img" aria-label="Cards for Maps A10 to A15. A10 Nanaimo and Ladysmith: No Shooting Area, bow or shot only area, special antlerless mule deer season east of the powerline, and Michael Lake no shooting. A11 Englishman River: No Shooting Area. A12 Nanaimo River Camp: closed during the bow only seasons for grouse, deer and black bear, and no snowmobiles, electric bicycles or all terrain vehicles 1 September to 31 December. A13 Ladysmith and Malahat: shot only or bow, special antlerless season. A14 Nanaimo: No Shooting Area, shot only or bow, special antlerless season. A15 York Lake: No Shooting Area." font-family="sans-serif">
<rect x="0" y="0" width="400" height="504" fill="#fffaf0"/>
