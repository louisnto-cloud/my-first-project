<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four ways the body loses heat: convection, wind strips it away; evaporation, sweat and wet clothes; radiation, heat lost to open sky; conduction, heat drained into cold ground. Sit on a pad, block the wind, stay dry.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4 ways your body loses heat</text><line x1="188" y1="200" x2="194" y2="156" stroke="#2f3a2b" stroke-width="10.5" stroke-linecap="round"/><line x1="212" y1="200" x2="206" y2="156" stroke="#2f3a2b" stroke-width="10.5" stroke-linecap="round"/><rect x="184" y="114" width="33" height="46" rx="9.0" fill="#e8590c"/><line x1="185" y1="121" x2="173" y2="153" stroke="#2f3a2b" stroke-width="9.0" stroke-linecap="round"/><line x1="215" y1="121" x2="227" y2="153" stroke="#2f3a2b" stroke-width="9.0" stroke-linecap="round"/><circle cx="200" cy="100" r="15.0" fill="#d9b48f"/><rect x="40" y="200" width="320" height="12" rx="3" fill="#8a9a6b"/><rect x="10" y="46" width="120" height="56" rx="8" fill="#ffffff" stroke="#4a7fb0" stroke-width="2"/><text x="70" y="70" font-size="14" fill="#2f3a2b" text-anchor="middle">Convection</text><text x="70" y="88" font-size="14" fill="#2f3a2b" text-anchor="middle">wind strips it</text><line x1="130" y1="80" x2="170" y2="104" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="180,110 173,98 166,110" fill="#4a7fb0"/><rect x="270" y="46" width="120" height="56" rx="8" fill="#ffffff" stroke="#4a7fb0" stroke-width="2"/><text x="330" y="70" font-size="14" fill="#2f3a2b" text-anchor="middle">Evaporation</text><text x="330" y="88" font-size="14" fill="#2f3a2b" text-anchor="middle">sweat, wet</text><line x1="270" y1="80" x2="232" y2="104" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="222,110 236,110 228,98" fill="#4a7fb0"/><rect x="270" y="130" width="120" height="56" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="330" y="154" font-size="14" fill="#2f3a2b" text-anchor="middle">Radiation</text><text x="330" y="172" font-size="14" fill="#2f3a2b" text-anchor="middle">to open sky</text><line x1="270" y1="150" x2="238" y2="143" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><polygon points="226,140 236,150 239,136" fill="#e8590c"/><rect x="10" y="130" width="120" height="56" rx="8" fill="#ffffff" stroke="#8b5a2b" stroke-width="2"/><text x="70" y="154" font-size="14" fill="#2f3a2b" text-anchor="middle">Conduction</text><text x="70" y="172" font-size="14" fill="#2f3a2b" text-anchor="middle">cold ground</text><line x1="130" y1="170" x2="176" y2="198" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round"/><polygon points="186,204 179,192 172,204" fill="#8b5a2b"/><rect x="37" y="236" width="326" height="30" rx="6" fill="#2f3a2b"/><text x="200" y="257" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Sit on a pad. Block wind. Stay dry</text>
</svg>
