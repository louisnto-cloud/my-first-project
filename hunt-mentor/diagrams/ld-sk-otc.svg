<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 416" font-family="sans-serif" role="img" aria-label="Cards. A Saskatchewan resident buys a regular white tailed deer licence from 1 August, over the counter. You, a Canadian resident, must enter the draw in May, leftover licences VERIFY in June. Black bear and game bird licences: buy in your HAL account, no draw.">
<rect x="0" y="0" width="400" height="416" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Draw or over the counter?</text>
<rect x="16" y="42" width="368" height="116" rx="10" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2.5"/>
<text x="26" y="66" font-size="15" font-weight="bold" fill="#23261f">Saskatchewan resident</text>
<circle cx="368.0" cy="60" r="11" fill="#8a9a6b"/><path d="M363.05 60 l3.3 3.8499999999999996 l6.6 -7.699999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="26" y="84" font-size="14" fill="#2f3a2b">Buys a regular deer licence from August 1</text>
<text x="26" y="102" font-size="14" fill="#2f3a2b">(85%).</text>
<g transform="translate(46.0 138) scale(0.62)"><rect x="-28" y="-18" width="56" height="36" rx="5" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/><rect x="-22" y="-11" width="15" height="19" fill="#8a9a6b"/><path d="M-2 -8 h22 M-2 -1 h22 M-2 6 h15" stroke="#2f3a2b" stroke-width="2.5"/></g>
<rect x="16" y="168" width="368" height="116" rx="10" fill="#f3ead6" stroke="#6b4f35" stroke-width="2.5"/>
<text x="26" y="192" font-size="15" font-weight="bold" fill="#23261f">You, a Canadian resident</text>
<circle cx="368.0" cy="186" r="11" fill="#4a7fb0"/><text x="368" y="190.62" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
<text x="26" y="210" font-size="14" fill="#2f3a2b">Draw only, in May. Leftovers: VERIFY in</text>
<text x="26" y="228" font-size="14" fill="#2f3a2b">June.</text>
<g transform="translate(46.0 264) scale(0.62)"><rect x="-24" y="-18" width="48" height="40" rx="4" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/><rect x="-24" y="-18" width="48" height="11" fill="#e8590c"/><path d="M-13 -23 v9 M13 -23 v9" stroke="#2f3a2b" stroke-width="3"/><g fill="#8a9a6b"><rect x="-17" y="-1" width="7" height="6"/><rect x="-4" y="-1" width="7" height="6"/><rect x="9" y="-1" width="7" height="6"/><rect x="-17" y="10" width="7" height="6"/><rect x="-4" y="10" width="7" height="6" fill="#e8590c"/></g></g>
<rect x="16" y="294" width="368" height="98" rx="10" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2.5"/>
<text x="26" y="318" font-size="15" font-weight="bold" fill="#23261f">Bear and bird licences</text>
<circle cx="368.0" cy="312" r="11" fill="#8a9a6b"/><path d="M363.05 312 l3.3 3.8499999999999996 l6.6 -7.699999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="26" y="336" font-size="14" fill="#2f3a2b">Buy in your HAL account, no draw (85%).</text>
<g transform="translate(46.0 372) scale(0.62)"><ellipse cx="0" cy="2" rx="20" ry="11" fill="#2f3a2b"/><circle cx="20" cy="-4" r="8" fill="#2f3a2b"/><circle cx="17" cy="-12" r="3" fill="#2f3a2b"/><path d="M-13 10 v10 M-6 10 v10 M8 10 v10 M14 10 v10" stroke="#2f3a2b" stroke-width="5"/></g>
<g transform="translate(133.0 372) scale(0.62)"><ellipse cx="-2" cy="6" rx="18" ry="8" fill="#6b4f35"/><circle cx="13" cy="-6" r="7" fill="#2e6b3a"/><path d="M19 -5 l9 2 l-9 2 z" fill="#d9a400"/><path d="M-20 4 l-8 -4" stroke="#6b4f35" stroke-width="3"/><path d="M-26 16 q26 6 52 0" stroke="#4a7fb0" stroke-width="3" fill="none"/></g>
