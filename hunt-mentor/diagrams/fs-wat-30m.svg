<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Toilet at least 30 metres from any water source, in a cat hole. Keep the water clean for the next drinker.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Toilet: 30 m from water</text><path d="M0 200 q 50 -12 100 0 t 100 0 t 100 0 t 100 0 L400 240 L0 240 Z" fill="#4a7fb0"/><line x1="120" y1="160" x2="320" y2="160" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><text x="220" y="150" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="middle">30 m</text><rect x="320" y="120" width="40" height="40" rx="4" fill="#8b5a2b"/><text x="340" y="186" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">cat hole</text><text x="200" y="285" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Keep the water clean for the next drinker</text>
</svg>
