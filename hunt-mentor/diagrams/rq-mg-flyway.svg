<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" font-family="sans-serif" role="img" aria-label="Schematic, not to scale, of the BC part of the Pacific Flyway. Interior plateau ponds freeze first, ducks move to valley rivers such as the Thompson and Okanagan, then toward the coast. The Fraser delta feeds waterfowl from September to April. Snow geese come about 5,000 kilometres from Wrangel Island to the Fraser delta, then shift to the Skagit in Washington in late December.">
