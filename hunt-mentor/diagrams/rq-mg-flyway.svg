<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 304" role="img" aria-label="Schematic of the BC part of the Pacific Flyway. Interior plateau ponds freeze first, ducks move to valley rivers such as the Thompson and Okanagan, then toward the coast. The Fraser delta feeds waterfowl from September to April. Snow geese come about 5,000 kilometres from Wrangel Island to the Fraser delta, then shift to the Skagit in Washington in late December.">
<rect x="0" y="0" width="400" height="304" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pacific Flyway: the BC part</text>
<rect x="0" y="40" width="400" height="260" fill="#e6eef6"/>
<path d="M150 40 L400 40 L400 300 L120 300 Q 140 250 120 200 Q 100 140 150 40 Z" fill="#dfe6d3" stroke="#8a9a6b"/>
<text x="30" y="70" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="start">Pacific</text><text x="30" y="86" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="start">Ocean</text>
<rect x="250" y="60" width="140" height="46" rx="8" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="2"/><text x="320" y="80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Plateau ponds</text><text x="320" y="97" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">freeze first</text>
<rect x="250" y="150" width="140" height="46" rx="8" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="2"/><text x="320" y="170" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Valley rivers</text><text x="320" y="187" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">Thompson, Okanagan</text>
<rect x="140" y="240" width="150" height="50" rx="8" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="2"/><text x="215" y="260" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fraser delta</text><text x="215" y="277" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">Sept to April food</text>
<g><line x1="320" y1="106" x2="320" y2="148" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><polygon points="320.0,148.0 314.8,137.2 325.2,137.2" fill="#e8590c"/></g><g><line x1="290" y1="196" x2="240" y2="238" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><polygon points="240.0,238.0 244.9,227.1 251.6,235.0" fill="#e8590c"/></g>
<text x="10" y="140" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Snow geese:</text><text x="10" y="158" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">Wrangel Island,</text><text x="10" y="174" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">about 5,000 km</text>
<g><line x1="110" y1="190" x2="140" y2="255" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/><polygon points="140.0,255.0 132.3,248.6 140.2,245.0" fill="#2f3a2b"/></g>
<text x="10" y="296" font-family="sans-serif" font-size="13" fill="#6b4f35" text-anchor="start">Skagit (Washington) late Dec</text>
<g transform="translate(80 230) scale(0.8)"><ellipse rx="16" ry="6" fill="#2f3a2b"/><path d="M14 -2 L26 -10 L30 -9 L18 1 Z" fill="#111"/><rect x="24" y="-12" width="5" height="3" fill="#fff"/><path d="M-4 -3 L-16 -20 L8 -4 Z" fill="#2f3a2b"/><path d="M-4 3 L-14 19 L8 4 Z" fill="#2f3a2b"/></g><g transform="translate(300 128) scale(0.8)"><ellipse rx="13" ry="5" fill="#2f3a2b"/><circle cx="13" cy="-2" r="4" fill="#2f3a2b"/><path d="M16 -2 l6 1 l-6 2 Z" fill="#e8590c"/><path d="M-4 -2 L-14 -16 L6 -3 Z" fill="#2f3a2b"/><path d="M-4 2 L-12 15 L6 3 Z" fill="#2f3a2b"/></g>
</svg>
