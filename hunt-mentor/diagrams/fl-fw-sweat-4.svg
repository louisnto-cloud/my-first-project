<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Add what you drank to what you lost. That is your sweat loss for that hike. Plan to drink close to it on a hunt day.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="30" cy="32" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="30" y="39" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">4</text>
<text x="56" y="39" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="start">Your number</text>
<text x="200" y="120" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1.0 L drunk + 0.8 L lost</text><text x="200" y="160" font-family="sans-serif" font-size="22" font-weight="bold" fill="#e8590c" text-anchor="middle">= 1.8 L in 3 hours</text><text x="200" y="196" font-family="sans-serif" font-size="17" fill="#23261f" text-anchor="middle">about 0.6 L an hour</text>
<rect x="10" y="262" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="285.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Example numbers. Test your own.</text>
</svg>
