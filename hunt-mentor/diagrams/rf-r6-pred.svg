<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-label="Bar chart of Region 6 predator, furbearer and small game seasons. Wolf in all units: 1 August to 15 June. Cougar in 6-1 to 6-11: 10 September to 30 April, closing early once 5 females are taken. Coyote in 6-1 to 6-11 and 6-14 to 6-30: 1 September to 31 March. Wolverine, same units: 15 September to 28 February. Lynx in 6-1, 6-2, 6-4 to 6-9 and 6-15 to 6-30: 15 November to 15 February. Raccoon in 6-12 and 6-13: no closed season. Snowshoe hare in all units: 1 August to 30 April." font-family="sans-serif">
<rect x="0" y="0" width="400" height="440" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Predators, furbearers, small game</text>
<text x="200" y="46" font-size="14" fill="#6b6f66" text-anchor="middle">Cougar closes early at 5 females</text>
<rect x="14.0" y="60" width="31.6" height="344" fill="#dfe6d3" opacity=".55"/>
<text x="30" y="74" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">J</text>
<text x="61" y="74" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A</text>
