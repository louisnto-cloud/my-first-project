<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A made up drill area: timbered ridge at the top, a grass bench below it, a draw with a creek on the right, a private block on the left, a road at the bottom with a recreation site circle. Six numbered stops: 1 park, 2 walk in, 3 glass, 4 read sign, 5 seat, 6 walk out.">
