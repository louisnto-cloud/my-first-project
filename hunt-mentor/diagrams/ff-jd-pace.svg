<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Footprints alternating. Count every left foot. Walk a measured 100 m three times and average the count: that is your pace count on flat ground.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Know your pace count</text><ellipse cx="40" cy="200" rx="10" ry="16" fill="#2f3a2b"/><ellipse cx="82" cy="170" rx="10" ry="16" fill="#2f3a2b"/><ellipse cx="124" cy="200" rx="10" ry="16" fill="#2f3a2b"/><ellipse cx="166" cy="170" rx="10" ry="16" fill="#2f3a2b"/><ellipse cx="208" cy="200" rx="10" ry="16" fill="#2f3a2b"/><ellipse cx="250" cy="170" rx="10" ry="16" fill="#2f3a2b"/><ellipse cx="292" cy="200" rx="10" ry="16" fill="#2f3a2b"/><ellipse cx="334" cy="170" rx="10" ry="16" fill="#2f3a2b"/><text x="200" y="100" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">Count every LEFT foot</text><text x="200" y="250" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Walk a measured 100 m three times.</text><text x="200" y="272" font-size="15" fill="#2f3a2b" text-anchor="middle">Average = your count on flat ground</text>
</svg>
