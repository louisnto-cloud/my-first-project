<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Hunt Map step 2: the Slope steepness tool colours the map by steepness. Uncoloured flat ground marks open fields where geese can land; steep slopes show orange and red. Geese land on flat open ground, a Tip.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Step 2: Slope steepness finds flat fields</text><rect x="60" y="34" width="280" height="236" rx="14" fill="#e9efe1" stroke="#2f3a2b" stroke-width="3"/><rect x="80" y="72" width="240" height="190" rx="0" fill="#e9efe1"/><path d="M80 72 L150 72 L150 262 L80 262Z" fill="#fff59d" opacity=".7"/><path d="M150 72 L220 72 L220 262 L150 262Z" fill="#ffcc80" opacity=".7"/><path d="M220 72 L290 72 L290 262 L220 262Z" fill="#ef9a9a" opacity=".7"/><rect x="85" y="140" width="60" height="60" rx="0" fill="#ffffff" opacity=".9"/><text x="115" y="175" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">Flat</text><text x="185" y="175" font-size="14" fill="#2f3a2b" text-anchor="middle">Gentle</text><text x="255" y="175" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Steep</text><rect x="60" y="34" width="280" height="28" rx="14" fill="#2f3a2b"/><rect x="60" y="48" width="280" height="14" rx="0" fill="#2f3a2b"/><text x="200" y="54" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Terrain tools</text><text x="200" y="292" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Geese land on flat open ground (Tip)</text>
</svg>
