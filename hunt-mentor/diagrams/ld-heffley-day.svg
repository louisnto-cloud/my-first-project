<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 545" font-family="sans-serif" role="img" aria-label="Timeline of a late October deer day near Heffley Creek, mostly Tips. First light: glass from above, and on a cold morning glass sunny east and south faces first. Late morning: valley air starts to rise uphill, 80 percent. Warm afternoon: check the north and east shade where deer bed. Evening: air sinks downhill, glass from below or across. Dusk: white tails at a hayfield edge, watched from a fence corner 200 metres back.">
<rect x="0" y="0" width="400" height="545" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">A late October deer day</text>
<text x="200" y="46" font-size="14" fill="#6b4f35" text-anchor="middle">Tips, plus thermals (80%)</text>
<line x1="122" y1="68" x2="122" y2="515" stroke="#8a9a6b" stroke-width="5"/>
<text x="108" y="82" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">First light</text>
<circle cx="122" cy="78" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="3"/>
<g transform="translate(360 86) scale(0.8)"><rect x="-20" y="-12" width="14" height="26" rx="5" fill="#2f3a2b"/><rect x="6" y="-12" width="14" height="26" rx="5" fill="#2f3a2b"/><rect x="-6" y="-6" width="12" height="8" fill="#2f3a2b"/><circle cx="-13" cy="12" r="5" fill="#4a7fb0"/><circle cx="13" cy="12" r="5" fill="#4a7fb0"/></g>
<text x="140" y="84" font-size="15" fill="#2f3a2b">Glass from above. Cold:</text>
<text x="140" y="103" font-size="15" fill="#2f3a2b">sunny east and south faces</text>
<text x="140" y="122" font-size="15" fill="#2f3a2b">first.</text>
<text x="108" y="183" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">Late morning</text>
<circle cx="122" cy="179" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="3"/>
<g transform="translate(360 187) scale(0.8)"><circle r="11" fill="#d9a400"/><g stroke="#d9a400" stroke-width="3"><path d="M0 -20 v5 M0 15 v5 M-20 0 h5 M15 0 h5 M-14 -14 l4 4 M10 10 l4 4 M14 -14 l-4 4 M-10 10 l-4 4"/></g></g>
<text x="140" y="185" font-size="15" fill="#2f3a2b">Air starts to rise uphill</text>
<text x="140" y="204" font-size="15" fill="#2f3a2b">(80%).</text>
<text x="108" y="265" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">Warm</text>
<text x="108" y="282" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">afternoon</text>
<circle cx="122" cy="261" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="3"/>
<g transform="translate(360 269) scale(0.8)"><ellipse cx="0" cy="4" rx="17" ry="8" fill="#8b5a2b"/><path d="M12 0 L18 -10" stroke="#8b5a2b" stroke-width="5"/><ellipse cx="21" cy="-12" rx="6" ry="4" fill="#8b5a2b"/><path d="M19 -15 l-3 -9 m3 9 l3 -10 m-4.5 -4 l-4 -2" stroke="#6b4f35" stroke-width="2" fill="none"/><path d="M-12 10 v10 M-6 10 v10 M8 10 v10 M13 10 v10" stroke="#8b5a2b" stroke-width="3"/></g>
<text x="140" y="267" font-size="15" fill="#2f3a2b">Check north and east shade</text>
<text x="140" y="286" font-size="15" fill="#2f3a2b">where they bed.</text>
<text x="108" y="347" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">Evening</text>
<circle cx="122" cy="343" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="3"/>
<g transform="translate(360 351) scale(0.8)"><rect x="-20" y="-12" width="14" height="26" rx="5" fill="#2f3a2b"/><rect x="6" y="-12" width="14" height="26" rx="5" fill="#2f3a2b"/><rect x="-6" y="-6" width="12" height="8" fill="#2f3a2b"/><circle cx="-13" cy="12" r="5" fill="#4a7fb0"/><circle cx="13" cy="12" r="5" fill="#4a7fb0"/></g>
<text x="140" y="349" font-size="15" fill="#2f3a2b">Air sinks downhill (80%).</text>
<text x="140" y="368" font-size="15" fill="#2f3a2b">Glass from below or</text>
<text x="140" y="387" font-size="15" fill="#2f3a2b">across.</text>
<text x="108" y="448" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">Dusk</text>
<circle cx="122" cy="444" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="3"/>
<g transform="translate(360 452) scale(0.8)"><path d="M4 -16 a16 16 0 1 0 10 26 a12 12 0 1 1 -10 -26 z" fill="#2f3a2b"/></g>
<text x="140" y="450" font-size="15" fill="#2f3a2b">White tails: hayfield</text>
<text x="140" y="469" font-size="15" fill="#2f3a2b">edge, from a fence corner</text>
<text x="140" y="488" font-size="15" fill="#2f3a2b">200 m back.</text>
</svg>
