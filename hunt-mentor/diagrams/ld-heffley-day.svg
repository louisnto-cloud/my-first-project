<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 436" font-family="sans-serif" role="img" aria-label="Timeline of a late October deer day near Heffley Creek, mostly Tips. First light: glass from above, and on a cold morning glass sunny east and south faces first. Late morning: valley air starts to rise uphill, 80 percent. Warm afternoon: check the north and east shade where deer bed. Evening: air sinks downhill, glass from below or across. Dusk: white tails at a hayfield edge, watched from a fence corner 200 metres back.">
<rect width="400" height="436" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A late October deer day</text>
<text x="200" y="46" font-size="15" fill="#8b5a2b" text-anchor="middle">Tips, plus thermals (80%)</text>
<rect x="8" y="58" width="384" height="76" rx="8" fill="#f4eedf"/>
<rect x="8" y="58" width="96" height="76" rx="8" fill="#f2b38f"/>
<text x="56" y="101" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">First light</text>
<g transform="translate(356 96.0)"><rect x="-20" y="-12" width="14" height="26" rx="5" fill="#2f3a2b"/><rect x="6" y="-12" width="14" height="26" rx="5" fill="#2f3a2b"/><rect x="-6" y="-6" width="12" height="8" fill="#2f3a2b"/><circle cx="-13" cy="12" r="5" fill="#4a7fb0"/><circle cx="13" cy="12" r="5" fill="#4a7fb0"/></g>
<text x="114" y="81" font-size="15" fill="#2f3a2b">Glass from above.</text>
<text x="114" y="101" font-size="15" fill="#2f3a2b">Cold: sunny east and south</text>
<text x="114" y="121" font-size="15" fill="#2f3a2b">faces first.</text>
<rect x="8" y="140" width="384" height="64" rx="8" fill="#f4eedf"/>
<rect x="8" y="140" width="96" height="64" rx="8" fill="#cfe0ef"/>
<text x="56" y="168" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Late</text>
<text x="56" y="186" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">morning</text>
<g transform="translate(356 172.0)"><path d="M-18 16 L18 -16" stroke="#cbbf9f" stroke-width="7" stroke-linecap="round" opacity=".7"/><path d="M-14 14 L14 -14 M14 -14 L2 -14 M14 -14 L14 -2" stroke="#e8590c" stroke-width="3.6" fill="none" stroke-linecap="round" transform="translate(0 -2)"/></g>
<text x="114" y="167" font-size="15" fill="#2f3a2b">Air starts to rise uphill</text>
<text x="114" y="187" font-size="15" fill="#2f3a2b">(80%).</text>
<rect x="8" y="210" width="384" height="64" rx="8" fill="#f4eedf"/>
<rect x="8" y="210" width="96" height="64" rx="8" fill="#f1d27a"/>
<text x="56" y="238" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Warm</text>
<text x="56" y="256" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">afternoon</text>
<g transform="translate(356 242.0)"><g transform="translate(0 14) scale(0.8 0.8)"><path d="M-8 -18 L-10 0 M-4 -18 L-3 0 M12 -18 L13 0 M16 -18 L18 0" stroke="#5a3e26" stroke-width="2.4" stroke-linecap="round"/><path d="M-12 -28 C-12 -34 -4 -34 6 -34 C14 -34 20 -32 20 -26 C20 -20 16 -17 8 -17 L-6 -17 C-10 -17 -12 -21 -12 -28z" fill="#8b5a2b"/><path d="M-10 -30 L-16 -42 L-12 -44 L-6 -32z" fill="#8b5a2b"/><path d="M-16 -42 C-20 -43 -24 -40 -24 -38 L-20 -37 C-17 -37 -14 -39 -13 -41z" fill="#8b5a2b"/><path d="M-14 -44 L-18 -50 L-12 -45z M-12 -44 L-9 -50 L-10 -44z" fill="#8b5a2b"/><ellipse cx="18" cy="-27" rx="3" ry="4" fill="#f3ead8"/><circle cx="-18" cy="-41" r=".9" fill="#111"/><path d="M-14 -46 C-16 -54 -10 -60 -4 -60 M-11 -54 L-14 -60" stroke="#6b4f35" stroke-width="1.6" fill="none"/></g></g>
<text x="114" y="237" font-size="15" fill="#2f3a2b">Check north and east</text>
<text x="114" y="257" font-size="15" fill="#2f3a2b">shade where they bed.</text>
<rect x="8" y="280" width="384" height="64" rx="8" fill="#f4eedf"/>
<rect x="8" y="280" width="96" height="64" rx="8" fill="#e8590c"/>
<text x="56" y="317" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Evening</text>
<g transform="translate(356 312.0)"><path d="M-18 16 L18 -16" stroke="#cbbf9f" stroke-width="7" stroke-linecap="round" opacity=".7"/><path d="M-14 -14 L14 14 M14 14 L2 14 M14 14 L14 2" stroke="#e8590c" stroke-width="3.6" fill="none" stroke-linecap="round" transform="translate(0 -2)"/></g>
<text x="114" y="307" font-size="15" fill="#2f3a2b">Air sinks downhill (80%).</text>
<text x="114" y="327" font-size="15" fill="#2f3a2b">Glass from below or across.</text>
<rect x="8" y="350" width="384" height="76" rx="8" fill="#f4eedf"/>
<rect x="8" y="350" width="96" height="76" rx="8" fill="#2b3a55"/>
<text x="56" y="393" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Dusk</text>
<circle cx="356" cy="388.0" r="22" fill="#2b3a55"/>
<g transform="translate(356 388.0)"><circle cx="0" cy="0" r="14" fill="#f3e7b3"/><circle cx="6.3" cy="-3.5" r="11.9" fill="#2b3a55"/></g>
<text x="114" y="373" font-size="15" fill="#2f3a2b">White tails: hayfield edge,</text>
<text x="114" y="393" font-size="15" fill="#2f3a2b">from a fence corner</text>
<text x="114" y="413" font-size="15" fill="#2f3a2b">200 m back.</text>
</svg>
