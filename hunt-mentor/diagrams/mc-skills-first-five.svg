<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Five steps in the first five minutes: 1 approach from behind with the rifle ready; 2 touch the eye with a stick, no blink; 3 cancel the licence, required before handling; 4 photograph it, then unload; 5 plan the cuts to keep the evidence of sex.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">The first five minutes</text><rect x="30" y="46" width="340" height="38" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="54" cy="65" r="13" fill="#e8590c"/><text x="54" y="70" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">1</text><text x="78" y="71" font-size="15" fill="#23261f" text-anchor="start">Approach from behind, rifle ready</text><rect x="30" y="92" width="340" height="38" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="54" cy="111" r="13" fill="#e8590c"/><text x="54" y="116" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">2</text><text x="78" y="117" font-size="15" fill="#23261f" text-anchor="start">Eye touched: no blink</text><rect x="30" y="138" width="340" height="38" rx="8" fill="#f6d7c3" stroke="#8a9a6b" stroke-width="2"/><circle cx="54" cy="157" r="13" fill="#e8590c"/><text x="54" y="162" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">3</text><text x="78" y="163" font-size="15" fill="#23261f" text-anchor="start">Cancel the licence</text><rect x="30" y="184" width="340" height="38" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="54" cy="203" r="13" fill="#e8590c"/><text x="54" y="208" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">4</text><text x="78" y="209" font-size="15" fill="#23261f" text-anchor="start">Photo, then unload</text><rect x="30" y="230" width="340" height="38" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="54" cy="249" r="13" fill="#e8590c"/><text x="54" y="254" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">5</text><text x="78" y="255" font-size="15" fill="#23261f" text-anchor="start">Plan the evidence of sex</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Licence: 99%. Approach: Tip</text>
</svg>
