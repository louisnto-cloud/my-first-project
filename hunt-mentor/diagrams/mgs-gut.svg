<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A goose gut drawn as a tube: bill, gullet, stomach, gizzard with grit that grinds grass, gut, vent. Food passes in about 1.5 hours in brent geese, 70 percent, and grazing geese digest only 27 to 34 percent of grass, 70 percent, so they eat most of the day.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">From bill to dropping in about 1.5 hours</text><line x1="30" y1="120" x2="365" y2="120" stroke="#cdb38a" stroke-width="14"/><circle cx="30" cy="120" r="18" fill="#2f3a2b"/><text x="30" y="80" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Bill</text><circle cx="90" cy="120" r="18" fill="#a1887f"/><text x="90" y="166" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Gullet</text><circle cx="160" cy="120" r="18" fill="#c97b63"/><text x="160" y="80" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Stomach</text><circle cx="230" cy="120" r="26" fill="#6b4f35"/><text x="230" y="166" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Gizzard</text><circle cx="300" cy="120" r="18" fill="#cdb38a"/><text x="300" y="80" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Gut</text><circle cx="365" cy="120" r="18" fill="#2f3a2b"/><text x="365" y="166" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Vent</text><g fill="#fff"><circle cx="222" cy="116" r="2.5" fill="#fff"/><circle cx="228" cy="122" r="2.5" fill="#fff"/><circle cx="234" cy="116" r="2.5" fill="#fff"/><circle cx="240" cy="122" r="2.5" fill="#fff"/></g><text x="230" y="190" font-size="14" fill="#23261f" text-anchor="middle">grit grinds grass</text><rect x="20" y="206" width="170" height="84" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="105.0" y="226" font-size="14" fill="#23261f" text-anchor="middle">Grass passes fast:</text><text x="105.0" y="245" font-size="14" fill="#23261f" text-anchor="middle">about 1.5 hours</text><text x="105.0" y="264" font-size="14" fill="#23261f" text-anchor="middle">(70%, brent geese)</text><rect x="210" y="206" width="170" height="84" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="295.0" y="226" font-size="14" fill="#23261f" text-anchor="middle">Digests only</text><text x="295.0" y="245" font-size="14" fill="#23261f" text-anchor="middle">27 to 34% of grass</text><text x="295.0" y="264" font-size="14" fill="#23261f" text-anchor="middle">(70%) so: eat all day</text>
</svg>
