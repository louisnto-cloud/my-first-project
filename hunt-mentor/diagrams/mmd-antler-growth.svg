<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Five buck heads across the year. January to March: antlers drop and the base scabs. April to May: velvet buds. June to July: fast growth in velvet. August: full size in velvet. September: velvet rubbed off in 24 to 48 hours, antlers hard. Day length drives the cycle. Old bucks drop antlers first.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Antler year (85 to 90%)</text><ellipse cx="42" cy="190" rx="18" ry="24" fill="#8b5a2b"/><text x="42" y="240" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Jan to Mar</text><text x="42" y="258" font-size="14" fill="#23261f" text-anchor="middle">drop, scab</text><ellipse cx="121" cy="190" rx="18" ry="24" fill="#8b5a2b"/><path d="M115 170 L109 161.0 L101 152 M109 161.0 L121 153.8" fill="none" stroke="#9a7b5a" stroke-width="6"/><path d="M127 170 L133 161.0 L141 152 M133 161.0 L121 153.8" fill="none" stroke="#9a7b5a" stroke-width="6"/><text x="121" y="240" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Apr to May</text><text x="121" y="258" font-size="14" fill="#23261f" text-anchor="middle">velvet buds</text><ellipse cx="200" cy="190" rx="18" ry="24" fill="#8b5a2b"/><path d="M194 170 L188 147.0 L180 124 M188 147.0 L200 128.6" fill="none" stroke="#9a7b5a" stroke-width="6"/><path d="M206 170 L212 147.0 L220 124 M212 147.0 L200 128.6" fill="none" stroke="#9a7b5a" stroke-width="6"/><text x="200" y="240" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Jun to Jul</text><text x="200" y="258" font-size="14" fill="#23261f" text-anchor="middle">fast growth</text><ellipse cx="279" cy="190" rx="18" ry="24" fill="#8b5a2b"/><path d="M273 170 L267 135.0 L259 100 M267 135.0 L279 107.0" fill="none" stroke="#9a7b5a" stroke-width="6"/><path d="M285 170 L291 135.0 L299 100 M291 135.0 L279 107.0" fill="none" stroke="#9a7b5a" stroke-width="6"/><text x="279" y="240" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Aug</text><text x="279" y="258" font-size="14" fill="#23261f" text-anchor="middle">full, velvet</text><ellipse cx="358" cy="190" rx="18" ry="24" fill="#8b5a2b"/><path d="M352 170 L346 135.0 L338 100 M346 135.0 L358 107.0" fill="none" stroke="#6b4f35" stroke-width="4"/><path d="M364 170 L370 135.0 L378 100 M370 135.0 L358 107.0" fill="none" stroke="#6b4f35" stroke-width="4"/><path d="M374 110 q 8 6 2 14" fill="none" stroke="#e8590c" stroke-width="3"/><text x="358" y="240" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Sep</text><text x="358" y="258" font-size="14" fill="#23261f" text-anchor="middle">velvet off</text><text x="200" y="60" font-size="14" fill="#23261f" text-anchor="middle">Day length drives it. Velvet off in 24 to 48 h</text><text x="200" y="288" font-size="14" fill="#6b4f35" text-anchor="middle">Old bucks drop antlers first (90%)</text>
</svg>
