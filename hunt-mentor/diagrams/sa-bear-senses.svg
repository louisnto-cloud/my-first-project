<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 258" font-family="sans-serif" role="img" aria-label="Black bear senses. Nose: the best in the bush, far better than a dog. Ears: good, they hear high sounds beyond our range. Eyes: about as good as a person, with colour and good night vision. Most active at dawn and dusk, but any hour.">
<rect x="0" y="0" width="400" height="258" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Black bear senses</text><text x="8" y="78.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Nose</text><rect x="70" y="56" width="230.0" height="34" rx="4" fill="#e8590c"/><text x="295.0" y="78.0" font-size="14" font-weight="bold" fill="#fff" text-anchor="end">best in the bush</text><text x="8" y="134.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Ears</text><rect x="70" y="112" width="161.0" height="34" rx="4" fill="#4a7fb0"/><text x="236.0" y="134.0" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">good, hear high</text><text x="8" y="190.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Eyes</text><rect x="70" y="168" width="138.0" height="34" rx="4" fill="#8a9a6b"/><text x="213.0" y="190.0" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">like ours, sees colour</text><text x="200" y="246" font-size="14" fill="#6b4f35" text-anchor="middle">Most active at dawn and dusk, but any hour.</text>
</svg>
