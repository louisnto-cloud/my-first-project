  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pocket survival kit</text><rect x="30" y="44" width="340" height="200" rx="14" fill="#f3efe2" stroke="#2f3a2b" stroke-width="2"/><rect x="45" y="66" width="60" height="40" rx="6" fill="#e8590c" stroke="#2f3a2b" stroke-width="1"/><text x="75" y="128" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Lighter x2</text><rect x="129" y="66" width="60" height="40" rx="6" fill="#f6c344" stroke="#2f3a2b" stroke-width="1"/><text x="159" y="128" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fire starter</text><rect x="213" y="66" width="60" height="40" rx="6" fill="#e8590c" stroke="#2f3a2b" stroke-width="1"/><text x="243" y="128" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Whistle</text><rect x="297" y="66" width="60" height="40" rx="6" fill="#d4d4d4" stroke="#2f3a2b" stroke-width="1"/><text x="327" y="128" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Space blanket</text><rect x="45" y="156" width="60" height="40" rx="6" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="1"/><text x="75" y="218" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Headlamp</text><rect x="129" y="156" width="60" height="40" rx="6" fill="#9a9a8f" stroke="#2f3a2b" stroke-width="1"/><text x="159" y="218" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Knife</text><rect x="213" y="156" width="60" height="40" rx="6" fill="#4a7fb0" stroke="#2f3a2b" stroke-width="1"/><text x="243" y="218" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Water bag</text><rect x="297" y="156" width="60" height="40" rx="6" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="1"/><text x="327" y="218" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cord 10 m</text><rect x="81" y="256" width="239" height="30" rx="6" fill="#2f3a2b"/><text x="200" y="277" font-size="15" 