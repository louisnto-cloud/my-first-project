<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Pocket survival kit, carried on the body: two lighters, fire starter, whistle, space blanket, headlamp, knife, water bag and 10 metres of cord.">
