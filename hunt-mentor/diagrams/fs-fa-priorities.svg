<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Order of care for an injured hunter: 1, make the scene safe, guns unloaded and no bear. 2, call 911 or send a satellite SOS. 3, stop big bleeding by pressing, packing or using a tourniquet. 4, check breathing and keep the airway open. 5, keep them warm with a pad under and cover over.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Order of care: what kills first</text><circle cx="40" cy="66" r="17.0" fill="#2f3a2b"/><text x="40" y="72" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><rect x="66" y="48" width="314" height="38" rx="8" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="78" y="65" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Scene safe?</text><text x="78" y="81" font-size="14" fill="#5b6152" text-anchor="start">Guns unloaded, no bear</text><circle cx="40" cy="113" r="17.0" fill="#2f3a2b"/><text x="40" y="119" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><rect x="66" y="95" width="314" height="38" rx="8" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="78" y="112" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Call for help</text><text x="78" y="128" font-size="14" fill="#5b6152" text-anchor="start">911 or satellite SOS</text><circle cx="40" cy="160" r="17.0" fill="#e8590c"/><text x="40" y="166" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><rect x="66" y="142" width="314" height="38" rx="8" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="78" y="159" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Stop big bleeding</text><text x="78" y="175" font-size="14" fill="#5b6152" text-anchor="start">Press, pack, tourniquet</text><circle cx="40" cy="207" r="17.0" fill="#2f3a2b"/><text x="40" y="213" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><rect x="66" y="189" width="314" height="38" rx="8" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="78" y="206" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Breathing</text><text x="78" y="222" font-size="14" fill="#5b6152" text-anchor="start">Airway open, recovery side</text><circle cx="40" cy="254" r="17.0" fill="#2f3a2b"/><text x="40" y="260" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><rect x="66" y="236" width="314" height="38" rx="8" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="78" y="253" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Keep warm</text><text x="78" y="269" font-size="14" fill="#5b6152" text-anchor="start">Pad under, cover over</text>
</svg>
