<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" font-family="sans-serif" role="img" aria-label="When rattling and grunting work best for white tails. Mid October is early. Early November, near the rut, is best. Most does conceive about 13 to 17 November. In one Texas study about 65 percent of bucks responded, best on cool, calm, overcast mornings.">
<rect x="0" y="0" width="400" height="200" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">When rattling works best (white tail)</text><rect x="120.0" y="52" width="68.0" height="102" fill="#dfe6d3" opacity=".6"/><text x="154.0" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Sep</text><text x="222.0" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Oct</text><rect x="256.0" y="52" width="68.0" height="102" fill="#dfe6d3" opacity=".6"/><text x="290.0" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Nov</text><text x="358.0" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Dec</text><text x="8" y="77" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Mid October</text><rect x="208.4" y="60" width="47.6" height="24" rx="5" fill="#8a9a6b"/><text x="232.20000000000002" y="77" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">early</text><text x="8" y="111" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Early Nov</text><rect x="256.0" y="94" width="34.0" height="24" rx="5" fill="#e8590c"/><text x="294.0" y="111" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="start">best</text><text x="8" y="145" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Rut peak</text><rect x="283.2" y="128" width="13.6" height="24" rx="5" fill="#8b5a2b"/><text x="300.8" y="145" font-size="14" font-weight="bold" fill="#8b5a2b" text-anchor="start">13 to 17 Nov</text><text x="200" y="188" font-size="14" fill="#6b4f35" text-anchor="middle">One Texas study: about 65% of bucks came in.</text>
</svg>
