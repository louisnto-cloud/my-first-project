<rect x="140" y="56" width="180.0" height="26" rx="4" fill="#e8590c"/>
<text x="326.0" y="75" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">9 kcal/g</text>
