<text x="226.0" y="117" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">4 kcal/g</text>
<text x="132" y="157" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="end">Protein</text>
<rect x="140" y="140" width="80.0" height="26" rx="4" fill="#8a9a6b"/>
<text x="226.0" y="159" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">4 kcal/g</text>
