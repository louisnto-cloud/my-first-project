<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Wind from below converges on the low saddle between two peaks and speeds up through the gap, then spreads out beyond. Scent pours through the gap, so a saddle is not a seat. Tip.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="14" y="26" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Saddles squeeze the wind</text><ellipse cx="80" cy="130" rx="80" ry="55" fill="none" stroke="#8b5a2b" stroke-width="2"/><ellipse cx="320" cy="130" rx="80" ry="55" fill="none" stroke="#8b5a2b" stroke-width="2"/><ellipse cx="80" cy="130" rx="50" ry="34" fill="none" stroke="#8b5a2b" stroke-width="2"/><ellipse cx="320" cy="130" rx="50" ry="34" fill="none" stroke="#8b5a2b" stroke-width="2"/><ellipse cx="80" cy="130" rx="22" ry="15" fill="none" stroke="#8b5a2b" stroke-width="2"/><ellipse cx="320" cy="130" rx="22" ry="15" fill="none" stroke="#8b5a2b" stroke-width="2"/><text x="80" y="135" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Peak</text><text x="320" y="135" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Peak</text><line x1="160" y1="290" x2="191.5" y2="197.3" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/><polygon points="194.0,190.0 184.7,198.5 196.2,202.4" fill="#4a7fb0"/><line x1="190" y1="290" x2="197.8" y2="197.7" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/><polygon points="198.5,190.0 191.5,200.4 203.6,201.5" fill="#4a7fb0"/><line x1="215" y1="290" x2="203.2" y2="197.6" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/><polygon points="202.2,190.0 197.6,201.7 209.6,200.1" fill="#4a7fb0"/><line x1="245" y1="290" x2="209.5" y2="197.2" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/><polygon points="206.8,190.0 205.0,202.4 216.3,198.1" fill="#4a7fb0"/><line x1="200" y1="185" x2="200.0" y2="102.7" stroke="#4a7fb0" stroke-width="6" stroke-linecap="round"/><polygon points="200.0,95.0 193.9,106.0 206.1,106.0" fill="#4a7fb0"/><text x="270" y="170" font-family="sans-serif" font-size="15" fill="#4a7fb0" text-anchor="middle" font-weight="bold">faster</text><line x1="200" y1="90" x2="165.1" y2="50.8" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/><polygon points="160.0,45.0 162.8,57.2 171.8,49.2" fill="#4a7fb0"/><line x1="200" y1="90" x2="234.9" y2="50.8" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/><polygon points="240.0,45.0 228.2,49.2 237.2,57.2" fill="#4a7fb0"/><text x="14" y="250" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Scent pours</text><text x="14" y="268" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">through the gap.</text><text x="14" y="286" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Not a seat (Tip).</text>
</svg>
