<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Wind squeezes through a saddle between two peaks and speeds up. Scent pours through the gap, so do not sit right in it. Tip.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="14" y="26" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Saddles and draws channel the wind</text><ellipse cx="80" cy="150" rx="70" ry="50" fill="none" stroke="#8b5a2b" stroke-width="2"/><ellipse cx="320" cy="150" rx="70" ry="50" fill="none" stroke="#8b5a2b" stroke-width="2"/><ellipse cx="80" cy="150" rx="45" ry="32" fill="none" stroke="#8b5a2b" stroke-width="2"/><ellipse cx="320" cy="150" rx="45" ry="32" fill="none" stroke="#8b5a2b" stroke-width="2"/><line x1="20" y1="120" x2="44.6" y2="144.6" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><polygon points="50.0,150.0 46.5,137.9 37.9,146.5" fill="#4a7fb0"/><line x1="50" y1="120" x2="74.6" y2="144.6" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><polygon points="80.0,150.0 76.5,137.9 67.9,146.5" fill="#4a7fb0"/><line x1="80" y1="120" x2="104.6" y2="144.6" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><polygon points="110.0,150.0 106.5,137.9 97.9,146.5" fill="#4a7fb0"/><line x1="110" y1="150" x2="132.3" y2="150.0" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><polygon points="140.0,150.0 129.0,143.9 129.0,156.1" fill="#4a7fb0"/><line x1="150" y1="150" x2="242.3" y2="150.0" stroke="#4a7fb0" stroke-width="5" stroke-linecap="round"/><polygon points="250.0,150.0 239.0,143.9 239.0,156.1" fill="#4a7fb0"/><text x="200" y="135" font-family="sans-serif" font-size="14" fill="#4a7fb0" text-anchor="middle" font-weight="bold">squeezed: faster</text><line x1="260" y1="150" x2="293.8" y2="124.6" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><polygon points="300.0,120.0 287.6,121.8 294.8,131.4" fill="#4a7fb0"/><line x1="260" y1="150" x2="293.8" y2="175.4" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><polygon points="300.0,180.0 294.8,168.6 287.6,178.2" fill="#4a7fb0"/><text x="80" y="155" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Peak</text><text x="320" y="155" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Peak</text><text x="14" y="280" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Scent pours through the gap. Do not sit in it (Tip).</text>
</svg>
