<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 246" font-family="sans-serif" role="img" aria-label="Landowners and locals cards. Do: always ask permission and thank the landowner after. Do not: assume permission granted once covers the next visit. Do: stop at the ranch house even when the land next door is Crown, and say where you will park. Do: buy fuel, coffee and food in the small town.">
<rect x="0" y="0" width="400" height="246" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Landowners and locals</text><rect x="10" y="44" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(40 78) scale(0.9)"><path d="M-10 18 V-2 M-10 -2 V-14 Q-6 -18 -3 -14 V-4 V-18 Q0 -22 3 -18 V-4 V-16 Q6 -20 9 -16 V2 L14 -6 Q19 -6 16 2 L6 18 Z" fill="#f2d6c0" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="179" cy="60" r="11" fill="#8a9a6b"/><path d="M173 60 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Ask, and</text><text x="68" y="86" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">thank them</text><text x="68" y="104" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">after</text><rect x="203" y="44" width="185" height="92" rx="10" fill="#fdf0e6" stroke="#e8590c" stroke-width="2"/><g transform="translate(233 78) scale(0.9)"><rect x="-18" y="-14" width="36" height="32" rx="3" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-18" y="-14" width="36" height="9" fill="#e8590c"/><path d="M-10 -18 v6 M10 -18 v6" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-10 2 h4 M-2 2 h4 M6 2 h4 M-10 10 h4 M-2 10 h4" stroke="#2f3a2b" stroke-width="3"/></g><circle cx="372" cy="60" r="11" fill="#e8590c"/><path d="M367 55 l10 10 M377 55 l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="261" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Assume last</text><text x="261" y="86" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">year&#x27;s yes</text><text x="261" y="104" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">still counts</text><rect x="10" y="144" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(40 178) scale(0.9)"><path d="M-18 -2 L0 -18 L18 -2" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-14" y="-4" width="28" height="22" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-4" y="6" width="8" height="12" fill="#8b5a2b"/></g><circle cx="179" cy="160" r="11" fill="#8a9a6b"/><path d="M173 160 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="168" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Stop at the</text><text x="68" y="186" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">ranch house</text><text x="68" y="204" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">first</text><rect x="203" y="144" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(233 178) scale(0.9)"><path d="M-12 -10 h20 l-2 26 h-16 z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 -4 q10 0 8 10 q-2 6 -9 5" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6 -16 q3 -4 0 -8 M2 -16 q3 -4 0 -8" stroke="#8a9a6b" stroke-width="2" fill="none"/></g><circle cx="372" cy="160" r="11" fill="#8a9a6b"/><path d="M366 160 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="261" y="168" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Buy fuel and</text><text x="261" y="186" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">coffee in</text><text x="261" y="204" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">town</text>
</svg>
