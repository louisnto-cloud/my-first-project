<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" role="img" aria-label="West to east across BC. On the wet coast side of the Coast Mountains lives the sooty grouse; on the drier Interior side lives the dusky grouse. Both were one species, the blue grouse, until 2006. The Region 2 season table lists SOOTY (Blue); Regions 3 and 8 list DUSKY (Blue)." font-family="sans-serif">
