<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bars of wind drift for a .308 150 grain bullet in a full crosswind. At 100 metres: 2 centimetres in 10 kilometres an hour wind, 4 in 20. At 200 metres: 8 and 17. At 250: 13 and 27. At 300: 20 and 40. The 165 grain bullet drifts about 30 percent less.">
