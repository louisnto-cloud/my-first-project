<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Schematic map of BC, not to scale. The Coast Range splits the deer. West of it: Columbian black tailed deer, including the Fraser Valley. North coast and Haida Gwaii: Sitka black tailed deer, introduced to Haida Gwaii. East of the Coast Range: Rocky Mountain mule deer, including Kamloops. Hybrids occur where they meet.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Three races in BC (schematic)</text><path d="M60 60 L250 50 L330 120 L350 250 L120 260 L80 200 Z" fill="#e9dfa8" stroke="#8a9a6b" stroke-width="2"/><path d="M60 60 L120 58 L150 150 L160 258 L120 260 L80 200 Z" fill="#c9d8c0" stroke="#8a9a6b" stroke-width="2"/><path d="M140 56 L150 150 L160 258" fill="none" stroke="#2f3a2b" stroke-width="4" stroke-dasharray="8 6"/><text x="160" y="120" font-size="14" fill="#2f3a2b" text-anchor="start">Coast</text><text x="160" y="136" font-size="14" fill="#2f3a2b" text-anchor="start">Range</text><ellipse cx="40" cy="110" rx="12" ry="26" fill="#c9d8c0" stroke="#8a9a6b" stroke-width="2"/><text x="14" y="52" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Sitka: Haida Gwaii</text><text x="14" y="160" font-size="14" fill="#23261f" text-anchor="start">(introduced)</text><text x="70" y="238" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Black tail</text><text x="220" y="170" font-size="16" fill="#23261f" text-anchor="middle" font-weight="bold">Mule deer</text><text x="220" y="188" font-size="14" fill="#23261f" text-anchor="middle">interior</text><circle cx="260" cy="215" r="6" fill="#e8590c"/><text x="270" y="220" font-size="14" fill="#e8590c" text-anchor="start">Kamloops</text><circle cx="110" cy="248" r="6" fill="#4a7fb0"/><text x="10" y="280" font-size="14" fill="#4a7fb0" text-anchor="start">Fraser Valley: black tails</text><text x="240" y="280" font-size="14" fill="#6b4f35" text-anchor="start">Hybrids where they meet</text>
</svg>
