<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 392" font-family="sans-serif" role="img" aria-label="Comparison, hunter lore labelled Tip. Old herd bull, drawn with his cows: holds cows and moves them away from a threat, bugles less and grunts, hangs back and circles downwind, slow to come in. Young bull, drawn alone with small antlers: no cows of his own, bugles a lot, comes in fast and curious, easy to call, often not legal. Bulls rarely get to breed before 4 or 5 years old, 90 percent.">
