<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Comparison, hunter lore labelled Tip. Old herd bull: holds cows and moves them away from a threat, bugles less, hangs back and circles downwind, slow to come in. Young bull: no cows of his own, bugles a lot, comes in fast and curious, easy to call, often not legal. The BC account says bulls rarely get to breed before 4 or 5 years old.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Old bull or young bull? (Tip)</text><rect x="10" y="44" width="185" height="200" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><rect x="10" y="44" width="185" height="26" rx="8" fill="#8b5a2b"/><rect x="10" y="58" width="185" height="12" rx="0" fill="#8b5a2b"/><text x="102.5" y="62" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Old herd bull</text><text x="102.5" y="96" font-size="14" fill="#23261f" text-anchor="middle">Holds cows, moves</text><text x="102.5" y="122" font-size="14" fill="#23261f" text-anchor="middle">them away</text><text x="102.5" y="148" font-size="14" fill="#23261f" text-anchor="middle">Bugles less, grunts</text><text x="102.5" y="174" font-size="14" fill="#23261f" text-anchor="middle">Hangs back, circles</text><text x="102.5" y="200" font-size="14" fill="#23261f" text-anchor="middle">downwind</text><text x="102.5" y="226" font-size="14" fill="#23261f" text-anchor="middle">Slow to come in</text><rect x="205" y="44" width="185" height="200" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><rect x="205" y="44" width="185" height="26" rx="8" fill="#8a9a6b"/><rect x="205" y="58" width="185" height="12" rx="0" fill="#8a9a6b"/><text x="297.5" y="62" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Young bull</text><text x="297.5" y="96" font-size="14" fill="#23261f" text-anchor="middle">No cows of his own</text><text x="297.5" y="122" font-size="14" fill="#23261f" text-anchor="middle">Bugles a lot</text><text x="297.5" y="148" font-size="14" fill="#23261f" text-anchor="middle">Comes in fast</text><text x="297.5" y="174" font-size="14" fill="#23261f" text-anchor="middle">and curious</text><text x="297.5" y="200" font-size="14" fill="#23261f" text-anchor="middle">Easy to call</text><text x="297.5" y="226" font-size="14" fill="#23261f" text-anchor="middle">Often not legal</text><text x="200" y="268" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Hunter lore, not studies: Tip</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Bulls rarely breed before 4 or 5 years (90%)</text>
</svg>
