<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="The five bottom bar buttons: Offline Maps saves areas, My Content holds your pins, Tools draws and measures, Insights gives an area report, and Go and Track records your route.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="36" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">The bottom bar</text><rect x="20" y="48" width="360" height="38" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="36" y="72" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Offline Maps</text><text x="220" y="72" font-family="sans-serif" font-size="15" fill="#868e96" text-anchor="start">save areas</text><rect x="20" y="92" width="360" height="38" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="36" y="116" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">My Content</text><text x="220" y="116" font-family="sans-serif" font-size="15" fill="#868e96" text-anchor="start">your pins</text><rect x="20" y="136" width="360" height="38" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="36" y="160" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Tools</text><text x="220" y="160" font-family="sans-serif" font-size="15" fill="#868e96" text-anchor="start">draw, measure</text><rect x="20" y="180" width="360" height="38" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="36" y="204" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Insights</text><text x="220" y="204" font-family="sans-serif" font-size="15" fill="#868e96" text-anchor="start">area report</text><rect x="20" y="224" width="360" height="38" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="36" y="248" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Go &amp; Track</text><text x="220" y="248" font-family="sans-serif" font-size="15" fill="#868e96" text-anchor="start">record</text>
</svg>
