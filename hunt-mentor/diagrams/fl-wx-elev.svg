<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 352" font-family="sans-serif" role="img" aria-label="A mountain cross section. On average air cools about 6.5 degrees for every 1,000 m you climb, so a bench 700 m above the valley is often 4 to 5 degrees colder, and the slopes 1,300 m up, about 8 degrees colder, may hold snow. Cold air can also pool in valleys on calm nights, so it is not always true. Tip.">
