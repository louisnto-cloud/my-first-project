<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A mountain cross section. On average air cools about 6.5 degrees for every 1,000 m you climb, so a bench 700 m above the valley is often 4 to 5 degrees colder, and higher slopes may hold snow. Cold air can also pool in valleys on calm nights, so it is not always true. Tip.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Higher is usually colder</text>
<polygon points="20,270 200,60 380,270" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="3"/>
<polygon points="160,107 200,60 240,107" fill="#ffffff"/>
<line x1="30" y1="250" x2="370" y2="250" stroke="#23261f" stroke-width="1" stroke-linecap="round" stroke-dasharray="5 5"/>
<text x="386" y="244" font-family="sans-serif" font-size="13" font-weight="bold" fill="#23261f" text-anchor="end">Valley, airport</text>
<line x1="30" y1="180" x2="370" y2="180" stroke="#23261f" stroke-width="1" stroke-linecap="round" stroke-dasharray="5 5"/>
<text x="386" y="174" font-family="sans-serif" font-size="13" font-weight="bold" fill="#23261f" text-anchor="end">+ 700 m: about 4 to 5 °C colder</text>
<line x1="30" y1="115" x2="370" y2="115" stroke="#23261f" stroke-width="1" stroke-linecap="round" stroke-dasharray="5 5"/>
<text x="386" y="109" font-family="sans-serif" font-size="13" font-weight="bold" fill="#23261f" text-anchor="end">+ 1,300 m: about 8 °C colder</text>
<text x="200" y="292" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">About 6.5 °C per 1,000 m on average. Not always (Tip)</text>
</svg>
