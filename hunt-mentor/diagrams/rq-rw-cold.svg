<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 364" font-family="sans-serif" role="img" aria-label="Decision chart, tips built on the app bush safety session. Shivering and cold hands: stop, add a dry layer, eat, find shelter. Fumbles, mumbles, stumbles and grumbles: turn back now, together. Shivering stopped with confusion and stiffness: an emergency, call for help. Otherwise you are fine: keep hunting, and eat and drink every hour.">
<rect width="400" height="364" fill="#fffaf0"/>
<text x="14" y="28" font-size="18" font-weight="bold" fill="#2f3a2b">Cold, wet, windy: when to stop (Tip)</text>
<rect x="10" y="44" width="214" height="54" rx="10" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="1.6"/>
<text x="22" y="76" font-size="16" font-weight="bold" fill="#2f3a2b">Shivering, cold hands?</text>
<line x1="224" y1="71.0" x2="254" y2="71.0" stroke="#c2410c" stroke-width="2.4"/><path d="M262 71.0 l-9 -5 v10z" fill="#c2410c"/>
<text x="241" y="63" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">Yes</text>
<rect x="262" y="47" width="128" height="48" rx="8" fill="#c2410c"/>
<text x="326" y="66.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Stop: dry layer,</text>
<text x="326" y="85.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">food, shelter</text>
<line x1="60" y1="98" x2="60" y2="116" stroke="#2f3a2b" stroke-width="2.4"/><path d="M60 124 l-5 -9 h10z" fill="#2f3a2b"/>
<text x="70" y="116" font-size="14" font-weight="bold" fill="#2f3a2b">No</text>
<rect x="10" y="124" width="214" height="58" rx="10" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="1.6"/>
<text x="22" y="148" font-size="16" font-weight="bold" fill="#2f3a2b">Fumbles, mumbles,</text>
<text x="22" y="168" font-size="16" font-weight="bold" fill="#2f3a2b">stumbles, grumbles?</text>
<line x1="224" y1="153.0" x2="254" y2="153.0" stroke="#d9480f" stroke-width="2.4"/><path d="M262 153.0 l-9 -5 v10z" fill="#d9480f"/>
<text x="241" y="145" font-size="14" font-weight="bold" fill="#d9480f" text-anchor="middle">Yes</text>
<rect x="262" y="127" width="128" height="52" rx="8" fill="#d9480f"/>
<text x="326" y="148.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Turn back</text>
<text x="326" y="167.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">now, together</text>
<line x1="60" y1="182" x2="60" y2="200" stroke="#2f3a2b" stroke-width="2.4"/><path d="M60 208 l-5 -9 h10z" fill="#2f3a2b"/>
<text x="70" y="200" font-size="14" font-weight="bold" fill="#2f3a2b">No</text>
<rect x="10" y="208" width="214" height="58" rx="10" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="1.6"/>
<text x="22" y="232" font-size="16" font-weight="bold" fill="#2f3a2b">Shivering stopped,</text>
<text x="22" y="252" font-size="16" font-weight="bold" fill="#2f3a2b">confused, stiff?</text>
<line x1="224" y1="237.0" x2="254" y2="237.0" stroke="#c0392b" stroke-width="2.4"/><path d="M262 237.0 l-9 -5 v10z" fill="#c0392b"/>
<text x="241" y="229" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Yes</text>
<rect x="262" y="211" width="128" height="52" rx="8" fill="#c0392b"/>
<text x="326" y="232.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Emergency:</text>
<text x="326" y="251.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">call for help</text>
<line x1="60" y1="266" x2="60" y2="284" stroke="#2f3a2b" stroke-width="2.4"/><path d="M60 292 l-5 -9 h10z" fill="#2f3a2b"/>
<text x="70" y="284" font-size="14" font-weight="bold" fill="#2f3a2b">No</text>
<rect x="10" y="292" width="380" height="64" rx="12" fill="#2f3a2b"/>
<text x="200" y="321" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">Fine: keep hunting</text>
<text x="200" y="341" font-size="15" fill="#e9e3d3" text-anchor="middle">Eat and drink every hour</text>
</svg>
