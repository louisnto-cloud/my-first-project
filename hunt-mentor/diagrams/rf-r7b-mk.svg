<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 496" font-family="sans-serif" role="img" aria-label="Region 7B, synopsis page 61. Muskwa Kechika Access Management Area and Klingzut Mountain, Map H26: restrictions on vehicles other than aircraft in portions of MUs 7-36, 7-42, 7-43, 7-50, 7-51, 7-52, 7-54 and 7-57. Several trails: travel within 10 metres of the route, vehicles under 750 kilograms only. MU 7-52: a motor vehicle may be used on roads highlighted green on Map 1-58/26 and within 400 metres of them, 1 May to 15 November; that map is not printed in the book, VERIFY. For routes ask the Fort St. John Ministry office, or Ministry of Forests offices in Fort Nelson and Dawson Creek.">
