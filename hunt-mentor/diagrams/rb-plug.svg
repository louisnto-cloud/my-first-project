<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" role="img" aria-label="A pump shotgun with 1 shell in the chamber and 2 in the magazine, and a plug filling the rest of the magazine tube: 3 shells in total. A pump, repeating or auto loading shotgun needs a plug so the magazine holds no more than 2. For ducks the federal rule says the plug must need the gun taken apart to remove. For big game with slugs only, the plug may come out." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="270" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#23261f" text-anchor="middle" font-weight="bold">Shotgun: 3 shells, total</text>
<path d="M14 120 L120 100 L120 132 L22 152 Z" fill="#8b5a2b"/><rect x="118" y="96" width="70" height="30" fill="#2f3a2b"/><rect x="186" y="100" width="200" height="12" fill="#2f3a2b"/>
<rect x="186" y="114" width="180" height="12" rx="4" fill="#4d4d4d"/>
<rect x="150" y="102" width="34" height="9" rx="3" fill="#c92a2a"/>
<rect x="192" y="115" width="32" height="10" rx="3" fill="#c92a2a"/><rect x="226" y="115" width="32" height="10" rx="3" fill="#c92a2a"/>
<rect x="260" y="115" width="100" height="10" rx="3" fill="#8a9a6b"/>
<text x="167" y="90" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">1 chamber</text>
<text x="225" y="148" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">2 magazine</text>
<text x="310" y="148" font-size="14" fill="#5c7a3a" text-anchor="middle" font-weight="bold">plug</text>
<text x="14" y="186" font-size="15" fill="#23261f" text-anchor="start">Pump or semi auto: a plug so the magazine</text>
<text x="14" y="207" font-size="15" fill="#23261f" text-anchor="start">holds no more than 2. Plug must need the</text>
<text x="14" y="228" font-size="15" fill="#23261f" text-anchor="start">gun taken apart (ducks, federal).</text>
<text x="14" y="249" font-size="15" fill="#23261f" text-anchor="start">Big game with slugs only: plug may come out.</text>
</svg>
