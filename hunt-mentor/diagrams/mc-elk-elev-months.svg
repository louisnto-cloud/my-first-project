<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of where elk tend to be by month, in metres, from the app migration data. January to April: 0 to about 1,200 or 1,300 m on winter range. May: 300 to 2,000 m while migrating. June to August: 1,000 to 2,300 m. September: 800 to 2,200 m. October: 600 to 2,000 m. November: 0 to 1,500 m. December: 0 to 1,200 m. A general pattern, 55 to 70 percent.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Elevation by month (general pattern)</text><line x1="46" y1="250.0" x2="390" y2="250.0" stroke="#8a9a6b" stroke-width="1" stroke-dasharray="3 4"/><text x="42" y="255.0" font-size="14" fill="#6b4f35" text-anchor="end">0</text><line x1="46" y1="166.66666666666669" x2="390" y2="166.66666666666669" stroke="#8a9a6b" stroke-width="1" stroke-dasharray="3 4"/><text x="42" y="171.66666666666669" font-size="14" fill="#6b4f35" text-anchor="end">1000</text><line x1="46" y1="83.33333333333334" x2="390" y2="83.33333333333334" stroke="#8a9a6b" stroke-width="1" stroke-dasharray="3 4"/><text x="42" y="88.33333333333334" font-size="14" fill="#6b4f35" text-anchor="end">2000</text><rect x="50" y="150" width="22" height="100" rx="3" fill="#4a7fb0"/><text x="61" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">J</text><rect x="78" y="150" width="22" height="100" rx="3" fill="#4a7fb0"/><text x="89" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">F</text><rect x="106" y="150" width="22" height="100" rx="3" fill="#4a7fb0"/><text x="117" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">M</text><rect x="134" y="142" width="22" height="108" rx="3" fill="#4a7fb0"/><text x="145" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A</text><rect x="162" y="83" width="22" height="142" rx="3" fill="#8a9a6b"/><text x="173" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">M</text><rect x="190" y="58" width="22" height="108" rx="3" fill="#8a9a6b"/><text x="201" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">J</text><rect x="218" y="58" width="22" height="108" rx="3" fill="#8a9a6b"/><text x="229" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">J</text><rect x="246" y="58" width="22" height="108" rx="3" fill="#8a9a6b"/><text x="257" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A</text><rect x="274" y="67" width="22" height="117" rx="3" fill="#e8590c"/><text x="285" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">S</text><rect x="302" y="83" width="22" height="117" rx="3" fill="#e8590c"/><text x="313" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">O</text><rect x="330" y="125" width="22" height="125" rx="3" fill="#4a7fb0"/><text x="341" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">N</text><rect x="358" y="150" width="22" height="100" rx="3" fill="#4a7fb0"/><text x="369" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">D</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Metres. Pattern, not collar data (55 to 70%)</text>
