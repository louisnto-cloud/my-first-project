<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three north arrows at Heffley Creek: true north straight up; magnetic north about 15 degrees east of it; UTM grid north about 2.5 degrees east of true north. Declination from the NOAA World Magnetic Model calculator for October 2026, 95 percent; grid angle my calculation, 85 percent.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Three norths near Kamloops</text><circle cx="200" cy="250" r="6" fill="#23261f"/><line x1="200" y1="250" x2="200.0" y2="72.0" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round"/><polygon points="200.0,60.0 194.0,72.0 206.0,72.0" fill="#2f3a2b"/><text x="200" y="52" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">True north (star)</text><line x1="200" y1="250" x2="246.66967379807392" y2="78.22706398392856" stroke="#c92a2a" stroke-width="4" stroke-linecap="round"/><polygon points="249.8,66.6 240.9,76.7 252.5,79.8" fill="#c92a2a"/><text x="261.3890790136095" y="78.85676708342697" font-size="15" fill="#c92a2a" text-anchor="start" font-weight="bold">Magnetic</text><text x="261.3890790136095" y="96.85676708342697" font-size="14" fill="#c92a2a" text-anchor="start">about 15° east</text><line x1="200" y1="250" x2="207.4152958521071" y2="80.16180233108417" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 5"/><text x="186" y="130" font-size="15" fill="#4a7fb0" text-anchor="end" font-weight="bold">Grid</text><text x="186" y="148" font-size="14" fill="#4a7fb0" text-anchor="end">about 2.5° east</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">NOAA WMM, Oct 2026 (95%). Grid: my calc (85%)</text>
</svg>
