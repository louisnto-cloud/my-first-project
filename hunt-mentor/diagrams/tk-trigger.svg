"165" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><circle cx="270.83333333333337" cy="160" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="270.83333333333337" y="165" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><circle cx="24" cy="195" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="200" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="40" y="200" font-size="14" fill="#17201A" text-anchor="start">Below 11 N (2.5 lb): never</text><circle cx="24" cy="217" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="222" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="40" y="222" font-size="14" fill="#17201A" text-anchor="start">Factory: 13 to 15 N (about 3 lb)</text><circle cx="24" cy="239" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="244" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="40" y="244" font-size="14" fill="#17201A" text-anchor="start">Allowed range: 11 to 18 N</text><rect x="12" y="270" width="376" height="52" rx="8" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="24" y="292" font-size="14" fill="#17201A" text-anchor="start">2.5 mm Allen key in the magazine well.</text><text x="24" y="312" font-size="14" fill="#17201A" text-anchor="start">Any other trigger change: gunsmith.</text>
</svg>
