<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 334" font-family="sans-serif" role="img" aria-label="Trigger weight on the Tikka, a scale in newtons: 1 below 11 newtons, 2.5 pounds, is in orange: never; 2 the factory setting is 13 to 15 newtons, about 3 pounds; 3 the allowed range is 11 to 18 newtons. The adjusting screw takes a 2.5 mm Allen key through the magazine well. Any other trigger change is a gunsmith job.">
<rect x="0" y="0" width="400" height="334" fill="#EEF1EA"/>
