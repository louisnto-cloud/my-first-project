<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 275" role="img" aria-label="Cards: Hunting area maps. Map C2, MU 3-17: The only part of 3-17 open for mature bighorn rams. Map C18, MU 3-30: No sharp tailed grouse south of the Scottie Creek FSR (5040 FSR). Map C21 Camelsfoot, MU 3-32: Closed to mountain sheep hunting." font-family="sans-serif">
