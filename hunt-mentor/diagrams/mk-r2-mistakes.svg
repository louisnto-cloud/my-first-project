<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 371" font-family="sans-serif" role="img" aria-label="3 common mistakes. A doe in the Stave hills in October: &quot;the limit is 2, one antlerless&quot;, fix: No antlerless season in 2-8. Ducks on the Fraser at Mission without the special licence, fix: Special licence and the $1,000,000 insurance. Driving into Pitt Addington Marsh in October, fix: Closed to vehicles all year.">
