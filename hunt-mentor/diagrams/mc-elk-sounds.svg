<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Elk sounds. Bugle: a bull in the rut, a low roar rising to a high whistle and ending in grunts. Mew: cow and calf contact call. Chirp: short call that keeps the herd in touch. Bark: alarm, you have been seen and the herd may run. Splashing or grunting at a wallow means a bull is close.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Elk sounds and what they mean</text><rect x="10" y="46" width="80" height="42" rx="8" fill="#e8590c"/><text x="50" y="73" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Bugle</text><rect x="96" y="46" width="294" height="42" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="1.5"/><text x="106" y="73" font-size="14" fill="#23261f" text-anchor="start">Bull, rut: low roar, high whistle, grunts</text><rect x="10" y="100" width="80" height="42" rx="8" fill="#8a9a6b"/><text x="50" y="127" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Mew</text><rect x="96" y="100" width="294" height="42" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="106" y="127" font-size="14" fill="#23261f" text-anchor="start">Cow and calf contact call</text><rect x="10" y="154" width="80" height="42" rx="8" fill="#8a9a6b"/><text x="50" y="181" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Chirp</text><rect x="96" y="154" width="294" height="42" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="106" y="181" font-size="14" fill="#23261f" text-anchor="start">Short call, herd keeps in touch</text><rect x="10" y="208" width="80" height="42" rx="8" fill="#b03a2e"/><text x="50" y="235" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Bark</text><rect x="96" y="208" width="294" height="42" rx="8" fill="#fffaf0" stroke="#b03a2e" stroke-width="1.5"/><text x="106" y="235" font-size="14" fill="#23261f" text-anchor="start">Alarm: you are seen. Herd may run</text><text x="200" y="274" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Splashing or grunts at a wallow: bull close</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Bugle: BC account. Others: hunting guides</text>
</svg>
