<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Map versus land drill step 1: at home, pick five features on the Hunt Map near Heffley Creek and mark them as waypoints.">
