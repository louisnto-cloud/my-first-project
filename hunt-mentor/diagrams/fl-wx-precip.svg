<text x="78" y="234.365" font-family="sans-serif" font-size="12" font-weight="bold" fill="#23261f" text-anchor="middle">23.1</text><text x="118" y="232.24" font-family="sans-serif" font-size="12" font-weight="bold" fill="#23261f" text-anchor="middle">25.6</text>
<text x="98" y="280" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Kamloops</text>
<rect x="180" y="137.26" width="36" height="122.74" rx="3" fill="#e8590c"/><rect x="220" y="61.86500000000001" width="36" height="198.135" rx="3" fill="#8b5a2b"/>
<text x="198" y="131.26" font-family="sans-serif" font-size="12" font-weight="bold" fill="#23261f" text-anchor="middle">144.4</text><text x="238" y="55.86500000000001" font-family="sans-serif" font-size="12" font-weight="bold" fill="#23261f" text-anchor="middle">233.1</text>
<text x="218" y="280" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Abbotsford</text>
<rect x="300" y="241.47" width="36" height="18.53" rx="3" fill="#e8590c"/><rect x="340" y="235.01" width="36" height="24.99" rx="3" fill="#8b5a2b"/>
<text x="318" y="235.47" font-family="sans-serif" font-size="12" font-weight="bold" fill="#23261f" text-anchor="middle">21.8</text><text x="358" y="229.01" font-family="sans-serif" font-size="12" font-weight="bold" fill="#23261f" text-anchor="middle">29.4</text>
<text x="338" y="280" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Osoyoos</text>
