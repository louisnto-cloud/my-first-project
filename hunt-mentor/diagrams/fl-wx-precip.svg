<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" role="img" aria-label="Average precipitation, 1991 to 2020 normals. Kamloops: October 23 mm, November 26 mm. Abbotsford: October 144 mm, November 233 mm. Osoyoos: October 22 mm, November 29 mm. The Fraser Valley is many times wetter.">
  <rect x="0" y="0" width="400" height="310" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">October and November precipitation</text>
