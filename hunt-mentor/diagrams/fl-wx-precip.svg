<rect x="280" y="110" width="14" height="14" rx="2" fill="#e8590c"/><text x="300" y="122" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">October mm</text><rect x="280" y="132" width="14" height="14" rx="2" fill="#8b5a2b"/><text x="300" y="144" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">November mm</text>
<text x="200" y="300" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fraser Valley: 6 to 9 times wetter (95%)</text>
