<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 342" font-family="sans-serif" role="img" aria-label="The CZ 457 seen from underneath: 1 the front connecting screw, part 73, ahead of the magazine, and 2 the rear connecting screw, part 74, behind the trigger guard. CZ says check them and tighten to 3.5 newton metres."><rect x="0" y="0" width="400" height="342" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Stock screws, from below</text><path d="M20 150 L120 140 Q150 128 180 136 L340 140 Q372 142 384 150 Q372 158 340 160 L180 164 Q150 172 120 160 L20 150 Z" fill="#9A6B3F"/><rect x="196" y="140" width="40" height="20" rx="3" fill="#2B3034"/><path d="M150 136 L150 164 L190 164 L190 136 Z" fill="#4A5156"/><circle cx="244" cy="150" r="6" fill="#D8B23A" stroke="#2B3034"/><circle cx="142" cy="150" r="6" fill="#D8B23A" stroke="#2B3034"/><circle cx="244" cy="110" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="244" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><line x1="244" y1="121" x2="244" y2="144" stroke="#17201A" stroke-width="1.4"/><circle cx="142" cy="110" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="142" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text><line x1="142" y1="121" x2="142" y2="144" stroke="#17201A" stroke-width="1.4"/><text x="60" y="136" font-size="14" font-weight="bold" text-anchor="middle" fill="#17201A">Butt</text><text x="350" y="136" font-size="14" font-weight="bold" text-anchor="middle" fill="#17201A">Muzzle</text><circle cx="26" cy="209" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="214" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><text x="42" y="214" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Front connecting screw (part 73)</text><circle cx="26" cy="235" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="240" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text><text x="42" y="240" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Rear connecting screw (part 74)</text><rect x="8" y="268" width="384" height="34" rx="9" fill="#1F3D2B"/><text x="200" y="290.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Check and tighten to 3.5 Nm (CZ)</text><text x="16" y="330" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Torque driver: a Tip, not a guess.</text></svg>
