<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif" role="img" aria-label="Two pictures. Left: a grouse up in a tree with only sky behind it; the bullet keeps going, a .22 can carry over a kilometre, so no shot. Right: a grouse on the ground on a slope with earth behind; the bullet stops in the dirt, so the shot can be safe."><rect x="0" y="0" width="400" height="320" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Earth behind every shot</text><rect x="12" y="44" width="184" height="200" rx="8" fill="#CFE3EE"/><rect x="204" y="44" width="184" height="200" rx="8" fill="#CFE3EE"/><path d="M204 150 Q300 120 388 160 L388 244 L204 244 Z" fill="#7A6A4F"/><path d="M12 210 L196 210 L196 244 L12 244 Z" fill="#7A6A4F"/><rect x="57" y="110" width="6" height="100" fill="#6E4A2A"/><path d="M34 150 L60 70 L86 150 Z" fill="#1F3D2B"/><rect x="147" y="110" width="6" height="100" fill="#6E4A2A"/><path d="M124 150 L150 70 L176 150 Z" fill="#1F3D2B"/><ellipse cx="150" cy="96" rx="10" ry="7" fill="#9A6B3F"/><ellipse cx="300" cy="150" rx="11" ry="7" fill="#9A6B3F"/><line x1="40" y1="230" x2="139.1" y2="106.6" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><path d="M146 98 L134.4 102.8 L143.8 110.3z" fill="#FF6A13"/><line x1="156" y1="92" x2="196" y2="60" stroke="#FF6A13" stroke-width="2" stroke-dasharray="5 4"/><line x1="240" y1="236" x2="286.1" y2="163.3" stroke="#1F3D2B" stroke-width="3" stroke-linecap="round"/><path d="M292 154 L281.0 160.1 L291.2 166.5z" fill="#1F3D2B"/><text x="104" y="268" font-size="16" font-weight="bold" text-anchor="middle" fill="#FF6A13">NO: sky behind</text><text x="296" y="268" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F3D2B">YES: earth behind</text><text x="104" y="290" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">A .22 can carry</text><text x="104" y="308" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">over 1 km (65%)</text><text x="296" y="290" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">Bullet stops in</text><text x="296" y="308" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">the dirt</text></svg>
