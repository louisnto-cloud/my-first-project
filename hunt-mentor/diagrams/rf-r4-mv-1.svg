<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 588" font-family="sans-serif" role="img" aria-label="Cards of vehicle closures in Management Units 4-1 to 4-7, page 37. A star means closed to all motor vehicles; the other symbols close vehicles for hunting use. 4-1: McDougall Wildlife Sanctuary, Map D1, Upper Flathead and East Flathead closed to all vehicles. 4-2: Wigwam Flats, Mt. Broadwood and Sportsman Ridge, Galton Range and Upper Wigwam closed to all vehicles; Soowa Mountain closed for hunting use 1 September to 30 June. 4-3: Purcell Creek and Elizabeth Lake, Map D2, closed for hunting use in spring and 1 September to 28 February; Linklater Creek Access Management Area closed to all vehicles; Linklater Motor Vehicles for Hunting Closed Area 1 September to 30 November. 4-4: Hawkins Creek watershed and Mt. Mahon slopes, spring and fall. 4-5: Irishman Creek spring and fall; Lamb Creek 1 September to 30 June. 4-6: Channel Road closed 15 March to 30 April and 15 August to 15 October; Leadville Creek and Sanca Creek slopes closed to all vehicles. 4-7: Topaz Creek spring and fall; Corn Creek north side closed 1 September to 1 June; Corn Creek Forest Service Road open.">
