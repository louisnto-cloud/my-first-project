<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Maximum point blank range drawn as a 20 cm pipe. The bullet path rises to 9 cm high at 100 m, crosses the crosshair at 230 m and leaves the bottom of the pipe at about 270 m. Inside that, hold dead centre.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">Point blank range: the pipe idea</text><rect x="30.0" y="100" width="345.0" height="100" fill="#e8590c" fill-opacity=".12" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="6 4"/><text x="34.6" y="92" font-size="14" font-weight="bold" fill="#e8590c">20 cm pipe (deer vitals)</text><line x1="30.0" y1="150" x2="375.0" y2="150" stroke="#2f3a2b" stroke-width="1.5" stroke-dasharray="3 4"/><text x="34.0" y="166" font-size="12" fill="#2f3a2b">crosshair</text><path d="M30.0 169.0 C39.6 162.1, 68.3 138.2, 87.5 127.5 C106.7 116.8, 128.7 109.3, 145.0 105.0 C161.3 100.7, 171.8 100.7, 185.2 101.5 C198.7 102.3, 207.3 101.9, 225.5 110.0 C243.7 118.1, 275.3 135.0, 294.5 150.0 C313.7 165.0, 327.1 185.0, 340.5 200.0 C353.9 215.0, 369.2 233.3, 375.0 240.0" fill="none" stroke="#23261f" stroke-width="3"/><circle cx="294.5" cy="150" r="5" fill="#2f3a2b"/><text x="294.5" y="138" font-size="13" font-weight="bold" text-anchor="middle" fill="#23261f">zero 230 m</text><circle cx="145.0" cy="105" r="5" fill="#2f3a2b"/><text x="145.0" y="127" font-size="13" font-weight="bold" text-anchor="middle" fill="#23261f">9 cm high</text><circle cx="340.5" cy="200" r="6" fill="#b3261e"/><text x="330.5" y="226" font-size="15" font-weight="bold" text-anchor="end" fill="#b3261e">MPBR 270 m</text><text x="30.0" y="284" font-size="13" text-anchor="middle" fill="#23261f">0 m</text><text x="145.0" y="284" font-size="13" text-anchor="middle" fill="#23261f">100 m</text><text x="260.0" y="284" font-size="13" text-anchor="middle" fill="#23261f">200 m</text><text x="375.0" y="284" font-size="13" text-anchor="middle" fill="#23261f">300 m</text><text x="200" y="262" font-size="13" text-anchor="middle" fill="#2f3a2b">150 gr, 20 cm zone. Hold centre, no hold over</text>
</svg>
