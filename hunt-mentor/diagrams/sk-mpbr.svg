<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 353.0" font-family="sans-serif" role="img" aria-label="Maximum point blank range, MPBR, drawn as a 20 cm pipe the size of deer vitals. For a 150 grain bullet the path rises to 9 cm high at 100 m, crosses the crosshair at the 230 m zero and leaves the bottom of the pipe at about 270 m. Inside that, hold dead centre, no hold over.">
<rect width="400" height="353.0" fill="#fffaf0"/>
