<circle cx="287.6" cy="150" r="5" fill="#2f3a2b"/>
<circle cx="332.4" cy="190.0" r="6" fill="#c0392b"/>
<text x="32" y="100" font-size="16" font-weight="bold" fill="#c2410c">20 cm pipe (deer vitals)</text>
<text x="142" y="140" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle" stroke="#fde3d3" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">9 cm high</text>
<text x="283.12" y="172" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="end" stroke="#fde3d3" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">zero 230 m</text>
<text x="70.32" y="170" font-size="15" fill="#2f3a2b" stroke="#fde3d3" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">crosshair</text>
<line x1="332.4" y1="196.0" x2="332.4" y2="212.0" stroke="#c0392b" stroke-width="1.6"/>
<text x="332.4" y="230" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="middle">MPBR 270 m</text>
<line x1="30.0" y1="256.0" x2="366.0" y2="256.0" stroke="#6b5b4b" stroke-width="1.4"/>
<line x1="30.0" y1="256.0" x2="30.0" y2="262.0" stroke="#6b5b4b" stroke-width="1.4"/>
