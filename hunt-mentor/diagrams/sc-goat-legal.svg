<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Three goat groups. A lone nanny: legal, but a poor choice, a tip. A nanny with a kid: unlawful to hunt, 98 percent. A group with one or more kids: unlawful to hunt any female in it, 98 percent. The Ministry asks hunters to shoot billies only." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Which goat is off limits?</text>
