<text x="70" y="212" font-size="14" fill="#23261f" text-anchor="middle">Legal,</text>
<text x="70" y="230" font-size="14" fill="#23261f" text-anchor="middle">poor choice</text>
<text x="70" y="248" font-size="14" fill="#23261f" text-anchor="middle">(Tip)</text>
<text x="200" y="62" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Nanny + kid</text>
