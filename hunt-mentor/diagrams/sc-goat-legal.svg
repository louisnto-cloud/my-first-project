<text x="330" y="212" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Any female in</text>
<text x="330" y="230" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">it: unlawful</text>
<text x="330" y="248" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">(98%)</text>
<line x1="135" y1="50" x2="135" y2="260" stroke="#8a9a6b" stroke-dasharray="6 6" stroke-width="2"/>
