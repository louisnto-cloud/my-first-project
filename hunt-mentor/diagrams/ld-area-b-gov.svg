<text x="78" y="376" font-size="15" fill="#2f3a2b">days (85%)</text>
<circle cx="41.0" cy="428.0" r="20" fill="#fffaf0" stroke="#8b5a2b" stroke-width="2"/>
<g transform="translate(41.0 428.0) scale(0.8)" fill="#8b5a2b" stroke="none"><path d="M-14 2 C-10 -4 -2 -4 2 -1 L6 -6 C9 -9 13 -7 14 -4 L10 -3 L9 1 C7 7 -4 9 -14 2z"/></g>
<text x="78" y="414" font-size="16" font-weight="bold" fill="#2f3a2b">Boundary Bay WMA</text>
