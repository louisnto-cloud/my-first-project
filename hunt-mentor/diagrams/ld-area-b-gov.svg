<text x="78" y="490" font-size="16" font-weight="bold" fill="#2f3a2b">Bert Brink WMA</text>
<text x="78" y="509" font-size="15" fill="#2f3a2b">MU 2-4. Hunting status: VERIFY (85%)</text>
<circle cx="41.0" cy="551.5" r="20" fill="#fffaf0" stroke="#8b5a2b" stroke-width="2"/>
<g transform="translate(41.0 551.5) scale(0.8)" fill="#8b5a2b" stroke="none"><path d="M-14 2 C-10 -4 -2 -4 2 -1 L6 -6 C9 -9 13 -7 14 -4 L10 -3 L9 1 C7 7 -4 9 -14 2z"/></g>
<text x="78" y="547" font-size="16" font-weight="bold" fill="#2f3a2b">Harrison Chehalis WMA</text>
<text x="78" y="566" font-size="15" fill="#2f3a2b">Harrison Mills. Status: VERIFY (85%)</text>
<rect x="8" y="589" width="384" height="30" rx="6" fill="#c0392b"/>
<g transform="translate(31 604) scale(0.62)" fill="#fffaf0" stroke="none"><circle r="13" fill="none" stroke="#fffaf0" stroke-width="3.5"/><path d="M-9 -9 L9 9" stroke="#fffaf0" stroke-width="3.5"/></g>
<text x="50" y="610" font-size="15" font-weight="bold" fill="#fffaf0" letter-spacing="1">NO SEASON</text>
<rect x="8" y="625" width="384" height="55" rx="6" fill="#f4eedf"/>
<rect x="14" y="637.5" width="54" height="30" rx="6" fill="#c0392b"/>
<text x="41" y="658.3" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">2-3</text>
<text x="78" y="648" font-size="16" font-weight="bold" fill="#2f3a2b">Herrling Island</text>
<text x="78" y="667" font-size="15" fill="#2f3a2b">MU 2-3. White tails, but no season (99%)</text>
