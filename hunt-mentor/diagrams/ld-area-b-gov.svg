<text x="78" y="452" font-size="15" fill="#2f3a2b">(85%)</text>
<rect x="8" y="467" width="384" height="55" rx="6" fill="#f4eedf"/>
<circle cx="41.0" cy="494.5" r="20" fill="#fffaf0" stroke="#8b5a2b" stroke-width="2"/>
