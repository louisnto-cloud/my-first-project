<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" font-family="sans-serif" role="img" aria-label="Bar chart of resident moose hunter success in MU 3-27, 2020 to 2024: 4.4, 11.4, 6.4, 8.3 and 8.6 percent. About 1 in 12 hunters got a moose; about 77 hunter days per moose. Includes Limited Entry Hunting.">
<rect x="0" y="0" width="400" height="280" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">MU 3-27: share of hunters with a moose</text><text x="72" y="62" font-size="14" fill="#23261f" text-anchor="end">2020</text><rect x="80" y="44" width="81.7" height="24" rx="3" fill="#e8590c"/><text x="167.71428571428572" y="62" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">4.4%</text><text x="72" y="94" font-size="14" fill="#23261f" text-anchor="end">2021</text><rect x="80" y="76" width="211.7" height="24" rx="3" fill="#e8590c"/><text x="285.7142857142857" y="94" font-size="14" fill="#fffaf0" text-anchor="end" font-weight="bold">11.4%</text><text x="72" y="126" font-size="14" fill="#23261f" text-anchor="end">2022</text><rect x="80" y="108" width="118.9" height="24" rx="3" fill="#e8590c"/><text x="204.85714285714286" y="126" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">6.4%</text><text x="72" y="158" font-size="14" fill="#23261f" text-anchor="end">2023</text><rect x="80" y="140" width="154.1" height="24" rx="3" fill="#e8590c"/><text x="240.14285714285714" y="158" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">8.3%</text><text x="72" y="190" font-size="14" fill="#23261f" text-anchor="end">2024</text><rect x="80" y="172" width="159.7" height="24" rx="3" fill="#e8590c"/><text x="233.71428571428572" y="190" font-size="14" fill="#fffaf0" text-anchor="end" font-weight="bold">8.6%</text><text x="200" y="222" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">MU 3-27 resident moose hunters</text><text x="200" y="239" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">About 1 in 12 got a moose</text><text x="200" y="256" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">About 77 hunter days per moose</text>
</svg>
