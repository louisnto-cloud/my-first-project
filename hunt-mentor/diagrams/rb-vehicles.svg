<rect x="6" y="40" width="191" height="30" rx="10" fill="#c92a2a"/><rect x="6" y="58" width="191" height="12" fill="#c92a2a"/>
<text x="101.5" y="61" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Yes</text>
<g transform="translate(71.5 102) scale(0.8)"><rect x="-34" y="-14" width="40" height="22" rx="3" fill="#4a7fb0"/><path d="M6 -14 L22 -14 L32 -2 L32 8 L6 8 Z" fill="#4a7fb0"/><path d="M10 -10 L20 -10 L27 -2 L10 -2 Z" fill="#ffffff"/><circle cx="-20" cy="10" r="7" fill="#2f3a2b"/><circle cx="20" cy="10" r="7" fill="#2f3a2b"/></g><g transform="translate(141.5 104) scale(0.8)"><path d="M-24 0 L-14 -12 L16 -12 L24 0 Z" fill="#8a9a6b"/><rect x="-4" y="-20" width="4" height="10" fill="#2f3a2b"/><rect x="-10" y="-22" width="16" height="3" fill="#2f3a2b"/><circle cx="-18" cy="6" r="9" fill="#2f3a2b"/><circle cx="18" cy="6" r="9" fill="#2f3a2b"/></g>
<text x="101.5" y="158" font-size="14" fill="#23261f" text-anchor="middle">Truck, car</text>
<text x="101.5" y="176" font-size="14" fill="#23261f" text-anchor="middle">Quad (also an ATV)</text>
<text x="101.5" y="194" font-size="14" fill="#23261f" text-anchor="middle">Side by side (ATV)</text>
<text x="101.5" y="212" font-size="14" fill="#23261f" text-anchor="middle">Dirt bike (ATV)</text>
