<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-label="Is it a motor vehicle under the Wildlife Act definitions. Yes: truck, car, quad, side by side, dirt bike and snowmobile. Quads, side by sides and dirt bikes are also ATVs; a snowmobile is not an ATV. No, for these rules: canoe, sailboat, motorboat, bicycle, horse and train." font-family="sans-serif">
