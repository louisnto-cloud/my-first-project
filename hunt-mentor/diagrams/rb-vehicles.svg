<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" font-family="sans-serif" role="img" aria-label="Is it a motor vehicle under the Wildlife Act definitions. Yes: truck, car, quad, side by side, dirt bike and snowmobile. Quads, side by sides and dirt bikes are also ATVs; a snowmobile is not an ATV. No, for these rules: canoe, sailboat, motorboat, bicycle, horse and train.">
<rect width="400" height="296" fill="#fffaf0"/>
<text x="200" y="28" font-size="20" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Is it a motor vehicle?</text>
<rect x="8" y="42" width="188" height="246" rx="10" fill="#ffffff" stroke="#b3261e" stroke-width="2.5"/>
<path d="M8 52 a10 10 0 0 1 10 -10 h168 a10 10 0 0 1 10 10 v24 h-188z" fill="#b3261e"/>
<text x="102" y="66" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Yes</text>
<text x="102" y="180" font-size="16" fill="#2f3a2b" text-anchor="middle">Truck, car</text>
<text x="102" y="204" font-size="16" fill="#2f3a2b" text-anchor="middle">Quad (also an ATV)</text>
<text x="102" y="228" font-size="16" fill="#2f3a2b" text-anchor="middle">Side by side (ATV)</text>
<text x="102" y="252" font-size="16" fill="#2f3a2b" text-anchor="middle">Dirt bike (ATV)</text>
<text x="102" y="276" font-size="16" fill="#2f3a2b" text-anchor="middle">Snowmobile (not ATV)</text>
<rect x="204" y="42" width="188" height="246" rx="10" fill="#ffffff" stroke="#4f6d2f" stroke-width="2.5"/>
<path d="M204 52 a10 10 0 0 1 10 -10 h168 a10 10 0 0 1 10 10 v24 h-188z" fill="#4f6d2f"/>
<text x="298" y="66" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">No, for these rules</text>
<text x="298" y="180" font-size="16" fill="#2f3a2b" text-anchor="middle">Canoe, sailboat</text>
<text x="298" y="204" font-size="16" fill="#2f3a2b" text-anchor="middle">Motorboat</text>
<text x="298" y="228" font-size="16" fill="#2f3a2b" text-anchor="middle">Bicycle, horse</text>
<text x="298" y="252" font-size="16" fill="#2f3a2b" text-anchor="middle">Train</text>
