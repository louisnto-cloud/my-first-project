<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Parts of a pump shotgun, side view, muzzle to the right: stock, grip, trigger and guard, safety, receiver, ejection port, fore end, magazine tube and cap, barrel with rib and bead, choke tube at the muzzle.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Parts of a shotgun</text>
<g transform="translate(10 120) scale(1.0)"><path d="M0 16 L7 14 L92 22 L108 22 L108 38 L97 40 C88 42 81 46 75 53 L6 57 L0 57 Z" fill="#6b5a45" stroke="#17201A" stroke-width="0.7"/><path d="M0 16 L5 15 L5 57 L0 57 Z" fill="#3b4045"/><rect x="108" y="18" width="54" height="22" rx="2" fill="#5d646b" stroke="#17201A" stroke-width="0.7"/><rect x="122" y="21.5" width="27" height="8.5" rx="1" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><rect x="138" y="22.5" width="10" height="6.5" fill="#a7aeb3" stroke="#17201A" stroke-width="0.7"/><path d="M116 40 C116 53 140 53 142 40" fill="none" stroke="#3b4045" stroke-width="2"/><line x1="127" y1="40" x2="125" y2="49" stroke="#3b4045" stroke-width="2.2" /><circle cx="137" cy="42.5" r="2.3" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><rect x="124" y="39" width="22" height="2" fill="#1e2124" stroke="#17201A" stroke-width="0.7"/><rect x="160" y="20" width="218" height="7.5" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><line x1="160" y1="19.4" x2="378" y2="19.4" stroke="#a7aeb3" stroke-width="1.2"/><rect x="366" y="20" width="12" height="7.5" fill="#a7aeb3" stroke="#17201A" stroke-width="0.7"/><circle cx="375" cy="18.2" r="1.6" fill="#ffffff" stroke="#17201A" stroke-width="0.5"/><rect x="160" y="28.5" width="140" height="6.5" fill="#5d646b" stroke="#17201A" stroke-width="0.7"/><rect x="176" y="26" width="72" height="14" rx="4" fill="#6b5a45" stroke="#17201A" stroke-width="0.7"/><line x1="186" y1="28" x2="186" y2="38" stroke="#4e4132" stroke-width="1.4"/><line x1="194" y1="28" x2="194" y2="38" stroke="#4e4132" stroke-width="1.4"/><line x1="202" y1="28" x2="202" y2="38" stroke="#4e4132" stroke-width="1.4"/><line x1="210" y1="28" x2="210" y2="38" stroke="#4e4132" stroke-width="1.4"/><line x1="218" y1="28" x2="218" y2="38" stroke="#4e4132" stroke-width="1.4"/><line x1="226" y1="28" x2="226" y2="38" stroke="#4e4132" stroke-width="1.4"/><line x1="234" y1="28" x2="234" y2="38" stroke="#4e4132" stroke-width="1.4"/><rect x="300" y="27" width="10" height="9" rx="1.5" fill="#a7aeb3" stroke="#17201A" stroke-width="0.7"/><rect x="112" y="41" width="4" height="6" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/></g>
<g data-tip="Stock|You hold it to your shoulder and cheek. Its length and drop decide where you look." data-tip-dot="55,160"><line x1="55.0" y1="98.0" x2="55.0" y2="160.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="55.0" cy="160.0" r="3" fill="#1F3D2B"/><rect x="15.9" y="75.0" width="56.2" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="44.0" y="92.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Stock</text></g>
<g data-tip="Receiver|The metal box with the action inside: bolt, carrier, trigger group." data-tip-dot="125,142"><line x1="125.0" y1="76.0" x2="125.0" y2="142.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="125.0" cy="142.0" r="3" fill="#1F3D2B"/><rect x="73.2" y="53.0" width="77.5" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="112.0" y="70.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Receiver</text></g>
<g data-tip="Ejection port|Empty shells fly out here. You also look in here to check the chamber." data-tip-dot="152,145"><line x1="177.9" y1="76.0" x2="152.0" y2="145.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="152.0" cy="145.0" r="3" fill="#1F3D2B"/><rect x="177.9" y="53.0" width="116.2" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="236.0" y="70.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Ejection port</text></g>
<g data-tip="Barrel, rib|The tube. The flat rib on top is your sight line." data-tip-dot="330,140"><line x1="330.0" y1="102.0" x2="330.0" y2="140.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="330.0" cy="140.0" r="3" fill="#1F3D2B"/><rect x="300.8" y="79.0" width="90.4" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="346.0" y="96.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Barrel, rib</text></g>
<g data-tip="Trigger|Finger stays outside the guard until you are ready to shoot." data-tip-dot="136,168"><line x1="94.5" y1="198.0" x2="136.0" y2="168.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="136.0" cy="168.0" r="3" fill="#1F3D2B"/><rect x="25.5" y="197.0" width="69.0" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="60.0" y="214.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Trigger</text></g>
<g data-tip="Safety|A button or tang slide. It blocks the trigger, not your mistakes." data-tip-dot="147,163"><line x1="147.0" y1="234.0" x2="147.0" y2="163.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="147.0" cy="163.0" r="3" fill="#1F3D2B"/><rect x="107.6" y="233.0" width="64.8" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="140.0" y="250.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Safety</text></g>
<g data-tip="Fore end|Your front hand. On a pump it slides to work the action." data-tip-dot="222,158"><line x1="222.0" y1="198.0" x2="222.0" y2="158.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="222.0" cy="158.0" r="3" fill="#1F3D2B"/><rect x="183.1" y="197.0" width="77.8" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="222.0" y="214.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Fore end</text></g>
<g data-tip="Magazine|Holds the shells under the barrel. The plug lives in here." data-tip-dot="290,153"><line x1="290.0" y1="234.0" x2="290.0" y2="153.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="290.0" cy="153.0" r="3" fill="#1F3D2B"/><rect x="259.8" y="233.0" width="80.3" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="300.0" y="250.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Magazine</text></g>
<g data-tip="Choke|Screws into the muzzle and squeezes the shot." data-tip-dot="382,146"><line x1="382.0" y1="180.0" x2="382.0" y2="146.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="382.0" cy="146.0" r="3" fill="#1F3D2B"/><rect x="327.9" y="179.0" width="56.2" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="356.0" y="196.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Choke</text></g>
<text x="200.0" y="288.0" font-size="15" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Muzzle to the right. Learn the names first.</text>
</svg>
