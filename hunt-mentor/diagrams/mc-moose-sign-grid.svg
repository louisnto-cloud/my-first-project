<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" font-family="sans-serif" role="img" aria-label="Six kinds of moose sign. A browse line 1.8 to 2.4 metres high. Snapped stems that a moose bent down to reach the tips. Bark stripped from willow and aspen in winter. Rut pits 45 to 105 centimetres long, soaked with urine. Antler rubs on saplings in fall. Beds, big ovals, often near water.">
<rect x="0" y="0" width="400" height="296" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Moose sign: 6 to look for</text><rect x="12" y="40" width="184" height="76" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="104" y="70" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Browse line</text><text x="104" y="94" font-size="14" fill="#23261f" text-anchor="middle">1.8 to 2.4 m high</text><rect x="204" y="40" width="184" height="76" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="296" y="70" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Snapped stems</text><text x="296" y="94" font-size="14" fill="#23261f" text-anchor="middle">bent down to reach</text><rect x="12" y="124" width="184" height="76" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="104" y="154" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Bark stripped</text><text x="104" y="178" font-size="14" fill="#23261f" text-anchor="middle">willow, aspen, winter</text><rect x="204" y="124" width="184" height="76" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="296" y="154" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Rut pit</text><text x="296" y="178" font-size="14" fill="#23261f" text-anchor="middle">45 to 105 cm, urine</text><rect x="12" y="208" width="184" height="76" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="104" y="238" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Antler rub</text><text x="104" y="262" font-size="14" fill="#23261f" text-anchor="middle">saplings, fall</text><rect x="204" y="208" width="184" height="76" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="296" y="238" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Bed</text><text x="296" y="262" font-size="14" fill="#23261f" text-anchor="middle">big oval, near water</text>
</svg>
