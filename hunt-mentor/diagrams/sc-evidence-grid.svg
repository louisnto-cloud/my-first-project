<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 387" font-family="sans-serif" role="img" aria-label="Evidence of sex by animal, 95 percent, synopsis pages 12, 15 and 17. Deer: the unskinned tail and a testicle or part of the penis, or the udder and teats; antlers do not count. Moose, elk and caribou: the tail or a hide patch at least 6 square centimetres, and a testicle or penis, or udder or teats. Black bear in Regions 2 and 3: not on the list, but no possessing a gall bladder or paws separated from the carcass. Cougar: skull and hide with evidence attached, then compulsory inspection.">
<rect width="400" height="387" fill="#fffaf0"/>
<text x="14" y="24" font-size="18" font-weight="bold" fill="#2f3a2b">Evidence of sex by animal</text>
<rect x="8" y="36" width="384" height="93" rx="6" fill="#f4eedf"/>
<circle cx="42" cy="82.5" r="27" fill="#fffaf0" stroke="#d8cfb8" stroke-width="1.4"/>
