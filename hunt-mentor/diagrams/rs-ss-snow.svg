<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 306" font-family="sans-serif" role="img" aria-label="Snow types. Wet snow: sharp detail. Powder: holes with little detail. Crust: few prints, only scratches, and loud to walk on. Wind: fills and blurs tracks. The best day is a light fresh snow on firm ground.">
<rect x="0" y="0" width="400" height="306" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Snow is not one ground</text>
<rect x="16" y="60" width="180" height="104" rx="10" fill="#eef2f6" stroke="#c7d3dd" stroke-width="1.5"/><text x="106" y="86" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wet snow</text><text x="106" y="154" font-size="14" fill="#23261f" text-anchor="middle">sharp detail (85%)</text><rect x="204" y="60" width="180" height="104" rx="10" fill="#eef2f6" stroke="#c7d3dd" stroke-width="1.5"/><text x="294" y="86" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Powder</text><text x="294" y="154" font-size="14" fill="#23261f" text-anchor="middle">holes, little detail</text><rect x="16" y="172" width="180" height="104" rx="10" fill="#dfe7ee" stroke="#c7d3dd" stroke-width="1.5"/><text x="106" y="198" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Crust</text><text x="106" y="266" font-size="14" fill="#23261f" text-anchor="middle">few prints, loud</text><rect x="204" y="172" width="180" height="104" rx="10" fill="#e6edf3" stroke="#c7d3dd" stroke-width="1.5"/><text x="294" y="198" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wind</text><text x="294" y="266" font-size="14" fill="#23261f" text-anchor="middle">fills and blurs</text><g transform="translate(110 120) rotate(0) scale(0.9)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><ellipse cx="298" cy="120" rx="16" ry="20" fill="#c7d3dd"/><ellipse cx="110" cy="233" rx="30" ry="6" fill="#c7d3dd"/><text x="110" y="238" font-size="14" fill="#6b4f35" text-anchor="middle">scratch</text><ellipse cx="298" cy="232" rx="18" ry="14" fill="#d5dee6"/><line x1="270" y1="218" x2="290" y2="214" stroke="#b8c6d2" stroke-width="2"/><line x1="284" y1="218" x2="304" y2="214" stroke="#b8c6d2" stroke-width="2"/><line x1="298" y1="218" x2="318" y2="214" stroke="#b8c6d2" stroke-width="2"/><line x1="312" y1="218" x2="332" y2="214" stroke="#b8c6d2" stroke-width="2"/><text x="200" y="296" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Best day: a light fresh snow on firm ground</text>
</svg>
