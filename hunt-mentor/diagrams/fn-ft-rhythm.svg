<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Footstep timelines. A hiker steps in a steady even rhythm. A deer steps in uneven bursts. You: two steps, long pause, two steps, long pause, irregular like the deer. Tip.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="32" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Break the human rhythm</text><text x="20" y="80" font-family="sans-serif" font-size="15" fill="#c92a2a" text-anchor="start" font-weight="bold">Hiker</text><circle cx="110" cy="75" r="7" fill="#c92a2a" stroke="none" stroke-width="2"/><circle cx="140" cy="75" r="7" fill="#c92a2a" stroke="none" stroke-width="2"/><circle cx="170" cy="75" r="7" fill="#c92a2a" stroke="none" stroke-width="2"/><circle cx="200" cy="75" r="7" fill="#c92a2a" stroke="none" stroke-width="2"/><circle cx="230" cy="75" r="7" fill="#c92a2a" stroke="none" stroke-width="2"/><circle cx="260" cy="75" r="7" fill="#c92a2a" stroke="none" stroke-width="2"/><circle cx="290" cy="75" r="7" fill="#c92a2a" stroke="none" stroke-width="2"/><circle cx="320" cy="75" r="7" fill="#c92a2a" stroke="none" stroke-width="2"/><circle cx="350" cy="75" r="7" fill="#c92a2a" stroke="none" stroke-width="2"/><text x="20" y="150" font-family="sans-serif" font-size="15" fill="#8b5a2b" text-anchor="start" font-weight="bold">Deer</text><circle cx="110" cy="145" r="7" fill="#8b5a2b" stroke="none" stroke-width="2"/><circle cx="125" cy="145" r="7" fill="#8b5a2b" stroke="none" stroke-width="2"/><circle cx="180" cy="145" r="7" fill="#8b5a2b" stroke="none" stroke-width="2"/><circle cx="195" cy="145" r="7" fill="#8b5a2b" stroke="none" stroke-width="2"/><circle cx="250" cy="145" r="7" fill="#8b5a2b" stroke="none" stroke-width="2"/><circle cx="320" cy="145" r="7" fill="#8b5a2b" stroke="none" stroke-width="2"/><circle cx="335" cy="145" r="7" fill="#8b5a2b" stroke="none" stroke-width="2"/><circle cx="350" cy="145" r="7" fill="#8b5a2b" stroke="none" stroke-width="2"/><text x="20" y="220" font-family="sans-serif" font-size="15" fill="#8a9a6b" text-anchor="start" font-weight="bold">You</text><circle cx="110" cy="215" r="7" fill="#8a9a6b" stroke="none" stroke-width="2"/><circle cx="128" cy="215" r="7" fill="#8a9a6b" stroke="none" stroke-width="2"/><circle cx="220" cy="215" r="7" fill="#8a9a6b" stroke="none" stroke-width="2"/><circle cx="240" cy="215" r="7" fill="#8a9a6b" stroke="none" stroke-width="2"/><circle cx="330" cy="215" r="7" fill="#8a9a6b" stroke="none" stroke-width="2"/><text x="20" y="272" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Steady crunch, crunch sounds like a person (Tip).</text>
</svg>
