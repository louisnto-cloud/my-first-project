<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Respect after the shot: use the meat, take photos with respect and no blood on display, dispose of the carcass away from people, share and say thanks.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Respect after the shot</text>
<rect x="10.0" y="50" width="185.0" height="110" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="84.5" y="68.30000000000001" width="36" height="36" rx="8" fill="#f2e6c9" stroke="#8b5a2b" stroke-width="2"/>
<text x="102.5" y="130" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Use the meat</text>
<text x="102.5" y="149" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">edible portions out (99%)</text>
<rect x="205.0" y="50" width="185.0" height="110" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="277.5" y="72.30000000000001" width="40" height="28" rx="4" fill="#23261f"/><circle cx="297.5" cy="86.30000000000001" r="9" fill="#cfe0ef"/>
<text x="297.5" y="130" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Respectful photos</text>
<text x="297.5" y="149" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">clean, tongue in, no gore</text>
<rect x="10.0" y="170" width="185.0" height="110" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<path d="M82.5 216.3 l20 -26 l20 26 z" fill="#8a9a6b" stroke="#8a9a6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="102.5" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Carcass away</text>
<text x="102.5" y="269" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">from people and roads</text>
<rect x="205.0" y="170" width="185.0" height="110" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<circle cx="297.5" cy="206.3" r="18" fill="#e8590c"/><text x="297.5" y="212.3" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">♥</text>
<text x="297.5" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Say thanks</text>
<text x="297.5" y="269" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">to the land and the animal</text>
</svg>
