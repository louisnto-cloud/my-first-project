<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Hearing range on a scale from 20 hertz to 20 kilohertz. You hear about 20 hertz to 20 kilohertz. A mallard hears about 66 hertz to 7.6 kilohertz, 75 percent, small study. Best duck hearing is 1 to 3 kilohertz, near 2 kilohertz, and duck calls sit at 1 to 3 kilohertz, 75 percent. They hear a clank."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Hearing: the call sits in the sweet spot</text><line x1="40" y1="200" x2="380" y2="200" stroke="#2f3a2b" stroke-width="2" fill="none"/><line x1="40.0" y1="196" x2="40.0" y2="206" stroke="#2f3a2b" stroke-width="2" fill="none"/><text x="40.0" y="224" font-size="14" fill="#2f3a2b" text-anchor="middle">20 Hz</text><line x1="119.21660049141545" y1="196" x2="119.21660049141545" y2="206" stroke="#2f3a2b" stroke-width="2" fill="none"/><text x="119.21660049141545" y="224" font-size="14" fill="#2f3a2b" text-anchor="middle">100</text><line x1="232.5499338247488" y1="196" x2="232.5499338247488" y2="206" stroke="#2f3a2b" stroke-width="2" fill="none"/><text x="232.5499338247488" y="224" font-size="14" fill="#2f3a2b" text-anchor="middle">1 kHz</text><line x1="345.88326715808216" y1="196" x2="345.88326715808216" y2="206" stroke="#2f3a2b" stroke-width="2" fill="none"/><text x="345.88326715808216" y="224" font-size="14" fill="#2f3a2b" text-anchor="middle">10 kHz</text><rect x="40.0" y="60" width="340.0" height="34" rx="6" fill="#e9e2d0"/><text x="153.33333333333331" y="83" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">You: 20 Hz to 20 kHz</text><rect x="98.76491318616058" y="108" width="233.6105610970779" height="34" rx="6" fill="#f6d7b0"/><text x="214.99437835969792" y="131" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Mallard: 66 Hz to 7.6 kHz</text><rect x="232.5499338247488" y="156" width="54.0737422015618" height="34" rx="6" fill="#e8590c"/><text x="259.52849217934556" y="179" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Best</text><rect x="10" y="240" width="380" height="52" rx="8" fill="#dfe6d3"/><text x="200" y="262" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Best hearing near 2 kHz; duck calls sit</text><text x="200" y="282" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">at 1 to 3 kHz (75%). They hear a clank.</text></svg>
