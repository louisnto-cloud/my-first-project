<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Left: six contour lines packed close together, labelled close equals steep. Right: four lines spread wide, labelled wide equals gentle.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c" stroke="none" stroke-width="2"/><text x="26" y="32" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="52" y="32" font-family="sans-serif" font-size="18" fill="#2f3a2b" text-anchor="start" font-weight="bold">Close is steep</text><line x1="40" y1="70" x2="40" y2="240" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round"/><line x1="54" y1="70" x2="54" y2="240" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round"/><line x1="68" y1="70" x2="68" y2="240" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round"/><line x1="82" y1="70" x2="82" y2="240" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round"/><line x1="96" y1="70" x2="96" y2="240" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round"/><line x1="110" y1="70" x2="110" y2="240" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round"/><line x1="250" y1="70" x2="250" y2="240" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round"/><line x1="286" y1="70" x2="286" y2="240" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round"/><line x1="322" y1="70" x2="322" y2="240" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round"/><line x1="358" y1="70" x2="358" y2="240" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round"/><text x="75" y="262" font-family="sans-serif" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">Close = steep</text><text x="305" y="262" font-family="sans-serif" font-size="16" fill="#8a9a6b" text-anchor="middle" font-weight="bold">Wide = gentle</text>
