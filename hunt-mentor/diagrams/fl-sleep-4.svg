<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Open a tent vent a little so your breath does not soak the bag with condensation.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="30" cy="32" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="30" y="39" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">4</text>
<text x="56" y="39" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="start">Vent the tent</text>
<polygon points="200,148.8 146.0,210 254.0,210" fill="#e8590c"/><polygon points="200,148.8 185.6,210 214.4,210" fill="#2f3a2b"/><path d="M200 120 q20 -20 40 0 q20 20 40 0" fill="none" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="240" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Breath out, not on the bag</text>
<rect x="10" y="262" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="285.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">A little air keeps the bag dry.</text>
</svg>
