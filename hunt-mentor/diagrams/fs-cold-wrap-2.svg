<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Moderate or severe step 2: thick pad under, then a sleeping bag or every warm layer you have around them.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">2. Pad and bag</text><rect x="0" y="240" width="400" height="60" rx="0" fill="#dfe6d3"/><rect x="80" y="226" width="240" height="14" rx="4" fill="#8a9a6b"/><rect x="80" y="196" width="240" height="30" rx="14" fill="#7c5a99"/><circle cx="70" cy="210" r="11.0" fill="#d9b48f"/><text x="200" y="140" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pad, then insulation</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Thick pad, then insulation all round</text>
</svg>
