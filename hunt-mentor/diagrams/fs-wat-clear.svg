<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Clear does not mean safe: a clean looking mountain creek can carry germs you cannot see, like Giardia. Treat every lake, creek and spring.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Clear does not mean safe</text><rect x="0" y="40" width="400" height="150" rx="0" fill="#dfe6d3"/><rect x="57" y="172" width="6" height="18" rx="0" fill="#8b5a2b"/><polygon points="60,100 40,172 80,172" fill="#8a9a6b"/><rect x="337" y="170" width="6" height="20" rx="0" fill="#8b5a2b"/><polygon points="340,90 318,170 362,170" fill="#8a9a6b"/><path d="M0 190 q 50 -12 100 0 t 100 0 t 100 0 t 100 0 L400 230 L0 230 Z" fill="#4a7fb0"/><circle cx="80" cy="210" r="7.0" fill="#f6c344" stroke="#2f3a2b" stroke-width="1"/><circle cx="150" cy="220" r="7.0" fill="#f6c344" stroke="#2f3a2b" stroke-width="1"/><circle cx="230" cy="205" r="7.0" fill="#f6c344" stroke="#2f3a2b" stroke-width="1"/><circle cx="300" cy="215" r="7.0" fill="#f6c344" stroke="#2f3a2b" stroke-width="1"/><rect x="110" y="60" width="180" height="60" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="200" y="86" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Germs you</text><text x="200" y="106" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">cannot see</text><line x1="200" y1="120" x2="163" y2="197" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><polygon points="160,204 168,199 159,195" fill="#c0392b"/><text x="200" y="285" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Treat every lake, creek and spring</text>
</svg>
