<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Grouse plan card: 1 lead No. 7.5 or 6 is legal for grouse, 2 improved cylinder choke, 3 shots inside about 25 metres, 4 walk, stop, wait; the stop flushes the bird, 5 pattern this exact shell and choke first.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Grouse: the setup</text>
<rect x="12" y="44" width="376" height="42" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.6"/>
<circle cx="34" cy="65.0" r="12" fill="#1F3D2B"/><text x="34" y="70.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="54.0" y="62.0" font-size="15" font-weight="bold" fill="#1F3D2B" text-anchor="start">Shell</text>
<text x="54.0" y="79.0" font-size="14" fill="#17201A" text-anchor="start">Lead No. 7.5 or 6 (legal for grouse)</text>
<rect x="12" y="92" width="376" height="42" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.6"/>
<circle cx="34" cy="113.0" r="12" fill="#1F3D2B"/><text x="34" y="118.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="54.0" y="110.0" font-size="15" font-weight="bold" fill="#1F3D2B" text-anchor="start">Choke</text>
<text x="54.0" y="127.0" font-size="14" fill="#17201A" text-anchor="start">Improved cylinder</text>
<rect x="12" y="140" width="376" height="42" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.6"/>
<circle cx="34" cy="161.0" r="12" fill="#1F3D2B"/><text x="34" y="166.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="54.0" y="158.0" font-size="15" font-weight="bold" fill="#1F3D2B" text-anchor="start">Range</text>
<text x="54.0" y="175.0" font-size="14" fill="#17201A" text-anchor="start">Inside about 25 m (27 yd)</text>
<rect x="12" y="188" width="376" height="42" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.6"/>
<circle cx="34" cy="209.0" r="12" fill="#1F3D2B"/><text x="34" y="214.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="54.0" y="206.0" font-size="15" font-weight="bold" fill="#1F3D2B" text-anchor="start">Walk, stop, wait</text>
<text x="54.0" y="223.0" font-size="14" fill="#17201A" text-anchor="start">The stop flushes the bird</text>
<rect x="12" y="236" width="376" height="42" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.6"/>
<circle cx="34" cy="257.0" r="12" fill="#1F3D2B"/><text x="34" y="262.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="54.0" y="254.0" font-size="15" font-weight="bold" fill="#1F3D2B" text-anchor="start">Pattern it</text>
<text x="54.0" y="271.0" font-size="14" fill="#17201A" text-anchor="start">This shell, this choke, 25 m</text>
</svg>
