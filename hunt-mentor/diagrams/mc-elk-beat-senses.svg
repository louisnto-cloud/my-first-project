<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="How to beat each sense, all Tip. Nose: keep the wind in your face and check it every few minutes. Ears: slow steps, stop often, quiet clothes and no metal clicks. Eyes: freeze when a head is up, move only when heads are down feeding.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Beat each sense</text><rect x="14" y="46" width="80" height="64" rx="8" fill="#e8590c"/><text x="54" y="84" font-size="16" fill="#fffaf0" text-anchor="middle" font-weight="bold">Nose</text><rect x="100" y="46" width="286" height="64" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="112" y="72" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Wind in your face, always</text><text x="112" y="94" font-size="14" fill="#23261f" text-anchor="start">Check it every few minutes</text><rect x="14" y="122" width="80" height="64" rx="8" fill="#8b5a2b"/><text x="54" y="160" font-size="16" fill="#fffaf0" text-anchor="middle" font-weight="bold">Ears</text><rect x="100" y="122" width="286" height="64" rx="8" fill="#fffaf0" stroke="#8b5a2b" stroke-width="2"/><text x="112" y="148" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Slow steps, stop often</text><text x="112" y="170" font-size="14" fill="#23261f" text-anchor="start">Quiet clothes, no metal clicks</text><rect x="14" y="198" width="80" height="64" rx="8" fill="#8a9a6b"/><text x="54" y="236" font-size="16" fill="#fffaf0" text-anchor="middle" font-weight="bold">Eyes</text><rect x="100" y="198" width="286" height="64" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="2"/><text x="112" y="224" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Freeze when a head is up</text><text x="112" y="246" font-size="14" fill="#23261f" text-anchor="start">Move when heads are down</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">All three are hunter craft: Tip</text>
</svg>
