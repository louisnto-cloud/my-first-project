<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Prone with a pack: lying flat, the pack goes under the forend, not the barrel. The rear hand makes a fist or holds a small bag under the butt to fine tune the height.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Prone off your pack</text><line x1="20" y1="232" x2="380" y2="232" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round"/><circle cx="110" cy="196" r="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3.5"/><path d="M118 204 L60 222 L20 228" fill="none" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 214 L120 228 L150 230" fill="none" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="160" y="196" width="70" height="34" rx="10" fill="#2f3a2b" stroke="none" stroke-width="2"/><text x="195" y="260" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">pack under the forend</text><line x1="96" y1="196" x2="300" y2="190" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/><circle cx="330" cy="188" r="14" fill="#fff" stroke="#23261f" stroke-width="2"/><circle cx="330" cy="188" r="4" fill="#e8590c" stroke="none" stroke-width="2"/><text x="80" y="70" font-size="14" fill="#23261f" text-anchor="start">Rear hand: fist or sock of</text><text x="80" y="88" font-size="14" fill="#23261f" text-anchor="start">sand under the butt to fine tune</text><text x="200.0" y="286" font-size="13" fill="#2f3a2b" text-anchor="middle">Not on the barrel: pad under the forend</text>
</svg>
