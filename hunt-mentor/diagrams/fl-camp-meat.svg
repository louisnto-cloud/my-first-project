<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-label="Meat hanging in camp in game bags on a pole between two trees, in the shade, well away from and downwind of the tents, where you can still see it.">
  <rect x="0" y="0" width="400" height="290" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Meat in camp: hang it, watch it</text>
<rect x="220" y="70" width="10" height="180" rx="3" fill="#6b4f35"/><rect x="350" y="70" width="10" height="180" rx="3" fill="#6b4f35"/><line x1="220" y1="80" x2="360" y2="80" stroke="#6b4f35" stroke-width="6" stroke-linecap="round"/>
<line x1="245" y1="80" x2="245" y2="100" stroke="#23261f" stroke-width="2" stroke-linecap="round"/><rect x="231" y="100" width="28" height="60" rx="8" fill="#f2e6c9" stroke="#8b5a2b" stroke-width="2"/>
<line x1="280" y1="80" x2="280" y2="100" stroke="#23261f" stroke-width="2" stroke-linecap="round"/><rect x="266" y="100" width="28" height="60" rx="8" fill="#f2e6c9" stroke="#8b5a2b" stroke-width="2"/>
<line x1="315" y1="80" x2="315" y2="100" stroke="#23261f" stroke-width="2" stroke-linecap="round"/><rect x="301" y="100" width="28" height="60" rx="8" fill="#f2e6c9" stroke="#8b5a2b" stroke-width="2"/>
<text x="290" y="188" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Game bags, shade</text>
<polygon points="60,219.4 33.0,250 87.0,250" fill="#e8590c"/><polygon points="60,219.4 52.8,250 67.2,250" fill="#2f3a2b"/><text x="60" y="276" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Tents</text>
<line x1="100" y1="236" x2="210" y2="236" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><text x="155" y="228" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">well away</text>
<text x="290" y="226" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Can you see it</text><text x="290" y="244" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">from camp? Good</text>
<line x1="20" y1="60" x2="70" y2="60" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="70.0,60.0 61.0,64.3 61.0,55.7" fill="#4a7fb0"/><text x="20" y="50" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4a7fb0" text-anchor="start">Wind</text>
</svg>
