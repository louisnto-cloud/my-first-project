<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two hills. On the near hill a spotter glasses and gives signals. Across the draw a buck is bedded. The stalker climbs the far slope out of sight, guided by the spotter. Agree on signals and zones of fire first.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Two hunters: one spots, one stalks</text><path d="M0 300 L0 200 L90 150 L130 170 L130 300 Z" fill="#cfdcc0" stroke="#8a9a6b" stroke-width="2"/><path d="M180 300 L200 230 L280 120 L360 140 L400 120 L400 300 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(80 154) scale(0.9)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#e8590c"/><rect x="-6" y="-15" width="5" height="15" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" fill="#2f3a2b"/></g><text x="70" y="92" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Spotter</text><text x="70" y="74" font-size="14" fill="#23261f" text-anchor="middle">glasses, signals</text><g transform="translate(330 140) scale(0.350 0.350)"><rect x="-36" y="-40" width="6" height="40" rx="3" fill="#8b5a2b"/><rect x="10" y="-40" width="6" height="40" rx="3" fill="#8b5a2b"/><ellipse cx="-12" cy="-52" rx="34" ry="16" fill="#8b5a2b"/><rect x="-30" y="-44" width="6" height="44" rx="3" fill="#8b5a2b"/><rect x="16" y="-44" width="6" height="44" rx="3" fill="#8b5a2b"/><path d="M12 -60 L26 -84 L36 -80 L26 -52 Z" fill="#8b5a2b"/><ellipse cx="38" cy="-84" rx="13" ry="7" fill="#8b5a2b"/><path d="M28 -88 L18 -102 L32 -92 Z" fill="#8b5a2b"/><path d="M31 -89 L27 -104 L38 -92 Z" fill="#8b5a2b"/><circle cx="49" cy="-84" r="2" fill="#23261f"/><ellipse cx="-44" cy="-54" rx="5" ry="9" fill="#f4efe2"/><path d="M-46 -54 L-50 -40" stroke="#23261f" stroke-width="3" stroke-linecap="round"/></g><text x="330" y="98" font-size="14" fill="#8b5a2b" text-anchor="middle" font-weight="bold">bedded buck</text><g transform="translate(230 216) scale(0.8)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#e8590c"/><rect x="-6" y="-15" width="5" height="15" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" fill="#2f3a2b"/></g><text x="230" y="248" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Stalker</text><path d="M110 150 Q 200 80 330 120" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 5"/><path d="M200 290 Q 220 240 240 210 Q 270 170 300 150" fill="none" stroke="#8b5a2b" stroke-width="2" stroke-dasharray="3 5"/><text x="200" y="290" font-size="14" fill="#23261f" text-anchor="middle">Agree signals and zones of fire first (Tip)</text>
</svg>
