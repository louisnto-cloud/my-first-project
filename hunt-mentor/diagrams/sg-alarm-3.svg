<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 3, foot stamp: the deer stamps a front hoof to warn other deer and to make you move.">
<rect width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="250" width="400" height="50" fill="#dfe6d3"/>
<text x="200" y="30" font-size="20" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3. Foot stamp</text>
<g transform="translate(0 0) scale(1.0)"><rect x="150" y="190" width="9" height="62" fill="#8b5a2b"/><rect x="168" y="190" width="9" height="60" fill="#8b5a2b"/><path d="M244 192 L262 222 L255 236" stroke="#8b5a2b" stroke-width="9" fill="none" stroke-linecap="round"/><rect x="226" y="190" width="9" height="62" fill="#8b5a2b"/><ellipse cx="200" cy="175" rx="62" ry="28" fill="#8b5a2b"/><path d="M140 165 q-12 -2 -14 10 q8 2 14 -2 Z" fill="#fff"/><polygon points="238,160 268,95 288,100 262,178" fill="#8b5a2b"/><ellipse cx="290" cy="96" rx="22" ry="11" transform="rotate(20 290 96)" fill="#8b5a2b"/><ellipse cx="270" cy="74" rx="6" ry="15" transform="rotate(-20 270 74)" fill="#8b5a2b"/><ellipse cx="284" cy="72" rx="6" ry="15" transform="rotate(15 284 72)" fill="#8b5a2b"/><circle cx="288" cy="92" r="2.5" fill="#2f3a2b"/><circle cx="309" cy="104" r="3" fill="#2f3a2b"/></g>
<g stroke="#e8590c" stroke-width="3"><path d="M248 262 l-14 10 M262 264 l0 14 M276 262 l14 10"/></g><text x="60" y="80" font-size="16" font-weight="bold" fill="#e8590c">Stamp! It wants</text><text x="60" y="100" font-size="16" font-weight="bold" fill="#e8590c">you to move</text>
</svg>
