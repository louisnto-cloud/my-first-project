<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" font-family="sans-serif">
<rect x="0" y="0" width="400" height="620" fill="#fffaf0"/>
<text x="200" y="24" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Black bear: where to aim</text>
<g transform="translate(0,34)"><rect x="6" y="2" width="388" height="182" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">1  Broadside: best</text><rect x="165" y="116" width="16" height="38" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="270" y="116" width="16" height="38" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="133" cy="86" rx="24" ry="19" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><circle cx="141" cy="70" r="6" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><circle cx="127" cy="69" r="6" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><circle cx="113" cy="88" r="3" fill="#23261f"/><ellipse cx="225" cy="92" rx="86" ry="34" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M160 64 Q186 48 221 60" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="225" cy="92" rx="95" ry="43" fill="none" stroke="#6b4f35" stroke-width="1.5" stroke-dasharray="4 4"/><text x="281" y="44" font-size="13" fill="#6b4f35">hair line</text><rect x="173" y="116" width="16" height="38" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="280" y="116" width="16" height="38" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="206" cy="94" rx="29" ry="20" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><circle cx="189" cy="109" r="8" fill="#6b4f35" stroke="#23261f" stroke-width="1.5"/><circle cx="197" cy="94" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="192" y1="94" x2="202" y2="94" stroke="#fffaf0" stroke-width="2"/><line x1="197" y1="89" x2="197" y2="99" stroke="#fffaf0" stroke-width="2"/><text x="213" y="99" font-size="14" font-weight="bold" fill="#e8590c">aim</text><text x="16" y="160" font-size="14" fill="#23261f">Halfway up, tight behind the shoulder.</text><text x="16" y="177" font-size="14" fill="#23261f">Heart sits low. Lungs reach past the middle.</text></g>
<g transform="translate(0,222)"><rect x="6" y="2" width="388" height="182" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">2  Quartering away: good</text><rect x="189" y="110" width="14" height="34" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="201" y="112" width="14" height="34" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="155" cy="82" rx="20" ry="16" fill="#2f3a2b" stroke="#23261f" stroke-width="2.5"/><circle cx="162" cy="68" r="5" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><circle cx="150" cy="68" r="5" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><circle cx="138" cy="84" r="3" fill="#23261f"/><ellipse cx="235" cy="92" rx="62" ry="34" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M189 64 Q207 48 232 60" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="269" cy="98" rx="26" ry="32" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><rect x="254" y="118" width="18" height="38" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="273" y="120" width="18" height="38" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="215" cy="94" rx="17" ry="20" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><line x1="234" y1="102" x2="187" y2="87" stroke="#23261f" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="187" cy="87" r="5" fill="#23261f"/><text x="181" y="77" font-size="13" fill="#23261f" text-anchor="end">far shoulder</text><circle cx="234" cy="102" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="229" y1="102" x2="239" y2="102" stroke="#fffaf0" stroke-width="2"/><line x1="234" y1="97" x2="234" y2="107" stroke="#fffaf0" stroke-width="2"/><text x="250" y="107" font-size="14" font-weight="bold" fill="#e8590c">aim</text><text x="301" y="134" font-size="13" fill="#23261f">rump near you</text><text x="16" y="160" font-size="14" fill="#23261f">Aim farther back than feels right.</text><text x="16" y="177" font-size="14" fill="#23261f">Bullet must cross both lungs to the far shoulder.</text></g>
<g transform="translate(0,410)"><rect x="6" y="2" width="388" height="182" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">3  Quartering to: experienced only</text><rect x="185" y="112" width="14" height="34" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="263" y="110" width="14" height="34" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="235" cy="92" rx="62" ry="34" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M189 64 Q207 48 232 60" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="197" cy="96" rx="22" ry="32" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="159" cy="78" rx="28" ry="22" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><circle cx="168" cy="60" r="7" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><circle cx="152" cy="58" r="7" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><circle cx="136" cy="80" r="3" fill="#23261f"/><rect x="197" y="118" width="18" height="38" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="273" y="116" width="16" height="38" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="216" cy="94" rx="17" ry="20" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><line x1="199" y1="97" x2="250" y2="97" stroke="#23261f" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="199" cy="97" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="194" y1="97" x2="204" y2="97" stroke="#fffaf0" stroke-width="2"/><line x1="199" y1="92" x2="199" y2="102" stroke="#fffaf0" stroke-width="2"/><text x="213" y="87" font-size="14" font-weight="bold" fill="#e8590c">aim</text><text x="301" y="134" font-size="13" fill="#23261f">chest near you</text><rect x="300" y="30" width="84" height="24" rx="5" fill="#e8590c"/><text x="342" y="47" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">WAIT</text><text x="16" y="160" font-size="14" fill="#23261f">Not recommended. Heavy shoulder, dense skull.</text><text x="16" y="177" font-size="14" fill="#23261f">Wait for broadside, near leg forward.</text></g>
<text x="200" y="612" font-size="13" fill="#6b4f35" text-anchor="middle">Shaded: lungs. Dark circle: heart. Orange dot: aim point. Not to scale.</text>
</svg>
