<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" font-family="sans-serif">
<rect x="0" y="0" width="400" height="640" fill="#fffaf0"/>
<text x="200" y="24" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Black bear: where to aim</text>
<g transform="translate(0,34)"><rect x="6" y="2" width="388" height="186" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">1  Broadside</text><text x="388" y="22" font-size="14" fill="#2f3a2b" text-anchor="end">best</text><rect x="211" y="115" width="14" height="32" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="300" y="115" width="14" height="32" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="183" cy="90" rx="18" ry="14" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><circle cx="190" cy="76" r="5" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><circle cx="178" cy="75" r="5" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><circle cx="165" cy="92" r="3" fill="#23261f"/><ellipse cx="262" cy="96" rx="73" ry="29" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M207 73 Q229 58 258 69" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="262" cy="96" rx="82" ry="38" fill="none" stroke="#6b4f35" stroke-width="1.5" stroke-dasharray="4 4"/><text x="305" y="53" font-size="13" fill="#6b4f35">hair line</text><rect x="218" y="115" width="14" height="32" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="309" y="115" width="14" height="32" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="246" cy="97" rx="25" ry="17" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><circle cx="231" cy="110" r="7" fill="#6b4f35" stroke="#23261f" stroke-width="1.5"/><circle cx="238" cy="97" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="233" y1="97" x2="243" y2="97" stroke="#fffaf0" stroke-width="2"/><line x1="238" y1="92" x2="238" y2="102" stroke="#fffaf0" stroke-width="2"/><text x="254" y="102" font-size="14" font-weight="bold" fill="#e8590c">aim</text><text x="16" y="166" font-size="14" fill="#23261f">Halfway up, tight behind the shoulder.</text><text x="16" y="183" font-size="14" fill="#23261f">Heart sits low. Lungs reach past the middle.</text></g>
<g transform="translate(0,228)"><rect x="6" y="2" width="388" height="186" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">2  Quartering away</text><text x="388" y="22" font-size="14" fill="#2f3a2b" text-anchor="end">good</text><rect x="233" y="109" width="13" height="29" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="243" y="111" width="13" height="29" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="203" cy="86" rx="16" ry="13" fill="#2f3a2b" stroke="#23261f" stroke-width="2.5"/><circle cx="210" cy="73" r="5" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><circle cx="199" cy="72" r="5" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><circle cx="187" cy="88" r="2" fill="#23261f"/><ellipse cx="272" cy="96" rx="53" ry="29" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M233 73 Q248 58 269 69" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="301" cy="102" rx="22" ry="28" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><rect x="288" y="117" width="15" height="32" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="305" y="119" width="15" height="32" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="255" cy="97" rx="15" ry="17" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><line x1="271" y1="104" x2="231" y2="92" stroke="#23261f" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="231" cy="92" r="5" fill="#23261f"/><text x="227" y="114" font-size="13" fill="#23261f" text-anchor="end">far shoulder</text><circle cx="271" cy="104" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="266" y1="104" x2="276" y2="104" stroke="#fffaf0" stroke-width="2"/><line x1="271" y1="99" x2="271" y2="109" stroke="#fffaf0" stroke-width="2"/><text x="287" y="109" font-size="14" font-weight="bold" fill="#e8590c">aim</text><text x="388" y="57" font-size="13" fill="#23261f" text-anchor="end">rump toward you</text><text x="16" y="166" font-size="14" fill="#23261f">Aim farther back than feels right.</text><text x="16" y="183" font-size="14" fill="#23261f">Bullet must cross both lungs to the far shoulder.</text></g>
<g transform="translate(0,422)"><rect x="6" y="2" width="388" height="186" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">3  Quartering to</text><text x="388" y="22" font-size="14" fill="#2f3a2b" text-anchor="end">experienced only</text><rect x="230" y="111" width="13" height="29" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="296" y="109" width="13" height="29" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="272" cy="96" rx="53" ry="29" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M233 73 Q248 58 269 69" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="239" cy="100" rx="19" ry="28" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="205" cy="84" rx="21" ry="17" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><circle cx="214" cy="67" r="6" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><circle cx="199" cy="66" r="6" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><circle cx="184" cy="86" r="3" fill="#23261f"/><rect x="239" y="117" width="15" height="32" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="305" y="115" width="14" height="32" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="256" cy="97" rx="15" ry="17" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><line x1="242" y1="100" x2="285" y2="100" stroke="#23261f" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="242" cy="100" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="237" y1="100" x2="247" y2="100" stroke="#fffaf0" stroke-width="2"/><line x1="242" y1="95" x2="242" y2="105" stroke="#fffaf0" stroke-width="2"/><text x="256" y="90" font-size="14" font-weight="bold" fill="#e8590c">aim</text><rect x="306" y="30" width="78" height="24" rx="5" fill="#e8590c"/><text x="345" y="47" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">WAIT</text><text x="16" y="166" font-size="14" fill="#23261f">Not recommended. Heavy shoulder, dense skull.</text><text x="16" y="183" font-size="14" fill="#23261f">Wait for broadside, near leg forward.</text></g>
<text x="200" y="634" font-size="13" fill="#6b4f35" text-anchor="middle">Shaded: lungs. Dark: heart. Orange: aim point. Not to scale.</text>
</svg>
