<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 490" font-family="sans-serif" role="img" aria-label="Black bear, broadside, drawn with the lungs and heart shown through the body. A dashed line inside the outline shows the real body under the hair: hair adds 8 to 10 centimetres (70%), so the bear looks bigger than it is. The heart sits low, behind the shoulder; the lungs reach past the middle of the body. Aim halfway up, tight behind the shoulder, with the near leg forward (85%). Below, three top views: broadside is best; quartering away is good, aim farther back so the bullet crosses both lungs to the far shoulder; quartering to is for experienced hunters only: heavy shoulder bone and a dense skull, so wait for broadside.">
<rect width="400" height="490" fill="#fffaf0"/>
<defs><g id="vitals-bear-top"><ellipse cx="0" cy="0" rx="30" ry="13" fill="#26221e" stroke="#141210" stroke-width="1.4"/><ellipse cx="-36" cy="0" rx="10" ry="9" fill="#26221e" stroke="#141210" stroke-width="1.2"/><ellipse cx="-47" cy="0" rx="5" ry="4" fill="#a9845c"/><circle cx="-34" cy="-8" r="3.4" fill="#26221e"/><circle cx="-34" cy="8" r="3.4" fill="#26221e"/><ellipse cx="-10" cy="0" rx="12" ry="8" fill="#e9a3a0" fill-opacity=".9"/></g></defs>
<ellipse cx="236" cy="302" rx="132" ry="7" fill="#d8ccb2"/>
<path d="M226 236 L248 238 L250 288 C250 294 246 298 240 298 L220 298 C216 298 216 292 220 290 L224 286z" fill="#141210"/>
<path d="M296 232 L322 230 L324 288 C324 294 320 298 314 298 L296 298 C292 298 292 292 296 290 L298 284z" fill="#141210"/>
<path d="M48 166 C50 158 60 152 72 148 C84 140 96 128 104 120 L102 108 C106 101 115 103 115 110 C120 112 128 114 136 114 C160 108 190 102 230 102 C270 102 310 104 330 112 C350 120 360 140 356 168 C354 190 350 204 346 214 L344 288 C344 294 340 298 334 298 L314 298 C310 298 310 292 314 290 L318 286 L316 246 C300 250 270 250 240 248 C228 248 218 246 212 244 L210 288 C210 294 206 298 200 298 L176 298 C172 298 172 292 176 290 L182 286 L180 236 C172 222 164 210 156 200 C144 192 128 186 112 186 C96 186 84 182 74 180 C62 180 50 176 48 166z" fill="#26221e" stroke="#141210" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M50 166 C52 158 60 153 70 150 L84 164 C78 174 64 178 54 174z" fill="#a9845c"/>
<ellipse cx="51" cy="163" rx="4.5" ry="3.4" fill="#0b0a09"/>
<circle cx="86" cy="146" r="2.6" fill="#0b0a09"/><circle cx="85.2" cy="145.2" r=".8" fill="#ddd"/>
<path d="M120 112 C122 104 130 104 131 112" fill="#26221e" stroke="#141210" stroke-width="1.2"/>
<path d="M104 117 C106 111 111 111 112 115" fill="none" stroke="#4a4038" stroke-width="1.2"/>
<path d="M176 298 h24 M314 298 h20" stroke="#4a4038" stroke-width="2"/>
<g data-tip="Lungs|They reach past the middle of the body. The vital zone is about a 20 cm (8 in) circle behind the front shoulder." data-tip-dot="268,152">
<path d="M188 150 C212 138 256 138 276 152 C288 172 274 204 246 214 C224 220 198 218 188 202 C178 186 180 162 188 150z" fill="#e9a3a0" fill-opacity=".9" stroke="#b55b57" stroke-width="1.4"/>
<line x1="258" y1="172" x2="288" y2="196" stroke="#fffaf0" stroke-width="1.4"/><circle cx="258" cy="172" r="2.6" fill="#fffaf0"/><text x="292" y="204" font-size="16" font-weight="bold" fill="#fffaf0">lungs</text>
</g>
<g data-tip="Hair and fat|Hair adds 8 to 10 cm and fat 2.5 to 5 cm. The bear looks bigger and the chest lower than it is." data-tip-dot="384,8">
<path d="M140 124 C170 116 200 112 232 112 C272 112 306 114 326 122 C342 130 348 146 346 166 M320 238 C296 240 268 240 240 238 C226 238 216 236 208 234 C200 226 190 214 176 202 C160 192 140 186 120 184" fill="none" stroke="#bfb3a3" stroke-width="1.4" stroke-dasharray="4 3"/>
<rect x="253" y="0" width="139" height="45" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="322" y="19" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">hair adds</text>
<text x="322" y="37" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">8 to 10 cm (70%)</text><line x1="344" y1="140" x2="344" y2="45" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="344" cy="140" r="2.6" fill="#2f3a2b"/>
</g>
<g data-tip="Heart|Sits low in the chest, behind the shoulder." data-tip-dot="138,250">
<path d="M188 212 C188 204 196 202 200 208 C204 202 212 204 210 214 C208 222 200 228 198 230 C194 226 188 220 188 212z" fill="#8e2a2a" stroke="#5e1717" stroke-width="1"/>
<line x1="196" y1="220" x2="144" y2="258" stroke="#bfb3a3" stroke-width="1.8"/><circle cx="196" cy="220" r="2.6" fill="#fffaf0"/><rect x="92" y="250" width="52" height="27" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="118" y="269" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">heart</text>
</g>
<!-- step 1: near leg forward, follow it up -->
<g data-tip="Near leg forward|The leg and shoulder bones shield the heart and lungs when the near front leg is back. Wait for it to step forward." data-tip-dot="170,290">
<path d="M208 292 L207 248" fill="none" stroke="#e8590c" stroke-width="2.6" stroke-dasharray="6 4"/>
<path d="M201 252 L207 239 L213 252z" fill="#e8590c"/>
<circle cx="160" cy="290" r="11" fill="#e8590c" stroke="#fffaf0" stroke-width="2"/><text x="160" y="295" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">1</text>
</g>
<!-- step 2: halfway up -->
<g stroke="#fffaf0" stroke-width="1.8"><line x1="153" y1="110" x2="167" y2="110"/><line x1="153" y1="246" x2="167" y2="246"/><line x1="160" y1="110" x2="160" y2="246"/><line x1="153" y1="178" x2="167" y2="178"/></g>
<line x1="153" y1="178" x2="132" y2="196" stroke="#fffaf0" stroke-width="1.2"/>
<rect x="50" y="192" width="82" height="27" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<circle cx="64" cy="205.5" r="10" fill="#e8590c"/><text x="64" y="210.5" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text>
<text x="80" y="211" font-size="15" font-weight="bold" fill="#2f3a2b">1/2 up</text>
<g data-tip="Aim spot|Halfway up the body, tight behind the shoulder, once the near leg steps forward. Through both lungs." data-tip-dot="216,166">
<circle cx="200" cy="178" r="9" fill="#e8590c" stroke="#fffaf0" stroke-width="2"/><path d="M200 166 v24 M188 178 h24" stroke="#fffaf0" stroke-width="1.8"/>
<line x1="196" y1="170" x2="136" y2="67" stroke="#e8590c" stroke-width="1.6"/>
<rect x="8" y="0" width="236" height="67" rx="6" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/>
<text x="20" y="22" font-size="16" font-weight="bold" fill="#e8590c">AIM: halfway up (85%)</text>
<text x="20" y="42" font-size="14" fill="#2f3a2b"><tspan font-weight="bold" fill="#e8590c">1</tspan> Near leg steps forward</text>
<text x="20" y="60" font-size="14" fill="#2f3a2b"><tspan font-weight="bold" fill="#e8590c">2</tspan> Tight behind the shoulder</text>
</g>
<g transform="translate(0 -28)"><!-- angle cards, top view -->
  <g font-size="14" text-anchor="middle" fill="#2f3a2b">
   <g data-tip="Broadside|Best shot. Halfway up, tight behind the shoulder, with the near leg forward." data-tip-dot="122,368">
    <rect x="12" y="358" width="120" height="122" rx="8" fill="#f2ecdd" stroke="#c9bb9c"/>
    <text x="72" y="377" font-weight="bold">Broadside</text><text x="72" y="394" fill="#2f6e3b" font-weight="bold">best</text>
    <use href="#vitals-bear-top" transform="translate(80 422)"/>
    <line x1="68" y1="472" x2="68" y2="433" stroke="#2f3a2b" stroke-width="1.8"/><line x1="68" y1="433" x2="68" y2="411" stroke="#2f3a2b" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle cx="68" cy="433" r="4" fill="#e8590c"/>
   </g>
   <g data-tip="Quartering away|Aim at the off shoulder. The bullet enters behind the ribs and crosses both lungs." data-tip-dot="250,368">
    <rect x="140" y="358" width="120" height="122" rx="8" fill="#f2ecdd" stroke="#c9bb9c"/>
    <text x="200" y="377" font-weight="bold">Quartering away</text><text x="200" y="394" fill="#2f6e3b" font-weight="bold">good</text>
    <use href="#vitals-bear-top" transform="translate(212 428) rotate(35)"/>
    <line x1="201" y1="472" x2="201" y2="433" stroke="#2f3a2b" stroke-width="1.8"/><line x1="201" y1="433" x2="201" y2="409" stroke="#2f3a2b" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle cx="201" cy="433" r="4" fill="#e8590c"/><circle cx="201" cy="409" r="3" fill="#2f3a2b"/>
   </g>
   <g data-tip="Quartering to|No quartering to, shoulder or head shots. Heavy shoulder bone, and the skull is dense and sloped so bullets glance off." data-tip-dot="378,368">
    <rect x="268" y="358" width="120" height="122" rx="8" fill="#f2ecdd" stroke="#c9bb9c"/>
    <text x="328" y="377" font-weight="bold">Quartering to</text><text x="328" y="394" fill="#c0392b" font-weight="bold">wait</text>
    <use href="#vitals-bear-top" transform="translate(344 418) rotate(-35)"/>
    <line x1="333" y1="472" x2="333" y2="437" stroke="#2f3a2b" stroke-width="1.8"/>
    <circle cx="333" cy="437" r="4" fill="#e8590c"/>
    <path d="M354 448 l20 18 M374 448 l-20 18" stroke="#c0392b" stroke-width="3.4" stroke-linecap="round"/>
   </g>
  </g>
</g>
<rect x="12" y="458" width="376" height="26" rx="6" fill="#f2ecdd"/>
<text x="200" y="476" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Heart sits low. Lungs reach past the middle.</text>
</svg>
