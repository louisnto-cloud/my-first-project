<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 403" font-family="sans-serif" role="img" aria-label="Elevation bars for three BC grouse, from the BC Breeding Bird Atlas (85%), over a drawn slope that rises from a creek bottom with aspen, through pine and spruce, to dense conifers and open ground high up. Scale 0 to 2,400 metres. Dusky grouse: many records 1,500 to 2,250 metres, open breeding ground, then dense conifers uphill. Spruce grouse: records 293 to 1,738 metres, in pine and spruce, eats needles. Ruffed grouse: most common 750 to 1,250 metres, in aspen, creek bottoms and shrubs.">
