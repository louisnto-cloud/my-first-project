<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Elevation bars from the BC Breeding Bird Atlas. Ruffed grouse most common 750 to 1,250 metres in aspen and creek bottoms. Spruce grouse recorded 293 to 1,738 metres in pine and spruce. Dusky grouse many records 1,500 to 2,250 metres, moving in fall from open breeding ground to dense conifers uphill.">
<rect x="0" y="0" width="400" height="320" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">BC grouse by height and forest</text>
<line x1="120" y1="44" x2="120" y2="250" stroke="#e2dccb"/><text x="120.0" y="266" font-family="sans-serif" font-size="12" fill="#6b4f35" text-anchor="middle">0 m</text>
<line x1="187" y1="44" x2="187" y2="250" stroke="#e2dccb"/><text x="187.0" y="266" font-family="sans-serif" font-size="12" fill="#6b4f35" text-anchor="middle">600 m</text>
<line x1="254" y1="44" x2="254" y2="250" stroke="#e2dccb"/><text x="254.0" y="266" font-family="sans-serif" font-size="12" fill="#6b4f35" text-anchor="middle">1200 m</text>
<line x1="321" y1="44" x2="321" y2="250" stroke="#e2dccb"/><text x="321.0" y="266" font-family="sans-serif" font-size="12" fill="#6b4f35" text-anchor="middle">1800 m</text>
<line x1="388" y1="44" x2="388" y2="250" stroke="#e2dccb"/><text x="388.0" y="266" font-family="sans-serif" font-size="12" fill="#6b4f35" text-anchor="middle">2400 m</text>
<text x="10" y="72" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Dusky grouse</text>
<rect x="288" y="56" width="84" height="22" rx="5" fill="#3d5a3a"/>
<text x="10" y="98" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">open breeding ground, then dense conifers uphill</text>
<text x="10" y="138" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Spruce grouse</text>
<rect x="154" y="122" width="161" height="22" rx="5" fill="#5c7a4e"/>
<text x="10" y="164" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">pine and spruce, eats needles</text>
<text x="10" y="204" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Ruffed grouse</text>
<rect x="204" y="188" width="56" height="22" rx="5" fill="#c08a3e"/>
<text x="10" y="230" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">aspen, creek bottoms, shrubs</text>
<text x="10" y="286" font-family="sans-serif" font-size="12" fill="#6b4f35" text-anchor="start">Ruffed: most common 750 to 1,250 m. Dusky: many records</text>
<text x="10" y="300" font-family="sans-serif" font-size="12" fill="#6b4f35" text-anchor="start">1,500 to 2,250 m. Spruce: records 293 to 1,738 m (85%,</text>
<text x="10" y="314" font-family="sans-serif" font-size="12" fill="#6b4f35" text-anchor="start">BC atlas).</text>
</svg>
