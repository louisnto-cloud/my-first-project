<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A ladder of track age from fresh to old. Minutes: sharp edges, moist, shiny. Hours: edges crisp, crumbs drying. A day: edges rounding, dull. Days: debris, spider web or insect trails inside. A week or more: soft, filled, weathered. Give a range, never a minute; mud ages slowest.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">How fresh? The age ladder</text><rect x="20" y="44" width="360" height="38" rx="8" fill="#e8590c"/><text x="34" y="69" font-size="16" fill="#fffaf0" text-anchor="start" font-weight="bold">Minutes</text><text x="130" y="69" font-size="14" fill="#fffaf0" text-anchor="start">Sharp edges, moist, shiny</text><rect x="20" y="90" width="360" height="38" rx="8" fill="#e9a04c"/><text x="34" y="115" font-size="16" fill="#fffaf0" text-anchor="start" font-weight="bold">Hours</text><text x="130" y="115" font-size="14" fill="#fffaf0" text-anchor="start">Edges crisp, crumbs drying</text><rect x="20" y="136" width="360" height="38" rx="8" fill="#c9b46a"/><text x="34" y="161" font-size="16" fill="#23261f" text-anchor="start" font-weight="bold">A day</text><text x="130" y="161" font-size="14" fill="#23261f" text-anchor="start">Edges rounding, dull</text><rect x="20" y="182" width="360" height="38" rx="8" fill="#8a9a6b"/><text x="34" y="207" font-size="16" fill="#23261f" text-anchor="start" font-weight="bold">Days</text><text x="130" y="207" font-size="14" fill="#23261f" text-anchor="start">Debris, web or bug trails inside</text><rect x="20" y="228" width="360" height="38" rx="8" fill="#a7a79b"/><text x="34" y="253" font-size="16" fill="#23261f" text-anchor="start" font-weight="bold">A week +</text><text x="130" y="253" font-size="14" fill="#23261f" text-anchor="start">Soft, filled, weathered</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Give a range, never a minute. Mud ages slowest (65%)</text>
</svg>
