<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Step 5: Take your shot or leave quietly. Do not push the same deer twice (Tip).">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="30" cy="30" r="20" fill="#e8590c"/>
<text x="30" y="37" font-family="sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
<text x="60" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Take your shot or leave quietly</text>
<g transform="translate(200 160) scale(1.4)"><ellipse rx="20" ry="9" fill="#8b5a2b"/><circle cx="19" cy="-10" r="6.5" fill="#8b5a2b"/><rect x="-15" y="5" width="3.5" height="14" fill="#8b5a2b"/><rect x="-6" y="5" width="3.5" height="14" fill="#8b5a2b"/><rect x="7" y="5" width="3.5" height="14" fill="#8b5a2b"/><rect x="13" y="5" width="3.5" height="14" fill="#8b5a2b"/><ellipse cx="-20" cy="-2" rx="4" ry="5" fill="#f3ead8"/><path d="M19 -15 l-5 -10 m3 5 l-6 -2 M23 -15 l5 -10 m-3 5 l6 -2" stroke="#5c3b1c" stroke-width="2" fill="none"/></g><text x="200" y="230" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">One shot, clean, then out (Tip)</text>
<text x="200" y="288" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Do not push the same deer twice (Tip).</text>
