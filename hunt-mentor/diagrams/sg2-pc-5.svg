<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Pump field strip step 5: clean the barrel from the chamber end, the locking notch and the choke threads; brush the bolt as a unit; wipe the receiver; thin oil only; reassemble in reverse and function check unloaded.">
<rect width="400" height="300" fill="#EEF1EA"/>
<circle cx="24" cy="22" r="15" fill="#1F3D2B"/><text x="24" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="46" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Clean, then rebuild</text>
<rect x="20" y="70" width="360" height="12" fill="#3b4045" stroke="#17201A" stroke-width="0.8"/><rect x="366" y="70" width="14" height="12" fill="#a7aeb3"/>
<line x1="30.0" y1="100.0" x2="133.0" y2="100.0" stroke="#FF6A13" stroke-width="4" stroke-linecap="round"/><path d="M140.0 100.0 L131.0 104.3 L131.0 95.7Z" fill="#FF6A13"/>
<rect x="23.3" y="109.0" width="153.4" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="100.0" y="126.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">chamber to muzzle</text>
<line x1="372.0" y1="110.0" x2="372.0" y2="82.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="372.0" cy="82.0" r="3" fill="#1F3D2B"/><rect x="260.5" y="109.0" width="119.0" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="320.0" y="126.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">choke threads</text>
<circle cx="30" cy="170" r="10" fill="#1F3D2B"/><text x="30" y="174.7" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="48.0" y="175.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Bolt: brush as a unit, wipe dry</text>
<circle cx="30" cy="198" r="10" fill="#1F3D2B"/><text x="30" y="202.7" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="48.0" y="203.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Receiver: brush, wipe (sharp edges)</text>
<circle cx="30" cy="226" r="10" fill="#1F3D2B"/><text x="30" y="230.7" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="48.0" y="231.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Thin oil. No pools of oil</text>
<text x="200.0" y="290.0" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Reassemble in reverse. Check it.</text>
</svg>
