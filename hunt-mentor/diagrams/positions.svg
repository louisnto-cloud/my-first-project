<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" font-family="sans-serif" role="img" aria-label="Four rifle shooting positions, steadiest first. 1 Prone, steadiest: lying flat, both elbows on the ground. 2 Sitting, steady: elbows inside the knees. 3 Kneeling, less steady: sitting on the rear heel, one elbow on the front knee. 4 Standing, hardest: no support, add sticks. Sticks or a tripod make kneeling and standing much steadier. Ranking from the Hunter Ed national course. Figures not to scale.">
