<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="sans-serif">
  <rect x="0" y="0" width="400" height="440" fill="#fffaf0"/>
  <text x="200" y="24" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Four positions, steadiest first</text>

  <!-- 1 Prone -->
  <g transform="translate(10,40)">
    <rect x="0" y="0" width="185" height="172" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="13" fill="#2f3a2b"/><text x="18" y="24" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">1</text>
    <text x="38" y="24" font-size="16" font-weight="bold" fill="#23261f">Prone</text>
    <text x="38" y="42" font-size="14" fill="#2f3a2b">Steadiest</text>
    <line x1="10" y1="140" x2="175" y2="140" stroke="#8a9a6b" stroke-width="3"/>
    <g fill="none" stroke="#23261f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 122 L115 132 L165 126 M115 132 L168 144"/>
      <path d="M62 124 L78 140 L92 112 M62 124 L70 140 L74 118"/>
    </g>
    <circle cx="50" cy="118" r="9" fill="#fffaf0" stroke="#23261f" stroke-width="3"/>
    <line x1="66" y1="120" x2="152" y2="98" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/>
    <text x="10" y="162" font-size="13" fill="#23261f">Both elbows on the ground</text>
  </g>

  <!-- 2 Sitting -->
  <g transform="translate(205,40)">
    <rect x="0" y="0" width="185" height="172" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="13" fill="#2f3a2b"/><text x="18" y="24" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text>
    <text x="38" y="24" font-size="16" font-weight="bold" fill="#23261f">Sitting</text>
    <text x="38" y="42" font-size="14" fill="#2f3a2b">Steady</text>
    <line x1="10" y1="140" x2="175" y2="140" stroke="#8a9a6b" stroke-width="3"/>
    <g fill="none" stroke="#23261f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M85 132 L92 86 M85 132 L118 106 L138 140 M85 132 L112 112 L130 140"/>
      <path d="M92 90 L116 108 L124 88 M92 90 L104 112 L100 92"/>
    </g>
    <circle cx="94" cy="74" r="9" fill="#fffaf0" stroke="#23261f" stroke-width="3"/>
    <line x1="96" y1="96" x2="172" y2="76" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/>
    <text x="10" y="162" font-size="13" fill="#23261f">Elbows inside the knees</text>
  </g>

  <!-- 3 Kneeling -->
  <g transform="translate(10,220)">
    <rect x="0" y="0" width="185" height="172" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="13" fill="#2f3a2b"/><text x="18" y="24" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">3</text>
    <text x="38" y="24" font-size="16" font-weight="bold" fill="#23261f">Kneeling</text>
    <text x="38" y="42" font-size="14" fill="#2f3a2b">Less steady</text>
    <line x1="10" y1="140" x2="175" y2="140" stroke="#8a9a6b" stroke-width="3"/>
    <g fill="none" stroke="#23261f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M85 118 L90 76 M85 118 L118 100 L122 140 M85 118 L70 138 L42 140"/>
      <path d="M90 80 L116 98 L124 78 M90 80 L104 100 L100 82"/>
    </g>
    <circle cx="92" cy="64" r="9" fill="#fffaf0" stroke="#23261f" stroke-width="3"/>
    <line x1="94" y1="86" x2="172" y2="66" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/>
    <text x="10" y="162" font-size="13" fill="#23261f">One elbow on the knee</text>
  </g>

  <!-- 4 Standing -->
  <g transform="translate(205,220)">
    <rect x="0" y="0" width="185" height="172" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="13" fill="#2f3a2b"/><text x="18" y="24" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">4</text>
    <text x="38" y="24" font-size="16" font-weight="bold" fill="#23261f">Standing</text>
    <text x="38" y="42" font-size="14" fill="#2f3a2b">Hardest</text>
    <line x1="10" y1="140" x2="175" y2="140" stroke="#8a9a6b" stroke-width="3"/>
    <g fill="none" stroke="#23261f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M98 140 L111 98 L124 140 M111 98 L114 56"/>
      <path d="M114 60 L128 84 L140 62 M114 60 L122 80 L120 64"/>
    </g>
    <circle cx="116" cy="44" r="9" fill="#fffaf0" stroke="#23261f" stroke-width="3"/>
    <line x1="110" y1="66" x2="176" y2="49" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/>
    <!-- sticks -->
    <path d="M160 140 L146 58 M160 140 L172 58 M160 140 L158 58" fill="none" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round"/>
    <text x="10" y="162" font-size="13" fill="#23261f">No support. Add sticks</text>
  </g>

  <text x="200" y="418" font-size="14" fill="#23261f" text-anchor="middle">Sticks or a tripod make 3 and 4 much steadier.</text>
  <text x="200" y="434" font-size="13" fill="#6b4f35" text-anchor="middle">Ranking: Hunter Ed, national course. Figures not to scale.</text>
</svg>
