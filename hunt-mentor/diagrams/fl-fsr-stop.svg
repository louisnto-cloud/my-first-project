<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Top view of a resource road. Good: stopped in a pullout on a straight section with clear sight both ways. Bad: stopped on a curve or the crest of a hill.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Where to stop on a resource road</text>
<path d="M20 210 L170 210 Q260 210 300 140 L330 80" fill="none" stroke="#c9b79c" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="60" y="226" width="100" height="26" rx="6" fill="#c9b79c"/>
<rect x="76" y="230" width="40" height="18" rx="4" fill="#2f3a2b"/>
<path d="M128.0 262 l8.4 9.6 l16.8 -19.2" fill="none" stroke="#2f3a2b" stroke-width="6.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="110" y="286" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pullout on a straight</text>
<rect x="290" y="116" width="30" height="18" rx="4" fill="#2f3a2b" transform="rotate(-60 305 125)"/>
<circle cx="350" cy="160" r="20" fill="#ffffff" stroke="#b3261e" stroke-width="3"/><path d="M341.0 151.0 l18.0 18.0 M359.0 151.0 l-18.0 18.0" fill="none" stroke="#b3261e" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="340" y="200" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle">Not on a curve</text>
<text x="340" y="220" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle">or a hill crest</text>
</svg>
