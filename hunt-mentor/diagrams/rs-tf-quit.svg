<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 302" font-family="sans-serif" role="img" aria-label="When to stop tracking: is there legal light left to recover an animal? Is the weather holding? Are you still on land you may hunt? Do you have the time and energy to walk back? Any no means stop. All yes: keep going slowly.">
<rect x="0" y="0" width="400" height="302" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Keep going or turn back?</text>
<rect x="20" y="66" width="300" height="38" rx="8" fill="#fff" stroke="#23261f" stroke-width="1.5"/><text x="170" y="91" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Legal light left for a recovery?</text><text x="330" y="91" font-size="14" font-weight="bold" fill="#c62828" text-anchor="start">no: stop</text><rect x="20" y="114" width="300" height="38" rx="8" fill="#fff" stroke="#23261f" stroke-width="1.5"/><text x="170" y="139" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Weather holding?</text><text x="330" y="139" font-size="14" font-weight="bold" fill="#c62828" text-anchor="start">no: stop</text><rect x="20" y="162" width="300" height="38" rx="8" fill="#fff" stroke="#23261f" stroke-width="1.5"/><text x="170" y="187" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Still on land you may hunt?</text><text x="330" y="187" font-size="14" font-weight="bold" fill="#c62828" text-anchor="start">no: stop</text><rect x="20" y="210" width="300" height="38" rx="8" fill="#fff" stroke="#23261f" stroke-width="1.5"/><text x="170" y="235" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Time and energy to walk back?</text><text x="330" y="235" font-size="14" font-weight="bold" fill="#c62828" text-anchor="start">no: stop</text><rect x="20" y="258" width="300" height="34" rx="8" fill="#e3eed8"/><text x="170" y="280" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">All yes: keep going, slowly</text>
</svg>
