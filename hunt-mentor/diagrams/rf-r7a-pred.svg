<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 466" role="img" aria-label="Bar chart of Region 7A predator, furbearer and small game seasons. Wolf: 1 August to 30 June. Cougar: 10 September to 31 March, bag 2 or 1 by unit group. Coyote: 15 August to 31 March, new. Wolverine in 7-3, 7-17, 7-18 and 7-37 to 7-41: 15 October to 15 January. Lynx: 1 November to 15 February. Raccoon: printed 1 April to 31 March, the whole licence year. Snowshoe hare: 1 August to 30 April. Columbian ground squirrel: no closed season, private land only." font-family="sans-serif">
