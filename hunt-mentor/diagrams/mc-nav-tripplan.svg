<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A trip plan card with seven lines: who is going; the vehicle, plate and colour; where it is parked with road name and coordinates; route with plan A and plan B; back by clock time; call 911 if no word by a set time; gear such as satellite SOS and orange clothing. Leave it with someone who is not on the trip, 75 percent, AdventureSmart.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">The trip plan card</text><rect x="60" y="40" width="280" height="236" rx="6" fill="#f3efe0" stroke="#8b5a2b" stroke-width="2"/><text x="74" y="66" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Who</text><text x="170" y="66" font-size="14" fill="#23261f" text-anchor="start">you, your brother</text><line x1="74" y1="75" x2="326" y2="75" stroke="#d8cfb4" stroke-width="1" stroke-linecap="round"/><text x="74" y="96" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Vehicle</text><text x="170" y="96" font-size="14" fill="#23261f" text-anchor="start">truck, plate, colour</text><line x1="74" y1="105" x2="326" y2="105" stroke="#d8cfb4" stroke-width="1" stroke-linecap="round"/><text x="74" y="126" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Parked</text><text x="170" y="126" font-size="14" fill="#23261f" text-anchor="start">road name, coordinates</text><line x1="74" y1="135" x2="326" y2="135" stroke="#d8cfb4" stroke-width="1" stroke-linecap="round"/><text x="74" y="156" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Route</text><text x="170" y="156" font-size="14" fill="#23261f" text-anchor="start">plan A and plan B</text><line x1="74" y1="165" x2="326" y2="165" stroke="#d8cfb4" stroke-width="1" stroke-linecap="round"/><text x="74" y="186" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Back by</text><text x="170" y="186" font-size="14" fill="#23261f" text-anchor="start">clock time</text><line x1="74" y1="195" x2="326" y2="195" stroke="#d8cfb4" stroke-width="1" stroke-linecap="round"/><text x="74" y="216" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Call 911 if</text><text x="170" y="216" font-size="14" fill="#23261f" text-anchor="start">no word by ...</text><line x1="74" y1="225" x2="326" y2="225" stroke="#d8cfb4" stroke-width="1" stroke-linecap="round"/><text x="74" y="246" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Gear</text><text x="170" y="246" font-size="14" fill="#23261f" text-anchor="start">satellite SOS, orange</text><line x1="74" y1="255" x2="326" y2="255" stroke="#d8cfb4" stroke-width="1" stroke-linecap="round"/><text x="200" y="293" font-size="14" fill="#6b4f35" text-anchor="middle">Leave it with someone not on the trip (75%)</text>
</svg>
