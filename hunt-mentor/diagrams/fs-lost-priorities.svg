<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Lost overnight, in this order: 1, stay calm and do STOP. 2, call or signal. 3, shelter and warmth. 4, fire. 5, water. 6, food last.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Lost overnight: in this order</text><circle cx="60" cy="60" r="15.0" fill="#2f3a2b"/><text x="60" y="66" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><rect x="86" y="46" width="280" height="30" rx="6" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="98" y="67" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Stay calm, STOP</text><circle cx="60" cy="98" r="15.0" fill="#e8590c"/><text x="60" y="104" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><rect x="86" y="84" width="280" height="30" rx="6" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="98" y="105" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Call or signal</text><circle cx="60" cy="136" r="15.0" fill="#4a7fb0"/><text x="60" y="142" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><rect x="86" y="122" width="280" height="30" rx="6" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="98" y="143" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Shelter and warmth</text><circle cx="60" cy="174" r="15.0" fill="#e8590c"/><text x="60" y="180" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><rect x="86" y="160" width="280" height="30" rx="6" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="98" y="181" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Fire</text><circle cx="60" cy="212" r="15.0" fill="#4a7fb0"/><text x="60" y="218" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><rect x="86" y="198" width="280" height="30" rx="6" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="98" y="219" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Water</text><circle cx="60" cy="250" r="15.0" fill="#8a9a6b"/><text x="60" y="256" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text><rect x="86" y="236" width="280" height="30" rx="6" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="98" y="257" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Food last</text>
</svg>
