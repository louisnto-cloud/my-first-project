<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 264" font-family="sans-serif" role="img" aria-label="A laser rangefinder sends a pulse of invisible light to the deer and times the echo coming back. Shiny targets echo much farther than a deer coat; a deer coat echoes about half as far. Example from one maker: 1,800 yards on reflective targets but 900 yards on deer.">
<rect width="400" height="264" fill="#fffaf0"/>
<text x="200" y="27" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A laser rangefinder times light</text>
<rect x="0" y="150" width="400" height="8" fill="#dfe6d3"/>
<g transform="translate(84 112) scale(1.0)"><rect x="-62" y="-17" width="58" height="34" rx="9" fill="#3a4034"/><rect x="-70" y="-11" width="10" height="22" rx="3" fill="#23271f"/><rect x="-44" y="-23" width="20" height="8" rx="3" fill="#23271f"/><rect x="-6" y="-14" width="8" height="28" rx="3" fill="#23271f"/><circle cx="2" cy="0" r="6" fill="#e8590c"/></g>
<g transform="translate(330 152) scale(0.9 0.9)"><path d="M-18 -32 L-19 0 M-11 -32 L-10 0" stroke="#5a3e26" stroke-width="3.4" stroke-linecap="round"/><path d="M14 -34 L19 -16 L16 0 M21 -34 L26 -16 L23 0" stroke="#5a3e26" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M-24 -44 C-24 -52 -10 -55 6 -54 C20 -54 31 -51 31 -41 C31 -33 25 -29 15 -29 L-16 -29 C-22 -29 -24 -35 -24 -44z" fill="#9a7350"/><path d="M-22 -44 L-31 -66 L-21 -70 L-11 -50z" fill="#9a7350"/><path d="M-29 -65 C-36 -68 -44 -64 -47 -59 L-45 -56 C-39 -56 -32 -57 -25 -61z" fill="#9a7350"/><path d="M-47 -59 L-45 -56" stroke="#1d1a16" stroke-width="2.6" stroke-linecap="round"/><path d="M-25 -68 C-18 -78 -12 -80 -10 -78 C-13 -72 -18 -67 -23 -65z" fill="#9a7350" stroke="#5a3e26" stroke-width=".8"/><circle cx="-34" cy="-63" r="1.3" fill="#111"/><ellipse cx="28" cy="-42" rx="4.5" ry="8" fill="#f3ead8"/><path d="M30 -48 C34 -44 34 -40 31 -37 L29 -45z" fill="#1d1a16"/></g>
<path d="M94 106 H286" stroke="#e8590c" stroke-width="2.6" stroke-dasharray="7 5"/><path d="M294.0 106.0 L284.0 100.5 L284.0 111.5z" fill="#e8590c"/>
<path d="M290 120 H104" stroke="#4a7fb0" stroke-width="2.6" stroke-dasharray="7 5"/><path d="M96.0 120.0 L106.0 125.5 L106.0 114.5z" fill="#4a7fb0"/>
<text x="190" y="98" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">pulse out</text>
<text x="190" y="141" font-size="16" font-weight="bold" fill="#4a7fb0" text-anchor="middle">echo back</text>
<text x="14" y="180" font-size="15" font-weight="bold" fill="#2f3a2b">Range on the box vs on a deer (one maker)</text>
<rect x="14" y="192" width="372" height="26" rx="4" fill="#4a7fb0"/>
<text x="24" y="211" font-size="16" font-weight="bold" fill="#fffaf0">Shiny targets echo far: 1,800 yd</text>
<rect x="14" y="226" width="186" height="26" rx="4" fill="#8b5a2b"/>
<text x="24" y="245" font-size="16" font-weight="bold" fill="#fffaf0">Deer: 900 yd</text>
<text x="210" y="245" font-size="16" font-weight="bold" fill="#8b5a2b">about half as far</text>
</svg>
