<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A laser rangefinder sends a pulse of invisible light to the deer and times the echo coming back. Shiny targets echo much farther than a deer coat; one maker lists 1,800 yards on reflective targets but 900 yards on deer.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A laser rangefinder times light</text><rect x="30" y="130" width="60" height="36" rx="8" fill="#2f3a2b" stroke="none" stroke-width="2"/><circle cx="84" cy="148" r="8" fill="#e8590c" stroke="none" stroke-width="2"/><g transform="translate(290 100) scale(0.8)"><ellipse cx="62" cy="50" rx="44" ry="20" fill="#8b5a2b"/><path d="M28 42 L14 14 L24 10 L40 36 Z" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="12" cy="12" rx="13" ry="7" fill="#8b5a2b" transform="rotate(-20 12 12)"/><path d="M14 4 l6 -12 l4 10 Z" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="40" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="82" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="94" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><ellipse cx="104" cy="44" rx="5" ry="8" fill="#f4efe6"/></g><line x1="92" y1="142" x2="300" y2="142" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6"/><line x1="300" y1="154" x2="92" y2="154" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6"/><line x1="260" y1="142" x2="300" y2="142" stroke="#b3261e" stroke-width="2" stroke-linecap="round"/><path d="M293.7 145.0 L300 142 L293.7 139.0" fill="none" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="132" y1="154" x2="92" y2="154" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><path d="M98.3 151.0 L92 154 L98.3 157.0" fill="none" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="196" y="132" font-size="14" font-weight="bold" fill="#b3261e" text-anchor="middle">pulse out</text><text x="196" y="174" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">echo back</text><text x="200" y="214" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Shiny targets echo far.</text><text x="200" y="233" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A deer coat echoes about half as far.</text><text x="200.0" y="286" font-size="13" fill="#2f3a2b" text-anchor="middle">Example: 1,800 yd reflective, 900 yd on deer (one maker)</text>
</svg>
