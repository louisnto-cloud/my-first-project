<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 336" font-family="sans-serif" role="img" aria-label="&quot;Hug a tree&quot; is not only for kids. Hug a Tree for kids, then the adult version. Stay put: STOP, then stay put. Keep warm and dry: shelter, fire, dry layers. Answer searchers: whistle 3, lights, orange. Don't hide: be seen in the open. Same core ideas, plus calling 911 and signals (70 to 75%).">
<rect width="400" height="336" rx="12" fill="#EEF1EA"/>
<text x="16" y="30" font-size="18" font-weight="bold" fill="#1F3D2B">&quot;Hug a tree&quot; is not only for kids</text><rect x="12" y="44" width="160" height="30" rx="8" fill="#C9D3C4"/><text x="92" y="64" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">Hug a Tree (kids)</text><rect x="208" y="44" width="180" height="30" rx="8" fill="#1F3D2B"/><text x="298" y="64" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Adult version</text><rect x="12" y="82" width="160" height="44" rx="8" fill="#FFFFFF" stroke="#C9D3C4"/><text x="92" y="109" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Stay put</text><path d="M176 104 H197" stroke="#1F3D2B" stroke-width="3" fill="none"/><path d="M204 104 l-9 -6 v12z" fill="#1F3D2B"/><rect x="208" y="82" width="180" height="44" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="298" y="109" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">STOP, then stay put</text><rect x="12" y="134" width="160" height="44" rx="8" fill="#FFFFFF" stroke="#C9D3C4"/><text x="92" y="161" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Keep warm and dry</text><path d="M176 156 H197" stroke="#1F3D2B" stroke-width="3" fill="none"/><path d="M204 156 l-9 -6 v12z" fill="#1F3D2B"/><rect x="208" y="134" width="180" height="44" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="298" y="161" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Shelter, fire, dry layers</text><rect x="12" y="186" width="160" height="44" rx="8" fill="#FFFFFF" stroke="#C9D3C4"/><text x="92" y="213" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Answer searchers</text><path d="M176 208 H197" stroke="#1F3D2B" stroke-width="3" fill="none"/><path d="M204 208 l-9 -6 v12z" fill="#1F3D2B"/><rect x="208" y="186" width="180" height="44" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="298" y="213" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Whistle 3, lights, orange</text><rect x="12" y="238" width="160" height="44" rx="8" fill="#FFFFFF" stroke="#C9D3C4"/><text x="92" y="265" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Don't hide</text><path d="M176 260 H197" stroke="#1F3D2B" stroke-width="3" fill="none"/><path d="M204 260 l-9 -6 v12z" fill="#1F3D2B"/><rect x="208" y="238" width="180" height="44" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="298" y="265" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Be seen in the open</text><text x="16" y="300" font-size="14" fill="#17201A">Same core ideas, plus calling 911 and signals (70</text>
<text x="16" y="318" font-size="14" fill="#17201A">to 75%).</text>
</svg>
