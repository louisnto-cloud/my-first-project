<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Simplified elk skeleton. The spine runs along the top. The shoulder blade is a thick plate over the front ribs, up to about 6 cm thick on a bull. The leg bones run down from it. The aim mark sits on the ribs just behind the shoulder blade, over the lungs. The pelvis is at the rear.">
<rect width="400" height="300" fill="#fffaf0"/>
