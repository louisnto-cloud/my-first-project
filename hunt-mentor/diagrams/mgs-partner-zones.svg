<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Top view of two hunters in layout blinds. The left hunter takes birds in the left zone, the right hunter birds in the right zone. One caller says take them, a Tip. Never swing past the middle line, a Tip.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Two hunters: one caller, two zones</text><rect x="0" y="36" width="400" height="264" rx="0" fill="#d9c48f"/><path d="M150 230 L40 60 L200 60 Z" fill="#4a7fb0" opacity=".25"/><path d="M250 230 L200 60 L360 60 Z" fill="#e8590c" opacity=".25"/><line x1="200" y1="60" x2="200" y2="240" stroke="#fff" stroke-width="3" stroke-dasharray="6 5"/><g transform="translate(150 240) scale(1.3)"><rect x="-22" y="-8" width="44" height="16" rx="8" fill="#d9c48f" stroke="#6b4f35" stroke-width="2"/><circle cx="14" cy="0" r="5" fill="#2f3a2b"/></g><g transform="translate(250 240) scale(1.3)"><rect x="-22" y="-8" width="44" height="16" rx="8" fill="#d9c48f" stroke="#6b4f35" stroke-width="2"/><circle cx="14" cy="0" r="5" fill="#2f3a2b"/></g><text x="110" y="110" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Left hunter</text><text x="110" y="128" font-size="14" fill="#2f3a2b" text-anchor="middle">left birds</text><text x="290" y="110" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Right hunter</text><text x="290" y="128" font-size="14" fill="#2f3a2b" text-anchor="middle">right birds</text><rect x="80" y="160" width="240" height="40" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="185" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">One voice: &quot;Take them!&quot; (Tip)</text><text x="200" y="290" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Never swing past the middle line (Tip)</text>
</svg>
