<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="sans-serif" role="img" aria-label="Three roads in for a new BC hunter. CORE course: about 21 hours of self study and handling practice, proof needed for most licences, a 30 dollar graduate fee plus exam fees to verify. Initiation licence: 18 or older, never held a BC hunting licence, once in a lifetime, 19 dollars, supervised at all times. Youth licence: age 10 to under 18, a parent applies, 7 dollars, supervised by an adult, and the take counts against the supervisor&#x27;s bag limit. Synopsis pages 5, 6 and 8. No one under 10 may hunt.">
<rect x="0" y="0" width="400" height="400" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Three roads in for a new hunter</text><rect x="8" y="44" width="124" height="322" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/><rect x="8" y="44" width="124" height="52" rx="10" fill="#2f3a2b"/><text x="70" y="66" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">CORE course</text><g transform="translate(70 128) scale(1.2)"><path d="M0 -12 Q-10 -18 -20 -14 V16 Q-10 12 0 18 Q10 12 20 16 V-14 Q10 -18 0 -12 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -12 V18" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="70" y="176" font-size="14" fill="#23261f" text-anchor="middle">About 21 hours</text><text x="70" y="193" font-size="14" fill="#23261f" text-anchor="middle">of study</text><text x="70" y="220" font-size="14" fill="#23261f" text-anchor="middle">Proof needed</text><text x="70" y="237" font-size="14" fill="#23261f" text-anchor="middle">for most</text><text x="70" y="254" font-size="14" fill="#23261f" text-anchor="middle">licences</text><text x="70" y="281" font-size="14" fill="#23261f" text-anchor="middle">$30 graduate</text><text x="70" y="298" font-size="14" fill="#23261f" text-anchor="middle">fee</text><text x="70" y="325" font-size="14" fill="#23261f" text-anchor="middle">Exam fees:</text><text x="70" y="342" font-size="14" fill="#23261f" text-anchor="middle">VERIFY</text><rect x="138" y="44" width="124" height="322" rx="10" fill="#fff" stroke="#e8590c" stroke-width="2.5"/><rect x="138" y="44" width="124" height="52" rx="10" fill="#e8590c"/><text x="200" y="66" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Initiation</text><text x="200" y="83" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">licence</text><g transform="translate(200 128) scale(1.2)"><circle cx="-9" cy="-10" r="6" fill="#2f3a2b"/><path d="M-18 16 V2 Q-9 -5 0 2 V16 Z" fill="#2f3a2b"/><circle cx="10" cy="-8" r="6" fill="#8a9a6b"/><path d="M1 18 V4 Q10 -3 19 4 V18 Z" fill="#8a9a6b"/></g><text x="200" y="176" font-size="14" fill="#23261f" text-anchor="middle">18 or older</text><text x="200" y="203" font-size="14" fill="#23261f" text-anchor="middle">Never held a BC</text><text x="200" y="220" font-size="14" fill="#23261f" text-anchor="middle">licence</text><text x="200" y="247" font-size="14" fill="#23261f" text-anchor="middle">Once in a</text><text x="200" y="264" font-size="14" fill="#23261f" text-anchor="middle">lifetime, $19</text><text x="200" y="291" font-size="14" fill="#23261f" text-anchor="middle">Supervised at</text><text x="200" y="308" font-size="14" fill="#23261f" text-anchor="middle">all times</text><rect x="268" y="44" width="124" height="322" rx="10" fill="#fff" stroke="#4a7fb0" stroke-width="2.5"/><rect x="268" y="44" width="124" height="52" rx="10" fill="#4a7fb0"/><text x="330" y="66" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Youth licence</text><g transform="translate(330 128) scale(1.2)"><circle cx="0" cy="-12" r="7" fill="#2f3a2b"/><path d="M-10 18 V2 Q0 -6 10 2 V18 Z" fill="#2f3a2b"/></g><text x="330" y="176" font-size="14" fill="#23261f" text-anchor="middle">Age 10 to under</text><text x="330" y="193" font-size="14" fill="#23261f" text-anchor="middle">18</text><text x="330" y="220" font-size="14" fill="#23261f" text-anchor="middle">Parent applies,</text><text x="330" y="237" font-size="14" fill="#23261f" text-anchor="middle">$7</text><text x="330" y="264" font-size="14" fill="#23261f" text-anchor="middle">Supervised by</text><text x="330" y="281" font-size="14" fill="#23261f" text-anchor="middle">an adult</text><text x="330" y="308" font-size="14" fill="#23261f" text-anchor="middle">Take counts on</text><text x="330" y="325" font-size="14" fill="#23261f" text-anchor="middle">supervisor</text><text x="200" y="388" font-size="13" fill="#6b4f35" text-anchor="middle">Synopsis pages 5, 6 and 8, 99%. No one under 10 may hunt.</text>
</svg>
