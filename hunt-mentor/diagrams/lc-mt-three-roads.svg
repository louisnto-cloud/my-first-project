<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 510" font-family="sans-serif" role="img" aria-label="Three roads in for a new BC hunter. CORE course: about 21 hours of self study and handling practice, proof needed for most licences, a 30 dollar graduate fee plus exam fees to verify. Initiation licence: 18 or older, never held a BC hunting licence, once in a lifetime, 19 dollars, supervised at all times. Youth licence: age 10 to under 18, a parent applies, 7 dollars, supervised by an adult, and the take counts against the supervisor&#x27;s bag limit. Synopsis pages 5, 6 and 8, 99 percent. No one under 10 may hunt.">
<rect width="400" height="510" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Three roads in for a new hunter</text>
<rect x="8" y="40" width="384" height="134" rx="8" fill="#fffdf7" stroke="#2f3a2b" stroke-width="2"/>
<path d="M8 48 Q8 40 16 40 H384 Q392 40 392 48 V70 H8z" fill="#2f3a2b"/>
<text x="20" y="62" font-size="17" font-weight="bold" fill="#fffaf0">CORE course</text>
<g transform="translate(44 124.0)" fill="none" stroke="#2f3a2b" stroke-width="3" stroke-linejoin="round"><path d="M0 -10 C-6 -15 -14 -15 -20 -12 V14 C-14 11 -6 11 0 16 C6 11 14 11 20 14 V-12 C14 -15 6 -15 0 -10z" fill="#fffaf0"/><path d="M0 -10 V16"/></g>
<circle cx="84" cy="90" r="3" fill="#2f3a2b"/>
<text x="94" y="95" font-size="16" fill="#2f3a2b">About 21 hours of study</text>
<circle cx="84" cy="113" r="3" fill="#2f3a2b"/>
<text x="94" y="118" font-size="16" fill="#2f3a2b">Proof needed for most licences</text>
<circle cx="84" cy="136" r="3" fill="#2f3a2b"/>
<text x="94" y="141" font-size="16" font-weight="bold" fill="#e8590c">$30 graduate fee</text>
<circle cx="84" cy="159" r="3" fill="#2f3a2b"/>
<text x="94" y="164" font-size="16" font-weight="bold" fill="#c0392b">Exam fees: VERIFY</text>
<rect x="8" y="182" width="384" height="134" rx="8" fill="#fffdf7" stroke="#e8590c" stroke-width="2"/>
<path d="M8 190 Q8 182 16 182 H384 Q392 182 392 190 V212 H8z" fill="#e8590c"/>
<text x="20" y="204" font-size="17" font-weight="bold" fill="#fffaf0">Initiation licence</text>
<g transform="translate(35 267.0) scale(0.9)"><circle cx="0" cy="-13" r="7" fill="#2f3a2b"/><path d="M-11 14 V0 C-11 -5 -6 -4 0 -4 C6 -4 11 -5 11 0 V14z" fill="#2f3a2b"/></g><g transform="translate(55 269.0) scale(0.9)"><circle cx="0" cy="-13" r="7" fill="#8a9a6b"/><path d="M-11 14 V0 C-11 -5 -6 -4 0 -4 C6 -4 11 -5 11 0 V14z" fill="#8a9a6b"/></g>
<circle cx="84" cy="232" r="3" fill="#e8590c"/>
<text x="94" y="237" font-size="16" fill="#2f3a2b">18 or older</text>
<circle cx="84" cy="255" r="3" fill="#e8590c"/>
<text x="94" y="260" font-size="16" fill="#2f3a2b">Never held a BC licence</text>
<circle cx="84" cy="278" r="3" fill="#e8590c"/>
<text x="94" y="283" font-size="16" font-weight="bold" fill="#e8590c">Once in a lifetime, $19</text>
<circle cx="84" cy="301" r="3" fill="#e8590c"/>
<text x="94" y="306" font-size="16" fill="#2f3a2b">Supervised at all times</text>
<rect x="8" y="324" width="384" height="134" rx="8" fill="#fffdf7" stroke="#4a7fb0" stroke-width="2"/>
<path d="M8 332 Q8 324 16 324 H384 Q392 324 392 332 V354 H8z" fill="#4a7fb0"/>
<text x="20" y="346" font-size="17" font-weight="bold" fill="#fffaf0">Youth licence</text>
<g transform="translate(44 409.0) scale(1.0)"><circle cx="0" cy="-13" r="7" fill="#2f3a2b"/><path d="M-11 14 V0 C-11 -5 -6 -4 0 -4 C6 -4 11 -5 11 0 V14z" fill="#2f3a2b"/></g>
<circle cx="84" cy="374" r="3" fill="#4a7fb0"/>
<text x="94" y="379" font-size="16" fill="#2f3a2b">Age 10 to under 18</text>
<circle cx="84" cy="397" r="3" fill="#4a7fb0"/>
<text x="94" y="402" font-size="16" font-weight="bold" fill="#e8590c">Parent applies, $7</text>
<circle cx="84" cy="420" r="3" fill="#4a7fb0"/>
<text x="94" y="425" font-size="16" fill="#2f3a2b">Supervised by an adult</text>
<circle cx="84" cy="443" r="3" fill="#4a7fb0"/>
<text x="94" y="448" font-size="16" fill="#2f3a2b">Take counts on supervisor</text>
<text x="200" y="478" font-size="15" fill="#6b5b4b" text-anchor="middle">Synopsis pages 5, 6 and 8, 99%.</text>
<text x="200" y="498" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">No one under 10 may hunt.</text>
</svg>
