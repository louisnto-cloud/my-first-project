<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 352" font-family="sans-serif" role="img" aria-label="September in Region 3. 1 September: youth only and bow only mule deer bucks, youth grouse, black bear, coyote and doves open. 1 to 9 September: 4 point bucks in MUs 3-15, 3-16, 3-32 and 3-33 only. 8 September: ducks, coots and snipe; geese 8 to 20 September. 10 September: 4 point mule deer bucks, white tailed bucks and grouse. 20 September: spike fork moose in some MUs and MU 3-46 deer seasons. MU means Management Unit.">
<rect width="400" height="352" fill="#fffaf0"/>
<text x="14" y="28" font-size="18" font-weight="bold" fill="#2f3a2b">September opens</text>
<rect x="8" y="44" width="72" height="52" rx="8" fill="#8a9a6b"/>
<text x="44" y="76" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">1 Sep</text>
<rect x="84" y="44" width="308" height="52" rx="8" fill="#f4eedf"/>
<text x="94" y="65" font-size="15" fill="#2f3a2b">Youth and bow mule deer bucks. Youth</text>
<text x="94" y="85" font-size="15" fill="#2f3a2b">grouse. Bear, coyote, doves</text>
<rect x="8" y="102" width="72" height="52" rx="8" fill="#8a9a6b"/>
<text x="44" y="134" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">1 Sep</text>
<rect x="84" y="102" width="308" height="52" rx="8" fill="#f4eedf"/>
<text x="94" y="123" font-size="15" fill="#2f3a2b">4 point bucks 1 to 9 Sep in MUs 3-15,</text>
<text x="94" y="143" font-size="15" fill="#2f3a2b">3-16, 3-32, 3-33 only</text>
<rect x="8" y="160" width="72" height="46" rx="8" fill="#4a7fb0"/>
<text x="44" y="189" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">8 Sep</text>
<rect x="84" y="160" width="308" height="46" rx="8" fill="#f4eedf"/>
<text x="94" y="188" font-size="15" fill="#2f3a2b">Ducks, coots, snipe. Geese 8 to 20 Sep</text>
<rect x="8" y="212" width="72" height="52" rx="8" fill="#e8590c"/>
<text x="44" y="244" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">10 Sep</text>
<rect x="84" y="212" width="308" height="52" rx="8" fill="#f4eedf"/>
<text x="94" y="233" font-size="15" fill="#2f3a2b">4 point mule deer bucks. White tailed</text>
<text x="94" y="253" font-size="15" fill="#2f3a2b">bucks. Grouse</text>
<rect x="8" y="270" width="72" height="52" rx="8" fill="#8b5a2b"/>
<text x="44" y="302" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">20 Sep</text>
<rect x="84" y="270" width="308" height="52" rx="8" fill="#f4eedf"/>
<text x="94" y="291" font-size="15" fill="#2f3a2b">Spike fork moose in some MUs. MU</text>
<text x="94" y="311" font-size="15" fill="#2f3a2b">3-46 deer</text>
<text x="14" y="342" font-size="14" fill="#6b5b4b">MU: Management Unit. Region 3.</text>
</svg>
