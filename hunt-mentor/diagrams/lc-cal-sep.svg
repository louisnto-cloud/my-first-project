<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 292" font-family="sans-serif" role="img" aria-label="September in Region 3. 1 September: youth only and bow only mule deer bucks, youth grouse, black bear, coyote and doves open. 1 to 9 September: 4 point bucks in MUs 3-15, 3-16, 3-32 and 3-33 only. 8 September: ducks, coots and snipe; geese 8 to 20 September. 10 September: 4 point mule deer bucks, white tailed bucks and grouse. 20 September: spike fork moose in some MUs and MU 3-46 deer seasons.">
<rect x="0" y="0" width="400" height="292" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">September opens</text><rect x="10" y="46" width="74" height="40" rx="8" fill="#8a9a6b"/><text x="47" y="72" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">1 Sep</text><text x="94" y="62" font-size="14" fill="#23261f" text-anchor="start">Youth and bow mule deer bucks. Youth</text><text x="94" y="79" font-size="14" fill="#23261f" text-anchor="start">grouse. Bear, coyote, doves</text><rect x="10" y="94" width="74" height="40" rx="8" fill="#8a9a6b"/><text x="47" y="120" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">1 Sep</text><text x="94" y="110" font-size="14" fill="#23261f" text-anchor="start">4 point bucks 1 to 9 Sep in MUs 3-15,</text><text x="94" y="127" font-size="14" fill="#23261f" text-anchor="start">3-16, 3-32, 3-33 only</text><rect x="10" y="142" width="74" height="40" rx="8" fill="#4a7fb0"/><text x="47" y="168" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">8 Sep</text><text x="94" y="158" font-size="14" fill="#23261f" text-anchor="start">Ducks, coots, snipe. Geese 8 to 20 Sep</text><rect x="10" y="190" width="74" height="40" rx="8" fill="#e8590c"/><text x="47" y="216" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">10 Sep</text><text x="94" y="206" font-size="14" fill="#23261f" text-anchor="start">4 point mule deer bucks. White tailed</text><text x="94" y="223" font-size="14" fill="#23261f" text-anchor="start">bucks. Grouse</text><rect x="10" y="238" width="74" height="40" rx="8" fill="#8b5a2b"/><text x="47" y="264" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">20 Sep</text><text x="94" y="254" font-size="14" fill="#23261f" text-anchor="start">Spike fork moose in some MUs. MU 3-46</text><text x="94" y="271" font-size="14" fill="#23261f" text-anchor="start">deer</text>
</svg>
