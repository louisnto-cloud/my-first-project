<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Step 3 of reading a forecast for hunting: Check rain, snow and the snow line. Fresh snow up high pushes mule deer down (85%).">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="30" cy="30" r="20" fill="#e8590c"/>
<text x="30" y="37" font-family="sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="60" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Check rain, snow and the snow line</text>
<g transform="translate(140 120) scale(1.4)" fill="#c9cfd6"><circle cx="-14" cy="4" r="11"/><circle cx="2" cy="-4" r="15"/><circle cx="18" cy="4" r="11"/><rect x="-14" y="4" width="32" height="11"/></g><text x="126" y="150" font-family="sans-serif" font-size="14" fill="#4a7fb0">*</text><text x="136" y="158" font-family="sans-serif" font-size="14" fill="#4a7fb0">*</text><text x="146" y="150" font-family="sans-serif" font-size="14" fill="#4a7fb0">*</text><text x="156" y="158" font-family="sans-serif" font-size="14" fill="#4a7fb0">*</text><rect x="230" y="110" width="90" height="70" fill="#fff" stroke="#4a7fb0" stroke-width="2"/><text x="275" y="150" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">snow line</text><text x="200" y="225" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Rain or snow, and how low</text>
<text x="200" y="288" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Fresh snow up high pushes mule deer down (85%).</text>
</svg>
