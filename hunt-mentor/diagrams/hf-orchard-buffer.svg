<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Orchard map. Red 100 metre circles around the farmhouse, the worker housing and a packing shed with people in it: no hunting or shooting inside. The orchard is cultivated land: hunt it only with permission. Ask where workers and ladders are today.">
  <rect width="400" height="300" fill="#efe6cf"/>
  <g fill="#2f6e3b">
    <circle cx="160" cy="60" r="6"/><circle cx="190" cy="60" r="6"/><circle cx="220" cy="60" r="6"/><circle cx="250" cy="60" r="6"/><circle cx="280" cy="60" r="6"/>
    <circle cx="160" cy="90" r="6"/><circle cx="190" cy="90" r="6"/><circle cx="220" cy="90" r="6"/><circle cx="250" cy="90" r="6"/><circle cx="280" cy="90" r="6"/>
    <circle cx="160" cy="120" r="6"/><circle cx="190" cy="120" r="6"/><circle cx="220" cy="120" r="6"/><circle cx="250" cy="120" r="6"/><circle cx="280" cy="120" r="6"/>
  </g>
  <text x="220" y="30" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Orchard: permission only (99%)</text>
  <g fill="#c0392b" opacity=".16"><circle cx="70" cy="220" r="70"/><circle cx="220" cy="230" r="70"/><circle cx="350" cy="180" r="70"/></g>
  <g fill="none" stroke="#c0392b" stroke-width="2.5"><circle cx="70" cy="220" r="70"/><circle cx="220" cy="230" r="70"/><circle cx="350" cy="180" r="70"/></g>
  <g fill="#2f3a2b"><rect x="58" y="210" width="24" height="20"/><polygon points="54,210 70,196 86,210"/><rect x="204" y="222" width="34" height="18"/><rect x="338" y="170" width="24" height="20"/></g>
  <g font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle"><text x="70" y="250">farmhouse</text><text x="220" y="260">packing shed</text><text x="350" y="208">workers</text></g>
  <rect x="40" y="276" width="320" height="22" rx="4" fill="#fffaf0"/><text x="200" y="292" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">100 m (109 yd) circles: no shooting (99%)</text>
</svg>
