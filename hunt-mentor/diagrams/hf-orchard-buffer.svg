<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 534" font-family="sans-serif" role="img" aria-label="Bird&#x27;s eye map of an orchard farm, drawn to scale, north up. A farmhouse, worker housing and a packing shed with people in it each have a red 100 metre ring: no hunting or shooting within 100 metres (109 yards) of a dwelling or occupied farm building (99%). The rings overlap the edge of the orchard. The orchard is cultivated land: permission needed (95%). A hunter stands in the orchard outside the rings, aiming away from the buildings, the road and the pickers. Pickers with a ladder: ask where workers are today (Tip). Scale bar 0, 50, 100 metres.">
<rect width="400" height="534" fill="#fffaf0"/>
<defs>
    <pattern id="hf-orchard-buffer-rows" width="16" height="8" patternUnits="userSpaceOnUse">
      <rect width="16" height="8" fill="#d6dcb4"/>
      <circle cx="10" cy="5.5" r="5.4" fill="#3e6230"/>
      <circle cx="8" cy="4" r="5.4" fill="#5b8a43"/>
      <circle cx="6.6" cy="2.8" r="2.4" fill="#7fae5b"/>
    </pattern>
    <clipPath id="hf-orchard-buffer-map"><rect x="8" y="8" width="384" height="320" rx="6"/></clipPath>
  </defs>
<g transform="translate(0 40)">
<g clip-path="url(#hf-orchard-buffer-map)">
    <rect x="8" y="8" width="384" height="320" fill="#e7e9cc"/>
    <!-- grass tufts in the open field -->
    <g stroke="#a9b37f" stroke-width="1.4" stroke-linecap="round" fill="none">
      <path d="M60 80 l2 -6 M64 80 l0 -7 M68 80 l-2 -6"/><path d="M120 96 l2 -6 M124 96 l0 -7 M128 96 l-2 -6"/>
      <path d="M30 140 l2 -6 M34 140 l0 -7 M38 140 l-2 -6"/><path d="M96 62 l2 -6 M100 62 l0 -7 M104 62 l-2 -6"/>
      <path d="M40 290 l2 -6 M44 290 l0 -7 M48 290 l-2 -6"/>
    </g>
    <!-- ponderosa pines in the field (shadow, crown, highlight) -->
    <g>
      <circle cx="134" cy="36" r="13" fill="#3a5a2c" opacity=".35" transform="translate(4 4)"/>
      <path d="M134 22 l5 6 7 -1 -2 7 6 5 -7 3 1 7 -7 -2 -3 7 -3 -7 -7 2 1 -7 -7 -3 6 -5 -2 -7 7 1z" fill="#486f37"/>
      <circle cx="131" cy="33" r="4" fill="#6d9a4f"/>
      <circle cx="160" cy="66" r="11" fill="#3a5a2c" opacity=".35" transform="translate(4 4)"/>
      <path d="M160 54 l4 5 6 -1 -2 6 5 4 -6 3 1 6 -6 -2 -2 6 -3 -6 -6 2 1 -6 -6 -3 5 -4 -2 -6 6 1z" fill="#486f37"/>
      <circle cx="157" cy="63" r="3.4" fill="#6d9a4f"/>
    </g>
    <!-- orchard block: rows of tree crowns -->
    <rect x="188" y="16" width="196" height="268" fill="url(#hf-orchard-buffer-rows)"/>
    <!-- road -->
    <rect x="8" y="296" width="384" height="20" fill="#b9b19c"/>
    <line x1="8" y1="306" x2="392" y2="306" stroke="#f5efdc" stroke-width="1.6" stroke-dasharray="10 8"/>
    <!-- lane and yard -->
    <path d="M100 296 L100 250 Q100 238 112 236 L132 236" fill="none" stroke="#d8c9a4" stroke-width="9"/>
    <path d="M44 180 Q60 128 120 124 Q170 122 174 170 L176 248 Q120 262 60 250 Q38 230 44 180z" fill="#ece2c6"/>
    <!-- fence on the orchard edge -->
    <g stroke="#7a5a3a" stroke-width="1.4">
      <line x1="184" y1="16" x2="184" y2="292"/><line x1="184" y1="292" x2="392" y2="292"/>
    </g>
    <g fill="#7a5a3a"><rect x="182" y="30" width="4" height="4"/><rect x="182" y="70" width="4" height="4"/><rect x="182" y="110" width="4" height="4"/><rect x="182" y="150" width="4" height="4"/><rect x="182" y="190" width="4" height="4"/><rect x="182" y="230" width="4" height="4"/><rect x="182" y="270" width="4" height="4"/><rect x="230" y="290" width="4" height="4"/><rect x="290" y="290" width="4" height="4"/><rect x="350" y="290" width="4" height="4"/></g>
    <!-- 100 m buffer rings, drawn to the scale bar (64 units = 100 m) -->
    <g fill="#c0392b" fill-opacity=".13"><circle cx="78" cy="212" r="64"/><circle cx="148" cy="232" r="64"/><circle cx="148" cy="156" r="64"/></g>
    <g fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 4"><circle cx="78" cy="212" r="64"/><circle cx="148" cy="232" r="64"/><circle cx="148" cy="156" r="64"/></g>
    <!-- buildings, seen from above -->
    <g stroke="#4a3a2a" stroke-width="1.2">
      <rect x="64" y="202" width="30" height="20" fill="#3f342a" opacity=".3" transform="translate(3 3)"/>
      <path d="M64 202 h30 v10 h-30z" fill="#b5643e"/><path d="M64 212 h30 v10 h-30z" fill="#8e4a2c"/>
      <rect x="84" y="204" width="5" height="5" fill="#6b5b4b"/>
      <rect x="132" y="146" width="34" height="22" fill="#3f342a" opacity=".3" transform="translate(3 3)"/>
      <rect x="132" y="146" width="34" height="22" fill="#a9b1b5"/>
      <path d="M137 146 v22 M142 146 v22 M147 146 v22 M152 146 v22 M157 146 v22 M162 146 v22" stroke="#8a9296" stroke-width="1"/>
      <rect x="132" y="226" width="34" height="13" fill="#3f342a" opacity=".3" transform="translate(3 3)"/>
      <path d="M132 226 h34 v6.5 h-34z" fill="#d6b48a"/><path d="M132 232.5 h34 v6.5 h-34z" fill="#b8936a"/>
    </g>
    
    <!-- pickers with a ladder, bottom right of orchard -->
    <g transform="translate(330 248)">
      <path d="M-14 -16 l-5 22 M-6 -16 l5 22 M-17 -8 h11 M-18 -2 h14" stroke="#8b5a2b" stroke-width="1.6" fill="none"/>
      <circle cx="6" cy="-14" r="3.2" fill="#e0b48c"/><path d="M2 -10 h8 l1 10 h-10z" fill="#3d6fa3"/><path d="M3 0 v7 M9 0 v7" stroke="#2f3a2b" stroke-width="2"/>
      <circle cx="20" cy="-10" r="3.2" fill="#e0b48c"/><path d="M16 -6 h8 l1 10 h-10z" fill="#3d6fa3"/><path d="M17 4 v7 M23 4 v7" stroke="#2f3a2b" stroke-width="2"/>
    </g>
    <!-- hunter outside the rings, aiming north east, away from people -->
    <g transform="translate(296 104)">
      <circle cx="0" cy="-12" r="3.6" fill="#e0b48c"/><path d="M-5 -8 h10 l1 12 h-12z" fill="#e8590c"/><path d="M-3 4 v8 M3 4 v8" stroke="#2f3a2b" stroke-width="2.2"/>
      <path d="M4 -6 L20 -20" stroke="#2f3a2b" stroke-width="2.2"/>
    </g>
    <path d="M318 82 L352 52" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
    <path d="M356 48 l-10 2 6 6z" fill="#e8590c"/>
  </g>
  <rect x="8" y="8" width="384" height="320" rx="6" fill="none" stroke="#6b5b4b" stroke-width="1.5"/>
  <!-- north arrow -->
  <g transform="translate(32 46)">
    <circle r="15" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
    <path d="M0 -11 L6 7 L0 3 L-6 7z" fill="#2f3a2b"/>
    <text y="-18" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle" stroke="#e7e9cc" stroke-width="3" paint-order="stroke">N</text>
  </g>
  
<line x1="148" y1="146" x2="148" y2="94" stroke="#c0392b" stroke-width="1.6"/><path d="M148 92 l-4 7 h8z" fill="#c0392b"/>
<text x="124" y="120" font-size="15" font-weight="bold" fill="#8e2a1f" text-anchor="middle" stroke="#f3e3d6" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">100 m</text>
</g>
<rect x="14.5" y="6.0" width="110.9" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="70" y="25" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">packing shed</text>
<line x1="110" y1="33" x2="140" y2="190" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="140" cy="190" r="2.6" fill="#2f3a2b"/>
<rect x="239.9" y="6.0" width="156.2" height="27.0" rx="5" fill="#fffaf0" stroke="#e8590c" stroke-width="1.2"/>
<text x="318" y="25" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">you: outside 100 m</text>
<line x1="300" y1="33" x2="296" y2="132" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="296" cy="132" r="2.6" fill="#2f3a2b"/>
<rect x="10.3" y="376.0" width="91.4" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="56" y="395" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">farmhouse</text>
<line x1="64" y1="376" x2="74" y2="254" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="74" cy="254" r="2.6" fill="#2f3a2b"/>
<rect x="114.2" y="376.0" width="127.6" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="178" y="395" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">worker housing</text>
<line x1="170" y1="376" x2="156" y2="276" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="156" cy="276" r="2.6" fill="#2f3a2b"/>
<rect x="249.4" y="376.0" width="145.3" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="322" y="395" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">pickers: ask (Tip)</text>
<line x1="330" y1="376" x2="338" y2="294" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="338" cy="294" r="2.6" fill="#2f3a2b"/>
<circle cx="26" cy="428" r="12" fill="#c0392b" fill-opacity=".13" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
<text x="48" y="423" font-size="16" font-weight="bold" fill="#2f3a2b">No hunting or shooting</text>
<text x="48" y="442" font-size="16" fill="#2f3a2b">within 100 m (109 yd) (99%)</text>
<rect x="14" y="460" width="24" height="24" rx="3" fill="url(#hf-orchard-buffer-rows)" stroke="#6b5b4b"/>
<text x="48" y="478" font-size="16" font-weight="bold" fill="#2f3a2b">Orchard: permission needed (95%)</text>
<g transform="translate(48 500)"><rect x="0" y="0" width="32" height="7" fill="#2f3a2b"/><rect x="32" y="0" width="32" height="7" fill="#fffaf0" stroke="#2f3a2b"/><text x="0" y="23" font-size="14" fill="#2f3a2b" text-anchor="middle">0</text><text x="32" y="23" font-size="14" fill="#2f3a2b" text-anchor="middle">50</text><text x="64" y="23" font-size="14" fill="#2f3a2b">100 m</text></g>
</svg>
