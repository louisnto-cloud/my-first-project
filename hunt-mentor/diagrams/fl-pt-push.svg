<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 354" font-family="sans-serif" role="img" aria-label="A simple push, map view. A strip of cover narrows to a funnel. The stander sits at the crossing at the funnel with a zone of fire pointing away, out of the cover, labelled shoot only out here. The pusher walks slowly through the cover toward the stander and a deer moves ahead of the pusher. A red dashed line with a cross: the stander never shoots back toward the pusher.">
