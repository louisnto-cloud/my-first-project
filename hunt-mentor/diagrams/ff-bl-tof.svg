<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of flight time for a 150 grain .308: 0.12 seconds to 100 m, 0.26 to 200 m, 0.42 to 300 m and 0.61 to 400 m. A deer walking 1 metre a second moves 26 cm during a 200 m flight. Shoot standing animals.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Time of flight: the deer keeps moving</text><text x="74" y="68.2" font-size="14" fill="#23261f" text-anchor="end">100 m</text><rect x="80" y="50" width="38.15384615384615" height="26" rx="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="124.15384615384616" y="68.2" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">0.12 s</text><text x="74" y="106.2" font-size="14" fill="#23261f" text-anchor="end">200 m</text><rect x="80" y="88" width="80.92307692307692" height="26" rx="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="166.9230769230769" y="106.2" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">0.26 s</text><text x="74" y="144.2" font-size="14" fill="#23261f" text-anchor="end">300 m</text><rect x="80" y="126" width="130.15384615384613" height="26" rx="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="216.15384615384613" y="144.2" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">0.42 s</text><text x="74" y="182.2" font-size="14" fill="#23261f" text-anchor="end">400 m</text><rect x="80" y="164" width="186.46153846153845" height="26" rx="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="272.46153846153845" y="182.2" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">0.61 s</text><text x="200" y="214" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A deer walking 1 m/s moves</text><text x="200" y="234" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">26 cm in a 200 m flight</text><text x="200.0" y="274" font-size="14" fill="#2f3a2b" text-anchor="middle">Shoot standing animals. Wait for the stop.</text>
</svg>
