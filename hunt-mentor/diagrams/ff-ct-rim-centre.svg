<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two cartridge bases. Centrefire .308: the primer is a separate cup in the centre of the base and the pin hits it there; most centrefire cases can be reloaded. Rimfire .22 long rifle: the priming compound is inside the hollow rim and the pin crushes the rim; rimfire cannot be reloaded.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Where the primer sits</text><rect x="14" y="46" width="180" height="200" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="104.0" y="68" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Centrefire .308</text><text x="104.0" y="90" font-size="14" fill="#23261f" text-anchor="middle"></text><text x="104.0" y="108" font-size="14" fill="#23261f" text-anchor="middle"></text><text x="104.0" y="126" font-size="14" fill="#23261f" text-anchor="middle"></text><text x="104.0" y="144" font-size="14" fill="#23261f" text-anchor="middle"></text><text x="104.0" y="162" font-size="14" fill="#23261f" text-anchor="middle">Primer in the</text><text x="104.0" y="180" font-size="14" fill="#23261f" text-anchor="middle">centre of the base</text><text x="104.0" y="198" font-size="14" fill="#23261f" text-anchor="middle">Most can be reloaded</text><circle cx="104" cy="116" r="30" fill="#c9a227" stroke="#2f3a2b" stroke-width="2"/><circle cx="104" cy="116" r="10" fill="#c0c0c0" stroke="#2f3a2b" stroke-width="2"/><circle cx="104" cy="116" r="4" fill="#e8590c" stroke="none" stroke-width="2"/><rect x="206" y="46" width="180" height="200" rx="8" fill="#f8e3cf" stroke="none" stroke-width="2"/><text x="296.0" y="68" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Rimfire .22 LR</text><text x="296.0" y="90" font-size="14" fill="#23261f" text-anchor="middle"></text><text x="296.0" y="108" font-size="14" fill="#23261f" text-anchor="middle"></text><text x="296.0" y="126" font-size="14" fill="#23261f" text-anchor="middle"></text><text x="296.0" y="144" font-size="14" fill="#23261f" text-anchor="middle"></text><text x="296.0" y="162" font-size="14" fill="#23261f" text-anchor="middle">Priming compound</text><text x="296.0" y="180" font-size="14" fill="#23261f" text-anchor="middle">inside the rim</text><text x="296.0" y="198" font-size="14" fill="#23261f" text-anchor="middle">Cannot be reloaded</text><circle cx="296" cy="116" r="28" fill="#c58b4a" stroke="#2f3a2b" stroke-width="2"/><circle cx="296" cy="116" r="23" fill="none" stroke="#e8590c" stroke-width="5"/><circle cx="296" cy="93" r="4" fill="#e8590c" stroke="none" stroke-width="2"/><text x="200.0" y="278" font-size="14" fill="#2f3a2b" text-anchor="middle">Pin hits the centre, or crushes the rim</text>
</svg>
