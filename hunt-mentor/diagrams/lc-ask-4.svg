<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 4: offer your phone number and plate, to walk not drive, to park and shoot only where they say, and help such as fence work or firewood. Meat if they want it. Never money.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" fill="#dfe6d3" opacity=".35"/><circle cx="30" cy="32" r="18" fill="#fffaf0" stroke="#e8590c" stroke-width="2.5"/><text x="30" y="37" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">4</text><text x="58" y="39" font-size="19" font-weight="bold" fill="#23261f" text-anchor="start">Offer, never money</text><rect x="0" y="214" width="400" height="86" fill="#fffaf0"/><rect x="0" y="208" width="400" height="6" fill="#8a9a6b"/><g transform="translate(50 150) scale(1.3)"><rect x="-10" y="-18" width="20" height="36" rx="4" fill="#2f3a2b"/><rect x="-7" y="-13" width="14" height="24" fill="#dbe7f2"/><circle cx="0" cy="14" r="1.8" fill="#fff"/></g><g transform="translate(120 160) scale(1.4)"><rect x="-22" y="-6" width="26" height="16" rx="2" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 -2 h10 l6 6 v6 h-16 z" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-12" cy="12" r="5" fill="#2f3a2b"/><circle cx="12" cy="12" r="5" fill="#2f3a2b"/></g><g transform="translate(190 150) scale(1.4)"><path d="M-10 18 V-2 M-10 -2 V-14 Q-6 -18 -3 -14 V-4 V-18 Q0 -22 3 -18 V-4 V-16 Q6 -20 9 -16 V2 L14 -6 Q19 -6 16 2 L6 18 Z" fill="#f2d6c0" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(260 150) scale(1.3)"><path d="M-18 -4 Q-14 -18 6 -14 Q22 -10 18 6 Q12 18 -6 14 Q-20 10 -18 -4 Z" fill="#c0504d" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -2 Q2 -8 10 0" stroke="#f5e0d8" stroke-width="3" fill="none"/><circle cx="8" cy="6" r="3" fill="#f5f0e0"/></g><g transform="translate(336 150) scale(1.4)"><circle r="18" fill="#fff" stroke="#e8590c" stroke-width="3"/><text x="0" y="8" font-size="24" font-weight="bold" fill="#2f3a2b" text-anchor="middle">$</text><line x1="-12" y1="12" x2="12" y2="-12" stroke="#e8590c" stroke-width="3.5"/></g><text x="200" y="240" font-size="16" fill="#23261f" text-anchor="middle">Phone and plate first. Walk, park and shoot</text><text x="200" y="260" font-size="16" fill="#23261f" text-anchor="middle">where they say. Ask what would help.</text>
</svg>
