<g transform="translate(192 130) scale(1.4)"><path d="M-10 18 V-2 M-10 -2 V-14 Q-6 -18 -3 -14 V-4 V-18 Q0 -22 3 -18 V-4 V-16 Q6 -20 9 -16 V2 L14 -6 Q19 -6 16 2 L6 18 Z" fill="#f2d6c0" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(266 130) scale(1.3)"><path d="M-18 -4 Q-14 -18 6 -14 Q22 -10 18 6 Q12 18 -6 14 Q-20 10 -18 -4 Z" fill="#c0504d" stroke="#2f3a2b" stroke-width="2.5" stroke-linejoin="round"/><path d="M-8 -2 Q2 -8 10 0" stroke="#f5e0d8" stroke-width="3" fill="none"/><circle cx="8" cy="6" r="3" fill="#f5f0e0"/></g>
<rect x="324" y="114" width="48" height="28" rx="3" fill="#cfe3c4" stroke="#2f3a2b" stroke-width="2"/><circle cx="348" cy="128" r="8" fill="none" stroke="#2f3a2b" stroke-width="2"/><circle cx="348" cy="128" r="27" fill="none" stroke="#c0392b" stroke-width="4"/><line x1="329" y1="147" x2="367" y2="109" stroke="#c0392b" stroke-width="4"/>
<text x="44" y="186" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Phone</text>
<text x="116" y="186" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Plate</text>
<text x="192" y="186" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Help</text>
<text x="266" y="186" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Meat</text>
<text x="348" y="186" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Money</text>
<text x="200" y="242" font-size="16" fill="#23261f" text-anchor="middle">Phone and plate first. Walk, park and shoot</text>
<text x="200" y="264" font-size="16" fill="#23261f" text-anchor="middle">where they say. Ask what would help.</text>
