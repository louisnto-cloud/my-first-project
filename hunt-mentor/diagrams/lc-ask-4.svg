<rect x="0" y="0" width="400" height="300" fill="#dfe6d3" opacity=".35"/>
<circle cx="30" cy="32" r="18" fill="#fffaf0" stroke="#e8590c" stroke-width="2.5"/>
<text x="30" y="38" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">4</text>
<text x="58" y="39" font-size="19" font-weight="bold" fill="#23261f">Offer, never money</text>
<rect x="0" y="214" width="400" height="86" fill="#fffaf0"/><rect x="0" y="208" width="400" height="6" fill="#8a9a6b"/>
<g transform="translate(44 128) scale(1.3)"><rect x="-10" y="-18" width="20" height="36" rx="4" fill="#2f3a2b"/><rect x="-7" y="-13" width="14" height="24" fill="#dbe7f2"/><circle cx="0" cy="14" r="1.8" fill="#fff"/></g>
