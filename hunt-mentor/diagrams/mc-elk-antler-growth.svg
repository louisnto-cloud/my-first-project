<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Antler clock. Bulls drop antlers late February to early April, oldest first. New antlers grow in velvet from April, about 140 days for a mature bull, up to 1.7 cm a day, with 70 percent of growth in the second half. Velvet comes off by late August or early September and antlers are hard bone in September.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">The antler clock</text><text x="60" y="250" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Feb</text><text x="101" y="250" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Mar</text><text x="142" y="250" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Apr</text><text x="183" y="250" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">May</text><text x="224" y="250" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Jun</text><text x="265" y="250" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Jul</text><text x="306" y="250" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Aug</text><text x="347" y="250" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Sep</text><line x1="38" y1="232" x2="372" y2="232" stroke="#23261f" stroke-width="1.5"/><rect x="66" y="200" width="50" height="22" rx="4" fill="#23261f"/><text x="91" y="216" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Drop</text><rect x="102" y="170" width="225" height="22" rx="4" fill="#8b5a2b"/><text x="214" y="186" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">In velvet, about 140 days</text><rect x="327" y="140" width="46" height="22" rx="4" fill="#e8590c"/><text x="350" y="156" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Hard</text><path d="M102 150 C180 148 250 120 322 60" fill="none" stroke="#8a9a6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="70" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Up to 1.7 cm a day</text><text x="130" y="88" font-size="14" fill="#23261f" text-anchor="middle">70% in the 2nd half</text><text x="200" y="274" font-size="14" fill="#6b4f35" text-anchor="middle">Old bulls drop first (90%). Velvet off late Aug (90%)</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">BC elk account; growth: US Park Service (80%)</text>
</svg>
