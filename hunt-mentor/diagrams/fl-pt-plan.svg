<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 386" role="img" aria-label="Six things to agree before you leave the truck: where each of you goes, the time you are back, the meeting point and time, who shoots what, your signals, and what to do if one of you does not show up.">
  <rect x="0" y="0" width="400" height="386" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Agree six things at the truck</text>
<rect x="10" y="46" width="380" height="50" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<path d="M42.0 80 l-12 -24 a14 14 0 1 1 24 0 z" fill="#e8590c" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="68" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Where each goes</text>
<text x="80" y="90" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">marked on both phones</text>
<rect x="10" y="102" width="380" height="50" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<circle cx="42.0" cy="122" r="16" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/><line x1="42.0" y1="122" x2="42.0" y2="112" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><line x1="42.0" y1="122" x2="50.0" y2="122" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/>
<text x="80" y="124" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Back by</text>
<text x="80" y="146" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">a time, not &quot;later&quot;</text>
<rect x="10" y="158" width="380" height="50" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<polygon points="42.0,161.8 30.8,189.8 53.2,189.8" fill="#2f3a2b"/><rect x="39.9" y="189.8" width="4.199999999999999" height="7.0" rx="1" fill="#6b4f35"/>
<text x="80" y="180" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Meeting point</text>
<text x="80" y="202" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">a landmark you both know</text>
<rect x="10" y="214" width="380" height="50" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<ellipse cx="36.0" cy="237.9" rx="13.200000000000001" ry="6.050000000000001" fill="#8b5a2b"/><line x1="27.2" y1="242.3" x2="26.1" y2="253.3" stroke="#8b5a2b" stroke-width="2.2" stroke-linecap="round"/><line x1="31.6" y1="242.3" x2="31.6" y2="253.3" stroke="#8b5a2b" stroke-width="2.2" stroke-linecap="round"/><line x1="41.5" y1="242.3" x2="41.5" y2="253.3" stroke="#8b5a2b" stroke-width="2.2" stroke-linecap="round"/><line x1="45.35" y1="242.3" x2="46.45" y2="253.3" stroke="#8b5a2b" stroke-width="2.2" stroke-linecap="round"/><line x1="47.0" y1="234.6" x2="51.400000000000006" y2="226.9" stroke="#8b5a2b" stroke-width="3.3000000000000003" stroke-linecap="round"/><circle cx="53.05" cy="225.25" r="3.8500000000000005" fill="#8b5a2b"/><path d="M52.5 221.4 l-4 -5.5 M54.7 221.4 l5 -5.5" fill="none" stroke="#5c3b1c" stroke-width="1.375" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="236" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Who shoots what</text>
<text x="80" y="258" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">and who covers which side</text>
<rect x="10" y="270" width="380" height="50" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<text x="42.0" y="298" font-family="sans-serif" font-size="22" font-weight="bold" fill="#b3261e" text-anchor="middle">3</text>
<text x="80" y="292" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Signals</text>
<text x="80" y="314" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">hand, whistle, radio</text>
<rect x="10" y="326" width="380" height="50" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<text x="42.0" y="354" font-family="sans-serif" font-size="24" font-weight="bold" fill="#e8590c" text-anchor="middle">?</text>
<text x="80" y="348" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">If someone is late</text>
<text x="80" y="370" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">how long to wait, then what</text>
</svg>
