<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Six races (subspecies) of black bear in BC from the BC government account. cinnamomum: most of BC east of the Coast Range, brown colour phase common; this is Heffley Creek and the South Okanagan. altifrontalis: the south coast east to Manning Park and Lillooet, mostly black; this is the Fraser Valley. vancouveri: Vancouver Island. carlottae: Haida Gwaii, only black. kermodei: north central coast, includes the white Spirit bear. emmonsii: far northwest, includes the blue Glacier bear.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">6 races of black bear in BC</text><rect x="10" y="52" width="380" height="34" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="18" y="75" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">cinnamomum</text><text x="150" y="75" font-size="14" fill="#23261f" text-anchor="start">Interior. Brown is common</text><rect x="10" y="92" width="380" height="34" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="18" y="115" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">altifrontalis</text><text x="150" y="115" font-size="14" fill="#23261f" text-anchor="start">South coast, Fraser Valley</text><rect x="10" y="132" width="380" height="34" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.2"/><text x="18" y="155" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">vancouveri</text><text x="150" y="155" font-size="14" fill="#23261f" text-anchor="start">Vancouver Island</text><rect x="10" y="172" width="380" height="34" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.2"/><text x="18" y="195" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">carlottae</text><text x="150" y="195" font-size="14" fill="#23261f" text-anchor="start">Haida Gwaii. Black only</text><rect x="10" y="212" width="380" height="34" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.2"/><text x="18" y="235" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">kermodei</text><text x="150" y="235" font-size="14" fill="#23261f" text-anchor="start">North coast. White phase</text><rect x="10" y="252" width="380" height="34" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.2"/><text x="18" y="275" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">emmonsii</text><text x="150" y="275" font-size="14" fill="#23261f" text-anchor="start">Far northwest. Blue phase</text>
</svg>
