<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 236" role="img" aria-label="After a kill: the hunter who killed the animal cancels their own species licence right away, before handling it. You can never use or lend another person licence.">
  <rect x="0" y="0" width="400" height="236" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Whose tag?</text>
<rect x="10" y="46" width="380" height="56" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="26.0" y="58" width="32" height="26" rx="3" fill="#e8590c"/><path d="M34.0 72 l5.6000000000000005 6.4 l11.200000000000001 -12.8" fill="none" stroke="#ffffff" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="68" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Shooter cancels own licence</text>
<text x="80" y="90" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">right away, before handling (99%)</text>
<rect x="10" y="108" width="380" height="56" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="26.0" y="120" width="32" height="26" rx="3" fill="#cccccc"/><path d="M33.9 125.9 l16.2 16.2 M50.1 125.9 l-16.2 16.2" fill="none" stroke="#b3261e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Never use your partner&#x27;s licence</text>
<text x="80" y="152" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">or lend yours (99%)</text>
<rect x="10" y="170" width="380" height="56" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<text x="42.0" y="204" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">2?</text>
<text x="80" y="192" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Both shot?</text>
<text x="80" y="214" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">agree before the hunt (Tip)</text>
</svg>
