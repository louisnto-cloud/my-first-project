<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 352" font-family="sans-serif" role="img" aria-label="Snow depth chart, 0 to 80 cm. Deer: easy to about 30 cm, trouble past about 30 cm, and they leave a slope past about 50 cm. Moose move freely to about 40 cm and are slowed by 40 to 70 cm. Elk sit between deer and moose.">
<rect width="400" height="352" fill="#fffaf0"/>
<text x="200" y="30" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">How much snow is too much?</text>
<text x="92" y="64" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">0</text>
<text x="164" y="64" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">20</text>
<text x="236" y="64" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">40</text>
<text x="308" y="64" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">60</text>
<text x="380" y="64" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">80 cm</text>
<line x1="92.0" y1="72" x2="92.0" y2="306" stroke="#e1d8c2" stroke-width="1.4"/>
<line x1="164.0" y1="72" x2="164.0" y2="306" stroke="#e1d8c2" stroke-width="1.4"/>
<line x1="236.0" y1="72" x2="236.0" y2="306" stroke="#e1d8c2" stroke-width="1.4"/>
<line x1="308.0" y1="72" x2="308.0" y2="306" stroke="#e1d8c2" stroke-width="1.4"/>
<line x1="380.0" y1="72" x2="380.0" y2="306" stroke="#e1d8c2" stroke-width="1.4"/>
<text x="14" y="116" font-size="17" font-weight="bold" fill="#2f3a2b">Deer</text>
<rect x="92.0" y="96" width="108.0" height="28" fill="#8a9a6b"/>
<rect x="200.0" y="96" width="72.0" height="28" fill="#f2a46c"/>
<rect x="272.0" y="96" width="108.0" height="28" fill="#e8590c"/>
<text x="14" y="194" font-size="17" font-weight="bold" fill="#2f3a2b">Elk</text>
<rect x="92.0" y="174" width="288.0" height="28" fill="#eef0e6" stroke="#b9c09f" stroke-dasharray="5 4"/>
<text x="236" y="193" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">between deer and moose</text>
<text x="14" y="272" font-size="17" font-weight="bold" fill="#2f3a2b">Moose</text>
<rect x="92.0" y="252" width="144.0" height="28" fill="#8a9a6b"/>
<rect x="236.0" y="252" width="108.0" height="28" fill="#f2a46c"/>
<line x1="200.0" y1="92" x2="200.0" y2="124" stroke="#2f3a2b" stroke-width="2"/>
<line x1="272.0" y1="92" x2="272.0" y2="124" stroke="#2f3a2b" stroke-width="2"/>
<text x="196" y="88" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">30: trouble</text>
<text x="276" y="88" font-size="15" font-weight="bold" fill="#2f3a2b">50: leaves</text>
<line x1="236.0" y1="252" x2="236.0" y2="286" stroke="#2f3a2b" stroke-width="2"/>
<text x="236" y="302" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">40</text>
<line x1="344.0" y1="252" x2="344.0" y2="286" stroke="#2f3a2b" stroke-width="2"/>
<text x="344" y="302" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">70</text>
<rect x="14" y="324" width="16" height="16" rx="3" fill="#8a9a6b"/>
<text x="36" y="337" font-size="15" fill="#2f3a2b">easy</text>
<rect x="92.4" y="324" width="16" height="16" rx="3" fill="#f2a46c"/>
<text x="114.4" y="337" font-size="15" fill="#2f3a2b">slowed</text>
<rect x="187.9" y="324" width="16" height="16" rx="3" fill="#e8590c"/>
<text x="209.9" y="337" font-size="15" fill="#2f3a2b">moves away</text>
</svg>
