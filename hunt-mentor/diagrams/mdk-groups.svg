<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 416" font-family="sans-serif" role="img" aria-label="Four groups of BC ducks, each drawn in its typical pose. Puddle ducks: mallard, wigeon, pintail, gadwall, two teal, shoveler, wood duck; they tip up to feed, tail in the air. Divers: goldeneyes, bufflehead, scaup, ring necked duck, canvasback, redhead; they dive under to feed. Mergansers: common and hooded, red breasted on the coast; thin toothed bill, eat fish. Sea ducks: scoters, long tailed duck, harlequin; mostly the coast, covered in their own lesson.">
