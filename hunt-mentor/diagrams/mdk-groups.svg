<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four boxes. Puddle ducks: mallard, wigeon, pintail, gadwall, two teal, shoveler, wood duck; they tip up to feed. Divers: goldeneyes, bufflehead, scaup, ring necked duck, canvasback, redhead; they dive to feed. Mergansers: common and hooded, red breasted on the coast; thin toothed bill, eat fish. Sea ducks: scoters, long tailed duck, harlequin; mostly the coast, covered in their own lesson."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">BC ducks: four groups</text><rect x="8" y="38" width="188" height="124" rx="8" fill="#f6d7b0"/><rect x="8" y="38" width="188" height="26" rx="8" fill="#8b5a2b"/><rect x="8" y="52" width="188" height="12" rx="0" fill="#8b5a2b"/><text x="102.0" y="57" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Puddle ducks</text><text x="102.0" y="84" font-size="14" fill="#2f3a2b" text-anchor="middle">Mallard, wigeon, pintail</text><text x="102.0" y="103" font-size="14" fill="#2f3a2b" text-anchor="middle">Gadwall, 2 teal</text><text x="102.0" y="122" font-size="14" fill="#2f3a2b" text-anchor="middle">Shoveler, wood duck</text><text x="102.0" y="141" font-size="14" fill="#2f3a2b" text-anchor="middle">Tip up to feed</text><rect x="204" y="38" width="188" height="124" rx="8" fill="#cfe0ef"/><rect x="204" y="38" width="188" height="26" rx="8" fill="#4a7fb0"/><rect x="204" y="52" width="188" height="12" rx="0" fill="#4a7fb0"/><text x="298.0" y="57" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Divers</text><text x="298.0" y="84" font-size="14" fill="#2f3a2b" text-anchor="middle">Goldeneyes, bufflehead</text><text x="298.0" y="103" font-size="14" fill="#2f3a2b" text-anchor="middle">Scaup, ring necked</text><text x="298.0" y="122" font-size="14" fill="#2f3a2b" text-anchor="middle">Canvasback, redhead</text><text x="298.0" y="141" font-size="14" fill="#2f3a2b" text-anchor="middle">Dive to feed</text><rect x="8" y="170" width="188" height="124" rx="8" fill="#dfe6d3"/><rect x="8" y="170" width="188" height="26" rx="8" fill="#2f3a2b"/><rect x="8" y="184" width="188" height="12" rx="0" fill="#2f3a2b"/><text x="102.0" y="189" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Mergansers</text><text x="102.0" y="216" font-size="14" fill="#2f3a2b" text-anchor="middle">Common, hooded</text><text x="102.0" y="235" font-size="14" fill="#2f3a2b" text-anchor="middle">(red breasted: coast)</text><text x="102.0" y="254" font-size="14" fill="#2f3a2b" text-anchor="middle">Thin toothed bill</text><text x="102.0" y="273" font-size="14" fill="#2f3a2b" text-anchor="middle">Eat fish</text><rect x="204" y="170" width="188" height="124" rx="8" fill="#b9c2cf"/><rect x="204" y="170" width="188" height="26" rx="8" fill="#2f3a2b"/><rect x="204" y="184" width="188" height="12" rx="0" fill="#2f3a2b"/><text x="298.0" y="189" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Sea ducks</text><text x="298.0" y="216" font-size="14" fill="#2f3a2b" text-anchor="middle">Scoters, long tailed</text><text x="298.0" y="235" font-size="14" fill="#2f3a2b" text-anchor="middle">Harlequin</text><text x="298.0" y="254" font-size="14" fill="#2f3a2b" text-anchor="middle">Mostly the coast</text><text x="298.0" y="273" font-size="14" fill="#2f3a2b" text-anchor="middle">Own lesson</text></svg>
