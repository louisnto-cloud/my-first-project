<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Aging timeline: hold the carcass at 1 to 3 degrees for 7 to 14 days, and stop at 14. Slime, mould or an off smell means stop, trim and freeze. No cold room: skip aging and freeze within a few days.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">Aging: cold, and not too long</text><rect x="40" y="110" width="308" height="40" rx="6" fill="#4a7fb0" fill-opacity=".25" stroke="#4a7fb0" stroke-width="2"/><rect x="194" y="110" width="154" height="40" fill="#4a7fb0" fill-opacity=".45"/><line x1="40" y1="150" x2="40" y2="162" stroke="#23261f" stroke-width="2"/><text x="40" y="180" font-size="13" text-anchor="middle" fill="#23261f">day 0</text><line x1="194" y1="150" x2="194" y2="162" stroke="#23261f" stroke-width="2"/><text x="194" y="180" font-size="13" text-anchor="middle" fill="#23261f">day 7</text><line x1="260" y1="150" x2="260" y2="162" stroke="#23261f" stroke-width="2"/><text x="260" y="180" font-size="13" text-anchor="middle" fill="#23261f">day 10</text><line x1="348" y1="150" x2="348" y2="162" stroke="#23261f" stroke-width="2"/><text x="348" y="180" font-size="13" text-anchor="middle" fill="#23261f">day 14</text><text x="271.0" y="136" font-size="15" font-weight="bold" text-anchor="middle" fill="#4a7fb0">7 to 14 days</text><line x1="348" y1="96" x2="348" y2="166" stroke="#b3261e" stroke-width="4"/><text x="348" y="86" font-size="15" font-weight="bold" text-anchor="middle" fill="#b3261e">Stop</text><text x="40" y="76" font-size="16" font-weight="bold" fill="#23261f">Hold at 1 to 3°C</text><text x="20" y="220" font-size="14" font-weight="bold" fill="#23261f">Slime, mould or off smell: stop, trim, freeze.</text><text x="20" y="244" font-size="14" fill="#23261f">No cold room? Skip aging. Cut and freeze</text><text x="20" y="262" font-size="14" fill="#23261f">within a few days (Tip).</text>
</svg>
