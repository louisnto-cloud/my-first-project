<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" font-family="sans-serif" role="img" aria-label="Memory hooks for time and weather. One before, one after: big game legal hours, 99 percent. Half for birds: ducks, half an hour, 99 percent. Seven behind: BC is UTC minus 7 all year, 95 percent. October loses 2 hours of daylight, 90 percent. Snow is a fact: check the bench, not the town.">
<rect width="400" height="340" fill="#fffaf0"/>
<text x="200" y="30" font-size="20" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Memory hooks: time and weather</text>
<rect x="8" y="46" width="384" height="54" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="13" y="51" width="48" height="44" rx="8" fill="#e8590c"/>
<text x="37" y="83" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="74" y="69" font-size="18" font-weight="bold" fill="#2f3a2b">One before, one after</text>
<text x="74" y="90" font-size="15.5" fill="#23261f">big game legal hours (99%)</text>
<rect x="8" y="107" width="384" height="54" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="13" y="112" width="48" height="44" rx="8" fill="#e8590c"/>
<text x="37" y="144" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">½</text>
<text x="74" y="130" font-size="18" font-weight="bold" fill="#2f3a2b">Half for birds</text>
<text x="74" y="151" font-size="15.5" fill="#23261f">ducks: half an hour (99%)</text>
<rect x="8" y="168" width="384" height="54" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="13" y="173" width="48" height="44" rx="8" fill="#e8590c"/>
<text x="37" y="205" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
<text x="74" y="191" font-size="18" font-weight="bold" fill="#2f3a2b">Seven behind</text>
<text x="74" y="212" font-size="15.5" fill="#23261f">UTC minus 7 all year (95%)</text>
<rect x="8" y="229" width="384" height="54" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="13" y="234" width="48" height="44" rx="8" fill="#e8590c"/>
<text x="37" y="266" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="74" y="252" font-size="18" font-weight="bold" fill="#2f3a2b">October loses 2 hours</text>
<text x="74" y="273" font-size="15.5" fill="#23261f">of daylight (90%)</text>
<rect x="8" y="294" width="384" height="38" rx="8" fill="#2f3a2b"/>
<text x="200" y="319" font-size="15.5" font-weight="bold" fill="#fffaf0" text-anchor="middle">Snow is a fact. Check the bench, not the town</text>
</svg>
