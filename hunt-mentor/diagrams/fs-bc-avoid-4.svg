<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Avoid step 4: if you find a dead animal you did not shoot, leave the area at once. A bear may be guarding it close by. Report it.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4. Found a carcass? Leave</text><rect x="0" y="230" width="400" height="70" rx="0" fill="#dfe6d3"/><ellipse cx="270" cy="222" rx="50" ry="14" fill="#8b5a2b"/><path d="M240 210 q30 -20 60 0" fill="none" stroke="#6b8a4b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="82" y1="230" x2="86" y2="201" stroke="#2f3a2b" stroke-width="7.0" stroke-linecap="round"/><line x1="98" y1="230" x2="94" y2="201" stroke="#2f3a2b" stroke-width="7.0" stroke-linecap="round"/><rect x="79" y="173" width="22" height="31" rx="6.0" fill="#e8590c"/><line x1="80" y1="178" x2="72" y2="198" stroke="#2f3a2b" stroke-width="6.0" stroke-linecap="round"/><line x1="100" y1="178" x2="108" y2="198" stroke="#2f3a2b" stroke-width="6.0" stroke-linecap="round"/><circle cx="90" cy="164" r="10.0" fill="#d9b48f"/><line x1="80" y1="180" x2="42" y2="180" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/><polygon points="30,180 42,187 42,173" fill="#2e7d32"/><text x="270" y="170" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Not yours?</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Back away and report it</text>
</svg>
