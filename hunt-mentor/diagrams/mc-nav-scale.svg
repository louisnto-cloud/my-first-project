<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Table of map scales: at 1 to 20,000, 1 centimetre is 200 metres and 1 kilometre is 5 centimetres; at 1 to 50,000, 1 centimetre is 500 metres and 1 kilometre is 2 centimetres; at 1 to 250,000, 1 centimetre is 2.5 kilometres and 1 kilometre is 4 millimetres. Maths, 99 percent. NTS sheets come at 1 to 50,000 and 1 to 250,000, 85 percent.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Scale: what 1 cm means</text><rect x="20" y="42.0" width="360" height="55.0" rx="4" fill="#2f3a2b"/><text x="28" y="75.0" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">Map scale</text><text x="158" y="75.0" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">1 cm on the map</text><text x="298" y="75.0" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">1 km is</text><rect x="20" y="100.0" width="360" height="55.0" rx="4" fill="#dfe6d3"/><text x="28" y="133.0" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">1:20,000</text><text x="158" y="133.0" font-size="15" fill="#23261f" text-anchor="start">200 m</text><text x="298" y="133.0" font-size="15" fill="#23261f" text-anchor="start">5 cm</text><rect x="20" y="158.0" width="360" height="55.0" rx="4" fill="#eef2e6"/><text x="28" y="191.0" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">1:50,000</text><text x="158" y="191.0" font-size="15" fill="#23261f" text-anchor="start">500 m</text><text x="298" y="191.0" font-size="15" fill="#23261f" text-anchor="start">2 cm</text><rect x="20" y="216.0" width="360" height="55.0" rx="4" fill="#dfe6d3"/><text x="28" y="249.0" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">1:250,000</text><text x="158" y="249.0" font-size="15" fill="#23261f" text-anchor="start">2.5 km</text><text x="298" y="249.0" font-size="15" fill="#23261f" text-anchor="start">4 mm</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Maths (99%). NTS sheets: 1:50,000 and 1:250,000 (85%)</text>
</svg>
