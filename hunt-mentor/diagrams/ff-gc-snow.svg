<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A barrel with a plug of snow at the muzzle. If you fall or dip the muzzle in snow or mud, unload, take the bolt out and look through the bore. Any obstruction: do not fire. Tikka says a gunsmith must remove obstructions.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Snow or mud in the barrel: stop</text><rect x="20" y="130" width="300" height="30" rx="0" fill="#9a9e96" stroke="#2f3a2b" stroke-width="2"/><rect x="300" y="132" width="30" height="26" rx="0" fill="#ffffff" stroke="#2f3a2b" stroke-width="1"/><text x="316" y="190" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">snow plug</text><text x="170" y="80" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fall, slip, muzzle in snow?</text><text x="200" y="226" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle">Unload. Bolt out. Look through.</text><text x="200" y="245" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle">Any obstruction: do not fire.</text><text x="200.0" y="288" font-size="13" fill="#2f3a2b" text-anchor="middle">Tikka: a gunsmith removes obstructions</text>
</svg>
