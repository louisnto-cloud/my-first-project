<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 524" font-family="sans-serif" role="img" aria-label="Bar chart of Alaska fees for a nonresident alien, US dollars, 85 percent. Locking tags: brown or grizzly bear 1,300, Dall sheep 1,100, moose 1,000, caribou 850, mountain goat 800, black bear 600, wolverine 500, deer 400, wolf 100. The annual hunting licence is 630. Guide fees are extra: get written quotes.">
