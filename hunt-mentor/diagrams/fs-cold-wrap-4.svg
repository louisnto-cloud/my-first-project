<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Moderate or severe step 4: wrap a tarp or emergency blanket on the outside to stop wind and wet, then call for rescue.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4. Tarp outside, call</text><rect x="0" y="240" width="400" height="60" rx="0" fill="#dfe6d3"/><rect x="70" y="186" width="260" height="54" rx="20" fill="#c8c8c8"/><circle cx="62" cy="210" r="11.0" fill="#d9b48f"/><rect x="250" y="60" width="140" height="54" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="320" y="83" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Call 911</text><text x="320" y="103" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">or SOS</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wind and wet barrier outside</text>
</svg>
