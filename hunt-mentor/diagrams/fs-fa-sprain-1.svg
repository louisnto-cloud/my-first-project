<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Ankle sprain step 1: stop, sit, take the boot off only if you can get it back on, and look for deformity.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1. Stop and look</text><rect x="0" y="230" width="400" height="70" rx="0" fill="#dfe6d3"/><line x1="140" y1="210" x2="164" y2="210" stroke="#2f3a2b" stroke-width="7.0" stroke-linecap="round"/><line x1="164" y1="210" x2="166" y2="228" stroke="#2f3a2b" stroke-width="7.0" stroke-linecap="round"/><rect x="130" y="176" width="20" height="34" rx="6.0" fill="#e8590c"/><circle cx="140" cy="166" r="10.0" fill="#d9b48f"/><ellipse cx="190" cy="226" rx="16" ry="10" fill="#c0392b" opacity=".6"/><text x="290" y="120" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Bent wrong?</text><text x="290" y="142" font-size="15" fill="#2f3a2b" text-anchor="middle">Treat as broken</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Sit. Look for a bad bend</text>
</svg>
