<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Ranking of black bear senses, strongest first. Nose: nasal lining about 100 times the area of a person, finds food over 1 km away. Ears: over twice as sensitive as human hearing, and hears higher sounds. Eyes: see colour and are sharp up close. Bar lengths show the order only. Beat the nose first.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Senses, strongest first</text><text x="16" y="85.0" font-size="14" fill="#23261f" text-anchor="start">Nose</text><rect x="76" y="64" width="150.0" height="30" rx="4" fill="#8b5a2b"/><text x="232.0" y="85.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start"></text><text x="16" y="137.0" font-size="14" fill="#23261f" text-anchor="start">Ears</text><rect x="76" y="116" width="90.0" height="30" rx="4" fill="#8a9a6b"/><text x="172.0" y="137.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start"></text><text x="16" y="189.0" font-size="14" fill="#23261f" text-anchor="start">Eyes</text><rect x="76" y="168" width="60.0" height="30" rx="4" fill="#8a9a6b"/><text x="142.0" y="189.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start"></text><text x="236" y="86" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">100x our nose lining</text><text x="236" y="138" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">over 2x our hearing</text><text x="186" y="190" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">colour, sharp up close</text><rect x="8" y="222" width="384" height="70" rx="8" fill="#dfe6d3"/><text x="18" y="246" font-size="14" fill="#23261f" text-anchor="start">Bar lengths show rank only (Tip).</text><text x="18" y="264" font-size="14" fill="#23261f" text-anchor="start">Nose finds food over 1 km away (70%).</text><text x="18" y="282" font-size="14" fill="#23261f" text-anchor="start">Beat the nose first: the wind decides.</text>
</svg>
