<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 473" font-family="sans-serif" role="img" aria-label="A deer, elk or moose from Management Units 4-7, 4-8 or 4-25 may leave the CWD (Chronic Wasting Disease) zone whole for 24 hours, only to reach a designated freezer on these routes, synopsis page 15. From 4-7 to Nelson through 4-18 on the Harrop cable ferry, Harrop Ferry Road and Highway 3A. From 4-8 to Nelson through 4-16, 4-17 and 4-18 on the Glade cable ferry, Glade Ferry Road and Highways 3A and 6. From 4-8 to Fruitvale through 4-16 on Highway 3A. From 4-25 to Invermere through 4-26. From 4-25 to Canal Flats through 4-26 on Highways 93 and 95. Off these routes or after 24 hours the full transport ban applies, 95 percent, by this app&#x27;s reading.">
<rect width="400" height="473" fill="#fffaf0"/>
<text x="12" y="25" font-size="14" font-weight="bold" fill="#6b5b4b">24 hour routes to a CWD freezer, page 15. Badge: the</text>
<text x="12" y="44" font-size="14" font-weight="bold" fill="#6b5b4b">MU you start in</text>
<rect x="10" y="53" width="380" height="56" rx="7" fill="#c92a2a"/>
<g transform="translate(32 81.0)" fill="none" stroke="#fffaf0" stroke-width="2.4" stroke-linecap="round"><circle r="10"/><path d="M-7 7 L7 -7" stroke-width="3"/></g>
<text x="52" y="77" font-size="16" font-weight="bold" fill="#fffaf0">Off route or over 24 hours: the full</text>
<text x="52" y="97" font-size="16" font-weight="bold" fill="#fffaf0">transport ban applies (95%, my reading)</text>
<rect x="10" y="117" width="380" height="70" rx="7" fill="#fffaf0" stroke="#8b5a2b" stroke-width="1.6"/>
<path d="M17 117 H72 V187 H17 A7 7 0 0 1 10 180 V124 A7 7 0 0 1 17 117z" fill="#8b5a2b"/>
