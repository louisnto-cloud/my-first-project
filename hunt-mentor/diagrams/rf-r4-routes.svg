<g transform="translate(41.0 166.0)" fill="none" stroke="#fffaf0" stroke-width="2.4" stroke-linecap="round"><path d="M-12 4 V-4 H3 V4z M3 -2 H8 L12 2 V4 H3z" fill="#fffaf0" stroke="none"/><circle cx="-7" cy="6" r="3" fill="#fffaf0" stroke="none"/><circle cx="8" cy="6" r="3" fill="#fffaf0" stroke="none"/></g>
