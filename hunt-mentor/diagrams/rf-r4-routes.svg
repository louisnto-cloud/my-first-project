<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 434" role="img" aria-label="Six cards. A deer, elk or moose from Management Units 4-7, 4-8 or 4-25 may leave the zone whole for 24 hours, only to reach a designated freezer on these routes. From 4-7 to Nelson through 4-18 on the Harrop cable ferry, Harrop Ferry Road and Highway 3A. From 4-8 to Nelson through 4-16, 4-17 and 4-18 on the Glade cable ferry, Glade Ferry Road and Highways 3A and 6. From 4-8 to Fruitvale through 4-16 on Highway 3A. From 4-25 to Invermere through 4-26. From 4-25 to Canal Flats through 4-26 on Highways 93 and 95. Off these routes or after 24 hours the full ban applies, by this app&#x27;s reading." font-family="sans-serif">
<rect x="0" y="0" width="400" height="434" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">24 hour routes to a CWD freezer</text>
<rect x="6" y="40" width="190" height="150" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
<path d="M6 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#2f3a2b"/>
<text x="101" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">From MU 4-7 to</text>
<text x="101" y="76" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Nelson</text>
<circle cx="30.0" cy="114" r="15" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/><line x1="30.0" y1="114" x2="30.0" y2="104" stroke="#2f3a2b" stroke-width="2.5"/><line x1="30.0" y1="114" x2="37.0" y2="117" stroke="#2f3a2b" stroke-width="2.5"/>
<text x="52" y="106" font-size="14" fill="#23261f" text-anchor="start">Through 4-18:</text>
<text x="52" y="124" font-size="14" fill="#23261f" text-anchor="start">Harrop cable</text>
<text x="52" y="142" font-size="14" fill="#23261f" text-anchor="start">ferry, Harrop</text>
<text x="52" y="160" font-size="14" fill="#23261f" text-anchor="start">Ferry Road, Hwy 3A</text>
<rect x="204" y="40" width="190" height="150" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
<path d="M204 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#2f3a2b"/>
<text x="299" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">From MU 4-8 to</text>
<text x="299" y="76" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Nelson</text>
<circle cx="228.0" cy="114" r="15" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/><line x1="228.0" y1="114" x2="228.0" y2="104" stroke="#2f3a2b" stroke-width="2.5"/><line x1="228.0" y1="114" x2="235.0" y2="117" stroke="#2f3a2b" stroke-width="2.5"/>
<text x="250" y="106" font-size="14" fill="#23261f" text-anchor="start">Through 4-16 to</text>
<text x="250" y="124" font-size="14" fill="#23261f" text-anchor="start">4-18: Glade cable</text>
<text x="250" y="142" font-size="14" fill="#23261f" text-anchor="start">ferry, Glade Ferry</text>
<text x="250" y="160" font-size="14" fill="#23261f" text-anchor="start">Road, Hwy 3A and</text>
<text x="250" y="178" font-size="14" fill="#23261f" text-anchor="start">Hwy 6</text>
<rect x="6" y="198" width="190" height="100" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
<path d="M6 208 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#2f3a2b"/>
<text x="101" y="216" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">From MU 4-8 to</text>
<text x="101" y="234" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Fruitvale</text>
<circle cx="30.0" cy="272" r="15" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/><line x1="30.0" y1="272" x2="30.0" y2="262" stroke="#2f3a2b" stroke-width="2.5"/><line x1="30.0" y1="272" x2="37.0" y2="275" stroke="#2f3a2b" stroke-width="2.5"/>
<text x="52" y="264" font-size="14" fill="#23261f" text-anchor="start">Through 4-16 on</text>
<text x="52" y="282" font-size="14" fill="#23261f" text-anchor="start">Hwy 3A</text>
<rect x="204" y="198" width="190" height="100" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
<path d="M204 208 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#2f3a2b"/>
<text x="299" y="216" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">From MU 4-25 to</text>
<text x="299" y="234" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Invermere</text>
<circle cx="228.0" cy="272" r="15" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/><line x1="228.0" y1="272" x2="228.0" y2="262" stroke="#2f3a2b" stroke-width="2.5"/><line x1="228.0" y1="272" x2="235.0" y2="275" stroke="#2f3a2b" stroke-width="2.5"/>
<text x="250" y="264" font-size="14" fill="#23261f" text-anchor="start">Through 4-26</text>
<rect x="6" y="306" width="190" height="114" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
<path d="M6 316 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#2f3a2b"/>
<text x="101" y="324" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">From MU 4-25 to</text>
<text x="101" y="342" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Canal Flats</text>
<circle cx="30.0" cy="380" r="15" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/><line x1="30.0" y1="380" x2="30.0" y2="370" stroke="#2f3a2b" stroke-width="2.5"/><line x1="30.0" y1="380" x2="37.0" y2="383" stroke="#2f3a2b" stroke-width="2.5"/>
<text x="52" y="372" font-size="14" fill="#23261f" text-anchor="start">Through 4-26 on</text>
<text x="52" y="390" font-size="14" fill="#23261f" text-anchor="start">Hwy 93 and Hwy 95</text>
<rect x="204" y="306" width="190" height="114" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M204 316 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#c92a2a"/>
<text x="299" y="324" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Off route or over 24</text>
<text x="299" y="342" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">hours</text>
<rect x="213.0" y="372" width="20" height="12" fill="#2f3a2b"/><path d="M233.0 376 h7 l4 5 v3 h-11 z" fill="#2f3a2b"/><circle cx="219.0" cy="386" r="3.5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/><circle cx="237.0" cy="386" r="3.5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/>
<circle cx="228.0" cy="380" r="18" fill="none" stroke="#c92a2a" stroke-width="3"/><line x1="215.0" y1="393" x2="241.0" y2="367" stroke="#c92a2a" stroke-width="3"/>
<text x="250" y="372" font-size="14" fill="#23261f" text-anchor="start">The full transport</text>
<text x="250" y="390" font-size="14" fill="#23261f" text-anchor="start">ban applies (95%,</text>
<text x="250" y="408" font-size="14" fill="#23261f" text-anchor="start">my reading)</text>
</svg>
