<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 359" font-family="sans-serif" role="img" aria-label="Moving a carcass depends on where it was killed. In the CWD zone in Region 4: the brain and spinal column stay in the zone, and the head sample goes in within a week, before you leave. Elsewhere in BC: no carcass movement rule; best practice is to bone out and leave bones, head and spine at the kill site. Outside BC: only the meat of the four quarters, loins, neck and ribs, and the hide, antlers and skull plate cleaned of all tissue. Zone Management Units 4-1 to 4-8 and 4-20 to 4-25. All 95 percent.">
<rect width="400" height="359" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Moving a carcass</text>
<text x="200" y="53" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Where was it killed?</text>
<rect x="8" y="64" width="384" height="77" rx="8" fill="#f4eedf"/>
<rect x="8" y="64" width="6" height="77" rx="3" fill="#c0392b"/>
<circle cx="41.0" cy="102.5" r="21" fill="#fffaf0" stroke="#c0392b" stroke-width="2"/>
<g transform="translate(41.0 102.5) scale(0.95)"><path d="M-9 -12 C-4 -16 4 -16 9 -12 C11 -6 8 2 4 8 L3 14 H-3 L-4 8 C-8 2 -11 -6 -9 -12z" fill="#ecdfc3" stroke="#6b4f35" stroke-width="1.4"/><path d="M-6 -12 C-10 -18 -16 -18 -18 -16 M6 -12 C10 -18 16 -18 18 -16" stroke="#6b4f35" stroke-width="2.4" fill="none" stroke-linecap="round"/><ellipse cx="-4" cy="-4" rx="2.4" ry="3" fill="#6b4f35"/><ellipse cx="4" cy="-4" rx="2.4" ry="3" fill="#6b4f35"/></g>
<text x="74" y="89" font-size="16" font-weight="bold" fill="#2f3a2b">In the CWD zone, Region 4</text>
<text x="74" y="109" font-size="15" fill="#2f3a2b">Brain and spine stay in the zone. Head</text>
<text x="74" y="128" font-size="15" fill="#2f3a2b">sample in a week, before you leave.</text>
<rect x="8" y="147" width="384" height="77" rx="8" fill="#f4eedf"/>
<rect x="8" y="147" width="6" height="77" rx="3" fill="#5f7a3a"/>
<circle cx="41.0" cy="185.5" r="21" fill="#fffaf0" stroke="#5f7a3a" stroke-width="2"/>
<g transform="translate(41.0 185.5) scale(0.78)" fill="#5f7a3a" stroke="none"><path d="M-12 8 L10 -8" stroke="#5f7a3a" stroke-width="4"/><circle cx="-13" cy="5" r="3.6"/><circle cx="-10" cy="11" r="3.6"/><circle cx="9" cy="-11" r="3.6"/><circle cx="13" cy="-6" r="3.6"/></g>
<text x="74" y="172" font-size="16" font-weight="bold" fill="#2f3a2b">Elsewhere in BC</text>
<text x="74" y="192" font-size="15" fill="#2f3a2b">No movement rule. Best: bone out, leave</text>
<text x="74" y="211" font-size="15" fill="#2f3a2b">bones, head, spine at the kill site.</text>
<rect x="8" y="230" width="384" height="96" rx="8" fill="#f4eedf"/>
<rect x="8" y="230" width="6" height="96" rx="3" fill="#4a7fb0"/>
<circle cx="41.0" cy="278.0" r="21" fill="#fffaf0" stroke="#4a7fb0" stroke-width="2"/>
<g transform="translate(41.0 278.0) scale(0.95)"><path d="M-14 4 C-16 -8 -4 -14 8 -10 C16 -7 16 6 8 10 C0 14 -12 12 -14 4z" fill="#b5483a"/><path d="M-8 2 C-6 -4 2 -6 6 -3" stroke="#f0d9c8" stroke-width="2.2" fill="none"/></g>
<text x="74" y="255" font-size="16" font-weight="bold" fill="#2f3a2b">Outside BC</text>
<text x="74" y="275" font-size="15" fill="#2f3a2b">Only meat of quarters, loins, neck, ribs.</text>
<text x="74" y="294" font-size="15" fill="#2f3a2b">Hide, antlers, skull plate: cleaned of all</text>
<text x="74" y="313" font-size="15" fill="#2f3a2b">tissue.</text>
<text x="14" y="347" font-size="14" font-weight="bold" fill="#2f3a2b">Zone MUs 4-1 to 4-8, 4-20 to 4-25. All 95%.</text>
</svg>
