<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Look past the deer. Left, crossed: a deer stands on a skyline with a house beyond it, no shot. Right, ticked: a deer stands in front of a steep dirt hillside that stops the bullet, a safe backstop.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect x="8" y="40" width="188" height="200" rx="10" fill="#efe2d6"/><rect x="204" y="40" width="188" height="200" rx="10" fill="#dfe6d3"/>
  <path d="M8 200 L196 180 L196 240 L8 240 Z" fill="#c9b79c"/>
  <g fill="#2f3a2b"><rect x="140" y="140" width="34" height="26"/><polygon points="134,140 157,120 180,140"/></g>
  <g transform="translate(80 178)"><ellipse rx="22" ry="10" fill="#8b5a2b"/><circle cx="20" cy="-10" r="7" fill="#8b5a2b"/></g>
  <path d="M30 172 L150 156" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M60 70 L130 130 M130 70 L60 130" stroke="#c0392b" stroke-width="6" opacity=".9"/>
  <path d="M204 240 L204 100 C 260 80, 330 60, 392 70 L392 240 Z" fill="#8b5a2b" opacity=".55"/>
  <g transform="translate(300 200)"><ellipse rx="22" ry="10" fill="#8b5a2b"/><circle cx="20" cy="-10" r="7" fill="#8b5a2b"/></g>
  <path d="M330 90 l12 12 l26 -30" fill="none" stroke="#2f6e3b" stroke-width="6"/>
  <text x="102" y="30" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">House beyond: no</text>
  <text x="298" y="30" font-size="16" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Dirt bank: yes</text>
  <text x="200" y="272" font-size="15" fill="#2f3a2b" text-anchor="middle">Know what the bullet hits after the deer</text>
</svg>
