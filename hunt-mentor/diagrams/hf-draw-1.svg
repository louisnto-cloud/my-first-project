<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Walking a brushy draw, step 1, top view. You and your brother walk the two edges of the draw, side by side and level with each other, 15 to 25 metres apart, both moving up the draw."><rect width="400" height="300" fill="#fffaf0"/><rect width="400" height="300" fill="#efe6cf"/><path d="M150 300 C 170 220, 160 140, 190 60 L 230 60 C 210 140, 230 220, 250 300 Z" fill="#8a9a6b"/><circle cx="190" cy="260" r="9" fill="#6b7a50"/><circle cx="205" cy="220" r="9" fill="#6b7a50"/><circle cx="192" cy="180" r="9" fill="#6b7a50"/><circle cx="210" cy="140" r="9" fill="#6b7a50"/><circle cx="200" cy="100" r="9" fill="#6b7a50"/><circle cx="212" cy="75" r="9" fill="#6b7a50"/><circle cx="220" cy="280" r="9" fill="#6b7a50"/><path d="M190 60 L230 60 L240 20 L180 20 Z" fill="#dfe6d3"/><text x="210" y="16" font-size="14" fill="#2f3a2b" text-anchor="middle">open end</text><circle cx="120" cy="250" r="10" fill="#e8590c"/><circle cx="290" cy="250" r="10" fill="#4a7fb0"/><text x="120" y="278" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">You</text><text x="290" y="278" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Brother</text><path d="M120 236 L120 180 M290 236 L290 180" stroke="#2f3a2b" stroke-width="3" stroke-dasharray="6 5"/><polygon points="112,184 128,184 120,170" fill="#2f3a2b"/><polygon points="282,184 298,184 290,170" fill="#2f3a2b"/><text x="12" y="40" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Walk both edges</text><text x="12" y="60" font-size="15" fill="#2f3a2b" text-anchor="start">side by side</text><path d="M132 280 L278 280" stroke="#2f3a2b" stroke-width="2"/><text x="205" y="296" font-size="14" fill="#2f3a2b" text-anchor="middle">15 to 25 m apart (Tip)</text></svg>
