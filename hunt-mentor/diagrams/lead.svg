<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 336" font-family="sans-serif" role="img" aria-label="A drake mallard crossing from right to left at 30 metres (33 yards), flying 40 to 60 kilometres per hour. The shot pattern lands ahead of the duck. Lead: about 1 to 2 metres (4 to 6 feet) in front of the head. Swing from behind the duck, through the head, fire ahead, and keep the gun moving after the shot. Shot takes about 0.1 second to reach 30 metres, a Hunt Mentor estimate, not a measurement.">
