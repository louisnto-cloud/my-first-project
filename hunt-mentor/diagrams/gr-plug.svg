<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Magazine plug. A one piece plug fills most of the magazine tube. With the plug in, the magazine holds 2 shells and the chamber holds 1, for 3 total. That is the limit for ducks and geese. BC also needs the plug for quail and grouse.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The plug: 3 shells max</text>
  <text x="200" y="46" font-size="14" fill="#2f3a2b" text-anchor="middle">Cutaway, muzzle to the right</text>
  <!-- receiver and chamber -->
  <rect x="20" y="70" width="80" height="40" fill="#6b6f68" stroke="#2f3a2b" stroke-width="2"/>
  <rect x="100" y="76" width="280" height="22" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2"/>
  <rect x="104" y="79" width="62" height="16" rx="2" fill="#e8590c"/><text x="135" y="68" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Chamber: 1</text>
  <!-- mag tube -->
  <rect x="100" y="110" width="280" height="24" fill="#fff" stroke="#2f3a2b" stroke-width="2"/>
  <rect x="104" y="114" width="56" height="16" rx="2" fill="#e8590c"/><rect x="162" y="114" width="56" height="16" rx="2" fill="#e8590c"/>
  <path d="M224 122 l8 -6 l8 12 l8 -12 l8 12 l8 -6" stroke="#2f3a2b" stroke-width="2" fill="none"/>
  <rect x="264" y="113" width="112" height="18" rx="3" fill="#8b5a2b"/>
  <text x="320" y="127" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Plug</text>
  <text x="160" y="154" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Magazine: 2</text>
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <rect x="20" y="180" width="170" height="100" rx="10" fill="#4a7fb0"/>
    <text x="105" y="208" fill="#fff">Ducks, geese</text><text x="105" y="244" font-size="28" fill="#fff">3 total</text><text x="105" y="268" font-size="14" fill="#fff">federal law</text>
    <rect x="210" y="180" width="170" height="100" rx="10" fill="#8a9a6b"/>
    <text x="295" y="208" fill="#fff">Grouse, quail</text><text x="295" y="240" fill="#fff">Plug in too</text><text x="295" y="264" font-size="14" fill="#fff">magazine 2 max, BC</text>
  </g>
</svg>
