<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 292" font-family="sans-serif" role="img" aria-label="Memory hooks. Pulled clean is a bird, bitten is a mammal: read the quill end. White cap, bird scat; a pile under a tree is a roost. One big bowl is grouse, many small bowls are quail.">
<rect x="0" y="0" width="400" height="292" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Memory hooks</text>
<rect x="20" y="60" width="360" height="66" rx="10" fill="#dfe6d3"/><text x="200" y="88" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Pulled clean: a bird. Bitten: a mammal.</text><text x="200" y="112" font-size="14" fill="#23261f" text-anchor="middle">Read the quill end</text><rect x="20" y="136" width="360" height="66" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="200" y="164" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">White cap, bird scat</text><text x="200" y="188" font-size="14" fill="#23261f" text-anchor="middle">Pile under a tree: a roost</text><rect x="20" y="212" width="360" height="66" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="200" y="240" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">One big bowl grouse, many small quail</text><text x="200" y="264" font-size="14" fill="#23261f" text-anchor="middle">Dust bowls in dry fine soil</text>
</svg>
