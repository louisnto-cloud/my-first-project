<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Side view. A white tail scans along the horizon, shown as an orange band at its own eye level. A hunter on the ground is inside the band. A hunter sitting in a tree stand is above it. Caption: deer do look up; height plus stillness helps. Labelled as a tip." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">Get out of the eye line (Tip)</text><rect x="0" y="230" width="400" height="70" fill="#dfe6d3"/><g transform="translate(300 200) scale(0.8 0.8)"><rect x="-41" y="12" width="6" height="40" rx="3" fill="#8b5a2b"/><rect x="-31" y="12" width="6" height="40" rx="3" fill="#8b5a2b"/><rect x="27" y="12" width="6" height="40" rx="3" fill="#8b5a2b"/><rect x="37" y="12" width="6" height="40" rx="3" fill="#8b5a2b"/><ellipse cx="0" cy="0" rx="52" ry="22" fill="#8b5a2b"/><path d="M-30 -10 L-52 -42 L-40 -48 L-18 -14 Z" fill="#8b5a2b"/><ellipse cx="-58" cy="-46" rx="15" ry="8" fill="#8b5a2b"/><path d="M-50 -52 L-44 -64 L-40 -52 Z" fill="#8b5a2b"/><circle cx="-64" cy="-47" r="1.8" fill="#23261f"/><path d="M50 -8 C 60 -6 64 6 60 18 C 54 16 50 6 48 -2 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="1"/></g><path d="M253 162 L20 140 L20 230 L253 172 Z" fill="#e8590c" opacity=".18"/><text x="110" y="214" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Main view: level</text><rect x="90" y="70" width="8" height="160" fill="#6b4f35"/><rect x="70" y="86" width="40" height="8" fill="#2f3a2b"/><circle cx="84" cy="64.2" r="6.3" fill="#2f3a2b"/><rect x="77.7" y="71.4" width="12.6" height="18.0" rx="3.6" fill="#2f3a2b"/><text x="140" y="60" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Up a tree stand</text><circle cx="40" cy="206.0" r="7.0" fill="#e8590c"/><rect x="33.0" y="214.0" width="14.0" height="20.0" rx="4.0" fill="#e8590c"/><text x="40" y="252" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Ground</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Deer do look up. Height plus stillness helps.</text>
</svg>
