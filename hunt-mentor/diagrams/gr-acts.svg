<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="ACTS, the Vital Four, as cards. A: Assume every firearm is loaded. C: Control the muzzle direction at all times. T: Trigger finger off the trigger and out of the trigger guard. S: See that the firearm is unloaded, PROVE it safe.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <g fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2">
    <rect x="6" y="6" width="190" height="140" rx="10"/><rect x="204" y="6" width="190" height="140" rx="10"/>
    <rect x="6" y="154" width="190" height="140" rx="10"/><rect x="204" y="154" width="190" height="140" rx="10"/>
  </g>
  <g font-size="34" font-weight="bold" fill="#e8590c"><text x="18" y="46">A</text><text x="216" y="46">C</text><text x="18" y="194">T</text><text x="216" y="194">S</text></g>
  <g font-size="15" font-weight="bold" fill="#2f3a2b">
    <text x="18" y="112">Assume every</text><text x="18" y="130">firearm is loaded</text>
    <text x="216" y="112">Control the</text><text x="216" y="130">muzzle, always</text>
    <text x="18" y="260">Trigger finger off,</text><text x="18" y="278">out of the guard</text>
    <text x="216" y="260">See it is unloaded:</text><text x="216" y="278">PROVE it safe</text>
  </g>
  <!-- icons -->
  <g transform="translate(70 28)"><rect x="0" y="16" width="100" height="10" fill="#6b6f68"/><rect x="0" y="10" width="30" height="22" fill="#6b6f68"/><circle cx="104" cy="21" r="6" fill="#e8590c"/><text x="60" y="60" font-size="26" font-weight="bold" fill="#c0392b" text-anchor="middle">?</text></g>
  <g transform="translate(270 30)"><rect x="0" y="30" width="60" height="10" fill="#6b6f68" transform="rotate(-40 30 35)"/><path d="M58 4 l18 -2 l-6 16" fill="none" stroke="#e8590c" stroke-width="4"/><path d="M40 30 L72 4" stroke="#e8590c" stroke-width="4" stroke-dasharray="5 4"/><text x="96" y="20" font-size="14" font-weight="bold" fill="#2f6b3a">safe</text></g>
  <g transform="translate(80 172)"><path d="M0 30 q 6 26 34 24 l2 -24" fill="none" stroke="#2f3a2b" stroke-width="4"/><path d="M18 30 q -2 12 4 18" stroke="#2f3a2b" stroke-width="4" fill="none"/><rect x="-10" y="14" width="80" height="16" fill="#6b6f68"/><path d="M-6 6 L60 6 Q 70 6 70 12 L -6 12 Z" fill="#d9b48f" stroke="#2f3a2b"/><text x="74" y="12" font-size="14" fill="#2f3a2b">finger</text></g>
  <g transform="translate(276 172)"><ellipse cx="18" cy="24" rx="18" ry="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><circle cx="22" cy="24" r="5" fill="#4a7fb0"/><path d="M40 24 h14" stroke="#e8590c" stroke-width="3"/><rect x="56" y="12" width="54" height="24" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/><text x="83" y="30" font-size="14" fill="#2f3a2b" text-anchor="middle">empty</text></g>
</svg>
