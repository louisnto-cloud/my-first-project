<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Cross section of a white tail valley. The north facing slope on the left has conifers for shade and deep snow cover. On the valley floor a hayfield is where deer feed at dusk. Willow and cottonwood along the river are where they bed. The south facing slope on the right has shrubs, melts first and gives winter feed." font-family="sans-serif">
