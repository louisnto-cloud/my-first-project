<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A topographic map sheet with its margin labelled: north arrows, legend, contour interval, date, scale bar and the blue grid lines. Read the margin before the map. Source USGS map symbols guide, 95 percent.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Read the margin first</text><rect x="30" y="40" width="340" height="210" rx="2" fill="#f3efe0" stroke="#8b5a2b" stroke-width="2"/><rect x="40" y="50" width="220" height="150" rx="0" fill="#dfe6d3"/><ellipse cx="150" cy="125" rx="63.0" ry="42" fill="none" stroke="#8b5a2b" stroke-width="1.6"/><ellipse cx="150" cy="125" rx="42.0" ry="28" fill="none" stroke="#8b5a2b" stroke-width="1.6"/><ellipse cx="150" cy="125" rx="21.0" ry="14" fill="none" stroke="#8b5a2b" stroke-width="1.6"/><path d="M40 170 C100 160 180 190 260 175" fill="none" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="70" y1="50" x2="70" y2="200" stroke="#4a7fb0" stroke-width="1" stroke-linecap="round"/><line x1="120" y1="50" x2="120" y2="200" stroke="#4a7fb0" stroke-width="1" stroke-linecap="round"/><line x1="170" y1="50" x2="170" y2="200" stroke="#4a7fb0" stroke-width="1" stroke-linecap="round"/><line x1="220" y1="50" x2="220" y2="200" stroke="#4a7fb0" stroke-width="1" stroke-linecap="round"/><text x="275" y="70" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">North arrows</text><text x="275" y="100" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Legend</text><text x="275" y="130" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Contour</text><text x="275" y="148" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">interval</text><text x="275" y="178" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Date</text><rect x="50" y="212" width="120" height="8" rx="0" fill="#23261f"/><rect x="110" y="212" width="60" height="8" rx="0" fill="#fffaf0" stroke="#23261f" stroke-width="1"/><text x="110" y="240" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Scale bar</text><text x="215" y="240" font-size="14" fill="#4a7fb0" text-anchor="middle" font-weight="bold">Grid