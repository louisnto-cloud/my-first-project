<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Safe dry fire setup: rifle with an orange snap cap in the chamber aimed at a small dot on a basement wall 5 metres away. All ammunition is out of the room.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">Safe dry fire setup</text><rect x="20" y="50" width="250" height="200" fill="#dfe6d3" stroke="#23261f" stroke-width="2"/><rect x="250" y="50" width="20" height="200" fill="#c9b79c" stroke="#23261f" stroke-width="2"/><circle cx="260" cy="130" r="5" fill="#e8590c"/><text x="150" y="80" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">Basement wall</text><text x="150" y="98" font-size="14" text-anchor="middle" fill="#23261f">2 cm dot at 5 m</text><line x1="40" y1="150" x2="140" y2="140" stroke="#6b4f35" stroke-width="6" stroke-linecap="round"/><rect x="132" y="134" width="14" height="10" rx="2" fill="#e8590c"/><text x="40" y="178" font-size="14" font-weight="bold" fill="#23261f">Snap cap in the chamber</text><text x="40" y="196" font-size="14" fill="#23261f">(orange)</text><line x1="140" y1="150" x2="248.0" y2="131.0" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M242.3 135.1 L248.0 131.0 L241.3 129.1" fill="none" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="300" y="110" width="70" height="44" rx="4" fill="#fff" stroke="#23261f" stroke-width="2"/><text x="335" y="137" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">AMMO</text><path d="M305 102 L365 162 M365 102 L305 162" stroke="#b3261e" stroke-width="4" stroke-linecap="round"/><text x="335" y="178" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">Out of</text><text x="335" y="196" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">the room</text><text x="200" y="276" font-size="14" text-anchor="middle" fill="#2f3a2b">Never a window or a door as the backstop</text>
</svg>
