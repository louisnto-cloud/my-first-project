<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 209" role="img" aria-label="Cards: Two sets of rules for every duck. Federal: Seasons and limits: Schedule 3, Part 10. Permit and stamp. BC: Your BC licence, closed areas, no shooting areas, boat and vehicle rules." font-family="sans-serif">
<rect x="0" y="0" width="400" height="209" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Two sets of rules for every duck</text>
<text x="200" y="47" font-size="14" fill="#8b5a2b" text-anchor="middle">Where the two disagree, follow the stricter one</text>
<text x="200" y="65" font-size="14" fill="#8b5a2b" text-anchor="middle">(Tip)</text>
<rect x="6.0" y="87" width="190.0" height="112" rx="9" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<path d="M6.0 115 V96 Q6.0 87 15.0 87 H187.0 Q196.0 87 196.0 96 V115 Z" fill="#4a7fb0"/>
<text x="14.0" y="107" font-size="14" font-weight="bold" fill="#ffffff">Federal</text>
<text x="14.0" y="135" font-size="14" fill="#23261f">Seasons and limits:</text>
<text x="14.0" y="153" font-size="14" fill="#23261f">Schedule 3, Part 10.</text>
<text x="14.0" y="171" font-size="14" fill="#23261f">Permit and stamp</text>
<rect x="204.0" y="87" width="190.0" height="112" rx="9" fill="#ffffff" stroke="#8b5a2b" stroke-width="2.5"/>
<path d="M204.0 115 V96 Q204.0 87 213.0 87 H385.0 Q394.0 87 394.0 96 V115 Z" fill="#8b5a2b"/>
<text x="212.0" y="107" font-size="14" font-weight="bold" fill="#ffffff">BC</text>
<text x="212.0" y="135" font-size="14" fill="#23261f">Your BC licence, closed</text>
<text x="212.0" y="153" font-size="14" fill="#23261f">areas, no shooting</text>
<text x="212.0" y="171" font-size="14" fill="#23261f">areas, boat and vehicle</text>
<text x="212.0" y="189" font-size="14" fill="#23261f">rules</text>
</svg>
