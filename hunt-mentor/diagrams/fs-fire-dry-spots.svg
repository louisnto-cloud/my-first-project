<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Where dry fuel hides in rain: dead twigs under big spruce, standing dead wood that snaps rather than bends, the dry core inside a split log, birch bark, which is oily and burns wet, pitch wood from resin soaked stumps, and the fire starter in your pocket. Dead, off the ground, and split.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Where dry fuel hides in the rain</text><rect x="20" y="44" width="170" height="66" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="105" y="72" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Under big spruce</text><text x="105" y="94" font-size="14" fill="#2f3a2b" text-anchor="middle">dead twigs</text><rect x="210" y="44" width="170" height="66" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="295" y="72" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Standing dead</text><text x="295" y="94" font-size="14" fill="#2f3a2b" text-anchor="middle">snap, not bend</text><rect x="20" y="122" width="170" height="66" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="105" y="150" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Inside a log</text><text x="105" y="172" font-size="14" fill="#2f3a2b" text-anchor="middle">split it open</text><rect x="210" y="122" width="170" height="66" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="295" y="150" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Birch bark</text><text x="295" y="172" font-size="14" fill="#2f3a2b" text-anchor="middle">oily, burns wet</text><rect x="20" y="200" width="170" height="66" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="105" y="228" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pitch wood</text><text x="105" y="250" font-size="14" fill="#2f3a2b" text-anchor="middle">resin stump</text><rect x="210" y="200" width="170" height="66" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="295" y="228" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Your pocket</text><text x="295" y="250" font-size="14" fill="#2f3a2b" text-anchor="middle">fire starter</text><text x="200" y="290" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Dead, off the ground, and split</text>
</svg>
