<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 462" font-family="sans-serif" role="img" aria-label="Grid of look alikes. Left, legal with limits: common merganser with a thin orange bill, counts in the 8 duck limit; American coot with a white chicken bill, 10 a day; hooded merganser with a fan crest, counts in the 8. Right, never shoot, protected with no open season: loon with a dagger bill that sits low in the water; grebe, small with a thin bill; swans, white and far bigger. No name, no shot.">
  <rect width="400" height="462" fill="#fffaf0"/>
  <text x="100" y="26" font-size="16" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Legal (with limits)</text>
  <text x="300" y="26" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Never shoot</text>
  <rect x="6" y="40" width="190" height="122" rx="8" fill="#dfe6d3" stroke="#2f6e3b" stroke-width="2"/>
  <g transform="translate(101 74)"><path d="M-26 0 Q-28 -12 -12 -12 L10 -10 Q22 -8 20 2 L-20 8Z" fill="#fff" stroke="#2f3a2b"/><circle cx="16" cy="-16" r="8" fill="#2f6e3b"/><path d="M22 -16 L40 -14 L22 -12Z" fill="#e8590c"/></g>
  <text x="101" y="104" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Common merganser</text>
  <text x="101" y="122" font-size="13" fill="#2f3a2b" text-anchor="middle">Thin orange bill</text>
  <text x="101" y="138" font-size="13" fill="#2f3a2b" text-anchor="middle">counts in the 8</text>
  <text x="101" y="155" font-size="13" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Legal</text>
  <rect x="6" y="170" width="190" height="122" rx="8" fill="#dfe6d3" stroke="#2f6e3b" stroke-width="2"/>
  <g transform="translate(101 204)"><ellipse rx="22" ry="12" fill="#55575c"/><circle cx="16" cy="-12" r="8" fill="#55575c"/><path d="M22 -14 L32 -11 L22 -8Z" fill="#fff" stroke="#2f3a2b"/></g>
  <text x="101" y="234" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">American coot</text>
  <text x="101" y="252" font-size="13" fill="#2f3a2b" text-anchor="middle">White chicken bill</text>
  <text x="101" y="268" font-size="13" fill="#2f3a2b" text-anchor="middle">10 a day</text>
  <text x="101" y="285" font-size="13" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Legal</text>
  <rect x="6" y="300" width="190" height="122" rx="8" fill="#dfe6d3" stroke="#2f6e3b" stroke-width="2"/>
  <g transform="translate(101 334)"><ellipse rx="22" ry="11" fill="#8b5a2b"/><path d="M8 -12 Q14 -34 30 -20 Q24 -10 14 -8Z" fill="#2f3a2b"/><path d="M12 -20 Q18 -28 24 -20Z" fill="#fff"/><path d="M26 -14 L36 -12 L26 -10Z" fill="#2f3a2b"/></g>
  <text x="101" y="364" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hooded merganser</text>
  <text x="101" y="382" font-size="13" fill="#2f3a2b" text-anchor="middle">Fan crest</text>
  <text x="101" y="398" font-size="13" fill="#2f3a2b" text-anchor="middle">counts in the 8</text>
  <text x="101" y="415" font-size="13" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Legal</text>
  <rect x="204" y="40" width="190" height="122" rx="8" fill="#f3dcd6" stroke="#c0392b" stroke-width="2"/>
  <g transform="translate(299 74)"><path d="M-28 4 Q-26 -8 -8 -8 L14 -6 Q22 -4 20 4Z" fill="#2f3a2b"/><circle cx="16" cy="-12" r="8" fill="#2f3a2b"/><path d="M22 -13 L42 -10 L22 -8Z" fill="#2f3a2b"/><line x1="-36" y1="4" x2="40" y2="4" stroke="#4a7fb0" stroke-width="2"/></g>
  <text x="299" y="104" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Loon</text>
  <text x="299" y="122" font-size="13" fill="#2f3a2b" text-anchor="middle">Dagger bill,</text>
  <text x="299" y="138" font-size="13" fill="#2f3a2b" text-anchor="middle">sits low</text>
  <text x="299" y="155" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Protected</text>
  <rect x="204" y="170" width="190" height="122" rx="8" fill="#f3dcd6" stroke="#c0392b" stroke-width="2"/>
  <g transform="translate(299 204)"><ellipse rx="16" ry="8" fill="#55575c"/><path d="M8 -4 Q10 -18 14 -20" stroke="#55575c" stroke-width="6" fill="none"/><circle cx="15" cy="-20" r="5" fill="#2f3a2b"/><path d="M19 -21 L32 -19 L19 -18Z" fill="#e8590c"/></g>
  <text x="299" y="234" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Grebe</text>
  <text x="299" y="252" font-size="13" fill="#2f3a2b" text-anchor="middle">Small, thin bill,</text>
  <text x="299" y="268" font-size="13" fill="#2f3a2b" text-anchor="middle">no open season</text>
  <text x="299" y="285" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Protected</text>
  <rect x="204" y="300" width="190" height="122" rx="8" fill="#f3dcd6" stroke="#c0392b" stroke-width="2"/>
  <g transform="translate(299 334)"><path d="M-30 4 Q-34 -10 -12 -10 L12 -8 Q24 -4 20 8Z" fill="#fff" stroke="#2f3a2b"/><path d="M12 -8 Q6 -24 20 -26" stroke="#2f3a2b" stroke-width="7" fill="none"/><path d="M12 -8 Q6 -24 20 -26" stroke="#fff" stroke-width="5" fill="none"/><path d="M20 -28 L32 -24 L20 -22Z" fill="#2f3a2b"/></g>
  <text x="299" y="364" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Swans</text>
  <text x="299" y="382" font-size="13" fill="#2f3a2b" text-anchor="middle">Far bigger, white,</text>
  <text x="299" y="398" font-size="13" fill="#2f3a2b" text-anchor="middle">no open season</text>
  <text x="299" y="415" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Protected</text>
  <text x="200" y="450" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">No name, no shot.</text>
</svg>
