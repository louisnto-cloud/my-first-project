<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" font-family="sans-serif">
  <rect x="0" y="0" width="400" height="340" fill="#fffaf0"/>
  <text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Where deer are on a slope</text>
  <!-- ground profile -->
  <path d="M0 300 L110 300 L180 230 L215 222 L250 175 L285 168 L340 80 L400 70 L400 340 L0 340 Z" fill="#d9cfb3" stroke="#23261f" stroke-width="2"/>
  <!-- trees on bench and upper slope -->
  <g fill="#2f3a2b">
    <path d="M255 172 L262 145 L269 172 Z"/>
    <path d="M272 170 L279 140 L286 170 Z"/>
    <path d="M300 140 L307 112 L314 140 Z"/>
    <path d="M320 108 L327 80 L334 108 Z"/>
    <path d="M352 78 L359 52 L366 78 Z"/>
  </g>
  <!-- field -->
  <rect x="10" y="292" width="95" height="8" fill="#8a9a6b"/>
  <!-- deer dots -->
  <circle cx="40" cy="285" r="6" fill="#6b4f35"/>
  <circle cx="70" cy="285" r="6" fill="#6b4f35"/>
  <circle cx="148" cy="254" r="6" fill="#6b4f35"/>
  <circle cx="265" cy="160" r="6" fill="#e8590c"/>
  <circle cx="345" cy="70" r="6" fill="#e8590c"/>
  <!-- labels -->
  <text x="55" y="322" font-size="14" fill="#23261f" text-anchor="middle">Valley fields:</text>
  <text x="55" y="338" font-size="14" fill="#23261f" text-anchor="middle">white tails</text>
  <text x="185" y="290" font-size="14" fill="#23261f" text-anchor="middle">Open grass:</text>
  <text x="185" y="306" font-size="14" fill="#23261f" text-anchor="middle">feeding</text>
  <text x="275" y="228" font-size="14" fill="#23261f" text-anchor="middle">Bench + timber:</text>
  <text x="275" y="244" font-size="14" fill="#23261f" text-anchor="middle">day beds</text>
  <text x="345" y="44" font-size="14" fill="#23261f" text-anchor="middle">Ridge</text>
  <!-- thermals -->
  <g stroke="#e8590c" stroke-width="3" fill="#e8590c">
    <line x1="60" y1="120" x2="110" y2="80"/>
    <path d="M110 80 L98 82 L106 92 Z"/>
  </g>
  <text x="20" y="70" font-size="14" font-weight="bold" fill="#e8590c">Morning warms:</text>
  <text x="20" y="140" font-size="14" fill="#e8590c">air flows UP</text>
  <g stroke="#2f3a2b" stroke-width="3" fill="#2f3a2b">
    <line x1="230" y1="60" x2="180" y2="100"/>
    <path d="M180 100 L192 98 L184 88 Z"/>
  </g>
  <text x="170" y="50" font-size="14" font-weight="bold" fill="#2f3a2b">Evening cools:</text>
  <text x="170" y="122" font-size="14" fill="#2f3a2b">air flows DOWN</text>
</svg>
