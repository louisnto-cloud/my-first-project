<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 434" font-family="sans-serif" role="img" aria-label="A caribou bull head from the side with one antler: the brow shovel over the face, the bez above it, the main beam sweeping back and up, the rear point sticking out behind, and the points on top numbered 1 to 5, the tip of the main beam being point 5. Legal 5 point bull: one antler bears at least 5 tines, including the main beam tip, 98 percent. Warning box: cows grow antlers too. Antlers do not mean bull, 85 percent.">
