<rect x="8" y="318" width="188" height="108" rx="10" fill="#eef3e4" stroke="#4f6b2e" stroke-width="2"/>
<text x="20" y="344" font-size="16" font-weight="bold" fill="#4f6b2e">5 point bull:</text>
<text x="20" y="365" font-size="15" fill="#2f3a2b">one antler, at least</text>
<text x="20" y="386" font-size="15" fill="#2f3a2b">5 tines, beam tip</text>
<text x="20" y="407" font-size="15" fill="#2f3a2b">included (98%)</text>
<rect x="204" y="318" width="188" height="108" rx="10" fill="#fbe4d6" stroke="#e8590c" stroke-width="2"/>
<text x="216" y="344" font-size="16" font-weight="bold" fill="#c2410c">Cows grow</text>
