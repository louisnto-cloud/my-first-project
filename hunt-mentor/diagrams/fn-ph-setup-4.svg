<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A phone in airplane mode. It stops searching for cell signal, and GPS keeps working.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c" stroke="none" stroke-width="2"/><text x="26" y="32" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="52" y="32" font-family="sans-serif" font-size="18" fill="#2f3a2b" text-anchor="start" font-weight="bold">Airplane mode in dead zones</text><g transform="translate(200 165) scale(1.6)"><rect x="-22" y="-40" width="44" height="80" rx="7" fill="#2f3a2b" stroke="none" stroke-width="0"/><rect x="-18" y="-33" width="36" height="62" rx="3" fill="#cfe3f3" stroke="none" stroke-width="0"/></g><text x="200" y="172" font-family="sans-serif" font-size="30" fill="#2f3a2b" text-anchor="middle" font-weight="bold">✈</text><text x="255" y="150" font-family="sans-serif" font-size="15" fill="#e8590c" text-anchor="start">no cell search</text><text x="255" y="170" font-family="sans-serif" font-size="15" fill="#8a9a6b" text-anchor="start">GPS keeps working</text><text x="20" y="285" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">GPS still works</text>
</svg>
