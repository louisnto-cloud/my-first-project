<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 372" font-family="sans-serif" role="img" aria-label="Cut chart of a deer seen from the side. Neck at the front, then the shoulder, the front quarter, with the shank below it. Along the top of the back from behind the shoulder to the hip: the backstrap, or loin. Inside the cavity under the back, near the hips: the tenderloin, shown dashed. Below the backstrap: ribs and flank. At the rear: the hind quarter, with the hind shank below. Lower legs are not meat cuts.">
<rect x="0" y="0" width="400" height="372" fill="#fffaf0"/>
