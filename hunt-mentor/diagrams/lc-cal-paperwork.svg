<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 534" font-family="sans-serif" role="img" aria-label="Timeline of the paperwork year. January: the Hunter Sample Questionnaire is mailed. 4 February 2027: spring LEH draw deadline. 31 March: licences expire and the Mandatory Hunter Report is due. 1 April: new licence year, hunting licence 32 dollars plus GST. April: LEH synopsis posted. May: apply for LEH in WILD. 23 June 2026, 11:59 pm: main LEH deadline. 1 July: new synopsis in force. July: LEH results in WILD. August: buy species licences in person and the federal bird permit. 19 November 2026: Special Mountain Sheep draw deadline.">
<rect x="0" y="0" width="400" height="534" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">The paperwork year</text><line x1="104" y1="48" x2="104" y2="512" stroke="#8a9a6b" stroke-width="4"/><circle cx="104" cy="60" r="7" fill="#2f3a2b"/><text x="92" y="65" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">Jan</text><text x="122" y="65" font-size="14" fill="#23261f" text-anchor="start">Hunter Sample Questionnaire mailed</text><circle cx="104" cy="104" r="7" fill="#e8590c"/><text x="92" y="109" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">4 Feb 2027</text><text x="122" y="109" font-size="14" fill="#23261f" text-anchor="start">Spring LEH draw deadline</text><circle cx="104" cy="148" r="7" fill="#e8590c"/><text x="92" y="153" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">31 Mar</text><text x="122" y="153" font-size="14" fill="#23261f" text-anchor="start">Licences expire. Mandatory Hunter</text><text x="122" y="169" font-size="14" fill="#23261f" text-anchor="start">Report due</text><circle cx="104" cy="192" r="7" fill="#2f3a2b"/><text x="92" y="197" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">1 Apr</text><text x="122" y="197" font-size="14" fill="#23261f" text-anchor="start">New licence year. Hunting licence</text><text x="122" y="213" font-size="14" fill="#23261f" text-anchor="start">$32 plus GST</text><circle cx="104" cy="236" r="7" fill="#2f3a2b"/><text x="92" y="241" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">Apr</text><text x="122" y="241" font-size="14" fill="#23261f" text-anchor="start">LEH synopsis posted</text><circle cx="104" cy="280" r="7" fill="#2f3a2b"/><text x="92" y="285" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">May</text><text x="122" y="285" font-size="14" fill="#23261f" text-anchor="start">Apply for LEH in WILD</text><circle cx="104" cy="324" r="7" fill="#e8590c"/><text x="92" y="329" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">23 Jun 2026</text><text x="122" y="329" font-size="14" fill="#23261f" text-anchor="start">Main LEH deadline, 11:59 pm</text><circle cx="104" cy="368" r="7" fill="#2f3a2b"/><text x="92" y="373" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">1 Jul</text><text x="122" y="373" font-size="14" fill="#23261f" text-anchor="start">New synopsis in force</text><circle cx="104" cy="412" r="7" fill="#2f3a2b"/><text x="92" y="417" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">Jul</text><text x="122" y="417" font-size="14" fill="#23261f" text-anchor="start">LEH results: log in to WILD</text><circle cx="104" cy="456" r="7" fill="#2f3a2b"/><text x="92" y="461" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">Aug</text><text x="122" y="461" font-size="14" fill="#23261f" text-anchor="start">Buy species licences in person. Bird</text><text x="122" y="477" font-size="14" fill="#23261f" text-anchor="start">permit</text><circle cx="104" cy="500" r="7" fill="#e8590c"/><text x="92" y="505" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">19 Nov 2026</text><text x="122" y="505" font-size="14" fill="#23261f" text-anchor="start">Special Mountain Sheep draw deadline</text>
</svg>
