<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 554" font-family="sans-serif" role="img" aria-label="Timeline of the paperwork year. January: the Hunter Sample Questionnaire is mailed. 4 February 2027: spring LEH (Limited Entry Hunting) draw deadline. 31 March: licences expire and the Mandatory Hunter Report is due. 1 April: new licence year, hunting licence 32 dollars plus GST. April: LEH synopsis posted. May: apply for LEH in WILD. 23 June 2026, 11:59 pm: main LEH deadline. 1 July: new synopsis in force. July: LEH results in WILD. August: buy species licences in person and the federal bird permit. 19 November 2026: Special Mountain Sheep draw deadline. Orange dots are hard deadlines.">
<rect width="400" height="554" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The paperwork year</text>
<line x1="112" y1="56" x2="112" y2="506" stroke="#8a9a6b" stroke-width="4" stroke-linecap="round"/>
<text x="98" y="66" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">Jan</text>
<circle cx="112" cy="61" r="6" fill="#2f3a2b" stroke="#fffaf0" stroke-width="2"/>
<text x="128" y="66" font-size="16" fill="#2f3a2b">Hunter Sample Questionnaire</text>
<text x="128" y="86" font-size="16" fill="#2f3a2b">mailed</text>
<text x="98" y="120" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="end">4 Feb 2027</text>
<circle cx="112" cy="115" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="2"/>
<text x="128" y="120" font-size="16" fill="#2f3a2b">Spring LEH draw deadline</text>
<text x="98" y="154" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="end">31 Mar</text>
<circle cx="112" cy="149" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="2"/>
<text x="128" y="154" font-size="16" fill="#2f3a2b">Licences expire. Mandatory Hunter</text>
<text x="128" y="174" font-size="16" fill="#2f3a2b">Report due</text>
<text x="98" y="208" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">1 Apr</text>
<circle cx="112" cy="203" r="6" fill="#2f3a2b" stroke="#fffaf0" stroke-width="2"/>
<text x="128" y="208" font-size="16" fill="#2f3a2b">New licence year. Hunting licence</text>
<text x="128" y="228" font-size="16" fill="#2f3a2b">$32 plus GST</text>
<text x="98" y="262" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">Apr</text>
<circle cx="112" cy="257" r="6" fill="#2f3a2b" stroke="#fffaf0" stroke-width="2"/>
<text x="128" y="262" font-size="16" fill="#2f3a2b">LEH synopsis posted</text>
<text x="98" y="296" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">May</text>
<circle cx="112" cy="291" r="6" fill="#2f3a2b" stroke="#fffaf0" stroke-width="2"/>
<text x="128" y="296" font-size="16" fill="#2f3a2b">Apply for LEH in WILD</text>
<text x="98" y="330" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="end">23 Jun 2026</text>
<circle cx="112" cy="325" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="2"/>
<text x="128" y="330" font-size="16" fill="#2f3a2b">Main LEH deadline, 11:59 pm</text>
<text x="98" y="364" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">1 Jul</text>
<circle cx="112" cy="359" r="6" fill="#2f3a2b" stroke="#fffaf0" stroke-width="2"/>
<text x="128" y="364" font-size="16" fill="#2f3a2b">New synopsis in force</text>
<text x="98" y="398" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">Jul</text>
<circle cx="112" cy="393" r="6" fill="#2f3a2b" stroke="#fffaf0" stroke-width="2"/>
<text x="128" y="398" font-size="16" fill="#2f3a2b">LEH results: log in to WILD</text>
<text x="98" y="432" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">Aug</text>
<circle cx="112" cy="427" r="6" fill="#2f3a2b" stroke="#fffaf0" stroke-width="2"/>
<text x="128" y="432" font-size="16" fill="#2f3a2b">Buy species licences in person.</text>
<text x="128" y="452" font-size="16" fill="#2f3a2b">Bird permit</text>
<text x="98" y="486" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="end">19 Nov 2026</text>
<circle cx="112" cy="481" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="2"/>
<text x="128" y="486" font-size="16" fill="#2f3a2b">Special Mountain Sheep draw</text>
<text x="128" y="506" font-size="16" fill="#2f3a2b">deadline</text>
<circle cx="22" cy="533" r="7" fill="#e8590c"/><text x="36" y="538" font-size="15" font-weight="bold" fill="#c2410c">Orange: hard deadline</text>
</svg>
