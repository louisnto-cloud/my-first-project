<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif" role="img" aria-label="Kit for the sign walk: tape measure, nitrile gloves, a stick, phone for photos, the Journal or a notebook, binoculars, water, bear spray, a map with the walk marked, and a satellite messenger if there is no signal.">
<rect width="400" height="320" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pack for the walk</text>
<rect x="12" y="44" width="70" height="120" rx="10" fill="#dfe6d3"/>
<circle cx="47" cy="92" r="20" fill="#f3d36b" stroke="#2f3a2b" stroke-width="2"/><rect x="61" y="102" width="16" height="6" fill="#2f3a2b"/>
<text x="47" y="148" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Tape</text>
<rect x="89" y="44" width="70" height="120" rx="10" fill="#dfe6d3"/>
<path d="M110 116 V86 q0 -6 5 -6 V74 q0 -5 5 -5 q5 0 5 5 V72 q0 -5 5 -5 q5 0 5 5 V78 q0 -5 5 -5 q5 0 5 5 V116 Z" fill="#4a7fb0"/>
<text x="124" y="148" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Gloves</text>
<rect x="166" y="44" width="70" height="120" rx="10" fill="#dfe6d3"/>
<path d="M183 116 L219 68" stroke="#6b4f35" stroke-width="7" stroke-linecap="round"/>
<text x="201" y="148" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Stick</text>
<rect x="243" y="44" width="70" height="120" rx="10" fill="#dfe6d3"/>
<rect x="264" y="66" width="28" height="50" rx="5" fill="#2f3a2b"/><rect x="268" y="72" width="20" height="36" fill="#9cc3e6"/>
<text x="278" y="148" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Phone</text>
<rect x="320" y="44" width="70" height="120" rx="10" fill="#dfe6d3"/>
<rect x="337" y="68" width="36" height="48" rx="3" fill="#8a9a6b"/><path d="M345 82 h20 M345 92 h20 M345 102 h20" stroke="#fff" stroke-width="2"/>
<text x="355" y="148" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Journal</text>
<rect x="12" y="174" width="70" height="120" rx="10" fill="#dfe6d3"/>
<rect x="25" y="206" width="18" height="34" rx="6" fill="#2f3a2b"/><rect x="51" y="206" width="18" height="34" rx="6" fill="#2f3a2b"/><rect x="41" y="216" width="12" height="10" fill="#2f3a2b"/>
<text x="47" y="278" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Binos</text>
<rect x="89" y="174" width="70" height="120" rx="10" fill="#dfe6d3"/>
<rect x="112" y="204" width="24" height="44" rx="6" fill="#4a7fb0"/><rect x="118" y="196" width="12" height="10" fill="#2f3a2b"/>
<text x="124" y="278" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Water</text>
<rect x="166" y="174" width="70" height="120" rx="10" fill="#dfe6d3"/>
<rect x="190" y="206" width="22" height="42" rx="5" fill="#e8590c"/><rect x="194" y="196" width="14" height="10" fill="#2f3a2b"/>
<text x="201" y="270" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bear</text>
<text x="201" y="286" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">spray</text>
<rect x="243" y="174" width="70" height="120" rx="10" fill="#dfe6d3"/>
<path d="M254 204 L270 198 L286 204 L302 198 V244 L286 250 L270 244 L254 250 Z" fill="#e9dfa8" stroke="#6b4f35" stroke-width="2"/><path d="M262 234 q12 -20 30 -18" stroke="#e8590c" stroke-width="2" fill="none" stroke-dasharray="4 3"/>
<text x="278" y="278" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Map</text>
<rect x="320" y="174" width="70" height="120" rx="10" fill="#dfe6d3"/>
<rect x="341" y="202" width="28" height="44" rx="6" fill="#e8590c"/><rect x="352" y="190" width="6" height="14" fill="#2f3a2b"/><circle cx="355" cy="222" r="6" fill="#fff"/>
<text x="355" y="270" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Sat</text>
<text x="355" y="286" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">messenger</text>
