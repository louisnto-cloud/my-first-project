<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bear skull scoring for Boone and Crockett: the score is the greatest length plus the greatest width of the cleaned skull, lower jaw off, measured in inches and sixteenths after a 60 day drying period. Awards minimum about 20, all time records about 21 for black bear, from search previews.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Skull score = length + width</text><path d="M80 160 Q90 90 180 92 Q280 96 330 140 Q340 160 320 176 Q270 205 180 200 Q100 200 80 160 Z" fill="#efe6cf" stroke="#6b4f35" stroke-width="2"/><circle cx="230" cy="140" r="16" fill="#cfc2a0"/><path d="M310 160 l14 14 M296 166 l10 16" stroke="#6b4f35" stroke-width="3"/><line x1="80" y1="230" x2="330" y2="230" stroke="#e8590c" stroke-width="3"/><polygon points="330,230 321.0,234.3 321.0,225.7" fill="#e8590c"/><line x1="330" y1="230" x2="80" y2="230" stroke="#e8590c" stroke-width="3"/><polygon points="80,230 89.0,225.7 89.0,234.3" fill="#e8590c"/><text x="205" y="254" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">A: length, back of skull to front teeth</text><line x1="380" y1="92" x2="380" y2="200" stroke="#4a7fb0" stroke-width="3"/><polygon points="380,200 375.7,191.0 384.3,191.0" fill="#4a7fb0"/><line x1="380" y1="200" x2="380" y2="92" stroke="#4a7fb0" stroke-width="3"/><polygon points="380,92 384.3,101.0 375.7,101.0" fill="#4a7fb0"/><text x="372" y="80" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="end">B: width</text><text x="200" y="284" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Clean, then dry 60 days before scoring</text>
</svg>
