<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="The 12 20 burst: a 20 gauge shell dropped into a 12 gauge gun can slide down the barrel and stick. A 12 gauge shell loaded behind it fires into the blocked barrel and can burst it. Keep 20 gauge shells out of your 12 gauge kit.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Wrong gauge: the 12 20 burst</text>
<rect x="20" y="110" width="360" height="40" fill="#3b4045"/>
<rect x="20" y="116" width="360" height="28" fill="#cfd5d8"/>
<rect x="190" y="118" width="60" height="24" rx="2" fill="#d4b21f" stroke="#17201A"/>
<rect x="190" y="117" width="10" height="26" fill="#c9a227"/>
<rect x="24" y="117" width="74" height="26" rx="2" fill="#3b6e8f" stroke="#17201A"/>
<rect x="24" y="116" width="12" height="28" fill="#c9a227"/>
<line x1="220.0" y1="102.0" x2="220.0" y2="118.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="220.0" cy="118.0" r="3" fill="#1F3D2B"/><rect x="151.7" y="79.0" width="136.6" height="23.0" rx="5" fill="#ffffff" stroke="#FF6A13" stroke-width="1.3"/><text x="220.0" y="96.0" font-size="14" font-weight="bold" fill="#FF6A13" text-anchor="middle">20 ga shell stuck</text>
<line x1="60.0" y1="174.0" x2="60.0" y2="144.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="60.0" cy="144.0" r="3" fill="#1F3D2B"/><rect x="-0.4" y="173.0" width="140.8" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="70.0" y="190.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">12 ga shell behind</text>
<circle cx="252" cy="130" r="18" fill="#FF6A13" opacity="0.35"/>
<circle cx="28" cy="232" r="11" fill="#FF6A13"/><text x="28" y="237.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="46.0" y="237.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Keep 20 ga shells out of the 12 ga bag</text>
<circle cx="28" cy="262" r="11" fill="#1F3D2B"/><text x="28" y="267.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="46.0" y="267.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Weak shot or odd sound: stop, unload, check bore</text>
<text x="200.0" y="292.0" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">From the Remington 870 manual.</text>
</svg>
