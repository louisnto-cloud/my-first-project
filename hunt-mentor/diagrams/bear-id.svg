<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" font-family="sans-serif">
  <rect x="0" y="0" width="400" height="640" fill="#fffaf0"/>
  <text x="200" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Black bear or grizzly?</text>
  <text x="200" y="42" font-size="13" fill="#6b4f35" text-anchor="middle">Use body shape, not colour</text>

  <!-- BLACK BEAR panel -->
  <rect x="12" y="50" width="376" height="224" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
  <text x="30" y="72" font-size="16" font-weight="bold" fill="#2f3a2b">Black bear (legal in season)</text>
  <path d="M70 190 C70 150 110 130 170 134 C230 138 260 150 300 160 C320 166 330 176 330 190 L330 206 C330 214 322 218 310 218 L92 218 C78 218 70 206 70 190 Z" fill="#23261f" stroke="#23261f" stroke-width="2"/>
  <path d="M296 160 C300 140 320 128 346 134 C364 138 372 150 376 162 L370 176 C364 184 350 188 334 186 L312 186 C302 184 296 176 296 160 Z" fill="#23261f" stroke="#23261f" stroke-width="2"/>
  <path d="M312 142 L306 118 L326 132 Z" fill="#23261f" stroke="#23261f" stroke-width="2"/>
  <path d="M338 136 L340 110 L352 134 Z" fill="#23261f" stroke="#23261f" stroke-width="2"/>
  <line x1="318" y1="128" x2="378" y2="164" stroke="#e8590c" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
  <rect x="96" y="214" width="20" height="40" fill="#23261f" stroke="#23261f" stroke-width="2"/>
  <rect x="132" y="214" width="20" height="40" fill="#23261f" stroke="#23261f" stroke-width="2"/>
  <rect x="262" y="214" width="20" height="40" fill="#23261f" stroke="#23261f" stroke-width="2"/>
  <rect x="296" y="214" width="20" height="40" fill="#23261f" stroke="#23261f" stroke-width="2"/>
  <path d="M316 254 L324 252 M316 248 L323 246" stroke="#23261f" stroke-width="2" fill="none"/>
  <text x="100" y="118" font-size="13" fill="#23261f" text-anchor="middle">Rump is the high point</text>
  <line x1="106" y1="122" x2="112" y2="140" stroke="#e8590c" stroke-width="2" fill="none"/>
  <text x="228" y="100" font-size="13" fill="#23261f" text-anchor="middle">No shoulder hump</text>
  <line x1="224" y1="104" x2="220" y2="138" stroke="#e8590c" stroke-width="2" fill="none"/>
  <text x="344" y="98" font-size="13" fill="#23261f" text-anchor="middle">Tall ears</text>
  <text x="338" y="206" font-size="13" font-weight="bold" fill="#e8590c" stroke="#fffaf0" stroke-width="4" paint-order="stroke" text-anchor="middle">Straight face</text>
  <text x="160" y="268" font-size="12" fill="#23261f" text-anchor="middle">Short curved claws, about 2.5 to 5 cm</text>

  <!-- GRIZZLY panel -->
  <rect x="12" y="286" width="376" height="230" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
  <text x="30" y="308" font-size="16" font-weight="bold" fill="#e8590c">Grizzly (NO open season in BC)</text>
  <path d="M70 432 C70 404 96 392 150 394 C196 396 214 372 240 362 C270 350 296 368 304 392 C312 406 326 414 330 432 L330 448 C330 456 322 460 310 460 L92 460 C78 460 70 448 70 432 Z" fill="#6b4f35" stroke="#23261f" stroke-width="2"/>
  <path d="M300 400 C302 384 316 372 338 374 C356 376 368 388 376 404 L370 418 C364 428 350 432 334 430 L314 428 C304 424 298 414 300 400 Z" fill="#6b4f35" stroke="#23261f" stroke-width="2"/>
  <circle cx="318" cy="378" r="7" fill="#6b4f35" stroke="#23261f" stroke-width="2"/>
  <circle cx="340" cy="372" r="7" fill="#6b4f35" stroke="#23261f" stroke-width="2"/>
  <path d="M322 372 Q350 374 378 404" stroke="#e8590c" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
  <rect x="96" y="456" width="20" height="40" fill="#6b4f35" stroke="#23261f" stroke-width="2"/>
  <rect x="132" y="456" width="20" height="40" fill="#6b4f35" stroke="#23261f" stroke-width="2"/>
  <rect x="262" y="456" width="20" height="40" fill="#6b4f35" stroke="#23261f" stroke-width="2"/>
  <rect x="296" y="456" width="20" height="40" fill="#6b4f35" stroke="#23261f" stroke-width="2"/>
  <path d="M316 496 L336 492 M316 489 L335 485 M316 482 L333 478" stroke="#23261f" stroke-width="2" fill="none"/>
  <text x="104" y="376" font-size="13" fill="#23261f" text-anchor="middle">Rump lower than hump</text>
  <line x1="110" y1="380" x2="112" y2="392" stroke="#e8590c" stroke-width="2" fill="none"/>
  <text x="222" y="344" font-size="13" fill="#e8590c" font-weight="bold" text-anchor="middle">Shoulder hump</text>
  <line x1="236" y1="348" x2="240" y2="360" stroke="#e8590c" stroke-width="2" fill="none"/>
  <text x="326" y="352" font-size="13" fill="#23261f" text-anchor="middle">Small round ears</text>
  <text x="340" y="448" font-size="13" font-weight="bold" fill="#e8590c" stroke="#fffaf0" stroke-width="4" paint-order="stroke" text-anchor="middle">Dished face</text>
  <text x="160" y="510" font-size="12" fill="#23261f" text-anchor="middle">Long straighter claws, about 5 to 10 cm</text>

  <!-- Colour strip -->
  <rect x="12" y="528" width="376" height="100" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
  <text x="200" y="548" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Colour is NOT reliable.</text>
  <text x="200" y="564" font-size="13" fill="#2f3a2b" text-anchor="middle">All of these can be black bears.</text>
  <ellipse cx="70" cy="592" rx="34" ry="16" fill="#23261f" stroke="#23261f" stroke-width="1.5"/>
  <ellipse cx="160" cy="592" rx="34" ry="16" fill="#6b4f35" stroke="#23261f" stroke-width="1.5"/>
  <ellipse cx="250" cy="592" rx="34" ry="16" fill="#b08a5e" stroke="#23261f" stroke-width="1.5"/>
  <ellipse cx="340" cy="592" rx="34" ry="16" fill="#e9d9a8" stroke="#23261f" stroke-width="1.5"/>
  <text x="70" y="620" font-size="11" fill="#23261f" text-anchor="middle">black</text>
  <text x="160" y="620" font-size="11" fill="#23261f" text-anchor="middle">brown</text>
  <text x="250" y="620" font-size="11" fill="#23261f" text-anchor="middle">cinnamon</text>
  <text x="340" y="620" font-size="11" fill="#23261f" text-anchor="middle">blond</text>
</svg>
