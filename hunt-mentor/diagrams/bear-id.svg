<text x="196" y="133" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">No shoulder hump</text>
<rect x="275.7" y="272.0" width="110.3" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="330.85" y="291" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Straight face</text>
