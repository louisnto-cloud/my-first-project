<text x="107.188" y="415" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Rump lower than hump</text>
<rect x="245.8" y="396.0" width="140.2" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="315.923" y="415" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Small round ears</text>
<rect x="133.9" y="430.0" width="124.1" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="196" y="449" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Shoulder hump</text>
<rect x="284.4" y="588.0" width="101.6" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="335.183" y="607" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Dished face</text>
<rect x="14.0" y="622.0" width="315.4" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="171.709" y="641" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Long straighter claws, about 5 to 10 cm</text>
