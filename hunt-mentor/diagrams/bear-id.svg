<rect x="14.0" y="80.0" width="182.2" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="105.102" y="99" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Rump is the high point</text>
