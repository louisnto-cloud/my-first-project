<path d="M18 36 H382 A10 10 0 0 1 392 46 V70 H8 V46 A10 10 0 0 1 18 36z" fill="#5c7a3a"/>
<text x="20" y="60" font-size="17" font-weight="bold" fill="#fffaf0">Black bear: legal in season</text>
