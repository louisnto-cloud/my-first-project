<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 804" font-family="sans-serif" role="img" aria-label="Black bear or grizzly: use body shape, not colour. Black bear, legal in season: the rump is the high point, no shoulder hump, tall ears, a straight face, and short curved claws about 2.5 to 5 cm. Grizzly, no open season in BC: the rump is lower than the shoulder hump, small round ears, a dished face, and long straighter claws about 5 to 10 cm. Colour is not reliable: black, brown, cinnamon and blond can all be black bears.">
<rect width="400" height="804" fill="#fffaf0"/>
<text x="12" y="24" font-size="16" font-weight="bold" fill="#2f3a2b">Use body shape, not colour</text>
