<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A chain of five links: late start, wrong turn, dark comes, wet and cold, a fall or a bad call. Break any link and the chain fails; a turnaround time breaks the first three. Tip, hunter wisdom.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Small problems stack up</text><rect x="24" y="48" width="112" height="48" rx="22" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="80" y="77" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Late start</text><rect x="144" y="48" width="112" height="48" rx="22" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="77" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Wrong turn</text><rect x="264" y="48" width="112" height="48" rx="22" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="320" y="77" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Dark comes</text><rect x="74" y="144" width="112" height="48" rx="22" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="130" y="173" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Wet and cold</text><rect x="214" y="144" width="112" height="48" rx="22" fill="#f6d7c3" stroke="#e8590c" stroke-width="2"/><text x="270" y="173" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Fall, bad call</text><line x1="136" y1="72" x2="136.0" y2="72.0" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="144.0,72.0 136.0,68.0 136.0,76.0" fill="#e8590c"/><line x1="256" y1="72" x2="256.0" y2="72.0" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="264.0,72.0 256.0,68.0 256.0,76.0" fill="#e8590c"/><line x1="300" y1="98" x2="168.5859434521113" y2="139.30156062933645" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="160.0,142.0 169.9,143.6 167.2,135.0" fill="#e8590c"/><line x1="186" y1="168" x2="206.0" y2="168.0" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="214.0,168.0 206.0,164.0 206.0,172.0" fill="#e8590c"/><text x="200" y="240" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Break any link and the chain fails.</text><text x="200" y="266" font-size="15" fill="#23261f" text-anchor="middle">Turnaround time breaks the first three.</text><text x="200" y="291" font-size="14" fill="#6b4f35" text-anchor="middle">Tip: hunter wisdom</text>
</svg>
