<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-label="Top view of a covey flush. You and a partner walk in a line. Birds fan out ahead. Safe shooting is the wedge straight ahead of you. No shots toward your partner, toward the building, low over the brush, or behind you.">
  <rect x="0" y="0" width="400" height="440" fill="#fffaf0"/>
  <path d="M200 330 L80 90 A 135 135 0 0 1 300 90 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
  <text x="190" y="118" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">SAFE ZONE</text>
  <text x="190" y="137" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="middle">Birds above head height,</text>
  <text x="190" y="154" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="middle">open ground beyond</text>
  <g fill="#6b4f35">
    <ellipse cx="190" cy="250" rx="70" ry="22"/>
  </g>
  <text x="190" y="255" font-family="sans-serif" font-size="14" fill="#fffaf0" text-anchor="middle">Brush with covey</text>
  <g stroke="#23261f" stroke-width="3" fill="none">
    <path d="M190 232 L120 175"/>
    <path d="M190 232 L165 170"/>
    <path d="M190 232 L215 170"/>
    <path d="M190 232 L262 178"/>
    <path d="M190 232 L330 220"/>
  </g>
  <g fill="#23261f">
    <circle cx="120" cy="175" r="5"/><circle cx="165" cy="170" r="5"/><circle cx="215" cy="170" r="5"/><circle cx="262" cy="178" r="5"/><circle cx="330" cy="220" r="5"/>
  </g>
  <rect x="332" y="150" width="56" height="44" fill="#6b4f35"/>
  <polygon points="328,150 360,124 392,150" fill="#23261f"/>
  <text x="360" y="212" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Building</text>
  <text x="330" y="246" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">NO SHOT</text>
  <circle cx="200" cy="345" r="13" fill="#2f3a2b"/>
  <text x="200" y="378" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">You</text>
  <circle cx="60" cy="345" r="13" fill="#e8590c"/>
  <text x="60" y="378" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Partner</text>
  <line x1="80" y1="345" x2="180" y2="345" stroke="#e8590c" stroke-width="3" stroke-dasharray="6 5" fill="none"/>
  <text x="120" y="330" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">NO SHOT</text>
  <text x="200" y="408" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Behind you and low birds: NO SHOT</text>
  <text x="200" y="428" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Stay in line. Know where your partner is.</text>
</svg>
