<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Which calls are legal. Mouth and hand calls, rattling antlers and grunt tubes: legal for deer, elk and moose. Electronic or recorded calls: unlawful for deer, elk and moose, allowed only for wolf, coyote, cougar, lynx, bobcat and Schedule C birds. Synopsis page 12, item 41.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Which calls are legal?</text>
  <rect x="10" y="44" width="185" height="200" rx="10" fill="#dfe6d3"/>
  <rect x="205" y="44" width="185" height="200" rx="10" fill="#f6dccb"/>
  <text x="102" y="72" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Mouth or hand</text>
  <text x="297" y="72" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Electronic</text>
  <rect x="60" y="88" width="70" height="18" rx="9" fill="#6b4f35"/><rect x="40" y="92" width="22" height="10" fill="#2f3a2b"/>
  <path d="M60 120 q20 -14 40 0 M80 125 q20 -14 40 0" stroke="#8b5a2b" stroke-width="4" fill="none"/>
  <rect x="265" y="86" width="64" height="40" rx="6" fill="#2f3a2b"/><circle cx="285" cy="106" r="11" fill="#6f6252"/><rect x="302" y="96" width="20" height="6" fill="#e8590c"/>
  <text x="102" y="160" font-size="15" fill="#2f3a2b" text-anchor="middle">Deer, elk, moose</text>
  <text x="102" y="196" font-size="30" font-weight="bold" fill="#2f3a2b" text-anchor="middle">✓ legal</text>
  <text x="297" y="160" font-size="15" fill="#2f3a2b" text-anchor="middle">Deer, elk, moose</text>
  <text x="297" y="196" font-size="30" font-weight="bold" fill="#c0392b" text-anchor="middle">✗ illegal</text>
  <text x="297" y="222" font-size="14" fill="#2f3a2b" text-anchor="middle">OK only: predators *</text>
  <text x="200" y="268" font-size="14" fill="#2f3a2b" text-anchor="middle">* wolf, coyote, cougar, lynx, bobcat, Schedule C birds</text>
  <text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Synopsis page 12, item 41 (95%)</text>
</svg>
