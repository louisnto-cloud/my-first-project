<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 364" font-family="sans-serif" role="img" aria-label="Flowchart: is my rifle legal for bison? First: is the bullet 175 grain or heavier? No: not legal. Yes: does it still carry at least 2,712 joules, 2,000 foot pounds, at 100 metres? No: not legal. Yes: legal for bison, 98 percent. A .308 with 165 grain bullets fails step 1. Check the box, a tip.">
<rect width="400" height="364" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Is my rifle legal for bison?</text>
<rect x="10" y="44" width="280" height="54" rx="8" fill="#f4eedf" stroke="#2f3a2b" stroke-width="1.8"/><text x="150" y="77" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bullet 175 grain or heavier?</text>
<line x1="290" y1="71" x2="311" y2="71" stroke="#c0392b" stroke-width="2.2"/><path d="M309 65 L309 77 L318 71z" fill="#c0392b"/><text x="303" y="64" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">No</text>
<rect x="318" y="44" width="72" height="54" rx="8" fill="#c0392b"/><text x="354" y="68" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Not</text><text x="354" y="86" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">legal</text>
<line x1="150" y1="98" x2="150" y2="127" stroke="#2f3a2b" stroke-width="2.2"/><path d="M144 125 L156 125 L150 134z" fill="#2f3a2b"/><text x="160" y="121" font-size="15" font-weight="bold" fill="#2f6e3b">Yes</text>
<rect x="10" y="134" width="280" height="64" rx="8" fill="#f4eedf" stroke="#2f3a2b" stroke-width="1.8"/><text x="150" y="162" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">At least 2,712 J (2,000 ft lb)</text><text x="150" y="182" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">still left at 100 m?</text>
<line x1="290" y1="166" x2="311" y2="166" stroke="#c0392b" stroke-width="2.2"/><path d="M309 160 L309 172 L318 166z" fill="#c0392b"/><text x="303" y="159" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">No</text>
<rect x="318" y="134" width="72" height="64" rx="8" fill="#c0392b"/><text x="354" y="163" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Not</text><text x="354" y="181" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">legal</text>
<line x1="150" y1="198" x2="150" y2="227" stroke="#2f3a2b" stroke-width="2.2"/><path d="M144 225 L156 225 L150 234z" fill="#2f3a2b"/><text x="160" y="221" font-size="15" font-weight="bold" fill="#2f6e3b">Yes</text>
<rect x="10" y="234" width="280" height="50" rx="8" fill="#2f6e3b"/><text x="150" y="265" font-size="18" font-weight="bold" fill="#fffaf0" text-anchor="middle">Legal for bison (98%)</text>
<rect x="10" y="298" width="380" height="58" rx="8" fill="#fbe9dc" stroke="#e8590c" stroke-width="1.6"/>
<text x="200" y="322" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">.308 with 165 grain fails step 1.</text>
<text x="200" y="343" font-size="15" fill="#2f3a2b" text-anchor="middle">Check the box (Tip).</text>
</svg>
