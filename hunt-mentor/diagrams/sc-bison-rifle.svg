<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Flowchart: is my rifle legal for bison? First: is the bullet 175 grain or heavier? No: not legal. Yes: does it still carry at least 2,712 joules, 2,000 foot pounds, at 100 metres? No: not legal. Yes: legal for bison, 98 percent. A .308 with 165 grain bullets fails step 1. Check the box, a tip." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Is my rifle legal for bison?</text>
<rect x="60" y="44" width="280" height="46" rx="8" fill="#f3ead8" stroke="#2f3a2b" stroke-width="2"/>
<text x="200.0" y="72.2" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Bullet 175 grain or heavier?</text>
<line x1="200" y1="90" x2="200.0" y2="111.0" stroke="#2f3a2b" stroke-width="2.5"/><polygon points="200,120 204.9,111.0 195.1,111.0" fill="#2f3a2b"/>
<text x="212" y="110" font-size="14" fill="#2f6b3a" text-anchor="start" font-weight="bold">Yes</text>
<line x1="340" y1="67" x2="363.0" y2="67.0" stroke="#e8590c" stroke-width="2.5"/><polygon points="372,67 363.0,62.0 363.0,72.0" fill="#e8590c"/>
<text x="356" y="58" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">No</text>
<rect x="60" y="120" width="280" height="56" rx="8" fill="#f3ead8" stroke="#2f3a2b" stroke-width="2"/>
<text x="200.0" y="143.8" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">At least 2,712 J (2,000 ft lb)</text>
<text x="200.0" y="162.8" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">still left at 100 m?</text>
<line x1="200" y1="176" x2="200.0" y2="197.0" stroke="#2f3a2b" stroke-width="2.5"/><polygon points="200,206 204.9,197.0 195.1,197.0" fill="#2f3a2b"/>
<text x="212" y="196" font-size="14" fill="#2f6b3a" text-anchor="start" font-weight="bold">Yes</text>
<line x1="340" y1="148" x2="363.0" y2="148.0" stroke="#e8590c" stroke-width="2.5"/><polygon points="372,148 363.0,143.1 363.0,152.9" fill="#e8590c"/>
<text x="356" y="139" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">No</text>
<rect x="372" y="50" width="22" height="116" rx="6" fill="#e8590c"/>
<text x="383" y="112" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold" transform="rotate(90 383 108)">NOT</text>
<rect x="60" y="206" width="280" height="36" rx="8" fill="#2f6b3a" stroke="#2f6b3a" stroke-width="2"/>
<text x="200.0" y="229.2" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">Legal for bison (98%)</text>
<rect x="10" y="252" width="380" height="42" rx="8" fill="#fde8d8" stroke="#e8590c" stroke-width="2"/>
<text x="200.0" y="277.9" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">.308 with 165 grain fails step 1. Check the box (Tip).</text>
</svg>
