<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Step 1: When did the weather change?. Check the overnight record or your notes.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="30" cy="30" r="20" fill="#e8590c"/>
<text x="30" y="37" font-family="sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="60" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">When did the weather change?</text>
<rect x="120" y="90" width="160" height="100" rx="8" fill="#fff" stroke="#2f3a2b"/><text x="200" y="130" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Rain stopped 3 am</text><text x="200" y="160" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Snow ended 5 am</text><text x="200" y="225" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Note when the weather changed</text>
<text x="200" y="288" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Check the overnight record or your notes.</text>
</svg>
