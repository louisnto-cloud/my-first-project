<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A forested slope in the morning: warm air rises over the treetops while a thin layer of cool air keeps sinking downhill along the shaded forest floor. Two winds at once.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#e7f0f7" stroke="none" stroke-width="2"/><text x="14" y="26" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Timber: two winds at once (75%)</text><path d="M0 270 L400 120 L400 300 L0 300 Z" fill="#c9d3b8" stroke="#8b5a2b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><g fill="#4d5a40"><polygon points="30,214.0 10,270.0 50,270.0"/><rect x="26" y="270.0" width="8" height="12"/></g><g fill="#4d5a40"><polygon points="72,198.25 52,254.25 92,254.25"/><rect x="68" y="254.25" width="8" height="12"/></g><g fill="#4d5a40"><polygon points="114,182.5 94,238.5 134,238.5"/><rect x="110" y="238.5" width="8" height="12"/></g><g fill="#4d5a40"><polygon points="156,166.75 136,222.75 176,222.75"/><rect x="152" y="222.75" width="8" height="12"/></g><g fill="#4d5a40"><polygon points="198,151.0 178,207.0 218,207.0"/><rect x="194" y="207.0" width="8" height="12"/></g><g fill="#4d5a40"><polygon points="240,135.25 220,191.25 260,191.25"/><rect x="236" y="191.25" width="8" height="12"/></g><g fill="#4d5a40"><polygon points="282,119.5 262,175.5 302,175.5"/><rect x="278" y="175.5" width="8" height="12"/></g><g fill="#4d5a40"><polygon points="324,103.75 304,159.75 344,159.75"/><rect x="320" y="159.75" width="8" height="12"/></g><g fill="#4d5a40"><polygon points="366,88.0 346,144.0 386,144.0"/><rect x="362" y="144.0" width="8" height="12"/></g><line x1="60" y1="180" x2="322.8" y2="82.7" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><polygon points="330.0,80.0 317.6,78.1 321.8,89.5" fill="#e8590c"/><text x="120" y="110" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">Sunny: up over the treetops</text><line x1="320" y1="175" x2="127.2" y2="247.3" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/><polygon points="120.0,250.0 132.4,251.8 128.2,240.5" fill="#4a7fb0"/><text x="150" y="280" font-family="sans-serif" font-size="14" fill="#4a7fb0" text-anchor="start" font-weight="bold">Shady floor: thin cool air still sinks</text>
</svg>
