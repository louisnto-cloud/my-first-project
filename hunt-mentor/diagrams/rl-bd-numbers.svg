<text x="104" y="140" font-size="17" font-weight="bold" fill="#c2410c">Snow catching cover</text>
<text x="104" y="164" font-size="16" fill="#2f3a2b">Trees over <tspan font-weight="bold" fill="#2f3a2b">10 m</tspan> tall</text>
<text x="104" y="185" font-size="16" fill="#2f3a2b">Crowns over <tspan font-weight="bold" fill="#2f3a2b">60%</tspan> closed</text>
<text x="104" y="206" font-size="16" fill="#2f3a2b">Douglas fir, old and big</text>
