<text x="104" y="34" font-size="17" font-weight="bold" fill="#c2410c">Security cover</text>
<text x="104" y="58" font-size="16" fill="#2f3a2b">Hides <tspan font-weight="bold" fill="#2f3a2b">90%</tspan> of a deer</text>
<text x="104" y="79" font-size="16" fill="#2f3a2b">at <tspan font-weight="bold" fill="#2f3a2b">60 m</tspan> or less</text>
