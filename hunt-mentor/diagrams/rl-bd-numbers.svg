<text x="104" y="246" font-size="17" font-weight="bold" fill="#c2410c">Night thermal cover</text>
<text x="104" y="270" font-size="16" fill="#2f3a2b">Closed canopy above <tspan font-weight="bold" fill="#2f3a2b">3 m</tspan></text>
<text x="104" y="291" font-size="16" fill="#2f3a2b">Less wind at deer height</text>
<text x="104" y="312" font-size="16" fill="#2f3a2b">Traps heat, catches snow</text>
