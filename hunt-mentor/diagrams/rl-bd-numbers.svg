<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 432" font-family="sans-serif" role="img" aria-label="Four cards of cover numbers. Security cover for mule deer hides 90 percent of a deer at 60 m or less, in patches 180 m or more across. Snow catching cover: trees over 10 m tall with crowns over 60 percent closed, old big Douglas fir. Night thermal cover: closed canopy above 3 m, less wind at deer height, traps heat and catches snow. Elk, from US studies: thermal cover 12 m tall with over 70 percent crown closure, hiding cover hides 90 percent of an elk at 61 m, and the benefit of thermal cover is debated.">
