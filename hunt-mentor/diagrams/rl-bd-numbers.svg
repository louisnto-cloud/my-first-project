<text x="104" y="352" font-size="17" font-weight="bold" fill="#c2410c">Elk (US studies)</text>
<text x="104" y="376" font-size="16" fill="#2f3a2b">Thermal: <tspan font-weight="bold" fill="#2f3a2b">12 m</tspan>, over <tspan font-weight="bold" fill="#2f3a2b">70%</tspan></text>
<text x="104" y="397" font-size="16" fill="#2f3a2b">Hiding: <tspan font-weight="bold" fill="#2f3a2b">90%</tspan> at <tspan font-weight="bold" fill="#2f3a2b">61 m</tspan></text>
<text x="104" y="418" font-size="16" fill="#2f3a2b">Benefit debated</text>
