<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A bull elk with sound rings. A snapped twig makes it look and listen. Its ears turn to the sound. A bull bugle carries 1.6 km or more. Elk are vocal: chirps, mews and barks. No measured hearing range for elk was found: VERIFY.">
<rect width="400" height="300" fill="#fffaf0"/>
