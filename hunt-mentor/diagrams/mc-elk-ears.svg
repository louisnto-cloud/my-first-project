oke-linejoin="round"/></g><path d="M120 93 A40 40 0 0 1 120 157" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M138 65 A75 75 0 0 1 138 185" fill="none" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M155 37 A110 110 0 0 1 155 213" fill="none" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="225" y="60" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Twig snaps: it looks</text><text x="225" y="78" font-size="14" fill="#23261f" text-anchor="start">and listens (75%)</text><text x="225" y="120" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Ears turn to the sound</text><text x="225" y="138" font-size="14" fill="#23261f" text-anchor="start">(85%)</text><text x="225" y="180" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Bugle carries 1.6 km</text><text x="225" y="198" font-size="14" fill="#23261f" text-anchor="start">or more (80%)</text><text x="200" y="268" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Elk talk a lot: chirps, mews, barks</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Hearing range numbers for elk: VERIFY</text>
