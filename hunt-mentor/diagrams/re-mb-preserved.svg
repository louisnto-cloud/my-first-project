<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 293" role="img" aria-label="Cards: Does this bird still count?. Still counts: Not preserved: in the truck, the cooler, the fridge at home. Preserved: Plucked and frozen at home, or sausage, cooked, dried, canned, smoked, or mounted. Until preserved: One fully feathered wing or the head stays on. Never: Let edible meat be wasted." font-family="sans-serif">
<rect x="0" y="0" width="400" height="293" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Does this bird still count?</text>
<text x="200" y="47" font-size="14" fill="#8b5a2b" text-anchor="middle">s. 1, 45, 46, 47, 52, 55</text>
<rect x="6.0" y="69" width="190.0" height="112" rx="9" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M6.0 97 V78 Q6.0 69 15.0 69 H187.0 Q196.0 69 196.0 78 V97 Z" fill="#c92a2a"/>
<text x="14.0" y="89" font-size="14" font-weight="bold" fill="#ffffff">Still counts</text>
<text x="14.0" y="117" font-size="14" fill="#23261f">Not preserved: in the</text>
<text x="14.0" y="135" font-size="14" fill="#23261f">truck, the cooler, the</text>
<text x="14.0" y="153" font-size="14" fill="#23261f">fridge at home</text>
<rect x="204.0" y="69" width="190.0" height="112" rx="9" fill="#ffffff" stroke="#8a9a6b" stroke-width="2.5"/>
<path d="M204.0 97 V78 Q204.0 69 213.0 69 H385.0 Q394.0 69 394.0 78 V97 Z" fill="#8a9a6b"/>
<text x="212.0" y="89" font-size="14" font-weight="bold" fill="#ffffff">Preserved</text>
<text x="212.0" y="117" font-size="14" fill="#23261f">Plucked and frozen at</text>
<text x="212.0" y="135" font-size="14" fill="#23261f">home, or sausage,</text>
<text x="212.0" y="153" font-size="14" fill="#23261f">cooked, dried, canned,</text>
<text x="212.0" y="171" font-size="14" fill="#23261f">smoked, or mounted</text>
<rect x="6.0" y="189" width="190.0" height="94" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<path d="M6.0 217 V198 Q6.0 189 15.0 189 H187.0 Q196.0 189 196.0 198 V217 Z" fill="#e8590c"/>
<text x="14.0" y="209" font-size="14" font-weight="bold" fill="#ffffff">Until preserved</text>
<text x="14.0" y="237" font-size="14" fill="#23261f">One fully feathered</text>
<text x="14.0" y="255" font-size="14" fill="#23261f">wing or the head stays</text>
<text x="14.0" y="273" font-size="14" fill="#23261f">on</text>
<rect x="204.0" y="189" width="190.0" height="94" rx="9" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M204.0 217 V198 Q204.0 189 213.0 189 H385.0 Q394.0 189 394.0 198 V217 Z" fill="#c92a2a"/>
<text x="212.0" y="209" font-size="14" font-weight="bold" fill="#ffffff">Never</text>
<text x="212.0" y="237" font-size="14" fill="#23261f">Let edible meat be</text>
<text x="212.0" y="255" font-size="14" fill="#23261f">wasted</text>
</svg>
