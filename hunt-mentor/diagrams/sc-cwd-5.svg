<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Step 5: keep the perforated stub with your CWD number and photograph it. Results are posted online by that number. Positive results are not posted: the province phones you, 95 percent." font-family="sans-serif">
