<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-label="Timeline of District No. 2 migratory bird seasons for 2026 to 2027. Ducks, coots, snipe and white fronted geese run 10 October 2026 to 24 January 2027. Canada and cackling geese run 5 to 15 September, 10 October to 22 November, 19 December to 10 January and 10 February to 10 March. Snow and Ross's geese run 10 October to 5 January and 20 February to 10 March. Band tailed pigeons 15 to 30 September. Brant 1 to 10 March in MU 2-4 only.">
  <rect x="0" y="0" width="400" height="330" fill="#fffaf0"/>
  <!-- month grid -->
  <g stroke="#8a9a6b" stroke-width="1" fill="none">
    <line x1="40" y1="30" x2="40" y2="322"/>
    <line x1="89" y1="30" x2="89" y2="322"/>
    <line x1="141" y1="30" x2="141" y2="322"/>
    <line x1="190" y1="30" x2="190" y2="322"/>
    <line x1="241" y1="30" x2="241" y2="322"/>
    <line x1="292" y1="30" x2="292" y2="322"/>
    <line x1="339" y1="30" x2="339" y2="322"/>
    <line x1="390" y1="30" x2="390" y2="322"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">
    <text x="64" y="22">Sep</text>
    <text x="115" y="22">Oct</text>
    <text x="165" y="22">Nov</text>
    <text x="215" y="22">Dec</text>
    <text x="266" y="22">Jan</text>
    <text x="315" y="22">Feb</text>
    <text x="364" y="22">Mar</text>
  </g>
  <!-- Row 1: ducks, coots, snipe, white fronted geese: Oct 10 to Jan 24 -->
  <text x="42" y="48" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f">Ducks, coots, snipe, white fronted: 10 Oct to 24 Jan</text>
  <rect x="104" y="54" width="177" height="16" fill="#2f3a2b"/>
  <!-- Row 2: Canada and cackling geese: 4 periods -->
  <text x="42" y="96" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f">Canada, cackling geese: 4 periods</text>
  <rect x="47" y="102" width="18" height="16" fill="#6b4f35"/>
  <rect x="104" y="102" width="73" height="16" fill="#6b4f35"/>
  <rect x="220" y="102" width="38" height="16" fill="#6b4f35"/>
  <rect x="307" y="102" width="48" height="16" fill="#6b4f35"/>
  <text x="42" y="131" font-family="sans-serif" font-size="14" fill="#e8590c">5 to 15 Sep, 10 Oct to 22 Nov, 19 Dec to 10 Jan, 10 Feb to 10 Mar</text>
  <!-- Row 3: snow and Ross's geese: Oct 10 to Jan 5, Feb 20 to Mar 10 -->
  <text x="42" y="158" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f">Snow, Ross's: 10 Oct to 5 Jan, 20 Feb to 10 Mar</text>
  <rect x="104" y="164" width="146" height="16" fill="#6b4f35"/>
  <rect x="324" y="164" width="31" height="16" fill="#6b4f35"/>
  <!-- Row 4: band tailed pigeons -->
  <text x="42" y="206" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f">Band tailed pigeons: 15 to 30 Sep</text>
  <rect x="63" y="212" width="26" height="16" fill="#8a9a6b"/>
  <!-- Row 5: brant MU 2-4 only -->
  <text x="42" y="254" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f">Brant: 1 to 10 Mar, MU 2-4 only (not Mission)</text>
  <rect x="339" y="260" width="16" height="16" fill="#8a9a6b"/>
  <!-- Row 6: doves closed -->
  <text x="42" y="302" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f">Mourning and collared doves: no open season</text>
  <line x1="40" y1="312" x2="390" y2="312" stroke="#e8590c" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
</svg>
