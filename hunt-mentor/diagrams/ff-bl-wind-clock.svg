<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A clock face around you, with the target at 12. Wind from 3 or 9 o clock is full value. Wind from 12 or 6 has almost no sideways effect. Wind from 1, 2, 4, 5, 7, 8, 10 or 11 is roughly 70 percent. Wind from 3 pushes the bullet toward 9.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wind clock: how much counts</text><circle cx="200" cy="160" r="100" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2"/><text x="242.0" y="93.3" font-size="17" font-weight="bold" fill="#4a7fb0" text-anchor="middle">1</text><text x="272.7" y="124.0" font-size="17" font-weight="bold" fill="#4a7fb0" text-anchor="middle">2</text><text x="284.0" y="166.0" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">3</text><text x="272.7" y="208.0" font-size="17" font-weight="bold" fill="#4a7fb0" text-anchor="middle">4</text><text x="242.0" y="238.7" font-size="17" font-weight="bold" fill="#4a7fb0" text-anchor="middle">5</text><text x="200.0" y="250.0" font-size="17" font-weight="bold" fill="#6b6f68" text-anchor="middle">6</text><text x="158.0" y="238.7" font-size="17" font-weight="bold" fill="#4a7fb0" text-anchor="middle">7</text><text x="127.3" y="208.0" font-size="17" font-weight="bold" fill="#4a7fb0" text-anchor="middle">8</text><text x="116.0" y="166.0" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">9</text><text x="127.3" y="124.0" font-size="17" font-weight="bold" fill="#4a7fb0" text-anchor="middle">10</text><text x="158.0" y="93.3" font-size="17" font-weight="bold" fill="#4a7fb0" text-anchor="middle">11</text><text x="200.0" y="82.0" font-size="17" font-weight="bold" fill="#6b6f68" text-anchor="middle">12</text><line x1="200" y1="200" x2="200" y2="110" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round"/><path d="M203.9 118.1 L200 110 L196.1 118.1" fill="none" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="220" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">you face 12</text><text x="330" y="70" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">3 and 9:</text><text x="330" y="88" font-size="14" fill="#23261f" text-anchor="middle">full value</text><text x="70" y="70" font-size="15" font-weight="bold" fill="#6b6f68" text-anchor="middle">12 and 6:</text><text x="70" y="88" font-size="14" fill="#23261f" text-anchor="middle">almost none</text><text x="66" y="260" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">1, 2, 4, 5, 7, 8,</text><text x="66" y="278" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">10, 11: about 70%</text><text x="320" y="270" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wind from 3</text><text x="320" y="288" font-size="14" fill="#2f3a2b" text-anchor="middle">pushes toward 9</text>
</svg>
