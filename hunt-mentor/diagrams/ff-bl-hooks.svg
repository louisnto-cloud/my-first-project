<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Memory hooks: double the distance, about four times the wind drift. 3 and 9 o clock: full value wind. Cosine 30: a 30 degree slope counts as 87 percent of the distance. Hold low up or down hill. One mil is 10 cm at 100 m.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Memory hooks</text><rect x="20" y="50" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="75" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">Double, 4x</text><text x="150" y="75" font-size="15" fill="#23261f" text-anchor="start">double distance, 4x wind drift</text><rect x="20" y="96" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="121" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">3 and 9</text><text x="150" y="121" font-size="15" fill="#23261f" text-anchor="start">full value wind</text><rect x="20" y="142" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="167" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">Cos 30</text><text x="150" y="167" font-size="15" fill="#23261f" text-anchor="start">30° slope = 87% distance</text><rect x="20" y="188" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="213" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">Hold low</text><text x="150" y="213" font-size="15" fill="#23261f" text-anchor="start">up or down hill</text><rect x="20" y="234" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="259" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">1 mil</text><text x="150" y="259" font-size="15" fill="#23261f" text-anchor="start">10 cm at 100 m</text>
</svg>
