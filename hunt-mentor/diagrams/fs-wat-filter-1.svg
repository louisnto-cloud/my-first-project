<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Filter step 1: use a filter certified to remove cysts, pore size 1 micron or smaller. Jug filters do not count.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1. Pick the right filter</text><rect x="120" y="140" width="40" height="80" rx="8" fill="#4a7fb0" stroke="#2f3a2b" stroke-width="2"/><rect x="130" y="128" width="20" height="12" rx="2" fill="#2f3a2b"/><rect x="180" y="120" width="60" height="40" rx="6" fill="#2f3a2b"/><rect x="250" y="70" width="140" height="70" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="320" y="100" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1 micron</text><text x="320" y="121" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">or smaller</text><line x1="111" y1="81" x2="129" y2="99" stroke="#c0392b" stroke-width="5.0" stroke-linecap="round"/><line x1="129" y1="81" x2="111" y2="99" stroke="#c0392b" stroke-width="5.0" stroke-linecap="round"/><text x="120" y="70" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">jug filter</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Certified, 1 micron or smaller</text>
</svg>
