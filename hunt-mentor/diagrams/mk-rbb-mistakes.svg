<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 371" font-family="sans-serif" role="img" aria-label="3 common mistakes. A second mule deer buck in Region 8 after one in Region 3, fix: Regions 3 to 8 share one mule buck. Forgetting the freezer, fix: Ducks and geese at home still count toward the possession limit. Hauling a friend's deer with no Record of Receipt, fix: A Record of Receipt from them.">
<rect width="400" height="371" rx="12" fill="#EEF1EA"/>
<text x="16" y="30" font-size="18" font-weight="bold" fill="#1F3D2B">3 common mistakes</text>
<circle cx="28" cy="52" r="11" fill="#17201A"/><path d="M23.5 47.5 l9 9 M32.5 47.5 l-9 9" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/><text x="46" y="57" font-size="15" font-weight="bold" fill="#17201A">Mistake</text><circle cx="244" cy="52" r="11" fill="#1F3D2B"/><path d="M239 52 l3.5 4 l6.5 -8" stroke="#FFFFFF" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="262" y="57" font-size="15" font-weight="bold" fill="#1F3D2B">Fix</text>
<g><rect x="12" y="72" width="160" height="94" rx="8" fill="#FFFFFF" stroke="#17201A" stroke-width="1.5" stroke-dasharray="5 4"/><text x="22" y="94" font-size="15" fill="#17201A">A second mule deer</text>
<text x="22" y="113" font-size="15" fill="#17201A">buck in Region 8</text>
<text x="22" y="132" font-size="15" fill="#17201A">after one in</text>
<text x="22" y="151" font-size="15" fill="#17201A">Region 3</text><path d="M178 119 H215" stroke="#1F3D2B" stroke-width="3" fill="none"/><path d="M222 119 l-9 -6 v12z" fill="#1F3D2B"/><rect x="228" y="72" width="160" height="94" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="3"/><text x="238" y="94" font-size="15" font-weight="bold" fill="#1F3D2B">Regions 3 to 8</text>
<text x="238" y="113" font-size="15" font-weight="bold" fill="#1F3D2B">share one mule</text>
<text x="238" y="132" font-size="15" font-weight="bold" fill="#1F3D2B">buck</text></g>
<g><rect x="12" y="176" width="160" height="94" rx="8" fill="#FFFFFF" stroke="#17201A" stroke-width="1.5" stroke-dasharray="5 4"/><text x="22" y="198" font-size="15" fill="#17201A">Forgetting the</text>
<text x="22" y="217" font-size="15" fill="#17201A">freezer</text><path d="M178 223 H215" stroke="#1F3D2B" stroke-width="3" fill="none"/><path d="M222 223 l-9 -6 v12z" fill="#1F3D2B"/><rect x="228" y="176" width="160" height="94" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="3"/><text x="238" y="198" font-size="15" font-weight="bold" fill="#1F3D2B">Ducks and geese</text>
<text x="238" y="217" font-size="15" font-weight="bold" fill="#1F3D2B">at home still</text>
<text x="238" y="236" font-size="15" font-weight="bold" fill="#1F3D2B">count toward the</text>
<text x="238" y="255" font-size="15" font-weight="bold" fill="#1F3D2B">possession limit</text></g>
<g><rect x="12" y="280" width="160" height="75" rx="8" fill="#FFFFFF" stroke="#17201A" stroke-width="1.5" stroke-dasharray="5 4"/><text x="22" y="302" font-size="15" fill="#17201A">Hauling a friend's</text>
<text x="22" y="321" font-size="15" fill="#17201A">deer with no</text>
<text x="22" y="340" font-size="15" fill="#17201A">Record of Receipt</text><path d="M178 317.5 H215" stroke="#1F3D2B" stroke-width="3" fill="none"/><path d="M222 317.5 l-9 -6 v12z" fill="#1F3D2B"/><rect x="228" y="280" width="160" height="75" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="3"/><text x="238" y="302" font-size="15" font-weight="bold" fill="#1F3D2B">A Record of</text>
<text x="238" y="321" font-size="15" font-weight="bold" fill="#1F3D2B">Receipt from</text>
<text x="238" y="340" font-size="15" font-weight="bold" fill="#1F3D2B">them</text></g>

</svg>
