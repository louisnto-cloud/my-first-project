<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four compass jobs: Take a bearing off the map; Follow tree to tree; Return the back bearing; Find yourself: cross lines. Chapter 4. Set 15° east first (95%)">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Four compass jobs</text><rect x="20.0" y="42.0" width="175.0" height="112.0" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="107.5" y="95.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Take</text><text x="107.5" y="114.0" font-size="14" fill="#23261f" text-anchor="middle">a bearing off the map</text><rect x="205.0" y="42.0" width="175.0" height="112.0" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="292.5" y="95.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Follow</text><text x="292.5" y="114.0" font-size="14" fill="#23261f" text-anchor="middle">tree to tree</text><rect x="20.0" y="162.0" width="175.0" height="112.0" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="107.5" y="215.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Return</text><text x="107.5" y="234.0" font-size="14" fill="#23261f" text-anchor="middle">the back bearing</text><rect x="205.0" y="162.0" width="175.0" height="112.0" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="292.5" y="215.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Find</text><text x="292.5" y="234.0" font-size="14" fill="#23261f" text-anchor="middle">yourself: cross lines</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Chapter 4. Set 15° east first (95%)</text>
</svg>
