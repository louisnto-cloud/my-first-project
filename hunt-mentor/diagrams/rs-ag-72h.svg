<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="sans-serif" role="img" aria-label="A 72 hour weather timeline: rain 72 hours ago, frost 48 hours ago, wind 24 hours ago, dew 12 hours ago, sun now. Every print sits on this timeline: find which events it survived.">
<rect x="0" y="0" width="400" height="290" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Know your last 72 hours</text>
<line x1="30" y1="150" x2="370" y2="150" stroke="#23261f" stroke-width="3"/><circle cx="40" cy="150" r="7" fill="#e8590c"/><text x="40" y="130" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">72 h</text><text x="40" y="180" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">rain</text><circle cx="130" cy="150" r="7" fill="#e8590c"/><text x="130" y="130" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">48 h</text><text x="130" y="180" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">frost</text><circle cx="220" cy="150" r="7" fill="#e8590c"/><text x="220" y="130" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">24 h</text><text x="220" y="180" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">wind</text><circle cx="300" cy="150" r="7" fill="#e8590c"/><text x="300" y="130" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">12 h</text><text x="300" y="180" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">dew</text><circle cx="360" cy="150" r="7" fill="#e8590c"/><text x="360" y="130" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">now</text><text x="360" y="180" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">sun</text><rect x="20" y="206" width="360" height="70" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="200" y="234" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Every print sits on this timeline</text><text x="200" y="258" font-size="15" fill="#23261f" text-anchor="middle">Find what it survived</text>
</svg>
