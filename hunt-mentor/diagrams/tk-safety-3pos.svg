<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 316" font-family="sans-serif" role="img" aria-label="The Tikka safety seen from above and behind, as in figure 7 of the manual. Panel 1, ready to fire: cocked, safety forward, the red dot shows. Panel 2, transport position: unloaded and uncocked, safety forward, no cocking indicator. Panel 3, safety ON: cocked, safety pulled back, red dot hidden. Banner: red dot means it can fire.">
