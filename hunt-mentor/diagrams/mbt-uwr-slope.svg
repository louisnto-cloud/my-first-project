<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 318" font-family="sans-serif" role="img" aria-label="Capable deer winter range in order U-2-006: slopes facing 135 to 285 degrees, south east through south to west, shown in orange on a compass. Slopes 40 to 100%, not shaded by nearby hills. Snow zones: under 400 m shallow, 400 to 800 m moderate, over 800 m deep.">
<rect width="400" height="318" fill="#EEF1EA"/>
<text x="200" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Winter range: how to spot it</text>
