<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Winter valley cross section with deep snow. Deer bunch up under dense conifers on the left and pack trails between feeding spots. A south facing slope on the right melts out first in the sun. Over about 40 cm of snow, travel gets hard." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">Deep snow: yard up in conifers</text><path d="M0 260 L0 120 L150 230 L250 230 L400 90 L400 260 Z" fill="#ffffff" stroke="#b9c7d6" stroke-width="2"/><rect x="0" y="260" width="400" height="40" fill="#dfe6d3"/><polygon points="40,134.0 27.0,168.0 53.0,168.0" fill="#2f3a2b"/><rect x="37.5" y="168.0" width="5.0" height="8.0" fill="#6b4f35"/><polygon points="70,156.5 57.0,190.5 83.0,190.5" fill="#2f3a2b"/><rect x="67.5" y="190.5" width="5.0" height="8.0" fill="#6b4f35"/><polygon points="100,179.0 87.0,213.0 113.0,213.0" fill="#2f3a2b"/><rect x="97.5" y="213.0" width="5.0" height="8.0" fill="#6b4f35"/><g transform="translate(80 222) scale(0.35 0.35)"><rect x="-41" y="12" width="6" height="40" rx="3" fill="#8b5a2b"/><rect x="-31" y="12" width="6" height="40" rx="3" fill="#8b5a2b"/><rect x="27" y="12" width="6" height="40" rx="3" fill="#8b5a2b"/><rect x="37" y="12" width="6" height="40" rx="3" fill="#8b5a2b"/><ellipse cx="0" cy="0" rx="52" ry="22" fill="#8b5a2b"/><path d="M-30 -10 L-52 -42 L-40 -48 L-18 -14 Z" fill="#8b5a2b"/><ellipse cx="-58" cy="-46" rx="15" ry="8" fill="#8b5a2b"/><path d="M-50 -52 L-44 -64 L-40 -52 Z" fill="#8b5a2b"/><circle cx="-64" cy="-47" r="1.8" fill="#23261f"/><path d="M50 -8 C 60 -6 64 6 60 18 C 54 16 50 6 48 -2 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="1"/></g><g transform="translate(120 236) scale(-0.3 0.3)"><rect x="-41" y="12" width="6" height="40" rx="3" fill="#8b5a2b"/><rect x="-31" y="12" width="6" height="40" rx="3" fill="#8b5a2b"/><rect x="27" y="12" width="6" height="40" rx="3" fill="#8b5a2b"/><rect x="37" y="12" width="6" height="40" rx="3" fill="#8b5a2b"/><ellipse cx="0" cy="0" rx="52" ry="22" fill="#8b5a2b"/><path d="M-30 -10 L-52 -42 L-40 -48 L-18 -14 Z" fill="#8b5a2b"/><ellipse cx="-58" cy="-46" rx="15" ry="8" fill="#8b5a2b"/><path d="M-50 -52 L-44 -64 L-40 -52 Z" fill="#8b5a2b"/><circle cx="-64" cy="-47" r="1.8" fill="#23261f"/><path d="M50 -8 C 60 -6 64 6 60 18 C 54 16 50 6 48 -2 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="1"/></g><path d="M60 236 C 100 250 150 252 190 244" fill="none" stroke="#6b4f35" stroke-width="3" stroke-dasharray="4 4"/><text x="200" y="270" font-size="14" fill="#6b4f35" text-anchor="middle" font-weight="bold">Packed trails</text><text x="320" y="160" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">South slope:</text><text x="320" y="178" font-size="14" fill="#23261f" text-anchor="middle">sun melts snow</text><text x="60" y="106" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Conifer cover</text><text x="200" y="294" font-size="14" fill="#6b4f35" text-anchor="middle">Over about 40 cm of snow, travel gets hard.</text>
</svg>
