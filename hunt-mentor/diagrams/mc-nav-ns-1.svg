<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 1: no signal. Turn airplane mode on. GPS still works with no cell signal, 95 percent, and the battery lasts longer.">
<rect width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c"/><text x="26" y="31" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">1</text><text x="52" y="32" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Airplane mode on. GPS still works</text><g transform="translate(110 160) scale(1.6)"><rect x="-26" y="-48" width="52" height="96" rx="9" fill="#2f3a2b"/><rect x="-21" y="-40" width="42" height="76" rx="3" fill="#dfe6d3"/><circle cx="0" cy="42" r="3" fill="#fffaf0"/></g><text x="230" y="110" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">No bars?</text><text x="230" y="140" font-size="15" fill="#23261f" text-anchor="start">GPS needs no cell</text><text x="230" y="170" font-size="15" fill="#23261f" text-anchor="start">signal (95%).</text><text x="230" y="200" font-size="15" fill="#23261f" text-anchor="start">Saves battery</text>
</svg>
