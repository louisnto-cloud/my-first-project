  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">2. Pick low angle routes</text><path d="M0 260 L140 110 L200 90 L260 110 L400 260 Z" fill="#f4f7fb" stroke="#c9d6e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 250 L140 120 L200 96" fill="none" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="110" y="90" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="middle">ridge route</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Ridges and low angle, not open faces</text>
