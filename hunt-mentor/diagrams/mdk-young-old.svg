dth="1"/><path d="M10 -4 L18 -6" stroke="#3b5fa8" stroke-width="2.6"/></g></g></g>
<text x="298" y="150" font-size="15" fill="#2f3a2b" text-anchor="middle">Have seen decoys</text>
<text x="298" y="170" font-size="15" fill="#2f3a2b" text-anchor="middle">Late season birds</text>
<text x="298" y="190" font-size="15" fill="#2f3a2b" text-anchor="middle">are educated (Tip)</text>
<text x="298" y="210" font-size="16" font-weight="bold" fill="#2c5d86" text-anchor="middle">Circle, look, leave</text>
<text x="298" y="228" font-size="14" fill="#6b5b4b" text-anchor="middle">(Tip)</text>
<rect x="8" y="246" width="384" height="84" rx="10" fill="#dfe6d3"/>
<text x="200" y="271" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Opening week: lots of young birds (Tip)</text>
<text x="200" y="294" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Late season: hide better, call less</text>
<text x="200" y="317" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">(Old hand advice, opinion)</text>
