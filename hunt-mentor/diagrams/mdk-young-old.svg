<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 338" font-family="sans-serif" role="img" aria-label="Two cards with drawings. Young birds of the year: a drake mallard drops straight in, feet down, to the decoys. They are on their first trip south, more likely to be shot than adults (80 percent), and they decoy and come to calls easily (tip). Adults: a drake circles high over the decoys, looks and flies off. They have seen decoys; they circle, look and leave (tip); late season birds are educated (tip). Opening week has lots of young birds (tip); late season, hide better and call less. Old hand advice, opinion.">
<rect width="400" height="338" fill="#fffaf0"/>
<defs><clipPath id="mdk-young-old-sc"><rect x="0" y="0" width="188" height="92"/></clipPath></defs>
