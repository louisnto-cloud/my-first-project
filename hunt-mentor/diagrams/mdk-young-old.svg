<text x="102" y="150" font-size="15" fill="#2f3a2b" text-anchor="middle">First trip south</text>
<text x="102" y="170" font-size="15" fill="#2f3a2b" text-anchor="middle">More likely shot</text>
<text x="102" y="190" font-size="15" fill="#2f3a2b" text-anchor="middle">than adults (80%)</text>
<text x="102" y="210" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Decoy and call easily</text>
<text x="102" y="228" font-size="14" fill="#6b5b4b" text-anchor="middle">(Tip)</text>
