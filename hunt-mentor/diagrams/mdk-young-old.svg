<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two columns. Young birds of the year: on their first trip south, more likely to be shot than adults, 80 percent; they decoy and come to calls easily, a tip. Adults: have seen decoys, circle, look and leave, a tip; late season birds are educated. Opening week has lots of young birds; late season, hide better and call less. Old hand advice, opinion."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Young of the year vs old birds</text><rect x="8" y="40" width="188" height="170" rx="8" fill="#f6d7b0"/><rect x="8" y="40" width="188" height="26" rx="8" fill="#8b5a2b"/><rect x="8" y="54" width="188" height="12" rx="0" fill="#8b5a2b"/><text x="102.0" y="59" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Young (this year)</text><text x="102.0" y="86" font-size="14" fill="#2f3a2b" text-anchor="middle">First trip south</text><text x="102.0" y="105" font-size="14" fill="#2f3a2b" text-anchor="middle">More likely shot</text><text x="102.0" y="124" font-size="14" fill="#2f3a2b" text-anchor="middle">than adults (80%)</text><text x="102.0" y="143" font-size="14" fill="#2f3a2b" text-anchor="middle">Decoy and call easily</text><text x="102.0" y="162" font-size="14" fill="#2f3a2b" text-anchor="middle">(Tip)</text><text x="102.0" y="181" font-size="14" fill="#2f3a2b" text-anchor="middle"></text><rect x="204" y="40" width="188" height="170" rx="8" fill="#cfe0ef"/><rect x="204" y="40" width="188" height="26" rx="8" fill="#4a7fb0"/><rect x="204" y="54" width="188" height="12" rx="0" fill="#4a7fb0"/><text x="298.0" y="59" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Adults</text><text x="298.0" y="86" font-size="14" fill="#2f3a2b" text-anchor="middle">Have seen decoys</text><text x="298.0" y="105" font-size="14" fill="#2f3a2b" text-anchor="middle">Circle, look, leave</text><text x="298.0" y="124" font-size="14" fill="#2f3a2b" text-anchor="middle">(Tip)</text><text x="298.0" y="143" font-size="14" fill="#2f3a2b" text-anchor="middle">Late season birds</text><text x="298.0" y="162" font-size="14" fill="#2f3a2b" text-anchor="middle">are educated (Tip)</text><text x="298.0" y="181" font-size="14" fill="#2f3a2b" text-anchor="middle"></text><rect x="10" y="222" width="380" height="70" rx="8" fill="#dfe6d3"/><text x="200" y="246" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Opening week: lots of young birds (Tip)</text><text x="200" y="266" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Late season: hide better, call less</text><text x="200" y="286" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">(Old hand advice, opinion)</text></svg>
