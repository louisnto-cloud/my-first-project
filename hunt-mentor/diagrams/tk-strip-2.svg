<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bolt strip step 2: turn the bolt shroud clockwise until it stops, then pull it away from the bolt. Left handed rifles turn the other way.">
