<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A hunter in low sun throws a long moving shadow across the ground. Another sits inside a shaded timber edge and blends in.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c" stroke="none" stroke-width="2"/><text x="26" y="32" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="52" y="32" font-family="sans-serif" font-size="18" fill="#2f3a2b" text-anchor="start" font-weight="bold">Shadow</text><rect x="0" y="60" width="400" height="190" rx="0" fill="#dfe6d3" stroke="none" stroke-width="2"/><path d="M0 250 L400 250" fill="none" stroke="#2f3a2b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="80" cy="70" r="16" fill="#f2c70c" stroke="none" stroke-width="2"/><g transform="translate(140 240) scale(1.2)"><circle cx="0" cy="-30" r="7" fill="#2f3a2b"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" fill="none"/></g><path d="M140 248 L290 252 L290 258 L140 252 Z" fill="#2f3a2b" opacity=".5"/><text x="200" y="282" font-family="sans-serif" font-size="14" fill="#c92a2a" text-anchor="middle" font-weight="bold">long moving shadow</text><rect x="300" y="60" width="100" height="190" rx="0" fill="#4d5a40" stroke="none" stroke-width="0" opacity=".5"/><g transform="translate(350 240) scale(1.2)"><circle cx="0" cy="-30" r="7" fill="#3a4430"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" stroke="#3a4430" stroke-width="4" stroke-linecap="round" fill="none"/></g><text x="350" y="280" font-family="sans-serif" font-size="14" fill="#8a9a6b" text-anchor="middle" font-weight="bold">Sit in shade</text><text x="20" y="290" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start"></text>
