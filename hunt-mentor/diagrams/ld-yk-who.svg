<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 529" font-family="sans-serif" role="img" aria-label="Grid for Yukon, you are a non resident Canadian. Grouse, ptarmigan and hare: no guide, small game licence. Ducks and geese: no guide, plus the federal Migratory Game Bird Hunting Permit. Moose, caribou and wood bison: a registered outfitter, or a Yukon resident friend with a special guide licence. Black bear and wolf: outfitter, special guide VERIFY. Sheep, goat, grizzly and wolverine: registered outfitter only. Deer and elk: Yukon residents only.">
<rect x="0" y="0" width="400" height="529" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Yukon: who may hunt what</text>
<text x="200" y="46" font-size="14" fill="#6b4f35" text-anchor="middle">You are a non resident Canadian (85%)</text>
<text x="280" y="74" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">BC resident</text>
<rect x="8" y="83" width="384" height="72" fill="#dfe6d3" rx="4"/>
<text x="14" y="115" font-size="14" font-weight="bold" fill="#2f3a2b">Grouse,</text>
<text x="14" y="133" font-size="14" font-weight="bold" fill="#2f3a2b">ptarmigan, hare</text>
<circle cx="280.0" cy="103" r="12" fill="#8a9a6b"/><path d="M274.6 103 l3.5999999999999996 4.199999999999999 l7.199999999999999 -8.399999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="280" y="131" font-size="14" fill="#2f3a2b" text-anchor="middle">No guide. Small game</text>
<text x="280" y="147" font-size="14" fill="#2f3a2b" text-anchor="middle">licence</text>
<text x="14" y="196" font-size="14" font-weight="bold" fill="#2f3a2b">Ducks and geese</text>
<circle cx="280.0" cy="175" r="12" fill="#8a9a6b"/><path d="M274.6 175 l3.5999999999999996 4.199999999999999 l7.199999999999999 -8.399999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="280" y="203" font-size="14" fill="#2f3a2b" text-anchor="middle">No guide. Plus federal</text>
<text x="280" y="219" font-size="14" fill="#2f3a2b" text-anchor="middle">bird permit</text>
<rect x="8" y="227" width="384" height="88" fill="#dfe6d3" rx="4"/>
<text x="14" y="267" font-size="14" font-weight="bold" fill="#2f3a2b">Moose, caribou,</text>
<text x="14" y="285" font-size="14" font-weight="bold" fill="#2f3a2b">wood bison</text>
<circle cx="280.0" cy="247" r="12" fill="#4a7fb0"/><text x="280" y="252.04" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
<text x="280" y="275" font-size="14" fill="#2f3a2b" text-anchor="middle">Outfitter, or Yukon friend</text>
<text x="280" y="291" font-size="14" fill="#2f3a2b" text-anchor="middle">with a special guide</text>
<text x="280" y="307" font-size="14" fill="#2f3a2b" text-anchor="middle">licence</text>
<text x="14" y="347" font-size="14" font-weight="bold" fill="#2f3a2b">Black bear,</text>
<text x="14" y="365" font-size="14" font-weight="bold" fill="#2f3a2b">wolf</text>
<circle cx="280.0" cy="335" r="12" fill="#4a7fb0"/><text x="280" y="340.04" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
<text x="280" y="363" font-size="14" fill="#2f3a2b" text-anchor="middle">Outfitter. Special guide:</text>
<text x="280" y="379" font-size="14" fill="#2f3a2b" text-anchor="middle">VERIFY</text>
<rect x="8" y="387" width="384" height="66" fill="#dfe6d3" rx="4"/>
<text x="14" y="407" font-size="14" font-weight="bold" fill="#2f3a2b">Sheep, goat,</text>
<text x="14" y="425" font-size="14" font-weight="bold" fill="#2f3a2b">grizzly,</text>
<text x="14" y="443" font-size="14" font-weight="bold" fill="#2f3a2b">wolverine</text>
<circle cx="280.0" cy="407" r="12" fill="#4a7fb0"/><text x="280" y="412.04" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
<text x="280" y="435" font-size="14" fill="#2f3a2b" text-anchor="middle">Registered outfitter only</text>
<text x="14" y="486" font-size="14" font-weight="bold" fill="#2f3a2b">Deer and elk</text>
<circle cx="280.0" cy="473" r="12" fill="#e8590c"/><path d="M275.2 468.2 L284.8 477.8 M284.8 468.2 L275.2 477.8" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
<text x="280" y="501" font-size="14" fill="#2f3a2b" text-anchor="middle">Yukon residents only</text>
</svg>
