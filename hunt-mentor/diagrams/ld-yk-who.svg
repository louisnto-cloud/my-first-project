<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 509" font-family="sans-serif" role="img" aria-label="Grid for Yukon, you are a non resident Canadian. Grouse, ptarmigan and hare: no guide, small game licence. Ducks and geese: no guide, plus the federal Migratory Game Bird Hunting Permit. Moose, caribou and wood bison: a registered outfitter, or a Yukon resident friend with a special guide licence. Black bear and wolf: outfitter, special guide VERIFY. Sheep, goat, grizzly and wolverine: registered outfitter only. Deer and elk: Yukon residents only.">
<rect x="0" y="0" width="400" height="509" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Yukon: who may hunt what</text>
<text x="200" y="46" font-size="14" fill="#6b4f35" text-anchor="middle">You are a non resident Canadian (85%)</text>
<text x="280" y="74" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">BC resident</text>
<rect x="8" y="83" width="384" height="68" fill="#dfe6d3" rx="4"/>
<text x="14" y="113" font-size="14" font-weight="bold" fill="#2f3a2b">Grouse,</text>
<text x="14" y="131" font-size="14" font-weight="bold" fill="#2f3a2b">ptarmigan, hare</text>
<circle cx="280.0" cy="103" r="12" fill="#8a9a6b"/><path d="M274.6 103 l3.5999999999999996 4.199999999999999 l7.199999999999999 -8.399999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="280" y="131" font-size="14" fill="#2f3a2b" text-anchor="middle">No guide. Small game</text>
<text x="280" y="147" font-size="14" fill="#2f3a2b" text-anchor="middle">licence</text>
<text x="14" y="190" font-size="14" font-weight="bold" fill="#2f3a2b">Ducks and geese</text>
<circle cx="280.0" cy="171" r="12" fill="#8a9a6b"/><path d="M274.6 171 l3.5999999999999996 4.199999999999999 l7.199999999999999 -8.399999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="280" y="199" font-size="14" fill="#2f3a2b" text-anchor="middle">No guide. Plus federal</text>
<text x="280" y="215" font-size="14" fill="#2f3a2b" text-anchor="middle">bird permit</text>
<rect x="8" y="219" width="384" height="84" fill="#dfe6d3" rx="4"/>
<text x="14" y="257" font-size="14" font-weight="bold" fill="#2f3a2b">Moose, caribou,</text>
<text x="14" y="275" font-size="14" font-weight="bold" fill="#2f3a2b">wood bison</text>
<circle cx="280.0" cy="239" r="12" fill="#4a7fb0"/><text x="280" y="244.04" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
<text x="280" y="267" font-size="14" fill="#2f3a2b" text-anchor="middle">Outfitter, or Yukon friend</text>
<text x="280" y="283" font-size="14" fill="#2f3a2b" text-anchor="middle">with a special guide</text>
<text x="280" y="299" font-size="14" fill="#2f3a2b" text-anchor="middle">licence</text>
<text x="14" y="333" font-size="14" font-weight="bold" fill="#2f3a2b">Black bear,</text>
<text x="14" y="351" font-size="14" font-weight="bold" fill="#2f3a2b">wolf</text>
<circle cx="280.0" cy="323" r="12" fill="#4a7fb0"/><text x="280" y="328.04" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
<text x="280" y="351" font-size="14" fill="#2f3a2b" text-anchor="middle">Outfitter. Special guide:</text>
<text x="280" y="367" font-size="14" fill="#2f3a2b" text-anchor="middle">VERIFY</text>
<rect x="8" y="371" width="384" height="66" fill="#dfe6d3" rx="4"/>
<text x="14" y="391" font-size="14" font-weight="bold" fill="#2f3a2b">Sheep, goat,</text>
<text x="14" y="409" font-size="14" font-weight="bold" fill="#2f3a2b">grizzly,</text>
<text x="14" y="427" font-size="14" font-weight="bold" fill="#2f3a2b">wolverine</text>
<circle cx="280.0" cy="391" r="12" fill="#4a7fb0"/><text x="280" y="396.04" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
<text x="280" y="419" font-size="14" fill="#2f3a2b" text-anchor="middle">Registered outfitter only</text>
<text x="14" y="468" font-size="14" font-weight="bold" fill="#2f3a2b">Deer and elk</text>
<circle cx="280.0" cy="457" r="12" fill="#e8590c"/><path d="M275.2 452.2 L284.8 461.8 M284.8 452.2 L275.2 461.8" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
<text x="280" y="485" font-size="14" fill="#2f3a2b" text-anchor="middle">Yukon residents only</text>
</svg>
