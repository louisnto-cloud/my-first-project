<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-label="Technology lines in BC: no drones on a hunt, no hunting within 6 hours of flying, no lights or infrared optics, no recorded calls except for some predators, no wireless cameras from 1 August to 10 December except Region 1.">
  <rect x="0" y="0" width="400" height="420" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Technology: where BC draws the line</text>
<rect x="10.0" y="50" width="185.0" height="110" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="82.5" y="80.30000000000001" width="40" height="10" rx="3" fill="#23261f"/><circle cx="80.5" cy="76.30000000000001" r="7" fill="#888888"/><circle cx="124.5" cy="76.30000000000001" r="7" fill="#888888"/><path d="M90.8 74.60000000000001 l23.400000000000002 23.400000000000002 M114.2 74.60000000000001 l-23.400000000000002 23.400000000000002" fill="none" stroke="#b3261e" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="102.5" y="130" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">No drones</text>
<text x="102.5" y="149" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">on a hunt (99%)</text>
<rect x="205.0" y="50" width="185.0" height="110" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<path d="M271.5 86.30000000000001 l52 -8 l-20 10 l-6 14 z" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="297.5" y="130" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">6 h after flying</text>
<text x="297.5" y="149" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">no hunting (99%)</text>
<rect x="10.0" y="170" width="185.0" height="110" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<circle cx="102.5" cy="206.3" r="14" fill="#f6c343"/><path d="M90.8 194.60000000000002 l23.400000000000002 23.400000000000002 M114.2 194.60000000000002 l-23.400000000000002 23.400000000000002" fill="none" stroke="#b3261e" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="102.5" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">No lights</text>
<text x="102.5" y="269" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">or infrared (99%)</text>
<rect x="205.0" y="170" width="185.0" height="110" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="283.5" y="190.3" width="28" height="32" rx="4" fill="#23261f"/><circle cx="297.5" cy="206.3" r="7" fill="#888888"/>
<text x="297.5" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">No recorded calls</text>
<text x="297.5" y="269" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">predators aside (99%)</text>
<rect x="10.0" y="290" width="185.0" height="110" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="86.5" y="312.3" width="32" height="26" rx="4" fill="#2f3a2b"/><circle cx="102.5" cy="325.3" r="7" fill="#cfe0ef"/>
<text x="102.5" y="370" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">No wireless cams</text>
<text x="102.5" y="389" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Aug 1 to Dec 10 (99%)</text>
<rect x="205.0" y="290" width="185.0" height="110" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<text x="297.5" y="334.3" font-family="sans-serif" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="middle">Skill</text>
<text x="297.5" y="370" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fair chase</text>
<text x="297.5" y="389" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">tech must not replace skill</text>
</svg>
