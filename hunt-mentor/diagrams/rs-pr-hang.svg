<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 304" font-family="sans-serif" role="img" aria-label="Hanging meat in bear country: hang it at least 3.5 metres up and 1.5 metres from tree trunks, in plain view, at least 200 metres from the gut pile and 100 metres from camp.">
<rect x="0" y="0" width="400" height="304" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hang meat in bear country</text>
<rect x="0" y="250" width="400" height="50" rx="0" fill="#cfdcb5"/><rect x="40" y="70" width="10" height="180" rx="2" fill="#6b4f35"/><rect x="350" y="70" width="10" height="180" rx="2" fill="#6b4f35"/><line x1="45" y1="80" x2="355" y2="80" stroke="#23261f" stroke-width="3"/><line x1="200" y1="80" x2="200" y2="110" stroke="#23261f" stroke-width="2"/><rect x="185" y="110" width="30" height="50" rx="6" fill="#f4ecdc" stroke="#6b4f35" stroke-width="1.5"/><text x="200" y="140" font-size="13" fill="#23261f" text-anchor="middle">meat</text><line x1="240" y1="160" x2="240" y2="250" stroke="#e8590c" stroke-width="3"/><text x="250" y="210" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">3.5 m up</text><line x1="50" y1="140" x2="185" y2="140" stroke="#4a7fb0" stroke-width="2"/><text x="118" y="132" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">1.5 m from trees</text><text x="200" y="276" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">200 m from the gut pile, 100 m from camp</text><text x="200" y="294" font-size="13" fill="#6b4f35" text-anchor="middle">Alberta guidance (85%)</text>
</svg>
