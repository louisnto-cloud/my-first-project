<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 531" font-family="sans-serif" role="img" aria-label="The 8 notes under the table. 1: Shotgun: 20 gauge or larger, No. 1 Buck or larger. 2: Rimfire: grouse, ptarmigan, turkey only. 3: Centrefire: grouse, ptarmigan only. 4: Non toxic shot only, except pigeons, doves. 5: Ducks: no slugs, 10 gauge max, 1 shotgun unless others cased. 6: Bears: no bait. 7: Bison: 175 grain or more, 2,712 joules or more at 100 m. 8: Air rifle: .35 calibre or larger.">
<rect width="400" height="531" rx="12" fill="#EEF1EA"/>
<text x="16" y="30" font-size="18" font-weight="bold" fill="#1F3D2B">The 8 notes under the table</text>
