<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 528" font-family="sans-serif" role="img" aria-label="Bull moose, broadside, drawn with the lungs and heart shown through the body: lungs in the lower chest behind the front leg, the heart low between the front legs. Aim behind the front leg, one third up the chest, the bar measured from the bottom of the chest to the spine, not to the top of the hump. The vital zone is about basketball size. The hump is not the top of the chest: aim low. Below, three top views: broadside is best; quartering away is good, aim back through the ribs to the far shoulder; quartering to is for experienced hunters only, the front of the near shoulder is heavy bone, beginners wait, and a whistle often turns a moose. Look behind it: water means a brutal recovery.">
<rect width="400" height="528" fill="#fffaf0"/>
<defs>
    <g id="vitals-moose-top">
      <ellipse cx="0" cy="0" rx="30" ry="11" fill="#a87b52" stroke="#5a3e26" stroke-width="1.4"/>
      <path d="M-26 -4 L-38 -3 L-38 3 L-26 4z" fill="#a87b52" stroke="#5a3e26" stroke-width="1.2"/>
      <ellipse cx="-44" cy="0" rx="7" ry="5" fill="#8f6744" stroke="#5a3e26" stroke-width="1.2"/>
      <ellipse cx="-41" cy="-6" rx="3" ry="2" fill="#8f6744"/><ellipse cx="-41" cy="6" rx="3" ry="2" fill="#8f6744"/>
      <ellipse cx="29" cy="0" rx="4" ry="3" fill="#f3ead8"/>
      <ellipse cx="-12" cy="0" rx="11" ry="8" fill="#e9a3a0" fill-opacity=".85"/>
    </g>
  </defs>
<ellipse cx="236" cy="318" rx="130" ry="7" fill="#d8ccb2"/>
<path d="M214 214 L226 216 L228 262 L230 316 L220 318 L216 264 L210 232z" fill="#6f6252"/>
<path d="M300 208 L318 210 L322 252 L326 316 L316 318 L310 256 L300 228z" fill="#6f6252"/>
<path d="M120 132 C150 100 180 92 206 96 C240 102 300 110 330 118 C346 122 352 140 350 160 C348 180 342 196 336 206 L334 238 L338 316 L326 318 L320 242 C316 228 310 216 300 212 C270 216 232 218 208 216 L204 242 L208 316 L196 318 L190 244 C186 230 182 222 172 218 C156 216 146 208 140 198 C132 184 124 172 114 162 C102 164 90 172 78 180 L56 190 C42 194 30 186 32 174 C34 162 48 152 62 146 C80 138 96 130 110 126 C114 126 118 128 120 132z" fill="#4e3626" stroke="#2c1d12" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M196 318 L204 244 L208 316z M326 318 L334 240 L338 316z" fill="#9a8c78"/>
<path d="M190 250 L196 318 L208 316 L204 244z M320 246 L326 318 L338 316 L334 240z" fill="#9a8c78"/>
<path d="M98 166 C102 176 102 190 96 198 C92 190 92 176 98 166z" fill="#3a271b" stroke="#2c1d12" stroke-width="1"/>
<path d="M108 126 C112 112 120 104 128 100 C128 112 122 122 114 128z" fill="#4e3626" stroke="#2c1d12" stroke-width="1.4"/>
<circle cx="76" cy="150" r="2.6" fill="#120b06"/><ellipse cx="38" cy="176" rx="3.2" ry="2.4" fill="#120b06"/>
<path d="M104 124 C100 108 102 94 110 84 M104 104 C96 98 92 90 92 82" fill="none" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/>
<path d="M104 124 C100 108 102 94 110 84 M104 104 C96 98 92 90 92 82" fill="none" stroke="#ecdfc3" stroke-width="2.6" stroke-linecap="round"/>
<g data-tip="Lungs|The lungs fill only the lower part of the chest, behind the front leg. Both lungs is the goal." data-tip-dot="262,160">
<path d="M190 150 C214 140 252 140 270 152 C280 172 266 200 240 208 C220 212 198 210 188 196 C180 182 182 160 190 150z" fill="#e9a3a0" fill-opacity=".9" stroke="#b55b57" stroke-width="1.4"/>
<line x1="250" y1="198" x2="268" y2="236" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="250" cy="198" r="2.6" fill="#2f3a2b"/><text x="268" y="254" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">lungs</text>
</g>
<g data-tip="Heart|Low in the chest, just below the lungs. A shot one third up takes both lungs, maybe the heart." data-tip-dot="300,282">
<path d="M190 196 C190 188 198 186 202 192 C206 186 214 188 212 198 C210 206 202 212 200 214 C196 210 190 204 190 196z" fill="#8e2a2a" stroke="#5e1717" stroke-width="1"/>
<line x1="200" y1="206" x2="252" y2="278" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="200" cy="206" r="2.6" fill="#2f3a2b"/><text x="256" y="292" font-size="16" font-weight="bold" fill="#2f3a2b">heart</text>
</g>
<!-- step 1: follow the back of the front leg up -->
<path d="M207 304 L205 228" fill="none" stroke="#e8590c" stroke-width="2.6" stroke-dasharray="6 4"/>
<path d="M199 232 L205 219 L211 232z" fill="#e8590c"/>
<circle cx="178" cy="296" r="11" fill="#e8590c" stroke="#fffaf0" stroke-width="2"/><text x="178" y="301" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">1</text>
<!-- step 2: one third up the chest, bar from chest bottom to spine -->
<g stroke="#fffaf0" stroke-width="1.8"><line x1="153" y1="120" x2="167" y2="120"/><line x1="153" y1="214" x2="167" y2="214"/><line x1="160" y1="120" x2="160" y2="214"/><line x1="153" y1="182.7" x2="167" y2="182.7"/></g>
<line x1="153" y1="183" x2="134" y2="230" stroke="#2f3a2b" stroke-width="1.2"/>
<circle cx="104" cy="245" r="11" fill="#e8590c" stroke="#fffaf0" stroke-width="2"/><text x="104" y="250" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text>
<text x="120" y="251" font-size="16" font-weight="bold" fill="#2f3a2b">1/3 up</text>
<g data-tip="Aim spot|Up the back of the front leg, one third up the chest. The heart and lung zone is about the size of a basketball." data-tip-dot="216,170">
<circle cx="200" cy="182" r="9" fill="#e8590c" stroke="#fffaf0" stroke-width="2"/><path d="M200 170 v24 M188 182 h24" stroke="#fffaf0" stroke-width="1.8"/>
<line x1="196" y1="174" x2="125" y2="75" stroke="#e8590c" stroke-width="1.6"/>
<rect x="8" y="8" width="222" height="67" rx="6" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#e8590c">AIM: one third up</text>
<text x="20" y="50" font-size="14" fill="#2f3a2b"><tspan font-weight="bold" fill="#e8590c">1</tspan> Up the back of the front leg</text>
<text x="20" y="68" font-size="14" fill="#2f3a2b"><tspan font-weight="bold" fill="#e8590c">2</tspan> Stop one third up the chest</text>
</g>
<g data-tip="The hump|The hump sits above the spine, not over the lungs. It fools your eye: aim lower than instinct says." data-tip-dot="384,14">
<rect x="239" y="8" width="153" height="45" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="316" y="27" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hump is not the</text>
<text x="316" y="45" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">chest top: aim low</text><line x1="200" y1="98" x2="245" y2="53" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="200" cy="98" r="2.6" fill="#2f3a2b"/>
</g>
<g transform="translate(0 -12)"><!-- angle cards, top view -->
  <g font-size="14" text-anchor="middle" fill="#2f3a2b">
   <g data-tip="Broadside|Best shot. Follow the back edge of the front leg up, one third of the way up the chest." data-tip-dot="122,368">
    <rect x="12" y="358" width="120" height="122" rx="8" fill="#f2ecdd" stroke="#c9bb9c"/>
    <text x="72" y="377" font-weight="bold">Broadside</text><text x="72" y="394" fill="#2f6e3b" font-weight="bold">best</text>
    <use href="#vitals-moose-top" transform="translate(80 422)"/>
    <line x1="68" y1="472" x2="68" y2="433" stroke="#2f3a2b" stroke-width="1.8"/><line x1="68" y1="433" x2="68" y2="411" stroke="#2f3a2b" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle cx="68" cy="433" r="4" fill="#e8590c"/>
   </g>
   <g data-tip="Quartering away|Good shot. Aim back through the ribs toward the far shoulder." data-tip-dot="250,368">
    <rect x="140" y="358" width="120" height="122" rx="8" fill="#f2ecdd" stroke="#c9bb9c"/>
    <text x="200" y="377" font-weight="bold">Quartering away</text><text x="200" y="394" fill="#2f6e3b" font-weight="bold">good</text>
    <use href="#vitals-moose-top" transform="translate(212 428) rotate(35)"/>
    <line x1="201" y1="472" x2="201" y2="433" stroke="#2f3a2b" stroke-width="1.8"/><line x1="201" y1="433" x2="201" y2="409" stroke="#2f3a2b" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle cx="201" cy="433" r="4" fill="#e8590c"/><circle cx="201" cy="409" r="3" fill="#2f3a2b"/>
   </g>
   <g data-tip="Quartering to|Heavy shoulder bone and big muscle in front. It needs a tough bullet and experience. Beginner: wait for broadside." data-tip-dot="378,368">
    <rect x="268" y="358" width="120" height="122" rx="8" fill="#f2ecdd" stroke="#c9bb9c"/>
    <text x="328" y="377" font-weight="bold">Quartering to</text><text x="328" y="394" fill="#c0392b" font-weight="bold">beginners wait</text>
    <use href="#vitals-moose-top" transform="translate(344 418) rotate(-35)"/>
    <line x1="333" y1="472" x2="333" y2="437" stroke="#2f3a2b" stroke-width="1.8"/>
    <circle cx="333" cy="437" r="4" fill="#e8590c"/>
    <path d="M354 448 l20 18 M374 448 l-20 18" stroke="#c0392b" stroke-width="3.4" stroke-linecap="round"/>
   </g>
  </g>
</g>
<text x="200" y="488" font-size="15" fill="#2f3a2b" text-anchor="middle">Away: through the ribs to the far shoulder</text>
<g data-tip="Look behind it|A moose that runs 30 m into a beaver pond is a brutal recovery. Tip." data-tip-dot="388,506">
<rect x="20" y="496" width="360" height="26" rx="6" fill="#fbe9e4"/>
<text x="200" y="514" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Water behind it: brutal recovery (Tip)</text>
</g>
</svg>
