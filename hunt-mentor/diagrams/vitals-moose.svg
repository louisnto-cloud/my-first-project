<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" font-family="sans-serif">
<rect x="0" y="0" width="400" height="640" fill="#fffaf0"/>
<text x="200" y="24" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Moose: where to aim</text>
<g transform="translate(0,34)"><rect x="6" y="2" width="388" height="186" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">1  Broadside: best</text><rect x="207" y="116" width="11" height="34" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="303" y="116" width="11" height="34" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><path d="M206 62 L168 60 L172 76 L198 98 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="162" cy="66" rx="23" ry="11" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M171 59 L178 46 L180 61 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><circle cx="144" cy="66" r="2.2" fill="#23261f"/><path d="M167 55 L173 43 L194 30 L202 41 L189 48 Z" fill="#6b4f35" stroke="#23261f" stroke-width="2"/><path d="M164 75 L166 89 L171 77" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="262" cy="92" rx="78" ry="34" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M204 64 Q227 44 258 60" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><rect x="215" y="116" width="11" height="34" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="312" y="116" width="11" height="34" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="231" cy="95" rx="20" ry="20" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><circle cx="223" cy="108" r="7" fill="#6b4f35" stroke="#23261f" stroke-width="1.5"/><circle cx="228" cy="103" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="223" y1="103" x2="233" y2="103" stroke="#fffaf0" stroke-width="2"/><line x1="228" y1="98" x2="228" y2="108" stroke="#fffaf0" stroke-width="2"/><text x="244" y="108" font-size="14" font-weight="bold" fill="#e8590c">aim</text><text x="16" y="166" font-size="14" fill="#23261f">Behind the front leg, one third up. Basketball size.</text><text x="16" y="183" font-size="14" fill="#23261f">The hump is not the top of the chest. Aim low.</text></g>
<g transform="translate(0,228)"><rect x="6" y="2" width="388" height="186" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">2  Quartering away: good</text><rect x="230" y="110" width="10" height="31" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="241" y="112" width="10" height="31" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="188" cy="68" rx="21" ry="10" fill="#2f3a2b" stroke="#23261f" stroke-width="2.5"/><path d="M196 62 L202 50 L204 63 Z" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><circle cx="172" cy="68" r="2.0" fill="#23261f"/><path d="M193 58 L197 47 L217 36 L223 46 L212 52 Z" fill="#6b4f35" stroke="#23261f" stroke-width="2"/><path d="M189 76 L191 89 L196 78" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><path d="M232 64 L196 64 L198 76 L226 96 Z" fill="#2f3a2b" stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="272" cy="92" rx="56" ry="34" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M230 64 Q247 44 269 60" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="303" cy="98" rx="24" ry="32" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><rect x="289" y="118" width="12" height="34" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="307" y="120" width="12" height="34" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="254" cy="94" rx="16" ry="20" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><line x1="271" y1="102" x2="228" y2="87" stroke="#23261f" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="228" cy="87" r="5" fill="#23261f"/><text x="224" y="109" font-size="13" fill="#23261f" text-anchor="end">far shoulder</text><circle cx="271" cy="102" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="266" y1="102" x2="276" y2="102" stroke="#fffaf0" stroke-width="2"/><line x1="271" y1="97" x2="271" y2="107" stroke="#fffaf0" stroke-width="2"/><text x="287" y="107" font-size="14" font-weight="bold" fill="#e8590c">aim</text><text x="388" y="48" font-size="13" fill="#23261f" text-anchor="end">rump toward you</text><text x="16" y="166" font-size="14" fill="#23261f">Aim back, through the ribs to the far shoulder.</text><text x="16" y="183" font-size="14" fill="#23261f">Look behind it: water means a brutal recovery.</text></g>
<g transform="translate(0,422)"><rect x="6" y="2" width="388" height="186" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">3  Quartering to: experienced only</text><rect x="227" y="112" width="10" height="31" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="297" y="110" width="10" height="31" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="272" cy="92" rx="56" ry="34" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M230 64 Q247 44 269 60" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="237" cy="96" rx="20" ry="32" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M241 60 L202 56 L206 74 L238 102 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="192" cy="62" rx="27" ry="13" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M202 54 L211 39 L213 56 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><circle cx="171" cy="62" r="2.6" fill="#23261f"/><path d="M198 49 L204 35 L230 20 L238 33 L223 41 Z" fill="#6b4f35" stroke="#23261f" stroke-width="2"/><path d="M194 72 L196 89 L202 75" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="237" y="118" width="12" height="34" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="307" y="116" width="11" height="34" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="255" cy="94" rx="16" ry="20" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><line x1="239" y1="97" x2="286" y2="97" stroke="#23261f" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="239" cy="97" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="234" y1="97" x2="244" y2="97" stroke="#fffaf0" stroke-width="2"/><line x1="239" y1="92" x2="239" y2="102" stroke="#fffaf0" stroke-width="2"/><text x="253" y="87" font-size="14" font-weight="bold" fill="#e8590c">aim</text><rect x="306" y="30" width="78" height="24" rx="5" fill="#e8590c"/><text x="345" y="47" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">WAIT</text><text x="16" y="166" font-size="14" fill="#23261f">Front of the near shoulder. Heavy bone.</text><text x="16" y="183" font-size="14" fill="#23261f">Beginner: wait. A whistle often turns a moose.</text></g>
<text x="200" y="634" font-size="13" fill="#6b4f35" text-anchor="middle">Shaded: lungs. Dark: heart. Orange: aim point. Not to scale.</text>
</svg>
