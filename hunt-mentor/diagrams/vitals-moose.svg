<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 551" font-family="sans-serif" role="img" aria-label="Bull moose, broadside, drawn with the lungs and heart shown through the body: lungs in the lower chest behind the front leg, the heart low between the front legs. Aim behind the front leg, one third up the chest, the bar measured from the bottom of the chest to the spine, not to the top of the hump. The vital zone is about basketball size. The hump is not the top of the chest: aim low. Below, three top views: broadside is best; quartering away is good, aim back through the ribs to the far shoulder; quartering to is for experienced hunters only, the front of the near shoulder is heavy bone, beginners wait, and a whistle often turns a moose. Look behind it: water means a brutal recovery.">
