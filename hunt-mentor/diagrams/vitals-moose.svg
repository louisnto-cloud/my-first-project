<text x="200" y="486" font-size="15" fill="#2f3a2b" text-anchor="middle">Away: through the ribs to the far shoulder</text>
<text x="200" y="507" font-size="15" fill="#2f3a2b" text-anchor="middle">To: heavy bone. A whistle often turns a moose.</text>
<text x="200" y="528" font-size="15" fill="#c0392b" text-anchor="middle">Water behind it: brutal recovery (Tip)</text>
