<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" font-family="sans-serif">
<rect x="0" y="0" width="400" height="620" fill="#fffaf0"/>
<text x="200" y="24" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Moose: where to aim</text>
<g transform="translate(0,34)"><rect x="6" y="2" width="388" height="182" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">1  Broadside: best</text><rect x="161" y="108" width="13" height="58" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="273" y="108" width="13" height="58" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><path d="M155 42 L115 38 L119 54 L147 84 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="109" cy="44" rx="30" ry="14" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M119 36 L127 22 L129 38 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><circle cx="85" cy="44" r="2.5" fill="#23261f"/><path d="M115 32 L121 18 L145 4 L153 16 L139 24 Z" fill="#6b4f35" stroke="#23261f" stroke-width="2"/><path d="M111 56 L113 72 L119 58" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="225" cy="78" rx="92" ry="40" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M156 44 Q184 22 220 40" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><rect x="170" y="108" width="13" height="58" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="284" y="108" width="13" height="58" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="188" cy="81" rx="23" ry="24" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><circle cx="179" cy="97" r="9" fill="#6b4f35" stroke="#23261f" stroke-width="1.5"/><circle cx="185" cy="91" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="180" y1="91" x2="190" y2="91" stroke="#fffaf0" stroke-width="2"/><line x1="185" y1="86" x2="185" y2="96" stroke="#fffaf0" stroke-width="2"/><text x="201" y="96" font-size="14" font-weight="bold" fill="#e8590c">aim</text><text x="16" y="160" font-size="14" fill="#23261f">Behind the front leg, one third up. Basketball size.</text><text x="16" y="177" font-size="14" fill="#23261f">The hump is not the top of the chest. Aim low.</text></g>
<g transform="translate(0,222)"><rect x="6" y="2" width="388" height="182" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">2  Quartering away: good</text><rect x="185" y="102" width="12" height="52" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="199" y="104" width="12" height="52" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="135" cy="46" rx="26" ry="12" fill="#2f3a2b" stroke="#23261f" stroke-width="2.5"/><path d="M143 39 L150 27 L152 41 Z" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><circle cx="114" cy="46" r="2.1" fill="#23261f"/><path d="M140 36 L145 24 L165 12 L172 22 L160 29 Z" fill="#6b4f35" stroke="#23261f" stroke-width="2"/><path d="M136 56 L138 70 L143 58" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><path d="M185 44 L143 42 L145 54 L179 82 Z" fill="#2f3a2b" stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="235" cy="78" rx="66" ry="40" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M185 44 Q205 22 232 40" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="271" cy="84" rx="28" ry="38" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><rect x="255" y="110" width="14" height="58" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="276" y="112" width="14" height="58" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="214" cy="80" rx="19" ry="24" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><line x1="234" y1="89" x2="183" y2="72" stroke="#23261f" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="183" cy="72" r="5" fill="#23261f"/><text x="177" y="62" font-size="13" fill="#23261f" text-anchor="end">far shoulder</text><circle cx="234" cy="89" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="229" y1="89" x2="239" y2="89" stroke="#fffaf0" stroke-width="2"/><line x1="234" y1="84" x2="234" y2="94" stroke="#fffaf0" stroke-width="2"/><text x="250" y="94" font-size="14" font-weight="bold" fill="#e8590c">aim</text><text x="305" y="126" font-size="13" fill="#23261f">rump near you</text><text x="16" y="160" font-size="14" fill="#23261f">Aim back, through the ribs to the far shoulder.</text><text x="16" y="177" font-size="14" fill="#23261f">Look behind it: water means a brutal recovery.</text></g>
<g transform="translate(0,410)"><rect x="6" y="2" width="388" height="182" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">3  Quartering to: experienced only</text><rect x="182" y="104" width="12" height="52" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="265" y="102" width="12" height="52" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="235" cy="78" rx="66" ry="40" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M185 44 Q205 22 232 40" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="194" cy="82" rx="24" ry="38" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M199 40 L153 32 L157 50 L195 88 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="143" cy="38" rx="34" ry="16" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M154 29 L163 13 L166 31 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><circle cx="115" cy="38" r="2.9" fill="#23261f"/><path d="M150 24 L157 8 L184 -8 L193 6 L177 15 Z" fill="#6b4f35" stroke="#23261f" stroke-width="2"/><path d="M145 52 L147 70 L154 54" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="194" y="110" width="14" height="58" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="276" y="108" width="13" height="58" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="215" cy="80" rx="19" ry="24" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><line x1="197" y1="84" x2="252" y2="84" stroke="#23261f" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="197" cy="84" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="192" y1="84" x2="202" y2="84" stroke="#fffaf0" stroke-width="2"/><line x1="197" y1="79" x2="197" y2="89" stroke="#fffaf0" stroke-width="2"/><text x="211" y="74" font-size="14" font-weight="bold" fill="#e8590c">aim</text><text x="305" y="126" font-size="13" fill="#23261f">chest near you</text><rect x="300" y="30" width="84" height="24" rx="5" fill="#e8590c"/><text x="342" y="47" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">WAIT</text><text x="16" y="160" font-size="14" fill="#23261f">Front of the near shoulder. Heavy bone.</text><text x="16" y="177" font-size="14" fill="#23261f">Beginner: wait. A whistle often turns a moose.</text></g>
<text x="200" y="612" font-size="13" fill="#6b4f35" text-anchor="middle">Shaded: lungs. Dark circle: heart. Orange dot: aim point. Not to scale.</text>
</svg>
