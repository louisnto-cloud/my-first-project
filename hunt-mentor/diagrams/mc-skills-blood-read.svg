<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Blood colour guide: pink and frothy with bubbles, lungs; bright red and lots, heart or a big artery; dark red with no bubbles, liver; thin with green bits and a smell, gut, back out. Drop tails point the way the animal went. Hydrogen peroxide fizzes on blood you cannot see.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Read the blood (65 to 80%)</text><circle cx="40" cy="64" r="13" fill="#ff6f7a"/><text x="64" y="62" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Pink, frothy, bubbles</text><text x="64" y="80" font-size="14" fill="#6b4f35" text-anchor="start">lungs</text><circle cx="40" cy="108" r="13" fill="#b3261e"/><text x="64" y="106" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Bright red, lots</text><text x="64" y="124" font-size="14" fill="#6b4f35" text-anchor="start">heart or artery</text><circle cx="40" cy="152" r="13" fill="#5a1410"/><text x="64" y="150" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Dark red, no bubbles</text><text x="64" y="168" font-size="14" fill="#6b4f35" text-anchor="start">liver</text><circle cx="40" cy="196" r="13" fill="#7a6a3a"/><text x="64" y="194" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Thin, green bits, smell</text><text x="64" y="212" font-size="14" fill="#6b4f35" text-anchor="start">gut: back out</text><rect x="250" y="50" width="136" height="170" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="318" y="72" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">drop tails</text><circle cx="290" cy="100" r="8" fill="#b3261e"/><path d="M296 96 L326 100 L296 104 Z" fill="#b3261e"/><circle cx="290" cy="140" r="8" fill="#b3261e"/><path d="M296 136 L326 140 L296 144 Z" fill="#b3261e"/><circle cx="290" cy="180" r="8" fill="#b3261e"/><path d="M296 176 L326 180 L296 184 Z" fill="#b3261e"/><line x1="280" y1="214" x2="350" y2="214" stroke="#e8590c" stroke-width="3"/><polygon points="350.0,214.0 341.0,218.3 341.0,209.7" fill="#e8590c"/><text x="318" y="206" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">it went</text><text x="200" y="286" font-size="14" fill="#6b4f35" text-anchor="middle">Peroxide fizzes on hidden blood (70%)</text>
</svg>
