<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 454" font-family="sans-serif" role="img" aria-label="Sketch map, not to scale, not a legal map, of no shooting places near Heffley Creek, your base. The North Thompson River runs south from the base to Kamloops. The City of Kamloops is shaded red: no firing at all. The Map C7 band runs east along the South Thompson to the Pritchard Bridge. Sun Peaks, to the northeast, has a 400 metre ring. McQueen Lake, on the west side, has a 1 kilometre ring. Tranquille marsh at the head of Kamloops Lake is closed. Paul Lake Park is treated as closed. Wells Gray Park, MU 3-45, to the north is closed to hunting. Orange means no shooting, and often no hunting. Plus everywhere: 100 metres from any house or barn and 15 metres from the centre of a public road (99%).">
