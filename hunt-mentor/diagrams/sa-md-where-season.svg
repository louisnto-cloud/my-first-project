<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 344" font-family="sans-serif" role="img" aria-label="Side view of the hills near Heffley Creek, rough elevations to check on a map. Valley bottom about 370 to 450 metres. Heffley Lake about 950 metres. Sun Peaks village about 1,250 metres. Summer and early fall: mule deer use the high benches and openings. Snow and cold push them down. Winter range is on sunny south and west slopes with old Douglas fir, below about 760 metres in one study north of Kamloops.">
<rect x="0" y="0" width="400" height="344" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Where mule deer are, by season</text><path d="M0 340 L0 318 L70 316 Q130 300 180 260 Q240 200 300 160 Q350 128 400 120 L400 340 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><path d="M0 318 L70 316" stroke="#4a7fb0" stroke-width="6"/><text x="6" y="336" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="start">Valley 370 to 450 m</text><line x1="0" y1="282" x2="400" y2="282" stroke="#e8590c" stroke-width="2" stroke-dasharray="6 5"/><text x="394" y="276" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">about 760 m</text><polygon points="102.0,306 110,282.0 118.0,306" fill="#2f3a2b"/><rect x="108.4" y="306" width="3.2" height="4.800000000000001" fill="#2f3a2b"/><polygon points="120.0,300 128,276.0 136.0,300" fill="#2f3a2b"/><rect x="126.4" y="300" width="3.2" height="4.800000000000001" fill="#2f3a2b"/><polygon points="138.0,292 146,268.0 154.0,292" fill="#2f3a2b"/><rect x="144.4" y="292" width="3.2" height="4.800000000000001" fill="#2f3a2b"/><circle cx="270" cy="182" r="5" fill="#2f3a2b"/><text x="262" y="186" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">Heffley Lake about 950 m</text><circle cx="360" cy="126" r="5" fill="#2f3a2b"/><text x="352" y="148" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">Sun Peaks about 1,250 m</text><rect x="8" y="44" width="184" height="78" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="1.5"/><text x="16" y="66" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="start">Winter: below</text><text x="16" y="86" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="start">about 760 m, sunny</text><text x="16" y="106" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="start">slopes, old fir</text><path d="M80 124 L120 286" stroke="#e8590c" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M114.3 279.1 L120.0 286.0 L121.9 277.2" stroke="#e8590c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="232" y="44" width="160" height="56" rx="8" fill="#fffaf0" stroke="#8b5a2b" stroke-width="1.5"/><text x="240" y="66" font-size="14" font-weight="bold" fill="#8b5a2b" text-anchor="start">Summer and early</text><text x="240" y="88" font-size="14" font-weight="bold" fill="#8b5a2b" text-anchor="start">fall: high benches</text><path d="M360 200 L290 256" stroke="#8b5a2b" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M293.9 247.9 L290.0 256.0 L298.8 254.0" stroke="#8b5a2b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="222" font-size="14" font-weight="bold" fill="#8b5a2b" text-anchor="start">Snow and cold</text><text x="150" y="240" font-size="14" font-weight="bold" fill="#8b5a2b" text-anchor="start">push them down</text>
