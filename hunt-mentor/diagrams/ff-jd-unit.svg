<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A field stretching away, split into 100 m blocks that look shorter as they recede. Picture a known 100 m length, like a football field, and count how many fit between you and the deer. The Canadian Army says this method is not accurate past 400 m.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Unit of measure: count 100 m blocks</text><path d="M10 260 L390 260 L300 120 L110 120 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="42.1" y1="215" x2="361.1" y2="215" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><text x="200" y="242.5" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">100 m</text><line x1="65.7" y1="182" x2="339.9" y2="182" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><text x="200" y="203.5" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">200 m</text><line x1="82.9" y1="158" x2="324.4" y2="158" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><text x="200" y="175.0" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">300 m</text><line x1="95.7" y1="140" x2="312.9" y2="140" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><text x="200" y="154.0" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">400 m</text><g transform="translate(185 106) scale(0.22)"><ellipse cx="62" cy="50" rx="44" ry="20" fill="#8b5a2b"/><path d="M28 42 L14 14 L24 10 L40 36 Z" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="12" cy="12" rx="13" ry="7" fill="#8b5a2b" transform="rotate(-20 12 12)"/><path d="M14 4 l6 -12 l4 10 Z" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="40" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="82" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="94" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><ellipse cx="104" cy="44" rx="5" ry="8" fill="#f4efe6"/></g><text x="200" y="60" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Picture a 100 m field. How many fit?</text><text x="200.0" y="288" font-size="13" fill="#2f3a2b" text-anchor="middle">Not accurate past 400 m (Canadian Army fieldcraft)</text>
</svg>
