<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 312" font-family="sans-serif" role="img" aria-label="Berry calendar, July to December. Saskatoon and soopolallie: July and August. Huckleberry: August and September. Himalayan blackberry in the Fraser Valley: August and September. Rose hips and snowberry: mid September into winter. Bears and grouse follow the fruit (70%).">
<rect width="400" height="312" fill="#fffaf0"/>
<text x="200" y="27" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Berry calendar</text>
<rect x="148" y="58" width="40" height="220" fill="#f1ead9"/>
<text x="168" y="52" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Jul</text>
<text x="208" y="52" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Aug</text>
<rect x="228" y="58" width="40" height="220" fill="#f1ead9"/>
<text x="248" y="52" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Sep</text>
<text x="288" y="52" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Oct</text>
<rect x="308" y="58" width="40" height="220" fill="#f1ead9"/>
<text x="328" y="52" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Nov</text>
<text x="368" y="52" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Dec</text>
<circle cx="18" cy="82" r="5" fill="#5b3a6b"/><circle cx="25" cy="78" r="5" fill="#5b3a6b"/><circle cx="25" cy="87" r="5" fill="#5b3a6b"/>
<text x="36" y="92" font-size="16" font-weight="bold" fill="#2f3a2b">Saskatoon</text>
<rect x="150" y="75" width="76" height="22" rx="6" fill="#5b3a6b"/>
<circle cx="18" cy="124" r="5" fill="#c0392b"/><circle cx="25" cy="120" r="5" fill="#c0392b"/><circle cx="25" cy="129" r="5" fill="#c0392b"/>
<text x="36" y="134" font-size="16" font-weight="bold" fill="#2f3a2b">Soopolallie</text>
<rect x="150" y="117" width="76" height="22" rx="6" fill="#c0392b"/>
<circle cx="18" cy="166" r="5" fill="#2c3e6b"/><circle cx="25" cy="162" r="5" fill="#2c3e6b"/><circle cx="25" cy="171" r="5" fill="#2c3e6b"/>
<text x="36" y="176" font-size="16" font-weight="bold" fill="#2f3a2b">Huckleberry</text>
<rect x="190" y="159" width="76" height="22" rx="6" fill="#2c3e6b"/>
<circle cx="18" cy="208" r="5" fill="#3d2a4a"/><circle cx="25" cy="204" r="5" fill="#3d2a4a"/><circle cx="25" cy="213" r="5" fill="#3d2a4a"/>
<text x="36" y="209" font-size="16" font-weight="bold" fill="#2f3a2b">Blackberry</text><text x="36" y="227" font-size="14" fill="#6b5b4b">Fraser Valley</text>
<rect x="190" y="201" width="76" height="22" rx="6" fill="#3d2a4a"/>
<circle cx="18" cy="250" r="5" fill="#e8590c"/><circle cx="25" cy="246" r="5" fill="#e8590c"/><circle cx="25" cy="255" r="5" fill="#e8590c"/>
<text x="36" y="251" font-size="16" font-weight="bold" fill="#2f3a2b">Hips,</text><text x="36" y="269" font-size="15" font-weight="bold" fill="#2f3a2b">snowberry</text>
<rect x="250.0" y="243" width="136.0" height="22" rx="6" fill="#e8590c"/>
<text x="200" y="300" font-size="15" font-weight="bold" fill="#8b5a2b" text-anchor="middle">Bears and grouse follow the fruit (70%)</text>
</svg>
