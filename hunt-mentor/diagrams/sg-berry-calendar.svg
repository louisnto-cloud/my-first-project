<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Berry calendar, July to December. Saskatoon and soopolallie: July and August. Huckleberry: August and September. Himalayan blackberry in the Fraser Valley: August and September. Rose hips and snowberry: fall into winter. Bears and grouse follow the fruit.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Berry calendar</text>
  <g font-size="14" fill="#2f3a2b" text-anchor="middle"><text x="160" y="52">Jul</text><text x="200" y="52">Aug</text><text x="240" y="52">Sep</text><text x="280" y="52">Oct</text><text x="320" y="52">Nov</text><text x="360" y="52">Dec</text></g>
  <g stroke="#dfe6d3" stroke-width="2"><path d="M140 58 V270 M180 58 V270 M220 58 V270 M260 58 V270 M300 58 V270 M340 58 V270 M380 58 V270"/></g>
  <g font-size="15" fill="#2f3a2b" text-anchor="end"><text x="132" y="85">Saskatoon</text><text x="132" y="125">Soopolallie</text><text x="132" y="165">Huckleberry</text><text x="132" y="205">Blackberry</text><text x="132" y="245">Hips, snowberry</text></g>
  <rect x="140" y="70" width="80" height="22" rx="6" fill="#5b3a6b"/>
  <rect x="140" y="110" width="80" height="22" rx="6" fill="#c0392b"/>
  <rect x="180" y="150" width="80" height="22" rx="6" fill="#2c3e6b"/>
  <rect x="180" y="190" width="80" height="22" rx="6" fill="#3d2a4a"/>
  <rect x="240" y="230" width="140" height="22" rx="6" fill="#e8590c"/>
  <text x="268" y="206" font-size="14" fill="#2f3a2b">Fraser Valley</text>
  <text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Bears and grouse follow the fruit (70%)</text>
</svg>
