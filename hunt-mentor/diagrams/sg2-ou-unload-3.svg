<circle cx="24" cy="22" r="15" fill="#1F3D2B"/><text x="24" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="46" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Look, then carry it open</text>
