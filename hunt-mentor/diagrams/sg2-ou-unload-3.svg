<line x1="167.5" y1="66.0" x2="167.5" y2="105.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="167.5" cy="105.0" r="3" fill="#1F3D2B"/><rect x="72.6" y="43.0" width="174.8" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="160.0" y="60.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">both chambers empty</text>
<rect x="211.4" y="212.0" width="177.3" height="24.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="300.0" y="230.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">carry it broken open</text>
