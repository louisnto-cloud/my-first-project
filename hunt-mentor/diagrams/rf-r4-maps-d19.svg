<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 662" role="img" aria-label="Cards for Maps D19 to D27. D19 Fairmont and D20 Windermere: No Shooting Areas. D21 Columbia Wetlands Wildlife Management Area: closed to any conveyance with a motor over 10 horsepower. D22 Radium: No Shooting or Hunting Area. D23 Columbia Lake and River Wildlife Sanctuary: no shooting, hunting or trapping. D24 Lardeau: the mountain goat season area in 4-30. D25 Edgewater: No Shooting or Hunting Area. D26 Bergenham and Moberly Marsh Wildlife Sanctuaries: no shooting, hunting or trapping. D27 Cranbrook Deer Hunt, new: 5 to 31 January general open season on any deer, bag one, in addition to regional limits, never more than 3 deer province wide." font-family="sans-serif">
<rect x="0" y="0" width="400" height="662" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Maps D19 to D27</text>
<rect x="6" y="40" width="190" height="78" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<path d="M6 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#e8590c"/>
<text x="101" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">D19 Fairmont</text>
<text x="14" y="88" font-size="14" fill="#23261f" text-anchor="start">No Shooting Area,</text>
<text x="14" y="106" font-size="14" fill="#23261f" text-anchor="start">MU 4-25</text>
<rect x="204" y="40" width="190" height="78" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<path d="M204 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#e8590c"/>
<text x="299" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">D20 Windermere</text>
<text x="212" y="88" font-size="14" fill="#23261f" text-anchor="start">No Shooting Area,</text>
<text x="212" y="106" font-size="14" fill="#23261f" text-anchor="start">MU 4-25</text>
<rect x="6" y="126" width="190" height="114" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<path d="M6 136 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#4a7fb0"/>
<text x="101" y="144" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">D21 Columbia</text>
<text x="101" y="162" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Wetlands</text>
<text x="14" y="192" font-size="14" fill="#23261f" text-anchor="start">Over 10 horsepower</text>
<text x="14" y="210" font-size="14" fill="#23261f" text-anchor="start">prohibited. See the</text>
<text x="14" y="228" font-size="14" fill="#23261f" text-anchor="start">wetlands screen</text>
<rect x="204" y="126" width="190" height="114" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M204 136 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#c92a2a"/>
<text x="299" y="144" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">D22 Radium</text>
<text x="212" y="192" font-size="14" fill="#23261f" text-anchor="start">No Shooting or Hunting</text>
<text x="212" y="210" font-size="14" fill="#23261f" text-anchor="start">Area, MUs 4-25, 4-35</text>
<rect x="6" y="248" width="190" height="114" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M6 258 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v54 h-190 z" fill="#c92a2a"/>
<text x="101" y="266" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">D23 Columbia Lake</text>
<text x="101" y="284" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">and River Wildlife</text>
<text x="101" y="302" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Sanctuary</text>
<text x="14" y="332" font-size="14" fill="#23261f" text-anchor="start">No shooting, hunting or</text>
<text x="14" y="350" font-size="14" fill="#23261f" text-anchor="start">trapping</text>
<rect x="204" y="248" width="190" height="114" rx="10" fill="#ffffff" stroke="#5c7a3a" stroke-width="2.5"/>
<path d="M204 258 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v54 h-190 z" fill="#5c7a3a"/>
<text x="299" y="266" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">D24 Lardeau</text>
<text x="212" y="332" font-size="14" fill="#23261f" text-anchor="start">Mountain goat season</text>
<text x="212" y="350" font-size="14" fill="#23261f" text-anchor="start">area, MU 4-30</text>
<rect x="6" y="370" width="190" height="114" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M6 380 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#c92a2a"/>
