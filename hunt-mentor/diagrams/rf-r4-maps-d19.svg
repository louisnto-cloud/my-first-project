<text x="14" y="436" font-size="14" fill="#23261f" text-anchor="start">No Shooting or Hunting</text>
<text x="14" y="454" font-size="14" fill="#23261f" text-anchor="start">Area, MU 4-35</text>
<rect x="204" y="370" width="190" height="114" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M204 380 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#c92a2a"/>
<text x="299" y="388" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">D26 Bergenham and</text>
<text x="299" y="406" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Moberly Marsh</text>
<text x="212" y="436" font-size="14" fill="#23261f" text-anchor="start">Wildlife sanctuaries:</text>
<text x="212" y="454" font-size="14" fill="#23261f" text-anchor="start">no shooting, hunting or</text>
<text x="212" y="472" font-size="14" fill="#23261f" text-anchor="start">trapping, MU 4-36</text>
<rect x="6" y="492" width="190" height="114" rx="10" fill="#ffffff" stroke="#6a4c93" stroke-width="2.5"/>
<path d="M6 502 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#6a4c93"/>
<text x="101" y="510" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">D27 Cranbrook Deer</text>
<text x="101" y="528" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Hunt (new)</text>
<text x="14" y="558" font-size="14" fill="#23261f" text-anchor="start">Jan 5 to 31: one extra</text>
<text x="14" y="576" font-size="14" fill="#23261f" text-anchor="start">deer of either species</text>
<text x="14" y="594" font-size="14" fill="#23261f" text-anchor="start">and sex</text>
<rect x="6" y="612" width="14" height="14" rx="3" fill="#e8590c"/>
<text x="24" y="624" font-size="14" fill="#23261f" text-anchor="start">No shooting</text>
<rect x="119.4" y="612" width="14" height="14" rx="3" fill="#4a7fb0"/>
<text x="137" y="624" font-size="14" fill="#23261f" text-anchor="start">Vehicle rule</text>
<rect x="240.20000000000002" y="612" width="14" height="14" rx="3" fill="#c92a2a"/>
<text x="258" y="624" font-size="14" fill="#23261f" text-anchor="start">No hunting</text>
<rect x="6" y="634" width="14" height="14" rx="3" fill="#5c7a3a"/>
<text x="24" y="646" font-size="14" fill="#23261f" text-anchor="start">Open or allowed</text>
<rect x="149.0" y="634" width="14" height="14" rx="3" fill="#6a4c93"/>
<text x="167" y="646" font-size="14" fill="#23261f" text-anchor="start">Special season</text>
</svg>
