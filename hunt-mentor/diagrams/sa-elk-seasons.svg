<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" font-family="sans-serif" role="img" aria-label="Elk general seasons, 6 point bulls only. Region 8 Okanagan, page 68: bow only 1 to 9 September, and rifle 10 September to 20 October, in MUs 8-1 to 8-15 and 8-21 to 8-26. The rut runs early September to mid October, so the Region 8 season sits on the rut. Region 3 Thompson and Region 2 have no general open season for elk.">
<rect x="0" y="0" width="400" height="280" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Where elk are open (6 point bulls)</text><rect x="8.0" y="52" width="128.0" height="186" fill="#dfe6d3" opacity=".6"/><text x="72.0" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Sep</text><text x="200.0" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Oct</text><rect x="264.0" y="52" width="128.0" height="186" fill="#dfe6d3" opacity=".6"/><text x="328.0" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Nov</text><text x="12" y="74" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Region 8 bow only: 8-1 to 8-15, 8-21 to 8-26</text><rect x="8.0" y="82" width="38.4" height="28" rx="5" fill="#2f3a2b"/><text x="52.40000000000009" y="101" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Sep 1 to 9</text><text x="12" y="136" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Region 8 rifle: same MUs</text><rect x="46.4" y="144" width="172.8" height="28" rx="5" fill="#e8590c"/><text x="132.80000000000007" y="163" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Sep 10 to Oct 20</text><text x="12" y="198" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Rut, for comparison</text><rect x="8.0" y="206" width="192.0" height="28" rx="5" fill="#8a9a6b"/><text x="104.0" y="225" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Sep to mid Oct</text><text x="200" y="268" font-size="14" fill="#6b4f35" text-anchor="middle">Region 3 and Region 2: no general elk season.</text>
</svg>
