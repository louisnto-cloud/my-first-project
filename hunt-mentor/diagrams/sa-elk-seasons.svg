<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" font-family="sans-serif" role="img" aria-label="Elk general seasons, 6 point bulls only. Region 8 Okanagan, page 68: bow only 1 to 9 September, and rifle 10 September to 20 October, in MUs 8-1 to 8-15 and 8-21 to 8-26. The rut runs early September to mid October, so the Region 8 season sits on the rut. Region 3 Thompson and Region 2 have no general open season for elk.">
<rect width="400" height="296" fill="#fffaf0"/>
<text x="14" y="24" font-size="14" font-weight="bold" fill="#6b5b4b">Where elk are open (6 point bulls)</text>
<text x="75.3" y="46" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Sep</text>
<text x="200" y="46" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Oct</text>
<text x="324.7" y="46" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Nov</text>
<text x="14" y="72" font-size="16" font-weight="bold" fill="#2f3a2b">Region 8, bow only</text>
<text x="386" y="72" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">Sep 1 to 9</text>
<text x="14" y="92" font-size="14" fill="#6b5b4b">MUs 8-1 to 8-15, 8-21 to 8-26</text>
<rect x="14.0" y="99" width="122.6" height="16" fill="#efe8d6"/>
<rect x="136.6" y="99" width="126.7" height="16" fill="#f8f3e6"/>
<rect x="263.4" y="99" width="122.6" height="16" fill="#efe8d6"/>
<rect x="14.0" y="100" width="36.8" height="14" rx="3" fill="#2f3a2b"/>
<text x="14" y="145" font-size="16" font-weight="bold" fill="#2f3a2b">Region 8, rifle</text>
<text x="386" y="145" font-size="15" font-weight="bold" fill="#2c5d86" text-anchor="end">Sep 10 to Oct 20</text>
<text x="14" y="165" font-size="14" fill="#6b5b4b">Same MUs</text>
<rect x="14.0" y="172" width="122.6" height="16" fill="#efe8d6"/>
<rect x="136.6" y="172" width="126.7" height="16" fill="#f8f3e6"/>
<rect x="263.4" y="172" width="122.6" height="16" fill="#efe8d6"/>
<rect x="50.8" y="173" width="167.6" height="14" rx="3" fill="#4a7fb0"/>
<text x="14" y="218" font-size="16" font-weight="bold" fill="#2f3a2b">Rut, for comparison</text>
<text x="386" y="218" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="end">Sep to mid Oct</text>
<rect x="14.0" y="226" width="122.6" height="16" fill="#efe8d6"/>
<rect x="136.6" y="226" width="126.7" height="16" fill="#f8f3e6"/>
<rect x="263.4" y="226" width="122.6" height="16" fill="#efe8d6"/>
<rect x="14.0" y="227" width="184.0" height="14" rx="3" fill="#e8590c"/>
<text x="14" y="272" font-size="16" font-weight="bold" fill="#2f3a2b">Region 3 and Region 2</text>
<text x="386" y="272" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="end">No general season</text>
</svg>
