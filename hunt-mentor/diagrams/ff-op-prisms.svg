<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two binocular shapes. Roof prism: straight tubes, slim and tough. Porro prism: offset tubes with the big lenses wider apart, good image for the money.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Roof or Porro prism</text><g transform="translate(100 140)"><rect x="-20" y="-40" width="24" height="90" rx="8" fill="#2f3a2b" stroke="none" stroke-width="2"/><rect x="10" y="-40" width="24" height="90" rx="8" fill="#2f3a2b" stroke="none" stroke-width="2"/></g><g transform="translate(290 140)"><path d="M-40 -40 L-10 -40 L-10 0 L-26 0 L-26 50 L-50 50 L-50 0 Z" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 -40 L10 -40 L10 0 L26 0 L26 50 L50 50 L50 0 Z" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="110" y="230" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Roof</text><text x="110" y="250" font-size="14" fill="#23261f" text-anchor="middle">straight, slim, tough</text><text x="290" y="230" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Porro</text><text x="290" y="250" font-size="14" fill="#23261f" text-anchor="middle">offset, good value</text>
</svg>
