<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 332" font-family="sans-serif" role="img" aria-label="Zero the iron sights in four steps, from the Tikka manual. 1 bolt out, rifle steady, look through the bore at a target 25 to 30 metres away. 2 without moving the rifle, adjust the sights onto the same spot. 3 at 100 metres, fire 3 shots from a solid rest and find the group centre. 4 move the sights to the group centre and repeat until the group is on the bull. Step 1 is done unloaded, bolt out.">
<rect x="0" y="0" width="400" height="332" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Zero the irons in 4 steps</text><g data-tip="Step 1|Bolt out. Rifle steady. Bore on a target at 25 to 30 m."><rect x="12" y="42" width="376" height="54" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="34" cy="69" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="74" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="56" y="65" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">Bolt out. Rifle steady.</text><text x="56" y="84" font-size="14" fill="#17201A" text-anchor="start">Bore on a target at 25 to 30 m.</text></g><g data-tip="Step 2|Sights on the same spot without moving the rifle."><rect x="12" y="104" width="376" height="54" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="34" cy="131" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="136" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="56" y="127" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">Sights on the same spot</text><text x="56" y="146" font-size="14" fill="#17201A" text-anchor="start">without moving the rifle.</text></g><g data-tip="Step 3|100 m: 3 shots from a solid rest. Find the centre."><rect x="12" y="166" width="376" height="54" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="34" cy="193" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="198" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="56" y="189" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">100 m: 3 shots from a</text><text x="56" y="208" font-size="14" fill="#17201A" text-anchor="start">solid rest. Find the centre.</text></g><g data-tip="Step 4|Move the sights to the group centre. Repeat."><rect x="12" y="228" width="376" height="54" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="34" cy="255" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="260" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="56" y="251" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">Move the sights to the</text><text x="56" y="270" font-size="14" fill="#17201A" text-anchor="start">group centre. Repeat.</text></g><rect x="10" y="294" width="380" height="28" rx="6" fill="#1F3D2B"/><text x="200" y="313.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Step 1 is done unloaded, bolt out.</text>
</svg>
