<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Kill site step 4: come back from upwind, stop at a distance and glass the meat. Moved, buried or a bear on it: leave and report.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4. Return upwind, glass first</text><rect x="0" y="230" width="400" height="70" rx="0" fill="#dfe6d3"/><rect x="300" y="140" width="34" height="50" rx="6" fill="#ffffff" stroke="#9a9a8f" stroke-width="2"/><line x1="72" y1="230" x2="76" y2="201" stroke="#2f3a2b" stroke-width="7.0" stroke-linecap="round"/><line x1="88" y1="230" x2="84" y2="201" stroke="#2f3a2b" stroke-width="7.0" stroke-linecap="round"/><rect x="69" y="173" width="22" height="31" rx="6.0" fill="#e8590c"/><line x1="70" y1="178" x2="62" y2="198" stroke="#2f3a2b" stroke-width="6.0" stroke-linecap="round"/><line x1="90" y1="178" x2="98" y2="198" stroke="#2f3a2b" stroke-width="6.0" stroke-linecap="round"/><circle cx="80" cy="164" r="10.0" fill="#d9b48f"/><rect x="68" y="160" width="26" height="10" rx="3" fill="#2f3a2b"/><line x1="130" y1="150" x2="272" y2="159" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><polygon points="280,160 272,155 272,164" fill="#e8590c"/><line x1="390" y1="90" x2="341" y2="106" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><polygon points="330,110 344,113 339,99" fill="#4a7fb0"/><text x="360" y="76" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">wind</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Glass from afar. Bear there? Leave</text>
</svg>
