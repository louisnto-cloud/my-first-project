<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bird care step 1. Ducks in a mesh bag hanging in the shade to cool, each with a wing on. Caption: cool them in a mesh bag, never plastic."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Care 1: cool them fast</text><line x1="200" y1="40" x2="200" y2="80" stroke="#2f3a2b" stroke-width="3" fill="none"/><path d="M150 80 L250 80 L230 230 L170 230Z" fill="none" stroke="#2f3a2b" stroke-width="2" stroke-dasharray="3 3"/><ellipse cx="190" cy="110" rx="22" ry="12" fill="#8b5a2b"/><ellipse cx="210" cy="150" rx="22" ry="12" fill="#8b5a2b"/><ellipse cx="195" cy="190" rx="22" ry="12" fill="#8b5a2b"/><text x="310" y="140" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Shade</text><text x="310" y="164" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Air moves</text><rect x="10" y="256" width="380" height="38" rx="8" fill="#2f3a2b"/><text x="200" y="281" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Mesh bag, shade, never a plastic bag</text></svg>
