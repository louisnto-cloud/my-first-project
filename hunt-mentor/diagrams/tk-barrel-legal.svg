<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="How Canadian law measures barrel length: from the muzzle to and including the chamber, not counting any muzzle device. Number 1 marks the chamber, number 2 the muzzle. 3: the factory Arctic barrel is 508 mm, 20 inches. Measure yours. 4, in orange: a rifle cut or altered so the barrel is under 457 mm, or the whole firearm is under 660 mm, is a prohibited firearm. Never cut it.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">How the law measures a barrel</text><polygon points="127.7,90.8 386.9,91.9 386.9,100.1 127.7,101.2" fill="#C9D0C6" stroke="#1F3D2B" stroke-width="1.4" stroke-linejoin="round"/><rect x="13.1" y="87.2" width="116.7" height="17.6" rx="3" fill="#C9D0C6" stroke="#1F3D2B" stroke-width="1.4"/><rect x="102.9" y="92.9" width="36.2" height="6.2" rx="0" fill="#C9A54A" stroke="#1F3D2B" stroke-width="1"/><line x1="102.9" y1="120" x2="390.0" y2="120" stroke="#1F3D2B" stroke-width="2"/><line x1="102.9" y1="112" x2="102.9" y2="128" stroke="#1F3D2B" stroke-width="2"/><line x1="390.0" y1="112" x2="390.0" y2="128" stroke="#1F3D2B" stroke-width="2"/><text x="250" y="146" font-size="14" fill="#17201A" text-anchor="middle">Muzzle to bolt face, chamber in</text><g data-tip="Chamber counts|The law measures from the muzzle to and including the chamber. A muzzle device does not count."><line x1="121.0" y1="62" x2="121.0" y2="90" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="121.0" cy="90" r="2.6" fill="#1F3D2B"/><circle cx="121.0" cy="62" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="121.0" y="67" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text></g><g data-tip="Muzzle end|Measure to the end of the barrel itself, not to a brake or the sight."><line x1="381.7" y1="62" x2="387.9" y2="90" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="387.9" cy="90" r="2.6" fill="#1F3D2B"/><circle cx="381.7" cy="62" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="381.7" y="67" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text></g><rect x="12" y="160" width="376" height="50" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="185" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="190" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="52" y="181" font-size="14" fill="#17201A" text-anchor="start" font-weight="bold">Factory Arctic: 508 mm (20 in).</text><text x="52" y="200" font-size="14" fill="#17201A" text-anchor="start">Measure yours. Write it down.</text><rect x="12" y="218" width="376" height="66" rx="8" fill="#FFE6D6" stroke="#FF6A13" stroke-width="1.5"/><circle cx="32" cy="243" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="248" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="52" y="239" font-size="14" fill="#17201A" text-anchor="start" font-weight="bold">Cut or altered to under 457 mm,</text><text x="52" y="258" font-size="14" fill="#17201A" text-anchor="start" font-weight="bold">or under 660 mm overall:</text><text x="52" y="277" font-size="14" fill="#FF6A13" text-anchor="start" font-weight="bold">a prohibited firearm. Never cut it.</text>
</svg>
