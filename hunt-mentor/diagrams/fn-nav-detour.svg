<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A swamp blocks your bearing. Turn 90 degrees left and count 60 paces, walk your bearing past the swamp, turn 90 degrees right and count the same 60 paces back, then carry on.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#dfe6d3" stroke="none" stroke-width="2"/><ellipse cx="200" cy="150" rx="70" ry="45" fill="#4a7fb0" stroke="none" stroke-width="0" opacity=".5"/><text x="200" y="155" font-family="sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">Swamp</text><g transform="translate(200 285) scale(0.6)"><circle cx="0" cy="-30" r="7" fill="#2f3a2b"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" fill="none"/></g><path d="M200 262 L200 220 L110 220 L110 80 L200 80 L200 30" fill="none" stroke="#e8590c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><line x1="200" y1="40" x2="200.0" y2="29.7" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="200.0,22.0 193.9,33.0 206.1,33.0" fill="#e8590c"/><text x="214" y="240" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start">90° left, count 60</text><text x="20" y="150" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start">Bearing</text><text x="20" y="166" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start">again</text><text x="214" y="62" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start">90° right,</text><text x="214" y="78" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start">same 60 back</text><text x="14" y="20" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Box around it</text>
</svg>
