<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Year wheel for elk. Winter range from about November to April. Antlers drop late February to early April. Antlers grow April to August. Migration up and calves born late May and June. High summer range June to August. Rut in September into mid October. Source BC elk account.">
