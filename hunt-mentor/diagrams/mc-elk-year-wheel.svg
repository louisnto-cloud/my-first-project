ht="bold">N</text><line x1="104" y1="150" x2="54" y2="121" stroke="#fffaf0" stroke-width="1"/><text x="104" y="73" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">D</text><line x1="115" y1="139" x2="86" y2="89" stroke="#fffaf0" stroke-width="1"/><path d="M62.5 126.0 A78 78 0 0 1 197.5 204.0" fill="none" stroke="#4a7fb0" stroke-width="14" stroke-linecap="butt"/><path d="M185.2 220.2 A78 78 0 0 1 62.5 204.0" fill="none" stroke="#8a9a6b" stroke-width="14" stroke-linecap="butt"/><path d="M76.3 196.0 A62 62 0 0 1 70.1 149.0" fill="none" stroke="#e8590c" stroke-width="14" stroke-linecap="butt"/><path d="M169.0 213.2 A62 62 0 0 1 130.0 227.0" fill="none" stroke="#b03a2e" stroke-width="14" stroke-linecap="butt"/><path d="M176.0 165.0 A46 46 0 0 1 90.2 188.0" fill="none" stroke="#8b5a2b" stroke-width="14" stroke-linecap="butt"/><path d="M167.2 138.0 A46 46 0 0 1 175.7 169.8" fill="none" stroke="#23261f" stroke-width="14" stroke-linecap="butt"/><circle cx="130" cy="165" r="30" fill="#fffaf0"/><text x="130" y="170" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Elk</text><rect x="262" y="60" width="18" height="14" rx="3" fill="#4a7fb0"/><text x="286" y="72" font-size="14" fill="#23261f" text-anchor="start">Winter range</text><rect x="262" y="90" width="18" height="14" rx="3" fill="#8a9a6b"/><text x="286" y="102" font-size="14" fill="#23261f" text-anchor="start">Summer high</text><rect x="262" y="120" width="18" height="14" rx="3" fill="#e8590c"/><text x="286" y="132" font-size="14" fill="#23261f" text-anchor="start">Rut</text><rect x="262" y="150" width="18" height="14" rx="3" fill="#b03a2e"/><text x="286" y="162" font-size="14" fill="#23261f" text-anchor="start">Calves</text><rect x="262" y="180" width="18" height="14" rx="3" fill="#8b5a2b"/><text x="286" y="192" font-size="14" fill="#23261f" text-anchor="start">Antlers grow</text><rect x="262" y="210" width="18" height="14" rx="3" fill="#23261f"/><text x="286" y="222" font-size="14" fill="#23261f" text-anchor="start">Antlers drop</text><text x="320" y="250" font-size="14" fill="#6b4f35" text-anchor="middle">BC elk account</text><text x="320" y="268" font-size="14" fill="#6b4f35" text-anchor="middle">(85 to 90%)</text>
