<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Tikka bolt: three grease points</text><rect x="40" y="120" width="300" height="36" rx="10" fill="#9a9e96" stroke="#2f3a2b" stroke-width="2"/><rect x="330" y="110" width="26" height="56" rx="4" fill="#9a9e96" stroke="#2f3a2b" stroke-width="2"/><rect x="40" y="114" width="30" height="48" rx="6" fill="#6b6f68" stroke="#2f3a2b" stroke-width="2"/><circle cx="343" cy="138" r="9" fill="#f2c94c" stroke="#e8590c" stroke-width="2.5"/><text x="343" y="82" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">A: locking lugs</text><circle cx="90" cy="130" r="9" fill="#f2c94c" stroke="#e8590c" stroke-width="2.5"/><text x="150" y="82" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">B: cocking cam</text><circle cx="55" cy="138" r="9" fill="#f2c94c" stroke="#e8590c" stroke-width="2.5"/><text x="95" y="220" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">C: cocking piece head</text><text x="200.0" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle">Lightly. Everything else: a thin film of oil.</text>
