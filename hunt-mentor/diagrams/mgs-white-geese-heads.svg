<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three white heads compared. Snow goose: pink bill with a dark grin patch, legal, 99 percent. Ross&#x27;s goose: small stubby bill with a bluish base and no grin, legal, 99 percent. Swan: huge with a black bill, protected, 90 percent. In flight, black wing tips mean snow or Ross&#x27;s goose, 80 percent; all white wings and a longer neck mean swan.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">White birds: name it before you shoot</text><g transform="translate(55 90) scale(1.3)"><path d="M-20 60 Q-24 10 0 -4 Q20 -14 30 0 L30 14 Q10 10 4 30 L6 60Z" fill="#fff" stroke="#2f3a2b" stroke-width="1.5"/><path d="M26 -2 L72 8 L26 16Z" fill="#e89a8c" stroke="#2f3a2b" stroke-width="1"/><path d="M30 9 L52 9" stroke="#2f3a2b" stroke-width="4"/><circle cx="12" cy="2" r="3" fill="#2f3a2b"/></g><g transform="translate(190 95) scale(1.3)"><path d="M-20 60 Q-24 10 0 -4 Q20 -14 30 0 L30 14 Q10 10 4 30 L6 60Z" fill="#fff" stroke="#2f3a2b" stroke-width="1.5"/><path d="M26 -2 L52 8 L26 16Z" fill="#e89a8c" stroke="#2f3a2b" stroke-width="1"/><path d="M27 2 Q30 0 32 4 Q30 8 27 6Z" fill="#9aa9b8"/><circle cx="12" cy="2" r="3" fill="#2f3a2b"/></g><g transform="translate(292 92) scale(1.15)"><path d="M-20 60 Q-24 10 0 -4 Q20 -14 30 0 L30 14 Q10 10 4 30 L6 60Z" fill="#fff" stroke="#2f3a2b" stroke-width="1.5"/><path d="M26 -2 L78 8 L26 16Z" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="1"/><circle cx="12" cy="2" r="3" fill="#2f3a2b"/></g><text x="80" y="200" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Snow goose</text><text x="80" y="218" font-size="14" fill="#23261f" text-anchor="middle">pink bill, dark grin</text><text x="80" y="236" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">legal (99%)</text><text x="205" y="200" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Ross&#x27;s goose</text><text x="205" y="218" font-size="14" fill="#23261f" text-anchor="middle">stubby, no grin</text><text x="205" y="236" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">legal (99%)</text><text x="335" y="200" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Swan</text><text x="335" y="218" font-size="14" fill="#23261f" text-anchor="middle">huge, black bill</text><text x="335" y="236" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">protected (90%)</text><rect x="20" y="252" width="360" height="40" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="270" font-size="14" fill="#23261f" text-anchor="middle">Black wing tips: snow or Ross&#x27;s (80%)</text><text x="200" y="287" font-size="14" fill="#23261f" text-anchor="middle">All white wings, longer neck: swan</text>
</svg>
