<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 392" font-family="sans-serif" role="img" aria-label="The legal lines for changes to your rifle: 1 a suppressor or silencer is a prohibited device; 2 a barrel cut under 457 mm and 3 a whole rifle cut under 660 mm make a prohibited firearm; 4 a semi automatic rifle magazine over 5 rounds is a prohibited device; 5 a muzzle brake is not named in section 84; 6 a scope, sling and sticks are fine. Unsure: ask a qualified gunsmith first.">
<rect x="0" y="0" width="400" height="392" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">The legal lines</text><rect x="12" y="42" width="376" height="44" rx="8" fill="#FFE6D6" stroke="#FF6A13" stroke-width="1.5"/><circle cx="32" cy="64" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="69" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="52" y="61" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">Suppressor or silencer</text><text x="52" y="79" font-size="14" fill="#FF6A13" text-anchor="start">prohibited device</text><rect x="12" y="92" width="376" height="44" rx="8" fill="#FFE6D6" stroke="#FF6A13" stroke-width="1.5"/><circle cx="32" cy="114" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="119" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="52" y="111" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">Barrel cut under 457 mm</text><text x="52" y="129" font-size="14" fill="#FF6A13" text-anchor="start">prohibited firearm</text><rect x="12" y="142" width="376" height="44" rx="8" fill="#FFE6D6" stroke="#FF6A13" stroke-width="1.5"/><circle cx="32" cy="164" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="169" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="52" y="161" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">Whole rifle under 660 mm</text><text x="52" y="179" font-size="14" fill="#FF6A13" text-anchor="start">prohibited firearm</text><rect x="12" y="192" width="376" height="44" rx="8" fill="#FFE6D6" stroke="#FF6A13" stroke-width="1.5"/><circle cx="32" cy="214" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="219" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="52" y="211" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">Semi auto magazine over 5</text><text x="52" y="229" font-size="14" fill="#FF6A13" text-anchor="start">prohibited device</text><rect x="12" y="242" width="376" height="44" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="264" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="269" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="52" y="261" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">Muzzle brake</text><text x="52" y="279" font-size="14" fill="#1F3D2B" text-anchor="start">not named in s. 84</text><rect x="12" y="292" width="376" height="44" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="314" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="319" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text><text x="52" y="311" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">Scope, sling, sticks</text><text x="52" y="329" font-size="14" fill="#1F3D2B" text-anchor="start">fine</text><rect x="12" y="346" width="376" height="34" rx="6" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="200" y="368" font-size="14" fill="#17201A" text-anchor="middle">Unsure? Ask a qualified gunsmith first.</text>
</svg>
