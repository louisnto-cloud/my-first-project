<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Misfire: click, no bang. A clock shows one full minute. 1 keep the muzzle pointed in a safe direction; 2 wait at least one minute; 3 unload with extreme care; 4 keep that round apart from your good ammunition. A slow fire, called a hang fire, can go off late.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Click, no bang</text><circle cx="110" cy="140" r="70" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="3"/><line x1="110.0" y1="80.0" x2="110.0" y2="72.0" stroke="#1F3D2B" stroke-width="2"/><line x1="140.0" y1="88.0" x2="144.0" y2="81.1" stroke="#1F3D2B" stroke-width="2"/><line x1="162.0" y1="110.0" x2="168.9" y2="106.0" stroke="#1F3D2B" stroke-width="2"/><line x1="170.0" y1="140.0" x2="178.0" y2="140.0" stroke="#1F3D2B" stroke-width="2"/><line x1="162.0" y1="170.0" x2="168.9" y2="174.0" stroke="#1F3D2B" stroke-width="2"/><line x1="140.0" y1="192.0" x2="144.0" y2="198.9" stroke="#1F3D2B" stroke-width="2"/><line x1="110.0" y1="200.0" x2="110.0" y2="208.0" stroke="#1F3D2B" stroke-width="2"/><line x1="80.0" y1="192.0" x2="76.0" y2="198.9" stroke="#1F3D2B" stroke-width="2"/><line x1="58.0" y1="170.0" x2="51.1" y2="174.0" stroke="#1F3D2B" stroke-width="2"/><line x1="50.0" y1="140.0" x2="42.0" y2="140.0" stroke="#1F3D2B" stroke-width="2"/><line x1="58.0" y1="110.0" x2="51.1" y2="106.0" stroke="#1F3D2B" stroke-width="2"/><line x1="80.0" y1="88.0" x2="76.0" y2="81.1" stroke="#1F3D2B" stroke-width="2"/><path d="M110 140 L110 74 A66 66 0 1 1 109.9 74Z" fill="#FF6A13" opacity="0.25"/><line x1="110" y1="140" x2="110" y2="84" stroke="#1F3D2B" stroke-width="4"/><text x="110" y="230" font-size="15" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Wait 1 full minute</text><circle cx="210" cy="82" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="210" y="87" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="228" y="87" font-size="14" fill="#17201A" text-anchor="start">Muzzle stays safe</text><circle cx="210" cy="122" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="210" y="127" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="228" y="127" font-size="14" fill="#17201A" text-anchor="start">Wait at least 1 min</text><circle cx="210" cy="162" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="210" y="167" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="228" y="167" font-size="14" fill="#17201A" text-anchor="start">Unload with care</text><circle cx="210" cy="202" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="210" y="207" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="228" y="207" font-size="14" fill="#17201A" text-anchor="start">Keep the round apart</text><rect x="12" y="248" width="376" height="40" rx="6" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="200" y="273" font-size="14" fill="#17201A" text-anchor="middle">A slow fire (hang fire) can go off late.</text>
</svg>
