<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three hunters walking in a line, seen from above. Each hunter shoots only inside a slice of about 45 degrees straight ahead. The ground between and behind hunters is a no shot zone. Stay level and in sight.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Walking in a line</text>
<path d="M80 230 L22.6 91.4 A150 150 0 0 1 137.4 91.4 Z" fill="#1F3D2B" opacity="0.28"/>
<path d="M200 230 L142.6 91.4 A150 150 0 0 1 257.4 91.4 Z" fill="#1F3D2B" opacity="0.28"/>
<path d="M320 230 L262.6 91.4 A150 150 0 0 1 377.4 91.4 Z" fill="#1F3D2B" opacity="0.28"/>
<ellipse cx="80" cy="234" rx="13" ry="9" fill="#1F3D2B"/><circle cx="80" cy="230" r="7" fill="#FF6A13"/><line x1="80" y1="230" x2="80.0" y2="196.0" stroke="#3b4045" stroke-width="4" stroke-linecap="round"/>
<ellipse cx="200" cy="234" rx="13" ry="9" fill="#1F3D2B"/><circle cx="200" cy="230" r="7" fill="#FF6A13"/><line x1="200" y1="230" x2="200.0" y2="196.0" stroke="#3b4045" stroke-width="4" stroke-linecap="round"/>
<ellipse cx="320" cy="234" rx="13" ry="9" fill="#1F3D2B"/><circle cx="320" cy="230" r="7" fill="#FF6A13"/><line x1="320" y1="230" x2="320.0" y2="196.0" stroke="#3b4045" stroke-width="4" stroke-linecap="round"/>
<line x1="20" y1="252" x2="380" y2="252" stroke="#FF6A13" stroke-width="3" stroke-dasharray="8 6"/>
<rect x="90.5" y="267.0" width="219.1" height="23.0" rx="5" fill="#ffffff" stroke="#FF6A13" stroke-width="1.3"/><text x="200.0" y="284.0" font-size="14" font-weight="bold" fill="#FF6A13" text-anchor="middle">Behind the line: never shoot</text>
<rect x="106.1" y="197.0" width="67.7" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="140.0" y="214.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">no shot</text>
<rect x="226.1" y="197.0" width="67.7" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="260.0" y="214.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">no shot</text>
<rect x="37.6" y="49.0" width="84.8" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="80.0" y="66.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">your zone</text>
</svg>
