<text x="350" y="254" font-size="15" font-weight="bold" fill="#2c5d86" text-anchor="middle">kid</text>
<text x="100" y="336" font-size="16" font-weight="bold" fill="#6b4f35" text-anchor="middle">Heavier, 70 to 120 kg</text>
<text x="100" y="358" font-size="15" fill="#2f3a2b" text-anchor="middle">Alone, or 2 to 3 adults,</text>
<text x="100" y="377" font-size="15" fill="#2f3a2b" text-anchor="middle">no kids with them</text>
<text x="300" y="336" font-size="16" font-weight="bold" fill="#2c5d86" text-anchor="middle">Slimmer, 55 to 75 kg</text>
<text x="300" y="358" font-size="15" fill="#2f3a2b" text-anchor="middle">In groups with kids</text>
<text x="300" y="377" font-size="15" fill="#2f3a2b" text-anchor="middle">and yearlings</text>
<rect x="8" y="400" width="384" height="86" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="200" y="426" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">A nanny with a kid is illegal to shoot.</text>
<text x="200" y="448" font-size="14" fill="#2f3a2b" text-anchor="middle">Horns look alike at a glance. Watch 10 minutes or more.</text>
<text x="200" y="470" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Not sure it is a billy? Do not shoot.</text>
