<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="sans-serif">
  <rect x="0" y="0" width="400" height="440" fill="#fffaf0"/>
  <line x1="200" y1="10" x2="200" y2="330" stroke="#8a9a6b" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
  <text x="100" y="28" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Billy (male)</text>
  <text x="300" y="28" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Nanny (female)</text>
  <!-- Billy: heavy body, hump, thick horns that curve evenly -->
  <g transform="translate(8,40)">
    <ellipse cx="100" cy="112" rx="72" ry="40" fill="#f3ead8" stroke="#23261f" stroke-width="2"/>
    <path d="M60,80 C80,56 120,56 150,78" fill="#f3ead8" stroke="#23261f" stroke-width="2"/>
    <rect x="52" y="140" width="12" height="40" fill="#f3ead8" stroke="#23261f" stroke-width="2"/>
    <rect x="76" y="144" width="12" height="36" fill="#f3ead8" stroke="#23261f" stroke-width="2"/>
    <rect x="120" y="144" width="12" height="36" fill="#f3ead8" stroke="#23261f" stroke-width="2"/>
    <rect x="146" y="140" width="12" height="40" fill="#f3ead8" stroke="#23261f" stroke-width="2"/>
    <path d="M44,96 L22,88 L14,104 L22,120 L44,122 Z" fill="#f3ead8" stroke="#23261f" stroke-width="2"/>
    <path d="M22,120 L26,134 L34,122 Z" fill="#f3ead8" stroke="#23261f" stroke-width="2"/>
    <circle cx="28" cy="98" r="3" fill="#23261f"/>
    <circle cx="15" cy="106" r="2.5" fill="#23261f"/>
    <path d="M40,90 C46,70 58,62 70,66" fill="none" stroke="#23261f" stroke-width="9" stroke-linecap="round"/>
    <path d="M40,90 C46,70 58,62 70,66" fill="none" stroke="#6b4f35" stroke-width="3" stroke-linecap="round"/>
    <text x="100" y="196" font-size="14" fill="#23261f" text-anchor="middle">Horn thick at the base,</text>
    <text x="100" y="212" font-size="14" fill="#23261f" text-anchor="middle">curves evenly all the way</text>
    <text x="100" y="232" font-size="14" fill="#23261f" text-anchor="middle">Heavier, 70 to 120 kg</text>
    <text x="100" y="252" font-size="14" fill="#23261f" text-anchor="middle">Alone, or 2 to 3 adults,</text>
    <text x="100" y="268" font-size="14" fill="#23261f" text-anchor="middle">no kids with them</text>
  </g>
  <!-- Nanny: slimmer body, thin horns that hook at the tip, with a kid -->
  <g transform="translate(212,40)">
    <ellipse cx="96" cy="114" rx="60" ry="34" fill="#f3ead8" stroke="#23261f" stroke-width="2"/>
    <rect x="56" y="140" width="11" height="40" fill="#f3ead8" stroke="#23261f" stroke-width="2"/>
    <rect x="78" y="144" width="11" height="36" fill="#f3ead8" stroke="#23261f" stroke-width="2"/>
    <rect x="112" y="144" width="11" height="36" fill="#f3ead8" stroke="#23261f" stroke-width="2"/>
    <rect x="134" y="140" width="11" height="40" fill="#f3ead8" stroke="#23261f" stroke-width="2"/>
    <path d="M46,98 L26,90 L18,104 L26,118 L46,120 Z" fill="#f3ead8" stroke="#23261f" stroke-width="2"/>
    <circle cx="32" cy="99" r="3" fill="#23261f"/>
    <circle cx="19" cy="106" r="2.5" fill="#23261f"/>
    <path d="M42,92 L50,70 C52,64 58,64 62,70" fill="none" stroke="#23261f" stroke-width="4" stroke-linecap="round"/>
    <!-- kid -->
    <ellipse cx="150" cy="150" rx="22" ry="14" fill="#f3ead8" stroke="#23261f" stroke-width="2"/>
    <path d="M130,146 L120,142 L117,150 L122,156 L130,156 Z" fill="#f3ead8" stroke="#23261f" stroke-width="2"/>
    <rect x="138" y="160" width="6" height="18" fill="#f3ead8" stroke="#23261f" stroke-width="2"/>
    <rect x="158" y="160" width="6" height="18" fill="#f3ead8" stroke="#23261f" stroke-width="2"/>
    <text x="150" y="134" font-size="13" fill="#6b4f35" text-anchor="middle">kid</text>
    <text x="96" y="196" font-size="14" fill="#23261f" text-anchor="middle">Horn thin at the base,</text>
    <text x="96" y="212" font-size="14" fill="#23261f" text-anchor="middle">straight, hooks at the tip</text>
    <text x="96" y="232" font-size="14" fill="#23261f" text-anchor="middle">Slimmer, 55 to 75 kg</text>
    <text x="96" y="252" font-size="14" fill="#23261f" text-anchor="middle">In groups with kids</text>
    <text x="96" y="268" font-size="14" fill="#23261f" text-anchor="middle">and yearlings</text>
  </g>
  <rect x="20" y="344" width="360" height="82" rx="8" fill="#f3ead8" stroke="#8a9a6b" stroke-width="2"/>
  <text x="200" y="368" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">A nanny with a kid is illegal to shoot.</text>
  <text x="200" y="390" font-size="14" fill="#23261f" text-anchor="middle">Horns look alike at a glance. Watch 10 minutes or more.</text>
  <text x="200" y="412" font-size="14" fill="#23261f" text-anchor="middle">Not sure it is a billy? Do not shoot.</text>
</svg>
