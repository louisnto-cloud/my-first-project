<text x="100" y="215" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">curves evenly all the way</text>
<text x="300" y="196" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Horn thin at the base,</text>
<text x="300" y="215" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">straight, hooks at the tip</text>
