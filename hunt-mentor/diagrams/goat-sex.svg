<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 494" font-family="sans-serif" role="img" aria-label="Mountain goat billy and nanny compared. Horn close ups: the billy horn is thick at the base and curves evenly all the way; the nanny horn is thin at the base, straight, and hooks at the tip. Bodies: the billy is heavier, 70 to 120 kg, and is alone or with 2 to 3 adults, no kids with them. The nanny is slimmer, 55 to 75 kg, and is in groups with kids and yearlings; a kid stands beside her. A nanny with a kid is illegal to shoot. Horns look alike at a glance: watch 10 minutes or more. Not sure it is a billy? Do not shoot.">
<rect width="400" height="494" fill="#fffaf0"/>
<text x="100" y="28" font-size="19" font-weight="bold" fill="#6b4f35" text-anchor="middle">Billy (male)</text>
<text x="300" y="28" font-size="19" font-weight="bold" fill="#2c5d86" text-anchor="middle">Nanny (female)</text>
