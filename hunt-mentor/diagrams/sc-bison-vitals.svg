<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A bison broadside. The hump is tall but holds no lungs. The lungs sit lower and farther forward than the hump suggests: aim behind the front leg, in the low third. Broadside only, no head or neck shots. A tip." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Bison: aim low behind the leg (Tip)</text>
<g transform="translate(220 160) scale(1.6)"><path d="M-50,26 L-52,58 M-36,28 L-36,58 M50,28 L52,58 M64,28 L66,58" stroke="#23261f" stroke-width="8" stroke-linecap="round"/><path d="M-60,-6 C-62,-40 -40,-66 -14,-62 C10,-58 30,-40 56,-30 C70,-26 76,-12 74,8 L72,30 L-56,30 Z" fill="#6b4a2b" stroke="#23261f" stroke-width="1.5"/><path d="M-58,-14 L-80,-6 L-86,18 L-74,30 L-56,22 Z" fill="#6b4a2b" stroke="#23261f" stroke-width="1.5"/><path d="M-66,-10 c-6 -8 2 -14 6 -10" fill="none" stroke="#111" stroke-width="3"/><circle cx="-72" cy="2" r="2" fill="#fff"/></g>
<ellipse cx="170" cy="180" rx="24" ry="20" fill="#e8590c" opacity="0.6"/>
<text x="330" y="66" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Hump: no lungs</text>
<line x1="300" y1="72" x2="248.9" y2="80.5" stroke="#2f3a2b" stroke-width="2"/><polygon points="240,82 249.7,85.4 248.1,75.6" fill="#2f3a2b"/>
<line x1="150" y1="250" x2="163.2" y2="210.5" stroke="#e8590c" stroke-width="2.5"/><polygon points="166,202 158.5,209.0 167.8,212.1" fill="#e8590c"/>
<text x="150" y="270" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Lungs: low, forward</text>
<text x="200" y="292" font-size="14" fill="#2f3a2b" text-anchor="middle">Broadside. No head or neck shots (Tip).</text>
</svg>
