<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Map sketch with the Scent cone tool. A hunter stands by the field edge. The wind blows toward the lower right, so the orange scent cone points away from the deer trail on the upper left. Caption: the trail is upwind of the cone, so the stand is good." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
