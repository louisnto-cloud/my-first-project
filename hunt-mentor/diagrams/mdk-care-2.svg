<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bird care step 2. Gloved hands, a no food and no drink sign, and a sick bird crossed out. Caption: gloves, no eating while you clean, leave sick birds."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Care 2: gloves on (bird flu)</text><rect x="60" y="60" width="120" height="150" rx="30" fill="#9cc3e4"/><text x="120" y="140" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Gloves</text><rect x="220" y="60" width="140" height="60" rx="8" fill="#dfe6d3"/><text x="290" y="96" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">No food, no drink</text><rect x="220" y="140" width="140" height="70" rx="8" fill="#dfe6d3"/><text x="290" y="172" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Sick bird?</text><text x="290" y="194" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Leave it, report</text><rect x="10" y="256" width="380" height="38" rx="8" fill="#2f3a2b"/><text x="200" y="281" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Gloves, no eating, wash up (75%)</text></svg>
