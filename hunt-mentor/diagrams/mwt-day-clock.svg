<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="24 hour clock with midnight at the top. Daylight is pale, night is dark. Orange bands show movement peaks around dawn, about 05:30 to 08:30, and dusk, about 16:00 to 19:30. In the middle of the day the deer is bedded. At night it feeds in fields." font-family="sans-serif">
