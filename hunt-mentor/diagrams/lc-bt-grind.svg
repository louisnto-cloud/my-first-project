<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 242" font-family="sans-serif" role="img" aria-label="Good burger in 4 steps: trim fat, silver skin, hair and bloodshot meat; chill the meat and grinder parts near freezing; grind, adding 0 to 20 percent pork or beef fat; cook ground game to 71 degrees Celsius with no pink. Deer fat is waxy and causes the gamey taste.">
<rect x="0" y="0" width="400" height="242" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Good burger in 4 steps</text><rect x="10" y="50" width="88" height="150" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(54 92) scale(1.1)"><path d="M-20 6 L6 -4 Q16 -8 20 -12 Q18 2 6 6 Z" fill="#cfd6bf" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-24" y="2" width="14" height="9" rx="3" fill="#8b5a2b" transform="rotate(-20 -17 6)"/></g><text x="54" y="142" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Trim</text><text x="54" y="164" font-size="13" fill="#23261f" text-anchor="middle">fat, silver</text><text x="54" y="180" font-size="13" fill="#23261f" text-anchor="middle">skin, hair</text><line x1="98" y1="125" x2="107.0" y2="125.0" stroke="#23261f" stroke-width="2" stroke-linecap="round"/><path d="M102.5 127.2 L107.0 125.0 L102.5 122.8" fill="none" stroke="#23261f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="107" y="50" width="88" height="150" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(151 92) scale(1.1)"><line x1="0" y1="0" x2="18.0" y2="0.0" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="0" x2="9.0" y2="15.6" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="0" x2="-9.0" y2="15.6" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="0" x2="-18.0" y2="0.0" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="0" x2="-9.0" y2="-15.6" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="0" x2="9.0" y2="-15.6" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/></g><text x="151" y="142" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Chill</text><text x="151" y="164" font-size="13" fill="#23261f" text-anchor="middle">meat and</text><text x="151" y="180" font-size="13" fill="#23261f" text-anchor="middle">grinder</text><line x1="195" y1="125" x2="204.0" y2="125.0" stroke="#23261f" stroke-width="2" stroke-linecap="round"/><path d="M199.5 127.2 L204.0 125.0 L199.5 122.8" fill="none" stroke="#23261f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="204" y="50" width="88" height="150" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(248 92) scale(1.1)"><path d="M-16 -16 h18 l-4 10 h-10 z" fill="#cfd6bf" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-14" y="-6" width="26" height="12" rx="3" fill="#cfd6bf" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 0 h8 v-10" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M-6 6 v8 M-1 6 v10 M4 6 v8" stroke="#c0504d" stroke-width="3"/></g><text x="248" y="142" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Grind</text><text x="248" y="164" font-size="13" fill="#23261f" text-anchor="middle">0 to 20%</text><text x="248" y="180" font-size="13" fill="#23261f" text-anchor="middle">pork fat</text><line x1="292" y1="125" x2="301.0" y2="125.0" stroke="#23261f" stroke-width="2" stroke-linecap="round"/><path d="M296.5 127.2 L301.0 125.0 L296.5 122.8" fill="none" stroke="#23261f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="301" y="50" width="88" height="150" rx="10" fill="#fff" stroke="#e8590c" stroke-width="2"/><g transform="translate(345 92) scale(1.1)"><rect x="-5" y="-20" width="10" height="30" rx="5" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="14" r="8" fill="#b3261e" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-2" y="-6" width="4" height="18" fill="#b3261e"/></g><text x="345" y="142" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Cook</text><text x="345" y="164" font-size="13" fill="#23261f" text-anchor="middle">71°C, no</text><text x="345" y="180" font-size="13" fill="#23261f" text-anchor="middle">pink</text><text x="200" y="226" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Deer fat is waxy. Trim it. That is the gamey taste.</text>
</svg>
