<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A hunter walks beside a creek toward the truck. The creek is a handrail, a line on the ground you can follow without looking at the compass.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#dfe6d3" stroke="none" stroke-width="2"/><path d="M0 220 C 100 200, 200 240, 400 190" fill="none" stroke="#4a7fb0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="20" y="250" font-family="sans-serif" font-size="15" fill="#4a7fb0" text-anchor="start" font-weight="bold">Creek: your handrail</text><g transform="translate(360 170)"><rect x="-22" y="-14" width="30" height="14" fill="#2f3a2b"/><path d="M8 -14 h10 l6 7 v7 h-16 Z" fill="#2f3a2b"/><circle cx="-12" cy="2" r="5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/><circle cx="14" cy="2" r="5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/></g><text x="350" y="150" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Truck</text><g transform="translate(50 190) scale(0.7)"><circle cx="0" cy="-30" r="7" fill="#2f3a2b"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" fill="none"/></g><path d="M60 185 C 150 175, 230 205, 330 170" fill="none" stroke="#e8590c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><text x="20" y="40" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Handrail: a line feature you follow</text><text x="20" y="62" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">Creek, road, fence, ridge, timber edge</text>
</svg>
