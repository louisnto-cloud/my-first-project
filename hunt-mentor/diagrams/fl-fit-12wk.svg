<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">12 weeks: minutes and pack load</text>
<rect x="34" y="160.0" width="22" height="90.0" rx="3" fill="#2f3a2b"/>
<text x="45" y="268" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">1</text>
<rect x="64" y="151.0" width="22" height="99.0" rx="3" fill="#2f3a2b"/>
<text x="75" y="268" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">2</text>
<rect x="94" y="142.0" width="22" height="108.0" rx="3" fill="#2f3a2b"/>
<text x="105" y="268" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">3</text>
<rect x="124" y="172.0" width="22" height="78.0" rx="3" fill="#8a9a6b"/>
<text x="135" y="268" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">4</text>
<rect x="154" y="142.0" width="22" height="108.0" rx="3" fill="#2f3a2b"/>
<text x="165" y="268" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">5</text>
<circle cx="165" cy="201" r="8" fill="#e8590c" stroke="#ffffff" stroke-width="2"/>
<text x="165" y="189" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e8590c" text-anchor="middle">5</text>
<rect x="184" y="130.0" width="22" height="120.0" rx="3" fill="#2f3a2b"/>
<text x="195" y="268" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">6</text>
