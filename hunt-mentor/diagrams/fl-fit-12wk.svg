<text x="225" y="162" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e8590c" text-anchor="middle">8</text>
<rect x="244" y="154.0" width="22" height="96.0" rx="3" fill="#8a9a6b"/>
<text x="255" y="268" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">8</text>
<circle cx="255" cy="201" r="8" fill="#e8590c" stroke="#ffffff" stroke-width="2"/>
<text x="255" y="189" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e8590c" text-anchor="middle">5</text>
<rect x="274" y="118.0" width="22" height="132.0" rx="3" fill="#2f3a2b"/>
