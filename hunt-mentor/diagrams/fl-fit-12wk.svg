<line x1="28" y1="250" x2="396" y2="250" stroke="#23261f" stroke-width="2" stroke-linecap="round"/>
<text x="200" y="290" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Week. Bars: minutes a week. Dots: pack kg</text>
<rect x="14" y="44" width="14" height="14" rx="2" fill="#8a9a6b"/><text x="34" y="56" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">Easy week</text>
<rect x="110" y="44" width="14" height="14" rx="2" fill="#2f3a2b"/><text x="130" y="56" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">Build week</text>
<circle cx="228" cy="51" r="7" fill="#e8590c"/><text x="240" y="56" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">Pack kg (80 kg person)</text>
</svg>
