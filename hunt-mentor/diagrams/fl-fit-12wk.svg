<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Bar chart of the 12 week plan. Minutes a week climb from 150 to 260, with easy weeks 4, 8 and 12. Pack load starts in week 5 at 5 kg and climbs to 16 kg by week 12 for an 80 kg person. Tip, Hunt Mentor plan.">
