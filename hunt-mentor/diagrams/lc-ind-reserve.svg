<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 312" font-family="sans-serif" role="img" aria-label="Flowchart. Does your route touch reserve land, to hunt on it or only to cross it? Indian Reserves are private land, synopsis page 9. Ask the band office first, in person and off season, as with any landowner. No yes means go around: crossing without permission is trespass.">
<rect x="0" y="0" width="400" height="312" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Reserve land: on or across</text><rect x="30" y="46" width="340" height="47" rx="8" fill="#e9eedd" stroke="#2f3a2b" stroke-width="2"/><text x="200.0" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Your route touches reserve land?</text><text x="200.0" y="86" font-size="14" fill="#23261f" text-anchor="middle">To hunt on it, or only to cross it</text><line x1="200.0" y1="95" x2="200.0" y2="113.0" stroke="#23261f" stroke-width="2.5" stroke-linecap="round"/><path d="M196.5 105.8 L200.0 113.0 L203.5 105.8" fill="none" stroke="#23261f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="115" width="340" height="47" rx="8" fill="#fde8d8" stroke="#e8590c" stroke-width="2"/><text x="200.0" y="137" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Reserves are private land</text><text x="200.0" y="155" font-size="14" fill="#23261f" text-anchor="middle">Synopsis page 9, 99%</text><line x1="200.0" y1="164" x2="200.0" y2="182.0" stroke="#23261f" stroke-width="2.5" stroke-linecap="round"/><path d="M196.5 174.8 L200.0 182.0 L203.5 174.8" fill="none" stroke="#23261f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="184" width="340" height="47" rx="8" fill="#e9eedd" stroke="#2f3a2b" stroke-width="2"/><text x="200.0" y="206" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Ask the band office first</text><text x="200.0" y="224" font-size="14" fill="#23261f" text-anchor="middle">In person, off season, like any landowner</text><line x1="200.0" y1="233" x2="200.0" y2="251.0" stroke="#23261f" stroke-width="2.5" stroke-linecap="round"/><path d="M196.5 243.8 L200.0 251.0 L203.5 243.8" fill="none" stroke="#23261f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="253" width="340" height="47" rx="8" fill="#e9eedd" stroke="#2f3a2b" stroke-width="2"/><text x="200.0" y="275" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">No yes? Go around</text><text x="200.0" y="293" font-size="14" fill="#23261f" text-anchor="middle">Crossing without permission is trespass</text>
</svg>
