<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" font-family="sans-serif" role="img" aria-label="Cards for Area A recreation sites with hunting among their first 3 listed activities, 90 percent. Near Heffley Creek: Community Lake Southwest and Sullivan Lake, Knouff, MU 3-27. Toward Sun Peaks: McGillivray Lake West and Morrisey Lake West. North and west: Pass Lake, MU 3-29; Fishtrap Creek, Dunsapie Lake and Gorman Lake, MU 3-28; Mayson Lake, MU 3-30. No shooting within 100 metres of camp structures.">
