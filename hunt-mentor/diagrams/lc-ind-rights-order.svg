<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 344" font-family="sans-serif" role="img" aria-label="Priority order when a resource is limited: first conservation, second Indigenous food, social and ceremonial harvest, third licensed hunters. From the Sparrow case of 1990 and synopsis page 6. The order for hunting is a reading of those sources, 85 percent.">
<rect x="0" y="0" width="400" height="344" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Who comes first when wildlife is short</text><rect x="20.0" y="50" width="360" height="64" rx="10" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="1"/><text x="200" y="78" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">1. Conservation</text><text x="200" y="100" font-size="15" fill="#fff" text-anchor="middle">The animals come first</text><line x1="200" y1="116" x2="200.0" y2="132.0" stroke="#23261f" stroke-width="2.5" stroke-linecap="round"/><path d="M196.5 124.8 L200.0 132.0 L203.5 124.8" fill="none" stroke="#23261f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="45.0" y="136" width="310" height="64" rx="10" fill="#4a7fb0" stroke="#4a7fb0" stroke-width="1"/><text x="200" y="164" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">2. Indigenous food, social and</text><text x="200" y="186" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">ceremonial harvest</text><line x1="200" y1="202" x2="200.0" y2="218.0" stroke="#23261f" stroke-width="2.5" stroke-linecap="round"/><path d="M196.5 210.8 L200.0 218.0 L203.5 210.8" fill="none" stroke="#23261f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="70.0" y="222" width="260" height="64" rx="10" fill="#8a9a6b" stroke="#8a9a6b" stroke-width="1"/><text x="200" y="250" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">3. Licensed hunters</text><text x="200" y="272" font-size="15" fill="#fff" text-anchor="middle">That is us</text><text x="200" y="314" font-size="13" fill="#6b4f35" text-anchor="middle">From the Sparrow case, 1990, and synopsis page 6.</text><text x="200" y="332" font-size="13" fill="#6b4f35" text-anchor="middle">This order is a reading: 85%.</text>
</svg>
