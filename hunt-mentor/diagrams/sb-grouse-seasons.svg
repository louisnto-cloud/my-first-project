<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 457" font-family="sans-serif" role="img" aria-label="Timeline chart of grouse and ptarmigan seasons, September to December, 99 percent. Region 3 grouse: youth only 1 to 9 September, then 10 September to 30 November, 5 of each kind, 10 total a day. Region 3 ptarmigan: 1 September to 30 November, 5 a day. Region 3 sharp tailed grouse in MUs (Management Units) 3-30 and 3-31 only: 10 September to 30 November, 5 a day, 10 in possession. Region 2 grouse: bow only 1 to 9 September, then 10 September to 15 December, 10 a day. Region 8 grouse: youth only 1 to 9 September, then 10 September to 30 November, bow only 1 to 10 December, 5 total a day. Pale bars: youth only or bow only.">
