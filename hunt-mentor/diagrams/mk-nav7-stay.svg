<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 256" font-family="sans-serif" role="img" aria-label="Stay or move?. You think you are lost. Stay put: This time, you want to be found. Move: Harder for search teams to find you. &quot;It's always harder for search teams to find you if you move&quot; (75%)..">
<rect width="400" height="256" rx="12" fill="#EEF1EA"/>
<text x="16" y="30" font-size="18" font-weight="bold" fill="#1F3D2B">Stay or move?</text>
<rect x="20" y="48" width="360" height="40" rx="10" fill="#1F3D2B"/><text x="200" y="74" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">You think you are lost</text>
<g data-tip="Stay put|&quot;It's always harder for search teams to find you if you move&quot; (75%)."><path d="M103.5 88 V121" stroke="#FF6A13" stroke-width="3" fill="none"/><path d="M103.5 128 l-6 -9 h12z" fill="#FF6A13"/><rect x="55.5" y="96" width="96" height="22" rx="11" fill="#FF6A13" stroke="#FF6A13" stroke-width="1.5"/><text x="103.5" y="112" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Stay put</text><rect x="12" y="132" width="183" height="58" rx="10" fill="#FFFFFF" stroke="#FF6A13" stroke-width="3.5"/><text x="103.5" y="156" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">This time, you want</text>
<text x="103.5" y="175" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">to be found</text></g>
<g data-tip="Move|AdventureSmart: moving &quot;more often than not&quot; puts you in a more dangerous situation (75%)."><path d="M296.5 88 V121" stroke="#1F3D2B" stroke-width="3" fill="none"/><path d="M296.5 128 l-6 -9 h12z" fill="#1F3D2B"/><rect x="248.5" y="96" width="96" height="22" rx="11" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="296.5" y="112" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Move</text><rect x="205" y="132" width="183" height="58" rx="10" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="296.5" y="156" font-size="15" fill="#17201A" text-anchor="middle">Harder for search</text>
<text x="296.5" y="175" font-size="15" fill="#17201A" text-anchor="middle">teams to find you</text></g>
<text x="16" y="212" font-size="14" fill="#1F3D2B">&quot;It's always harder for search teams to find you</text>
<text x="16" y="230" font-size="14" fill="#1F3D2B">if you move&quot; (75%).</text>
</svg>
