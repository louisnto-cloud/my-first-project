<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 4: write the escape bearing on your hand or map: the road is south, so walking 180 degrees always reaches the road, then you find the truck.">
<rect width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c"/><text x="26" y="31" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">4</text><text x="52" y="32" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Write the escape bearing</text><rect x="30" y="52" width="340" height="206" rx="2" fill="#dfe6d3" stroke="#8b5a2b" stroke-width="2"/><line x1="30" y1="238" x2="370" y2="238" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><path d="M330 52 C320 100 345 150 330 238" fill="none" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 80 C120 66 240 92 370 74" fill="none" stroke="#8b5a2b" stroke-width="5" stroke-dasharray="2 0" stroke-linecap="round" stroke-linejoin="round"/><line x1="70" y1="52" x2="70" y2="238" stroke="#7b6f9b" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"/><g transform="translate(200 236) scale(0.8)"><rect x="-22" y="-14" width="30" height="14" fill="#2f3a2b"/><path d="M8 -14 h10 l6 7 v7 h-16 Z" fill="#2f3a2b"/><circle cx="-12" cy="2" r="5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/><circle cx="14" cy="2" r="5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/></g><ellipse cx="124" cy="160" rx="40" ry="28" fill="none" stroke="#8b5a2b" stroke-width="1.6"/><ellipse cx="124" cy="160" rx="20" ry="14" fill="none" stroke="#8b5a2b" stroke-width="1.6"/><text x="200" y="255" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Baseline: the road</text><rect x="178" y="104" width="138" height="72" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="247" y="126" font-size="16" fill="#23261f" text-anchor="middle" font-weight="bold">Road is south:</text><text x="247" y="146" font-size="15" fill="#23261f" text-anchor="middle">walk 180, then</text><text x="247" y="166" font-size="15" fill="#23261f" text-anchor="middle">find truck</text><line x1="247" y1="178" x2="247" y2="221" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="247,231 252,221 242,221" fill="#e8590c"/>
</svg>
