<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 4: write the escape bearing on your hand or map: the road is south, so walking 180 degrees always reaches the road, then you find the truck.">
