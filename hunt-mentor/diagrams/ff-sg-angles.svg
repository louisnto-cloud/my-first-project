<line x1="330.0" y1="198" x2="330.0" y2="102.0" stroke="#2f3a2b" stroke-width="1.6" stroke-dasharray="2 3"/>
<circle cx="330.0" cy="102.0" r="16" fill="none" stroke="#e8590c" stroke-width="2.6"/>
<text x="330" y="256" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Incoming</text>
<text x="330" y="276" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">cover it,</text>
<text x="330" y="294" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">blot it out</text>
<line x1="20" y1="308" x2="44" y2="308" stroke="#e8590c" stroke-width="5" stroke-linecap="round"/><text x="52" y="313" font-size="14" fill="#2f3a2b">lead: aim ahead of the bird</text>
</svg>
