<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three birds and their paths relative to you. A crossing bird needs the most lead. A quartering bird needs about half. An incoming bird: swing up through it and cover it, blotting it out.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Lead depends on the angle</text><circle cx="200" cy="250" r="9" fill="#2f3a2b" stroke="none" stroke-width="2"/><text x="200" y="280" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">you</text><g transform="translate(60 90) scale(1.2)"><path d="M-16 0 Q -8 -10 0 0 Q 8 -10 16 0" fill="none" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="2" rx="5" ry="3" fill="#2f3a2b"/></g><line x1="60" y1="104" x2="120" y2="104" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><path d="M112.8 107.5 L120 104 L112.8 100.5" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="72" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Crossing</text><text x="60" y="130" font-size="13" fill="#23261f" text-anchor="middle">most lead</text><g transform="translate(320 70) scale(1.2)"><path d="M-16 0 Q -8 -10 0 0 Q 8 -10 16 0" fill="none" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="2" rx="5" ry="3" fill="#2f3a2b"/></g><line x1="320" y1="84" x2="284" y2="120" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><path d="M286.6 112.4 L284 120 L291.6 117.4" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="52" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Quartering</text><text x="320" y="140" font-size="13" fill="#23261f" text-anchor="middle">about half</text><g transform="translate(200 60) scale(1.2)"><path d="M-16 0 Q -8 -10 0 0 Q 8 -10 16 0" fill="none" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="2" rx="5" ry="3" fill="#2f3a2b"/></g><line x1="200" y1="74" x2="200" y2="114" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><path d="M196.5 106.8 L200 114 L203.5 106.8" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="42" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Incoming</text><text x="200" y="130" font-size="13" fill="#23261f" text-anchor="middle">cover it, blot it out</text>
</svg>
