<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 324" font-family="sans-serif" role="img" aria-label="Three birds and their paths relative to you, seen from above. A crossing bird needs the most lead: aim well ahead of it. A quartering bird needs about half. An incoming bird: swing up through it and cover it, blotting it out.">
<rect width="400" height="324" fill="#fffaf0"/>
<text x="200" y="27" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Lead depends on the angle</text>
<rect x="8" y="42" width="124" height="190" rx="8" fill="#e6eef4"/>
<circle cx="70.0" cy="206" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="2"/>
<text x="70" y="229" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">you</text>
<line x1="14.0" y1="128.0" x2="114.0" y2="128.0" stroke="#8aa0b4" stroke-width="2" stroke-dasharray="5 4"/><path d="M124.0 128.0 L114.0 133.0 L114.0 123.0z" fill="#8aa0b4"/>
<g transform="translate(38 106) rotate(90) scale(0.42)"><path d="M-9 -10 L-36 -16 L-80 6 L-46 10 L-9 12z M9 -10 L36 -16 L80 6 L46 10 L9 12z" fill="#6b5a48"/><ellipse cx="0" cy="4" rx="11" ry="25" fill="#8a7a62"/><ellipse cx="0" cy="-25" rx="7.5" ry="9" fill="#2e5e3a"/><path d="M-3.5 -32 Q0 -41 3.5 -32z" fill="#e0b631"/></g>
<line x1="70.0" y1="198" x2="104.0" y2="106.0" stroke="#2f3a2b" stroke-width="1.6" stroke-dasharray="2 3"/>
<line x1="38.0" y1="106.0" x2="104.0" y2="106.0" stroke="#e8590c" stroke-width="5" stroke-linecap="round" opacity=".85"/>
<circle cx="104.0" cy="106.0" r="7" fill="none" stroke="#e8590c" stroke-width="2.6"/><circle cx="104.0" cy="106.0" r="2" fill="#e8590c"/>
<text x="70" y="256" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Crossing</text>
<text x="70" y="276" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">most lead</text>
<rect x="138" y="42" width="124" height="190" rx="8" fill="#e6eef4"/>
<circle cx="200.0" cy="206" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="2"/>
<text x="200" y="229" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">you</text>
<line x1="152.0" y1="170.0" x2="243.3" y2="67.5" stroke="#8aa0b4" stroke-width="2" stroke-dasharray="5 4"/><path d="M250.0 60.0 L247.1 70.8 L239.6 64.1z" fill="#8aa0b4"/>
<g transform="translate(178 134) rotate(135) scale(0.42)"><path d="M-9 -10 L-36 -16 L-80 6 L-46 10 L-9 12z M9 -10 L36 -16 L80 6 L46 10 L9 12z" fill="#6b5a48"/><ellipse cx="0" cy="4" rx="11" ry="25" fill="#8a7a62"/><ellipse cx="0" cy="-25" rx="7.5" ry="9" fill="#2e5e3a"/><path d="M-3.5 -32 Q0 -41 3.5 -32z" fill="#e0b631"/></g>
<line x1="200.0" y1="198" x2="205.6" y2="104.3" stroke="#2f3a2b" stroke-width="1.6" stroke-dasharray="2 3"/>
<line x1="178.0" y1="134.0" x2="205.6" y2="104.3" stroke="#e8590c" stroke-width="5" stroke-linecap="round" opacity=".85"/>
<circle cx="205.6" cy="104.3" r="7" fill="none" stroke="#e8590c" stroke-width="2.6"/><circle cx="205.6" cy="104.3" r="2" fill="#e8590c"/>
<text x="200" y="256" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Quartering</text>
<text x="200" y="276" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">about half</text>
<rect x="268" y="42" width="124" height="190" rx="8" fill="#e6eef4"/>
<circle cx="330.0" cy="206" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="2"/>
<text x="330" y="229" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">you</text>
<line x1="352.0" y1="56.0" x2="352.0" y2="152.0" stroke="#8aa0b4" stroke-width="2" stroke-dasharray="5 4"/><path d="M352.0 162.0 L347.0 152.0 L357.0 152.0z" fill="#8aa0b4"/>
<g transform="translate(330.0 100) rotate(180) scale(0.42)"><path d="M-9 -10 L-36 -16 L-80 6 L-46 10 L-9 12z M9 -10 L36 -16 L80 6 L46 10 L9 12z" fill="#6b5a48"/><ellipse cx="0" cy="4" rx="11" ry="25" fill="#8a7a62"/><ellipse cx="0" cy="-25" rx="7.5" ry="9" fill="#2e5e3a"/><path d="M-3.5 -32 Q0 -41 3.5 -32z" fill="#e0b631"/></g>
<line x1="330.0" y1="198" x2="330.0" y2="100.0" stroke="#2f3a2b" stroke-width="1.6" stroke-dasharray="2 3"/>
<circle cx="330.0" cy="100.0" r="16" fill="none" stroke="#e8590c" stroke-width="2.6"/>
<text x="330" y="256" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Incoming</text>
<text x="330" y="276" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">cover it,</text>
<text x="330" y="294" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">blot it out</text>
<line x1="20" y1="308" x2="44" y2="308" stroke="#e8590c" stroke-width="5" stroke-linecap="round"/><text x="52" y="313" font-size="14" fill="#2f3a2b">lead: aim ahead of the bird</text>
</svg>
