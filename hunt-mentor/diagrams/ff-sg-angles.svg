<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 324" font-family="sans-serif" role="img" aria-label="Three birds and their paths relative to you, seen from above. A crossing bird needs the most lead: aim well ahead of it. A quartering bird needs about half. An incoming bird: swing up through it and cover it, blotting it out.">
<rect width="400" height="324" fill="#fffaf0"/>
<text x="200" y="27" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Lead depends on the angle</text>
<rect x="8" y="42" width="124" height="190" rx="8" fill="#e6eef4"/>
<circle cx="70.0" cy="206" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="2"/>
<text x="70" y="229" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">you</text>
<line x1="14.0" y1="112.0" x2="122.0" y2="112.0" stroke="#8aa0b4" stroke-width="2" stroke-dasharray="5 4"/><path d="M132.0 112.0 L122.0 117.0 L122.0 107.0z" fill="#8aa0b4"/>
<g transform="translate(38 112) rotate(90) scale(0.42)"><path d="M-9 -10 L-36 -16 L-80 6 L-46 10 L-9 12z M9 -10 L36 -16 L80 6 L46 10 L9 12z" fill="#6b5a48"/><ellipse cx="0" cy="4" rx="11" ry="25" fill="#8a7a62"/><ellipse cx="0" cy="-25" rx="7.5" ry="9" fill="#2e5e3a"/><path d="M-3.5 -32 Q0 -41 3.5 -32z" fill="#e0b631"/></g>
<line x1="70.0" y1="198" x2="106.0" y2="112.0" stroke="#2f3a2b" stroke-width="1.6" stroke-dasharray="2 3"/>
<line x1="52.0" y1="112.0" x2="106.0" y2="112.0" stroke="#e8590c" stroke-width="5" stroke-linecap="round" opacity=".85"/>
<circle cx="106.0" cy="112.0" r="7" fill="none" stroke="#e8590c" stroke-width="2.6"/><circle cx="106.0" cy="112.0" r="2" fill="#e8590c"/>
<text x="70" y="256" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Crossing</text>
<text x="70" y="276" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">most lead</text>
<rect x="138" y="42" width="124" height="190" rx="8" fill="#e6eef4"/>
<circle cx="200.0" cy="206" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="2"/>
<text x="200" y="229" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">you</text>
<line x1="143.7" y1="170.3" x2="242.7" y2="71.3" stroke="#8aa0b4" stroke-width="2" stroke-dasharray="5 4"/><path d="M249.8 64.2 L246.2 74.8 L239.2 67.8z" fill="#8aa0b4"/>
<g transform="translate(172 142) rotate(45) scale(0.42)"><path d="M-9 -10 L-36 -16 L-80 6 L-46 10 L-9 12z M9 -10 L36 -16 L80 6 L46 10 L9 12z" fill="#6b5a48"/><ellipse cx="0" cy="4" rx="11" ry="25" fill="#8a7a62"/><ellipse cx="0" cy="-25" rx="7.5" ry="9" fill="#2e5e3a"/><path d="M-3.5 -32 Q0 -41 3.5 -32z" fill="#e0b631"/></g>
<line x1="200.0" y1="198" x2="200.3" y2="113.7" stroke="#2f3a2b" stroke-width="1.6" stroke-dasharray="2 3"/>
<line x1="181.9" y1="132.1" x2="200.3" y2="113.7" stroke="#e8590c" stroke-width="5" stroke-linecap="round" opacity=".85"/>
<circle cx="200.3" cy="113.7" r="7" fill="none" stroke="#e8590c" stroke-width="2.6"/><circle cx="200.3" cy="113.7" r="2" fill="#e8590c"/>
<text x="200" y="256" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Quartering</text>
<text x="200" y="276" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">about half</text>
<rect x="268" y="42" width="124" height="190" rx="8" fill="#e6eef4"/>
<circle cx="330.0" cy="206" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="2"/>
<text x="330" y="229" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">you</text>
<line x1="330.0" y1="62.0" x2="330.0" y2="182.0" stroke="#8aa0b4" stroke-width="2" stroke-dasharray="5 4"/><path d="M330.0 192.0 L325.0 182.0 L335.0 182.0z" fill="#8aa0b4"/>
