  <path d="M62 128 C62 122 70 116 80 112 L98 102 C104 98 112 98 116 104 C128 118 148 138 160 146 C150 160 146 172 144 184 C138 168 118 150 100 138 C92 136 80 134 70 134 L62 130z" fill="#5a3f2a" stroke="#3a2818" stroke-width="1.6" stroke-linejoin="round"/><path d="M184 250 L186 298 L196 296 L194 246z M316 250 L320 298 L330 296 L326 246z" fill="#4a3324"/><path d="M316 150 C334 150 344 170 342 196 C336 214 324 214 318 200 C312 184 310 162 316 150z" fill="#ead6a6"/><path d="M110 102 C116 86 126 76 134 72 C134 86 126 100 116 106z" fill="#5a3f2a" stroke="#3a2818" stroke-width="1.4"/><circle cx="90" cy="114" r="2.6" fill="#120b06"/><ellipse cx="64" cy="126" rx="3.4" ry="2.6" fill="#120b06"/><path d="M106 100 C112 70 132 44 168 28 M110 86 C96 80 84 74 76 64 M114 76 C102 66 96 56 94 46 M126 58 C120 44 120 34 124 22 M146 40 C146 28 150 18 156 10" fill="none" stroke="#6b4f35" stroke-width="6" stroke-linecap="round"/><path d="M106 100 C112 70 132 44 168 28 M110 86 C96 80 84 74 76 64 M114 76 C102 66 96 56 94 46 M126 58 C120 44 120 34 124 22 M146 40 C146 28 150 18 156 10" fill="none" stroke="#ecdfc3" stroke-width="3.2" stroke-linecap="round"/>
<path d="M172 158 C196 150 232 150 250 162 C258 178 246 202 222 210 C204 214 184 210 174 196 C166 184 166 168 172 158z" fill="#e9a3a0" fill-opacity=".9" stroke="#b55b57" stroke-width="1.4"/>
<path d="M186 198 C186 190 194 188 198 194 C202 188 210 190 208 200 C206 208 198 214 196 216 C192 212 186 206 186 198z" fill="#8e2a2a" stroke="#5e1717" stroke-width="1"/>
<circle cx="204" cy="188" r="7" fill="#e8590c" stroke="#fffaf0" stroke-width="2"/><path d="M204 178 v20 M194 188 h20" stroke="#fffaf0" stroke-width="1.6"/>
