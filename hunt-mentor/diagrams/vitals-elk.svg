<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" font-family="sans-serif">
<rect x="0" y="0" width="400" height="640" fill="#fffaf0"/>
<text x="200" y="24" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Elk: where to aim</text>
<g transform="translate(0,34)"><rect x="6" y="2" width="388" height="186" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">1  Broadside: best</text><rect x="209" y="116" width="10" height="34" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="302" y="116" width="10" height="34" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><path d="M208 68 L188 46 L192 62 L200 101 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="182" cy="52" rx="18" ry="9" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M191 45 L198 32 L200 47 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><circle cx="169" cy="52" r="2.2" fill="#23261f"/><path d="M186 45 C191 32 207 25 227 29 M189 38 L182 27 M198 30 L196 20 M211 27 L213 18" fill="none" stroke="#6b4f35" stroke-width="3.1" stroke-linecap="round"/><ellipse cx="262" cy="95" rx="76" ry="31" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="317" cy="97" rx="17" ry="22" fill="#fffaf0" fill-opacity="0.7" stroke="none"/><rect x="216" y="116" width="10" height="34" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="311" y="116" width="10" height="34" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="232" cy="97" rx="19" ry="19" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><circle cx="224" cy="109" r="7" fill="#6b4f35" stroke="#23261f" stroke-width="1.5"/><circle cx="229" cy="101" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="224" y1="101" x2="234" y2="101" stroke="#fffaf0" stroke-width="2"/><line x1="229" y1="96" x2="229" y2="106" stroke="#fffaf0" stroke-width="2"/><text x="245" y="106" font-size="14" font-weight="bold" fill="#e8590c">aim</text><text x="16" y="166" font-size="14" fill="#23261f">One third to one half up, centre of the lungs.</text><text x="16" y="183" font-size="14" fill="#23261f">Shoulder blade is thick and sits back. Aim lungs.</text></g>
<g transform="translate(0,228)"><rect x="6" y="2" width="388" height="186" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">2  Quartering away: good</text><rect x="231" y="110" width="9" height="31" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="242" y="112" width="9" height="31" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="199" cy="54" rx="16" ry="8" fill="#2f3a2b" stroke="#23261f" stroke-width="2.5"/><path d="M207 48 L214 36 L215 49 Z" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><circle cx="188" cy="54" r="2.0" fill="#23261f"/><path d="M202 48 C207 36 222 30 239 33 M206 41 L199 32 M214 35 L212 25 M225 32 L226 24" fill="none" stroke="#6b4f35" stroke-width="2.8" stroke-linecap="round"/><path d="M233 70 L207 50 L209 62 L227 99 Z" fill="#2f3a2b" stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="272" cy="95" rx="55" ry="31" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="302" cy="101" rx="23" ry="29" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><rect x="288" y="118" width="11" height="34" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="306" y="120" width="11" height="34" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="254" cy="97" rx="15" ry="19" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><line x1="271" y1="104" x2="229" y2="90" stroke="#23261f" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="229" cy="90" r="5" fill="#23261f"/><text x="225" y="112" font-size="13" fill="#23261f" text-anchor="end">far shoulder</text><circle cx="271" cy="104" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="266" y1="104" x2="276" y2="104" stroke="#fffaf0" stroke-width="2"/><line x1="271" y1="99" x2="271" y2="109" stroke="#fffaf0" stroke-width="2"/><text x="287" y="109" font-size="14" font-weight="bold" fill="#e8590c">aim</text><text x="388" y="54" font-size="13" fill="#23261f" text-anchor="end">rump toward you</text><text x="16" y="166" font-size="14" fill="#23261f">Aim at the far shoulder. Stay off the paunch.</text><text x="16" y="183" font-size="14" fill="#23261f">Both lungs, or the bull goes a long way.</text></g>
<g transform="translate(0,422)"><rect x="6" y="2" width="388" height="186" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">3  Quartering to: experienced only</text><rect x="228" y="112" width="9" height="31" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="297" y="110" width="9" height="31" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="272" cy="95" rx="55" ry="31" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="238" cy="99" rx="20" ry="29" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M242 66 L215 42 L219 60 L239 105 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="205" cy="48" rx="21" ry="10" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M216 40 L224 25 L226 42 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><circle cx="191" cy="48" r="2.6" fill="#23261f"/><path d="M209 40 C216 25 235 16 258 21 M214 31 L205 19 M224 23 L222 10 M239 19 L241 8" fill="none" stroke="#6b4f35" stroke-width="3.7" stroke-linecap="round"/><rect x="238" y="118" width="11" height="34" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="306" y="116" width="10" height="34" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="256" cy="97" rx="15" ry="19" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><line x1="240" y1="100" x2="286" y2="100" stroke="#23261f" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="240" cy="100" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="235" y1="100" x2="245" y2="100" stroke="#fffaf0" stroke-width="2"/><line x1="240" y1="95" x2="240" y2="105" stroke="#fffaf0" stroke-width="2"/><text x="254" y="90" font-size="14" font-weight="bold" fill="#e8590c">aim</text><rect x="306" y="30" width="78" height="24" rx="5" fill="#e8590c"/><text x="345" y="47" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">WAIT</text><text x="16" y="166" font-size="14" fill="#23261f">Point of the near shoulder, heavy bullet only.</text><text x="16" y="183" font-size="14" fill="#23261f">Beginner: wait for broadside.</text></g>
<text x="200" y="634" font-size="13" fill="#6b4f35" text-anchor="middle">Shaded: lungs. Dark: heart. Orange: aim point. Not to scale.</text>
</svg>
