<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" font-family="sans-serif">
<rect x="0" y="0" width="400" height="620" fill="#fffaf0"/>
<text x="200" y="24" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Elk: where to aim</text>
<g transform="translate(0,34)"><rect x="6" y="2" width="388" height="182" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">1  Broadside: best</text><rect x="162" y="108" width="12" height="54" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="272" y="108" width="12" height="54" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><path d="M157 50 L135 10 L139 26 L149 88 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="129" cy="16" rx="24" ry="12" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M139 8 L147 -6 L149 10 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><circle cx="111" cy="16" r="2.5" fill="#23261f"/><path d="M133 6 C139 -14 159 -24 181 -20 M137 -6 L127 -18 M147 -16 L145 -30 M161 -21 L163 -34" fill="none" stroke="#6b4f35" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="225" cy="82" rx="90" ry="36" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="290" cy="84" rx="20" ry="25" fill="#fffaf0" fill-opacity="0.7" stroke="none"/><rect x="171" y="108" width="12" height="54" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="283" y="108" width="12" height="54" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="189" cy="84" rx="22" ry="22" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><circle cx="180" cy="98" r="8" fill="#6b4f35" stroke="#23261f" stroke-width="1.5"/><circle cx="185" cy="89" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="180" y1="89" x2="190" y2="89" stroke="#fffaf0" stroke-width="2"/><line x1="185" y1="84" x2="185" y2="94" stroke="#fffaf0" stroke-width="2"/><text x="201" y="94" font-size="14" font-weight="bold" fill="#e8590c">aim</text><text x="16" y="160" font-size="14" fill="#23261f">One third to one half up, centre of the lungs.</text><text x="16" y="177" font-size="14" fill="#23261f">Shoulder blade is thick and sits back. Aim lungs.</text></g>
<g transform="translate(0,222)"><rect x="6" y="2" width="388" height="182" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">2  Quartering away: good</text><rect x="186" y="102" width="11" height="49" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="199" y="104" width="11" height="49" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="150" cy="20" rx="20" ry="10" fill="#2f3a2b" stroke="#23261f" stroke-width="2.5"/><path d="M159 13 L166 1 L167 15 Z" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><circle cx="135" cy="20" r="2.1" fill="#23261f"/><path d="M154 12 C159 -6 176 -14 194 -11 M157 1 L148 -9 M166 -7 L164 -19 M177 -11 L179 -22" fill="none" stroke="#6b4f35" stroke-width="3.0" stroke-linecap="round"/><path d="M186 52 L158 16 L160 28 L180 86 Z" fill="#2f3a2b" stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="235" cy="82" rx="65" ry="36" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="271" cy="88" rx="27" ry="34" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><rect x="254" y="110" width="13" height="54" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="275" y="112" width="13" height="54" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="214" cy="84" rx="18" ry="22" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><line x1="234" y1="92" x2="184" y2="77" stroke="#23261f" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="184" cy="77" r="5" fill="#23261f"/><text x="178" y="67" font-size="13" fill="#23261f" text-anchor="end">far shoulder</text><circle cx="234" cy="92" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="229" y1="92" x2="239" y2="92" stroke="#fffaf0" stroke-width="2"/><line x1="234" y1="87" x2="234" y2="97" stroke="#fffaf0" stroke-width="2"/><text x="250" y="97" font-size="14" font-weight="bold" fill="#e8590c">aim</text><text x="304" y="126" font-size="13" fill="#23261f">rump near you</text><text x="16" y="160" font-size="14" fill="#23261f">Aim at the far shoulder. Stay off the paunch.</text><text x="16" y="177" font-size="14" fill="#23261f">Both lungs, or the bull goes a long way.</text></g>
<g transform="translate(0,410)"><rect x="6" y="2" width="388" height="182" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">3  Quartering to: experienced only</text><rect x="183" y="104" width="11" height="49" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="264" y="102" width="11" height="49" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="235" cy="82" rx="65" ry="36" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="195" cy="86" rx="23" ry="34" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M199 48 L166 6 L170 24 L196 92 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="156" cy="12" rx="28" ry="14" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M168 3 L177 -13 L179 5 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><circle cx="136" cy="12" r="2.9" fill="#23261f"/><path d="M161 0 C168 -22 191 -34 216 -29 M165 -13 L154 -27 M177 -25 L175 -41 M193 -31 L195 -45" fill="none" stroke="#6b4f35" stroke-width="4.0" stroke-linecap="round"/><rect x="195" y="110" width="13" height="54" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="275" y="108" width="12" height="54" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="216" cy="84" rx="18" ry="22" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><line x1="197" y1="87" x2="251" y2="87" stroke="#23261f" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="197" cy="87" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="192" y1="87" x2="202" y2="87" stroke="#fffaf0" stroke-width="2"/><line x1="197" y1="82" x2="197" y2="92" stroke="#fffaf0" stroke-width="2"/><text x="211" y="77" font-size="14" font-weight="bold" fill="#e8590c">aim</text><text x="304" y="126" font-size="13" fill="#23261f">chest near you</text><rect x="300" y="30" width="84" height="24" rx="5" fill="#e8590c"/><text x="342" y="47" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">WAIT</text><text x="16" y="160" font-size="14" fill="#23261f">Point of the near shoulder, heavy bullet only.</text><text x="16" y="177" font-size="14" fill="#23261f">Beginner: wait for broadside.</text></g>
<text x="200" y="612" font-size="13" fill="#6b4f35" text-anchor="middle">Shaded: lungs. Dark circle: heart. Orange dot: aim point. Not to scale.</text>
</svg>
