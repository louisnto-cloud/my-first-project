<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 558" font-family="sans-serif" role="img" aria-label="Bull elk, broadside, drawn with the lungs and heart shown through the body: lungs behind the front leg, the heart low between the front legs. Aim one third to one half up the chest, the centre of the lungs. The shoulder blade is thick and sits back: aim for the lungs. Below, three top views: broadside is best; quartering away is good, aim at the far shoulder and stay off the paunch, take both lungs or the bull goes a long way; quartering to is for experienced hunters only, the point of the near shoulder with a heavy bullet only, beginners wait for broadside.">
<rect width="400" height="558" fill="#fffaf0"/>
<defs>
