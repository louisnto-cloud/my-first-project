<line x1="236" y1="166" x2="282" y2="128" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="236" cy="166" r="2.6" fill="#2f3a2b"/><text x="286" y="126" font-size="16" font-weight="bold" fill="#2f3a2b">lungs</text><line x1="196" y1="208" x2="232" y2="264" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="196" cy="208" r="2.6" fill="#2f3a2b"/><text x="236" y="276" font-size="16" font-weight="bold" fill="#2f3a2b">heart</text><line x1="149" y1="191" x2="128" y2="232" stroke="#2f3a2b" stroke-width="1.2"/><text x="112" y="250" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1/3 to 1/2 up</text>
<line x1="204" y1="182" x2="286.0" y2="56" stroke="#e8590c" stroke-width="1.6"/>
<rect x="160" y="8" width="232" height="48" rx="6" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/>
<text x="172" y="30" font-size="16" font-weight="bold" fill="#e8590c">AIM: one third to one half</text>
<text x="172" y="49" font-size="16" font-weight="bold" fill="#e8590c">up, centre of the lungs</text>
<g transform="translate(0 -26)"><!-- angle cards, top view -->
  <g font-size="14" text-anchor="middle" fill="#2f3a2b">
    <rect x="12" y="358" width="120" height="122" rx="8" fill="#f2ecdd" stroke="#c9bb9c"/>
    <text x="72" y="377" font-weight="bold">Broadside</text><text x="72" y="394" fill="#2f6e3b" font-weight="bold">best</text>
    <use href="#vitals-elk-top" transform="translate(80 422)"/>
    <line x1="68" y1="472" x2="68" y2="433" stroke="#2f3a2b" stroke-width="1.8"/><line x1="68" y1="433" x2="68" y2="411" stroke="#2f3a2b" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle cx="68" cy="433" r="4" fill="#e8590c"/>
    <rect x="140" y="358" width="120" height="122" rx="8" fill="#f2ecdd" stroke="#c9bb9c"/>
    <text x="200" y="377" font-weight="bold">Quartering away</text><text x="200" y="394" fill="#2f6e3b" font-weight="bold">good</text>
    <use href="#vitals-elk-top" transform="translate(212 428) rotate(35)"/>
    <line x1="201" y1="472" x2="201" y2="433" stroke="#2f3a2b" stroke-width="1.8"/><line x1="201" y1="433" x2="201" y2="409" stroke="#2f3a2b" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle cx="201" cy="433" r="4" fill="#e8590c"/><circle cx="201" cy="409" r="3" fill="#2f3a2b"/>
    <rect x="268" y="358" width="120" height="122" rx="8" fill="#f2ecdd" stroke="#c9bb9c"/>
    <text x="328" y="377" font-weight="bold">Quartering to</text><text x="328" y="394" fill="#c0392b" font-weight="bold">experienced only</text>
    <use href="#vitals-elk-top" transform="translate(344 414) rotate(-35)"/>
    <line x1="333" y1="472" x2="333" y2="433" stroke="#2f3a2b" stroke-width="1.8"/>
    <circle cx="333" cy="433" r="4" fill="#e8590c"/>
    <rect x="336" y="446" width="48" height="22" rx="4" fill="#c0392b"/><text x="360" y="462" fill="#fffaf0" font-weight="bold" font-size="14">WAIT</text>
  </g>
  </g>
<text x="200" y="472" font-size="15" fill="#2f3a2b" text-anchor="middle">Shoulder blade is thick, sits back: aim lungs</text>
<text x="200" y="493" font-size="15" fill="#2f3a2b" text-anchor="middle">Away: far shoulder. Stay off the paunch.</text>
<text x="200" y="514" font-size="15" fill="#2f3a2b" text-anchor="middle">Both lungs, or the bull goes a long way.</text>
<text x="200" y="535" font-size="15" fill="#2f3a2b" text-anchor="middle">To: point of near shoulder, heavy bullet only</text>
</svg>
