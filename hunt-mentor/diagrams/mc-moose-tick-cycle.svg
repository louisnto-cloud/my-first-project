<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 316" font-family="sans-serif" role="img" aria-label="Year wheel of the winter tick on moose. Larvae climb onto moose from mid September to mid October, during the rut. They take a blood meal in October, rest, feed again in January, and adult females engorge in March and April, then drop to the ground to lay eggs. One tick life cycle on one moose.">
<rect x="0" y="0" width="400" height="316" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Winter tick year</text><circle cx="200" cy="136" r="82" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="3"/><circle cx="200" cy="136" r="40" fill="#fffaf0" stroke="#8a9a6b"/><path d="M128.5 155.2 A74 74 0 0 1 128.5 116.8" stroke="#e8590c" stroke-width="14" fill="none"/><path d="M264.1 99.0 A74 74 0 0 1 264.1 173.0" stroke="#c0392b" stroke-width="14" fill="none"/><path d="M128.5 116.8 A74 74 0 0 1 200.0 62.0" stroke="#c9a77a" stroke-width="14" fill="none"/><path d="M200.0 62.0 A74 74 0 0 1 264.1 99.0" stroke="#c9a77a" stroke-width="14" fill="none"/><text x="225.88190451025207" y="44.407417371093175" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Jan</text><text x="270.71067811865476" y="70.28932188134526" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Feb</text><text x="296.5925826289068" y="115.11809548974793" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Mar</text><text x="296.5925826289068" y="166.88190451025207" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Apr</text><text x="270.71067811865476" y="211.71067811865476" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">May</text><text x="225.88190451025207" y="237.59258262890683" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Jun</text><text x="174.11809548974793" y="237.59258262890683" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Jul</text><text x="129.28932188134524" y="211.71067811865476" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Aug</text><text x="103.40741737109317" y="166.8819045102521" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Sep</text><text x="103.40741737109317" y="115.11809548974792" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Oct</text><text x="129.28932188134524" y="70.28932188134526" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Nov</text><text x="174.11809548974793" y="44.407417371093175" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Dec</text><text x="200" y="132" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Winter</text><text x="200" y="150" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">tick</text><rect x="20" y="250" width="14" height="14" fill="#e8590c"/><text x="42" y="262" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Mid Sep to mid Oct: larvae climb on</text><rect x="20" y="272" width="14" height="14" fill="#c9a77a"/><text x="42" y="284" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Oct to Mar: feed, rest, feed</text><rect x="20" y="294" width="14" height="14" fill="#c0392b"/><text x="42" y="306" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Mar to Apr: adults engorge, drop</text>
