<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Prone on a bipod. Lean your shoulder gently forward into the rifle so the bipod legs are loaded, and use the same pressure every shot.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bipod: load it forward</text><line x1="20" y1="232" x2="380" y2="232" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round"/><circle cx="100" cy="196" r="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3.5"/><path d="M108 204 L40 224" fill="none" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="90" y1="194" x2="330" y2="186" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/><line x1="260" y1="190" x2="248" y2="230" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round"/><line x1="260" y1="190" x2="272" y2="230" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round"/><line x1="140" y1="160" x2="230" y2="160" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><path d="M221.9 163.9 L230 160 L221.9 156.1" fill="none" stroke="#e8590c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="186" y="150" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">lean gently in</text><text x="200" y="270" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Same pressure every shot</text>
</svg>
