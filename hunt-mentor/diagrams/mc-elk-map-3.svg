<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Phone sketch of the slope steepness tool. Gentle benches of 15 to 30 percent, used most by elk, in green. Steep ground past 40 to 50 percent, used far less, in red.">
<rect width="400" height="300" fill="#fffaf0"/>
<rect x="90" y="36" width="220" height="256" rx="16" fill="#f4ecdc" stroke="#23261f" stroke-width="2"/><rect x="90" y="36" width="220" height="30" rx="16" fill="#2f3a2b"/><rect x="90" y="52" width="220" height="14" rx="0" fill="#2f3a2b"/><text x="200" y="57" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Slope steepness</text><path d="M104 270 L150 230 L250 214 L296 110 L296 270 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><line x1="150" y1="230" x2="250" y2="214" stroke="#3a9a4a" stroke-width="7"/><line x1="250" y1="214" x2="296" y2="110" stroke="#b03a2e" stroke-width="7"/><text x="200" y="200" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">15 to 30%: used most</text><text x="225" y="104" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Past 40 to 50%:</text><text x="225" y="122" font-size="14" fill="#23261f" text-anchor="middle">used far less</text>
</svg>
