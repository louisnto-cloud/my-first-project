<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Heat stroke step 4: fluids only if fully awake and able to swallow, sitting up. No aspirin or acetaminophen for the fever.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4. Sips only if alert</text><rect x="0" y="230" width="400" height="70" rx="0" fill="#dfe6d3"/><line x1="170" y1="214" x2="196" y2="214" stroke="#2f3a2b" stroke-width="7.700000000000001" stroke-linecap="round"/><line x1="196" y1="214" x2="199" y2="234" stroke="#2f3a2b" stroke-width="7.700000000000001" stroke-linecap="round"/><rect x="159" y="177" width="22" height="37" rx="6.6000000000000005" fill="#e8590c"/><circle cx="170" cy="166" r="11.0" fill="#d9b48f"/><rect x="206" y="160" width="20" height="32" rx="4" fill="#4a7fb0"/><line x1="311" y1="111" x2="329" y2="129" stroke="#c0392b" stroke-width="5.0" stroke-linecap="round"/><line x1="329" y1="111" x2="311" y2="129" stroke="#c0392b" stroke-width="5.0" stroke-linecap="round"/><text x="320" y="160" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">No pills</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Awake? Sip. Not awake? Nothing</text>
</svg>
