<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Boil step 1: if the water is cloudy, let it settle and pour it through a cloth first.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1. Clear it first</text><rect x="155" y="160" width="90" height="60" rx="6" fill="#9a9a8f" stroke="#2f3a2b" stroke-width="2"/><line x1="141" y1="170" x2="155" y2="170" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round"/><line x1="245" y1="170" x2="259" y2="170" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round"/><path d="M120 90 L180 150" fill="none" stroke="#c8a46a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="150" y="120" width="100" height="14" rx="3" fill="#ffffff" stroke="#9a9a8f" stroke-width="1"/><text x="300" y="110" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cloth or</text><text x="300" y="130" font-size="15" fill="#2f3a2b" text-anchor="middle">coffee filter</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cloudy? Cloth first</text>
</svg>
