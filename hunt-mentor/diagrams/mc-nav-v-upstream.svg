<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Contours make a V up a creek</text><rect x="30" y="44" width="340" height="210" rx="4" fill="#dfe6d3"/><path d="M40 90 L200 45 L360 90" fill="none" stroke="#8b5a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 130 L200 85 L360 130" fill="none" stroke="#8b5a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 170 L200 125 L360 170" fill="none" stroke="#8b5a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 210 L200 165 L360 210" fill="none" stroke="#8b5a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 250 L200 50" fill="none" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="250" y1="230" x2="250.0" y2="90.0" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="250.0,80.0 245.0,90.0 255.0,90.0" fill="#e8590c"/><text x="262" y="160" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Uphill</text><text x="205" y="268" font-size="15" fill="#23261f" text-anchor="middle">The V points upstream, toward higher ground</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">USGS map symbols guide (95%)</text>
