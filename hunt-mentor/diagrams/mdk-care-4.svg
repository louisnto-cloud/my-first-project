<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bird care step 4. A thermometer at 74 degrees Celsius and a labelled freezer bag. Caption: food safety line 74 degrees; label and freeze."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Care 4: cook and store</text><rect x="80" y="50" width="24" height="170" rx="12" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><rect x="86" y="110" width="12" height="106" rx="6" fill="#c0392b"/><text x="140" y="116" font-size="18" fill="#c0392b" text-anchor="start" font-weight="bold">74 °C</text><text x="140" y="140" font-size="15" fill="#2f3a2b" text-anchor="start">(165 °F)</text><rect x="240" y="80" width="130" height="120" rx="8" fill="#e8f1f8" stroke="#2f3a2b" stroke-width="2"/><text x="305" y="120" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Mallard x2</text><text x="305" y="144" font-size="14" fill="#2f3a2b" text-anchor="middle">14 Oct 2026</text><text x="305" y="168" font-size="14" fill="#2f3a2b" text-anchor="middle">MU 3-27</text><rect x="10" y="256" width="380" height="38" rx="8" fill="#2f3a2b"/><text x="200" y="281" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">USDA safe line: 74 °C. Label, freeze.</text></svg>
