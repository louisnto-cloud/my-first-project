<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Browning Invector choke notch code from the Citori manual. Rim notches name the choke for lead shot; with steel the same tube patterns one step tighter. Full and extra full: not for steel.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Notches: lead versus steel</text>
<rect x="12" y="44" width="376" height="30" rx="4" fill="#1F3D2B"/>
<text x="24.0" y="65.0" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="start">Notches</text>
<text x="130.0" y="65.0" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="start">With lead</text>
<text x="268.0" y="65.0" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="start">With steel</text>
<rect x="12" y="80" width="376" height="28" rx="4" fill="#ffffff" stroke="#FF6A13" stroke-width="2"/>
<text x="24.0" y="100.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="start">I</text>
<text x="130.0" y="100.0" font-size="15" fill="#17201A" text-anchor="start">Full</text>
<text x="268.0" y="100.0" font-size="15" font-weight="bold" fill="#FF6A13" text-anchor="start">Not for steel</text>
<rect x="12" y="112" width="376" height="28" rx="4" fill="#ffffff" stroke="#1F3D2B" stroke-width="1"/>
<text x="24.0" y="132.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="start">II</text>
<text x="130.0" y="132.0" font-size="15" fill="#17201A" text-anchor="start">Improved mod</text>
<text x="268.0" y="132.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="start">Full</text>
<rect x="12" y="144" width="376" height="28" rx="4" fill="#ffffff" stroke="#1F3D2B" stroke-width="1"/>
<text x="24.0" y="164.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="start">III</text>
<text x="130.0" y="164.0" font-size="15" fill="#17201A" text-anchor="start">Modified</text>
<text x="268.0" y="164.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="start">Full</text>
<rect x="12" y="176" width="376" height="28" rx="4" fill="#ffffff" stroke="#1F3D2B" stroke-width="1"/>
<text x="24.0" y="196.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="start">IIII</text>
<text x="130.0" y="196.0" font-size="15" fill="#17201A" text-anchor="start">Improved cyl</text>
<text x="268.0" y="196.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="start">Modified</text>
<rect x="12" y="208" width="376" height="28" rx="4" fill="#ffffff" stroke="#1F3D2B" stroke-width="1"/>
<text x="24.0" y="228.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="start">IIIII</text>
<text x="130.0" y="228.0" font-size="15" fill="#17201A" text-anchor="start">Skeet</text>
<text x="268.0" y="228.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="start">Improved cyl</text>
<rect x="12" y="240" width="376" height="28" rx="4" fill="#ffffff" stroke="#1F3D2B" stroke-width="1"/>
<text x="24.0" y="260.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="start">none</text>
<text x="130.0" y="260.0" font-size="15" fill="#17201A" text-anchor="start">Cylinder</text>
<text x="268.0" y="260.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="start">Cylinder</text>
<text x="200.0" y="290.0" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Browning Invector. Your maker may differ.</text>
</svg>
