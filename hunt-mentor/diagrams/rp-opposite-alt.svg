<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two twigs. Left, opposite leaves: leaves grow in pairs, face to face, on a red stem. Right, alternate leaves: one leaf at a time, zig zagging up the stem.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Opposite or alternate leaves?</text><rect x="10" y="40" width="185" height="230" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><rect x="205" y="40" width="185" height="230" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="102" y="64" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">Opposite</text><text x="297" y="64" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">Alternate</text><line x1="102" y1="250" x2="102" y2="80" stroke="#a0453a" stroke-width="4"/><ellipse cx="72" cy="110" rx="26" ry="10" fill="#5d8a3a" transform="rotate(-20 72 110)"/><ellipse cx="132" cy="110" rx="26" ry="10" fill="#5d8a3a" transform="rotate(20 132 110)"/><ellipse cx="72" cy="160" rx="26" ry="10" fill="#5d8a3a" transform="rotate(-20 72 160)"/><ellipse cx="132" cy="160" rx="26" ry="10" fill="#5d8a3a" transform="rotate(20 132 160)"/><ellipse cx="72" cy="210" rx="26" ry="10" fill="#5d8a3a" transform="rotate(-20 72 210)"/><ellipse cx="132" cy="210" rx="26" ry="10" fill="#5d8a3a" transform="rotate(20 132 210)"/><line x1="297" y1="250" x2="297" y2="80" stroke="#6b4f35" stroke-width="4"/><ellipse cx="267" cy="100" rx="26" ry="10" fill="#5d8a3a" transform="rotate(-20 267 100)"/><ellipse cx="327" cy="135" rx="26" ry="10" fill="#5d8a3a" transform="rotate(20 327 135)"/><ellipse cx="267" cy="170" rx="26" ry="10" fill="#5d8a3a" transform="rotate(-20 267 170)"/><ellipse cx="327" cy="205" rx="26" ry="10" fill="#5d8a3a" transform="rotate(20 327 205)"/><ellipse cx="267" cy="240" rx="26" ry="10" fill="#5d8a3a" transform="rotate(-20 267 240)"/><text x="102" y="290" font-size="14" fill="#2f3a2b" text-anchor="middle">pairs, face to face</text><text x="297" y="290" font-size="14" fill="#2f3a2b" text-anchor="middle">one at a time, zig zag</text>
</svg>
