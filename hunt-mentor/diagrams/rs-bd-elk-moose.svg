<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 306" font-family="sans-serif" role="img" aria-label="Bed sizes. Deer: 0.9 to 1.2 metres, singles or small groups. Elk: 1.2 to 1.5 metres, many beds in a herd, wallows nearby. Moose: bigger, size to verify, often alone near willow and water. In deep snow elk and moose pick shallow spots.">
<rect x="0" y="0" width="400" height="306" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Deer, elk, moose beds</text>
<rect x="10" y="64" width="380" height="64" rx="8" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="24" y="90" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="start">Deer</text><text x="110" y="90" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">0.9 to 1.2 m (70%)</text><text x="110" y="112" font-size="14" fill="#23261f" text-anchor="start">singles or small groups</text><rect x="10" y="136" width="380" height="64" rx="8" fill="#f3f1e6" stroke="#dfe6d3" stroke-width="1.5"/><text x="24" y="162" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="start">Elk</text><text x="110" y="162" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">1.2 to 1.5 m (65%)</text><text x="110" y="184" font-size="14" fill="#23261f" text-anchor="start">herd: many beds, wallows near</text><rect x="10" y="208" width="380" height="64" rx="8" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="24" y="234" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="start">Moose</text><text x="110" y="234" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">bigger: VERIFY</text><text x="110" y="256" font-size="14" fill="#23261f" text-anchor="start">often alone, willow, water</text><text x="200" y="296" font-size="14" fill="#6b4f35" text-anchor="middle">Elk and moose in snow pick shallow spots (70%)</text>
</svg>
