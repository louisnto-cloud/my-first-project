<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 516" font-family="sans-serif" role="img" aria-label="Ethics: rules 11 to 18. Rule 11: Have to ask? Today it is not legal. Rule 12: Clean kill or no shot. Rule 13: Pack out yours and some more. Rule 14: Meat first, antlers second. Also law. Rule 15: Gates as you found them. Rule 16: Ask once, thank twice. Rule 17: Report what you see: RAPP, Report All Poachers and Polluters. Rule 18: Name it, count points, sex it. Also law. Rules without the law badge are wisdom, not law.">
