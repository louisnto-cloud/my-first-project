<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 292" font-family="sans-serif" role="img" aria-label="Bar chart of calories per kilogram of wild fruit: huckleberry about 366, blackberry about 430, chokecherry about 549. In fall a bear may eat up to 20,000 calories a day, which is about 55 kg of huckleberries.">
<rect width="400" height="292" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Why bears eat all day in fall</text><text x="132" y="74" font-size="15" fill="#2f3a2b" text-anchor="end">Huckleberry</text><rect x="140" y="50" width="97.6" height="30" rx="4" fill="#2c3e6b"/><text x="243.6" y="74" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">366 kcal/kg</text><text x="132" y="118" font-size="15" fill="#2f3a2b" text-anchor="end">Blackberry</text><rect x="140" y="94" width="114.66666666666667" height="30" rx="4" fill="#3d2a4a"/><text x="260.6666666666667" y="118" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">430 kcal/kg</text><text x="132" y="162" font-size="15" fill="#2f3a2b" text-anchor="end">Chokecherry</text><rect x="140" y="138" width="146.4" height="30" rx="4" fill="#6b1f2a"/><text x="292.4" y="162" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">549 kcal/kg</text><rect x="14" y="186" width="372" height="70" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="200" y="212" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Up to 20,000 calories a day in fall</text><text x="200" y="238" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">That is about 55 kg of huckleberries</text><text x="200.0" y="284" font-size="14" fill="#6b4f35" text-anchor="middle">Bear and berry figures via news (65 to 70%); my maths</text>
</svg>
