<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Meat math for one bull elk weighed at each stage in a University of Wyoming study, in kilograms: whole 258; field dressed 181, about 70 percent; skinned carcass 151; boneless meat 75, about half of field dressed weight. Averages: bulls 198 kg field dressed gave 99 kg boneless; cows 154 kg gave 77 kg.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Meat math: a bull, in kilograms</text><text x="132" y="68.2" font-size="14" fill="#23261f" text-anchor="end">Whole elk</text><rect x="140.0" y="50" width="160.0" height="26" rx="4" fill="#8b5a2b"/><text x="306.0" y="68.2" font-size="14" fill="#23261f" text-anchor="start">258</text><text x="132" y="108.2" font-size="14" fill="#23261f" text-anchor="end">Field dressed</text><rect x="140.0" y="90" width="112.2" height="26" rx="4" fill="#8b5a2b"/><text x="258.2" y="108.2" font-size="14" fill="#23261f" text-anchor="start">181 (70%)</text><text x="132" y="148.2" font-size="14" fill="#23261f" text-anchor="end">Skinned carcass</text><rect x="140.0" y="130" width="93.6" height="26" rx="4" fill="#8b5a2b"/><text x="239.6" y="148.2" font-size="14" fill="#23261f" text-anchor="start">151</text><text x="132" y="188.2" font-size="14" fill="#23261f" text-anchor="end">Boneless meat</text><rect x="140.0" y="170" width="46.5" height="26" rx="4" fill="#e8590c"/><text x="192.5" y="188.2" font-size="14" fill="#23261f" text-anchor="start">75 (50% of dressed)</text><text x="200" y="230" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Wyoming average, field dressed to boneless:</text><text x="200" y="250" font-size="14" fill="#23261f" text-anchor="middle">Bull 198 to 99 kg. Cow 154 to 77 kg</text><text x="200" y="272" font-size="14" fill="#6b4f35" text-anchor="middle">One Wyoming bull, weighed at each stage</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">University of Wyoming bulletin (85%)</text>
</svg>
