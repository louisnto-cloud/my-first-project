<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Foot step 4: test before you commit. If it is quiet, put your full weight on it. If something cracks, lift the foot and move it."><rect width="400" height="300" fill="#fffaf0"/><rect x="0" y="230" width="400" height="70" fill="#c9b79c"/><g fill="#8a9a6b"><ellipse cx="60" cy="232" rx="20" ry="5"/><ellipse cx="330" cy="232" rx="24" ry="5"/></g><g transform="translate(150 226) rotate(0)"><path d="M0 0 L0 -70 L34 -70 L40 -30 L90 -22 C 104 -18, 104 0, 92 0 Z" fill="#6b4f35"/><rect x="-2" y="-4" width="96" height="8" rx="3" fill="#2f3a2b"/></g><path d="M196 110 L196 150" stroke="#2f3a2b" stroke-width="5"/><polygon points="186,146 206,146 196,162" fill="#2f3a2b"/><text x="210" y="120" font-size="16" font-weight="bold" fill="#2f6e3b">quiet? then</text><text x="210" y="140" font-size="16" font-weight="bold" fill="#2f6e3b">full weight</text><text x="70" y="120" font-size="16" font-weight="bold" fill="#c0392b">crack?</text><text x="70" y="140" font-size="16" font-weight="bold" fill="#c0392b">lift, move</text><text x="200" y="30" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4. Test, then weight</text><text x="200" y="272" font-size="15" fill="#2f3a2b" text-anchor="middle">Heel, roll, test: then the next step (65%)</text></svg>
