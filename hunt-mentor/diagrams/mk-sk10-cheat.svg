<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1617" font-family="sans-serif" role="img" aria-label="Hunting skills cheat sheet. Exit pupil: front lens ÷ power; 8x42 = 5.25 mm (85%). Glassing seat: 1 hour, then again (65%). Glassing order: near first or far first: your call (65%). Look for: back line, ear, legs, flicker (65%). Measure tracks: floor, not rim; average 3 to 5 (80%). Deer bed: 0.9 to 1.2 m oval (70%). Scrape branch: 1.2 to 1.5 m up (65%). Rain pits inside: made before the rain (70%). Thermals: up after sun hits, down as shade comes (75%). Upslope speed: 5 to 13 km/h (75%). Forecast wind: at head height 50 to 70% (90%). Still hunt pace: 2 or 3 steps, look 20 s (Tip). Deer colour: 2 cones, blue pops, orange dull (75%). Tree stand falls: 60% climbing or getting in (70%). Suspension trauma: under 20 minutes (80%). Electronic calls: wolf, coyote, cougar, lynx, bobcat, Schedule C birds only (99%). Coyote wind: in your face or crosswind: your call (65%). .308 drop, 100 m zero: 13 cm at 200, 28 at 250, 48 at 300 m (75%). .308 drift, 20 km/h: 17 cm at 200, 27 at 250, 40 at 300 m (75%). Wind angle: 3 or 9 o'clock full, 45° 70% (85%). Steep shot: hold for flat distance; 30° = × 0.87 (95%). Steadiest: prone, sitting, kneeling, standing (85%). Mil ranging: metres × 1,000 ÷ mils (85%). Aim: behind front leg, 1/3 up (85%). Vital zone: 20 to 25 cm (75%). Duck range, steel: 35 m (38 yd) (70%). Pattern: 100 pellets in 76 cm (70%). Zone of fire: about 45° (75%). Wait: lungs: 30 minutes (70%). Wait: liver: hours; sources give 2 to 10 (your call) (70%). Wait: gut: longest; sources give 4 to 12 (your call) (70%). Grid lanes: about 10 m apart (70%). Retrieval: all reasonable effort (95%). Guts out: within the hour (80%). Meat: below 4°C; danger 4 to 60°C (80%). Cook game: 71°C (95%). Game bags: 4 deer, 8 moose (80%). Tourniquet: 5 to 8 or 5 to 10 cm: your call (70 to 75%). Lost: STOP; doubt means stay (75%). Help: 911, then satellite SOS (75 to 85%).">
