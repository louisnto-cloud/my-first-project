<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three mule deer buck heads from the front. Yearling: most have 2 points a side. Two years: big forks or 3 points. Three years and older: 4, 5 or more points plus a small eye guard. Points are a poor age guide; body and teeth tell more.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Age a buck by antlers (rough)</text><path d="M60 175 L56 145 M56 145 L48 127 M56 145 L66 129" fill="none" stroke="#6b4f35" stroke-width="4"/><path d="M80 175 L84 145 M84 145 L92 127 M84 145 L74 129" fill="none" stroke="#6b4f35" stroke-width="4"/><ellipse cx="70" cy="191" rx="16" ry="20" fill="#8b5a2b"/><path d="M56 179 L34 169 L54 189 Z" fill="#8b5a2b"/><path d="M84 179 L106 169 L86 189 Z" fill="#8b5a2b"/><text x="70" y="230" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Yearling</text><text x="70" y="250" font-size="14" fill="#23261f" text-anchor="middle">Most: 2 points</text><text x="70" y="267" font-size="14" fill="#23261f" text-anchor="middle">a side</text><path d="M190 175 L182 139 L168 109 M182 139 L196 111 M168 109 L160 95" fill="none" stroke="#6b4f35" stroke-width="4"/><path d="M210 175 L218 139 L232 109 M218 139 L204 111 M232 109 L240 95" fill="none" stroke="#6b4f35" stroke-width="4"/><ellipse cx="200" cy="191" rx="16" ry="20" fill="#8b5a2b"/><path d="M186 179 L164 169 L184 189 Z" fill="#8b5a2b"/><path d="M214 179 L236 169 L216 189 Z" fill="#8b5a2b"/><text x="200" y="230" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">2 years</text><text x="200" y="250" font-size="14" fill="#23261f" text-anchor="middle">Big forks</text><text x="200" y="267" font-size="14" fill="#23261f" text-anchor="middle">or 3 points</text><path d="M320 175 L310 135 L294 105 M310 135 L326 105 M294 105 L284 83 M294 105 L302 81 M326 105 L320 81 M326 105 L334 83 M317 163 L310 153" fill="none" stroke="#6b4f35" stroke-width="4"/><path d="M340 175 L350 135 L366 105 M350 135 L334 105 M366 105 L376 83 M366 105 L358 81 M334 105 L340 81 M334 105 L326 83 M343 163 L350 153" fill="none" stroke="#6b4f35" stroke-width="4"/><ellipse cx="330" cy="191" rx="16" ry="20" fill="#8b5a2b"/><path d="M316 179 L294 169 L314 189 Z" fill="#8b5a2b"/><path d="M344 179 L366 169 L346 189 Z" fill="#8b5a2b"/><text x="330" y="230" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">3 years plus</text><text x="330" y="250" font-size="14" fill="#23261f" text-anchor="middle">4, 5 or more</text><text x="330" y="267" font-size="14" fill="#23261f" text-anchor="middle">plus eye guard</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Points are a poor age guide. Body and teeth tell more (90%)</text>
</svg>
