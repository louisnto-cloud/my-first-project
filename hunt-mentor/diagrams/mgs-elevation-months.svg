<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 294" font-family="sans-serif" role="img" aria-label="Chart of goose elevation by month, April to December. In spring most nest below 500 metres, 85 percent. In late summer and fall some flocks use higher plateau lakes, a Tip. In November and December those lakes freeze first and the birds crowd down to open valley rivers and the coast, 75 percent. The line shows where flocks gather, not a measured value.">
<rect width="400" height="294" fill="#fffaf0"/>
<text x="14" y="28" font-size="17" font-weight="bold" fill="#2f3a2b">High water freezes first: geese drop down</text>
<rect x="58" y="84" width="328" height="76.0" fill="#e9eef2"/>
<rect x="58" y="160.0" width="328" height="76.0" fill="#eef0e4"/>
<path d="M58 78 V236 H386" stroke="#2f3a2b" stroke-width="2" fill="none"/>
<text x="52" y="98" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">High</text>
<text x="52" y="232" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">Low</text>
<path d="M72.0 236 v5" stroke="#2f3a2b" stroke-width="1.5"/>
<text x="72" y="256" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Apr</text>
<path d="M132.0 236 v5" stroke="#2f3a2b" stroke-width="1.5"/>
<text x="132" y="256" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Jun</text>
<path d="M192.0 236 v5" stroke="#2f3a2b" stroke-width="1.5"/>
<text x="192" y="256" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Aug</text>
<path d="M252.0 236 v5" stroke="#2f3a2b" stroke-width="1.5"/>
<text x="252" y="256" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Oct</text>
<path d="M312.0 236 v5" stroke="#2f3a2b" stroke-width="1.5"/>
<text x="312" y="256" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Nov</text>
<path d="M372.0 236 v5" stroke="#2f3a2b" stroke-width="1.5"/>
<text x="372" y="256" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Dec</text>
<path d="M72.0 200 C112.0 190 152.0 158 192.0 120 S232.0 104 252.0 112 S302.0 158 312.0 168 S360.0 210 372.0 214" stroke="#e8590c" stroke-width="4" fill="none" stroke-linecap="round"/>
<line x1="86" y1="196" x2="108" y2="149" stroke="#6b5b4b" stroke-width="1.4"/><circle cx="86" cy="196" r="2.6" fill="#6b5b4b"/>
<rect x="64.0" y="104.0" width="154.6" height="45.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="141.299" y="123" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Nest mostly</text>
<text x="141.299" y="140.5" font-size="14" fill="#2f3a2b" text-anchor="middle">below 500 m (85%)</text>
<line x1="218" y1="114" x2="218" y2="69" stroke="#6b5b4b" stroke-width="1.4"/><circle cx="218" cy="114" r="2.6" fill="#6b5b4b"/>
<rect x="119.8" y="42.0" width="204.4" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="222" y="61" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Plateau lakes in fall (Tip)</text>
<line x1="320" y1="180" x2="271.774" y2="196" stroke="#6b5b4b" stroke-width="1.4"/><circle cx="320" cy="180" r="2.6" fill="#6b5b4b"/>
<rect x="271.8" y="182.0" width="112.2" height="45.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="327.887" y="201" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Valley rivers,</text>
<text x="327.887" y="219" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">coast (75%)</text>
<text x="14" y="282" font-size="14" fill="#6b5b4b">Line shows where flocks gather, not a measured value.</text>
</svg>
