<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Chart of goose elevation by month. In spring most nest below 500 metres, 85 percent. In late summer and fall some flocks use higher plateau lakes, a Tip. In November and December those lakes freeze first and the birds crowd down to open valley rivers and the coast, 75 percent. The line shows where flocks gather, not a measured value.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">High water freezes first: geese drop down</text><line x1="60" y1="50" x2="60" y2="250" stroke="#2f3a2b" stroke-width="2"/><line x1="60" y1="250" x2="385" y2="250" stroke="#2f3a2b" stroke-width="2"/><text x="30" y="70" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">High</text><text x="30" y="245" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Low</text><text x="85" y="270" font-size="14" fill="#23261f" text-anchor="middle">Apr</text><text x="143" y="270" font-size="14" fill="#23261f" text-anchor="middle">Jun</text><text x="201" y="270" font-size="14" fill="#23261f" text-anchor="middle">Aug</text><text x="259" y="270" font-size="14" fill="#23261f" text-anchor="middle">Oct</text><text x="317" y="270" font-size="14" fill="#23261f" text-anchor="middle">Nov</text><text x="375" y="270" font-size="14" fill="#23261f" text-anchor="middle">Dec</text><path d="M85 180 Q140 150 200 120 Q260 115 290 150 Q320 210 375 228" stroke="#e8590c" stroke-width="5" fill="none"/><text x="130" y="135" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Nest mostly</text><text x="130" y="151" font-size="14" fill="#23261f" text-anchor="middle">below 500 m (85%)</text><text x="240" y="96" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Plateau lakes</text><text x="240" y="112" font-size="14" fill="#23261f" text-anchor="middle">in fall (Tip)</text><text x="320" y="186" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Valley rivers,</text><text x="320" y="202" font-size="14" fill="#23261f" text-anchor="middle">coast (75%)</text><text x="200" y="292" font-size="14" fill="#2f3a2b" text-anchor="middle">Line shows where flocks gather, not a measured value</text>
</svg>
