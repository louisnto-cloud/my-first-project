<circle cx="26.0" cy="309.0" r="13" fill="#2f3a2b" stroke="#fffaf0" stroke-width="1.5"/><text x="26" y="314" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text>
<text x="44" y="314" font-size="16" font-weight="bold" fill="#2f3a2b">Plateau lakes in fall (Tip)</text>
<circle cx="26.0" cy="335.0" r="13" fill="#2f3a2b" stroke="#fffaf0" stroke-width="1.5"/><text x="26" y="340" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">3</text>
