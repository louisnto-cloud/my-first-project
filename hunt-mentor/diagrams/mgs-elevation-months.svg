<circle cx="222.0" cy="96.0" r="13" fill="#2f3a2b" stroke="#fffaf0" stroke-width="1.5"/><text x="222" y="101" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text>
<circle cx="342.0" cy="140.0" r="13" fill="#2f3a2b" stroke="#fffaf0" stroke-width="1.5"/><text x="342" y="145" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">3</text>
