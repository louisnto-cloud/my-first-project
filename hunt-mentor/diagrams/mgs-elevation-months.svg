<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="sans-serif" role="img" aria-label="Chart of goose elevation by month, April to December. In spring most nest below 500 metres, 85 percent. In late summer and fall some flocks use higher plateau lakes, a Tip. In November and December those lakes freeze first and the birds crowd down to open valley rivers and the coast, 75 percent. The line shows where flocks gather, not a measured value.">
<rect width="400" height="380" fill="#fffaf0"/>
<text x="14" y="28" font-size="17" font-weight="bold" fill="#2f3a2b">High water freezes first: geese drop down</text>
