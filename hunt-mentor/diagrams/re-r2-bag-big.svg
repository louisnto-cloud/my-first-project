<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 362" role="img" aria-label="Grid: Region 2 bag limits: big game and furbearers. Mountain goat: 1. Black bear, per licence year: ★ 2. Wolf: 3. Coyote: NBL. Raccoon, skunk: NBL. Snowshoe hare (Daily): 10. Bobcat: 1. Cougar: 2." font-family="sans-serif">
<rect x="0" y="0" width="400" height="362" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Region 2 bag limits: big game and</text>
<text x="200" y="47" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">furbearers</text>
<text x="200" y="68" font-size="14" fill="#8b5a2b" text-anchor="middle">Page 28. NBL means No Bag Limit.</text>
<rect x="6.0" y="90" width="124.0" height="88" rx="9" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
<text x="68.0" y="124" font-size="26" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1</text>
<text x="68.0" y="148" font-size="14" fill="#23261f" text-anchor="middle">Mountain goat</text>
