<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Grid of hunter injuries: gunshot, press, pack or tourniquet, then 911 and keep warm. Knife slip, press hard, then flush and cover. Fall, do not move the neck, then splint and shelter. Rolled ankle, sit, cool and wrap, then the 4 step test.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Three hunter injuries, one plan</text><rect x="10" y="44" width="120" height="50" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="70" y="74" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Injury</text><rect x="130" y="44" width="140" height="50" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="200" y="74" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">First move</text><rect x="270" y="44" width="120" height="50" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="330" y="74" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Then</text><rect x="10" y="94" width="120" height="50" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="70" y="124" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Gunshot</text><rect x="130" y="94" width="140" height="50" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="200" y="124" font-size="14" fill="#2f3a2b" text-anchor="middle">Press, pack, TQ</text><rect x="270" y="94" width="120" height="50" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="330" y="124" font-size="14" fill="#2f3a2b" text-anchor="middle">911, warm</text><rect x="10" y="144" width="120" height="50" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="70" y="174" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Knife slip</text><rect x="130" y="144" width="140" height="50" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="200" y="174" font-size="14" fill="#2f3a2b" text-anchor="middle">Press hard</text><rect x="270" y="144" width="120" height="50" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="330" y="174" font-size="14" fill="#2f3a2b" text-anchor="middle">Flush, cover</text><rect x="10" y="194" width="120" height="50" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="70" y="224" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fall</text><rect x="130" y="194" width="140" height="50" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="200" y="224" font-size="14" fill="#2f3a2b" text-anchor="middle">Do not move neck</text><rect x="270" y="194" width="120" height="50" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="330" y="224" font-size="14" fill="#2f3a2b" text-anchor="middle">Splint, shelter</text><rect x="10" y="244" width="120" height="50" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="70" y="274" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Rolled ankle</text><rect x="130" y="244" width="140" height="50" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="200" y="274" font-size="14" fill="#2f3a2b" text-anchor="middle">Sit, cool, wrap</text><rect x="270" y="244" width="120" height="50" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="330" y="274" font-size="14" fill="#2f3a2b" text-anchor="middle">4 step test</text>
</svg>
