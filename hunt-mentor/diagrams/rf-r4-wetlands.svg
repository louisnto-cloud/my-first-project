<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 272" role="img" aria-label="Four cards for the Columbia Wetlands Wildlife Management Area, Management Units 4-25, 4-26, 4-34 and 4-35. Nothing powered by a motor over 10 horsepower. Exempt: boats on navigable parts of the Columbia River, and six named roads and rights of way. Map D21 adds: no boats with electric or gas powered engines in the wetlands, and no towing in the main channel." font-family="sans-serif">
<rect x="0" y="0" width="400" height="272" fill="#fffaf0"/>
<text x="200" y="26" font-size="16" fill="#23261f" text-anchor="middle" font-weight="bold">Columbia Wetlands Wildlife Management Area</text>
<rect x="6" y="40" width="190" height="96" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<path d="M6 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#4a7fb0"/>
<text x="101" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Over 10 horsepower</text>
<path d="M14.0 96 h32 l-6 8 h-20 z" fill="#8b5a2b"/><rect x="40.0" y="88" width="6" height="9" fill="#2f3a2b"/><path d="M12.0 108 q6 -4 12 0 t12 0 t12 0" fill="none" stroke="#4a7fb0" stroke-width="2"/>
<circle cx="30.0" cy="96" r="18" fill="none" stroke="#c92a2a" stroke-width="3"/><line x1="17.0" y1="109" x2="43.0" y2="83" stroke="#c92a2a" stroke-width="3"/>
<text x="52" y="88" font-size="14" fill="#23261f" text-anchor="start">Nothing with a</text>
<text x="52" y="106" font-size="14" fill="#23261f" text-anchor="start">motor over 10</text>
<text x="52" y="124" font-size="14" fill="#23261f" text-anchor="start">horsepower</text>
<rect x="204" y="40" width="190" height="96" rx="10" fill="#ffffff" stroke="#5c7a3a" stroke-width="2.5"/>
<path d="M204 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#5c7a3a"/>
<text x="299" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Exempt</text>
<path d="M212.0 96 h32 l-6 8 h-20 z" fill="#8b5a2b"/><rect x="238.0" y="88" width="6" height="9" fill="#2f3a2b"/><path d="M210.0 108 q6 -4 12 0 t12 0 t12 0" fill="none" stroke="#4a7fb0" stroke-width="2"/>
<text x="250" y="88" font-size="14" fill="#23261f" text-anchor="start">Boats on navigable</text>
<text x="250" y="106" font-size="14" fill="#23261f" text-anchor="start">parts of the</text>
<text x="250" y="124" font-size="14" fill="#23261f" text-anchor="start">Columbia River</text>
<rect x="6" y="144" width="190" height="114" rx="10" fill="#ffffff" stroke="#5c7a3a" stroke-width="2.5"/>
<path d="M6 154 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#5c7a3a"/>
<text x="101" y="162" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Exempt roads</text>
<text x="14" y="192" font-size="14" fill="#23261f" text-anchor="start">Six named roads and</text>
<text x="14" y="210" font-size="14" fill="#23261f" text-anchor="start">rights of way, Radium</text>
<text x="14" y="228" font-size="14" fill="#23261f" text-anchor="start">to Golden</text>
<rect x="204" y="144" width="190" height="114" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<path d="M204 154 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#4a7fb0"/>
<text x="299" y="162" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Map D21</text>
<text x="212" y="192" font-size="14" fill="#23261f" text-anchor="start">No electric or gas</text>
<text x="212" y="210" font-size="14" fill="#23261f" text-anchor="start">powered boats in the</text>
<text x="212" y="228" font-size="14" fill="#23261f" text-anchor="start">wetlands. No towing in</text>
<text x="212" y="246" font-size="14" fill="#23261f" text-anchor="start">the main channel</text>
</svg>
