<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Top view of a stand spot. Bedding brush of willow and cottonwood along the top. A main trail runs from the brush down into the hay field. The wind blows from the field side across the trail toward you, so you sit downwind of the trail, back from the field edge. You walk in from the far side and never through the bedding brush.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Where to sit, seen from above</text><rect x="0" y="40" width="400" height="260" fill="#e3d38a" opacity=".5"/><path d="M0 40 L400 40 L400 120 Q300 140 200 116 Q100 100 0 130 Z" fill="#8a9a6b" opacity=".8"/><text x="10" y="66" font-size="14" font-weight="bold" fill="#fff" text-anchor="start">Bedding brush: willow, cottonwood</text><text x="250" y="280" font-size="16" font-weight="bold" fill="#8b6a00" text-anchor="start">Hay field</text><path d="M180 118 Q170 170 210 210 Q240 240 236 296" fill="none" stroke="#8b5a2b" stroke-width="7" opacity=".7"/><text x="214" y="176" font-size="14" font-weight="bold" fill="#8b5a2b" text-anchor="start">Main trail</text><path d="M380 180 L320 220" stroke="#4a7fb0" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M324.6 212.2 L320.0 220.0 L328.9 218.8" stroke="#4a7fb0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M380 236 L320 276" stroke="#4a7fb0" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M324.6 268.2 L320.0 276.0 L328.9 274.8" stroke="#4a7fb0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="170" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="start">Wind</text><circle cx="110" cy="204.2" r="6.6000000000000005" fill="#e8590c"/><rect x="103.4" y="210.8" width="13.200000000000001" height="17.6" rx="4.4" fill="#e8590c"/><text x="110" y="241.6" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="middle">Stand</text><path d="M110 236 L132 220" stroke="#e8590c" stroke-width="2" stroke-dasharray="4 3"/><path d="M20 296 Q60 280 100 240" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="7 5"/><text x="8" y="284" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="start">Walk in</text><rect x="240" y="76" width="0" height="0" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="8" y="150" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Downwind of the trail,</text><text x="8" y="168" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">off the field edge,</text><text x="8" y="186" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">never through the brush</text>
</svg>
