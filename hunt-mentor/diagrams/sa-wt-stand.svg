<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 324" font-family="sans-serif" role="img" aria-label="Top view of a stand spot. Bedding brush of willow and cottonwood along the top. A main trail with tracks runs from the brush down into the hay field. The wind blows from the field side across the trail toward the stand, so you sit downwind of the trail, back from the field edge. You walk in from the side, never through the bedding brush.">
