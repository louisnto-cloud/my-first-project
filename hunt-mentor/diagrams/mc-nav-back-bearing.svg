<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A compass rose with an orange arrow out at 40 degrees and a blue arrow back at 220 degrees. Out 40 plus 180 gives 220. Out 300 minus 180 gives 120. Under 180 add, over 180 take away, 95 percent.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Back bearing: add or take 180</text><circle cx="130" cy="160" r="100" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="3"/><text x="130.0" y="84.0" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">N</text><text x="212.0" y="166.0" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">E</text><text x="130.0" y="248.0" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">S</text><text x="48.0" y="166.00000000000003" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">W</text><line x1="130" y1="160" x2="167.92446897150583" y2="114.8033778559803" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><polygon points="175.0,106.4 163.7,111.3 172.1,118.3" fill="#e8590c"/><line x1="130" y1="160" x2="92.07553102849417" y2="205.19662214401973" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="85.0,213.6 96.3,208.7 87.9,201.7" fill="#4a7fb0"/><text x="258" y="90" font-size="17" fill="#e8590c" text-anchor="start" font-weight="bold">Out: 40°</text><text x="258" y="120" font-size="15" fill="#23261f" text-anchor="start">40 + 180 =</text><text x="258" y="146" font-size="17" fill="#4a7fb0" text-anchor="start" font-weight="bold">Back: 220°</text><text x="258" y="196" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Out 300°?</text><text x="258" y="220" font-size="15" fill="#23261f" text-anchor="start">300 − 180 = 120</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Under 180 add, over 180 take (95%)</text>
</svg>
