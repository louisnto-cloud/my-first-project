<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 342" font-family="sans-serif" role="img" aria-label="The flinch game: a partner loads the magazine with live rounds and a snap cap mixed in while you do not look. When the striker falls on the snap cap, any dip of the muzzle shows a flinch. Fix it with a slow squeeze, follow through and calling the shot."><rect x="0" y="0" width="400" height="342" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Game 4: catch a flinch</text><g transform="translate(0 0) scale(1.0)"><path d="M14 108 L128 116 L140 118 L300 120 Q314 121 318 126 L318 132 Q300 138 250 140 L200 141 L162 141 Q150 141 146 150 L136 170 Q132 176 124 174 L120 172 Q126 156 122 146 Q112 142 96 146 L14 168 Z" fill="#9A6B3F"/><path d="M30 116 Q80 120 120 124" stroke="#6E4A2A" stroke-width="1.2" fill="none"/><rect x="7" y="106" width="8" height="64" rx="2" fill="#2B3034"/><path d="M232 105 L390 107 L390 115 L232 117 Z" fill="#4A5156"/><rect x="386" y="106" width="5" height="10" rx="1" fill="#2B3034"/><rect x="255" y="99" width="16" height="7" rx="1.5" fill="#2B3034"/><rect x="266" y="96" width="4" height="4" fill="#2B3034"/><path d="M374 107 L376 97 L388 97 L388 107 Z" fill="#2B3034"/><rect x="140" y="102" width="94" height="17" rx="3" fill="#4A5156"/><rect x="150" y="99" width="78" height="4" fill="#8C959B"/><rect x="160" y="100" width="2" height="2" fill="#2B3034"/><rect x="210" y="100" width="2" height="2" fill="#2B3034"/><rect x="176" y="105" width="36" height="8" rx="1.5" fill="#2B3034"/><rect x="176" y="106" width="36" height="6" fill="#C9CFD3"/><rect x="128" y="104" width="13" height="13" rx="3" fill="#2B3034"/><rect x="121" y="107" width="8" height="7" rx="2" fill="#D8B23A"/><path d="M153 111 L148 131" stroke="#2B3034" stroke-width="5" stroke-linecap="round"/><circle cx="147" cy="136" r="6.5" fill="#2B3034"/><rect x="130" y="119" width="22" height="6" rx="2" fill="#2B3034"/><circle cx="146" cy="122" r="2.6" fill="#FFFFFF"/><rect x="131" y="117.5" width="9" height="9" rx="2" fill="#D8B23A" stroke="#2B3034" stroke-width=".8"/><path d="M158 141 Q156 160 176 160 L196 160 Q204 160 204 141" stroke="#2B3034" stroke-width="3" fill="none"/><path d="M178 141 Q183 150 176 156" stroke="#2B3034" stroke-width="3.5" fill="none" stroke-linecap="round"/><rect x="208" y="138" width="22" height="20" rx="2" fill="#2B3034"/><rect x="231" y="139" width="4" height="9" rx="1" fill="#D8B23A"/><circle cx="70" cy="158" r="2.6" fill="#2B3034"/><circle cx="300" cy="138" r="2.6" fill="#2B3034"/></g><g transform="translate(60 230) rotate(0) scale(2.0)"><rect x="0" y="-5" width="24" height="10" rx="1" fill="#D8B23A" stroke="#8A6D12" stroke-width=".8"/><rect x="-2" y="-6" width="3" height="12" rx="1" fill="#B8931F"/><path d="M24 -4.5 L33 -4 Q40 0 33 4 L24 4.5 Z" fill="#B0703A"/></g><g transform="translate(170 230) rotate(0) scale(2.0)"><rect x="0" y="-5" width="24" height="10" rx="1" fill="#D8B23A" stroke="#8A6D12" stroke-width=".8"/><rect x="-2" y="-6" width="3" height="12" rx="1" fill="#B8931F"/><path d="M24 -4.5 L33 -4 Q40 0 33 4 L24 4.5 Z" fill="#B0703A"/></g><rect x="282" y="220" width="64" height="20" rx="3" fill="#FF6A13"/><text x="314" y="236" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">snap</text><text x="98" y="266" font-size="15" font-weight="bold" text-anchor="middle" fill="#17201A">Live</text><text x="208" y="266" font-size="15" font-weight="bold" text-anchor="middle" fill="#17201A">Live</text><text x="314" y="266" font-size="15" font-weight="bold" text-anchor="middle" fill="#FF6A13">Snap cap</text><text x="16" y="202" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">A partner loads the magazine. You do not look.</text><circle cx="26" cy="295" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="300" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><text x="42" y="300" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Rifle dips on a snap cap? Flinch.</text><circle cx="26" cy="319" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="324" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text><text x="42" y="324" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Fix: squeeze, follow through, call the shot</text></svg>
