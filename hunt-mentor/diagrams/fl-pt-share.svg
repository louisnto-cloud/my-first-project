<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-label="Sharing a hunt with your brother: agree costs like fuel, food and processing, agree how meat is split, and agree who decides when it is time to go home.">
  <rect x="0" y="0" width="400" height="220" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Agree it before, not after</text>
<rect x="10.0" y="46" width="121.33333333333333" height="164" rx="10" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2"/>
<rect x="10.0" y="46" width="121.33333333333333" height="36" rx="10" fill="#2f3a2b"/>
<text x="70.66666666666666" y="70" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Costs</text>
<text x="70.66666666666666" y="106" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Fuel</text>
<text x="70.66666666666666" y="128" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Food</text>
<text x="70.66666666666666" y="150" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Processing</text>
<text x="70.66666666666666" y="172" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Gear you share</text>
<rect x="139.33333333333331" y="46" width="121.33333333333333" height="164" rx="10" fill="#dfe6d3" stroke="#8b5a2b" stroke-width="2"/>
<rect x="139.33333333333331" y="46" width="121.33333333333333" height="36" rx="10" fill="#8b5a2b"/>
<text x="199.99999999999997" y="70" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Meat</text>
<text x="199.99999999999997" y="106" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Split how?</text>
<text x="199.99999999999997" y="128" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Who takes</text>
<text x="199.99999999999997" y="150" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">the next shot?</text>
<text x="199.99999999999997" y="172" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Gifts to others</text>
<rect x="268.66666666666663" y="46" width="121.33333333333333" height="164" rx="10" fill="#dfe6d3" stroke="#e8590c" stroke-width="2"/>
<rect x="268.66666666666663" y="46" width="121.33333333333333" height="36" rx="10" fill="#e8590c"/>
<text x="329.3333333333333" y="70" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Calls</text>
<text x="329.3333333333333" y="106" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Who says</text>
<text x="329.3333333333333" y="128" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">&quot;too late&quot;</text>
<text x="329.3333333333333" y="150" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Weather calls</text>
<text x="329.3333333333333" y="172" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Home time</text>
</svg>
