<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Test step 1: look from shore for open water, cracks, grey patches and slush. Any of those: stay off.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1. Check from shore first</text><rect x="0" y="160" width="400" height="140" rx="0" fill="#bfe0f2"/><rect x="0" y="140" width="400" height="24" rx="0" fill="#dfe6d3"/><line x1="53" y1="160" x2="56" y2="134" stroke="#2f3a2b" stroke-width="6.3" stroke-linecap="round"/><line x1="67" y1="160" x2="64" y2="134" stroke="#2f3a2b" stroke-width="6.3" stroke-linecap="round"/><rect x="50" y="108" width="20" height="28" rx="5.4" fill="#e8590c"/><line x1="51" y1="113" x2="44" y2="132" stroke="#2f3a2b" stroke-width="5.4" stroke-linecap="round"/><line x1="69" y1="113" x2="76" y2="132" stroke="#2f3a2b" stroke-width="5.4" stroke-linecap="round"/><circle cx="60" cy="100" r="9.0" fill="#d9b48f"/><ellipse cx="260" cy="210" rx="40" ry="14" fill="#2f5f88"/><rect x="320" y="180" width="50" height="30" rx="4" fill="#a7aeb3"/><text x="250" y="120" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Open water? Grey?</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Look before you step</text>
</svg>
