<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Black bear seasons in the owner three areas, from the Rule Book. Heffley Creek, Region 3: spring 1 April to 30 June, fall 1 September to 30 November in most MUs; MU 3-46 fall opens 20 September. Fraser Valley, Region 2: spring 1 April to 15 June, fall 10 September to 30 November, bow only 1 to 9 September. South Okanagan, Region 8: spring 1 April to 30 June, fall 1 September to 30 November, and August private land only with the owner permission. Bag limit 2 per licence year.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Your three areas: bear seasons</text><rect x="10" y="50" width="380" height="74" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="72" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Heffley Creek, Region 3</text><text x="18" y="94" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Spring Apr 1 to Jun 30</text><text x="382" y="94" font-size="14" font-weight="bold" fill="#8b5a2b" text-anchor="end">Fall Sep 1 to Nov 30</text><text x="18" y="115" font-size="14" fill="#e8590c" text-anchor="start">Most MUs. MU 3-46 fall opens Sep 20</text><rect x="10" y="130" width="380" height="74" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="152" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Fraser Valley, Region 2</text><text x="18" y="174" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Spring Apr 1 to Jun 15</text><text x="382" y="174" font-size="14" font-weight="bold" fill="#8b5a2b" text-anchor="end">Fall Sep 10 to Nov 30</text><text x="18" y="195" font-size="14" fill="#e8590c" text-anchor="start">Bow only Sep 1 to 9</text><rect x="10" y="210" width="380" height="74" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="232" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">South Okanagan, Region 8</text><text x="18" y="254" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Spring Apr 1 to Jun 30</text><text x="382" y="254" font-size="14" font-weight="bold" fill="#8b5a2b" text-anchor="end">Fall Sep 1 to Nov 30</text><text x="18" y="275" font-size="14" fill="#e8590c" text-anchor="start">August: private land only, permission</text>
</svg>
