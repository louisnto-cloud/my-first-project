<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 483" font-family="sans-serif" role="img" aria-label="Black bear seasons in the owner three areas, from the Rule Book. Heffley Creek, Region 3: spring 1 April to 30 June, fall 1 September to 30 November in most MUs; MU 3-46 fall opens 20 September. Fraser Valley, Region 2: spring 1 April to 15 June, fall 10 September to 30 November, bow only 1 to 9 September. South Okanagan, Region 8: spring 1 April to 30 June, fall 1 September to 30 November, and August private land only with the owner permission. Bag limit 2 per licence year.">
