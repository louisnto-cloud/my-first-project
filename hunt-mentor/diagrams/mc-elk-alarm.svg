<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four stages of elk alarm: 1 head up, ears forward. 2 stares, nostrils flare. 3 a sharp bark. 4 the herd bunches and runs. At step 1 or 2, freeze. By step 3 it is usually too late.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Alarm, step by step</text><circle cx="36" cy="64" r="16" fill="#2f3a2b"/><text x="36" y="70" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">1</text><rect x="62" y="46" width="320" height="36" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="76" y="70" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Head up, ears forward</text><circle cx="36" cy="116" r="16" fill="#2f3a2b"/><text x="36" y="122" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">2</text><rect x="62" y="98" width="320" height="36" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="76" y="122" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Stares, nostrils flare</text><circle cx="36" cy="168" r="16" fill="#2f3a2b"/><text x="36" y="174" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">3</text><rect x="62" y="150" width="320" height="36" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="76" y="174" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Sharp bark</text><circle cx="36" cy="220" r="16" fill="#e8590c"/><text x="36" y="226" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">4</text><rect x="62" y="202" width="320" height="36" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="76" y="226" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Herd bunches, runs</text><text x="200" y="270" font-size="14" fill="#6b4f35" text-anchor="middle">Ears and nostrils: RMEF (85%). Bark: hunters (65%)</text><text x="200" y="290" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">At step 1 or 2: freeze. At 3: too late (Tip)</text>
</svg>
