<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Rings around a person show how far elk reacted in the Starkey experiment in Oregon. Flight was still likely up to about 500 m from hikers, beyond 750 m from horse riders and beyond 1,500 m from mountain bikes and ATVs. Elk kept an average of 558 to 879 m from people. Sources Wisdom and others 2004 and 2018.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">How far elk keep from people</text><path d="M30 190 A60 60 0 0 1 90 250" fill="none" stroke="#8a9a6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 150 A100 100 0 0 1 130 250" fill="none" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 100 A150 150 0 0 1 180 250" fill="none" stroke="#e8590c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(40 250) scale(0.7)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#e8590c"/><rect x="-6" y="-15" width="5" height="15" rx="1" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" rx="1" fill="#2f3a2b"/></g><text x="390" y="70" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">Flight still likely at:</text><text x="390" y="94" font-size="14" fill="#8a9a6b" text-anchor="end" font-weight="bold">Hiker: up to about 500 m</text><text x="390" y="116" font-size="14" fill="#8b5a2b" text-anchor="end" font-weight="bold">Horse: beyond 750 m</text><text x="390" y="138" font-size="14" fill="#e8590c" text-anchor="end" font-weight="bold">Bike or ATV: beyond 1,500 m</text><text x="390" y="186" font-size="14" fill="#23261f" text-anchor="end">Average gap kept</text><text x="390" y="204" font-size="14" fill="#23261f" text-anchor="end">from people:</text><text x="390" y="222" font-size="15" fill="#23261f" text-anchor="end" font-weight="bold">558 to 879 m</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Starkey, Oregon studies, 2004 and 2018 (85%)</text>
</svg>
