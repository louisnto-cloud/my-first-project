<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 325" font-family="sans-serif" role="img" aria-label="A hunter looks at thick young conifers 60 m away. A deer stands behind them, mostly hidden. Good security cover hides about 90% of a deer at 60 m. Look for parts, not a whole deer.">
<rect width="400" height="325" fill="#EEF1EA"/>
<text x="200" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Hidden in plain sight</text>
<rect x="14" y="46" width="372" height="190" rx="10" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="54" cy="150" r="10" fill="#17201A"/><rect x="46" y="160" width="16" height="40" fill="#17201A"/><line x1="70" y1="214" x2="300" y2="214" stroke="#1F3D2B" stroke-width="2"/><text x="185" y="206" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F3D2B">60 m (66 yd)</text><ellipse cx="320" cy="168" rx="34" ry="16" fill="#8b5a2b"/><ellipse cx="350" cy="146" rx="10" ry="7" fill="#8b5a2b"/><path d="M276 210 L288 120 L300 210 Z" fill="#8a9a6b" stroke="#1F3D2B" stroke-width="1"/><path d="M296 210 L308 120 L320 210 Z" fill="#8a9a6b" stroke="#1F3D2B" stroke-width="1"/><path d="M316 210 L328 120 L340 210 Z" fill="#8a9a6b" stroke="#1F3D2B" stroke-width="1"/><path d="M336 210 L348 120 L360 210 Z" fill="#8a9a6b" stroke="#1F3D2B" stroke-width="1"/><path d="M356 210 L368 120 L380 210 Z" fill="#8a9a6b" stroke="#1F3D2B" stroke-width="1"/><text x="200" y="264" font-size="15" text-anchor="middle" font-weight="bold" fill="#17201A">Good cover hides 90% of a deer at 60 m</text><text x="200" y="286" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">(mule deer research, 85%)</text><text x="200" y="310" font-size="15" text-anchor="middle" font-weight="bold" fill="#FF6A13">Look for parts, not a whole deer (Tip)</text>
</svg>
