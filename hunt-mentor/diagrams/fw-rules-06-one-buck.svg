<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 376" role="img" aria-label="Your Heffley Creek mule deer buck in Region 3 and an Okanagan mule deer buck in Region 8 share one box: only 1 mule deer buck from Regions 3, 4, 5, 6, 7A, 7B and 8 combined each licence year. Region 2 black tails near Mission sit outside that box. No more than 3 deer in all, province wide." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="376" fill="#fffaf0"/>
  <text x="200" y="26" font-size="19" fill="#23261f" text-anchor="middle" font-weight="bold">One mule deer buck, Regions 3 to 8</text>
  <rect x="6" y="40" width="191" height="104" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
  <rect x="6" y="40" width="191" height="30" rx="10" fill="#e8590c"/><rect x="6" y="58" width="191" height="12" fill="#e8590c"/>
  <text x="101.5" y="61" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Region 3</text>
  <text x="101.5" y="92" font-size="14" fill="#23261f" text-anchor="middle">Heffley Creek</text>
  <text x="101.5" y="110" font-size="14" fill="#23261f" text-anchor="middle">mule deer buck</text>
  <rect x="203" y="40" width="191" height="104" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
  <rect x="203" y="40" width="191" height="30" rx="10" fill="#e8590c"/><rect x="203" y="58" width="191" height="12" fill="#e8590c"/>
  <text x="298.5" y="61" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Region 8</text>
  <text x="298.5" y="92" font-size="14" fill="#23261f" text-anchor="middle">Okanagan</text>
  <text x="298.5" y="110" font-size="14" fill="#23261f" text-anchor="middle">mule deer buck</text>
  <rect x="6" y="150" width="191" height="104" rx="10" fill="#ffffff" stroke="#b03a2e" stroke-width="2.5"/>
  <rect x="6" y="150" width="191" height="30" rx="10" fill="#b03a2e"/><rect x="6" y="168" width="191" height="12" fill="#b03a2e"/>
  <text x="101.5" y="171" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Shared</text>
  <text x="101.5" y="202" font-size="14" fill="#23261f" text-anchor="middle">Only 1 of these two, and of</text>
  <text x="101.5" y="220" font-size="14" fill="#23261f" text-anchor="middle">Regions 4 to 7B, each licence year</text>
  <rect x="203" y="150" width="191" height="104" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
  <rect x="203" y="150" width="191" height="30" rx="10" fill="#4a7fb0"/><rect x="203" y="168" width="191" height="12" fill="#4a7fb0"/>
  <text x="298.5" y="171" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Region 2</text>
  <text x="298.5" y="202" font-size="14" fill="#23261f" text-anchor="middle">Mission black tails:</text>
  <text x="298.5" y="220" font-size="14" fill="#23261f" text-anchor="middle">outside that 1</text>
  <rect x="6" y="260" width="388" height="104" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
  <rect x="6" y="260" width="388" height="30" rx="10" fill="#2f3a2b"/><rect x="6" y="278" width="388" height="12" fill="#2f3a2b"/>
  <text x="200.0" y="281" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">All of BC</text>
  <text x="200.0" y="312" font-size="14" fill="#23261f" text-anchor="middle">3 deer at most</text>
  <text x="200.0" y="330" font-size="14" fill="#23261f" text-anchor="middle">a licence year</text>
</svg>
