<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three rows showing how scent spreads from a hunter. Steady wind: a long narrow cone. Light wind: a short wide cone. Swirl: scent goes everywhere, so back out. Steady wind is your friend.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="110" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Three scent cones</text><line x1="250" y1="20" x2="330" y2="20" stroke="#4a7fb0" stroke-width="3"/><polygon points="330.0,20.0 321.0,24.3 321.0,15.7" fill="#4a7fb0"/><text x="338" y="25" font-size="14" fill="#4a7fb0" text-anchor="start">wind</text><rect x="14" y="48" width="372" height="66" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(60 102) scale(0.55)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#e8590c"/><rect x="-6" y="-15" width="5" height="15" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" fill="#2f3a2b"/></g><path d="M70 0 L250 -14 L250 14 Z" transform="translate(0 80)" fill="#e8590c" opacity="0.3"/><text x="372" y="72" font-size="15" fill="#2f3a2b" text-anchor="end" font-weight="bold">Steady wind</text><text x="372" y="94" font-size="14" fill="#23261f" text-anchor="end">long, narrow</text><rect x="14" y="124" width="372" height="66" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(60 178) scale(0.55)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#e8590c"/><rect x="-6" y="-15" width="5" height="15" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" fill="#2f3a2b"/></g><path d="M70 0 L180 -28 L180 28 Z" transform="translate(0 156)" fill="#e8590c" opacity="0.3"/><text x="372" y="148" font-size="15" fill="#2f3a2b" text-anchor="end" font-weight="bold">Light wind</text><text x="372" y="170" font-size="14" fill="#23261f" text-anchor="end">short, wide</text><rect x="14" y="200" width="372" height="66" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(60 254) scale(0.55)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#e8590c"/><rect x="-6" y="-15" width="5" height="15" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" fill="#2f3a2b"/></g><path d="M80 232 q 9 -20 18 0 q 9 20 18 0" fill="none" stroke="#e8590c" stroke-width="2"/><path d="M116 232 q 9 -20 18 0 q 9 20 18 0" fill="none" stroke="#e8590c" stroke-width="2"/><path d="M152 232 q 9 -20 18 0 q 9 20 18 0" fill="none" stroke="#e8590c" stroke-width="2"/><path d="M188 232 q 9 -20 18 0 q 9 20 18 0" fill="none" stroke="#e8590c" stroke-width="2"/><path d="M224 232 q 9 -20 18 0 q 9 20 18 0" fill="none" stroke="#e8590c" stroke-width="2"/><text x="372" y="224" font-size="15" fill="#2f3a2b" text-anchor="end" font-weight="bold">Swirl</text><text x="372" y="246" font-size="14" fill="#23261f" text-anchor="end">back out</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Steady wind is your friend (Tip)</text>
</svg>
