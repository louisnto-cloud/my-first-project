<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four layers of communication: 1 a trip plan left at home saying where, who and when back; 2 911 on any phone through any tower in range; 3 satellite SOS where there is no signal, from open sky; 4 partner radios, Family Radio Service handhelds need no licence. Call early.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Who knows where you are?</text><rect x="20" y="46" width="360" height="48" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="48" cy="70" r="16" fill="#2f3a2b"/><text x="48" y="76" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">1</text><text x="76" y="67" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Trip plan at home</text><text x="76" y="86" font-size="14" fill="#23261f" text-anchor="start">where, who, back when</text><rect x="20" y="102" width="360" height="48" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="48" cy="126" r="16" fill="#e8590c"/><text x="48" y="132" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">2</text><text x="76" y="123" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">911 on any phone</text><text x="76" y="142" font-size="14" fill="#23261f" text-anchor="start">any tower in range (75%)</text><rect x="20" y="158" width="360" height="48" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="48" cy="182" r="16" fill="#4a7fb0"/><text x="48" y="188" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">3</text><text x="76" y="179" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Satellite SOS</text><text x="76" y="198" font-size="14" fill="#23261f" text-anchor="start">no signal: open sky (65 to 85%)</text><rect x="20" y="214" width="360" height="48" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="48" cy="238" r="16" fill="#8a9a6b"/><text x="48" y="244" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">4</text><text x="76" y="235" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Partner radio</text><text x="76" y="254" font-size="14" fill="#23261f" text-anchor="start">FRS, no licence (85%)</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">FRS: Family Radio Service. Call early</text>
</svg>
