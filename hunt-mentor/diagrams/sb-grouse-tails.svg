<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three grouse tails fanned out. Ruffed grouse: brown grey fan with a wide dark band near the tip. Dusky grouse: dark tail with a broad pale grey tip band. Spruce grouse, Franklin&#x27;s form: dark tail with white spots above it. Size order: dusky biggest, then ruffed, then spruce. A spruce male has a red comb and a black breast edged in white. Tip, 80 percent.">
