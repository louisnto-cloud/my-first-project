<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Name the waypoint, add a note and a photo, then tap Done. Changes save by themselves.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c" stroke="none" stroke-width="2"/><text x="26" y="32" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="52" y="32" font-family="sans-serif" font-size="18" fill="#2f3a2b" text-anchor="start" font-weight="bold">Name it, note it, Done</text><rect x="30" y="60" width="340" height="40" rx="8" fill="#ffffff" stroke="#2f3a2b" stroke-width="1.5"/><text x="42" y="86" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">Oct 18 glassing knob</text><rect x="30" y="112" width="340" height="70" rx="8" fill="#ffffff" stroke="#2f3a2b" stroke-width="1.5"/><text x="42" y="138" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Sees the south bench.</text><text x="42" y="158" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Best at first light.</text><rect x="30" y="196" width="120" height="40" rx="8" fill="#e8f2e0" stroke="#8a9a6b" stroke-width="1.5"/><text x="90" y="221" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Photo</text><rect x="250" y="196" width="120" height="40" rx="8" fill="#e8590c" stroke="none" stroke-width="0"/><text x="310" y="221" font-family="sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Done</text><text x="30" y="270" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="start">Changes save by themselves.</text>
