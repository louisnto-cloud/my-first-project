<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Colour cones. A duck has four kinds: ultraviolet, blue, green and red, 75 percent. You have three: blue, green and red, with no ultraviolet. Ducks likely see ultraviolet light, 70 percent. Shine and glare stand out to them, a tip. Dull the gun, the face and the boat, a tip."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Colour: ducks have one more cone (75%)</text><text x="70" y="70" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Duck</text><text x="70" y="170" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">You</text><rect x="130" y="50" width="54" height="40" rx="6" fill="#8e6bbf"/><text x="157" y="108" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">UV</text><rect x="130" y="150" width="54" height="40" rx="6" fill="#e9e2d0" stroke="#2f3a2b" stroke-width="2"/><path d="M149 162 l16 16 M165 162 l-16 16" stroke="#e8590c" stroke-width="4" fill="none"/><rect x="194" y="50" width="54" height="40" rx="6" fill="#3a6fb0"/><text x="221" y="108" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Blue</text><rect x="194" y="150" width="54" height="40" rx="6" fill="#3a6fb0"/><rect x="258" y="50" width="54" height="40" rx="6" fill="#2f8f4a"/><text x="285" y="108" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Green</text><rect x="258" y="150" width="54" height="40" rx="6" fill="#2f8f4a"/><rect x="322" y="50" width="54" height="40" rx="6" fill="#c0392b"/><text x="349" y="108" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Red</text><rect x="322" y="150" width="54" height="40" rx="6" fill="#c0392b"/><rect x="10" y="216" width="380" height="76" rx="8" fill="#dfe6d3"/><text x="200" y="240" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">They likely see ultraviolet light (70%)</text><text x="200" y="262" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Shine and glare stand out to them (Tip)</text><text x="200" y="284" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Dull the gun, the face and the boat (Tip)</text></svg>
