<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 298" role="img" aria-label="Walking with a load: short steps, poles, rest step on steep climbs, and stop before you are wobbly.">
  <rect x="0" y="0" width="400" height="298" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Walking with a load</text>
<rect x="10" y="46" width="380" height="56" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<line x1="32.0" y1="92" x2="52.0" y2="52" stroke="#23261f" stroke-width="3" stroke-linecap="round"/><line x1="52.0" y1="92" x2="36.0" y2="52" stroke="#23261f" stroke-width="3" stroke-linecap="round"/>
<text x="80" y="68" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Poles</text>
<text x="80" y="90" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Two extra legs on side hills (Tip)</text>
<rect x="10" y="108" width="380" height="56" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<ellipse cx="32.0" cy="142" rx="8" ry="4" fill="#8b5a2b"/><ellipse cx="52.0" cy="130" rx="8" ry="4" fill="#8b5a2b"/>
<text x="80" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Short steps</text>
<text x="80" y="152" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Feet under you, up and down (Tip)</text>
<rect x="10" y="170" width="380" height="56" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<text x="42.0" y="208" font-family="sans-serif" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="middle">1, 2</text>
<text x="80" y="192" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Rest step</text>
<text x="80" y="214" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Pause on the straight back leg (Tip)</text>
<rect x="10" y="232" width="380" height="56" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<circle cx="42.0" cy="258" r="16" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="42.0" y="264" font-family="sans-serif" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="middle">!</text>
<text x="80" y="254" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Stop before wobbly</text>
<text x="80" y="276" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">A fall with a load hurts (Tip)</text>
</svg>
