<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 488" font-family="sans-serif" role="img" aria-label="Timeline of the Saskatchewan deer draw year for a Canadian resident. 1 May: the draw opens in your HAL account, pick zones from the supplement. Last Thursday in May at 4 pm: the draw closes, no late or changed applications. June: results in your HAL account. From 1 August: if drawn, buy the licence, 180 dollars. November: hunt white tails with no guide, my lean.">
<rect x="0" y="0" width="400" height="488" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Saskatchewan deer: the draw year</text>
<text x="200" y="46" font-size="14" fill="#6b4f35" text-anchor="middle">Canadian Resident White tailed Deer Draw (85%)</text>
<line x1="122" y1="68" x2="122" y2="458" stroke="#8a9a6b" stroke-width="5"/>
<text x="108" y="82" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">May 1</text>
<circle cx="122" cy="78" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="3"/>
<g transform="translate(360 86) scale(0.8)"><rect x="-24" y="-18" width="48" height="30" rx="3" fill="#4a7fb0" stroke="#2f3a2b" stroke-width="2.5"/><path d="M-30 14 h60 l-4 6 h-52 z" fill="#2f3a2b"/><path d="M-14 -6 h28 M-14 2 h18" stroke="#fff" stroke-width="2.5"/></g>
<text x="140" y="84" font-size="15" fill="#2f3a2b">Draw opens in your HAL</text>
<text x="140" y="103" font-size="15" fill="#2f3a2b">account. Pick zones.</text>
<text x="108" y="164" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">Last Thursday</text>
<text x="108" y="181" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">in May, 4 pm</text>
<circle cx="122" cy="160" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="3"/>
<g transform="translate(360 168) scale(0.8)"><rect x="-24" y="-18" width="48" height="40" rx="4" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/><rect x="-24" y="-18" width="48" height="11" fill="#e8590c"/><path d="M-13 -23 v9 M13 -23 v9" stroke="#2f3a2b" stroke-width="3"/><g fill="#8a9a6b"><rect x="-17" y="-1" width="7" height="6"/><rect x="-4" y="-1" width="7" height="6"/><rect x="9" y="-1" width="7" height="6"/><rect x="-17" y="10" width="7" height="6"/><rect x="-4" y="10" width="7" height="6" fill="#e8590c"/></g></g>
<text x="140" y="166" font-size="15" fill="#2f3a2b">Draw closes. No late or</text>
<text x="140" y="185" font-size="15" fill="#2f3a2b">changed entries.</text>
<text x="108" y="246" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">June</text>
<circle cx="122" cy="242" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="3"/>
<g transform="translate(360 250) scale(0.8)"><rect x="-13" y="-22" width="26" height="44" rx="5" fill="#2f3a2b"/><rect x="-9" y="-16" width="18" height="28" fill="#4a7fb0"/><circle cx="0" cy="17" r="2.5" fill="#fff"/></g>
<text x="140" y="248" font-size="15" fill="#2f3a2b">Results in your HAL</text>
<text x="140" y="267" font-size="15" fill="#2f3a2b">account.</text>
<text x="108" y="328" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">From August 1</text>
<circle cx="122" cy="324" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="3"/>
<g transform="translate(360 332) scale(0.8)"><rect x="-28" y="-18" width="56" height="36" rx="5" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/><rect x="-22" y="-11" width="15" height="19" fill="#8a9a6b"/><path d="M-2 -8 h22 M-2 -1 h22 M-2 6 h15" stroke="#2f3a2b" stroke-width="2.5"/></g>
<text x="140" y="330" font-size="15" fill="#2f3a2b">If drawn, buy the licence:</text>
<text x="140" y="349" font-size="15" fill="#2f3a2b">$180.</text>
<text x="108" y="410" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">November</text>
<circle cx="122" cy="406" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="3"/>
<g transform="translate(360 414) scale(0.8)"><ellipse cx="0" cy="4" rx="17" ry="8" fill="#8b5a2b"/><path d="M12 0 L18 -10" stroke="#8b5a2b" stroke-width="5"/><ellipse cx="21" cy="-12" rx="6" ry="4" fill="#8b5a2b"/><path d="M19 -15 l-3 -9 m3 9 l3 -10 m-4.5 -4 l-4 -2" stroke="#6b4f35" stroke-width="2" fill="none"/><path d="M-12 10 v10 M-6 10 v10 M8 10 v10 M13 10 v10" stroke="#8b5a2b" stroke-width="3"/></g>
<text x="140" y="412" font-size="15" fill="#2f3a2b">Hunt white tails, no guide</text>
<text x="140" y="431" font-size="15" fill="#2f3a2b">(my lean).</text>
</svg>
