<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Six tiles of droppings. Pellets: deer, elk, moose. A tapered rope: coyote, wolf. Blunt segments: cougar, lynx. A big pile with berries: bear. A small curved dropping with a white cap: birds. A gloved hand: gloves on, use a stick, then wash with soap.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Droppings: shape tells the family</text><rect x="14" y="42" width="118" height="110" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><ellipse cx="59" cy="86" rx="6" ry="4" fill="#6b4f35"/><ellipse cx="73" cy="80" rx="6" ry="4" fill="#6b4f35"/><ellipse cx="85" cy="88" rx="6" ry="4" fill="#6b4f35"/><ellipse cx="69" cy="96" rx="6" ry="4" fill="#6b4f35"/><ellipse cx="81" cy="98" rx="6" ry="4" fill="#6b4f35"/><text x="73" y="126" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Pellets</text><text x="73" y="144" font-size="14" fill="#23261f" text-anchor="middle">deer, elk, moose</text><rect x="142" y="42" width="118" height="110" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><path d="M165 90 Q 191 72 211 88 T 239 82" fill="none" stroke="#6b4f35" stroke-width="9" stroke-linecap="round"/><text x="201" y="126" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Tapered rope</text><text x="201" y="144" font-size="14" fill="#23261f" text-anchor="middle">coyote, wolf</text><rect x="270" y="42" width="118" height="110" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><rect x="295" y="79" width="20" height="14" rx="3" fill="#6b4f35"/><rect x="319" y="79" width="20" height="14" rx="3" fill="#6b4f35"/><rect x="343" y="79" width="20" height="14" rx="3" fill="#6b4f35"/><text x="329" y="126" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Blunt segments</text><text x="329" y="144" font-size="14" fill="#23261f" text-anchor="middle">cougar, lynx</text><rect x="14" y="162" width="118" height="110" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><path d="M39 220 Q 53 184 73 196 Q 95 182 107 220 Z" fill="#6b4f35"/><circle cx="65" cy="208" r="3" fill="#5b2a4a"/><circle cx="83" cy="210" r="3" fill="#5b2a4a"/><text x="73" y="246" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Big pile</text><text x="73" y="264" font-size="14" fill="#23261f" text-anchor="middle">bear</text><rect x="142" y="162" width="118" height="110" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><path d="M181 212 Q 201 194 221 212" fill="none" stroke="#6b4f35" stroke-width="8" stroke-linecap="round"/><circle cx="221" cy="212" r="6" fill="#ffffff"/><text x="201" y="246" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">White cap</text><text x="201" y="264" font-size="14" fill="#23261f" text-anchor="middle">birds</text><rect x="270" y="162" width="118" height="110" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><path d="M315 224 L315 200 L321 186 L327 200 L333 184 L339 200 L345 190 L345 224 Z" fill="#4a7fb0" stroke="#23261f" stroke-width="1.5"/><text x="329" y="246" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Gloves on</text><text x="329" y="264" font-size="14" fill="#23261f" text-anchor="middle">stick, then soap</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">75 to 85%. Contents show the menu</text>
</svg>
