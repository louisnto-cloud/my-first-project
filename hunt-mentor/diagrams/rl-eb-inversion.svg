<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two panels. Sunny day: the sun warms the slopes and warm air rises up them. Clear calm night: cold air drains down the slopes and pools in the valley bottom as frost and fog, so the valley is colder than the slopes above it. That is an inversion.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Clear calm night: the valley gets coldest</text>
  <rect x="6" y="40" width="190" height="220" rx="8" fill="#e3ecf3"/><rect x="204" y="40" width="190" height="220" rx="8" fill="#2c3a55"/>
  <path d="M6 260 L60 140 L101 190 L142 140 L196 260 Z" fill="#e9edd9" stroke="#2f3a2b" stroke-width="2"/>
  <path d="M204 260 L258 140 L299 190 L340 140 L394 260 Z" fill="#55643f" stroke="#fff" stroke-width="1.5"/>
  <circle cx="40" cy="70" r="12" fill="#f2c70c"/><path d="M40 70 m0 -16 v-8" stroke="#e8a20c" stroke-width="3" transform="rotate(0 40 70)"/><path d="M40 70 m0 -16 v-8" stroke="#e8a20c" stroke-width="3" transform="rotate(45 40 70)"/><path d="M40 70 m0 -16 v-8" stroke="#e8a20c" stroke-width="3" transform="rotate(90 40 70)"/><path d="M40 70 m0 -16 v-8" stroke="#e8a20c" stroke-width="3" transform="rotate(135 40 70)"/><path d="M40 70 m0 -16 v-8" stroke="#e8a20c" stroke-width="3" transform="rotate(180 40 70)"/><path d="M40 70 m0 -16 v-8" stroke="#e8a20c" stroke-width="3" transform="rotate(225 40 70)"/><path d="M40 70 m0 -16 v-8" stroke="#e8a20c" stroke-width="3" transform="rotate(270 40 70)"/><path d="M40 70 m0 -16 v-8" stroke="#e8a20c" stroke-width="3" transform="rotate(315 40 70)"/>
  <path d="M70 200 L56 160" stroke="#e8590c" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M56 160 L64.5 168.5 L54.6 171.9 Z" fill="#e8590c"/><path d="M132 200 L146 160" stroke="#e8590c" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M146 160 L147.4 171.9 L137.5 168.5 Z" fill="#e8590c"/>
  <path d="M215 250 C 240 236, 270 232, 299 240 C 330 232, 360 236, 383 250 L383 258 L215 258 Z" fill="#cfe0f0" opacity=".85"/>
  <path d="M262 160 L282 210" stroke="#9cc3ea" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M282 210 L273.1 201.9 L282.8 198.0 Z" fill="#9cc3ea"/><path d="M336 160 L316 210" stroke="#9cc3ea" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M316 210 L315.2 198.0 L324.9 201.9 Z" fill="#9cc3ea"/>
  <text x="101" y="60" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Sunny day</text><text x="299" y="60" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Clear night</text>
  <text x="101" y="250" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">warm air rises</text><text x="299" y="232" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">cold pool, frost, fog</text>
  <text x="200" y="292" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cold air drains down at night and pools low</text>
</svg>
