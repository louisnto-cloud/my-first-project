<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 305" font-family="sans-serif" role="img" aria-label="Side view of a black tailed deer buck with labels: wide tail dark on top, small white rump patch, ears shorter than a mule deer, forked antlers, a smaller and darker body. Tap the parts to learn each one.">
<rect width="400" height="305" fill="#EEF1EA"/>
<text x="200" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Black tailed deer: 4 marks</text>
<ellipse cx="200" cy="170" rx="92" ry="44" fill="#8b5a2b"/><path d="M262 150 L292 92 L314 98 L292 165 Z" fill="#8b5a2b"/><ellipse cx="318" cy="92" rx="26" ry="15" fill="#8b5a2b"/><ellipse cx="340" cy="96" rx="8" ry="7" fill="#17201A"/><rect x="130" y="200" width="13" height="70" fill="#8b5a2b"/><rect x="160" y="202" width="13" height="68" fill="#8b5a2b"/><rect x="236" y="200" width="13" height="70" fill="#8b5a2b"/><rect x="262" y="198" width="13" height="72" fill="#8b5a2b"/><g data-tip="Antlers|Fork like a mule deer. Yearlings are almost always spikes (90%)." data-tip-dot="306,50"><path d="M308 80 L306 52 M306 52 L296 36 M306 52 L318 38" fill="none" stroke="#17201A" stroke-width="4"/></g><g data-tip="Ears|About 3 cm shorter than a mule deer (90%)." data-tip-dot="300,66"><ellipse cx="300" cy="70" rx="7" ry="16" fill="#8b5a2b" transform="rotate(-25 300 70)"/></g><g data-tip="Body|Smaller and slightly darker than a mule deer (90%)." data-tip-dot="190,170"><rect x="150" y="150" width="80" height="40" fill="none" stroke="none"/></g><g data-tip="Rump patch|Small white rump patch (90%)." data-tip-dot="120,160"><ellipse cx="116" cy="160" rx="10" ry="18" fill="#f4efe2"/></g><g data-tip="Tail|Wide. Dark brown or black on top for most of its length (90%). Raised in alarm, it shows a broad white underside (80%)." data-tip-dot="107,166"><rect x="100" y="146" width="14" height="40" rx="7" fill="#17201A"/></g><text x="20" y="62" font-size="15" text-anchor="start" font-weight="bold" fill="#1F3D2B">Wide dark tail</text><line x1="64" y1="68" x2="100" y2="150" stroke="#1F3D2B" stroke-width="2"/><text x="176" y="62" font-size="15" text-anchor="start" font-weight="bold" fill="#1F3D2B">Shorter ears</text><line x1="260" y1="62" x2="292" y2="66" stroke="#1F3D2B" stroke-width="2"/><text x="20" y="292" font-size="15" text-anchor="start" font-weight="bold" fill="#1F3D2B">Small rump patch</text><line x1="70" y1="278" x2="112" y2="178" stroke="#1F3D2B" stroke-width="2"/><text x="390" y="292" font-size="15" text-anchor="end" font-weight="bold" fill="#1F3D2B">Smaller, darker body</text>
</svg>
