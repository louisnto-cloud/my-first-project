<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two quail wings compared. Young of the year: buff tips on the upper primary coverts and pointed outer flight feathers. Adult: plain grey covert tips and rounder outer feathers. 70 percent, from a 1963 Condor aging study, search preview. The tips show best in early season.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Young or adult? Check the wing</text>
<rect x="10" y="40" width="185" height="200" rx="8" fill="#dfe6d3"/>
<rect x="205" y="40" width="185" height="200" rx="8" fill="#dfe6d3"/>
<text x="102" y="64" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Young of the year</text>
<g transform="translate(22 110)"><path d="M0 0 L120 -10 L150 20 L130 60 L20 50 Z" fill="#9a9ca2"/><path d="M100 -6 l40 30" stroke="#5f6168" stroke-width="2"/><path d="M108 -2 l40 28" stroke="#5f6168" stroke-width="2"/><path d="M116 2 l40 26" stroke="#5f6168" stroke-width="2"/><path d="M124 6 l40 24" stroke="#5f6168" stroke-width="2"/><path d="M132 10 l40 22" stroke="#5f6168" stroke-width="2"/><ellipse cx="70" cy="2" rx="7" ry="4" fill="#6d6f75"/><ellipse cx="75" cy="2" rx="3" ry="2.5" fill="#e8c27a"/><ellipse cx="80" cy="7" rx="7" ry="4" fill="#6d6f75"/><ellipse cx="85" cy="7" rx="3" ry="2.5" fill="#e8c27a"/><ellipse cx="90" cy="12" rx="7" ry="4" fill="#6d6f75"/><ellipse cx="95" cy="12" rx="3" ry="2.5" fill="#e8c27a"/><ellipse cx="100" cy="17" rx="7" ry="4" fill="#6d6f75"/><ellipse cx="105" cy="17" rx="3" ry="2.5" fill="#e8c27a"/><ellipse cx="110" cy="22" rx="7" ry="4" fill="#6d6f75"/><ellipse cx="115" cy="22" rx="3" ry="2.5" fill="#e8c27a"/></g>
<text x="102" y="196" font-size="14" fill="#2f3a2b" text-anchor="middle">Buff tips on the</text>
<text x="102" y="214" font-size="14" fill="#2f3a2b" text-anchor="middle">primary coverts</text>
<text x="297" y="64" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Adult</text>
<g transform="translate(217 110)"><path d="M0 0 L120 -10 L150 20 L130 60 L20 50 Z" fill="#9a9ca2"/><path d="M100 -6 l40 30" stroke="#5f6168" stroke-width="2"/><path d="M108 -2 l40 28" stroke="#5f6168" stroke-width="2"/><path d="M116 2 l40 26" stroke="#5f6168" stroke-width="2"/><path d="M124 6 l40 24" stroke="#5f6168" stroke-width="2"/><path d="M132 10 l40 22" stroke="#5f6168" stroke-width="2"/><ellipse cx="70" cy="2" rx="7" ry="4" fill="#6d6f75"/><ellipse cx="75" cy="2" rx="3" ry="2.5" fill="#7d7f86"/><ellipse cx="80" cy="7" rx="7" ry="4" fill="#6d6f75"/><ellipse cx="85" cy="7" rx="3" ry="2.5" fill="#7d7f86"/><ellipse cx="90" cy="12" rx="7" ry="4" fill="#6d6f75"/><ellipse cx="95" cy="12" rx="3" ry="2.5" fill="#7d7f86"/><ellipse cx="100" cy="17" rx="7" ry="4" fill="#6d6f75"/><ellipse cx="105" cy="17" rx="3" ry="2.5" fill="#7d7f86"/><ellipse cx="110" cy="22" rx="7" ry="4" fill="#6d6f75"/><ellipse cx="115" cy="22" rx="3" ry="2.5" fill="#7d7f86"/></g>
<text x="297" y="196" font-size="14" fill="#2f3a2b" text-anchor="middle">Plain grey tips,</text>
<text x="297" y="214" font-size="14" fill="#2f3a2b" text-anchor="middle">rounder outer feathers</text>
<text x="200" y="266" font-size="14" fill="#2f3a2b" text-anchor="middle">Aging clue from a 1963 study (70%)</text>
<text x="200" y="286" font-size="14" fill="#2f3a2b" text-anchor="middle">Count your young: a sign of a good hatch (Tip)</text>
</svg>
