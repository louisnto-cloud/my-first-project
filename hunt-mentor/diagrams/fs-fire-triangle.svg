<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="The fire triangle: heat, fuel and air. Take away any one and the fire dies. Wet fuel steals heat; wood packed too tight starves the fire of air.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fire needs 3 things</text><polygon points="200,50 70,240 330,240" fill="#fff3d6" stroke="#e8590c" stroke-width="4"/><path d="M175 200 Q166 158 200 122 Q234 158 225 200 Z" fill="#e8590c"/><path d="M187 200 Q183 178 200 155 Q217 178 213 200 Z" fill="#f6c344"/><rect x="150" y="40" width="100" height="34" rx="8" fill="#c0392b" stroke="#c0392b" stroke-width="2"/><text x="200" y="63" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Heat</text><rect x="10" y="230" width="120" height="34" rx="8" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="2"/><text x="70" y="253" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Fuel</text><rect x="270" y="230" width="120" height="34" rx="8" fill="#4a7fb0" stroke="#4a7fb0" stroke-width="2"/><text x="330" y="253" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Air</text><text x="200" y="290" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wet steals heat. Packed wood starves air</text>
</svg>
