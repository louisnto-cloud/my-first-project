<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Bar chart of white tailed deer lifespan. In heavily hunted Pennsylvania, bucks lived about 2 years on average and does about 3. Most deer are dead by age 4 or 5. Few live past 10. The record is over 20 years." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">How long white tails live</text><text x="16" y="60" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Heavily hunted buck</text><rect x="16" y="66" width="24" height="16" rx="4" fill="#e8590c"/><text x="48" y="80" font-size="14" fill="#23261f" text-anchor="start">about 2 years average</text><text x="16" y="106" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Heavily hunted doe</text><rect x="16" y="112" width="36" height="16" rx="4" fill="#e8590c"/><text x="60" y="126" font-size="14" fill="#23261f" text-anchor="start">about 3 years average</text><text x="16" y="152" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Most deer</text><rect x="16" y="158" width="60" height="16" rx="4" fill="#8b5a2b"/><text x="84" y="172" font-size="14" fill="#23261f" text-anchor="start">dead by 4 or 5</text><text x="16" y="198" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Few deer</text><rect x="16" y="204" width="120" height="16" rx="4" fill="#8b5a2b"/><text x="144" y="218" font-size="14" fill="#23261f" text-anchor="start">live past 10</text><text x="16" y="244" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Record</text><rect x="16" y="250" width="240" height="16" rx="4" fill="#8b5a2b"/><text x="264" y="264" font-size="14" fill="#23261f" text-anchor="start">20 years plus</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Bar length: years. A 4 year old buck is old.</text>
</svg>
