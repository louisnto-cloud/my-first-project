<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 607" font-family="sans-serif" role="img" aria-label="Gaits: the pattern on the ground, travel to the right. Walk: zig zag, the hind lands on or just behind the front, relaxed. Trot: nearly one line, longer steps, hind on front, purposeful. Bound: hare, two big hind prints ahead of two small front prints, a Y shape. Stot: mule deer bounce, 4 prints in a tight group, then a big gap of 2.4 to 4.6 m. Gallop: groups of 4 in a line, hind beyond front, long gaps, running. Dark prints are hind feet, light prints are front feet. Measure stride from the same foot to the same foot.">
