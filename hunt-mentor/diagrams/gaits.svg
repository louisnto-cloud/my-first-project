<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 556" font-family="sans-serif">
  <rect x="0" y="0" width="400" height="556" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Gaits: the pattern on the ground</text>
  <g stroke="#e8590c" stroke-width="3" fill="#e8590c">
    <line x1="290" y1="50" x2="360" y2="50"/>
    <path d="M372 50 L356 42 L356 58 Z"/>
  </g>
  <text x="280" y="55" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">Travel</text>

  <!-- faint trail lines -->
  <g stroke="#8a9a6b" stroke-width="1" stroke-dasharray="3 5" fill="none">
    <line x1="100" y1="95" x2="390" y2="95"/>
    <line x1="100" y1="185" x2="390" y2="185"/>
    <line x1="100" y1="275" x2="390" y2="275"/>
    <line x1="100" y1="365" x2="390" y2="365"/>
    <line x1="100" y1="455" x2="390" y2="455"/>
  </g>

  <!-- Walk: zig zag, hind just behind front -->
  <text x="12" y="100" font-size="14" font-weight="bold" fill="#23261f">Walk</text>
  <g fill="#8a9a6b" stroke="#23261f" stroke-width="1">
    <path d="M111 85 L100 81 L100 89 Z"/>
    <path d="M151 105 L140 101 L140 109 Z"/>
    <path d="M191 85 L180 81 L180 89 Z"/>
    <path d="M231 105 L220 101 L220 109 Z"/>
    <path d="M271 85 L260 81 L260 89 Z"/>
    <path d="M311 105 L300 101 L300 109 Z"/>
    <path d="M351 85 L340 81 L340 89 Z"/>
  </g>
  <g fill="#6b4f35" stroke="#23261f" stroke-width="1">
    <path d="M116 87 L105 83 L105 91 Z"/>
    <path d="M156 103 L145 99 L145 107 Z"/>
    <path d="M196 87 L185 83 L185 91 Z"/>
    <path d="M236 103 L225 99 L225 107 Z"/>
    <path d="M276 87 L265 83 L265 91 Z"/>
    <path d="M316 103 L305 99 L305 107 Z"/>
    <path d="M356 87 L345 83 L345 91 Z"/>
  </g>
  <text x="12" y="131" font-size="14" fill="#2f3a2b">Zig zag. Hind lands on or just behind front. Relaxed.</text>

  <!-- Trot: nearly one line, longer steps -->
  <text x="12" y="190" font-size="14" font-weight="bold" fill="#23261f">Trot</text>
  <g fill="#6b4f35" stroke="#23261f" stroke-width="1">
    <path d="M116 182 L105 178 L105 186 Z"/>
    <path d="M176 188 L165 184 L165 192 Z"/>
    <path d="M236 182 L225 178 L225 186 Z"/>
    <path d="M296 188 L285 184 L285 192 Z"/>
    <path d="M356 182 L345 178 L345 186 Z"/>
  </g>
  <g fill="none" stroke="#8a9a6b" stroke-width="2">
    <path d="M118 182 L107 178 L107 186 Z"/>
    <path d="M178 188 L167 184 L167 192 Z"/>
    <path d="M238 182 L227 178 L227 186 Z"/>
    <path d="M298 188 L287 184 L287 192 Z"/>
    <path d="M358 182 L347 178 L347 186 Z"/>
  </g>
  <text x="12" y="221" font-size="14" fill="#2f3a2b">Nearly one line, longer steps, hind on front. Purposeful.</text>

  <!-- Bound: hare -->
  <text x="12" y="280" font-size="14" font-weight="bold" fill="#23261f">Bound</text>
  <g stroke="#23261f" stroke-width="1">
    <ellipse cx="128" cy="266" rx="7" ry="4" fill="#6b4f35"/>
    <ellipse cx="128" cy="284" rx="7" ry="4" fill="#6b4f35"/>
    <circle cx="108" cy="273" r="3.5" fill="#8a9a6b"/>
    <circle cx="115" cy="279" r="3.5" fill="#8a9a6b"/>
    <ellipse cx="233" cy="266" rx="7" ry="4" fill="#6b4f35"/>
    <ellipse cx="233" cy="284" rx="7" ry="4" fill="#6b4f35"/>
    <circle cx="213" cy="273" r="3.5" fill="#8a9a6b"/>
    <circle cx="220" cy="279" r="3.5" fill="#8a9a6b"/>
    <ellipse cx="338" cy="266" rx="7" ry="4" fill="#6b4f35"/>
    <ellipse cx="338" cy="284" rx="7" ry="4" fill="#6b4f35"/>
    <circle cx="318" cy="273" r="3.5" fill="#8a9a6b"/>
    <circle cx="325" cy="279" r="3.5" fill="#8a9a6b"/>
  </g>
  <text x="12" y="311" font-size="14" fill="#2f3a2b">Hare: two big hind prints ahead of two small front. Y shape.</text>

  <!-- Stot: mule deer bounce -->
  <text x="12" y="370" font-size="14" font-weight="bold" fill="#23261f">Stot</text>
  <g fill="#6b4f35" stroke="#23261f" stroke-width="1">
    <path d="M118 357 L107 353 L107 361 Z"/>
    <path d="M132 361 L121 357 L121 365 Z"/>
    <path d="M119 373 L108 369 L108 377 Z"/>
    <path d="M133 377 L122 373 L122 381 Z"/>
    <path d="M318 357 L307 353 L307 361 Z"/>
    <path d="M332 361 L321 357 L321 365 Z"/>
    <path d="M319 373 L308 369 L308 377 Z"/>
    <path d="M333 377 L322 373 L322 381 Z"/>
  </g>
  <g stroke="#e8590c" stroke-width="1.5" fill="none">
    <line x1="140" y1="352" x2="300" y2="352"/>
    <line x1="140" y1="348" x2="140" y2="356"/>
    <line x1="300" y1="348" x2="300" y2="356"/>
  </g>
  <text x="220" y="347" font-size="14" fill="#e8590c" text-anchor="middle">gap 2.4 to 4.6 m</text>
  <text x="12" y="401" font-size="14" fill="#2f3a2b">Mule deer bounce: 4 prints in a tight group, then a big gap.</text>

  <!-- Gallop -->
  <text x="12" y="460" font-size="14" font-weight="bold" fill="#23261f">Gallop</text>
  <g fill="#8a9a6b" stroke="#23261f" stroke-width="1">
    <path d="M116 462 L105 458 L105 466 Z"/>
    <path d="M130 448 L119 444 L119 452 Z"/>
    <path d="M276 462 L265 458 L265 466 Z"/>
    <path d="M290 448 L279 444 L279 452 Z"/>
  </g>
  <g fill="#6b4f35" stroke="#23261f" stroke-width="1">
    <path d="M160 460 L149 456 L149 464 Z"/>
    <path d="M174 450 L163 446 L163 454 Z"/>
    <path d="M320 460 L309 456 L309 464 Z"/>
    <path d="M334 450 L323 446 L323 454 Z"/>
  </g>
  <text x="12" y="491" font-size="14" fill="#2f3a2b">Groups of 4 in a line, hind beyond front, long gaps. Running.</text>

  <text x="200" y="524" font-size="14" fill="#2f3a2b" text-anchor="middle">Dark = hind foot, light = front foot.</text>
  <text x="200" y="542" font-size="14" fill="#2f3a2b" text-anchor="middle">Measure stride same foot to same foot.</text>
</svg>
