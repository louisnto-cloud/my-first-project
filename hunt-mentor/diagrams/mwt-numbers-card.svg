<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Grid of nine white tail numbers to remember: 310 degree field of view; a doe is in heat about 24 hours; if not bred she comes into heat again about 28 days later; the rut peaks in November; 4 stomach chambers; about 70 percent of yearling bucks leave home; fawns are hidden about 2 weeks; best hearing 4 to 8 kilohertz; licking branch 1.2 to 1.5 metres up." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="20" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">White tail numbers to remember</text><rect x="8" y="36" width="124" height="80" rx="10" fill="#fbe3d4" stroke="#e8590c" stroke-width="2"/><text x="70" y="72" font-size="20" fill="#e8590c" text-anchor="middle" font-weight="bold">310°</text><text x="70" y="98" font-size="14" fill="#23261f" text-anchor="middle">field of view</text><rect x="138" y="36" width="124" height="80" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="72" font-size="20" fill="#2f3a2b" text-anchor="middle" font-weight="bold">24 h</text><text x="200" y="98" font-size="14" fill="#23261f" text-anchor="middle">doe in heat</text><rect x="268" y="36" width="124" height="80" rx="10" fill="#fbe3d4" stroke="#e8590c" stroke-width="2"/><text x="330" y="72" font-size="20" fill="#e8590c" text-anchor="middle" font-weight="bold">28 days</text><text x="330" y="98" font-size="14" fill="#23261f" text-anchor="middle">heat again</text><rect x="8" y="122" width="124" height="80" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="70" y="158" font-size="20" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Nov</text><text x="70" y="184" font-size="14" fill="#23261f" text-anchor="middle">rut peak</text><rect x="138" y="122" width="124" height="80" rx="10" fill="#fbe3d4" stroke="#e8590c" stroke-width="2"/><text x="200" y="158" font-size="20" fill="#e8590c" text-anchor="middle" font-weight="bold">4</text><text x="200" y="184" font-size="14" fill="#23261f" text-anchor="middle">stomachs</text><rect x="268" y="122" width="124" height="80" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="330" y="158" font-size="20" fill="#2f3a2b" text-anchor="middle" font-weight="bold">70%</text><text x="330" y="184" font-size="14" fill="#23261f" text-anchor="middle">young bucks leave</text><rect x="8" y="208" width="124" height="80" rx="10" fill="#fbe3d4" stroke="#e8590c" stroke-width="2"/><text x="70" y="244" font-size="20" fill="#e8590c" text-anchor="middle" font-weight="bold">2 wk</text><text x="70" y="270" font-size="14" fill="#23261f" text-anchor="middle">fawn hidden</text><rect x="138" y="208" width="124" height="80" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="244" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">4 to 8 kHz</text><text x="200" y="270" font-size="14" fill="#23261f" text-anchor="middle">best hearing</text><rect x="268" y="208" width="124" height="80" rx="10" fill="#fbe3d4" stroke="#e8590c" stroke-width="2"/><text x="330" y="244" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">1.2 to 1.5 m</text><text x="330" y="270" font-size="14" fill="#23261f" text-anchor="middle">licking branch</text>
</svg>
