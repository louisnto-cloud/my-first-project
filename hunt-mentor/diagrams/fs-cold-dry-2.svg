<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Stay dry step 2: open zips and take off the toque before you start to sweat on the climb.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">2. Vent before you sweat</text><path d="M0 250 L400 110 L400 300 L0 300 Z" fill="#dfe6d3"/><line x1="192" y1="180" x2="196" y2="151" stroke="#2f3a2b" stroke-width="7.0" stroke-linecap="round"/><line x1="208" y1="180" x2="204" y2="151" stroke="#2f3a2b" stroke-width="7.0" stroke-linecap="round"/><rect x="189" y="123" width="22" height="31" rx="6.0" fill="#e8590c"/><line x1="190" y1="128" x2="182" y2="148" stroke="#2f3a2b" stroke-width="6.0" stroke-linecap="round"/><line x1="210" y1="128" x2="218" y2="148" stroke="#2f3a2b" stroke-width="6.0" stroke-linecap="round"/><circle cx="200" cy="114" r="10.0" fill="#d9b48f"/><line x1="230" y1="110" x2="262" y2="78" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="270,70 256,73 267,84" fill="#4a7fb0"/><text x="300" y="60" font-size="16" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Heat out</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Zips open, toque off on the climb</text>
</svg>
