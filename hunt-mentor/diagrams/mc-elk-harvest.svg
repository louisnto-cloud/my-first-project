<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of resident elk hunter success, five years 2020 to 2024, computed from BC harvest statistics. Region 1 Island 73 percent, mostly limited entry draws. Region 2 Lower Mainland 39 percent, limited entry draws. Region 3 Thompson 0, only 2 hunters reported. Region 4 Kootenay 11 percent. Region 7B Peace 27 percent. Region 8 Okanagan 4 percent: 560 elk from 109,230 hunter days, about 195 days per elk.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Resident elk success, 2020 to 2024</text><text x="142" y="61.4" font-size="14" fill="#23261f" text-anchor="end">1 Island</text><rect x="150.0" y="46" width="176.2" height="22" rx="4" fill="#8a9a6b"/><text x="332.2" y="61.4" font-size="14" fill="#23261f" text-anchor="start">73%</text><text x="142" y="95.4" font-size="14" fill="#23261f" text-anchor="end">2 Lower Mainland</text><rect x="150.0" y="80" width="92.9" height="22" rx="4" fill="#e8590c"/><text x="248.9" y="95.4" font-size="14" fill="#23261f" text-anchor="start">39%</text><text x="142" y="129.4" font-size="14" fill="#23261f" text-anchor="end">3 Thompson</text><rect x="150.0" y="114" width="3" height="22" rx="4" fill="#e8590c"/><text x="156.0" y="129.4" font-size="14" fill="#23261f" text-anchor="start">0 (2 hunters)</text><text x="142" y="163.4" font-size="14" fill="#23261f" text-anchor="end">4 Kootenay</text><rect x="150.0" y="148" width="26.6" height="22" rx="4" fill="#8a9a6b"/><text x="182.6" y="163.4" font-size="14" fill="#23261f" text-anchor="start">11%</text><text x="142" y="197.4" font-size="14" fill="#23261f" text-anchor="end">7B Peace</text><rect x="150.0" y="182" width="64.1" height="22" rx="4" fill="#8a9a6b"/><text x="220.1" y="197.4" font-size="14" fill="#23261f" text-anchor="start">27%</text><text x="142" y="231.4" font-size="14" fill="#23261f" text-anchor="end">8 Okanagan</text><rect x="150.0" y="216" width="10.1" height="22" rx="4" fill="#e8590c"/><text x="166.1" y="231.4" font-size="14" fill="#23261f" text-anchor="start">4%</text><text x="200" y="268" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Region 8: 560 elk from 109,230 hunter days</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">About 195 days per elk. Survey estimates (90%)</text>
</svg>
