<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-label="A hillside split into a 3 by 3 grid. Scan order runs 1 to 9 in a snake pattern: bottom row left to right, middle row right to left, top row left to right. Start near, finish far.">
  <rect x="0" y="0" width="400" height="420" fill="#fffaf0"/>
  <path d="M10 330 L10 120 Q 90 40 170 80 Q 240 30 310 70 Q 360 90 390 80 L390 330 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
  <g fill="#2f3a2b">
    <polygon points="60,150 70,120 80,150"/>
    <polygon points="78,160 88,128 98,160"/>
    <polygon points="250,110 260,82 270,110"/>
    <polygon points="268,118 278,90 288,118"/>
    <polygon points="330,250 340,222 350,250"/>
  </g>
  <g stroke="#6b4f35" stroke-width="2" stroke-dasharray="6 5" fill="none">
    <line x1="137" y1="80" x2="137" y2="330"/>
    <line x1="263" y1="60" x2="263" y2="330"/>
    <line x1="10" y1="160" x2="390" y2="160"/>
    <line x1="10" y1="245" x2="390" y2="245"/>
  </g>
  <g font-family="sans-serif" font-size="22" font-weight="bold" fill="#e8590c" text-anchor="middle">
    <circle cx="73" cy="290" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="73" y="298">1</text>
    <circle cx="200" cy="290" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="200" y="298">2</text>
    <circle cx="326" cy="290" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="326" y="298">3</text>
    <circle cx="326" cy="203" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="326" y="211">4</text>
    <circle cx="200" cy="203" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="200" y="211">5</text>
    <circle cx="73" cy="203" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="73" y="211">6</text>
    <circle cx="110" cy="125" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="110" y="133">7</text>
    <circle cx="200" cy="125" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="200" y="133">8</text>
    <circle cx="326" cy="125" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="326" y="133">9</text>
  </g>
  <g stroke="#e8590c" stroke-width="3" fill="none">
    <path d="M92 290 L180 290 M219 290 L306 290"/>
    <path d="M343 290 Q 370 250 343 210"/>
    <path d="M306 203 L219 203 M180 203 L92 203"/>
    <path d="M56 203 Q 30 160 92 130"/>
    <path d="M128 125 L180 125 M219 125 L306 125"/>
  </g>
  <text x="200" y="40" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="middle">Far: ridges, benches, timber edges</text>
  <rect x="10" y="330" width="380" height="80" fill="#c9b79c"/>
  <circle cx="200" cy="358" r="12" fill="#2f3a2b"/>
  <rect x="186" y="370" width="28" height="22" rx="4" fill="#2f3a2b"/>
  <text x="200" y="406" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">You, sitting, binoculars on a rest</text>
  <text x="20" y="352" font-family="sans-serif" font-size="14" fill="#23261f">Start near</text>
  <text x="300" y="352" font-family="sans-serif" font-size="14" fill="#23261f">1 to 2 min</text>
  <text x="300" y="368" font-family="sans-serif" font-size="14" fill="#23261f">per square</text>
</svg>
