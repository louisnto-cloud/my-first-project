<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 498" font-family="sans-serif" role="img" aria-label="Your call: two tourniquet questions. How far above the wound? Answer A: 5 to 8 cm (2 to 3 in), American Red Cross, Stop the Bleed guides (70%). Answer B: 5 to 10 cm (2 to 4 in), Canadian Red Cross skills sheet, 2012 (75%). Loosen it later? Answer A: Slowly release after 10 minutes if bleeding has dropped a lot, Older Canadian Red Cross sheet, 2012 (75%). Answer B: Never loosen; only medical staff remove it, Newer American Red Cross and Stop the Bleed (70%). Sources differ. Learn both. Ask your first aid instructor.">
<rect width="400" height="498" rx="12" fill="#EEF1EA"/>
<text x="16" y="30" font-size="18" font-weight="bold" fill="#1F3D2B">Your call: two tourniquet questions</text><rect x="12" y="46" width="376" height="30" rx="8" fill="#1F3D2B"/><text x="200" y="67" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">How far above the wound?</text><rect x="12" y="84" width="182" height="133" rx="10" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="22" y="104" font-size="14" font-weight="bold" fill="#1F3D2B">Answer A</text><text x="22" y="126" font-size="15" font-weight="bold" fill="#17201A">5 to 8 cm (2 to 3</text>
<text x="22" y="145" font-size="15" font-weight="bold" fill="#17201A">in)</text><text x="22" y="168" font-size="14" fill="#1F3D2B">American Red Cross,</text>
<text x="22" y="186" font-size="14" fill="#1F3D2B">Stop the Bleed guides</text>
<text x="22" y="204" font-size="14" fill="#1F3D2B">(70%)</text><rect x="206" y="84" width="182" height="133" rx="10" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="216" y="104" font-size="14" font-weight="bold" fill="#1F3D2B">Answer B</text><text x="216" y="126" font-size="15" font-weight="bold" fill="#17201A">5 to 10 cm (2 to 4</text>
<text x="216" y="145" font-size="15" font-weight="bold" fill="#17201A">in)</text><text x="216" y="168" font-size="14" fill="#1F3D2B">Canadian Red Cross</text>
<text x="216" y="186" font-size="14" fill="#1F3D2B">skills sheet, 2012</text>
<text x="216" y="204" font-size="14" fill="#1F3D2B">(75%)</text><rect x="12" y="231" width="376" height="30" rx="8" fill="#1F3D2B"/><text x="200" y="252" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Loosen it later?</text><rect x="12" y="269" width="182" height="171" rx="10" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="22" y="289" font-size="14" font-weight="bold" fill="#1F3D2B">Answer A</text><text x="22" y="311" font-size="15" font-weight="bold" fill="#17201A">Slowly release</text>
<text x="22" y="330" font-size="15" font-weight="bold" fill="#17201A">after 10 minutes</text>
<text x="22" y="349" font-size="15" font-weight="bold" fill="#17201A">if bleeding has</text>
<text x="22" y="368" font-size="15" font-weight="bold" fill="#17201A">dropped a lot</text><text x="22" y="391" font-size="14" fill="#1F3D2B">Older Canadian Red</text>
<text x="22" y="409" font-size="14" fill="#1F3D2B">Cross sheet, 2012</text>
<text x="22" y="427" font-size="14" fill="#1F3D2B">(75%)</text><rect x="206" y="269" width="182" height="171" rx="10" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="216" y="289" font-size="14" font-weight="bold" fill="#1F3D2B">Answer B</text><text x="216" y="311" font-size="15" font-weight="bold" fill="#17201A">Never loosen; only</text>
<text x="216" y="330" font-size="15" font-weight="bold" fill="#17201A">medical staff</text>
<text x="216" y="349" font-size="15" font-weight="bold" fill="#17201A">remove it</text><text x="216" y="372" font-size="14" fill="#1F3D2B">Newer American Red</text>
<text x="216" y="390" font-size="14" fill="#1F3D2B">Cross and Stop the</text>
<text x="216" y="408" font-size="14" fill="#1F3D2B">Bleed (70%)</text><text x="16" y="462" font-size="14" font-weight="bold" fill="#17201A">Sources differ. Learn both. Ask your first</text>
<text x="16" y="480" font-size="14" font-weight="bold" fill="#17201A">aid instructor.</text>
</svg>
