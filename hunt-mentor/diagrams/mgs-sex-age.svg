<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two Canada geese side by side. The gander, the male, is drawn a little bigger, 75 percent. The goose, the female, has the same marks, 85 percent. By fall the young of the year look like adults, 80 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Gander, goose, young: same coat</text><g transform="translate(110 170) scale(1.75 1.75)"><path d="M-34 0 Q-38 -16 -18 -16 L12 -14 Q26 -10 24 2 Q18 12 -4 12 L-24 12 Q-36 8 -34 0Z" fill="#7a6a58"/><path d="M-36 2 Q-40 -2 -30 -8 L-28 6Z" fill="#fff"/><path d="M14 -12 Q18 -40 24 -46 L30 -44 Q24 -36 22 -10Z" fill="#2f3a2b"/><ellipse cx="28" cy="-48" rx="7" ry="5" fill="#2f3a2b"/><path d="M34 -49 L44 -46 L34 -44Z" fill="#2f3a2b"/><path d="M24 -50 Q28 -44 30 -46" stroke="#fff" stroke-width="3" fill="none"/><path fill="none" d="M-6 12 L-8 26 M2 12 L4 26" stroke="#2f3a2b" stroke-width="3"/></g><g transform="translate(290 178) scale(1.55 1.55)"><path d="M-34 0 Q-38 -16 -18 -16 L12 -14 Q26 -10 24 2 Q18 12 -4 12 L-24 12 Q-36 8 -34 0Z" fill="#7a6a58"/><path d="M-36 2 Q-40 -2 -30 -8 L-28 6Z" fill="#fff"/><path d="M14 -12 Q18 -40 24 -46 L30 -44 Q24 -36 22 -10Z" fill="#2f3a2b"/><ellipse cx="28" cy="-48" rx="7" ry="5" fill="#2f3a2b"/><path d="M34 -49 L44 -46 L34 -44Z" fill="#2f3a2b"/><path d="M24 -50 Q28 -44 30 -46" stroke="#fff" stroke-width="3" fill="none"/><path fill="none" d="M-6 12 L-8 26 M2 12 L4 26" stroke="#2f3a2b" stroke-width="3"/></g><text x="110" y="225" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Gander (male)</text><text x="110" y="243" font-size="14" fill="#23261f" text-anchor="middle">a bit bigger (75%)</text><text x="290" y="225" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Goose (female)</text><text x="290" y="243" font-size="14" fill="#23261f" text-anchor="middle">same marks (85%)</text><rect x="30" y="256" width="340" height="34" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="278" font-size="14" fill="#23261f" text-anchor="middle">By fall the young look like adults (80%)</text>
</svg>
