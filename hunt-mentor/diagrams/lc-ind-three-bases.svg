<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="sans-serif" role="img" aria-label="Three cards, not a map. Kamloops and Heffley Creek: Secwépemc, Tk&#x27;emlúps te Secwépemc territory, per the City of Kamloops and Thompson Rivers University. Mission: Stó:lō, People of the River, per the City of Mission and Stó:lō Nation. Okanagan quail trip: Syilx, the Okanagan Nation, per the Okanagan Nation Alliance. Region 3 also holds Nlaka&#x27;pamux, St&#x27;át&#x27;imc and Syilx territory, so the nation changes as you drive. Only the nations speak for their land.">
<rect x="0" y="0" width="400" height="440" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Three bases, three homelands</text><rect x="10" y="44" width="380" height="102" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/><g transform="translate(40 90) scale(1.0)"><path d="M0 20 C-14 2 -14 -18 0 -18 C14 -18 14 2 0 20 Z" fill="#2f3a2b"/><circle cy="-6" r="5" fill="#fff"/></g><text x="68" y="70" font-size="15" fill="#23261f" text-anchor="start">Kamloops, Heffley Creek</text><text x="68" y="96" font-size="21" font-weight="bold" fill="#2f3a2b" text-anchor="start">Secwépemc</text><text x="68" y="118" font-size="14" fill="#23261f" text-anchor="start">Tk&#x27;emlúps te Secwépemc territory</text><text x="382" y="139" font-size="12" fill="#6b4f35" text-anchor="end">City of Kamloops, TRU</text><rect x="10" y="154" width="380" height="102" rx="10" fill="#fff" stroke="#4a7fb0" stroke-width="2.5"/><g transform="translate(40 200) scale(1.0)"><path d="M0 20 C-14 2 -14 -18 0 -18 C14 -18 14 2 0 20 Z" fill="#4a7fb0"/><circle cy="-6" r="5" fill="#fff"/></g><text x="68" y="180" font-size="15" fill="#23261f" text-anchor="start">Mission</text><text x="68" y="206" font-size="21" font-weight="bold" fill="#4a7fb0" text-anchor="start">Stó:lō</text><text x="68" y="228" font-size="14" fill="#23261f" text-anchor="start">People of the River</text><text x="382" y="249" font-size="12" fill="#6b4f35" text-anchor="end">City of Mission, Stó:lō Nation</text><rect x="10" y="264" width="380" height="102" rx="10" fill="#fff" stroke="#e8590c" stroke-width="2.5"/><g transform="translate(40 310) scale(1.0)"><path d="M0 20 C-14 2 -14 -18 0 -18 C14 -18 14 2 0 20 Z" fill="#e8590c"/><circle cy="-6" r="5" fill="#fff"/></g><text x="68" y="290" font-size="15" fill="#23261f" text-anchor="start">Okanagan quail trip</text><text x="68" y="316" font-size="21" font-weight="bold" fill="#e8590c" text-anchor="start">Syilx</text><text x="68" y="338" font-size="14" fill="#23261f" text-anchor="start">Okanagan Nation</text><text x="382" y="359" font-size="12" fill="#6b4f35" text-anchor="end">Okanagan Nation Alliance</text><text x="200" y="382" font-size="14" fill="#23261f" text-anchor="middle">Region 3 also holds Nlaka&#x27;pamux, St&#x27;át&#x27;imc</text><text x="200" y="400" font-size="14" fill="#23261f" text-anchor="middle">and Syilx territory. The nation changes as you drive.</text><text x="200" y="426" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Not a map. Only the nations speak for their land.</text>
</svg>
