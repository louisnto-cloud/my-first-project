<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 454" font-family="sans-serif" role="img" aria-label="Three cards, not a map. Kamloops and Heffley Creek: Secwépemc, Tk&#x27;emlúps te Secwépemc territory, per the City of Kamloops and Thompson Rivers University (TRU). Mission: Stó:lō, People of the River, per the City of Mission and Stó:lō Nation. Okanagan quail trip: Syilx, the Okanagan Nation, per the Okanagan Nation Alliance. Region 3 also holds Nlaka&#x27;pamux, St&#x27;át&#x27;imc and Syilx territory, so the nation changes as you drive. Only the nations speak for their land.">
<rect width="400" height="454" fill="#fffaf0"/>
<text x="200" y="28" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Three bases, three homelands</text>
<rect x="8" y="42" width="384" height="104" rx="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2.5"/>
<rect x="8" y="42" width="10" height="104" rx="4" fill="#2f3a2b"/>
<g transform="translate(44 88) scale(1.25)" fill="#2f3a2b" stroke="none"><path d="M0 15 C-4 8 -11 1 -11 -5 A11 11 0 0 1 11 -5 C11 1 4 8 0 15z"/><circle cy="-5" r="4.2" fill="#fffaf0"/></g>
<text x="74" y="66" font-size="15" fill="#2f3a2b">Kamloops, Heffley Creek</text>
<text x="74" y="94" font-size="24" font-weight="bold" fill="#2f3a2b">Secwépemc</text>
<text x="74" y="116" font-size="15" fill="#2f3a2b">Tk&#x27;emlúps te Secwépemc territory</text>
<text x="74" y="137" font-size="14" fill="#6b5b4b">City of Kamloops, TRU</text>
<rect x="8" y="154" width="384" height="104" rx="10" fill="#fffaf0" stroke="#4a7fb0" stroke-width="2.5"/>
<rect x="8" y="154" width="10" height="104" rx="4" fill="#4a7fb0"/>
<g transform="translate(44 200) scale(1.25)" fill="#4a7fb0" stroke="none"><path d="M0 15 C-4 8 -11 1 -11 -5 A11 11 0 0 1 11 -5 C11 1 4 8 0 15z"/><circle cy="-5" r="4.2" fill="#fffaf0"/></g>
<text x="74" y="178" font-size="15" fill="#2f3a2b">Mission</text>
<text x="74" y="206" font-size="24" font-weight="bold" fill="#4a7fb0">Stó:lō</text>
<text x="74" y="228" font-size="15" fill="#2f3a2b">People of the River</text>
<text x="74" y="249" font-size="14" fill="#6b5b4b">City of Mission, Stó:lō Nation</text>
<rect x="8" y="266" width="384" height="104" rx="10" fill="#fffaf0" stroke="#e8590c" stroke-width="2.5"/>
<rect x="8" y="266" width="10" height="104" rx="4" fill="#e8590c"/>
<g transform="translate(44 312) scale(1.25)" fill="#e8590c" stroke="none"><path d="M0 15 C-4 8 -11 1 -11 -5 A11 11 0 0 1 11 -5 C11 1 4 8 0 15z"/><circle cy="-5" r="4.2" fill="#fffaf0"/></g>
<text x="74" y="290" font-size="15" fill="#2f3a2b">Okanagan quail trip</text>
<text x="74" y="318" font-size="24" font-weight="bold" fill="#e8590c">Syilx</text>
<text x="74" y="340" font-size="15" fill="#2f3a2b">Okanagan Nation</text>
<text x="74" y="361" font-size="14" fill="#6b5b4b">Okanagan Nation Alliance</text>
<text x="200" y="392" font-size="15" fill="#2f3a2b" text-anchor="middle">Region 3 also holds Nlaka&#x27;pamux, St&#x27;át&#x27;imc and Syilx</text>
<text x="200" y="412" font-size="15" fill="#2f3a2b" text-anchor="middle">territory. The nation changes as you drive.</text>
<text x="200" y="438" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">Not a map. Only the nations speak for their land.</text>
</svg>
