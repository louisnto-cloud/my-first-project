<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 486" font-family="sans-serif" role="img" aria-label="A black bear year, January to December. Bears leave the den lean and hungry from late March to May. Mating season is June to July. August to October is the big fall feed, called hyperphagia. Den entry runs mid October to late November in the nearest study. Cubs are born in the den in January or February. Region 3 seasons: spring 1 April to 30 June, fall 1 September to 30 November in most MUs (Management Units). Some males den later or not at all.">
