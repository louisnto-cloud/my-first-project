<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 302" font-family="sans-serif" role="img" aria-label="A black bear year. Bears leave the den lean and hungry from late March to May. Mating season is June to July. August to October is the big fall feed, called hyperphagia. Den entry runs mid October to late November in the nearest study. Cubs are born in the den in January or February. Region 3 seasons: spring 1 April to 30 June, fall 1 September to 30 November in most MUs.">
<rect x="0" y="0" width="400" height="302" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">A black bear year</text><rect x="110.0" y="52" width="23.5" height="204" fill="#dfe6d3" opacity=".6"/><text x="121.75" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">J</text><text x="145.25" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">F</text><rect x="157.0" y="52" width="23.5" height="204" fill="#dfe6d3" opacity=".6"/><text x="168.75" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">M</text><text x="192.25" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A</text><rect x="204.0" y="52" width="23.5" height="204" fill="#dfe6d3" opacity=".6"/><text x="215.75" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">M</text><text x="239.25" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">J</text><rect x="251.0" y="52" width="23.5" height="204" fill="#dfe6d3" opacity=".6"/><text x="262.75" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">J</text><text x="286.25" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A</text><rect x="298.0" y="52" width="23.5" height="204" fill="#dfe6d3" opacity=".6"/><text x="309.75" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">S</text><text x="333.25" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">O</text><rect x="345.0" y="52" width="23.5" height="204" fill="#dfe6d3" opacity=".6"/><text x="356.75" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">N</text><text x="380.25" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">D</text><text x="8" y="77" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Leave den</text><rect x="173.4" y="60" width="54.0" height="24" rx="5" fill="#8a9a6b"/><text x="231.5" y="77" font-size="14" font-weight="bold" fill="#8a9a6b" text-anchor="start">late Mar to May</text><text x="8" y="111" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Mating</text><rect x="227.5" y="94" width="47.0" height="24" rx="5" fill="#8b5a2b"/><text x="278.5" y="111" font-size="14" font-weight="bold" fill="#8b5a2b" text-anchor="start">June to July</text><text x="8" y="145" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Big fall feed</text><rect x="274.5" y="128" width="70.5" height="24" rx="5" fill="#e8590c"/><text x="270.5" y="145" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">Aug to Oct</text><text x="8" y="179" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Den entry</text><rect x="333.2" y="162" width="35.2" height="24" rx="5" fill="#2f3a2b"/><text x="329.25" y="179" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">mid Oct to Nov</text><text x="8" y="213" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Cubs born</text><rect x="110.0" y="196" width="47.0" height="24" rx="5" fill="#8b5a2b"/><text x="161.0" y="213" font-size="14" font-weight="bold" fill="#8b5a2b" text-anchor="start">Jan to Feb</text><text x="8" y="247" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">R3 seasons</text><rect x="180.5" y="230" width="70.5" height="24" rx="5" fill="#4a7fb0"/><text x="215.75" y="247" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">spring</text><rect x="298.0" y="230" width="70.5" height="24" rx="5" fill="#4a7fb0"/><text x="333.25" y="247" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">fall</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">R3 = Region 3. Some males den later or not at all.</text>
</svg>
