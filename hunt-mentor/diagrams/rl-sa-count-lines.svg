<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A ruler of 100 m on the map with contour lines across it, 20 m apart in height. 1 line in 100 m is about 11 degrees or 20 percent. 2 lines is about 22 degrees, 40 percent. 3 lines is about 31 degrees, 60 percent. 5 lines is 45 degrees, 100 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Count lines in 100 m</text><text x="388" y="24" font-size="14" fill="#2f3a2b" text-anchor="end">Hunt Map, 20 m lines</text><rect x="0" y="36" width="400" height="232" fill="#dfe6d3" opacity=".6"/><rect x="20" y="54" width="120" height="26" fill="#fff" stroke="#2f3a2b" stroke-width="1"/><path d="M80 54 V80" stroke="#8b5a2b" stroke-width="2.5"/><text x="160" y="73" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">1 line: about 11°, 20%</text><rect x="20" y="104" width="120" height="26" fill="#fff" stroke="#2f3a2b" stroke-width="1"/><path d="M50 104 V130" stroke="#8b5a2b" stroke-width="2.5"/><path d="M110 104 V130" stroke="#8b5a2b" stroke-width="2.5"/><text x="160" y="123" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">2 lines: about 22°, 40%</text><rect x="20" y="154" width="120" height="26" fill="#fff" stroke="#2f3a2b" stroke-width="1"/><path d="M40 154 V180" stroke="#8b5a2b" stroke-width="2.5"/><path d="M80 154 V180" stroke="#8b5a2b" stroke-width="2.5"/><path d="M120 154 V180" stroke="#8b5a2b" stroke-width="2.5"/><text x="160" y="173" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">3 lines: about 31°, 60%</text><rect x="20" y="204" width="120" height="26" fill="#fff" stroke="#2f3a2b" stroke-width="1"/><path d="M32 204 V230" stroke="#8b5a2b" stroke-width="2.5"/><path d="M56 204 V230" stroke="#8b5a2b" stroke-width="2.5"/><path d="M80 204 V230" stroke="#8b5a2b" stroke-width="2.5"/><path d="M104 204 V230" stroke="#8b5a2b" stroke-width="2.5"/><path d="M128 204 V230" stroke="#8b5a2b" stroke-width="2.5"/><text x="160" y="223" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">5 lines: 45°, 100%</text><text x="80" y="266" font-size="13" fill="#2f3a2b" text-anchor="middle">100 m</text><path d="M20 252 H140" stroke="#2f3a2b" stroke-width="2"/>
</svg>
