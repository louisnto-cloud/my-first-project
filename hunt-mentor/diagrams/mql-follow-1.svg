<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 1 of following a covey: at first light or dusk, stand still on a road edge and listen for the chi CA go assembly call. Point toward the sound and note the cover.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Follow a covey: 1 Listen</text>
<rect x="10" y="40" width="380" height="196" rx="8" fill="#dfe6d3"/>
<g transform="translate(70 190)"><circle r="10" fill="#e8590c"/><text x="0" y="-16" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">You</text></g>
