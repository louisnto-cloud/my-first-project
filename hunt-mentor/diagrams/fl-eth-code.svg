<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-label="The BC synopsis ethics code in six pictures: safety first, respect the animal with clean shots, care for the meat, pack out everything, no drugs or alcohol, respect landowners and other hunters, and report poachers.">
  <rect x="0" y="0" width="400" height="420" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The BC ethics code (synopsis page 77)</text>
<rect x="10.0" y="50" width="185.0" height="110" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<circle cx="102.5" cy="86.30000000000001" r="20" fill="#fffaf0" stroke="#e8590c" stroke-width="4"/><text x="102.5" y="93.30000000000001" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">!</text>
<text x="102.5" y="130" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Safety first</text>
<text x="102.5" y="149" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">you, partners, public</text>
<rect x="205.0" y="50" width="185.0" height="110" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<circle cx="297.5" cy="86.30000000000001" r="20" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/><circle cx="297.5" cy="86.30000000000001" r="6" fill="#2f3a2b"/>
<text x="297.5" y="130" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Clean kills</text>
<text x="297.5" y="149" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">clear vital shot only</text>
<rect x="10.0" y="170" width="185.0" height="110" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="84.5" y="188.3" width="36" height="36" rx="8" fill="#f2e6c9" stroke="#8b5a2b" stroke-width="2"/>
<text x="102.5" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Care for the meat</text>
<text x="102.5" y="269" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">waste is illegal</text>
<rect x="205.0" y="170" width="185.0" height="110" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="281.5" y="190.3" width="32" height="32" rx="6" fill="#2f3a2b"/><path d="M288.5 206.3 l6.3 7.2 l12.6 -14.4" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="297.5" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pack it out</text>
<text x="297.5" y="269" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">everything you brought</text>
<rect x="10.0" y="290" width="185.0" height="110" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="94.5" y="304.3" width="16" height="40" rx="4" fill="#8a6d3b"/><path d="M92.6 316.40000000000003 l19.8 19.8 M112.4 316.40000000000003 l-19.8 19.8" fill="none" stroke="#b3261e" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="102.5" y="370" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">No alcohol, drugs</text>
<text x="102.5" y="389" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">while hunting</text>
<rect x="205.0" y="290" width="185.0" height="110" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<text x="297.5" y="334.3" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">RAPP</text>
<text x="297.5" y="370" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Report poachers</text>
<text x="297.5" y="389" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">1 877 952 7277</text>
</svg>
