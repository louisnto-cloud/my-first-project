<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Elk social groups. Cow groups: cows, calves and yearlings, up to 20 or more, led by older cows. Bull groups live apart from the cows from spring to late summer. In the September rut a herd bull holds a harem of cows while younger bulls wait on the edge. Source BC elk account; the edge bulls line is a Tip.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Who lives with whom</text><rect x="10" y="44" width="180" height="110" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><rect x="10" y="44" width="180" height="26" rx="8" fill="#2f3a2b"/><rect x="10" y="58" width="180" height="12" rx="0" fill="#2f3a2b"/><text x="100.0" y="62" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Cow group</text><text x="100.0" y="92" font-size="14" fill="#23261f" text-anchor="middle">Cows, calves, yearlings</text><text x="100.0" y="114" font-size="14" fill="#23261f" text-anchor="middle">Up to 20 or more</text><text x="100.0" y="136" font-size="14" fill="#23261f" text-anchor="middle">Led by older cows</text><rect x="210" y="44" width="180" height="110" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><rect x="210" y="44" width="180" height="26" rx="8" fill="#8b5a2b"/><rect x="210" y="58" width="180" height="12" rx="0" fill="#8b5a2b"/><text x="300.0" y="62" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Bull group</text><text x="300.0" y="92" font-size="14" fill="#23261f" text-anchor="middle">Bulls apart</text><text x="300.0" y="114" font-size="14" fill="#23261f" text-anchor="middle">from the cows</text><text x="300.0" y="136" font-size="14" fill="#23261f" text-anchor="middle">Spring to late summer</text><rect x="10" y="166" width="380" height="96" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><rect x="10" y="166" width="380" height="26" rx="8" fill="#e8590c"/><rect x="10" y="180" width="380" height="12" rx="0" fill="#e8590c"/><text x="200.0" y="184" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Rut, September</text><text x="200.0" y="214" font-size="14" fill="#23261f" text-anchor="middle">Herd bull holds a harem of cows</text><text x="200.0" y="236" font-size="14" fill="#23261f" text-anchor="middle">Young bulls wait on the edge (Tip)</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">BC elk account (90%); edge bulls: Tip</text>
</svg>
