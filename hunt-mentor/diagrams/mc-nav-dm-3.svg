<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Map versus land drill step 3: mark a pencil dot where you think you are, then check with the phone and write down how far off you were.">
<rect width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c"/><text x="26" y="31" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">3</text><text x="52" y="32" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Mark where you think you are</text><rect x="20" y="56" width="360" height="200" rx="8" fill="#dfe6d3"/><path d="M90 190 C78 176 78 160 90 160 C102 160 102 176 90 190 Z" fill="#e8590c" stroke-linecap="round" stroke-linejoin="round"/><circle cx="90" cy="170" r="4" fill="#fffaf0"/><text x="170" y="100" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Pencil dot on the map</text><text x="170" y="130" font-size="15" fill="#23261f" text-anchor="start">Then a phone check</text><text x="170" y="160" font-size="15" fill="#23261f" text-anchor="start">Write the miss</text>
</svg>
