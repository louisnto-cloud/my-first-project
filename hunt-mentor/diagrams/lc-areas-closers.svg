<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 302" font-family="sans-serif" role="img" aria-label="Six things that close or limit Crown land: No Shooting and No Hunting Areas, Motor Vehicle Closed Areas, parks and ecological reserves, grazing leases with livestock on them, in season orders, and wildfire closures. No sign does not mean open: the closure is the law.">
