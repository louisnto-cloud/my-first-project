<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Year wheel for white tailed deer. Outer ring, antlers: cast January to March, growing in velvet April to August, hard antler September to December. Middle ring: rubs and scrapes build late October, the rut peaks in November, a small second rut in mid December, and fawns are born late May to June. Inner grey ring: winter range from mid December to March." font-family="sans-serif">
