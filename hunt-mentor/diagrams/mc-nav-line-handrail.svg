<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="You are somewhere on a road. Take one bearing to a mapped peak, draw the back bearing from the peak on the map, and where it crosses the road is you. Tip, built on resection, 85 percent.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">On a handrail? One bearing is enough</text><rect x="20" y="44" width="360" height="210" rx="4" fill="#dfe6d3"/><path d="M30 210 C120 190 260 220 370 180" fill="none" stroke="#2f3a2b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="340" y="172" font-size="15" fill="#2f3a2b" text-anchor="end" font-weight="bold">Road</text><polygon points="250,100 285.0,50 320,100" fill="#8a9a6b"/><text x="285" y="118" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Peak</text><line x1="285" y1="70" x2="150" y2="222" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><circle cx="160" cy="206" r="10" fill="#e8590c"/><text x="160" y="240" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">You</text><text x="200" y="274" font-size="15" fill="#23261f" text-anchor="middle">Back bearing from the peak crosses the road</text><text x="200" y="293" font-size="14" fill="#6b4f35" text-anchor="middle">Tip, from resection (85%)</text>
</svg>
