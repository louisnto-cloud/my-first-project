<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 304" font-family="sans-serif" role="img" aria-label="Snowshoe hare coat colour by month, 85 percent. White from about October to February. Moulting to brown in March and April. Brown from May to July. Moulting to white in August and September. Drawings: a white hare in winter, a brown hare in summer. On the wet southwest coast hares stay brown all year. Below, the Region 3 season runs from 1 August to 30 April, 10 a day, 98 percent, so it covers the white coat months.">
