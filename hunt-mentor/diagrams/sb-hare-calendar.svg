<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Snowshoe hare coat colour by month, 85 percent. White from about October to February. Moulting to brown in March and April. Brown from May to July. Moulting to white in August and September. On the wet southwest coast hares stay brown all year. Below, the Region 3 season runs from 1 August to 30 April, 10 a day, 98 percent, so it covers the white coat months.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="24" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Snowshoe hare coat, by month (85%)</text>
  <text x="29.5" y="56" font-size="12" fill="#2f3a2b" text-anchor="middle">Jan</text>
  <text x="60.5" y="56" font-size="12" fill="#2f3a2b" text-anchor="middle">Feb</text>
  <text x="91.5" y="56" font-size="12" fill="#2f3a2b" text-anchor="middle">Mar</text>
  <text x="122.5" y="56" font-size="12" fill="#2f3a2b" text-anchor="middle">Apr</text>
  <text x="153.5" y="56" font-size="12" fill="#2f3a2b" text-anchor="middle">May</text>
  <text x="184.5" y="56" font-size="12" fill="#2f3a2b" text-anchor="middle">Jun</text>
  <text x="215.5" y="56" font-size="12" fill="#2f3a2b" text-anchor="middle">Jul</text>
  <text x="246.5" y="56" font-size="12" fill="#2f3a2b" text-anchor="middle">Aug</text>
  <text x="277.5" y="56" font-size="12" fill="#2f3a2b" text-anchor="middle">Sep</text>
  <text x="308.5" y="56" font-size="12" fill="#2f3a2b" text-anchor="middle">Oct</text>
  <text x="339.5" y="56" font-size="12" fill="#2f3a2b" text-anchor="middle">Nov</text>
  <text x="370.5" y="56" font-size="12" fill="#2f3a2b" text-anchor="middle">Dec</text>
  <rect x="14" y="66" width="372" height="44" rx="6" fill="#f4f4f4" stroke="#2f3a2b"/>
  <rect x="138" y="66" width="93" height="44" fill="#9b8466"/>
  <rect x="76" y="66" width="62" height="44" fill="#c9bba6"/>
  <rect x="231" y="66" width="62" height="44" fill="#c9bba6"/>
  <text x="51.199999999999996" y="94" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">White</text>
  <text x="107" y="94" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Moult</text>
  <text x="184.5" y="94" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Brown</text>
  <text x="262" y="94" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Moult</text>
  <text x="339.5" y="94" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">White</text>
  <g transform="translate(70 170) scale(1.4)"><ellipse stroke="#2f3a2b" rx="22" ry="13" fill="#f4f4f4"/><circle cx="18" cy="-8" r="9" fill="#f4f4f4"/><ellipse cx="14" cy="-26" rx="4" ry="12" fill="#f4f4f4" transform="rotate(-15 14 -26)"/><ellipse cx="20" cy="-26" rx="4" ry="12" fill="#f4f4f4" transform="rotate(10 20 -26)"/><circle cx="22" cy="-10" r="2" fill="#2f3a2b"/><ellipse cx="-14" cy="12" rx="12" ry="4" fill="#f4f4f4"/></g>
  <text x="70" y="212" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Winter</text>
  <g transform="translate(200 170) scale(1.4)"><ellipse rx="22" ry="13" fill="#9b8466"/><circle cx="18" cy="-8" r="9" fill="#9b8466"/><ellipse cx="14" cy="-26" rx="4" ry="12" fill="#9b8466" transform="rotate(-15 14 -26)"/><ellipse cx="20" cy="-26" rx="4" ry="12" fill="#9b8466" transform="rotate(10 20 -26)"/><circle cx="22" cy="-10" r="2" fill="#2f3a2b"/><ellipse cx="-14" cy="12" rx="12" ry="4" fill="#9b8466"/></g>
  <text x="200" y="212" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Summer</text>
  <text x="330" y="160" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wet southwest</text>
  <text x="330" y="178" font-size="13" fill="#2f3a2b" text-anchor="middle">coast: brown</text>
  <text x="330" y="196" font-size="13" fill="#2f3a2b" text-anchor="middle">all year</text>
  <text x="200" y="240" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Region 3 season (98%)</text>
  <rect x="14" y="250" width="124" height="22" rx="4" fill="#2f6e3b"/>
  <rect x="231" y="250" width="155" height="22" rx="4" fill="#2f6e3b"/>
  <text x="76" y="266" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">to Apr 30</text>
  <text x="308.5" y="266" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">from Aug 1</text>
  <text x="200" y="292" font-size="14" fill="#2f3a2b" text-anchor="middle">10 a day</text>
</svg>
