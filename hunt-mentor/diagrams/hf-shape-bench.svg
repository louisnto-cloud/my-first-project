  <text x="12" y="26" font-size="18" font-weight="bold" fill="#2f3a2b">Bench</text>
  <text x="388" y="26" font-size="14" fill="#2f3a2b" text-anchor="end">High ground at top</text>
  <rect x="250" y="226" width="140" height="66" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/>
  <path d="M258 236 L300 262 L345 264 L382 288" fill="none" stroke="#2f3a2b" stroke-width="3"/>
  <text x="320" y="254" font-size="14" fill="#2f3a2b" text-anchor="middle">side view</text>
  <text x="12" y="290" font-size="15" fill="#2f3a2b">Tight lines above and below</text>
</svg>
