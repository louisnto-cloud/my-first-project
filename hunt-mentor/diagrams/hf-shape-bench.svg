  <rect x="0" y="36" width="400" height="232" fill="#dfe6d3" opacity=".6"/>
  <path d="M0 82 C 120 76, 260 90, 400 84 L400 168 C 260 176, 120 160, 0 166 Z" fill="#e8590c" opacity=".18"/>
  <g fill="none" stroke="#8b5a2b" stroke-width="2.5">
    <path d="M0 50 C 120 44, 260 58, 400 52"/><path d="M0 66 C 120 60, 260 74, 400 68"/><path d="M0 82 C 120 76, 260 90, 400 84"/>
    <path d="M0 166 C 120 160, 260 176, 400 168"/><path d="M0 182 C 120 176, 260 192, 400 184"/><path d="M0 198 C 120 192, 260 208, 400 200"/><path d="M0 214 C 120 208, 260 224, 400 216"/>
  </g>
  <g transform="translate(110 128)">
