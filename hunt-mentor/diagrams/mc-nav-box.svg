<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A map of a hunting area boxed in by four line features: the road along the south is the baseline with the truck on it, a creek on the east and a power line on the west are handrails, and a ridge along the north is the backstop you do not cross. Inside the box you cannot be truly lost. Tip.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Box yourself in</text><rect x="30" y="52" width="340" height="206" rx="2" fill="#dfe6d3" stroke="#8b5a2b" stroke-width="2"/><line x1="30" y1="238" x2="370" y2="238" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><path d="M330 52 C320 100 345 150 330 238" fill="none" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 80 C120 66 240 92 370 74" fill="none" stroke="#8b5a2b" stroke-width="5" stroke-dasharray="2 0" stroke-linecap="round" stroke-linejoin="round"/><line x1="70" y1="52" x2="70" y2="238" stroke="#7b6f9b" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6"/><g transform="translate(200 236) scale(0.8)"><rect x="-22" y="-14" width="30" height="14" fill="#2f3a2b"/><path d="M8 -14 h10 l6 7 v7 h-16 Z" fill="#2f3a2b"/><circle cx="-12" cy="2" r="5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/><circle cx="14" cy="2" r="5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/></g><ellipse cx="190" cy="150" rx="48.0" ry="32" fill="none" stroke="#8b5a2b" stroke-width="1.6"/><ellipse cx="190" cy="150" rx="24.0" ry="16" fill="none" stroke="#8b5a2b" stroke-width="1.6"/><text x="200" y="255" font-size="14" fill="#23261f" text-anchor="middle">Baseline: the road</text><text x="328" y="150" font-size="14" fill="#4a7fb0" text-anchor="end">Creek</text><text x="200" y="100" font-size="14" fill="#8b5a2b" text-anchor="middle">Backstop: the ridge</text><text x="78" y="200" font-size="14" fill="#5f527f" text-anchor="start">Power line</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Inside the box you cannot be truly lost (Tip)</text>
</svg>
