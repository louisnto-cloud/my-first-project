<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 374" font-family="sans-serif" role="img" aria-label="CZ 457 cheat sheet: safety back with the white dot showing is on; the bolt opens with the safety on; the magazine catch is in front of the magazine, press it back; to unload take the magazine out, open the bolt, look and feel; zero at 50 m, dead on from 15 to 55 m; clean from the chamber, and after wet days; stock screws 3.5 newton metres; standard trigger 8 to 15 newtons; no suppressor, ever."><rect x="0" y="0" width="400" height="374" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">CZ 457 cheat sheet</text><rect x="14" y="44" width="372" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="26" y="64" font-size="14" font-weight="bold" text-anchor="start" fill="#FF6A13">Safety</text><text x="140" y="64" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Back, white dot = ON</text><rect x="14" y="78" width="372" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="26" y="98" font-size="14" font-weight="bold" text-anchor="start" fill="#1F3D2B">Bolt</text><text x="140" y="98" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Opens with safety ON</text><rect x="14" y="112" width="372" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="26" y="132" font-size="14" font-weight="bold" text-anchor="start" fill="#1F3D2B">Mag out</text><text x="140" y="132" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Catch in front, press back</text><rect x="14" y="146" width="372" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="26" y="166" font-size="14" font-weight="bold" text-anchor="start" fill="#FF6A13">Unload</text><text x="140" y="166" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Mag out, bolt open, look, feel</text><rect x="14" y="180" width="372" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="26" y="200" font-size="14" font-weight="bold" text-anchor="start" fill="#1F3D2B">Zero</text><text x="140" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">50 m, dead on 15 to 55 m</text><rect x="14" y="214" width="372" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="26" y="234" font-size="14" font-weight="bold" text-anchor="start" fill="#1F3D2B">Clean</text><text x="140" y="234" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">From the chamber, after wet days</text><rect x="14" y="248" width="372" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="26" y="268" font-size="14" font-weight="bold" text-anchor="start" fill="#1F3D2B">Stock screws</text><text x="140" y="268" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">3.5 Nm</text><rect x="14" y="282" width="372" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="26" y="302" font-size="14" font-weight="bold" text-anchor="start" fill="#1F3D2B">Trigger</text><text x="140" y="302" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">8 to 15 N standard</text><rect x="14" y="316" width="372" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="26" y="336" font-size="14" font-weight="bold" text-anchor="start" fill="#FF6A13">Law</text><text x="140" y="336" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">No suppressor, ever</text><text x="200" y="362" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">All from the CZ manual or the law (95 to 99%).</text></svg>
