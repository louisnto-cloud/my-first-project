<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 412" role="img" aria-label="Top view of a road. The road allowance is the shaded band 15 metres each side of the middle of a road with under 3 lanes, or 15 metres from the pavement edge on 3 lanes or more, or to private or cultivated land if that comes first. Inside it: no hunting and no shooting, and no shooting across the road. On listed highways only, a further 400 metre band beside the road allowance on each side bans bullets and slugs; a shotgun with shot is allowed there." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="412" fill="#fffaf0"/>
<text x="200" y="24" font-size="19" fill="#23261f" text-anchor="middle" font-weight="bold">The road allowance (top view)</text>
<rect x="0" y="40" width="400" height="300" fill="#dfe6d3"/>
<rect x="0" y="50" width="400" height="70" fill="#f6d9c4"/><rect x="0" y="250" width="400" height="70" fill="#f6d9c4"/>
<rect x="0" y="120" width="400" height="130" fill="#e8590c" opacity=".28"/>
<rect x="0" y="160" width="400" height="50" fill="#9a9a92"/>
<line x1="0" y1="185" x2="400" y2="185" stroke="#f2c94c" stroke-width="3" stroke-dasharray="16 12"/>
<line x1="0" y1="120" x2="400" y2="120" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="8 6"/>
<line x1="0" y1="250" x2="400" y2="250" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="392" y="142" font-size="15" fill="#23261f" text-anchor="end" font-weight="bold">15 m</text>
<text x="392" y="240" font-size="15" fill="#23261f" text-anchor="end" font-weight="bold">15 m</text>
<text x="10" y="142" font-size="15" fill="#c92a2a" text-anchor="start" font-weight="bold">Road allowance: no hunting,</text>
<text x="10" y="240" font-size="15" fill="#c92a2a" text-anchor="start" font-weight="bold">no shooting, no shot across</text>
<line x1="300" y1="266" x2="300.0" y2="110.0" stroke="#c92a2a" stroke-width="3"/><polygon points="300,104 304.3,113.0 295.7,113.0" fill="#c92a2a"/><circle cx="300" cy="186" r="16" fill="none" stroke="#c92a2a" stroke-width="4"/><line x1="288.8" y1="197.2" x2="311.2" y2="174.8" stroke="#c92a2a" stroke-width="4"/>
<text x="10" y="76" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Listed highways only: 400 m band.</text>
<text x="10" y="95" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">No bullet or slug. Shot is OK.</text>
<text x="10" y="280" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Listed highways only: 400 m band.</text>
<text x="10" y="299" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">No bullet or slug. Shot is OK.</text>
<text x="10" y="362" font-size="14" fill="#2f3a2b" text-anchor="start">Under 3 lanes: 15 m (16 yd) each side of the middle.</text>
<text x="10" y="381" font-size="14" fill="#2f3a2b" text-anchor="start">3 lanes or more: 15 m from the pavement edge.</text>
<text x="10" y="400" font-size="14" fill="#2f3a2b" text-anchor="start">Or to private or cultivated land, whichever comes first.</text>
</svg>
