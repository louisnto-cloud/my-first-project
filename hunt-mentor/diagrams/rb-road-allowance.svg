<g data-tip="15 m (16 yd)|Under 3 lanes: 15 m each side of the middle of the road. 3 lanes or more: 15 m from the pavement edge. Or to private or cultivated land, whichever comes first (99%, synopsis page 10).">
<line x1="44" y1="154" x2="70" y2="154" stroke="#2f3a2b" stroke-width="1.6"/>
