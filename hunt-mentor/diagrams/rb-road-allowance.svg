<text x="91.7785" y="99" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">15 m</text>
</g>
<g data-tip="No shot across|No shooting across the road allowance, no shooting within it, and no hunting within it (99%, page 10).">
<path d="M232 230 L232 82" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 5"/><path d="M232.0 74.0 L225.9 85.0 L238.1 85.0z" fill="#c0392b"/>
<circle cx="232" cy="154" r="15" fill="#fffaf0" stroke="#c0392b" stroke-width="3.5"/><line x1="221.5" y1="164.5" x2="242.5" y2="143.5" stroke="#c0392b" stroke-width="3.5"/>
</g>
<g data-tip="Which roads|Every numbered highway, and every public road of 2 lanes or more kept up by the Ministry of Transportation and Infrastructure or its contractors, the federal government, or another province or territory (99%).">
<rect x="252.8" y="76.0" width="126.4" height="27.0" rx="5" fill="#fffaf0" stroke="#c0392b" stroke-width="1.2"/>
<text x="316" y="95" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">road allowance</text>
<rect x="76.8" y="210.0" width="126.4" height="27.0" rx="5" fill="#fffaf0" stroke="#c0392b" stroke-width="1.2"/>
<text x="140" y="229" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">road allowance</text>
</g>
<g data-tip="400 m bands|Listed highways also ban single projectiles within 400 m of the road allowance. Example: Hwy 5 between Hope and Kamloops; Hwy 5 north of Kamloops is not on that list (95%, my reading).">
<rect x="281.7" y="22.0" width="60.5" height="27.0" rx="5" fill="#fffaf0" stroke="#9a6a2a" stroke-width="1.2"/>
<text x="312" y="41" font-size="15" font-weight="bold" fill="#7a4f1a" text-anchor="middle">400 m</text>
<rect x="281.7" y="256.0" width="60.5" height="27.0" rx="5" fill="#fffaf0" stroke="#9a6a2a" stroke-width="1.2"/>
<text x="312" y="275" font-size="15" font-weight="bold" fill="#7a4f1a" text-anchor="middle">400 m</text>
</g>
<g data-tip="Safe habit|Stop, engine off, out of the truck, walk 15 m off the road and off the pavement, then load (Tip).">
<rect x="12" y="318" width="26" height="26" rx="4" fill="#efc2b4" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="48" y="330" font-size="16" font-weight="bold" fill="#c0392b">No hunting, no shooting,</text>
<text x="48" y="349" font-size="16" font-weight="bold" fill="#c0392b">no shot across (99%)</text>
</g>
<rect x="12" y="366" width="26" height="26" rx="4" fill="#f3dcb8" stroke="#9a6a2a" stroke-width="1.4"/>
<text x="48" y="378" font-size="16" font-weight="bold" fill="#7a4f1a">Listed highways only: no bullet</text>
<text x="48" y="397" font-size="16" font-weight="bold" fill="#7a4f1a">or slug. Shot is OK.</text>
<line x1="8" y1="416" x2="392" y2="416" stroke="#d8ccb4" stroke-width="1"/>
<text x="12" y="438" font-size="15" fill="#2f3a2b">Under 3 lanes: 15 m (16 yd) from the middle</text>
<text x="12" y="459" font-size="15" fill="#2f3a2b">3 lanes or more: 15 m from the pavement edge</text>
<text x="12" y="480" font-size="15" fill="#2f3a2b">Or to private or cultivated land, if closer</text>
</svg>
