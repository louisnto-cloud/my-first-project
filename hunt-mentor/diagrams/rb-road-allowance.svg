<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 495" font-family="sans-serif" role="img" aria-label="Top view of a road with cars. A red dashed band on each side marks the road allowance: no hunting, no shooting, and no shot across the road (99%). On a road under 3 lanes it runs 15 metres (16 yards) each side of the middle; on 3 lanes or more, 15 metres from the pavement edge; or to private or cultivated land if that comes first. On listed highways only, a further 400 metre band beyond the road allowance on each side bans bullets and slugs; a shotgun with shot is OK there. Not to scale.">
