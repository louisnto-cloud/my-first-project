<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 364" font-family="sans-serif" role="img" aria-label="Eight goose rules, all 99 percent, from the Rule Book migratory birds page. 1: federal Migratory Game Bird Hunting Permit (MGBHP) with the stamp. 2: three shells, plug in. 3: non toxic shot only. 4: hours, half an hour before sunrise to half an hour after sunset. 5: no hunting within 400 metres of bait until it has been gone 7 days. 6: no electronic calls. 7: no shooting from a moving motor boat. 8: a feathered wing or head stays on. Study aid only. The official regulations are the law.">
<rect width="400" height="364" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The 8 rules that catch goose hunters</text>
<text x="200" y="42" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Study aid only. The official regulations are the law.</text>
<rect x="8" y="52" width="189" height="60" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="1.8"/>
<circle cx="38" cy="82.0" r="21" fill="#f4eedf"/>
<g transform="translate(38 82.0)"><rect x="-15" y="-11" width="30" height="22" rx="3" fill="#ffffff" stroke="#2f3a2b" stroke-width="1.6"/><path d="M-11 -5 H3 M-11 0 H3 M-11 5 H0" stroke="#2f3a2b" stroke-width="1.6"/><rect x="5" y="-8" width="8" height="9" fill="#e8590c"/><path d="M5 -8 l2 2 l2 -2 l2 2 l2 -2" stroke="#fffaf0" stroke-width="1" fill="none"/></g>
<text x="66" y="78" font-size="16" font-weight="bold" fill="#2f3a2b">Permit + stamp</text>
<text x="66" y="98" font-size="15" fill="#2f3a2b">federal MGBHP</text>
<rect x="203" y="52" width="189" height="60" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="1.8"/>
<circle cx="233" cy="82.0" r="21" fill="#f4eedf"/>
<g transform="translate(233 82.0)"><rect x="-13.5" y="-12" width="7" height="17" rx="1.5" fill="#c0392b"/><rect x="-14" y="5" width="8" height="6" rx="1" fill="#c9a227"/><rect x="-3.5" y="-12" width="7" height="17" rx="1.5" fill="#c0392b"/><rect x="-4" y="5" width="8" height="6" rx="1" fill="#c9a227"/><rect x="6.5" y="-12" width="7" height="17" rx="1.5" fill="#c0392b"/><rect x="6" y="5" width="8" height="6" rx="1" fill="#c9a227"/></g>
<text x="261" y="78" font-size="16" font-weight="bold" fill="#2f3a2b">3 shells</text>
<text x="261" y="98" font-size="15" fill="#2f3a2b">plug in</text>
<rect x="8" y="118" width="189" height="60" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="1.8"/>
<circle cx="38" cy="148.0" r="21" fill="#f4eedf"/>
<g transform="translate(38 148.0)"><circle cx="-8" cy="-4" r="3.2" fill="#9aa3ad" stroke="#3b3f45" stroke-width="0.8"/><circle cx="-2" cy="-7" r="3.2" fill="#9aa3ad" stroke="#3b3f45" stroke-width="0.8"/><circle cx="4" cy="-4" r="3.2" fill="#9aa3ad" stroke="#3b3f45" stroke-width="0.8"/><circle cx="10" cy="-6" r="3.2" fill="#9aa3ad" stroke="#3b3f45" stroke-width="0.8"/><circle cx="-5" cy="2" r="3.2" fill="#9aa3ad" stroke="#3b3f45" stroke-width="0.8"/><circle cx="1" cy="0" r="3.2" fill="#9aa3ad" stroke="#3b3f45" stroke-width="0.8"/><circle cx="7" cy="3" r="3.2" fill="#9aa3ad" stroke="#3b3f45" stroke-width="0.8"/><circle cx="-10" cy="6" r="3.2" fill="#9aa3ad" stroke="#3b3f45" stroke-width="0.8"/><circle cx="-1" cy="7" r="3.2" fill="#9aa3ad" stroke="#3b3f45" stroke-width="0.8"/><circle cx="5" cy="9" r="3.2" fill="#9aa3ad" stroke="#3b3f45" stroke-width="0.8"/><circle cx="11" cy="4" r="3.2" fill="#9aa3ad" stroke="#3b3f45" stroke-width="0.8"/></g>
<text x="66" y="144" font-size="16" font-weight="bold" fill="#2f3a2b">Non toxic</text>
<text x="66" y="164" font-size="15" fill="#2f3a2b">shot only</text>
<rect x="203" y="118" width="189" height="60" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="1.8"/>
<circle cx="233" cy="148.0" r="21" fill="#f4eedf"/>
<g transform="translate(233 148.0)"><path d="M-9 4 A9 9 0 0 1 9 4z" fill="#f2b705"/><path d="M0 -8 L0 -13" stroke="#f2b705" stroke-width="2"/><path d="M-8 -3 L-12 -7" stroke="#f2b705" stroke-width="2"/><path d="M8 -3 L12 -7" stroke="#f2b705" stroke-width="2"/><path d="M-16 4 H16" stroke="#2f3a2b" stroke-width="2"/><path d="M-10 10 H-2 M2 10 H10" stroke="#4a7fb0" stroke-width="2"/></g>
<text x="261" y="144" font-size="16" font-weight="bold" fill="#2f3a2b">Hours</text>
<text x="261" y="164" font-size="15" fill="#2f3a2b">30 min each side</text>
<rect x="8" y="184" width="189" height="60" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="1.8"/>
<circle cx="38" cy="214.0" r="21" fill="#f4eedf"/>
<g transform="translate(38 214.0)"><path d="M-15 9 C-10 -6 10 -6 15 9z" fill="#d9a400"/><ellipse cx="-6" cy="3" rx="1.8" ry="1.2" fill="#a07a00"/><ellipse cx="0" cy="-1" rx="1.8" ry="1.2" fill="#a07a00"/><ellipse cx="6" cy="4" rx="1.8" ry="1.2" fill="#a07a00"/><ellipse cx="-2" cy="6" rx="1.8" ry="1.2" fill="#a07a00"/><ellipse cx="4" cy="-2" rx="1.8" ry="1.2" fill="#a07a00"/></g>
<circle cx="38" cy="214.0" r="21" fill="none" stroke="#c0392b" stroke-width="2.6"/><path d="M23.3 199.3 L52.7 228.7" stroke="#c0392b" stroke-width="2.6"/>
<text x="66" y="210" font-size="16" font-weight="bold" fill="#2f3a2b">Bait</text>
<text x="66" y="230" font-size="15" fill="#2f3a2b">400 m, 7 days</text>
<rect x="203" y="184" width="189" height="60" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="1.8"/>
<circle cx="233" cy="214.0" r="21" fill="#f4eedf"/>
<g transform="translate(233 214.0)"><rect x="-15" y="-10" width="20" height="20" rx="4" fill="#3b3f45"/><circle cx="-5" cy="0" r="6" fill="#5c636b"/><path d="M9 -5 a7 7 0 0 1 0 10 M13 -9 a12 12 0 0 1 0 18" stroke="#e8590c" stroke-width="2" fill="none"/></g>
<circle cx="233" cy="214.0" r="21" fill="none" stroke="#c0392b" stroke-width="2.6"/><path d="M218.3 199.3 L247.7 228.7" stroke="#c0392b" stroke-width="2.6"/>
<text x="261" y="210" font-size="16" font-weight="bold" fill="#2f3a2b">No electronic</text>
<text x="261" y="230" font-size="15" fill="#2f3a2b">calls</text>
<rect x="8" y="250" width="189" height="60" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="1.8"/>
<circle cx="38" cy="280.0" r="21" fill="#f4eedf"/>
<g transform="translate(38 280.0)"><path d="M-16 0 H12 L8 8 H-12z" fill="#8b5a2b"/><rect x="11" y="-7" width="5" height="9" rx="1" fill="#3b3f45"/><path d="M14 2 V9" stroke="#3b3f45" stroke-width="2"/><path d="M-16 11 q4 -3 8 0 t8 0 t8 0 t8 0" stroke="#4a7fb0" stroke-width="1.8" fill="none"/></g>
<circle cx="38" cy="280.0" r="21" fill="none" stroke="#c0392b" stroke-width="2.6"/><path d="M23.3 265.3 L52.7 294.7" stroke="#c0392b" stroke-width="2.6"/>
<text x="66" y="276" font-size="16" font-weight="bold" fill="#2f3a2b">No moving</text>
<text x="66" y="296" font-size="15" fill="#2f3a2b">motor boat</text>
<rect x="203" y="250" width="189" height="60" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="1.8"/>
<circle cx="233" cy="280.0" r="21" fill="#f4eedf"/>
<g transform="translate(233 280.0)"><path d="M-14 -6 C-4 -12 10 -10 16 -2 C8 -2 2 2 -2 8 C-8 6 -14 2 -14 -6z" fill="#7a6450"/><path d="M-2 8 C2 2 8 -2 16 -2 L14 2 C8 2 4 6 1 10z" fill="#2f6e3b"/><path d="M-10 -4 C-2 -8 6 -7 12 -3" stroke="#a89077" stroke-width="1.2" fill="none"/></g>
<text x="261" y="276" font-size="16" font-weight="bold" fill="#2f3a2b">Wing or head</text>
<text x="261" y="296" font-size="15" fill="#2f3a2b">stays on</text>
<text x="200" y="334" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">All 99%: Rule Book, migratory birds page</text>
<text x="200" y="353" font-size="14" fill="#6b5b4b" text-anchor="middle">MGBHP: Migratory Game Bird Hunting Permit</text>
</svg>
