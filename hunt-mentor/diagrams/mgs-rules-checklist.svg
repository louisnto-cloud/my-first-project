<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Eight goose rules, all 99 percent, from the Rule Book migratory birds page. 1: federal Migratory Game Bird Hunting Permit with the stamp. 2: three shells, plug in. 3: non toxic shot only. 4: hours, half an hour before sunrise to half an hour after sunset. 5: no hunting within 400 metres of bait until it has been gone 7 days. 6: no electronic calls. 7: no shooting from a moving motor boat. 8: a feathered wing or head stays on. Study aid only. The official regulations are the law.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The 8 rules that catch goose hunters</text><text x="200" y="44" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Study aid only. The official regulations are the law.</text><rect x="12" y="54" width="182" height="50" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><circle cx="34" cy="79" r="14" fill="#e8590c"/><text x="34" y="84" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1</text><rect x="0" y="0" width="0" height="0" rx="0" fill="none"/><text x="54" y="76" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Permit + stamp</text><text x="54" y="94" font-size="14" fill="#23261f" text-anchor="start">federal MGBHP</text><rect x="206" y="54" width="182" height="50" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><circle cx="228" cy="79" r="14" fill="#e8590c"/><text x="228" y="84" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2</text><rect x="0" y="0" width="0" height="0" rx="0" fill="none"/><text x="248" y="76" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">3 shells</text><text x="248" y="94" font-size="14" fill="#23261f" text-anchor="start">plug in</text><rect x="12" y="112" width="182" height="50" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><circle cx="34" cy="137" r="14" fill="#e8590c"/><text x="34" y="142" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3</text><rect x="0" y="0" width="0" height="0" rx="0" fill="none"/><text x="54" y="134" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Non toxic</text><text x="54" y="152" font-size="14" fill="#23261f" text-anchor="start">shot only</text><rect x="206" y="112" width="182" height="50" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><circle cx="228" cy="137" r="14" fill="#e8590c"/><text x="228" y="142" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4</text><rect x="0" y="0" width="0" height="0" rx="0" fill="none"/><text x="248" y="134" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Hours</text><text x="248" y="152" font-size="14" fill="#23261f" text-anchor="start">30 min each side</text><rect x="12" y="170" width="182" height="50" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><circle cx="34" cy="195" r="14" fill="#e8590c"/><text x="34" y="200" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">5</text><rect x="0" y="0" width="0" height="0" rx="0" fill="none"/><text x="54" y="192" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Bait</text><text x="54" y="210" font-size="14" fill="#23261f" text-anchor="start">400 m, 7 days</text><rect x="206" y="170" width="182" height="50" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><circle cx="228" cy="195" r="14" fill="#e8590c"/><text x="228" y="200" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">6</text><rect x="0" y="0" width="0" height="0" rx="0" fill="none"/><text x="248" y="192" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">No electronic</text><text x="248" y="210" font-size="14" fill="#23261f" text-anchor="start">calls</text><rect x="12" y="228" width="182" height="50" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><circle cx="34" cy="253" r="14" fill="#e8590c"/><text x="34" y="258" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">7</text><rect x="0" y="0" width="0" height="0" rx="0" fill="none"/><text x="54" y="250" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">No moving</text><text x="54" y="268" font-size="14" fill="#23261f" text-anchor="start">motor boat</text><rect x="206" y="228" width="182" height="50" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><circle cx="228" cy="253" r="14" fill="#e8590c"/><text x="228" y="258" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">8</text><rect x="0" y="0" width="0" height="0" rx="0" fill="none"/><text x="248" y="250" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Wing or head</text><text x="248" y="268" font-size="14" fill="#23261f" text-anchor="start">stays on</text><text x="200" y="292" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">All 99%: Rule Book, migratory birds page</text>
</svg>
