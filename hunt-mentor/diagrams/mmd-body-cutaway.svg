<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side view cutaway of a deer facing right. Lungs fill the chest from behind the shoulder back to the diaphragm, a dome shaped wall that slants. The heart sits low in the chest just behind the front leg. The liver sits just behind the diaphragm. The big rumen fills the middle of the belly and the gut is behind it. The spine runs along the top. An orange ring marks the aim point behind the front leg, one third up. Not to scale.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Inside a mule deer (side view)</text><path d="M70 120 Q 80 92 140 92 L250 90 Q 290 88 312 92 L330 60 Q 338 46 352 50 L372 62 Q 380 72 366 80 L344 84 L330 120 Q 326 170 318 205 L300 208 L296 290 L284 290 L280 210 L130 210 L118 290 L106 290 L100 205 Q 70 190 70 150 Z" fill="#ead9c0" stroke="#23261f" stroke-width="2.5"/><path d="M340 52 L330 30 L346 46 Z" fill="#ead9c0" stroke="#23261f" stroke-width="2"/><path d="M230 100 Q 250 150 266 204" fill="none" stroke="#23261f" stroke-width="2" stroke-dasharray="5 4"/><path d="M238 102 Q 270 96 312 100 Q 322 140 304 176 Q 280 182 262 186 Q 248 150 238 102 Z" fill="#f2b8b0" stroke="#23261f" stroke-width="1.5"/><ellipse cx="288" cy="186" rx="13" ry="16" fill="#b3261e"/><path d="M226 140 Q 252 150 262 196 L232 202 Q 218 176 226 140 Z" fill="#7a3b2e"/><ellipse cx="170" cy="160" rx="58" ry="40" fill="#c9b46a" stroke="#23261f" stroke-width="1.5"/><ellipse cx="102" cy="170" rx="26" ry="26" fill="#d9c9a0" stroke="#23261f" stroke-width="1.5"/><line x1="80" y1="98" x2="320" y2="96" stroke="#6b4f35" stroke-width="5"/><circle cx="286" cy="168" r="9" fill="none" stroke="#e8590c" stroke-width="3"/><line x1="276" y1="168" x2="296" y2="168" stroke="#e8590c" stroke-width="2"/><line x1="286" y1="158" x2="286" y2="178" stroke="#e8590c" stroke-width="2"/><text x="318" y="128" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">lungs</text><text x="306" y="230" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">heart</text><text x="214" y="236" font-size="15" fill="#23261f" text-anchor="end" font-weight="bold">liver</text><text x="170" y="165" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">rumen</text><text x="102" y="175" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">gut</text><text x="200" y="84" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">spine</text><line x1="304" y1="226" x2="292" y2="200" stroke="#23261f" stroke-width="1.5"/><line x1="212" y1="232" x2="236" y2="196" stroke="#23261f" stroke-width="1.5"/><text x="222" y="64" font-size="14" fill="#23261f" text-anchor="middle">diaphragm</text><line x1="222" y1="68" x2="234" y2="104" stroke="#23261f" stroke-width="1.5"/><text x="205" y="254" font-size="14" fill="#e8590c" text-anchor="middle">Orange ring: aim point</text><text x="205" y="272" font-size="14" fill="#6b4f35" text-anchor="middle">Not to scale (75%)</text>
</svg>
