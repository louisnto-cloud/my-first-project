<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 345" font-family="sans-serif" role="img" aria-label="A triangle with food at the top, hiding cover and thermal cover at the bottom corners. Food: browse and forbs. Hiding cover: good cover hides 90% of a deer at 60 m. Thermal cover in winter: thick Douglas fir. The deer stands in the middle at the edge where they meet.">
<rect width="400" height="345" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Three needs, close together</text><polygon points="200,60 70,250 330,250" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="3"/><circle cx="200" cy="60" r="34" fill="#e8590c"/><text x="200" y="65" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Food</text><circle cx="70" cy="250" r="34" fill="#2f3a2b"/><text x="70" y="255" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Hiding</text><circle cx="330" cy="250" r="34" fill="#4a7fb0"/><text x="330" y="255" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Thermal</text><g transform="translate(200 205) scale(0.500 0.500)"><rect x="-36" y="-40" width="6" height="40" rx="3" fill="#8b5a2b"/><rect x="10" y="-40" width="6" height="40" rx="3" fill="#8b5a2b"/><ellipse cx="-12" cy="-52" rx="34" ry="16" fill="#8b5a2b"/><rect x="-30" y="-44" width="6" height="44" rx="3" fill="#8b5a2b"/><rect x="16" y="-44" width="6" height="44" rx="3" fill="#8b5a2b"/><path d="M12 -60 L26 -84 L36 -80 L26 -52 Z" fill="#8b5a2b"/><ellipse cx="38" cy="-84" rx="13" ry="7" fill="#8b5a2b"/><path d="M28 -88 L18 -102 L32 -92 Z" fill="#8b5a2b"/><path d="M31 -89 L27 -104 L38 -92 Z" fill="#8b5a2b"/><circle cx="49" cy="-84" r="2" fill="#23261f"/><ellipse cx="-44" cy="-54" rx="5" ry="9" fill="#f4efe2"/><path d="M-46 -54 L-50 -40" stroke="#23261f" stroke-width="3" stroke-linecap="round"/></g><text x="200" y="228" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Edge</text><text x="200" y="300" font-size="14" fill="#23261f" text-anchor="middle">Hiding cover: hides 90% of a deer at 60 m (80%)</text><text x="200" y="318" font-size="14" fill="#23261f" text-anchor="middle">Thermal cover: thick fir in winter (85%)</text><text x="200" y="336" font-size="14" fill="#6b4f35" text-anchor="middle">Hunt the edges where they meet (85%)</text>
</svg>
