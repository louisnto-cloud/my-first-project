<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 374" font-family="sans-serif" role="img" aria-label="Three mule deer needs drawn as pictures at the corners of a triangle. Top: food, browse shrubs and forbs. Bottom left: hiding cover, dense brush that hides 90% of a deer at 60 m (80%); a deer stands mostly hidden in it. Bottom right: thermal cover, thick Douglas fir in winter, with snow (85%). A deer stands in the middle, at the edge where they meet. Hunt the edges where they meet (85%).">
