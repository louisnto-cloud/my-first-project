<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 404" font-family="sans-serif" role="img" aria-label="Four key facts for the Heffley Creek base, Region 3, the Thompson. One: the North Thompson River is the Management Unit line; the base side is MU 3-27, 85 percent, and the far bank MU 3-28, 90 percent. Two: in October any mule deer buck is legal; from 1 November a buck needs 4 points, 99 percent. Three: no ATV for hunting on the west bank, MUs 3-28, 3-29 and 3-30, from 1 September to 10 December, 99 percent. Four: no firearm may be fired inside the City of Kamloops, and its boundary may reach the base, 60 percent, VERIFY.">
<rect width="400" height="404" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Heffley Creek: 4 facts first</text>
<text x="200" y="53" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Region 3, the Thompson</text>
<rect x="8" y="64" width="384" height="77" rx="8" fill="#f4eedf"/>
<rect x="8" y="64" width="6" height="77" rx="3" fill="#5f7a3a"/>
<circle cx="41.0" cy="102.5" r="21" fill="#fffaf0" stroke="#5f7a3a" stroke-width="2"/>
<g transform="translate(41.0 102.5) scale(0.78)" fill="#5f7a3a" stroke="none"><path d="M-15 -11 L-5 -14 L5 -11 L15 -14 V11 L5 14 L-5 11 L-15 14z"/><path d="M-5 -14 V11 M5 -11 V14" stroke="#fffaf0" stroke-width="1.6"/><path d="M-11 4 L-8 -2 L-1 2 L3 -5 L10 -1" stroke="#fffaf0" stroke-width="2" fill="none"/></g>
<text x="74" y="89" font-size="16" font-weight="bold" fill="#2f3a2b">The river is the MU line</text>
<text x="74" y="109" font-size="15" fill="#2f3a2b">Base side: MU 3-27 (85%). Far bank: MU</text>
<text x="74" y="128" font-size="15" fill="#2f3a2b">3-28 (90%).</text>
<rect x="8" y="147" width="384" height="77" rx="8" fill="#f4eedf"/>
<rect x="8" y="147" width="6" height="77" rx="3" fill="#5f7a3a"/>
<circle cx="41.0" cy="185.5" r="21" fill="#fffaf0" stroke="#5f7a3a" stroke-width="2"/>
<g transform="translate(41.0 185.5) scale(0.95)"><path d="M-2 -2 C-8 2 -14 8 -16 10 C-15 13 -11 13 -8 11 C-4 9 0 8 3 8 C6 12 8 15 9 16 H14 C13 8 9 2 6 -2z" fill="#8b7058"/><path d="M4 -3 C8 -9 14 -10 17 -9 C14 -5 9 -2 5 -1z" fill="#8b7058"/><path d="M0 -3 C-1 -9 1 -13 -3 -17 M0 -10 C3 -13 5 -15 4 -19 M-2 -13 L-8 -16" fill="none" stroke="#6b4f35" stroke-width="2.2" stroke-linecap="round"/><circle cx="-5" cy="3" r="1.3" fill="#1f160e"/><circle cx="-15" cy="11" r="1.5" fill="#1f160e"/></g>
<text x="74" y="172" font-size="16" font-weight="bold" fill="#2f3a2b">October: any mule deer buck</text>
<text x="74" y="192" font-size="15" fill="#2f3a2b">From 1 November a buck needs 4 points</text>
<text x="74" y="211" font-size="15" fill="#2f3a2b">(99%).</text>
<rect x="8" y="230" width="384" height="77" rx="8" fill="#f4eedf"/>
<rect x="8" y="230" width="6" height="77" rx="3" fill="#c0392b"/>
<circle cx="41.0" cy="268.5" r="21" fill="#fffaf0" stroke="#c0392b" stroke-width="2"/>
<g transform="translate(41.0 268.5) scale(0.78)" fill="#c0392b" stroke="none"><path d="M-12 0 L-8 -6 H6 L10 -1 L14 0 V4 H-14 V1z"/><path d="M-2 -6 L0 -12 H4" stroke="#c0392b" stroke-width="2.4" fill="none"/><circle cx="-9" cy="7" r="6"/><circle cx="9" cy="7" r="6"/><circle cx="-9" cy="7" r="2.2" fill="#fffaf0"/><circle cx="9" cy="7" r="2.2" fill="#fffaf0"/></g>
<circle cx="41.0" cy="268.5" r="21" fill="none" stroke="#c0392b" stroke-width="3"/><path d="M26.3 253.8 L55.7 283.2" stroke="#c0392b" stroke-width="3"/>
<text x="74" y="255" font-size="16" font-weight="bold" fill="#2f3a2b">West bank: no ATV for hunting</text>
<text x="74" y="275" font-size="15" fill="#2f3a2b">MUs 3-28, 3-29, 3-30, 1 Sept to 10 Dec</text>
<text x="74" y="294" font-size="15" fill="#2f3a2b">(99%).</text>
<rect x="8" y="313" width="384" height="77" rx="8" fill="#f4eedf"/>
<rect x="8" y="313" width="6" height="77" rx="3" fill="#c0392b"/>
<circle cx="41.0" cy="351.5" r="21" fill="#fffaf0" stroke="#c0392b" stroke-width="2"/>
<g transform="translate(41.0 351.5) scale(0.78)" fill="#c0392b" stroke="none"><rect x="-15" y="-4" width="10" height="17"/><rect x="-4" y="-14" width="11" height="27"/><rect x="8" y="0" width="8" height="13"/><path d="M-1 -10 h2 v2 h-2z M3 -10 h2 v2 h-2z M-1 -4 h2 v2 h-2z M3 -4 h2 v2 h-2z M-1 2 h2 v2 h-2z M3 2 h2 v2 h-2z" fill="#fffaf0"/></g>
<circle cx="41.0" cy="351.5" r="21" fill="none" stroke="#c0392b" stroke-width="3"/><path d="M26.3 336.8 L55.7 366.2" stroke="#c0392b" stroke-width="3"/>
<text x="74" y="338" font-size="16" font-weight="bold" fill="#2f3a2b">City of Kamloops: no firing at all</text>
<text x="74" y="358" font-size="15" fill="#2f3a2b">Its boundary may reach the base (60%).</text>
<text x="74" y="377" font-size="15" fill="#c0392b">VERIFY.</text>
</svg>
