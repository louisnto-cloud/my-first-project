<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" font-family="sans-serif" role="img" aria-label="Wet sand holds a clear print shape. Dry loose sand slumps into a shapeless bowl. In dry sand read the spacing and pattern of the trail, not the print.">
<rect x="0" y="0" width="400" height="296" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Sand: wet tells, dry hides</text>
<rect x="16" y="62" width="176" height="190" rx="10" fill="#efe2c2"/><rect x="208" y="62" width="176" height="190" rx="10" fill="#f6edd6"/><text x="104" y="88" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wet sand</text><text x="296" y="88" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Dry sand</text><g transform="translate(104 160) rotate(0) scale(1.4)" fill="#a8885a"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><ellipse cx="296" cy="160" rx="26" ry="30" fill="#e3d2a8" stroke="#c9b48a" stroke-width="2"/><text x="104" y="230" font-size="14" fill="#23261f" text-anchor="middle">clear shape</text><text x="296" y="230" font-size="14" fill="#23261f" text-anchor="middle">a shapeless bowl</text><text x="200" y="286" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Dry sand: read the spacing, not the print</text>
</svg>
