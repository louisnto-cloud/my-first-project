<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 345" font-family="sans-serif" role="img" aria-label="Calls and decoys: deer, ducks, grouse. Electronic or recorded call: No (99%). Mouth, grunt, rattle, hand call: Yes (95%, my reading). Live bird decoy: No (99%). Fake decoy: Yes (99%).">
