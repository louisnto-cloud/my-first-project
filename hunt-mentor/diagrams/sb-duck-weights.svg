  <text x="152" y="281" font-size="14" fill="#2f3a2b" text-anchor="end">Wood duck</text>
  <rect x="160" y="267" width="105" height="20" rx="4" fill="#8b5a2b"/>
  <text x="271.0" y="282" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">0.7</text>
