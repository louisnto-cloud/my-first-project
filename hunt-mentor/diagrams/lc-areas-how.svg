<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 292" font-family="sans-serif" role="img" aria-label="How to read the harvest numbers. They are survey estimates with an error range, not counts. They are 5 year averages for hunt years 2020 to 2024, resident hunters. Success means kills divided by hunters who hunted that MU. A 20 percent gap between two MUs is noise.">
<rect x="0" y="0" width="400" height="292" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Reading the harvest numbers</text><rect x="10" y="44" width="185" height="112" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(40 78) scale(0.9)"><path d="M-14 -18 H8 L16 -10 V18 H-14 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -6 H10 M-8 2 H10 M-8 10 H4" stroke="#8a9a6b" stroke-width="2.5"/></g><text x="68" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Survey</text><text x="68" y="86" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">estimate</text><text x="68" y="104" font-size="14" fill="#23261f" text-anchor="start">Not a count. It</text><text x="68" y="121" font-size="14" fill="#23261f" text-anchor="start">has an error</text><text x="68" y="138" font-size="14" fill="#23261f" text-anchor="start">range</text><rect x="205" y="44" width="185" height="112" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(235 78) scale(0.9)"><rect x="-18" y="-14" width="36" height="32" rx="3" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-18" y="-14" width="36" height="9" fill="#e8590c"/><path d="M-10 -18 v6 M10 -18 v6" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-10 2 h4 M-2 2 h4 M6 2 h4 M-10 10 h4 M-2 10 h4" stroke="#2f3a2b" stroke-width="3"/></g><text x="263" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">5 year average</text><text x="263" y="86" font-size="14" fill="#23261f" text-anchor="start">Hunt years 2020</text><text x="263" y="103" font-size="14" fill="#23261f" text-anchor="start">to 2024,</text><text x="263" y="120" font-size="14" fill="#23261f" text-anchor="start">residents</text><rect x="10" y="166" width="185" height="112" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(40 200) scale(0.9)"><path d="M0 -18 V16 M-14 18 H14 M-18 -10 H18" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-18 -10 L-24 4 H-12 Z M18 -10 L12 4 H24 Z" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="68" y="190" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Success</text><text x="68" y="208" font-size="14" fill="#23261f" text-anchor="start">Kills divided by</text><text x="68" y="225" font-size="14" fill="#23261f" text-anchor="start">hunters in that</text><text x="68" y="242" font-size="14" fill="#23261f" text-anchor="start">MU</text><rect x="205" y="166" width="185" height="112" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(235 200) scale(0.9)"><circle r="18" fill="#dbe7f2" stroke="#4a7fb0" stroke-width="2.5"/><text x="0" y="8" font-size="24" font-weight="bold" fill="#4a7fb0" text-anchor="middle">?</text></g><text x="263" y="190" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">20% gap =</text><text x="263" y="208" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">noise</text><text x="263" y="226" font-size="14" fill="#23261f" text-anchor="start">Do not split</text><text x="263" y="243" font-size="14" fill="#23261f" text-anchor="start">hairs between</text><text x="263" y="260" font-size="14" fill="#23261f" text-anchor="start">MUs</text>
</svg>
