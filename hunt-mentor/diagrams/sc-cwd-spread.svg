<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="How Chronic Wasting Disease spreads, 95 percent. It is caused by prions, with no vaccine or cure, and is always fatal. A deer sheds it through saliva, urine and feces. It also rides into new areas on infected carcasses, hay and urine based scents." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">How CWD spreads</text>
<text x="200.0" y="46" font-size="14" fill="#8b5a2b" text-anchor="middle">Prions: no vaccine, no cure, always fatal (95%)</text>
<g transform="translate(200 120) scale(2)"><path d="M-14,6 L-14,18" stroke="#23261f" stroke-width="3.5" stroke-linecap="round"/><path d="M-7,6 L-7,18" stroke="#23261f" stroke-width="3.5" stroke-linecap="round"/><path d="M9,6 L9,18" stroke="#23261f" stroke-width="3.5" stroke-linecap="round"/><path d="M15,6 L15,18" stroke="#23261f" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="20" ry="9" fill="#8b5a2b" stroke="#23261f" stroke-width="1"/><path d="M-16,-4 L-22,-14 L-30,-14 L-34,-8 L-26,-6 L-20,2 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="1"/><path d="M-24,-14 L-26,-26 M-26,-20 L-32,-26 M-22,-14 L-18,-26 M-19,-21 L-14,-25" stroke="#23261f" stroke-width="2" fill="none"/></g>
<path d="M150 150 c-6 10 -6 16 0 16 c6 0 6 -6 0 -16 Z" fill="#4a7fb0"/>
<text x="110" y="174" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Saliva</text>
<path d="M232 158 v18" stroke="#e0b030" stroke-width="4"/>
<text x="232" y="196" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Urine</text>
<g fill="#5c3b1c"><circle cx="270" cy="164" r="3"/><circle cx="276" cy="168" r="3"/><circle cx="268" cy="170" r="3"/></g>
<text x="300" y="186" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Feces</text>
<line x1="10" y1="208" x2="390" y2="208" stroke="#8a9a6b" stroke-dasharray="6 6" stroke-width="2"/>
<text x="200" y="230" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">It also rides in on:</text>
<rect x="10" y="240" width="120" height="52" rx="8" fill="#fde8d8" stroke="#e8590c" stroke-width="2"/>
<text x="70.0" y="261.9" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Infected</text>
<text x="70.0" y="279.9" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">carcasses</text>
<rect x="140" y="240" width="120" height="52" rx="8" fill="#fde8d8" stroke="#e8590c" stroke-width="2"/>
<text x="200.0" y="270.9" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Hay</text>
<rect x="270" y="240" width="120" height="52" rx="8" fill="#fde8d8" stroke="#e8590c" stroke-width="2"/>
<text x="330.0" y="261.9" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Urine based</text>
<text x="330.0" y="279.9" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">scents</text>
</svg>
