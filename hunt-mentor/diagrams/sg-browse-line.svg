<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif" role="img" aria-label="Browse line heights. Below the line every twig is eaten. Deer reach to about 1.2 m. A line at 1.5 to 1.8 m says elk. 1.8 to 2.4 m says moose. A person 1.8 m tall stands for scale.">
  <rect width="400" height="320" fill="#fffaf0"/>
  <text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Browse line: who reached?</text>
  <rect x="0" y="290" width="400" height="30" fill="#dfe6d3"/>
  <g stroke="#2f3a2b" stroke-width="2"><path d="M40 290 V50"/><path d="M34 290 h12 M34 230 h12 M34 170 h12 M34 110 h12 M34 50 h12"/></g>
  <g font-size="14" fill="#2f3a2b" text-anchor="end"><text x="30" y="295">0</text><text x="30" y="235">0.6</text><text x="30" y="175">1.2</text><text x="30" y="115">1.8</text><text x="30" y="55">2.4</text><text x="30" y="38">m</text></g>
  <rect x="80" y="170" width="70" height="120" fill="#8b5a2b" opacity=".85"/>
  <rect x="170" y="110" width="70" height="180" fill="#8b5a2b" opacity=".65"/>
  <rect x="170" y="110" width="70" height="30" fill="#e8590c" opacity=".5"/>
  <rect x="260" y="50" width="70" height="240" fill="#8b5a2b" opacity=".45"/>
  <rect x="260" y="50" width="70" height="60" fill="#e8590c" opacity=".5"/>
  <g font-size="16" font-weight="bold" fill="#fff" text-anchor="middle"><text x="115" y="240">Deer</text><text x="205" y="240">Elk</text><text x="295" y="240">Moose</text></g>
  <g font-size="14" fill="#2f3a2b" text-anchor="middle"><text x="115" y="162">to 1.2 m</text><text x="205" y="102">1.5 to 1.8 m</text><text x="295" y="44">1.8 to 2.4 m</text></g>
  <g fill="#2f3a2b"><circle cx="365" cy="122" r="10"/><rect x="355" y="134" width="20" height="80" rx="6"/><rect x="356" y="210" width="7" height="80"/><rect x="367" y="210" width="7" height="80"/></g>
  <text x="365" y="310" font-size="14" fill="#2f3a2b" text-anchor="middle">You</text>
</svg>
