<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Fuel ladder from small to big: tinder fluff, matchstick sticks, pencil sticks, thumb sticks, wrist sized wood. Have two big handfuls of each before you light.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fuel ladder: small to big</text><text x="110" y="66" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="end">Tinder</text><path d="M130 60 q10 -10 20 0 q10 10 20 0 q10 -10 20 0" fill="none" stroke="#c8a46a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="110" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="end">Matchstick</text><rect x="130" y="102" width="240" height="3" rx="1.5" fill="#8b5a2b"/><text x="110" y="154" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="end">Pencil</text><rect x="130" y="144" width="240" height="7" rx="3.5" fill="#8b5a2b"/><text x="110" y="198" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="end">Thumb</text><rect x="130" y="185" width="240" height="14" rx="7.0" fill="#8b5a2b"/><text x="110" y="242" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="end">Wrist</text><rect x="130" y="223" width="240" height="26" rx="13.0" fill="#8b5a2b"/><text x="200" y="285" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Have 2 big handfuls of each before you light</text>
</svg>
