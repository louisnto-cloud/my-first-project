<text x="260.4186046511628" y="117" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">400</text>
<text x="172" y="157" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="end">Deer, large game</text>
<rect x="180" y="140" width="89.30232558139535" height="26" rx="4" fill="#2f3a2b"/>
<text x="275.30232558139534" y="159" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">480</text>
<text x="172" y="199" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="end">Hiking with gear</text>
