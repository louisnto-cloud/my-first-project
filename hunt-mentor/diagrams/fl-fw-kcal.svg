<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 298" role="img" aria-label="Estimated calories burned per hour for an 80 kg hunter, from Compendium MET values: stand hunting about 200, general hunting about 400, deer and elk hunting about 480, hiking with hunting gear about 760, dragging a carcass about 784.">
  <rect x="0" y="0" width="400" height="298" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Calories an hour, 80 kg hunter</text>
<text x="172" y="73" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="end">Stand, little walking</text>
<rect x="180" y="56" width="37.2093023255814" height="26" rx="4" fill="#8a9a6b"/>
<text x="223.2093023255814" y="75" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">200</text>
<text x="172" y="115" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="end">Hunting, general</text>
