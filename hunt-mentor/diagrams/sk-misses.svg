<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two common shotgun misses. Left: stopping the swing puts the shot behind the duck; fix by keeping the gun moving. Right: lifting your head puts the shot over the top; fix by keeping your cheek on the stock.">
