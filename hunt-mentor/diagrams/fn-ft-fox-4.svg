<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="If it is quiet, shift your weight forward. If something cracks, lift and place again.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c" stroke="none" stroke-width="2"/><text x="26" y="32" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="52" y="32" font-family="sans-serif" font-size="18" fill="#2f3a2b" text-anchor="start" font-weight="bold">Quiet? Shift your weight</text><rect x="0" y="200" width="400" height="100" rx="0" fill="#c9b79c" stroke="none" stroke-width="2"/><path d="M20 200 l6 -6 l6 6" fill="none" stroke="#8b5a2b" stroke-width="2"/><path d="M80 200 l6 -6 l6 6" fill="none" stroke="#8b5a2b" stroke-width="2"/><path d="M140 200 l6 -6 l6 6" fill="none" stroke="#8b5a2b" stroke-width="2"/><path d="M200 200 l6 -6 l6 6" fill="none" stroke="#8b5a2b" stroke-width="2"/><path d="M260 200 l6 -6 l6 6" fill="none" stroke="#8b5a2b" stroke-width="2"/><path d="M320 200 l6 -6 l6 6" fill="none" stroke="#8b5a2b" stroke-width="2"/><path d="M380 200 l6 -6 l6 6" fill="none" stroke="#8b5a2b" stroke-width="2"/><g transform="translate(200 200) rotate(0) scale(1)"><path d="M-40 0 C -40 -14, -20 -22, 0 -22 L 30 -18 C 46 -16, 50 -4, 46 0 Z" fill="#2f3a2b"/><rect x="-36" y="-60" width="20" height="44" rx="6" fill="#2f3a2b"/></g><line x1="120" y1="140" x2="182.3" y2="140.0" stroke="#8a9a6b" stroke-width="4" stroke-linecap="round"/><polygon points="190.0,140.0 179.0,133.9 179.0,146.1" fill="#8a9a6b"/><text x="250" y="150" font-family="sans-serif" font-size="15" fill="#c92a2a" text-anchor="start" font-weight="bold">or lift</text><text x="20" y="280" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Crack? Lift and place again</text>
</svg>
