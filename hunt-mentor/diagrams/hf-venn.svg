<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three overlapping circles: bench, a flat step; edge, where open meets cover; and water, a pond, spring or creek. Where all three overlap is the star spot to mark on your map. Tip.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">Mark spots with all three (Tip)</text>
<circle cx="146" cy="116" r="84" fill="#8a9a6b" opacity=".45"/>
<circle cx="254" cy="116" r="84" fill="#8b5a2b" opacity=".35"/>
<circle cx="200" cy="202" r="84" fill="#4a7fb0" opacity=".4"/>
<text x="104" y="96" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bench</text><text x="104" y="116" font-size="15" fill="#2f3a2b" text-anchor="middle">flat step</text>
<text x="296" y="96" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Edge</text><text x="298" y="116" font-size="15" fill="#2f3a2b" text-anchor="middle">open meets</text><text x="298" y="134" font-size="15" fill="#2f3a2b" text-anchor="middle">cover</text>
<text x="200" y="232" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Water</text><text x="200" y="252" font-size="15" fill="#2f3a2b" text-anchor="middle">pond, spring,</text><text x="200" y="269" font-size="15" fill="#2f3a2b" text-anchor="middle">creek</text>
<polygon points="200.0,128.0 205.0,141.1 219.0,141.8 208.1,150.6 211.8,164.2 200.0,156.5 188.2,164.2 191.9,150.6 181.0,141.8 195.0,141.1" fill="#e8590c" stroke="#fffaf0" stroke-width="1.5"/>
</svg>
