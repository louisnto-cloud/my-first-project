<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A printable drill target with three bullseyes labelled prone, sitting and sticks, and a 20 cm plate for the cold shot.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Field drill target (print at home)</text><circle cx="80" cy="110" r="30.0" fill="#ffffff" stroke="#23261f" stroke-width="1.5"/><circle cx="80" cy="110" r="20.0" fill="#f3e9da" stroke="#23261f" stroke-width="1.5"/><circle cx="80" cy="110" r="10.0" fill="#ffffff" stroke="#23261f" stroke-width="1.5"/><circle cx="80" cy="110" r="3.0" fill="#e8590c" stroke="none" stroke-width="2"/><text x="80" y="164" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Prone</text><circle cx="200" cy="110" r="30.0" fill="#ffffff" stroke="#23261f" stroke-width="1.5"/><circle cx="200" cy="110" r="20.0" fill="#f3e9da" stroke="#23261f" stroke-width="1.5"/><circle cx="200" cy="110" r="10.0" fill="#ffffff" stroke="#23261f" stroke-width="1.5"/><circle cx="200" cy="110" r="3.0" fill="#e8590c" stroke="none" stroke-width="2"/><text x="200" y="164" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Sitting</text><circle cx="320" cy="110" r="30.0" fill="#ffffff" stroke="#23261f" stroke-width="1.5"/><circle cx="320" cy="110" r="20.0" fill="#f3e9da" stroke="#23261f" stroke-width="1.5"/><circle cx="320" cy="110" r="10.0" fill="#ffffff" stroke="#23261f" stroke-width="1.5"/><circle cx="320" cy="110" r="3.0" fill="#e8590c" stroke="none" stroke-width="2"/><text x="320" y="164" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Sticks</text><rect x="60" y="190" width="280" height="70" rx="6" fill="#f3e9da" stroke="#2f3a2b" stroke-width="1.5"/><circle cx="200" cy="225" r="25" fill="none" stroke="#e8590c" stroke-width="3"/><text x="200" y="230" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">20 cm</text><text x="110" y="230" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cold shot</text><text x="290" y="230" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">plate</text>
</svg>
