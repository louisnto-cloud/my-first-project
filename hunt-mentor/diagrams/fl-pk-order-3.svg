<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Fill the gaps around the heavy core with soft things so nothing shifts.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="30" cy="32" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="30" y="39" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">3</text>
<text x="56" y="39" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="start">Fill the gaps</text>
<rect x="140" y="60" width="120" height="180" rx="20" fill="#dfe6d3" stroke="#8b5a2b" stroke-width="4"/><rect x="150" y="190" width="100" height="42" rx="10" fill="#2f3a2b"/><rect x="150" y="120" width="46" height="66" rx="8" fill="#e8590c"/><rect x="200" y="120" width="50" height="66" rx="8" fill="#8a9a6b"/><text x="225" y="158" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Soft</text>
<rect x="10" y="262" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="285.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Soft things lock the load in place.</text>
</svg>
