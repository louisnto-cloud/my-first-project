<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Pack step 3: fill the gaps around the heavy core with soft things so nothing shifts. Soft things lock the load in place.">
<rect width="400" height="300" fill="#fffaf0"/>
<circle cx="30" cy="32" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/>
<text x="30" y="39" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">3</text>
<text x="56" y="39" font-size="19" font-weight="bold" fill="#2f3a2b">Fill the gaps</text>
<rect x="124" y="60" width="152" height="186" rx="20" fill="#dfe6d3" stroke="#8b5a2b" stroke-width="4"/>
<rect x="134" y="196" width="132" height="42" rx="10" fill="#2f3a2b"/>
<rect x="134" y="126" width="62" height="66" rx="8" fill="#e8590c"/>
<rect x="200" y="126" width="66" height="66" rx="8" fill="#8a9a6b"/>
<text x="233" y="165" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Soft</text>
<rect x="10" y="260" width="380" height="34" rx="8" fill="#2f3a2b"/>
<text x="200" y="283" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Soft things lock the load in place.</text>
</svg>
