  <path d="M110 120 L180 120 L180 250 L110 250 Z" fill="#9a8f7c"/><path d="M110 120 L180 120 L172 132 L118 132 Z" fill="#b8ad98"/>
  <g transform="translate(90 238) scale(0.9)"><ellipse rx="13" ry="6" fill="#8b5a2b"/><circle cx="11" cy="-7" r="5" fill="#8b5a2b"/><path d="M9 -11 l-3 -6 M13 -11 l4 -5" stroke="#5c3b1c" stroke-width="2"/></g>
  <text x="101" y="62" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cold day</text><text x="60" y="110" font-size="13" fill="#2f3a2b" text-anchor="middle">sun on rock</text><text x="60" y="126" font-size="13" fill="#2f3a2b" text-anchor="middle">gathers heat</text>
