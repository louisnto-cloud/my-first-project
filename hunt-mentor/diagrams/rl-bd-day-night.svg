  <path d="M292 220 C 286 200, 298 186, 292 166" stroke="#f08c00" stroke-width="2.5" fill="none"/><path d="M286 172 l6 -8 l6 8" stroke="#f08c00" stroke-width="2.5" fill="none"/>
  <path d="M292 150 C 300 160, 286 170, 292 180" stroke="#f08c00" stroke-width="2.5" fill="none"/>
  <text x="299" y="62" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Clear cold night</text><text x="299" y="92" font-size="13" fill="#fff" text-anchor="middle">canopy holds heat in</text>
  <text x="200" y="292" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">By day: bluffs and sun. By night: under the canopy.</text>
