<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two panels. Cold day: a deer beds at the foot of a rock bluff in the sun, where the rock gathers heat. Clear cold night: a deer beds under a closed conifer canopy that holds its body heat in instead of losing it to the open sky. Caption: by day, bluffs and sun; by night, under the canopy.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Day cover, night cover</text>
