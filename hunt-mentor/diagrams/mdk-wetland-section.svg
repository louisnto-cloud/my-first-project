<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side view cross section of a marsh from a field on the left to deep water on the right. A field edge, then a muddy shore, then shallow water under 30 centimetres where a puddle duck tips up to feed, 75 percent. A band of cattails gives cover. Then deeper open water where a diver dives down to pondweed on the bottom, 80 percent."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A marsh, side view: who feeds where</text><path d="M0 120 L80 120 Q110 124 130 140 L170 150 L250 150 Q270 170 300 200 L400 210 L400 300 L0 300 Z" fill="#c9b79c"/><path d="M110 136 L130 140 L170 150 L250 150 Q270 170 300 200 L400 210 L400 132 L110 132 Z" fill="#4a7fb0" opacity=".55"/><rect x="0" y="104" width="80" height="16" rx="0" fill="#d9c27a"/><text x="40" y="98" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Field</text><line x1="176" y1="150" x2="176" y2="92" stroke="#6b7f3a" stroke-width="3" fill="none"/><line x1="183" y1="150" x2="183" y2="92" stroke="#6b7f3a" stroke-width="3" fill="none"/><line x1="190" y1="150" x2="190" y2="92" stroke="#6b7f3a" stroke-width="3" fill="none"/><line x1="197" y1="150" x2="197" y2="92" stroke="#6b7f3a" stroke-width="3" fill="none"/><line x1="204" y1="150" x2="204" y2="92" stroke="#6b7f3a" stroke-width="3" fill="none"/><line x1="211" y1="150" x2="211" y2="92" stroke="#6b7f3a" stroke-width="3" fill="none"/><line x1="218" y1="150" x2="218" y2="92" stroke="#6b7f3a" stroke-width="3" fill="none"/><line x1="225" y1="150" x2="225" y2="92" stroke="#6b7f3a" stroke-width="3" fill="none"/><line x1="232" y1="150" x2="232" y2="92" stroke="#6b7f3a" stroke-width="3" fill="none"/><ellipse cx="206" cy="90" rx="3" ry="9" fill="#6b4f35"/><path d="M300 206 q6 -20 0 -40 q-6 -20 2 -36" stroke="#4f7d3a" stroke-width="3" fill="none"/><path d="M330 206 q6 -20 0 -