<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Counting a 4 point mule deer antler, one side. The main beam forks, and each fork forks again: 4 points, numbered 1 to 4. The small brow tine near the base is not counted. Each point must be at least 2.5 centimetres long and longer than it is wide.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <g stroke="#8b5a2b" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 270 C 120 230, 130 200, 150 175"/>
    <path d="M150 175 C 140 140, 120 110, 110 80"/><path d="M110 80 L95 40"/><path d="M110 80 L135 45"/>
    <path d="M150 175 C 180 150, 210 130, 230 110"/><path d="M230 110 L235 60"/><path d="M230 110 L270 80"/>
  </g>
  <path d="M124 240 L150 228" stroke="#8a9a6b" stroke-width="6" stroke-linecap="round"/>
  <g font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">
    <circle cx="95" cy="30" r="13" fill="#e8590c"/><text x="95" y="36">1</text>
    <circle cx="140" cy="32" r="13" fill="#e8590c"/><text x="140" y="38">2</text>
    <circle cx="236" cy="46" r="13" fill="#e8590c"/><text x="236" y="52">3</text>
    <circle cx="282" cy="72" r="13" fill="#e8590c"/><text x="282" y="78">4</text>
  </g>
  <text x="160" y="250" font-size="15" font-weight="bold" fill="#8a9a6b">brow tine: not counted</text>
  <text x="250" y="150" font-size="16" font-weight="bold" fill="#2f3a2b">4 points on</text>
  <text x="250" y="170" font-size="16" font-weight="bold" fill="#2f3a2b">one antler</text>
  <text x="200" y="290" font-size="14" fill="#2f3a2b" text-anchor="middle">Each point 2.5 cm plus, longer than wide (99%)</text>
</svg>
