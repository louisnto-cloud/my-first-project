<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 306" font-family="sans-serif" role="img" aria-label="Cool the cape at once. Freeze it: roll it flesh to flesh in a heavy bag, rinsed and wrung if bloody. Or salt it: 1 to 2 kilograms of fine non iodized salt on the flesh side, fold flesh to flesh, drain, salt again the next day. Do it within 24 to 48 hours, 70 percent. Heat and time cause slip, where hair falls out and the mount is lost.">
<rect x="0" y="0" width="400" height="306" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Then cool the cape at once</text><rect x="10" y="44" width="185" height="200" rx="10" fill="#eef3f8" stroke="#4a7fb0" stroke-width="2.5"/><rect x="205" y="44" width="185" height="200" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/><text x="102" y="70" font-size="17" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Freeze it</text><text x="297" y="70" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Or salt it</text><g transform="translate(102 112) scale(1.5)"><line x1="0" y1="0" x2="18.0" y2="0.0" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="0" x2="9.0" y2="15.6" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="0" x2="-9.0" y2="15.6" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="0" x2="-18.0" y2="0.0" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="0" x2="-9.0" y2="-15.6" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="0" x2="9.0" y2="-15.6" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/></g><g transform="translate(297 112) scale(1.4)"><path d="M-10 -8 h20 l3 26 h-26 z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-10 -8 q10 -14 20 0" fill="#cfd6bf" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-3" cy="-11" r="1.4" fill="#2f3a2b"/><circle cx="3" cy="-11" r="1.4" fill="#2f3a2b"/></g><text x="102" y="158" font-size="14" fill="#23261f" text-anchor="middle">Roll flesh to flesh</text><text x="102" y="178" font-size="14" fill="#23261f" text-anchor="middle">Heavy bag</text><text x="102" y="198" font-size="14" fill="#23261f" text-anchor="middle">Rinse and wring</text><text x="102" y="218" font-size="14" fill="#23261f" text-anchor="middle">if bloody</text><text x="297" y="158" font-size="14" fill="#23261f" text-anchor="middle">1 to 2 kg fine,</text><text x="297" y="178" font-size="14" fill="#23261f" text-anchor="middle">non iodized salt</text><text x="297" y="198" font-size="14" fill="#23261f" text-anchor="middle">Fold, drain</text><text x="297" y="218" font-size="14" fill="#23261f" text-anchor="middle">Salt again next day</text><text x="200" y="270" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Within 24 to 48 hours (70%).</text><text x="200" y="292" font-size="14" fill="#23261f" text-anchor="middle">Heat and time cause slip: hair falls out, mount lost.</text>
</svg>
