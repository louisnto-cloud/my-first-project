<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 5: look beyond the hit site along the bullet path. Exit spray, hair and tissue land on brush, trees and ground behind the animal.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">5. Check the bullet path</text>
<rect x="0" y="200" width="400" height="100" rx="0" fill="#cfdcb5"/><g transform="translate(140 230) rotate(90) scale(0.7)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><line x1="160" y1="210" x2="340" y2="150" stroke="#e8590c" stroke-width="2"/><path d="M340.0 150.0 L332.8 157.0 L330.1 148.7 Z" fill="#e8590c"/><g transform="translate(350 202) scale(1)"><rect x="-3" y="-10" width="6" height="12" fill="#6b4f35"/><path d="M0 -50 L16 -10 L-16 -10 Z" fill="#8a9a6b"/></g><text x="330" y="120" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">blood or hair</text><text x="330" y="136" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">on the far side?</text><text x="150" y="90" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Look where the bullet went</text><text x="150" y="112" font-size="15" fill="#23261f" text-anchor="middle">Exit spray lands beyond</text>
</svg>
