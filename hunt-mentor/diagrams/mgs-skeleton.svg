<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side cutaway of a goose. A big red breast muscle sits on the keel, the deep breastbone, and powers flight; it is the meat. The wing bones are hollow and the bones link to the air sacs, 80 percent. The legs are set far back.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Built to fly: keel, muscle, hollow bone</text><path d="M60 170 Q40 150 70 125 Q110 100 190 105 L250 100 Q262 60 285 40 Q300 30 318 38 L340 44 L318 50 Q300 50 292 70 Q282 100 290 130 Q300 175 250 195 Q180 215 110 205 Q75 198 60 170Z" fill="#efe6d6" stroke="#2f3a2b" stroke-width="2"/><path d="M150 160 Q210 205 280 150 Q260 120 200 125 Q160 130 150 160Z" fill="#c0392b" opacity=".75"/><path d="M150 186 Q215 222 285 168" stroke="#fff" stroke-width="6" fill="none"/><path d="M150 186 Q215 222 285 168" stroke="#6b4f35" stroke-width="3" fill="none"/><path d="M120 130 L170 118 L220 122" stroke="#6b4f35" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M140 200 L130 250 L145 262 M165 205 L160 250 L178 262" stroke="#2f3a2b" stroke-width="4" fill="none"/><path d="M262 92 Q275 60 295 44" stroke="#6b4f35" stroke-width="3" fill="none" stroke-dasharray="4 3"/><text x="215" y="150" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Breast muscle</text><text x="215" y="166" font-size="14" fill="#fff" text-anchor="middle">= the meat</text><line x1="330" y1="215" x2="255.0" y2="190.0" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><polygon points="255.0,190.0 262.9,189.0 260.7,195.6" fill="#e8590c"/><text x="340" y="232" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Keel</text><text x="340" y="248" font-size="14" fill="#23261f" text-anchor="middle">(breastbone)</text><line x1="90" y1="90" x2="140.0" y2="122.0" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><polygon points="140.0,122.0 132.1,121.0 135.8,115.2" fill="#e8590c"/><text x="80" y="70" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Wing bones,</text><text x="80" y="86" font-size="14" fill="#23261f" text-anchor="middle">hollow</text><line x1="70" y1="250" x2="128.0" y2="240.0" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><polygon points="128.0,240.0 121.5,244.7 120.3,237.8" fill="#e8590c"/><text x="60" y="268" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Legs set</text><text x="60" y="284" font-size="14" fill="#23261f" text-anchor="middle">far back</text><text x="300" y="280" font-size="14" fill="#2f3a2b" text-anchor="middle">Bones link to air sacs (80%)</text>
</svg>
