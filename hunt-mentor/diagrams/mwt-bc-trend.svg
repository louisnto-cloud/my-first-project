<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Bar chart of BC white tailed deer population estimates: about 40,000 in 1987, more than 113,000 in 2011, and a range of 35,000 to 71,500 in 2022. A note says the estimates use different methods, so compare with care." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">BC white tail numbers (estimates)</text><line x1="30" y1="250" x2="380" y2="250" stroke="#23261f" stroke-width="2"/><rect x="50" y="182" width="70" height="68" rx="4" fill="#8b5a2b" opacity="1"/><text x="85" y="270" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">1987</text><text x="85" y="174.0" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">40,000</text><rect x="165" y="58" width="70" height="192" rx="4" fill="#8b5a2b" opacity="1"/><text x="200" y="270" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">2011</text><text x="200" y="49.900000000000006" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">113,000+</text><rect x="280" y="128" width="70" height="122" rx="4" fill="#e8590c" opacity="0.45"/><rect x="280" y="190" width="70" height="60" rx="4" fill="#e8590c"/><text x="315" y="270" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">2022</text><text x="315" y="120.44999999999999" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">35,000 to 71,500</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Different methods: compare with care.</text>
</svg>
