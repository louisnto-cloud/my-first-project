<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Forest Service Road habit 1. At the start of the road a green sign posts the road radio channel, RR and a number, and says to call your kilometre and direction. The channel varies by road. Note the channel and drive with headlights on.">
