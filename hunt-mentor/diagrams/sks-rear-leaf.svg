<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" font-family="sans-serif" role="img" aria-label="The rear sight leaf drawn large: marks 1 to 10 for hundreds of metres, from 100 m to 1000 m. The first mark, in orange, is the battle setting for up to 300 m. The slide, in orange, is set by pressing its catch and moving it.">
<rect x="0" y="0" width="400" height="310" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Rear sight leaf</text>
<polygon points="40.0,170.0 360.0,120.0 360.0,170.0" fill="#C8CCC6" stroke="#17201A" stroke-width="2" stroke-linejoin="round"/><line x1="70.0" y1="170.0" x2="70.0" y2="158.0" stroke="#17201A" stroke-width="1.5" stroke-linecap="round"/><line x1="97.0" y1="170.0" x2="97.0" y2="155.4" stroke="#17201A" stroke-width="1.5" stroke-linecap="round"/><text x="97.0" y="196.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">1</text><line x1="124.0" y1="170.0" x2="124.0" y2="152.8" stroke="#17201A" stroke-width="1.5" stroke-linecap="round"/><text x="124.0" y="196.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">2</text><line x1="151.0" y1="170.0" x2="151.0" y2="150.2" stroke="#17201A" stroke-width="1.5" stroke-linecap="round"/><text x="151.0" y="196.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">3</text><line x1="178.0" y1="170.0" x2="178.0" y2="147.6" stroke="#17201A" stroke-width="1.5" stroke-linecap="round"/><text x="178.0" y="196.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">4</text><line x1="205.0" y1="170.0" x2="205.0" y2="145.0" stroke="#17201A" stroke-width="1.5" stroke-linecap="round"/><text x="205.0" y="196.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">5</text><line x1="232.0" y1="170.0" x2="232.0" y2="142.4" stroke="#17201A" stroke-width="1.5" stroke-linecap="round"/><text x="232.0" y="196.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">6</text><line x1="259.0" y1="170.0" x2="259.0" y2="139.8" stroke="#17201A" stroke-width="1.5" stroke-linecap="round"/><text x="259.0" y="196.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">7</text><line x1="286.0" y1="170.0" x2="286.0" y2="137.2" stroke="#17201A" stroke-width="1.5" stroke-linecap="round"/><text x="286.0" y="196.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">8</text><line x1="313.0" y1="170.0" x2="313.0" y2="134.6" stroke="#17201A" stroke-width="1.5" stroke-linecap="round"/><text x="313.0" y="196.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">9</text><line x1="340.0" y1="170.0" x2="340.0" y2="132.0" stroke="#17201A" stroke-width="1.5" stroke-linecap="round"/><text x="340.0" y="196.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">10</text><line x1="70.0" y1="170.0" x2="70.0" y2="152.0" stroke="#FF6A13" stroke-width="4" stroke-linecap="round"/><text x="56.0" y="214.0" font-size="14" font-weight="bold" fill="#FF6A13" text-anchor="start">first mark: battle</text><rect x="150.0" y="128.0" width="30.0" height="48.0" rx="3" fill="#FF6A13" stroke="#17201A" stroke-width="2"/><text x="165.0" y="120.0" font-size="14" font-weight="bold" fill="#FF6A13" text-anchor="middle">slide</text><text x="200.0" y="240.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">1 = 100 m, 3 = 300 m, 10 = 1000 m.</text><text x="200.0" y="262.0" font-size="14" fill="#17201A" text-anchor="middle">Battle setting: for up to 300 m.</text>
<text x="200.0" y="298.0" font-size="14" fill="#17201A" text-anchor="middle">Press the slide catch, move, let go.</text>
</svg>
