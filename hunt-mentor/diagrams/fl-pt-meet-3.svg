<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Agree how long to wait: for example 30 minutes. Then blow the whistle and call or text.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="30" cy="32" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="30" y="39" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">3</text>
<text x="56" y="39" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="start">A wait window</text>
<rect x="80" y="110" width="240" height="50" rx="10" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2"/><rect x="80" y="110" width="120" height="50" rx="10" fill="#e8590c"/><text x="200" y="192" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wait 30 min (Tip)</text>
<rect x="10" y="262" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="285.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Then whistle, call, text.</text>
