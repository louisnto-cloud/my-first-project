<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" font-family="sans-serif" role="img" aria-label="What a good mentor does. Do: plan a short first day, warm, fed, home early. Do: explain why, about wind, glassing and shot angle. Do: back every no shot decision. Do: hand them the knife at the gut pile and stay beside them. Do: share the meat and the credit. Do: call a week later and invite them again. Do not: take three new hunters at once, the limit is two. Do not: a 12 hour cold first day with no explanations.">
<rect x="0" y="0" width="400" height="430" fill="#fffaf0"/>
