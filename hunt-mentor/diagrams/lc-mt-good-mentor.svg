and them</text><text x="261" y="182" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">the knife,</text><text x="261" y="200" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">stay beside</text><rect x="10" y="236" width="185" height="88" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(40 270) scale(0.9)"><path d="M-18 -4 Q-14 -18 6 -14 Q22 -10 18 6 Q12 18 -6 14 Q-20 10 -18 -4 Z" fill="#c0504d" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -2 Q2 -8 10 0" stroke="#f5e0d8" stroke-width="3" fill="none"/><circle cx="8" cy="6" r="3" fill="#f5f0e0"/></g><circle cx="179" cy="252" r="11" fill="#8a9a6b"/><path d="M173 252 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="260" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Share the</text><text x="68" y="278" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">meat and the</text><text x="68" y="296" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">credit</text><rect x="203" y="236" width="185" height="88" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(233 270) scale(0.9)"><rect x="-10" y="-18" width="20" height="36" rx="4" fill="#2f3a2b"/><rect x="-7" y="-13" width="14" height="24" fill="#dbe7f2"/><circle cx="0" cy="14" r="1.8" fill="#fff"/></g><circle cx="372" cy="252" r="11" fill="#8a9a6b"/><path d="M366 252 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="261" y="260" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Call a week</text><text x="261" y="278" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">later,</text><text x="261" y="296" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">invite again</text><rect x="10" y="332" width="185" height="88" rx="10" fill="#fdf0e6" stroke="#e8590c" stroke-width="2"/><g transform="translate(40 366) scale(0.9)"><circle cx="-9" cy="-10" r="6" fill="#2f3a2b"/><path d="M-18 16 V2 Q-9 -5 0 2 V16 Z" fill="#2f3a2b"/><circle cx="10" cy="-8" r="6" fill="#8a9a6b"/><path d="M1 18 V4 Q10 -3 19 4 V18 Z" fill="#8a9a6b"/></g><circle cx="179" cy="348" r="11" fill="#e8590c"/><path d="M174 343 l10 10 M184 343 l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="68" y="356" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Take three</text><text x="68" y="374" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">at once:</text><text x="68" y="392" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">limit is two</text><rect x="203" y="332" width="185" height="88" rx="10" fill="#fdf0e6" stroke="#e8590c" stroke-width="2"/><g transform="translate(233 366) scale(0.9)"><circle r="18" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 0 V-11 M0 0 L8 5" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="372" cy="348" r="11" fill="#e8590c"/><path d="M367 343 l10 10 M377 343 l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="261" y="356" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">12 hour cold</text><text x="261" y="374" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">day, no</text><text x="261" y="392" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">explanations</text>
