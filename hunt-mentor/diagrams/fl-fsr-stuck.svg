<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 332" font-family="sans-serif" role="img" aria-label="Stuck or broken down: a yes or no flow. Anyone hurt? Yes: first aid, then call. No: is it safe to fix? Yes: fix it, then go. No: cell or satellite signal? Yes: send a message by phone or satellite messenger. No: stay with the truck. It is shelter and easier to find (85%). Wait for the help your trip plan will send.">
<rect width="400" height="332" fill="#fffaf0"/>
<text x="14" y="26" font-size="18" font-weight="bold" fill="#2f3a2b">Stuck or broken down?</text>
<rect x="14" y="42" width="196" height="44" rx="10" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="1.6"/>
<text x="112" y="70" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Anyone hurt?</text>
<line x1="210" y1="64" x2="246" y2="64" stroke="#c0392b" stroke-width="2.4"/><path d="M254 64 l-9 -5 v10z" fill="#c0392b"/>
<text x="228" y="57" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Yes</text>
<rect x="254" y="44" width="138" height="40" rx="8" fill="#fbe1dc" stroke="#c0392b" stroke-width="1.6"/>
<text x="323" y="69" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">First aid, call</text>
<line x1="112" y1="86" x2="112" y2="106" stroke="#2f3a2b" stroke-width="2.4"/><path d="M112 114 l-5 -9 h10z" fill="#2f3a2b"/>
<text x="122" y="104" font-size="14" font-weight="bold" fill="#2f3a2b">No</text>
<rect x="14" y="114" width="196" height="44" rx="10" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="1.6"/>
<text x="112" y="142" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Safe to fix it?</text>
<line x1="210" y1="136" x2="246" y2="136" stroke="#c0392b" stroke-width="2.4"/><path d="M254 136 l-9 -5 v10z" fill="#c0392b"/>
<text x="228" y="129" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Yes</text>
<rect x="254" y="116" width="138" height="40" rx="8" fill="#fbe1dc" stroke="#c0392b" stroke-width="1.6"/>
<text x="323" y="141" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Fix, then go</text>
<line x1="112" y1="158" x2="112" y2="178" stroke="#2f3a2b" stroke-width="2.4"/><path d="M112 186 l-5 -9 h10z" fill="#2f3a2b"/>
<text x="122" y="176" font-size="14" font-weight="bold" fill="#2f3a2b">No</text>
<rect x="14" y="186" width="196" height="44" rx="10" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="1.6"/>
<text x="112" y="214" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cell or satellite?</text>
<line x1="210" y1="208" x2="246" y2="208" stroke="#c0392b" stroke-width="2.4"/><path d="M254 208 l-9 -5 v10z" fill="#c0392b"/>
<text x="228" y="201" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Yes</text>
<rect x="254" y="188" width="138" height="40" rx="8" fill="#fbe1dc" stroke="#c0392b" stroke-width="1.6"/>
<text x="323" y="213" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Send a message</text>
<line x1="112" y1="230" x2="112" y2="250" stroke="#2f3a2b" stroke-width="2.4"/><path d="M112 258 l-5 -9 h10z" fill="#2f3a2b"/>
<text x="122" y="248" font-size="14" font-weight="bold" fill="#2f3a2b">No</text>
<rect x="14" y="258" width="376" height="62" rx="12" fill="#2f3a2b"/>
<g transform="translate(52 289)"><path d="M-22 6 V-6 H2 V-14 H14 L22 -4 V6z" fill="#e8590c"/><path d="M5 -11 H12 L18 -4 H5z" fill="#cfe0ee"/><circle cx="-12" cy="8" r="6" fill="#1d201b" stroke="#fffaf0" stroke-width="1.6"/><circle cx="12" cy="8" r="6" fill="#1d201b" stroke="#fffaf0" stroke-width="1.6"/></g>
<text x="90" y="286" font-size="19" font-weight="bold" fill="#fffaf0">Stay with the truck</text>
<text x="90" y="307" font-size="15" fill="#e9e3d3">Shelter, and easier to find (85%)</text>
</svg>
