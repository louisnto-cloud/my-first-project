<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Antler growth by age from the BC elk account: yearling bulls usually carry spikes, two year olds 3 or 4 points a side (raghorns), three year olds 4 or 5 points, bulls four and older about 6 points a side. A legal 6 point bull has at least 6 tines on one antler, and the brow tine counts.">
<rect width="400" height="300" fill="#fffaf0"/>
