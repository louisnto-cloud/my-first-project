roke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M273.3 184.5 l15.4 -12.1" fill="none" stroke="#6b4f35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M268.5 164.8 l15.4 -12.1" fill="none" stroke="#6b4f35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M262.1 145.1 l14.0 -11.0" fill="none" stroke="#6b4f35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M254.4 126.6 l12.6 -9.9" fill="none" stroke="#6b4f35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="240" y1="202" x2="290" y2="202" stroke="#23261f" stroke-width="3"/><text x="254" y="222" font-size="14" fill="#23261f" text-anchor="middle">4 or 5 a side</text><text x="254" y="238" font-size="14" fill="#6b4f35" text-anchor="middle">heavier</text><rect x="305" y="44" width="88" height="200" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="349" y="64" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">4 years plus</text><path d="M371 200 Q361 134.0 327.0 89.99999999999999" fill="none" stroke="#6b4f35" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M368.3 184.5 l15.4 -12.1" fill="none" stroke="#6b4f35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M363.5 164.8 l15.4 -12.1" fill="none" stroke="#6b4f35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M357.1 145.1 l14.0 -11.0" fill="none" stroke="#6b4f35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M349.4 126.6 l12.6 -9.9" fill="none" stroke="#6b4f35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M339.6 108.5 l11.2 -8.8" fill="none" stroke="#6b4f35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="335" y1="202" x2="385" y2="202" stroke="#23261f" stroke-width="3"/><text x="349" y="222" font-size="14" fill="#23261f" text-anchor="middle">About 6 a 