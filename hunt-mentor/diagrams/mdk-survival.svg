<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart: of 100 adult mallards, about 63 are alive after 1 year, 40 after 2, 25 after 3, 16 after 4 and 10 after 5, using about 6 in 10 surviving each year, 75 percent. The oldest wild mallard on record lived to 27, 70 percent."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">100 adult mallards: how many left?</text><rect x="30" y="50.0" width="44" height="160.0" rx="4" fill="#2f3a2b"/><text x="52" y="42.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">100</text><text x="52" y="230" font-size="14" fill="#2f3a2b" text-anchor="middle">Start</text><rect x="90" y="109.19999999999999" width="44" height="100.80000000000001" rx="4" fill="#8b5a2b"/><text x="112" y="101.19999999999999" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">63</text><text x="112" y="230" font-size="14" fill="#2f3a2b" text-anchor="middle">Yr 1</text><rect x="150" y="146.0" width="44" height="64.0" rx="4" fill="#8b5a2b"/><text x="172" y="138.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">40</text><text x="172" y="230" font-size="14" fill="#2f3a2b" text-anchor="middle">Yr 2</text><rect x="210" y="170.0" width="44" height="40.0" rx="4" fill="#8b5a2b"/><text x="232" y="162.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">25</text><text x="232" y="230" font-size="14" fill="#2f3a2b" text-anchor="middle">Yr 3</text><rect x="270" y="184.4" width="44" height="25.6" rx="4" fill="#8b5a2b"/><text x="292" y="176.4" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">16</text><text x="292" y="230" font-size="14" fill="#2f3a2b" text-anchor="middle">Yr 4</text><rect x="330" y="194.0" width="44" height="16.0" rx="4" fill="#8b5a2b"/><text x="352" y="186.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">10</text><text x="352" y="230" font-size="14" fill="#2f3a2b" text-anchor="middle">Yr 5</text><rect x="10" y="244" width="380" height="48" rx="8" fill="#dfe6d3"/><text x="200" y="264" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">About 6 in 10 adults live each year (75%)</text><text x="200" y="284" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Oldest wild mallard on record: 27 (70%)</text></svg>
