<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="sans-serif" role="img" aria-label="Bar chart of a 2020 to 2021 Delta Farmland and Wildlife Trust survey of about 130 winter fields. By March 2021, about 60 percent were grazed to the soil by waterfowl, about 24 percent had some grazing, and about 16 percent, 21 fields, had none. The most common birds were mallard, American wigeon and snow goose.">
<rect width="400" height="290" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Delta winter fields, March 2021</text><text x="142" y="78" font-size="15" fill="#2f3a2b" text-anchor="end">Grazed to soil</text><rect x="150" y="50" width="126.0" height="34" rx="4" fill="#e8590c"/><text x="282.0" y="78" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">60%</text><text x="142" y="126" font-size="15" fill="#2f3a2b" text-anchor="end">Some grazing</text><rect x="150" y="98" width="50.4" height="34" rx="4" fill="#8a9a6b"/><text x="206.4" y="126" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">24%</text><text x="142" y="174" font-size="15" fill="#2f3a2b" text-anchor="end">No grazing</text><rect x="150" y="146" width="33.6" height="34" rx="4" fill="#bbb"/><text x="189.6" y="174" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">16%</text><text x="200" y="226" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">About 130 fields surveyed</text><text x="200" y="250" font-size="14" fill="#2f3a2b" text-anchor="middle">Most common: mallard, wigeon, snow goose</text><text x="200.0" y="280" font-size="14" fill="#6b4f35" text-anchor="middle">Delta Farmland and Wildlife Trust, via news (70%)</text>
</svg>
