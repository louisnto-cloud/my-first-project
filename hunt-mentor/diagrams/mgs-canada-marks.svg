<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Labelled side view of a Canada goose with five marks: black head and neck, white chinstrap, grey brown body, white under the tail, black bill, legs and feet. Sexes look the same, 85 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Canada goose: the 5 marks</text><g transform="translate(190 215) scale(2.4 2.4)"><path d="M-34 0 Q-38 -16 -18 -16 L12 -14 Q26 -10 24 2 Q18 12 -4 12 L-24 12 Q-36 8 -34 0Z" fill="#7a6a58"/><path d="M-36 2 Q-40 -2 -30 -8 L-28 6Z" fill="#fff"/><path d="M14 -12 Q18 -40 24 -46 L30 -44 Q24 -36 22 -10Z" fill="#2f3a2b"/><ellipse cx="28" cy="-48" rx="7" ry="5" fill="#2f3a2b"/><path d="M34 -49 L44 -46 L34 -44Z" fill="#2f3a2b"/><path d="M24 -50 Q28 -44 30 -46" stroke="#fff" stroke-width="3" fill="none"/><path fill="none" d="M-6 12 L-8 26 M2 12 L4 26" stroke="#2f3a2b" stroke-width="3"/></g><line x1="110" y1="70" x2="232.0" y2="96.0" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><polygon points="232.0,96.0 224.2,97.9 225.7,91.1" fill="#e8590c"/><text x="70" y="64" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Black head</text><text x="70" y="80" font-size="14" fill="#23261f" text-anchor="middle">and neck</text><line x1="330" y1="80" x2="262.0" y2="100.0" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><polygon points="262.0,100.0 267.9,94.6 269.9,101.3" fill="#e8590c"/><text x="340" y="62" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">White</text><text x="340" y="78" font-size="14" fill="#23261f" text-anchor="middle">chinstrap</text><line x1="300" y1="190" x2="240.0" y2="205.0" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><polygon points="240.0,205.0 246.1,199.9 247.8,206.6" fill="#e8590c"/><text x="340" y="186" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Grey brown</text><text x="340" y="202" font-size="14" fill="#23261f" text-anchor="middle">body</text><line x1="60" y1="170" x2="105.0" y2="205.0" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><polygon points="105.0,205.0 97.2,203.3 101.5,197.8" fill="#e8590c"/><text x="60" y="150" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">White under</text><text x="60" y="166" font-size="14" fill="#23261f" text-anchor="middle">the tail</text><line x1="250" y1="262" x2="200.0" y2="262.0" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><polygon points="200.0,262.0 207.2,258.5 207.2,265.5" fill="#e8590c"/><text x="320" y="258" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Black bill,</text><text x="320" y="274" font-size="14" fill="#23261f" text-anchor="middle">legs and feet</text><text x="200" y="292" font-size="14" fill="#2f3a2b" text-anchor="middle">Sexes look the same (85%)</text>
</svg>
