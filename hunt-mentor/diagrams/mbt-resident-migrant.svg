<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 318" font-family="sans-serif" role="img" aria-label="Two kinds of deer. Resident: about 140 hectares a year in one area. Migrant: separate summer and winter ranges, often 2 to 5 km apart. In the moderate snow zone 20 to 25% of deer migrate; in the deep snow zone 70% or more.">
<rect width="400" height="318" fill="#EEF1EA"/>
<text x="200" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Stay home or move?</text>
<rect x="14" y="46" width="180" height="210" rx="10" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.5"/><rect x="206" y="46" width="180" height="210" rx="10" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.5"/><text x="104" y="72" font-size="16" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Resident</text><text x="296" y="72" font-size="16" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Migrant</text><circle cx="104" cy="150" r="46" fill="#8a9a6b" stroke="none"/><text x="104" y="146" font-size="14" text-anchor="middle" font-weight="normal" fill="#ffffff">about</text><text x="104" y="166" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff">140 ha</text><circle cx="296" cy="112" r="30" fill="#8a9a6b" stroke="none"/><text x="296" y="117" font-size="14" text-anchor="middle" font-weight="normal" fill="#ffffff">summer</text><circle cx="296" cy="214" r="30" fill="#1F3D2B" stroke="none"/><text x="296" y="219" font-size="14" text-anchor="middle" font-weight="normal" fill="#ffffff">winter</text><path d="M296 140 L296 186" fill="none" stroke="#FF6A13" stroke-width="3"/><text x="306" y="168" font-size="14" text-anchor="start" font-weight="bold" fill="#17201A">2 to 5 km</text><text x="104" y="232" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">a year, one area</text><text x="200" y="284" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">Migrants: 20 to 25% (moderate snow zone)</text><text x="200" y="304" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">70% or more (deep snow zone)</text>
</svg>
