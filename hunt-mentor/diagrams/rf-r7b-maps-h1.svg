<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 608" role="img" aria-label="Cards for Maps H1 to H9. H1 Kakwa Park and Recreation Area: No Hunting Area. H2 Bear Mountain: no hunting 1 June to 15 October. H3 One Island Pasture: firearms using shot only 1 June to 15 October. H4 Bear Mountain Nordic Ski Area: No Shooting Area. H5 Mt. Bergeron and Tumbler Ridge: No Shooting or Hunting Area. H6 Dickebush and Trapper Creek: motor vehicles prohibited year round on the road shown. H7 Southeast Peace: Motor Vehicle Closed Area above 1,400 metres. H8 Groundbirch: shot only 1 June to 31 October. H9 Dokie Subdivision: No Shooting Area." font-family="sans-serif">
