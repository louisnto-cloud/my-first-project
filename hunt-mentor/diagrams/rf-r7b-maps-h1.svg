<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 611" font-family="sans-serif" role="img" aria-label="List of Region 7B Maps H1 to H9. H1 Kakwa Park and Recreation Area, MU 7-19: No Hunting Area. H2 Bear Mountain, MU 7-20: no hunting 1 June to 15 October. H3 One Island Pasture, MU 7-20: firearms using shot only 1 June to 15 October. H4 Bear Mountain Nordic Ski Area, MU 7-20: No Shooting Area. H5 Mt. Bergeron and Tumbler Ridge, MU 7-21: No Shooting or Hunting Area. H6 Dickebush and Trapper Creek, MU 7-21: motor vehicles prohibited all year on the road shown. H7 Southeast Peace, MU 7-21: Motor Vehicle Closed Area above 1,400 metres. H8 Groundbirch, MU 7-21: shot only 1 June to 31 October. H9 Dokie Subdivision, MUs 7-22 and 7-31: No Shooting Area. Colours: red no hunting, orange no shooting, green shot only or bow, blue vehicle rule.">
