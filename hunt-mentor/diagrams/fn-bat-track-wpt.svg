<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Left: a dashed orange track line recorded all day keeps the screen awake. Right: waypoints for the truck, a glassing seat and a bench, dropped with the screen off between them, cost almost no battery. Tip.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="36" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Track or waypoints?</text><path d="M60 240 C 90 200, 120 230, 150 170 C 170 130, 150 100, 180 70" fill="none" stroke="#e8590c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/><text x="100" y="290" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Track: screen awake</text><g transform="translate(55 255)"><rect x="-22" y="-14" width="30" height="14" fill="#2f3a2b"/><path d="M8 -14 h10 l6 7 v7 h-16 Z" fill="#2f3a2b"/><circle cx="-12" cy="2" r="5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/><circle cx="14" cy="2" r="5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/></g><line x1="200" y1="50" x2="200" y2="270" stroke="#868e96" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 5"/><circle cx="280" cy="175" r="9" fill="#8a9a6b" stroke="none" stroke-width="2"/><text x="292" y="180" font-family="sans-serif" font-size="14" fill="#8a9a6b" text-anchor="start">Seat</text><circle cx="320" cy="95" r="9" fill="#8a9a6b" stroke="none" stroke-width="2"/><text x="332" y="100" font-family="sans-serif" font-size="14" fill="#8a9a6b" text-anchor="start">Bench</text><g transform="translate(250 255)"><rect x="-22" y="-14" width="30" height="14" fill="#2f3a2b"/><path d="M8 -14 h10 l6 7 v7 h-16 Z" fill="#2f3a2b"/><circle cx="-12" cy="2" r="5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/><circle cx="14" cy="2" r="5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/></g><text x="305" y="290" font-family="sans-serif" font-size="14" fill="#8a9a6b" text-anchor="middle" font-weight="bold">Waypoints: screen off</text>
</svg>
