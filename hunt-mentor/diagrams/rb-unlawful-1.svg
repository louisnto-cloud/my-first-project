<text x="17" y="313" font-size="14" fill="#ffffff" text-anchor="start" font-weight="bold">37, 38</text>
<g transform="translate(102 342) scale(0.9)"><line x1="0" y1="-14" x2="0" y2="-22" stroke="#e8590c" stroke-width="3" transform="rotate(-90)"/><line x1="0" y1="-14" x2="0" y2="-22" stroke="#e8590c" stroke-width="3" transform="rotate(-60)"/><line x1="0" y1="-14" x2="0" y2="-22" stroke="#e8590c" stroke-width="3" transform="rotate(-30)"/><line x1="0" y1="-14" x2="0" y2="-22" stroke="#e8590c" stroke-width="3" transform="rotate(0)"/><line x1="0" y1="-14" x2="0" y2="-22" stroke="#e8590c" stroke-width="3" transform="rotate(30)"/><line x1="0" y1="-14" x2="0" y2="-22" stroke="#e8590c" stroke-width="3" transform="rotate(60)"/><line x1="0" y1="-14" x2="0" y2="-22" stroke="#e8590c" stroke-width="3" transform="rotate(90)"/><circle r="11" fill="#e8590c"/></g>
<text x="102" y="386" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Legal hours only</text>
<text x="102" y="405" font-size="14" fill="#2f3a2b" text-anchor="middle">never at night</text>
<rect x="204" y="296" width="188" height="120" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<rect x="204" y="296" width="36" height="24" rx="8" fill="#e8590c"/>
<text x="213" y="313" font-size="14" fill="#ffffff" text-anchor="start" font-weight="bold">38</text>
<g transform="translate(292 342) scale(0.9)"><path d="M-6 -8 L-22 -2 L-22 2 L-6 8 Z" fill="#2f3a2b" transform="rotate(180)"/><rect x="-22" y="-7" width="16" height="14" rx="3" fill="#2f3a2b"/><path d="M-6 -8 L26 -20 L26 20 L-6 8 Z" fill="#f2c94c" opacity=".8"/></g><circle cx="298" cy="342" r="26" fill="none" stroke="#c92a2a" stroke-width="4"/><line x1="279.8" y1="360.2" x2="316.2" y2="323.8" stroke="#c92a2a" stroke-width="4"/>
<text x="298" y="386" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">No light to hunt</text>
<text x="298" y="405" font-size="14" fill="#2f3a2b" text-anchor="middle">by, of any kind</text>
</svg>
