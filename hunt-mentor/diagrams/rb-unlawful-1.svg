<text x="298" y="149" font-size="14" fill="#2f3a2b" text-anchor="middle">licence, ever</text>
<rect x="8" y="168" width="188" height="120" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<rect x="8" y="168" width="36" height="24" rx="8" fill="#e8590c"/>
<text x="17" y="185" font-size="14" fill="#ffffff" text-anchor="start" font-weight="bold">22</text>
<g transform="translate(102 214) scale(0.9)"><rect x="-34" y="-14" width="40" height="22" rx="3" fill="#4a7fb0"/><path d="M6 -14 L22 -14 L32 -2 L32 8 L6 8 Z" fill="#4a7fb0"/><path d="M10 -10 L20 -10 L27 -2 L10 -2 Z" fill="#ffffff"/><circle cx="-20" cy="10" r="7" fill="#2f3a2b"/><circle cx="20" cy="10" r="7" fill="#2f3a2b"/></g><circle cx="102" cy="214" r="26" fill="none" stroke="#c92a2a" stroke-width="4"/><line x1="83.8" y1="232.2" x2="120.2" y2="195.8" stroke="#c92a2a" stroke-width="4"/>
<text x="102" y="258" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">No hunting from</text>
<text x="102" y="277" font-size="14" fill="#2f3a2b" text-anchor="middle">a motor vehicle</text>
<rect x="204" y="168" width="188" height="120" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<rect x="204" y="168" width="36" height="24" rx="8" fill="#e8590c"/>
<text x="213" y="185" font-size="14" fill="#ffffff" text-anchor="start" font-weight="bold">28</text>
