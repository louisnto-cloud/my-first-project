<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 432" role="img" aria-label="Icon cards, top unlawful acts part 1, with the item number from the page 11 list. Item 1: cancel your species licence before you touch big game. Item 2: never use another person&#x27;s licence. Item 22: no hunting from a motor vehicle. Item 28: no loaded firearm in or on a vehicle such as a truck or ATV. Items 37 and 38: hunt only in legal hours, never at night. Item 38, second: no light of any kind to hunt by." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="432" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#23261f" text-anchor="middle" font-weight="bold">Top 10 unlawful acts (1 of 2)</text>
<rect x="8" y="40" width="188" height="120" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<rect x="8" y="40" width="27" height="24" rx="8" fill="#e8590c"/>
<text x="17" y="57" font-size="14" fill="#ffffff" text-anchor="start" font-weight="bold">1</text>
<g transform="translate(102 86) scale(1.0)"><rect x="-26" y="-18" width="52" height="36" rx="4" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><line x1="-18" y1="-8" x2="18" y2="-8" stroke="#2f3a2b" stroke-width="2.5"/><line x1="-18" y1="0" x2="10" y2="0" stroke="#2f3a2b" stroke-width="2"/><line x1="-18" y1="8" x2="14" y2="8" stroke="#2f3a2b" stroke-width="2"/><path d="M-26 -8 l6 3 l-6 3 Z M26 2 l-6 3 l6 3 Z" fill="#e8590c"/></g>
<text x="102" y="130" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Cancel licence</text>
<text x="102" y="149" font-size="14" fill="#2f3a2b" text-anchor="middle">before you touch</text>
<rect x="204" y="40" width="188" height="120" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<rect x="204" y="40" width="27" height="24" rx="8" fill="#e8590c"/>
<text x="213" y="57" font-size="14" fill="#ffffff" text-anchor="start" font-weight="bold">2</text>
<g transform="translate(298 86) scale(1.0)"><rect x="-26" y="-18" width="52" height="36" rx="4" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><line x1="-18" y1="-8" x2="18" y2="-8" stroke="#2f3a2b" stroke-width="2.5"/><line x1="-18" y1="0" x2="10" y2="0" stroke="#2f3a2b" stroke-width="2"/><line x1="-18" y1="8" x2="14" y2="8" stroke="#2f3a2b" stroke-width="2"/></g><circle cx="298" cy="86" r="24" fill="none" stroke="#c92a2a" stroke-width="4"/><line x1="281.2" y1="102.8" x2="314.8" y2="69.2" stroke="#c92a2a" stroke-width="4"/>
