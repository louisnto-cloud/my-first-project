<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 464" font-family="sans-serif" role="img" aria-label="Icon cards, top unlawful acts part 1, with the item number from the page 11 list. Item 1: cancel your species licence before you touch big game. Item 2: never use another person&#x27;s licence. Item 22: no hunting from a motor vehicle. Item 28: no loaded firearm in or on a vehicle such as a truck or ATV. Items 37 and 38: hunt only in legal hours, never at night. Item 38, second: no light of any kind to hunt by.">
<rect width="400" height="464" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" font-weight="bold" fill="#23261f" text-anchor="middle">Top 10 unlawful acts (1 of 2)</text>
<g data-tip="Item 1: cancel first|Anyone who kills big game must cancel the species licence immediately after the kill, before handling the animal."><rect x="8" y="40" width="188" height="132" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<g transform="translate(0 6)"><g transform="translate(102 86) scale(1.35)"><rect x="-26" y="-18" width="52" height="36" rx="4" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><line x1="-18" y1="-8" x2="18" y2="-8" stroke="#2f3a2b" stroke-width="2.5"/><line x1="-18" y1="0" x2="10" y2="0" stroke="#2f3a2b" stroke-width="2"/><line x1="-18" y1="8" x2="14" y2="8" stroke="#2f3a2b" stroke-width="2"/><path d="M-26 -8 l6 3 l-6 3 Z M26 2 l-6 3 l6 3 Z" fill="#e8590c"/></g></g>
<rect x="16" y="48" width="25.0" height="24" rx="12" fill="#e8590c"/>
<text x="28.5" y="65" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">1</text>
<text x="102" y="140" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Cancel licence</text>
<text x="102" y="161" font-size="15" fill="#2f3a2b" text-anchor="middle">before you touch it</text></g>
<g data-tip="Item 2: your licence only|Never use another person&#x27;s licence, and never lend or transfer yours. The hunter who kills it cancels their own licence."><rect x="204" y="40" width="188" height="132" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<g transform="translate(0 6)"><g transform="translate(298 86) scale(1.2)"><rect x="-26" y="-18" width="52" height="36" rx="4" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><line x1="-18" y1="-8" x2="18" y2="-8" stroke="#2f3a2b" stroke-width="2.5"/><line x1="-18" y1="0" x2="10" y2="0" stroke="#2f3a2b" stroke-width="2"/><line x1="-18" y1="8" x2="14" y2="8" stroke="#2f3a2b" stroke-width="2"/></g><circle cx="298" cy="86" r="30" fill="none" stroke="#c92a2a" stroke-width="4"/><line x1="276.8" y1="107.2" x2="319.2" y2="64.8" stroke="#c92a2a" stroke-width="4"/></g>
<rect x="212" y="48" width="25.0" height="24" rx="12" fill="#e8590c"/>
<text x="224.5" y="65" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text>
<text x="298" y="140" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">No one else&#x27;s</text>
<text x="298" y="161" font-size="15" fill="#2f3a2b" text-anchor="middle">licence, ever</text></g>
<g data-tip="Item 22: not from a vehicle|No hunting from the truck, the ATV (All Terrain Vehicle) or a snowmobile, moving or parked. Get off and away before you shoot."><rect x="8" y="180" width="188" height="132" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<g transform="translate(0 18)"><g transform="translate(102 214) scale(1.1)"><rect x="-34" y="-14" width="40" height="22" rx="3" fill="#4a7fb0"/><path d="M6 -14 L22 -14 L32 -2 L32 8 L6 8 Z" fill="#4a7fb0"/><path d="M10 -10 L20 -10 L27 -2 L10 -2 Z" fill="#ffffff"/><circle cx="-20" cy="10" r="7" fill="#2f3a2b"/><circle cx="20" cy="10" r="7" fill="#2f3a2b"/></g><circle cx="102" cy="214" r="34" fill="none" stroke="#c92a2a" stroke-width="4"/><line x1="78" y1="238" x2="126" y2="190" stroke="#c92a2a" stroke-width="4"/></g>
<rect x="16" y="188" width="34.0" height="24" rx="12" fill="#e8590c"/>
<text x="33" y="205" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">22</text>
<text x="102" y="280" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">No hunting from</text>
<text x="102" y="301" font-size="15" fill="#2f3a2b" text-anchor="middle">a motor vehicle</text></g>
<g data-tip="Item 28: unload first|Chamber empty and no rounds in an attached magazine before the rifle goes in the truck, on the ATV (All Terrain Vehicle) or on a bike."><rect x="204" y="180" width="188" height="132" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<g transform="translate(0 18)"><g transform="translate(288 216) scale(1.05)"><path d="M-24 0 L-14 -12 L16 -12 L24 0 Z" fill="#8a9a6b"/><rect x="-4" y="-20" width="4" height="10" fill="#2f3a2b"/><rect x="-10" y="-22" width="16" height="3" fill="#2f3a2b"/><circle cx="-18" cy="6" r="9" fill="#2f3a2b"/><circle cx="18" cy="6" r="9" fill="#2f3a2b"/></g><g transform="translate(310 196) scale(0.65)"><path d="M-46 4 L-20 -2 L-20 6 L-44 14 Z" fill="#8b5a2b"/><rect x="-22" y="-4" width="30" height="8" fill="#2f3a2b"/><rect x="8" y="-2" width="40" height="4" fill="#2f3a2b"/><rect x="-14" y="-10" width="24" height="5" rx="2" fill="#2f3a2b"/><rect x="-8" y="4" width="10" height="9" fill="#2f3a2b"/></g></g>
<rect x="212" y="188" width="34.0" height="24" rx="12" fill="#e8590c"/>
<text x="229" y="205" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">28</text>
<text x="298" y="280" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">No loaded firearm</text>
<text x="298" y="301" font-size="15" fill="#2f3a2b" text-anchor="middle">in or on a vehicle</text></g>
<g data-tip="Items 37 and 38: legal hours|Deer and grouse: 1 hour before sunrise to 1 hour after sunset. Ducks and geese: 30 minutes before sunrise to 30 minutes after sunset."><rect x="8" y="320" width="188" height="132" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<g transform="translate(0 30)"><g transform="translate(102 342) scale(1.2)"><line x1="0" y1="-14" x2="0" y2="-22" stroke="#e8590c" stroke-width="3" transform="rotate(-90)"/><line x1="0" y1="-14" x2="0" y2="-22" stroke="#e8590c" stroke-width="3" transform="rotate(-60)"/><line x1="0" y1="-14" x2="0" y2="-22" stroke="#e8590c" stroke-width="3" transform="rotate(-30)"/><line x1="0" y1="-14" x2="0" y2="-22" stroke="#e8590c" stroke-width="3" transform="rotate(0)"/><line x1="0" y1="-14" x2="0" y2="-22" stroke="#e8590c" stroke-width="3" transform="rotate(30)"/><line x1="0" y1="-14" x2="0" y2="-22" stroke="#e8590c" stroke-width="3" transform="rotate(60)"/><line x1="0" y1="-14" x2="0" y2="-22" stroke="#e8590c" stroke-width="3" transform="rotate(90)"/><circle r="11" fill="#e8590c"/></g></g>
<rect x="16" y="328" width="62.2" height="24" rx="12" fill="#e8590c"/>
<text x="47.1" y="345" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">37, 38</text>
<text x="102" y="420" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Legal hours only</text>
<text x="102" y="441" font-size="15" fill="#2f3a2b" text-anchor="middle">never at night</text></g>
<g data-tip="Item 38: no lights|No spotlight, headlamp or truck lights to hunt by. A headlamp to walk in before light is not hunting with a light (my reading)."><rect x="204" y="320" width="188" height="132" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<g transform="translate(0 30)"><g transform="translate(292 342) scale(1.05)"><path d="M-6 -8 L-22 -2 L-22 2 L-6 8 Z" fill="#2f3a2b" transform="rotate(180)"/><rect x="-22" y="-7" width="16" height="14" rx="3" fill="#2f3a2b"/><path d="M-6 -8 L26 -20 L26 20 L-6 8 Z" fill="#f2c94c" opacity=".8"/></g><circle cx="298" cy="342" r="26" fill="none" stroke="#c92a2a" stroke-width="4"/><line x1="279.8" y1="360.2" x2="316.2" y2="323.8" stroke="#c92a2a" stroke-width="4"/></g>
<rect x="212" y="328" width="34.0" height="24" rx="12" fill="#e8590c"/>
<text x="229" y="345" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">38</text>
<text x="298" y="420" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">No light to hunt</text>
<text x="298" y="441" font-size="15" fill="#2f3a2b" text-anchor="middle">by, of any kind</text></g>
</svg>
