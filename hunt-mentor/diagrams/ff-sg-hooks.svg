<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Memory hooks: 40, 50, 60, 70 percent for cylinder, improved cylinder, modified and full at 40 yards. Steel equals bigger: steel number 2 for ducks. Pattern at 35 m, your real distance. Miss? More lead: most misses are behind. Butt, belly, beak: swing through the bird, fire, and keep going.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Memory hooks</text><rect x="20" y="50" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="75" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">40 50 60 70</text><text x="190" y="75" font-size="14" fill="#23261f" text-anchor="start">C, IC, M, F at 40 yd</text><rect x="20" y="96" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="121" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Steel = bigger</text><text x="190" y="121" font-size="14" fill="#23261f" text-anchor="start">steel #2 for ducks</text><rect x="20" y="142" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="167" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Pattern at 35</text><text x="190" y="167" font-size="14" fill="#23261f" text-anchor="start">your real distance</text><rect x="20" y="188" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="213" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Miss? More lead</text><text x="190" y="213" font-size="14" fill="#23261f" text-anchor="start">most misses are behind</text><rect x="20" y="234" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="259" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Butt, belly, beak</text><text x="190" y="259" font-size="14" fill="#23261f" text-anchor="start">swing through, fire, keep going</text>
</svg>
