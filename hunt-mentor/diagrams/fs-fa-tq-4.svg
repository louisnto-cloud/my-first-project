<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Tourniquet step 4: lock the rod in its clip so it cannot unwind, then strap it down.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4. Lock the rod</text><rect x="30" y="138" width="300" height="44" rx="22" fill="#d9b48f" stroke="#b08a66" stroke-width="2"/><circle cx="344" cy="160" r="24.0" fill="#d9b48f" stroke="#b08a66" stroke-width="2"/><ellipse cx="250" cy="160" rx="16" ry="7" fill="#c0392b"/><rect x="158" y="130" width="24" height="60" rx="4" fill="#e8590c" stroke="#2f3a2b" stroke-width="2"/><line x1="140" y1="124" x2="200" y2="124" stroke="#2f3a2b" stroke-width="7" stroke-linecap="round"/><rect x="118" y="112" width="18" height="26" rx="3" fill="#2f3a2b"/><rect x="204" y="112" width="18" height="26" rx="3" fill="#2f3a2b"/><text x="290" y="100" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Clip it</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Rod in the clip, strap over</text>
</svg>
