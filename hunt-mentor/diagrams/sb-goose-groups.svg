<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 404" font-family="sans-serif" role="img" aria-label="Four goose groups, each with its own limits, 99 percent. Canada and cackling geese, the black necked geese with a white chinstrap, a big and a small one: counted together, 10 a day. Snow and Ross&#x27;s geese, white with black wingtips and pink bills, a big and a small one: counted together, 5 a day, more in MUs 2-4 and 2-5. White fronted geese, the specklebelly, grey brown with a white face at the bill and black bars on the belly: 5 a day. Brant, a small dark goose with a black neck and a white necklace: coast only, MU 2-4, March 1 to 10, 3 a day. Each group has its own dates in each district.">
