<text x="64" y="715.6" font-size="24" font-weight="bold" fill="#2c5d86" text-anchor="middle">10 (30)</text>
<text x="130" y="702" font-size="16" fill="#2f3a2b">Canada and cackling geese,</text>
<text x="130" y="723" font-size="16" fill="#2f3a2b">snipe, coots</text>
<rect x="8" y="738" width="384" height="58" rx="6" fill="#f4eedf"/>
<text x="64" y="775.6" font-size="24" font-weight="bold" fill="#2c5d86" text-anchor="middle">5 (15)</text>
<text x="130" y="762" font-size="16" fill="#2f3a2b">Snow, Ross&#x27;s, white fronted</text>
