<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 356" font-family="sans-serif" role="img" aria-label="Five CZ cleaning rules: 1 bore cleaner is for the barrel and chamber only; 2 not on other parts, it can stay in the joints and cause corrosion; 3 other parts get a dry cloth, an old toothbrush, a copper brush or a wooden scraper; 4 before shooting, pull one dry patch through the bore; 5 in very cold weather remove the oil or use a lubricant made for low temperatures."><rect x="0" y="0" width="400" height="356" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Five cleaning rules</text><rect x="14" y="44" width="372" height="50" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><circle cx="36" cy="69" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="36" y="74" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><text x="58" y="65" font-size="15" font-weight="bold" text-anchor="start" fill="#1F3D2B">Bore cleaner</text><text x="58" y="85" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Barrel and chamber only</text><rect x="14" y="102" width="372" height="50" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="2"/><circle cx="36" cy="127" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="36" y="132" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text><text x="58" y="123" font-size="15" font-weight="bold" text-anchor="start" fill="#FF6A13">Not on other parts</text><text x="58" y="143" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">It can sit in joints and rust them</text><rect x="14" y="160" width="372" height="50" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><circle cx="36" cy="185" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="36" y="190" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text><text x="58" y="181" font-size="15" font-weight="bold" text-anchor="start" fill="#1F3D2B">Other parts</text><text x="58" y="201" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Cloth, old toothbrush, copper brush, wood scraper</text><rect x="14" y="218" width="372" height="50" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><circle cx="36" cy="243" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="36" y="248" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4</text><text x="58" y="239" font-size="15" font-weight="bold" text-anchor="start" fill="#1F3D2B">Before shooting</text><text x="58" y="259" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">One dry patch through the bore</text><rect x="14" y="276" width="372" height="50" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="2"/><circle cx="36" cy="301" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="36" y="306" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">5</text><text x="58" y="297" font-size="15" font-weight="bold" text-anchor="start" fill="#FF6A13">Very cold</text><text x="58" y="317" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Remove oil or use a low temperature lube</text><text x="16" y="344" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">CZ manual, pages 9 and 10 (95%).</text></svg>
