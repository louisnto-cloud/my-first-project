<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Why hunters meet more bears: we move quietly, we hunt dawn and dusk when bears move, we carry blood and gut piles that smell like food, calls and decoys sound like food, we walk thick cover with short sight lines, and bears claim kill sites. Do the opposite where you can.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Why hunters meet more bears</text><rect x="20" y="48" width="112" height="80" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="76" y="82" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Quiet</text><text x="76" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">we sneak</text><rect x="145" y="48" width="112" height="80" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="201" y="82" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Dawn, dusk</text><text x="201" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">bear hours</text><rect x="270" y="48" width="112" height="80" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="326" y="82" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Blood, guts</text><text x="326" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">smell food</text><rect x="20" y="144" width="112" height="80" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="76" y="178" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Calls, decoys</text><text x="76" y="200" font-size="14" fill="#2f3a2b" text-anchor="middle">sound like food</text><rect x="145" y="144" width="112" height="80" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="201" y="178" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Thick cover</text><text x="201" y="200" font-size="14" fill="#2f3a2b" text-anchor="middle">short sight</text><rect x="270" y="144" width="112" height="80" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="326" y="178" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Kill site</text><text x="326" y="200" font-size="14" fill="#2f3a2b" text-anchor="middle">bears claim it</text><rect x="59" y="254" width="282" height="30" rx="6" fill="#2f3a2b"/><text x="200" y="275" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Do the opposite where you can</text>
</svg>
