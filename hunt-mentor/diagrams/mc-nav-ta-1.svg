<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 1 of terrain association: look around and name three big features you can see: a long ridge, a saddle and a peak, with a creek below.">
<rect width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c"/><text x="26" y="31" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">1</text><text x="52" y="32" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Name 3 big features you see</text><rect x="20" y="50" width="360" height="200" rx="4" fill="#e7eef5"/><polygon points="30,200 100.0,100 170,200" fill="#8a9a6b"/><polygon points="150,200 210.0,140 270,200" fill="#a3b18a"/><polygon points="250,200 320.0,80 390,200" fill="#8a9a6b"/><rect x="20" y="200" width="360" height="50" rx="0" fill="#dfe6d3"/><path d="M20 230 C120 215 260 240 380 220" fill="none" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="90" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Big ridge</text><text x="210" y="130" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Saddle</text><text x="330" y="74" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Peak</text>
</svg>
