<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 2: open the Hunt Map. The blue dot shows you on the area you saved offline. The circle around it is the GPS accuracy.">
<rect width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c"/><text x="26" y="31" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">2</text><text x="52" y="32" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Open the Hunt Map: find the dot</text><g transform="translate(110 160) scale(1.6)"><rect x="-26" y="-48" width="52" height="96" rx="9" fill="#2f3a2b"/><rect x="-21" y="-40" width="42" height="76" rx="3" fill="#dfe6d3"/><circle cx="0" cy="42" r="3" fill="#fffaf0"/></g><text x="230" y="110" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Blue dot</text><text x="230" y="140" font-size="15" fill="#23261f" text-anchor="start">on your saved</text><text x="230" y="170" font-size="15" fill="#23261f" text-anchor="start">offline area</text><text x="230" y="200" font-size="15" fill="#23261f" text-anchor="start">Circle = accuracy</text><circle cx="110" cy="150" r="6" fill="#4a7fb0"/><circle cx="110" cy="150" r="18" fill="none" stroke="#4a7fb0" stroke-width="2"/>
</svg>
