<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Six tiles. Canada goose, legal, 10 a day. Cackling goose, legal, in the same 10. Snow and Ross&#x27;s geese, legal, own limit. White fronted goose, legal, 5 a day. Brant, only MU 2-4 in March. Swans, never, protected. Canada and cackling share one bag; brant is not open at Mission or Kamloops, 99 percent.">
