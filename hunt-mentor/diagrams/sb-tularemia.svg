<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 356" font-family="sans-serif" role="img" aria-label="Four cards on cleaning hares safely because of tularemia, 85 to 95 percent. Wear gloves and a mask, every animal, every time, 85 percent. Never skin an animal found dead, 95 percent. A swollen, spotted liver or spleen goes in the bin, 60 percent. Cook the meat through until there is no pink at the bone, 85 percent.">
<rect width="400" height="356" fill="#fffaf0"/>
<text x="200" y="27" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Clean hares safely (85 to 95%)</text>
<rect x="8" y="40" width="188" height="150" rx="8" fill="#edf3e6" stroke="#2f6e3b" stroke-width="2"/>
<g transform="translate(102.0 86) scale(1)"><g transform="translate(0 0)"><path d="M-30 18 L-30 -4 C-30 -8 -24 -8 -24 -4 L-24 -16 C-24 -20 -18 -20 -18 -16 L-18 -20 C-18 -24 -12 -24 -12 -20 L-12 -16 C-12 -20 -6 -20 -6 -16 L-6 2 L-2 -4 C0 -8 5 -6 4 -2 L-4 12 L-6 18z" fill="#5b8fd6" stroke="#2c5d86" stroke-width="1.4"/><rect x="-31" y="16" width="26" height="8" rx="2" fill="#2c5d86"/><path d="M10 -6 C18 -10 34 -10 42 -6 L42 10 C34 18 18 18 10 10z" fill="#f4f1ea" stroke="#8a8a80" stroke-width="1.4"/><path d="M12 -1 H40 M12 5 H40" stroke="#c9c4b6" stroke-width="1.4"/><path d="M10 -4 L2 -10 M10 8 L2 14 M42 -4 L50 -10 M42 8 L50 14" stroke="#8a8a80" stroke-width="1.4"/></g></g>
<text x="102" y="136" font-size="16" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Gloves and mask</text>
<text x="102" y="156" font-size="15" fill="#2f3a2b" text-anchor="middle">Every animal,</text>
<text x="102" y="174" font-size="15" fill="#2f3a2b" text-anchor="middle">every time (85%)</text>
<rect x="204" y="40" width="188" height="150" rx="8" fill="#fbe9e6" stroke="#b42318" stroke-width="2"/>
<g transform="translate(298.0 86) scale(1.3)"><g transform="translate(0 0)"><ellipse cx="0" cy="8" rx="34" ry="5" fill="#a9b37f" opacity=".6"/><path d="M-26 4 C-28 -6 -10 -12 8 -10 C22 -8 28 -2 26 4 C20 8 -20 9 -26 4z" fill="#a08566"/><path d="M-24 0 C-34 -2 -38 2 -36 6 C-32 8 -26 7 -24 5z" fill="#a08566"/><path d="M-30 -1 C-40 -8 -50 -8 -54 -4 C-48 -2 -40 -1 -32 2z" fill="#a08566"/><path d="M-32 0 C-40 -5 -46 -5 -50 -4" stroke="#7a6248" stroke-width="1.2" fill="none"/><path d="M-33 3 l3 -2 M-33 1 l3 2" stroke="#2b2118" stroke-width="1.4"/><path d="M10 6 L22 12 M-6 7 L-14 13" stroke="#7a6248" stroke-width="3" stroke-linecap="round"/><circle cx="26" cy="-1" r="4" fill="#f4f1ea"/></g></g>
<circle cx="374" cy="58" r="11" fill="#c92a2a"/><path d="M369.2 53.2 l9.6 9.6 M378.8 53.2 l-9.6 9.6" stroke="#fffaf0" stroke-width="2.6" stroke-linecap="round"/>
<text x="298" y="136" font-size="16" font-weight="bold" fill="#b42318" text-anchor="middle">Found dead? Leave it</text>
<text x="298" y="156" font-size="15" fill="#2f3a2b" text-anchor="middle">Never skin an animal</text>
<text x="298" y="174" font-size="15" fill="#2f3a2b" text-anchor="middle">found dead (95%)</text>
<rect x="8" y="198" width="188" height="150" rx="8" fill="#fbe9e6" stroke="#b42318" stroke-width="2"/>
<g transform="translate(102.0 244) scale(1)"><g transform="translate(0 0)"><path d="M-38 -2 C-38 -14 -16 -18 0 -14 C14 -18 38 -14 38 -2 C36 10 18 14 0 10 C-18 14 -36 10 -38 -2z" fill="#7a1f2b"/><path d="M0 -14 C-2 -4 -2 4 0 10" stroke="#5a1520" stroke-width="2" fill="none"/><circle cx="-24" cy="-6" r="2.6" fill="#f4efe4"/><circle cx="-14" cy="2" r="2" fill="#f4efe4"/><circle cx="-6" cy="-8" r="2.2" fill="#f4efe4"/><circle cx="10" cy="-4" r="2.4" fill="#f4efe4"/><circle cx="22" cy="2" r="2" fill="#f4efe4"/><circle cx="26" cy="-8" r="1.8" fill="#f4efe4"/><circle cx="-28" cy="4" r="1.8" fill="#f4efe4"/><circle cx="4" cy="4" r="1.8" fill="#f4efe4"/></g></g>
<text x="102" y="294" font-size="16" font-weight="bold" fill="#b42318" text-anchor="middle">Spotted liver: bin it</text>
<text x="102" y="314" font-size="15" fill="#2f3a2b" text-anchor="middle">Swollen, spotted liver</text>
<text x="102" y="332" font-size="15" fill="#2f3a2b" text-anchor="middle">or spleen (60%)</text>
<rect x="204" y="198" width="188" height="150" rx="8" fill="#edf3e6" stroke="#2f6e3b" stroke-width="2"/>
<g transform="translate(288.0 244) scale(1)"><g transform="translate(0 0)"><path d="M-14 -24 c-4 -6 4 -10 0 -16 M0 -26 c-4 -6 4 -10 0 -16 M14 -24 c-4 -6 4 -10 0 -16" stroke="#c0392b" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M-34 -10 H34 L30 6 C28 10 24 12 20 12 H-20 C-24 12 -28 10 -30 6z" fill="#3a3d39"/><path d="M34 -6 L60 -10" stroke="#3a3d39" stroke-width="6" stroke-linecap="round"/><path d="M-22 -10 C-22 -18 -6 -20 0 -16 C8 -20 22 -18 22 -10z" fill="#8a5a3a"/><path d="M-10 -14 L12 -12" stroke="#f1e6d0" stroke-width="3" stroke-linecap="round"/></g></g>
<text x="298" y="294" font-size="16" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Cook it through</text>
<text x="298" y="314" font-size="15" fill="#2f3a2b" text-anchor="middle">No pink at</text>
<text x="298" y="332" font-size="15" fill="#2f3a2b" text-anchor="middle">the bone (85%)</text>
</svg>
