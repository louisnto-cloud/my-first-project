<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four cards on cleaning hares safely because of tularemia, 85 to 95 percent. Wear gloves and a mask, every animal, every time. Never skin an animal found dead. A swollen, spotted liver or spleen goes in the bin, 60 percent. Cook the meat through until there is no pink at the bone.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="24" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Clean hares safely (85 to 95%)</text>
  <rect x="6" y="36" width="190" height="124" rx="8" fill="#dfe6d3" stroke="#2f6e3b" stroke-width="2"/>
  <path d="M80 54 h40 v34 q-20 10 -40 0z" fill="#4a7fb0"/>
  <text x="101" y="120" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Gloves and mask</text>
  <text x="101" y="138" font-size="13" fill="#2f3a2b" text-anchor="middle">Every animal,</text>
  <text x="101" y="154" font-size="13" fill="#2f3a2b" text-anchor="middle">every time (85%)</text>
  <rect x="204" y="36" width="190" height="124" rx="8" fill="#dfe6d3" stroke="#c0392b" stroke-width="2"/>
  <g transform="translate(300 70) scale(0.8)"><ellipse rx="22" ry="13" fill="#9b8466"/><circle cx="18" cy="-8" r="9" fill="#9b8466"/><ellipse cx="14" cy="-26" rx="4" ry="12" fill="#9b8466" transform="rotate(-15 14 -26)"/><ellipse cx="20" cy="-26" rx="4" ry="12" fill="#9b8466" transform="rotate(10 20 -26)"/><circle cx="22" cy="-10" r="2" fill="#2f3a2b"/><ellipse cx="-14" cy="12" rx="12" ry="4" fill="#9b8466"/></g><path d="M316 50 l20 20 M336 50 l-20 20" stroke="#c0392b" stroke-width="5"/>
  <text x="299" y="120" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Found dead? Leave it</text>
  <text x="299" y="138" font-size="13" fill="#2f3a2b" text-anchor="middle">Never skin an animal</text>
  <text x="299" y="154" font-size="13" fill="#2f3a2b" text-anchor="middle">found dead (95%)</text>
  <rect x="6" y="166" width="190" height="124" rx="8" fill="#dfe6d3" stroke="#c0392b" stroke-width="2"/>
  <ellipse cx="100" cy="200" rx="30" ry="16" fill="#7a2f2f"/><g fill="#fff"><circle cx="90" cy="196" r="3"/><circle cx="104" cy="204" r="3"/><circle cx="112" cy="194" r="3"/></g>
  <text x="101" y="250" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Spotted liver: bin it</text>
  <text x="101" y="268" font-size="13" fill="#2f3a2b" text-anchor="middle">Swollen, spotted liver</text>
  <text x="101" y="284" font-size="13" fill="#2f3a2b" text-anchor="middle">or spleen (60%)</text>
  <rect x="204" y="166" width="190" height="124" rx="8" fill="#dfe6d3" stroke="#2f6e3b" stroke-width="2"/>
  <rect x="270" y="186" width="60" height="30" rx="6" fill="#2f3a2b"/><path d="M280 186 q4 -12 0 -20 M300 186 q4 -12 0 -20 M320 186 q4 -12 0 -20" stroke="#e8590c" stroke-width="3" fill="none"/>
  <text x="299" y="250" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Cook it through</text>
  <text x="299" y="268" font-size="13" fill="#2f3a2b" text-anchor="middle">No pink at</text>
  <text x="299" y="284" font-size="13" fill="#2f3a2b" text-anchor="middle">the bone (85%)</text>
</svg>
