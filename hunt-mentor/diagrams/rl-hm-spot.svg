<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Phone sketch of the Hunt Map. The elevation readout at the top left is ringed: it shows the height of the ground under the centre cross. An orange dot shows a long press on the map, which opens a menu with drop waypoint, range rings, measure and Insights.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Hunt Map: read one spot</text><rect x="24" y="40" width="150" height="250" rx="14" fill="#2f3a2b"/><rect x="30" y="48" width="138" height="234" rx="8" fill="#dfe6d3"/><path d="M30 190 C 64 150, 104 170, 168 140" stroke="#8b5a2b" stroke-width="1.4" fill="none"/><path d="M30 210 C 64 172, 104 192, 168 164" stroke="#8b5a2b" stroke-width="1.4" fill="none"/><circle cx="44" cy="62" r="8" fill="#fff" stroke="#2f3a2b" stroke-width="1.2"/><circle cx="64" cy="62" r="8" fill="#fff" stroke="#2f3a2b" stroke-width="1.2"/><circle cx="154" cy="62" r="8" fill="#fff" stroke="#2f3a2b" stroke-width="1.2"/><text x="109" y="66" font-size="10" font-weight="bold" fill="#2f3a2b" text-anchor="middle">HUNT MAP</text><rect x="36" y="76" width="84" height="12" rx="3" fill="#fff"/><text x="78" y="86" font-size="9" font-weight="bold" fill="#2f3a2b" text-anchor="middle">842 m elevation</text><rect x="36" y="100" width="16" height="14" rx="3" fill="#fff" stroke="#2f3a2b" stroke-width="1"/><rect x="36" y="118" width="16" height="14" rx="3" fill="#fff" stroke="#2f3a2b" stroke-width="1"/><rect x="36" y="136" width="16" height="14" rx="3" fill="#fff" stroke="#2f3a2b" stroke-width="1"/><rect x="36" y="154" width="16" height="14" rx="3" fill="#fff" stroke="#2f3a2b" stroke-width="1"/><rect x="36" y="172" width="16" height="14" rx="3" fill="#fff" stroke="#2f3a2b" stroke-width="1"/><rect x="94" y="218" width="62" height="18" rx="9" fill="#fff" stroke="#2f3a2b" stroke-width="1.2"/><text x="111" y="231" font-size="9" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Topo</text><text x="141" y="231" font-size="10" font-weight="bold" fill="#e8590c" text-anchor="middle">3D</text><rect x="36" y="218" width="46" height="18" rx="5" fill="#fff" stroke="#2f3a2b" stroke-width="1.2"/><text x="59" y="231" font-size="9" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Layers</text><rect x="30" y="244" width="138" height="30" fill="#fff"/><text x="44.0" y="264" font-size="7.5" fill="#2f3a2b" text-anchor="middle">Offline</text><text x="71.5" y="264" font-size="7.5" fill="#2f3a2b" text-anchor="middle">Content</text><text x="99.0" y="264" font-size="7.5" fill="#2f3a2b" text-anchor="middle">Tools</text><text x="126.5" y="264" font-size="7.5" fill="#2f3a2b" text-anchor="middle">Insights</text><text x="154.0" y="264" font-size="7.5" fill="#2f3a2b" text-anchor="middle">Track</text><circle cx="78" cy="82" r="46" fill="none" stroke="#e8590c" stroke-width="4"/><circle cx="114" cy="160" r="16" fill="none" stroke="#e8590c" stroke-width="4"/><circle cx="114" cy="160" r="6" fill="#e8590c"/><text x="196" y="70" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">Read a spot</text><text x="196" y="96" font-size="15" fill="#2f3a2b" text-anchor="start">The number top left is the</text><text x="196" y="118" font-size="15" fill="#2f3a2b" text-anchor="start">height under the cross.</text><text x="196" y="140" font-size="15" fill="#2f3a2b" text-anchor="start">Long press any spot for</text><text x="196" y="162" font-size="15" fill="#2f3a2b" text-anchor="start">waypoint, rings, Insights.</text>
</svg>
