<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 538" font-family="sans-serif" role="img" aria-label="Flowchart for meat home from Alaska. All bears are sealed by Alaska Fish and Game before they leave the state, within 30 days. Bear, wolf or lynx parts leaving the US need a CITES permit from the US Fish and Wildlife Service in Anchorage or Fairbanks. USFWS Form 3-177 may be required for meat, hides, skulls or trophies. Driving through Yukon: only meat detached from head and backbone, cleaned skull caps with antlers, cleaned teeth, mounts and tanned hides. At the Canadian border declare everything, with the licence and tags travelling with the meat, 80 percent, CFIA VERIFY. Into BC: only boned meat and a cleaned skull plate.">
<rect x="0" y="0" width="400" height="538" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Alaska: getting meat home</text>
<rect x="16" y="42" width="368" height="54" rx="8" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/>
<text x="28" y="66" font-size="15" fill="#2f3a2b">Any bear: sealed by Fish and Game before it</text>
<text x="28" y="85" font-size="15" fill="#2f3a2b">leaves, within 30 days (85%)</text>
<line x1="200.0" y1="96" x2="200.0" y2="118" stroke="#2f3a2b" stroke-width="3"/><polygon points="193.0,116 207.0,116 200.0,126" fill="#2f3a2b"/>
<rect x="16" y="126" width="368" height="54" rx="8" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/>
<text x="28" y="150" font-size="15" fill="#2f3a2b">Bear, wolf or lynx parts leaving the US:</text>
<text x="28" y="169" font-size="15" fill="#2f3a2b">CITES permit from USFWS (85%)</text>
<line x1="200.0" y1="180" x2="200.0" y2="202" stroke="#2f3a2b" stroke-width="3"/><polygon points="193.0,200 207.0,200 200.0,210" fill="#2f3a2b"/>
<rect x="16" y="210" width="368" height="54" rx="8" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/>
<text x="28" y="234" font-size="15" fill="#2f3a2b">Form 3-177 may be needed for meat, hides,</text>
<text x="28" y="253" font-size="15" fill="#2f3a2b">trophies (85%)</text>
<line x1="200.0" y1="264" x2="200.0" y2="286" stroke="#2f3a2b" stroke-width="3"/><polygon points="193.0,284 207.0,284 200.0,294" fill="#2f3a2b"/>
<rect x="16" y="294" width="368" height="54" rx="8" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/>
<text x="28" y="318" font-size="15" fill="#2f3a2b">Through Yukon: meat off head and backbone,</text>
<text x="28" y="337" font-size="15" fill="#2f3a2b">cleaned skull caps (85%)</text>
<line x1="200.0" y1="348" x2="200.0" y2="370" stroke="#2f3a2b" stroke-width="3"/><polygon points="193.0,368 207.0,368 200.0,378" fill="#2f3a2b"/>
<rect x="16" y="378" width="368" height="54" rx="18" fill="#f3ead6" stroke="#6b4f35" stroke-width="2.5"/>
<text x="28" y="402" font-size="15" font-weight="bold" fill="#2f3a2b">CBSA: declare. Licence and tags travel with</text>
<text x="28" y="421" font-size="15" font-weight="bold" fill="#2f3a2b">the meat (80%)</text>
<line x1="200.0" y1="432" x2="200.0" y2="454" stroke="#2f3a2b" stroke-width="3"/><polygon points="193.0,452 207.0,452 200.0,462" fill="#2f3a2b"/>
<rect x="16" y="462" width="368" height="54" rx="8" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2.5"/>
<text x="28" y="486" font-size="15" font-weight="bold" fill="#2f3a2b">BC: boned meat and a cleaned skull plate</text>
<text x="28" y="505" font-size="15" font-weight="bold" fill="#2f3a2b">only (99%)</text>
</svg>
