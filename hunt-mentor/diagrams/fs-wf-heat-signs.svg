<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Heat exhaustion versus heat stroke. Exhaustion: mind clear but tired, skin sweaty and pale, temperature raised; move to shade, cool down, sip fluids. Heat stroke: confused, skin hot and red and may be dry, temperature 40 degrees Celsius or more; call 911 and cool fast.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Heat exhaustion or heat stroke?</text><rect x="10" y="44" width="120" height="48" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="70" y="73" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle"></text><rect x="130" y="44" width="130" height="48" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="195" y="73" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Exhaustion</text><rect x="260" y="44" width="130" height="48" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="325" y="73" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Stroke</text><rect x="10" y="92" width="120" height="48" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="70" y="121" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Mind</text><rect x="130" y="92" width="130" height="48" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="195" y="121" font-size="14" fill="#2f3a2b" text-anchor="middle">Clear, tired</text><rect x="260" y="92" width="130" height="48" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="325" y="121" font-size="14" fill="#2f3a2b" text-anchor="middle">Confused</text><rect x="10" y="140" width="120" height="48" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="70" y="169" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Skin</text><rect x="130" y="140" width="130" height="48" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="195" y="169" font-size="14" fill="#2f3a2b" text-anchor="middle">Sweaty, pale</text><rect x="260" y="140" width="130" height="48" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="325" y="161" font-size="14" fill="#2f3a2b" text-anchor="middle">Hot, red,</text><text x="325" y="177" font-size="14" fill="#2f3a2b" text-anchor="middle">may be dry</text><rect x="10" y="188" width="120" height="48" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="70" y="217" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Temp</text><rect x="130" y="188" width="130" height="48" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="195" y="217" font-size="14" fill="#2f3a2b" text-anchor="middle">Raised</text><rect x="260" y="188" width="130" height="48" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="325" y="217" font-size="14" fill="#2f3a2b" text-anchor="middle">40 °C or more</text><rect x="10" y="236" width="120" height="48" rx="0" fill="#fbe9e7" stroke="#c9c2ad" stroke-width="1"/><text x="70" y="265" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Do</text><rect x="130" y="236" width="130" height="48" rx="0" fill="#fbe9e7" stroke="#c9c2ad" stroke-width="1"/><text x="195" y="257" font-size="14" fill="#2f3a2b" text-anchor="middle">Shade, cool,</text><text x="195" y="273" font-size="14" fill="#2f3a2b" text-anchor="middle">sip</text><rect x="260" y="236" width="130" height="48" rx="0" fill="#fbe9e7" stroke="#c9c2ad" stroke-width="1"/><text x="325" y="257" font-size="14" fill="#2f3a2b" text-anchor="middle">Call 911,</text><text x="325" y="273" font-size="14" fill="#2f3a2b" text-anchor="middle">cool fast</text>
</svg>
