<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 706" font-family="sans-serif" role="img" aria-label="A journal page, example only, not a real hunt. Date: an early November weekday. Place: MU 3-27, cutblock edge B2. Species: white tailed deer. Weather and wind: minus 4 C, 3 cm fresh snow, wind from the west all day. What you saw: 4:10 pm, 1 buck at the timber edge, walking, never stopped. Shots and result: 1 shot, ranged 210 m (230 yd), off hand, clean miss. Checked for hair and blood 30 minutes: none. One lesson: no rest, moving deer. Practise sitting and kneeling shots, and wait for a stop or pass.">
