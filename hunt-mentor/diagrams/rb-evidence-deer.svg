<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 448" role="img" aria-label="A deer seen from the side with the parts that must stay naturally attached circled. The unskinned tail. For a buck, a testicle or part of the penis. For a doe, a portion of the udder and teats, as page 15 prints it. In an antler restricted season, the antlers stay on part of the upper skull with the species licence. These stay on until the meat is home and butchered, at a meat cutter or cold storage plant, or inspected." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="448" fill="#fffaf0"/>
  <text x="200" y="26" font-size="20" fill="#23261f" text-anchor="middle" font-weight="bold">Deer: what stays attached</text>
  <rect x="0" y="302" width="400" height="6" fill="#c9b79c"/>
  <g transform="translate(0 40)">
    <path d="M110 158 L104 214 L96 262 L106 262 L114 216 L130 166 Z" fill="#7a4f27"/>
    <path d="M266 164 L268 216 L270 262 L280 262 L278 214 L284 160 Z" fill="#7a4f27"/>
    <path d="M86 146 C82 116 108 104 148 104 L232 102 C254 100 266 94 276 82 L290 58 C296 50 304 46 312 46 L338 48 C346 50 348 58 342 62 L318 68 C312 70 306 76 304 84 L298 112 C298 140 290 160 270 170 L130 172 C108 172 90 166 86 146 Z" fill="#8b5a2b"/>
    <path d="M132 166 L128 216 L124 262 L134 262 L140 216 L150 170 Z" fill="#8b5a2b"/>
    <path d="M246 168 L246 216 L244 262 L254 262 L258 216 L262 168 Z" fill="#8b5a2b"/>
    <path d="M316 50 L306 26 L326 44 Z M328 46 L342 24 L336 48 Z" fill="#8b5a2b"/>
    <circle cx="330" cy="52" r="2.6" fill="#23261f"/>
    <circle cx="344" cy="58" r="3" fill="#23261f"/>
  </g>
  <g data-tip="3. Antler restricted season|Keep the antlers naturally attached to part of the upper skull, with the species licence. Take the skull plate with antlers on, licence beside it.">
    <path d="M320 84 C312 70 300 60 290 48 M304 66 L306 48 M324 84 C334 70 348 60 358 50 M340 66 L338 48" stroke="#5c3b1c" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <circle cx="324" cy="68" r="34" fill="none" stroke="#4a7fb0" stroke-width="3"/>
    <circle cx="124" cy="64" r="14" fill="#4a7fb0"/><text x="124" y="70" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="146" y="62" font-size="16" font-weight="bold" fill="#4a7fb0">Antler season:</text>
    <text x="146" y="82" font-size="15" fill="#4a7fb0">antlers on skull</text>
    <line x1="266" y1="72" x2="290" y2="72" stroke="#4a7fb0" stroke-width="2"/>
  </g>
  <g data-tip="1. Unskinned tail|The unskinned tail stays naturally attached. No hide patch option for deer: the 6 cm² patch is for caribou, elk and moose only.">
    <path d="M90 154 C78 156 74 172 78 188 C84 182 88 172 92 162 Z" fill="#f3e9d8" stroke="#2f3a2b" stroke-width="1.5"/>
    <path d="M78 188 C78 182 80 178 82 176 L84 182 Z" fill="#23261f"/>
    <circle cx="84" cy="170" r="24" fill="none" stroke="#e8590c" stroke-width="3"/>
    <circle cx="28" cy="104" r="14" fill="#e8590c"/><text x="28" y="110" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="48" y="102" font-size="16" font-weight="bold" fill="#e8590c">Unskinned</text>
    <text x="48" y="121" font-size="16" font-weight="bold" fill="#e8590c">tail</text>
    <line x1="64" y1="128" x2="74" y2="148" stroke="#e8590c" stroke-width="2"/>
  </g>
  <g data-tip="2. Evidence of sex|Buck: a testicle or part of the penis. Doe: a portion of the udder and teats. Leave it on the hind quarter you keep with you.">
    <circle cx="146" cy="214" r="17" fill="none" stroke="#e8590c" stroke-width="3"/>
    <line x1="146" y1="231" x2="146" y2="320" stroke="#e8590c" stroke-width="2"/>
    <circle cx="28" cy="336" r="14" fill="#e8590c"/><text x="28" y="342" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="50" y="334" font-size="16" fill="#23261f" font-weight="bold">Buck: a testicle or part of the penis</text>
    <text x="50" y="356" font-size="16" fill="#23261f" font-weight="bold">Doe: part of the udder and teats</text>
  </g>
  <g data-tip="How long|Tail AND sex organ stay naturally attached until the meat is home and butchered there, at a meat cutter or cold storage plant, or inspected. The antlered head does not replace them.">
    <rect x="8" y="374" width="384" height="64" rx="8" fill="#eef3e6" stroke="#5c7a3a" stroke-width="2"/>
    <text x="200" y="400" font-size="16" fill="#23261f" text-anchor="middle" font-weight="bold">1 and 2 both stay on until home</text>
    <text x="200" y="422" font-size="15" fill="#23261f" text-anchor="middle">and butchered, cut, or inspected</text>
  </g>
</svg>
