ont-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="40" y="292" font-size="14" fill="#17201A" text-anchor="start">Over 2 spacers: longer screws</text><circle cx="24" cy="309" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="314" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="40" y="314" font-size="14" fill="#17201A" text-anchor="start">Recoil pad. Do not overtighten</text><rect x="12" y="340" width="376" height="34" rx="6" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="200" y="362" font-size="14" fill="#17201A" text-anchor="middle">Soapy water on the pad screw holes.</text>
