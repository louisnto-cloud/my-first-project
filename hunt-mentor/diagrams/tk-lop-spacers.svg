<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 386" font-family="sans-serif" role="img" aria-label="Length of pull spacers: 1 spacers stack between the stock and the recoil pad; 2, in orange, more than two spacers need longer screws; 3 the recoil pad, do not overtighten its screws. A little soapy water around the pad screw holes stops the pad tearing.">
<rect x="0" y="0" width="400" height="386" fill="#EEF1EA"/>
