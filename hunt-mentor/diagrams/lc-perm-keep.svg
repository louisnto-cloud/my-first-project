<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 346" font-family="sans-serif" role="img" aria-label="Keeping access. Do: call before every visit. Do: leave gates as found and stay off wet fields. Do: stop at the house on the way out. Do: send a thank you card in December. Do not: bring someone new without asking. Do: if there is a problem, fix it, then tell them.">
