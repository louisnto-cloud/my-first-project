<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 376" font-family="sans-serif" role="img" aria-label="A range day of about three hours: 1, in orange, arrive, learn the range rules and the firing line, load check; 2 at 15 minutes get on paper at 25 m; 3 zero at 100 m with 3 shot groups; 4 load test, 3 groups of each load; 5 field positions, sitting, kneeling, sticks; 6 the plate test; 7, in orange, unload, prove it, clean and log. Let the barrel cool between groups.">
<rect x="0" y="0" width="400" height="376" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">The range day, about 3 hours</text><line x1="74" y1="50" x2="74" y2="314" stroke="#1F3D2B" stroke-width="3"/><circle cx="74" cy="50" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="74" y="55" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="14" y="55" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">0:00</text><text x="94" y="55" font-size="14" fill="#17201A" text-anchor="start">Arrive. Rules, firing line, load check</text><circle cx="74" cy="94" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="74" y="99" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="14" y="99" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">0:15</text><text x="94" y="99" font-size="14" fill="#17201A" text-anchor="start">Irons or scope: 25 m to get on paper</text><circle cx="74" cy="138" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="74" y="143" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="14" y="143" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">0:30</text><text x="94" y="143" font-size="14" fill="#17201A" text-anchor="start">Zero at 100 m: 3 shot groups</text><circle cx="74" cy="182" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="74" y="187" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="14" y="187" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">1:15</text><text x="94" y="187" font-size="14" fill="#17201A" text-anchor="start">Load test: 3 groups each load</text><circle cx="74" cy="226" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="74" y="231" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="14" y="231" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">1:45</text><text x="94" y="231" font-size="14" fill="#17201A" text-anchor="start">Field positions: sit, kneel, sticks</text><circle cx="74" cy="270" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="74" y="275" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text><text x="14" y="275" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">2:15</text><text x="94" y="275" font-size="14" fill="#17201A" text-anchor="start">Plate test from each position</text><circle cx="74" cy="314" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="74" y="319" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">7</text><text x="14" y="319" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">2:45</text><text x="94" y="319" font-size="14" fill="#17201A" text-anchor="start">Unload, prove it, clean, log</text><rect x="12" y="330" width="376" height="34" rx="6" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="200" y="352" font-size="14" fill="#17201A" text-anchor="middle">Cool barrel between groups (Tip).</text>
</svg>
