<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of the share of the slope distance that counts for drop: 5 degrees 99.6 percent, 10 degrees 98.5, 20 degrees 94, 30 degrees 86.6, 45 degrees 70.7. Under 10 degrees, ignore it. At 30 degrees it is real.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Flat distance = slope distance x cosine</text><text x="74" y="72.2" font-size="14" fill="#23261f" text-anchor="end">5°</text><rect x="80" y="54" width="219.12" height="26" rx="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="305.12" y="72.2" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">99.6%</text><text x="74" y="110.2" font-size="14" fill="#23261f" text-anchor="end">10°</text><rect x="80" y="92" width="216.7" height="26" rx="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="302.7" y="110.2" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">98.5%</text><text x="74" y="148.2" font-size="14" fill="#23261f" text-anchor="end">20°</text><rect x="80" y="130" width="206.8" height="26" rx="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="292.8" y="148.2" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">94%</text><text x="74" y="186.2" font-size="14" fill="#23261f" text-anchor="end">30°</text><rect x="80" y="168" width="190.52" height="26" rx="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="276.52" y="186.2" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">86.6%</text><text x="74" y="224.2" font-size="14" fill="#23261f" text-anchor="end">45°</text><rect x="80" y="206" width="155.54" height="26" rx="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="241.54" y="224.2" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">70.7%</text><text x="200" y="260" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Under 10°: ignore it. 30°: real.</text>
</svg>
