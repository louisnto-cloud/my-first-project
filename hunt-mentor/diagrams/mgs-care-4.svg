<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Field care step 4: before you give a goose to someone, label it with your name, address, the date, your permit number and signature, or preserve it first, 99 percent. Birds not yet preserved count toward your possession limit, 99 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Care 4: label or freeze before you hand it over</text><rect x="0" y="36" width="400" height="264" rx="0" fill="#e9efe1"/><rect x="40" y="150" width="320" height="110" rx="8" fill="#bcaaa4" stroke="#6b4f35" stroke-width="2"/><rect x="130" y="170" width="140" height="70" rx="6" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="192" font-size="14" fill="#23261f" text-anchor="middle">Name, address,</text><text x="200" y="210" font-size="14" fill="#23261f" text-anchor="middle">date, permit no.,</text><text x="200" y="228" font-size="14" fill="#23261f" text-anchor="middle">signature</text><text x="200" y="90" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Gift a goose: label it or preserve it (99%)</text><text x="200" y="112" font-size="14" fill="#23261f" text-anchor="middle">Unfrozen birds count toward possession (99%)</text>
</svg>
