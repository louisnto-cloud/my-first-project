<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 272" font-family="sans-serif" role="img" aria-label="Match your pace to the trail. Trotting straight: it is going somewhere, move faster. Walking and wandering: feeding, slow right down and glass. Meandering, browse nips, beds: bed near, creep and look. Stot or gallop: spooked, let it settle.">
<rect x="0" y="0" width="400" height="272" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Match its pace</text>
<text x="20" y="60" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Trail shows</text><text x="200" y="60" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">You</text><rect x="8" y="70" width="384" height="44" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="85" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Trotting,</text><text x="20" y="101" font-size="14" fill="#23261f" text-anchor="start">straight</text><text x="200" y="85" font-size="14" fill="#23261f" text-anchor="start">move faster,</text><text x="200" y="101" font-size="14" fill="#23261f" text-anchor="start">it is travelling</text><rect x="8" y="118" width="384" height="44" rx="6" fill="#f3f1e6" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="133" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Walking,</text><text x="20" y="149" font-size="14" fill="#23261f" text-anchor="start">wandering</text><text x="200" y="133" font-size="14" fill="#23261f" text-anchor="start">slow down,</text><text x="200" y="149" font-size="14" fill="#23261f" text-anchor="start">glass ahead</text><rect x="8" y="166" width="384" height="44" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="181" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Browse nips,</text><text x="20" y="197" font-size="14" fill="#23261f" text-anchor="start">beds, loops</text><text x="200" y="181" font-size="14" fill="#23261f" text-anchor="start">creep: it is</text><text x="200" y="197" font-size="14" fill="#23261f" text-anchor="start">close (Tip)</text><rect x="8" y="214" width="384" height="44" rx="6" fill="#f3f1e6" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="229" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Stot or</text><text x="20" y="245" font-size="14" fill="#23261f" text-anchor="start">gallop</text><text x="200" y="229" font-size="14" fill="#23261f" text-anchor="start">spooked: let it</text><text x="200" y="245" font-size="14" fill="#23261f" text-anchor="start">settle first</text>
</svg>
