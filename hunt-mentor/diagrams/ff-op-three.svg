<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three optics and their jobs. Binoculars find animals and do most of the looking. A spotting scope on a tripod judges sex, size and whether an animal is legal. The rifle scope is for aiming only, never for glassing.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Three optics, three jobs</text><rect x="10" y="44" width="122" height="200" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="71.0" y="66" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Binoculars</text><text x="71.0" y="88" font-size="14" fill="#23261f" text-anchor="middle"></text><text x="71.0" y="106" font-size="14" fill="#23261f" text-anchor="middle"></text><text x="71.0" y="124" font-size="14" fill="#23261f" text-anchor="middle"></text><text x="71.0" y="142" font-size="14" fill="#23261f" text-anchor="middle">find animals</text><text x="71.0" y="160" font-size="14" fill="#23261f" text-anchor="middle">most hours</text><g transform="translate(71 84) scale(0.65)"><rect x="-34" y="-20" width="28" height="60" rx="8" fill="#2f3a2b" stroke="none" stroke-width="2"/><rect x="6" y="-20" width="28" height="60" rx="8" fill="#2f3a2b" stroke="none" stroke-width="2"/><rect x="-6" y="-6" width="12" height="20" rx="0" fill="#6b6f68" stroke="none" stroke-width="2"/><circle cx="-20" cy="44" r="12" fill="#7aa3c8" stroke="#2f3a2b" stroke-width="2"/><circle cx="20" cy="44" r="12" fill="#7aa3c8" stroke="#2f3a2b" stroke-width="2"/></g><rect x="139" y="44" width="122" height="200" rx="8" fill="#e3edf5" stroke="none" stroke-width="2"/><text x="200.0" y="66" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Spotting scope</text><text x="200.0" y="88" font-size="14" fill="#23261f" text-anchor="middle"></text><text x="200.0" y="106" font-size="14" fill="#23261f" text-anchor="middle"></text><text x="200.0" y="124" font-size="14" fill="#23261f" text-anchor="middle"></text><text x="200.0" y="142" font-size="14" fill="#23261f" text-anchor="middle">judge sex,</text><text x="200.0" y="160" font-size="14" fill="#23261f" text-anchor="middle">size, legal</text><g transform="translate(172 76) scale(0.42)"><rect x="0" y="0" width="120" height="34" rx="10" fill="#2f3a2b" stroke="none" stroke-width="2"/><path d="M120 2 L150 -4 L150 38 L120 32 Z" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 8 L-26 -12 L-18 -20 L6 2 Z" fill="#6b6f68" stroke="#2f3a2b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><line x1="60" y1="34" x2="40" y2="110" stroke="#23261f" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="34" x2="80" y2="110" stroke="#23261f" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="34" x2="60" y2="112" stroke="#23261f" stroke-width="3" stroke-linecap="round"/></g><rect x="268" y="44" width="122" height="200" rx="8" fill="#f8e3cf" stroke="none" stroke-width="2"/><text x="329.0" y="66" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Rifle scope</text><text x="329.0" y="88" font-size="14" fill="#23261f" text-anchor="middle"></text><text x="329.0" y="106" font-size="14" fill="#23261f" text-anchor="middle"></text><text x="329.0" y="124" font-size="14" fill="#23261f" text-anchor="middle"></text><text x="329.0" y="142" font-size="14" fill="#23261f" text-anchor="middle">aim only</text><text x="329.0" y="160" font-size="14" fill="#23261f" text-anchor="middle">never glass</text><rect x="290" y="110" width="78" height="16" rx="6" fill="#4b4f48" stroke="#2f3a2b" stroke-width="1.5"/><text x="200.0" y="276" font-size="14" fill="#2f3a2b" text-anchor="middle">Binoculars do 90% of the looking (Tip)</text>
</svg>
