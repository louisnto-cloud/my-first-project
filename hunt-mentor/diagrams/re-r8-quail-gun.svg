<path d="M204.0 115 V78 Q204.0 69 213.0 69 H385.0 Q394.0 69 394.0 78 V115 Z" fill="#4a7fb0"/>
<text x="212.0" y="89" font-size="14" font-weight="bold" fill="#ffffff">Lead shot</text>
<text x="212.0" y="135" font-size="14" fill="#23261f">OK for upland birds.</text>
<text x="212.0" y="153" font-size="14" fill="#23261f">Ducks need non toxic</text>
<text x="212.0" y="171" font-size="14" fill="#23261f">shot</text>
<rect x="6.0" y="189" width="190.0" height="94" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<path d="M6.0 217 V198 Q6.0 189 15.0 189 H187.0 Q196.0 189 196.0 198 V217 Z" fill="#e8590c"/>
