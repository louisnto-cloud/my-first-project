<text x="14.0" y="237" font-size="14" fill="#23261f">Pump or semi auto: no</text>
<text x="14.0" y="255" font-size="14" fill="#23261f">more than 2 shells in</text>
<text x="14.0" y="273" font-size="14" fill="#23261f">the magazine</text>
<rect x="204.0" y="189" width="190.0" height="94" rx="9" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
<path d="M204.0 217 V198 Q204.0 189 213.0 189 H385.0 Q394.0 189 394.0 198 V217 Z" fill="#2f3a2b"/>
<text x="212.0" y="209" font-size="14" font-weight="bold" fill="#ffffff">Hours</text>
<text x="212.0" y="237" font-size="14" fill="#23261f">1 hour before sunrise</text>
<text x="212.0" y="255" font-size="14" fill="#23261f">to 1 hour after sunset</text>
<rect x="6.0" y="291" width="190.0" height="94" rx="9" fill="#ffffff" stroke="#8a9a6b" stroke-width="2.5"/>
