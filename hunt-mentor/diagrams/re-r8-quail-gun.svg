<text x="88" y="167" font-size="15" fill="#2f3a2b">OK for upland birds. Ducks need</text>
<text x="88" y="186" font-size="15" fill="#2f3a2b">non toxic shot</text>
<rect x="342.2" y="146" width="37.8" height="26" rx="13.0" fill="#2f6e3b"/><text x="361.1" y="164.4" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">OK</text>
