<text x="14.0" y="339" font-size="14" fill="#23261f">One feathered wing on</text>
<text x="14.0" y="357" font-size="14" fill="#23261f">each bird until home</text>
<rect x="204.0" y="291" width="190.0" height="94" rx="9" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M204.0 319 V300 Q204.0 291 213.0 291 H385.0 Q394.0 291 394.0 300 V319 Z" fill="#c92a2a"/>
<text x="212.0" y="311" font-size="14" font-weight="bold" fill="#ffffff">100 m</text>
<text x="212.0" y="339" font-size="14" fill="#23261f">From homes, occupied</text>
