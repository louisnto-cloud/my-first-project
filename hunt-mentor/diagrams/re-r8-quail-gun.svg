<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 395" role="img" aria-label="Cards: Quail trip: gun and field rules. Shotgun, air gun or bow: Quail, chukar, partridge, pheasant (95%, my reading). Lead shot: OK for upland birds. Ducks need non toxic shot. Plug: Pump or semi auto: no more than 2 shells in the magazine. Hours: 1 hour before sunrise to 1 hour after sunset. Evidence: One feathered wing on each bird until home. 100 m: From homes, occupied farm buildings, schools, playgrounds." font-family="sans-serif">
<rect x="0" y="0" width="400" height="395" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Quail trip: gun and field rules</text>
<text x="200" y="47" font-size="14" fill="#8b5a2b" text-anchor="middle">Pages 10 to 15</text>
<rect x="6.0" y="69" width="190.0" height="112" rx="9" fill="#ffffff" stroke="#8b5a2b" stroke-width="2.5"/>
<path d="M6.0 115 V78 Q6.0 69 15.0 69 H187.0 Q196.0 69 196.0 78 V115 Z" fill="#8b5a2b"/>
<text x="14.0" y="89" font-size="14" font-weight="bold" fill="#ffffff">Shotgun, air gun or</text>
<text x="14.0" y="107" font-size="14" font-weight="bold" fill="#ffffff">bow</text>
<text x="14.0" y="135" font-size="14" fill="#23261f">Quail, chukar,</text>
<text x="14.0" y="153" font-size="14" fill="#23261f">partridge, pheasant</text>
<text x="14.0" y="171" font-size="14" fill="#23261f">(95%, my reading)</text>
