<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 556" font-family="sans-serif" role="img" aria-label="Quail trip gun and field rules, synopsis pages 10 to 15, as icon cards. Shotgun, air gun or bow for quail, chukar, partridge and pheasant (95%, my reading). Lead shot is OK for upland birds; ducks need non toxic shot. Plug: a pump or semi auto holds no more than 2 shells in the magazine. Hours: 1 hour before sunrise to 1 hour after sunset. Evidence: one feathered wing on each bird until home. 100 metres from homes, occupied farm buildings, schools and playgrounds.">
<rect width="400" height="556" fill="#fffaf0"/>
<text x="12" y="22" font-size="14" font-weight="bold" fill="#6b5b4b">Pages 10 to 15</text>
