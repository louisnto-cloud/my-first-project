<g transform="translate(48.0 82.3) scale(0.6)"><path d="M-6 -18 C12 -10 12 10 -6 18" fill="none" stroke="#8b5a2b" stroke-width="3.5" stroke-linecap="round"/><line x1="-6" y1="-18" x2="-6" y2="18" stroke="#3a3f3a" stroke-width="1"/><line x1="-16" y1="0" x2="20" y2="0" stroke="#3a3f3a" stroke-width="2"/><path d="M20 -4 L26 0 L20 4z" fill="#3a3f3a"/></g>
<text x="88" y="58" font-size="16" font-weight="bold" fill="#2f3a2b">Shotgun, air gun or bow</text>
<text x="88" y="80" font-size="15" fill="#2f3a2b">Quail, chukar, partridge, pheasant (95%,</text>
<text x="88" y="99" font-size="15" fill="#2f3a2b">my reading)</text>
<rect x="10" y="119" width="380" height="79" rx="8" fill="#eef2e6" stroke="#2f6e3b" stroke-width="1.3"/>
