<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bird care step 3. A plucked duck with one wing left on, next to two breast fillets. Caption: pluck or breast it, keep one wing on until home."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Care 3: pluck or breast</text><ellipse cx="130" cy="150" rx="70" ry="40" fill="#e9c9a8"/><path d="M180 130 L250 80 L250 120 L190 150Z" fill="#8b5a2b"/><rect x="236" y="82" width="14" height="36" rx="2" fill="#3f51a0"/><text x="250" y="70" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Wing on</text><ellipse cx="300" cy="190" rx="34" ry="16" fill="#9a3a2a"/><ellipse cx="300" cy="226" rx="34" ry="16" fill="#9a3a2a"/><text x="300" y="160" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Breasts</text><rect x="10" y="256" width="380" height="38" rx="8" fill="#2f3a2b"/><text x="200" y="281" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Keep one wing on until home (99%)</text></svg>
