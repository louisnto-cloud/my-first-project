<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 748" role="img" aria-label="Cards for Maps F13 to F24. F13 Skeena and Babine Mountain: goat draw only areas, goat closed in 6-30, no goat season on Skip Mountain. F14: black bear No Hunting Areas in parts of 5-9, 6-3 and 6-11. F15 City of Terrace, F17 Sandspit and F18 Queen Charlotte City: No Shooting Areas. F16 Lakelse Lake: No Shooting Area and shot only area. F19 Masset: No Shooting Area, and Delkatla Slough Wildlife Sanctuary no shooting, hunting or trapping. F20 Port Clements: No Shooting Area, and Kumdis Bay shot only. F21 Naikoon Park: no shooting or hunting, except shot only in the 50 metre Tlell River strips, closed along the highway. F22 Bear Pass: goat open 1 August to 28 February. F23 North Kitsumkalum Lake: No Shooting or Hunting Area. F24 Nass: mountain goat closed area." font-family="sans-serif">
