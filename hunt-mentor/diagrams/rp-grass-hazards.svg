<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="sans-serif" role="img" aria-label="Six grassland hazards in fall. Rattlesnakes: nearly all are back in their dens by mid October. Badger holes: twist ankles and catch ATV wheels. Grass fire: hot exhaust and sparks can start one. Cattle and bulls: give them room. No cover: deer see you from far away. Long shots: you need a safe backstop.">
<rect width="400" height="290" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Grassland hazards in fall</text><rect x="12" y="44" width="120" height="110" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="72" y="74" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Rattlesnakes</text><text x="72" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">dens by mid Oct</text><text x="72" y="128" font-size="14" fill="#6b4f35" text-anchor="middle">(85%)</text><rect x="140" y="44" width="120" height="110" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="74" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Badger holes</text><text x="200" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">ankles, wheels</text><text x="200" y="128" font-size="14" fill="#6b4f35" text-anchor="middle">(Tip)</text><rect x="268" y="44" width="120" height="110" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="328" y="74" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Grass fire</text><text x="328" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">exhaust, sparks</text><text x="328" y="128" font-size="14" fill="#6b4f35" text-anchor="middle">(Tip)</text><rect x="12" y="164" width="120" height="110" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="72" y="194" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Cattle, bulls</text><text x="72" y="224" font-size="14" fill="#2f3a2b" text-anchor="middle">give them room</text><text x="72" y="248" font-size="14" fill="#6b4f35" text-anchor="middle">(Tip)</text><rect x="140" y="164" width="120" height="110" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="194" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">No cover</text><text x="200" y="224" font-size="14" fill="#2f3a2b" text-anchor="middle">they see you far</text><text x="200" y="248" font-size="14" fill="#6b4f35" text-anchor="middle">(Tip)</text><rect x="268" y="164" width="120" height="110" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="328" y="194" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Long shots</text><text x="328" y="224" font-size="14" fill="#2f3a2b" text-anchor="middle">need a backstop</text><text x="328" y="248" font-size="14" fill="#6b4f35" text-anchor="middle">(Tip)</text>
</svg>
