<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Cold kit for a long sit: toque, buff, mitts, puffy jacket, dry socks, foam sit pad, heat packs, thermos. Mitts beat gloves for warmth.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cold kit for a sit</text><rect x="17" y="54" width="76" height="50" rx="8" fill="#4a7fb0" stroke="#2f3a2b" stroke-width="1"/><text x="55" y="126" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Toque</text><rect x="114" y="54" width="76" height="50" rx="8" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="1"/><text x="152" y="126" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Buff</text><rect x="211" y="54" width="76" height="50" rx="8" fill="#e8590c" stroke="#2f3a2b" stroke-width="1"/><text x="249" y="126" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Mitts</text><rect x="308" y="54" width="76" height="50" rx="8" fill="#7c5a99" stroke="#2f3a2b" stroke-width="1"/><text x="346" y="126" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Puffy</text><rect x="17" y="154" width="76" height="50" rx="8" fill="#ffffff" stroke="#2f3a2b" stroke-width="1"/><text x="55" y="226" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Dry socks</text><rect x="114" y="154" width="76" height="50" rx="8" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="1"/><text x="152" y="226" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Foam pad</text><rect x="211" y="154" width="76" height="50" rx="8" fill="#e8590c" stroke="#2f3a2b" stroke-width="1"/><text x="249" y="226" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Heat packs</text><rect x="308" y="154" width="76" height="50" rx="8" fill="#9a9a8f" stroke="#2f3a2b" stroke-width="1"/><text x="346" y="226" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Thermos</text><rect x="63" y="254" width="274" height="30" rx="6" fill="#2f3a2b"/><text x="200" y="275" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Mitts beat gloves for warmth</text>
</svg>
