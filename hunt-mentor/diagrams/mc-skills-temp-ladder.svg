<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A thermometer ladder for game meat: cook wild game to 71 degrees Celsius; the danger zone runs from 4 to 60 degrees, where bacteria can double every 20 minutes; keep meat below 4 degrees; age at 1 to 3 degrees; freezer at minus 18 degrees.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Meat temperature ladder</text><line x1="75" y1="48" x2="75" y2="274" stroke="#23261f" stroke-width="2"/><rect x="66" y="92" width="18" height="104" rx="4" fill="#e8590c"/><line x1="66" y1="60" x2="84" y2="60" stroke="#23261f" stroke-width="2"/><circle cx="75" cy="60" r="7" fill="#b3261e"/><text x="100" y="65" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Cook game to 71°C (95%)</text><line x1="66" y1="92" x2="84" y2="92" stroke="#23261f" stroke-width="2"/><circle cx="75" cy="92" r="7" fill="#e8590c"/><text x="100" y="97" font-size="15" fill="#23261f" text-anchor="start">Danger zone top: 60°C</text><line x1="66" y1="196" x2="84" y2="196" stroke="#23261f" stroke-width="2"/><circle cx="75" cy="196" r="7" fill="#4a7fb0"/><text x="100" y="201" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Keep below 4°C (80%)</text><line x1="66" y1="228" x2="84" y2="228" stroke="#23261f" stroke-width="2"/><circle cx="75" cy="228" r="7" fill="#8a9a6b"/><text x="100" y="233" font-size="15" fill="#23261f" text-anchor="start">Age at 1 to 3°C (80%)</text><line x1="66" y1="262" x2="84" y2="262" stroke="#23261f" stroke-width="2"/><circle cx="75" cy="262" r="7" fill="#7aa2c8"/><text x="100" y="267" font-size="15" fill="#23261f" text-anchor="start">Freezer: minus 18°C (80%)</text><text x="100" y="150" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">Danger zone 4 to 60°C:</text><text x="100" y="168" font-size="14" fill="#e8590c" text-anchor="start">bacteria can double every 20 min</text>
</svg>
