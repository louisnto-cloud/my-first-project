<text x="22" y="240" font-size="16" font-weight="bold" fill="#23261f">Leq&#x27;á:mel</text><text x="22" y="261" font-size="16" fill="#c2410c">la-cam-el</text>
<rect x="204" y="218" width="186" height="52" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="1.5"/>
<text x="216" y="240" font-size="16" font-weight="bold" fill="#23261f">Kwantlen</text><text x="216" y="261" font-size="16" fill="#c2410c">kwant-len</text>
<rect x="10" y="276" width="186" height="52" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="1.5"/>
<text x="22" y="298" font-size="16" font-weight="bold" fill="#23261f">Katzie</text><text x="22" y="319" font-size="16" fill="#c2410c">kat-zee</text>
<rect x="204" y="276" width="186" height="52" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="1.5"/>
<text x="216" y="298" font-size="16" font-weight="bold" fill="#23261f">Osoyoos</text><text x="216" y="319" font-size="16" fill="#c2410c">oh-soy-use</text>
<rect x="10" y="334" width="186" height="52" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="1.5"/>
<text x="22" y="356" font-size="16" font-weight="bold" fill="#23261f">Similkameen</text><text x="22" y="377" font-size="16" fill="#c2410c">si-mil-kuh-meen</text>
<rect x="204" y="334" width="186" height="52" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="1.5"/>
