<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 402" font-family="sans-serif" role="img" aria-label="Pronunciation cards from the BC 2018 guide: Secwepemc, sec wep emc. Shuswap, shoo shwahp. Simpcw, sim ka. Neskonlith, ness con lith. Nlaka&#x27;pamux, ent la cap um. Sto:lo, staw low. Leq&#x27;á:mel, la cam el. Kwantlen, kwant len. Katzie, kat zee. Osoyoos, oh soy use. Similkameen, si mil kuh meen. Splatsin, spla cheen. The community has the final word.">
