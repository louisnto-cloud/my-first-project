<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="sans-serif" role="img" aria-label="Pronunciation cards from the BC 2018 guide: Secwepemc, sec wep emc. Shuswap, shoo shwahp. Simpcw, sim ka. Neskonlith, ness con lith. Nlaka&#x27;pamux, ent la cap um. Sto:lo, staw low. Leq&#x27;á:mel, la cam el. Kwantlen, kwant len. Katzie, kat zee. Osoyoos, oh soy use. Similkameen, si mil kuh meen. Splatsin, spla cheen. The guide is 95 percent. The community has the final word.">
<rect width="400" height="440" fill="#fffaf0"/>
<text x="200" y="28" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Say the names</text>
<rect x="10" y="44" width="186" height="52" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="1.5"/>
<text x="22" y="66" font-size="16" font-weight="bold" fill="#23261f">Secwepemc</text><text x="22" y="87" font-size="16" fill="#c2410c">sec-wep-emc</text>
<rect x="204" y="44" width="186" height="52" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="1.5"/>
<text x="216" y="66" font-size="16" font-weight="bold" fill="#23261f">Shuswap</text><text x="216" y="87" font-size="16" fill="#c2410c">shoo-shwahp</text>
<rect x="10" y="102" width="186" height="52" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="1.5"/>
<text x="22" y="124" font-size="16" font-weight="bold" fill="#23261f">Simpcw</text><text x="22" y="145" font-size="16" fill="#c2410c">sim-ka</text>
<rect x="204" y="102" width="186" height="52" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="1.5"/>
<text x="216" y="124" font-size="16" font-weight="bold" fill="#23261f">Neskonlith</text><text x="216" y="145" font-size="16" fill="#c2410c">ness-con-lith</text>
<rect x="10" y="160" width="186" height="52" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="1.5"/>
<text x="22" y="182" font-size="16" font-weight="bold" fill="#23261f">Nlaka&#x27;pamux</text><text x="22" y="203" font-size="16" fill="#c2410c">ent-la-cap-um</text>
<rect x="204" y="160" width="186" height="52" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="1.5"/>
<text x="216" y="182" font-size="16" font-weight="bold" fill="#23261f">Sto:lo</text><text x="216" y="203" font-size="16" fill="#c2410c">staw-low</text>
