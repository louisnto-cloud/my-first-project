<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side by side: a Canada goose with a long neck, a bill 4.1 to 5.8 centimetres long and a deep honk, and a smaller cackling goose with a stubby bill 2.8 to 3.8 centimetres long, a short neck and a high yelp, 75 percent. Both count in one bag of 10 a day, 99 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Canada or cackling? Bill, neck, voice</text><g transform="translate(110 165) scale(1.9 1.9)"><path d="M-34 0 Q-38 -16 -18 -16 L12 -14 Q26 -10 24 2 Q18 12 -4 12 L-24 12 Q-36 8 -34 0Z" fill="#7a6a58"/><path d="M-36 2 Q-40 -2 -30 -8 L-28 6Z" fill="#fff"/><path d="M14 -12 Q18 -40 24 -46 L30 -44 Q24 -36 22 -10Z" fill="#2f3a2b"/><ellipse cx="28" cy="-48" rx="7" ry="5" fill="#2f3a2b"/><path d="M34 -49 L44 -46 L34 -44Z" fill="#2f3a2b"/><path d="M24 -50 Q28 -44 30 -46" stroke="#fff" stroke-width="3" fill="none"/><path fill="none" d="M-6 12 L-8 26 M2 12 L4 26" stroke="#2f3a2b" stroke-width="3"/></g><g transform="translate(300 180) scale(1.2 1.2)"><path d="M-34 0 Q-38 -16 -18 -16 L12 -14 Q26 -10 24 2 Q18 12 -4 12 L-24 12 Q-36 8 -34 0Z" fill="#7a6a58"/><path d="M-36 2 Q-40 -2 -30 -8 L-28 6Z" fill="#fff"/><path d="M14 -12 Q18 -40 24 -46 L30 -44 Q24 -36 22 -10Z" fill="#2f3a2b"/><ellipse cx="28" cy="-48" rx="7" ry="5" fill="#2f3a2b"/><path d="M34 -49 L44 -46 L34 -44Z" fill="#2f3a2b"/><path d="M24 -50 Q28 -44 30 -46" stroke="#fff" stroke-width="3" fill="none"/><path fill="none" d="M-6 12 L-8 26 M2 12 L4 26" stroke="#2f3a2b" stroke-width="3"/></g><text x="110" y="238" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Canada</text><text x="110" y="256" font-size="14" fill="#23261f" text-anchor="middle">bill 4.1 to 5.8 cm</text><text x="110" y="274" font-size="14" fill="#23261f" text-anchor="middle">long neck, deep honk</text><text x="300" y="238" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Cackling</text><text x="300" y="256" font-size="14" fill="#23261f" text-anchor="middle">bill 2.8 to 3.8 cm</text><text x="300" y="274" font-size="14" fill="#23261f" text-anchor="middle">stubby, short neck, yelp</text><text x="200" y="294" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Both count in one bag: 10 a day (99%)</text>
</svg>
