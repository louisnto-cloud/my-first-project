<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="sans-serif" role="img" aria-label="Small animals and whether you may hunt them, 90 to 98 percent. Snowshoe hare: small game, Region 3 season 1 August to 30 April. Columbian ground squirrel: private land only, with permission. Eastern cottontail and grey squirrels: Schedule C, no licence needed, but they do not live near Heffley Creek. Nuttall&#x27;s cottontail: protected, Okanagan, no season. White tailed jackrabbit: protected, no season. Red squirrel: not for hunters, trapping only.">
