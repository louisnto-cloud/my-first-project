  <text x="326" y="216" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Protected</text>
  <text x="326" y="233" font-size="12" fill="#2f3a2b" text-anchor="middle">Okanagan: no season</text>
  <rect x="6" y="256" width="190" height="104" rx="8" fill="#f3dcd6" stroke="#c0392b" stroke-width="2"/>
  <g transform="translate(48 312) scale(0.9)"><ellipse rx="22" ry="13" fill="#b8a888"/><circle cx="18" cy="-8" r="9" fill="#b8a888"/><ellipse cx="14" cy="-26" rx="4" ry="12" fill="#b8a888" transform="rotate(-15 14 -26)"/><ellipse cx="20" cy="-26" rx="4" ry="12" fill="#b8a888" transform="rotate(10 20 -26)"/><circle cx="22" cy="-10" r="2" fill="#2f3a2b"/><ellipse cx="-14" cy="12" rx="12" ry="4" fill="#b8a888"/></g>
  <text x="128" y="286" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">White tailed</text>
  <text x="128" y="303" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">jackrabbit</text>
  <text x="128" y="326" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Protected</text>
  <text x="128" y="343" font-size="12" fill="#2f3a2b" text-anchor="middle">no season</text>
  <rect x="204" y="256" width="190" height="104" rx="8" fill="#f3dcd6" stroke="#c0392b" stroke-width="2"/>
  <g transform="translate(244 316) scale(1.0)"><path d="M-10 0 Q-34 -10 -26 -30 Q-14 -40 -12 -18Z" fill="#a0522d"/><ellipse rx="14" ry="10" fill="#a0522d"/><circle cx="12" cy="-8" r="7" fill="#a0522d"/><circle cx="14" cy="-9" r="1.6" fill="#2f3a2b"/></g>
