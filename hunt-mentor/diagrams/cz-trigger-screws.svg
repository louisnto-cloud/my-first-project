<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 388" font-family="sans-serif" role="img" aria-label="The CZ 457 trigger adjustment screws from the manual, Figs. 6 and 7: screw A sets the pull weight and screw B the travel after the shot, both reached with the stock removed; screw C in the trigger sets the travel before the shot. After any change, do the safety check: the rifle must not fire."><rect x="0" y="0" width="400" height="388" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Trigger screws A, B, C</text><rect x="12" y="44" width="376" height="190" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><rect x="120" y="60" width="150" height="70" rx="6" fill="#4A5156"/><path d="M190 130 Q210 170 180 206" stroke="#8C959B" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="150" cy="96" r="7" fill="#D8B23A" stroke="#2B3034"/><circle cx="150" cy="118" r="7" fill="#D8B23A" stroke="#2B3034"/><circle cx="196" cy="160" r="5" fill="#D8B23A" stroke="#2B3034"/><text x="100" y="101" font-size="18" font-weight="bold" text-anchor="middle" fill="#FF6A13">A</text><text x="100" y="123" font-size="18" font-weight="bold" text-anchor="middle" fill="#FF6A13">B</text><text x="232" y="166" font-size="18" font-weight="bold" text-anchor="middle" fill="#FF6A13">C</text><line x1="108" y1="96" x2="142" y2="96" stroke="#FF6A13" stroke-width="2"/><line x1="108" y1="118" x2="142" y2="118" stroke="#FF6A13" stroke-width="2"/><line x1="224" y1="162" x2="202" y2="160" stroke="#FF6A13" stroke-width="2"/><circle cx="26" cy="257" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="262" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">A</text><text x="42" y="262" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Pull weight (stock off)</text><circle cx="26" cy="283" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="288" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">B</text><text x="42" y="288" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Travel after the shot (stock off)</text><circle cx="26" cy="309" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="314" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">C</text><text x="42" y="314" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Travel before the shot (in the trigger)</text><rect x="8" y="342" width="384" height="34" rx="9" fill="#FF6A13"/><text x="200" y="364.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Then the safety check. It must not fire.</text></svg>
