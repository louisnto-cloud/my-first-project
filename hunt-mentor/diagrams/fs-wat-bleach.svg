<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bleach method: 2 drops of unscented household bleach, about 5 percent, per litre of water, then wait 30 minutes. If the water is cloudy or colder than 10 degrees Celsius, double the dose and wait 1 to 2 hours.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bleach: 2 drops a litre, 30 minutes</text><rect x="90" y="110" width="40" height="120" rx="8" fill="#4a7fb0" stroke="#2f3a2b" stroke-width="2"/><rect x="100" y="98" width="20" height="12" rx="2" fill="#2f3a2b"/><text x="110" y="256" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1 litre</text><rect x="220" y="90" width="50" height="70" rx="6" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><rect x="234" y="76" width="22" height="14" rx="2" fill="#2f3a2b"/><text x="245" y="130" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">5%</text><circle cx="200" cy="150" r="6.0" fill="#f6c344"/><circle cx="186" cy="168" r="6.0" fill="#f6c344"/><text x="320" y="110" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Unscented</text><text x="320" y="130" font-size="15" fill="#2f3a2b" text-anchor="middle">household</text><circle cx="310" cy="200" r="30.0" fill="#ffffff" stroke="#2f3a2b" stroke-width="3"/><line x1="310" y1="200" x2="310" y2="178" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round"/><line x1="310" y1="200" x2="332" y2="200" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><text x="310" y="252" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">30 min</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cloudy or cold: double it, wait 1 to 2 hours</text>
</svg>
