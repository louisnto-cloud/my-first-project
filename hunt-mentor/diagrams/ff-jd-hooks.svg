<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Memory hooks: brace, box, three: brace the rangefinder, box on the body, three readings. Size in metres times 1,000 divided by mils. 400: eye methods fade past 400 m. Bright equals near. Half, double: judge halfway and double it.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Memory hooks</text><rect x="20" y="50" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="75" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Brace, box, 3</text><text x="160" y="75" font-size="14" fill="#23261f" text-anchor="start">brace it, box on body, 3 readings</text><rect x="20" y="96" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="121" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">x1000 / mils</text><text x="160" y="121" font-size="14" fill="#23261f" text-anchor="start">size in m, times 1000</text><rect x="20" y="142" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="167" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">400</text><text x="160" y="167" font-size="14" fill="#23261f" text-anchor="start">eye methods fade past it</text><rect x="20" y="188" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="213" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Bright = near</text><text x="160" y="213" font-size="14" fill="#23261f" text-anchor="start">light tricks you closer</text><rect x="20" y="234" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="259" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Half, double</text><text x="160" y="259" font-size="14" fill="#23261f" text-anchor="start">judge half, double it</text>
</svg>
