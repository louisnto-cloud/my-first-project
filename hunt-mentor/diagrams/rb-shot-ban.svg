<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" role="img" aria-label="Which shot for which bird. Ducks, geese, coots and snipe: non toxic shot only, such as steel, bismuth, the tungsten types and tin. Grouse, quail, pheasant, partridge, ptarmigan, turkey, pigeons and doves: lead is still legal, unless a local wetland rule says otherwise." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="296" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#23261f" text-anchor="middle" font-weight="bold">Which shot for which bird</text>
<text x="200.0" y="48" font-size="14" fill="#2f3a2b" text-anchor="middle">Unless a local wetland rule says otherwise.</text>
<rect x="6" y="58" width="191" height="228" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<rect x="6" y="58" width="191" height="30" rx="10" fill="#4a7fb0"/><rect x="6" y="76" width="191" height="12" fill="#4a7fb0"/>
<text x="101.5" y="79" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Non toxic only</text>
<g transform="translate(101.5 120) scale(1.3)"><ellipse cx="0" cy="0" rx="18" ry="9" fill="#8b5a2b"/><circle cx="15" cy="-9" r="7" fill="#2e6b3a"/><path d="M21 -9 L29 -7 L21 -5 Z" fill="#e0a526"/><path d="M-18 -2 L-26 -6 L-22 2 Z" fill="#8b5a2b"/></g>
<text x="101.5" y="176" font-size="14" fill="#23261f" text-anchor="middle">Ducks, geese,</text>
<text x="101.5" y="194" font-size="14" fill="#23261f" text-anchor="middle">coots, snipe</text>
<text x="101.5" y="212" font-size="14" fill="#23261f" text-anchor="middle"></text>
<text x="101.5" y="230" font-size="14" fill="#23261f" text-anchor="middle">Steel, bismuth,</text>
<text x="101.5" y="248" font-size="14" fill="#23261f" text-anchor="middle">tungsten types, tin</text>
<rect x="203" y="58" width="191" height="228" rx="10" fill="#ffffff" stroke="#8b5a2b" stroke-width="2.5"/>
<rect x="203" y="58" width="191" height="30" rx="10" fill="#8b5a2b"/><rect x="203" y="76" width="191" height="12" fill="#8b5a2b"/>
<text x="298.5" y="79" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Lead still legal</text>
<g transform="translate(298.5 120) scale(1.3)"><ellipse cx="0" cy="0" rx="16" ry="11" fill="#8b5a2b"/><circle cx="14" cy="-10" r="6" fill="#8b5a2b"/><path d="M19 -10 L24 -9 L19 -7 Z" fill="#2f3a2b"/><path d="M-14 -4 L-28 -12 L-28 4 Z" fill="#8b5a2b"/><path d="M-2 10 L-2 18 M4 10 L4 18" stroke="#2f3a2b" stroke-width="2"/></g>
<text x="298.5" y="176" font-size="14" fill="#23261f" text-anchor="middle">Grouse, quail,</text>
<text x="298.5" y="194" font-size="14" fill="#23261f" text-anchor="middle">pheasant, partridge,</text>
<text x="298.5" y="212" font-size="14" fill="#23261f" text-anchor="middle">ptarmigan, turkey,</text>
<text x="298.5" y="230" font-size="14" fill="#23261f" text-anchor="middle">pigeons, doves</text>
</svg>
