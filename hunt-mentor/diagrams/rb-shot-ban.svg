<text x="200" y="50" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Unless a local wetland rule says otherwise.</text>
<rect x="8" y="64" width="188" height="268" rx="10" fill="#ffffff" stroke="#2c5d86" stroke-width="2"/>
<path d="M8 100 V74 a10 10 0 0 1 10 -10 H186 a10 10 0 0 1 10 10 V100z" fill="#2c5d86"/>
<text x="102" y="88" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">Non toxic only</text>
<rect x="204" y="64" width="188" height="268" rx="10" fill="#ffffff" stroke="#8b5a2b" stroke-width="2"/>
<path d="M204 100 V74 a10 10 0 0 1 10 -10 H382 a10 10 0 0 1 10 10 V100z" fill="#8b5a2b"/>
<text x="298" y="88" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">Lead still legal</text>
