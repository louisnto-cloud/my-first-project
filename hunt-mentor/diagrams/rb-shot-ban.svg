<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" font-family="sans-serif" role="img" aria-label="Which shot for which bird. Left, a mallard drake on water: ducks, geese, coots and snipe need non toxic shot only, such as steel, bismuth, the tungsten types and tin. Right, a ruffed grouse: for grouse, quail, pheasant, partridge, ptarmigan, turkey, pigeons and doves lead is still legal, unless a local wetland rule says otherwise.">
<rect width="400" height="340" fill="#fffaf0"/>
