<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Aim at a small dot on a wall that would stop a bullet. Never a window or a door.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3. Safe wall, small dot</text><rect x="80" y="60" width="240" height="160" rx="0" fill="#e9e2d0" stroke="#2f3a2b" stroke-width="2"/><circle cx="200" cy="140" r="6" fill="#e8590c" stroke="none" stroke-width="2"/><text x="200" y="250" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">basement wall, not a window</text>
</svg>
