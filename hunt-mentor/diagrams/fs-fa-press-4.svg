<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 4: after packing, press hard on top for at least 3 minutes, then wrap it tight. Do not peek.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4. Hold 3 minutes</text><ellipse cx="200" cy="190" rx="70" ry="30" fill="#d9b48f" stroke="#b08a66" stroke-width="2"/><rect x="165" y="161" width="70" height="30" rx="4" fill="#ffffff" stroke="#9a9a8f" stroke-width="2"/><line x1="171" y1="170" x2="229" y2="170" stroke="#9a9a8f" stroke-width="1" stroke-linecap="round"/><line x1="171" y1="182" x2="229" y2="182" stroke="#9a9a8f" stroke-width="1" stroke-linecap="round"/><ellipse cx="200" cy="156" rx="26" ry="15" fill="#d9b48f" stroke="#2f3a2b" stroke-width="2"/><ellipse cx="200" cy="138" rx="23" ry="14" fill="#d9b48f" stroke="#2f3a2b" stroke-width="2"/><circle cx="320" cy="90" r="36.0" fill="#ffffff" stroke="#2f3a2b" stroke-width="3"/><line x1="320" y1="90" x2="320" y2="64" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round"/><line x1="320" y1="90" x2="342" y2="100" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><text x="320" y="146" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3 min</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Press on top 3 minutes. Do not peek</text>
</svg>
