<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Goose field spread from above, 65 percent. Wind blows right to left across a cut grain field. One to three dozen decoys sit upwind, about 80 percent feeders with heads down and 20 percent heads up. A landing hole is left open on the downwind side of the decoys. The hide sits beside the hole. Geese come in against the wind and land in the hole.">
