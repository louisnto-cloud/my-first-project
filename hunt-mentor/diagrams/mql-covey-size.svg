<text x="12" y="100" font-size="16" font-weight="bold" fill="#2f3a2b">California average</text><text x="392" y="100" font-size="15" fill="#2f3a2b" text-anchor="end">20 to 25 (70%)</text>
<use href="#mql-covey-size-q" x="24.0" y="130" fill="#8b5a2b"/><use href="#mql-covey-size-q" x="61.5" y="130" fill="#8b5a2b"/><g transform="translate(99.0 130)"><use href="#mql-covey-size-q" fill="#8b5a2b" opacity=".35"/><use href="#mql-covey-size-q" fill="#8b5a2b" clip-path="url(#mql-covey-size-half)"/></g>
<text x="12" y="170" font-size="16" font-weight="bold" fill="#2f3a2b">Washington</text><text x="392" y="170" font-size="15" fill="#2f3a2b" text-anchor="end">a dozen to several dozen (75%)</text>
<use href="#mql-covey-size-q" x="24.0" y="200" fill="#8a9a6b"/><use href="#mql-covey-size-q" x="61.5" y="200" fill="#8a9a6b" opacity=".35"/><use href="#mql-covey-size-q" x="99.0" y="200" fill="#8a9a6b" opacity=".35"/><use href="#mql-covey-size-q" x="136.5" y="200" fill="#8a9a6b" opacity=".35"/><use href="#mql-covey-size-q" x="174.0" y="200" fill="#8a9a6b" opacity=".35"/>
<text x="12" y="240" font-size="16" font-weight="bold" fill="#2f3a2b">BC, big coveys</text><text x="392" y="240" font-size="15" fill="#2f3a2b" text-anchor="end">100 or more (85%)</text>
<use href="#mql-covey-size-q" x="24.0" y="270" fill="#a33b2a"/><use href="#mql-covey-size-q" x="61.5" y="270" fill="#a33b2a"/><use href="#mql-covey-size-q" x="99.0" y="270" fill="#a33b2a"/><use href="#mql-covey-size-q" x="136.5" y="270" fill="#a33b2a"/><use href="#mql-covey-size-q" x="174.0" y="270" fill="#a33b2a"/><use href="#mql-covey-size-q" x="211.5" y="270" fill="#a33b2a"/><use href="#mql-covey-size-q" x="249.0" y="270" fill="#a33b2a"/><use href="#mql-covey-size-q" x="286.5" y="270" fill="#a33b2a"/><use href="#mql-covey-size-q" x="324.0" y="270" fill="#a33b2a"/><use href="#mql-covey-size-q" x="361.5" y="270" fill="#a33b2a"/>
<use href="#mql-covey-size-q" x="26" y="312" fill="#2f3a2b"/><text x="52" y="318" font-size="15" font-weight="bold" fill="#2f3a2b">= 10 birds. Pale: up to</text>

