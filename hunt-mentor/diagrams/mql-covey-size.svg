<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 356" font-family="sans-serif" role="img" aria-label="Pictogram of quail covey sizes, each bird icon is 10 quail, pale icons show the upper end of a range. BC usual: under 30 birds, BC Breeding Bird Atlas, 85 percent. California average: 20 to 25, 70 percent. Washington: a dozen to several dozen, 75 percent. BC big coveys: 100 or more at times, 85 percent. Tip: coveys merge in hard winters.">
<rect width="400" height="356" fill="#fffaf0"/>
<defs><g id="mql-covey-size-q"><path d="M-13 4 C-14 -4 -6 -9 4 -7 C8 -12 16 -12 17 -6 C18 -2 15 1 13 2 C14 10 6 14 -2 13 C-8 12 -13 9 -13 4z"/><path d="M-14 0 L-19 -3 L-17 3z"/><path d="M12 -11 C10 -16 13 -20 17 -19 C14 -17 13 -14 14 -11z"/><circle cx="13" cy="-6" r="1.4" fill="#fffaf0"/><path d="M-6 2 q4 3 9 1 M-4 7 q4 2 8 0" stroke="#fffaf0" stroke-width="1.2" fill="none" opacity=".7"/></g><clipPath id="mql-covey-size-half"><rect x="-20" y="-22" width="20" height="40"/></clipPath></defs>
