<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two panels side by side, your call. Left, near first: glass the near band first, then middle, then far, as Josh Kirchner of onX teaches. Right, far first: glass the far band first before heat haze, then middle, then near, as Remi Warren of Western Hunter teaches. Both agree: look with the naked eye first, make a quick pass of open ground, then a slow grid.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Your call: near first or far first?</text><rect x="16" y="42" width="176" height="196" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="104" y="64" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Near first</text><rect x="26" y="78" width="156" height="40" rx="4" fill="#c9d4b8"/><text x="38" y="104" font-size="14" fill="#23261f" text-anchor="start">far</text><circle cx="156" cy="98" r="12" fill="#e8590c"/><text x="156" y="103" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">3</text><rect x="26" y="122" width="156" height="42" rx="4" fill="#b9c7a3"/><text x="38" y="148" font-size="14" fill="#23261f" text-anchor="start">middle</text><circle cx="156" cy="142" r="12" fill="#e8590c"/><text x="156" y="147" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">2</text><rect x="26" y="168" width="156" height="44" rx="4" fill="#8a9a6b"/><text x="38" y="194" font-size="14" fill="#23261f" text-anchor="start">near</text><circle cx="156" cy="188" r="12" fill="#e8590c"/><text x="156" y="193" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">1</text><g transform="translate(104 236) scale(0.5)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#e8590c"/><rect x="-6" y="-15" width="5" height="15" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" fill="#2f3a2b"/></g><rect x="208" y="42" width="176" height="196" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="296" y="64" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Far first</text><rect x="218" y="78" width="156" height="40" rx="4" fill="#c9d4b8"/><text x="230" y="104" font-size="14" fill="#23261f" text-anchor="start">far</text><circle cx="348" cy="98" r="12" fill="#e8590c"/><text x="348" y="103" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">1</text><rect x="218" y="122" width="156" height="42" rx="4" fill="#b9c7a3"/><text x="230" y="148" font-size="14" fill="#23261f" text-anchor="start">middle</text><circle cx="348" cy="142" r="12" fill="#e8590c"/><text x="348" y="147" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">2</text><rect x="218" y="168" width="156" height="44" rx="4" fill="#8a9a6b"/><text x="230" y="194" font-size="14" fill="#23261f" text-anchor="start">near</text><circle cx="348" cy="188" r="12" fill="#e8590c"/><text x="348" y="193" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">3</text><g transform="translate(296 236) scale(0.5)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#e8590c"/><rect x="-6" y="-15" width="5" height="15" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" fill="#2f3a2b"/></g><text x="108" y="258" font-size="14" fill="#6b4f35" text-anchor="middle">Kirchner, onX (65%)</text><text x="300" y="258" font-size="14" fill="#6b4f35" text-anchor="middle">Warren, Western Hunter (65%)</text><text x="200" y="284" font-size="14" fill="#e8590c" text-anchor="middle">Both: naked eye first, quick pass, then a slow grid</text>
</svg>
