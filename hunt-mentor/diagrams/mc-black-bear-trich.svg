<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="What kills Trichinella in bear meat. Freezing does not: the northern species, Trichinella nativa, survives months or years frozen. Cooking does: 71 degrees Celsius, 160 Fahrenheit, inside the thickest part, checked with a thermometer, because colour is not a reliable sign on dark bear meat. In a 2005 outbreak in Victoria, BC, the bear meat had been frozen before cooking.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Bear meat: what kills Trichinella?</text><rect x="10" y="52" width="186" height="190" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><rect x="204" y="52" width="186" height="190" rx="8" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/><text x="103" y="80" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">Freezing</text><text x="297" y="80" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cooking</text><g stroke="#e8590c" stroke-width="10" stroke-linecap="round"><line x1="70" y1="110" x2="136" y2="176"/><line x1="136" y1="110" x2="70" y2="176"/></g><path d="M262 140 l22 22 l44 -50" fill="none" stroke="#2f3a2b" stroke-width="10" stroke-linecap="round"/><text x="103" y="206" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Northern type survives</text><text x="103" y="224" font-size="14" fill="#23261f" text-anchor="middle">months in the freezer</text><text x="297" y="206" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">71 C (160 F) inside</text><text x="297" y="224" font-size="14" fill="#23261f" text-anchor="middle">check with a thermometer</text><text x="200" y="268" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Colour lies on dark meat. Use the probe.</text><text x="200" y="290" font-size="14" fill="#23261f" text-anchor="middle">BC outbreak 2005: frozen bear meat (75%)</text>
</svg>
