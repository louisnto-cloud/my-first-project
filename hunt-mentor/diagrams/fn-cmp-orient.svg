<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A compass sits on a map. The map is turned until its north lines run along the red needle, so roads and ridges on the map line up with the real ones.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="60" y="70" width="280" height="180" rx="0" fill="#dfe6d3" stroke="#8b5a2b" stroke-width="2"/><line x1="120" y1="70" x2="120" y2="250" stroke="#4a7fb0" stroke-width="1" stroke-linecap="round"/><line x1="200" y1="70" x2="200" y2="250" stroke="#4a7fb0" stroke-width="1" stroke-linecap="round"/><line x1="280" y1="70" x2="280" y2="250" stroke="#4a7fb0" stroke-width="1" stroke-linecap="round"/><path d="M80 230 C 140 200, 200 150, 320 100" fill="none" stroke="#e8590c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><text x="285" y="140" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start">road</text><g transform="translate(200 160) scale(1)"><g transform="rotate(0)"><rect x="-28" y="-70" width="56" height="120" rx="6" fill="#e7f0f7" stroke="#2f3a2b" stroke-width="2"/><line x1="0" y1="-40" x2="-0.0" y2="-59.6" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><polygon points="0.0,-68.0 -6.6,-56.0 6.6,-56.0" fill="#e8590c"/></g><g transform="rotate(0)"><circle r="24" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><line x1="-8" y1="-18" x2="-8" y2="18" stroke="#c92a2a" stroke-width="1.5" stroke-linecap="round"/><line x1="8" y1="-18" x2="8" y2="18" stroke="#c92a2a" stroke-width="1.5" stroke-linecap="round"/><path d="M0 -21 L6 -12 L-6 -12 Z" fill="none" stroke="#c92a2a" stroke-width="2"/><text x="0" y="-26" font-family="sans-serif" font-size="10" fill="#2f3a2b" text-anchor="middle" font-weight="bold">N</text></g><g transform="rotate(0)"><path d="M0 -19 L4 0 L-4 0 Z" fill="#c92a2a"/><path d="M0 19 L4 0 L-4 0 Z" fill="#ffffff" stroke="#2f3a2b" stroke-width="1"/></g></g><text x="20" y="40" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Turn the map, not the compass</text><text x="20" y="278" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">North lines along the needle:</text><text x="20" y="295" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">the map now matches the land.</text>
</svg>
