<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 186" role="img" aria-label="Two cards. It is unlawful to intentionally feed or bait hoofed game or turkeys anywhere in the Kootenay Region, with no distance limit. If you harvest a radio collared animal, please return the collar to the Ministry office in Cranbrook or Nelson." font-family="sans-serif">
<rect x="0" y="0" width="400" height="186" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Feeding, baiting and collars</text>
<rect x="6" y="40" width="190" height="132" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M6 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#c92a2a"/>
<text x="101" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Feed or bait</text>
<path d="M18.0 94 h24 l-3 12 h-18 z" fill="#8b5a2b"/><circle cx="25.0" cy="91" r="4" fill="#c92a2a"/><circle cx="34.0" cy="90" r="4" fill="#c92a2a"/>
<circle cx="30.0" cy="96" r="18" fill="none" stroke="#c92a2a" stroke-width="3"/><line x1="17.0" y1="109" x2="43.0" y2="83" stroke="#c92a2a" stroke-width="3"/>
<text x="52" y="88" font-size="14" fill="#23261f" text-anchor="start">Unlawful for</text>
<text x="52" y="106" font-size="14" fill="#23261f" text-anchor="start">hoofed game or</text>
<text x="52" y="124" font-size="14" fill="#23261f" text-anchor="start">turkeys anywhere</text>
<text x="52" y="142" font-size="14" fill="#23261f" text-anchor="start">in Region 4. No</text>
<text x="52" y="160" font-size="14" fill="#23261f" text-anchor="start">distance limit</text>
<rect x="204" y="40" width="190" height="132" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
<path d="M204 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#2f3a2b"/>
<text x="299" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Radio collar</text>
<text x="212" y="88" font-size="14" fill="#23261f" text-anchor="start">Shot a collared animal?</text>
<text x="212" y="106" font-size="14" fill="#23261f" text-anchor="start">Please return the</text>
<text x="212" y="124" font-size="14" fill="#23261f" text-anchor="start">collar to Cranbrook or</text>
<text x="212" y="142" font-size="14" fill="#23261f" text-anchor="start">Nelson</text>
</svg>
