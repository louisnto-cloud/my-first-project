<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three thermometers. You: 37 degrees Celsius. A resting bird: about 38.5 degrees. An active bird: about 41 degrees, 85 percent. Down feathers trap heat and waterfowl feet feel less cold.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Body heat: a goose runs hot</text><rect x="50" y="60" width="20" height="180" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><rect x="54" y="128" width="12" height="112" rx="6" fill="#e8a87c"/><circle cx="60" cy="248" r="16" fill="#e8a87c"/><text x="60" y="276" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">You</text><text x="60" y="294" font-size="14" fill="#23261f" text-anchor="middle">37°C</text><text x="76" y="138" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">37°C</text><rect x="140" y="60" width="20" height="180" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><rect x="144" y="104.0" width="12" height="136.0" rx="6" fill="#e8590c"/><circle cx="150" cy="248" r="16" fill="#e8590c"/><text x="150" y="276" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Resting</text><text x="150" y="294" font-size="14" fill="#23261f" text-anchor="middle">goose (85%)</text><text x="166" y="114.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">38.5°C</text><rect x="235" y="60" width="20" height="180" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><rect x="239" y="64" width="12" height="176" rx="6" fill="#c0392b"/><circle cx="245" cy="248" r="16" fill="#c0392b"/><text x="245" y="276" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Active</text><text x="245" y="294" font-size="14" fill="#23261f" text-anchor="middle">goose (85%)</text><text x="261" y="74" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">41°C</text><rect x="310" y="60" width="85" height="110" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="352.5" y="80" font-size="14" fill="#23261f" text-anchor="middle">Down</text><text x="352.5" y="99" font-size="14" fill="#23261f" text-anchor="middle">traps</text><text x="352.5" y="118" font-size="14" fill="#23261f" text-anchor="middle">heat</text><rect x="310" y="178" width="85" height="62" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="352.5" y="198" font-size="13" fill="#23261f" text-anchor="middle">Feet feel</text><text x="352.5" y="216" font-size="13" fill="#23261f" text-anchor="middle">less cold</text>
</svg>
