<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-label="Urine colour guide from pale to amber. Pale and light yellow: good. Dark yellow to amber: drink now. A rough guide only.">
  <rect x="0" y="0" width="400" height="290" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pee check: colour</text>
<rect x="22" y="60" width="64" height="110" rx="10" fill="#fbf6d9" stroke="#23261f" stroke-width="1.5"/><text x="54" y="196" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Pale</text>
<rect x="96" y="60" width="64" height="110" rx="10" fill="#f6e7a1" stroke="#23261f" stroke-width="1.5"/><text x="128" y="196" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Light</text>
<rect x="170" y="60" width="64" height="110" rx="10" fill="#efd36a" stroke="#23261f" stroke-width="1.5"/><text x="202" y="196" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Yellow</text>
<rect x="244" y="60" width="64" height="110" rx="10" fill="#d9a93a" stroke="#23261f" stroke-width="1.5"/><text x="276" y="196" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Dark</text>
<rect x="318" y="60" width="64" height="110" rx="10" fill="#b07a22" stroke="#23261f" stroke-width="1.5"/><text x="350" y="196" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Amber</text>
<rect x="22" y="214" width="140" height="34" rx="8" fill="#8a9a6b"/><text x="92" y="236" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Good</text>
<rect x="244" y="214" width="138" height="34" rx="8" fill="#e8590c"/><text x="313" y="236" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Drink now</text>
<text x="200" y="276" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">A rough guide only (60%)</text>
</svg>
