<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 660" font-family="sans-serif" role="img" aria-label="Maps A23 to A29, Campbell River to the west coast. A23 Lukwa Lake: No Hunting Area, MU 1-6. A24 Quinsam Coal Mine site: No Shooting Area, MU 1-6. A25 Shoemaker Bay: No Shooting Area, MU 1-7. A27 Ucluelet Inlet: No Hunting or Shooting Area, MU 1-8. A26 Iron River and Oyster River: special 2 point or better mule deer area, and youth only antlerless, MU 1-6. A28 Kakweiken River: black bear closed area, MU 1-15. A29 Conuma watershed: bow only for all big game with open seasons in Management Unit 1-12.">
