<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Top view comparison. Left, a duck: its view covers about 360 degrees around it, 70 percent, with only a thin wedge in front seen by both eyes. Right, a person: about half the circle, with a wide zone in front seen by both eyes. Orange marks the zone seen by both eyes, where depth is judged best."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">What a duck sees: almost all around</text><path d="M110 150 L110.0 60.0 A90 90 0 1 1 109.8 60.0 Z" fill="#cfe0ef"/><path d="M110 150 L94.4 61.4 A90 90 0 0 1 125.6 61.4 Z" fill="#e8590c" opacity=".8"/><g transform="translate(110 150) rotate(-90)"><g transform="translate(0 0) scale(0.7)"><path d="M8 5.3999999999999995 L3 0.03 L-14 0.05 L-12 0.03 L-15 5.3999999999999995 Z" fill="#8b5a2b"/><path d="M8 -5.3999999999999995 L3 -0.03 L-14 -0.05 L-12 -0.03 L-15 -5.3999999999999995 Z" fill="#8b5a2b"/><ellipse cx="0" cy="0" rx="20.0" ry="9" fill="#8b5a2b"/><path d="M-17.0 -4.5 L-28.0 0 L-17.0 4.5 Z" fill="#8b5a2b"/><rect x="16.0" y="-3.15" width="14" height="6.3" fill="#8b5a2b"/><circle cx="30.0" cy="0" r="7" fill="#8b5a2b"/><path d="M36.0 -2.5 L44.0 -2.0 L44.0 2.0 L36.0 2.5 Z" fill="#2f3a2b"/></g></g><text x="110" y="264" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Duck: about 360° (70%)</text><path d="M300 150 L211.4 165.6 A90 90 0 1 1 388.6 165.6 Z" fill="#e9e2d0"/><path d="M300 150 L222.1 105.0 A90 90 0 0 1 377.9 105.0 Z" fill="#e8590c" opacity=".5"/><circle cx="300" cy="150" r="12" fill="#f6d7b0" stroke="#2f3a2b" stroke-width="2"/><text x="300" y="264" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">You: about half</text><text x="110" y="48" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Both eyes: thin wedge</text><text x="300" y="48" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Both eyes: wide</text><text x="200" y="292" font-size="14" fill="#2f3a2b" text-anchor="middle">Orange: seen by both eyes, best depth</text></svg>
