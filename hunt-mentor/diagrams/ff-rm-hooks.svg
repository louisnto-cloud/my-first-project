<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Memory hooks: U B F D, up back forward down, for the bolt. 1 in 10: one turn in 10 inches. Red equals ready: a red dot means it can fire. 1 minute: wait after a click. 7 newton metres for the action screws with a metal trigger guard.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Memory hooks</text><rect x="20" y="50" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="75" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">UBFD</text><text x="150" y="75" font-size="15" fill="#23261f" text-anchor="start">Up, Back, Forward, Down</text><rect x="20" y="96" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="121" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">1 in 10</text><text x="150" y="121" font-size="15" fill="#23261f" text-anchor="start">one turn, 10 inches</text><rect x="20" y="142" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="167" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">Red = ready</text><text x="150" y="167" font-size="15" fill="#23261f" text-anchor="start">red dot means it can fire</text><rect x="20" y="188" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="213" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">1 minute</text><text x="150" y="213" font-size="15" fill="#23261f" text-anchor="start">wait after a click</text><rect x="20" y="234" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="259" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">7 Nm</text><text x="150" y="259" font-size="15" fill="#23261f" text-anchor="start">action screws, metal guard</text>
</svg>
