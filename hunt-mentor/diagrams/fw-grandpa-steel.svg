<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Lead and steel pellets drawn side by side. Steel is lighter than lead for its size, so the common rule of thumb is to pick steel shot about two sizes larger than the lead you would use. Example: where you used lead number 4, try steel number 2. Pattern your gun to check.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="32" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Steel is lighter: go about 2 sizes up</text>
  <circle cx="100" cy="130" r="26" fill="#6f7a80"/>
  <circle cx="300" cy="130" r="32" fill="#b8c2c8" stroke="#6f7a80" stroke-width="2"/>
  <path d="M150 130 L240 130" stroke="#e8590c" stroke-width="4"/><path d="M232 120 L250 130 L232 140" fill="#e8590c"/>
  <g font-family="sans-serif" font-size="16" fill="#23261f" text-anchor="middle">
    <text x="100" y="196" font-weight="bold">Lead #4</text>
    <text x="300" y="196" font-weight="bold">Steel #2</text>
  </g>
  <text x="200" y="246" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="middle">Rule of thumb, not a law of physics.</text>
  <text x="200" y="270" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="middle">Pattern your gun to check.</text>
</svg>
