<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Phone sketch of the slope direction tool. A hill coloured by which way each side faces: north faces in blue for summer beds, south faces in gold for winter and spring feeding.">
<rect width="400" height="300" fill="#fffaf0"/>
<rect x="90" y="36" width="220" height="256" rx="16" fill="#f4ecdc" stroke="#23261f" stroke-width="2"/><rect x="90" y="36" width="220" height="30" rx="16" fill="#2f3a2b"/><rect x="90" y="52" width="220" height="14" rx="0" fill="#2f3a2b"/><text x="200" y="57" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Slope direction</text><path d="M110 270 L200 90 L290 270 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><path d="M200 90 L290 270 L200 270 Z" fill="#e8b04a" opacity="0.6"/><path d="M110 270 L200 90 L200 270 Z" fill="#4a7fb0" opacity="0.35"/><text x="160" y="230" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">North</text><text x="160" y="248" font-size="14" fill="#23261f" text-anchor="middle">summer beds</text><text x="245" y="230" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">South</text><text x="245" y="248" font-size="14" fill="#23261f" text-anchor="middle">winter feed</text>
</svg>
