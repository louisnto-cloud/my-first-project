<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" role="img" aria-label="A week in season: weekday evenings for gear, range or scouting from home, Friday drive and camp, Saturday and Sunday hunt, Monday clean and journal.">
  <rect x="0" y="0" width="400" height="390" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A hunting week (Tip)</text>
<rect x="10.0" y="50" width="185.0" height="100" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<text x="102.5" y="86.80000000000001" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Mon</text>
<text x="102.5" y="120" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Clean, journal</text>
<text x="102.5" y="139" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">meat in the cold</text>
<rect x="205.0" y="50" width="185.0" height="100" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<text x="297.5" y="86.80000000000001" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Tue Wed</text>
<text x="297.5" y="120" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Maps, wind</text>
<text x="297.5" y="139" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">plan A, B, C</text>
<rect x="10.0" y="160" width="185.0" height="100" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<text x="102.5" y="196.8" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Thu</text>
<text x="102.5" y="230" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pack, check rules</text>
<text x="102.5" y="249" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">in season changes</text>
<rect x="205.0" y="160" width="185.0" height="100" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<text x="297.5" y="196.8" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">Fri</text>
<text x="297.5" y="230" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Drive, camp</text>
<text x="297.5" y="249" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">sleep early</text>
<rect x="10.0" y="270" width="185.0" height="100" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<text x="102.5" y="306.8" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">Sat</text>
<text x="102.5" y="340" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hunt</text>
<text x="102.5" y="359" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">dawn and dusk</text>
<rect x="205.0" y="270" width="185.0" height="100" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<text x="297.5" y="306.8" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">Sun</text>
<text x="297.5" y="340" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hunt, drive home</text>
<text x="297.5" y="359" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">early, safe</text>
</svg>
