<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three pillars hold up your skill. Dry fire: free, at home, for trigger and positions. Range: live rounds for zero, distance and recoil. Field: real ground with slopes, grass and wind. Most reps should be dry; live rounds confirm.">
