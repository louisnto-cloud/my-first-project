<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 554" font-family="sans-serif" role="img" aria-label="Checklist: can I shoot here? Every one of nine checks must be yes, and a check that does not apply counts as yes. 1 outside every National Park. 2 outside every ecological reserve. 3 not in a BC Park, or its page allows hunting in an open season. 4 over 100 metres (109 yards) from occupied buildings and schools. 5 off the road allowance and not shooting across it. 6 outside No Shooting and No Hunting Areas. 7 on a listed highway, a rifle only past 400 metres from its road allowance. 8 fenced, posted, leased or crop land: the owner said yes. 9 in a town: the local bylaw allows it. Any no: do not shoot. All yes: the place is OK; now check season, licence, target and backstop.">
<rect width="400" height="554" fill="#fffaf0"/>
<text x="20" y="36" font-size="20" font-weight="bold" fill="#e8590c">Need YES to all 9</text>
<text x="380" y="36" font-size="15" fill="#6b5b4b" text-anchor="end">n/a = yes</text>
<rect x="8" y="54" width="384" height="40" rx="6" fill="#f4eedf"/>
<g transform="translate(30 74) scale(0.72)" fill="#2f3a2b" stroke="none"><path d="M-15 11 L-4 -9 L2 1 L6 -4 L15 11z"/><path d="M-4 -9 L-1 -4 L-6 -3z" fill="#fffaf0"/></g>
<text x="54" y="80" font-size="16" fill="#2f3a2b">Outside National Parks</text>
<g transform="translate(30 116) scale(0.72)" fill="#2f3a2b" stroke="none"><path d="M-12 12 C-14 -4 -2 -14 14 -13 C14 4 4 13 -12 12z"/><path d="M-12 12 L6 -6" stroke="#fffaf0" stroke-width="1.8"/></g>
<text x="54" y="122" font-size="16" fill="#2f3a2b">Outside ecological reserves</text>
<rect x="8" y="138" width="384" height="40" rx="6" fill="#f4eedf"/>
<g transform="translate(30 158) scale(0.72)" fill="#2f3a2b" stroke="none"><path d="M-8 -14 L-1 0 L-4 0 L1 9 L-17 9 L-12 0 L-15 0z"/><path d="M8 -10 L14 1 L12 1 L16 10 L0 10 L4 1 L2 1z"/><rect x="-9.5" y="9" width="3" height="4"/><rect x="6.5" y="10" width="3" height="3"/></g>
<text x="54" y="164" font-size="16" fill="#2f3a2b">BC Park allows it, in season</text>
<g transform="translate(30 200) scale(0.72)" fill="#2f3a2b" stroke="none"><path d="M-14 0 L0 -13 L14 0z"/><rect x="-10" y="0" width="20" height="13"/><rect x="-3" y="5" width="6" height="8" fill="#fffaf0"/></g>
<text x="54" y="206" font-size="15" fill="#2f3a2b">Over 100 m from occupied buildings, schools</text>
<rect x="8" y="222" width="384" height="40" rx="6" fill="#f4eedf"/>
<g transform="translate(30 242) scale(0.72)" fill="#2f3a2b" stroke="none"><path d="M-6 -14 L-14 14 H14 L6 -14z"/><path d="M0 -12 V-6 M0 -1 V5 M0 9 V14" stroke="#fffaf0" stroke-width="2"/></g>
<text x="54" y="248" font-size="16" fill="#2f3a2b">Off road allowance, not across it</text>
<g transform="translate(30 284) scale(0.72)" fill="#2f3a2b" stroke="none"><circle r="13" fill="none" stroke="#2f3a2b" stroke-width="3.5"/><path d="M-9 -9 L9 9" stroke="#2f3a2b" stroke-width="3.5"/></g>
<text x="54" y="290" font-size="16" fill="#2f3a2b">Outside No Shooting, No Hunting Areas</text>
<rect x="8" y="306" width="384" height="40" rx="6" fill="#f4eedf"/>
<g transform="translate(30 326) scale(0.72)" fill="#2f3a2b" stroke="none"><path d="M-12 -13 H12 V2 C12 9 6 13 0 15 C-6 13 -12 9 -12 2z"/><path d="M-6 -6 H6 M-6 0 H6" stroke="#fffaf0" stroke-width="2.4"/></g>
<text x="54" y="332" font-size="16" fill="#2f3a2b">Listed highway: rifle past 400 m</text>
<g transform="translate(30 368) scale(0.72)" fill="#2f3a2b" stroke="none"><rect x="-15" y="-10" width="3.5" height="23"/><rect x="11.5" y="-10" width="3.5" height="23"/><path d="M-12 -5 H12 M-12 3 H12 M-12 3 L12 -5" stroke="#2f3a2b" stroke-width="2.6"/></g>
<text x="54" y="374" font-size="16" fill="#2f3a2b">Fenced, posted, leased, crop: owner OK</text>
<rect x="8" y="390" width="384" height="40" rx="6" fill="#f4eedf"/>
<g transform="translate(30 410) scale(0.72)" fill="#2f3a2b" stroke="none"><rect x="-15" y="-4" width="10" height="17"/><rect x="-4" y="-14" width="11" height="27"/><rect x="8" y="0" width="8" height="13"/><path d="M-1 -10 h2 v2 h-2z M3 -10 h2 v2 h-2z M-1 -4 h2 v2 h-2z M3 -4 h2 v2 h-2z M-1 2 h2 v2 h-2z M3 2 h2 v2 h-2z" fill="#fffaf0"/></g>
<text x="54" y="416" font-size="16" fill="#2f3a2b">Town: bylaw allows it</text>
<rect x="8" y="438" width="384" height="40" rx="8" fill="#c0392b"/>
<g transform="translate(32 458) scale(0.7)" fill="#fffaf0" stroke="none"><circle r="13" fill="none" stroke="#fffaf0" stroke-width="3.5"/><path d="M-9 -9 L9 9" stroke="#fffaf0" stroke-width="3.5"/></g>
<text x="56" y="465" font-size="18" font-weight="bold" fill="#fffaf0">Any NO: DO NOT SHOOT</text>
<rect x="8" y="486" width="384" height="60" rx="8" fill="#2f3a2b"/>
<path d="M22 516 l7 7 l13 -14" fill="none" stroke="#fffaf0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="511" font-size="17" font-weight="bold" fill="#fffaf0">All yes: the place is OK</text>
<text x="56" y="533" font-size="14.5" fill="#fffaf0">Now check season, licence, target, backstop</text>
</svg>
