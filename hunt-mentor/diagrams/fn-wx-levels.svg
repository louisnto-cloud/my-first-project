<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Three cloud levels: high wispy ice clouds called cirrus, middle grey sheets called alto clouds, and low puffy cumulus or flat stratus near the ground.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#e7f0f7" stroke="none" stroke-width="2"/><text x="14" y="26" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Three cloud levels</text><line x1="0" y1="100" x2="400" y2="100" stroke="#868e96" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="0" y1="190" x2="400" y2="190" stroke="#868e96" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M40 70 C 60 58, 85 60, 110 48" fill="none" stroke="#9aa5b1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M50 78 C 70 68, 95 70, 120 58" fill="none" stroke="#9aa5b1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M250 60 C 270 48, 295 50, 320 38" fill="none" stroke="#9aa5b1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M260 68 C 280 58, 305 60, 330 48" fill="none" stroke="#9aa5b1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="390" y="60" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="end" font-weight="bold">High: cirrus</text><text x="250" y="90" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="start">ice, wispy</text><rect x="30" y="130" width="200" height="22" rx="10" fill="#c9d3dc" stroke="none" stroke-width="0"/><text x="390" y="150" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="end" font-weight="bold">Mid: alto</text><text x="250" y="175" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="start">grey sheets</text><g transform="translate(80 240) scale(1.2)"><path d="M-30 10 C -40 10, -40 -6, -26 -6 C -24 -20, -6 -22, 0 -12 C 6 -24, 28 -20, 26 -4 C 40 -4, 40 10, 28 10 Z" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/></g><g transform="translate(170 235) scale(1.0)"><path d="M-30 10 C -40 10, -40 -6, -26 -6 C -24 -20, -6 -22, 0 -12 C 6 -24, 28 -20, 26 -4 C 40 -4, 40 10, 28 10 Z" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/></g><text x="390" y="240" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="end" font-weight="bold">Low: cumulus,</text><text x="270" y="258" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">stratus</text><rect x="0" y="280" width="400" height="20" rx="0" fill="#8a9a6b" stroke="none" stroke-width="2"/>
</svg>
