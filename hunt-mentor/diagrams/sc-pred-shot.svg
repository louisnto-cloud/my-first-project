<line x1="110" y1="218" x2="147.9" y2="144.0" stroke="#e8590c" stroke-width="2.5"/><polygon points="152,136 143.5,141.8 152.3,146.3" fill="#e8590c"/>
<text x="100" y="236" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Behind the shoulder</text>
<rect x="10" y="252" width="380" height="42" rx="8" fill="#f3ead8" stroke="#2f3a2b" stroke-width="2"/>
