<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three panels. Internal ballistics: inside the barrel, pressure and twist. External ballistics: in the air, drop, wind and angle. Terminal ballistics: in the animal, expansion and depth. This lesson is mostly external ballistics.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
