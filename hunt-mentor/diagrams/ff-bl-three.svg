<text x="200" y="90" font-size="14" fill="#2f3a2b" text-anchor="middle">in the air</text>
<text x="200" y="214" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">drop, wind,</text>
<text x="200" y="233" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">angle</text>
<rect x="268" y="44" width="124" height="214" rx="8" fill="#f3dcd3"/>
<text x="330" y="70" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Terminal</text>
<text x="330" y="90" font-size="14" fill="#2f3a2b" text-anchor="middle">in the animal</text>
<text x="330" y="214" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">expansion,</text>
<text x="330" y="233" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">depth</text>
