<text x="70" y="70" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Internal</text>
<text x="70" y="90" font-size="14" fill="#2f3a2b" text-anchor="middle">inside the barrel</text>
<text x="70" y="214" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">pressure,</text>
<text x="70" y="233" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">twist</text>
<rect x="138" y="44" width="124" height="214" rx="8" fill="#dbe8f1" stroke="#e8590c" stroke-width="3"/>
