round"/><circle cx="109" cy="42" r="6" fill="#2f3a2b" stroke="none" stroke-width="2"/><path d="M118 54 q 2 16 22 14 l2 -14" fill="none" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="142" y="54" width="26" height="18" rx="2" fill="#2f3a2b" stroke="none" stroke-width="2"/></g><path d="M180 170 Q 210 150 250 172" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><g transform="translate(290 140) scale(0.55)"><ellipse cx="62" cy="50" rx="44" ry="20" fill="#8b5a2b"/><path d="M28 42 L14 14 L24 10 L40 36 Z" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="12" cy="12" rx="13" ry="7" fill="#8b5a2b" transform="rotate(-20 12 12)"/><path d="M14 4 l6 -12 l4 10 Z" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="40" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="82" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="94" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><ellipse cx="104" cy="44" rx="5" ry="8" fill="#f4efe6"/></g><text x="200.0" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle">This lesson is mostly the middle one</text>
