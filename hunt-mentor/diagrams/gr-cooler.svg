<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Cooler cut open. Block ice or frozen jugs at the bottom with a rack above. Meat in game bags sits on the rack, dry, above the meltwater. The drain is open so water runs out. Pre chill the cooler the night before.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Meat cold and dry</text>
  <rect x="40" y="56" width="260" height="190" rx="14" fill="#4a7fb0" stroke="#2f3a2b" stroke-width="3"/>
  <rect x="54" y="70" width="232" height="164" rx="6" fill="#fff"/>
  <rect x="34" y="44" width="272" height="16" rx="6" fill="#2f3a2b"/>
  <rect x="54" y="214" width="232" height="20" fill="#4a7fb0" opacity=".4"/>
  <g fill="#dfe6d3" stroke="#4a7fb0" stroke-width="2"><rect x="62" y="186" width="50" height="34"/><rect x="122" y="186" width="50" height="34"/><rect x="182" y="186" width="50" height="34"/><rect x="242" y="186" width="38" height="34"/></g>
  <line x1="56" y1="178" x2="284" y2="178" stroke="#2f3a2b" stroke-width="5" stroke-dasharray="14 6"/>
  <g fill="#f4e6d6" stroke="#8b5a2b" stroke-width="2"><ellipse cx="110" cy="146" rx="44" ry="26"/><ellipse cx="220" cy="146" rx="50" ry="28"/></g>
  <rect x="290" y="222" width="22" height="12" fill="#2f3a2b"/>
  <path d="M312 230 q10 10 6 30" stroke="#4a7fb0" stroke-width="4" fill="none"/>
  <g font-size="14" font-weight="bold" fill="#2f3a2b">
    <text x="160" y="110" text-anchor="middle">Game bags of meat</text>
    <text x="310" y="180">Rack</text><text x="310" y="206">Block ice</text><text x="290" y="294" fill="#4a7fb0">Drain open</text>
  </g>
  <text x="20" y="276" font-size="14" font-weight="bold" fill="#e8590c">Never in meltwater</text>
  <text x="20" y="294" font-size="14" fill="#2f3a2b">Pre chill the night before</text>
</svg>
