<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Side view of a ridge with strong wind blowing up the windward slope from the left. A swirl forms just past the top. On the sheltered lee side, deer are bedded among trees. Glass the lee side in strong wind, a tip.">
