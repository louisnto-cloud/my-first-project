<g><line x1="10" y1="130" x2="120" y2="70" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="120.0,70.0 113.0,79.8 108.0,70.6" fill="#4a7fb0"/></g>
<g><line x1="10" y1="170" x2="120" y2="110" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="120.0,110.0 113.0,119.8 108.0,110.6" fill="#4a7fb0"/></g>
<g><line x1="10" y1="210" x2="120" y2="150" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="120.0,150.0 113.0,159.8 108.0,150.6" fill="#4a7fb0"/></g>
<path d="M190 85 q 40 10 40 40 q -10 20 -30 10" stroke="#4a7fb0" stroke-width="3" fill="none" stroke-dasharray="5 4"/>
<text x="255" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4a7fb0" text-anchor="start">swirl near the top</text>
<g><polygon points="268.1,200 280,166 291.9,200" fill="#3d5a3a"/><rect x="278" y="200" width="4" height="6.800000000000001" fill="#6b4f35"/></g><g><polygon points="299.5,210 310,180 320.5,210" fill="#3d5a3a"/><rect x="308" y="210" width="4" height="6.0" fill="#6b4f35"/></g>
<g transform="translate(260 190) scale(0.6)"><ellipse rx="20" ry="8" fill="#8b5a2b"/><circle cx="17" cy="-8" r="6" fill="#8b5a2b"/></g><g transform="translate(330 222) scale(0.6)"><ellipse rx="20" ry="8" fill="#8b5a2b"/><circle cx="17" cy="-8" r="6" fill="#8b5a2b"/><path d="M19 -15 l-5 -10 m3 5 l-6 -2 M23 -15 l5 -10 m-3 5 l6 -2" stroke="#5c3b1c" stroke-width="2" fill="none"/></g>
<text x="320" y="270" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Lee side: sheltered</text>
<text x="70" y="280" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Windward side</text>
</svg>
