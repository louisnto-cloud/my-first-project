<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Size of BC black bears from the BC government account: adult males 80 to 300 kg, females 40 to 140 kg. Males stand 60 to 90 cm at the shoulder, about waist high on a person.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">How big is a BC black bear?</text><text x="16" y="66" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Weight, adults (BC account)</text><rect x="16" y="78" width="34" height="0" rx="0" fill="#8a9a6b"/><text x="16" y="98" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Male (kg)</text><rect x="110" y="84" width="200" height="18" rx="4" fill="#dfe6d3"/><rect x="163.33333333333334" y="84" width="146.66666666666669" height="18" rx="4" fill="#8b5a2b"/><text x="384" y="98" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">80 to 300</text><text x="16" y="128" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Female (kg)</text><rect x="110" y="114" width="200" height="18" rx="4" fill="#dfe6d3"/><rect x="136.66666666666666" y="114" width="66.66666666666667" height="18" rx="4" fill="#8a9a6b"/><text x="384" y="128" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">40 to 140</text><text x="16" y="166" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Shoulder height, males: 60 to 90 cm</text><line x1="16" y1="280" x2="384" y2="280" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(330 264) scale(1.25)"><circle cx="0" cy="-52" r="9" fill="#2f3a2b"/><rect x="-9" y="-42" width="18" height="30" rx="5" fill="#2f3a2b"/><rect x="-8" y="-14" width="7" height="30" rx="3" fill="#2f3a2b"/><rect x="1" y="-14" width="7" height="30" rx="3" fill="#2f3a2b"/></g><text x="330" y="172" font-size="14" fill="#23261f" text-anchor="middle">You, 1.75 m</text><g transform="translate(190 244) scale(1.2 1.2)"><rect x="-38" y="8" width="11" height="28" rx="5.5" fill="#1d1d1b"/><rect x="-26" y="8" width="11" height="28" rx="5.5" fill="#1d1d1b"/><rect x="24" y="8" width="11" height="28" rx="5.5" fill="#1d1d1b"/><rect x="34" y="8" width="1