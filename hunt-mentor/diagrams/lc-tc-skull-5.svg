<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Skull step 5: whiten with hydrogen peroxide, not chlorine bleach, because bleach weakens bone. 60 percent, a tip.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" fill="#dfe6d3" opacity=".35"/><circle cx="28" cy="30" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="2.5"/><text x="28" y="35" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">5</text><text x="54" y="37" font-size="19" font-weight="bold" fill="#23261f" text-anchor="start">Whiten with peroxide</text><g transform="translate(150 140) scale(2.6)"><path d="M-12 -12 Q0 -20 12 -12 L8 14 Q0 20 -8 14 Z" fill="#f5f0e0" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-5" cy="-4" r="3" fill="#2f3a2b"/><circle cx="5" cy="-4" r="3" fill="#2f3a2b"/><path d="M-10 -14 Q-20 -24 -14 -30 M-15 -22 l-6 -2 M10 -14 Q20 -24 14 -30 M15 -22 l6 -2" stroke="#6b4f35" stroke-width="3" fill="none" stroke-linecap="round"/></g><rect x="250" y="90" width="50" height="100" rx="8" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/><text x="275" y="145" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">H2O2</text><g transform="translate(340 100) scale(0.8)"><circle r="18" fill="#e8590c"/><path d="M-7 -7 l14 14 M7 -7 l-14 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g><text x="340" y="140" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="middle">bleach</text><text x="200" y="250" font-size="15" fill="#23261f" text-anchor="middle">Hydrogen peroxide, not chlorine bleach. Bleach</text><text x="200" y="269" font-size="15" fill="#23261f" text-anchor="middle">weakens bone.</text>
</svg>
