<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 314" font-family="sans-serif" role="img" aria-label="Four lines you must not cross with a CZ 457 in Canada: a suppressor or silencer is a prohibited device; making it fire more than one shot per trigger pull makes it an automatic, a prohibited firearm; cutting the barrel or rifle down so the barrel is under 457 mm, or the rifle under 660 mm, makes an adapted prohibited firearm; a bullpup stock is a prohibited device. Criminal Code section 84 and SOR/98-462."><rect x="0" y="0" width="400" height="314" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Lines you must not cross</text><rect x="14" y="44" width="372" height="46" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="2"/><circle cx="38" cy="67" r="12" fill="#FF6A13"/><line x1="31" y1="60" x2="45" y2="74" stroke="#FFFFFF" stroke-width="3"/><line x1="45" y1="60" x2="31" y2="74" stroke="#FFFFFF" stroke-width="3"/><text x="60" y="64" font-size="15" font-weight="bold" text-anchor="start" fill="#17201A">Suppressor (silencer)</text><text x="60" y="83" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Prohibited device</text><rect x="14" y="98" width="372" height="46" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="2"/><circle cx="38" cy="121" r="12" fill="#FF6A13"/><line x1="31" y1="114" x2="45" y2="128" stroke="#FFFFFF" stroke-width="3"/><line x1="45" y1="114" x2="31" y2="128" stroke="#FFFFFF" stroke-width="3"/><text x="60" y="118" font-size="15" font-weight="bold" text-anchor="start" fill="#17201A">Make it fire more than once</text><text x="60" y="137" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Automatic: prohibited</text><rect x="14" y="152" width="372" height="46" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="2"/><circle cx="38" cy="175" r="12" fill="#FF6A13"/><line x1="31" y1="168" x2="45" y2="182" stroke="#FFFFFF" stroke-width="3"/><line x1="45" y1="168" x2="31" y2="182" stroke="#FFFFFF" stroke-width="3"/><text x="60" y="172" font-size="15" font-weight="bold" text-anchor="start" fill="#17201A">Cut the barrel under 457 mm</text><text x="60" y="191" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Adapted: prohibited</text><rect x="14" y="206" width="372" height="46" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="2"/><circle cx="38" cy="229" r="12" fill="#FF6A13"/><line x1="31" y1="222" x2="45" y2="236" stroke="#FFFFFF" stroke-width="3"/><line x1="45" y1="222" x2="31" y2="236" stroke="#FFFFFF" stroke-width="3"/><text x="60" y="226" font-size="15" font-weight="bold" text-anchor="start" fill="#17201A">Bullpup stock</text><text x="60" y="245" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Prohibited device</text><text x="16" y="282" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Criminal Code s. 84 and SOR/98-462 (95 to 99%).</text><text x="16" y="302" font-size="14" font-weight="bold" text-anchor="start" fill="#1F3D2B">Unsure? Ask a gunsmith and the RCMP CFP.</text></svg>
