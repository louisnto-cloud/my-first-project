<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" role="img" aria-label="Before you start: three questions. Any heart or chest symptoms, any health condition or injury, or pregnant? If yes, check with a health professional or the Get Active Questionnaire first. If no to all, start easy.">
  <rect x="0" y="0" width="400" height="270" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Safety check before training</text>
<rect x="20" y="48" width="250" height="40" rx="8" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2"/>
<text x="145" y="74" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Chest pain or dizzy spells?</text>
<line x1="270" y1="68.0" x2="300" y2="68.0" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/><polygon points="300.0,68.0 292.8,71.5 292.8,64.5" fill="#b3261e"/>
<text x="285" y="62.0" font-family="sans-serif" font-size="12" fill="#b3261e" text-anchor="middle">Yes</text>
<rect x="304" y="54" width="86" height="28" rx="6" fill="#f6d5cf" stroke="#b3261e" stroke-width="1.5"/>
<text x="347" y="75" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b3261e" text-anchor="middle">Ask first</text>
<line x1="145" y1="88" x2="145" y2="103" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><polygon points="145.0,103.0 142.0,96.7 148.0,96.7" fill="#2f3a2b"/>
<rect x="20" y="104" width="250" height="40" rx="8" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2"/>
<text x="145" y="130" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Health condition or injury?</text>
<line x1="270" y1="124.0" x2="300" y2="124.0" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/><polygon points="300.0,124.0 292.8,127.5 292.8,120.5" fill="#b3261e"/>
<text x="285" y="118.0" font-family="sans-serif" font-size="12" fill="#b3261e" text-anchor="middle">Yes</text>
<rect x="304" y="110" width="86" height="28" rx="6" fill="#f6d5cf" stroke="#b3261e" stroke-width="1.5"/>
<text x="347" y="131" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b3261e" text-anchor="middle">Ask first</text>
<line x1="145" y1="144" x2="145" y2="159" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><polygon points="145.0,159.0 142.0,152.7 148.0,152.7" fill="#2f3a2b"/>
<rect x="20" y="160" width="250" height="40" rx="8" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2"/>
<text x="145" y="186" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Pregnant?</text>
<line x1="270" y1="180.0" x2="300" y2="180.0" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/><polygon points="300.0,180.0 292.8,183.5 292.8,176.5" fill="#b3261e"/>
<text x="285" y="174.0" font-family="sans-serif" font-size="12" fill="#b3261e" text-anchor="middle">Yes</text>
<rect x="304" y="166" width="86" height="28" rx="6" fill="#f6d5cf" stroke="#b3261e" stroke-width="1.5"/>
<text x="347" y="187" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b3261e" text-anchor="middle">Ask first</text>
<line x1="145" y1="200" x2="145" y2="220" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><polygon points="145.0,220.0 142.0,213.7 148.0,213.7" fill="#2f3a2b"/>
<rect x="60" y="222" width="170" height="40" rx="10" fill="#2f3a2b"/>
<text x="145" y="248" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Start easy</text>
</svg>
