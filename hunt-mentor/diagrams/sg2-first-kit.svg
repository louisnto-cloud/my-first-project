<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="What to buy with the shotgun: 1 a lock or locked case for storage and transport, 2 steel shot rated chokes, improved cylinder and modified, 3 ear and eye protection, 4 a box of target loads plus the hunting shells you will pattern, 5 a cleaning kit, 6 a soft or hard case.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Buy with the gun</text>
<rect x="12" y="44" width="376" height="35" rx="8" fill="#ffffff" stroke="#FF6A13" stroke-width="1.6"/>
<circle cx="34" cy="61.5" r="12" fill="#FF6A13"/><text x="34" y="66.5" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="54.0" y="58.5" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="start">Lock or locked case</text>
<text x="54.0" y="75.5" font-size="13" fill="#17201A" text-anchor="start">Storage rules apply at home</text>
<rect x="12" y="84" width="376" height="35" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.6"/>
<circle cx="34" cy="101.5" r="12" fill="#1F3D2B"/><text x="34" y="106.5" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="54.0" y="98.5" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="start">Chokes: IC and modified</text>
<text x="54.0" y="115.5" font-size="13" fill="#17201A" text-anchor="start">Steel rated</text>
<rect x="12" y="124" width="376" height="35" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.6"/>
<circle cx="34" cy="141.5" r="12" fill="#1F3D2B"/><text x="34" y="146.5" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="54.0" y="146.5" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Ear and eye protection</text>
<rect x="12" y="164" width="376" height="35" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.6"/>
<circle cx="34" cy="181.5" r="12" fill="#1F3D2B"/><text x="34" y="186.5" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="54.0" y="178.5" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="start">Target loads plus hunt shells</text>
<text x="54.0" y="195.5" font-size="13" fill="#17201A" text-anchor="start">Pattern the hunt shells</text>
<rect x="12" y="204" width="376" height="35" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.6"/>
<circle cx="34" cy="221.5" r="12" fill="#1F3D2B"/><text x="34" y="226.5" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="54.0" y="226.5" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Cleaning kit</text>
<rect x="12" y="244" width="376" height="35" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.6"/>
<circle cx="34" cy="261.5" r="12" fill="#1F3D2B"/><text x="34" y="266.5" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<text x="54.0" y="266.5" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Case for transport</text>
</svg>
