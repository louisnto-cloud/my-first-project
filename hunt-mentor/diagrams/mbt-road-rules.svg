<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 332" font-family="sans-serif" role="img" aria-label="Four shooting rules near Harrison. 1 never shoot on or across a road allowance. 2 within the 400 m bands along some Forest Service Roads, lawful hunting only, no target shooting. 3 no hunting or shooting within 100 m of a house, farm building or school. 4 Harrison Mills flats: no rifles, hunt the hills. Study aid only.">
<rect width="400" height="332" fill="#EEF1EA"/>
<text x="200" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Where not to shoot near Harrison</text>
<rect x="14" y="46" width="372" height="54" rx="8" fill="#ffffff" stroke="#FF6A13" stroke-width="2"/><circle cx="38" cy="73" r="13" fill="#FF6A13" stroke="none"/><text x="38" y="78" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text><text x="62" y="69" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Never on or across a road</text><text x="62" y="90" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">road allowance: no shot (99%)</text><rect x="14" y="110" width="372" height="54" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="2"/><circle cx="38" cy="137" r="13" fill="#1F3D2B" stroke="none"/><text x="38" y="142" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text><text x="62" y="133" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">400 m FSR bands</text><text x="62" y="154" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">lawful hunting only, no target shooting</text><rect x="14" y="174" width="372" height="54" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="2"/><circle cx="38" cy="201" r="13" fill="#1F3D2B" stroke="none"/><text x="38" y="206" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text><text x="62" y="197" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">100 m from buildings</text><text x="62" y="218" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">house, farm building, school (99%)</text><rect x="14" y="238" width="372" height="54" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="2"/><circle cx="38" cy="265" r="13" fill="#1F3D2B" stroke="none"/><text x="38" y="270" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text><text x="62" y="261" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Harrison Mills flats</text><text x="62" y="282" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">no rifles: hunt the hills (99%)</text><text x="200" y="318" font-size="14" text-anchor="middle" font-weight="bold" fill="#17201A">Study aid only. The regulations are the law.</text>
</svg>
