<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Flowchart of swimmers that are not ordinary ducks. Dagger bill, sits low and dives: a loon or a grebe, no shot. All white, huge, long neck: a swan, no shot. Slate grey with a white chicken bill: a coot, legal with its own limit of 10. Thin red bill with teeth: a merganser, a duck that counts in your 8. No name, no shot."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Not every swimmer is a duck</text><rect x="6" y="38" width="226" height="52" rx="8" fill="#dfe6d3"/><text x="119" y="69" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Dagger bill, sits low, dives?</text><line x1="234" y1="64" x2="250.0" y2="64.0" stroke="#2f3a2b" stroke-width="3" fill="none"/><polygon points="256.0,64.0 245.0,58.0 245.0,70.0" fill="#2f3a2b"/><rect x="258" y="38" width="136" height="52" rx="8" fill="#e8590c"/><text x="326" y="59" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Loon or grebe</text><text x="326" y="80" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">NO SHOT</text><rect x="6" y="98" width="226" height="52" rx="8" fill="#dfe6d3"/><text x="119" y="129" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">All white, huge, long neck?</text><line x1="234" y1="124" x2="250.0" y2="124.0" stroke="#2f3a2b" stroke-width="3" fill="none"/><polygon points="256.0,124.0 245.0,118.0 245.0,130.0" fill="#2f3a2b"/><rect x="258" y="98" width="136" height="52" rx="8" fill="#e8590c"/><text x="326" y="119" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Swan</text><text x="326" y="140" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">NO SHOT</text><rect x="6" y="158" width="226" height="52" rx="8" fill="#dfe6d3"/><text x="119" y="189" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Slate grey, white chicken bill?</text><line x1="234" y1="184" x2="250.0" y2="184.0" stroke="#2f3a2b" stroke-width="3" fill="none"/><polygon points="256.0,184.0 245.0,178.0 245.0,190.0" fill="#2f3a2b"/><rect x="258" y="158" width="136" height="52" rx="8" fill="#8a9a6b"/><text x="326" y="179" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Coot</text><text x="326" y="200" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Own limit: 10</text><rect x="6" y="218" width="226" height="52" rx="8" fill="#dfe6d3"/><text x="119" y="249" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Thin red bill with teeth?</text><line x1="234" y1="244" x2="250.0" y2="244.0" stroke="#2f3a2b" stroke-width="3" fill="none"/><polygon points="256.0,244.0 245.0,238.0 245.0,250.0" fill="#2f3a2b"/><rect x="258" y="218" width="136" height="52" rx="8" fill="#8a9a6b"/><text x="326" y="239" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Merganser</text><text x="326" y="260" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Counts in your 8</text><text x="200" y="290" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">No name, no shot.</text></svg>
