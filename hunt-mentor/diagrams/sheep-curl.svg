    <line x1="5" y1="91" x2="165" y2="9" stroke="#e8590c" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
    <text x="85" y="150" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">LEGAL</text>
    <text x="85" y="166" font-size="13" fill="#23261f" text-anchor="middle">tip rises above the nose line</text>
  </g>
  <g transform="translate(218,492)">
    <path d="M22,82 L40,98 L70,112 L120,112 L135,90 L138,60 L125,46 L100,42 Z" fill="#f3ead8" stroke="#23261f" stroke-width="2"/>
    <circle cx="96" cy="60" r="5" fill="#23261f"/>
    <circle cx="32" cy="84" r="3" fill="#23261f"/>
    <path d="M118,44 C165,40 175,105 140,128 C112,146 80,138 68,112 C60,95 66,74 82,62" fill="none" stroke="#6b4f35" stroke-width="8" stroke-linecap="round"/>
    <line x1="5" y1="91" x2="165" y2="9" stroke="#e8590c" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
    <text x="85" y="150" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">NOT LEGAL</text>
    <text x="85" y="166" font-size="13" fill="#23261f" text-anchor="middle">tip below the nose line</text>
  </g>
