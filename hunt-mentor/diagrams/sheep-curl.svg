  <text x="200" y="468" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Full curl thinhorn, mature bighorn</text>
  <text x="200" y="486" font-size="14" fill="#6b4f35" text-anchor="middle">Line: along the bridge of the nose, extended</text>
  <g transform="translate(18,492)">
    <path d="M22,82 L40,98 L70,112 L120,112 L135,90 L138,60 L125,46 L100,42 Z" fill="#f3ead8" stroke="#23261f" stroke-width="2"/>
    <circle cx="96" cy="60" r="5" fill="#23261f"/>
    <circle cx="32" cy="84" r="3" fill="#23261f"/>
