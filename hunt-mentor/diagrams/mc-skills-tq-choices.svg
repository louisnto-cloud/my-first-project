<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Your call on two tourniquet questions. How far above the wound: 5 to 8 centimetres per the American Red Cross and Stop the Bleed guides, 70 percent; or 5 to 10 centimetres per the 2012 Canadian Red Cross skills sheet, 75 percent. Loosen it later: the older 2012 Canadian sheet says slowly after 10 minutes if bleeding has dropped; newer American Red Cross and Stop the Bleed material says never, medical staff only. Ask your first aid instructor.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Your call: tourniquet questions</text><rect x="14" y="42" width="372" height="120" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="62" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">How far above the wound?</text><rect x="26" y="80" width="26" height="70" rx="8" fill="#e6c3a6" stroke="#23261f" stroke-width="1.5"/><rect x="22" y="98" width="34" height="10" fill="#23261f"/><circle cx="39" cy="136" r="6" fill="#b3261e"/><text x="62" y="104" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">5 to 8 cm</text><text x="62" y="122" font-size="14" fill="#23261f" text-anchor="start">American Red Cross</text><text x="62" y="140" font-size="14" fill="#23261f" text-anchor="start">Stop the Bleed (70%)</text><rect x="212" y="80" width="26" height="70" rx="8" fill="#e6c3a6" stroke="#23261f" stroke-width="1.5"/><rect x="208" y="92" width="34" height="10" fill="#23261f"/><circle cx="225" cy="136" r="6" fill="#b3261e"/><text x="248" y="104" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">5 to 10 cm</text><text x="248" y="122" font-size="14" fill="#23261f" text-anchor="start">Canadian Red Cross</text><text x="248" y="140" font-size="14" fill="#23261f" text-anchor="start">2012 sheet (75%)</text><rect x="14" y="170" width="372" height="96" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="190" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Loosen it later?</text><text x="105" y="216" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">After 10 min, slowly</text><text x="105" y="236" font-size="14" fill="#23261f" text-anchor="middle">older Canadian sheet</text><text x="105" y="254" font-size="14" fill="#23261f" text-anchor="middle">2012 (75%)</text><text x="295" y="216" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Never: medics only</text><text x="295" y="236" font-size="14" fill="#23261f" text-anchor="middle">newer American Red</text><text x="295" y="254" font-size="14" fill="#23261f" text-anchor="middle">Cross, Stop the Bleed (70%)</text><text x="200" y="290" font-size="14" fill="#e8590c" text-anchor="middle">Ask your first aid instructor. VERIFY</text>
</svg>
