<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Hunting a burned area, watch for: fire weakened danger trees that fall even with no wind, ash pits where roots still burn below the surface, loose rock and sliding slopes, and flash floods when rain hits bare soil. Great feed for game, real hazards.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hunting a burn: watch for</text><rect x="20" y="48" width="170" height="82" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="105" y="84" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Danger trees</text><text x="105" y="108" font-size="14" fill="#2f3a2b" text-anchor="middle">fall with no wind</text><rect x="210" y="48" width="170" height="82" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="295" y="84" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Ash pits</text><text x="295" y="108" font-size="14" fill="#2f3a2b" text-anchor="middle">burning roots below</text><rect x="20" y="144" width="170" height="82" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="105" y="180" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Loose rock</text><text x="105" y="204" font-size="14" fill="#2f3a2b" text-anchor="middle">slopes slide</text><rect x="210" y="144" width="170" height="82" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="295" y="180" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Flash floods</text><text x="295" y="204" font-size="14" fill="#2f3a2b" text-anchor="middle">rain on bare soil</text><rect x="81" y="250" width="239" height="30" rx="6" fill="#2f3a2b"/><text x="200" y="271" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Great feed, real hazards</text>
</svg>
