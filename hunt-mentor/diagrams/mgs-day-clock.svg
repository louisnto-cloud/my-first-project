<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A day timeline for wintering geese in clear weather. Roost at night; the first birds leave about 15 minutes before sunrise, with the main flight at or just after sunrise, 80 percent. Feed in fields for a few hours, rest on water through midday, feed again in the late afternoon, and fly back to the roost between sunset and civil twilight, 80 percent. Legal hours for geese are half an hour before sunrise to half an hour after sunset, 99 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A winter goose day (clear sky)</text><rect x="20" y="120" width="360" height="26" rx="6" fill="#e9edf2"/><rect x="20" y="120" width="40" height="26" rx="0" fill="#9fb3c8"/><rect x="60" y="120" width="60" height="26" rx="0" fill="#e8590c"/><rect x="120" y="120" width="140" height="26" rx="0" fill="#bfe0f2"/><rect x="260" y="120" width="70" height="26" rx="0" fill="#e8590c"/><rect x="330" y="120" width="50" height="26" rx="0" fill="#9fb3c8"/><text x="40" y="138" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Roost</text><text x="90" y="138" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Feed</text><text x="190" y="138" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Rest on water</text><text x="295" y="138" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Feed</text><text x="355" y="138" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Roost</text><circle cx="60" cy="90" r="14" fill="#f9c74f"/><text x="60" y="70" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Sunrise</text><circle cx="330" cy="90" r="14" fill="#f9c74f"/><text x="330" y="70" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Sunset</text><line x1="80" y1="175" x2="62.0" y2="150.0" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><polygon points="62.0,150.0 68.2,153.3 63.2,156.9" fill="#e8590c"/><text x="100" y="192" font-size="13.5" font-weight="bold" fill="#23261f" text-anchor="middle">First birds about 15 min</text><text x="100" y="208" font-size="13.5" fill="#23261f" text-anchor="middle">before sunrise (80%)</text><line x1="320" y1="175" x2="334.0" y2="150.0" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><polygon points="334.0,150.0 333.6,157.0 328.3,154.0" fill="#e8590c"/><text x="300" y="192" font-size="13.5" font-weight="bold" fill="#23261f" text-anchor="middle">Back between sunset</text><text x="300" y="208" font-size="13.5" fill="#23261f" text-anchor="middle">and civil twilight (80%)</text><text x="200" y="236" font-size="13.5" fill="#23261f" text-anchor="middle">Feeding: a few hours, morning and late afternoon (80%)</text><rect x="20" y="250" width="360" height="42" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="268" font-size="13.5" fill="#23261f" text-anchor="middle">Legal: half an hour before sunrise to half</text><text x="200" y="285" font-size="13.5" font-weight="bold" fill="#2f3a2b" text-anchor="middle">an hour after sunset (99%)</text>
</svg>
