<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Top view of an open road with a shaded band 200 metres each side. In a Pennsylvania study, birds within about 200 metres of open roads were shot more often; more birds lived past 200 metres. Walk past the road band." font-family="sans-serif">
