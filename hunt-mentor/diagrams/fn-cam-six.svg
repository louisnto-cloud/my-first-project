<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Six ways a hunter gets seen: shape, shine, shadow, silhouette, spacing and movement. Movement is number one.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="32" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Six ways you get seen</text><rect x="20" y="50" width="175" height="66" rx="10" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="36" y="80" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Shape</text><text x="36" y="102" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="start">outline</text><rect x="210" y="50" width="175" height="66" rx="10" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="226" y="80" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Shine</text><text x="226" y="102" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="start">flash</text><rect x="20" y="130" width="175" height="66" rx="10" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="36" y="160" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Shadow</text><text x="36" y="182" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="start">dark shapes</text><rect x="210" y="130" width="175" height="66" rx="10" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="226" y="160" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Silhouette</text><text x="226" y="182" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="start">skyline</text><rect x="20" y="210" width="175" height="66" rx="10" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="36" y="240" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Spacing</text><text x="36" y="262" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="start">even gaps</text><rect x="210" y="210" width="175" height="66" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="3"/><text x="226" y="240" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Movement</text><text x="226" y="262" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="start">number 1</text>
</svg>
