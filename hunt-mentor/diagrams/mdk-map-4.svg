<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Hunt Map step 4. The What can I see from here tool, from a knoll beside the lake, shades the water you can see. Use it to pick a place to glass the ducks before the hunt. Caption: what can I see from here, a spotting knoll."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Hunt Map 4: glass it first</text><rect x="60" y="34" width="280" height="214" rx="10" fill="#e8eadf" stroke="#2f3a2b" stroke-width="3"/><path d="M64 140 Q140 120 200 150 T336 140" stroke="#c9c9b9" stroke-width="2" fill="none"/><path d="M150 90 Q190 70 230 92 Q250 120 210 130 Q160 132 150 90Z" fill="#4a7fb0"/><path d="M250 180 Q280 168 310 186 Q300 210 268 206 Q246 200 250 180Z" fill="#4a7fb0"/><path d="M80 190 Q110 178 130 196 Q120 214 92 210Z" fill="#4a7fb0" opacity=".6"/><path d="M100 70 L250 60 L250 140 L100 150Z" fill="#f2b632" opacity=".3"/><circle cx="96" cy="110" r="8" fill="#e8590c"/><text x="96" y="98" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Knoll</text><text x="200" y="230" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Seen from the knoll</text><rect x="10" y="256" width="380" height="38" rx="8" fill="#2f3a2b"/><text x="200" y="281" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">What can I see from here: a spotting knoll</text></svg>
