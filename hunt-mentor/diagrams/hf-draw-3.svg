<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 3. Where the brush runs out at the open end, the covey bursts into the air with loud whirring wings. Each hunter picks one bird on their own side and shoots only birds above head height."><rect width="400" height="300" fill="#fffaf0"/><rect width="400" height="300" fill="#efe6cf"/><path d="M150 300 C 170 220, 160 140, 190 60 L 230 60 C 210 140, 230 220, 250 300 Z" fill="#8a9a6b"/><circle cx="190" cy="260" r="9" fill="#6b7a50"/><circle cx="205" cy="220" r="9" fill="#6b7a50"/><circle cx="192" cy="180" r="9" fill="#6b7a50"/><circle cx="210" cy="140" r="9" fill="#6b7a50"/><circle cx="200" cy="100" r="9" fill="#6b7a50"/><circle cx="212" cy="75" r="9" fill="#6b7a50"/><circle cx="220" cy="280" r="9" fill="#6b7a50"/><path d="M190 60 L230 60 L240 20 L180 20 Z" fill="#dfe6d3"/><text x="210" y="16" font-size="14" fill="#2f3a2b" text-anchor="middle">open end</text><circle cx="120" cy="110" r="10" fill="#e8590c"/><circle cx="290" cy="110" r="10" fill="#4a7fb0"/><g><g transform="translate(160 50) scale(1.2)"><ellipse rx="8" ry="6" fill="#6b6f78"/><circle cx="7" cy="-4" r="4" fill="#2f3a2b"/><path d="M7 -8 q3 -6 -1 -8" stroke="#2f3a2b" stroke-width="2" fill="none"/></g><path d="M154 50 l-10 -8 M154 50 l-10 8" stroke="#6b6f78" stroke-width="3"/></g><g><g transform="translate(200 36) scale(1.2)"><ellipse rx="8" ry="6" fill="#6b6f78"/><circle cx="7" cy="-4" r="4" fill="#2f3a2b"/><path d="M7 -8 q3 -6 -1 -8" stroke="#2f3a2b" stroke-width="2" fill="none"/></g><path d="M194 36 l-10 -8 M194 36 l-10 8" stroke="#6b6f78" stroke-width="3"/></g><g><g transform="translate(245 48) scale(1.2)"><ellipse rx="8" ry="6" fill="#6b6f78"/><circle cx="7" cy="-4" r="4" fill="#2f3a2b"/><path d="M7 -8 q3 -6 -1 -8" stroke="#2f3a2b" stroke-width="2" fill="none"/></g><path d="M239 48 l-10 -8 M239 48 l-10 8" stroke="#6b6f78" stroke-width="3"/></g><g><g transform="translate(280 70) scale(1.2)"><ellipse rx="8" ry="6" fill="#6b6f78"/><circle cx="7" cy="-4" r="4" fill="#2f3a2b"/><path d="M7 -8 q3 -6 -1 -8" stroke="#2f3a2b" stroke-width="2" fill="none"/></g><path d="M274 70 l-10 -8 M274 70 l-10 8" stroke="#6b6f78" stroke-width="3"/></g><path d="M120 100 L180 40 M290 100 L260 50" stroke="#e8590c" stroke-width="2" stroke-dasharray="4 4"/><text x="12" y="170" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Cover runs out:</text><text x="12" y="190" font-size="15" fill="#2f3a2b" text-anchor="start">they burst up</text><text x="12" y="210" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">Pick ONE bird</text></svg>
