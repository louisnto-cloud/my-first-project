<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A grouse side on. The aim point is the head and upper neck. A body shot is crossed out because it ruins meat or the bird runs. Tip: stalk to about 20 m and shoot from a rest.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Grouse: head or upper neck only</text><ellipse cx="220" cy="190" rx="90" ry="50" fill="#8b5a2b"/><path d="M150 170 L120 110 L140 104 L170 160 Z" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="122" cy="100" r="18" fill="#8b5a2b" stroke="none" stroke-width="2"/><path d="M104 98 L92 102 L104 106 Z" fill="#6b4f35" stroke="#6b4f35" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="118" cy="96" r="3" fill="#23261f" stroke="none" stroke-width="2"/><circle cx="124" cy="104" r="26" fill="none" stroke="#e8590c" stroke-width="3"/><text x="70" y="60" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">aim here</text><line x1="84" y1="64" x2="108" y2="86" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><path d="M227.4 177.4 l25.2 25.2 M252.6 177.4 l-25.2 25.2" fill="none" stroke="#b3261e" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/><text x="260" y="260" font-size="14" font-weight="bold" fill="#b3261e" text-anchor="middle">body shot: ruins meat</text><text x="200.0" y="290" font-size="13" fill="#2f3a2b" text-anchor="middle">Tip: stalk to 20 m, shoot from a rest</text>
</svg>
