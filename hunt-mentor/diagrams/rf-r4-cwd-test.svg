<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 254" role="img" aria-label="Four cards on Chronic Wasting Disease testing in Region 4. Testing is mandatory for every deer, elk and moose taken in the zone. Submit the sample at a designated freezer before leaving the zone. Leave the brain and spine at or near the kill site or at a landfill, as recommended. Keep hunting: under 1 percent of deer family animals in the area are thought to have the disease." font-family="sans-serif">
<rect x="0" y="0" width="400" height="254" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">CWD testing: what to do</text>
<rect x="6" y="40" width="190" height="96" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
<path d="M6 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#2f3a2b"/>
<text x="101" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Test every one</text>
<rect x="25.0" y="82" width="10" height="26" rx="5" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/><rect x="25.0" y="96" width="10" height="12" rx="5" fill="#c92a2a"/>
<text x="52" y="88" font-size="14" fill="#23261f" text-anchor="start">Deer, elk and</text>
<text x="52" y="106" font-size="14" fill="#23261f" text-anchor="start">moose taken in the</text>
<text x="52" y="124" font-size="14" fill="#23261f" text-anchor="start">zone</text>
<rect x="204" y="40" width="190" height="96" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
<path d="M204 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#2f3a2b"/>
<text x="299" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Freezer first</text>
<rect x="223.0" y="82" width="10" height="26" rx="5" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/><rect x="223.0" y="96" width="10" height="12" rx="5" fill="#c92a2a"/>
<text x="250" y="88" font-size="14" fill="#23261f" text-anchor="start">Drop the head</text>
<text x="250" y="106" font-size="14" fill="#23261f" text-anchor="start">sample before you</text>
<text x="250" y="124" font-size="14" fill="#23261f" text-anchor="start">leave the zone</text>
<rect x="6" y="144" width="190" height="96" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
<path d="M6 154 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#2f3a2b"/>
<text x="101" y="162" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Brain and spine</text>
<text x="14" y="192" font-size="14" fill="#23261f" text-anchor="start">Recommended: leave them</text>
<text x="14" y="210" font-size="14" fill="#23261f" text-anchor="start">at the kill site or a</text>
<text x="14" y="228" font-size="14" fill="#23261f" text-anchor="start">landfill</text>
<rect x="204" y="144" width="190" height="96" rx="10" fill="#ffffff" stroke="#5c7a3a" stroke-width="2.5"/>
<path d="M204 154 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#5c7a3a"/>
<text x="299" y="162" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Keep hunting</text>
<text x="212" y="192" font-size="14" fill="#23261f" text-anchor="start">Under 1% of deer family</text>
<text x="212" y="210" font-size="14" fill="#23261f" text-anchor="start">animals there are</text>
<text x="212" y="228" font-size="14" fill="#23261f" text-anchor="start">thought to carry it</text>
</svg>
