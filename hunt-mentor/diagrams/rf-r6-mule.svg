<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 604" role="img" aria-label="Bar chart of Region 6 mule deer seasons. Haida Gwaii, 6-12 and 6-13: bucks 1 June to 28 February, antlerless 1 September to 28 February. 6-1, 6-2, 6-4 to 6-9 and 6-30: 4 point bucks 10 to 30 September, any antlered buck 1 to 19 October. 4 point bucks from 20 October: to 30 November in 6-7 to 6-9 and 6-30, to 15 November in 6-1, 6-2 and 6-4 to 6-6. Any buck in 6-3, 6-10, 6-11, 6-14 and 6-15: 10 September to 30 November. Bow only: bucks 1 to 9 September in 6-1 to 6-11, 6-14, 6-15 and 6-30; 1 to 10 December for bucks in 6-3, 6-10, 6-11, 6-14 and 6-15, 4 point bucks in 6-7 to 6-9 and 6-30, and antlerless in 6-10, 6-11, 6-14 and 6-15." font-family="sans-serif">
