<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four drill sets: 1 Compass near home, Mission; 2 Map vs land Heffley Creek; 3 Phone, no signal airplane mode walk; 4 Lost scenario with your brother. Pass each one twice before the season (Tip)">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Four drill sets</text><rect x="20.0" y="42.0" width="175.0" height="112.0" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="107.5" y="95.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">1 Compass</text><text x="107.5" y="114.0" font-size="14" fill="#23261f" text-anchor="middle">near home, Mission</text><rect x="205.0" y="42.0" width="175.0" height="112.0" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="292.5" y="95.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">2 Map vs land</text><text x="292.5" y="114.0" font-size="14" fill="#23261f" text-anchor="middle">Heffley Creek</text><rect x="20.0" y="162.0" width="175.0" height="112.0" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="107.5" y="215.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">3 Phone, no signal</text><text x="107.5" y="234.0" font-size="14" fill="#23261f" text-anchor="middle">airplane mode walk</text><rect x="205.0" y="162.0" width="175.0" height="112.0" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="292.5" y="215.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">4 Lost scenario</text><text x="292.5" y="234.0" font-size="14" fill="#23261f" text-anchor="middle">with your brother</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Pass each one twice before the season (Tip)</text>
</svg>
