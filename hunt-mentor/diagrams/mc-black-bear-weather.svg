<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Weather and black bears, with how sure we are. Hot afternoon: beds in shade near water, tip. Cool cloudy day: feeds longer in daylight, tip. Rain: keeps feeding and you move quieter, tip. Hard wind: its nose and ears are less sure, tip. First real cold and snow: nudges bears toward the den, 70 percent. Moon: no good bear data found, VERIFY.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Weather and bears: how sure?</text><rect x="10" y="50" width="380" height="34" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="72" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Hot afternoon</text><text x="150" y="72" font-size="14" fill="#23261f" text-anchor="start">Shade, near water</text><rect x="326" y="56" width="58" height="22" rx="11" fill="#8a9a6b"/><text x="355" y="72" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Tip</text><rect x="10" y="90" width="380" height="34" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="112" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Cool, cloudy</text><text x="150" y="112" font-size="14" fill="#23261f" text-anchor="start">Feeds longer</text><rect x="326" y="96" width="58" height="22" rx="11" fill="#8a9a6b"/><text x="355" y="112" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Tip</text><rect x="10" y="130" width="380" height="34" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="152" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Rain</text><text x="150" y="152" font-size="14" fill="#23261f" text-anchor="start">Keeps feeding</text><rect x="326" y="136" width="58" height="22" rx="11" fill="#8a9a6b"/><text x="355" y="152" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Tip</text><rect x="10" y="170" width="380" height="34" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="192" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Hard wind</text><text x="150" y="192" font-size="14" fill="#23261f" text-anchor="start">Senses less sure</text><rect x="326" y="176" width="58" height="22" rx="11" fill="#8a9a6b"/><text x="355" y="192" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Tip</text><rect x="10" y="210" width="380" height="34" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="232" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">First cold, snow</text><text x="150" y="232" font-size="14" fill="#23261f" text-anchor="start">Nudges to den</text><rect x="326" y="216" width="58" height="22" rx="11" fill="#2f3a2b"/><text x="355" y="232" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">70%</text><rect x="10" y="250" width="380" height="34" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="272" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Moon</text><text x="150" y="272" font-size="14" fill="#23261f" text-anchor="start">No bear data</text><rect x="326" y="256" width="58" height="22" rx="11" fill="#e8590c"/><text x="355" y="272" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">VERIFY</text>
