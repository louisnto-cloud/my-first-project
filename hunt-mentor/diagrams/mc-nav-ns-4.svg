<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 4: set the heading on your compass, put red in the shed and walk tree to tree. The phone goes back in a warm pocket; take it out to check every so often.">
<rect width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c"/><text x="26" y="31" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">4</text><text x="52" y="32" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Walk the heading on the compass</text><g transform="translate(110 160) scale(1.2)"><rect x="-34" y="-60" width="68" height="120" rx="8" fill="#e7eef5" stroke="#2f3a2b" stroke-width="2"/><line x1="0" y1="-28" x2="-5.51091059616309e-16" y2="-47.0" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="0.0,-56.0 -4.5,-47.0 4.5,-47.0" fill="#e8590c"/><circle cx="0" cy="12" r="28" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/><circle cx="0" cy="12" r="21" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><polygon points="0.0,-9.0 4.5,12.0 -4.5,12.0" fill="#c92a2a"/><polygon points="0.0,33.0 4.5,12.0 -4.5,12.0" fill="#868e96"/><circle cx="0" cy="12" r="3" fill="#23261f"/></g><text x="230" y="110" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Set 214°</text><text x="230" y="140" font-size="15" fill="#23261f" text-anchor="start">Red in the shed</text><text x="230" y="170" font-size="15" fill="#23261f" text-anchor="start">Phone in a warm</text><text x="230" y="200" font-size="15" fill="#23261f" text-anchor="start">pocket. Check often</text>
</svg>
