<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="What ducks eat by season, 80 percent. Spring: insects and snails; hens need protein for eggs. Summer: ducklings eat insects; adults eat seeds and plants. Fall: marsh plant seeds, pondweed and waste grain in cut fields. Winter: grain fields; divers eat clams and snails. In October, find the food and you find the ducks, a tip."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">What ducks eat, by season (80%)</text><rect x="10" y="40" width="380" height="52" rx="8" fill="#dfe6d3"/><rect x="10" y="40" width="90" height="52" rx="8" fill="#8a9a6b"/><text x="55" y="73" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Spring</text><text x="246" y="64" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Bugs and snails:</text><text x="246" y="83" font-size="14" fill="#2f3a2b" text-anchor="middle">hens need protein for eggs</text><rect x="10" y="98" width="380" height="52" rx="8" fill="#eef2e6"/><rect x="10" y="98" width="90" height="52" rx="8" fill="#d9a23a"/><text x="55" y="131" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Summer</text><text x="246" y="122" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Insects for ducklings:</text><text x="246" y="141" font-size="14" fill="#2f3a2b" text-anchor="middle">adults eat seeds, plants</text><rect x="10" y="156" width="380" height="52" rx="8" fill="#dfe6d3"/><rect x="10" y="156" width="90" height="52" rx="8" fill="#e8590c"/><text x="55" y="189" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Fall</text><text x="246" y="180" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Seeds and grain:</text><text x="246" y="199" font-size="14" fill="#2f3a2b" text-anchor="middle">marsh seeds, pondweed, cut fields</text><rect x="10" y="214" width="380" height="52" rx="8" fill="#eef2e6"/><rect x="10" y="214" width="90" height="52" rx="8" fill="#4a7fb0"/><text x="55" y="247" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Winter</text><text x="246" y="238" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Grain and seeds:</text><text x="246" y="257" font-size="14" fill="#2f3a2b" text-anchor="middle">divers add clams, snails</text><text x="200" y="292" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">October: find the food, find the ducks (Tip)</text></svg>
