<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A UTM grid of 1 kilometre squares with an orange point. Read right first along the bottom to get the easting, 85.5 in this example, then up the side to get the northing, 37.6. Example numbers only. Read right, then up, 95 percent.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">UTM: read right, then up</text><rect x="40" y="44" width="240" height="220" rx="2" fill="#dfe6d3" stroke="#8b5a2b" stroke-width="2"/><line x1="40" y1="44" x2="40" y2="264" stroke="#4a7fb0" stroke-width="1.5" stroke-linecap="round"/><line x1="40" y1="44" x2="280" y2="44" stroke="#4a7fb0" stroke-width="1.5" stroke-linecap="round"/><line x1="100" y1="44" x2="100" y2="264" stroke="#4a7fb0" stroke-width="1.5" stroke-linecap="round"/><line x1="40" y1="99" x2="280" y2="99" stroke="#4a7fb0" stroke-width="1.5" stroke-linecap="round"/><line x1="160" y1="44" x2="160" y2="264" stroke="#4a7fb0" stroke-width="1.5" stroke-linecap="round"/><line x1="40" y1="154" x2="280" y2="154" stroke="#4a7fb0" stroke-width="1.5" stroke-linecap="round"/><line x1="220" y1="44" x2="220" y2="264" stroke="#4a7fb0" stroke-width="1.5" stroke-linecap="round"/><line x1="40" y1="209" x2="280" y2="209" stroke="#4a7fb0" stroke-width="1.5" stroke-linecap="round"/><line x1="280" y1="44" x2="280" y2="264" stroke="#4a7fb0" stroke-width="1.5" stroke-linecap="round"/><line x1="40" y1="264" x2="280" y2="264" stroke="#4a7fb0" stroke-width="1.5" stroke-linecap="round"/><text x="40" y="282" font-size="14" fill="#4a7fb0" text-anchor="middle" font-weight="bold">84</text><text x="100" y="282" font-size="14" fill="#4a7fb0" text-anchor="middle" font-weight="bold">85</text><text x="160" y="282" font-size="14" fill="#4a7fb0" text-anchor="middle" font-weight="bold">86</text><text x="220" y="282" font-size="14" fill="#4a7fb0" text-anchor="middle" font-weight="bold">87</text><text x="28" y="49" font-size="14" fill="#4a7fb0" text-anchor="end" font-weight="bold">39</text><text x="28" y="104" font-size="14" fill="#4a7fb0" text-anchor="end" font-weight="bold">38</text><text x="28" y="159" font-size="14" fill="#4a7fb0" text-anchor="end" font-weight="bold">37</text><text x="28" y="214" font-size="14" fill="#4a7fb0" text-anchor="end" font-weight="bold">36</text><circle cx="130" cy="140" r="8" fill="#e8590c"/><line x1="40" y1="222" x2="116.0" y2="222.0" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><polygon points="124.0,222.0 116.0,218.0 116.0,226.0" fill="#e8590c"/><line x1="130" y1="222" x2="130.0" y2="158.0" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><polygon points="130.0,150.0 126.0,158.0 134.0,158.0" fill="#e8590c"/><text x="345" y="80" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Right first:</text><text x="345" y="100" font-size="15" fill="#23261f" text-anchor="middle">easting 85.5</text><text x="345" y="140" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Then up:</text><text x="345" y="160" font-size="15" fill="#23261f" text-anchor="middle">northing 37.6</text><text x="345" y="205" font-size="14" fill="#6b4f35" text-anchor="middle">Squares are</text><text x="345" y="223" font-size="14" fill="#6b4f35" text-anchor="middle">1 km</text><text x="345" y="255" font-size="14" fill="#6b4f35" text-anchor="middle">Example</text><text x="345" y="273" font-size="14" fill="#6b4f35" text-anchor="middle">numbers</text>
</svg>
