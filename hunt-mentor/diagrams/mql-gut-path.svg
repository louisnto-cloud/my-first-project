<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" font-family="sans-serif" role="img" aria-label="Side view of a quail with its food path drawn inside, numbered. 1 Beak picks seeds and leaves. 2 Crop, a pouch at the base of the neck, stores a meal. 3 Glandular stomach adds acid. 4 Gizzard grinds food with grit. 5 Gut and two caeca absorb and ferment. 6 Vent passes droppings. Poultry anatomy, 70 percent. Field trick, a Tip: open the crop after the hunt to see what the birds eat right now.">
