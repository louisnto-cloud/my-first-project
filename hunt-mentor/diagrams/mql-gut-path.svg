<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Flow chart of a quail digestive tract. Beak picks seeds and leaves. Crop stores a meal. Glandular stomach adds acid. Gizzard grinds food with grit. Gut and two caeca absorb and ferment. Vent passes droppings. Poultry anatomy, 70 percent. Field trick, a Tip: open the crop after the hunt to see what the birds eat right now.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Food path: crop and gizzard</text>
<rect x="14" y="42" width="118" height="74" rx="8" fill="#dfe6d3"/>
<text x="73" y="72" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Beak</text>
<text x="73" y="96" font-size="14" fill="#2f3a2b" text-anchor="middle">picks seeds, leaves</text>
<line x1="132" y1="79" x2="142" y2="79" stroke="#2f3a2b" stroke-width="2"/><polygon points="142,79 133.0,83.3 133.0,74.7" fill="#2f3a2b"/>
<rect x="142" y="42" width="118" height="74" rx="8" fill="#e8590c"/>
<text x="201" y="72" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Crop</text>
<text x="201" y="96" font-size="14" fill="#fff" text-anchor="middle">stores a meal</text>
<line x1="260" y1="79" x2="270" y2="79" stroke="#2f3a2b" stroke-width="2"/><polygon points="270,79 261.0,83.3 261.0,74.7" fill="#2f3a2b"/>
<rect x="270" y="42" width="118" height="74" rx="8" fill="#dfe6d3"/>
<text x="329" y="72" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Stomach</text>
<text x="329" y="96" font-size="14" fill="#2f3a2b" text-anchor="middle">acid starts work</text>
<rect x="14" y="138" width="118" height="74" rx="8" fill="#e8590c"/>
<text x="73" y="168" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Gizzard</text>
<text x="73" y="192" font-size="14" fill="#fff" text-anchor="middle">grinds with grit</text>
<line x1="132" y1="175" x2="142" y2="175" stroke="#2f3a2b" stroke-width="2"/><polygon points="142,175 133.0,179.3 133.0,170.7" fill="#2f3a2b"/>
<rect x="142" y="138" width="118" height="74" rx="8" fill="#dfe6d3"/>
<text x="201" y="168" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Gut + 2 caeca</text>
<text x="201" y="192" font-size="14" fill="#2f3a2b" text-anchor="middle">absorbs, ferments</text>
<line x1="260" y1="175" x2="270" y2="175" stroke="#2f3a2b" stroke-width="2"/><polygon points="270,175 261.0,179.3 261.0,170.7" fill="#2f3a2b"/>
<rect x="270" y="138" width="118" height="74" rx="8" fill="#dfe6d3"/>
<text x="329" y="168" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Vent</text>
<text x="329" y="192" font-size="14" fill="#2f3a2b" text-anchor="middle">droppings out</text>
<line x1="330" y1="116" x2="330" y2="138" stroke="#2f3a2b" stroke-width="2"/><polygon points="330,138 325.7,129.0 334.3,129.0" fill="#2f3a2b"/>
<rect x="10" y="236" width="380" height="56" rx="8" fill="#2f3a2b"/>
<text x="200" y="259" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Field trick: open the crop after the hunt.</text>
<text x="200" y="281" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">It shows what they eat right now (Tip)</text>
</svg>
