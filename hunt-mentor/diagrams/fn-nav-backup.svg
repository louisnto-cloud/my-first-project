<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A stack of five backups, labelled Tip: phone with offline map and track; power bank and cable; paper map in a zip bag; compass with declination set; satellite SOS or messenger.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="36" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Two is one, one is none (Tip)</text><rect x="15.0" y="60" width="370" height="36" rx="6" fill="#8a9a6b" stroke="none" stroke-width="0"/><text x="200" y="83" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Phone, offline map, track</text><rect x="27.5" y="104" width="345" height="36" rx="6" fill="#8a9a6b" stroke="none" stroke-width="0"/><text x="200" y="127" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Power bank and cable</text><rect x="40.0" y="148" width="320" height="36" rx="6" fill="#4a7fb0" stroke="none" stroke-width="0"/><text x="200" y="171" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Paper map in a zip bag</text><rect x="52.5" y="192" width="295" height="36" rx="6" fill="#4a7fb0" stroke="none" stroke-width="0"/><text x="200" y="215" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Compass, declination set</text><rect x="65.0" y="236" width="270" height="36" rx="6" fill="#e8590c" stroke="none" stroke-width="0"/><text x="200" y="259" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Satellite SOS or messenger</text>
</svg>
