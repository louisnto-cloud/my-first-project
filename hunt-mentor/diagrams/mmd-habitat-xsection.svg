<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Schematic slope from valley to alpine near Kamloops with biogeoclimatic zones: bunchgrass, ponderosa pine, interior Douglas fir, montane spruce, and Engelmann spruce subalpine fir. Deer winter low on sunny south and west slopes and summer high in basins, burns and meadows.">
