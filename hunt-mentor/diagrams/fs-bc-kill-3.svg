<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Kill site step 3: hang meat at least 3.5 metres up and 1.5 metres from tree trunks, where you can see it from far off.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3. Hang it high, in view</text><rect x="0" y="230" width="400" height="70" rx="0" fill="#dfe6d3"/><rect x="60" y="60" width="14" height="170" rx="0" fill="#8b5a2b"/><rect x="330" y="60" width="14" height="170" rx="0" fill="#8b5a2b"/><line x1="74" y1="70" x2="330" y2="70" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><rect x="180" y="90" width="40" height="60" rx="6" fill="#ffffff" stroke="#9a9a8f" stroke-width="2"/><line x1="200" y1="70" x2="200" y2="90" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><line x1="240" y1="150" x2="240" y2="228" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><text x="280" y="196" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">3.5 m</text><text x="150" y="180" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1.5 m from trunks</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">High, off the trunk, visible</text>
</svg>
