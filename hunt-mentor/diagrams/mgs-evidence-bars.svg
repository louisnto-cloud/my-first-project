<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of how sure we are. Light sets flight time: 80 percent. Cold delays the dawn flight: 80 percent. On hunt days geese move less: 80 percent. Full moon means a later return at dusk: 75 percent. A cold front pushes migrants south: Tip, weak data. Night feeding at full moon in Canada geese: Tip, hunter reports. The barometer drives feeding: lore, no study found.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">How sure are we? Evidence by claim</text><text x="196" y="62" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Light sets flight time</text><rect x="204" y="48" width="144.0" height="20" rx="4" fill="#2e7d32"/><text x="352.0" y="63" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">80%</text><text x="196" y="96" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Cold delays dawn flight</text><rect x="204" y="82" width="144.0" height="20" rx="4" fill="#2e7d32"/><text x="352.0" y="97" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">80%</text><text x="196" y="130" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Hunt days: move less</text><rect x="204" y="116" width="144.0" height="20" rx="4" fill="#2e7d32"/><text x="352.0" y="131" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">80%</text><text x="196" y="164" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Full moon: later dusk</text><rect x="204" y="150" width="135.0" height="20" rx="4" fill="#e8590c"/><text x="343.0" y="165" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">75%</text><text x="196" y="198" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Cold front pushes migrants</text><rect x="204" y="184" width="99.0" height="20" rx="4" fill="#9e9e9e"/><text x="307.0" y="199" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Tip</text><text x="196" y="232" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Night feeding at full moon</text><rect x="204" y="218" width="90.0" height="20" rx="4" fill="#9e9e9e"/><text x="298.0" y="233" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Tip</text><text x="196" y="266" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Barometer drives feeding</text><rect x="204" y="252" width="54.0" height="20" rx="4" fill="#9e9e9e"/><text x="262.0" y="267" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">lore</text><text x="200" y="292" font-size="14" fill="#2f3a2b" text-anchor="middle">Green: studies. Grey: hunter lore or weak data</text>
</svg>
