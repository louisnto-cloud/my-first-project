<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two crossed out items: a thermal scope or monocular, and a light used to hunt by. The Rule Book bans infrared optics on the hunt, even carried in the pack, and bans hunting with a light.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Banned on the hunt</text><rect x="40" y="90" width="120" height="60" rx="12" fill="#4b4f48" stroke="#2f3a2b" stroke-width="2"/><circle cx="150" cy="120" r="22" fill="#e8590c" stroke="#2f3a2b" stroke-width="2"/><text x="100" y="180" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">thermal scope</text><text x="100" y="198" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">or monocular</text><rect x="240" y="104" width="80" height="30" rx="6" fill="#6b6f68" stroke="#2f3a2b" stroke-width="2"/><path d="M320 104 L360 84 L360 154 L320 134 Z" fill="#f2c94c" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="180" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">light to hunt by</text><path d="M78.4 98.4 l43.199999999999996 43.199999999999996 M121.6 98.4 l-43.199999999999996 43.199999999999996" fill="none" stroke="#b3261e" stroke-width="9.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M278.4 98.4 l43.199999999999996 43.199999999999996 M321.6 98.4 l-43.199999999999996 43.199999999999996" fill="none" stroke="#b3261e" stroke-width="9.6" stroke-linecap="round" stroke-linejoin="round"/><text x="200.0" y="260" font-size="14" fill="#2f3a2b" text-anchor="middle">Thermal: not even in the pack (Rule Book)</text>
</svg>
