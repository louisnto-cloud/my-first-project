<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three optics, three jobs. Find with binoculars, 8x or 10x, wide and steady. Judge with a spotting scope, 20 to 60x, on a tripod. Aim with the rifle scope on low power, only to shoot. Never glass with the rifle scope.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Three tools, three jobs</text><rect x="20" y="44" width="112" height="190" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="76" y="70" font-size="18" fill="#e8590c" text-anchor="middle" font-weight="bold">FIND</text><g transform="translate(76 110) scale(1.3)"><rect x="-22" y="-12" width="18" height="30" rx="6" fill="#23261f"/><rect x="4" y="-12" width="18" height="30" rx="6" fill="#23261f"/><rect x="-6" y="-6" width="12" height="10" fill="#23261f"/><circle cx="-13" cy="20" r="8" fill="#4a7fb0"/><circle cx="13" cy="20" r="8" fill="#4a7fb0"/></g><text x="76" y="180" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Binoculars</text><text x="76" y="200" font-size="14" fill="#23261f" text-anchor="middle">8x or 10x</text><text x="76" y="218" font-size="14" fill="#23261f" text-anchor="middle">wide, steady</text><rect x="145" y="44" width="112" height="190" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="201" y="70" font-size="18" fill="#e8590c" text-anchor="middle" font-weight="bold">JUDGE</text><rect x="163" y="96" width="70" height="22" rx="8" fill="#23261f"/><path d="M233 100 L243 96 L243 118 L233 114 Z" fill="#23261f"/><line x1="195" y1="118" x2="179" y2="150" stroke="#23261f" stroke-width="3"/><line x1="195" y1="118" x2="211" y2="150" stroke="#23261f" stroke-width="3"/><line x1="195" y1="118" x2="195" y2="152" stroke="#23261f" stroke-width="3"/><text x="201" y="180" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Spotting scope</text><text x="201" y="200" font-size="14" fill="#23261f" text-anchor="middle">20 to 60x</text><text x="201" y="218" font-size="14" fill="#23261f" text-anchor="middle">on a tripod</text><rect x="270" y="44" width="112" height="190" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="326" y="70" font-size="18" fill="#e8590c" text-anchor="middle" font-weight="bold">AIM</text><rect x="284" y="102" width="84" height="14" rx="7" fill="#23261f"/><circle cx="292" cy="109" r="9" fill="#23261f"/><circle cx="362" cy="109" r="9" fill="#23261f"/><line x1="326" y1="116" x2="326" y2="128" stroke="#23261f" stroke-width="4"/><text x="326" y="180" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Rifle scope</text><text x="326" y="200" font-size="14" fill="#23261f" text-anchor="middle">low power</text><text x="326" y="218" font-size="14" fill="#23261f" text-anchor="middle">only to shoot</text><rect x="40" y="246" width="320" height="28" rx="8" fill="#e8590c"/><text x="200" y="266" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Never glass with the rifle scope</text>
</svg>
