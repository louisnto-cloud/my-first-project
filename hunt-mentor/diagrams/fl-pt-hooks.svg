<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 401" font-family="sans-serif" role="img" aria-label="Memory hook PLANS: Place to meet, a landmark you both know. Leave and back times, clock times. Arcs of fire, yours and his, out loud. No shot in the middle or behind. Signals: hand, whistle, radio. And three blasts means help.">
<rect width="400" height="401" fill="#fffaf0"/>
<text x="200" y="30" font-size="20" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Memory hook: PLANS</text>
<rect x="8" y="46" width="384" height="54" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="13" y="51" width="48" height="44" rx="8" fill="#e8590c"/>
<text x="37" y="83" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">P</text>
<text x="74" y="69" font-size="18" font-weight="bold" fill="#2f3a2b">Place to meet</text>
<text x="74" y="90" font-size="15.5" fill="#23261f">a landmark you both know</text>
<rect x="8" y="107" width="384" height="54" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="13" y="112" width="48" height="44" rx="8" fill="#e8590c"/>
<text x="37" y="144" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">L</text>
<text x="74" y="130" font-size="18" font-weight="bold" fill="#2f3a2b">Leave and back times</text>
<text x="74" y="151" font-size="15.5" fill="#23261f">clock times</text>
<rect x="8" y="168" width="384" height="54" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="13" y="173" width="48" height="44" rx="8" fill="#e8590c"/>
<text x="37" y="205" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>
<text x="74" y="191" font-size="18" font-weight="bold" fill="#2f3a2b">Arcs of fire</text>
<text x="74" y="212" font-size="15.5" fill="#23261f">yours and his, out loud</text>
<rect x="8" y="229" width="384" height="54" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="13" y="234" width="48" height="44" rx="8" fill="#e8590c"/>
<text x="37" y="266" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text>
<text x="74" y="252" font-size="18" font-weight="bold" fill="#2f3a2b">No shot in the middle</text>
<text x="74" y="273" font-size="15.5" fill="#23261f">or behind</text>
<rect x="8" y="290" width="384" height="54" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="13" y="295" width="48" height="44" rx="8" fill="#e8590c"/>
<text x="37" y="327" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
<text x="74" y="313" font-size="18" font-weight="bold" fill="#2f3a2b">Signals</text>
<text x="74" y="334" font-size="15.5" fill="#23261f">hand, whistle, radio</text>
<rect x="8" y="355" width="384" height="38" rx="8" fill="#2f3a2b"/>
<text x="200" y="380" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Three blasts means help</text>
</svg>
