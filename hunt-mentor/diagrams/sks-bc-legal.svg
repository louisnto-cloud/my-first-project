="34.0" y1="208.9" x2="25.9" y2="217.1" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/><text x="50.0" y="218.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">No lights, no night shooting</text><circle cx="30.0" cy="244.0" r="9.9" fill="#B3261E" stroke="#FFFFFF" stroke-width="2"/><line x1="25.9" y1="239.9" x2="34.0" y2="248.1" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/><line x1="34.0" y1="239.9" x2="25.9" y2="248.1" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/><text x="50.0" y="249.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">No rifles: Harrison Mills flats</text>
<text x="200.0" y="288.0" font-size="14" fill="#17201A" text-anchor="middle">Study aid only. The regulations are the law.</text>
