<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="BC deer rules for the SKS: centrefire rifle legal for deer; no minimum calibre in the table; no full metal jacket, expanding bullets only; magazine 5 maximum by federal law; loaded in a vehicle is illegal; no lights and no night shooting; no rifles on the Harrison Mills flats.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">SKS for deer: BC checklist</text>
