<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 325" font-family="sans-serif" role="img" aria-label="Weight ranges in kilograms. Mule deer buck 68 to 113. Black tailed buck 48 to 90. Black tailed doe 40 to 65. South coast doe in summer and fall 35 to 45. Chest height about 57 cm on Vancouver Island.">
<rect width="400" height="325" fill="#EEF1EA"/>
<text x="200" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Smaller than a mule deer</text>
<text x="14" y="78" font-size="14" text-anchor="start" font-weight="bold" fill="#17201A">Mule deer buck</text><rect x="280.33333333333337" y="58" width="86.25" height="28" rx="4" fill="#8a9a6b" stroke="none" stroke-width="0"/><text x="276.33333333333337" y="106" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">68</text><text x="370.58333333333337" y="106" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">113</text><text x="14" y="128" font-size="14" text-anchor="start" font-weight="bold" fill="#17201A">Black tail buck</text><rect x="242.0" y="108" width="80.5" height="28" rx="4" fill="#1F3D2B" stroke="none" stroke-width="0"/><text x="238.0" y="156" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">48</text><text x="326.5" y="156" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">90</text><text x="14" y="178" font-size="14" text-anchor="start" font-weight="bold" fill="#17201A">Black tail doe</text><rect x="226.66666666666669" y="158" width="47.91666666666663" height="28" rx="4" fill="#1F3D2B" stroke="none" stroke-width="0"/><text x="222.66666666666669" y="206" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">40</text><text x="278.5833333333333" y="206" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">65</text><text x="14" y="228" font-size="14" text-anchor="start" font-weight="bold" fill="#17201A">Coast doe, summer</text><rect x="217.08333333333331" y="208" width="19.166666666666686" height="28" rx="4" fill="#c9d3c0" stroke="none" stroke-width="0"/><text x="213.08333333333331" y="256" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">35</text><text x="240.25" y="256" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">45</text><line x1="150" y1="262" x2="380" y2="262" stroke="#17201A" stroke-width="1"/><text x="265" y="282" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">kilograms</text><text x="200" y="310" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Chest height about 57 cm (Vancouver Island)</text>
</svg>
