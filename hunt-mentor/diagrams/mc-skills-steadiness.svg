<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A steadiness ladder from hunter education: prone steadiest, then sitting, then sticks or kneeling, then standing least steady. Ask before every shot: can I go lower?">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Get lower, get steadier (85%)</text><text x="160" y="78" font-size="15" fill="#23261f" text-anchor="end" font-weight="bold">Prone</text><rect x="170" y="60" width="200" height="28" rx="4" fill="#8a9a6b"/><text x="160" y="130" font-size="15" fill="#23261f" text-anchor="end" font-weight="bold">Sitting</text><rect x="170" y="112" width="165.0" height="28" rx="4" fill="#8a9a6b"/><text x="160" y="182" font-size="15" fill="#23261f" text-anchor="end" font-weight="bold">Sticks or kneeling</text><rect x="170" y="164" width="120.0" height="28" rx="4" fill="#c9b46a"/><text x="160" y="234" font-size="15" fill="#23261f" text-anchor="end" font-weight="bold">Standing</text><rect x="170" y="216" width="60.0" height="28" rx="4" fill="#e8590c"/><text x="170" y="272" font-size="14" fill="#2f3a2b" text-anchor="start">steadier</text><line x1="240" y1="268" x2="370" y2="268" stroke="#2f3a2b" stroke-width="2"/><polygon points="370.0,268.0 361.0,272.3 361.0,263.7" fill="#2f3a2b"/><text x="200" y="294" font-size="14" fill="#6b4f35" text-anchor="middle">Ask before every shot: can I go lower? (Tip)</text>
</svg>
