<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three cards. Nose: keep the wind in your face, play the thermals, check the wind every 10 minutes. Ears: step, stop, step; soft fabric; tape metal; whisper or use hand signs. Eyes: move only when its head is down; stay off the skyline.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Beat each sense</text><rect x="14" y="44" width="118" height="232" rx="10" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><rect x="14" y="44" width="118" height="40" rx="10" fill="#e8590c"/><text x="73" y="71" font-size="18" fill="#fffaf0" text-anchor="middle" font-weight="bold">Nose</text><text x="73" y="112" font-size="14" fill="#23261f" text-anchor="middle">Wind in your face</text><text x="73" y="148" font-size="14" fill="#23261f" text-anchor="middle">Play thermals</text><text x="73" y="184" font-size="14" fill="#23261f" text-anchor="middle">Check every</text><text x="73" y="220" font-size="14" fill="#23261f" text-anchor="middle">10 minutes</text><rect x="142" y="44" width="118" height="232" rx="10" fill="#fffaf0" stroke="#4a7fb0" stroke-width="3"/><rect x="142" y="44" width="118" height="40" rx="10" fill="#4a7fb0"/><text x="201" y="71" font-size="18" fill="#fffaf0" text-anchor="middle" font-weight="bold">Ears</text><text x="201" y="112" font-size="14" fill="#23261f" text-anchor="middle">Step, stop, step</text><text x="201" y="148" font-size="14" fill="#23261f" text-anchor="middle">Soft fabric</text><text x="201" y="184" font-size="14" fill="#23261f" text-anchor="middle">Tape metal</text><text x="201" y="220" font-size="14" fill="#23261f" text-anchor="middle">Whisper or sign</text><rect x="270" y="44" width="118" height="232" rx="10" fill="#fffaf0" stroke="#8a9a6b" stroke-width="3"/><rect x="270" y="44" width="118" height="40" rx="10" fill="#8a9a6b"/><text x="329" y="71" font-size="18" fill="#fffaf0" text-anchor="middle" font-weight="bold">Eyes</text><text x="329" y="112" font-size="14" fill="#23261f" text-anchor="middle">Move when its</text><text x="329" y="148" font-size="14" fill="#23261f" text-anchor="middle">head is down</text><text x="329" y="184" font-size="14" fill="#23261f" text-anchor="middle">Stay off the</text><text x="329" y="220" font-size="14" fill="#23261f" text-anchor="middle">skyline</text><text x="200" y="294" font-size="14" fill="#6b4f35" text-anchor="middle">Opinion from the facts in this chapter (Tip)</text>
</svg>
