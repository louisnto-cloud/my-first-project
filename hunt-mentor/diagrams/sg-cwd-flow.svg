<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="sans-serif" role="img" aria-label="Flowchart: can I use this lure? First question: is it made from deer, elk, moose or caribou, like urine? If no, a synthetic lure is not a cervid derivative, my reading, 80 percent. If yes: did it come from outside BC? Bottled urine almost always does. If yes or unsure: unlawful to use for hunting, synopsis page 12 item 51. My lean: no urine lures at all.">
  <rect width="400" height="380" fill="#fffaf0"/>
  <text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Can I use this lure?</text>
  <rect x="60" y="42" width="280" height="56" rx="10" fill="#2f3a2b"/>
  <text x="200" y="66" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Made from deer, elk, moose</text>
  <text x="200" y="86" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">or caribou? (urine, glands)</text>
  <path d="M120 98 L80 140 M280 98 L320 140" stroke="#2f3a2b" stroke-width="3"/>
  <text x="85" y="122" font-size="15" font-weight="bold" fill="#2f3a2b">No</text>
  <text x="300" y="122" font-size="15" font-weight="bold" fill="#2f3a2b">Yes</text>
  <rect x="10" y="142" width="150" height="76" rx="10" fill="#dfe6d3"/>
  <text x="85" y="166" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Synthetic</text>
  <text x="85" y="186" font-size="14" fill="#2f3a2b" text-anchor="middle">not a cervid part</text>
  <text x="85" y="206" font-size="14" fill="#2f3a2b" text-anchor="middle">(my reading, 80%)</text>
  <rect x="220" y="142" width="170" height="76" rx="10" fill="#2f3a2b"/>
  <text x="305" y="166" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">From outside BC?</text>
  <text x="305" y="186" font-size="14" fill="#fff" text-anchor="middle">Bottled urine</text>
  <text x="305" y="206" font-size="14" fill="#fff" text-anchor="middle">almost always is</text>
  <path d="M305 218 V250" stroke="#2f3a2b" stroke-width="3"/>
  <text x="298" y="240" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">Yes or unsure</text>
  <rect x="200" y="252" width="190" height="66" rx="10" fill="#c0392b"/>
  <text x="295" y="278" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">Unlawful to use</text>
  <text x="295" y="302" font-size="14" fill="#fff" text-anchor="middle">page 12, item 51 (95%)</text>
  <rect x="10" y="330" width="380" height="40" rx="10" fill="#e8590c"/>
  <text x="200" y="356" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">My lean: no urine lures. Play the wind.</text>
</svg>
