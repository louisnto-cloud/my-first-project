<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 382" font-family="sans-serif" role="img" aria-label="Flowchart: can I use this lure? First question: is it made from deer, elk, moose or caribou, like urine or glands? If no, a synthetic lure is not a cervid part, my reading, 80 percent. If yes: did it come from outside BC? Bottled urine almost always does. If yes or unsure: unlawful to use for hunting, synopsis page 12 item 51, 95 percent. My lean: no urine lures. Play the wind.">
<rect width="400" height="382" fill="#fffaf0"/>
<text x="200" y="27" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Can I use this lure?</text>
<rect x="50.0" y="40" width="300" height="58" rx="8" fill="#2f3a2b" stroke="none" stroke-width="2"/><text x="200" y="64.5" font-size="15" fill="#fffaf0" text-anchor="middle">Made from deer, elk, moose</text><text x="200" y="83.5" font-size="15" fill="#fffaf0" text-anchor="middle">or caribou? (urine, glands)</text>

<path d="M140 98 V128" stroke="#2f3a2b" stroke-width="2.4"/><path d="M140.0 134.0 L144.9 125.0 L135.1 125.0z" fill="#2f3a2b"/>
<path d="M290 98 V128" stroke="#2f3a2b" stroke-width="2.4"/><path d="M290.0 134.0 L294.9 125.0 L285.1 125.0z" fill="#2f3a2b"/>
<rect x="90.4" y="104.0" width="33.6" height="27.0" rx="5" fill="#fffaf0" stroke="#2f6e3b" stroke-width="1.2"/>
<text x="107.209" y="123" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">No</text>
<rect x="306.0" y="104.0" width="42.2" height="27.0" rx="5" fill="#fffaf0" stroke="#c92a2a" stroke-width="1.2"/>
<text x="327.124" y="123" font-size="15" font-weight="bold" fill="#c92a2a" text-anchor="middle">Yes</text>
<rect x="12.0" y="138" width="176" height="78" rx="8" fill="#e3eedc" stroke="#2f6e3b" stroke-width="2"/><text x="100" y="163" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Synthetic</text><text x="100" y="182" font-size="15" fill="#2f3a2b" text-anchor="middle">not a cervid part</text><text x="100" y="201" font-size="15" fill="#2f3a2b" text-anchor="middle">(my reading, 80%)</text>
<rect x="198.0" y="138" width="184" height="78" rx="8" fill="#2f3a2b" stroke="none" stroke-width="2"/><text x="290" y="163" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">From outside BC?</text><text x="290" y="182" font-size="15" fill="#fffaf0" text-anchor="middle">Bottled urine</text><text x="290" y="201" font-size="15" fill="#fffaf0" text-anchor="middle">almost always is</text>
<path d="M290 216 V248" stroke="#2f3a2b" stroke-width="2.4"/><path d="M290.0 254.0 L294.9 245.0 L285.1 245.0z" fill="#2f3a2b"/>
<rect x="160.6" y="222.0" width="117.4" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="219.319" y="241" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Yes or unsure</text>
<rect x="198.0" y="258" width="184" height="62" rx="8" fill="#c92a2a" stroke="none" stroke-width="2"/><text x="290" y="284.5" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">Unlawful to use</text><text x="290" y="303.5" font-size="16" fill="#fffaf0" text-anchor="middle">page 12, item 51 (95%)</text>
<rect x="8" y="334" width="384" height="40" rx="20" fill="#e8590c"/><text x="200" y="360" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">My lean: no urine lures. Play the wind.</text>
</svg>
