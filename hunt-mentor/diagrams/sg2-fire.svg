<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="What happens when you pull the trigger, in four steps: 1 hammer hits the firing pin, 2 the pin hits the primer and the powder burns, 3 the gas pushes the wad and shot down the barrel, 4 the shot leaves the wad and spreads into a cloud.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">When you pull the trigger</text>
<circle cx="28" cy="60" r="14" fill="#FF6A13"/><text x="28" y="65.8" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="50.0" y="66.0" font-size="16" font-weight="bold" fill="#17201A" text-anchor="start">Hammer hits the firing pin</text>
<circle cx="28" cy="112" r="14" fill="#1F3D2B"/><text x="28" y="117.8" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="50.0" y="118.0" font-size="16" font-weight="bold" fill="#17201A" text-anchor="start">Pin hits primer, powder burns</text>
<circle cx="28" cy="164" r="14" fill="#1F3D2B"/><text x="28" y="169.8" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="50.0" y="170.0" font-size="16" font-weight="bold" fill="#17201A" text-anchor="start">Gas pushes wad and shot</text>
<circle cx="28" cy="216" r="14" fill="#1F3D2B"/><text x="28" y="221.8" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="50.0" y="222.0" font-size="16" font-weight="bold" fill="#17201A" text-anchor="start">Shot leaves the wad: a cloud</text>
