<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 312" font-family="sans-serif" role="img" aria-label="Tree ID card. Ponderosa pine: long needles 12 to 20 cm in bundles of 3, orange plated bark on old trees, cone 8 to 14 cm. Douglas fir: single soft needles 2 to 3 cm long, thick dark furrowed bark, cones with 3 pointed bracts sticking out like little tails. Lodgepole pine: needles in pairs 2 to 7 cm long, thin scaly bark, small lopsided cones.">
<rect width="400" height="312" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Pine or fir? Check needles and cones</text><rect x="8" y="38" width="124" height="250" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="70" y="60" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Ponderosa pine</text><rect x="138" y="38" width="124" height="250" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="60" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Douglas fir</text><rect x="268" y="38" width="124" height="250" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="330" y="60" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Lodgepole pine</text><line x1="40" y1="130" x2="52" y2="75" stroke="#5d7a45" stroke-width="3"/><line x1="52" y1="130" x2="60" y2="75" stroke="#5d7a45" stroke-width="3"/><line x1="64" y1="130" x2="68" y2="75" stroke="#5d7a45" stroke-width="3"/><text x="70" y="150" font-size="14" fill="#2f3a2b" text-anchor="start"></text><line x1="185" y1="110" x2="190" y2="92" stroke="#3a4a32" stroke-width="3"/><line x1="191" y1="110" x2="196" y2="92" stroke="#3a4a32" stroke-width="3"/><line x1="197" y1="110" x2="202" y2="92" stroke="#3a4a32" stroke-width="3"/><line x1="203" y1="110" x2="208" y2="92" stroke="#3a4a32" stroke-width="3"/><line x1="209" y1="110" x2="214" y2="92" stroke="#3a4a32" stroke-width="3"/><line x1="215" y1="110" x2="220" y2="92" stroke="#3a4a32" stroke-width="3"/><line x1="180" y1="112" x2="225" y2="112" stroke="#6b4f35" stroke-width="2"/><line x1="320" y1="120" x2="326" y2="96" stroke="#5d7a45" stroke-width="3"/><line x1="328" y1="120" x2="332" y2="96" stroke="#5d7a45" stroke-width="3"/><text x="70" y="168" font-size="14" fill="#2f3a2b" text-anchor="middle">needles in 3s</text><text x="70" y="192" font-size="14" fill="#2f3a2b" text-anchor="middle">12 to 20 cm</text><text x="70" y="216" font-size="14" fill="#2f3a2b" text-anchor="middle">orange plates</text><text x="70" y="240" font-size="14" fill="#2f3a2b" text-anchor="middle">cone 8 to 14 cm</text><text x="200" y="168" font-size="14" fill="#2f3a2b" text-anchor="middle">single needles</text><text x="200" y="192" font-size="14" fill="#2f3a2b" text-anchor="middle">2 to 3 cm, soft</text><text x="200" y="216" font-size="14" fill="#2f3a2b" text-anchor="middle">thick dark bark</text><text x="200" y="240" font-size="14" fill="#2f3a2b" text-anchor="middle">cone: 3 tails</text><text x="330" y="168" font-size="14" fill="#2f3a2b" text-anchor="middle">needles in 2s</text><text x="330" y="192" font-size="14" fill="#2f3a2b" text-anchor="middle">2 to 7 cm</text><text x="330" y="216" font-size="14" fill="#2f3a2b" text-anchor="middle">thin scaly bark</text><text x="330" y="240" font-size="14" fill="#2f3a2b" text-anchor="middle">lopsided cone</text><text x="200.0" y="306" font-size="14" fill="#6b4f35" text-anchor="middle">E Flora BC (85%)</text>
