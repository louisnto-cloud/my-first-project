<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Anatomy of a deer bed: a flattened oval of grass about 0.9 to 1.2 metres long, with knee marks at the front, a few hairs, a small pile of pellets beside it, and exit tracks leaving.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Read a bed</text>
<rect x="10" y="60" width="380" height="200" rx="12" fill="#cfdcb5"/><ellipse cx="200" cy="160" rx="110" ry="48" fill="#e0d4b0" stroke="#6b4f35" stroke-width="2" stroke-dasharray="6 5"/><ellipse cx="140" cy="175" rx="14" ry="8" fill="#c7b78f"/><ellipse cx="170" cy="182" rx="14" ry="8" fill="#c7b78f"/><text x="150" y="210" font-size="14" font-weight="bold" fill="#6b4f35" text-anchor="middle">knee marks</text><ellipse cx="282" cy="150" rx="2.6" ry="3.4" fill="#6b4f35"/><ellipse cx="288" cy="150" rx="2.6" ry="3.4" fill="#6b4f35"/><ellipse cx="294" cy="150" rx="2.6" ry="3.4" fill="#6b4f35"/><ellipse cx="282" cy="156" rx="2.6" ry="3.4" fill="#6b4f35"/><ellipse cx="288" cy="156" rx="2.6" ry="3.4" fill="#6b4f35"/><ellipse cx="294" cy="156" rx="2.6" ry="3.4" fill="#6b4f35"/><text x="320" y="136" font-size="14" font-weight="bold" fill="#6b4f35" text-anchor="middle">pellets</text><line x1="220" y1="145" x2="226" y2="140" stroke="#9a8160" stroke-width="1.5"/><line x1="225" y1="145" x2="231" y2="140" stroke="#9a8160" stroke-width="1.5"/><line x1="230" y1="145" x2="236" y2="140" stroke="#9a8160" stroke-width="1.5"/><line x1="235" y1="145" x2="241" y2="140" stroke="#9a8160" stroke-width="1.5"/><line x1="240" y1="145" x2="246" y2="140" stroke="#9a8160" stroke-width="1.5"/><text x="236" y="128" font-size="14" font-weight="bold" fill="#6b4f35" text-anchor="middle">hair</text><g transform="translate(345 230) rotate(70) scale(0.7)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><g transform="translate(372 222) rotate(70) scale(0.7)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><text x="330" y="255" font-size="14" font-weight="bold" fill="#6b4f35" text-anchor="middle">exit tracks</text><text x="70" y="100" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">flattened</text><text x="70" y="118" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">grass oval</text><text x="200" y="286" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Deer bed: about 0.9 to 1.2 m long (70%)</text>
</svg>
