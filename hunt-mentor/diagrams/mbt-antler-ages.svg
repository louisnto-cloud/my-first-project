<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 325" font-family="sans-serif" role="img" aria-label="Black tailed buck antlers by age. 1.5 years: spikes, about 90% of yearlings. 2.5 years: most forked, 2 points a side. 3.5 years and older: 2, 3 or 4 points a side. All are bucks, legal in MUs 2-8, 2-18 and 2-19.">
<rect width="400" height="325" fill="#EEF1EA"/>
<text x="200" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Antlers by age (a rough guide)</text>
<rect x="10" y="46" width="120" height="196" rx="10" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.5"/><ellipse cx="70" cy="196" rx="22" ry="14" fill="#8b5a2b"/><rect x="140" y="46" width="120" height="196" rx="10" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.5"/><ellipse cx="200" cy="196" rx="22" ry="14" fill="#8b5a2b"/><rect x="270" y="46" width="120" height="196" rx="10" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.5"/><ellipse cx="330" cy="196" rx="22" ry="14" fill="#8b5a2b"/><path d="M60 184 L56 110 M80 184 L84 110" fill="none" stroke="#17201A" stroke-width="5"/><path d="M190 184 L184 130 L170 96 M184 130 L196 100 M210 184 L216 130 L230 96 M216 130 L204 100" fill="none" stroke="#17201A" stroke-width="5"/><path d="M320 184 L310 130 L292 92 M310 130 L322 98 M300 112 L288 120 M314 168 L304 162 M340 184 L350 130 L368 92 M350 130 L338 98 M360 112 L372 120 M346 168 L356 162" fill="none" stroke="#17201A" stroke-width="5"/><text x="70" y="70" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F3D2B">1.5 years</text><text x="70" y="262" font-size="15" text-anchor="middle" font-weight="bold" fill="#17201A">Spikes</text><text x="70" y="282" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">about 90%</text><text x="200" y="70" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F3D2B">2.5 years</text><text x="200" y="262" font-size="15" text-anchor="middle" font-weight="bold" fill="#17201A">Most forked,</text><text x="200" y="282" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">2 points a side</text><text x="330" y="70" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F3D2B">3.5 years +</text><text x="330" y="262" font-size="15" text-anchor="middle" font-weight="bold" fill="#17201A">2, 3 or 4</text><text x="330" y="282" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">points a side</text><text x="200" y="310" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F3D2B">All are bucks: legal in 2-8, 2-18, 2-19 (99%)</text>
</svg>
