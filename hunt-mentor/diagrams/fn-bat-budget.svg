<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A day battery graph labelled Tip: from 100 percent at 5 in the morning to about 40 percent at 7 at night with the screen off while glassing. An orange line at 30 percent marks the reserve for the walk out.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="36" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">A day on one charge (Tip)</text><line x1="40" y1="260" x2="370" y2="260" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><line x1="40" y1="260" x2="40" y2="60" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><text x="36" y="65" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="end">100%</text><line x1="40" y1="60" x2="370" y2="60" stroke="#868e96" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 5"/><text x="36" y="165" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="end">50%</text><line x1="40" y1="160" x2="370" y2="160" stroke="#868e96" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 5"/><text x="36" y="225" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="end">20%</text><line x1="40" y1="220" x2="370" y2="220" stroke="#868e96" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 5"/><path d="M40 60 L90 68 L140 80 L200 100 L260 136 L320 156 L370 180" fill="none" stroke="#8a9a6b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="40" y="280" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">5 am</text><text x="200" y="280" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">noon</text><text x="370" y="280" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">7 pm</text><text x="60" y="130" font-family="sans-serif" font-size="14" fill="#8a9a6b" text-anchor="start">Glassing: screen off</text><text x="60" y="178" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start">Keep 30% for the walk out</text><line x1="40" y1="200" x2="370" y2="200" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/>
</svg>
