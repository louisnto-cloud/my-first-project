<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Simple deer skeleton inside the body outline. The shoulder blade is a big flat bone over the front of the chest, joined to the upper leg. Ribs cover the lungs behind it. The spine runs along the top and the pelvis is at the rear. The aim point sits behind the shoulder blade, between the ribs.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Bones that stop bullets</text><path d="M70 120 Q 80 92 140 92 L250 90 Q 290 88 312 92 L330 60 Q 338 46 352 50 L372 62 Q 380 72 366 80 L344 84 L330 120 Q 326 170 318 205 L300 208 L296 290 L284 290 L280 210 L130 210 L118 290 L106 290 L100 205 Q 70 190 70 150 Z" fill="#ead9c0" stroke="#23261f" stroke-width="2.5"/><path d="M340 52 L330 30 L346 46 Z" fill="#ead9c0" stroke="#23261f" stroke-width="2"/><path d="M236 100 Q 242 150 238 196" fill="none" stroke="#6b4f35" stroke-width="3"/><path d="M246 100 Q 252 150 248 196" fill="none" stroke="#6b4f35" stroke-width="3"/><path d="M256 100 Q 262 150 258 196" fill="none" stroke="#6b4f35" stroke-width="3"/><path d="M266 100 Q 272 150 268 196" fill="none" stroke="#6b4f35" stroke-width="3"/><path d="M276 100 Q 282 150 278 196" fill="none" stroke="#6b4f35" stroke-width="3"/><path d="M286 100 Q 292 150 288 196" fill="none" stroke="#6b4f35" stroke-width="3"/><path d="M296 100 Q 302 150 298 196" fill="none" stroke="#6b4f35" stroke-width="3"/><path d="M306 100 Q 312 150 308 196" fill="none" stroke="#6b4f35" stroke-width="3"/><line x1="80" y1="98" x2="320" y2="96" stroke="#6b4f35" stroke-width="6"/><path d="M276 96 L304 98 L300 166 Z" fill="#cdb79a" stroke="#23261f" stroke-width="2"/><line x1="300" y1="166" x2="286" y2="204" stroke="#6b4f35" stroke-width="7"/><line x1="286" y1="204" x2="292" y2="288" stroke="#6b4f35" stroke-width="6"/><path d="M92 104 L130 100 L126 130 Z" fill="#cdb79a" stroke="#23261f" stroke-width="2"/><line x1="118" y1="126" x2="112" y2="200" stroke="#6b4f35" stroke-width="7"/><line x1="112" y1="200" x2="112" y2="288" stroke="#6b4f35" stroke-width="6"/><circle cx="278" cy="168" r="9" fill="none" stroke="#e8590c" stroke-width="3"/><text x="232" y="50" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">shoulder blade</text><line x1="250" y1="56" x2="288" y2="110" stroke="#23261f" stroke-width="1.5"/><text x="258" y="230" font-size="15" fill="#23261f" text-anchor="end" font-weight="bold">ribs</text><text x="120" y="84" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">spine</text><text x="60" y="150" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">pelvis</text><text x="205" y="254" font-size="14" fill="#e8590c" text-anchor="middle">Aim behind the blade,</text><text x="205" y="272" font-size="14" fill="#e8590c" text-anchor="middle">between the ribs (75%)</text>
</svg>
