<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Large drawing of a male California quail with five numbered marks: 1 curled black plume, 2 black face outlined in white, 3 scaled belly, 4 white streaks on grey brown sides, 5 chestnut belly patch. Below, a small female: plain grey brown face and a small plume, no black face. 80 percent, Audubon and Cornell.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Male California quail: 5 marks</text>
<g transform="translate(110 150) scale(3.0 3.0)"><ellipse cx="0" cy="0" rx="20" ry="13" fill="#7d7f86"/><path d="M-18 -2 L-28 -6 L-26 4 Z" fill="#5f6168"/><ellipse cx="-2" cy="6" rx="14" ry="6" fill="#c9b48a"/><path d="M-10 4 l3 3 M-4 4 l3 3 M2 4 l3 3 M8 4 l3 3" stroke="#5f6168" stroke-width="1.5"/><path d="M-12 -4 l14 -2 M-12 0 l14 -2" stroke="#fffaf0" stroke-width="1.5"/><circle cx="16" cy="-12" r="8" fill="#7d7f86"/><path d="M14 -10 a7 7 0 0 0 9 6 L22 -2 a9 9 0 0 1 -9 -8 Z" fill="#111"/><path d="M12 -9 q4 9 12 6" stroke="#fffaf0" stroke-width="1.5" fill="none"/><path d="M14 -19 q-2 -10 8 -9 q-4 1 -5 9 Z" fill="#111"/><circle cx="19" cy="-13" r="1.6" fill="#111"/><path d="M23 -12 l4 1 l-4 2 Z" fill="#333"/><path d="M2 12 l-2 8 M8 12 l2 8" stroke="#6b4f35" stroke-width="2"/></g>
<line x1="108" y1="92" x2="56" y2="47" stroke="#e8590c" stroke-width="2"/>
<text x="60" y="52" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">1 Curled black plume</text>
<line x1="125" y1="118" x2="201" y2="93" stroke="#e8590c" stroke-width="2"/>
<text x="205" y="98" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">2 Black face, white rim</text>
<line x1="105" y1="158" x2="201" y2="153" stroke="#e8590c" stroke-width="2"/>
<text x="205" y="158" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">3 Scaled belly</text>
<line x1="80" y1="140" x2="201" y2="123" stroke="#e8590c" stroke-width="2"/>
<text x="205" y="128" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">4 White side streaks</text>
<line x1="95" y1="150" x2="201" y2="183" stroke="#e8590c" stroke-width="2"/>
<text x="205" y="188" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">5 Chestnut belly patch</text>
<rect x="10" y="222" width="380" height="66" rx="8" fill="#dfe6d3"/>
<g transform="translate(50 262) scale(1.3 1.3)"><ellipse cx="0" cy="0" rx="20" ry="13" fill="#7d7f86"/><path d="M-18 -2 L-28 -6 L-26 4 Z" fill="#5f6168"/><ellipse cx="-2" cy="6" rx="14" ry="6" fill="#c9b48a"/><path d="M-10 4 l3 3 M-4 4 l3 3 M2 4 l3 3 M8 4 l3 3" stroke="#5f6168" stroke-width="1.5"/><path d="M-12 -4 l14 -2 M-12 0 l14 -2" stroke="#fffaf0" stroke-width="1.5"/><circle cx="16" cy="-12" r="8" fill="#7d7f86"/><path d="M14 -19 q-1 -6 5 -6 q-3 1 -3 6 Z" fill="#4a4a4a"/><circle cx="19" cy="-13" r="1.6" fill="#111"/><path d="M23 -12 l4 1 l-4 2 Z" fill="#333"/><path d="M2 12 l-2 8 M8 12 l2 8" stroke="#6b4f35" stroke-width="2"/></g>
<text x="90" y="248" font-size="14" fill="#2f3a2b" text-anchor="start">Female: plain grey brown face,</text>
<text x="90" y="268" font-size="14" fill="#2f3a2b" text-anchor="start">small plume, no black face (80%)</text>
</svg>
