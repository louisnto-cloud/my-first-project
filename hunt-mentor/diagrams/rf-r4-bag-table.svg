<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 606" font-family="sans-serif" role="img" aria-label="Tiles of bag limits from the Region 4 season table, pages 39 and 40. NBL means no bag limit; 5 (15) means 5 a day and 15 in possession. Elk 1, moose 1, mountain goat 1, black bear 2. Wolf: no bag limit or 3 depending on the Management Unit group. Lynx 1, bobcat 1, cougar 1 or 2 by group. No bag limit for coyote, Columbian ground squirrel, raccoon and skunk. Snowshoe hare 10 a day. Grouse 5 a day, 15 in possession. Pheasant cocks 3 a day, possession 6, season 12. Ptarmigan 10 (30). Turkey: spring bearded 1, fall and bow rows the merged cell *2. Doves 5 (15). Ducks 8 (24). Canada and cackling geese, snipe and coots 10 (30). Snow, Ross&#x27;s and white fronted geese 5 (15).">
