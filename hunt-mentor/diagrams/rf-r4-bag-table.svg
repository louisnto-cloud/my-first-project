<text x="200" y="302" font-size="14" fill="#23261f" text-anchor="middle">cougar, by MU</text>
<text x="200" y="320" font-size="14" fill="#23261f" text-anchor="middle">group</text>
<rect x="270" y="246" width="124" height="102" rx="10" fill="#ffffff" stroke="#8b5a2b" stroke-width="2.5"/>
<text x="332" y="280" font-size="26" fill="#8b5a2b" text-anchor="middle" font-weight="bold">NBL</text>
<text x="332" y="302" font-size="14" fill="#23261f" text-anchor="middle">coyote, ground</text>
<text x="332" y="320" font-size="14" fill="#23261f" text-anchor="middle">squirrel,</text>
<text x="332" y="338" font-size="14" fill="#23261f" text-anchor="middle">raccoon, skunk</text>
<rect x="6" y="356" width="124" height="102" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
