<text x="68" y="522" font-size="14" fill="#23261f" text-anchor="middle">ptarmigan</text>
<rect x="138" y="466" width="124" height="102" rx="10" fill="#ffffff" stroke="#8a9a6b" stroke-width="2.5"/>
<text x="200" y="500" font-size="26" fill="#8a9a6b" text-anchor="middle" font-weight="bold">1 / *2</text>
