<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 690" role="img" aria-label="Tiles of bag limits from the Region 4 season table. Elk 1, moose 1, mountain goat 1, black bear 2. Wolf: no bag limit or 3 depending on the Management Unit group. Lynx 1, bobcat 1, cougar 1 or 2 by group. No bag limit for coyote, Columbian ground squirrel, raccoon and skunk. Snowshoe hare 10 a day. Grouse 5 a day, 15 in possession. Pheasant cocks 3 a day, possession 6, season 12. Ptarmigan 10 (30). Turkey: spring bearded 1, fall and bow rows the merged cell *2. Doves 5 (15). Ducks 8 (24). Canada and cackling geese, snipe and coots 10 (30). Snow, Ross&#x27;s and white fronted geese 5 (15)." font-family="sans-serif">
<rect x="0" y="0" width="400" height="690" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Bag limits from the season table</text>
<text x="200" y="46" font-size="14" fill="#6b6f66" text-anchor="middle">NBL: No Bag Limit. 5 (15): 5 a day, 15 in</text>
<text x="200" y="64" font-size="14" fill="#6b6f66" text-anchor="middle">possession.</text>
<rect x="6" y="80" width="124" height="66" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<text x="68" y="114" font-size="26" fill="#e8590c" text-anchor="middle" font-weight="bold">1</text>
