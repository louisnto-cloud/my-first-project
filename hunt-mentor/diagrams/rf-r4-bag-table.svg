<text x="200" y="210" font-size="14" fill="#23261f" text-anchor="middle">wolf, by MU</text>
<text x="200" y="228" font-size="14" fill="#23261f" text-anchor="middle">group</text>
<rect x="270" y="154" width="124" height="84" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<text x="332" y="188" font-size="26" fill="#e8590c" text-anchor="middle" font-weight="bold">1</text>
<text x="332" y="210" font-size="14" fill="#23261f" text-anchor="middle">lynx</text>
<rect x="6" y="246" width="124" height="102" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<text x="68" y="280" font-size="26" fill="#e8590c" text-anchor="middle" font-weight="bold">1</text>
<text x="68" y="302" font-size="14" fill="#23261f" text-anchor="middle">bobcat</text>
