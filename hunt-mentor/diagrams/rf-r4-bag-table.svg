<rect x="6" y="576" width="124" height="102" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<text x="68" y="610" font-size="26" fill="#4a7fb0" text-anchor="middle" font-weight="bold">8 (24)</text>
<text x="68" y="632" font-size="14" fill="#23261f" text-anchor="middle">ducks</text>
<rect x="138" y="576" width="124" height="102" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<text x="200" y="610" font-size="18" fill="#4a7fb0" text-anchor="middle" font-weight="bold">10 (30)</text>
<text x="200" y="632" font-size="14" fill="#23261f" text-anchor="middle">Canada and</text>
<text x="200" y="650" font-size="14" fill="#23261f" text-anchor="middle">cackling geese,</text>
<text x="200" y="668" font-size="14" fill="#23261f" text-anchor="middle">snipe, coots</text>
<rect x="270" y="576" width="124" height="102" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<text x="332" y="610" font-size="26" fill="#4a7fb0" text-anchor="middle" font-weight="bold">5 (15)</text>
<text x="332" y="632" font-size="14" fill="#23261f" text-anchor="middle">snow, Ross&#x27;s,</text>
<text x="332" y="650" font-size="14" fill="#23261f" text-anchor="middle">white fronted</text>
<text x="332" y="668" font-size="14" fill="#23261f" text-anchor="middle">geese</text>
</svg>
