<text x="200" y="114" font-size="26" fill="#e8590c" text-anchor="middle" font-weight="bold">1</text>
<text x="200" y="136" font-size="14" fill="#23261f" text-anchor="middle">moose</text>
<rect x="270" y="80" width="124" height="66" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<text x="332" y="114" font-size="26" fill="#e8590c" text-anchor="middle" font-weight="bold">1</text>
<text x="332" y="136" font-size="14" fill="#23261f" text-anchor="middle">mountain goat</text>
<rect x="6" y="154" width="124" height="84" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<text x="68" y="188" font-size="26" fill="#e8590c" text-anchor="middle" font-weight="bold">2</text>
