<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 510" font-family="sans-serif" role="img" aria-label="A 100 metre ring, 109 yards, around an occupied house. A deer inside the ring: no hunting and no shooting. A deer outside the ring: check the other rules. The ring counts around an occupied dwelling house, a farm or ranch building with people or domestic animals, a church, a school building or school yard, a playground and a regional district park. Owner permission does not lift it.">
<rect width="400" height="510" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="250" rx="10" fill="#e6e9d4"/>
<path d="M98 242 l2 -6 M102 242 l0 -7 M106 242 l-2 -6" stroke="#a9b37f" stroke-width="1.3" fill="none"/><path d="M61 185 l2 -6 M65 185 l0 -7 M69 185 l-2 -6" stroke="#a9b37f" stroke-width="1.3" fill="none"/><path d="M46 84 l2 -6 M50 84 l0 -7 M54 84 l-2 -6" stroke="#a9b37f" stroke-width="1.3" fill="none"/><path d="M86 213 l2 -6 M90 213 l0 -7 M94 213 l-2 -6" stroke="#a9b37f" stroke-width="1.3" fill="none"/><path d="M47 82 l2 -6 M51 82 l0 -7 M55 82 l-2 -6" stroke="#a9b37f" stroke-width="1.3" fill="none"/><path d="M21 89 l2 -6 M25 89 l0 -7 M29 89 l-2 -6" stroke="#a9b37f" stroke-width="1.3" fill="none"/><path d="M110 248 l2 -6 M114 248 l0 -7 M118 248 l-2 -6" stroke="#a9b37f" stroke-width="1.3" fill="none"/><path d="M37 166 l2 -6 M41 166 l0 -7 M45 166 l-2 -6" stroke="#a9b37f" stroke-width="1.3" fill="none"/><path d="M349 158 l2 -6 M353 158 l0 -7 M357 158 l-2 -6" stroke="#a9b37f" stroke-width="1.3" fill="none"/><path d="M67 44 l2 -6 M71 44 l0 -7 M75 44 l-2 -6" stroke="#a9b37f" stroke-width="1.3" fill="none"/><path d="M86 238 l2 -6 M90 238 l0 -7 M94 238 l-2 -6" stroke="#a9b37f" stroke-width="1.3" fill="none"/><path d="M64 198 l2 -6 M68 198 l0 -7 M72 198 l-2 -6" stroke="#a9b37f" stroke-width="1.3" fill="none"/><path d="M50 182 l2 -6 M54 182 l0 -7 M58 182 l-2 -6" stroke="#a9b37f" stroke-width="1.3" fill="none"/><path d="M275 239 l2 -6 M279 239 l0 -7 M283 239 l-2 -6" stroke="#a9b37f" stroke-width="1.3" fill="none"/><path d="M328 141 l2 -6 M332 141 l0 -7 M336 141 l-2 -6" stroke="#a9b37f" stroke-width="1.3" fill="none"/><path d="M88 63 l2 -6 M92 63 l0 -7 M96 63 l-2 -6" stroke="#a9b37f" stroke-width="1.3" fill="none"/><path d="M41 229 l2 -6 M45 229 l0 -7 M49 229 l-2 -6" stroke="#a9b37f" stroke-width="1.3" fill="none"/>
<g data-tip="The 100 m ring|No hunting or shooting within 100 m (109 yd) of an occupied house, farm or ranch building, church, school, playground or regional district park (99%, synopsis page 10).">
<circle cx="196" cy="128" r="98" fill="#e8590c" fill-opacity=".12" stroke="#e8590c" stroke-width="2.6" stroke-dasharray="8 5"/>
</g>
<g data-tip="Occupied|Occupied means by people or domestic animals. Animals in a barn count (99%). Your brother's house counts, even with his OK (95%, my reading).">
<g transform="translate(196 136) scale(1.15)"><path d="M10 -26 C14 -32 8 -36 12 -42 M16 -26 C20 -33 14 -37 18 -44" stroke="#9a9a8a" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="8" y="-30" width="7" height="12" fill="#6b4f35"/><rect x="-20" y="-14" width="40" height="28" fill="#f3ead8" stroke="#2f3a2b" stroke-width="1.4"/><path d="M-25 -12 L0 -32 L25 -12z" fill="#8b5a2b" stroke="#2f3a2b" stroke-width="1.4"/><rect x="-4" y="0" width="9" height="14" fill="#6b4f35"/><rect x="-16" y="-6" width="9" height="8" fill="#9cc0dc" stroke="#2f3a2b" stroke-width="1"/><rect x="9" y="-6" width="9" height="8" fill="#9cc0dc" stroke="#2f3a2b" stroke-width="1"/></g>
</g>
<g data-tip="100 m (109 yd)|100 m is close: a rifle bullet travels kilometres. Rangefind the house from each likely stand and mark a 100 m ring on your phone map (Tip).">
<line x1="226" y1="150" x2="286" y2="150" stroke="#2f3a2b" stroke-width="2"/><path d="M293.0 150.0 L283.0 144.5 L283.0 155.5z" fill="#2f3a2b"/>
<text x="246" y="176" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">100 m</text>
<text x="246" y="194" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">(109 yd)</text>
</g>
<text x="196" y="82" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle" stroke="#e6e9d4" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">occupied</text>
<g data-tip="Inside the ring|No hunting and no shooting inside it (99%).">
<g transform="translate(138 166) scale(-1.15 1.15)"><path d="M-8 -18 L-10 0 M-4 -18 L-3 0 M12 -18 L13 0 M16 -18 L18 0" stroke="#5a3e26" stroke-width="2.4" stroke-linecap="round"/><path d="M-12 -28 C-12 -34 -4 -34 6 -34 C14 -34 20 -32 20 -26 C20 -20 16 -17 8 -17 L-6 -17 C-10 -17 -12 -21 -12 -28z" fill="#9a7350"/><path d="M-10 -30 L-16 -42 L-12 -44 L-6 -32z" fill="#9a7350"/><path d="M-16 -42 C-20 -43 -24 -40 -24 -38 L-20 -37 C-17 -37 -14 -39 -13 -41z" fill="#9a7350"/><path d="M-14 -44 L-18 -50 L-12 -45z M-12 -44 L-9 -50 L-10 -44z" fill="#9a7350"/><ellipse cx="18" cy="-27" rx="3" ry="4" fill="#f3ead8"/><circle cx="-18" cy="-41" r=".9" fill="#111"/></g>
<circle cx="138" cy="142" r="30" fill="none" stroke="#c0392b" stroke-width="3.4"/><path d="M117 121 L159 163" stroke="#c0392b" stroke-width="3.4"/>
<text x="138" y="188" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle" stroke="#e6e9d4" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">NO</text>
</g>
<g data-tip="Outside the ring|Other rules still apply. Private land needs permission, and hunting cultivated land without the owner's consent is unlawful (99%).">
<g transform="translate(350 128) scale(1.15 1.15)"><path d="M-8 -18 L-10 0 M-4 -18 L-3 0 M12 -18 L13 0 M16 -18 L18 0" stroke="#5a3e26" stroke-width="2.4" stroke-linecap="round"/><path d="M-12 -28 C-12 -34 -4 -34 6 -34 C14 -34 20 -32 20 -26 C20 -20 16 -17 8 -17 L-6 -17 C-10 -17 -12 -21 -12 -28z" fill="#9a7350"/><path d="M-10 -30 L-16 -42 L-12 -44 L-6 -32z" fill="#9a7350"/><path d="M-16 -42 C-20 -43 -24 -40 -24 -38 L-20 -37 C-17 -37 -14 -39 -13 -41z" fill="#9a7350"/><path d="M-14 -44 L-18 -50 L-12 -45z M-12 -44 L-9 -50 L-10 -44z" fill="#9a7350"/><ellipse cx="18" cy="-27" rx="3" ry="4" fill="#f3ead8"/><circle cx="-18" cy="-41" r=".9" fill="#111"/></g>
<text x="386" y="42" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="end" stroke="#e6e9d4" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">outside</text>
<text x="386" y="60" font-size="14" fill="#2f3a2b" text-anchor="end" stroke="#e6e9d4" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">check other rules</text>
</g>
<text x="14" y="280" font-size="16" font-weight="bold" fill="#2f3a2b">Counts within 100 m of:</text>
<rect x="8.0" y="290" width="124" height="88" rx="8" fill="#f4eedf"/>
<g transform="translate(70.0 324)" stroke="#2f3a2b" stroke-width="1.4" stroke-linejoin="round"><rect x="-14" y="-8" width="28" height="20" fill="#f3ead8"/><path d="M-18 -6 L0 -20 L18 -6z" fill="#8b5a2b"/><rect x="-3" y="2" width="7" height="10" fill="#6b4f35"/><path d="M8 -22 C11 -25 7 -27 10 -29" stroke="#9a9a8a" stroke-width="1.8" fill="none"/></g>
<text x="70" y="356" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">House</text>
<text x="70" y="372" font-size="14" fill="#6b5b4b" text-anchor="middle">lived in</text>
<g data-tip="Farm or ranch building|Barns or sheds with animals inside count too (99%).">
<rect x="138.0" y="290" width="124" height="88" rx="8" fill="#f4eedf"/>
<g transform="translate(200.0 324)" stroke="#2f3a2b" stroke-width="1.4" stroke-linejoin="round"><path d="M-18 12 V-6 L-10 -16 H10 L18 -6 V12z" fill="#b3261e"/><path d="M-6 12 V0 H6 V12 M-6 0 L6 12 M6 0 L-6 12" stroke="#fffaf0" stroke-width="1.6" fill="none"/><path d="M-18 -6 H18" stroke="#fffaf0" stroke-width="1.4"/></g>
<text x="200" y="356" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Farm or ranch</text>
<text x="200" y="372" font-size="14" fill="#6b5b4b" text-anchor="middle">people or animals</text>
</g>
<rect x="268.0" y="290" width="124" height="88" rx="8" fill="#f4eedf"/>
<g transform="translate(330.0 324)" stroke="#2f3a2b" stroke-width="1.4" stroke-linejoin="round"><rect x="-14" y="-4" width="28" height="16" fill="#f3ead8"/><path d="M-6 -4 V-16 L0 -22 L6 -16 V-4z" fill="#f3ead8"/><path d="M0 -24 V-32 M-3.5 -29 H3.5" stroke-width="2"/><path d="M-3 12 V4 A3 3 0 0 1 3 4 V12z" fill="#6b4f35"/></g>
<text x="330" y="356" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Church</text>
<rect x="8.0" y="382" width="124" height="88" rx="8" fill="#f4eedf"/>
<g transform="translate(70.0 416)" stroke="#2f3a2b" stroke-width="1.4" stroke-linejoin="round"><rect x="-18" y="-6" width="36" height="18" fill="#f2d49b"/><path d="M-20 -6 L0 -16 L20 -6z" fill="#8b5a2b"/><path d="M0 -16 V-30" stroke-width="1.6"/><path d="M0 -30 H10 V-24 H0z" fill="#e8590c"/><rect x="-13" y="-1" width="6" height="6" fill="#9cc0dc"/><rect x="7" y="-1" width="6" height="6" fill="#9cc0dc"/><rect x="-3" y="2" width="6" height="10" fill="#6b4f35"/></g>
<text x="70" y="448" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">School</text>
<text x="70" y="464" font-size="14" fill="#6b5b4b" text-anchor="middle">or school yard</text>
<rect x="138.0" y="382" width="124" height="88" rx="8" fill="#f4eedf"/>
<g transform="translate(200.0 416)" stroke="#2f3a2b" stroke-width="1.4" stroke-linejoin="round"><path d="M-16 12 L-8 -16 L0 12 M-12 -2 H-4" fill="none" stroke-width="2"/><path d="M-8 -16 H2 C10 -16 12 4 20 12" fill="none" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><path d="M-16 12 H20" stroke-width="1.6"/></g>
<text x="200" y="448" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Playground</text>
<g data-tip="Regional district park|Most regional district parks also ban firearm and bow discharge (99%, page 9).">
<rect x="268.0" y="382" width="124" height="88" rx="8" fill="#f4eedf"/>
<g transform="translate(330.0 416)" stroke="#2f3a2b" stroke-width="1.4" stroke-linejoin="round"><path d="M-8 12 V2" stroke="#6b4f35" stroke-width="3"/><circle cx="-8" cy="-8" r="11" fill="#6f8a5a"/><path d="M4 6 H20 M6 6 V12 M18 6 V12 M4 2 H20" stroke="#6b4f35" stroke-width="2.4"/></g>
<text x="330" y="448" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Regional</text>
<text x="330" y="464" font-size="14" fill="#6b5b4b" text-anchor="middle">district park</text>
</g>
<text data-tip="Permission does not lift it|The only owner exemption is slaughtering their own livestock near their buildings. It is not for hunting (95%, my reading)." x="200" y="496" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Permission does not lift it.</text>
</svg>
