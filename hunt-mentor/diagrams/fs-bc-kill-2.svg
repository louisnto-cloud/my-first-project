<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Kill site step 2: move the meat at least 200 metres from the gut pile. Bears often go to the gut pile first.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">2. Meat 200 m from the guts</text><rect x="0" y="230" width="400" height="70" rx="0" fill="#dfe6d3"/><ellipse cx="70" cy="222" rx="30" ry="10" fill="#7a3b2a"/><text x="70" y="250" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">gut pile</text><line x1="110" y1="200" x2="290" y2="200" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><text x="200" y="190" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">200 m or more</text><rect x="310" y="150" width="50" height="70" rx="6" fill="#ffffff" stroke="#9a9a8f" stroke-width="2"/><text x="335" y="250" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">meat</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Separate meat from guts</text>
</svg>
