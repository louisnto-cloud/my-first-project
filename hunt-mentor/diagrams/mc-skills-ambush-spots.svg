<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Six places where trails squeeze and make good ambush points: a saddle, a low gap in a ridge; a funnel, a narrow strip of cover; a creek crossing at an easy bank; a field corner nearest thick cover; a bench, a flat step on a slope; a trail junction where two routes meet. Pushed game heads for steep, thick ground far from roads.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Where trails squeeze (Tip)</text><rect x="14" y="44" width="182" height="68" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="38" cy="78" r="13" fill="#e8590c"/><text x="38" y="83" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">1</text><text x="60" y="74" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Saddle</text><text x="60" y="94" font-size="14" fill="#23261f" text-anchor="start">low gap in a ridge</text><rect x="204" y="44" width="182" height="68" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="228" cy="78" r="13" fill="#e8590c"/><text x="228" y="83" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">2</text><text x="250" y="74" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Funnel</text><text x="250" y="94" font-size="14" fill="#23261f" text-anchor="start">narrow strip of cover</text><rect x="14" y="122" width="182" height="68" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="38" cy="156" r="13" fill="#e8590c"/><text x="38" y="161" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">3</text><text x="60" y="152" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Creek crossing</text><text x="60" y="172" font-size="14" fill="#23261f" text-anchor="start">easy bank</text><rect x="204" y="122" width="182" height="68" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="228" cy="156" r="13" fill="#e8590c"/><text x="228" y="161" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">4</text><text x="250" y="152" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Field corner</text><text x="250" y="172" font-size="14" fill="#23261f" text-anchor="start">nearest thick cover</text><rect x="14" y="200" width="182" height="68" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="38" cy="234" r="13" fill="#e8590c"/><text x="38" y="239" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">5</text><text x="60" y="230" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Bench</text><text x="60" y="250" font-size="14" fill="#23261f" text-anchor="start">flat step on a slope</text><rect x="204" y="200" width="182" height="68" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="228" cy="234" r="13" fill="#e8590c"/><text x="228" y="239" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">6</text><text x="250" y="230" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Trail junction</text><text x="250" y="250" font-size="14" fill="#23261f" text-anchor="start">two routes meet</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Pushed game: steep, thick, far from roads (Tip)</text>
</svg>
