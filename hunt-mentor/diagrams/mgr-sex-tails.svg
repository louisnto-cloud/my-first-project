<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Ruffed grouse tails fanned out. Male: the dark band near the tip runs unbroken across the tail, rump feathers show 2 pale dots, and the middle tail feather is 15 centimetres or longer. Female: the band is broken or washed out in the middle, rump feathers show 1 dot, and the middle tail feather is under 14 centimetres. Other grouse: a spruce grouse male has a black tail and the hen a mottled tail; a sharp tailed male has long white lines on the middle tail feathers." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Ruffed grouse: rooster or hen?</text>
<text x="100" y="52" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Male</text>
<text x="300" y="52" font-size="16" fill="#c23b22" text-anchor="middle" font-weight="bold">Female</text>
<line x1="100" y1="140" x2="59.0" y2="108.0" stroke="#9a6b45" stroke-width="12" stroke-linecap="round"/><line x1="100" y1="140" x2="67.3" y2="99.6" stroke="#9a6b45" stroke-width="12" stroke-linecap="round"/><line x1="100" y1="140" x2="77.2" y2="93.3" stroke="#9a6b45" stroke-width="12" stroke-linecap="round"/><line x1="100" y1="140" x2="88.3" y2="89.3" stroke="#9a6b45" stroke-width="12" stroke-linecap="round"/><line x1="100" y1="140" x2="100.0" y2="88.0" stroke="#9a6b45" stroke-width="12" stroke-linecap="round"/><line x1="100" y1="140" x2="111.7" y2="89.3" stroke="#9a6b45" stroke-width="12" stroke-linecap="round"/><line x1="100" y1="140" x2="122.8" y2="93.3" stroke="#9a6b45" stroke-width="12" stroke-linecap="round"/><line x1="100" y1="140" x2="132.7" y2="99.6" stroke="#9a6b45" stroke-width="12" stroke-linecap="round"/><line x1="100" y1="140" x2="141.0" y2="108.0" stroke="#9a6b45" stroke-width="12" stroke-linecap="round"/><path d="M56 118 A 50 50 0 0 1 144 118" fill="none" stroke="#23261f" stroke-width="7"/>
<line x1="300" y1="140" x2="259.0" y2="108.0" stroke="#9a6b45" stroke-width="12" stroke-linecap="round"/><line x1="300" y1="140" x2="267.3" y2="99.6" stroke="#9a6b45" stroke-width="12" stroke-linecap="round"/><line x1="300" y1="140" x2="277.2" y2="93.3" stroke="#9a6b45" stroke-width="12" stroke-linecap="round"/><line x1="300" y1="140" x2="288.3" y2="89.3" stroke="#9a6b45" stroke-width="12" stroke-linecap="round"/><line x1="300" y1="140" x2="300.0" y2="88.0" stroke="#9a6b45" stroke-width="12" stroke-linecap="round"/><line x1="300" y1="140" x2="311.7" y2="89.3" stroke="#9a6b45" stroke-width="12" stroke-linecap="round"/><line x1="300" y1="140" x2="322.8" y2="93.3" stroke="#9a6b45" stroke-width="12" stroke-linecap="round"/><line x1="300" y1="140" x2="332.7" y2="99.6" stroke="#9a6b45" stroke-width="12" stroke-linecap="round"/><line x1="300" y1="140" x2="341.0" y2="108.0" stroke="#9a6b45" stroke-width="12" stroke-linecap="round"/><path d="M256 118 A 50 50 0 0 1 286 94" fill="none" stroke="#23261f" stroke-width="7"/><path d="M314 94 A 50 50 0 0 1 344 118" fill="none" stroke="#23261f" stroke-width="7"/>
<text x="100" y="172" font-size="14" fill="#23261f" text-anchor="middle">Band unbroken</text>
<text x="100" y="190" font-size="14" fill="#23261f" text-anchor="middle">2 dots on rump feathers</text>
<text x="100" y="208" font-size="14" fill="#23261f" text-anchor="middle">Middle tail 15 cm or more</text>
<text x="300" y="172" font-size="14" fill="#23261f" text-anchor="middle">Band broken in the middle</text>
<text x="300" y="190" font-size="14" fill="#23261f" text-anchor="middle">1 dot on rump feathers</text>
<text x="300" y="208" font-size="14" fill="#23261f" text-anchor="middle">Middle tail under 14 cm</text>
<rect x="10" y="238" width="380" height="54" rx="8" fill="#f4efe2" stroke="#8a9a6b" stroke-width="2"/>
<text x="200" y="260" font-size="14" fill="#23261f" text-anchor="middle">Other grouse: spruce male tail black, hen mottled.</text>
<text x="200" y="278" font-size="14" fill="#23261f" text-anchor="middle">Sharp tail male: long white lines on middle feathers.</text>
</svg>
