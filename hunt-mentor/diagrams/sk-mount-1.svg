<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Seen from above: two feet about shoulder width apart, the front foot turned about 45 degrees toward the bird, knees soft so the hips can turn.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">1  Feet: front foot toward the bird</text><line x1="200" y1="120" x2="300.0" y2="50.0" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><path d="M295.6 57.9 L300.0 50.0 L291.1 51.4" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="306" y="50" font-size="15" font-weight="bold" fill="#e8590c">Bird</text><g transform="translate(180 170) rotate(45)"><ellipse cx="0" cy="0" rx="13" ry="28" fill="#2f3a2b"/></g><g transform="translate(130 210) rotate(80)"><ellipse cx="0" cy="0" rx="13" ry="28" fill="#2f3a2b"/></g><line x1="130" y1="250" x2="180" y2="250" stroke="#23261f" stroke-width="2"/><line x1="130" y1="244" x2="130" y2="256" stroke="#23261f" stroke-width="2"/><line x1="180" y1="244" x2="180" y2="256" stroke="#23261f" stroke-width="2"/><text x="155" y="274" font-size="14" text-anchor="middle" fill="#23261f">shoulder width</text><text x="230" y="180" font-size="15" font-weight="bold" fill="#23261f">Front foot: toes</text><text x="230" y="198" font-size="15" fill="#23261f">about 45 degrees</text><text x="230" y="216" font-size="15" fill="#23261f">to the bird</text><text x="20" y="80" font-size="15" font-weight="bold" fill="#23261f">Knees soft.</text><text x="20" y="100" font-size="15" fill="#23261f">Hips turn to swing.</text><text x="200" y="294" font-size="13" text-anchor="middle" fill="#2f3a2b">Seen from above</text>
</svg>
