<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bars of how long to sit, hunter tips: a coyote calling stand about 20 to 30 minutes; a glassing seat about an hour, then glass it again (Kirchner, onX); a morning stand from first light to mid morning.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">How long to sit? (Tip)</text><text x="20" y="64" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Coyote stand</text><text x="380" y="64" font-size="14" fill="#23261f" text-anchor="end">20 to 30 min</text><rect x="20" y="74" width="360" height="22" rx="4" fill="#dfe6d3"/><rect x="20" y="74" width="50.0" height="22" rx="4" fill="#e8590c"/><text x="20" y="134" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Glassing seat</text><text x="380" y="134" font-size="14" fill="#23261f" text-anchor="end">1 hour, then again</text><rect x="20" y="144" width="360" height="22" rx="4" fill="#dfe6d3"/><rect x="20" y="144" width="120.0" height="22" rx="4" fill="#4a7fb0"/><text x="20" y="204" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Morning stand</text><text x="380" y="204" font-size="14" fill="#23261f" text-anchor="end">first light to mid morning</text><rect x="20" y="214" width="360" height="22" rx="4" fill="#dfe6d3"/><rect x="20" y="214" width="360.0" height="22" rx="4" fill="#8a9a6b"/><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Glassing hour: Kirchner, onX (65%)</text>
</svg>
