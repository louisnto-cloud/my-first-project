<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three columns of the never get lost system. Before you go: study the map, box yourself in with handrails, a backstop and a baseline, leave a trip plan, pin the truck. While walking: look back, check every 15 to 30 minutes, track time and pace, thumb the map. When unsure: stop, find your last sure point, go back or do the full STOP, never push on.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">The never get lost system</text><rect x="20" y="44" width="114" height="232" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="77" y="70" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Before</text><text x="77" y="104" font-size="14" fill="#23261f" text-anchor="middle">Study the map</text><text x="77" y="136" font-size="14" fill="#23261f" text-anchor="middle">Box: handrails,</text><text x="77" y="168" font-size="14" fill="#23261f" text-anchor="middle">backstop, baseline</text><text x="77" y="200" font-size="14" fill="#23261f" text-anchor="middle">Trip plan</text><text x="77" y="232" font-size="14" fill="#23261f" text-anchor="middle">Pin the truck</text><rect x="143" y="44" width="114" height="232" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="70" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Walking</text><text x="200" y="104" font-size="14" fill="#23261f" text-anchor="middle">Look back</text><text x="200" y="136" font-size="14" fill="#23261f" text-anchor="middle">Check every</text><text x="200" y="168" font-size="14" fill="#23261f" text-anchor="middle">15 to 30 min</text><text x="200" y="200" font-size="14" fill="#23261f" text-anchor="middle">Time and pace</text><text x="200" y="232" font-size="14" fill="#23261f" text-anchor="middle">Thumb the map</text><rect x="266" y="44" width="114" height="232" rx="8" fill="#f6d7c3" stroke="#8a9a6b" stroke-width="2"/><text x="323" y="70" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Unsure</text><text x="323" y="104" font-size="14" fill="#23261f" text-anchor="middle">Stop</text><text x="323" y="136" font-size="14" fill="#23261f" text-anchor="middle">Last sure point</text><text x="323" y="168" font-size="14" fill="#23261f" text-anchor="middle">Go back or</text><text x="323" y="200" font-size="14" fill="#23261f" text-anchor="middle">STOP fully</text><text x="323" y="232" font-size="14" fill="#23261f" text-anchor="middle">Never push on</text><text x="200" y="293" font-size="14" fill="#6b4f35" text-anchor="middle">Tip: orienteering and SAR habits, chapter 2</text>
</svg>
