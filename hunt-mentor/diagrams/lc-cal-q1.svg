<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 264" font-family="sans-serif" role="img" aria-label="January to March cards. January: the Hunter Sample Questionnaire comes; read your journal. February: spring LEH deadline 4 February 2027; clean and oil firearms and check scope mounts. March: licences expire 31 March and the Mandatory Hunter Report is due; look for shed antlers.">
