dth="3"/></g><text x="199.99999999999997" y="140" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Spring LEH</text><text x="199.99999999999997" y="157" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">deadline 4 Feb</text><text x="199.99999999999997" y="180" font-size="14" fill="#55663f" text-anchor="middle">Clean, oil,</text><text x="199.99999999999997" y="197" font-size="14" fill="#55663f" text-anchor="middle">check mounts</text><rect x="268.66666666666663" y="42" width="121.33333333333333" height="210" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><rect x="268.66666666666663" y="42" width="121.33333333333333" height="30" rx="10" fill="#2f3a2b"/><text x="329.3333333333333" y="63" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Mar</text><g transform="translate(329.3333333333333 100) scale(1.0)"><path d="M-14 -18 H8 L16 -10 V18 H-14 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -6 H10 M-8 2 H10 M-8 10 H4" stroke="#8a9a6b" stroke-width="2.5"/></g><text x="329.3333333333333" y="140" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Licences</text><text x="329.3333333333333" y="157" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">expire 31 Mar</text><text x="329.3333333333333" y="180" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Hunter Report</text><text x="329.3333333333333" y="197" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">due</text><text x="329.3333333333333" y="220" font-size="14" fill="#55663f" text-anchor="middle">Look for sheds</text>
