<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Light and tracks. With light from behind you the track looks flat and is hard to see. With low light from the side, shadows fill the print and it stands out. Get low and look toward the light.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Use the light</text>
<rect x="16" y="62" width="176" height="200" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><rect x="208" y="62" width="176" height="200" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="104" y="88" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">Light from behind you</text><text x="296" y="88" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Light low, from the side</text><ellipse cx="104" cy="170" rx="50" ry="30" fill="#d9c9a5"/><g transform="translate(104 170) rotate(0) scale(1.4)" fill="#cbb994"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><ellipse cx="296" cy="170" rx="50" ry="30" fill="#d9c9a5"/><g transform="translate(296 170) scale(1.4)"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z" fill="#6b5536"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z" fill="#a08a63"/></g><circle cx="370" cy="110" r="12" fill="#f2c94c"/><line x1="356" y1="116" x2="330" y2="140" stroke="#c98a1b" stroke-width="2"/><path d="M330.0 140.0 L333.7 130.7 L339.6 137.1 Z" fill="#c98a1b"/><text x="104" y="236" font-size="14" fill="#23261f" text-anchor="middle">flat, hard to see</text><text x="296" y="236" font-size="14" fill="#23261f" text-anchor="middle">shadows show it</text><text x="200" y="290" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Get low, look toward the light (65%)</text>
</svg>
