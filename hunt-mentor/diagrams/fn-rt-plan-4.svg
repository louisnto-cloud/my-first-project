<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Work out the time with Naismith, then add time for packs and dark.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c" stroke="none" stroke-width="2"/><text x="26" y="32" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="52" y="32" font-family="sans-serif" font-size="18" fill="#2f3a2b" text-anchor="start" font-weight="bold">Work out the time</text><rect x="40" y="60" width="320" height="170" rx="10" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="130" font-family="sans-serif" font-size="20" fill="#2f3a2b" text-anchor="middle" font-weight="bold">45 + 40 = 85 min</text><text x="200" y="165" font-family="sans-serif" font-size="15" fill="#e8590c" text-anchor="middle">plus 30% with a pack</text><text x="20" y="270" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Naismith, then add for packs and dark</text>
</svg>
