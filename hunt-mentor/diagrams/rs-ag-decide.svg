<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Decision flow. Sign found: fresher than 24 hours? Yes: hunt it at dawn or dusk with the wind right. No: log it and look for fresher sign. Lots of mixed age sign means the animals live here.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fresh enough to hunt?</text>
<rect x="100" y="60" width="200" height="40" rx="8" fill="#2f3a2b"/><text x="200" y="86" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Sign found</text><line x1="200" y1="100" x2="200" y2="122" stroke="#e8590c" stroke-width="3"/><path d="M200.0 122.0 L195.7 113.0 L204.3 113.0 Z" fill="#e8590c"/><rect x="80" y="124" width="240" height="40" rx="8" fill="#fff" stroke="#23261f" stroke-width="1.5"/><text x="200" y="150" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Fresher than 24 h?</text><line x1="140" y1="164" x2="90" y2="196" stroke="#e8590c" stroke-width="3"/><path d="M90.0 196.0 L95.2 187.5 L99.9 194.8 Z" fill="#e8590c"/><text x="96" y="182" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">yes</text><line x1="260" y1="164" x2="310" y2="196" stroke="#e8590c" stroke-width="3"/><path d="M310.0 196.0 L300.1 194.8 L304.8 187.5 Z" fill="#e8590c"/><text x="304" y="182" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">no</text><rect x="10" y="198" width="170" height="70" rx="8" fill="#e3eed8"/><text x="95" y="222" font-size="14" fill="#23261f" text-anchor="middle">Hunt it at dawn</text><text x="95" y="241" font-size="14" fill="#23261f" text-anchor="middle">or dusk, wind right</text><rect x="220" y="198" width="170" height="70" rx="8" fill="#f6e3d8"/><text x="305" y="222" font-size="14" fill="#23261f" text-anchor="middle">Log it. Look for</text><text x="305" y="241" font-size="14" fill="#23261f" text-anchor="middle">fresher sign</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Lots of mixed age sign: they live here</text>
</svg>
