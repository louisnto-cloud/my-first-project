<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 452" font-family="sans-serif" role="img" aria-label="Two kinds of motor vehicle closure. Type 1, Motor Vehicle Closed Area: no driving the vehicles it covers at all, hunter or not. Type 2, Motor Vehicle for Hunting Closed Area: you may drive, but not to hunt, and not to haul game, gear or hunters. Either can cover all vehicles, only ATVs (all terrain vehicles) and electric bicycles, or only snowmobiles, seasonal or all year. Closures include private land unless exempted. No sign does not mean no closure.">
<rect width="400" height="452" fill="#fffaf0"/>
<g data-tip="Type 1: Motor Vehicle Closed Area|No driving the vehicles it covers at all, hunter or not (99%, synopsis page 10).">
<rect x="8" y="8" width="384" height="140" rx="10" fill="#fffaf0" stroke="#c92a2a" stroke-width="2"/>
<path d="M18 8 H382 A10 10 0 0 1 392 18 V44 H8 V18 A10 10 0 0 1 18 8z" fill="#c92a2a"/>
<circle cx="30" cy="26" r="13" fill="#fffaf0"/><text x="30" y="32" font-size="17" font-weight="bold" fill="#c92a2a" text-anchor="middle">1</text>
<text x="52" y="32" font-size="17" font-weight="bold" fill="#fffaf0">Motor Vehicle Closed Area</text>
<rect x="16" y="128" width="190" height="4" fill="#cfc6b0"/>
<g transform="translate(80 128) scale(0.95 0.95)"><path d="M-40 -8 V-22 H2 V-34 C2 -36 4 -37 6 -37 H22 C25 -37 27 -36 28 -33 L33 -22 H38 C40 -22 41 -21 41 -19 V-8z" fill="#3d5a80"/><path d="M8 -33 H21 C22 -33 23 -32 24 -31 L28 -23 H8z" fill="#c9d6e0"/><rect x="-40" y="-24" width="40" height="3" fill="#00000030"/><rect x="38" y="-17" width="4" height="4" rx="1" fill="#f3e7b3"/><circle cx="-26" cy="-6" r="8.5" fill="#2b2b2b"/><circle cx="-26" cy="-6" r="3.6" fill="#a8a8a8"/><circle cx="25" cy="-6" r="8.5" fill="#2b2b2b"/><circle cx="25" cy="-6" r="3.6" fill="#a8a8a8"/></g>
<g transform="translate(162 128) scale(0.95)"><path d="M-20 -16 H-4 L0 -22 H10 L14 -16 H22 L20 -9 H-22z" fill="#5c7a3a"/><path d="M12 -22 L16 -30 M12 -30 H20" stroke="#2b2b2b" stroke-width="2.4" stroke-linecap="round"/><rect x="-6" y="-26" width="12" height="4" rx="2" fill="#2b2b2b"/><circle cx="-14" cy="-7" r="7.5" fill="#2b2b2b"/><circle cx="-14" cy="-7" r="3" fill="#a8a8a8"/><circle cx="15" cy="-7" r="7.5" fill="#2b2b2b"/><circle cx="15" cy="-7" r="3" fill="#a8a8a8"/></g>
<circle cx="120" cy="92" r="42" fill="none" opacity="0.9" stroke="#c92a2a" stroke-width="4"/><line x1="90.3" y1="121.7" x2="149.7" y2="62.3" stroke="#c92a2a" stroke-width="4"/>
<text x="222" y="86" font-size="20" font-weight="bold" fill="#c92a2a">No driving</text>
<text x="222" y="110" font-size="20" font-weight="bold" fill="#c92a2a">at all</text>
</g>
<g data-tip="Type 2: Motor Vehicle for Hunting Closed Area|You may drive, but not to hunt, not to haul game, gear or hunters, and not to get hunters to the animals (99%, page 10).">
<rect x="8" y="158" width="384" height="140" rx="10" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/>
<path d="M18 158 H382 A10 10 0 0 1 392 168 V194 H8 V168 A10 10 0 0 1 18 158z" fill="#e8590c"/>
<circle cx="30" cy="176" r="13" fill="#fffaf0"/><text x="30" y="182" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">2</text>
<text x="52" y="182" font-size="15" font-weight="bold" fill="#fffaf0">Motor Vehicle for Hunting Closed Area</text>
<rect x="16" y="278" width="190" height="4" fill="#cfc6b0"/>
<g transform="translate(70 278) scale(0.95 0.95)"><path d="M-40 -8 V-22 H2 V-34 C2 -36 4 -37 6 -37 H22 C25 -37 27 -36 28 -33 L33 -22 H38 C40 -22 41 -21 41 -19 V-8z" fill="#3d5a80"/><path d="M8 -33 H21 C22 -33 23 -32 24 -31 L28 -23 H8z" fill="#c9d6e0"/><rect x="-40" y="-24" width="40" height="3" fill="#00000030"/><rect x="38" y="-17" width="4" height="4" rx="1" fill="#f3e7b3"/><circle cx="-26" cy="-6" r="8.5" fill="#2b2b2b"/><circle cx="-26" cy="-6" r="3.6" fill="#a8a8a8"/><circle cx="25" cy="-6" r="8.5" fill="#2b2b2b"/><circle cx="25" cy="-6" r="3.6" fill="#a8a8a8"/></g>
<circle cx="70" cy="228" r="12" fill="#2f6e3b"/><path d="M65.0 229.0 l4.2 4.2 l8.5 -9.3" fill="none" stroke="#fffaf0" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(170 276) scale(0.85 0.85)"><path d="M-8 -18 L-10 0 M-4 -18 L-3 0 M12 -18 L13 0 M16 -18 L18 0" stroke="#5a3e26" stroke-width="2.4" stroke-linecap="round"/><path d="M-12 -28 C-12 -34 -4 -34 6 -34 C14 -34 20 -32 20 -26 C20 -20 16 -17 8 -17 L-6 -17 C-10 -17 -12 -21 -12 -28z" fill="#9a7350"/><path d="M-10 -30 L-16 -42 L-12 -44 L-6 -32z" fill="#9a7350"/><path d="M-16 -42 C-20 -43 -24 -40 -24 -38 L-20 -37 C-17 -37 -14 -39 -13 -41z" fill="#9a7350"/><path d="M-14 -44 L-18 -50 L-12 -45z M-12 -44 L-9 -50 L-10 -44z" fill="#9a7350"/><ellipse cx="18" cy="-27" rx="3" ry="4" fill="#f3ead8"/><circle cx="-18" cy="-41" r=".9" fill="#111"/></g>
<g transform="translate(170 222) rotate(-10) scale(0.75)"><path d="M-26 -1 L-8 -3 L-6 -1 L26 -1 V1.5 L-4 1.5 L-10 6 L-24 6 L-26 3z" fill="#3b2a1a"/><rect x="-2" y="-5" width="12" height="3" rx="1" fill="#2b2b2b"/></g>
<circle cx="170" cy="242" r="34" fill="none" stroke="#c92a2a" stroke-width="4"/><line x1="146.2" y1="265.8" x2="193.8" y2="218.2" stroke="#c92a2a" stroke-width="4"/>
<text x="222" y="230" font-size="20" font-weight="bold" fill="#2f3a2b">Drive: yes</text>
<text x="222" y="256" font-size="20" font-weight="bold" fill="#c2410c">Hunt: no</text>
<text x="222" y="278" font-size="14" fill="#2f3a2b">no game, gear, hunters</text>
</g>
<text x="200" y="324" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Either type can cover:</text>
<g font-size="14" fill="#2f3a2b" text-anchor="middle" data-tip="Which vehicles|Either type can cover all motor vehicles, or only ATVs (all terrain vehicles) and electric bicycles, or only snowmobiles (99%). Under the regulation, an ATV includes a dirt bike (99%).">
<rect x="10" y="334" width="120" height="44" rx="8" fill="#f2ecdd" stroke="#c9bb9c"/><text x="70" y="361" font-weight="bold">All vehicles</text>
<rect x="140" y="334" width="120" height="44" rx="8" fill="#f2ecdd" stroke="#c9bb9c"/><text x="200" y="361" font-weight="bold">ATV, e bike</text>
<rect x="270" y="334" width="120" height="44" rx="8" fill="#f2ecdd" stroke="#c9bb9c"/><text x="330" y="361" font-weight="bold">Snowmobile</text>
</g>
<g font-size="14" text-anchor="middle">
<g data-tip="Seasonal or all year|Either type can be seasonal or all year (99%, page 10). Check the dates on the closure's line in your region's pages.">
<rect x="10" y="388" width="120" height="54" rx="8" fill="#fffaf0" stroke="#2f3a2b" stroke-width="1.5"/><text x="70" y="410" font-weight="bold" fill="#2f3a2b">Seasonal or</text><text x="70" y="428" font-weight="bold" fill="#2f3a2b">all year</text>
</g>
<g data-tip="Private land too|Unless exempted, closures include private land. Unless included, they do not cover highways (99%, page 10).">
<rect x="140" y="388" width="120" height="54" rx="8" fill="#fffaf0" stroke="#2f3a2b" stroke-width="1.5"/><text x="200" y="410" font-weight="bold" fill="#2f3a2b">Private land</text><text x="200" y="428" font-weight="bold" fill="#2f3a2b">too</text>
</g>
<g data-tip="No sign?|No sign does not mean no closure. Spotting a closure is the hunter&apos;s job, sign or not. Region maps are online (99%).">
<rect x="270" y="388" width="120" height="54" rx="8" fill="#fbe3e3" stroke="#c92a2a" stroke-width="1.5"/><text x="330" y="410" font-weight="bold" fill="#c92a2a">No sign?</text><text x="330" y="428" font-weight="bold" fill="#c92a2a">Check maps</text>
</g>
</g>
</svg>
