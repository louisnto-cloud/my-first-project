<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Escape step 1: in fire season, know two ways out from where you are hunting before you need them.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1. Two ways out</text><rect x="40" y="50" width="320" height="180" rx="10" fill="#dfe6d3"/><path d="M80 200 L200 120 L320 80" fill="none" stroke="#2e7d32" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 6"/><path d="M80 200 L160 210 L330 200" fill="none" stroke="#4a7fb0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 6"/><circle cx="80" cy="200" r="8.0" fill="#e8590c"/><text x="280" y="70" font-size="18" font-weight="bold" fill="#2e7d32" text-anchor="middle">A</text><text x="340" y="220" font-size="18" font-weight="bold" fill="#4a7fb0" text-anchor="middle">B</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Plan A and plan B</text>
</svg>
