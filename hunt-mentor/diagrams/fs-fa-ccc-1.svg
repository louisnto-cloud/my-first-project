<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 1: check the scene. Unload every gun, look for the danger that caused the injury, then go to the person.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1. Check the scene</text><rect x="0" y="230" width="400" height="70" rx="0" fill="#dfe6d3"/><line x1="102" y1="230" x2="106" y2="201" stroke="#2f3a2b" stroke-width="7.0" stroke-linecap="round"/><line x1="118" y1="230" x2="114" y2="201" stroke="#2f3a2b" stroke-width="7.0" stroke-linecap="round"/><rect x="99" y="173" width="22" height="31" rx="6.0" fill="#e8590c"/><line x1="100" y1="178" x2="92" y2="198" stroke="#2f3a2b" stroke-width="6.0" stroke-linecap="round"/><line x1="120" y1="178" x2="128" y2="198" stroke="#2f3a2b" stroke-width="6.0" stroke-linecap="round"/><circle cx="110" cy="164" r="10.0" fill="#d9b48f"/><rect x="190" y="196" width="120" height="10" rx="3" fill="#2f3a2b"/><text x="250" y="186" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Unload guns</text><text x="250" y="222" font-size="15" fill="#2f3a2b" text-anchor="middle">Danger gone?</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Unload. Look. Then go to them</text>
</svg>
