<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Split squat: one foot forward, one back. Lower the back knee toward the floor, front knee over the foot, then stand.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="30" cy="32" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="30" y="39" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">2</text>
<text x="56" y="39" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="start">Split squat</text>
<rect x="10" y="228" width="380" height="8" rx="2" fill="#c9b79c"/><circle cx="200" cy="70" r="11" fill="#2f3a2b"/><line x1="200" y1="81" x2="200" y2="145" stroke="#2f3a2b" stroke-width="7" stroke-linecap="round"/><line x1="200" y1="145" x2="250" y2="168" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="250" y1="168" x2="250" y2="228" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="200" y1="145" x2="160" y2="190" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="160" y1="190" x2="130" y2="228" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="200" y1="100" x2="185" y2="135" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><line x1="200" y1="100" x2="215" y2="135" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><line x1="100" y1="150" x2="100" y2="205" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><polygon points="100.0,205.0 95.7,196.0 104.3,196.0" fill="#e8590c"/><text x="90" y="140" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="end">Lower slow</text><text x="270" y="120" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Knee over foot</text>
<rect x="10" y="262" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="285.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Back knee down, then stand tall.</text>
</svg>
