<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A thermometer for meat. Body heat about 39 degrees Celsius at the top, bacteria grow fast in the warm zone, target 3 to 4 degrees Celsius at the bottom, the Penn State Extension goal. Cool it fast: guts out, hide off, shade, air, ice in bags.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
  <rect x="60" y="30" width="40" height="210" rx="20" fill="#ffffff" stroke="#2f3a2b" stroke-width="3"/>
  <circle cx="80" cy="250" r="28" fill="#4a7fb0" stroke="#2f3a2b" stroke-width="3"/>
  <rect x="70" y="50" width="20" height="120" fill="#e8590c"/>
  <rect x="70" y="170" width="20" height="74" fill="#4a7fb0"/>
  <g stroke="#2f3a2b" stroke-width="2"><line x1="100" y1="52" x2="122" y2="52"/><line x1="100" y1="200" x2="122" y2="200"/></g>
  <g font-family="sans-serif" font-size="16" fill="#23261f">
    <text x="130" y="57" font-weight="bold">About 39 °C: body heat</text>
    <text x="130" y="120" fill="#e8590c" font-weight="bold">Warm: bacteria grow fast</text>
    <text x="130" y="205" fill="#4a7fb0" font-weight="bold">Goal: 3 to 4 °C, fast</text>
    <text x="130" y="248">Guts out, hide off,</text>
    <text x="130" y="268">shade, air, ice in bags</text>
  </g>
</svg>
