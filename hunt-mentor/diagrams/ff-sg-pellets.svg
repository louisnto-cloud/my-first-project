<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Shot sizes drawn to scale: number 7.5 is 2.41 mm, about 350 lead pellets per ounce; number 6 is 2.79 mm, 225 lead or 317 steel per ounce; number 4 is 3.3 mm, 192 steel; number 2 is 3.81 mm, 125 steel; BB is 4.57 mm, 72 steel. Bigger pellets hit harder but there are fewer of them.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Shot sizes, true to scale x 6</text><circle cx="60" cy="64" r="7.2" fill="#9a9e96" stroke="#2f3a2b" stroke-width="1.5"/><text x="100" y="70" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">#7.5</text><text x="160" y="62" font-size="14" fill="#23261f" text-anchor="start">2.41 mm</text><text x="160" y="78" font-size="13" fill="#2f3a2b" text-anchor="start">lead 350/oz per oz</text><circle cx="60" cy="110" r="8.4" fill="#9a9e96" stroke="#2f3a2b" stroke-width="1.5"/><text x="100" y="116" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">#6</text><text x="160" y="108" font-size="14" fill="#23261f" text-anchor="start">2.79 mm</text><text x="160" y="124" font-size="13" fill="#2f3a2b" text-anchor="start">lead 225, steel 317 per oz</text><circle cx="60" cy="156" r="9.9" fill="#9a9e96" stroke="#2f3a2b" stroke-width="1.5"/><text x="100" y="162" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">#4</text><text x="160" y="154" font-size="14" fill="#23261f" text-anchor="start">3.3 mm</text><text x="160" y="170" font-size="13" fill="#2f3a2b" text-anchor="start">steel 192 per oz</text><circle cx="60" cy="202" r="11.4" fill="#9a9e96" stroke="#2f3a2b" stroke-width="1.5"/><text x="100" y="208" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">#2</text><text x="160" y="200" font-size="14" fill="#23261f" text-anchor="start">3.81 mm</text><text x="160" y="216" font-size="13" fill="#2f3a2b" text-anchor="start">steel 125 per oz</text><circle cx="60" cy="248" r="13.7" fill="#9a9e96" stroke="#2f3a2b" stroke-width="1.5"/><text x="100" y="254" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">BB</text><text x="160" y="246" font-size="14" fill="#23261f" text-anchor="start">4.57 mm</text><text x="160" y="262" font-size="13" fill="#2f3a2b" text-anchor="start">steel 72 per oz</text><text x="200.0" y="288" font-size="14" fill="#2f3a2b" text-anchor="middle">Bigger pellet: more punch, fewer pellets</text>
</svg>
