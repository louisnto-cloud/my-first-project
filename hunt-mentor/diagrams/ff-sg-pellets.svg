<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 302" font-family="sans-serif" role="img" aria-label="Shot sizes drawn to scale, six times life size: number 7.5 is 2.41 mm, about 350 lead pellets per ounce; number 6 is 2.79 mm, 225 lead or 317 steel per ounce; number 4 is 3.3 mm, 192 steel; number 2 is 3.81 mm, 125 steel; BB is 4.57 mm, 72 steel. Bigger pellets hit harder but there are fewer of them.">
<rect width="400" height="302" fill="#fffaf0"/>
<text x="200" y="27" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Shot sizes, true to scale x 6</text>
<rect x="8" y="42" width="384" height="44" rx="6" fill="#f4eedf"/>
<circle cx="44" cy="64" r="7.23" fill="#9a9c98" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="41.5" cy="61.5" r="2.2" fill="#ffffff" opacity=".55"/>
<text x="80" y="71" font-size="19" font-weight="bold" fill="#c2410c">#7.5</text>
<text x="140" y="61" font-size="16" font-weight="bold" fill="#2f3a2b">2.41 mm</text>
<text x="140" y="80" font-size="15" fill="#2f3a2b">lead 350 per oz</text>
<circle cx="44" cy="110" r="8.37" fill="#9a9c98" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="41.1" cy="107.1" r="2.5" fill="#ffffff" opacity=".55"/>
<text x="80" y="117" font-size="19" font-weight="bold" fill="#c2410c">#6</text>
<text x="140" y="107" font-size="16" font-weight="bold" fill="#2f3a2b">2.79 mm</text>
<text x="140" y="126" font-size="15" fill="#2f3a2b">lead 225, steel 317 per oz</text>
<rect x="8" y="134" width="384" height="44" rx="6" fill="#f4eedf"/>
<circle cx="44" cy="156" r="9.90" fill="#9a9c98" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="40.5" cy="152.5" r="3.0" fill="#ffffff" opacity=".55"/>
<text x="80" y="163" font-size="19" font-weight="bold" fill="#c2410c">#4</text>
<text x="140" y="153" font-size="16" font-weight="bold" fill="#2f3a2b">3.3 mm</text>
<text x="140" y="172" font-size="15" fill="#2f3a2b">steel 192 per oz</text>
<circle cx="44" cy="202" r="11.43" fill="#9a9c98" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="40.0" cy="198.0" r="3.4" fill="#ffffff" opacity=".55"/>
<text x="80" y="209" font-size="19" font-weight="bold" fill="#c2410c">#2</text>
<text x="140" y="199" font-size="16" font-weight="bold" fill="#2f3a2b">3.81 mm</text>
<text x="140" y="218" font-size="15" fill="#2f3a2b">steel 125 per oz</text>
<rect x="8" y="226" width="384" height="44" rx="6" fill="#f4eedf"/>
<circle cx="44" cy="248" r="13.71" fill="#9a9c98" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="39.2" cy="243.2" r="4.1" fill="#ffffff" opacity=".55"/>
<text x="80" y="255" font-size="19" font-weight="bold" fill="#c2410c">BB</text>
<text x="140" y="245" font-size="16" font-weight="bold" fill="#2f3a2b">4.57 mm</text>
<text x="140" y="264" font-size="15" fill="#2f3a2b">steel 72 per oz</text>
<text x="200" y="290" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bigger pellet: more punch, fewer pellets</text>
</svg>
