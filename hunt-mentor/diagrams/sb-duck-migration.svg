<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 528" font-family="sans-serif" role="img" aria-label="Timeline chart, August to December, of when ducks move south, 75 percent. Blue winged teal, shoveler and pintail: August to early September. Green winged teal: September and October. Mallard, wigeon and gadwall: September and October, staying while water is open into December. Ring necked duck: October. Canvasback and redhead: October and November. Goldeneyes and bufflehead: mid to late October, with the ice. Common merganser: late October to November, one of the last.">
