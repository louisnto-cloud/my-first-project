<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Two slope profiles. Left, convex: the slope rolls over, so contour ticks are wide apart at the top and tight at the bottom. Right, concave: steep at the top and flattening out, so ticks are tight at the top and wide at the bottom.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<path d="M20 70 C 120 72, 160 90, 180 260" fill="none" stroke="#2f3a2b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="20" y="60" font-family="sans-serif" font-size="16" fill="#e8590c" text-anchor="start" font-weight="bold">Convex: rolls over</text><line x1="40" y1="275" x2="40" y2="292" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/><line x1="95" y1="275" x2="95" y2="292" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/><line x1="135" y1="275" x2="135" y2="292" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/><line x1="158" y1="275" x2="158" y2="292" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/><line x1="170" y1="275" x2="170" y2="292" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/><text x="20" y="232" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Wide top,</text><text x="20" y="248" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">tight bottom</text><text x="20" y="268" font-family="sans-serif" font-size="13" fill="#868e96" text-anchor="start">On the map:</text><path d="M220 70 C 240 230, 300 258, 390 260" fill="none" stroke="#2f3a2b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="220" y="60" font-family="sans-serif" font-size="16" fill="#8a9a6b" text-anchor="start" font-weight="bold">Concave: scoops</text><line x1="226" y1="275" x2="226" y2="292" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/><line x1="232" y1="275" x2="232" y2="292" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/><line x1="242" y1="275" x2="242" y2="292" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/><line x1="262" y1="275" x2="262" y2="292" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/><line x1="320" y1="275" x2="320" y2="292" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/><text x="300" y="120" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Tight top,</text><text x="300" y="136" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">wide bottom</text>
</svg>
