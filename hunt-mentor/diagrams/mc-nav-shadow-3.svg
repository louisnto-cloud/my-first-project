<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 3: a line from the first mark to the second runs roughly west to east. Face so the first mark is on your left and you face roughly north. Rough check only, 60 percent.">
<rect width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c"/><text x="26" y="31" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">3</text><text x="52" y="32" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">First mark west, second east</text><rect x="20" y="60" width="360" height="190" rx="6" fill="#dfe6d3"/><circle cx="160" cy="150" r="7" fill="#e8590c"/><circle cx="260" cy="150" r="7" fill="#2f3a2b"/><line x1="110" y1="150" x2="310" y2="150" stroke="#23261f" stroke-width="3" stroke-linecap="round"/><text x="140" y="182" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Mark 1 = west</text><text x="290" y="182" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Mark 2 = east</text><line x1="210" y1="150" x2="210.0" y2="90.0" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><polygon points="210.0,80.0 205.0,90.0 215.0,90.0" fill="#2f3a2b"/><text x="225" y="90" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">North, roughly</text><text x="200" y="275" font-size="15" fill="#6b4f35" text-anchor="middle">Rough check only (60%)</text>
</svg>
