<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" font-family="sans-serif" role="img" aria-label="In leaf litter, duff and rock, look for what moved: a flipped leaf showing its pale or wet side, scuffed moss torn green inside, pressed duff making a dark dent, or a stone with its damp side up.">
<rect x="0" y="0" width="400" height="296" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">No prints? Read what moved</text>
<rect x="16" y="62" width="180" height="88" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="106" y="100" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Flipped leaf</text><text x="106" y="126" font-size="14" fill="#23261f" text-anchor="middle">pale or wet side up</text><rect x="204" y="62" width="180" height="88" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="294" y="100" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Scuffed moss</text><text x="294" y="126" font-size="14" fill="#23261f" text-anchor="middle">torn, green inside</text><rect x="16" y="162" width="180" height="88" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="106" y="200" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pressed duff</text><text x="106" y="226" font-size="14" fill="#23261f" text-anchor="middle">a dark dent</text><rect x="204" y="162" width="180" height="88" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="294" y="200" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Moved stone</text><text x="294" y="226" font-size="14" fill="#23261f" text-anchor="middle">damp side up</text><text x="200" y="284" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">No prints? Read what moved (65%)</text>
</svg>
