<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="The CZ 457 and what is different: an 11 mm dovetail for scope mounts, a 60 degree bolt lift that clears big scopes, a safety that is on when pulled back and shows a white dot, and barrels the user can swap. The bolt can be opened with the safety on.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Your CZ 457: what is different</text><g transform="translate(20 140) scale(1.0)"><path d="M0 20 L100 12 L110 12 L120 40 L220 38 L220 50 L110 56 L92 68 L78 60 L0 76 Z" fill="#8b5a2b" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-8" y="18" width="10" height="60" rx="3" fill="#2f3a2b" stroke="none" stroke-width="2"/><rect x="100" y="2" width="84" height="20" rx="0" fill="#6b6f68" stroke="#2f3a2b" stroke-width="2"/><rect x="184" y="8" width="186" height="8" rx="0" fill="#6b6f68" stroke="#2f3a2b" stroke-width="1"/><path d="M118 22 l-8 18" fill="none" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="109" cy="42" r="6" fill="#2f3a2b" stroke="none" stroke-width="2"/><path d="M118 54 q 2 16 22 14 l2 -14" fill="none" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="142" y="54" width="26" height="18" rx="2" fill="#2f3a2b" stroke="none" stroke-width="2"/><rect x="118" y="-22" width="90" height="14" rx="6" fill="#4b4f48" stroke="#2f3a2b" stroke-width="1.5"/><path d="M118 -15 l-14 -6 l0 12 Z" fill="#4b4f48" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M208 -15 l18 -8 l0 16 Z" fill="#4b4f48" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="130" y="-8" width="6" height="10" rx="0" fill="#2f3a2b" stroke="none" stroke-width="2"/><rect x="190" y="-8" width="6" height="10" rx="0" fill="#2f3a2b" stroke="none" stroke-width="2"/></g><line x1="160" y1="118" x2="100" y2="88" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="100" y="66" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">11 mm dovetail</text><text x="100" y="82" font-size="13" fill="#23261f" text-anchor="middle">scope base</text><line x1="130" y1="150" x2="300" y2="88" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="300" y="66" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">60° bolt lift</text><text x="300" y="82" font-size="13" fill="#23261f" text-anchor="middle">clears big scopes</text><line x1="132" y1="160" x2="70" y2="210" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="70" y="226" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Safety back</text><text x="70" y="242" font-size="13" fill="#23261f" text-anchor="middle">white dot = ON</text><line x1="300" y1="152" x2="310" y2="210" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="310" y="226" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Barrel swaps</text><text x="310" y="242" font-size="13" fill="#23261f" text-anchor="middle">user level, CZ</text><text x="200.0" y="288" font-size="13" fill="#2f3a2b" text-anchor="middle">Bolt opens with the safety ON (CZ manual)</text>
</svg>
