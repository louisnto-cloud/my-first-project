<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="sans-serif">
  <rect x="0" y="0" width="400" height="470" fill="#fffaf0"/>
  <text x="200" y="26" font-size="19" font-weight="bold" fill="#23261f" text-anchor="middle">Grid search from the last blood</text>

  <!-- blood trail coming in from the top left -->
  <path d="M30 60 C 70 70, 90 95, 120 110 S 170 130, 200 150" fill="none" stroke="#8a9a6b" stroke-width="2" stroke-dasharray="6 6"/>
  <g fill="#e8590c">
    <circle cx="40" cy="64" r="4"/>
    <circle cx="72" cy="78" r="4"/>
    <circle cx="105" cy="100" r="3.5"/>
    <circle cx="140" cy="118" r="3"/>
    <circle cx="172" cy="136" r="2.5"/>
  </g>
  <text x="26" y="50" font-size="14" fill="#23261f">Blood trail, flagged</text>
  <g fill="#e8590c" stroke="#23261f" stroke-width="1">
    <rect x="56" y="80" width="6" height="14"/>
    <rect x="124" y="120" width="6" height="14"/>
  </g>

  <!-- last blood -->
  <circle cx="200" cy="150" r="9" fill="#e8590c" stroke="#23261f" stroke-width="2"/>
  <text x="214" y="146" font-size="15" font-weight="bold" fill="#23261f">LAST BLOOD</text>
  <text x="214" y="164" font-size="14" fill="#6b4f35">flag it, return here</text>

  <!-- circles -->
  <circle cx="200" cy="150" r="40" fill="none" stroke="#2f3a2b" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="200" cy="150" r="80" fill="none" stroke="#2f3a2b" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="168" y="208" font-size="14" fill="#2f3a2b">1: circle 20 m</text>
  <text x="150" y="246" font-size="14" fill="#2f3a2b">2: circle 40 m</text>

  <!-- lanes -->
  <text x="20" y="286" font-size="15" font-weight="bold" fill="#23261f">3: lanes, 10 m apart, stay in sight of each other</text>
  <g stroke="#2f3a2b" stroke-width="2" fill="none">
    <path d="M40 310 H340"/>
    <path d="M340 310 V335"/>
    <path d="M340 335 H40"/>
    <path d="M40 335 V360"/>
    <path d="M40 360 H340"/>
    <path d="M340 360 V385"/>
    <path d="M340 385 H40"/>
  </g>
  <g fill="#2f3a2b">
    <path d="M330 304 L342 310 L330 316 Z"/>
    <path d="M50 329 L38 335 L50 341 Z"/>
    <path d="M330 354 L342 360 L330 366 Z"/>
    <path d="M50 379 L38 385 L50 391 Z"/>
  </g>
  <!-- two searchers -->
  <g stroke="#23261f" stroke-width="2" fill="#8a9a6b">
    <circle cx="90" cy="300" r="5"/>
    <path d="M90 305 V318 M82 311 H98 M90 318 L84 328 M90 318 L96 328" fill="none"/>
    <circle cx="90" cy="325" r="5"/>
    <path d="M90 330 V343 M82 336 H98 M90 343 L84 353 M90 343 L96 353" fill="none"/>
  </g>
  <text x="104" y="304" font-size="14" fill="#23261f">You</text>
  <text x="104" y="330" font-size="14" fill="#23261f">Brother, one lane over</text>

  <!-- downhill / water -->
  <path d="M355 150 L385 210" fill="none" stroke="#6b4f35" stroke-width="3"/>
  <path d="M378 196 L387 214 L370 208 Z" fill="#6b4f35"/>
  <text x="300" y="232" font-size="14" fill="#6b4f35">Downhill and water:</text>
  <text x="300" y="250" font-size="14" fill="#6b4f35">check these first</text>

  <!-- legend -->
  <text x="20" y="416" font-size="14" fill="#23261f">Walk beside the blood line, never on it.</text>
  <text x="20" y="436" font-size="14" fill="#23261f">Lost it? Back to the last flag, then circles, then lanes.</text>
  <text x="20" y="456" font-size="14" fill="#6b4f35">Orange: blood and flags. Dashed: search pattern.</text>
</svg>
