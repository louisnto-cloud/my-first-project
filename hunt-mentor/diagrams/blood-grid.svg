<circle cx="206" cy="372" r="8" fill="#6b4f35" stroke="#fffaf0" stroke-width="2"/><text x="192" y="377" font-size="15" font-weight="bold" fill="#6b4f35" text-anchor="end">Brother, one lane over</text>
