<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 510" font-family="sans-serif" role="img" aria-label="Grid search from the last blood, seen from above in snow. A blood trail runs in, marked with flags, to the last blood spot: flag it and return there. Step 1: search a circle of 20 m around it. Step 2: a circle of 40 m. Downhill and water: check these first. Step 3: walk lanes 10 m apart and stay in sight of each other, you in one lane and your brother one lane over. Walk beside the blood line, never on it. Lost it? Back to the last flag, then circles, then lanes.">
