<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 186" role="img" aria-label="Two cards. In Region 1 it is unlawful to use a wireless camera for hunting, with no dates printed. It is unlawful to intentionally bait or feed hoofed game or turkey within 200 metres of a dwelling, school yard or playground." font-family="sans-serif">
<rect x="0" y="0" width="400" height="186" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Unlawful in Region 1</text>
<rect x="6" y="40" width="190" height="132" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M6 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#c92a2a"/>
<text x="101" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Wireless camera</text>
<rect x="18.0" y="87" width="24" height="18" rx="3" fill="#8a9a6b"/><circle cx="30.0" cy="96" r="5" fill="#2f3a2b"/><path d="M38.0 83 q4 -4 8 0" fill="none" stroke="#2f3a2b" stroke-width="2"/>
<circle cx="30.0" cy="96" r="18" fill="none" stroke="#c92a2a" stroke-width="3"/><line x1="17.0" y1="109" x2="43.0" y2="83" stroke="#c92a2a" stroke-width="3"/>
<text x="52" y="88" font-size="14" fill="#23261f" text-anchor="start">Unlawful for</text>
<text x="52" y="106" font-size="14" fill="#23261f" text-anchor="start">hunting in Region</text>
<text x="52" y="124" font-size="14" fill="#23261f" text-anchor="start">1. No dates</text>
<text x="52" y="142" font-size="14" fill="#23261f" text-anchor="start">printed</text>
<rect x="204" y="40" width="190" height="132" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M204 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#c92a2a"/>
<text x="299" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Bait or feed</text>
<path d="M216.0 94 h24 l-3 12 h-18 z" fill="#8b5a2b"/><circle cx="223.0" cy="91" r="4" fill="#c92a2a"/><circle cx="232.0" cy="90" r="4" fill="#c92a2a"/>
<circle cx="228.0" cy="96" r="18" fill="none" stroke="#c92a2a" stroke-width="3"/><line x1="215.0" y1="109" x2="241.0" y2="83" stroke="#c92a2a" stroke-width="3"/>
<text x="250" y="88" font-size="14" fill="#23261f" text-anchor="start">Not hoofed game or</text>
<text x="250" y="106" font-size="14" fill="#23261f" text-anchor="start">turkey within 200</text>
<text x="250" y="124" font-size="14" fill="#23261f" text-anchor="start">m of a home,</text>
<text x="250" y="142" font-size="14" fill="#23261f" text-anchor="start">school yard or</text>
<text x="250" y="160" font-size="14" fill="#23261f" text-anchor="start">playground</text>
</svg>
