<text x="14" y="264" font-size="14" fill="#23261f" text-anchor="start">Grave Prairie, Corbin,</text>
<text x="14" y="282" font-size="14" fill="#23261f" text-anchor="start">Weigert, Upper Elk and</text>
<text x="14" y="300" font-size="14" fill="#23261f" text-anchor="start">Fording, Alexander</text>
<text x="14" y="318" font-size="14" fill="#23261f" text-anchor="start">Creek. ◆ Barnes Lake</text>
