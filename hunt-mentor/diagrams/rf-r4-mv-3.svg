<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 376" font-family="sans-serif" role="img" aria-label="Cards of vehicle closures in Management Units 4-22 to 4-24. A star means closed to all motor vehicles; the other symbols close vehicles for hunting use. 4-22: Baynes Lake, Powerplant, Pickering Hills and Sheep Mountain, and Galbraith Creek closed to all vehicles; six watershed groups closed for hunting use in spring and 1 September to 28 February; the main Harrison Creek Forest Service Road open. 4-23: Chauncey Todhunter, Grave Prairie, Corbin, Weigert, Upper Elk and Fording, and Alexander Creek closed to all vehicles, snowmobiles allowed where noted; Barnes Lake closed for hunting use. 4-24: upper Mutton Creek closed to all vehicles; seven watersheds closed for hunting use in spring and 1 September to 28 February. White River and Bull River, across 4-22 to 4-24: closed for hunting use 1 September to 30 June.">
<rect width="400" height="376" fill="#fffaf0"/>
<text x="12" y="25" font-size="14" font-weight="bold" fill="#6b5b4b">Vehicle closures, MUs 4-22 to 4-24</text>
<rect x="10" y="34" width="380" height="88" rx="7" fill="#fffaf0" stroke="#4a7fb0" stroke-width="1.6"/>
<path d="M17 34 H60 V122 H17 A7 7 0 0 1 10 115 V41 A7 7 0 0 1 17 34z" fill="#4a7fb0"/>
<text x="35" y="84" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">4-22</text>
<text x="74" y="56" font-size="15" font-weight="bold" fill="#4a7fb0">★</text>
<text x="92" y="56" font-size="15" fill="#4a7fb0">Baynes Lake, Powerplant, Pickering Hills,</text>
<text x="92" y="75" font-size="15" fill="#4a7fb0">Sheep Mtn., Galbraith Creek</text>
<text x="74" y="94" font-size="15" font-weight="bold" fill="#c92a2a">◆</text>
<text x="92" y="94" font-size="15" fill="#c92a2a">Six watershed groups</text>
<text x="74" y="113" font-size="15" fill="#2f3a2b">Harrison Creek Forest Service Road open</text>
<rect x="10" y="130" width="380" height="88" rx="7" fill="#fffaf0" stroke="#4a7fb0" stroke-width="1.6"/>
