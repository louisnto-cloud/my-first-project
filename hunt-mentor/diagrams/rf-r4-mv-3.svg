<path d="M6 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#4a7fb0"/>
<text x="101" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">MUs 4-22 to 4-24</text>
<text x="14" y="88" font-size="14" fill="#23261f" text-anchor="start">✖ White River and Bull</text>
<text x="14" y="106" font-size="14" fill="#23261f" text-anchor="start">River</text>
<rect x="204" y="40" width="190" height="150" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<path d="M204 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#4a7fb0"/>
<text x="299" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">MU 4-22</text>
<text x="212" y="88" font-size="14" fill="#23261f" text-anchor="start">★ Baynes Lake,</text>
<text x="212" y="106" font-size="14" fill="#23261f" text-anchor="start">Powerplant, Pickering</text>
<text x="212" y="124" font-size="14" fill="#23261f" text-anchor="start">Hills, Sheep Mtn.,</text>
<text x="212" y="142" font-size="14" fill="#23261f" text-anchor="start">Galbraith Creek. ◆ six</text>
