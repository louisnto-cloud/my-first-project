<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 344" role="img" aria-label="Cards of vehicle closures in Management Units 4-22 to 4-24. White River and Bull River in 4-22 to 4-24: closed for hunting use 1 September to 30 June. 4-22: Baynes Lake, Powerplant, Pickering Hills and Sheep Mountain, and Galbraith Creek closed to all vehicles; six watershed groups closed for hunting use in spring and 1 September to 28 February; the main Harrison Creek Forest Service Road open. 4-23: Chauncey Todhunter, Grave Prairie, Corbin, Weigert, Upper Elk and Fording, and Alexander Creek closed to all vehicles, snowmobiles allowed where noted; Barnes Lake closed for hunting use. 4-24: upper Mutton Creek closed to all vehicles; seven watersheds closed for hunting use in spring and 1 September to 28 February." font-family="sans-serif">
<rect x="0" y="0" width="400" height="344" fill="#fffaf0"/>
<text x="200" y="26" font-size="16" fill="#23261f" text-anchor="middle" font-weight="bold">Vehicle closures, MUs 4-22 to 4-24</text>
