<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side by side. Moose: shoulder hump, long drooping face, bell under the throat, dark brown to black body, pale legs, no rump patch. Elk: pale yellow rump patch, light body with dark neck, smaller and no bell. At dusk, horses and cattle can look similar: if not sure, no shot.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Moose or elk?</text><g transform="translate(100 112) scale(0.95)"><rect x="-36" y="4" width="8" height="52" rx="4" fill="#9c8a76" stroke="#23261f" stroke-width="1.5"/><rect x="-26" y="4" width="8" height="52" rx="4" fill="#9c8a76" stroke="#23261f" stroke-width="1.5"/><rect x="26" y="4" width="8" height="52" rx="4" fill="#9c8a76" stroke="#23261f" stroke-width="1.5"/><rect x="36" y="4" width="8" height="52" rx="4" fill="#9c8a76" stroke="#23261f" stroke-width="1.5"/><path d="M-46 0 Q-48 -26 -20 -26 Q10 -40 34 -34 Q48 -26 44 2 Q20 22 -30 18 Q-48 16 -46 0 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="2"/><path d="M30 -30 L56 -40 L66 -26 L40 0 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="2" stroke-linejoin="round"/><path d="M56 -44 L86 -30 Q92 -22 84 -18 L64 -20 Q54 -26 56 -44 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="2" stroke-linejoin="round"/><path d="M66 -22 Q66 -6 60 -4 Q58 -12 62 -22 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="2"/><ellipse cx="54" cy="-50" rx="8" ry="3.5" transform="rotate(-30 54 -50)" fill="#3b2a1c" stroke="#23261f" stroke-width="2"/><circle cx="70" cy="-34" r="1.8" fill="#eeeeee"/></g><text x="100" y="196" font-size="14" fill="#23261f" text-anchor="middle">Moose</text><text x="100" y="213" font-size="14" fill="#23261f" text-anchor="middle">Hump, long face, bell</text><text x="100" y="230" font-size="14" fill="#23261f" text-anchor="middle">Dark body, pale legs</text><text x="100" y="247" font-size="14" fill="#23261f" text-anchor="middle">No rump patch</text><g transform="translate(300 112) scale(0.85)"><rect x="-34" y="0" width="7" height="50" fill="#8b5a2b"/><rect x="-24" y="0" width="7" height="50" fill="#8b5a2b"/><rect x="22" y="0" width="7" height="50" fill="#8b5a2b"/><rect x="32" y="0" width="7" height="50" fill="#8b5a2b"/><ellipse cx="0" cy="-8" rx="46" ry="20" fill="#b98b54" stroke="#23261f" stroke-width="2"/><ellipse cx="-42" cy="-10" rx="10" ry="14" fill="#efd9a6" stroke="#23261f" stroke-width="1.5"/><path d="M28 -22 L46 -48 L58 -42 L42 -4 Z" fill="#5a3b22" stroke="#23261f" stroke-width="2"/><path d="M44 -52 L74 -44 Q78 -38 72 -36 L52 -38 Z" fill="#5a3b22" stroke="#23261f" stroke-width="2"/></g><text x="300" y="196" font-size="14" fill="#23261f" text-anchor="middle">Elk</text><text x="300" y="213" font-size="14" fill="#23261f" text-anchor="middle">Pale yellow rump patch</text><text x="300" y="230" font-size="14" fill="#23261f" text-anchor="middle">Light body, dark neck</text><text x="300" y="247" font-size="14" fill="#23261f" text-anchor="middle">Smaller, no bell</text><rect x="20" y="266" width="360" height="26" rx="8" fill="#f3e3d3" stroke="#e8590c" stroke-width="2"/><text x="200" y="284" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Dusk shape not sure? No shot. Horses and cattle too.</text>
</svg>
