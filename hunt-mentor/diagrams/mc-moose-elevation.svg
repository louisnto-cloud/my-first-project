<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 292" font-family="sans-serif" role="img" aria-label="Line sketch of moose elevation through the year. Low in winter valleys from about December to April, moving up in May and June to plateau lakes and high basins for summer, staying high late into the fall longer than deer or elk, and drifting down in November and December with snow. A general pattern, not data; some moose stay low all year.">
<rect x="0" y="0" width="400" height="292" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Where moose are, by month</text><line x1="50" y1="240" x2="380" y2="240" stroke="#23261f" stroke-width="2"/><line x1="50" y1="40" x2="50" y2="240" stroke="#23261f" stroke-width="2"/><text x="64" y="258" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">J</text><text x="91" y="258" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">F</text><text x="118" y="258" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">M</text><text x="145" y="258" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">A</text><text x="172" y="258" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">M</text><text x="199" y="258" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">J</text><text x="226" y="258" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">J</text><text x="253" y="258" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">A</text><text x="280" y="258" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">S</text><text x="307" y="258" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">O</text><text x="334" y="258" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">N</text><text x="361" y="258" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">D</text><polyline points="64,200 91,205 118,200 145,185 172,140 199,90 226,70 253,70 280,72 307,80 334,110 361,170" fill="none" stroke="#e8590c" stroke-width="4"/><text x="44" y="70" font-size="14" fill="#6b4f35" text-anchor="end">high</text><text x="44" y="220" font-size="14" fill="#6b4f35" text-anchor="end">low</text><text x="200" y="56" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Summer: plateau lakes, high basins</text><text x="270" y="150" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Stay high late</text><text x="60" y="224" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Winter: valleys</text><text x="200" y="284" font-size="14" fill="#6b4f35" text-anchor="middle">General pattern, not data. Some stay low.</text>
</svg>
