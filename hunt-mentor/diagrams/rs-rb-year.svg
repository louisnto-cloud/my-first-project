<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="sans-serif" role="img" aria-label="Timeline from August to December. Velvet comes off in late August and September, rubbing runs September to November, scraping peaks from mid October to mid November, and the rut and breeding follow in November. Bars are approximate.">
<rect x="0" y="0" width="400" height="290" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The rub and scrape season</text>
<line x1="20" y1="150" x2="380" y2="150" stroke="#23261f" stroke-width="3"/><line x1="40" y1="142" x2="40" y2="158" stroke="#23261f" stroke-width="2"/><text x="40" y="178" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Aug</text><line x1="120" y1="142" x2="120" y2="158" stroke="#23261f" stroke-width="2"/><text x="120" y="178" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Sep</text><line x1="200" y1="142" x2="200" y2="158" stroke="#23261f" stroke-width="2"/><text x="200" y="178" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Oct</text><line x1="280" y1="142" x2="280" y2="158" stroke="#23261f" stroke-width="2"/><text x="280" y="178" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Nov</text><line x1="360" y1="142" x2="360" y2="158" stroke="#23261f" stroke-width="2"/><text x="360" y="178" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Dec</text><rect x="40" y="96" width="90" height="22" rx="5" fill="#8a9a6b"/><text x="85" y="112" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">velvet off</text><rect x="90" y="70" width="250" height="22" rx="5" fill="#6b4f35"/><text x="215" y="86" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">rubbing</text><rect x="175" y="120" width="120" height="22" rx="5" fill="#e8590c"/><text x="235" y="136" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">scrapes peak</text><rect x="230" y="196" width="120" height="24" rx="5" fill="#2f3a2b"/><text x="290" y="213" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">rut, breeding</text><text x="200" y="252" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">About 80% of scraping: mid Oct to mid Nov (65%)</text><text x="200" y="276" font-size="14" fill="#6b4f35" text-anchor="middle">Bars are approximate (Tip)</text>
</svg>
