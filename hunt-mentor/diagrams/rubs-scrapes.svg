<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" font-family="sans-serif" role="img" aria-label="A sapling rub and a scrape drawn to true scale against a height scale in centimetres, 0 to 150. Rub: bark stripped from the sapling between about 30 and 105 centimetres up; higher means a bigger buck. Licking branch: an overhanging branch with a chewed tip, about 1.2 to 1.5 metres up. Scrape: pawed bare dirt about 1 metre long under the branch, debris kicked back. White tails scrape; mule deer rarely do.">
<rect width="400" height="450" fill="#fffaf0"/>
<g data-tip="When to look|About 80% of scraping in the north happens from mid October to mid November."><text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Rub on a sapling and a scrape</text></g>
<rect x="0" y="40" width="400" height="276" fill="#eef3ea"/>
<rect x="0" y="316" width="400" height="34" fill="#a9b77e"/><line x1="0" y1="316" x2="400" y2="316" stroke="#5c6b3e" stroke-width="2"/>
