<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 412" font-family="sans-serif">
  <rect x="0" y="0" width="400" height="412" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Rub on a sapling and a scrape</text>

  <!-- ground -->
  <rect x="0" y="320" width="400" height="22" fill="#8a9a6b"/>
  <line x1="0" y1="320" x2="400" y2="320" stroke="#23261f" stroke-width="2"/>

  <!-- height scale, 36 px per 30 cm -->
  <g stroke="#23261f" stroke-width="1.5" fill="none">
    <line x1="48" y1="320" x2="48" y2="140"/>
    <line x1="42" y1="320" x2="54" y2="320"/>
    <line x1="42" y1="284" x2="54" y2="284"/>
    <line x1="42" y1="248" x2="54" y2="248"/>
    <line x1="42" y1="212" x2="54" y2="212"/>
    <line x1="42" y1="176" x2="54" y2="176"/>
    <line x1="42" y1="140" x2="54" y2="140"/>
  </g>
  <g font-size="14" fill="#23261f" text-anchor="end">
    <text x="38" y="325">0</text>
    <text x="38" y="289">30</text>
    <text x="38" y="253">60</text>
    <text x="38" y="217">90</text>
    <text x="38" y="181">120</text>
    <text x="38" y="145">150</text>
    <text x="48" y="128" text-anchor="middle">cm</text>
  </g>

  <!-- sapling -->
  <rect x="104" y="90" width="12" height="230" fill="#6b4f35" stroke="#23261f" stroke-width="1.5"/>
  <g stroke="#6b4f35" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="110" y1="120" x2="86" y2="98"/>
    <line x1="110" y1="140" x2="136" y2="116"/>
    <line x1="110" y1="100" x2="124" y2="80"/>
  </g>
  <g fill="#8a9a6b" stroke="#2f3a2b" stroke-width="1">
    <circle cx="84" cy="94" r="9"/>
    <circle cx="138" cy="112" r="9"/>
    <circle cx="126" cy="76" r="9"/>
    <circle cx="110" cy="84" r="9"/>
  </g>
  <!-- rub: bark stripped between 30 and 90 cm -->
  <rect x="102" y="212" width="16" height="72" fill="#fffaf0" stroke="#23261f" stroke-width="1.5"/>
  <g stroke="#6b4f35" stroke-width="1.5" fill="none">
    <line x1="104" y1="222" x2="116" y2="230"/>
    <line x1="104" y1="238" x2="116" y2="246"/>
    <line x1="104" y1="254" x2="116" y2="262"/>
    <line x1="104" y1="270" x2="116" y2="278"/>
  </g>
  <!-- shredded bark at the base -->
  <g fill="#6b4f35" stroke="#23261f" stroke-width="1">
    <path d="M96 318 L102 306 L106 318 Z"/>
    <path d="M118 318 L124 304 L128 318 Z"/>
  </g>
  <line x1="120" y1="248" x2="150" y2="248" stroke="#e8590c" stroke-width="2" fill="none"/>
  <text x="154" y="244" font-size="14" font-weight="bold" fill="#e8590c">Rub</text>
  <text x="154" y="262" font-size="14" fill="#23261f">bark stripped,</text>
  <text x="154" y="280" font-size="14" fill="#23261f">30 to 105 cm up</text>
  <text x="154" y="298" font-size="14" fill="#2f3a2b">higher = bigger buck</text>

  <!-- tree with licking branch -->
  <rect x="368" y="50" width="22" height="270" fill="#6b4f35" stroke="#23261f" stroke-width="1.5"/>
  <path d="M368 158 C330 150 300 160 262 166" stroke="#6b4f35" stroke-width="7" stroke-linecap="round" fill="none"/>
  <g stroke="#6b4f35" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="300" y1="160" x2="292" y2="146"/>
    <line x1="330" y1="155" x2="326" y2="140"/>
  </g>
  <g fill="#8a9a6b" stroke="#2f3a2b" stroke-width="1">
    <circle cx="290" cy="142" r="8"/>
    <circle cx="325" cy="136" r="8"/>
    <circle cx="258" cy="168" r="7"/>
  </g>
  <line x1="262" y1="176" x2="262" y2="200" stroke="#e8590c" stroke-width="2" fill="none"/>
  <text x="300" y="216" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Licking branch</text>
  <text x="300" y="234" font-size="14" fill="#23261f" text-anchor="middle">chewed tip, about</text>
  <text x="300" y="252" font-size="14" fill="#23261f" text-anchor="middle">1.2 to 1.5 m up</text>

  <!-- scrape -->
  <ellipse cx="268" cy="311" rx="56" ry="11" fill="#6b4f35" stroke="#23261f" stroke-width="1.5"/>
  <g fill="#8a9a6b" stroke="#23261f" stroke-width="1">
    <ellipse cx="336" cy="306" rx="7" ry="4"/>
    <ellipse cx="344" cy="314" rx="6" ry="3.5"/>
    <ellipse cx="330" cy="316" rx="5" ry="3"/>
  </g>
  <text x="182" y="362" font-size="14" font-weight="bold" fill="#e8590c">Scrape</text>
  <text x="182" y="380" font-size="14" fill="#23261f">pawed bare dirt about 1 m long,</text>
  <text x="182" y="398" font-size="14" fill="#23261f">debris kicked back</text>
  <text x="12" y="362" font-size="14" fill="#2f3a2b">White tails scrape.</text>
  <text x="12" y="380" font-size="14" fill="#2f3a2b">Mule deer rarely do.</text>
</svg>
