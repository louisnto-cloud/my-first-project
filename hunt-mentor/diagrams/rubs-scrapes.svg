<text x="242" y="375.5" font-size="16" font-weight="bold" fill="#c2410c" text-anchor="middle">Scrape</text>
<text x="242" y="393" font-size="15" fill="#2f3a2b" text-anchor="middle">pawed bare dirt about 1 m long,</text>
<text x="242" y="411" font-size="15" fill="#2f3a2b" text-anchor="middle">debris kicked back</text><circle cx="118" cy="358" r="13" fill="#e8590c"/><text x="118" y="364" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text></g>
<g data-tip="White tails or mule deer|White tails scrape and make many rubs. Mule deer rarely scrape and make fewer rubs, on small conifers and shrubs."><text x="200" y="438" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">White tails scrape. Mule deer rarely do.</text></g>
</svg>
