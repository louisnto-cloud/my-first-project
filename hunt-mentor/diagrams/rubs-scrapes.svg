<text x="34" y="285" font-size="14" fill="#2f3a2b" text-anchor="end">30</text>
<line x1="38" y1="244" x2="50" y2="244" stroke="#2f3a2b" stroke-width="1.6"/>
<text x="34" y="249" font-size="14" fill="#2f3a2b" text-anchor="end">60</text>
<line x1="38" y1="208" x2="50" y2="208" stroke="#2f3a2b" stroke-width="1.6"/>
<text x="34" y="213" font-size="14" fill="#2f3a2b" text-anchor="end">90</text>
<line x1="38" y1="172" x2="50" y2="172" stroke="#2f3a2b" stroke-width="1.6"/>
<text x="34" y="177" font-size="14" fill="#2f3a2b" text-anchor="end">120</text>
<line x1="38" y1="136" x2="50" y2="136" stroke="#2f3a2b" stroke-width="1.6"/>
<text x="34" y="141" font-size="14" fill="#2f3a2b" text-anchor="end">150</text>
<line x1="38" y1="226" x2="56" y2="226" stroke="#e8590c" stroke-width="2.4"/><text x="60" y="231" font-size="14" font-weight="bold" fill="#e8590c">75</text>
<text x="44" y="126" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">cm</text>
<g data-tip="Read the rub line|The rubbed side faces where the buck came from. A line of rubs facing one way is his route between bed and feed. Fresh rubs show pale wood and sap (Tip)."><path d="M97 316 L100 88.0 L108 88.0 L111 316z" fill="#6b4f35"/>
