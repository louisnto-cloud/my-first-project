<g data-tip="1. Rub|Bark stripped by a buck's antlers and forehead, mostly 30 to 105 cm up. A rub centred 75 cm or higher suggests a mature buck."><path d="M118 280 h6 V190 h-6" fill="none" stroke="#e8590c" stroke-width="2"/>
<rect x="130.0" y="191.2" width="164.5" height="81.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="212.274" y="210.7" font-size="16" font-weight="bold" fill="#c2410c" text-anchor="middle">Rub</text>
<text x="212.274" y="228.2" font-size="15" fill="#2f3a2b" text-anchor="middle">bark stripped,</text>
<text x="212.274" y="246.2" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">30 to 105 cm up</text>
<text x="212.274" y="264.2" font-size="15" fill="#2f3a2b" text-anchor="middle">higher = bigger buck</text><circle cx="130" cy="192" r="13" fill="#e8590c"/><text x="130" y="198" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text></g>
<g data-tip="3. Licking branch|An overhanging branch about 1.2 to 1.5 m up. The buck chews the tip and urinates in the scrape below."><rect x="382" y="40" width="18" height="276" fill="#6b4f35"/>
<path d="M382 105 C332 117 282 136 232 158" fill="none" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/>
