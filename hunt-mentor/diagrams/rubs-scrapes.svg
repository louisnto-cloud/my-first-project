<text x="286" y="67.5" font-size="16" font-weight="bold" fill="#c2410c" text-anchor="middle">Licking branch</text>
<text x="286" y="85" font-size="15" fill="#2f3a2b" text-anchor="middle">chewed tip, about</text>
<text x="286" y="103" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1.2 to 1.5 m up</text><circle cx="214" cy="50" r="13" fill="#e8590c"/><text x="214" y="56" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text></g>
<g data-tip="2. Scrape|A pawed bare oval of dirt about 1 m long, under the licking branch. Fresh: dark moist soil, leaves thrown back, a urine smell (Tip)."><ellipse cx="242" cy="322" rx="60.0" ry="9" fill="#4a3526"/>
<ellipse cx="310" cy="320" rx="4" ry="2.4" fill="#9b8466"/>
