<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 316" font-family="sans-serif" role="img" aria-label="Quail and chukar by region. Region 8, Okanagan: quail open 1 October to 30 November, chukar open the same dates. Region 3, Heffley Creek: no quail season at all, chukar open 1 October to 30 November.">
<defs>
<g id="hf-quail-regions-quail"><path d="M-20 6 C-22 -6 -10 -14 4 -12 C14 -11 20 -4 20 4 C20 12 10 16 -2 16 C-12 16 -19 12 -20 6 Z" fill="#7d8796"/><path d="M-6 0 C2 4 10 4 16 2" stroke="#ffffff" stroke-width="1.6" fill="none"/><circle cx="12" cy="-14" r="8" fill="#5a6270"/><path d="M14 -21 C12 -30 6 -32 4 -28 C8 -27 10 -24 12 -21" fill="#2f3a2b"/><path d="M19 -14 l5 2 l-5 2z" fill="#2f3a2b"/><circle cx="14" cy="-15" r="1.4" fill="#ffffff"/><path d="M-4 16 v6 M4 16 v6" stroke="#6b4f35" stroke-width="2"/></g>
<g id="hf-quail-regions-chukar"><path d="M-22 6 C-24 -6 -10 -14 4 -12 C14 -11 20 -4 20 4 C20 12 10 16 -2 16 C-14 16 -21 12 -22 6 Z" fill="#b9ab96"/><path d="M-8 -6 v12 M-3 -7 v13 M2 -7 v13" stroke="#3f2c1c" stroke-width="1.8"/><circle cx="12" cy="-14" r="8" fill="#c8bcaa"/><path d="M8 -18 C10 -12 14 -10 18 -12" stroke="#1f160e" stroke-width="2" fill="none"/><path d="M19 -15 l5 2 l-5 2z" fill="#c0392b"/><circle cx="14" cy="-16" r="1.6" fill="#c0392b"/><path d="M-4 16 v6 M4 16 v6" stroke="#c0392b" stroke-width="2"/></g>
</defs>
<rect width="400" height="316" fill="#fffaf0"/>
<rect x="8" y="8" width="188" height="268" rx="10" fill="#dfe6d3"/>
<rect x="204" y="8" width="188" height="268" rx="10" fill="#efe2d6"/>
<g data-tip="Region 8, Okanagan|Quail, chukar, gray partridge and pheasant cocks have seasons in Management Units 8-1 to 8-15 and 8-21 to 8-26.">
<rect x="16" y="14" width="172" height="50" fill="#dfe6d3"/>
<text x="102" y="36" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Region 8</text>
<text x="102" y="57" font-size="15" fill="#2f3a2b" text-anchor="middle">Okanagan</text>
</g>
<g data-tip="Region 3, Heffley Creek|Heffley Creek is outside the main quail range.">
<rect x="212" y="14" width="172" height="50" fill="#efe2d6"/>
<text x="298" y="36" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Region 3</text>
<text x="298" y="57" font-size="15" fill="#2f3a2b" text-anchor="middle">Heffley Creek</text>
</g>
<g data-tip="Quail, Region 8|Open 1 October to 30 November. They live mostly below 750 m, in farm and suburban edges with heavy cover.">
<rect x="18" y="70" width="168" height="96" rx="9" fill="#2f6e3b"/>
<circle cx="102" cy="98" r="23" fill="#fffaf0"/>
<use href="#hf-quail-regions-quail" x="99" y="100"/>
<text x="102" y="140" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Quail open</text>
<text x="102" y="159" font-size="15" fill="#fff" text-anchor="middle">1 Oct to 30 Nov</text>
</g>
<g data-tip="No quail, Region 3|The Region 3 table on page 34 has no quail row. Quail at the property are not legal game: journal them, do not shoot.">
<rect x="214" y="70" width="168" height="96" rx="9" fill="#c0392b"/>
<circle cx="298" cy="98" r="23" fill="#fffaf0"/>
<use href="#hf-quail-regions-quail" x="295" y="100"/>
<path d="M281 81 L315 115" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
<text x="298" y="140" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">No quail</text>
<text x="298" y="159" font-size="15" fill="#fff" text-anchor="middle">no season (95%)</text>
</g>
<g data-tip="Chukar, Region 8|Open 1 October to 30 November. The centre of their BC range is the Okanagan and the Thompson Nicola, nowhere common.">
<rect x="18" y="174" width="168" height="96" rx="9" fill="#8b5a2b"/>
<circle cx="102" cy="202" r="23" fill="#fffaf0"/>
<use href="#hf-quail-regions-chukar" x="99" y="204"/>
<text x="102" y="244" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Chukar open</text>
<text x="102" y="263" font-size="15" fill="#fff" text-anchor="middle">1 Oct to 30 Nov</text>
</g>
<g data-tip="Chukar, Region 3|Rows in Management Units 3-12 to 3-20 and 3-26 to 3-44. The dry Thompson valley from Kamloops toward Lytton holds the best slopes.">
<rect x="214" y="174" width="168" height="96" rx="9" fill="#8b5a2b"/>
<circle cx="298" cy="202" r="23" fill="#fffaf0"/>
<use href="#hf-quail-regions-chukar" x="295" y="204"/>
<text x="298" y="244" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Chukar open</text>
<text x="298" y="263" font-size="15" fill="#fff" text-anchor="middle">1 Oct to 30 Nov</text>
</g>
<text x="102" y="302" font-size="15" fill="#2f3a2b" text-anchor="middle">page 68 (99%)</text>
<text x="298" y="302" font-size="15" fill="#2f3a2b" text-anchor="middle">page 34 (99%)</text>
</svg>
