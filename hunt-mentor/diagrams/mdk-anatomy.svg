<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side view cutaway of a duck facing right. The spine runs along the top. The small lungs lie high against the spine and ribs, under the wing roots. Air sacs fill the rear of the body and sit in front by the neck. The heart sits forward and low, behind the keel. The liver is below the lungs. The gizzard is lower and further back. The big breast muscle covers the keel. Heart and lungs sit high and forward, 75 percent."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Inside a duck: side view</text><path d="M50 150 Q48 105 110 92 L250 86 Q300 84 318 100 Q332 70 350 62 Q376 56 382 76 L396 82 L382 88 Q372 96 352 104 Q340 130 330 160 Q318 214 240 222 L120 222 Q60 214 50 150 Z" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="3"/><path d="M70 110 Q160 92 300 100" stroke="#2f3a2b" stroke-width="5" fill="none"/><path d="M200 214 Q270 214 318 168 L330 150" stroke="#2f3a2b" stroke-width="5" fill="none"/><path d="M210 212 Q272 210 316 166 L300 150 Q250 176 214 176 Z" fill="#c96b5a"/><ellipse cx="135" cy="140" rx="55" ry="26" fill="#bcd8f0" stroke="#4a7fb0" stroke-width="2"/><ellipse cx="300" cy="122" rx="20" ry="16" fill="#bcd8f0" stroke="#4a7fb0" stroke-width="2"/><ellipse cx="236" cy="114" rx="30" ry="11" fill="#e7a3a3" stroke="#b5473a" stroke-width="2"/><path d="M276 140 Q290 136 292 150 Q290 166 278 172 Q266 160 266 148 Q268 138 276 140Z" fill="#b5473a"/><ellipse cx="236" cy="150" rx="26" ry="14" fill="#7a3b22"/><ellipse cx="170" cy="186" rx="22" ry="17" fill="#9a6a3a" stroke="#2f3a2b" stroke-width="2"/><path d="M96 170 q12 -14 24 0 q12 14 24 0" stroke="#a0805a" stroke-width="6" fill="none"/><line x1="236" y1="114" x2="236" y2="38" stroke="#2f3a2b" stroke-width="1.5" fill="none"/><text x="236" y="44" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Lungs</text><line x1="135" y1="140" x2="98" y2="50" stroke="#2f3a2b" stroke-width="1.5" fill="none"/><text x="98" y="56" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Air sacs</text><line x1="300" y1="122" x2="340" y2="38" stroke="#2f3a2b" stroke-width="1.5" fill="none"/><text x="340" y="44" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Air sacs</text><line x1="282" y1="156" x2="352" y2="182" stroke="#2f3a2b" stroke-width="1.5" fill="none"/><text x="352" y="196" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Heart</text><line x1="236" y1="156" x2="252" y2="248" stroke="#2f3a2b" stroke-width="1.5" fill="none"/><text x="252" y="262" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Liver</text><line x1="170" y1="190" x2="150" y2="248" stroke="#2f3a2b" stroke-width="1.5" fill="none"/><text x="150" y="262" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Gizzard</text><line x1="300" y1="196" x2="352" y2="222" stroke="#2f3a2b" stroke-width="1.5" fill="none"/><text x="352" y="236" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Breast</text><line x1="90" y1="108" x2="40" y2="64" stroke="#2f3a2b" stroke-width="1.5" fill="none"/><text x="40" y="70" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Spine</text><text x="200" y="292" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Heart and lungs sit high and forward (75%)</text></svg>
