<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 336" font-family="sans-serif" role="img" aria-label="Where a gamey taste comes from: poor bleeding, slow or careless dressing, slow cooling, fat and silver skin left on, hair, gut contents or a warm truck, and sometimes a rutting buck, which you braise. Myth: soak it in milk. Clean, cool, well trimmed meat needs no soak.">
<rect x="0" y="0" width="400" height="336" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Where &quot;gamey&quot; really comes from</text><rect x="10" y="44" width="185" height="70" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(40 78) scale(0.9)"><path d="M-14 -18 H8 L16 -10 V18 H-14 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -6 H10 M-8 2 H10 M-8 10 H4" stroke="#8a9a6b" stroke-width="2.5"/></g><text x="68" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Poor bleeding</text><rect x="203" y="44" width="185" height="70" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(233 78) scale(0.9)"><path d="M-20 6 L6 -4 Q16 -8 20 -12 Q18 2 6 6 Z" fill="#cfd6bf" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-24" y="2" width="14" height="9" rx="3" fill="#8b5a2b" transform="rotate(-20 -17 6)"/></g><text x="261" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Slow or</text><text x="261" y="86" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">careless</text><text x="261" y="104" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">dressing</text><rect x="10" y="122" width="185" height="70" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(40 156) scale(0.9)"><rect x="-5" y="-20" width="10" height="30" rx="5" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="14" r="8" fill="#b3261e" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-2" y="-6" width="4" height="18" fill="#b3261e"/></g><text x="68" y="146" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Slow cooling</text><rect x="203" y="122" width="185" height="70" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(233 156) scale(0.9)"><path d="M-18 -4 Q-14 -18 6 -14 Q22 -10 18 6 Q12 18 -6 14 Q-20 10 -18 -4 Z" fill="#c0504d" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -2 Q2 -8 10 0" stroke="#f5e0d8" stroke-width="3" fill="none"/><circle cx="8" cy="6" r="3" fill="#f5f0e0"/></g><text x="261" y="146" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Fat and silver</text><text x="261" y="164" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">skin left on</text><rect x="10" y="200" width="185" height="70" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(40 234) scale(0.9)"><rect x="-22" y="-6" width="26" height="16" rx="2" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 -2 h10 l6 6 v6 h-16 z" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-12" cy="12" r="5" fill="#2f3a2b"/><circle cx="12" cy="12" r="5" fill="#2f3a2b"/></g><text x="68" y="224" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Hair, gut</text><text x="68" y="242" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">contents, warm</text><text x="68" y="260" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">truck</text><rect x="203" y="200" width="185" height="70" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(233 234) scale(0.9)"><ellipse cx="2" cy="2" rx="15" ry="8" fill="#8b5a2b"/><path d="M-10 8 v12 M-4 8 v12 M8 8 v12 M14 8 v12" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/><path d="M-12 -2 L-18 -12" stroke="#8b5a2b" stroke-width="6" stroke-linecap="round"/><ellipse cx="-20" cy="-14" rx="6" ry="4" fill="#8b5a2b"/><path d="M-19 -18 l-2 -8 m2 4 l4 -5 M-17 -18 l3 -6" stroke="#6b4f35" stroke-width="2" fill="none" stroke-linecap="round"/></g><text x="261" y="224" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Rutting buck:</text><text x="261" y="242" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">braise it</text><rect x="10" y="280" width="380" height="46" rx="10" fill="#fdf0e6" stroke="#e8590c" stroke-width="2"/><circle cx="34" cy="303" r="11" fill="#e8590c"/><path d="M29 298 l10 10 M39 298 l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="56" y="309" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Myth: soak it in milk. Clean meat needs none.</text>
</svg>
