<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="The compass needle points about 15 degrees east, to the right, of true north. Values for October 2026: Heffley Creek 15.2 degrees east, Mission 15.2 east, Osoyoos 14.6 east, falling about 0.13 degrees a year.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="40" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Declination, October 2026</text><line x1="200" y1="270" x2="200" y2="90" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><text x="200" y="82" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">True north</text><line x1="200" y1="270" x2="245.2" y2="103.7" stroke="#c92a2a" stroke-width="3" stroke-linecap="round"/><polygon points="247.2,96.3 238.5,105.3 250.1,108.5" fill="#c92a2a"/><text x="262" y="96" font-family="sans-serif" font-size="15" fill="#c92a2a" text-anchor="start" font-weight="bold">Needle</text><path d="M200 160 A110 110 0 0 1 228 163" fill="none" stroke="#e8590c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="232" y="150" font-family="sans-serif" font-size="16" fill="#e8590c" text-anchor="start" font-weight="bold">15°</text><rect x="20" y="180" width="160" height="108" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="30" y="204" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Heffley Ck 15.2° E</text><text x="30" y="228" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Mission 15.2° E</text><text x="30" y="252" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Osoyoos 14.6° E</text><text x="30" y="278" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="start">falls 0.13° a year</text>
</svg>
