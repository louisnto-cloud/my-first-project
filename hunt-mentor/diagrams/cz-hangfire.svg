<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" font-family="sans-serif" role="img" aria-label="Failure to fire on the CZ 457: keep the muzzle pointed in a safe direction and wait 30 seconds, because a slow ignition can still fire. Then eject the cartridge and look at it. A light or missing firing pin dent means a gunsmith check (CZ manual safety rule 19)."><rect x="0" y="0" width="400" height="340" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Click but no bang</text><g transform="translate(0 40) scale(1.0)"><path d="M14 108 L128 116 L140 118 L300 120 Q314 121 318 126 L318 132 Q300 138 250 140 L200 141 L162 141 Q150 141 146 150 L136 170 Q132 176 124 174 L120 172 Q126 156 122 146 Q112 142 96 146 L14 168 Z" fill="#9A6B3F"/><path d="M30 116 Q80 120 120 124" stroke="#6E4A2A" stroke-width="1.2" fill="none"/><rect x="7" y="106" width="8" height="64" rx="2" fill="#2B3034"/><path d="M232 105 L390 107 L390 115 L232 117 Z" fill="#4A5156"/><rect x="386" y="106" width="5" height="10" rx="1" fill="#2B3034"/><rect x="255" y="99" width="16" height="7" rx="1.5" fill="#2B3034"/><rect x="266" y="96" width="4" height="4" fill="#2B3034"/><path d="M374 107 L376 97 L388 97 L388 107 Z" fill="#2B3034"/><rect x="140" y="102" width="94" height="17" rx="3" fill="#4A5156"/><rect x="150" y="99" width="78" height="4" fill="#8C959B"/><rect x="160" y="100" width="2" height="2" fill="#2B3034"/><rect x="210" y="100" width="2" height="2" fill="#2B3034"/><rect x="176" y="105" width="36" height="8" rx="1.5" fill="#2B3034"/><rect x="176" y="106" width="36" height="6" fill="#C9CFD3"/><rect x="128" y="104" width="13" height="13" rx="3" fill="#2B3034"/><rect x="121" y="107" width="8" height="7" rx="2" fill="#D8B23A"/><path d="M153 111 L148 131" stroke="#2B3034" stroke-width="5" stroke-linecap="round"/><circle cx="147" cy="136" r="6.5" fill="#2B3034"/><rect x="130" y="119" width="22" height="6" rx="2" fill="#2B3034"/><circle cx="146" cy="122" r="2.6" fill="#FFFFFF"/><rect x="131" y="117.5" width="9" height="9" rx="2" fill="#D8B23A" stroke="#2B3034" stroke-width=".8"/><path d="M158 141 Q156 160 176 160 L196 160 Q204 160 204 141" stroke="#2B3034" stroke-width="3" fill="none"/><path d="M178 141 Q183 150 176 156" stroke="#2B3034" stroke-width="3.5" fill="none" stroke-linecap="round"/><rect x="208" y="138" width="22" height="20" rx="2" fill="#2B3034"/><rect x="231" y="139" width="4" height="9" rx="1" fill="#D8B23A"/><circle cx="70" cy="158" r="2.6" fill="#2B3034"/><circle cx="300" cy="138" r="2.6" fill="#2B3034"/></g><line x1="340" y1="170" x2="383.0" y2="199.7" stroke="#FF6A13" stroke-width="4" stroke-linecap="round"/><path d="M392 206 L386.4 194.8 L379.5 204.7z" fill="#FF6A13"/><text x="286" y="222" font-size="15" font-weight="bold" text-anchor="middle" fill="#FF6A13">Keep it pointed safe</text><circle cx="80" cy="236" r="40" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="3"/><path d="M80 236 L80 204" stroke="#FF6A13" stroke-width="4" stroke-linecap="round"/><path d="M80 236 L80 268" stroke="#1F3D2B" stroke-width="2"/><text x="80" y="300" font-size="18" font-weight="bold" text-anchor="middle" fill="#FF6A13">30 s</text><circle cx="160" cy="257" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="160" y="262" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><text x="176" y="262" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Click, no bang: wait 30 s</text><circle cx="160" cy="281" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="160" y="286" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text><text x="176" y="286" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Then open, eject, check it</text><circle cx="160" cy="305" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="160" y="310" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text><text x="176" y="310" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Light dent: gunsmith</text></svg>
