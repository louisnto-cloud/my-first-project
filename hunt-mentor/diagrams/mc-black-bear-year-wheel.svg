<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Year wheel of a black bear in four parts. Den: December to March, cubs born in January or February. Green up: April to June, the spring season. Berries: July to September, with mating in June and July. Fatten and den: September to November, the fall season. Seasons per the Rule Book for Region 3: spring 1 April to 30 June, fall 1 September to 30 November in most MUs.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">4 seasons of a bear</text><path d="M200 164 L108.1 72.1 A130 130 0 0 1 291.9 72.1 Z" fill="#4a7fb0" opacity=".85" stroke="#fffaf0" stroke-width="4"/><text x="200.0" y="80.0" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Den</text><text x="200.0" y="98.0" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Dec to Mar</text><text x="200.0" y="114.0" font-size="14" fill="#fff" text-anchor="middle">Cubs born</text><path d="M200 164 L291.9 72.1 A130 130 0 0 1 291.9 255.9 Z" fill="#8a9a6b" opacity=".85" stroke="#fffaf0" stroke-width="4"/><text x="278.0" y="158.0" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Green up</text><text x="278.0" y="176.0" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Apr to Jun</text><text x="278.0" y="192.0" font-size="14" fill="#fff" text-anchor="middle">Spring hunt</text><path d="M200 164 L291.9 255.9 A130 130 0 0 1 108.1 255.9 Z" fill="#e8590c" opacity=".85" stroke="#fffaf0" stroke-width="4"/><text x="200.0" y="236.0" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Berries</text><text x="200.0" y="254.0" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Jul to Sep</text><text x="200.0" y="270.0" font-size="14" fill="#fff" text-anchor="middle">Mating Jun, Jul</text><path d="M200 164 L108.1 255.9 A130 130 0 0 1 108.1 72.1 Z" fill="#8b5a2b" opacity=".85" stroke="#fffaf0" stroke-width="4"/><text x="122.0" y="158.0" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Fatten, den</text><text x="122.0" y="176.0" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Sep to Nov</text><text x="122.0" y="192.0" font-size="14" fill="#fff" text-anchor="middle">Fall hunt</text><circle cx="200" cy="164" r="16" fill="#fffaf0"/>
</svg>
