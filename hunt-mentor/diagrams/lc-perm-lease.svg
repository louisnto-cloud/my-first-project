<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 304" font-family="sans-serif" role="img" aria-label="Four cards. Grazing lease with cattle on it: ask the lessee. Grazing lease with no cattle: the Trespass Act still applies. Cultivated land, meaning crops, hay or orchards: ask the owner. Any dwelling or farm building with people or animals: no hunting or shooting within 100 metres. Land that is not fenced or posted can still need a yes.">
<rect x="0" y="0" width="400" height="304" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Leased and cultivated land</text><rect x="10" y="44" width="185" height="108" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(40 78) scale(0.9)"><rect x="-16" y="-6" width="28" height="14" rx="6" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12 8 v10 M-4 8 v10 M4 8 v10 M10 8 v10" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="-12" width="10" height="10" rx="3" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-6" cy="0" r="3" fill="#2f3a2b"/><circle cx="4" cy="2" r="2.5" fill="#2f3a2b"/></g><text x="68" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Grazing lease,</text><text x="68" y="86" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">cattle on it</text><text x="68" y="104" font-size="14" fill="#23261f" text-anchor="start">Ask the lessee</text><rect x="205" y="44" width="185" height="108" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(235 78) scale(0.9)"><path d="M-20 -12 v30 M0 -12 v30 M20 -12 v30" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M-22 -4 h44 M-22 8 h44" stroke="#6b4f35" stroke-width="2" stroke-dasharray="3 3" fill="none"/></g><text x="263" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Grazing lease,</text><text x="263" y="86" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">no cattle</text><text x="263" y="104" font-size="14" fill="#23261f" text-anchor="start">Trespass Act</text><text x="263" y="121" font-size="14" fill="#23261f" text-anchor="start">still applies</text><rect x="10" y="162" width="185" height="108" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(40 196) scale(0.9)"><path d="M-20 18 V-2 L-10 -14 H10 L20 -2 V18 Z" fill="#b3261e" fill-opacity=".75" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-7 18 V4 H7 V18 M-7 4 L7 18 M7 4 L-7 18" stroke="#fff" stroke-width="2"/></g><text x="68" y="186" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Cultivated</text><text x="68" y="204" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">land: crops,</text><text x="68" y="222" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">hay, orchard</text><text x="68" y="240" font-size="14" fill="#23261f" text-anchor="start">Ask the owner</text><rect x="205" y="162" width="185" height="108" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(235 196) scale(0.9)"><path d="M-18 -2 L0 -18 L18 -2" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-14" y="-4" width="28" height="22" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-4" y="6" width="8" height="12" fill="#8b5a2b"/></g><text x="263" y="186" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Any building</text><text x="263" y="204" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">with people or</text><text x="263" y="222" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">animals</text><text x="263" y="240" font-size="14" fill="#23261f" text-anchor="start">No shooting</text><text x="263" y="257" font-size="14" fill="#23261f" text-anchor="start">within 100 m</text><text x="200" y="290" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Not fenced, not posted, still needs a yes.</text>
</svg>
