<rect x="106.5" y="34.0" width="197.0" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="205" y="53" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">front: narrow depth zone</text>
