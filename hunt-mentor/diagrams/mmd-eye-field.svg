<text x="56.261" y="177" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">310 degrees</text>
<rect x="304.9" y="146.0" width="91.1" height="45.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="350.45" y="165" font-size="15" fill="#6b4f35" text-anchor="middle">Penn State</text>
<text x="350.45" y="183" font-size="15" fill="#6b4f35" text-anchor="middle">(80%)</text>
<rect x="132.7" y="272.0" width="144.6" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
