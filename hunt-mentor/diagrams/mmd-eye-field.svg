<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Top view of a mule deer head with its field of view. Eyes on the sides see about 310 degrees without turning the head. A narrow zone straight ahead, seen by both eyes, gives depth. A small blind spot sits straight behind. Penn State, 80 percent.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">What it sees without turning its head</text>
