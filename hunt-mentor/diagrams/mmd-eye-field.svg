<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Top view of a deer head with its field of view. Eyes on the sides see about 310 degrees without turning the head. A narrow zone straight ahead gives depth. A small blind spot sits straight behind.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">What it sees without turning its head</text><path d="M200 160 L244.4 255.2 A 105 105 0 1 0 155.6 255.2 Z" fill="#8a9a6b" opacity="0.45"/><path d="M200 160 L244.4 255.2 A 105 105 0 0 1 155.6 255.2 Z" fill="#e8590c" opacity="0.6"/><path d="M200 160 L155.6 64.8 A 105 105 0 0 1 244.4 64.8 Z" fill="#4a7fb0" opacity="0.5"/><ellipse cx="200" cy="160" rx="16" ry="26" fill="#8b5a2b"/><circle cx="188" cy="148" r="4" fill="#23261f"/><circle cx="212" cy="148" r="4" fill="#23261f"/><text x="200" y="44" font-size="14" fill="#4a7fb0" text-anchor="middle" font-weight="bold">front: narrow depth zone</text><text x="48" y="120" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">sides: about</text><text x="48" y="138" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">310 degrees</text><text x="200" y="288" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">behind: blind spot</text><text x="392" y="120" font-size="14" fill="#6b4f35" text-anchor="end">Penn State</text><text x="392" y="138" font-size="14" fill="#6b4f35" text-anchor="end">(80%)</text>
</svg>
