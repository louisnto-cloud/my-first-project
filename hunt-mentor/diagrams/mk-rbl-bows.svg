<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 718" font-family="sans-serif" role="img" aria-label="Bows and crossbows: the 5 classes. Every big game broadhead at least 2.2 cm wide. Class A: Crossbow, not compound, pull 68 kg (150 lb), Bolt 16.2 g (250 gr) or more, for Elk, moose, bear. Class B: Crossbow, not compound, pull 55 kg (120 lb), Bolt 16.2 g (250 gr) or more, for Deer. Class C: Compound crossbow, pull 45 kg (100 lb) at peak weight, Bolt 16.2 g (250 gr) or more, for Deer and Elk, moose, bear. Class D: Longbow, recurve, compound, pull 18 kg (40 lb) within your draw length, No weight set, for Deer and Elk, moose, bear. Class E: Any bow but a compound crossbow, bison only, pull 22.6 kg (50 lb) within your draw length, Arrow over 26 g (400 gr). Broadhead over 8.1 g. Deer: class B, C or D. Elk, moose, bear: class A, C or D (99%).">
<rect width="400" height="718" rx="12" fill="#EEF1EA"/>
<text x="16" y="30" font-size="18" font-weight="bold" fill="#1F3D2B">Bows and crossbows: the 5 classes</text><text x="16" y="52" font-size="14" fill="#17201A">Every big game broadhead: at least 2.2 cm (7/8 in) wide.</text><g data-tip="Class A|Crossbow, not compound. Minimum pull 68 kg (150 lb). Bolt 16.2 g (250 gr) or more."><rect x="12" y="66" width="376" height="105" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><rect x="12" y="66" width="50" height="105" rx="8" fill="#1F3D2B"/><text x="37" y="128.5" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A</text><text x="74" y="88" font-size="15" font-weight="bold" fill="#17201A">Crossbow, not compound</text><text x="74" y="107" font-size="14" fill="#17201A">Pull: 68 kg (150 lb)</text><text x="74" y="125" font-size="14" fill="#17201A">Bolt 16.2 g (250 gr) or more</text><rect x="74" y="135" width="148" height="24" rx="12" fill="#EEF1EA" stroke="#1F3D2B"/><text x="148" y="152" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Elk, moose, bear</text></g>
<g data-tip="Class B|Crossbow, not compound. Minimum pull 55 kg (120 lb). Bolt 16.2 g (250 gr) or more."><rect x="12" y="179" width="376" height="105" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="2.5"/><rect x="12" y="179" width="50" height="105" rx="8" fill="#1F3D2B"/><text x="37" y="241.5" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">B</text><text x="74" y="201" font-size="15" font-weight="bold" fill="#17201A">Crossbow, not compound</text><text x="74" y="220" font-size="14" fill="#17201A">Pull: 55 kg (120 lb)</text><text x="74" y="238" font-size="14" fill="#17201A">Bolt 16.2 g (250 gr) or more</text><rect x="74" y="248" width="52" height="24" rx="12" fill="#FF6A13" stroke="#FF6A13"/><text x="100" y="265" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Deer</text></g>
<g data-tip="Class C|Compound crossbow. Minimum pull 45 kg (100 lb) at peak weight. Bolt 16.2 g (250 gr) or more."><rect x="12" y="292" width="376" height="105" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="2.5"/><rect x="12" y="292" width="50" height="105" rx="8" fill="#1F3D2B"/><text x="37" y="354.5" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">C</text><text x="74" y="314" font-size="15" font-weight="bold" fill="#17201A">Compound crossbow</text><text x="74" y="333" font-size="14" fill="#17201A">Pull: 45 kg (100 lb) at peak weight</text><text x="74" y="351" font-size="14" fill="#17201A">Bolt 16.2 g (250 gr) or more</text><rect x="74" y="361" width="52" height="24" rx="12" fill="#FF6A13" stroke="#FF6A13"/><text x="100" y="378" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Deer</text><rect x="134" y="361" width="148" height="24" rx="12" fill="#EEF1EA" stroke="#1F3D2B"/><text x="208" y="378" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Elk, moose, bear</text></g>
<g data-tip="Class D|Longbow, recurve, compound. Minimum pull 18 kg (40 lb) within your draw length. No weight set."><rect x="12" y="405" width="376" height="123" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="2.5"/><rect x="12" y="405" width="50" height="123" rx="8" fill="#1F3D2B"/><text x="37" y="476.5" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">D</text><text x="74" y="427" font-size="15" font-weight="bold" fill="#17201A">Longbow, recurve, compound</text><text x="74" y="446" font-size="14" fill="#17201A">Pull: 18 kg (40 lb) within your draw</text>
<text x="74" y="464" font-size="14" fill="#17201A">length</text><text x="74" y="482" font-size="14" fill="#17201A">No weight set</text><rect x="74" y="492" width="52" height="24" rx="12" fill="#FF6A13" stroke="#FF6A13"/><text x="100" y="509" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Deer</text><rect x="134" y="492" width="148" height="24" rx="12" fill="#EEF1EA" stroke="#1F3D2B"/><text x="208" y="509" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Elk, moose, bear</text></g>
<g data-tip="Class E|Any bow but a compound crossbow, bison only. Minimum pull 22.6 kg (50 lb) within your draw length. Arrow over 26 g (400 gr). Broadhead over 8.1 g."><rect x="12" y="536" width="376" height="130" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><rect x="12" y="536" width="50" height="130" rx="8" fill="#1F3D2B"/><text x="37" y="611" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">E</text><text x="74" y="558" font-size="15" font-weight="bold" fill="#17201A">Any bow but a compound crossbow,</text>
<text x="74" y="577" font-size="15" font-weight="bold" fill="#17201A">bison only</text><text x="74" y="596" font-size="14" fill="#17201A">Pull: 22.6 kg (50 lb) within your draw</text>
<text x="74" y="614" font-size="14" fill="#17201A">length</text><text x="74" y="632" font-size="14" fill="#17201A">Arrow over 26 g (400 gr). Broadhead over</text>
<text x="74" y="650" font-size="14" fill="#17201A">8.1 g</text></g>
<text x="16" y="686" font-size="14" font-weight="bold" fill="#1F3D2B">Deer: class B, C or D. Elk, moose, bear:</text>
<text x="16" y="704" font-size="14" font-weight="bold" fill="#1F3D2B">class A, C or D (99%).</text>
</svg>
