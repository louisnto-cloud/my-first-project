<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 370" font-family="sans-serif" role="img" aria-label="Flowchart for meat home from Yukon. Up to 20 kilograms of processed big game meat: no permit needed. Any other wildlife parts, including antlers you find: get a free wildlife export permit in person at a Department of Environment office, which keeps office hours. At the BC line: only boned meat and a cleaned hide, antlers and skull plate.">
<rect x="0" y="0" width="400" height="370" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Yukon: getting meat home</text>
<rect x="16" y="42" width="236" height="54" rx="18" fill="#f3ead6" stroke="#6b4f35" stroke-width="2.5"/>
<text x="28" y="66" font-size="15" font-weight="bold" fill="#2f3a2b">Up to 20 kg of processed</text>
<text x="28" y="85" font-size="15" font-weight="bold" fill="#2f3a2b">big game meat?</text>
<line x1="252" y1="69.0" x2="282" y2="69.0" stroke="#2f3a2b" stroke-width="3"/><polygon points="280,62.0 280,76.0 290,69.0" fill="#2f3a2b"/>
<text x="256" y="61" font-size="14" font-weight="bold" fill="#6b4f35">Yes</text>
<rect x="290" y="42" width="96" height="54" rx="8" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2.5"/>
<text x="298" y="64" font-size="14" font-weight="bold" fill="#2f3a2b">No permit</text>
<text x="298" y="82" font-size="14" font-weight="bold" fill="#2f3a2b">needed (85%)</text>
<line x1="134" y1="96" x2="134" y2="118" stroke="#2f3a2b" stroke-width="3"/><polygon points="127,116 141,116 134,126" fill="#2f3a2b"/>
<rect x="16" y="126" width="368" height="73" rx="8" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/>
<text x="28" y="150" font-size="15" fill="#2f3a2b">Any other wildlife parts, even found</text>
<text x="28" y="169" font-size="15" fill="#2f3a2b">antlers: free export permit at an</text>
<text x="28" y="188" font-size="15" fill="#2f3a2b">Environment office</text>
<line x1="200.0" y1="199" x2="200.0" y2="221" stroke="#2f3a2b" stroke-width="3"/><polygon points="193.0,219 207.0,219 200.0,229" fill="#2f3a2b"/>
<text x="144" y="220" font-size="14" font-weight="bold" fill="#6b4f35">No</text>
<rect x="16" y="229" width="368" height="35" rx="8" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/>
<text x="28" y="253" font-size="15" fill="#2f3a2b">Offices keep office hours. Plan the stop</text>
<line x1="200.0" y1="264" x2="200.0" y2="286" stroke="#2f3a2b" stroke-width="3"/><polygon points="193.0,284 207.0,284 200.0,294" fill="#2f3a2b"/>
<rect x="16" y="294" width="368" height="54" rx="8" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2.5"/>
<text x="28" y="318" font-size="15" font-weight="bold" fill="#2f3a2b">BC line: boned meat, cleaned hide, antlers,</text>
<text x="28" y="337" font-size="15" font-weight="bold" fill="#2f3a2b">skull plate only (99%)</text>
</svg>
