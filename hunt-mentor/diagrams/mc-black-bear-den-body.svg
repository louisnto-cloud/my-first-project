<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Table of how a black bear body changes in the den. Heart rate drops from about 50 to 55 beats a minute to about 10 to 14. Metabolism drops to about 25 percent of normal. Body temperature falls only about 3 to 6 degrees Celsius. The bear does not eat, drink, urinate or defecate for months. It can lose up to a quarter of its body weight.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">In the den: the body slows down</text><text x="175" y="64" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Summer</text><text x="305" y="64" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Denned</text><rect x="10" y="74" width="380" height="36" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="97" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Heart</text><text x="175" y="97" font-size="14" fill="#23261f" text-anchor="middle">50 to 55</text><text x="305" y="97" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">10 to 14 a minute</text><rect x="10" y="116" width="380" height="36" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="139" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Metabolism</text><text x="175" y="139" font-size="14" fill="#23261f" text-anchor="middle">100%</text><text x="305" y="139" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">about 25%</text><rect x="10" y="158" width="380" height="36" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="181" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Body temp</text><text x="175" y="181" font-size="14" fill="#23261f" text-anchor="middle">normal</text><text x="305" y="181" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">3 to 6 C lower</text><rect x="10" y="200" width="380" height="36" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="223" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Eat, drink</text><text x="175" y="223" font-size="14" fill="#23261f" text-anchor="middle">yes</text><text x="305" y="223" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">none for months</text><rect x="10" y="242" width="380" height="36" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="265" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Weight</text><text x="175" y="265" font-size="14" fill="#23261f" text-anchor="middle">fall peak</text><text x="305" y="265" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">a quarter lost</text>
</svg>
