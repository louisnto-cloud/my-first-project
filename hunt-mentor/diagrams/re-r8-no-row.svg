<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 455" role="img" aria-label="Grid: No row, or protected, in Region 8. Mountain sheep: ✕. Mountain goat: ✕. Caribou: ✕. Grizzly bear: ✕. Ptarmigan: ✕. Sharp tailed grouse: ✕. Band tailed pigeon: ✕. Columbian ground squirrel: ✕. White tailed jackrabbit: Protected. Nuttall&#x27;s cottontail: Protected. Badger: Protected." font-family="sans-serif">
