<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Comparison card. Tikka T3x: safety back is on, and it locks the trigger, sear and the bolt; a red dot showing means ready to fire; to unload you must take the safety off with the muzzle in a safe direction. CZ 457: safety back is on and locks the trigger, but the bolt still opens; a white dot shows safety on; you can unload with the safety on.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Two rifles, two safeties</text><rect x="12" y="44" width="184" height="200" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="104.0" y="66" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Tikka T3x</text><text x="104.0" y="88" font-size="14" fill="#23261f" text-anchor="middle">Safety ON (back):</text><text x="104.0" y="106" font-size="14" fill="#23261f" text-anchor="middle">locks trigger, sear</text><text x="104.0" y="124" font-size="14" fill="#23261f" text-anchor="middle">AND the bolt</text><text x="104.0" y="142" font-size="14" fill="#23261f" text-anchor="middle"></text><text x="104.0" y="160" font-size="14" fill="#23261f" text-anchor="middle">Red dot showing</text><text x="104.0" y="178" font-size="14" fill="#23261f" text-anchor="middle">= ready to fire</text><text x="104.0" y="196" font-size="14" fill="#23261f" text-anchor="middle">To unload: safety</text><text x="104.0" y="214" font-size="14" fill="#23261f" text-anchor="middle">off, muzzle safe</text><rect x="204" y="44" width="184" height="200" rx="8" fill="#f8e3cf" stroke="none" stroke-width="2"/><text x="296.0" y="66" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">CZ 457</text><text x="296.0" y="88" font-size="14" fill="#23261f" text-anchor="middle">Safety ON (back):</text><text x="296.0" y="106" font-size="14" fill="#23261f" text-anchor="middle">locks the trigger</text><text x="296.0" y="124" font-size="14" fill="#23261f" text-anchor="middle">bolt still opens</text><text x="296.0" y="142" font-size="14" fill="#23261f" text-anchor="middle"></text><text x="296.0" y="160" font-size="14" fill="#23261f" text-anchor="middle">White dot showing</text><text x="296.0" y="178" font-size="14" fill="#23261f" text-anchor="middle">= safety on</text><text x="296.0" y="196" font-size="14" fill="#23261f" text-anchor="middle">Unload with</text><text x="296.0" y="214" font-size="14" fill="#23261f" text-anchor="middle">safety ON</text><text x="200.0" y="276" font-size="14" fill="#2f3a2b" text-anchor="middle">Learn yours with an empty rifle first</text>
</svg>
