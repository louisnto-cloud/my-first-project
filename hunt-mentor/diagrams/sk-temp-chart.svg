<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 384" font-family="sans-serif" role="img" aria-label="Thermometer chart of meat temperatures. Cook all wild game to at least 71 degrees Celsius. The danger zone is 4 to 60 degrees, where bacteria can double every 20 minutes. Target for the carcass: below 4 degrees, fast. Aging: 1 to 3 degrees for 7 to 14 days at most. Freezer: minus 18 degrees, game keeps about a year.">
<rect x="0" y="0" width="400" height="384" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">Meat temperatures to know</text><rect x="60" y="65.0" width="26" height="247.0" rx="13" fill="#fff" stroke="#23261f" stroke-width="2.5"/><circle cx="73" cy="326.0" r="18" fill="#b3261e" stroke="#23261f" stroke-width="2.5"/><rect x="64" y="104.0" width="18" height="145.6" fill="#b3261e" fill-opacity=".55"/><rect x="64" y="252.2" width="18" height="5.199999999999989" fill="#4a7fb0"/><rect x="64" y="249.6" width="18" height="62.400000000000006" fill="#4a7fb0" fill-opacity=".25"/><line x1="86" y1="75.4" x2="104" y2="75.4" stroke="#b3261e" stroke-width="2.5"/><path d="M104 75.4 L118 70.4" stroke="#b3261e" stroke-width="1.5" fill="none"/><text x="122" y="69.4" font-size="15" font-weight="bold" fill="#b3261e">71°C (160°F)</text><text x="122" y="87.4" font-size="13" fill="#2f3a2b">Cook all wild game to at least this</text><path d="M92 104.0 L98 104.0 L98 249.6 L92 249.6" stroke="#b3261e" stroke-width="2" fill="none"/><path d="M98 176.79999999999998 L118 171.79999999999998" stroke="#b3261e" stroke-width="1.5"/><text x="122" y="170.79999999999998" font-size="15" font-weight="bold" fill="#b3261e">4 to 60°C (40 to 140°F)</text><text x="122" y="188.79999999999998" font-size="13" fill="#2f3a2b">Danger zone: bacteria can double every 20 min</text><line x1="86" y1="249.6" x2="104" y2="249.6" stroke="#2e7d32" stroke-width="2.5"/><path d="M104 249.6 L118 240.6" stroke="#2e7d32" stroke-width="1.5" fill="none"/><text x="122" y="239.6" font-size="15" font-weight="bold" fill="#2e7d32">Below 4°C (40°F)</text><text x="122" y="257.6" font-size="13" fill="#2f3a2b">Target for the carcass, fast</text><line x1="86" y1="254.8" x2="104" y2="254.8" stroke="#4a7fb0" stroke-width="2.5"/><path d="M104 254.8 L118 281.8" stroke="#4a7fb0" stroke-width="1.5" fill="none"/><text x="122" y="280.8" font-size="15" font-weight="bold" fill="#4a7fb0">1 to 3°C (34 to 37°F)</text><text x="122" y="298.8" font-size="13" fill="#2f3a2b">Aging, 7 to 14 days max</text><line x1="86" y1="306.8" x2="104" y2="306.8" stroke="#4a7fb0" stroke-width="2.5"/><path d="M104 306.8 L118 329.8" stroke="#4a7fb0" stroke-width="1.5" fill="none"/><text x="122" y="328.8" font-size="15" font-weight="bold" fill="#4a7fb0">Minus 18°C (0°F)</text><text x="122" y="346.8" font-size="13" fill="#2f3a2b">Freezer: game keeps about a year</text><text x="200" y="376" font-size="13" text-anchor="middle" fill="#2f3a2b">Food safety sources, not BC law (80 to 95%)</text>
</svg>
