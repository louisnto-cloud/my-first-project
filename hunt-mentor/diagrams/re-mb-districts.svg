<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 426" font-family="sans-serif" role="img" aria-label="The 8 BC migratory bird districts, from federal Schedule 3, Part 10, section 1. MU means Management Unit. District 1 Vancouver Island: MUs 1-1 to 1-15. District 2 Lower Mainland: MUs 2-2 to 2-19. District 3 Thompson: MUs 3-12 to 3-20 and 3-26 to 3-44. District 4 Kootenay: MUs 4-1 to 4-9 and 4-14 to 4-40. District 5 Cariboo: MUs 5-1 to 5-15. District 6 Skeena: MUs 6-1 to 6-30. District 7 Omineca and Peace: MUs 7-2 to 7-58. District 8 Okanagan: MUs 8-1 to 8-15 and 8-21 to 8-26. The district names are 95%, my reading of page 2.">
<rect width="400" height="426" fill="#fffaf0"/>
<text x="14" y="23" font-size="14" font-weight="bold" fill="#6b5b4b">Schedule 3, Part 10, s. 1</text>
<text x="56" y="48" font-size="14" font-weight="bold" fill="#6b5b4b">District</text>
<text x="386" y="48" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="end">MUs (Management Units)</text>
<rect x="8" y="56" width="384" height="40" rx="6" fill="#f4eedf"/>
<circle cx="32" cy="76" r="15" fill="#2c5d86"/>
<text x="32" y="82" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">1</text>
<text x="56" y="82" font-size="16" font-weight="bold" fill="#2f3a2b">Vancouver Island</text>
<text x="386" y="82" font-size="15" fill="#2f3a2b" text-anchor="end">1-1 to 1-15</text>
<circle cx="32" cy="118" r="15" fill="#2c5d86"/>
<text x="32" y="124" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text>
<text x="56" y="124" font-size="16" font-weight="bold" fill="#2f3a2b">Lower Mainland</text>
<text x="386" y="124" font-size="15" fill="#2f3a2b" text-anchor="end">2-2 to 2-19</text>
<rect x="8" y="140" width="384" height="40" rx="6" fill="#f4eedf"/>
<circle cx="32" cy="160" r="15" fill="#2c5d86"/>
<text x="32" y="166" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">3</text>
<text x="56" y="166" font-size="16" font-weight="bold" fill="#2f3a2b">Thompson</text>
<text x="386" y="166" font-size="15" fill="#2f3a2b" text-anchor="end">3-12 to 3-20, 3-26 to 3-44</text>
<circle cx="32" cy="202" r="15" fill="#2c5d86"/>
<text x="32" y="208" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">4</text>
<text x="56" y="208" font-size="16" font-weight="bold" fill="#2f3a2b">Kootenay</text>
<text x="386" y="208" font-size="15" fill="#2f3a2b" text-anchor="end">4-1 to 4-9, 4-14 to 4-40</text>
<rect x="8" y="224" width="384" height="40" rx="6" fill="#f4eedf"/>
<circle cx="32" cy="244" r="15" fill="#2c5d86"/>
<text x="32" y="250" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">5</text>
<text x="56" y="250" font-size="16" font-weight="bold" fill="#2f3a2b">Cariboo</text>
<text x="386" y="250" font-size="15" fill="#2f3a2b" text-anchor="end">5-1 to 5-15</text>
<circle cx="32" cy="286" r="15" fill="#2c5d86"/>
<text x="32" y="292" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">6</text>
<text x="56" y="292" font-size="16" font-weight="bold" fill="#2f3a2b">Skeena</text>
<text x="386" y="292" font-size="15" fill="#2f3a2b" text-anchor="end">6-1 to 6-30</text>
<rect x="8" y="308" width="384" height="40" rx="6" fill="#f4eedf"/>
<circle cx="32" cy="328" r="15" fill="#2c5d86"/>
<text x="32" y="334" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">7</text>
<text x="56" y="334" font-size="16" font-weight="bold" fill="#2f3a2b">Omineca and Peace</text>
<text x="386" y="334" font-size="15" fill="#2f3a2b" text-anchor="end">7-2 to 7-58</text>
<circle cx="32" cy="370" r="15" fill="#2c5d86"/>
<text x="32" y="376" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">8</text>
<text x="56" y="376" font-size="16" font-weight="bold" fill="#2f3a2b">Okanagan</text>
<text x="386" y="376" font-size="15" fill="#2f3a2b" text-anchor="end">8-1 to 8-15, 8-21 to 8-26</text>
<text x="14" y="412" font-size="14" fill="#6b5b4b">Names: 95%, my reading of page 2.</text>
</svg>
