<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side view of broken hills. A main wind blows left to right over the ridges. In the saddle and draw the air swirls. Behind the far ridge an eddy curls back. Check the wind often in broken ground.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Where the wind lies to you</text><path d="M0 250 L60 200 L120 120 L170 170 L200 190 L230 170 L290 90 L350 160 L400 210 L400 300 L0 300 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><line x1="20" y1="70" x2="110" y2="70" stroke="#4a7fb0" stroke-width="3"/><polygon points="110.0,70.0 101.0,74.3 101.0,65.7" fill="#4a7fb0"/><text x="20" y="60" font-size="14" fill="#4a7fb0" text-anchor="start" font-weight="bold">main wind</text><path d="M178 150 A 22 22 0 1 1 200 172 A 13.2 13.2 0 1 1 206.6 145.6" fill="none" stroke="#e8590c" stroke-width="3"/><path d="M151 125 A 14 14 0 1 1 165 139 A 8.4 8.4 0 1 1 169.2 122.2" fill="none" stroke="#e8590c" stroke-width="3"/><text x="200" y="112" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">saddle and draw: swirl</text><path d="M300 100 Q 340 60 380 80" fill="none" stroke="#4a7fb0" stroke-width="3"/><line x1="370" y1="76" x2="384" y2="82" stroke="#4a7fb0" stroke-width="3"/><polygon points="384.0,82.0 374.0,82.5 377.4,74.5" fill="#4a7fb0"/><text x="330" y="56" font-size="14" fill="#4a7fb0" text-anchor="middle">over the ridge</text><path d="M352 166 Q 330 150 320 170 Q 340 190 360 176" fill="none" stroke="#e8590c" stroke-width="3"/><text x="320" y="214" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">eddy behind</text><text x="320" y="230" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">the ridge</text><text x="200" y="270" font-size="14" fill="#23261f" text-anchor="middle">Check wind often in broken ground (Tip)</text>
</svg>
