<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 488" font-family="sans-serif" role="img" aria-label="Duck gun rules. A pump shotgun cut away to show 3 shells in total: 1 in the chamber and 2 in the magazine, with a one piece plug filling the rest of the magazine that can be removed only by taking the gun apart. Non toxic shot only: steel, bismuth, tungsten or tin, and no other shot in your pockets or boat. No slugs, and a shotgun 10 gauge or smaller. One shotgun: a second gun unloaded and taken apart or cased. Lead is still allowed for band tailed pigeon, collared dove and, in BC, mourning dove (s. 38).">
