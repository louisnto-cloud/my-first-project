<text x="88" y="423" font-size="15" fill="#2f3a2b">A second gun unloaded and taken apart</text>
<text x="88" y="442" font-size="15" fill="#2f3a2b">or cased</text>
<text x="200" y="476" font-size="15" font-weight="bold" fill="#6b4f35" text-anchor="middle">Lead still OK: band tailed pigeon, doves (s. 38)</text>
