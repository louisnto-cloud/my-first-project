<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of energy for a 150 grain .308: 3,590 joules at the muzzle, 2,840 at 100 m, 2,210 at 200 m, 1,700 at 300 m and 1,260 at 400 m. A dashed line marks the 1,356 joule rule of thumb, which the load passes to about 350 m. Placement matters more than joules.">
