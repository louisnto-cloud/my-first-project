<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 386" font-family="sans-serif" role="img" aria-label="The Arctic iron sights. Left, the front sight on the muzzle: 1 the front post between two protective ears, 2 the elevation screw, 3 the guiding screw, 4 the attachment screw. Right, the rear drum seen from behind: 5 the peep aperture, 6 the windage screws on each side, 7 the four set screws on the base. Warning: never open the screw in the centre of the drum, spring parts fly out.">
<rect x="0" y="0" width="400" height="386" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Your iron sights</text><rect x="10" y="40" width="186" height="190" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="103" y="62" font-size="15" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Front sight</text><rect x="-14.0" y="153.2" width="84.0" height="33.599999999999994" fill="#C9D0C6" stroke="#1F3D2B" stroke-width="1.4"/><rect x="70" y="147.6" width="64.39999999999999" height="44.8" rx="4.199999999999999" fill="#8F9A8C" stroke="#1F3D2B" stroke-width="1.6"/><path d="M72.8 147.6 L81.2 97.2 L92.4 97.2 L95.2 147.6Z" fill="#8F9A8C" stroke="#1F3D2B" stroke-width="1.4"/><path d="M112.0 147.6 L114.8 97.2 L126.0 97.2 L134.39999999999998 147.6Z" fill="#8F9A8C" stroke="#1F3D2B" stroke-width="1.4"/><rect x="96.6" y="108.4" width="12.6" height="39.199999999999996" fill="#3A463C" stroke="#1F3D2B" stroke-width="1.2"/><circle cx="102.9" cy="153.2" r="5.6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.4"/><circle cx="84.0" cy="178.4" r="4.8999999999999995" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.2"/><rect x="95.2" y="192.4" width="16.799999999999997" height="11.2" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.2"/><g data-tip="Front post|The post you put on the target. Two ears guard it."><line x1="40" y1="90" x2="103" y2="120" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="103" cy="120" r="2.6" fill="#1F3D2B"/><circle cx="40" cy="90" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="40" y="95" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text></g><g data-tip="Elevation screw|Turn it to move the post up or down. One click is about 7 mm at 100 m."><line x1="170" y1="100" x2="103" y2="153" stroke="#FF6A13" stroke-width="1.6"/><circle cx="103" cy="153" r="2.6" fill="#FF6A13"/><circle cx="170" cy="100" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="170" y="105" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text></g><g data-tip="Guiding screw|Locates the sight in the slot on the barrel end."><line x1="40" y1="210" x2="84" y2="178" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="84" cy="178" r="2.6" fill="#1F3D2B"/><circle cx="40" cy="210" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="40" y="215" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text></g><g data-tip="Attachment screw|Holds the sight on the muzzle thread. 5 Nm."><line x1="170" y1="214" x2="106" y2="200" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="106" cy="200" r="2.6" fill="#1F3D2B"/><circle cx="170" cy="214" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="170" y="219" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text></g><rect x="204" y="40" width="186" height="190" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="297" y="62" font-size="15" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Rear drum (back)</text><rect x="235.4" y="170.8" width="123.19999999999999" height="25.2" fill="#8F9A8C" stroke="#1F3D2B" stroke-width="1.4"/><circle cx="246.6" cy="183.4" r="5.04" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.2"/><circle cx="271.8" cy="183.4" r="5.04" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.2"/><circle cx="322.2" cy="183.4" r="5.04" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.2"/><circle cx="347.4" cy="183.4" r="5.04" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.2"/><rect x="235.4" y="103.6" width="123.19999999999999" height="67.19999999999999" rx="8.399999999999999" fill="#C9D0C6" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="297" cy="137.2" r="12.6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><circle cx="297" cy="137.2" r="5.6" fill="#EEF1EA" stroke="#1F3D2B" stroke-width="1"/><rect x="218.60000000000002" y="137.2" width="16.799999999999997" height="19.599999999999998" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.2"/><rect x="358.6" y="137.2" width="16.799999999999997" height="19.599999999999998" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.2"/><g data-tip="Peep aperture|You look through it, not at it. Six apertures on the drum, one per range step."><line x1="240" y1="92" x2="297" y2="137" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="297" cy="137" r="2.6" fill="#1F3D2B"/><circle cx="240" cy="92" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="240" y="97" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text></g><g data-tip="Windage screws|One each side. They move the drum left or right."><line x1="370" y1="100" x2="366" y2="148" stroke="#FF6A13" stroke-width="1.6"/><circle cx="366" cy="148" r="2.6" fill="#FF6A13"/><circle cx="370" cy="100" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="370" y="105" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text></g><g data-tip="Set screws|Four screws hold the sight on the rail. 0.8 Nm."><line x1="236" y1="214" x2="272" y2="184" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="272" cy="184" r="2.6" fill="#1F3D2B"/><circle cx="236" cy="214" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="236" y="219" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">7</text></g><circle cx="24" cy="251" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="256" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="40" y="256" font-size="14" fill="#17201A" text-anchor="start">Front post</text><circle cx="24" cy="273" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="278" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="40" y="278" font-size="14" fill="#17201A" text-anchor="start">Elevation screw</text><circle cx="24" cy="295" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="300" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="40" y="300" font-size="14" fill="#17201A" text-anchor="start">Guiding screw</text><circle cx="24" cy="317" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="322" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="40" y="322" font-size="14" fill="#17201A" text-anchor="start">Attachment screw</text><circle cx="216" cy="251" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="216" y="256" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="232" y="256" font-size="14" fill="#17201A" text-anchor="start">Peep aperture</text><circle cx="216" cy="273" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="216" y="278" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text><text x="232" y="278" font-size="14" fill="#17201A" text-anchor="start">Windage screws</text><circle cx="216" cy="295" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="216" y="300" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">7</text><text x="232" y="300" font-size="14" fill="#17201A" text-anchor="start">Set screws (4)</text><rect x="10" y="346" width="380" height="30" rx="6" fill="#FF6A13"/><text x="200" y="366.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Never open the screw in the drum centre.</text>
</svg>
