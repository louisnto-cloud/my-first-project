<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 382" font-family="sans-serif" role="img" aria-label="Home or the shop. Cost: home is your evening; a shop example is 150 dollars flat under 125 pounds. Time: 3 to 5 hours for a first deer at home; a shop takes a week or two. Quality: your own trim and labels at home; at a shop it depends. Learning: at home you learn the animal; at a shop you learn nothing. Sausage: home needs a grinder and stuffer; a shop adds the pork. Lean: first deer at home, moose at a shop or rent a grinder.">
<rect x="0" y="0" width="400" height="382" fill="#fffaf0"/>
