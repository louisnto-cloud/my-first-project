x="179" y="180" font-size="13" fill="#23261f" text-anchor="middle">deer</text><rect x="254" y="144" width="138" height="46" rx="6" fill="#fff" stroke="#4a7fb0" stroke-width="1.5"/><text x="323" y="164" font-size="13" fill="#23261f" text-anchor="middle">1 to 2 weeks wait</text><text x="102" y="224" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Quality</text><rect x="110" y="196" width="138" height="46" rx="6" fill="#fff" stroke="#8a9a6b" stroke-width="1.5"/><text x="179" y="216" font-size="13" fill="#23261f" text-anchor="middle">Your trim, your</text><text x="179" y="232" font-size="13" fill="#23261f" text-anchor="middle">labels</text><rect x="254" y="196" width="138" height="46" rx="6" fill="#fff" stroke="#4a7fb0" stroke-width="1.5"/><text x="323" y="216" font-size="13" fill="#23261f" text-anchor="middle">Depends on the</text><text x="323" y="232" font-size="13" fill="#23261f" text-anchor="middle">shop</text><text x="102" y="276" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Learning</text><rect x="110" y="248" width="138" height="46" rx="6" fill="#fff" stroke="#8a9a6b" stroke-width="1.5"/><text x="179" y="268" font-size="13" fill="#23261f" text-anchor="middle">You learn the</text><text x="179" y="284" font-size="13" fill="#23261f" text-anchor="middle">animal</text><rect x="254" y="248" width="138" height="46" rx="6" fill="#fff" stroke="#4a7fb0" stroke-width="1.5"/><text x="323" y="268" font-size="13" fill="#23261f" text-anchor="middle">You learn nothing</text><text x="102" y="328" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Sausage</text><rect x="110" y="300" width="138" height="46" rx="6" fill="#fff" stroke="#8a9a6b" stroke-width="1.5"/><text x="179" y="320" font-size="13" fill="#23261f" text-anchor="middle">Grinder, stuffer</text><rect x="254" y="300" width="138" height="46" rx="6" fill="#fff" stroke="#4a7fb0" stroke-width="1.5"/><text x="323" y="320" font-size="13" fill="#23261f" text-anchor="middle">Easy, they add</text><text x="323" y="336" font-size="13" fill="#23261f" text-anchor="middle">pork</text><text x="200" y="368" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Lean: first deer at home. Moose: shop or rent a grinder.</text>
