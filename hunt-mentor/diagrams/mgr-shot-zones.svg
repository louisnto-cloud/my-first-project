<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-label="Two panels. Rimfire on a sitting bird: aim at the head or upper neck. Shotgun on a flying bird: put the pattern on the head and front of the bird, a little ahead of it. Either way aim for the front, where the brain, spine, heart and lungs are." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="290" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Where to put the shot</text>
<rect x="10" y="42" width="185" height="200" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
<rect x="205" y="42" width="185" height="200" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
<text x="102" y="66" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">.22, sitting</text>
<text x="298" y="66" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Shotgun, flying</text>
<g transform="translate(95 160) scale(1.5 1.5)"><polygon points="-20,-6 -38,-20 -48,-12 -52,0 -48,8 -20,8" fill="#8b5a2b"/><path d="M-40 -18 Q-50 -10 -48 6" fill="none" stroke="#23261f" stroke-width="3"/><ellipse cx="0" cy="0" rx="26" ry="15" fill="#c9a77f"/><circle cx="21" cy="-14" r="8" fill="#c9a77f"/><polygon points="16,-20 20,-28 25,-20" fill="#c9a77f"/><polygon points="28,-16 35,-13 28,-10" fill="#6b4f35"/><circle cx="23" cy="-16" r="1.8" fill="#23261f"/><path d="M2 13 l-2 11 M10 13 l2 11" stroke="#6b4f35" stroke-width="2.5" fill="none"/></g>
<circle cx="126" cy="138" r="14" fill="none" stroke="#2f3a2b" stroke-width="4"/>
<text x="102" y="214" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Head, upper neck</text>
<g transform="translate(280 160) scale(1.1 1.1)"><polygon points="-20,-6 -38,-20 -48,-12 -52,0 -48,8 -20,8" fill="#8b5a2b"/><path d="M-40 -18 Q-50 -10 -48 6" fill="none" stroke="#23261f" stroke-width="3"/><ellipse cx="0" cy="0" rx="26" ry="15" fill="#c9a77f"/><circle cx="21" cy="-14" r="8" fill="#c9a77f"/><polygon points="16,-20 20,-28 25,-20" fill="#c9a77f"/><polygon points="28,-16 35,-13 28,-10" fill="#6b4f35"/><circle cx="23" cy="-16" r="1.8" fill="#23261f"/><path d="M2 13 l-2 11 M10 13 l2 11" stroke="#6b4f35" stroke-width="2.5" fill="none"/></g>
<circle cx="318" cy="140" r="34" fill="#e8590c" stroke="none" stroke-width="0" opacity=".3"/>
<text x="298" y="214" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Pattern on the head</text>
<text x="298" y="232" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">and front, a bit ahead</text>
<text x="200" y="270" font-size="14" fill="#23261f" text-anchor="middle">Aim for the front: brain, spine, heart, lungs.</text>
</svg>
