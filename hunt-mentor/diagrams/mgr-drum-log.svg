<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 305" role="img" aria-label="A ruffed grouse drum log: a big mossy log at a forest edge with an open forest floor around it so the male can see, thick cover overhead to hide from hawks, and a pile of droppings on the one spot where he stands to drum, 85 percent." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="305" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">A drum log: what to look for</text>
<rect x="0" y="230" width="400" height="70" fill="#dfe6d3"/>
<polygon points="60,112 6.0,232 114.0,232" fill="#2f3a2b"/><rect x="57" y="232" width="6" height="18" fill="#6b4f35"/>
<polygon points="350,122 300.5,232 399.5,232" fill="#2f3a2b"/><rect x="347" y="232" width="6" height="16" fill="#6b4f35"/>
<rect x="107" y="192" width="6" height="42" fill="#d8d2c4" stroke="#6b4f35" stroke-width="1"/><ellipse cx="110" cy="174" rx="27" ry="31" fill="#8a9a6b"/>
<rect x="297" y="196" width="6" height="38" fill="#d8d2c4" stroke="#6b4f35" stroke-width="1"/><ellipse cx="300" cy="180" rx="24" ry="28" fill="#8a9a6b"/>
<rect x="120" y="205" width="170" height="28" rx="14" fill="#6b4f35"/><path d="M130 205 q30 -6 60 0" stroke="#8a9a6b" stroke-width="5" fill="none"/>
<g transform="translate(240 200)"><path d="M-12 0 q3 -6 8 -6" fill="none" stroke="#e8e0c8" stroke-width="5" stroke-linecap="round"/><path d="M-2 3 q3 -6 8 -6" fill="none" stroke="#e8e0c8" stroke-width="5" stroke-linecap="round"/><path d="M8 -1 q3 -6 8 -6" fill="none" stroke="#e8e0c8" stroke-width="5" stroke-linecap="round"/><path d="M-6 -6 q3 -6 8 -6" fill="none" stroke="#e8e0c8" stroke-width="5" stroke-linecap="round"/><path d="M4 -8 q3 -6 8 -6" fill="none" stroke="#e8e0c8" stroke-width="5" stroke-linecap="round"/></g>
<circle cx="240" cy="196" r="22" fill="none" stroke="#e8590c" stroke-width="3"/>
<text x="150" y="70" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Thick cover overhead</text>
<text x="150" y="88" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">for hiding from hawks</text>
<text x="10" y="268" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Big mossy log, open floor around it,</text>
<text x="10" y="286" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">a pile of droppings on one spot (85%).</text>
</svg>
