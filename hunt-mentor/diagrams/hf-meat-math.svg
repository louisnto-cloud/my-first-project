<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Mule deer weight chart in kilograms. Buck live weight about 68 to 113. Field dressed about 54 to 86. Bone in quarters for a mature buck about 41 to 48. Boned meat from a forkhorn or doe about 23. Two hunters carry about 20 to 25 kilograms each a trip.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="24" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Mule deer weights (kg)</text>
  <line x1="130" y1="200" x2="390" y2="200" stroke="#2f3a2b" stroke-width="2"/>
  <g font-size="14" fill="#2f3a2b" text-anchor="middle"><text x="130" y="218">0</text><text x="180" y="218">25</text><text x="230" y="218">50</text><text x="280" y="218">75</text><text x="330" y="218">100</text></g>
  <g font-size="14" font-weight="bold" fill="#2f3a2b"><text x="8" y="58">Live buck</text><text x="8" y="98">Field dressed</text><text x="8" y="138">Quarters, bone</text><text x="8" y="178">Boned, small</text></g>
  <rect x="130" y="42" width="136" height="22" fill="#8b5a2b" opacity=".35"/><rect x="266" y="42" width="90" height="22" fill="#8b5a2b"/>
  <rect x="130" y="82" width="108" height="22" fill="#8b5a2b" opacity=".35"/><rect x="238" y="82" width="64" height="22" fill="#8b5a2b"/>
  <rect x="130" y="122" width="82" height="22" fill="#e8590c" opacity=".35"/><rect x="212" y="122" width="14" height="22" fill="#e8590c"/>
  <rect x="130" y="162" width="46" height="22" fill="#2f6e3b"/>
  <g font-size="14" font-weight="bold" fill="#2f3a2b"><text x="262" y="58" text-anchor="end">68 to 113</text></g>
  <g font-size="14" font-weight="bold" fill="#2f3a2b"><text x="308" y="98">54 to 86</text><text x="232" y="138">41 to 48 (60%)</text><text x="182" y="178">about 23</text></g>
  <rect x="12" y="234" width="376" height="56" rx="8" fill="#2f3a2b"/>
  <text x="200" y="256" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2 hunters, 20 to 25 kg each a trip (Tip)</text>
  <text x="200" y="276" font-size="14" font-weight="bold" fill="#ffd34d" text-anchor="middle">Boned: 1 trip. Bone in: 2 trips</text>
</svg>
