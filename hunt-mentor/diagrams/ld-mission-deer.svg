<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 472" font-family="sans-serif" role="img" aria-label="Cards for deer, bear and grouse near Mission with legal access. Mission bylaw Area D: rifle or shotgun while hunting. Area C around Hoover Lake: shotgun with shot or slug. Forest Service Roads north of Mission such as Florence Lake and Lost Creek: no shooting within 400 metres unless lawfully hunting, so hunting is allowed and plinking is not. Chehalis, Map B33: discharge for the purpose of hunting permitted. Davis Lake Park, Golden Ears and Rolley Lake parks: no hunting listed, treat as closed.">
