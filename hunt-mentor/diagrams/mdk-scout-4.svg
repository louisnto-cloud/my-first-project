<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Scouting step 4. A hand shake with a landowner beside a gate, and a wind arrow. Caption: get permission, then plan the hide for tomorrow wind."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Scout 4: permission and wind</text><rect x="60" y="120" width="120" height="90" rx="6" fill="#c9b79c"/><line x1="60" y1="120" x2="180" y2="210" stroke="#2f3a2b" stroke-width="3" fill="none"/><line x1="180" y1="120" x2="60" y2="210" stroke="#2f3a2b" stroke-width="3" fill="none"/><text x="120" y="110" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Gate</text><line x1="230" y1="140" x2="354.0" y2="140.0" stroke="#4a7fb0" stroke-width="5" fill="none"/><polygon points="360.0,140.0 349.0,134.0 349.0,146.0" fill="#4a7fb0"/><text x="296" y="126" font-size="15" fill="#4a7fb0" text-anchor="middle" font-weight="bold">Wind tomorrow</text><text x="296" y="180" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">Ask first.</text><rect x="10" y="256" width="380" height="38" rx="8" fill="#2f3a2b"/><text x="200" y="281" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Permission first, then plan for the wind</text></svg>
