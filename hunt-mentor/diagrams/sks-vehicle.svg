<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A truck. In any vehicle: chamber empty and the fixed magazine empty too, because on the SKS the magazine is always attached.">
