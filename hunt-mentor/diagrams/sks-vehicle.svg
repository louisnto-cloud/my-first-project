<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">In a vehicle</text>
<rect x="40.0" y="140.0" width="320.0" height="70.0" rx="16" fill="#7E8C83" stroke="#17201A" stroke-width="2"/><rect x="80.0" y="110.0" width="160.0" height="40.0" rx="10" fill="#A9B5AD" stroke="#17201A" stroke-width="2"/><circle cx="110.0" cy="212.0" r="20.0" fill="#17201A" stroke="#17201A" stroke-width="1.5"/><circle cx="300.0" cy="212.0" r="20.0" fill="#17201A" stroke="#17201A" stroke-width="1.5"/><text x="200.0" y="60.0" font-size="16" font-weight="bold" fill="#FF6A13" text-anchor="middle">Chamber empty.</text><text x="200.0" y="84.0" font-size="16" font-weight="bold" fill="#FF6A13" text-anchor="middle">Fixed magazine empty too.</text><text x="200.0" y="262.0" font-size="14" fill="#17201A" text-anchor="middle">On the SKS the magazine is always attached.</text>
