<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Six hand signals to agree with a partner, opinion. Fist up: freeze. Flat hand down: get low. Point: deer there. Hand on head: come to me. Wave behind: back out. Thumb up: all good. Never a signal that means shoot.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Simple hand signals (agree yours, Tip)</text><rect x="14" y="44" width="180" height="66" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="104" y="72" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Fist up</text><text x="104" y="94" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Freeze</text><rect x="204" y="44" width="180" height="66" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="294" y="72" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Flat hand down</text><text x="294" y="94" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Get low</text><rect x="14" y="120" width="180" height="66" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="104" y="148" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Point</text><text x="104" y="170" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Deer there</text><rect x="204" y="120" width="180" height="66" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="294" y="148" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Hand on head</text><text x="294" y="170" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Come to me</text><rect x="14" y="196" width="180" height="66" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="104" y="224" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Wave behind</text><text x="104" y="246" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Back out</text><rect x="204" y="196" width="180" height="66" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="294" y="224" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Thumb up</text><text x="294" y="246" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">All good</text><text x="200" y="282" font-size="14" fill="#23261f" text-anchor="middle">Never a signal that means shoot</text>
</svg>
