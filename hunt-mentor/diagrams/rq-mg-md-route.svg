<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A slope from high summer range at upper left to low winter range at lower right. A dashed trail joins them. Fall arrow points down the trail, October to November. Spring arrow points back up, April to May. Note: about 50 kilometres, nearly the same path both ways.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Same route, down in fall, up in spring</text>
<path d="M0 300 L0 110 Q 70 50 130 80 Q 200 120 250 170 Q 320 230 400 240 L400 300 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<path d="M0 110 Q 70 50 130 80 L120 100 Q 70 80 0 130 Z" fill="#fff"/>
<g><polygon points="31.6,120 40,96 48.4,120" fill="#2f3a2b"/><rect x="38" y="120" width="4" height="4.800000000000001" fill="#6b4f35"/></g><g><polygon points="60.9,108 70,82 79.1,108" fill="#2f3a2b"/><rect x="68" y="108" width="4" height="5.2" fill="#6b4f35"/></g><g><polygon points="91.6,112 100,88 108.4,112" fill="#2f3a2b"/><rect x="98" y="112" width="4" height="4.800000000000001" fill="#6b4f35"/></g>
<text x="70" y="150" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Summer range</text>
<text x="70" y="168" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">high, moist, green</text>
<text x="300" y="272" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Winter range</text>
<text x="300" y="290" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">low, south and west faces</text>
<path d="M90 135 Q 150 140 190 170 Q 230 200 280 215 Q 310 225 330 240" fill="none" stroke="#8b5a2b" stroke-width="4" stroke-dasharray="8 6"/>
<g><line x1="250" y1="205" x2="300" y2="225" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><polygon points="300.0,225.0 288.0,225.8 291.9,216.1" fill="#e8590c"/></g>
<g><line x1="200" y1="160" x2="160" y2="140" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="160.0,140.0 172.0,140.2 167.3,149.5" fill="#4a7fb0"/></g>
<text x="200" y="245" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Fall: Oct to Nov</text>
<text x="250" y="130" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Spring: Apr to May</text>
<g transform="translate(230 196) scale(0.6)"><ellipse rx="20" ry="9" fill="#8b5a2b"/><circle cx="19" cy="-10" r="6.5" fill="#8b5a2b"/><rect x="-15" y="5" width="3.5" height="14" fill="#8b5a2b"/><rect x="-6" y="5" width="3.5" height="14" fill="#8b5a2b"/><rect x="7" y="5" width="3.5" height="14" fill="#8b5a2b"/><rect x="13" y="5" width="3.5" height="14" fill="#8b5a2b"/><ellipse cx="-20" cy="-2" rx="4" ry="5" fill="#f3ead8"/><path d="M19 -15 l-5 -10 m3 5 l-6 -2 M23 -15 l5 -10 m-3 5 l6 -2" stroke="#5c3b1c" stroke-width="2" fill="none"/></g>
<text x="200" y="52" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6b4f35" text-anchor="middle">About 50 km, nearly the same path</text>
</svg>
