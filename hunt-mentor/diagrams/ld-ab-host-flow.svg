<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 468" font-family="sans-serif" role="img" aria-label="Flowchart for the Alberta hunter host route. Hunting big game, wolf or coyote? If no, birds need no host. If yes: an Alberta resident friend, who is not paid, gets a WIN card. The friend buys the Hunter Host Licence first, 19 dollars. One host may host up to 2 hunters a year, so you and your brother. Then you buy the deer licence from a private issuer, 193 dollars plus GST.">
<rect x="0" y="0" width="400" height="468" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Alberta: the hunter host route</text>
<rect x="16" y="42" width="236" height="35" rx="18" fill="#f3ead6" stroke="#6b4f35" stroke-width="2.5"/>
<text x="28" y="66" font-size="15" font-weight="bold" fill="#2f3a2b">Big game, wolf or coyote?</text>
<line x1="252" y1="59.5" x2="282" y2="59.5" stroke="#2f3a2b" stroke-width="3"/><polygon points="280,52.5 280,66.5 290,59.5" fill="#2f3a2b"/>
<text x="256" y="51.5" font-size="14" font-weight="bold" fill="#6b4f35">No</text>
<rect x="290" y="42" width="96" height="68" rx="8" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2.5"/>
<text x="298" y="64" font-size="14" font-weight="bold" fill="#2f3a2b">No host</text>
<text x="298" y="82" font-size="14" font-weight="bold" fill="#2f3a2b">needed:</text>
<text x="298" y="100" font-size="14" font-weight="bold" fill="#2f3a2b">birds (85%)</text>
<line x1="134" y1="110" x2="134" y2="132" stroke="#2f3a2b" stroke-width="3"/><polygon points="127,130 141,130 134,140" fill="#2f3a2b"/>
<text x="144" y="131" font-size="14" font-weight="bold" fill="#6b4f35">Yes</text>
<rect x="16" y="140" width="368" height="54" rx="8" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/>
<text x="28" y="164" font-size="15" fill="#2f3a2b">An Alberta resident friend, not paid, gets a</text>
<text x="28" y="183" font-size="15" fill="#2f3a2b">WIN card</text>
<line x1="200.0" y1="194" x2="200.0" y2="216" stroke="#2f3a2b" stroke-width="3"/><polygon points="193.0,214 207.0,214 200.0,224" fill="#2f3a2b"/>
<rect x="16" y="224" width="368" height="54" rx="8" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/>
<text x="28" y="248" font-size="15" fill="#2f3a2b">Friend buys the Hunter Host Licence first:</text>
<text x="28" y="267" font-size="15" fill="#2f3a2b">$19</text>
<line x1="200.0" y1="278" x2="200.0" y2="300" stroke="#2f3a2b" stroke-width="3"/><polygon points="193.0,298 207.0,298 200.0,308" fill="#2f3a2b"/>
<rect x="16" y="308" width="368" height="54" rx="8" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/>
<text x="28" y="332" font-size="15" fill="#2f3a2b">One host covers up to 2 hunters a year: you</text>
<text x="28" y="351" font-size="15" fill="#2f3a2b">and your brother</text>
<line x1="200.0" y1="362" x2="200.0" y2="384" stroke="#2f3a2b" stroke-width="3"/><polygon points="193.0,382 207.0,382 200.0,392" fill="#2f3a2b"/>
<rect x="16" y="392" width="368" height="54" rx="8" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2.5"/>
<text x="28" y="416" font-size="15" font-weight="bold" fill="#2f3a2b">You buy the deer licence from a private</text>
<text x="28" y="435" font-size="15" font-weight="bold" fill="#2f3a2b">issuer: $193 plus GST</text>
</svg>
