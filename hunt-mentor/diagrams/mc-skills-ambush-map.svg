<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A map: bedding cover top left, a feeding area bottom right, and a dashed trail between them. Wind blows from the right. The hunter sits beside the trail on the downwind side. Be in before first light and stay later than you want.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Wait between bed and feed</text><rect x="14" y="42" width="372" height="236" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><ellipse cx="90" cy="100" rx="60" ry="36" fill="#b9c7a3" stroke="#2f3a2b" stroke-width="2"/><text x="90" y="105" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">bedding</text><rect x="250" y="200" width="120" height="60" rx="8" fill="#e9dfa8"/><text x="310" y="236" font-size="15" fill="#6b4f35" text-anchor="middle" font-weight="bold">feed</text><path d="M130 120 Q 200 140 220 170 T 270 210" fill="none" stroke="#8b5a2b" stroke-width="4" stroke-dasharray="8 6"/><text x="196" y="128" font-size="14" fill="#8b5a2b" text-anchor="middle" font-weight="bold">trail</text><line x1="330" y1="70" x2="250" y2="70" stroke="#4a7fb0" stroke-width="3"/><polygon points="250.0,70.0 259.0,65.7 259.0,74.3" fill="#4a7fb0"/><text x="340" y="75" font-size="14" fill="#4a7fb0" text-anchor="start">wind</text><g transform="translate(160 220) scale(0.7)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#e8590c"/><rect x="-6" y="-15" width="5" height="15" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" fill="#2f3a2b"/></g><text x="110" y="250" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">you: downwind</text><text x="200" y="294" font-size="14" fill="#6b4f35" text-anchor="middle">In before first light. Stay later than you want</text>
</svg>
