<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Five steps to beat buck fever: 1 decide range and rest early; 2 range landmarks before anything comes; 3 look at the aim spot, not the antlers; 4 slow breath out; 5 shaking too hard? Let it walk. Magazine and outfitter advice, tip level.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Beat buck fever (60%)</text><rect x="30" y="46" width="340" height="38" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="54" cy="65" r="13" fill="#e8590c"/><text x="54" y="70" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">1</text><text x="78" y="71" font-size="15" fill="#23261f" text-anchor="start">Decide range and rest early</text><rect x="30" y="92" width="340" height="38" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="54" cy="111" r="13" fill="#e8590c"/><text x="54" y="116" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">2</text><text x="78" y="117" font-size="15" fill="#23261f" text-anchor="start">Range landmarks before</text><rect x="30" y="138" width="340" height="38" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="54" cy="157" r="13" fill="#e8590c"/><text x="54" y="162" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">3</text><text x="78" y="163" font-size="15" fill="#23261f" text-anchor="start">Look at the spot, not antlers</text><rect x="30" y="184" width="340" height="38" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="54" cy="203" r="13" fill="#e8590c"/><text x="54" y="208" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">4</text><text x="78" y="209" font-size="15" fill="#23261f" text-anchor="start">Slow breath out</text><rect x="30" y="230" width="340" height="38" rx="8" fill="#f6d7c3" stroke="#8a9a6b" stroke-width="2"/><circle cx="54" cy="249" r="13" fill="#e8590c"/><text x="54" y="254" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">5</text><text x="78" y="255" font-size="15" fill="#23261f" text-anchor="start">Shaking? Let it walk</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Magazine and outfitter advice: Tip level</text>
</svg>
