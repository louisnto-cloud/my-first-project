<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 432" role="img" aria-label="Cards for Maps D1 to D6. D1 McDougall Wildlife Sanctuary, Management Unit 4-1: no shooting, hunting or trapping, and Motor Vehicle Closed Area. D2 Elizabeth Lake, 4-3: no hunting, shooting or trapping, and Motor Vehicle Closed Area. D3 Crawford Bay, 4-6: No Shooting Area. D4 Summit Creek Campground and Recreation Area and Corn Creek Marsh, 4-7: No Hunting Areas. D5 Selkirk, 4-7 and 4-8: No Shooting Area, watch for mountain caribou. D6 Walter Clough Wildlife Management Area, 4-17: No Shooting or Hunting Area." font-family="sans-serif">
