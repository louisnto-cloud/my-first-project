<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Labelled white tailed buck. One main beam curving forward with single tines rising off it. Smaller ears than a mule deer. A wide tail, brown on top and white underneath, raised as a white flag when alarmed. A small leg gland. It runs with a smooth gallop, not a bounce.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">White tail: what to look for</text><g transform="translate(230 200) scale(1.5 1.5)"><rect x="-30" y="6" width="7" height="38" rx="3.5" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><rect x="-21" y="6" width="7" height="38" rx="3.5" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><rect x="22" y="6" width="7" height="38" rx="3.5" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><rect x="31" y="6" width="7" height="38" rx="3.5" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><ellipse cx="0" cy="0" rx="42" ry="17" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><path d="M26 -10 L42 -40 L56 -36 L40 6 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="2" stroke-linejoin="round"/><ellipse cx="56" cy="-40" rx="14" ry="7" transform="rotate(18 56 -40)" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="42" cy="-50" rx="7" ry="3.5" transform="rotate(-35 42 -50)" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><circle cx="58" cy="-42" r="1.8" fill="#23261f"/><path d="M48 -46 Q40 -70 62 -80 M44 -60 L40 -72 M46 -68 L46 -82 M54 -76 L56 -90" stroke="#6b4f35" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M-40 -8 Q-46 -26 -56 -32 Q-62 -26 -54 -14 Q-48 -4 -42 0 Z" fill="#fff" stroke="#23261f" stroke-width="2"/></g><line x1="296" y1="96" x2="240" y2="62" stroke="#e8590c" stroke-width="2"/><circle cx="296" cy="96" r="4" fill="#e8590c"/><text x="236" y="67" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">One main beam,</text><text x="236" y="85" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">tines rise off it</text><line x1="293" y1="127" x2="330" y2="180" stroke="#e8590c" stroke-width="2"/><circle cx="293" cy="127" r="4" fill="#e8590c"/><text x="334" y="185" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Smaller</text><text x="334" y="203" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">ears</text><line x1="150" y1="160" x2="120" y2="190" stroke="#e8590c" stroke-width="2"/><circle cx="150" cy="160" r="4" fill="#e8590c"/><text x="116" y="195" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">Wide tail,</text><text x="116" y="213" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">white under:</text><text x="116" y="231" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">the flag</text><line x1="191" y1="236" x2="210" y2="284" stroke="#e8590c" stroke-width="2"/><circle cx="191" cy="236" r="4" fill="#e8590c"/><text x="214" y="289" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Small leg gland</text>
</svg>
