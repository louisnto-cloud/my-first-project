<text x="14" y="96" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Columbian ground squirrel</text>
<rect x="14.0" y="102" width="372.0" height="20" rx="4" fill="#8a9a6b"/>
<text x="200" y="117" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">No closed season</text>
<text x="14" y="142" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Snowshoe hare</text>
<rect x="45.6" y="148" width="278.2" height="20" rx="4" fill="#e8590c"/>
