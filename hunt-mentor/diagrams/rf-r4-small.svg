<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 302" role="img" aria-label="Bar chart of Region 4 small game seasons in all Management Units. Columbian ground squirrel: no closed season, private land only. Snowshoe hare: 1 August to 30 April. Raccoon: 10 September to 31 March. Skunk: 1 August to 30 April." font-family="sans-serif">
<rect x="0" y="0" width="400" height="302" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Small game seasons</text>
