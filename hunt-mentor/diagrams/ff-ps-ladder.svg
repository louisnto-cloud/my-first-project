<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A ladder of shooting positions from steadiest to least steady: prone off a pack or bipod, sitting with sticks, sitting with elbows in the knees, kneeling, standing on a tripod or against a tree, and offhand with no support. Pick the steadiest that the grass and time allow. Bar lengths are a rough ranking, not measurements.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Steadiest at the top</text><text x="224" y="63.599999999999994" font-size="14" fill="#23261f" text-anchor="end">Prone off a pack or bipod</text><rect x="230" y="44" width="130.0" height="28" rx="3" fill="#2f6e3b" stroke="none" stroke-width="2"/><text x="366.0" y="63.599999999999994" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start"></text><text x="224" y="101.6" font-size="14" fill="#23261f" text-anchor="end">Sitting with sticks</text><rect x="230" y="82" width="114.4" height="28" rx="3" fill="#2f6e3b" stroke="none" stroke-width="2"/><text x="350.4" y="101.6" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start"></text><text x="224" y="139.6" font-size="14" fill="#23261f" text-anchor="end">Sitting, elbows in knees</text><rect x="230" y="120" width="101.4" height="28" rx="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="337.4" y="139.6" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start"></text><text x="224" y="177.6" font-size="14" fill="#23261f" text-anchor="end">Kneeling</text><rect x="230" y="158" width="78.0" height="28" rx="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="314.0" y="177.6" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start"></text><text x="224" y="215.6" font-size="14" fill="#23261f" text-anchor="end">Standing on a tripod or tree</text><rect x="230" y="196" width="71.5" height="28" rx="3" fill="#e8590c" stroke="none" stroke-width="2"/><text x="307.5" y="215.6" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start"></text><text x="224" y="253.6" font-size="14" fill="#23261f" text-anchor="end">Offhand, no support</text><rect x="230" y="234" width="32.5" height="28" rx="3" fill="#b3261e" stroke="none" stroke-width="2"/><text x="268.5" y="253.6" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start"></text><text x="200.0" y="286" font-size="14" fill="#2f3a2b" text-anchor="middle">Pick the steadiest the grass and time allow</text>
</svg>
