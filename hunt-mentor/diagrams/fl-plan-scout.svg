<text x="80" y="152" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">walk winter range, do not push deer (Tip)</text>
<rect x="10" y="170" width="380" height="56" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
