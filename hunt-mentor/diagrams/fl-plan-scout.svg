<rect x="24.0" y="56" width="36" height="30" rx="4" fill="#cfe0ef" stroke="#4a7fb0" stroke-width="2"/>
<text x="80" y="68" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Jan to Mar: maps</text>
<text x="80" y="90" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">e scout, journal review (Tip)</text>
