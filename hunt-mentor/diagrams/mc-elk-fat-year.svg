<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Line sketch of body condition through the year, shape only. Bulls build condition through summer, peak in August, then crash in the September rut when they stop feeding, and enter winter in poor shape. Cows dip in late winter, rise through summer and hold condition into fall. Late winter is the low point for both; severe winter malnutrition is the main reason adult elk die.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">The fat year (shape only)</text><rect x="50" y="60" width="320" height="170" rx="4" fill="#dfe6d3"/><text x="63.0" y="248" font-size="14" fill="#23261f" text-anchor="middle">J</text><text x="89.66666666666667" y="248" font-size="14" fill="#23261f" text-anchor="middle">F</text><text x="116.33333333333334" y="248" font-size="14" fill="#23261f" text-anchor="middle">M</text><text x="143.0" y="248" font-size="14" fill="#23261f" text-anchor="middle">A</text><text x="169.66666666666669" y="248" font-size="14" fill="#23261f" text-anchor="middle">M</text><text x="196.33333333333334" y="248" font-size="14" fill="#23261f" text-anchor="middle">J</text><text x="223.0" y="248" font-size="14" fill="#23261f" text-anchor="middle">J</text><text x="249.66666666666669" y="248" font-size="14" fill="#23261f" text-anchor="middle">A</text><text x="276.33333333333337" y="248" font-size="14" fill="#23261f" text-anchor="middle">S</text><text x="303.0" y="248" font-size="14" fill="#23261f" text-anchor="middle">O</text><text x="329.6666666666667" y="248" font-size="14" fill="#23261f" text-anchor="middle">N</text><text x="356.33333333333337" y="248" font-size="14" fill="#23261f" text-anchor="middle">D</text><polyline points="63,165 90,181 116,194 143,190 170,157 196,117 223,84 250,71 276,100 303,157 330,181 356,173" fill="none" stroke="#e8590c" stroke-width="4"/><polyline points="63,157 90,173 116,185 143,181 170,157 196,141 223,117 250,97 276,91 303,97 330,117 356,136" fill="none" stroke="#2f3a2b" stroke-width="4" stroke-dasharray="8 5"/><rect x="210" y="68" width="18" height="4" rx="1" fill="#e8590c"/><text x="234" y="75" font-size="14" fill="#23261f" text-anchor="start">Bull</text><rect x="280" y="68" width="18" height="4" rx="1" fill="#2f3a2b"/><text x="304" y="75" font-size="14" fill="#23261f" text-anchor="start">Cow</text><text x="305" y="210" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Rut: bulls</text><text x="305" y="226" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">stop feeding</text><text x="200" y="272" font-size="14" fill="#6b4f35" text-anchor="middle">Late winter: lowest. Winter starvation is the</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">main killer of adults (90%). Curve shape: Tip</text>
</svg>
