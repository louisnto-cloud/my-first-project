<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Black bear hunting methods and the Rule Book. Spot and stalk: yes. Still hunting, or sitting a natural food source: yes. Mouth or hand calls: yes, my reading, because only recorded or electronic calls are banned. Unleashed dogs: yes, page 12. Electronic or recorded calls: no. Bait, or a dead animal or part of one as bait: no. Lights and infrared optics: no.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Methods: legal or not (Rule Book)</text><rect x="10" y="50" width="380" height="30" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="71" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Spot and stalk</text><rect x="240" y="54" width="144" height="22" rx="11" fill="#8a9a6b"/><text x="312" y="70" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Yes</text><rect x="10" y="85" width="380" height="30" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="106" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Still hunt, sit food</text><rect x="240" y="89" width="144" height="22" rx="11" fill="#8a9a6b"/><text x="312" y="105" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Yes</text><rect x="10" y="120" width="380" height="30" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="141" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Mouth or hand call</text><rect x="240" y="124" width="144" height="22" rx="11" fill="#8a9a6b"/><text x="312" y="140" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Yes, my reading</text><rect x="10" y="155" width="380" height="30" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="176" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Unleashed dogs</text><rect x="240" y="159" width="144" height="22" rx="11" fill="#8a9a6b"/><text x="312" y="175" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Yes</text><rect x="10" y="190" width="380" height="30" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="1.5"/><text x="18" y="211" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Electronic call</text><rect x="240" y="194" width="144" height="22" rx="11" fill="#e8590c"/><text x="312" y="210" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">No</text><rect x="10" y="225" width="380" height="30" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="1.5"/><text x="18" y="246" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Bait, or a carcass</text><rect x="240" y="229" width="144" height="22" rx="11" fill="#e8590c"/><text x="312" y="245" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">No</text><rect x="10" y="260" width="380" height="30" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="1.5"/><text x="18" y="281" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Lights, thermal</text><rect x="240" y="264" width="144" height="22" rx="11" fill="#e8590c"/><text x="312" y="280" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">No</text>
</svg>
