<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" role="img" aria-label="Bar chart of live weight in grams. White tailed ptarmigan about 350. Spruce grouse 450 to 750. Ruffed grouse 450 to 750. Willow ptarmigan 450 to 800. Sharp tailed grouse 596 to 1,031. Dusky grouse 880 to 1,600, the biggest." font-family="sans-serif">
