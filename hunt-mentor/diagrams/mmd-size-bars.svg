<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 305" font-family="sans-serif" role="img" aria-label="Bar chart of weights in kilograms from the BC deer account. Mule deer buck 68 to 113, up to 180 at peak. Mule deer doe 50 to 75. Black tailed buck 48 to 90. Black tailed doe 40 to 65. Fawn at birth 2.7 to 4 kg. Mule deer stand 90 to 95 cm at the shoulder.">
<rect width="400" height="305" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">How big? Weight in kilograms</text><text x="128" y="79" font-size="14" fill="#23261f" text-anchor="end">Mule buck</text><rect x="221.0" y="62" width="56.25" height="24" rx="4" fill="#8b5a2b"/><line x1="277.25" y1="74" x2="361.0" y2="74" stroke="#8b5a2b" stroke-width="2" stroke-dasharray="5 4"/><text x="221.0" y="58" font-size="14" fill="#8b5a2b" text-anchor="start">68 to 113, peak up to 180</text><text x="128" y="123" font-size="14" fill="#23261f" text-anchor="end">Mule doe</text><rect x="198.5" y="106" width="31.25" height="24" rx="4" fill="#8a9a6b"/><text x="235.75" y="123" font-size="14" fill="#23261f" text-anchor="start">50 to 75</text><text x="128" y="167" font-size="14" fill="#23261f" text-anchor="end">Black tail buck</text><rect x="196.0" y="150" width="52.5" height="24" rx="4" fill="#6b4f35"/><text x="254.5" y="167" font-size="14" fill="#23261f" text-anchor="start">48 to 90</text><text x="128" y="211" font-size="14" fill="#23261f" text-anchor="end">Black tail doe</text><rect x="186.0" y="194" width="31.25" height="24" rx="4" fill="#8a9a6b"/><text x="223.25" y="211" font-size="14" fill="#23261f" text-anchor="start">40 to 65</text><line x1="136.0" y1="238" x2="136.0" y2="244" stroke="#23261f" stroke-width="1"/><text x="136.0" y="260" font-size="14" fill="#23261f" text-anchor="middle">0</text><line x1="198.5" y1="238" x2="198.5" y2="244" stroke="#23261f" stroke-width="1"/><text x="198.5" y="260" font-size="14" fill="#23261f" text-anchor="middle">50</text><line x1="261.0" y1="238" x2="261.0" y2="244" stroke="#23261f" stroke-width="1"/><text x="261.0" y="260" font-size="14" fill="#23261f" text-anchor="middle">100</text><line x1="323.5" y1="238" x2="323.5" y2="244" stroke="#23261f" stroke-width="1"/><text x="323.5" y="260" font-size="14" fill="#23261f" text-anchor="middle">150</text><line x1="136" y1="238" x2="361.0" y2="238" stroke="#23261f" stroke-width="1"/><text x="200" 