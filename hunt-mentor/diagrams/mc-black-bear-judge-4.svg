<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Judge step 4 of 4, the shot. Wait for broadside with the near front leg forward, aim tight behind the shoulder about halfway up, with a safe backstop and inside your range. No clean shot: let it walk.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
