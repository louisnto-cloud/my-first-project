<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="What is the bear doing? Unaware of you: leave quietly the way you came. Sees you but calm: talk softly and back away slowly. Agitated and huffing: calm voice, back away, bear spray ready. Coming steadily at you: yell, stand big, spray, be ready to fight. In every case, never run.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">You see a bear: what is it doing?</text><rect x="10" y="46" width="140" height="46" rx="8" fill="#eef5e6" stroke="#2e7d32" stroke-width="2"/><text x="80" y="74" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Unaware of you</text><line x1="152" y1="69" x2="164" y2="69" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/><polygon points="172,69 164,64 164,74" fill="#2e7d32"/><rect x="174" y="46" width="216" height="46" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/><text x="282" y="74" font-size="14" fill="#2f3a2b" text-anchor="middle">Leave quietly the way you came</text><rect x="10" y="102" width="140" height="46" rx="8" fill="#eef5e6" stroke="#2e7d32" stroke-width="2"/><text x="80" y="130" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Sees you, calm</text><line x1="152" y1="125" x2="164" y2="125" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/><polygon points="172,125 164,120 164,130" fill="#2e7d32"/><rect x="174" y="102" width="216" height="46" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/><text x="282" y="130" font-size="14" fill="#2f3a2b" text-anchor="middle">Talk softly, back away slowly</text><rect x="10" y="158" width="140" height="46" rx="8" fill="#fff3d6" stroke="#e8590c" stroke-width="2"/><text x="80" y="186" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Agitated, huffing</text><line x1="152" y1="181" x2="164" y2="181" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="172,181 164,176 164,186" fill="#e8590c"/><rect x="174" y="158" width="216" height="46" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="282" y="186" font-size="14" fill="#2f3a2b" text-anchor="middle">Calm voice, back off, spray out</text><rect x="10" y="214" width="140" height="46" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/><text x="80" y="242" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Coming steadily</text><line x1="152" y1="237" x2="164" y2="237" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><polygon points="172,237 164,232 164,242" fill="#c0392b"/><rect x="174" y="214" width="216" height="46" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="282" y="242" font-size="14" fill="#2f3a2b" text-anchor="middle">Yell, stand big, spray, fight</text><text x="200" y="290" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Every case: never run</text>
</svg>
