<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side view of a stand of old Douglas fir in snow. Deep snow lies in the open on both sides. Under the tree crowns the snow is shallow because the crowns catch it. Good winter range has about 65 to 70% canopy with small openings.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Why old Douglas fir is winter range</text><rect x="0" y="230" width="400" height="70" fill="#ffffff"/><path d="M0 230 L150 230 L150 236 L250 236 L250 230 L400 230" fill="none" stroke="#8a9a6b" stroke-width="2"/><rect x="0" y="196" width="140" height="34" fill="#ffffff" stroke="#c9d3e0" stroke-width="2"/><rect x="260" y="196" width="140" height="34" fill="#ffffff" stroke="#c9d3e0" stroke-width="2"/><rect x="156" y="110" width="8" height="126" fill="#6b4f35"/><polygon points="126,170 160,60 194,170" fill="#2f3a2b"/><rect x="196" y="110" width="8" height="126" fill="#6b4f35"/><polygon points="166,170 200,60 234,170" fill="#2f3a2b"/><rect x="236" y="110" width="8" height="126" fill="#6b4f35"/><polygon points="206,170 240,60 274,170" fill="#2f3a2b"/><text x="70" y="186" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">open: deep snow</text><text x="330" y="186" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">open: deep snow</text><text x="200" y="256" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">under crowns: shallow</text><circle cx="20" cy="70" r="3" fill="#c9d3e0"/><circle cx="54" cy="68" r="3" fill="#c9d3e0"/><circle cx="88" cy="66" r="3" fill="#c9d3e0"/><circle cx="122" cy="64" r="3" fill="#c9d3e0"/><circle cx="156" cy="62" r="3" fill="#c9d3e0"/><circle cx="190" cy="60" r="3" fill="#c9d3e0"/><circle cx="224" cy="58" r="3" fill="#c9d3e0"/><circle cx="258" cy="56" r="3" fill="#c9d3e0"/><circle cx="292" cy="54" r="3" fill="#c9d3e0"/><circle cx="326" cy="52" r="3" fill="#c9d3e0"/><circle cx="360" cy="50" r="3" fill="#c9d3e0"/><circle cx="394" cy="78" r="3" fill="#c9d3e0"/><text x="200" y="284" font-size="14" fill="#6b4f35" text-anchor="middle">Crowns catch snow; canopy about 65 to 70% (85%)</text>
</svg>
