<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 336" font-family="sans-serif" role="img" aria-label="Side view of a cold front. Cold, dense air on the right pushes under warm air on the left and lifts it. The front moves from right to left. Rain and gusts fall from a big cloud at the front. Before it: south wind and falling pressure. After it: northwest wind, colder, rising pressure, clearing skies.">
