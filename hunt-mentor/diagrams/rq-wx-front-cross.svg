<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Side view of a cold front. Cold dense air on the right pushes under warm air on the left. Rain and gusts at the front. Before it: south wind and falling pressure. After it: northwest wind, colder, rising pressure, clearing skies.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A cold front passing (side view)</text>
<path d="M0 250 L400 250 L400 300 L0 300 Z" fill="#dfe6d3"/>
<path d="M150 250 Q 210 120 300 70 L400 60 L400 250 Z" fill="#cfe0ef" opacity=".9"/>
<text x="330" y="200" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Cold air</text>
<text x="60" y="200" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Warm air</text>
<g transform="translate(200 105) scale(1.6)" fill="#9aa6b2"><circle cx="-14" cy="4" r="11"/><circle cx="2" cy="-4" r="15"/><circle cx="18" cy="4" r="11"/><rect x="-14" y="4" width="32" height="11"/></g><line x1="193" y1="135" x2="189" y2="147" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/><line x1="202" y1="135" x2="198" y2="147" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/><line x1="211" y1="135" x2="207" y2="147" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/><line x1="220" y1="135" x2="216" y2="147" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/><line x1="229" y1="135" x2="225" y2="147" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/>
<g><line x1="330" y1="160" x2="250" y2="160" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="250.0,160.0 257.2,156.5 257.2,163.5" fill="#4a7fb0"/></g>
<text x="200" y="60" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="middle">Front moves this way</text>
<g><line x1="260" y1="70" x2="140" y2="70" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><polygon points="140.0,70.0 147.2,66.5 147.2,73.5" fill="#2f3a2b"/></g>
<text x="66" y="266" font-family="sans-serif" font-size="13" font-weight="bold" fill="#23261f" text-anchor="middle">Before: S wind,</text>
<text x="66" y="281" font-family="sans-serif" font-size="13" font-weight="bold" fill="#23261f" text-anchor="middle">pressure falls</text>
<text x="200" y="266" font-family="sans-serif" font-size="13" font-weight="bold" fill="#23261f" text-anchor="middle">At the front:</text>
<text x="200" y="281" font-family="sans-serif" font-size="13" font-weight="bold" fill="#23261f" text-anchor="middle">rain, gusts</text>
<text x="334" y="266" font-family="sans-serif" font-size="13" font-weight="bold" fill="#23261f" text-anchor="middle">After: NW wind,</text>
<text x="334" y="281" font-family="sans-serif" font-size="13" font-weight="bold" fill="#23261f" text-anchor="middle">colder, pressure</text>
<text x="334" y="296" font-family="sans-serif" font-size="13" font-weight="bold" fill="#23261f" text-anchor="middle">rises</text>
<g><line x1="40" y1="235" x2="40" y2="215" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="40.0,215.0 43.5,222.2 36.5,222.2" fill="#e8590c"/></g>
<g><line x1="90" y1="235" x2="90" y2="215" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="90.0,215.0 93.5,222.2 86.5,222.2" fill="#e8590c"/></g>
<g><line x1="332" y1="215" x2="314" y2="237" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><polygon points="314.0,237.0 315.9,229.2 321.3,233.6" fill="#4a7fb0"/></g>
<g><line x1="382" y1="215" x2="364" y2="237" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><polygon points="364.0,237.0 365.9,229.2 371.3,233.6" fill="#4a7fb0"/></g>
</svg>
