<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-label="A fuel gauge. The red zone near empty means shaky, cold and bad choices. Keep the needle well above a quarter: eat before you are hungry and drink before you are thirsty.">
  <rect x="0" y="0" width="400" height="290" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Keep the tank above a quarter</text>
<path d="M60 220 A140 140 0 0 1 340 220" fill="none" stroke="#dfe6d3" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M60 220 A140 140 0 0 1 101.00505063388334 121.00505063388336" fill="none" stroke="#b3261e" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M101.00505063388334 121.00505063388336 A140 140 0 0 1 340 220" fill="none" stroke="#8a9a6b" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle">Empty</text><text x="336" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Full</text>
<line x1="200" y1="220" x2="255.0" y2="124.73720558371174" stroke="#23261f" stroke-width="6" stroke-linecap="round"/><circle cx="200" cy="220" r="12" fill="#23261f"/>
<text x="200" y="270" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Eat before hungry. Drink before thirsty.</text>
<text x="130" y="180" font-family="sans-serif" font-size="13" fill="#b3261e" text-anchor="middle">Red: shaky, cold,</text><text x="130" y="196" font-family="sans-serif" font-size="13" fill="#b3261e" text-anchor="middle">bad choices</text>
</svg>
