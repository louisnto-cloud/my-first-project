<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 328" font-family="sans-serif" role="img" aria-label="Storage and transport law for your non restricted rifle: 1 at home, unloaded and either locked with a secure locking device, bolt out, or in a locked container or room; 2 ammunition not readily at hand unless locked up too; 3, in orange, in a vehicle the rifle is unloaded, chamber and magazine empty; 4 left in a vehicle: in a locked trunk, or out of sight with the vehicle locked. Study aid only.">
<rect x="0" y="0" width="400" height="328" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Store it, move it: the law</text><rect x="12" y="42" width="376" height="66" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="66" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="71" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="52" y="62" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Home: unloaded</text><text x="52" y="81" font-size="14" fill="#17201A" text-anchor="start">and locked, or bolt out, or in a</text><text x="52" y="99" font-size="14" fill="#17201A" text-anchor="start">locked container or room</text><rect x="12" y="116" width="376" height="48" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="140" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="145" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="52" y="136" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Ammunition</text><text x="52" y="155" font-size="14" fill="#17201A" text-anchor="start">not readily at hand, or locked</text><rect x="12" y="172" width="376" height="48" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="196" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="201" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="52" y="192" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Vehicle: unloaded</text><text x="52" y="211" font-size="14" fill="#17201A" text-anchor="start">chamber and magazine empty</text><rect x="12" y="228" width="376" height="48" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="252" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="257" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="52" y="248" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Left in a vehicle</text><text x="52" y="267" font-size="14" fill="#17201A" text-anchor="start">locked trunk, or out of sight, locked</text><rect x="10" y="286" width="380" height="30" rx="6" fill="#FF6A13"/><text x="200" y="306.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Study aid only. Official law rules.</text>
</svg>
