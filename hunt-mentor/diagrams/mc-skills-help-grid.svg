<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="When to get help: a gut or liver hit needs more eyes, not more hours; thick timber needs two people in sight and search lanes; snow or rain coming, call your partner now; private land or a closed area, stop and call a conservation officer; a bear on the trail, one tracks while one watches; dark falls, no tracking with a rifle or a light, ask an officer.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Get help when</text><rect x="14" y="42" width="372" height="34" rx="6" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="24" y="64" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Gut or liver hit</text><text x="380" y="64" font-size="14" fill="#23261f" text-anchor="end">more eyes, not more hours</text><rect x="14" y="82" width="372" height="34" rx="6" fill="#fffaf0" stroke="#8a9a6b" stroke-width="2"/><text x="24" y="104" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Thick timber</text><text x="380" y="104" font-size="14" fill="#23261f" text-anchor="end">two in sight, lanes</text><rect x="14" y="122" width="372" height="34" rx="6" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="24" y="144" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Snow or rain coming</text><text x="380" y="144" font-size="14" fill="#23261f" text-anchor="end">call your partner now</text><rect x="14" y="162" width="372" height="34" rx="6" fill="#fffaf0" stroke="#8a9a6b" stroke-width="2"/><text x="24" y="184" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Private land, closed area</text><text x="380" y="184" font-size="14" fill="#23261f" text-anchor="end">stop: call a CO</text><rect x="14" y="202" width="372" height="34" rx="6" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="24" y="224" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Bear on the trail</text><text x="380" y="224" font-size="14" fill="#23261f" text-anchor="end">one tracks, one watches</text><rect x="14" y="242" width="372" height="34" rx="6" fill="#fffaf0" stroke="#8a9a6b" stroke-width="2"/><text x="24" y="264" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Dark falls</text><text x="380" y="264" font-size="14" fill="#23261f" text-anchor="end">no rifle, no light: VERIFY</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">CO: conservation officer. Tips, plus Rule Book (95%)</text>
</svg>
