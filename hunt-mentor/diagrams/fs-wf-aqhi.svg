<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="The Air Quality Health Index: 1 to 3 low, normal activity. 4 to 6 moderate, ease off if you have symptoms. 7 to 10 high, reduce or reschedule hard effort outdoors. 10 plus very high, avoid hard effort outdoors. Climbing a ridge is hard effort.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Air Quality Health Index (AQHI)</text><rect x="20" y="46" width="110" height="46" rx="6" fill="#2e7d32"/><text x="75" y="76" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1 to 3</text><text x="146" y="66" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Low</text><text x="146" y="86" font-size="14" fill="#2f3a2b" text-anchor="start">Normal</text><rect x="20" y="100" width="110" height="46" rx="6" fill="#f6c344"/><text x="75" y="130" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4 to 6</text><text x="146" y="120" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Moderate</text><text x="146" y="140" font-size="14" fill="#2f3a2b" text-anchor="start">Symptoms? Ease off</text><rect x="20" y="154" width="110" height="46" rx="6" fill="#e8590c"/><text x="75" y="184" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">7 to 10</text><text x="146" y="174" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">High</text><text x="146" y="194" font-size="14" fill="#2f3a2b" text-anchor="start">Cut hard effort</text><rect x="20" y="208" width="110" height="46" rx="6" fill="#c0392b"/><text x="75" y="238" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">10+</text><text x="146" y="228" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Very high</text><text x="146" y="248" font-size="14" fill="#2f3a2b" text-anchor="start">Avoid hard effort</text><text x="200" y="285" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Climbing a ridge is hard effort</text>
</svg>
