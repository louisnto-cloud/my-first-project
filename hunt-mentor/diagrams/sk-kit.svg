<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Field dressing kit, eight items: a sharp 8 to 10 cm fixed blade knife, a small sharpener, a bone saw for the skull plate and ribs, cloth game bags (4 for a deer, 8 for a moose), nitrile gloves, 10 m of rope and zip ties, a headlamp with spare batteries, and a tarp.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
