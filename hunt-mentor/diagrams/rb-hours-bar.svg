<text x="295" y="236" font-size="15" font-weight="bold" fill="#3f5a26" text-anchor="middle">1 hour</text>
<line x1="105.0" y1="250" x2="130" y2="250" stroke="#4a7fb0" stroke-width="3"/><line x1="270" y1="250" x2="295.0" y2="250" stroke="#4a7fb0" stroke-width="3"/>
<text x="117.5" y="270" font-size="15" font-weight="bold" fill="#2c5d86" text-anchor="middle">30 min</text>
