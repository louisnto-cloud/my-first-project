<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="sans-serif" role="img" aria-label="Timeline of legal hunting hours. Deer, grouse, quail and all other game except migratory birds: from 1 hour before sunrise to 1 hour after sunset. Ducks and geese: from 30 minutes before sunrise to 30 minutes after sunset, so they start later and end sooner. At night, shaded, no hunting at all.">
<rect width="400" height="330" fill="#fffaf0"/>
<defs><linearGradient id="rb-hours-bar-sky" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2b3a55"/><stop offset="0.188" stop-color="#2b3a55"/><stop offset="0.318" stop-color="#dbe8f1"/><stop offset="0.682" stop-color="#dbe8f1"/><stop offset="0.812" stop-color="#2b3a55"/><stop offset="1" stop-color="#2b3a55"/></linearGradient></defs>
<rect x="8" y="8" width="384" height="62" rx="8" fill="url(#rb-hours-bar-sky)"/>
<circle cx="30" cy="22" r="1.6" fill="#fff"/>
<circle cx="52" cy="28" r="1.6" fill="#fff"/>
<circle cx="360" cy="22" r="1.6" fill="#fff"/>
<circle cx="340" cy="28" r="1.6" fill="#fff"/>
<circle cx="375" cy="22" r="1.6" fill="#fff"/>
<circle cx="42" cy="46" r="9" fill="#f3e7b3"/><circle cx="46.0" cy="43.8" r="7.6" fill="#2b3a55"/>
