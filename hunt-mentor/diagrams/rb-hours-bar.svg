<circle cx="270" cy="70" r="15" fill="#f2b632"/>
<path d="M270 46 V40 M254 54 L249 49 M286 54 L291 49" stroke="#f2b632" stroke-width="2.6" stroke-linecap="round"/>
<rect x="8" y="70" width="384" height="5" fill="#8a9a6b"/>
<text x="130" y="102" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Sunrise</text>
<text x="270" y="102" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Sunset</text>
<text x="200" y="48" font-size="15" font-weight="bold" fill="#2c5d86" text-anchor="middle">day</text>
<rect x="80" y="114" width="240" height="32" rx="6" fill="#5c7a3a"/>
<text x="200" y="136" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Deer, grouse, quail</text>
<text x="105" y="112" font-size="14" fill="#2f3a2b"></text>
<text x="295" y="112" font-size="14" fill="#2f3a2b"></text>
