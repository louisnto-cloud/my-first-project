<line x1="130" y1="86" x2="130" y2="198" stroke="#2f3a2b" stroke-width="1.6" stroke-dasharray="4 3"/>
<line x1="270" y1="86" x2="270" y2="198" stroke="#2f3a2b" stroke-width="1.6" stroke-dasharray="4 3"/>
<line x1="86" y1="216" x2="124" y2="216" stroke="#5c7a3a" stroke-width="1.6"/><path d="M80.0 216.0 L88.0 220.4 L88.0 211.6z" fill="#5c7a3a"/><path d="M130.0 216.0 L122.0 211.6 L122.0 220.4z" fill="#5c7a3a"/>
