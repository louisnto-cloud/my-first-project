<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of body weight in grams. California quail 140 to 230. Gray partridge 300 to 500. Chukar 538 to 765. Lengths: quail 24 to 27 centimetres, partridge 30 to 33, chukar 34 to 38. Audubon field guide, 75 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Weight in grams (Audubon, 75%)</text>
<text x="112" y="76" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">Quail</text><rect x="120.0" y="60" width="264" height="24" rx="4" fill="#efe9dc"/><rect x="166.2" y="60" width="29.700000000000017" height="24" rx="4" fill="#e8590c"/><text x="199.9" y="77" font-size="14" fill="#2f3a2b" text-anchor="start">24 to 27 cm</text>
<text x="112" y="121" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">Hun</text><rect x="120.0" y="105" width="264" height="24" rx="4" fill="#efe9dc"/><rect x="219.0" y="105" width="66.0" height="24" rx="4" fill="#8b5a2b"/><text x="289.0" y="122" font-size="14" fill="#2f3a2b" text-anchor="start">30 to 33 cm</text>
<text x="112" y="166" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">Chukar</text><rect x="120.0" y="150" width="264" height="24" rx="4" fill="#efe9dc"/><rect x="297.54" y="150" width="74.91000000000003" height="24" rx="4" fill="#a33b2a"/><text x="293.54" y="167" font-size="14" fill="#2f3a2b" text-anchor="end">34 to 38 cm</text>
<line x1="120" y1="196" x2="384" y2="196" stroke="#2f3a2b" stroke-width="2"/>
<line x1="120.0" y1="196" x2="120.0" y2="202" stroke="#2f3a2b" stroke-width="2"/><text x="120.0" y="218" font-size="14" fill="#2f3a2b" text-anchor="middle">0</text><line x1="186.0" y1="196" x2="186.0" y2="202" stroke="#2f3a2b" stroke-width="2"/><text x="186.0" y="218" font-size="14" fill="#2f3a2b" text-anchor="middle">200</text><line x1="252.0" y1="196" x2="252.0" y2="202" stroke="#2f3a2b" stroke-width="2"/><text x="252.0" y="218" font-size="14" fill="#2f3a2b" text-anchor="middle">400</text><line x1="318.0" y1="196" x2="318.0" y2="202" stroke="#2f3a2b" stroke-width="2"/><text x="318.0" y="218" font-size="14" fill="#2f3a2b" text-anchor="middle">600</text><line x1="384.0" y1="196" x2="384.0" y2="202" stroke="#2f3a2b" stroke-width="2"/><text x="384.0" y="218" font-size="14" fill="#2f3a2b" text-anchor="middle">800</text>
<text x="250" y="240" font-size="14" fill="#2f3a2b" text-anchor="middle">grams</text>
<rect x="10" y="252" width="380" height="40" rx="8" fill="#dfe6d3"/>
<text x="200" y="277" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A quail weighs about as much as a cup of water</text>
</svg>
