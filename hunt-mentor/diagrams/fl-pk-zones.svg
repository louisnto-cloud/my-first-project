<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A pack cut open in four zones. Lid: quick items like headlamp, map and first aid. Top: rain shell and a warm layer. Core, against your back: the heavy things, water, food and later meat. Bottom: light bulky gear like a puffy jacket.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Where the weight goes</text>
<rect x="120" y="46" width="160" height="230" rx="26" fill="#8b5a2b"/>
<rect x="128" y="56" width="144" height="36" rx="10" fill="#8a9a6b"/>
<text x="200" y="79.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Lid</text>

<rect x="128" y="100" width="144" height="46" rx="10" fill="#8a9a6b"/>
<text x="200" y="128.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Top</text>

<rect x="128" y="154" width="144" height="60" rx="10" fill="#e8590c"/>
<text x="200" y="189.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Core</text>

<rect x="128" y="222" width="144" height="42" rx="10" fill="#2f3a2b"/>
<text x="200" y="248.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Bottom</text>

<line x1="272" y1="154" x2="300" y2="154" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/>




<rect x="110" y="150" width="10" height="70" rx="3" fill="#2f3a2b"/>
<text x="60" y="178" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Your</text><text x="60" y="196" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">back</text><line x1="84" y1="190" x2="106" y2="190" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><polygon points="106.0,190.0 98.8,193.5 98.8,186.5" fill="#2f3a2b"/>
<text x="340" y="70" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Lid:</text>
<text x="340" y="88" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">quick</text>
<text x="340" y="106" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">items</text>
<text x="340" y="160" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Heavy</text>
<text x="340" y="179" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">and</text>
<text x="340" y="198" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">close</text>
<text x="340" y="238" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bottom:</text>
<text x="340" y="256" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">light,</text>
<text x="340" y="274" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">bulky</text>
<text x="200" y="294" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Heavy items close to your spine, middle of the back</text>
</svg>
