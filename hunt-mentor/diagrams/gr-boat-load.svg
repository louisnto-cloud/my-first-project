<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Loading a small boat, seen from above. Read the capacity plate and count people, gear, guns and a deer. Heavy items low on the floor, centred side to side. Kayak: one person, guns cased and strapped, dry bag clipped in.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Load low and centred</text>
  <rect width="400" height="300" y="36" fill="#4a7fb0" opacity=".15"/>
  <path d="M30 120 Q 60 60 170 60 L240 60 L240 180 L170 180 Q 60 180 30 120 Z" fill="#8a8f88" stroke="#2f3a2b" stroke-width="2"/>
  <line x1="40" y1="120" x2="240" y2="120" stroke="#e8590c" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="200" cy="120" r="14" fill="#2f3a2b"/><circle cx="110" cy="120" r="14" fill="#2f3a2b"/>
  <rect x="140" y="108" width="34" height="24" rx="3" fill="#6b4f35"/>
  <rect x="244" y="104" width="22" height="32" rx="3" fill="#2f3a2b"/>
  <rect x="206" y="66" width="30" height="20" fill="#fff" stroke="#2f3a2b"/><text x="221" y="81" font-size="12" fill="#2f3a2b" text-anchor="middle">kg</text>
  <g font-size="14" font-weight="bold" fill="#2f3a2b"><text x="270" y="82">Capacity plate:</text><text x="270" y="100" font-weight="normal">people, gear,</text><text x="270" y="118" font-weight="normal">guns, a deer</text></g>
  <text x="135" y="200" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Heavy gear on the floor, centred</text>
  <!-- kayak -->
  <path d="M40 254 Q 200 216 360 254 Q 200 292 40 254 Z" fill="#e8590c" stroke="#2f3a2b" stroke-width="2"/>
  <ellipse cx="200" cy="254" rx="26" ry="12" fill="#2f3a2b"/>
  <rect x="236" y="246" width="70" height="12" rx="4" fill="#6b4f35"/><rect x="110" y="246" width="40" height="16" rx="4" fill="#4a7fb0"/>
  <g font-size="14" font-weight="bold" fill="#2f3a2b"><text x="20" y="226">Kayak: one person</text><text x="232" y="290">Gun cased, strapped</text><text x="40" y="290">Dry bag</text></g>
</svg>
