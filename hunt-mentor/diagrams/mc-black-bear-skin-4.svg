<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Hide step 4 of 4: flesh off the fat and meat, salt heavily with non iodized salt, about 10 to 15 pounds or 4.5 to 7 kg for an average black bear, fold it skin to skin, and store it in a burlap or game bag. Never plastic: the hair slips. Do not freeze a salted hide.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Hide 4 of 4: salt</text><rect x="60" y="80" width="280" height="130" rx="20" fill="#e3d2b0"/><circle cx="72" cy="92" r="4" fill="#fff" stroke="#8a9a6b" stroke-width="1"/><circle cx="86" cy="98" r="4" fill="#fff" stroke="#8a9a6b" stroke-width="1"/><circle cx="100" cy="104" r="4" fill="#fff" stroke="#8a9a6b" stroke-width="1"/><circle cx="114" cy="92" r="4" fill="#fff" stroke="#8a9a6b" stroke-width="1"/><circle cx="128" cy="98" r="4" fill="#fff" stroke="#8a9a6b" stroke-width="1"/><circle cx="142" cy="104" r="4" fill="#fff" stroke="#8a9a6b" stroke-width="1"/><circle cx="156" cy="92" r="4" fill="#fff" stroke="#8a9a6b" stroke-width="1"/><circle cx="170" cy="98" r="4" fill="#fff" stroke="#8a9a6b" stroke-width="1"/><circle cx="184" cy="104" r="4" fill="#fff" stroke="#8a9a6b" stroke-width="1"/><circle cx="198" cy="92" r="4" fill="#fff" stroke="#8a9a6b" stroke-width="1"/><circle cx="212" cy="98" r="4" fill="#fff" stroke="#8a9a6b" stroke-width="1"/><circle cx="226" cy="104" r="4" fill="#fff" stroke="#8a9a6b" stroke-width="1"/><circle cx="240" cy="92" r="4" fill="#fff" stroke="#8a9a6b" stroke-width="1"/><circle cx="254" cy="98" r="4" fill="#fff" stroke="#8a9a6b" stroke-width="1"/><circle cx="268" cy="104" r="4" fill="#fff" stroke="#8a9a6b" stroke-width="1"/><circle cx="282" cy="92" r="4" fill="#fff" stroke="#8a9a6b" stroke-width="1"/><circle cx="296" cy="98" r="4" fill="#fff" stroke="#8a9a6b" stroke-width="1"/><circle cx="310" cy="104" r="4" fill="#fff" stroke="#8a9a6b" stroke-width="1"/><circle cx="324" cy="92" r="4" fill="#fff" stroke="#8a9a6b" stroke-width="1"/><text x="200" y="130" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Flesh off fat, then salt</text><text x="200" y="156" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">about 4.5 to 7 kg salt</text><text x="200" y="180" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Fold skin to skin</text><rect x="270" y="196" width="110" height="40" rx="8" fill="#e8590c"/><text x="325" y="222" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">NO plastic</text><rect x="8" y="256" width="384" height="36" rx="8" fill="#2f3a2b"/><text x="200" y="280" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Burlap or game bag. Never plastic.</text>
</svg>
