<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three cards. Heffley Creek, Region 3: mule deer on grass and fir benches, MUs 3-27 and 3-28. Fraser Valley, Region 2: black tailed deer in timber, cutblocks and old growth, the same species. South Okanagan, Region 8: mule deer on grassland winter range such as White Lake.">
<rect width="400" height="300" fill="#fffaf0"/>
