<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 342" font-family="sans-serif" role="img" aria-label="Side view of a warm front. Warm air rides up over a wedge of cold air along a sloping front. The clouds lie along that slope: far ahead and high are thin cirrus, then a veil that puts a halo around the sun, then grey cloud, then thick cloud with rain where the front meets the ground. The whole sequence moves toward you, so the clouds lower and thicken before the rain.">
