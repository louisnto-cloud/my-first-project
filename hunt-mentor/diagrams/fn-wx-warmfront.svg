<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Side view of a warm front: warm air rides up over cold air. Far ahead are high cirrus, then a halo veil, then grey altostratus, then rain at the front. The sequence moves toward you.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#e7f0f7" stroke="none" stroke-width="2"/><text x="14" y="26" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Warm front: clouds lower and thicken</text><path d="M0 250 C 120 230, 260 150, 400 60 L400 250 Z" fill="#f4d9c4" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=" opacity=".6""/><text x="300" y="220" font-family="sans-serif" font-size="13" fill="#6b4f35" text-anchor="start">warm air rides up</text><path d="M30 80 C 50 68, 75 70, 100 58" fill="none" stroke="#9aa5b1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M40 88 C 60 78, 85 80, 110 68" fill="none" stroke="#9aa5b1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="130" y="110" width="90" height="16" rx="8" fill="#dfe8f0" stroke="none" stroke-width="0"/><rect x="220" y="150" width="90" height="22" rx="8" fill="#b7c2cc" stroke="none" stroke-width="0"/><rect x="300" y="180" width="100" height="40" rx="8" fill="#7d8894" stroke="none" stroke-width="0"/><line x1="310" y1="222" x2="304" y2="248" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="326" y1="222" x2="320" y2="248" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="342" y1="222" x2="336" y2="248" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="358" y1="222" x2="352" y2="248" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="374" y1="222" x2="368" y2="248" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="390" y1="222" x2="384" y2="248" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><text x="60" y="110" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">cirrus</text><text x="175" y="140" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">halo</text><text x="265" y="190" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">grey</text><text x="350" y="265" font-family="sans-serif" font-size="13" fill="#4a7fb0" text-anchor="middle" font-weight="bold">rain</text><line x1="380" y1="285" x2="47.7" y2="285.0" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><polygon points="40.0,285.0 51.0,291.1 51.0,278.9" fill="#2f3a2b"/><text x="140" y="280" font-family="sans-serif" font-size="13" fill="#2f3a2b" text-anchor="start">front moves this way</text><line x1="0" y1="250" x2="400" y2="250" stroke="#8a9a6b" stroke-width="4" stroke-linecap="round"/>
</svg>
