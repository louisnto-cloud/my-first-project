<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" font-family="sans-serif" role="img" aria-label="A week of dry drills with your Tikka, 15 minutes, 4 days a week: 1 bolt cycles, 20 full strokes with the cheek on the stock, snap caps; 2 load and unload, 5 cycles out loud, dummy rounds; 3 dry fire, 20 slow presses watching the front post, snap cap; 4 position changes, walk, sticks up, aim, 10 times; 5 the safety by feel, with gloves. Always proved unloaded, ammunition in another room.">
<rect x="0" y="0" width="400" height="390" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">A week of Tikka drills</text><rect x="12" y="42" width="376" height="46" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="65" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="70" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="52" y="61" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Bolt cycles</text><text x="52" y="80" font-size="14" fill="#17201A" text-anchor="start">20 full strokes, cheek on the stock</text><text x="380" y="61" font-size="14" fill="#1F3D2B" text-anchor="end">snap caps</text><rect x="12" y="94" width="376" height="46" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="117" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="122" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="52" y="113" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Load and unload</text><text x="52" y="132" font-size="14" fill="#17201A" text-anchor="start">5 cycles out loud</text><text x="380" y="113" font-size="14" fill="#1F3D2B" text-anchor="end">dummies</text><rect x="12" y="146" width="376" height="46" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="169" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="174" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="52" y="165" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Dry fire</text><text x="52" y="184" font-size="14" fill="#17201A" text-anchor="start">20 slow presses, watch the post</text><text x="380" y="165" font-size="14" fill="#1F3D2B" text-anchor="end">snap cap</text><rect x="12" y="198" width="376" height="46" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="221" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="226" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="52" y="217" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Position changes</text><text x="52" y="236" font-size="14" fill="#17201A" text-anchor="start">walk, sticks up, aim: 10 times</text><text x="380" y="217" font-size="14" fill="#1F3D2B" text-anchor="end">empty</text><rect x="12" y="250" width="376" height="46" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="273" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="278" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="52" y="269" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Safety by feel</text><text x="52" y="288" font-size="14" fill="#17201A" text-anchor="start">ON, OFF, ON with gloves</text><text x="380" y="269" font-size="14" fill="#1F3D2B" text-anchor="end">empty</text><rect x="10" y="310" width="380" height="28" rx="6" fill="#1F3D2B"/><text x="200" y="329.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Proved unloaded. No ammo in the room.</text><rect x="12" y="346" width="376" height="32" rx="6" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="200" y="367" font-size="14" fill="#17201A" text-anchor="middle">15 minutes, 4 days a week (Tip).</text>
</svg>
