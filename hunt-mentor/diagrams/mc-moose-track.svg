<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 305" font-family="sans-serif" role="img" aria-label="A moose track beside a mule deer track at the same scale. The moose track is about 13 to 15 centimetres long, a long pointed split heart, with dewclaws showing behind in mud or snow. The mule deer track is about 6 to 8 centimetres.">
<rect x="0" y="0" width="400" height="305" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Track: a giant deer print</text><g transform="translate(150 160)"><path d="M-22 -60 Q-30 0 -16 50 Q-6 58 -2 40 Q-4 -10 -6 -62 Q-14 -70 -22 -60 Z" fill="#6b4f35"/><path d="M22 -60 Q30 0 16 50 Q6 58 2 40 Q4 -10 6 -62 Q14 -70 22 -60 Z" fill="#6b4f35"/><ellipse cx="-20" cy="78" rx="6" ry="9" fill="#6b4f35" opacity=".7"/><ellipse cx="20" cy="78" rx="6" ry="9" fill="#6b4f35" opacity=".7"/></g><line x1="110" y1="98" x2="110" y2="212" stroke="#e8590c" stroke-width="3"/><text x="104" y="160" font-size="14" fill="#e8590c" text-anchor="end" font-weight="bold">13 to 15 cm</text><text x="150" y="280" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Moose</text><text x="150" y="262" font-size="14" fill="#6b4f35" text-anchor="middle">dewclaws show in mud, snow</text><g transform="translate(300 170)"><path d="M-12 -30 Q-16 0 -8 26 Q-2 30 0 20 Q-2 -4 -3 -30 Z" fill="#8b5a2b"/><path d="M12 -30 Q16 0 8 26 Q2 30 0 20 Q2 -4 3 -30 Z" fill="#8b5a2b"/></g><line x1="330" y1="140" x2="330" y2="196" stroke="#e8590c" stroke-width="3"/><text x="338" y="172" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">6 to 8 cm</text><text x="300" y="280" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Mule deer</text><text x="200" y="298" font-size="14" fill="#6b4f35" text-anchor="middle">Drawn to the same scale</text>
</svg>
