<text x="102.954" y="421" font-size="15" fill="#c0392b" text-anchor="middle">Belly or brisket: low hit</text>
<line x1="346" y1="248" x2="360" y2="384" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="346" cy="248" r="2.6" fill="#2f3a2b"/>
<rect x="254.1" y="384.0" width="137.9" height="45.0" rx="5" fill="#fffaf0" stroke="#b8ad92" stroke-width="1.2"/>
<text x="323.047" y="403" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">White, dark band</text>
<text x="323.047" y="421" font-size="15" fill="#2f3a2b" text-anchor="middle">Tail or rump</text>
<text x="200" y="456" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hair, no blood: back out, give it more time</text>
</svg>
