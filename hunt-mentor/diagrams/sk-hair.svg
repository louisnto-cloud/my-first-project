<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 466" font-family="sans-serif" role="img" aria-label="Deer side view showing hair zones. Long, coarse grey brown hair from the top of the back means a high hit. Short brown hair with dark tips from the side of the chest is good. Long, fine white hair from the belly or brisket means a low hit. White hair with a dark band comes from the tail or rump. Hunter lore, a tip only. Hair but no blood: back out and give it more time.">
<rect width="400" height="466" fill="#fffaf0"/>
<text x="200" y="20" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hair at the hit site: how high? (Tip)</text>
