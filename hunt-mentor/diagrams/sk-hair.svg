<text x="87.0645" y="309" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Short, brown,</text>
<text x="87.0645" y="327" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">dark tips</text>
<text x="87.0645" y="345" font-size="15" fill="#2f6e3b" text-anchor="middle">Side of chest: good</text>
