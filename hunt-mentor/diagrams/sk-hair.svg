<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Deer side view showing hair zones. Long, coarse grey brown hair from the top of the back means a high hit. Short brown hair with dark tips from the side of the chest is good. Long, fine white hair from the belly or brisket means a low hit. White hair with a dark band comes from the tail or rump. Hunter lore, a tip only.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">Hair at the hit site: how high? (Tip)</text><g transform="translate(150 150)"><g stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"><rect x="-58" y="18" width="11" height="62" rx="4" fill="#c8b08a"/><rect x="-48" y="18" width="11" height="62" rx="4" fill="#c8b08a"/><rect x="46" y="16" width="11" height="64" rx="4" fill="#c8b08a"/><rect x="58" y="16" width="11" height="64" rx="4" fill="#c8b08a"/><path d="M-60 -14 L-92 -60 L-74 -70 L-40 -24 Z" fill="#c8b08a"/><ellipse cx="0" cy="0" rx="80" ry="32" fill="#c8b08a"/><ellipse cx="-98" cy="-62" rx="19" ry="10" fill="#c8b08a"/><path d="M-84 -70 L-74 -86 L-76 -66 Z" fill="#c8b08a"/><path d="M78 -12 L92 -18 L88 -2 Z" fill="#fff"/></g><circle cx="-106" cy="-64" r="2" fill="#23261f"/><path d="M-76 -14 C -40 -34, 40 -34, 78 -16 L 78 -6 C 40 -24, -40 -24, -76 -4 Z" fill="#7b6a58" stroke="#23261f" stroke-width="1.5"/><path d="M-70 18 C -30 34, 30 34, 70 18 L 66 26 C 30 40, -30 40, -66 26 Z" fill="#fff" stroke="#23261f" stroke-width="1.5"/><path d="M78 -12 L92 -18 L88 -2 Z" fill="#fff" stroke="#23261f" stroke-width="2"/><path d="M84 -14 L90 -16" stroke="#23261f" stroke-width="3"/></g><text x="250" y="62" font-size="13" font-weight="bold" fill="#23261f">Coarse, grey brown</text><text x="250" y="78" font-size="13" fill="#b3261e">Top of back: high hit</text><line x1="250" y1="84" x2="190.0" y2="128.0" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round"/><path d="M192.8 122.7 L190.0 128.0 L195.9 126.9" fill="none" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="250" y="132" font-size="13" font-weight="bold" fill="#23261f">Short, brown, dark tips</text><text x="250" y="148" font-size="13" fill="#2e7d32">Side of chest: good</text><line x1="250" y1="140" x2="200.0" y2="152.0" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round"/><path d="M204.6 148.2 L200.0 152.0 L205.9 153.3" fill="none" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="252" font-size="13" font-weight="bold" fill="#23261f">Long, white, fine</text><text x="220" y="268" font-size="13" fill="#b3261e">Belly or brisket: low hit</text><line x1="220" y1="248" x2="170.0" y2="182.0" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round"/><path d="M175.3 184.7 L170.0 182.0 L171.2 187.9" fill="none" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="252" font-size="13" font-weight="bold" fill="#23261f">White, dark band</text><text x="12" y="268" font-size="13" fill="#23261f">Tail or rump</text><line x1="60" y1="240" x2="236.0" y2="142.0" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round"/><path d="M232.5 146.9 L236.0 142.0 L230.0 142.3" fill="none" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="294" font-size="13" text-anchor="middle" fill="#2f3a2b">Hair, no blood: back out, give it more time</text>
</svg>
