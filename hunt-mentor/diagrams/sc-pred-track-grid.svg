<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 424" font-family="sans-serif" role="img" aria-label="Predator tracks and sign in a 2 by 2 grid. Cougar track: round, 4 toes, no claws, a wide three lobed heel pad, about 8 to 10 centimetres, 85 percent. Lynx track: huge and furry, toes hard to see, 70 percent. Wolf and coyote tracks: claws show; wolf 10 to 13 centimetres long, coyote 6 to 7, 60 percent. Covered kill: a carcass with leaves and debris raked over it, a leg sticking out. Leave at once and report it, 85 percent.">
