<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Sketch of black bear elevation by month. Spring: low, on south slopes and valley bottoms that green up first. Summer: climbing to avalanche chutes, burns and high berry patches. Fall: back down to fruit, orchards and fish. Dens can be at many elevations. Shape only: bears follow the food.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Where on the mountain, by month</text><line x1="50" y1="250" x2="390" y2="250" stroke="#2f3a2b" stroke-width="2"/><line x1="50" y1="250" x2="50" y2="56" stroke="#2f3a2b" stroke-width="2"/><text x="40" y="70" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">High</text><text x="40" y="248" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Low</text><text x="64.0" y="270" font-size="14" fill="#23261f" text-anchor="middle">J</text><text x="91.5" y="270" font-size="14" fill="#23261f" text-anchor="middle">F</text><text x="119.0" y="270" font-size="14" fill="#23261f" text-anchor="middle">M</text><text x="146.5" y="270" font-size="14" fill="#23261f" text-anchor="middle">A</text><text x="174.0" y="270" font-size="14" fill="#23261f" text-anchor="middle">M</text><text x="201.5" y="270" font-size="14" fill="#23261f" text-anchor="middle">J</text><text x="229.0" y="270" font-size="14" fill="#23261f" text-anchor="middle">J</text><text x="256.5" y="270" font-size="14" fill="#23261f" text-anchor="middle">A</text><text x="284.0" y="270" font-size="14" fill="#23261f" text-anchor="middle">S</text><text x="311.5" y="270" font-size="14" fill="#23261f" text-anchor="middle">O</text><text x="339.0" y="270" font-size="14" fill="#23261f" text-anchor="middle">N</text><text x="366.5" y="270" font-size="14" fill="#23261f" text-anchor="middle">D</text><polyline points="64,200 91,200 119,200 146,228 174,215 201,170 229,120 256,105 284,120 311,175 339,190 366,200" fill="none" stroke="#8b5a2b" stroke-width="4" stroke-dasharray="1 0"/><text x="150" y="246" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">green valley</text><text x="244" y="94" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">berries up high</text><text x="388" y="232" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">fruit, fish: low</text><text x="200" y="292" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Shape only. They follow the food (Tip, 65%).</text>
</svg>
