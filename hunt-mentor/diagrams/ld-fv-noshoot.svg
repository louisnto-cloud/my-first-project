<text x="74" y="299" font-size="16" font-weight="bold" fill="#2f3a2b">Fraser Valley Regional District (FVRD)</text>
<text x="74" y="320" font-size="16" font-weight="bold" fill="#2f3a2b">roads</text>
<text x="74" y="340" font-size="15" fill="#2f3a2b">No discharge within 400 m, except lawful</text>
<text x="74" y="359" font-size="15" fill="#2f3a2b">hunting (99%).</text>
