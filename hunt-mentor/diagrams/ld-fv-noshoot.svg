<text x="74" y="108" font-size="15" fill="#2f3a2b">(98%).</text>
<rect x="8" y="127" width="384" height="77" rx="8" fill="#f4eedf"/>
<rect x="8" y="127" width="6" height="77" rx="3" fill="#c0392b"/>
<circle cx="41.0" cy="165.5" r="21" fill="#fffaf0" stroke="#c0392b" stroke-width="2"/>
