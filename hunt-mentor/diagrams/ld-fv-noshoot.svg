<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 571" font-family="sans-serif" role="img" aria-label="More no shooting rules near Mission. No shooting: Sumas Mountain, all of Electoral Area H of the Fraser Valley Regional District is a No Shooting Area, 98 percent. Regional District Parks in Regions 1 and 2: no hunting or shooting within 100 metres, 99 percent. Nicomen Island lowland: rifles prohibited, 90 percent. Limits: Fraser Valley Regional District roads, no discharge within 400 metres except lawful hunting or trapping, 99 percent. Highway 7 east of Mission and Highway 1 east of Chilliwack: shot only within 150 metres, 98 percent. Abbotsford bylaw: discharge limited to farmers protecting stock, slaughter and licensed ranges, 70 percent, VERIFY.">
<rect width="400" height="571" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">More no shooting rules near Mission</text>
