<text x="74" y="191" font-size="15" fill="#2f3a2b">within 100 m (99%).</text>
<rect x="8" y="210" width="384" height="58" rx="8" fill="#f4eedf"/>
<rect x="8" y="210" width="6" height="58" rx="3" fill="#c0392b"/>
