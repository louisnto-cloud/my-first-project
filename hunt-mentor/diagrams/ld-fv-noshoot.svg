<text x="74" y="467" font-size="16" font-weight="bold" fill="#2f3a2b">Abbotsford bylaw</text>
<text x="74" y="487" font-size="15" fill="#2f3a2b">Discharge limited to farmers, slaughter,</text>
<text x="74" y="506" font-size="15" fill="#2f3a2b">ranges (70%).</text>
<text x="74" y="525" font-size="15" fill="#c0392b">VERIFY.</text>
<text x="14" y="559" font-size="14" font-weight="bold" fill="#6b5b4b">Red: no shooting. Brown: limits.</text>
