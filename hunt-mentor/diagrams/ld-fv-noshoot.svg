<circle cx="41.0" cy="239.0" r="21" fill="none" stroke="#c0392b" stroke-width="3"/><path d="M26.3 224.3 L55.7 253.7" stroke="#c0392b" stroke-width="3"/>
<text x="74" y="235" font-size="16" font-weight="bold" fill="#2f3a2b">Nicomen lowland</text>
<text x="74" y="255" font-size="15" fill="#2f3a2b">Rifles prohibited (90%).</text>
