<text x="74" y="403" font-size="16" font-weight="bold" fill="#2f3a2b">Highway 7 and Highway 1</text>
<text x="74" y="423" font-size="15" fill="#2f3a2b">Shot only within 150 m (98%).</text>
<rect x="8" y="442" width="384" height="96" rx="8" fill="#f4eedf"/>
<rect x="8" y="442" width="6" height="96" rx="3" fill="#8b5a2b"/>
