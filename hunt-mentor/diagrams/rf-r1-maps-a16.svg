<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 634" font-family="sans-serif" role="img" aria-label="Maps A16 to A22, Qualicum to Comox, grouped by rule. Motor Vehicle Closed Areas: A16 Parksville Qualicum Wildlife Management Area, MU 1-5, and A17 Willow Creek, MU 1-6. A18 Woodhus Slough: No Hunting Area, MU 1-6. A21 Lazo Marsh: No Shooting or Hunting Area, MU 1-6. A22 Comox Harbour: No Shooting Area, MU 1-6. Bow or firearms using shot only: A19 Courtenay and Campbell River, with a special antlerless season, and the Gulf Island licence is needed on Denman and Hornby; A20 Qualicum and Parksville, with a special antlerless season.">
