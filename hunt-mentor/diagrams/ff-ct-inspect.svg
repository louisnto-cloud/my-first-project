<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Six faults to check before loading a round: a split neck, a dented case, green corrosion, a loose bullet, the wrong headstamp, or ammunition over 10 years old, which Tikka says not to fire. Any doubt, set it aside.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Check every round before it goes in</text><rect x="16" y="46" width="180" height="64" rx="8" fill="#f3d5d2" stroke="#b3261e" stroke-width="1.5"/><text x="106" y="72" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Split neck</text><text x="106" y="92" font-size="14" fill="#23261f" text-anchor="middle">crack at the mouth</text><rect x="204" y="46" width="180" height="64" rx="8" fill="#f3d5d2" stroke="#b3261e" stroke-width="1.5"/><text x="294" y="72" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Dented case</text><text x="294" y="92" font-size="14" fill="#23261f" text-anchor="middle">will not chamber right</text><rect x="16" y="120" width="180" height="64" rx="8" fill="#f3d5d2" stroke="#b3261e" stroke-width="1.5"/><text x="106" y="146" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Green crust</text><text x="106" y="166" font-size="14" fill="#23261f" text-anchor="middle">corrosion</text><rect x="204" y="120" width="180" height="64" rx="8" fill="#f3d5d2" stroke="#b3261e" stroke-width="1.5"/><text x="294" y="146" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Loose bullet</text><text x="294" y="166" font-size="14" fill="#23261f" text-anchor="middle">turns or pushes in</text><rect x="16" y="194" width="180" height="64" rx="8" fill="#f3d5d2" stroke="#b3261e" stroke-width="1.5"/><text x="106" y="220" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Wrong headstamp</text><text x="106" y="240" font-size="14" fill="#23261f" text-anchor="middle">not .308 Win</text><rect x="204" y="194" width="180" height="64" rx="8" fill="#f3d5d2" stroke="#b3261e" stroke-width="1.5"/><text x="294" y="220" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Over 10 years old</text><text x="294" y="240" font-size="14" fill="#23261f" text-anchor="middle">Tikka: do not fire</text><rect x="70" y="262" width="260" height="30" rx="15.0" fill="#2f3a2b" stroke="none" stroke-width="2"/><text x="200.0" y="282.25" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Any doubt? Set it aside.</text>
</svg>
