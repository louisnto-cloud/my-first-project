<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-label="Rimfire step 3. A rifle rests against the side of a tree trunk, with your hand padding it, for a steady head shot. Sit or kneel if you can." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="290" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">3. Get steady: rest the rifle</text>
<rect x="0" y="250" width="400" height="50" fill="#dfe6d3"/>
<rect x="60" y="80" width="26" height="172" fill="#6b4f35"/>
<g transform="translate(40 150) rotate(-12)"><rect x="0" y="0" width="230" height="10" rx="3" fill="#23261f"/><path d="M-60 6 L0 0 L0 22 L-50 26 Z" fill="#8b5a2b"/><rect x="70" y="-12" width="70" height="10" rx="4" fill="#2f3a2b"/></g>
<circle cx="73" cy="158" r="8" fill="#e8590c"/>
<text x="120" y="220" font-size="14" fill="#23261f" text-anchor="start">Rifle rests on the side of</text>
<text x="120" y="238" font-size="14" fill="#23261f" text-anchor="start">a tree, hand padding it.</text>
<text x="120" y="256" font-size="14" fill="#23261f" text-anchor="start">Sit or kneel if you can.</text>
<text x="160" y="64" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Rest here</text>
<line x1="158" y1="68" x2="82" y2="150" stroke="#e8590c" stroke-width="2"/>
</svg>
