<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 368" font-family="sans-serif" role="img" aria-label="Leave these at home: five things that break the rules just by being on the hunt or being used to hunt. Thermal or other infrared optics: possession on the trip is an offence, even unused, even in the pack. Drone: possession on the trip is an offence, no drone scouting. Cell trail camera that sends pictures: not for hunting 1 August to 10 December. Electronic caller: not for deer, ducks, geese or grouse. Spotlight or any light: never to hunt by.">
<rect width="400" height="368" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="36" rx="6" fill="#c0392b"/>
<text x="200" y="33" font-size="18" font-weight="bold" fill="#fffaf0" text-anchor="middle">Leave these at home</text>
<g data-tip="1. Thermal optics|No using or possessing infrared optics, thermal scopes or monoculars on a hunting trip. Leave it at home, not in the truck.">
<rect x="8" y="52" width="384" height="60" rx="6" fill="#f4eedf"/>
<circle cx="44" cy="82.0" r="26" fill="#fffaf0" stroke="#d8cfb8" stroke-width="1.4"/>
<g transform="translate(44 82.0) scale(1.12) translate(-44 -82.0)"><g transform="translate(44 82.0)"><rect x="-19" y="-9" width="34" height="18" rx="6" fill="#3b3f45"/><rect x="13" y="-11" width="8" height="22" rx="3" fill="#24272b"/><rect x="-23" y="-6" width="6" height="12" rx="2" fill="#24272b"/><rect x="-12" y="-5" width="18" height="10" rx="2" fill="#5b2a86"/><ellipse cx="-2" cy="0" rx="5" ry="3.6" fill="#f08c00"/><ellipse cx="-2" cy="0" rx="2.4" ry="1.8" fill="#ffe066"/></g></g>
<circle cx="44" cy="82.0" r="26" fill="none" stroke="#c0392b" stroke-width="3"/><path d="M25.8 63.8 L62.2 100.2" stroke="#c0392b" stroke-width="3"/>
<text x="86" y="78" font-size="17" font-weight="bold" fill="#2f3a2b">Thermal optics</text>
<text x="86" y="99" font-size="15" fill="#2f3a2b">Even unused, even in the pack</text>
<circle cx="20" cy="64" r="11" fill="#2f3a2b" stroke="#fffaf0" stroke-width="2"/><text x="20" y="69.5" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">1</text></g>
<g data-tip="2. Drone|No flying or possessing a drone on a hunting trip, and no using drone information from less than 6 hours before the trip starts.">
<rect x="8" y="114" width="384" height="60" rx="6" fill="#fffaf0"/>
<circle cx="44" cy="144.0" r="26" fill="#fffaf0" stroke="#d8cfb8" stroke-width="1.4"/>
<g transform="translate(44 144.0) scale(1.12) translate(-44 -144.0)"><g transform="translate(44 144.0)"><path d="M-13 -13 L13 13 M13 -13 L-13 13" stroke="#3b3f45" stroke-width="3.4"/><ellipse cx="-13" cy="-13" rx="8" ry="3" fill="#9aa3ad"/><circle cx="-13" cy="-13" r="2" fill="#3b3f45"/><ellipse cx="-13" cy="13" rx="8" ry="3" fill="#9aa3ad"/><circle cx="-13" cy="13" r="2" fill="#3b3f45"/><ellipse cx="13" cy="-13" rx="8" ry="3" fill="#9aa3ad"/><circle cx="13" cy="-13" r="2" fill="#3b3f45"/><ellipse cx="13" cy="13" rx="8" ry="3" fill="#9aa3ad"/><circle cx="13" cy="13" r="2" fill="#3b3f45"/><rect x="-6" y="-5" width="12" height="10" rx="3" fill="#3b3f45"/><circle cy="1" r="2" fill="#4a7fb0"/></g></g>
<circle cx="44" cy="144.0" r="26" fill="none" stroke="#c0392b" stroke-width="3"/><path d="M25.8 125.8 L62.2 162.2" stroke="#c0392b" stroke-width="3"/>
<text x="86" y="140" font-size="17" font-weight="bold" fill="#2f3a2b">Drone</text>
<text x="86" y="161" font-size="15" fill="#2f3a2b">Not on the trip. No drone scouting</text>
<circle cx="20" cy="126" r="11" fill="#2f3a2b" stroke="#fffaf0" stroke-width="2"/><text x="20" y="131.5" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text></g>
<g data-tip="3. Cell trail camera|A camera that sends pictures to your phone is not for hunting from 1 August to 10 December. In season, use one that only stores to its card.">
<rect x="8" y="176" width="384" height="60" rx="6" fill="#f4eedf"/>
<circle cx="44" cy="206.0" r="26" fill="#fffaf0" stroke="#d8cfb8" stroke-width="1.4"/>
<g transform="translate(44 206.0) scale(1.12) translate(-44 -206.0)"><g transform="translate(44 206.0)"><rect x="-11" y="-12" width="22" height="26" rx="4" fill="#6b5b3a"/><path d="M-11 -2 q5 -4 10 0 t11 2 V6 q-6 -3 -11 0 t-10 0z" fill="#4d5a35"/><circle cy="-4" r="5" fill="#24272b"/><circle cy="-4" r="2" fill="#7fa7c9"/><rect x="-6" y="5" width="12" height="4" rx="1" fill="#24272b"/><path d="M9 -12 V-20" stroke="#3b3f45" stroke-width="2"/><path d="M13 -22 a6 6 0 0 1 0 8 M16 -25 a10 10 0 0 1 0 14" stroke="#4a7fb0" stroke-width="1.8" fill="none"/></g></g>
<circle cx="44" cy="206.0" r="26" fill="none" stroke="#c0392b" stroke-width="3"/><path d="M25.8 187.8 L62.2 224.2" stroke="#c0392b" stroke-width="3"/>
<text x="86" y="202" font-size="17" font-weight="bold" fill="#2f3a2b">Cell trail camera</text>
<text x="86" y="223" font-size="15" fill="#2f3a2b">Not for hunting 1 Aug to 10 Dec</text>
<circle cx="20" cy="188" r="11" fill="#2f3a2b" stroke="#fffaf0" stroke-width="2"/><text x="20" y="193.5" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">3</text></g>
<g data-tip="4. Electronic caller|Only allowed for wolf, coyote, cougar, lynx, bobcat and Schedule C birds. For game, use mouth and hand calls.">
<rect x="8" y="238" width="384" height="60" rx="6" fill="#fffaf0"/>
<circle cx="44" cy="268.0" r="26" fill="#fffaf0" stroke="#d8cfb8" stroke-width="1.4"/>
<g transform="translate(44 268.0) scale(1.12) translate(-44 -268.0)"><g transform="translate(44 268.0)"><rect x="-15" y="-11" width="22" height="22" rx="4" fill="#3b3f45"/><circle cx="-4" cy="0" r="7" fill="#5c636b"/><circle cx="-7" cy="-3" r="1" fill="#24272b"/><circle cx="-7" cy="0" r="1" fill="#24272b"/><circle cx="-7" cy="3" r="1" fill="#24272b"/><circle cx="-4" cy="-3" r="1" fill="#24272b"/><circle cx="-4" cy="0" r="1" fill="#24272b"/><circle cx="-4" cy="3" r="1" fill="#24272b"/><circle cx="-1" cy="-3" r="1" fill="#24272b"/><circle cx="-1" cy="0" r="1" fill="#24272b"/><circle cx="-1" cy="3" r="1" fill="#24272b"/><path d="M11 -6 a8 8 0 0 1 0 12 M15 -10 a13 13 0 0 1 0 20" stroke="#e8590c" stroke-width="2" fill="none"/></g></g>
<circle cx="44" cy="268.0" r="26" fill="none" stroke="#c0392b" stroke-width="3"/><path d="M25.8 249.8 L62.2 286.2" stroke="#c0392b" stroke-width="3"/>
<text x="86" y="264" font-size="17" font-weight="bold" fill="#2f3a2b">Electronic caller</text>
<text x="86" y="285" font-size="15" fill="#2f3a2b">Not for deer, ducks, geese or grouse</text>
<circle cx="20" cy="250" r="11" fill="#2f3a2b" stroke="#fffaf0" stroke-width="2"/><text x="20" y="255.5" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">4</text></g>
<g data-tip="5. Spotlight|No hunting with the use or aid of any light. A headlamp to walk in before light is fine (my reading, 90%).">
<rect x="8" y="300" width="384" height="60" rx="6" fill="#f4eedf"/>
<circle cx="44" cy="330.0" r="26" fill="#fffaf0" stroke="#d8cfb8" stroke-width="1.4"/>
<g transform="translate(44 330.0) scale(1.12) translate(-44 -330.0)"><g transform="translate(44 330.0)"><path d="M2 -9 L22 -16 V16 L2 9z" fill="#ffe8a3"/><rect x="-14" y="-8" width="16" height="16" rx="3" fill="#3b3f45"/><rect x="0" y="-10" width="5" height="20" rx="1.5" fill="#24272b"/><path d="M-9 8 V15 H-3 V8" fill="#3b3f45"/></g></g>
<circle cx="44" cy="330.0" r="26" fill="none" stroke="#c0392b" stroke-width="3"/><path d="M25.8 311.8 L62.2 348.2" stroke="#c0392b" stroke-width="3"/>
<text x="86" y="326" font-size="17" font-weight="bold" fill="#2f3a2b">Spotlight</text>
<text x="86" y="347" font-size="15" fill="#2f3a2b">No light of any kind to hunt by</text>
<circle cx="20" cy="312" r="11" fill="#2f3a2b" stroke="#fffaf0" stroke-width="2"/><text x="20" y="317.5" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">5</text></g>
</svg>
