<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="sans-serif" role="img" aria-label="Ten steps from shot to table: count, shoot, watch, wait, notch the licence, cool, quarter, pack, hang, and report. Count, notch and report are legal steps; the Mandatory Hunter Report is due by 31 March.">
<rect x="0" y="0" width="400" height="290" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Shot to table in 10 steps</text><circle cx="50" cy="90" r="30" fill="#e8590c"/><text x="50" y="95" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Count</text><line x1="82" y1="90" x2="94.0" y2="90.0" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round"/><path d="M94.0 90.0 L85.0 94.3 L85.0 85.7 Z" fill="#8a9a6b"/><circle cx="126" cy="90" r="30" fill="#2f3a2b"/><text x="126" y="95" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Shoot</text><line x1="158" y1="90" x2="170.0" y2="90.0" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round"/><path d="M170.0 90.0 L161.0 94.3 L161.0 85.7 Z" fill="#8a9a6b"/><circle cx="202" cy="90" r="30" fill="#2f3a2b"/><text x="202" y="95" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Watch</text><line x1="234" y1="90" x2="246.0" y2="90.0" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round"/><path d="M246.0 90.0 L237.0 94.3 L237.0 85.7 Z" fill="#8a9a6b"/><circle cx="278" cy="90" r="30" fill="#2f3a2b"/><text x="278" y="95" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Wait</text><line x1="310" y1="90" x2="322.0" y2="90.0" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round"/><path d="M322.0 90.0 L313.0 94.3 L313.0 85.7 Z" fill="#8a9a6b"/><circle cx="354" cy="90" r="30" fill="#e8590c"/><text x="354" y="95" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Notch</text><circle cx="50" cy="200" r="30" fill="#2f3a2b"/><text x="50" y="205" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Cool</text><line x1="82" y1="200" x2="94.0" y2="200.0" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round"/><path d="M94.0 200.0 L85.0 204.3 L85.0 195.7 Z" fill="#8a9a6b"/><circle cx="126" cy="200" r="30" fill="#2f3a2b"/><text x="126" y="205" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Quarter</text><line x1="158" y1="200" x2="170.0" y2="200.0" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round"/><path d="M170.0 200.0 L161.0 204.3 L161.0 195.7 Z" fill="#8a9a6b"/><circle cx="202" cy="200" r="30" fill="#2f3a2b"/><text x="202" y="205" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Pack</text><line x1="234" y1="200" x2="246.0" y2="200.0" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round"/><path d="M246.0 200.0 L237.0 204.3 L237.0 195.7 Z" fill="#8a9a6b"/><circle cx="278" cy="200" r="30" fill="#2f3a2b"/><text x="278" y="205" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Hang</text><line x1="310" y1="200" x2="322.0" y2="200.0" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round"/><path d="M322.0 200.0 L313.0 204.3 L313.0 195.7 Z" fill="#8a9a6b"/><circle cx="354" cy="200" r="30" fill="#e8590c"/><text x="354" y="205" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Report</text><text x="200" y="274" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Orange steps are the law. Report by 31 March.</text>
</svg>
