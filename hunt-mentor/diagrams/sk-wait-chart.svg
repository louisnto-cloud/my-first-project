<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of how long to wait before following a hit deer: heart or lungs 30 minutes, muscle or leg 30 to 60 minutes, liver 4 to 6 hours, gut 6 to 8 hours or overnight, not sure several hours.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">How long to wait before you follow</text><line x1="150" y1="46" x2="150" y2="240" stroke="#dfe6d3" stroke-width="2"/><text x="150" y="258" font-size="13" text-anchor="middle" fill="#23261f">0 h</text><line x1="206" y1="46" x2="206" y2="240" stroke="#dfe6d3" stroke-width="2"/><text x="206" y="258" font-size="13" text-anchor="middle" fill="#23261f">2 h</text><line x1="262" y1="46" x2="262" y2="240" stroke="#dfe6d3" stroke-width="2"/><text x="262" y="258" font-size="13" text-anchor="middle" fill="#23261f">4 h</text><line x1="318" y1="46" x2="318" y2="240" stroke="#dfe6d3" stroke-width="2"/><text x="318" y="258" font-size="13" text-anchor="middle" fill="#23261f">6 h</text><line x1="374" y1="46" x2="374" y2="240" stroke="#dfe6d3" stroke-width="2"/><text x="374" y="258" font-size="13" text-anchor="middle" fill="#23261f">8 h</text><text x="144" y="70" font-size="15" font-weight="bold" text-anchor="end" fill="#23261f">Heart or lungs</text><rect x="150" y="52" width="14.0" height="26" rx="4" fill="#2e7d32"/><text x="170.0" y="70" font-size="14" font-weight="bold" fill="#23261f">30 min</text><text x="144" y="108" font-size="15" font-weight="bold" text-anchor="end" fill="#23261f">Muscle or leg</text><rect x="164.0" y="90" width="14.0" height="26" rx="4" fill="#2e7d32"/><text x="184" y="108" font-size="14" font-weight="bold" fill="#23261f">30 to 60 min</text><text x="144" y="146" font-size="15" font-weight="bold" text-anchor="end" fill="#23261f">Liver</text><rect x="262" y="128" width="56" height="26" rx="4" fill="#e8590c"/><text x="256" y="146" font-size="14" font-weight="bold" text-anchor="end" fill="#23261f">4 to 6 h</text><text x="144" y="184" font-size="15" font-weight="bold" text-anchor="end" fill="#23261f">Gut</text><rect x="318" y="166" width="56" height="26" rx="4" fill="#b3261e"/><text x="312" y="184" font-size="14" font-weight="bold" text-anchor="end" fill="#23261f">6 to 8 h, or overnight</text><line x1="374" y1="179" x2="396.0" y2="179.0" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/><path d="M389.7 182.0 L396.0 179.0 L389.7 176.0" fill="none" stroke="#b3261e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="144" y="226" font-size="15" font-weight="bold" text-anchor="end" fill="#23261f">Not sure</text><text x="156" y="226" font-size="14" font-weight="bold" fill="#2f3a2b">several hours. Back out.</text><text x="200" y="282" font-size="14" text-anchor="middle" fill="#2f3a2b">Rain coming? Go sooner (Tip)</text>
</svg>
