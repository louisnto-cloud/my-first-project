<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A side view of a scoped bolt rifle with five labels: the action loads, locks and fires; the barrel aims and spins the bullet; the stock holds it to you; the trigger lets the shot go; the safety blocks the trigger.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">One rifle, five jobs</text><g transform="translate(20 130) scale(1.0)"><path d="M0 20 L100 12 L110 12 L120 40 L220 38 L220 50 L110 56 L92 68 L78 60 L0 76 Z" fill="#8b5a2b" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-8" y="18" width="10" height="60" rx="3" fill="#2f3a2b" stroke="none" stroke-width="2"/><rect x="100" y="2" width="84" height="20" rx="0" fill="#6b6f68" stroke="#2f3a2b" stroke-width="2"/><rect x="184" y="8" width="186" height="8" rx="0" fill="#6b6f68" stroke="#2f3a2b" stroke-width="1"/><path d="M118 22 l-8 18" fill="none" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="109" cy="42" r="6" fill="#2f3a2b" stroke="none" stroke-width="2"/><path d="M118 54 q 2 16 22 14 l2 -14" fill="none" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="142" y="54" width="26" height="18" rx="2" fill="#2f3a2b" stroke="none" stroke-width="2"/><rect x="118" y="-22" width="90" height="14" rx="6" fill="#4b4f48" stroke="#2f3a2b" stroke-width="1.5"/><path d="M118 -15 l-14 -6 l0 12 Z" fill="#4b4f48" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M208 -15 l18 -8 l0 16 Z" fill="#4b4f48" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="130" y="-8" width="6" height="10" rx="0" fill="#2f3a2b" stroke="none" stroke-width="2"/><rect x="190" y="-8" width="6" height="10" rx="0" fill="#2f3a2b" stroke="none" stroke-width="2"/></g><line x1="160" y1="132" x2="150" y2="88" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="150" y="66" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Action</text><text x="150" y="82" font-size="14" fill="#23261f" text-anchor="middle">loads, locks, fires</text><line x1="320" y1="140" x2="330" y2="88" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="330" y="66" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Barrel</text><text x="330" y="82" font-size="14" fill="#23261f" text-anchor="middle">aims and spins</text><line x1="60" y1="180" x2="70" y2="200" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="70" y="216" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Stock</text><text x="70" y="232" font-size="14" fill="#23261f" text-anchor="middle">holds it to you</text><line x1="158" y1="200" x2="200" y2="220" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="200" y="236" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Trigger</text><text x="200" y="252" font-size="14" fill="#23261f" text-anchor="middle">lets the shot go</text><line x1="238" y1="160" x2="330" y2="200" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="330" y="216" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Safety</text><text x="330" y="232" font-size="14" fill="#23261f" text-anchor="middle">blocks the trigger</text><text x="200.0" y="290" font-size="14" fill="#2f3a2b" text-anchor="middle">Tikka T3x Arctic: learn each job, then the rifle makes sense</text>
</svg>
