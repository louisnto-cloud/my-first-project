<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 372" font-family="sans-serif" role="img" aria-label="Cold days with the Tikka: 1 if oil got into the bolt, clean it out, which the manual says matters in cold and harsh weather; 2 the big trigger guard takes gloves, practise the safety in mitts; 3 an oversized bolt knob is a Tikka accessory; 4 a cold rifle brought into a warm room sweats, dry it before it goes in the safe; 5, in orange, snow at the muzzle: unload, bolt out, look through. Batteries die fast in cold.">
<rect x="0" y="0" width="400" height="372" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Cold days</text><rect x="12" y="42" width="376" height="50" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="67" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="72" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="52" y="63" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Oil in the bolt? Clean it out</text><text x="52" y="82" font-size="14" fill="#17201A" text-anchor="start">manual: matters in cold, harsh weather</text><rect x="12" y="98" width="376" height="50" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="123" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="128" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="52" y="119" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Gloves: big trigger guard</text><text x="52" y="138" font-size="14" fill="#17201A" text-anchor="start">practise the safety in mitts</text><rect x="12" y="154" width="376" height="50" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="179" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="184" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="52" y="175" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Oversized bolt knob</text><text x="52" y="194" font-size="14" fill="#17201A" text-anchor="start">a Tikka accessory</text><rect x="12" y="210" width="376" height="50" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="235" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="240" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="52" y="231" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Cold rifle into a warm room</text><text x="52" y="250" font-size="14" fill="#17201A" text-anchor="start">it sweats: dry it before the safe</text><rect x="12" y="266" width="376" height="50" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="291" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="296" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="52" y="287" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Snow at the muzzle</text><text x="52" y="306" font-size="14" fill="#17201A" text-anchor="start">unload, bolt out, look through</text><rect x="12" y="326" width="376" height="34" rx="6" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="200" y="348" font-size="14" fill="#17201A" text-anchor="middle">Batteries die fast in cold. Spares inside.</text>
</svg>
