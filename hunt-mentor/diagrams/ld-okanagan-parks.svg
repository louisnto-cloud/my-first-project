<circle cx="41.0" cy="482.5" r="20" fill="#fffaf0" stroke="#8b5a2b" stroke-width="2"/>
<g transform="translate(41.0 482.5) scale(0.8)" fill="#8b5a2b" stroke="none"><rect x="-8" y="-14" width="16" height="28" rx="3"/><rect x="-5.5" y="-10" width="11" height="17" fill="#fffaf0"/><circle cy="10.5" r="1.6" fill="#fffaf0"/></g>
<text x="78" y="478" font-size="16" font-weight="bold" fill="#2f3a2b">South Okanagan WMA</text>
<text x="78" y="497" font-size="15" fill="#2f3a2b">Status: VERIFY, 250 490 8200</text>
<rect x="8" y="512" width="384" height="74" rx="6" fill="#f4eedf"/>
<circle cx="41.0" cy="549.0" r="20" fill="#fffaf0" stroke="#8b5a2b" stroke-width="2"/>
<g transform="translate(41.0 549.0) scale(0.8)" fill="#8b5a2b" stroke="none"><rect x="-15" y="-10" width="3.5" height="23"/><rect x="11.5" y="-10" width="3.5" height="23"/><path d="M-12 -5 H12 M-12 3 H12 M-12 3 L12 -5" stroke="#8b5a2b" stroke-width="2.6"/></g>
<text x="78" y="535" font-size="16" font-weight="bold" fill="#2f3a2b">Grazing lease</text>
<text x="78" y="554" font-size="15" fill="#2f3a2b">Lease holder OK while cattle are on it</text>
<text x="78" y="573" font-size="15" fill="#2f3a2b">(99%)</text>
<rect x="8" y="596" width="384" height="30" rx="6" fill="#c0392b"/>
<g transform="translate(31 611) scale(0.62)" fill="#fffaf0" stroke="none"><circle r="13" fill="none" stroke="#fffaf0" stroke-width="3.5"/><path d="M-9 -9 L9 9" stroke="#fffaf0" stroke-width="3.5"/></g>
<text x="50" y="617" font-size="15" font-weight="bold" fill="#fffaf0" letter-spacing="1">TREAT AS CLOSED</text>
<rect x="8" y="632" width="384" height="55" rx="6" fill="#f4eedf"/>
<circle cx="41.0" cy="659.5" r="20" fill="#fffaf0" stroke="#c0392b" stroke-width="2"/>
<g transform="translate(41.0 659.5) scale(0.8)" fill="#c0392b" stroke="none"><path d="M0 -15 L9 -1 H5 L12 9 H-12 L-5 -1 H-9z"/><rect x="-2" y="9" width="4" height="5"/></g>
<circle cx="41.0" cy="659.5" r="20" fill="none" stroke="#c0392b" stroke-width="3"/><path d="M27.0 645.5 L55.0 673.5" stroke="#c0392b" stroke-width="3"/>
<text x="78" y="655" font-size="16" font-weight="bold" fill="#2f3a2b">Vaseux Lake Park</text>
<text x="78" y="674" font-size="15" fill="#2f3a2b">No hunting listed. Treat as closed (90%)</text>
</svg>
