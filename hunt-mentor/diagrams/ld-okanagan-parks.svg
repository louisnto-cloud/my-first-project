<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 705" font-family="sans-serif" role="img" aria-label="Crown land and parks for quail near the Okanagan. Park pages say hunting is allowed in season, 99 percent. South Okanagan Grasslands Protected Area, Kilpoola, Mount Kobau and Chopaka: hunting permitted, vehicles only on Kruger Mountain Road and the Mount Kobau road. White Lake Grasslands: permitted, no motor vehicles, much access through private land. Okanagan Mountain Park: permitted, foot, horse or bike only. Myra Bellevue Park: permitted, be cautious on the Crawford trails. Kalamalka Lake Park: only inside the mapped hunting areas. South Okanagan Wildlife Management Area, WMA: status VERIFY with 250 490 8200. Grazing lease land: the lease holder must agree while cattle are on it, 99 percent. Vaseux Lake Park: no hunting listed, treat as closed, 90 percent.">
<rect width="400" height="705" fill="#fffaf0"/>
<text x="14" y="23" font-size="14" font-weight="bold" fill="#6b5b4b">Park pages say hunting allowed in season (99%)</text>
<text x="14" y="43" font-size="14" font-weight="bold" fill="#6b5b4b">WMA: Wildlife Management Area</text>
<rect x="8" y="52" width="384" height="30" rx="6" fill="#2f6e3b"/>
<text x="18" y="73" font-size="15" font-weight="bold" fill="#fffaf0" letter-spacing="1">HUNTING ALLOWED IN SEASON</text>
<rect x="8" y="88" width="384" height="74" rx="6" fill="#f4eedf"/>
<circle cx="41.0" cy="125.0" r="20" fill="#fffaf0" stroke="#2f6e3b" stroke-width="2"/>
<g transform="translate(41.0 125.0) scale(0.8)" fill="#2f6e3b" stroke="none"><path d="M0 -15 L9 -1 H5 L12 9 H-12 L-5 -1 H-9z"/><rect x="-2" y="9" width="4" height="5"/></g>
<text x="78" y="111" font-size="16" font-weight="bold" fill="#2f3a2b">South Okanagan Grasslands</text>
<text x="78" y="130" font-size="15" fill="#2f3a2b">Kilpoola, Mt. Kobau, Chopaka. Vehicles on 2</text>
<text x="78" y="149" font-size="15" fill="#2f3a2b">roads only</text>
<circle cx="41.0" cy="201.0" r="20" fill="#fffaf0" stroke="#2f6e3b" stroke-width="2"/>
<g transform="translate(41.0 201.0) scale(0.8)" fill="#2f6e3b" stroke="none"><path d="M0 -15 L9 -1 H5 L12 9 H-12 L-5 -1 H-9z"/><rect x="-2" y="9" width="4" height="5"/></g>
<text x="78" y="187" font-size="16" font-weight="bold" fill="#2f3a2b">White Lake Grasslands</text>
<text x="78" y="206" font-size="15" fill="#2f3a2b">No vehicles. Much access through private</text>
<text x="78" y="225" font-size="15" fill="#2f3a2b">land</text>
<rect x="8" y="240" width="384" height="55" rx="6" fill="#f4eedf"/>
<circle cx="41.0" cy="267.5" r="20" fill="#fffaf0" stroke="#2f6e3b" stroke-width="2"/>
<g transform="translate(41.0 267.5) scale(0.8)" fill="#2f6e3b" stroke="none"><path d="M0 -15 L9 -1 H5 L12 9 H-12 L-5 -1 H-9z"/><rect x="-2" y="9" width="4" height="5"/></g>
<text x="78" y="263" font-size="16" font-weight="bold" fill="#2f3a2b">Okanagan Mountain Park</text>
<text x="78" y="282" font-size="15" fill="#2f3a2b">Foot, horse or bike only</text>
<circle cx="41.0" cy="324.5" r="20" fill="#fffaf0" stroke="#2f6e3b" stroke-width="2"/>
<g transform="translate(41.0 324.5) scale(0.8)" fill="#2f6e3b" stroke="none"><path d="M0 -15 L9 -1 H5 L12 9 H-12 L-5 -1 H-9z"/><rect x="-2" y="9" width="4" height="5"/></g>
<text x="78" y="320" font-size="16" font-weight="bold" fill="#2f3a2b">Myra Bellevue Park</text>
<text x="78" y="339" font-size="15" fill="#2f3a2b">Allowed. Be cautious on the Crawford trails</text>
<rect x="8" y="362" width="384" height="30" rx="6" fill="#8b5a2b"/>
<text x="18" y="383" font-size="15" font-weight="bold" fill="#fffaf0" letter-spacing="1">CHECK FIRST</text>
<rect x="8" y="398" width="384" height="55" rx="6" fill="#f4eedf"/>
<circle cx="41.0" cy="425.5" r="20" fill="#fffaf0" stroke="#8b5a2b" stroke-width="2"/>
<g transform="translate(41.0 425.5) scale(0.8)" fill="#8b5a2b" stroke="none"><path d="M-15 -11 L-5 -14 L5 -11 L15 -14 V11 L5 14 L-5 11 L-15 14z"/><path d="M-5 -14 V11 M5 -11 V14" stroke="#fffaf0" stroke-width="1.6"/><path d="M-11 4 L-8 -2 L-1 2 L3 -5 L10 -1" stroke="#fffaf0" stroke-width="2" fill="none"/></g>
<text x="78" y="421" font-size="16" font-weight="bold" fill="#2f3a2b">Kalamalka Lake Park</text>
