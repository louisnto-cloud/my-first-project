<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 570" font-family="sans-serif" role="img" aria-label="Cards for Crown land and parks. South Okanagan Grasslands Protected Area, Kilpoola, Mount Kobau and Chopaka: hunting permitted, vehicles only on Kruger Mountain Road and the Mount Kobau road. White Lake Grasslands: permitted, no motor vehicles, much access through private land. Okanagan Mountain Park: permitted, foot, horse or bike only. Myra Bellevue Park: permitted, be cautious on the Crawford trails. Kalamalka Lake Park: only inside the mapped hunting areas. South Okanagan Wildlife Management Area: status VERIFY with 250 490 8200. Vaseux Lake Park: no hunting listed, treat as closed. Grazing lease land: the lease holder must agree while cattle are on it.">
<rect x="0" y="0" width="400" height="570" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Crown land and parks for quail</text>
<text x="200" y="46" font-size="14" fill="#6b4f35" text-anchor="middle">Park pages say hunting allowed in season (99%)</text>
<rect x="16" y="58" width="179" height="154" rx="10" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2.5"/>
<text x="26" y="82" font-size="15" font-weight="bold" fill="#23261f">South Okanagan</text>
<text x="26" y="102" font-size="15" font-weight="bold" fill="#23261f">Grasslands</text>
<circle cx="179.0" cy="76" r="11" fill="#8a9a6b"/><path d="M174.05 76 l3.3 3.8499999999999996 l6.6 -7.699999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="26" y="120" font-size="14" fill="#2f3a2b">Kilpoola, Mt. Kobau,</text>
<text x="26" y="138" font-size="14" fill="#2f3a2b">Chopaka. Vehicles on</text>
<text x="26" y="156" font-size="14" fill="#2f3a2b">2 roads only.</text>
<g transform="translate(46.0 192) scale(0.62)"><ellipse cx="0" cy="5" rx="15" ry="10" fill="#7b7f86"/><circle cx="11" cy="-7" r="7" fill="#2f3a2b"/><path d="M10 -14 q4 -10 10 -7" stroke="#2f3a2b" stroke-width="3" fill="none"/><circle cx="10" cy="-21" r="3" fill="#2f3a2b"/><path d="M-3 14 v7 M4 14 v7" stroke="#2f3a2b" stroke-width="2.5"/></g>
<rect x="205" y="58" width="179" height="154" rx="10" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2.5"/>
