<text x="26" y="408" font-size="14" fill="#2f3a2b">Only inside the</text>
<text x="26" y="426" font-size="14" fill="#2f3a2b">mapped hunting areas.</text>
<rect x="205" y="346" width="179" height="96" rx="10" fill="#f3ead6" stroke="#6b4f35" stroke-width="2.5"/>
<text x="215" y="370" font-size="15" font-weight="bold" fill="#23261f">South Okanagan</text>
<text x="215" y="390" font-size="15" font-weight="bold" fill="#23261f">WMA</text>
<circle cx="368.0" cy="364" r="11" fill="#4a7fb0"/><text x="368" y="368.62" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
<text x="215" y="408" font-size="14" fill="#2f3a2b">Status: VERIFY, 250</text>
<text x="215" y="426" font-size="14" fill="#2f3a2b">490 8200.</text>
<rect x="16" y="452" width="179" height="94" rx="10" fill="#f6ddd0" stroke="#e8590c" stroke-width="2.5"/>
<text x="26" y="476" font-size="15" font-weight="bold" fill="#23261f">Vaseux Lake Park</text>
<circle cx="179.0" cy="470" r="11" fill="#e8590c"/><path d="M174.6 465.6 L183.4 474.4 M183.4 465.6 L174.6 474.4" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
<text x="26" y="494" font-size="14" fill="#2f3a2b">No hunting listed.</text>
<text x="26" y="512" font-size="14" fill="#2f3a2b">Treat as closed</text>
