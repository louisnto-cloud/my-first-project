<text x="215" y="102" font-size="15" font-weight="bold" fill="#23261f">Grasslands</text>
<circle cx="368.0" cy="76" r="11" fill="#8a9a6b"/><path d="M363.05 76 l3.3 3.8499999999999996 l6.6 -7.699999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="215" y="120" font-size="14" fill="#2f3a2b">No vehicles. Much</text>
<text x="215" y="138" font-size="14" fill="#2f3a2b">access through</text>
<text x="215" y="156" font-size="14" fill="#2f3a2b">private land.</text>
<rect x="16" y="222" width="179" height="114" rx="10" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2.5"/>
<text x="26" y="246" font-size="15" font-weight="bold" fill="#23261f">Okanagan Mountain</text>
<text x="26" y="266" font-size="15" font-weight="bold" fill="#23261f">Park</text>
<circle cx="179.0" cy="240" r="11" fill="#8a9a6b"/><path d="M174.05 240 l3.3 3.8499999999999996 l6.6 -7.699999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="26" y="284" font-size="14" fill="#2f3a2b">Foot, horse or bike</text>
<text x="26" y="302" font-size="14" fill="#2f3a2b">only.</text>
<rect x="205" y="222" width="179" height="114" rx="10" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2.5"/>
<text x="215" y="246" font-size="15" font-weight="bold" fill="#23261f">Myra Bellevue</text>
<text x="215" y="266" font-size="15" font-weight="bold" fill="#23261f">Park</text>
<circle cx="368.0" cy="240" r="11" fill="#8a9a6b"/><path d="M363.05 240 l3.3 3.8499999999999996 l6.6 -7.699999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="215" y="284" font-size="14" fill="#2f3a2b">Allowed. Be cautious</text>
<text x="215" y="302" font-size="14" fill="#2f3a2b">on the Crawford</text>
<text x="215" y="320" font-size="14" fill="#2f3a2b">trails.</text>
