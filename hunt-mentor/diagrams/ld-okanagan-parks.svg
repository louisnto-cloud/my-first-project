<text x="215" y="494" font-size="14" fill="#2f3a2b">Lease holder OK while</text>
<text x="215" y="512" font-size="14" fill="#2f3a2b">cattle are on it</text>
<text x="215" y="530" font-size="14" fill="#2f3a2b">(99%).</text>
</svg>
