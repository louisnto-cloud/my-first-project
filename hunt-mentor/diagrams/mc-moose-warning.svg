<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" font-family="sans-serif" role="img" aria-label="A moose head showing three warning signs before a charge: 1, ears laid back; 2, long hair on the hump raised; 3, licking its lips. If you see this you are far too close: back away and get a tree between you.">
<rect x="0" y="0" width="400" height="296" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Angry moose: 3 signs</text><g transform="translate(120 170) scale(1.8)"><path d="M-30 -10 Q-20 -40 10 -36 L40 -30 L62 -18 Q68 -10 60 -6 L30 -4 Q0 10 -30 6 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="1"/><path d="M-6 -36 L-26 -46 L-22 -34 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="1"/><path d="M-40 -12 L-44 -22 L-36 -16 L-38 -28 L-30 -18 L-30 -30 L-24 -20 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="1"/><path d="M56 -8 Q60 -2 54 0" stroke="#d9837a" stroke-width="3" fill="none"/><circle cx="26" cy="-26" r="2" fill="#eee"/></g><circle cx="73" cy="90" r="11" fill="#e8590c"/><text x="73" y="95" font-size="14" fill="#fffaf0" text-anchor="True">1</text><circle cx="272" cy="64" r="11" fill="#e8590c"/><text x="272" y="69" font-size="14" fill="#fffaf0" text-anchor="True">1</text><text x="290" y="69" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Ears laid back</text><circle cx="50" cy="132" r="11" fill="#e8590c"/><text x="50" y="137" font-size="14" fill="#fffaf0" text-anchor="True">2</text><circle cx="272" cy="104" r="11" fill="#e8590c"/><text x="272" y="109" font-size="14" fill="#fffaf0" text-anchor="True">2</text><text x="290" y="109" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Hump hair up</text><circle cx="238" cy="170" r="11" fill="#e8590c"/><text x="238" y="175" font-size="14" fill="#fffaf0" text-anchor="True">3</text><circle cx="272" cy="144" r="11" fill="#e8590c"/><text x="272" y="149" font-size="14" fill="#fffaf0" text-anchor="True">3</text><text x="290" y="149" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Licks its lips</text><rect x="30" y="248" width="340" height="40" rx="8" fill="#f3e3d3" stroke="#e8590c" stroke-width="2"/><text x="200" y="266" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">See this? You are far too close.</text><text x="200" y="283" font-size="14" fill="#23261f" text-anchor="middle">Back away. Get a tree between you.</text>
</svg>
