<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 324" font-family="sans-serif" role="img" aria-label="A mule deer day in late October on a 24 hour clock. Activity peaks at dawn, about 04:00 to 09:00, and at dusk, about 17:00 to 21:00, 85 percent. Before sunrise and after sunset it is dark; deer feed on and off at night. Midday the deer is bedded, chewing cud. Dawn: feed, then drift to beds. Dusk: rise, move, feed into the night.">
