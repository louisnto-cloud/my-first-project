<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Spike fork test, one antler at a time. A single spike, 1 tine: legal spike fork. A fork, 2 tines: legal. 3 tines on one antler: not a spike fork. A palm with many tines: not a spike fork. The rule: no more than 2 tines on one antler, brow palm tines included, synopsis page 3.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Spike fork? Count one antler</text><rect x="6" y="44" width="92" height="206" rx="8" fill="#fffaf0" stroke="#2b8a3e" stroke-width="2.5"/><ellipse cx="52" cy="214" rx="26" ry="10" fill="#3b2a1c"/><path d="M52 200 L52 150" stroke="#c9b79c" stroke-width="8" stroke-linecap="round"/><text x="52" y="240" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">1 tine</text><path d="M44 76 l6 7 l11 -14" fill="none" stroke="#2b8a3e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="104" y="44" width="92" height="206" rx="8" fill="#fffaf0" stroke="#2b8a3e" stroke-width="2.5"/><ellipse cx="150" cy="214" rx="26" ry="10" fill="#3b2a1c"/><path d="M150 200 L150 150" stroke="#c9b79c" stroke-width="8" stroke-linecap="round"/><path d="M150 160 L132 120 M150 160 L166 118" stroke="#c9b79c" stroke-width="8" stroke-linecap="round"/><text x="150" y="240" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">2 tines</text><path d="M142 76 l6 7 l11 -14" fill="none" stroke="#2b8a3e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="202" y="44" width="92" height="206" rx="8" fill="#fffaf0" stroke="#c92a2a" stroke-width="2.5"/><ellipse cx="248" cy="214" rx="26" ry="10" fill="#3b2a1c"/><path d="M248 200 L248 150" stroke="#c9b79c" stroke-width="8" stroke-linecap="round"/><path d="M248 166 L226 128 M248 160 L250 112 M248 166 L270 124" stroke="#c9b79c" stroke-width="8" stroke-linecap="round"/><text x="248" y="240" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">3 tines</text><path d="M240 64 L256 80 M256 64 L240 80" stroke="#c92a2a" stroke-width="4" stroke-linecap="round"/><rect x="300" y="44" width="92" height="206" rx="8" fill="#fffaf0" stroke="#c92a2a" stroke-width="2.5"/><ellipse cx="346" cy="214" rx="26" ry="10" fill="#3b2a1c"/><path d="M346 200 L346 168 Q316 150 312 112 L320 120 L326 104 L334 118 L342 100 L350 116 L358 102 L364 120 L374 110 Q376 150 346 168" fill="#c9b79c" stroke="#23261f" stroke-width="1.5"/><text x="346" y="240" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">palm, many</text><path d="M338 64 L354 80 M354 64 L338 80" stroke="#c92a2a" stroke-width="4" stroke-linecap="round"/><rect x="8" y="258" width="384" height="36" rx="6" fill="#2f3a2b"/><text x="200" y="282" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">No more than 2 tines on one antler (98%)</text>
</svg>
