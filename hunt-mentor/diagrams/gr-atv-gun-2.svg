<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="ATV gun step 2: stop, turn the engine off, get off and step away from the quad.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect y="230" width="400" height="70" fill="#dfe6d3"/>
  <text x="200" y="28" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Stop. Get off. Step away.</text>
  <g transform="translate(110 196) scale(1.6)"><rect x="-40" y="-18" width="80" height="20" rx="6" fill="#4a5a3a" stroke="#2f3a2b" stroke-width="2"/><rect x="-46" y="-26" width="26" height="8" fill="#2f3a2b"/><rect x="20" y="-26" width="26" height="8" fill="#2f3a2b"/><circle cx="-28" cy="10" r="14" fill="#2f3a2b"/><circle cx="28" cy="10" r="14" fill="#2f3a2b"/><path d="M-6 -18 l6 -14 h10" stroke="#2f3a2b" stroke-width="4" fill="none"/></g><circle cx="290" cy="150" r="14" fill="#2f3a2b"/><line x1="290" y1="164" x2="290" y2="206" stroke="#2f3a2b" stroke-width="10" stroke-linecap="round"/><line x1="290" y1="206" x2="278" y2="234" stroke="#2f3a2b" stroke-width="8"/><line x1="290" y1="206" x2="304" y2="234" stroke="#2f3a2b" stroke-width="8"/><path d="M180 150 h70 m-10 -8 l10 8 l-10 8" stroke="#e8590c" stroke-width="4" fill="none"/>
  <text x="200" y="284" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Engine off is not enough: move away from the quad</text>
</svg>
