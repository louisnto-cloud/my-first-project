<rect x="8" y="152" width="384" height="79" rx="6" fill="#f4eedf"/>
<text x="64" y="200.1" font-size="24" font-weight="bold" fill="#c2410c" text-anchor="middle">1</text>
<text x="130" y="176" font-size="16" fill="#2f3a2b">Moose, elk, thinhorn sheep,</text>
