<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 723" font-family="sans-serif" role="img" aria-label="Bag limits from the Region 6 season table. NBL means No Bag Limit; 10 (30) means 10 a day, 30 in possession. Mule deer in 6-12 and 6-13 prints 15 (15), but the footnote and page 49 set possession at 5. Moose 1, elk 1, thinhorn sheep 1, mountain goat 1, cougar 1, wolverine 1, lynx 1, black bear 2, wolf 3, coyote 10, snowshoe hare 10 a day, raccoon no bag limit. Grouse 10 (30) on the mainland and 5 (15) in 6-12 and 6-13, Haida Gwaii. Ptarmigan 5 (15) or 10 (30) by Management Unit. Ducks 8 (24). Canada and cackling geese, snipe and coots 10 (30). Snow, Ross&#x27;s and white fronted geese 5 (15).">
<rect width="400" height="723" fill="#fffaf0"/>
<text x="14" y="23" font-size="14" font-weight="bold" fill="#6b5b4b">NBL: No Bag Limit. 10 (30): 10 a day, 30 in</text>
<text x="14" y="42" font-size="14" font-weight="bold" fill="#6b5b4b">possession.</text>
