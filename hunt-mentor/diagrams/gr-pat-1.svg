<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Patterning step 1: hang paper about 1 metre square with an aim dot in the middle. Measure 37 metres, which is 40 yards, back to your rest.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="28" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Paper, dot, 37 m</text>
  <rect x="0" y="230" width="400" height="70" fill="#dfe6d3"/>
  <rect x="270" y="70" width="110" height="110" fill="#fff" stroke="#2f3a2b" stroke-width="2"/>
  <circle cx="325" cy="125" r="8" fill="#e8590c"/>
  <rect x="280" y="180" width="6" height="50" fill="#8b5a2b"/><rect x="364" y="180" width="6" height="50" fill="#8b5a2b"/>
  <text x="325" y="62" font-size="14" fill="#2f3a2b" text-anchor="middle">about 1 m square</text>
  <rect x="20" y="196" width="60" height="34" fill="#8b5a2b"/><text x="50" y="258" font-size="14" fill="#2f3a2b" text-anchor="middle">Rest</text>
  <line x1="80" y1="212" x2="270" y2="212" stroke="#e8590c" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="175" y="200" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">37 m (40 yd)</text>
  <text x="200" y="286" font-size="14" fill="#2f3a2b" text-anchor="middle">1 shell per sheet. 3 sheets per load and choke (Tip)</text>
</svg>
