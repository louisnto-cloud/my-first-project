<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Three contour rings of a knob. An orange line runs straight across from A to B.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c" stroke="none" stroke-width="2"/><text x="26" y="32" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="52" y="32" font-family="sans-serif" font-size="18" fill="#2f3a2b" text-anchor="start" font-weight="bold">Draw a line A to B</text><ellipse cx="200" cy="120" rx="150" ry="70" fill="none" stroke="#8b5a2b" stroke-width="2"/><ellipse cx="200" cy="120" rx="105" ry="48" fill="none" stroke="#8b5a2b" stroke-width="2"/><ellipse cx="200" cy="120" rx="60" ry="28" fill="none" stroke="#8b5a2b" stroke-width="2"/><text x="345" y="40" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start"></text><line x1="40" y1="120" x2="360" y2="120" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><text x="30" y="125" font-family="sans-serif" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">A</text><text x="372" y="125" font-family="sans-serif" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">B</text>
</svg>
