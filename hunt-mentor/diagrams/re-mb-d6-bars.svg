<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 403" font-family="sans-serif" role="img" aria-label="Season bars for migratory birds in District No. 6, Skeena, Table 1, item 6. Ducks, all geese, coots and snipe share the same 3 periods. (i) only in MUs 6-1, 6-2, 6-4 to 6-10 and 6-15 to 6-30: 1 to 30 September. (ii) every MU in the district: 1 October to 30 November. (iii) only in MUs 6-3 and 6-11 to 6-14: 1 December to 15 January. Brant: no open season. Mourning and collared doves: no open season. Band tailed pigeons: no open season.">
<rect width="400" height="403" fill="#fffaf0"/>
<text x="14" y="24" font-size="14" font-weight="bold" fill="#6b5b4b">Table 1, item 6. Ducks, all geese, coots,</text>
<text x="14" y="44" font-size="14" font-weight="bold" fill="#6b5b4b">snipe: the same 3 periods.</text>
<text x="50.5" y="66" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Sep</text>
<text x="124.6" y="66" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Oct</text>
<text x="198.8" y="66" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Nov</text>
<text x="272.9" y="66" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Dec</text>
<text x="348.3" y="66" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Jan</text>
<text x="14" y="92" font-size="16" font-weight="bold" fill="#2f3a2b">(i) Only MUs 6-1, 6-2, 6-4 to 6-10, 6-15 to</text>
<text x="14" y="113" font-size="16" font-weight="bold" fill="#2f3a2b">6-30</text>
<text x="14" y="133" font-size="15" font-weight="bold" fill="#2c5d86">Sept 1 to Sept 30</text>
<rect x="14.0" y="141" width="72.9" height="16" fill="#efe8d6"/>
<rect x="86.9" y="141" width="75.4" height="16" fill="#f8f3e6"/>
<rect x="162.3" y="141" width="72.9" height="16" fill="#efe8d6"/>
<rect x="235.3" y="141" width="75.4" height="16" fill="#f8f3e6"/>
<rect x="310.6" y="141" width="75.4" height="16" fill="#efe8d6"/>
<rect x="14.0" y="142" width="72.9" height="14" rx="3" fill="#4a7fb0"/>
<text x="14" y="187" font-size="16" font-weight="bold" fill="#2f3a2b">(ii) Every MU in the district</text>
<text x="386" y="187" font-size="15" font-weight="bold" fill="#2c5d86" text-anchor="end">Oct 1 to Nov 30</text>
<rect x="14.0" y="195" width="72.9" height="16" fill="#efe8d6"/>
<rect x="86.9" y="195" width="75.4" height="16" fill="#f8f3e6"/>
<rect x="162.3" y="195" width="72.9" height="16" fill="#efe8d6"/>
<rect x="235.3" y="195" width="75.4" height="16" fill="#f8f3e6"/>
<rect x="310.6" y="195" width="75.4" height="16" fill="#efe8d6"/>
<rect x="86.9" y="196" width="148.3" height="14" rx="3" fill="#4a7fb0"/>
<text x="14" y="241" font-size="16" font-weight="bold" fill="#2f3a2b">(iii) Only MUs 6-3, 6-11 to 6-14</text>
<text x="14" y="261" font-size="15" font-weight="bold" fill="#2c5d86">Dec 1 to Jan 15</text>
<rect x="14.0" y="269" width="72.9" height="16" fill="#efe8d6"/>
<rect x="86.9" y="269" width="75.4" height="16" fill="#f8f3e6"/>
<rect x="162.3" y="269" width="72.9" height="16" fill="#efe8d6"/>
<rect x="235.3" y="269" width="75.4" height="16" fill="#f8f3e6"/>
<rect x="310.6" y="269" width="75.4" height="16" fill="#efe8d6"/>
<rect x="235.3" y="270" width="111.8" height="14" rx="3" fill="#4a7fb0"/>
<text x="14" y="315" font-size="16" font-weight="bold" fill="#2f3a2b">Brant</text>
<text x="386" y="315" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="end">No open season</text>
<text x="14" y="347" font-size="16" font-weight="bold" fill="#2f3a2b">Mourning and collared doves</text>
<text x="386" y="347" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="end">No open season</text>
<text x="14" y="379" font-size="16" font-weight="bold" fill="#2f3a2b">Band tailed pigeons</text>
<text x="386" y="379" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="end">No open season</text>
</svg>
