<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 305" font-family="sans-serif" role="img" aria-label="Line chart of body fat through the year, a pattern not to scale. Fat builds through summer and peaks in autumn. Bucks drop steeply in the November and December rut. Both sexes lose fat over winter and are lowest in spring. Deer eat less in winter even with food, and bucks lose weight in the rut.">
<rect width="400" height="305" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">The fat year (pattern, not to scale)</text><text x="42" y="232" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">J</text><text x="71" y="232" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">F</text><text x="100" y="232" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">M</text><text x="129" y="232" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">A</text><text x="158" y="232" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">M</text><text x="187" y="232" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">J</text><text x="216" y="232" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">J</text><text x="245" y="232" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">A</text><text x="274" y="232" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">S</text><text x="303" y="232" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">O</text><text x="332" y="232" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">N</text><text x="361" y="232" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">D</text><line x1="28" y1="216" x2="380" y2="216" stroke="#23261f" stroke-width="1"/><line x1="28" y1="60" x2="28" y2="216" stroke="#23261f" stroke-width="1"/><text x="34" y="54" font-size="14" fill="#6b4f35" text-anchor="start">fat</text><path d="M42 150 L71 170 L100 185 L129 196 L158 192 L187 175 L216 150 L245 120 L274 95 L303 78 L332 82 L361 112" fill="none" stroke="#8a9a6b" stroke-width="4"/><path d="M42 175 L71 186 L100 196 L129 202 L158 188 L187 160 L216 128 L245 98 L274 80 L303 72 L332 120 L361 160" fill="none" stroke="#8b5a2b" stroke-width="4"/><rect x="316" y="62" width="54" height="112" fill="#e8590c" opacity=".15"/><text x="343" y="186" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">rut</text><text x="130" y="214" font-size="14" fill="#6b4f35" text-anchor="middle">low in spring</text><rect x="40" y="246" width="16" height="12" fill="#8a9a6b"/><text x="62" y="257" font-size="14" fill="#23261f" text-anchor="start">does</text><rect x="120" y="246" width="16" height="12" fill="#8b5a2b"/><text x="142" y="257" font-size="14" fill="#23261f" text-anchor="start">bucks</text><text x="200" y="280" font-size="14" fill="#23261f" text-anchor="middle">Eat less in winter, even with food (85%)</text><text x="200" y="297" font-size="14" fill="#23261f" text-anchor="middle">Bucks lose weight in the rut (90%)</text>
</svg>
