<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Table of weather and ducks with the evidence level. Freeze up and snow cover push ducks south: strong, 80 percent. Hunting pressure sends them to refuges by day: strong, 80 percent. Wind: they land into it, strong, 80 percent. Moonlit windy nights: they leave to feed earlier, medium, 75 percent. A cold front with a north wind brings new birds the next day: hunter lore, 65 percent. Rain and low cloud: they fly lower and later, a tip. The barometer alone: no good study found, verify."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Weather and ducks: how sure are we?</text><rect x="4" y="36" width="392" height="33" rx="4" fill="#dfe6d3"/><text x="10" y="58" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Freeze up, snow</text><text x="160" y="58" font-size="14" fill="#2f3a2b" text-anchor="start">Pushes them south</text><rect x="306" y="40" width="86" height="25" rx="6" fill="#8a9a6b"/><text x="349" y="58" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Strong 80%</text><rect x="4" y="73" width="392" height="33" rx="4" fill="#eef2e6"/><text x="10" y="95" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Hunting pressure</text><text x="160" y="95" font-size="14" fill="#2f3a2b" text-anchor="start">Refuge by day</text><rect x="306" y="77" width="86" height="25" rx="6" fill="#8a9a6b"/><text x="349" y="95" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Strong 80%</text><rect x="4" y="110" width="392" height="33" rx="4" fill="#dfe6d3"/><text x="10" y="132" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Wind</text><text x="160" y="132" font-size="14" fill="#2f3a2b" text-anchor="start">Land into it</text><rect x="306" y="114" width="86" height="25" rx="6" fill="#8a9a6b"/><text x="349" y="132" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Strong 80%</text><rect x="4" y="147" width="392" height="33" rx="4" fill="#eef2e6"/><text x="10" y="169" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Moonlit windy night</text><text x="160" y="169" font-size="14" fill="#2f3a2b" text-anchor="start">Leave to feed early</text><rect x="306" y="151" width="86" height="25" rx="6" fill="#d9a23a"/><text x="349" y="169" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Medium 75%</text><rect x="4" y="184" width="392" height="33" rx="4" fill="#dfe6d3"/><text x="10" y="206" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Cold front, N wind</text><text x="160" y="206" font-size="14" fill="#2f3a2b" text-anchor="start">New birds next day</text><rect x="306" y="188" width="86" height="25" rx="6" fill="#d9a23a"/><text x="349" y="206" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Lore 65%</text><rect x="4" y="221" width="392" height="33" rx="4" fill="#eef2e6"/><text x="10" y="243" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Rain, low cloud</text><text x="160" y="243" font-size="14" fill="#2f3a2b" text-anchor="start">Fly lower, later</text><rect x="306" y="225" width="86" height="25" rx="6" fill="#b9c2cf"/><text x="349" y="243" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Tip</text><rect x="4" y="258" width="392" height="33" rx="4" fill="#dfe6d3"/><text x="10" y="280" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Barometer alone</text><text x="160" y="280" font-size="14" fill="#2f3a2b" text-anchor="start">No good study</text><rect x="306" y="262" width="86" height="25" rx="6" fill="#b9c2cf"/><text x="349" y="280" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">VERIFY</text></svg>
