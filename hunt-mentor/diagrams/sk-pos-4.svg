<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Standing with three leg shooting sticks: stick top at armpit height or a little lower, two legs toward you and one toward the target, feet square to the rifle, back of the hand resting on the sticks.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">4  Sticks: makes standing work</text><line x1="20" y1="264" x2="380" y2="264" stroke="#8a9a6b" stroke-width="3"/><circle cx="176" cy="92" r="10" fill="#fffaf0" stroke="#23261f" stroke-width="3.5"/><path d="M176 104 L172 184" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M172 184 L160 262" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M172 184 L186 262" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M178 110 L214 136 L246 118" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M176 112 L190 140 L196 116" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M246 120 L214 262" fill="none" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M246 120 L236 264" fill="none" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M246 120 L300 262" fill="none" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="180" y1="112" x2="340" y2="104" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/><circle cx="356" cy="102" r="12" fill="#fff" stroke="#23261f" stroke-width="2"/><circle cx="356" cy="102" r="4" fill="#e8590c"/><text x="258" y="150" font-size="14" font-weight="bold" fill="#23261f">Top at armpit</text><text x="258" y="166" font-size="14" font-weight="bold" fill="#23261f">height or lower</text><text x="20" y="150" font-size="15" font-weight="bold" fill="#23261f">Feet square</text><text x="20" y="170" font-size="15" font-weight="bold" fill="#23261f">to the rifle</text><text x="206" y="290" font-size="14" text-anchor="middle" fill="#2f3a2b">Two legs toward you, one toward the deer</text>
</svg>
