<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 262" font-family="sans-serif" role="img" aria-label="Bar chart from BC antler studies. About 43 to 46 percent of yearling bulls have spike or fork antlers. About 10 percent of 2 year olds. About 16 percent of all bulls. More than half of yearlings are not spike fork, so count every bull.">
<rect x="0" y="0" width="400" height="262" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">How many bulls are spike fork?</text><text x="122" y="74" font-size="14" fill="#23261f" text-anchor="end">Yearling bulls</text><rect x="130" y="50" width="103.5" height="30" rx="3" fill="#e8590c"/><text x="239.5" y="74" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">43 to 46%</text><text x="122" y="118" font-size="14" fill="#23261f" text-anchor="end">2 year olds</text><rect x="130" y="94" width="23.0" height="30" rx="3" fill="#8a9a6b"/><text x="159.0" y="118" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">about 10%</text><text x="122" y="162" font-size="14" fill="#23261f" text-anchor="end">All bulls</text><rect x="130" y="138" width="36.8" height="30" rx="3" fill="#2f3a2b"/><text x="172.8" y="162" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">about 16%</text><text x="200" y="196" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Share of bulls that are spike fork</text><text x="200" y="213" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">More than half of yearlings are NOT.</text><text x="200" y="230" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Count every bull. Count twice.</text>
</svg>
