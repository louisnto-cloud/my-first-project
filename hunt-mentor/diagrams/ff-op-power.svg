<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Suggested scope power: 3 to 4 power in timber under 100 m, 6 to 8 power on open slopes at 100 to 200 m, 9 to 10 power past 200 m. Walk with it on low power. These are tips.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Scope power for the shot</text><text x="214" y="82.4" font-size="14" fill="#23261f" text-anchor="end">Timber, under 100 m</text><rect x="220" y="60" width="33.0" height="32" rx="3" fill="#2f6e3b" stroke="none" stroke-width="2"/><text x="259.0" y="82.4" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">3 to 4x</text><text x="214" y="132.4" font-size="14" fill="#23261f" text-anchor="end">Open slope, 100 to 200 m</text><rect x="220" y="110" width="66.0" height="32" rx="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="292.0" y="132.4" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">6 to 8x</text><text x="214" y="182.4" font-size="14" fill="#23261f" text-anchor="end">Long, 200 m plus</text><rect x="220" y="160" width="99.0" height="32" rx="3" fill="#e8590c" stroke="none" stroke-width="2"/><text x="325.0" y="182.4" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">9 to 10x</text><text x="200" y="230" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Walk with it on low power</text><text x="200.0" y="270" font-size="13" fill="#2f3a2b" text-anchor="middle">Tip: a deer close in timber fills a 9x scope</text>
</svg>
