<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Top view of two hunters walking side by side in a line, in sight of each other, wearing orange. Each has a zone of fire of about 45 degrees straight ahead. The ground between them and behind them is a no shot zone.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Walk side by side, always in sight</text>
<rect x="0" y="40" width="400" height="260" rx="0" fill="#dfe6d3"/>
<path d="M130 230 L72.6 91.4 A150 150 0 0 1 187.4 91.4 Z" fill="#e8590c" opacity="0.25"/>
<circle cx="130" cy="230" r="14" fill="#e8590c" stroke="#ffffff" stroke-width="3"/>
<line x1="130" y1="230" x2="130" y2="200" stroke="#23261f" stroke-width="4" stroke-linecap="round"/>
<path d="M270 230 L212.6 91.4 A150 150 0 0 1 327.4 91.4 Z" fill="#e8590c" opacity="0.25"/>
<circle cx="270" cy="230" r="14" fill="#e8590c" stroke="#ffffff" stroke-width="3"/>
<line x1="270" y1="230" x2="270" y2="200" stroke="#23261f" stroke-width="4" stroke-linecap="round"/>
<line x1="144" y1="230" x2="256" y2="230" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><text x="200" y="252" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">in line, in sight</text>
<text x="130" y="278" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Your zone</text><text x="270" y="278" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">His zone</text>
<text x="200" y="110" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle">No shot</text><text x="200" y="128" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle">between</text>
</svg>
