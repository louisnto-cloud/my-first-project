<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="sans-serif" role="img" aria-label="Shot to table in 6 steps. 1 shoot, watch, mark. 2 wait, then track. 3 at the kill, cancel your licence first. 4 gut and wipe dry. 5 hang, cool, roof. 6 home with meat under 4 degrees Celsius. Rain coming: track sooner.">
<rect width="400" height="330" fill="#EEF1EA"/>
<text x="200" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Shot to table, coast style</text>
<rect x="14" y="48" width="180" height="64" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="2"/><circle cx="38" cy="80" r="13" fill="#1F3D2B" stroke="none"/><text x="38" y="85" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text><text x="58" y="85" font-size="14" text-anchor="start" font-weight="bold" fill="#1F3D2B">Shoot, watch, mark</text><rect x="206" y="48" width="180" height="64" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="2"/><circle cx="230" cy="80" r="13" fill="#1F3D2B" stroke="none"/><text x="230" y="85" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text><text x="250" y="85" font-size="14" text-anchor="start" font-weight="bold" fill="#1F3D2B">Wait, then track</text><rect x="14" y="132" width="180" height="64" rx="8" fill="#ffffff" stroke="#FF6A13" stroke-width="2"/><circle cx="38" cy="164" r="13" fill="#FF6A13" stroke="none"/><text x="38" y="169" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text><text x="58" y="169" font-size="14" text-anchor="start" font-weight="bold" fill="#1F3D2B">Kill: cancel licence</text><rect x="206" y="132" width="180" height="64" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="2"/><circle cx="230" cy="164" r="13" fill="#1F3D2B" stroke="none"/><text x="230" y="169" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text><text x="250" y="169" font-size="14" text-anchor="start" font-weight="bold" fill="#1F3D2B">Gut, wipe dry</text><rect x="14" y="216" width="180" height="64" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="2"/><circle cx="38" cy="248" r="13" fill="#1F3D2B" stroke="none"/><text x="38" y="253" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">5</text><text x="58" y="253" font-size="14" text-anchor="start" font-weight="bold" fill="#1F3D2B">Hang, cool, roof</text><rect x="206" y="216" width="180" height="64" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="2"/><circle cx="230" cy="248" r="13" fill="#1F3D2B" stroke="none"/><text x="230" y="253" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">6</text><text x="250" y="253" font-size="14" text-anchor="start" font-weight="bold" fill="#1F3D2B">Home under 4 °C</text><text x="200" y="316" font-size="15" text-anchor="middle" font-weight="bold" fill="#FF6A13">Rain coming? Track sooner (Tip)</text>
</svg>
