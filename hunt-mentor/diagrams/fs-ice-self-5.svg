<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Self rescue step 5: get to a warm, dry place right away and rewarm. Moderate or worse hypothermia needs medical care.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">5. Get warm now</text><rect x="0" y="230" width="400" height="70" rx="0" fill="#dfe6d3"/><rect x="80" y="150" width="120" height="80" rx="10" fill="#4a7fb0"/><rect x="90" y="160" width="40" height="30" rx="3" fill="#cfe0ef"/><line x1="252" y1="230" x2="256" y2="201" stroke="#2f3a2b" stroke-width="7" stroke-linecap="round"/><line x1="268" y1="230" x2="264" y2="201" stroke="#2f3a2b" stroke-width="7" stroke-linecap="round"/><rect x="249" y="173" width="22" height="31" rx="6" fill="#7c5a99"/><line x1="250" y1="178" x2="242" y2="198" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="270" y1="178" x2="278" y2="198" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><circle cx="260" cy="164" r="10.0" fill="#d9b48f"/><text x="300" y="120" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Dry, warm</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Truck heater, dry clothes, now</text>
</svg>
