<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 641" font-family="sans-serif" role="img" aria-label="Season bars for BC sheep, August to November. General open seasons in green: thinhorn full curl rams in Regions 6, 7A and 7B, 1 August to 15 October. Bighorn full curl in MUs 7-18 and 7-19, 15 August to 30 September. Region 3, MUs 3-31 and part of 3-32, full curl, 10 September to 20 October. Part of MU 3-17, mature rams, 10 September to 20 October. Region 5, MU 5-2, full curl, 10 September to 20 October. Limited Entry Hunting draws in blue, Region 3: at least three quarter curl, 20 September to 20 October; any ram, 1 to 20 November; ewe or lamb, 1 to 15 November. Bag limit 1. Read your Management Unit row.">
