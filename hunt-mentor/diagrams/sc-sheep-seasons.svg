<text x="289.2" y="66" font-size="14" fill="#2f3a2b" text-anchor="middle">Oct</text>
<rect x="321.5" y="72" width="64.5" height="288" fill="#fffaf0"/>
<text x="353.8" y="66" font-size="14" fill="#2f3a2b" text-anchor="middle">Nov</text>
