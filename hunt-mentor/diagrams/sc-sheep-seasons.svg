<text x="200.0" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Sheep seasons at a glance</text>
<text x="200.0" y="46" font-size="14" fill="#8b5a2b" text-anchor="middle">Green: general open season. Blue: draw only.</text>
<rect x="128.0" y="72" width="64.5" height="288" fill="#dfe6d3"/>
