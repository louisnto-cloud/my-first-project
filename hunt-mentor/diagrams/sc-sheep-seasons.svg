<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-label="Bar chart of BC sheep seasons, August to November. General open seasons in green: thinhorn rams in Regions 6, 7A and 7B, August 1 to October 15. Bighorn in MUs 7-18 and 7-19, August 15 to September 30. Region 3, MUs 3-31 and part of 3-32, full curl, September 10 to October 20. Part of MU 3-17, mature rams, September 10 to October 20. Region 5, MU 5-2, September 10 to October 20. Limited Entry Hunting draws in blue, Region 3: at least three quarter curl, September 20 to October 20; any ram, November 1 to 20; ewe or lamb, November 1 to 15." font-family="sans-serif">
