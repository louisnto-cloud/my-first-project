<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four steps for scent: 1 wash in unscented soap and store clothes clean; 2 put boots on at the trailhead; 3 check the wind at every terrain feature; 4 if the wind is wrong, go to seat B. These are hunter habits; no product beats a bad wind.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Clean first, then play the wind</text><rect x="30" y="46" width="340" height="44" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="56" cy="68" r="13" fill="#e8590c"/><text x="56" y="73" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">1</text><text x="80" y="74" font-size="15" fill="#23261f" text-anchor="start">Unscented wash, stored clean</text><rect x="30" y="100" width="340" height="44" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="56" cy="122" r="13" fill="#e8590c"/><text x="56" y="127" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">2</text><text x="80" y="128" font-size="15" fill="#23261f" text-anchor="start">Boots on at the trailhead</text><rect x="30" y="154" width="340" height="44" rx="8" fill="#f6d7c3" stroke="#8a9a6b" stroke-width="2"/><circle cx="56" cy="176" r="13" fill="#e8590c"/><text x="56" y="181" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">3</text><text x="80" y="182" font-size="15" fill="#23261f" text-anchor="start">Check the wind at every feature</text><rect x="30" y="208" width="340" height="44" rx="8" fill="#f6d7c3" stroke="#8a9a6b" stroke-width="2"/><circle cx="56" cy="230" r="13" fill="#e8590c"/><text x="56" y="235" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">4</text><text x="80" y="236" font-size="15" fill="#23261f" text-anchor="start">Wrong wind? Go to seat B</text><text x="200" y="284" font-size="14" fill="#6b4f35" text-anchor="middle">Habits: Tip. Wind beats any product (Tip)</text>
</svg>
