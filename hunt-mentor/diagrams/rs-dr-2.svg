<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 2: size. Measure the diameter at the widest point, then the length. Diameter matters more. Wolf scat is usually over 2.5 cm across, coyote under.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">2. Measure the diameter</text>
<g transform="translate(60 140) rotate(0)"><path d="M0 -14.0 H132 Q160 0 132 14.0 H28 Q-14.0 14.0 -14.0 0 Q-14.0 -14.0 28 -14.0 Z" fill="#6b4f35"/></g><line x1="60" y1="186" x2="220" y2="186" stroke="#e8590c" stroke-width="3"/><text x="140" y="208" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">length</text><line x1="250" y1="126" x2="250" y2="154" stroke="#e8590c" stroke-width="3"/><line x1="242" y1="126" x2="258" y2="126" stroke="#e8590c" stroke-width="2"/><line x1="242" y1="154" x2="258" y2="154" stroke="#e8590c" stroke-width="2"/><text x="300" y="145" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">diameter</text><text x="200" y="250" font-size="15" fill="#23261f" text-anchor="middle">Diameter matters more than length (Tip)</text><text x="200" y="274" font-size="15" fill="#6b4f35" text-anchor="middle">Wolf over 2.5 cm, coyote under (65%)</text>
</svg>
