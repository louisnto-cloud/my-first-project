<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 3: ask one short question, then stop talking and let them answer. A no is information: thank them and ask if they know anyone who allows it.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" fill="#dfe6d3" opacity=".35"/><circle cx="30" cy="32" r="18" fill="#fffaf0" stroke="#e8590c" stroke-width="2.5"/><text x="30" y="37" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">3</text><text x="58" y="39" font-size="19" font-weight="bold" fill="#23261f" text-anchor="start">Ask, then stop talking</text><rect x="0" y="214" width="400" height="86" fill="#fffaf0"/><rect x="0" y="208" width="400" height="6" fill="#8a9a6b"/><g transform="translate(170 176) scale(1.7)"><circle cx="0" cy="-12" r="7" fill="#2f3a2b"/><path d="M-10 18 V2 Q0 -6 10 2 V18 Z" fill="#2f3a2b"/></g><g transform="translate(268 176) scale(1.6)"><circle cx="0" cy="-12" r="7" fill="#8b5a2b"/><path d="M-10 18 V2 Q0 -6 10 2 V18 Z" fill="#8b5a2b"/></g><path d="M110 70 h168 v40 h-128 l-14 16 v-16 h-26 z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linejoin="round"/><text x="194.0" y="96" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Deer, this fall?</text><g transform="translate(300 80) scale(1.4)"><circle r="18" fill="#dbe7f2" stroke="#4a7fb0" stroke-width="2.5"/><text x="0" y="8" font-size="24" font-weight="bold" fill="#4a7fb0" text-anchor="middle">?</text></g><text x="200" y="240" font-size="16" fill="#23261f" text-anchor="middle">One short question. Let them answer. A no</text><text x="200" y="260" font-size="16" fill="#23261f" text-anchor="middle">is information.</text>
</svg>
