<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Mild hypothermia step 4: if alert and shivering, give warm sweet drinks and food. Sit or lie still for at least 30 minutes before walking.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4. Food, then wait</text><rect x="0" y="230" width="400" height="70" rx="0" fill="#dfe6d3"/><line x1="150" y1="214" x2="176" y2="214" stroke="#2f3a2b" stroke-width="7.700000000000001" stroke-linecap="round"/><line x1="176" y1="214" x2="179" y2="234" stroke="#2f3a2b" stroke-width="7.700000000000001" stroke-linecap="round"/><rect x="139" y="177" width="22" height="37" rx="6.6000000000000005" fill="#7c5a99"/><circle cx="150" cy="166" r="11.0" fill="#d9b48f"/><rect x="186" y="160" width="20" height="30" rx="4" fill="#4a7fb0"/><text x="300" y="110" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Sweet, warm</text><text x="300" y="132" font-size="15" fill="#2f3a2b" text-anchor="middle">only if alert</text><text x="300" y="170" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">30 min still</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fuel the fire. Rest 30 minutes</text>
</svg>
