<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 376" font-family="sans-serif" role="img" aria-label="One target sheet with five bulls: 1 group 1 and 2 group 2 for the zero, 3 a confirm group after the last adjustment, 4 a group with load B, and 5, in orange, the cold bore shot, the first shot from a cold, clean barrel next time. Write the load, distance, position and clicks beside each group and photograph it.">
<rect x="0" y="0" width="400" height="376" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">One sheet, five bulls</text><rect x="40" y="42" width="320" height="260" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="110" cy="106" r="30" fill="none" stroke="#1F3D2B" stroke-width="2"/><circle cx="110" cy="106" r="10" fill="#1F3D2B"/><circle cx="72" cy="76" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="72" y="81" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="110" y="152" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Group 1</text><circle cx="290" cy="106" r="30" fill="none" stroke="#1F3D2B" stroke-width="2"/><circle cx="290" cy="106" r="10" fill="#1F3D2B"/><circle cx="252" cy="76" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="252" y="81" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="290" y="152" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Group 2</text><circle cx="200" cy="172" r="30" fill="none" stroke="#1F3D2B" stroke-width="2"/><circle cx="200" cy="172" r="10" fill="#1F3D2B"/><circle cx="162" cy="142" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="162" y="147" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="200" y="218" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Confirm</text><circle cx="110" cy="238" r="30" fill="none" stroke="#1F3D2B" stroke-width="2"/><circle cx="110" cy="238" r="10" fill="#1F3D2B"/><circle cx="72" cy="208" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="72" y="213" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="110" y="284" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Load B</text><circle cx="290" cy="238" r="30" fill="none" stroke="#1F3D2B" stroke-width="2"/><circle cx="290" cy="238" r="10" fill="#FF6A13"/><circle cx="252" cy="208" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="252" y="213" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="290" y="284" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Cold bore</text><rect x="12" y="312" width="376" height="52" rx="8" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="24" y="334" font-size="14" fill="#17201A" text-anchor="start">Write load, distance, position and clicks</text><text x="24" y="352" font-size="14" fill="#17201A" text-anchor="start">beside each group. Photo it for the log.</text>
</svg>
