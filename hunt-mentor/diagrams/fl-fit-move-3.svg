<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Goblet squat: hold a weight or full water jug at your chest, sit hips back and down, chest up, then stand.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="30" cy="32" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="30" y="39" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">3</text>
<text x="56" y="39" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="start">Goblet squat</text>
<rect x="10" y="228" width="380" height="8" rx="2" fill="#c9b79c"/><circle cx="210" cy="92" r="11" fill="#2f3a2b"/><line x1="210" y1="103" x2="196" y2="160" stroke="#2f3a2b" stroke-width="7" stroke-linecap="round"/><line x1="196" y1="160" x2="240" y2="180" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="240" y1="180" x2="230" y2="228" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><rect x="214" y="118" width="24" height="26" rx="6" fill="#4a7fb0"/><line x1="205" y1="118" x2="222" y2="132" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><line x1="120" y1="120" x2="120" y2="190" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><polygon points="120.0,190.0 115.7,181.0 124.3,181.0" fill="#e8590c"/><text x="110" y="110" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Hips back</text><text x="300" y="120" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Chest up</text>
<rect x="10" y="262" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="285.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Jug at your chest. Sit back, chest up.</text>
