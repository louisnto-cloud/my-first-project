<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A 10 minute clock split three ways: 0 to 3 minutes sit down, drink and eat; 3 to 6 minutes think about your last sure point; 6 to 10 minutes observe with map and land. Then plan. STOP from AdventureSmart, 75 percent; the minute split is a Tip.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">The first 10 minutes</text><path d="M110 165 L110.0 75.0 A90 90 0 0 1 195.6 192.8 Z" fill="#e8590c"/><path d="M110 165 L195.6 192.8 A90 90 0 0 1 57.1 237.8 Z" fill="#8a9a6b"/><path d="M110 165 L57.1 237.8 A90 90 0 0 1 110.0 75.0 Z" fill="#4a7fb0"/><circle cx="110" cy="165" r="30" fill="#fffaf0"/><text x="110" y="171" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">10 min</text><rect x="222" y="80" width="16" height="16" rx="3" fill="#e8590c"/><text x="246" y="94" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">0 to 3 min</text><text x="246" y="112" font-size="14" fill="#23261f" text-anchor="start">Sit. Water. Food</text><rect x="222" y="130" width="16" height="16" rx="3" fill="#8a9a6b"/><text x="246" y="144" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">3 to 6 min</text><text x="246" y="162" font-size="14" fill="#23261f" text-anchor="start">Think: last sure?</text><rect x="222" y="180" width="16" height="16" rx="3" fill="#4a7fb0"/><text x="246" y="194" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">6 to 10 min</text><text x="246" y="212" font-size="14" fill="#23261f" text-anchor="start">Observe: map, land</text><text x="246" y="250" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Then Plan.</text><text x="200" y="293" font-size="14" fill="#6b4f35" text-anchor="middle">STOP: AdventureSmart (75%). Minutes: Tip</text>
</svg>
