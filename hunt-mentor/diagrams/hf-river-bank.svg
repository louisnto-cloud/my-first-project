<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="River boundary rule, map with north up. The North Thompson flows south, down the page. Face downstream: your right hand points to the west bank. The MU, Management Unit, boundary follows that right bank, shown as red dashes. Heffley Creek, on the east bank, is in MU 3-27. The far west side is MU 3-28.">
