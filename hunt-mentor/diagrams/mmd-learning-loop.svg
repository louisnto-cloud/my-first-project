<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A loop: a fawn follows its mother, learns routes, beds and food, uses the same routes every year, and teaches its own fawns. In the middle: when there is danger at a spot it shifts to thicker cover.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">How a deer learns (85%)</text><rect x="20" y="44" width="170" height="54" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="105" y="66" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Fawn follows</text><text x="105" y="84" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">its mother</text><rect x="210" y="44" width="170" height="54" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="295" y="66" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Learns routes,</text><text x="295" y="84" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">beds, food</text><rect x="210" y="164" width="170" height="54" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="295" y="186" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Same routes</text><text x="295" y="204" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">every year</text><rect x="20" y="164" width="170" height="54" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="105" y="186" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Teaches its</text><text x="105" y="204" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">own fawns</text><line x1="192" y1="70" x2="208" y2="70" stroke="#e8590c" stroke-width="3"/><polygon points="208.0,70.0 199.0,74.3 199.0,65.7" fill="#e8590c"/><line x1="295" y1="98" x2="295" y2="162" stroke="#e8590c" stroke-width="3"/><polygon points="295.0,162.0 290.7,153.0 299.3,153.0" fill="#e8590c"/><line x1="208" y1="190" x2="192" y2="190" stroke="#e8590c" stroke-width="3"/><polygon points="192.0,190.0 201.0,185.7 201.0,194.3" fill="#e8590c"/><line x1="105" y1="162" x2="105" y2="98" stroke="#e8590c" stroke-width="3"/><polygon points="105.0,98.0 109.3,107.0 100.7,107.0" fill="#e8590c"/><text x="200" y="250" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Danger at a spot? It shifts</text><text x="200" y="268" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">to thicker cover (65%)</text>
</svg>
