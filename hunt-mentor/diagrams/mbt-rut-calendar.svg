<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 325" font-family="sans-serif" role="img" aria-label="September to January. Bow only bucks September 1 to 9. Rifle bucks September 10 to December 15 in MUs 2-8, 2-18 and 2-19. Rut in November and early December, with peak breeding November 15 to December 5. Antlers drop by January. The peak falls inside the season.">
