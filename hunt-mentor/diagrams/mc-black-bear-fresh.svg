<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="How fresh is bear sign, as a tip. Hours old: scat wet, shiny and smelly, track edges sharp, sap still wet on claw marks. A day or two: scat with a dull crust, track edges soft, leaves fallen in. A week or more: scat dry and faded with insects in it, tracks weathered. Dew, rain and sun change how fast sign ages.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">How fresh is the sign? (Tip)</text><rect x="10" y="52" width="12" height="66" rx="4" fill="#e8590c"/><rect x="26" y="52" width="364" height="66" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="36" y="76" font-size="16" font-weight="bold" fill="#23261f" text-anchor="start">Hours</text><text x="36" y="96" font-size="14" fill="#23261f" text-anchor="start">Scat wet, shiny, smells; track edges sharp</text><text x="36" y="113" font-size="14" fill="#23261f" text-anchor="start">sap wet on claw marks</text><rect x="10" y="126" width="12" height="66" rx="4" fill="#8a9a6b"/><rect x="26" y="126" width="364" height="66" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="36" y="150" font-size="16" font-weight="bold" fill="#23261f" text-anchor="start">A day or two</text><text x="36" y="170" font-size="14" fill="#23261f" text-anchor="start">Scat dull crust; track edges soft</text><text x="36" y="187" font-size="14" fill="#23261f" text-anchor="start">leaves fell in</text><rect x="10" y="200" width="12" height="66" rx="4" fill="#dfe6d3"/><rect x="26" y="200" width="364" height="66" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="36" y="224" font-size="16" font-weight="bold" fill="#23261f" text-anchor="start">A week plus</text><text x="36" y="244" font-size="14" fill="#23261f" text-anchor="start">Scat dry, faded, bugs in it; track weathered</text><text x="200" y="290" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Dew, rain and sun change the clock</text>
</svg>
