<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="sans-serif">
  <rect x="0" y="0" width="400" height="330" fill="#fffaf0"/>
  <text x="200" y="24" font-size="19" font-weight="bold" fill="#23261f" text-anchor="middle">Species licence: where the notches go (generic)</text>

  <!-- the licence card -->
  <rect x="60" y="60" width="280" height="190" rx="6" fill="#ffffff" stroke="#23261f" stroke-width="2"/>
  <text x="200" y="92" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">BC RESIDENT SPECIES LICENCE</text>
  <text x="200" y="110" font-size="14" fill="#23261f" text-anchor="middle">Mule deer   2026 to 2027</text>
  <text x="200" y="130" font-size="14" fill="#23261f" text-anchor="middle">FWID 000 000 000   Licence No. 0000000</text>
  <!-- barcode -->
  <g fill="#23261f">
    <rect x="130" y="142" width="3" height="22"/><rect x="136" y="142" width="2" height="22"/><rect x="141" y="142" width="4" height="22"/>
    <rect x="148" y="142" width="2" height="22"/><rect x="153" y="142" width="3" height="22"/><rect x="159" y="142" width="2" height="22"/>
    <rect x="164" y="142" width="4" height="22"/><rect x="171" y="142" width="2" height="22"/><rect x="176" y="142" width="3" height="22"/>
    <rect x="182" y="142" width="2" height="22"/><rect x="187" y="142" width="4" height="22"/><rect x="194" y="142" width="2" height="22"/>
    <rect x="199" y="142" width="3" height="22"/><rect x="205" y="142" width="2" height="22"/><rect x="210" y="142" width="4" height="22"/>
    <rect x="217" y="142" width="2" height="22"/><rect x="222" y="142" width="3" height="22"/><rect x="228" y="142" width="2" height="22"/>
    <rect x="233" y="142" width="4" height="22"/><rect x="240" y="142" width="2" height="22"/><rect x="245" y="142" width="3" height="22"/>
    <rect x="251" y="142" width="2" height="22"/><rect x="256" y="142" width="4" height="22"/><rect x="263" y="142" width="2" height="22"/>
  </g>

  <!-- MONTH strip along the top edge -->
  <g font-size="14" fill="#23261f" text-anchor="middle">
    <rect x="60" y="60" width="280" height="18" fill="#f1ead8" stroke="#23261f" stroke-width="1"/>
    <text x="95" y="74">SEP</text><text x="150" y="74">OCT</text><text x="205" y="74">NOV</text><text x="260" y="74">DEC</text><text x="315" y="74">JAN</text>
  </g>
  <!-- notch cut at OCT -->
  <path d="M140 60 L150 78 L160 60 Z" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/>

  <!-- DAY strip along the right edge -->
  <rect x="322" y="78" width="18" height="150" fill="#f1ead8" stroke="#23261f" stroke-width="1"/>
  <g font-size="12" fill="#23261f" text-anchor="middle">
    <text x="331" y="96">1</text><text x="331" y="116">5</text><text x="331" y="136">10</text><text x="331" y="156">15</text><text x="331" y="176">20</text><text x="331" y="196">25</text><text x="331" y="216">31</text>
  </g>
  <!-- notch cut at 15 -->
  <path d="M340 142 L322 152 L340 162 Z" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/>

  <!-- REGION strip along the bottom edge -->
  <rect x="60" y="232" width="280" height="18" fill="#f1ead8" stroke="#23261f" stroke-width="1"/>
  <g font-size="13" fill="#23261f" text-anchor="middle">
    <text x="80" y="246">1</text><text x="108" y="246">2</text><text x="136" y="246">3</text><text x="164" y="246">4</text><text x="192" y="246">5</text><text x="220" y="246">6</text><text x="252" y="246">7A</text><text x="286" y="246">7B</text><text x="318" y="246">8</text>
  </g>
  <!-- notch cut at region 3 -->
  <path d="M126 250 L136 232 L146 250 Z" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/>

  <!-- CLASS strip along the left edge -->
  <rect x="60" y="78" width="18" height="154" fill="#f1ead8" stroke="#23261f" stroke-width="1"/>
  <g font-size="12" fill="#23261f" text-anchor="middle">
    <text transform="translate(72 190) rotate(-90)">ANTLERLESS</text>
    <text transform="translate(72 114) rotate(-90)">BUCK</text>
  </g>
  <!-- notch cut at BUCK -->
  <path d="M60 100 L78 110 L60 120 Z" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/>

  <!-- labels around -->
  <text x="20" y="48" font-size="14" fill="#e8590c">Month</text>
  <text x="352" y="100" font-size="14" fill="#e8590c">Day</text>
  <text x="20" y="276" font-size="14" fill="#e8590c">Region</text>
  <text x="2" y="190" font-size="14" fill="#e8590c" transform="rotate(-90 14 190)">Class</text>

  <text x="200" y="298" font-size="14" fill="#23261f" text-anchor="middle">Orange: notches cut out. This card is a generic example.</text>
  <text x="200" y="318" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Follow the instructions printed on YOUR licence.</text>
</svg>
