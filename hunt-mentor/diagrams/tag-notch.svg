<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 452" font-family="sans-serif" role="img" aria-label="A generic BC resident species licence for mule deer, 2026 to 2027, with an FWID number, a licence number and a barcode. Strips run round the edges: month along the top (September to January), day down the right (1 to 31), region along the bottom (1 to 8, with 7A and 7B) and class down the left (buck, antlerless). Orange V notches are cut out at October, day 15, region 3 and buck. This card is a generic example: follow the instructions printed on your own licence.">
