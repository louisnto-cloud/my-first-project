<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="sans-serif" role="img" aria-label="A paper target with a 15 cm (6 inch) paper plate and a 5 shot group inside it at 100 m. If all 5 shots land inside, that distance is within your range.">
<rect x="0" y="0" width="400" height="290" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">The paper plate test (Tip)</text>
<rect x="110.0" y="50.0" width="180.0" height="180.0" rx="0" fill="#FFFFFF" stroke="#17201A" stroke-width="2"/><circle cx="200.0" cy="140.0" r="75.0" fill="#F3E3D3" stroke="#17201A" stroke-width="1.5"/><text x="200.0" y="236.0" font-size="14" fill="#17201A" text-anchor="start"></text><circle cx="186.0" cy="130.0" r="5.0" fill="#17201A" stroke="#17201A" stroke-width="1"/><circle cx="212.0" cy="122.0" r="5.0" fill="#17201A" stroke="#17201A" stroke-width="1"/><circle cx="204.0" cy="154.0" r="5.0" fill="#17201A" stroke="#17201A" stroke-width="1"/><circle cx="180.0" cy="158.0" r="5.0" fill="#17201A" stroke="#17201A" stroke-width="1"/><circle cx="222.0" cy="146.0" r="5.0" fill="#17201A" stroke="#17201A" stroke-width="1"/><text x="200.0" y="254.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Plate 15 cm (6 in) at 100 m.</text><text x="200.0" y="274.0" font-size="14" fill="#17201A" text-anchor="middle">5 shots inside? That is your range.</text>
</svg>
