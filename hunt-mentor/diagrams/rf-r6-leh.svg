<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 254" role="img" aria-label="Four cards. Limited Entry Hunting, a draw, in Region 6. Caribou: draw only. Moose: parts of several Management Units, Maps F25, F39 and F40. Thinhorn sheep: parts, Maps F26, F28, F30, F34 and F36. Mountain goat: parts, Maps F13, F22, F24, F27, F29, F30, F31, F33, F36 and F37." font-family="sans-serif">
