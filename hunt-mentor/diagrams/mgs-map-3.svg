<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Hunt Map step 3: the What can I see from here tool shades the ground you can see from a road pullout. Pick a pullout that sees the field so you can glass the geese from the road. Never trespass, 99 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Step 3: What can I see from here</text><rect x="60" y="34" width="280" height="236" rx="14" fill="#e9efe1" stroke="#2f3a2b" stroke-width="3"/><rect x="80" y="72" width="240" height="190" rx="0" fill="#e9efe1"/><rect x="200" y="90" width="110" height="80" rx="3" fill="#d9c48f" stroke="#6b4f35" stroke-width="2"/><text x="255" y="135" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Field</text><line x1="80" y1="230" x2="320" y2="230" stroke="#9e9e9e" stroke-width="8"/><text x="120" y="250" font-size="14" fill="#2f3a2b" text-anchor="middle">Road</text><path d="M140 228 L200 90 L310 90 L310 170 Z" fill="#e8590c" opacity=".25"/><circle cx="140" cy="228" r="8" fill="#e8590c"/><text x="160" y="205" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">You can see it</text><rect x="60" y="34" width="280" height="28" rx="14" fill="#2f3a2b"/><rect x="60" y="48" width="280" height="14" rx="0" fill="#2f3a2b"/><text x="200" y="54" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Terrain tools</text><text x="200" y="292" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Glass the field from the road. Never trespass (99%)</text>
</svg>
