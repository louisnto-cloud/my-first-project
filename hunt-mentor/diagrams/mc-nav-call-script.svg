<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="What to say on a 911 call when lost: 1 where you are, coordinates first; 2 who, your name and how many; 3 what happened; 4 what you have, gear and battery percent; 5 the plan, stay put and check in times. Call 911 and ask for police, 75 percent; the order is a Tip.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">What to say on the call</text><g transform="translate(70 160) scale(1.6)"><rect x="-26" y="-48" width="52" height="96" rx="9" fill="#2f3a2b"/><rect x="-21" y="-40" width="42" height="76" rx="3" fill="#dfe6d3"/><circle cx="0" cy="42" r="3" fill="#fffaf0"/></g><text x="150" y="70" font-size="16" fill="#e8590c" text-anchor="start" font-weight="bold">1 Where</text><text x="225" y="70" font-size="15" fill="#23261f" text-anchor="start">coordinates first</text><text x="150" y="112" font-size="16" fill="#e8590c" text-anchor="start" font-weight="bold">2 Who</text><text x="225" y="112" font-size="15" fill="#23261f" text-anchor="start">name, how many</text><text x="150" y="154" font-size="16" fill="#e8590c" text-anchor="start" font-weight="bold">3 What</text><text x="225" y="154" font-size="15" fill="#23261f" text-anchor="start">lost, hurt, how</text><text x="150" y="196" font-size="16" fill="#e8590c" text-anchor="start" font-weight="bold">4 Have</text><text x="225" y="196" font-size="15" fill="#23261f" text-anchor="start">gear, battery %</text><text x="150" y="238" font-size="16" fill="#e8590c" text-anchor="start" font-weight="bold">5 Plan</text><text x="225" y="238" font-size="15" fill="#23261f" text-anchor="start">stay put, check ins</text><text x="200" y="293" font-size="14" fill="#6b4f35" text-anchor="middle">911 first, ask for police (75%). Order: Tip</text>
</svg>
