<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Black bear body language from calm to dangerous. Unaware: feeding, head down; watch and plan. Aware: stands, sniffs, stares; freeze and let it settle. Stressed: huffs, jaw pops, swats the ground; it wants space, back off. Bluff charge: runs in and stops short; stand your ground with spray ready. Stalking you: quiet and keeps coming; spray, then fight back. From WildSafeBC and BC bear safety guidance.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Read the bear: calm to dangerous</text><rect x="10" y="50" width="10" height="42" rx="3" fill="#8a9a6b"/><rect x="24" y="50" width="366" height="42" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="32" y="68" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Unaware</text><text x="32" y="86" font-size="14" fill="#23261f" text-anchor="start">Feeding, head down</text><text x="382" y="77" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Watch. Plan.</text><rect x="10" y="99" width="10" height="42" rx="3" fill="#8a9a6b"/><rect x="24" y="99" width="366" height="42" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="32" y="117" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Aware</text><text x="32" y="135" font-size="14" fill="#23261f" text-anchor="start">Stands, sniffs, stares</text><text x="382" y="126" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Freeze. Let it settle.</text><rect x="10" y="148" width="10" height="42" rx="3" fill="#e8590c"/><rect x="24" y="148" width="366" height="42" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="1.5"/><text x="32" y="166" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">Stressed</text><text x="32" y="184" font-size="14" fill="#23261f" text-anchor="start">Huffs, jaw pops, swats</text><text x="382" y="175" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">It wants space. Back off.</text><rect x="10" y="197" width="10" height="42" rx="3" fill="#e8590c"/><rect x="24" y="197" width="366" height="42" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="1.5"/><text x="32" y="215" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">Bluff charge</text><text x="32" y="233" font-size="14" fill="#23261f" text-anchor="start">Runs in, stops short</text><text x="382" y="224" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Stand. Spray ready.</text><rect x="10" y="246" width="10" height="42" rx="3" fill="#b02a2a"/><rect x="24" y="246" width="366" height="42" rx="8" fill="#fffaf0" stroke="#b02a2a" stroke-width="1.5"/><text x="32" y="264" font-size="15" font-weight="bold" fill="#b02a2a" text-anchor="start">Stalking you</text><text x="32" y="282" font-size="14" fill="#23261f" text-anchor="start">Quiet, keeps coming</text><text x="382" y="273" font-size="14" font-weight="bold" fill="#23261f" text-anchor="end">Spray, then fight back.</text>
</svg>
