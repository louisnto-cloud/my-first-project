<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 322" font-family="sans-serif" role="img" aria-label="Questions for any shop: do you cut wild game and from when; does my animal stay separate; price per pound on hanging or finished weight; deliver skinned, quartered or whole. Law: the shop records your FWID, licence number, species, sex and MU, and you get a receipt.">
<rect x="0" y="0" width="400" height="322" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Phone the shop and ask</text><rect x="10" y="44" width="185" height="84" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(40 78) scale(0.9)"><ellipse cx="2" cy="2" rx="15" ry="8" fill="#8b5a2b"/><path d="M-10 8 v12 M-4 8 v12 M8 8 v12 M14 8 v12" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/><path d="M-12 -2 L-18 -12" stroke="#8b5a2b" stroke-width="6" stroke-linecap="round"/><ellipse cx="-20" cy="-14" rx="6" ry="4" fill="#8b5a2b"/><path d="M-19 -18 l-2 -8 m2 4 l4 -5 M-17 -18 l3 -6" stroke="#6b4f35" stroke-width="2" fill="none" stroke-linecap="round"/></g><text x="68" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Wild game?</text><text x="68" y="86" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">From when?</text><rect x="203" y="44" width="185" height="84" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(233 78) scale(0.9)"><path d="M0 -18 V16 M-14 18 H14 M-18 -10 H18" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-18 -10 L-24 4 H-12 Z M18 -10 L12 4 H24 Z" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="261" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Mine kept</text><text x="261" y="86" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">separate?</text><rect x="10" y="136" width="185" height="84" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(40 170) scale(0.9)"><rect x="-18" y="-14" width="36" height="32" rx="3" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-18" y="-14" width="36" height="9" fill="#e8590c"/><path d="M-10 -18 v6 M10 -18 v6" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-10 2 h4 M-2 2 h4 M6 2 h4 M-10 10 h4 M-2 10 h4" stroke="#2f3a2b" stroke-width="3"/></g><text x="68" y="160" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Price per lb:</text><text x="68" y="178" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">hanging or</text><text x="68" y="196" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">finished?</text><rect x="203" y="136" width="185" height="84" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(233 170) scale(0.9)"><path d="M-20 6 L6 -4 Q16 -8 20 -12 Q18 2 6 6 Z" fill="#cfd6bf" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-24" y="2" width="14" height="9" rx="3" fill="#8b5a2b" transform="rotate(-20 -17 6)"/></g><text x="261" y="160" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Skinned,</text><text x="261" y="178" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">quartered or</text><text x="261" y="196" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">whole?</text><rect x="10" y="228" width="185" height="84" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(40 262) scale(0.9)"><path d="M-14 -18 H8 L16 -10 V18 H-14 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -6 H10 M-8 2 H10 M-8 10 H4" stroke="#8a9a6b" stroke-width="2.5"/></g><rect x="141" y="288" width="48" height="20" rx="10" fill="#4a7fb0"/><text x="165" y="303" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">LAW</text><text x="68" y="252" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">They record</text><text x="68" y="270" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">FWID, licence,</text><text x="68" y="288" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">sex, MU</text><rect x="203" y="228" width="185" height="84" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(233 262) scale(0.9)"><path d="M-14 -18 H8 L16 -10 V18 H-14 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -6 H10 M-8 2 H10 M-8 10 H4" stroke="#8a9a6b" stroke-width="2.5"/></g><rect x="334" y="288" width="48" height="20" rx="10" fill="#4a7fb0"/><text x="358" y="303" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">LAW</text><text x="261" y="252" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Get the</text><text x="261" y="270" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">receipt</text>
</svg>
