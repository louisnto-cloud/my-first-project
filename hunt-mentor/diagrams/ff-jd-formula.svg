<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 302" font-family="sans-serif" role="img" aria-label="A scope reticle with mil marks over a deer. The deer chest covers 2 mils. Range in metres equals the object size in metres times 1,000, divided by the mils it covers. Example: a 0.46 m deer chest covering 2 mils is 230 m away. On a second focal plane scope this only works at the marked power.">
