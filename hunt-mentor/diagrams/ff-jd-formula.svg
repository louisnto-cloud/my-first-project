<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A scope reticle with mil marks over a small deer. Range in metres equals the object size in metres times 1,000, divided by the mils it covers. Example: a 0.46 m deer chest covering 2 mils is 230 m away. On a second focal plane scope this only works at the marked power.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Range with the reticle</text><circle cx="120" cy="160" r="100" fill="#f7f4ec" stroke="#2f3a2b" stroke-width="2"/><line x1="20" y1="160" x2="220" y2="160" stroke="#23261f" stroke-width="1.5" stroke-linecap="round"/><line x1="120" y1="60" x2="120" y2="260" stroke="#23261f" stroke-width="1.5" stroke-linecap="round"/><line x1="116" y1="80" x2="124" y2="80" stroke="#23261f" stroke-width="2" stroke-linecap="round"/><line x1="116" y1="100" x2="124" y2="100" stroke="#23261f" stroke-width="2" stroke-linecap="round"/><line x1="116" y1="120" x2="124" y2="120" stroke="#23261f" stroke-width="2" stroke-linecap="round"/><line x1="116" y1="140" x2="124" y2="140" stroke="#23261f" stroke-width="2" stroke-linecap="round"/><line x1="116" y1="160" x2="124" y2="160" stroke="#23261f" stroke-width="2" stroke-linecap="round"/><line x1="116" y1="180" x2="124" y2="180" stroke="#23261f" stroke-width="2" stroke-linecap="round"/><line x1="116" y1="200" x2="124" y2="200" stroke="#23261f" stroke-width="2" stroke-linecap="round"/><line x1="116" y1="220" x2="124" y2="220" stroke="#23261f" stroke-width="2" stroke-linecap="round"/><line x1="116" y1="240" x2="124" y2="240" stroke="#23261f" stroke-width="2" stroke-linecap="round"/><g transform="translate(80 120) scale(0.42)"><ellipse cx="62" cy="50" rx="44" ry="20" fill="#8b5a2b"/><path d="M28 42 L14 14 L24 10 L40 36 Z" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="12" cy="12" rx="13" ry="7" fill="#8b5a2b" transform="rotate(-20 12 12)"/><path d="M14 4 l6 -12 l4 10 Z" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="40" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="82" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="94" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><ellipse cx="104" cy="44" rx="5" ry="8" fill="#f4efe6"/></g><path d="M200 128 L210 128 M200 148 L210 148" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="80" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Metres =</text><text x="300" y="108" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">size (m) x 1,000</text><line x1="240" y1="116" x2="360" y2="116" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><text x="300" y="136" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">mils it covers</text><text x="300" y="182" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">0.46 m chest</text><text x="300" y="202" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">covers 2 mils</text><text x="300" y="222" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">= 230 m</text><text x="200.0" y="286" font-size="13" fill="#2f3a2b" text-anchor="middle">Second focal plane: only at the marked power</text>
</svg>
