<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Parts of a rifle case: the rim at the base, the extractor groove just in front of it, the long body, the sloped shoulder, and the neck that grips the bullet. The headstamp is printed on the base.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Parts of the case</text><g transform="translate(50 150)"><path d="M0 -36 L200 -36 L240 -22 L300 -22 L300 22 L240 22 L200 36 L0 36 Z" fill="#c9a227" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-12" y="-40" width="14" height="80" rx="0" fill="#c9a227" stroke="#2f3a2b" stroke-width="2"/><rect x="2" y="-30" width="8" height="60" rx="0" fill="#a88520" stroke="none" stroke-width="2"/></g><line x1="44" y1="110" x2="44" y2="92" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="44" y="84" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Rim</text><line x1="58" y1="186" x2="90" y2="210" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="90" y="230" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Extractor groove</text><line x1="150" y1="114" x2="150" y2="92" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="150" y="84" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Body</text><line x1="270" y1="124" x2="270" y2="92" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="270" y="84" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Shoulder</text><line x1="330" y1="172" x2="330" y2="210" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="330" y="230" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Neck</text><text x="200" y="268" font-size="14" fill="#2f3a2b" text-anchor="middle">Headstamp is on the base, behind the rim</text>
</svg>
