<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Grid of fire lighting tools: lighter, fast and easy, weak when cold or with wet fingers. Matches, simple, but they get wet. Ferro rod, works wet but needs very fine tinder. Fire starter, burns long but you must carry it. Carry two ways in two pockets.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">What lights it</text><rect x="10" y="46" width="100" height="42" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="60" y="72" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Tool</text><rect x="110" y="46" width="130" height="42" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="175" y="72" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Good</text><rect x="240" y="46" width="150" height="42" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="315" y="72" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Weak spot</text><rect x="10" y="88" width="100" height="42" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="60" y="114" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Lighter</text><rect x="110" y="88" width="130" height="42" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="175" y="114" font-size="14" fill="#2f3a2b" text-anchor="middle">Fast, easy</text><rect x="240" y="88" width="150" height="42" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="315" y="114" font-size="14" fill="#2f3a2b" text-anchor="middle">Cold, wet fingers</text><rect x="10" y="130" width="100" height="42" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="60" y="156" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Matches</text><rect x="110" y="130" width="130" height="42" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="175" y="156" font-size="14" fill="#2f3a2b" text-anchor="middle">Simple</text><rect x="240" y="130" width="150" height="42" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="315" y="156" font-size="14" fill="#2f3a2b" text-anchor="middle">Get wet</text><rect x="10" y="172" width="100" height="42" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="60" y="198" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Ferro rod</text><rect x="110" y="172" width="130" height="42" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="175" y="198" font-size="14" fill="#2f3a2b" text-anchor="middle">Works wet</text><rect x="240" y="172" width="150" height="42" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="315" y="198" font-size="14" fill="#2f3a2b" text-anchor="middle">Needs fine tinder</text><rect x="10" y="214" width="100" height="42" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="60" y="240" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fire starter</text><rect x="110" y="214" width="130" height="42" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="175" y="240" font-size="14" fill="#2f3a2b" text-anchor="middle">Burns long</text><rect x="240" y="214" width="150" height="42" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="315" y="240" font-size="14" fill="#2f3a2b" text-anchor="middle">Must carry it</text><text x="200" y="285" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Carry two ways, in two pockets</text>
</svg>
