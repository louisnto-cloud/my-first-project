<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Leg of a duck standing in cold water. A red artery carries warm blood down; a blue vein carries cool blood back up right beside it. Heat jumps across from the artery to the vein, so the returning blood is warmed and the feet stay near water temperature. Little body heat is lost, 80 percent."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Cold feet, warm body (80%)</text><rect x="0" y="230" width="400" height="70" fill="#4a7fb0" opacity=".6"/><path d="M150 40 L150 200 L120 236 M150 200 L150 240 M150 200 L180 236" stroke="#d98b2b" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M140 40 L140 196" stroke="#c0392b" stroke-width="6" fill="none"/><path d="M160 196 L160 40" stroke="#3a6fb0" stroke-width="6" fill="none"/><line x1="142" y1="70" x2="152.0" y2="70.0" stroke="#e8590c" stroke-width="2" fill="none"/><polygon points="158.0,70.0 147.0,64.0 147.0,76.0" fill="#e8590c"/><line x1="142" y1="110" x2="152.0" y2="110.0" stroke="#e8590c" stroke-width="2" fill="none"/><polygon points="158.0,110.0 147.0,104.0 147.0,116.0" fill="#e8590c"/><line x1="142" y1="150" x2="152.0" y2="150.0" stroke="#e8590c" stroke-width="2" fill="none"/><polygon points="158.0,150.0 147.0,144.0 147.0,156.0" fill="#e8590c"/><line x1="132" y1="60" x2="132.0" y2="184.0" stroke="#c0392b" stroke-width="3" fill="none"/><polygon points="132.0,190.0 138.0,179.0 126.0,179.0" fill="#c0392b"/><line x1="168" y1="190" x2="168.0" y2="66.0" stroke="#3a6fb0" stroke-width="3" fill="none"/><polygon points="168.0,60.0 162.0,71.0 174.0,71.0" fill="#3a6fb0"/><text x="190" y="66" font-size="15" fill="#c0392b" text-anchor="start" font-weight="bold">Warm blood down</text><text x="190" y="106" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Heat jumps across</text><text x="190" y="146" font-size="15" fill="#3a6fb0" text-anchor="start" font-weight="bold">Cool blood back up</text><text x="190" y="186" font-size="15" fill="#3a6fb0" text-anchor="start" font-weight="bold">is warmed again</text><text x="200" y="274" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Feet stay near water temperature</text><text x="200" y="294" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Little heat lost (80%)</text></svg>
