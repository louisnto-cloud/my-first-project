<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 346" font-family="sans-serif" role="img" aria-label="A 3 to 9x40 hunting scope in side view, eyepiece on the left: 1 the diopter ring that sets the reticle sharp for your eye, 2 the power ring, 3 the turrets, top for up and down and side for left and right, 4 the tube, 1 inch or 30 mm, which must match the rings, marked in orange, 5 the objective lens. 3 to 9x40 means zoom 3 to 9 times with a 40 mm front lens.">
<rect x="0" y="0" width="400" height="346" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">A hunting scope, part by part</text><path d="M30 99.0 L80.0 99.0 L96.0 108.0 L96.0 132.0 L80.0 141.0 L30 141.0Z" fill="#3A463C" stroke="#1F3D2B" stroke-width="1.4"/><rect x="34.0" y="97.0" width="10.0" height="46.0" rx="2.0" fill="#8F9A8C" stroke="#1F3D2B" stroke-width="1.2"/><rect x="58.0" y="98.0" width="18.0" height="44.0" rx="2.0" fill="#8F9A8C" stroke="#1F3D2B" stroke-width="1.2"/><rect x="96.0" y="108.0" width="190.0" height="24.0" fill="#3A463C" stroke="#1F3D2B" stroke-width="1.4"/><rect x="179.0" y="86.0" width="24.0" height="22.0" rx="3.0" fill="#3A463C" stroke="#1F3D2B" stroke-width="1.4"/><circle cx="191.0" cy="120" r="11.0" fill="#3A463C" stroke="#1F3D2B" stroke-width="1.4"/><path d="M286.0 108.0 L330.0 95.0 L370.0 95.0 L370.0 145.0 L330.0 145.0 L286.0 132.0Z" fill="#3A463C" stroke="#1F3D2B" stroke-width="1.4"/><g data-tip="Diopter ring|Sets the reticle sharp for your eye. Set once."><line x1="30" y1="70" x2="39.0" y2="97.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="39.0" cy="97.0" r="2.6" fill="#1F3D2B"/><circle cx="30" cy="70" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="75" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text></g><g data-tip="Power ring|Zoom: 3 to 9 times. Walk on low power."><line x1="90" y1="60" x2="67.0" y2="98.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="67.0" cy="98.0" r="2.6" fill="#1F3D2B"/><circle cx="90" cy="60" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="90" y="65" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text></g><g data-tip="Turrets|Top: up and down. Side: left and right. Usually 1/4 MOA a click."><line x1="200" y1="60" x2="191.0" y2="86.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="191.0" cy="86.0" r="2.6" fill="#1F3D2B"/><circle cx="200" cy="60" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="200" y="65" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text></g><g data-tip="Tube: 1 in or 30 mm|Ring size must match the tube."><line x1="140" y1="190" x2="120.0" y2="132.0" stroke="#FF6A13" stroke-width="1.6"/><circle cx="120.0" cy="132.0" r="2.6" fill="#FF6A13"/><circle cx="140" cy="190" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="140" y="195" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text></g><g data-tip="Objective lens|40 mm front lens on a 3 to 9x40."><line x1="330" y1="190" x2="350.0" y2="145.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="350.0" cy="145.0" r="2.6" fill="#1F3D2B"/><circle cx="330" cy="190" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="330" y="195" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text></g><circle cx="24" cy="227" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="232" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="40" y="232" font-size="14" fill="#17201A" text-anchor="start">Diopter ring</text><circle cx="24" cy="249" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="254" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="40" y="254" font-size="14" fill="#17201A" text-anchor="start">Power ring</text><circle cx="24" cy="271" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="276" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="40" y="276" font-size="14" fill="#17201A" text-anchor="start">Turrets</text><circle cx="216" cy="227" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="216" y="232" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="232" y="232" font-size="14" fill="#17201A" text-anchor="start">Tube: 1 in or 30 mm</text><circle cx="216" cy="249" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="216" y="254" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="232" y="254" font-size="14" fill="#17201A" text-anchor="start">Objective lens</text><rect x="12" y="300" width="376" height="34" rx="6" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="200" y="322" font-size="14" fill="#17201A" text-anchor="middle">&quot;3 to 9x40&quot;: zoom 3 to 9, 40 mm front lens.</text>
</svg>
