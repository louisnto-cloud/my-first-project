<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side view of goose country. A roost on big water with a sand bar, where geese rest, 85 percent, and nest near water, 80 percent. A flight line leads to a stubble or hay field where they feed within commuting distance of the water, 80 percent. At the right edge, a town with a house: no hunting.">
