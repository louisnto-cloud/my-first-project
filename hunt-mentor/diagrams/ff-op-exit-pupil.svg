<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Exit pupils drawn to scale: 8x42 gives 5.25 mm, 10x42 gives 4.2 mm, 10x50 gives 5 mm, 12x50 gives 4.2 mm. The exit pupil is the lens size divided by the power. A bigger exit pupil is brighter at dawn and dusk.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Exit pupil = lens size ÷ power</text><circle cx="60" cy="130" r="42.0" fill="#ffffff" stroke="#2f6e3b" stroke-width="3"/><circle cx="60" cy="130" r="3" fill="#2f6e3b" stroke="none" stroke-width="2"/><text x="60" y="200" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">8x42</text><text x="60" y="222" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">5.25 mm</text><circle cx="154" cy="130" r="33.6" fill="#ffffff" stroke="#4a7fb0" stroke-width="3"/><circle cx="154" cy="130" r="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="154" y="200" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">10x42</text><text x="154" y="222" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">4.2 mm</text><circle cx="248" cy="130" r="40.0" fill="#ffffff" stroke="#e8590c" stroke-width="3"/><circle cx="248" cy="130" r="3" fill="#e8590c" stroke="none" stroke-width="2"/><text x="248" y="200" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">10x50</text><text x="248" y="222" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">5.0 mm</text><circle cx="342" cy="130" r="33.6" fill="#ffffff" stroke="#b3261e" stroke-width="3"/><circle cx="342" cy="130" r="3" fill="#b3261e" stroke="none" stroke-width="2"/><text x="342" y="200" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">12x50</text><text x="342" y="222" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle">4.2 mm</text><text x="200.0" y="272" font-size="14" fill="#2f3a2b" text-anchor="middle">Bigger exit pupil: brighter at dawn and dusk</text>
</svg>
