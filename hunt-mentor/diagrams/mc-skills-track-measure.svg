<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="How to measure a hoof track. Left, one print: length from tip to heel, width at the widest point, measured on the floor of the print, not the rim. Right, a trail of prints: stride from one foot to the same foot again, and straddle, the trail width from the outside of the left prints to the outside of the right prints.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Measure a track (80%)</text><path d="M52 174 Q 44 118 72 82 L76 174 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><path d="M108 174 Q 116 118 88 82 L84 174 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><line x1="130" y1="82" x2="130" y2="176" stroke="#e8590c" stroke-width="2"/><text x="140" y="134" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">length</text><line x1="42" y1="192" x2="118" y2="192" stroke="#4a7fb0" stroke-width="2"/><text x="80" y="212" font-size="14" fill="#4a7fb0" text-anchor="middle" font-weight="bold">width</text><text x="80" y="240" font-size="14" fill="#23261f" text-anchor="middle">Floor, not rim</text><path d="M200.2 265.4 Q 197.4 245.8 207.2 233.2 L208.6 265.4 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><path d="M219.8 265.4 Q 222.6 245.8 212.8 233.2 L211.4 265.4 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><path d="M240.2 215.4 Q 237.4 195.8 247.2 183.2 L248.6 215.4 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><path d="M259.8 215.4 Q 262.6 195.8 252.8 183.2 L251.4 215.4 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><path d="M200.2 165.4 Q 197.4 145.8 207.2 133.2 L208.6 165.4 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><path d="M219.8 165.4 Q 222.6 145.8 212.8 133.2 L211.4 165.4 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><path d="M240.2 115.4 Q 237.4 95.8 247.2 83.2 L248.6 115.4 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><path d="M259.8 115.4 Q 262.6 95.8 252.8 83.2 L251.4 115.4 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><path d="M200.2 69.4 Q 197.4 49.8 207.2 37.2 L208.6 69.4 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><path d="M219.8 69.4 Q 222.6 49.8 212.8 37.2 L211.4 69.4 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><line x1="290" y1="250" x2="290" y2="150" stroke="#e8590c" stroke-width="2"/><text x="298" y="190" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">stride</text><line x1="194" y1="274" x2="266" y2="274" stroke="#4a7fb0" stroke-width="2"/><text x="230" y="292" font-size="14" fill="#4a7fb0" text-anchor="middle" font-weight="bold">straddle</text><text x="298" y="210" font-size="14" fill="#23261f" text-anchor="start">same foot</text><text x="298" y="228" font-size="14" fill="#23261f" text-anchor="start">to same foot</text>
</svg>
