<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="The tracker walks beside the blood trail, not on it, and looks well ahead for the deer." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="16" fill="#23261f" text-anchor="middle" font-weight="bold">3. Walk beside the trail, look ahead</text><rect x="0" y="34" width="400" height="266" fill="#eef0e2"/><circle cx="60" cy="250" r="5" fill="#9b2c1c"/><circle cx="110" cy="220" r="5" fill="#9b2c1c"/><circle cx="150" cy="200" r="5" fill="#9b2c1c"/><circle cx="200" cy="170" r="5" fill="#9b2c1c"/><path d="M50 280 L120 250 L170 230 L220 200" fill="none" stroke="#2f3a2b" stroke-width="3" stroke-dasharray="6 6"/><circle cx="220" cy="192.4" r="5.6000000000000005" fill="#e8590c"/><rect x="214.4" y="198.8" width="11.200000000000001" height="16.0" rx="3.2" fill="#e8590c"/><path d="M226 180 L330 110" stroke="#e8590c" stroke-width="2" stroke-dasharray="3 5"/><text x="330" y="100" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Look for the deer</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle" font-weight="bold">Never walk on the sign. Keep it for later.</text>
</svg>
