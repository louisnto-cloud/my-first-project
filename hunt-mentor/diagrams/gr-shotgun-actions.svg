<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four shotgun actions. Pump: cheapest and simple, most kick. Gas semi auto: softest kick, keep the gas system clean. Inertia semi auto: runs clean in cold, sharper kick. Over under: two barrels, two shots only, check the steel rating.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <g font-size="14" fill="#2f3a2b">
    <rect x="8" y="8" width="188" height="138" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
    <text x="20" y="32" font-size="17" font-weight="bold">Pump</text>
    <rect x="20" y="46" width="120" height="8" fill="#6b6f68"/><rect x="50" y="54" width="50" height="14" rx="5" fill="#8b5a2b"/>
    <path d="M110 62 h26 m-8 -6 l8 6 l-8 6 M40 62 h-0" stroke="#e8590c" stroke-width="3" fill="none"/>
    <text x="20" y="94">+ Cheapest, simple</text><text x="20" y="114">+ Cycles any load</text><text x="20" y="134" fill="#c0392b">− Most kick</text>
    <rect x="204" y="8" width="188" height="138" rx="10" fill="#e8590c" fill-opacity=".15" stroke="#e8590c" stroke-width="3"/>
    <text x="216" y="32" font-size="17" font-weight="bold">Gas semi auto</text>
    <rect x="216" y="46" width="120" height="8" fill="#6b6f68"/><rect x="236" y="56" width="70" height="6" fill="#6b6f68"/>
    <g fill="#4a7fb0"><circle cx="300" cy="52" r="3"/><circle cx="290" cy="58" r="3"/><circle cx="278" cy="59" r="3"/></g>
    <text x="216" y="94">+ Softest kick</text><text x="216" y="114">+ Best with 3 in steel</text><text x="216" y="134" fill="#c0392b">− Keep gas clean</text>
    <rect x="8" y="154" width="188" height="138" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
    <text x="20" y="178" font-size="17" font-weight="bold">Inertia semi auto</text>
    <rect x="20" y="192" width="120" height="8" fill="#6b6f68"/><path d="M30 206 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6" stroke="#2f3a2b" stroke-width="2" fill="none"/>
    <text x="20" y="240">+ Runs clean, cold</text><text x="20" y="260" fill="#c0392b">− Sharper kick</text><text x="20" y="280" fill="#c0392b">− Light loads may jam</text>
    <rect x="204" y="154" width="188" height="138" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
    <text x="216" y="178" font-size="17" font-weight="bold">Over/under</text>
    <rect x="216" y="190" width="120" height="7" fill="#6b6f68"/><rect x="216" y="199" width="120" height="7" fill="#6b6f68"/>
    <text x="216" y="240">+ 2 chokes, easy check</text><text x="216" y="260" fill="#c0392b">− 2 shots only</text><text x="216" y="280" fill="#c0392b">− Check steel rating</text>
  </g>
  <text x="382" y="32" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">My lean</text>
</svg>
