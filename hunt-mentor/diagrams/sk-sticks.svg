<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Top view of three leg shooting sticks: one leg points toward the target, two legs spread toward the shooter. The shooter stands with feet nearly square to the rifle.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">Three leg sticks, seen from above</text><line x1="200" y1="120" x2="200.0" y2="46.0" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><path d="M203.9 54.1 L200.0 46.0 L196.1 54.1" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="212" y="60" font-size="15" font-weight="bold" fill="#e8590c">Target</text><line x1="200" y1="150" x2="200" y2="96" stroke="#2f3a2b" stroke-width="3"/><line x1="200" y1="150" x2="150" y2="196" stroke="#2f3a2b" stroke-width="3"/><line x1="200" y1="150" x2="250" y2="196" stroke="#2f3a2b" stroke-width="3"/><circle cx="200" cy="96" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><circle cx="150" cy="196" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><circle cx="250" cy="196" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><circle cx="200" cy="150" r="6" fill="#23261f"/><ellipse cx="178" cy="248" rx="12" ry="20" fill="#2f3a2b"/><ellipse cx="222" cy="248" rx="12" ry="20" fill="#2f3a2b"/><text x="40" y="205" font-size="15" font-weight="bold" fill="#23261f">Two legs</text><text x="40" y="223" font-size="15" fill="#23261f">toward you</text><text x="270" y="100" font-size="15" font-weight="bold" fill="#23261f">One leg toward</text><text x="270" y="118" font-size="15" fill="#23261f">the target</text><text x="270" y="250" font-size="15" font-weight="bold" fill="#23261f">Your feet: nearly</text><text x="270" y="268" font-size="15" fill="#23261f">square, not bladed</text><text x="200" y="292" font-size="14" text-anchor="middle" fill="#2f3a2b">Your legs are the rear bipod</text>
</svg>
