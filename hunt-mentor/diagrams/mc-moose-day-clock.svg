<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 314" font-family="sans-serif" role="img" aria-label="24 hour clock. Moose activity peaks around dawn and dusk, about the first hours after sunrise and around sunset. At midday they bed and chew cud. Captive moose fed about 10 hours a day in about 5 bouts. Night activity also happens.">
<rect x="0" y="0" width="400" height="314" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A moose day</text><circle cx="200" cy="160" r="105" fill="#e3e8ef" stroke="#8a9a6b" stroke-width="3"/><path d="M303.0 160.0 A103 103 0 0 1 97.0 160.0" stroke="#fff1c4" stroke-width="30" fill="none"/><path d="M291.0 160.0 A91 91 0 0 1 255.4 232.2" stroke="#e8590c" stroke-width="18" fill="none"/><path d="M109.8 171.9 A91 91 0 0 1 135.7 95.7" stroke="#e8590c" stroke-width="18" fill="none"/><path d="M223.6 247.9 A91 91 0 0 1 135.7 224.3" stroke="#8a9a6b" stroke-width="18" fill="none"/><text x="200.0" y="44.0" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">00</text><text x="285.55992052357226" y="79.44007947642775" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">03</text><text x="321.0" y="165.0" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">06</text><text x="285.55992052357226" y="250.55992052357226" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">09</text><text x="200.0" y="286.0" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">12</text><text x="114.44007947642775" y="250.55992052357226" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">15</text><text x="79.0" y="165.00000000000003" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">18</text><text x="114.44007947642773" y="79.44007947642775" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">21</text><text x="200" y="150" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">24 hour</text><text x="200" y="167" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">clock</text><text x="392" y="52" font-size="14" fill="#e8590c" text-anchor="end" font-weight="bold">Peaks: dawn, dusk</text><text x="8" y="52" font-size="14" fill="#5f6f45" text-anchor="start" font-weight="bold">Midday: bed, chew</text><text x="200" y="306" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">About 10 h feeding a day, in about 5 bouts</text>
</svg>
