<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Where water hides in dry Interior country: a line of green brush in the bottom of a draw, seeps below rock outcrops, and cottonwood and willow, which grow near water.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Where water hides in dry country</text><path d="M0 230 L90 120 L150 200 L230 90 L320 190 L400 140 L400 300 L0 300 Z" fill="#dfe6d3"/><path d="M150 200 L170 260 L200 300" fill="none" stroke="#4a7fb0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="130" cy="210" r="12.0" fill="#8a9a6b"/><circle cx="160" cy="225" r="12.0" fill="#8a9a6b"/><circle cx="186" cy="250" r="12.0" fill="#8a9a6b"/><text x="70" y="278" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="middle">Green line</text><text x="70" y="296" font-size="14" fill="#2f3a2b" text-anchor="middle">in a draw</text><rect x="250" y="130" width="40" height="26" rx="4" fill="#9a9a8f"/><circle cx="270" cy="168" r="9.0" fill="#4a7fb0"/><text x="300" y="110" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Seep below rock</text><text x="330" y="230" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cottonwood,</text><text x="330" y="248" font-size="14" fill="#2f3a2b" text-anchor="middle">willow: water near</text>
</svg>
