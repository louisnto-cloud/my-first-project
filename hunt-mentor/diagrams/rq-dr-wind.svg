<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Drill stop 5, a slope drawn as a map. A timbered ridge across the top, a grass bench below it where deer feed. A north wind blows down from the ridge, while the morning thermal rises up the slope. Two possible routes to a seat: A from straight below, B from the side, across the slope. The answer is in the More section.">
