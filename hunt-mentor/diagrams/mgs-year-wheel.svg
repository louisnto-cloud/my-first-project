<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 426" font-family="sans-serif" role="img" aria-label="A Canada goose year in BC, month by month. Winter, in green: January, winter flocks on open water; February, pairs firm up and move north. Nesting, in orange: March, nesting starts mid month; April, eggs, 25 to 28 days; May, goslings hatch and walk off. Moult and young, in blue: June, moult, cannot fly; July, young grow fast; August, young fly at 6 to 9 weeks. Fall season, in dark: September, big local birds, early season; October, migrants arrive; November, lakes freeze and birds drop down to open valley water; December, cold, feed in the afternoon.">
<rect width="400" height="426" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A Canada goose year in BC</text>
<rect x="8" y="42" width="189" height="52" rx="7" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.8"/>
<path d="M15 42 H54 V94 H15 A7 7 0 0 1 8 87 V49 A7 7 0 0 1 15 42z" fill="#8a9a6b"/>
<text x="31" y="73.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Jan</text>
<text x="62" y="64" font-size="15" fill="#2f3a2b">Winter flocks,</text>
<text x="62" y="83" font-size="15" fill="#2f3a2b">open water</text>
<rect x="8" y="100" width="189" height="52" rx="7" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.8"/>
<path d="M15 100 H54 V152 H15 A7 7 0 0 1 8 145 V107 A7 7 0 0 1 15 100z" fill="#8a9a6b"/>
<text x="31" y="131.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Feb</text>
<text x="62" y="122" font-size="15" fill="#2f3a2b">Pairs firm up,</text>
<text x="62" y="141" font-size="15" fill="#2f3a2b">move north</text>
<rect x="8" y="158" width="189" height="52" rx="7" fill="#fffaf0" stroke="#e8590c" stroke-width="1.8"/>
<path d="M15 158 H54 V210 H15 A7 7 0 0 1 8 203 V165 A7 7 0 0 1 15 158z" fill="#e8590c"/>
<text x="31" y="189.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Mar</text>
<text x="62" y="180" font-size="15" fill="#2f3a2b">Nesting starts mid</text>
<text x="62" y="199" font-size="15" fill="#2f3a2b">month</text>
<rect x="8" y="216" width="189" height="52" rx="7" fill="#fffaf0" stroke="#e8590c" stroke-width="1.8"/>
<path d="M15 216 H54 V268 H15 A7 7 0 0 1 8 261 V223 A7 7 0 0 1 15 216z" fill="#e8590c"/>
<text x="31" y="247.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Apr</text>
<text x="62" y="238" font-size="15" fill="#2f3a2b">Eggs: 25 to 28</text>
<text x="62" y="257" font-size="15" fill="#2f3a2b">days</text>
<rect x="8" y="274" width="189" height="52" rx="7" fill="#fffaf0" stroke="#e8590c" stroke-width="1.8"/>
<path d="M15 274 H54 V326 H15 A7 7 0 0 1 8 319 V281 A7 7 0 0 1 15 274z" fill="#e8590c"/>
<text x="31" y="305.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">May</text>
<text x="62" y="296" font-size="15" fill="#2f3a2b">Goslings hatch,</text>
<text x="62" y="315" font-size="15" fill="#2f3a2b">walk off</text>
<rect x="8" y="332" width="189" height="52" rx="7" fill="#fffaf0" stroke="#4a7fb0" stroke-width="1.8"/>
<path d="M15 332 H54 V384 H15 A7 7 0 0 1 8 377 V339 A7 7 0 0 1 15 332z" fill="#4a7fb0"/>
<text x="31" y="363.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Jun</text>
<text x="62" y="363.5" font-size="15" fill="#2f3a2b">Moult: cannot fly</text>
<rect x="203" y="42" width="189" height="52" rx="7" fill="#fffaf0" stroke="#4a7fb0" stroke-width="1.8"/>
<path d="M210 42 H249 V94 H210 A7 7 0 0 1 203 87 V49 A7 7 0 0 1 210 42z" fill="#4a7fb0"/>
<text x="226" y="73.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Jul</text>
<text x="257" y="73.5" font-size="15" fill="#2f3a2b">Young grow fast</text>
<rect x="203" y="100" width="189" height="52" rx="7" fill="#fffaf0" stroke="#4a7fb0" stroke-width="1.8"/>
<path d="M210 100 H249 V152 H210 A7 7 0 0 1 203 145 V107 A7 7 0 0 1 210 100z" fill="#4a7fb0"/>
<text x="226" y="131.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Aug</text>
<text x="257" y="122" font-size="15" fill="#2f3a2b">Young fly at 6 to</text>
<text x="257" y="141" font-size="15" fill="#2f3a2b">9 weeks</text>
<rect x="203" y="158" width="189" height="52" rx="7" fill="#fffaf0" stroke="#2f3a2b" stroke-width="1.8"/>
<path d="M210 158 H249 V210 H210 A7 7 0 0 1 203 203 V165 A7 7 0 0 1 210 158z" fill="#2f3a2b"/>
<text x="226" y="189.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Sep</text>
<text x="257" y="180" font-size="15" fill="#2f3a2b">Big local birds;</text>
<text x="257" y="199" font-size="15" fill="#2f3a2b">early season</text>
<rect x="203" y="216" width="189" height="52" rx="7" fill="#fffaf0" stroke="#2f3a2b" stroke-width="1.8"/>
<path d="M210 216 H249 V268 H210 A7 7 0 0 1 203 261 V223 A7 7 0 0 1 210 216z" fill="#2f3a2b"/>
<text x="226" y="247.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Oct</text>
<text x="257" y="247.5" font-size="15" fill="#2f3a2b">Migrants arrive</text>
<rect x="203" y="274" width="189" height="52" rx="7" fill="#fffaf0" stroke="#2f3a2b" stroke-width="1.8"/>
<path d="M210 274 H249 V326 H210 A7 7 0 0 1 203 319 V281 A7 7 0 0 1 210 274z" fill="#2f3a2b"/>
<text x="226" y="305.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Nov</text>
<text x="257" y="296" font-size="15" fill="#2f3a2b">Lakes freeze,</text>
<text x="257" y="315" font-size="15" fill="#2f3a2b">birds drop down</text>
<rect x="203" y="332" width="189" height="52" rx="7" fill="#fffaf0" stroke="#2f3a2b" stroke-width="1.8"/>
<path d="M210 332 H249 V384 H210 A7 7 0 0 1 203 377 V339 A7 7 0 0 1 210 332z" fill="#2f3a2b"/>
<text x="226" y="363.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Dec</text>
<text x="257" y="354" font-size="15" fill="#2f3a2b">Cold: feed in the</text>
<text x="257" y="373" font-size="15" fill="#2f3a2b">afternoon</text>
<rect x="12" y="397" width="14" height="14" rx="3" fill="#e8590c"/>
<text x="31" y="409" font-size="15" fill="#2f3a2b">Nesting</text>
<rect x="97.2" y="397" width="14" height="14" rx="3" fill="#4a7fb0"/>
<text x="116.2" y="409" font-size="15" fill="#2f3a2b">Moult, young</text>
<rect x="219.0" y="397" width="14" height="14" rx="3" fill="#2f3a2b"/>
<text x="238" y="409" font-size="15" fill="#2f3a2b">Fall season</text>
<rect x="332.70000000000005" y="397" width="14" height="14" rx="3" fill="#8a9a6b"/>
<text x="351.7" y="409" font-size="15" fill="#2f3a2b">Winter</text>
</svg>
