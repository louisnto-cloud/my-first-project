<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A goose year, month by month. January: winter flocks on open water. February: pairs firm up and move north. March: nests from mid March. April: eggs, 25 to 28 days. May: goslings hatch and walk off. June: moult, cannot fly. July: young grow fast. August: young fly at 6 to 9 weeks. September: big local birds, early season. October: migrants arrive. November: lakes freeze and birds drop down to open valley water. December: cold, feed in the afternoon.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A Canada goose year in BC</text><rect x="12" y="34" width="190" height="38" rx="6" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><rect x="12" y="34" width="44" height="38" rx="6" fill="#8a9a6b"/><text x="34" y="58" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Jan</text><text x="62" y="50" font-size="13.5" fill="#23261f" text-anchor="start">Winter flocks, open</text><text x="62" y="66" font-size="13.5" fill="#23261f" text-anchor="start">water</text><rect x="12" y="75" width="190" height="38" rx="6" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><rect x="12" y="75" width="44" height="38" rx="6" fill="#8a9a6b"/><text x="34" y="99" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Feb</text><text x="62" y="91" font-size="13.5" fill="#23261f" text-anchor="start">Pairs firm up, move</text><text x="62" y="107" font-size="13.5" fill="#23261f" text-anchor="start">north</text><rect x="12" y="116" width="190" height="38" rx="6" fill="#fff" stroke="#e8590c" stroke-width="2"/><rect x="12" y="116" width="44" height="38" rx="6" fill="#e8590c"/><text x="34" y="140" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Mar</text><text x="62" y="140" font-size="13.5" fill="#23261f" text-anchor="start">Nests from mid March</text><rect x="12" y="157" width="190" height="38" rx="6" fill="#fff" stroke="#e8590c" stroke-width="2"/><rect x="12" y="157" width="44" height="38" rx="6" fill="#e8590c"/><text x="34" y="181" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Apr</text><text x="62" y="181" font-size="13.5" fill="#23261f" text-anchor="start">Eggs: 25 to 28 days</text><rect x="12" y="198" width="190" height="38" rx="6" fill="#fff" stroke="#e8590c" stroke-width="2"/><rect x="12" y="198" width="44" height="38" rx="6" fill="#e8590c"/><text x="34" y="222" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">May</text><text x="62" y="214" font-size="13.5" fill="#23261f" text-anchor="start">Goslings hatch, walk</text><text x="62" y="230" font-size="13.5" fill="#23261f" text-anchor="start">off</text><rect x="12" y="239" width="190" height="38" rx="6" fill="#fff" stroke="#4a7fb0" stroke-width="2"/><rect x="12" y="239" width="44" height="38" rx="6" fill="#4a7fb0"/><text x="34" y="263" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Jun</text><text x="62" y="263" font-size="13.5" fill="#23261f" text-anchor="start">Moult: cannot fly</text><rect x="208" y="34" width="190" height="38" rx="6" fill="#fff" stroke="#4a7fb0" stroke-width="2"/><rect x="208" y="34" width="44" height="38" rx="6" fill="#4a7fb0"/><text x="230" y="58" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Jul</text><text x="258" y="58" font-size="13.5" fill="#23261f" text-anchor="start">Young grow fast</text><rect x="208" y="75" width="190" height="38" rx="6" fill="#fff" stroke="#4a7fb0" stroke-width="2"/><rect x="208" y="75" width="44" height="38" rx="6" fill="#4a7fb0"/><text x="230" y="99" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Aug</text><text x="258" y="91" font-size="13.5" fill="#23261f" text-anchor="start">Young fly at 6 to 9</text><text x="258" y="107" font-size="13.5" fill="#23261f" text-anchor="start">weeks</text><rect x="208" y="116" width="190" height="38" rx="6" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><rect x="208" y="116" width="44" height="38" rx="6" fill="#2f3a2b"/><text x="230" y="140" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Sep</text><text x="258" y="132" font-size="13.5" fill="#23261f" text-anchor="start">Big local birds;</text><text x="258" y="148" font-size="13.5" fill="#23261f" text-anchor="start">early season</text><rect x="208" y="157" width="190" height="38" rx="6" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><rect x="208" y="157" width="44" height="38" rx="6" fill="#2f3a2b"/><text x="230" y="181" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Oct</text><text x="258" y="181" font-size="13.5" fill="#23261f" text-anchor="start">Migrants arrive</text><rect x="208" y="198" width="190" height="38" rx="6" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><rect x="208" y="198" width="44" height="38" rx="6" fill="#2f3a2b"/><text x="230" y="222" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Nov</text><text x="258" y="214" font-size="13.5" fill="#23261f" text-anchor="start">Lakes freeze, birds</text><text x="258" y="230" font-size="13.5" fill="#23261f" text-anchor="start">drop down</text><rect x="208" y="239" width="190" height="38" rx="6" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><rect x="208" y="239" width="44" height="38" rx="6" fill="#2f3a2b"/><text x="230" y="263" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Dec</text><text x="258" y="255" font-size="13.5" fill="#23261f" text-anchor="start">Cold: feed in the</text><text x="258" y="271" font-size="13.5" fill="#23261f" text-anchor="start">afternoon</text><text x="200" y="296" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Orange: nesting. Blue: moult. Dark: fall season</text>
</svg>
