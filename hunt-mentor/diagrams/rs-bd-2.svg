<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 2: look at the hair. Colour and length help name the animal. Lots of hair suggests it lay there a long time.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">2. Hair</text>
<line x1="120" y1="120" x2="150" y2="110" stroke="#9a8160" stroke-width="3"/><line x1="138" y1="128" x2="168" y2="118" stroke="#b9a98a" stroke-width="3"/><line x1="156" y1="136" x2="186" y2="126" stroke="#6e5b42" stroke-width="3"/><line x1="174" y1="120" x2="204" y2="110" stroke="#9a8160" stroke-width="3"/><line x1="192" y1="128" x2="222" y2="118" stroke="#b9a98a" stroke-width="3"/><line x1="210" y1="136" x2="240" y2="126" stroke="#6e5b42" stroke-width="3"/><line x1="228" y1="120" x2="258" y2="110" stroke="#9a8160" stroke-width="3"/><line x1="246" y1="128" x2="276" y2="118" stroke="#b9a98a" stroke-width="3"/><rect x="80" y="160" width="240" height="50" rx="8" fill="#fff" stroke="#23261f" stroke-width="1.5"/><text x="200" y="190" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Colour, length, how many</text><text x="200" y="250" font-size="15" fill="#23261f" text-anchor="middle">Grey brown: deer. Black: bear (65%)</text><text x="200" y="274" font-size="15" fill="#6b4f35" text-anchor="middle">Lots of hair: it lay a long time (Tip)</text>
</svg>
