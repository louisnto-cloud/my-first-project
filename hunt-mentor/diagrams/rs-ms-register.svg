<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three ways the hind foot lands. Direct register: hind print lands in the front print, so you see one print. Overstep: hind lands past the front, a faster walk. Understep: hind lands short of the front, a slow walk.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Where the hind foot lands</text>
<text x="200" y="50" font-size="14" fill="#6b4f35" text-anchor="middle">Travel is up the page</text>
<rect x="12" y="62" width="116" height="170" rx="10" fill="#dfe6d3"/><g transform="translate(70 150) rotate(0) scale(1.3)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><g transform="translate(70 148) rotate(0) scale(1.15)" fill="#e8590c" fill-opacity=".6"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><text x="70" y="252" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Direct</text><text x="70" y="272" font-size="14" fill="#23261f" text-anchor="middle">hind in front</text><rect x="142" y="62" width="116" height="170" rx="10" fill="#dfe6d3"/><g transform="translate(200 175) rotate(0) scale(1.3)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><g transform="translate(204 120) rotate(0) scale(1.15)" fill="#e8590c"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><text x="200" y="252" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Overstep</text><text x="200" y="272" font-size="14" fill="#23261f" text-anchor="middle">hind past front</text><rect x="272" y="62" width="116" height="170" rx="10" fill="#dfe6d3"/><g transform="translate(330 120) rotate(0) scale(1.3)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><g transform="translate(326 180) rotate(0) scale(1.15)" fill="#e8590c"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><text x="330" y="252" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Understep</text><text x="330" y="272" font-size="14" fill="#23261f" text-anchor="middle">hind short</text><rect x="130" y="282" width="12" height="12" rx="2" fill="#8b5a2b"/><text x="147" y="293" font-size="14" fill="#23261f" text-anchor="start">front</text><rect x="200" y="282" width="12" height="12" rx="2" fill="#e8590c"/><text x="217" y="293" font-size="14" fill="#23261f" text-anchor="start">hind</text>
</svg>
