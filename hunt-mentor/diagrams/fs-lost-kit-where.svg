<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three layers of kit: pockets hold the whistle, lighter, tourniquet and phone; the day pack holds the 10 essentials and a shelter; the truck holds extras, food and a sleeping bag. If you drop the pack, the pockets still save you.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Three layers of kit</text><rect x="20" y="50" width="360" height="54" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/><text x="200" y="82" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pockets: whistle, lighter, TQ, phone</text><rect x="40" y="116" width="320" height="54" rx="8" fill="#fff3d6" stroke="#e8590c" stroke-width="2"/><text x="200" y="148" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Day pack: 10 essentials, shelter</text><rect x="60" y="182" width="280" height="54" rx="8" fill="#eef5e6" stroke="#2e7d32" stroke-width="2"/><text x="200" y="214" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Truck: food, sleeping bag</text><text x="200" y="270" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Drop the pack? Pockets still save you</text>
</svg>
