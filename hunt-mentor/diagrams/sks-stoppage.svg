<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Click, no bang: 1 click, no bang. 2 keep the muzzle safe and count to 30. 3 pull the handle back and watch the round eject. 4 let go to chamber a new round. 5 aim and try again. 6 if it happens again, unload, strip and inspect.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Click, no bang</text>
<circle cx="36.0" cy="56.0" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="2"/><text x="36.0" y="61.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="56.0" y="61.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Click, no bang.</text><circle cx="36.0" cy="90.0" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="2"/><text x="36.0" y="95.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="56.0" y="95.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Muzzle safe. Count to 30.</text><circle cx="36.0" cy="124.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="36.0" y="129.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="56.0" y="129.0" font-size="14" fill="#17201A" text-anchor="start">Handle back: watch the round fly.</text><circle cx="36.0" cy="158.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="36.0" y="163.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="56.0" y="163.0" font-size="14" fill="#17201A" text-anchor="start">Let go: a new round chambers.</text><circle cx="36.0" cy="192.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="36.0" y="197.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text><text x="56.0" y="197.0" font-size="14" fill="#17201A" text-anchor="start">Aim and try again.</text><circle cx="36.0" cy="226.0" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="2"/><text x="36.0" y="231.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text><text x="56.0" y="231.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Again? Unload, strip, inspect.</text>
<text x="200.0" y="288.0" font-size="14" fill="#17201A" text-anchor="middle">Step 2 is a Tip. The rest is the army drill.</text>
</svg>
