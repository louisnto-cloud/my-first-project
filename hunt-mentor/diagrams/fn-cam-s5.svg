f3a2b"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" fill="none"/></g><text x="140" y="290" font-family="sans-serif" font-size="14" fill="#c92a2a" text-anchor="middle" font-weight="bold">Side by side: two shapes</text><g transform="translate(260 250) scale(0.7)"><circle cx="0" cy="-30" r="7" fill="#2f3a2b"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" fill="none"/></g><text x="330" y="290" font-family="sans-serif" font-size="14" fill="#8a9a6b" text-anchor="middle" font-weight="bold">One moves at a time</text><text x="20" y="290" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start"></text>
