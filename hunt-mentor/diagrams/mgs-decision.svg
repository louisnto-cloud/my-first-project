<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A problem and fix chart, all Tip. Geese landing elsewhere: move there next time. Flaring far out: check the hide, faces, shine and spent hulls. Circling but not finishing: call less and open the landing hole. Wind swung: turn the spread with it.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">On the day: what is going wrong?</text><rect x="12" y="42" width="180" height="50" rx="8" fill="#e8590c"/><text x="102" y="72" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Landing elsewhere?</text><line x1="196" y1="67" x2="214.0" y2="67.0" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="214.0,67.0 206.8,70.5 206.8,63.5" fill="#e8590c"/><rect x="218" y="42" width="170" height="50" rx="8" fill="#fff" stroke="#e8590c" stroke-width="2"/><text x="303" y="72" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Move there next time</text><rect x="12" y="104" width="180" height="50" rx="8" fill="#4a7fb0"/><text x="102" y="134" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Flaring far out?</text><line x1="196" y1="129" x2="214.0" y2="129.0" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><polygon points="214.0,129.0 206.8,132.5 206.8,125.5" fill="#4a7fb0"/><rect x="218" y="104" width="170" height="50" rx="8" fill="#fff" stroke="#4a7fb0" stroke-width="2"/><text x="303" y="134" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hide, faces, shine, hulls</text><rect x="12" y="166" width="180" height="50" rx="8" fill="#2f3a2b"/><text x="102" y="196" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Circling, not finishing?</text><line x1="196" y1="191" x2="214.0" y2="191.0" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><polygon points="214.0,191.0 206.8,194.5 206.8,187.5" fill="#2f3a2b"/><rect x="218" y="166" width="170" height="50" rx="8" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><text x="303" y="196" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Call less, open the hole</text><rect x="12" y="228" width="180" height="50" rx="8" fill="#8b5a2b"/><text x="102" y="258" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Wind swung?</text><line x1="196" y1="253" x2="214.0" y2="253.0" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/><polygon points="214.0,253.0 206.8,256.5 206.8,249.5" fill="#8b5a2b"/><rect x="218" y="228" width="170" height="50" rx="8" fill="#fff" stroke="#8b5a2b" stroke-width="2"/><text x="303" y="258" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Turn the spread with it</text><text x="200" y="294" font-size="14" fill="#2f3a2b" text-anchor="middle">All Tip: from goose guides, not studies</text>
</svg>
