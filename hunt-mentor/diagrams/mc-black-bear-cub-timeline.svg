<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Timeline of a black bear cub from the BC account. Mating early June to mid July. Delayed implantation: the embryo implants in October or November. Cubs born in the den in January or February, hairless and about 400 grams. Leave the den in spring at 2 to 5 kilograms. Weaned July to September. Den with the mother the first winter. On their own by the middle or end of their second spring.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">From mating to a bear on its own</text><circle cx="40" cy="66" r="8" fill="#2f3a2b"/><line x1="40" y1="74" x2="40" y2="91" stroke="#2f3a2b" stroke-width="3"/><text x="60" y="71" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Jun to Jul</text><text x="170" y="71" font-size="15" fill="#23261f" text-anchor="start">Mating</text><circle cx="40" cy="99" r="8" fill="#2f3a2b"/><line x1="40" y1="107" x2="40" y2="124" stroke="#2f3a2b" stroke-width="3"/><text x="60" y="104" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Oct to Nov</text><text x="170" y="104" font-size="15" fill="#23261f" text-anchor="start">Embryo implants</text><circle cx="40" cy="132" r="8" fill="#e8590c"/><line x1="40" y1="140" x2="40" y2="157" stroke="#2f3a2b" stroke-width="3"/><text x="60" y="137" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Jan to Feb</text><text x="170" y="137" font-size="15" fill="#23261f" text-anchor="start">Born, about 400 g</text><circle cx="40" cy="165" r="8" fill="#2f3a2b"/><line x1="40" y1="173" x2="40" y2="190" stroke="#2f3a2b" stroke-width="3"/><text x="60" y="170" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Apr to May</text><text x="170" y="170" font-size="15" fill="#23261f" text-anchor="start">Out, 2 to 5 kg</text><circle cx="40" cy="198" r="8" fill="#2f3a2b"/><line x1="40" y1="206" x2="40" y2="223" stroke="#2f3a2b" stroke-width="3"/><text x="60" y="203" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Jul to Sep</text><text x="170" y="203" font-size="15" fill="#23261f" text-anchor="start">Weaned</text><circle cx="40" cy="231" r="8" fill="#2f3a2b"/><line x1="40" y1="239" x2="40" y2="256" stroke="#2f3a2b" stroke-width="3"/><text x="60" y="236" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">2nd winter</text><text x="170" y="236" font-size="15" fill="#23261f" text-anchor="start">Dens with mother</text><circle cx="40" cy="264" r="8" fill="#e8590c"/><text x="60" y="269" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">2nd spring</text><text x="170" y="269" font-size="15" fill="#23261f" text-anchor="start">On its own</text>
</svg>
