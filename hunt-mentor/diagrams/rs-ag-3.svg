<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 3: come back to your own print at 1 hour, 6 hours, 24 hours and 72 hours and watch the edges soften. Now you know how this ground ages.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3. Watch your print age</text>
<rect x="30" y="80" width="70" height="110" rx="8" fill="#dfe6d3"/><path d="M34 120 H45.0 Q49.0 120 50.666666666666664 160 H79.33333333333333 Q81.0 120 85.0 120 H96 V180 H34 Z" fill="#c9b79c" stroke="#6b4f35" stroke-width="2"/><text x="65" y="215" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">1 h</text><rect x="120" y="80" width="70" height="110" rx="8" fill="#dfe6d3"/><path d="M124 120 H131.5 Q142.5 120 143.0 154 H167.0 Q167.5 120 178.5 120 H186 V180 H124 Z" fill="#c9b79c" stroke="#6b4f35" stroke-width="2"/><text x="155" y="215" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">6 h</text><rect x="210" y="80" width="70" height="110" rx="8" fill="#dfe6d3"/><path d="M214 120 H218.0 Q236.0 120 235.33333333333334 148 H254.66666666666666 Q254.0 120 272.0 120 H276 V180 H214 Z" fill="#c9b79c" stroke="#6b4f35" stroke-width="2"/><text x="245" y="215" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">24 h</text><rect x="300" y="80" width="70" height="110" rx="8" fill="#dfe6d3"/><path d="M304 120 H304.5 Q329.5 120 327.6666666666667 142 H342.3333333333333 Q340.5 120 365.5 120 H366 V180 H304 Z" fill="#c9b79c" stroke="#6b4f35" stroke-width="2"/><text x="335" y="215" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">72 h</text><circle cx="330" cy="138" r="3" fill="#8a9a6b"/><circle cx="340" cy="139" r="3" fill="#8a9a6b"/><text x="200" y="255" font-size="15" fill="#23261f" text-anchor="middle">Check your print at 4 times</text><text x="200" y="278" font-size="15" fill="#6b4f35" text-anchor="middle">Now you know this ground</text>
