<text x="68" y="322" font-size="17" font-weight="bold" fill="#2f3a2b">Dry in shade.</text>
<text x="68" y="343" font-size="17" font-weight="bold" fill="#2f3a2b">Sun bleaches</text>
<rect x="345.5" y="314.0" width="38.5" height="24" rx="12.0" fill="#8a9a6b"/><text x="364.8" y="331.04" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Tip</text>
