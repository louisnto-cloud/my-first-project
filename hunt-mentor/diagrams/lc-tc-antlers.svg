<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 364" font-family="sans-serif" role="img" aria-label="Antler care. Law: keep the species licence with the antlers. Law: antlers from an antler restricted season are not cut or sawed until the carcass is at a meat cutter, cold storage, home and butchered, or inspected. Law: for a mounted trophy, keep the licence and any inspection report indefinitely. Law: cast or shed antlers can be picked up and traded. Tip: dry antlers in the shade, sun bleaches them.">
<rect width="400" height="364" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Antlers: the law and the care</text>
<rect x="8" y="42" width="384" height="56" rx="9" fill="#fffaf0" stroke="#2f3a2b" stroke-width="1.6"/>
<rect x="14" y="48" width="44" height="44" rx="7" fill="#f4eedf"/><g transform="translate(36 70.0)"><rect x="-16" y="-6" width="22" height="18" rx="2" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/><path d="M-12 0 H2 M-12 5 H-2" stroke="#2f3a2b" stroke-width="1.6"/><path d="M4 12 C6 2 10 -6 16 -12 M9 -1 L16 0 M12 -7 L10 -15" fill="none" stroke="#6b4f35" stroke-width="3.4" stroke-linecap="round"/></g>
<text x="68" y="66" font-size="17" font-weight="bold" fill="#2f3a2b">Licence stays with</text>
<text x="68" y="87" font-size="17" font-weight="bold" fill="#2f3a2b">the antlers</text>
<rect x="334.7" y="58.0" width="49.3" height="24" rx="12.0" fill="#2c5d86"/><text x="359.4" y="75.04" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">LAW</text>
<rect x="8" y="106" width="384" height="56" rx="9" fill="#fffaf0" stroke="#2f3a2b" stroke-width="1.6"/>
<rect x="14" y="112" width="44" height="44" rx="7" fill="#f4eedf"/><g transform="translate(36 134.0)"><path d="M-6 14 C-4 2 0 -6 6 -14 M-2 0 L-12 -4 M2 -7 L8 -2" fill="none" stroke="#6b4f35" stroke-width="3.4" stroke-linecap="round"/><circle r="16" fill="none" stroke="#c0392b" stroke-width="3"/><path d="M-11 11 L11 -11" stroke="#c0392b" stroke-width="3"/></g>
<text x="68" y="130" font-size="17" font-weight="bold" fill="#2f3a2b">Restricted season: no</text>
<text x="68" y="151" font-size="17" font-weight="bold" fill="#2f3a2b">cutting or sawing</text>
<rect x="334.7" y="122.0" width="49.3" height="24" rx="12.0" fill="#2c5d86"/><text x="359.4" y="139.04" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">LAW</text>
<rect x="8" y="170" width="384" height="56" rx="9" fill="#fffaf0" stroke="#2f3a2b" stroke-width="1.6"/>
<rect x="14" y="176" width="44" height="44" rx="7" fill="#f4eedf"/><g transform="translate(36 198.0)"><path d="M-11 -2 H11 L8 15 H-8z" fill="#8b5a2b" stroke="#2f3a2b" stroke-width="1.4"/><path d="M-4 -2 C-8 -8 -12 -12 -14 -16 M-8 -8 L-14 -6 M4 -2 C8 -8 12 -12 14 -16 M8 -8 L14 -6" fill="none" stroke="#6b4f35" stroke-width="3" stroke-linecap="round"/></g>
<text x="68" y="194" font-size="17" font-weight="bold" fill="#2f3a2b">Mounted: keep the</text>
<text x="68" y="215" font-size="17" font-weight="bold" fill="#2f3a2b">licence for good</text>
<rect x="334.7" y="186.0" width="49.3" height="24" rx="12.0" fill="#2c5d86"/><text x="359.4" y="203.04" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">LAW</text>
<rect x="8" y="234" width="384" height="56" rx="9" fill="#fffaf0" stroke="#2f3a2b" stroke-width="1.6"/>
<rect x="14" y="240" width="44" height="44" rx="7" fill="#f4eedf"/><g transform="translate(36 262.0)"><path d="M-17 10 H17" stroke="#8a9a6b" stroke-width="3"/><path d="M-14 7 C-6 4 4 4 13 -4 M-4 5 L-6 -6 M4 3 L4 -9 M10 -1 L15 -10" fill="none" stroke="#6b4f35" stroke-width="3.4" stroke-linecap="round"/></g>
<text x="68" y="258" font-size="17" font-weight="bold" fill="#2f3a2b">Shed antlers:</text>
<text x="68" y="279" font-size="17" font-weight="bold" fill="#2f3a2b">pick up, trade</text>
<rect x="334.7" y="250.0" width="49.3" height="24" rx="12.0" fill="#2c5d86"/><text x="359.4" y="267.04" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">LAW</text>
