<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 386" font-family="sans-serif" role="img" aria-label="Antler care. Law: keep the species licence with the antlers. Law: antlers from an antler restricted season are not cut or sawed until the carcass is at a meat cutter, cold storage, home and butchered, or inspected. Law: for a mounted trophy, keep the licence and any inspection report indefinitely. Law: cast or shed antlers can be picked up and traded. Tip: dry antlers in the shade, sun bleaches them.">
<rect x="0" y="0" width="400" height="386" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Antlers: the law and the care</text><rect x="10" y="44" width="380" height="62" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(40 78) scale(0.9)"><path d="M-14 -18 H8 L16 -10 V18 H-14 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -6 H10 M-8 2 H10 M-8 10 H4" stroke="#8a9a6b" stroke-width="2.5"/></g><rect x="336" y="82" width="48" height="20" rx="10" fill="#4a7fb0"/><text x="360" y="97" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">LAW</text><text x="68" y="68" font-size="16" font-weight="bold" fill="#23261f" text-anchor="start">Licence stays with the antlers</text><rect x="10" y="112" width="380" height="62" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(40 146) scale(0.9)"><path d="M-4 18 Q-10 0 -6 -18 M-7 -2 L-18 -8 M-6 -12 L-14 -20 M4 18 Q10 0 6 -18 M7 -2 L18 -8 M6 -12 L14 -20" stroke="#6b4f35" stroke-width="3.5" fill="none" stroke-linecap="round"/></g><rect x="336" y="150" width="48" height="20" rx="10" fill="#4a7fb0"/><text x="360" y="165" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">LAW</text><text x="68" y="136" font-size="16" font-weight="bold" fill="#23261f" text-anchor="start">Restricted season: no cutting or</text><text x="68" y="156" font-size="16" font-weight="bold" fill="#23261f" text-anchor="start">sawing</text><rect x="10" y="180" width="380" height="62" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(40 214) scale(0.9)"><path d="M0 -12 Q-10 -18 -20 -14 V16 Q-10 12 0 18 Q10 12 20 16 V-14 Q10 -18 0 -12 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -12 V18" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="336" y="218" width="48" height="20" rx="10" fi