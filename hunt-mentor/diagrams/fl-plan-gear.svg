<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 254" font-family="sans-serif" role="img" aria-label="When to buy gear, a tip, across the year from January to December. Winter: big buys and sales. Spring: fit the pack and break in boots. Summer: test every item on training hikes. Fall: nothing new, only replacements.">
