<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two columns comparing a beginner and an old hand, opinion. Walks a lot vs sits and glasses. Checks the wind once vs all day. Hunts the road vs walks 1 km past it. Rushes the stalk vs plans with landmarks. Shoots at a rump vs waits for broadside. Gives up at noon vs stalks the bed.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">What an old hand does differently</text><text x="105" y="54" font-size="16" fill="#6b4f35" text-anchor="middle" font-weight="bold">Beginner</text><text x="295" y="54" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Old hand</text><rect x="10" y="66" width="190" height="30" rx="6" fill="#efe6d6"/><rect x="205" y="66" width="185" height="30" rx="6" fill="#dfe6d3"/><text x="105" y="86" font-size="14" fill="#23261f" text-anchor="middle">Walks a lot</text><text x="297" y="86" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Sits and glasses</text><rect x="10" y="102" width="190" height="30" rx="6" fill="#efe6d6"/><rect x="205" y="102" width="185" height="30" rx="6" fill="#dfe6d3"/><text x="105" y="122" font-size="14" fill="#23261f" text-anchor="middle">Checks wind once</text><text x="297" y="122" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Checks it all day</text><rect x="10" y="138" width="190" height="30" rx="6" fill="#efe6d6"/><rect x="205" y="138" width="185" height="30" rx="6" fill="#dfe6d3"/><text x="105" y="158" font-size="14" fill="#23261f" text-anchor="middle">Hunts the road</text><text x="297" y="158" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Walks 1 km past it</text><rect x="10" y="174" width="190" height="30" rx="6" fill="#efe6d6"/><rect x="205" y="174" width="185" height="30" rx="6" fill="#dfe6d3"/><text x="105" y="194" font-size="14" fill="#23261f" text-anchor="middle">Rushes the stalk</text><text x="297" y="194" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Plans with landmarks</text><rect x="10" y="210" width="190" height="30" rx="6" fill="#efe6d6"/><rect x="205" y="210" width="185" height="30" rx="6" fill="#dfe6d3"/><text x="105" y="230" font-size="14" fill="#23261f" text-anchor="middle">Shoots at a rump</text><text x="297" y="230" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Waits for broadside</text><rect x="10" y="246" width="190" height="30" rx="6" fill="#efe6d6"/><rect x="205" y="246" width="185" height="30" rx="6" fill="#dfe6d3"/><text x="105" y="266" font-size="14" fill="#23261f" text-anchor="middle">Gives up at noon</text><text x="297" y="266" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Stalks the bed</text><text x="200" y="294" font-size="14" fill="#6b4f35" text-anchor="middle">Hunter educator consensus (Tip)</text>
</svg>
