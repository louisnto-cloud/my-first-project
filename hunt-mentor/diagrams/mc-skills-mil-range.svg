<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A scope reticle with mil marks. A deer chest fills 3 mils. Formula: metres equals size in metres times 1,000 divided by mils, 85 percent. Example: 0.46 metre chest times 1,000 divided by 3 is 153 metres. The 46 centimetre chest depth is hunter lore, tip only. Second focal plane marks are true at one power only.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Range it with the reticle</text><circle cx="110" cy="150" r="90" fill="#fffaf0" stroke="#23261f" stroke-width="3"/><line x1="20" y1="150" x2="200" y2="150" stroke="#23261f" stroke-width="1.5"/><line x1="110" y1="60" x2="110" y2="240" stroke="#23261f" stroke-width="1.5"/><line x1="106" y1="78" x2="114" y2="78" stroke="#23261f" stroke-width="2"/><line x1="106" y1="96" x2="114" y2="96" stroke="#23261f" stroke-width="2"/><line x1="106" y1="114" x2="114" y2="114" stroke="#23261f" stroke-width="2"/><line x1="106" y1="132" x2="114" y2="132" stroke="#23261f" stroke-width="2"/><line x1="106" y1="150" x2="114" y2="150" stroke="#23261f" stroke-width="2"/><line x1="106" y1="168" x2="114" y2="168" stroke="#23261f" stroke-width="2"/><line x1="106" y1="186" x2="114" y2="186" stroke="#23261f" stroke-width="2"/><line x1="106" y1="204" x2="114" y2="204" stroke="#23261f" stroke-width="2"/><line x1="106" y1="222" x2="114" y2="222" stroke="#23261f" stroke-width="2"/><path d="M120 114 Q 170 112 190 130 L192 168 Q 160 176 124 170 Z" fill="#8b5a2b"/><line x1="196" y1="114" x2="196" y2="168" stroke="#e8590c" stroke-width="3"/><text x="110" y="264" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">chest = 3 mils</text><rect x="220" y="52" width="168" height="130" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="304" y="76" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">metres =</text><text x="304" y="98" font-size="14" fill="#23261f" text-anchor="middle">size (m) × 1,000</text><text x="304" y="118" font-size="14" fill="#23261f" text-anchor="middle">÷ mils (85%)</text><text x="304" y="146" font-size="14" fill="#23261f" text-anchor="middle">0.46 × 1,000 ÷ 3</text><text x="304" y="166" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">= 153 m</text><text x="304" y="220" font-size="14" fill="#6b4f35" text-anchor="middle">46 cm chest: lore,</text><text x="304" y="238" font-size="14" fill="#6b4f35" text-anchor="middle">Tip only (55%)</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Second focal plane: true at one power (70%)</text>
</svg>
