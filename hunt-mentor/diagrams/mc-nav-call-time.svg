<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Timeline of an example mid October evening near Heffley Creek: turn around at 16:15, at the truck by 17:40, text home at 18:00, and home calls 911 at 21:00 if there is no word. Sunset about 18:08, my calculation, 85 percent. The times are an example, a Tip, not a rule.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Example evening: who does what</text><line x1="30" y1="150" x2="370" y2="150" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="150" r="9" fill="#2f3a2b"/><text x="50" y="128" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">16:15</text><text x="50" y="180" font-size="14" fill="#23261f" text-anchor="middle">Turn around</text><circle cx="130" cy="150" r="9" fill="#2f3a2b"/><text x="130" y="128" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">17:40</text><text x="130" y="180" font-size="14" fill="#23261f" text-anchor="middle">At truck</text><circle cx="210" cy="150" r="9" fill="#2f3a2b"/><text x="210" y="128" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">18:00</text><text x="210" y="180" font-size="14" fill="#23261f" text-anchor="middle">Text home</text><circle cx="300" cy="150" r="9" fill="#e8590c"/><text x="300" y="128" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">21:00</text><text x="300" y="180" font-size="14" fill="#23261f" text-anchor="middle">Home calls 911</text><circle cx="355" cy="70" r="12" fill="#f4b400"/><line x1="371.0" y1="70.0" x2="377.0" y2="70.0" stroke="#f4b400" stroke-width="3" stroke-linecap="round"/><line x1="366.31370849898474" y1="81.31370849898477" x2="370.55634918610406" y2="85.55634918610404" stroke="#f4b400" stroke-width="3" stroke-linecap="round"/><line x1="355.0" y1="86.0" x2="355.0" y2="92.0" stroke="#f4b400" stroke-width="3" stroke-linecap="round"/><line x1="343.68629150101526" y1="81.31370849898477" x2="339.44365081389594" y2="85.55634918610404" stroke="#f4b400" stroke-width="3" stroke-linecap="round"/><line x1="339.0" y1="70.0" x2="333.0" y2="70.0" stroke="#f4b400" stroke-width="3" stroke-linecap="round"/><line x1="343.68629150101526" y1="58.68629150101524" x2="339.44365081389594" y2="54.44365081389596" stroke="#f4b400" stroke-width="3" stroke-linecap="round"/><line x1="355.0" y1="54.0" x2="355.0" y2="48.0" stroke="#f4b400" stroke-width="3" stroke-linecap="round"/><line x1="366.31370849898474" y1="58.68629150101523" x2="370.55634918610406" y2="54.44365081389595" stroke="#f4b400" stroke-width="3" stroke-linecap="round"/><text x="355" y="108" font-size="14" fill="#6b4f35" text-anchor="end">Sunset 18:08</text><text x="200" y="232" font-size="15" fill="#23261f" text-anchor="middle">Mid October, Heffley Creek. Times are an</text><text x="200" y="254" font-size="15" fill="#23261f" text-anchor="middle">example, not a rule (Tip).</text><text x="200" y="288" font-size="14" fill="#6b4f35" text-anchor="middle">Sunset: my calculation (85%)</text>
