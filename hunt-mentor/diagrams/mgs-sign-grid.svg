<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Six tiles of goose sign: droppings, green tubes; tracks, webbed with three toes; feathers and down; clipped grass with the grain gone; calls at dawn and dusk; flocks seen from the road. Fresh sign plus birds seen means the X, a Tip.">
