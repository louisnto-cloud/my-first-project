<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 388" font-family="sans-serif" role="img" aria-label="Elevation on the Arctic is at the front sight. 1 turn the elevation screw clockwise; 2 the post moves down; 3 the shots move up on the target. Counterclockwise does the opposite. One click moves impact about 7 millimetres at 100 metres.">
<rect x="0" y="0" width="400" height="388" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Up and down: the front screw</text><rect x="-10.0" y="176.0" width="120.0" height="48.0" fill="#C9D0C6" stroke="#1F3D2B" stroke-width="1.4"/><rect x="110" y="168.0" width="92.0" height="64.0" rx="6.0" fill="#8F9A8C" stroke="#1F3D2B" stroke-width="1.6"/><path d="M114.0 168.0 L126.0 96.0 L142.0 96.0 L146.0 168.0Z" fill="#8F9A8C" stroke="#1F3D2B" stroke-width="1.4"/><path d="M170.0 168.0 L174.0 96.0 L190.0 96.0 L202.0 168.0Z" fill="#8F9A8C" stroke="#1F3D2B" stroke-width="1.4"/><rect x="148.0" y="112.0" width="18.0" height="56.0" fill="#3A463C" stroke="#1F3D2B" stroke-width="1.2"/><circle cx="157.0" cy="176.0" r="8.0" fill="#FF6A13" stroke="#1F3D2B" stroke-width="1.4"/><circle cx="130.0" cy="212.0" r="7.0" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.2"/><rect x="146.0" y="232.0" width="24.0" height="16.0" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.2"/><path d="M178 150 Q220 130 196 106" fill="none" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><path d="M196 106 L204.5 109.0 L199.0 114.5z" fill="#FF6A13"/><text x="250" y="112" font-size="15" fill="#FF6A13" text-anchor="start" font-weight="bold">Clockwise</text><line x1="157" y1="70" x2="157.0" y2="96.8" stroke="#1F3D2B" stroke-width="3" stroke-linecap="round"/><path d="M157 104 L153.1 95.9 L160.9 95.9z" fill="#1F3D2B"/><text x="40" y="66" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">Post goes down</text><rect x="234" y="160" width="156" height="86" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="270" cy="203" r="26" fill="none" stroke="#1F3D2B" stroke-width="2"/><circle cx="270" cy="203" r="12" fill="none" stroke="#1F3D2B" stroke-width="2"/><line x1="270" y1="230" x2="270.0" y2="207.2" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><path d="M270 200 L273.9 208.1 L266.1 208.1z" fill="#FF6A13"/><circle cx="270" cy="234" r="4" fill="#1F3D2B"/><text x="304" y="196" font-size="15" fill="#FF6A13" text-anchor="start" font-weight="bold">Shots</text><text x="304" y="216" font-size="15" fill="#FF6A13" text-anchor="start" font-weight="bold">go UP</text><circle cx="196" cy="80" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="196" y="85" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><circle cx="30" cy="84" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="89" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><circle cx="250" cy="150" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="250" y="155" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><circle cx="24" cy="273" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="278" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="40" y="278" font-size="14" fill="#17201A" text-anchor="start">Turn the elevation screw clockwise</text><circle cx="24" cy="295" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="300" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="40" y="300" font-size="14" fill="#17201A" text-anchor="start">The post moves down</text><circle cx="24" cy="317" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="322" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="40" y="322" font-size="14" fill="#17201A" text-anchor="start">Your shots move up</text><rect x="12" y="344" width="376" height="32" rx="6" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="200" y="365" font-size="15" fill="#1F3D2B" text-anchor="middle" font-weight="bold">1 click = about 7 mm at 100 m</text>
</svg>
