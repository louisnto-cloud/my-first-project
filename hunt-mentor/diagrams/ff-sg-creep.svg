<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Large hard steel pellets pass a tight choke and push against its cone. One maker calls this choke creep; it can deform the choke and lock it in the barrel. Use only chokes your gun maker rates for steel.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Big steel + tight choke = choke creep</text><rect x="30" y="120" width="200" height="60" rx="0" fill="#9a9e96" stroke="#2f3a2b" stroke-width="2"/><path d="M230 120 L300 132 L370 132 L370 168 L300 168 L230 180 Z" fill="#b6b9b3" stroke="#b3261e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180" cy="146" r="8" fill="#c0c0c0" stroke="#2f3a2b" stroke-width="1.5"/><circle cx="194" cy="154" r="8" fill="#c0c0c0" stroke="#2f3a2b" stroke-width="1.5"/><circle cx="208" cy="146" r="8" fill="#c0c0c0" stroke="#2f3a2b" stroke-width="1.5"/><circle cx="222" cy="154" r="8" fill="#c0c0c0" stroke="#2f3a2b" stroke-width="1.5"/><circle cx="236" cy="146" r="8" fill="#c0c0c0" stroke="#2f3a2b" stroke-width="1.5"/><circle cx="250" cy="154" r="8" fill="#c0c0c0" stroke="#2f3a2b" stroke-width="1.5"/><line x1="300" y1="210" x2="300" y2="172" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/><path d="M303.5 179.2 L300 172 L296.5 179.2" fill="none" stroke="#b3261e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="230" font-size="14" font-weight="bold" fill="#b3261e" text-anchor="middle">pushes the choke</text><text x="200" y="72" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Steel is hard. It does not squeeze.</text><text x="200.0" y="280" font-size="14" fill="#2f3a2b" text-anchor="middle">Use the chokes your maker rates for steel</text>
</svg>
