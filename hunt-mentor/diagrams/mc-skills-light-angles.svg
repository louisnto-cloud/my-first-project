<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A valley at sunrise. The sun is low behind the hunter, who sits in shade. Its light falls on the far slope where a deer stands lit up. Notes: early, glass openings and feeding slopes; later, glass shade, timber edges and beds. Glass far ground first thing, before heat haze, as Remi Warren advises.">
