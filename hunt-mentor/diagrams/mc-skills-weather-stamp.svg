<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two panels. Left: a hoof print with rain pits inside it was made before the rain. Right: a print that cuts through a frosted surface was made after the frost formed. Know the last three days of weather. A dark line of dew knocked off grass means this morning.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Weather stamps the time</text><rect x="14" y="44" width="180" height="190" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><rect x="206" y="44" width="180" height="190" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="104" y="66" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Rain pits inside</text><path d="M84 160 Q 78 124 98 100 L101 160 Z" fill="#b89a72" stroke="#23261f" stroke-width="1.5"/><path d="M124 160 Q 130 124 110 100 L107 160 Z" fill="#b89a72" stroke="#23261f" stroke-width="1.5"/><circle cx="92" cy="130" r="2.5" fill="#23261f"/><circle cx="116" cy="138" r="2.5" fill="#23261f"/><circle cx="94" cy="148" r="2.5" fill="#23261f"/><circle cx="118" cy="120" r="2.5" fill="#23261f"/><text x="104" y="196" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Made BEFORE</text><text x="104" y="216" font-size="14" fill="#23261f" text-anchor="middle">the rain (70%)</text><rect x="216" y="80" width="160" height="100" rx="6" fill="#9fb0c0"/><text x="296" y="66" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Cuts through frost</text><path d="M276 160 Q 270 124 290 100 L293 160 Z" fill="#b89a72" stroke="#23261f" stroke-width="1.5"/><path d="M316 160 Q 322 124 302 100 L299 160 Z" fill="#b89a72" stroke="#23261f" stroke-width="1.5"/><text x="296" y="196" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Made AFTER</text><text x="296" y="216" font-size="14" fill="#23261f" text-anchor="middle">the frost (65%)</text><text x="200" y="262" font-size="14" fill="#6b4f35" text-anchor="middle">Know the last 3 days of weather (Tip)</text><text x="200" y="284" font-size="14" fill="#6b4f35" text-anchor="middle">Dew knocked off grass: this morning (65%)</text>
</svg>
