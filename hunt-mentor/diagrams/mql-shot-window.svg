<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="sans-serif" role="img" aria-label="The shot window, side view. You stand in brush with your shotgun. A wedge of open sky above and ahead of you is the safe window, with a shaded band at about 15 to 30 metres, a Tip. A high quail with sky behind it is in the window: OK. A low quail skimming over the brush: NO shot. Loads from Washington Fish and Wildlife, 75 percent: lead 7.5 or 8, steel 6 or 7, an open choke such as skeet or improved cylinder. Straightaway birds: most hunters shoot high, so hold a hair under.">
