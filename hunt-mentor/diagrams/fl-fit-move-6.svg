<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Calf raise on a step: rise onto your toes, pause, lower the heels below the step slowly. Helps on steep side hills.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="30" cy="32" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="30" y="39" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">6</text>
<text x="56" y="39" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="start">Calf raise</text>
<rect x="10" y="228" width="380" height="8" rx="2" fill="#c9b79c"/><rect x="170" y="196" width="120" height="32" rx="3" fill="#6b4f35"/><circle cx="210" cy="66" r="11" fill="#2f3a2b"/><line x1="210" y1="77" x2="210" y2="140" stroke="#2f3a2b" stroke-width="7" stroke-linecap="round"/><line x1="210" y1="140" x2="205" y2="196" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="210" y1="140" x2="220" y2="196" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="320" y1="200" x2="320" y2="150" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><polygon points="320.0,150.0 324.3,159.0 315.7,159.0" fill="#e8590c"/><text x="320" y="138" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Up, pause</text><text x="100" y="150" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">Heels</text><text x="100" y="170" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">low, slow</text>
<rect x="10" y="262" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="285.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Up on toes, slow down.</text>
</svg>
