<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" font-family="sans-serif" role="img" aria-label="An elk year. Calves are born late May to June, peak in the first week of June. Velvet is shed in August and bachelor groups split up. The rut runs September to mid October. Region 8 hunting: bow only 1 to 9 September, rifle 10 September to 20 October. In late fall and winter herds move down to low open winter range. Antlers drop in late winter.">
<rect x="0" y="0" width="400" height="280" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">An elk year</text><rect x="120.0" y="52" width="22.7" height="204" fill="#dfe6d3" opacity=".6"/><text x="131.33333333333334" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">J</text><text x="154.0" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">F</text><rect x="165.3" y="52" width="22.7" height="204" fill="#dfe6d3" opacity=".6"/><text x="176.66666666666669" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">M</text><text x="199.33333333333334" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A</text><rect x="210.7" y="52" width="22.7" height="204" fill="#dfe6d3" opacity=".6"/><text x="222.00000000000003" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">M</text><text x="244.66666666666669" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">J</text><rect x="256.0" y="52" width="22.7" height="204" fill="#dfe6d3" opacity=".6"/><text x="267.3333333333333" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">J</text><text x="290.0" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A</text><rect x="301.3" y="52" width="22.7" height="204" fill="#dfe6d3" opacity=".6"/><text x="312.6666666666667" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">S</text><text x="335.3333333333333" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">O</text><rect x="346.7" y="52" width="22.7" height="204" fill="#dfe6d3" opacity=".6"/><text x="358.0" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">N</text><text x="380.6666666666667" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">D</text><text x="8" y="77" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Calves born</text><rect x="228.8" y="60" width="27.2" height="24" rx="5" fill="#8b5a2b"/><text x="260.0" y="77" font-size="14" font-weight="bold" fill="#8b5a2b" text-anchor="start">late May to June</text><text x="8" y="111" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Velvet shed</text><rect x="278.7" y="94" width="22.7" height="24" rx="5" fill="#8a9a6b"/><text x="305.33333333333337" y="111" font-size="14" font-weight="bold" fill="#8a9a6b" text-anchor="start">Aug</text><text x="8" y="145" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Rut</text><rect x="301.3" y="128" width="34.0" height="24" rx="5" fill="#e8590c"/><text x="297.33333333333337" y="145" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">Sep to mid Oct</text><text x="8" y="179" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Region 8 hunt</text><rect x="301.3" y="162" width="6.8" height="24" rx="5" fill="#2f3a2b"/><rect x="308.1" y="162" width="30.6" height="24" rx="5" fill="#4a7fb0"/><text x="304.1333333333333" y="179" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="end">bow, then rifle</text><text x="8" y="213" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Winter range</text><rect x="346.7" y="196" width="45.3" height="24" rx="5" fill="#8a9a6b"/><rect x="120.0" y="196" width="68.0" height="24" rx="5" fill="#8a9a6b"/><text x="192.0" y="213" font-size="14" font-weight="bold" fill="#8a9a6b" text-anchor="start">low open slopes</text><text x="8" y="247" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Antlers drop</text><rect x="142.7" y="230" width="34.0" height="24" rx="5" fill="#2f3a2b"/><text x="180.66666666666666" y="247" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">late winter</text>
</svg>
