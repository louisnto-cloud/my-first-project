<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" font-family="sans-serif" role="img" aria-label="An elk year, January to December. Calves are born late May to June, peak in the first week of June. Velvet is shed in August and bachelor groups split up. The rut runs September to mid October. Region 8 hunting: bow only 1 to 9 September, rifle 10 September to 20 October. In late fall and winter, November to March, herds move down to low open winter range. Antlers drop in late winter.">
