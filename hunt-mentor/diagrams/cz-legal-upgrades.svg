<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" font-family="sans-serif" role="img" aria-label="Legal to add to a CZ 457: scope, rings or a Weaver rail, a sling and swivels, spare CZ magazines, a muzzle brake or thread cap, a new stock that is not a bullpup, and factory CZ barrel kits. Not legal: a suppressor, a bullpup stock, auto or bump fire parts, a barrel cut under 457 mm, and thermal or night optics on a BC hunt."><rect x="0" y="0" width="400" height="350" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Legal and not legal</text><text x="104" y="56" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Legal to add</text><text x="296" y="56" font-size="16" font-weight="bold" text-anchor="middle" fill="#FF6A13">Not legal</text><rect x="10" y="66" width="188" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="18" y="86" font-size="13.5" font-weight="normal" text-anchor="start" fill="#17201A">Scope, rings, Weaver rail</text><rect x="10" y="102" width="188" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="18" y="122" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Sling and swivels</text><rect x="10" y="138" width="188" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="18" y="158" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Spare CZ magazines</text><rect x="10" y="174" width="188" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="18" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Brake or thread cap</text><rect x="10" y="210" width="188" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="18" y="230" font-size="13.5" font-weight="normal" text-anchor="start" fill="#17201A">New stock (not bullpup)</text><rect x="10" y="246" width="188" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="18" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Factory CZ barrel kits</text><rect x="202" y="66" width="188" height="30" rx="6" fill="#FFFFFF" stroke="#FF6A13" stroke-width="1.5"/><text x="210" y="86" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Suppressor</text><rect x="202" y="102" width="188" height="30" rx="6" fill="#FFFFFF" stroke="#FF6A13" stroke-width="1.5"/><text x="210" y="122" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Bullpup stock</text><rect x="202" y="138" width="188" height="30" rx="6" fill="#FFFFFF" stroke="#FF6A13" stroke-width="1.5"/><text x="210" y="158" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Auto or bump fire parts</text><rect x="202" y="174" width="188" height="30" rx="6" fill="#FFFFFF" stroke="#FF6A13" stroke-width="1.5"/><text x="210" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Cut down barrel</text><rect x="202" y="210" width="188" height="30" rx="6" fill="#FFFFFF" stroke="#FF6A13" stroke-width="1.5"/><text x="210" y="230" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Thermal or night scope*</text><text x="16" y="300" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">* Infrared optics: illegal to have on a BC hunt.</text><text x="16" y="320" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Bullpup: a stock that puts the action behind</text><text x="16" y="338" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">the trigger (SOR/98-462).</text></svg>
