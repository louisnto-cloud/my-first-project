<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="If caught, step 4: as it slows, cup a hand in front of your mouth to make an air space, and push the other hand up toward the surface.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4. As it slows: air space</text><rect x="0" y="80" width="400" height="220" rx="0" fill="#f4f7fb"/><circle cx="200" cy="200" r="14.0" fill="#d9b48f"/><path d="M214 200 q16 -8 14 10" fill="none" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="190" y1="190" x2="160" y2="100" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><text x="110" y="120" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hand up</text><text x="300" y="200" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Air space</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Air space, one hand up</text>
</svg>
