<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Fire in rain and wind: a tarp strung high above the fire, never close to it, and a rock or log as a wind wall on the windward side.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fire in rain and wind</text><rect x="0" y="220" width="400" height="80" rx="0" fill="#dfe6d3"/><path d="M60 90 L340 70" fill="none" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="60" y1="90" x2="60" y2="220" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round"/><line x1="340" y1="70" x2="340" y2="220" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round"/><text x="200" y="60" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Tarp high above, not on it</text><rect x="110" y="186" width="50" height="34" rx="6" fill="#9a9a8f"/><rect x="160" y="180" width="40" height="40" rx="6" fill="#9a9a8f"/><text x="140" y="252" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Rock or log</text><text x="140" y="270" font-size="15" fill="#2f3a2b" text-anchor="middle">wind wall</text><line x1="224" y1="214" x2="272" y2="206" stroke="#8b5a2b" stroke-width="9.0" stroke-linecap="round"/><line x1="228" y1="206" x2="276" y2="214" stroke="#8b5a2b" stroke-width="9.0" stroke-linecap="round"/><path d="M236 206 Q231 182 250 161 Q269 182 264 206 Z" fill="#e8590c"/><path d="M243 206 Q240 193 250 180 Q260 193 257 206 Z" fill="#f6c344"/><line x1="20" y1="170" x2="88" y2="179" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="100,180 89,171 87,186" fill="#4a7fb0"/><text x="36" y="156" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">wind</text>
</svg>
