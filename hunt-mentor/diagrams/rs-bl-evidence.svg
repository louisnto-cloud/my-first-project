<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif" role="img" aria-label="Evidence and likely meaning. Pink frothy blood with spongy pink tissue: lungs. White bone chips with marrow and little blood: leg. Green or brown plant matter that smells: gut. Dark blood, no bubbles: liver. White waxy fat with green smear: paunch. Hair only, no blood: grazed or high, back out.">
<rect x="0" y="0" width="400" height="320" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">What you find, what it means</text>
<text x="20" y="60" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Find</text><text x="220" y="60" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Likely</text><rect x="8" y="70" width="384" height="36" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="85" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Pink froth,</text><text x="20" y="101" font-size="14" fill="#23261f" text-anchor="start">spongy tissue</text><text x="220" y="93.0" font-size="14" fill="#23261f" text-anchor="start">lungs (70%)</text><rect x="8" y="110" width="384" height="36" rx="6" fill="#f3f1e6" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="125" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Bone chips,</text><text x="20" y="141" font-size="14" fill="#23261f" text-anchor="start">marrow</text><text x="220" y="133.0" font-size="14" fill="#23261f" text-anchor="start">leg or shoulder (65%)</text><rect x="8" y="150" width="384" height="36" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="165" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Green or brown</text><text x="20" y="181" font-size="14" fill="#23261f" text-anchor="start">matter, smell</text><text x="220" y="173.0" font-size="14" fill="#23261f" text-anchor="start">gut (70%)</text><rect x="8" y="190" width="384" height="36" rx="6" fill="#f3f1e6" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="205" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Dark blood,</text><text x="20" y="221" font-size="14" fill="#23261f" text-anchor="start">no bubbles</text><text x="220" y="213.0" font-size="14" fill="#23261f" text-anchor="start">liver (70%)</text><rect x="8" y="230" width="384" height="36" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="245" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">White fat,</text><text x="20" y="261" font-size="14" fill="#23261f" text-anchor="start">green smear</text><text x="220" y="253.0" font-size="14" fill="#23261f" text-anchor="start">paunch (65%)</text><rect x="8" y="270" width="384" height="36" rx="6" fill="#f3f1e6" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="285" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Hair only,</text><text x="20" y="301" font-size="14" fill="#23261f" text-anchor="start">no blood</text><text x="220" y="293.0" font-size="14" fill="#23261f" text-anchor="start">graze or high: wait (70%)</text>
</svg>
