<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 477" font-family="sans-serif" role="img" aria-label="Young mule deer buck and old buck compared. Young buck, 1 to 2 years, drawn slim with small forked antlers and a thin neck: wanders onto new ground, looks back and is curious, is out in daylight, and is easy to see. Old buck, 5 plus, drawn with heavy antlers that fork twice, a deep chest and a big neck: faithful to his range, often does not look back, uses rough steep cover, and is hard to find. Antlers are near peak size by about age 4, 85 percent. A mix of studies and hunter consensus, 60 to 70 percent.">
<rect width="400" height="477" fill="#fffaf0"/>
<rect x="8" y="8" width="188" height="34" rx="8" fill="#5b6b3e"/>
<text x="102" y="31" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">Young (1 to 2)</text>
<rect x="204" y="8" width="188" height="34" rx="8" fill="#6b4f35"/>
<text x="298" y="31" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">Old (5 plus)</text>
<rect x="8" y="48" width="188" height="206" rx="10" fill="#e6ebdc"/>
