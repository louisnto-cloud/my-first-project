<text x="298" y="315" font-size="15" fill="#2f3a2b" text-anchor="middle">Faithful to his range</text>
<text x="102" y="347" font-size="15" fill="#2f3a2b" text-anchor="middle">Looks back, curious</text>
<text x="298" y="347" font-size="15" fill="#2f3a2b" text-anchor="middle">Often does not look back</text>
