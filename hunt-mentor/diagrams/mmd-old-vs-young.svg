<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two columns. Young buck, 1 to 2 years: wanders onto new ground, looks back and is curious, is out in daylight, has forks and a thin neck, is easy to see. Old buck, 5 plus: faithful to his range, often does not look back, uses rough steep cover, has a deep chest and big neck, is hard to find. Antlers are near peak size by about age 4.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Young buck vs old buck</text><rect x="10" y="40" width="185" height="216" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><rect x="205" y="40" width="185" height="216" rx="10" fill="#efe6d6" stroke="#8b5a2b" stroke-width="2"/><text x="102" y="64" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Young (1 to 2)</text><text x="297" y="64" font-size="16" fill="#6b4f35" text-anchor="middle" font-weight="bold">Old (5 plus)</text><text x="102" y="98" font-size="14" fill="#23261f" text-anchor="middle">Wanders, new ground</text><text x="297" y="98" font-size="14" fill="#23261f" text-anchor="middle">Faithful to his range</text><text x="102" y="132" font-size="14" fill="#23261f" text-anchor="middle">Looks back, curious</text><text x="297" y="132" font-size="14" fill="#23261f" text-anchor="middle">Often does not look back</text><text x="102" y="166" font-size="14" fill="#23261f" text-anchor="middle">Out in daylight</text><text x="297" y="166" font-size="14" fill="#23261f" text-anchor="middle">Rough, steep cover</text><text x="102" y="200" font-size="14" fill="#23261f" text-anchor="middle">Forks, thin neck</text><text x="297" y="200" font-size="14" fill="#23261f" text-anchor="middle">Deep chest, big neck</text><text x="102" y="234" font-size="14" fill="#23261f" text-anchor="middle">Easy to see</text><text x="297" y="234" font-size="14" fill="#23261f" text-anchor="middle">Hard to find</text><text x="200" y="276" font-size="14" fill="#6b4f35" text-anchor="middle">Mix of studies and hunter consensus (60 to 70%)</text><text x="200" y="294" font-size="14" fill="#6b4f35" text-anchor="middle">Antlers near peak by about age 4 (85%)</text>
</svg>
