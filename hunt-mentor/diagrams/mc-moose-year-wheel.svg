<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 312" font-family="sans-serif" role="img" aria-label="Year wheel for moose in BC. Calves born late May and June. Antlers grow in velvet from late April or May to August and are full size by early September. The rut peaks in late September and early October. Antlers drop from mid November to March, old bulls first.">
