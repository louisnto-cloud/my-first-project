<text x="250" y="106" font-size="14" fill="#23261f" text-anchor="start">Closed. Trappers</text>
<text x="250" y="124" font-size="14" fill="#23261f" text-anchor="start">exempt. Commercial</text>
<text x="250" y="142" font-size="14" fill="#23261f" text-anchor="start">vehicles on</text>
<text x="250" y="160" font-size="14" fill="#23261f" text-anchor="start">existing roads</text>
<rect x="6" y="198" width="190" height="150" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
