<text x="52" y="264" font-size="14" fill="#23261f" text-anchor="start">Above 1,500 m, Oct</text>
<text x="52" y="282" font-size="14" fill="#23261f" text-anchor="start">1 to Apr 30</text>
<rect x="204" y="198" width="190" height="150" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<path d="M204 208 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#4a7fb0"/>
