<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 362" role="img" aria-label="Four cards of Region 6 Motor Vehicle Closed Areas: no motor vehicle for any purpose. Above 1,400 metres all year, roads included, on Tsatia Mountain in 6-20, Klastline Plateau in 6-21, Level Mountain in 6-22 and 6-26, and Gnat Pass east of Highway 37 in 6-19. Management Unit 6-18 above 1,450 metres, trappers exempt, commercial vehicles allowed on existing roads. Netalzul Mountain in 6-8, Map F6, above 1,500 metres, 1 October to 30 April. Telkwa Mountains in 6-9, Map F10, all year, except Grizzly Plateau open 1 November to 30 April and the Meat Cache open 15 December to 1 April." font-family="sans-serif">
<rect x="0" y="0" width="400" height="362" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Year round vehicle closures</text>
<rect x="6" y="40" width="190" height="150" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<path d="M6 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#4a7fb0"/>
<text x="101" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Above 1,400 m, all</text>
<text x="101" y="76" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">year</text>
<path d="M13.0 125 l11 -18 l6 8 l5 -6 l12 16 z" fill="#8a9a6b"/><path d="M24.0 107 l3 5 h-6 z" fill="#ffffff"/><line x1="12.0" y1="111" x2="48.0" y2="111" stroke="#e8590c" stroke-width="2" stroke-dasharray="4 3"/>
<text x="52" y="106" font-size="14" fill="#23261f" text-anchor="start">Tsatia Mountain,</text>
<text x="52" y="124" font-size="14" fill="#23261f" text-anchor="start">Klastline Plateau,</text>
<text x="52" y="142" font-size="14" fill="#23261f" text-anchor="start">Level Mountain,</text>
<text x="52" y="160" font-size="14" fill="#23261f" text-anchor="start">Gnat Pass east of</text>
<text x="52" y="178" font-size="14" fill="#23261f" text-anchor="start">Hwy 37. Roads too</text>
<rect x="204" y="40" width="190" height="150" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<path d="M204 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#4a7fb0"/>
