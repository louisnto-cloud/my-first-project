<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 288" font-family="sans-serif" role="img" aria-label="Recovery plan by hit. Lungs: wait 30 minutes, follow blood, expect a short trail. Liver: back out 4 to 6 hours, expect dark blood then a bed. Gut: back out 6 to 8 hours, expect thin blood and an early bed. Leg or muscle: wait 30 to 60 minutes, long trail, get help.">
<rect x="0" y="0" width="400" height="288" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Recovery plan by hit</text>
<text x="200" y="50" font-size="14" fill="#6b4f35" text-anchor="middle">Waits are opinion, not law (70%)</text>
<text x="20" y="76" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Hit</text><text x="130" y="76" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Wait</text><text x="240" y="76" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Expect</text><rect x="8" y="86" width="384" height="44" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="113.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Lungs</text><text x="130" y="113.0" font-size="14" fill="#23261f" text-anchor="start">30 min</text><text x="240" y="101" font-size="14" fill="#23261f" text-anchor="start">short trail,</text><text x="240" y="117" font-size="14" fill="#23261f" text-anchor="start">often in sight</text><rect x="8" y="134" width="384" height="44" rx="6" fill="#f3f1e6" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="161.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Liver</text><text x="130" y="161.0" font-size="14" fill="#23261f" text-anchor="start">4 to 6 h</text><text x="240" y="149" font-size="14" fill="#23261f" text-anchor="start">dark blood,</text><text x="240" y="165" font-size="14" fill="#23261f" text-anchor="start">then a bed (Tip)</text><rect x="8" y="182" width="384" height="44" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="209.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Gut</text><text x="130" y="209.0" font-size="14" fill="#23261f" text-anchor="start">6 to 8 h</text><text x="240" y="197" font-size="14" fill="#23261f" text-anchor="start">beds early,</text><text x="240" y="213" font-size="14" fill="#23261f" text-anchor="start">thin blood</text><rect x="8" y="230" width="384" height="44" rx="6" fill="#f3f1e6" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="257.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Leg, muscle</text><text x="130" y="257.0" font-size="14" fill="#23261f" text-anchor="start">30 to 60 min</text><text x="240" y="245" font-size="14" fill="#23261f" text-anchor="start">long trail,</text><text x="240" y="261" font-size="14" fill="#23261f" text-anchor="start">get help</text>
</svg>
