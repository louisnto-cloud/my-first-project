<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Six weather cards. Clear: geese fly at sunrise, 80 percent. Cloudy: about 15 minutes later, and they stay longer in fields, 80 percent. Below minus 9 Celsius at sunrise: few fly at dawn; they feed in the afternoon, 80 percent. Storm: they fly all day and may roost in fields, 80 percent. Wind: they land into it and fly lower, a Tip. Full moon: they come back later at dusk, 80 percent. Source: a two winter study of about 40,000 Illinois geese.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Weather changes the clock</text><rect x="12" y="38" width="120" height="118" rx="10" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="72" y="64" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Clear</text><text x="72" y="94" font-size="13.5" fill="#23261f" text-anchor="middle">fly at sunrise</text><text x="72" y="113" font-size="13.5" fill="#23261f" text-anchor="middle">(80%)</text><rect x="140" y="38" width="120" height="118" rx="10" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="64" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Cloudy</text><text x="200" y="94" font-size="13.5" fill="#23261f" text-anchor="middle">about 15 min</text><text x="200" y="113" font-size="13.5" fill="#23261f" text-anchor="middle">later, longer</text><text x="200" y="132" font-size="13.5" fill="#23261f" text-anchor="middle">in fields (80%)</text><rect x="268" y="38" width="120" height="118" rx="10" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="328" y="64" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Very cold</text><text x="328" y="94" font-size="13.5" fill="#23261f" text-anchor="middle">under minus 9°C:</text><text x="328" y="113" font-size="13.5" fill="#23261f" text-anchor="middle">few fly at dawn,</text><text x="328" y="132" font-size="13.5" fill="#23261f" text-anchor="middle">feed later (80%)</text><rect x="12" y="166" width="120" height="118" rx="10" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="72" y="192" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Storm</text><text x="72" y="222" font-size="13.5" fill="#23261f" text-anchor="middle">fly all day,</text><text x="72" y="241" font-size="13.5" fill="#23261f" text-anchor="middle">may roost in</text><text x="72" y="260" font-size="13.5" fill="#23261f" text-anchor="middle">fields (80%)</text><rect x="140" y="166" width="120" height="118" rx="10" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="192" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Wind</text><text x="200" y="222" font-size="13.5" fill="#23261f" text-anchor="middle">land into it,</text><text x="200" y="241" font-size="13.5" fill="#23261f" text-anchor="middle">fly lower</text><text x="200" y="260" font-size="13.5" fill="#23261f" text-anchor="middle">(Tip)</text><rect x="268" y="166" width="120" height="118" rx="10" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="328" y="192" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Full moon</text><text x="328" y="222" font-size="13.5" fill="#23261f" text-anchor="middle">come back</text><text x="328" y="241" font-size="13.5" fill="#23261f" text-anchor="middle">later at dusk</text><text x="328" y="260" font-size="13.5" fill="#23261f" text-anchor="middle">(80%)</text><text x="200" y="294" font-size="13" fill="#2f3a2b" text-anchor="middle">Source: a 2 winter study of 40,000 Illinois geese</text>
</svg>
