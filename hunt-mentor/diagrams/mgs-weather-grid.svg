<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 474" font-family="sans-serif" role="img" aria-label="Six weather rows for geese. Clear: geese fly at sunrise, 80 percent. Cloudy: about 15 minutes later, and they stay longer in fields, 80 percent. Very cold, under minus 9 Celsius at sunrise: few fly at dawn; they feed later, 80 percent. Storm: they fly all day and may roost in fields, 80 percent. Wind: they land into it and fly lower, a Tip. Full moon: they come back later at dusk, 80 percent. Source: a 2 winter study of 40,000 Illinois geese.">
<rect width="400" height="474" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Weather changes the clock</text>
<rect x="8" y="44" width="384" height="58" rx="8" fill="#f4eedf"/>
<rect x="8" y="44" width="6" height="58" rx="3" fill="#c98a12"/>
<circle cx="41.0" cy="73.0" r="21" fill="#fffaf0" stroke="#c98a12" stroke-width="2"/>
<g transform="translate(41.0 73.0) scale(0.95)"><line x1="11.0" y1="0.0" x2="16.0" y2="0.0" stroke="#d9901a" stroke-width="2.6" stroke-linecap="round"/><line x1="7.8" y1="7.8" x2="11.3" y2="11.3" stroke="#d9901a" stroke-width="2.6" stroke-linecap="round"/><line x1="0.0" y1="11.0" x2="0.0" y2="16.0" stroke="#d9901a" stroke-width="2.6" stroke-linecap="round"/><line x1="-7.8" y1="7.8" x2="-11.3" y2="11.3" stroke="#d9901a" stroke-width="2.6" stroke-linecap="round"/><line x1="-11.0" y1="0.0" x2="-16.0" y2="0.0" stroke="#d9901a" stroke-width="2.6" stroke-linecap="round"/><line x1="-7.8" y1="-7.8" x2="-11.3" y2="-11.3" stroke="#d9901a" stroke-width="2.6" stroke-linecap="round"/><line x1="-0.0" y1="-11.0" x2="-0.0" y2="-16.0" stroke="#d9901a" stroke-width="2.6" stroke-linecap="round"/><line x1="7.8" y1="-7.8" x2="11.3" y2="-11.3" stroke="#d9901a" stroke-width="2.6" stroke-linecap="round"/><circle r="8" fill="#f2b233"/></g>
<text x="74" y="69" font-size="16" font-weight="bold" fill="#2f3a2b">Clear</text>
<text x="74" y="89" font-size="15" fill="#2f3a2b">Fly at sunrise (80%)</text>
<rect x="8" y="108" width="384" height="58" rx="8" fill="#f4eedf"/>
<rect x="8" y="108" width="6" height="58" rx="3" fill="#7d8894"/>
<circle cx="41.0" cy="137.0" r="21" fill="#fffaf0" stroke="#7d8894" stroke-width="2"/>
<g transform="translate(41.0 137.0) scale(0.95)"><circle cx="9" cy="-8" r="6" fill="#f2b233"/><path d="M-14 8 C-20 8 -20 -1 -14 -2 C-14 -9 -5 -11 -2 -6 C1 -13 13 -12 13 -3 C19 -3 20 8 13 8z" fill="#8e9aa6"/></g>
<text x="74" y="133" font-size="16" font-weight="bold" fill="#2f3a2b">Cloudy</text>
<text x="74" y="153" font-size="15" fill="#2f3a2b">About 15 min later, longer in fields (80%)</text>
<rect x="8" y="172" width="384" height="77" rx="8" fill="#f4eedf"/>
<rect x="8" y="172" width="6" height="77" rx="3" fill="#4a7fb0"/>
<circle cx="41.0" cy="210.5" r="21" fill="#fffaf0" stroke="#4a7fb0" stroke-width="2"/>
<g transform="translate(41.0 210.5) scale(0.95)"><line x1="-15.0" y1="-0.0" x2="15.0" y2="0.0" stroke="#4a7fb0" stroke-width="2.6" stroke-linecap="round"/><line x1="9.0" y1="0.0" x2="5.2" y2="-3.2" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="9.0" y1="0.0" x2="5.2" y2="3.2" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="-9.0" y1="-0.0" x2="-5.2" y2="3.2" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="-9.0" y1="-0.0" x2="-5.2" y2="-3.2" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="-7.5" y1="-13.0" x2="7.5" y2="13.0" stroke="#4a7fb0" stroke-width="2.6" stroke-linecap="round"/><line x1="4.5" y1="7.8" x2="5.4" y2="2.9" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="4.5" y1="7.8" x2="-0.2" y2="6.1" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="-4.5" y1="-7.8" x2="-5.4" y2="-2.9" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="-4.5" y1="-7.8" x2="0.2" y2="-6.1" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="7.5" y1="-13.0" x2="-7.5" y2="13.0" stroke="#4a7fb0" stroke-width="2.6" stroke-linecap="round"/><line x1="-4.5" y1="7.8" x2="0.2" y2="6.1" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="-4.5" y1="7.8" x2="-5.4" y2="2.9" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="4.5" y1="-7.8" x2="-0.2" y2="-6.1" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="4.5" y1="-7.8" x2="5.4" y2="-2.9" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/></g>
<text x="74" y="197" font-size="16" font-weight="bold" fill="#2f3a2b">Very cold</text>
<text x="74" y="217" font-size="15" fill="#2f3a2b">Under minus 9°C: few fly at dawn, feed</text>
<text x="74" y="236" font-size="15" fill="#2f3a2b">later (80%)</text>
<rect x="8" y="255" width="384" height="58" rx="8" fill="#f4eedf"/>
<rect x="8" y="255" width="6" height="58" rx="3" fill="#5d6873"/>
<circle cx="41.0" cy="284.0" r="21" fill="#fffaf0" stroke="#5d6873" stroke-width="2"/>
<g transform="translate(41.0 284.0) scale(0.95)"><g transform="translate(0 -4)"><path d="M-14 8 C-20 8 -20 -1 -14 -2 C-14 -9 -5 -11 -2 -6 C1 -13 13 -12 13 -3 C19 -3 20 8 13 8z" fill="#5d6873"/></g><path d="M1 3 L-5 12 H0 L-3 19 L6 8 H1 L4 3z" fill="#e8590c"/><path d="M-11 8 l-3 7 M10 8 l-3 7" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/></g>
<text x="74" y="280" font-size="16" font-weight="bold" fill="#2f3a2b">Storm</text>
<text x="74" y="300" font-size="15" fill="#2f3a2b">Fly all day, may roost in fields (80%)</text>
<rect x="8" y="319" width="384" height="58" rx="8" fill="#f4eedf"/>
<rect x="8" y="319" width="6" height="58" rx="3" fill="#4a7fb0"/>
<circle cx="41.0" cy="348.0" r="21" fill="#fffaf0" stroke="#4a7fb0" stroke-width="2"/>
<g transform="translate(41.0 348.0) scale(0.95)"><path d="M-15 -8 H3 c5 0 6 -7 1 -7" fill="none" stroke="#4a7fb0" stroke-width="2.6" stroke-linecap="round"/><path d="M-15 0 H9 c5 0 6 -7 1 -7" fill="none" stroke="#4a7fb0" stroke-width="2.6" stroke-linecap="round"/><path d="M-15 8 H-1 c5 0 6 -7 1 -7" fill="none" stroke="#4a7fb0" stroke-width="2.6" stroke-linecap="round"/></g>
<text x="74" y="344" font-size="16" font-weight="bold" fill="#2f3a2b">Wind</text>
<text x="74" y="364" font-size="15" fill="#2f3a2b">Land into it, fly lower (Tip)</text>
<rect x="8" y="383" width="384" height="58" rx="8" fill="#f4eedf"/>
<rect x="8" y="383" width="6" height="58" rx="3" fill="#b8a76a"/>
<circle cx="41.0" cy="412.0" r="21" fill="#fffaf0" stroke="#b8a76a" stroke-width="2"/>
<g transform="translate(41.0 412.0) scale(0.95)"><circle r="14" fill="#f3e7b3" stroke="#b8a76a" stroke-width="1.4"/><circle cx="-4" cy="-4" r="3" fill="#e2d39a"/><circle cx="5" cy="3" r="2.4" fill="#e2d39a"/><circle cx="-2" cy="7" r="1.8" fill="#e2d39a"/></g>
<text x="74" y="408" font-size="16" font-weight="bold" fill="#2f3a2b">Full moon</text>
<text x="74" y="428" font-size="15" fill="#2f3a2b">Come back later at dusk (80%)</text>
<text x="14" y="462" font-size="14" fill="#6b5b4b">Source: a 2 winter study of 40,000 Illinois geese</text>
</svg>
