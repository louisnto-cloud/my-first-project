<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Shoot or not flowchart. Four questions in a row: Is it the right species? Is it legal, sex and points? Is there a safe backstop and nothing beyond? Is it in my range, standing right? Four yes answers lead to: take the shot. Any no or any doubt leads to: no shot.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
  <g font-family="sans-serif" font-size="15" fill="#23261f">
    <rect x="14" y="14" width="250" height="40" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="26" y="40">1. Right species?</text>
    <rect x="14" y="66" width="250" height="40" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="26" y="92">2. Legal: sex, points?</text>
    <rect x="14" y="118" width="250" height="40" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="26" y="144">3. Safe backstop, clear beyond?</text>
    <rect x="14" y="170" width="250" height="40" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="26" y="196">4. In my range, good angle?</text>
  </g>
  <g stroke="#2f3a2b" stroke-width="3" fill="none">
    <path d="M139 54 L139 66"/><path d="M139 106 L139 118"/><path d="M139 158 L139 170"/><path d="M139 210 L139 232"/>
    <path d="M264 34 L300 34 M264 86 L300 86 M264 138 L300 138 M264 190 L300 190 M300 34 L300 190"/>
    <path d="M300 112 L318 112"/>
  </g>
  <rect x="318" y="88" width="72" height="48" rx="8" fill="#e8590c"/>
  <text x="354" y="109" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">No or</text>
  <text x="354" y="126" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">unsure</text>
  <text x="354" y="160" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">NO SHOT</text>
  <rect x="64" y="232" width="150" height="48" rx="8" fill="#8a9a6b"/>
  <text x="139" y="253" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">All 4 yes</text>
  <text x="139" y="271" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Shot is OK</text>
</svg>
