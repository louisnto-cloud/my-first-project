<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="sans-serif" role="img" aria-label="Bar chart of Region 3 white tailed deer taken a year by MU (Management Unit), 5 year average, then hunter success. 3-36 Bonaparte Lake 160 deer, 42 percent. 3-26 Chase 126, 16 percent. 3-27 Heffley Creek 120, 17 percent. 3-19 Logan Lake 78, 9 percent. 3-20 Kamloops south 68, 11 percent. 3-12 Aspen Grove 68, 13 percent. 3-37 Adams Lake 49, 17 percent.">
