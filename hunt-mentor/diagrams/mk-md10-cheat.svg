<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1587" font-family="sans-serif" role="img" aria-label="Mule deer cheat sheet. Buck weight: 68 to 113 kg (peak 180) (90%). Doe weight: 50 to 75 kg (90%). Shoulder height: 90 to 95 cm (90%). Ears: 2/3 of head length (90%). Tail: thin, white, black tip (90%). BC mule deer: 100,000 to 170,000 (85%). MU 3-27 success: 20 to 41% a year (90%). Hunter days per deer, 3-27: about 22 (90%). Yearling antlers: most 2 points a side (90%). Antlers near peak: about age 4 (85%). Aim: back of front leg, 1/3 up (85%). Vital zone: 20 to 25 cm (75%). Lifespan: few past 8 to 10 years (90%). Yearling by teeth: tooth 3 has 3 cusps (85%). Hearing: 115 Hz to 54 kHz, best 4 to 8 kHz (85%). View: about 310 degrees (80%). Colour: 2 cones, no red (85%). Morning thermal: up once sun hits (80%). Evening thermal: down (80%). Stot bound: 2.7 to 5.2 m, up to 40 km/h (80%). Flees: uphill, may look back (65 to 70%). Fawns hide: over 95% of the time (85%). Doe clan: related females (90%). Rut: November to early December, peak mid Nov (80 to 90%). Gestation: about 203 days (85%). Fawns born: late May to June, twins usual (90%). Antlers drop: January to March, old first (90%). Antlers grow: April to August (90%). Velvet off: 24 to 48 hours (85%). Move down trigger: snow and cold (85%). Snow limit: hinders 25 to 30 cm, out at 50 cm (85%). Migrants: 74%, about 47 km a year (85%). Activity peaks: 04 to 09 and 17 to 21 (85%). Moon: no effect found (70%). Winter range: low, south and west, old fir (85%). Cover: hides 90% of deer at 60 m (80%). Fall grass in diet: under 10% near Kamloops (85%). Wait: lungs: 30 minutes (70 to 85%). Meat target: below 4°C (80%). Boneless meat: about 1/3 of live weight (70%).">
<rect width="400" height="1587" rx="12" fill="#EEF1EA"/>
