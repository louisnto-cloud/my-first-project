0c"/></g><text x="220" y="244" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Shooter</text><path d="M70 150 Q160 60 290 100" fill="none" stroke="#8a9a6b" stroke-width="2" stroke-dasharray="5 5"/><line x1="110" y1="240" x2="190" y2="222" stroke="#e8590c" stroke-width="2"/><polygon points="190,222 182.2,228.2 180.3,219.7" fill="#e8590c"/><text x="16" y="270" font-size="14" fill="#23261f" text-anchor="start">Glasser keeps eyes on the bear and cubs.</text><text x="16" y="287" font-size="14" fill="#23261f" text-anchor="start">Signals agreed before: stop, go, cubs, shoot.</text>
