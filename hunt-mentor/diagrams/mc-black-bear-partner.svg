<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two hunters on one bear. The glasser stays back on a high point with binoculars on the bear and any cubs. The shooter stalks in with the wind. Hand signals agreed before the hunt: stop, go, cubs, shoot. Tip.">
