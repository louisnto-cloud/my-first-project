<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Mallard nesting timeline. Lay about 9 eggs, one a day. Sit about 28 days. Hatch: the ducklings go to water within a day. Grow: they fly at 50 to 60 days. The drake leaves early in incubation, 70 percent. Clutch 5 to 15 eggs; incubation 26 to 30 days, 75 percent. About 3 months from first egg to first flight."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">From first egg to first flight (mallard)</text><rect x="6" y="44" width="90" height="110" rx="10" fill="#f6d7b0"/><text x="51" y="76" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Lay</text><text x="51" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">9 eggs</text><text x="51" y="124" font-size="14" fill="#2f3a2b" text-anchor="middle">1 a day</text><line x1="96" y1="98" x2="98.0" y2="98.0" stroke="#e8590c" stroke-width="3" fill="none"/><polygon points="104.0,98.0 93.0,92.0 93.0,104.0" fill="#e8590c"/><rect x="104" y="44" width="90" height="110" rx="10" fill="#e9d7b8"/><text x="149" y="76" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Sit</text><text x="149" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">about 28</text><text x="149" y="124" font-size="14" fill="#2f3a2b" text-anchor="middle">days</text><line x1="194" y1="98" x2="196.0" y2="98.0" stroke="#e8590c" stroke-width="3" fill="none"/><polygon points="202.0,98.0 191.0,92.0 191.0,104.0" fill="#e8590c"/><rect x="202" y="44" width="90" height="110" rx="10" fill="#cfe0ef"/><text x="247" y="76" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Hatch</text><text x="247" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">off to water</text><text x="247" y="124" font-size="14" fill="#2f3a2b" text-anchor="middle">in a day</text><line x1="292" y1="98" x2="294.0" y2="98.0" stroke="#e8590c" stroke-width="3" fill="none"/><polygon points="300.0,98.0 289.0,92.0 289.0,104.0" fill="#e8590c"/><rect x="300" y="44" width="90" height="110" rx="10" fill="#dfe6d3"/><text x="345" y="76" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Grow</text><text x="345" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">fly at 50</text><text x="345" y="124" font-size="14" fill="#2f3a2b" text-anchor="middle">to 60 days</text><rect x="10" y="166" width="380" height="36" rx="8" fill="#dfe6d3"/><text x="200" y="190" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Drake leaves early in the sit (70%)</text><rect x="10" y="208" width="380" height="36" rx="8" fill="#dfe6d3"/><text x="200" y="232" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Clutch 5 to 15 eggs; sit 26 to 30 days (75%)</text><rect x="10" y="250" width="380" height="40" rx="8" fill="#e8590c"/><text x="200" y="276" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">About 3 months from first egg to flight</text></svg>
