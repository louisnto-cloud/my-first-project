<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Air flows along a creek valley. Where a side draw joins, the air tumbles in an orange swirl. Eddies form at canyon bends and side draw junctions.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="14" y="26" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Eddies at bends and side draws (75%)</text><path d="M0 200 C 120 200, 200 160, 400 170" fill="none" stroke="#4a7fb0" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M220 40 C 225 100, 230 140, 240 172" fill="none" stroke="#4a7fb0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><line x1="40" y1="180" x2="132.3" y2="175.4" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><polygon points="140.0,175.0 128.7,169.5 129.3,181.6" fill="#2f3a2b"/><line x1="150" y1="175" x2="192.4" y2="166.5" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><polygon points="200.0,165.0 188.0,161.2 190.4,173.1" fill="#2f3a2b"/><path d="M250 140 C 300 120, 300 90, 260 95 C 235 100, 245 125, 262 128" fill="none" stroke="#e8590c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="262" y1="128" x2="260.7" y2="127.6" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="268.0,130.0 259.5,120.8 255.7,132.3" fill="#e8590c"/><text x="270" y="70" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">Swirl where the</text><text x="270" y="88" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">side draw joins</text><text x="14" y="280" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Air follows the creek, then tumbles at the junction.</text>
</svg>
