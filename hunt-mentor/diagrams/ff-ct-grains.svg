<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of bullet weights: 150 grain is 9.7 grams, 165 grain is 10.7 grams, 180 grain is 11.7 grams, and a 40 grain .22 bullet is 2.6 grams. 7,000 grains make one pound, 454 grams. One grain is about 0.065 grams.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Grains, a tiny weight unit</text><text x="114" y="78.2" font-size="14" fill="#23261f" text-anchor="end">150 gr</text><rect x="120" y="60" width="166.66666666666666" height="26" rx="3" fill="#e8590c" stroke="none" stroke-width="2"/><text x="292.66666666666663" y="78.2" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">9.7 g</text><text x="114" y="120.2" font-size="14" fill="#23261f" text-anchor="end">165 gr</text><rect x="120" y="102" width="183.33333333333334" height="26" rx="3" fill="#e8590c" stroke="none" stroke-width="2"/><text x="309.33333333333337" y="120.2" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">10.7 g</text><text x="114" y="162.2" font-size="14" fill="#23261f" text-anchor="end">180 gr</text><rect x="120" y="144" width="200.0" height="26" rx="3" fill="#e8590c" stroke="none" stroke-width="2"/><text x="326.0" y="162.2" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">11.7 g</text><text x="114" y="204.2" font-size="14" fill="#23261f" text-anchor="end">40 gr .22</text><rect x="120" y="186" width="44.44444444444444" height="26" rx="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="170.44444444444446" y="204.2" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">2.6 g</text><text x="200" y="240" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">7,000 grains = 1 pound (454 g)</text><text x="200.0" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle">1 grain is about 0.065 g</text>
</svg>
