<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="sans-serif" role="img" aria-label="Black tailed deer food. Winter and early spring: Douglas fir, western redcedar, red huckleberry, salal, deer fern, tree lichens. Late spring to fall: grasses, trailing blackberry, fireweed, pearly everlasting, willow and maple leaves, salmonberry and salal.">
<rect width="400" height="330" fill="#EEF1EA"/>
<text x="200" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1F3D2B">What they eat on the coast</text>
<rect x="14" y="46" width="180" height="250" rx="10" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.5"/><rect x="206" y="46" width="180" height="250" rx="10" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.5"/><text x="104" y="70" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Winter, early spring</text><text x="296" y="70" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Late spring to fall</text><circle cx="30" cy="97" r="5" fill="#8a9a6b" stroke="none"/><text x="42" y="102" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">Douglas fir</text><circle cx="222" cy="97" r="5" fill="#8a9a6b" stroke="none"/><text x="234" y="102" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">Grasses</text><circle cx="30" cy="129" r="5" fill="#8a9a6b" stroke="none"/><text x="42" y="134" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">Western redcedar</text><circle cx="222" cy="129" r="5" fill="#8a9a6b" stroke="none"/><text x="234" y="134" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">Trailing blackberry</text><circle cx="30" cy="161" r="5" fill="#8a9a6b" stroke="none"/><text x="42" y="166" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">Red huckleberry</text><circle cx="222" cy="161" r="5" fill="#8a9a6b" stroke="none"/><text x="234" y="166" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">Fireweed</text><circle cx="30" cy="193" r="5" fill="#8a9a6b" stroke="none"/><text x="42" y="198" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">Salal</text><circle cx="222" cy="193" r="5" fill="#8a9a6b" stroke="none"/><text x="234" y="198" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">Pearly everlasting</text><circle cx="30" cy="225" r="5" fill="#8a9a6b" stroke="none"/><text x="42" y="230" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">Deer fern</text><circle cx="222" cy="225" r="5" fill="#8a9a6b" stroke="none"/><text x="234" y="230" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">Willow, maple leaves</text><circle cx="30" cy="257" r="5" fill="#8a9a6b" stroke="none"/><text x="42" y="262" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">Tree lichens</text><circle cx="222" cy="257" r="5" fill="#8a9a6b" stroke="none"/><text x="234" y="262" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">Salmonberry, salal</text><text x="200" y="318" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Food changes: so do the deer (90%)</text>
</svg>
