<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 364" font-family="sans-serif" role="img" aria-label="Comparison of three sources on how long to wait before following a hit deer. Your call: the app does not pick one. Heart or lungs: Hunter Ed blog 2026, 30 minutes; National Deer Association 2012 article, 30 minutes; National Deer Association 2023 article, a few minutes with a rifle. Muscle or leg: Hunter Ed, 30 to 60 minutes; 2012 article, not given; 2023 article, leg hit, track at once. Liver: Hunter Ed, 4 to 6 hours; 2012 article, 2 to 4 hours; 2023 article, 8 to 10 hours. Gut: Hunter Ed, 6 to 8 hours or overnight; 2012 article, 4 to 6 hours or overnight if cool; 2023 article, 10 to 12 hours. Not sure: Hunter Ed, several hours; 2012 article, not given; 2023 article, wait as for a gut hit. All three agree: liver and gut waits are hours, longer than for a lung hit, and gut is the longest.">
<rect width="400" height="364" fill="#fffaf0"/>
<g data-tip="The sources|Hunter Ed blog (2026) and two NDA (National Deer Association) articles (2012, 2023), read directly 2026-10-11 (70%).">
<rect x="8" y="8" width="384" height="50" rx="8" fill="#2f3a2b"/>
<text x="18" y="38" font-size="15" font-weight="bold" fill="#fffaf0">Hit</text>
<text x="168" y="29" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Hunter Ed</text>
<text x="168" y="47" font-size="14" fill="#d8d2c2" text-anchor="middle">blog 2026</text>
<text x="258" y="29" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">NDA</text>
<text x="258" y="47" font-size="14" fill="#d8d2c2" text-anchor="middle">2012</text>
<text x="346" y="29" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">NDA</text>
<text x="346" y="47" font-size="14" fill="#d8d2c2" text-anchor="middle">2023</text>
</g>
<g data-tip="Heart or lungs|Sources agree on a short wait, about 30 minutes (70%). Bright red, bubbly blood: lungs. Went down in sight: go when it stops moving (Tip).">
<rect x="8" y="66" width="384" height="42" rx="6" fill="#f4eedf"/>
<text x="18" y="92" font-size="15" font-weight="bold" fill="#2f3a2b">Heart, lungs</text>
<rect x="126.0" y="73.0" width="84" height="28" rx="8" fill="#e3eedb"/>
<text x="168" y="92" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">30 min</text>
<rect x="216.0" y="73.0" width="84" height="28" rx="8" fill="#e3eedb"/>
<text x="258" y="92" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">30 min</text>
<rect x="304.0" y="73.0" width="84" height="28" rx="8" fill="#e3eedb"/>
<text x="346" y="92" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">a few min</text>
</g>
<g data-tip="Muscle or leg|Hunter Ed blog: 30 to 60 minutes. NDA 2023: leg or bone, track at once (70%).">
<rect x="8" y="112" width="384" height="42" rx="6" fill="#fffaf0"/>
<text x="18" y="138" font-size="15" font-weight="bold" fill="#2f3a2b">Muscle, leg</text>
<rect x="126.0" y="119.0" width="84" height="28" rx="8" fill="#e3eedb"/>
<text x="168" y="138" font-size="14" font-weight="bold" fill="#2f6e3b" text-anchor="middle">30 to 60 min</text>
<rect x="216.0" y="119.0" width="84" height="28" rx="8" fill="#efe8d6"/>
<text x="258" y="138" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">not given</text>
<rect x="304.0" y="119.0" width="84" height="28" rx="8" fill="#e3eedb"/>
<text x="346" y="138" font-size="14" font-weight="bold" fill="#2f6e3b" text-anchor="middle">leg: go now</text>
</g>
<g data-tip="Liver|Dark red blood, no bubbles. Every source says hours; how many differs (70%).">
<rect x="8" y="158" width="384" height="42" rx="6" fill="#f4eedf"/>
<text x="18" y="184" font-size="15" font-weight="bold" fill="#2f3a2b">Liver</text>
<rect x="126.0" y="165.0" width="84" height="28" rx="8" fill="#fde3d3"/>
<text x="168" y="184" font-size="15" font-weight="bold" fill="#b3470a" text-anchor="middle">4 to 6 h</text>
<rect x="216.0" y="165.0" width="84" height="28" rx="8" fill="#fde3d3"/>
<text x="258" y="184" font-size="15" font-weight="bold" fill="#b3470a" text-anchor="middle">2 to 4 h</text>
<rect x="304.0" y="165.0" width="84" height="28" rx="8" fill="#fde3d3"/>
<text x="346" y="184" font-size="15" font-weight="bold" fill="#b3470a" text-anchor="middle">8 to 10 h</text>
</g>
<g data-tip="Gut|Thin, green brown blood that smells. The longest wait in every source (70%). Warm afternoon: the meat clock and the waiting clock fight (Tip).">
<rect x="8" y="204" width="384" height="58" rx="6" fill="#fffaf0"/>
<text x="18" y="238" font-size="15" font-weight="bold" fill="#2f3a2b">Gut</text>
<rect x="126.0" y="210.0" width="84" height="46" rx="8" fill="#f6d9d4"/>
<text x="168" y="229" font-size="15" font-weight="bold" fill="#a3261b" text-anchor="middle">6 to 8 h</text>
<text x="168" y="247" font-size="14" fill="#a3261b" text-anchor="middle">or overnight</text>
<rect x="216.0" y="210.0" width="84" height="46" rx="8" fill="#f6d9d4"/>
<text x="258" y="229" font-size="15" font-weight="bold" fill="#a3261b" text-anchor="middle">4 to 6 h</text>
<text x="258" y="247" font-size="14" fill="#a3261b" text-anchor="middle">or overnight</text>
<rect x="304.0" y="219.0" width="84" height="28" rx="8" fill="#f6d9d4"/>
<text x="346" y="238" font-size="14" font-weight="bold" fill="#a3261b" text-anchor="middle">10 to 12 h</text>
</g>
<g data-tip="Not sure where it hit|Hunter Ed blog: several hours. NDA 2023: count down from the gut wait (70%).">
<rect x="8" y="266" width="384" height="42" rx="6" fill="#f4eedf"/>
<text x="18" y="292" font-size="15" font-weight="bold" fill="#2f3a2b">Not sure</text>
<rect x="126.0" y="273.0" width="84" height="28" rx="8" fill="#fde3d3"/>
<text x="168" y="292" font-size="15" font-weight="bold" fill="#b3470a" text-anchor="middle">several h</text>
<rect x="216.0" y="273.0" width="84" height="28" rx="8" fill="#efe8d6"/>
<text x="258" y="292" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">not given</text>
<rect x="304.0" y="273.0" width="84" height="28" rx="8" fill="#f6d9d4"/>
<text x="346" y="292" font-size="14" font-weight="bold" fill="#a3261b" text-anchor="middle">as for gut</text>
</g>
<text data-tip="Your call|Wait times are opinion, not law. The app shows all sources and picks none (70%). Rain or snow coming: go sooner, rain erases blood in an hour (Tip)." x="200" y="330" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Your call: the app does not pick one</text>
<text x="200" y="352" font-size="14" fill="#6b5b4b" text-anchor="middle">NDA: National Deer Association</text>
</svg>
