<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 432" role="img" aria-label="Cards for Maps A5 to A9. A5 Nitinat River: no shooting or hunting 500 metres either side of the river midline. A6 Cowichan Lake: no shooting or hunting in a 100 metre corridor from North Shore Road. A7 Sooke and Metchosin: No Shooting Area and No Shooting or Hunting Area, Management Units 1-1, 1-2 and 1-3. A8 Cowichan Bay: year round and seasonal No Shooting Areas, and the Ex Dinsdale property, hunting by permission only. A9 Mayo Lake: No Shooting Area, plus the Cowichan River 100 metre buffer." font-family="sans-serif">
<rect x="0" y="0" width="400" height="432" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Maps A5 to A9</text>
<rect x="6" y="40" width="190" height="114" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M6 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#c92a2a"/>
<text x="101" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">A5 Nitinat River,</text>
<text x="101" y="76" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">MU 1-4</text>
<text x="14" y="106" font-size="14" fill="#23261f" text-anchor="start">No shooting or hunting,</text>
<text x="14" y="124" font-size="14" fill="#23261f" text-anchor="start">500 m either side of</text>
<text x="14" y="142" font-size="14" fill="#23261f" text-anchor="start">the river midline</text>
<rect x="204" y="40" width="190" height="114" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M204 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#c92a2a"/>
<text x="299" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">A6 Cowichan Lake,</text>
<text x="299" y="76" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">MU 1-4</text>
<text x="212" y="106" font-size="14" fill="#23261f" text-anchor="start">No shooting or hunting,</text>
<text x="212" y="124" font-size="14" fill="#23261f" text-anchor="start">100 m corridor from</text>
<text x="212" y="142" font-size="14" fill="#23261f" text-anchor="start">North Shore Rd</text>
<rect x="6" y="162" width="190" height="132" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M6 172 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#c92a2a"/>
<text x="101" y="180" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">A7 Sooke, Metchosin</text>
<text x="14" y="228" font-size="14" fill="#23261f" text-anchor="start">No Shooting, and No</text>
<text x="14" y="246" font-size="14" fill="#23261f" text-anchor="start">Shooting or Hunting</text>
<text x="14" y="264" font-size="14" fill="#23261f" text-anchor="start">Areas, MUs 1-1 to 1-3</text>
<rect x="204" y="162" width="190" height="132" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<path d="M204 172 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#e8590c"/>
<text x="299" y="180" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">A8 Cowichan Bay,</text>
<text x="299" y="198" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">MU 1-4</text>
<text x="212" y="228" font-size="14" fill="#23261f" text-anchor="start">Year round and seasonal</text>
<text x="212" y="246" font-size="14" fill="#23261f" text-anchor="start">No Shooting Areas. Ex</text>
<text x="212" y="264" font-size="14" fill="#23261f" text-anchor="start">Dinsdale: by permission</text>
<text x="212" y="282" font-size="14" fill="#23261f" text-anchor="start">only</text>
<rect x="6" y="302" width="190" height="96" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<path d="M6 312 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#e8590c"/>
<text x="101" y="320" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">A9 Mayo Lake, MU 1-4</text>
<text x="14" y="350" font-size="14" fill="#23261f" text-anchor="start">No Shooting Area. Plus</text>
<text x="14" y="368" font-size="14" fill="#23261f" text-anchor="start">the Cowichan River 100</text>
<text x="14" y="386" font-size="14" fill="#23261f" text-anchor="start">m buffer</text>
<rect x="6" y="404" width="14" height="14" rx="3" fill="#c92a2a"/>
<text x="24" y="416" font-size="14" fill="#23261f" text-anchor="start">No hunting</text>
<rect x="112.0" y="404" width="14" height="14" rx="3" fill="#e8590c"/>
<text x="130" y="416" font-size="14" fill="#23261f" text-anchor="start">No shooting</text>
</svg>
