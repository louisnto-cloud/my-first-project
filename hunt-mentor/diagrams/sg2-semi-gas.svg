<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="How a gas semi auto works: 1 the shot passes the gas ports in the barrel, 2 a little gas pushes the piston back, 3 the piston drives the action bar and bolt back, ejecting the hull, 4 the recoil spring pushes the bolt forward and loads the next shell.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Gas: how it cycles</text>
<g transform="translate(-110 70) scale(1.65)"><path d="M0 16 L7 14 L92 22 L108 22 L108 38 L97 40 C88 42 81 46 75 53 L6 57 L0 57 Z" fill="#6b5a45" stroke="#17201A" stroke-width="0.7"/><path d="M0 16 L5 15 L5 57 L0 57 Z" fill="#3b4045"/><rect x="108" y="18" width="54" height="22" rx="2" fill="#5d646b" stroke="#17201A" stroke-width="0.7"/><rect x="122" y="21.5" width="27" height="8.5" rx="1" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><rect x="138" y="22.5" width="10" height="6.5" fill="#a7aeb3" stroke="#17201A" stroke-width="0.7"/><path d="M116 40 C116 53 140 53 142 40" fill="none" stroke="#3b4045" stroke-width="2"/><line x1="127" y1="40" x2="125" y2="49" stroke="#3b4045" stroke-width="2.2" /><circle cx="137" cy="42.5" r="2.3" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><rect x="124" y="39" width="22" height="2" fill="#1e2124" stroke="#17201A" stroke-width="0.7"/><rect x="160" y="20" width="218" height="7.5" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><line x1="160" y1="19.4" x2="378" y2="19.4" stroke="#a7aeb3" stroke-width="1.2"/><rect x="366" y="20" width="12" height="7.5" fill="#a7aeb3" stroke="#17201A" stroke-width="0.7"/><circle cx="375" cy="18.2" r="1.6" fill="#ffffff" stroke="#17201A" stroke-width="0.5"/><rect x="160" y="28.5" width="140" height="6.5" fill="#5d646b" stroke="#17201A" stroke-width="0.7"/><path d="M162 25 L292 25 L292 41 L170 41 C166 41 162 38 162 34 Z" fill="#6b5a45" stroke="#FF6A13" stroke-width="2.2"/><rect x="292" y="26.5" width="11" height="10" rx="2" fill="#a7aeb3" stroke="#17201A" stroke-width="0.7"/><rect x="140" y="30.5" width="8" height="4" rx="1" fill="#a7aeb3" stroke="#17201A" stroke-width="0.7"/><rect x="152" y="32" width="6" height="4" rx="1" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/></g>
<circle cx="302" cy="121" r="9" fill="#FF6A13" opacity="0.9"/>
<line x1="296.5" y1="139.2" x2="249.5" y2="139.2" stroke="#FF6A13" stroke-width="4" stroke-linecap="round"/><path d="M242.5 139.2 L251.5 134.8 L251.5 143.5Z" fill="#FF6A13"/>
<line x1="302.5" y1="76.0" x2="302.5" y2="114.5" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="302.5" cy="114.5" r="3" fill="#1F3D2B"/><rect x="252.5" y="52.0" width="95.0" height="24.0" rx="5" fill="#ffffff" stroke="#FF6A13" stroke-width="1.3"/><text x="300.0" y="70.0" font-size="15" font-weight="bold" fill="#FF6A13" text-anchor="middle">1 gas port</text>
<line x1="286.0" y1="179.0" x2="286.0" y2="126.1" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="286.0" cy="126.1" r="3" fill="#1F3D2B"/><rect x="231.1" y="178.0" width="117.8" height="24.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="290.0" y="196.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">2 piston back</text>
<line x1="104.5" y1="76.0" x2="104.5" y2="112.9" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="104.5" cy="112.9" r="3" fill="#1F3D2B"/><rect x="40.3" y="52.0" width="99.5" height="24.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="90.0" y="70.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">3 bolt back</text>
<line x1="201.8" y1="215.0" x2="203.5" y2="119.5" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="203.5" cy="119.5" r="3" fill="#1F3D2B"/><rect x="38.2" y="214.0" width="163.7" height="24.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="120.0" y="232.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">4 spring returns it</text>
<text x="200.0" y="288.0" font-size="15" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Gas softens recoil. Keep the piston clean.</text>
</svg>
