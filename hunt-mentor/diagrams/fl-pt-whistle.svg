<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 298" role="img" aria-label="Whistle code. Three blasts, repeated, means help: the distress signal. Agree your own short codes for the rest, for example one blast for where are you and two blasts for come to me.">
  <rect x="0" y="0" width="400" height="298" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Whistle code</text>
<rect x="10" y="46" width="380" height="56" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<text x="42.0" y="80" font-family="sans-serif" font-size="20" font-weight="bold" fill="#b3261e" text-anchor="middle">• • •</text>
<text x="80" y="68" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">3 blasts = HELP</text>
<text x="80" y="90" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">distress, repeat with pauses (80%)</text>
<rect x="10" y="108" width="380" height="56" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<text x="42.0" y="142" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2f3a2b" text-anchor="middle">•</text>
<text x="80" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">1 blast = where are you?</text>
<text x="80" y="152" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">your own code (Tip)</text>
<rect x="10" y="170" width="380" height="56" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<text x="42.0" y="204" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2f3a2b" text-anchor="middle">• •</text>
<text x="80" y="192" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">2 blasts = come to me</text>
<text x="80" y="214" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">your own code (Tip)</text>
<rect x="10" y="232" width="380" height="56" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<text x="42.0" y="266" font-family="sans-serif" font-size="22" font-weight="bold" fill="#e8590c" text-anchor="middle">!</text>
<text x="80" y="254" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Whistle on a cord</text>
<text x="80" y="276" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">outside layer, every hunt (Tip)</text>
</svg>
