<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="sans-serif" role="img" aria-label="Night road scene. A dark moose stands at the edge of the headlight beam; its eyes are above the beam so they do not shine. Look for a dark shape, not eyeshine. At dusk and in the dark, slow down.">
<rect x="0" y="0" width="400" height="290" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Moose on the road at dusk</text><rect x="0" y="36" width="400" height="264" fill="#2b3340"/><path d="M0 250 L400 210 L400 240 L0 300 Z" fill="#555555"/><path d="M40 270 L300 200 L300 250 Z" fill="#fff1c4" opacity=".35"/><g transform="translate(300 182) scale(0.9)"><g transform="translate(0 0) scale(1)"><rect x="-36" y="4" width="8" height="52" rx="4" fill="#9c8a76" stroke="#23261f" stroke-width="1.5"/><rect x="-26" y="4" width="8" height="52" rx="4" fill="#9c8a76" stroke="#23261f" stroke-width="1.5"/><rect x="26" y="4" width="8" height="52" rx="4" fill="#9c8a76" stroke="#23261f" stroke-width="1.5"/><rect x="36" y="4" width="8" height="52" rx="4" fill="#9c8a76" stroke="#23261f" stroke-width="1.5"/><path d="M-46 0 Q-48 -26 -20 -26 Q10 -40 34 -34 Q48 -26 44 2 Q20 22 -30 18 Q-48 16 -46 0 Z" fill="#15100b" stroke="#23261f" stroke-width="2"/><path d="M30 -30 L56 -40 L66 -26 L40 0 Z" fill="#15100b" stroke="#23261f" stroke-width="2" stroke-linejoin="round"/><path d="M56 -44 L86 -30 Q92 -22 84 -18 L64 -20 Q54 -26 56 -44 Z" fill="#15100b" stroke="#23261f" stroke-width="2" stroke-linejoin="round"/><path d="M66 -22 Q66 -6 60 -4 Q58 -12 62 -22 Z" fill="#15100b" stroke="#23261f" stroke-width="2"/><ellipse cx="54" cy="-50" rx="8" ry="3.5" transform="rotate(-30 54 -50)" fill="#15100b" stroke="#23261f" stroke-width="2"/><circle cx="70" cy="-34" r="1.8" fill="#eeeeee"/></g></g><rect x="20" y="258" width="40" height="22" rx="5" fill="#888888"/><text x="200" y="64" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Eyes above your headlights</text><text x="200" y="84" font-size="14" fill="#fffaf0" text-anchor="middle">Look for a dark shape, not eyeshine</text><text x="140" y="160" font-size="14" fill="#fff1c4" text-anchor="middle" font-weight="bold">Dusk and dark: slow down</text>
</svg>
