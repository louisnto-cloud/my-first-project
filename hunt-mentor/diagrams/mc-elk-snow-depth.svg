<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Snow depth gauge for elk from BC habitat models citing field studies. With a crust or about 30 cm, elk move into shrubs and conifer forest. Near 40 cm they shift to areas with less snow. Above 46 cm movement is restricted. Southeast BC elk avoided snow over 50 cm. Over 61 cm browsing replaces grazing. Over 70 cm movement is severely limited.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Snow depth and elk</text><rect x="40" y="50" width="60" height="220" rx="4" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="1.5"/><line x1="40" y1="187.5" x2="116" y2="187.5" stroke="#8a9a6b" stroke-width="3"/><text x="122" y="192.5" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Crust or 30 cm: into shrubs, conifers</text><line x1="40" y1="160.0" x2="116" y2="160.0" stroke="#8b5a2b" stroke-width="3"/><text x="122" y="165.0" font-size="14" fill="#23261f" text-anchor="start">40 cm: shift to less snow</text><line x1="40" y1="138.0" x2="116" y2="138.0" stroke="#8b5a2b" stroke-width="3"/><text x="122" y="143.0" font-size="14" fill="#23261f" text-anchor="start">46 to 50 cm: restricted, avoided</text><line x1="40" y1="102.25" x2="116" y2="102.25" stroke="#e8590c" stroke-width="3"/><text x="122" y="107.25" font-size="14" fill="#23261f" text-anchor="start">61 cm: browse replaces grazing</text><line x1="40" y1="77.5" x2="116" y2="77.5" stroke="#b03a2e" stroke-width="3"/><text x="122" y="82.5" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">70 cm: severely limited</text><rect x="40" y="50.0" width="60" height="0.1" rx="6" fill="#fffaf0"/><text x="32" y="274.0" font-size="14" fill="#6b4f35" text-anchor="end">0</text><text x="32" y="219.0" font-size="14" fill="#6b4f35" text-anchor="end">20</text><text x="32" y="164.0" font-size="14" fill="#6b4f35" text-anchor="end">40</text><text x="32" y="109.0" font-size="14" fill="#6b4f35" text-anchor="end">60</text><text x="32" y="54.0" font-size="14" fill="#6b4f35" text-anchor="end">80</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">BC habitat models citing studies (80%)</text>
</svg>
