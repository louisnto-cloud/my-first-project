<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 382" font-family="sans-serif" role="img" aria-label="Upgrades for the Arctic. Worth it, in order: 1 scope, rings and a torque driver, in orange; 2 snap caps and a cleaning kit; 3 shooting sticks; 4 a sling; 5 a spare magazine. Not worth it yet: 6 an aftermarket trigger, yours is good; 7 a muzzle brake, loud and it replaces the front sight; 8 a new stock or chassis. Never, illegal in Canada: a suppressor, or cutting the barrel or stock short.">
<rect x="0" y="0" width="400" height="382" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Upgrades: worth it, or not</text><rect x="12" y="42" width="376" height="150" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="24" y="64" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Worth it, in this order</text><circle cx="34" cy="84" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="89" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="52" y="89" font-size="14" fill="#17201A" text-anchor="start">Scope, rings, torque driver</text><circle cx="34" cy="106" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="111" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="52" y="111" font-size="14" fill="#17201A" text-anchor="start">Snap caps and a cleaning kit</text><circle cx="34" cy="128" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="133" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="52" y="133" font-size="14" fill="#17201A" text-anchor="start">Shooting sticks</text><circle cx="34" cy="150" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="155" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="52" y="155" font-size="14" fill="#17201A" text-anchor="start">Sling</text><circle cx="34" cy="172" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="177" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="52" y="177" font-size="14" fill="#17201A" text-anchor="start">Spare magazine</text><rect x="12" y="200" width="376" height="104" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="24" y="222" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Not worth it yet</text><circle cx="34" cy="242" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="247" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text><text x="52" y="247" font-size="14" fill="#17201A" text-anchor="start">Aftermarket trigger: yours is good</text><circle cx="34" cy="264" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="269" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">7</text><text x="52" y="269" font-size="14" fill="#17201A" text-anchor="start">Muzzle brake: loud, loses the front sight</text><circle cx="34" cy="286" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="291" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">8</text><text x="52" y="291" font-size="14" fill="#17201A" text-anchor="start">New stock or chassis: learn this one</text><rect x="12" y="312" width="376" height="58" rx="8" fill="#FFE6D6" stroke="#FF6A13" stroke-width="1.5"/><text x="24" y="334" font-size="15" fill="#FF6A13" text-anchor="start" font-weight="bold">Never: illegal in Canada</text><text x="24" y="356" font-size="14" fill="#17201A" text-anchor="start">Suppressor. Cutting the barrel or stock short.</text>
</svg>
