  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4. Bed under it</text><rect x="0" y="230" width="400" height="70" rx="0" fill="#dfe6d3"/><polygon points="110,150 290,150 330,230 70,230" fill="#4f7a52" opacity=".55"/><rect x="110" y="214" width="180" height="16" rx="4" fill="#8a9a6b"/><rect x="164" y="201" width="45" height="13" rx="4.5" fill="#e8590c"/><line x1="209" y1="209" x2="241" y2="210" stroke="#2f3a2b" stroke-width="7.2" stroke-linecap="round"/><circle cx="155" cy="206" r="8.1" fill="#d9b48f"/><text x="200" y="120" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Bed before dark</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Thick bed, then crawl in</text>
