<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="After the shot on a bear. At once: watch, listen and mark the spot. For 30 minutes: stay put, reload and stay quiet. After 30 minutes, for a lung or heart hit: start to track. Gut hit or unsure: wait longer, hours. Approach from above and behind with the rifle ready. A dead bear has its eyes open and still. Then cancel your licence before you touch it. Tips plus the licence rule.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">After the shot</text><circle cx="30" cy="64" r="9" fill="#2f3a2b"/><line x1="30" y1="73" x2="30" y2="95" stroke="#2f3a2b" stroke-width="3"/><text x="50" y="69" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">0 min</text><text x="140" y="69" font-size="15" fill="#23261f" text-anchor="start">Watch, listen, mark the spot</text><circle cx="30" cy="104" r="9" fill="#2f3a2b"/><line x1="30" y1="113" x2="30" y2="135" stroke="#2f3a2b" stroke-width="3"/><text x="50" y="109" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">0 to 30</text><text x="140" y="109" font-size="15" fill="#23261f" text-anchor="start">Stay put. Reload. Quiet.</text><circle cx="30" cy="144" r="9" fill="#e8590c"/><line x1="30" y1="153" x2="30" y2="175" stroke="#2f3a2b" stroke-width="3"/><text x="50" y="149" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">30 min</text><text x="140" y="149" font-size="15" fill="#23261f" text-anchor="start">Lungs or heart: start to track</text><circle cx="30" cy="184" r="9" fill="#2f3a2b"/><line x1="30" y1="193" x2="30" y2="215" stroke="#2f3a2b" stroke-width="3"/><text x="50" y="189" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Hours</text><text x="140" y="189" font-size="15" fill="#23261f" text-anchor="start">Gut or unsure: wait longer</text><circle cx="30" cy="224" r="9" fill="#2f3a2b"/><line x1="30" y1="233" x2="30" y2="255" stroke="#2f3a2b" stroke-width="3"/><text x="50" y="229" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Approach</text><text x="140" y="229" font-size="15" fill="#23261f" text-anchor="start">From above and behind, rifle up</text><circle cx="30" cy="264" r="9" fill="#e8590c"/><text x="50" y="269" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">At the bear</text><text x="140" y="269" font-size="15" fill="#23261f" text-anchor="start">Eyes open and still? Then notch</text>
</svg>
