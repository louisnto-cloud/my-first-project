<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 416" font-family="sans-serif" role="img" aria-label="Three respect rules. One: reserve land is private, ask the band office before you hunt on or cross it, synopsis page 9, 99 percent. Two: give Indigenous harvesters room at a spot, a Tip. Three: pack out shells, remains and everything else, a Tip.">
<rect x="0" y="0" width="400" height="416" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Respect on First Nations land</text>
<rect x="16" y="42" width="368" height="116" rx="10" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2.5"/>
<text x="26" y="66" font-size="15" font-weight="bold" fill="#23261f">Reserve land is private</text>
<circle cx="368.0" cy="60" r="11" fill="#8a9a6b"/><path d="M363.05 60 l3.3 3.8499999999999996 l6.6 -7.699999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="26" y="84" font-size="14" fill="#2f3a2b">Ask the band office before you hunt on or</text>
<text x="26" y="102" font-size="14" fill="#2f3a2b">cross it (99%).</text>
<g transform="translate(46.0 138) scale(0.62)"><path d="M-20 18 v-18 l20 -16 l20 16 v18 z" fill="#c9b79c" stroke="#2f3a2b" stroke-width="2"/><rect x="-5" y="4" width="10" height="14" fill="#2f3a2b"/></g>
<g transform="translate(133.0 138) scale(0.62)"><rect x="-20" y="-22" width="40" height="44" rx="3" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/><path d="M-13 -12 h26 M-13 -4 h26 M-13 4 h18" stroke="#8a9a6b" stroke-width="2.5"/><path d="M8 18 l18 -26 l5 3 l-18 26 l-6 2 z" fill="#e8590c"/></g>
<rect x="16" y="168" width="368" height="116" rx="10" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2.5"/>
<text x="26" y="192" font-size="15" font-weight="bold" fill="#23261f">Give way</text>
<circle cx="368.0" cy="186" r="11" fill="#8a9a6b"/><path d="M363.05 186 l3.3 3.8499999999999996 l6.6 -7.699999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="26" y="210" font-size="14" fill="#2f3a2b">Give Indigenous harvesters room at a spot</text>
<text x="26" y="228" font-size="14" fill="#2f3a2b">(Tip).</text>
<g transform="translate(46.0 264) scale(0.62)"><circle cx="-12" cy="-12" r="7" fill="#2f3a2b"/><path d="M-23 20 v-14 q0 -8 11 -8 q11 0 11 8 v14 z" fill="#e8590c"/><circle cx="12" cy="-12" r="7" fill="#2f3a2b"/><path d="M1 20 v-14 q0 -8 11 -8 q11 0 11 8 v14 z" fill="#8a9a6b"/></g>
<rect x="16" y="294" width="368" height="98" rx="10" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2.5"/>
<text x="26" y="318" font-size="15" font-weight="bold" fill="#23261f">Pack it out</text>
<circle cx="368.0" cy="312" r="11" fill="#8a9a6b"/><path d="M363.05 312 l3.3 3.8499999999999996 l6.6 -7.699999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="26" y="336" font-size="14" fill="#2f3a2b">Shells, remains, everything (Tip).</text>
<g transform="translate(46.0 372) scale(0.62)"><path d="M-32 1 h36 l5 -3 h24 v3 h-22 l-3 4 h-12 l-6 9 h-10 l-4 -9 h-8 z" fill="#2f3a2b"/></g>
</svg>
