<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A deer head on the ground. A long stick touches the open eye. No blink means it is dead. A blink means back off with the rifle ready.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">2  Touch the eye with a stick</text><g transform="translate(220 180) scale(2.2)"><path d="M10 10 L-20 -10 L-6 -24 L24 -2 Z" fill="#6b4f35" stroke="#23261f" stroke-width="1.5"/><ellipse cx="-24" cy="-14" rx="22" ry="12" fill="#6b4f35" stroke="#23261f" stroke-width="1.5"/><path d="M-12 -24 L-4 -40 L-4 -22 Z" fill="#6b4f35" stroke="#23261f" stroke-width="1.5"/><circle cx="-30" cy="-17" r="3.5" fill="#23261f"/></g><line x1="60" y1="70" x2="152" y2="138" stroke="#8b5a2b" stroke-width="6" stroke-linecap="round"/><text x="40" y="60" font-size="14" font-weight="bold" fill="#23261f">Long stick</text><text x="300" y="70" font-size="16" font-weight="bold" text-anchor="middle" fill="#2f3a2b">No blink:</text><text x="300" y="90" font-size="16" font-weight="bold" text-anchor="middle" fill="#2f3a2b">it is dead</text><text x="200" y="292" font-size="14" text-anchor="middle" fill="#2f3a2b">Blinks? Back off, rifle ready, legal hours only</text>
</svg>
