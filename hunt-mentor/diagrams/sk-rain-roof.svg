ry, air moves</text><path d="M260 100 q 40 -14 80 0 l -4 90 q -36 10 -72 0 Z" fill="#4a7fb0" fill-opacity=".35" stroke="#23261f" stroke-width="2.5"/><text x="300" y="150" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">plastic</text><path d="M286 212 L314 240 M314 212 L286 240" stroke="#b3261e" stroke-width="4" stroke-linecap="round"/><text x="300" y="266" font-size="15" font-weight="bold" text-anchor="middle" fill="#b3261e">Traps heat, sweats</text>
