<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two hunter leapfrog on a bearing: you stand with the compass, your brother walks ahead along the line, and you wave him left or right until he is on it. Then you walk to him and repeat. Stay in sight. Tip.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Two hunters: the leapfrog</text><rect x="20" y="44" width="360" height="210" rx="6" fill="#dfe6d3"/><line x1="70" y1="230" x2="330" y2="70" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><g transform="translate(80 238) scale(0.9)"><circle cx="0" cy="-30" r="7" fill="#2f3a2b"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" fill="none" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(40 200) scale(0.45)"><rect x="-34" y="-60" width="68" height="120" rx="8" fill="#e7eef5" stroke="#2f3a2b" stroke-width="2"/><line x1="0" y1="-28" x2="-5.51091059616309e-16" y2="-47.0" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="0.0,-56.0 -4.5,-47.0 4.5,-47.0" fill="#e8590c"/><circle cx="0" cy="12" r="28" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/><circle cx="0" cy="12" r="21" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><polygon points="0.0,-9.0 4.5,12.0 -4.5,12.0" fill="#c92a2a"/><polygon points="0.0,33.0 4.5,12.0 -4.5,12.0" fill="#868e96"/><circle cx="0" cy="12" r="3" fill="#23261f"/></g><g transform="translate(250 128) scale(0.9)"><circle cx="0" cy="-30" r="7" fill="#8b5a2b"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" fill="none" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="240" y1="116" x2="218.0" y2="116.0" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><polygon points="210.0,116.0 218.0,120.0 218.0,112.0" fill="#2f3a2b"/><line x1="270" y1="116" x2="292.0" y2="116.0" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><polygon points="300.0,116.0 292.0,112.0 292.0,120.0" fill="#2f3a2b"/><text x="115" y="250" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">You: compass</text><text x="262" y="166" font-size="15" fill="#8b5a2b" text-anchor="middle" font-weight="bold">Brother walks ahead</text><text x="262" y="186" font-size="14" fill="#23261f" text-anchor="middle">You wave him onto the line</text><text x="200" y="274" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Walk to him, repeat. Stay in sight.</text><text x="200" y="293" font-size="14" fill="#6b4f35" text-anchor="middle">Tip: classic two person method</text>
</svg>
