<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 325" font-family="sans-serif" role="img" aria-label="A day curve: deer movement peaks near dawn and dusk, lower at midday and at night, but deer can move any time. Legal hunting hours run from 1 hour before sunrise to 1 hour after sunset.">
<rect width="400" height="325" fill="#EEF1EA"/>
<text x="200" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1F3D2B">The deer day</text>
<rect x="14" y="60" width="372" height="120" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.5"/><path d="M24 160 C60 160 70 80 96 80 C122 80 132 150 170 150 C220 150 230 150 260 150 C290 150 300 80 322 80 C346 80 356 160 376 160" fill="#cfe0c3" stroke="#1F3D2B" stroke-width="2"/><text x="96" y="74" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F3D2B">dawn</text><text x="322" y="74" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F3D2B">dusk</text><text x="24" y="200" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">night</text><text x="200" y="200" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">midday</text><text x="376" y="200" font-size="14" text-anchor="end" font-weight="normal" fill="#17201A">night</text><rect x="60" y="214" width="300" height="22" rx="4" fill="#FF6A13" stroke="none" stroke-width="0"/><text x="210" y="230" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">Legal hours</text><text x="200" y="262" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">1 hour before sunrise to</text><text x="200" y="282" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">1 hour after sunset (99%)</text><text x="200" y="310" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Most active near dawn and dusk (80%)</text>
</svg>
