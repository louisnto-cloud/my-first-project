<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 336" font-family="sans-serif" role="img" aria-label="A 5 shot group low and left of the aim point on a 1 cm grid. Turn the turrets up and right. A quarter MOA click moves the hit about 0.7 cm at 100 m, 0.36 cm at 50 m and 0.18 cm at 25 m. Clicks needed equals the miss in cm divided by the click value at that distance."><rect x="0" y="0" width="400" height="336" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Move the group with clicks</text><rect x="20" y="44" width="200" height="200" fill="#FFFFFF" stroke="#1F3D2B"/><line x1="45" y1="44" x2="45" y2="244" stroke="#D9E0D5" stroke-width="1"/><line x1="20" y1="69" x2="220" y2="69" stroke="#D9E0D5" stroke-width="1"/><line x1="70" y1="44" x2="70" y2="244" stroke="#D9E0D5" stroke-width="1"/><line x1="20" y1="94" x2="220" y2="94" stroke="#D9E0D5" stroke-width="1"/><line x1="95" y1="44" x2="95" y2="244" stroke="#D9E0D5" stroke-width="1"/><line x1="20" y1="119" x2="220" y2="119" stroke="#D9E0D5" stroke-width="1"/><line x1="120" y1="44" x2="120" y2="244" stroke="#D9E0D5" stroke-width="1"/><line x1="20" y1="144" x2="220" y2="144" stroke="#D9E0D5" stroke-width="1"/><line x1="145" y1="44" x2="145" y2="244" stroke="#D9E0D5" stroke-width="1"/><line x1="20" y1="169" x2="220" y2="169" stroke="#D9E0D5" stroke-width="1"/><line x1="170" y1="44" x2="170" y2="244" stroke="#D9E0D5" stroke-width="1"/><line x1="20" y1="194" x2="220" y2="194" stroke="#D9E0D5" stroke-width="1"/><line x1="195" y1="44" x2="195" y2="244" stroke="#D9E0D5" stroke-width="1"/><line x1="20" y1="219" x2="220" y2="219" stroke="#D9E0D5" stroke-width="1"/><circle cx="120" cy="144" r="10" fill="none" stroke="#1F3D2B" stroke-width="3"/><line x1="120" y1="130" x2="120" y2="158" stroke="#1F3D2B" stroke-width="1.5"/><line x1="106" y1="144" x2="134" y2="144" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="62" cy="196" r="4" fill="#17201A"/><circle cx="70" cy="204" r="4" fill="#17201A"/><circle cx="58" cy="208" r="4" fill="#17201A"/><circle cx="66" cy="200" r="4" fill="#17201A"/><circle cx="74" cy="210" r="4" fill="#17201A"/><line x1="66" y1="200" x2="66.0" y2="161.0" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><path d="M66 150 L60.0 161.0 L72.0 161.0z" fill="#FF6A13"/><line x1="66" y1="150" x2="101.0" y2="150.0" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><path d="M112 150 L101.0 144.0 L101.0 156.0z" fill="#FF6A13"/><text x="240" y="72" font-size="15" font-weight="bold" text-anchor="start" fill="#17201A">Group: low left</text><text x="240" y="96" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Move it: UP and</text><text x="240" y="116" font-size="15" font-weight="bold" text-anchor="start" fill="#FF6A13">RIGHT</text><text x="240" y="150" font-size="15" font-weight="bold" text-anchor="start" fill="#17201A">1/4 MOA click:</text><text x="240" y="172" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">0.7 cm at 100 m</text><text x="240" y="192" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">0.36 cm at 50 m</text><text x="240" y="212" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">0.18 cm at 25 m</text><rect x="8" y="262" width="384" height="34" rx="9" fill="#1F3D2B"/><text x="200" y="284.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Clicks needed = miss (cm) / click (cm)</text><text x="200" y="324" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">Grid squares here: 1 cm. Read your turret.</text></svg>
