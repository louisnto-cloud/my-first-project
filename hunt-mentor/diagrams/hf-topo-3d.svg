<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="How contour lines are made. Top: side view of a hill, steep on the left, gentle on the right, cut by three flat slices. Bottom: the map view, where each slice becomes a ring. Rings sit close together on the steep side and far apart on the gentle side.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="12" y="22" font-size="15" font-weight="bold" fill="#2f3a2b">Side view</text>
  <path d="M40 140 L80 120 L120 70 L145 40 L170 50 L240 90 L340 140 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
  <g stroke="#8b5a2b" stroke-width="2" stroke-dasharray="5 4" fill="none">
    <line x1="60" y1="115" x2="320" y2="115"/><line x1="60" y1="90" x2="320" y2="90"/><line x1="60" y1="65" x2="320" y2="65"/>
  </g>
  <g stroke="#8a9a6b" stroke-width="1.5" stroke-dasharray="2 4" fill="none">
    <line x1="84" y1="115" x2="84" y2="225"/><line x1="104" y1="90" x2="104" y2="225"/><line x1="124" y1="65" x2="124" y2="225"/>
    <line x1="196" y1="65" x2="196" y2="225"/><line x1="240" y1="90" x2="240" y2="225"/><line x1="290" y1="115" x2="290" y2="225"/>
  </g>
  <text x="12" y="172" font-size="15" font-weight="bold" fill="#2f3a2b">Map view</text>
  <g fill="none" stroke="#8b5a2b" stroke-width="2.5">
    <ellipse cx="187" cy="225" rx="103" ry="48"/><ellipse cx="172" cy="225" rx="68" ry="33"/><ellipse cx="160" cy="225" rx="36" ry="18"/>
  </g>
  <circle cx="148" cy="225" r="4" fill="#2f3a2b"/>
  <text x="392" y="40" font-size="14" fill="#2f3a2b" text-anchor="end">Each slice</text>
  <text x="392" y="56" font-size="14" fill="#2f3a2b" text-anchor="end">= one line</text>
  <text x="12" y="294" font-size="15" font-weight="bold" fill="#e8590c">Steep: lines close</text>
  <text x="388" y="294" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="end">Gentle: far apart</text>
</svg>
