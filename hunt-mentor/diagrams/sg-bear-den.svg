<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="sans-serif" role="img" aria-label="Black bear den calendar. Most bears are denned December to April, WildSafeBC. In a study just south of BC, bears left dens from 4 April to 22 May and entered dens from 15 October to 19 November. Cubs are born in January or February. Interior bears den about 5 to 7 months.">
<rect width="400" height="330" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Black bear den calendar</text>
<rect x="120.0" y="44" width="22.3" height="202" fill="#f1ead9"/>
<text x="131.2" y="264" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">J</text>
<text x="153.5" y="264" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">F</text>
<rect x="164.6" y="44" width="22.3" height="202" fill="#f1ead9"/>
<text x="175.8" y="264" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">M</text>
<text x="198.1" y="264" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">A</text>
<rect x="209.2" y="44" width="22.3" height="202" fill="#f1ead9"/>
<text x="220.3" y="264" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">M</text>
<text x="242.7" y="264" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">J</text>
<rect x="253.8" y="44" width="22.3" height="202" fill="#f1ead9"/>
<text x="264.9" y="264" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">J</text>
<text x="287.2" y="264" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">A</text>
<rect x="298.4" y="44" width="22.3" height="202" fill="#f1ead9"/>
<text x="309.5" y="264" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">S</text>
<text x="331.9" y="264" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">O</text>
<rect x="343.0" y="44" width="22.3" height="202" fill="#f1ead9"/>
<text x="354.1" y="264" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">N</text>
<text x="376.4" y="264" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">D</text>
<g data-tip="Denned|WildSafeBC: most bears are denned December to April (75%). Interior bears den about 5 to 7 months, south coast bears 3 to 5 (85%).">
<rect x="4" y="52" width="392" height="46" fill="#000" fill-opacity="0"/>
<text x="8" y="72" font-size="15" font-weight="bold" fill="#2f3a2b">Denned</text>
<rect x="365.3" y="58" width="22.3" height="26" rx="6" fill="#2f3a2b"/>
<rect x="120.0" y="58" width="89.2" height="26" rx="6" fill="#2f3a2b"/>
<text x="8" y="90" font-size="14" fill="#6b5b4b">Dec to Apr</text>
</g>
<g data-tip="Coming out|Northeast Cascades study, just south of BC: males out 4 April to 7 May, females 4 April to 22 May (80%).">
<rect x="4" y="101" width="392" height="46" fill="#000" fill-opacity="0"/>
<text x="8" y="121" font-size="15" font-weight="bold" fill="#2f3a2b">Coming out</text>
<rect x="189.1" y="107" width="35.9" height="26" rx="6" fill="#8a9a6b"/>
<text x="8" y="139" font-size="14" fill="#6b5b4b">4 Apr to 22 May</text>
</g>
<g data-tip="Going in|Same study: females 15 October to 19 November, males 22 October to 19 November (80%). Sows in first, big males last. Some bears, often males, may not den if food lasts (75%).">
<rect x="4" y="150" width="392" height="46" fill="#000" fill-opacity="0"/>
<text x="8" y="170" font-size="15" font-weight="bold" fill="#2f3a2b">Going in</text>
<rect x="330.8" y="156" width="26.4" height="26" rx="6" fill="#8b5a2b"/>
<text x="8" y="188" font-size="14" fill="#6b5b4b">15 Oct to 19 Nov</text>
</g>
<g data-tip="Cubs born|Cubs are born in the den in January or February (85%).">
<rect x="4" y="199" width="392" height="46" fill="#000" fill-opacity="0"/>
<text x="8" y="219" font-size="15" font-weight="bold" fill="#2f3a2b">Cubs born</text>
<rect x="120.0" y="205" width="44.6" height="26" rx="6" fill="#e8590c"/>
<text x="8" y="237" font-size="14" fill="#6b5b4b">Jan or Feb</text>
</g>
<g data-tip="Den sites|Interior dens: tree cavities, rock cavities, under brush piles, or holes dug into the ground (90%). When cold weather arrives, bears become lethargic and enter their dens (90%).">
<rect x="10" y="272" width="380" height="50" rx="8" fill="#f4eedf"/>
<path d="M24 312 Q40 282 56 312z" fill="#6b4f35"/><path d="M33 312 Q40 296 47 312z" fill="#2f3a2b"/>
<text x="68" y="292" font-size="15" font-weight="bold" fill="#2f3a2b">Out and in dates: Cascades</text>
<text x="68" y="312" font-size="14" fill="#6b4f35">study, just south of BC (80%)</text>
</g>
</svg>
