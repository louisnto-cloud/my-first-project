<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Black bear den calendar. Most bears are denned December to April, WildSafeBC. In a study just south of BC, bears left dens from 4 April to 22 May and entered dens from 15 October to 19 November. Cubs are born in January or February.">
