<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 356" font-family="sans-serif" role="img" aria-label="Map view of a cliff band of 40 degrees or more, with a scale bar of 0 to 500 m. Orange dashed lines on each side mark about 400 to 500 m out from the cliffs, the distance mountain goats usually stay within when feeding, often less in winter. Four white goats feed inside that band. Cliffs are their safety.">
