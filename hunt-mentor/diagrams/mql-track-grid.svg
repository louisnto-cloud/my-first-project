<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bird tracks drawn on a grid of 1 centimetre squares. A quail track, about 3.5 centimetres long, a Tip from a related quail, VERIFY. A grouse track, about 5 centimetres, 75 percent. Both show three toes forward and a short hind toe. Quail walk with prints in one line, one in front of the next, 60 percent.">
