<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 412" font-family="sans-serif" role="img" aria-label="Legal deer hunting windows at Heffley Creek: 15 October 6:22 to 19:11; 31 October 6:49 to 18:39; 1 November 5:51 to 17:38 if clocks fall back, VERIFY; 30 November 6:39 to 17:00. Ducks get half an hour less at each end. My calculation, 85 percent.">
<rect width="400" height="412" fill="#fffaf0"/>
<text x="200" y="27" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Legal hours shrink through the season</text>
<text x="200" y="47" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Deer, Heffley Creek</text>
<line x1="44.3" y1="80" x2="44.3" y2="326" stroke="#d6d0bf" stroke-width="1.2"/>
<text x="44.3" y="74" font-size="14" fill="#6b5b4b" text-anchor="middle">6:00</text>
<line x1="117.1" y1="80" x2="117.1" y2="326" stroke="#d6d0bf" stroke-width="1.2"/>
<text x="117.1" y="74" font-size="14" fill="#6b5b4b" text-anchor="middle">9:00</text>
<line x1="189.9" y1="80" x2="189.9" y2="326" stroke="#d6d0bf" stroke-width="1.2"/>
<text x="189.9" y="74" font-size="14" fill="#6b5b4b" text-anchor="middle">12:00</text>
<line x1="262.7" y1="80" x2="262.7" y2="326" stroke="#d6d0bf" stroke-width="1.2"/>
<text x="262.7" y="74" font-size="14" fill="#6b5b4b" text-anchor="middle">15:00</text>
<line x1="335.5" y1="80" x2="335.5" y2="326" stroke="#d6d0bf" stroke-width="1.2"/>
<text x="335.5" y="74" font-size="14" fill="#6b5b4b" text-anchor="middle">18:00</text>
<text x="14" y="106" font-size="16" font-weight="bold" fill="#2f3a2b" stroke="#fffaf0" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">15 Oct</text>
<rect x="53.2" y="112" width="311.0" height="28" rx="5" fill="#2f3a2b"/>
<text x="208.7" y="132" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">6:22 to 19:11</text>
<text x="14" y="166" font-size="16" font-weight="bold" fill="#2f3a2b" stroke="#fffaf0" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">31 Oct</text>
<rect x="64.1" y="172" width="287.2" height="28" rx="5" fill="#2f3a2b"/>
<text x="207.7" y="192" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">6:49 to 18:39</text>
<text x="14" y="226" font-size="16" font-weight="bold" fill="#2f3a2b" stroke="#fffaf0" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">1 Nov*</text>
<rect x="40.6" y="232" width="285.9" height="28" rx="5" fill="#2f3a2b"/>
<text x="183.6" y="252" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">5:51 to 17:38</text>
<text x="14" y="286" font-size="16" font-weight="bold" fill="#2f3a2b" stroke="#fffaf0" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">30 Nov</text>
<rect x="60.0" y="292" width="251.2" height="28" rx="5" fill="#2f3a2b"/>
<text x="185.6" y="312" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">6:39 to 17:00</text>
<text x="14" y="350" font-size="15" font-weight="bold" fill="#c2410c">*If clocks fall back on 1 November: VERIFY.</text>
<text x="14" y="371" font-size="15" font-weight="bold" fill="#2f3a2b">Ducks: 30 min less each end.</text>
<text x="14" y="392" font-size="15" fill="#6b5b4b">My calculation (85%).</text>
</svg>
