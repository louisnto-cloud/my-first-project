<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Common over under problems: 1 second barrel does not fire because the trigger was not fully released, common with gloves. 2 action will not close because dirt is on the breech face. 3 the gun opens stiff when new. 4 hulls stick when left in the chambers.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Over under: what goes wrong</text>
<rect x="12" y="50" width="376" height="50" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.6"/>
<circle cx="36" cy="75" r="13" fill="#1F3D2B"/><text x="36" y="80.4" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="58.0" y="71.0" font-size="16" font-weight="bold" fill="#1F3D2B" text-anchor="start">Second barrel will not fire</text>
<text x="58.0" y="91.0" font-size="14" fill="#17201A" text-anchor="start">Let the trigger fully forward first.</text>
<rect x="12" y="108" width="376" height="50" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.6"/>
<circle cx="36" cy="133" r="13" fill="#1F3D2B"/><text x="36" y="138.4" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="58.0" y="129.0" font-size="16" font-weight="bold" fill="#1F3D2B" text-anchor="start">Action will not close</text>
<text x="58.0" y="149.0" font-size="14" fill="#17201A" text-anchor="start">Unload. Clean the breech. No force.</text>
<rect x="12" y="166" width="376" height="50" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.6"/>
<circle cx="36" cy="191" r="13" fill="#1F3D2B"/><text x="36" y="196.4" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="58.0" y="187.0" font-size="16" font-weight="bold" fill="#1F3D2B" text-anchor="start">Stiff to open</text>
<text x="58.0" y="207.0" font-size="14" fill="#17201A" text-anchor="start">Pull down a little on the forearm.</text>
<rect x="12" y="224" width="376" height="50" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.6"/>
<circle cx="36" cy="249" r="13" fill="#1F3D2B"/><text x="36" y="254.4" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="58.0" y="245.0" font-size="16" font-weight="bold" fill="#1F3D2B" text-anchor="start">Hulls left in chambers</text>
<text x="58.0" y="265.0" font-size="14" fill="#17201A" text-anchor="start">Take them out: they sweat moisture.</text>
<text x="200.0" y="290.0" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">From the Browning Citori manual.</text>
</svg>
