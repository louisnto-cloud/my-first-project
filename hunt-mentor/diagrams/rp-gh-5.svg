<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 5: shoot only when hillside, not sky, is behind the animal. The deer stands with the hill behind it, which is safe. Never shoot a deer on the skyline.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">5. Shoot only with a backstop</text>
<rect x="0" y="40" width="400" height="260" fill="#e9dfa8"/>
<path d="M0 40 H400 V100 L300 120 L250 230 H0z" fill="#dfe6d3"/>
<path d="M220 300 L300 120 L400 100 L400 300 Z" fill="#cdbf7f"/>
<g transform="translate(290 232) scale(1.1)"><ellipse cx="0" cy="-22" rx="16" ry="8" fill="#8b5a2b"/><path d="M12 -26 L18 -40 L24 -40 L20 -26 Z" fill="#8b5a2b"/><ellipse cx="24" cy="-42" rx="6" ry="3.5" fill="#8b5a2b"/><path d="M19 -45 l-3 -6 M22 -45 l2 -6" stroke="#8b5a2b" stroke-width="2"/><path d="M-10 -16 v16 M-5 -16 v16 M8 -16 v16 M12 -16 v16" stroke="#8b5a2b" stroke-width="2.5"/><path d="M-16 -24 l-3 4" stroke="#fffaf0" stroke-width="2"/></g>
<line x1="62" y1="226" x2="270" y2="208" stroke="#e8590c" stroke-width="2" stroke-dasharray="6 4"/>
<g transform="translate(50 242) scale(1.1)"><circle cx="0" cy="-34" r="6" fill="#e8590c"/><path d="M-6 -27 h12 v14 h-12 Z" fill="#e8590c"/><path d="M-4 -13 l-2 13 M4 -13 l2 13" stroke="#2f3a2b" stroke-width="3"/></g>
<line x1="350" y1="150" x2="340" y2="87" stroke="#2f6e3b" stroke-width="1.3"/><circle cx="350" cy="150" r="2.6" fill="#2f6e3b"/>
<rect x="248.3" y="58.0" width="139.7" height="29.0" rx="5" fill="#fffaf0" stroke="#2f6e3b" stroke-width="1.2"/>
<text x="318.17" y="78.5" font-size="16" font-weight="bold" fill="#2f6e3b" text-anchor="middle">hill behind: safe</text>
<rect x="8" y="262" width="204" height="30" rx="6" fill="#fffaf0" opacity=".9"/><text x="110" y="283" font-size="15" font-weight="bold" fill="#b33a1f" text-anchor="middle">Never a deer on the skyline</text>
</svg>
