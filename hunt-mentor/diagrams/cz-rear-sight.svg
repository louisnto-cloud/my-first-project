e-width="1.4"/><circle cx="60" cy="134" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="60" y="139" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text><circle cx="340" cy="134" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="340" y="139" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text><circle cx="26" cy="217" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="222" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><text x="42" y="222" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Slider: marks 25 to 200 m</text><circle cx="26" cy="241" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="246" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text><text x="42" y="246" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Button: press, then slide</text><circle cx="26" cy="265" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="270" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text><text x="42" y="270" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Windage screws, both sides</text><text x="16" y="300" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Marks are a guide. Your ammo decides (CZ).</text></svg>
