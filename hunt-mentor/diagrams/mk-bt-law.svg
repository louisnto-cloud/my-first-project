<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 349" font-family="sans-serif" role="img" aria-label="You must try to recover it. Wounded animal: All reasonable effort to find it (95%). Boat retrieval: No loaded firearm aboard, or motor off (99%). Wrong animal or accident: Cancel licence, report (95%). Walking away after 10 minutes is not reasonable effort (95%)..">
<rect width="400" height="349" rx="12" fill="#EEF1EA"/>
<text x="16" y="30" font-size="18" font-weight="bold" fill="#1F3D2B">You must try to recover it</text>
<text x="22" y="58" font-size="14" font-weight="bold" fill="#1F3D2B">Situation</text><text x="172" y="58" font-size="14" font-weight="bold" fill="#1F3D2B">What the law says</text>
<g data-tip="Wounded animal|&quot;No person shall kill, cripple or wound game without making all reasonable effort to locate, dispatch, retrieve and include it in their bag limit&quot; (95%)."><rect x="12" y="68" width="376" height="78" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="3"/><rect x="12" y="68" width="150" height="78" rx="8" fill="#FF6A13"/><rect x="154" y="68" width="8" height="78" fill="#FF6A13"/><text x="22" y="90" font-size="15" font-weight="bold" fill="#17201A">Wounded animal</text><text x="172" y="90" font-size="15" fill="#17201A">All reasonable effort to</text>
<text x="172" y="109" font-size="15" fill="#17201A">find it</text><text x="172" y="130" font-size="14" fill="#1F3D2B">95%</text></g>
<g data-tip="Boat retrieval|You may retrieve a dead or injured animal with a boat if nobody aboard has a loaded firearm, or if the boat is not being propelled by a motor (99%, synopsis page 12)."><rect x="12" y="154" width="376" height="78" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><rect x="12" y="154" width="150" height="78" rx="8" fill="#1F3D2B"/><rect x="154" y="154" width="8" height="78" fill="#1F3D2B"/><text x="22" y="176" font-size="15" font-weight="bold" fill="#FFFFFF">Boat retrieval</text><text x="172" y="176" font-size="15" fill="#17201A">No loaded firearm aboard,</text>
<text x="172" y="195" font-size="15" fill="#17201A">or motor off</text><text x="172" y="216" font-size="14" fill="#1F3D2B">99%</text></g>
<g data-tip="Wrong animal or accident|Cancel the licence, write on it in ink that you intend to self report, and call RAPP (95%)."><rect x="12" y="240" width="376" height="59" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><rect x="12" y="240" width="150" height="59" rx="8" fill="#1F3D2B"/><rect x="154" y="240" width="8" height="59" fill="#1F3D2B"/><text x="22" y="262" font-size="15" font-weight="bold" fill="#FFFFFF">Wrong animal</text>
<text x="22" y="281" font-size="15" font-weight="bold" fill="#FFFFFF">or accident</text><text x="172" y="262" font-size="15" fill="#17201A">Cancel licence, report</text><text x="172" y="283" font-size="14" fill="#1F3D2B">95%</text></g>
<text x="16" y="319" font-size="14" font-weight="bold" fill="#17201A">Walking away after 10 minutes is not reasonable</text>
<text x="16" y="337" font-size="14" font-weight="bold" fill="#17201A">effort (95%).</text>
</svg>
