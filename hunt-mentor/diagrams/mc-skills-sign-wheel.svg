<text x="200" y="178" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Which way?</text>
<text x="200" y="197" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Doing what?</text>
