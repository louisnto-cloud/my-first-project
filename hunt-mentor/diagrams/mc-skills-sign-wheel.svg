<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A wheel of seven kinds of sign around a centre: tracks, droppings, beds, rubs, scrapes, trails and feathers. The centre asks four questions every sign answers: who made it, when, which way it went, and what it was doing.">
