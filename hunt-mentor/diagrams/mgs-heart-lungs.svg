<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side cutaway of a goose. The lungs lie tight against the back ribs. The heart sits low and forward, at the base of the neck, with big vessels running up the neck. The liver lies behind the heart, and the gut and gizzard fill the rear of the body. Heart and lungs are in the front half of the body, 80 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Where the engine sits</text><path d="M60 170 Q40 150 70 125 Q110 100 190 105 L250 100 Q262 60 285 40 Q300 30 318 38 L340 44 L318 50 Q300 50 292 70 Q282 100 290 130 Q300 175 250 195 Q180 215 110 205 Q75 198 60 170Z" fill="#efe6d6" stroke="#2f3a2b" stroke-width="2"/><ellipse cx="205" cy="120" rx="34" ry="12" fill="#e57373"/><path d="M238 145 Q252 130 262 148 Q260 170 244 178 Q230 165 238 145Z" fill="#8e1b1b"/><path d="M250 140 Q270 110 285 80" stroke="#8e1b1b" stroke-width="5" fill="none"/><ellipse cx="205" cy="160" rx="26" ry="14" fill="#7b4a2a"/><ellipse cx="135" cy="160" rx="38" ry="20" fill="#cdb38a"/><line x1="190" y1="62" x2="205.0" y2="106.0" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><polygon points="205.0,106.0 199.4,100.3 206.0,98.1" fill="#e8590c"/><text x="180" y="52" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Lungs: tight to the back ribs</text><line x1="335" y1="170" x2="262.0" y2="160.0" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><polygon points="262.0,160.0 269.6,157.5 268.7,164.4" fill="#e8590c"/><text x="345" y="190" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Heart: low,</text><text x="345" y="206" font-size="14" fill="#23261f" text-anchor="middle">front, under</text><text x="345" y="222" font-size="14" fill="#23261f" text-anchor="middle">the neck base</text><line x1="200" y1="240" x2="205.0" y2="176.0" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><polygon points="205.0,176.0 207.9,183.5 201.0,182.9" fill="#e8590c"/><text x="200" y="256" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Liver</text><line x1="90" y1="230" x2="125.0" y2="180.0" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><polygon points="125.0,180.0 123.7,187.9 118.0,183.9" fill="#e8590c"/><text x="80" y="246" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Gut and gizzard</text><rect x="20" y="262" width="360" height="32" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="283" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Heart and lungs: the front half of the body (80%)</text>
</svg>
