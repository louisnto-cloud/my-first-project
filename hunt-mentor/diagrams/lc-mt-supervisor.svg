<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 345" font-family="sans-serif" role="img" aria-label="Can I supervise? Check each: a FWID with active residency and hunting credentials; a hunting licence, not an initiation licence, in at least 3 earlier licence years, in BC or elsewhere; not prohibited from having a firearm anywhere; no more than two youth, two initiation, or one of each with you. All yes: you may supervise. For an initiation hunter you also hold a basic hunting licence. Synopsis page 6.">
<rect x="0" y="0" width="400" height="345" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Can I supervise? (page 6)</text><rect x="30" y="46" width="340" height="34" rx="8" fill="#e9eedd" stroke="#2f3a2b" stroke-width="2"/><text x="200.0" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">FWID with residency and hunting credentials?</text><line x1="200.0" y1="82" x2="200.0" y2="98.0" stroke="#23261f" stroke-width="2.5" stroke-linecap="round"/><path d="M196.5 90.8 L200.0 98.0 L203.5 90.8" fill="none" stroke="#23261f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="100" width="340" height="47" rx="8" fill="#e9eedd" stroke="#2f3a2b" stroke-width="2"/><text x="200.0" y="122" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Hunting licence in 3 earlier licence years?</text><text x="200.0" y="140" font-size="14" fill="#23261f" text-anchor="middle">Not an initiation licence. BC or elsewhere</text><line x1="200.0" y1="149" x2="200.0" y2="165.0" stroke="#23261f" stroke-width="2.5" stroke-linecap="round"/><path d="M196.5 157.8 L200.0 165.0 L203.5 157.8" fill="none" stroke="#23261f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="167" width="340" height="34" rx="8" fill="#e9eedd" stroke="#2f3a2b" stroke-width="2"/><text x="200.0" y="189" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Not prohibited from having a firearm?</text><line x1="200.0" y1="203" x2="200.0" y2="219.0" stroke="#23261f" stroke-width="2.5" stroke-linecap="round"/><path d="M196.5 211.8 L200.0 219.0 L203.5 211.8" fill="none" stroke="#23261f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="221" width="340" height="47" rx="8" fill="#e9eedd" stroke="#2f3a2b" stroke-width="2"/><text x="200.0" y="243" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Two new hunters or fewer with you?</text><text x="200.0" y="261" font-size="14" fill="#23261f" text-anchor="middle">Two youth, two initiation, or one of each</text><line x1="200.0" y1="270" x2="200.0" y2="286.0" stroke="#23261f" stroke-width="2.5" stroke-linecap="round"/><path d="M196.5 278.8 L200.0 286.0 L203.5 278.8" fill="none" stroke="#23261f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="288" width="340" height="47" rx="8" fill="#fde8d8" stroke="#e8590c" stroke-width="2"/><text x="200.0" y="310" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">All yes: you may supervise</text><text x="200.0" y="328" font-size="14" fill="#23261f" text-anchor="middle">Initiation: you also hold a basic licence</text>
</svg>
