<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 424" font-family="sans-serif" role="img" aria-label="Three ways private or leased land counts as enclosed under the Trespass Act, any one is enough. Signs: no trespassing signs clearly visible at each ordinary access point, drawn as a posted NO sign at a farm gate. Fence: a lawful fence all the way round, drawn as a field ringed by fence posts. Natural edge: a natural boundary all the way round, such as a riverbank or a hedge about 1.4 metres high. Enclosed land needs the owner&#x27;s permission.">
<rect width="400" height="424" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Enclosed land: any ONE of these</text>
<text x="200" y="48" font-size="16" fill="#2f3a2b" text-anchor="middle">Then you need the owner&#x27;s permission.</text>
