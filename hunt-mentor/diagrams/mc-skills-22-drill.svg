<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A five step .22 rimfire drill, hunter tip: 5 shots prone, 5 sitting and 5 off sticks at 50 metres on a 5 centimetre dot; 1 cold shot after walking in, 20 seconds to get down; dry fire with a snap cap only. Same positions and trigger as the .308 at a fraction of the cost.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">The .22 drill (Tip)</text><rect x="20" y="46" width="360" height="38" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="44" cy="65" r="13" fill="#e8590c"/><text x="44" y="70" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">1</text><text x="66" y="71" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">5 prone</text><text x="186" y="71" font-size="14" fill="#23261f" text-anchor="start">50 m, 5 cm dot</text><rect x="20" y="92" width="360" height="38" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="44" cy="111" r="13" fill="#e8590c"/><text x="44" y="116" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">2</text><text x="66" y="117" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">5 sitting</text><text x="186" y="117" font-size="14" fill="#23261f" text-anchor="start">50 m, 5 cm dot</text><rect x="20" y="138" width="360" height="38" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="44" cy="157" r="13" fill="#e8590c"/><text x="44" y="162" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">3</text><text x="66" y="163" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">5 off sticks</text><text x="186" y="163" font-size="14" fill="#23261f" text-anchor="start">50 m, 5 cm dot</text><rect x="20" y="184" width="360" height="38" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="44" cy="203" r="13" fill="#e8590c"/><text x="44" y="208" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">4</text><text x="66" y="209" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">1 cold shot</text><text x="186" y="209" font-size="14" fill="#23261f" text-anchor="start">walk in, 20 s to get down</text><rect x="20" y="230" width="360" height="38" rx="8" fill="#f6d7c3" stroke="#8a9a6b" stroke-width="2"/><circle cx="44" cy="249" r="13" fill="#e8590c"/><text x="44" y="254" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">5</text><text x="66" y="255" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Dry fire</text><text x="186" y="255" font-size="14" fill="#23261f" text-anchor="start">snap cap only (95%)</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Same positions, same trigger, a fraction of the cost</text>
</svg>
