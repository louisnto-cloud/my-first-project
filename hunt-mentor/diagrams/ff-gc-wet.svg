<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two panels. A wet rifle left in a soft case traps water: wrong. Out of the case in a warm, dry room: right. Then do the routine clean and a light oil.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wet day: case off, dry warm, then oil</text><rect x="30" y="80" width="150" height="120" rx="10" fill="#f3d5d2" stroke="#b3261e" stroke-width="2"/><text x="105" y="130" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle">in a soft case</text><text x="105" y="152" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle">traps water</text><path d="M96 171 l18 18 M114 171 l-18 18" fill="none" stroke="#b3261e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="220" y="80" width="150" height="120" rx="10" fill="#d8ead7" stroke="#2f6e3b" stroke-width="2"/><text x="295" y="130" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">out of the case</text><text x="295" y="152" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">warm, dry room</text><path d="M285 180 l7 8 l14 -16" fill="none" stroke="#2f6e3b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="200.0" y="250" font-size="14" fill="#2f3a2b" text-anchor="middle">Then the routine clean and a light oil</text>
</svg>
