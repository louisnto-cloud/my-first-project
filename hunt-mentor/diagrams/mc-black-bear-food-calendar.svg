7" height="20" rx="4" fill="#8a9a6b"/><text x="12" y="143" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Fawns, calves</text><rect x="126" y="129" width="266.0" height="20" rx="4" fill="#dfe6d3"/><rect x="236.83333333333334" y="129" width="37.68333333333334" height="20" rx="4" fill="#8a9a6b"/><text x="12" y="171" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Ants, grubs</text><rect x="126" y="157" width="266.0" height="20" rx="4" fill="#dfe6d3"/><rect x="236.83333333333334" y="157" width="88.66666666666667" height="20" rx="4" fill="#8a9a6b"/><text x="12" y="199" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Berries</text><rect x="126" y="185" width="266.0" height="20" rx="4" fill="#dfe6d3"/><rect x="265.65" y="185" width="82.01666666666668" height="20" rx="4" fill="#e8590c"/><text x="12" y="227" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Salmon</text><rect x="126" y="213" width="266.0" height="20" rx="4" fill="#dfe6d3"/><rect x="281.1666666666667" y="213" width="88.66666666666667" height="20" rx="4" fill="#e8590c"/><text x="12" y="255" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Fruit, apples</text><rect x="126" y="241" width="266.0" height="20" rx="4" fill="#dfe6d3"/><rect x="303.33333333333337" y="241" width="66.5" height="20" rx="4" fill="#8a9a6b"/><text x="200" y="292" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Salmon only where it runs (coast, big rivers)</text>
