<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Black bear foods by month, from the BC account and WildSafeBC. Grasses, sedges and horsetails April to July. Skunk cabbage in spring. Newborn deer, elk and moose calves in late May and June. Ants and grubs through summer. Berries from July to October. Salmon where it runs, late summer and fall. Fruit and apples in fall. Bars are approximate.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
