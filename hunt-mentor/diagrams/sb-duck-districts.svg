<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" font-family="sans-serif" role="img" aria-label="Timeline chart of the duck seasons by district, September 2026 to January 2027, 99 percent. District 3, Kamloops: 8 September to 23 December. District 8, Okanagan: 23 September to 7 January. District 2, Mission: 10 October 2026 to 24 January 2027. Every district: 8 a day, 24 in possession.">
  <rect width="400" height="280" fill="#fffaf0"/>
  <text x="200" y="26" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Duck seasons 2026 to 2027 (99%)</text>
  <line x1="110.0" y1="50" x2="110.0" y2="236" stroke="#8a9a6b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="138.0" y="46" font-size="14" fill="#2f3a2b" text-anchor="middle">Sep</text>
  <line x1="166.0" y1="50" x2="166.0" y2="236" stroke="#8a9a6b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="194.0" y="46" font-size="14" fill="#2f3a2b" text-anchor="middle">Oct</text>
  <line x1="222.0" y1="50" x2="222.0" y2="236" stroke="#8a9a6b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="250.0" y="46" font-size="14" fill="#2f3a2b" text-anchor="middle">Nov</text>
  <line x1="278.0" y1="50" x2="278.0" y2="236" stroke="#8a9a6b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="306.0" y="46" font-size="14" fill="#2f3a2b" text-anchor="middle">Dec</text>
  <line x1="334.0" y1="50" x2="334.0" y2="236" stroke="#8a9a6b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="362.0" y="46" font-size="14" fill="#2f3a2b" text-anchor="middle">Jan</text>
  <text x="102" y="86.0" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">District 3</text>
  <text x="102" y="102.0" font-size="12" fill="#2f3a2b" text-anchor="end">Kamloops</text>
  <rect x="123.1" y="73.0" width="196.5" height="26.0" rx="4" fill="#8b5a2b"/>
  <text x="102" y="146.0" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">District 8</text>
  <text x="102" y="162.0" font-size="12" fill="#2f3a2b" text-anchor="end">Okanagan</text>
  <rect x="151.1" y="133.0" width="195.6" height="26.0" rx="4" fill="#4a7fb0"/>
