  <text x="102" y="222.0" font-size="12" fill="#2f3a2b" text-anchor="end">Mission</text>
  <rect x="182.3" y="193.0" width="195.1" height="26.0" rx="4" fill="#2f6e3b"/>
  <text x="200" y="266" font-size="13" fill="#2f3a2b" text-anchor="middle">8 a day, 24 in possession, every district</text>
</svg>
