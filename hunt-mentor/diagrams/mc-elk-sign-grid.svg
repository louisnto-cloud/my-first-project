<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Six kinds of elk sign. Track: round, about 8 to 12 cm. Pellets: bigger than deer pellets. Rub: bark stripped high on a sapling. Wallow: a muddy pit that smells of urine. Beds: several flattened ovals together. Trail: deep and worn, used single file. Many sizes of sign together means a herd.">
<rect width="400" height="300" fill="#fffaf0"/>
