ht="114" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><ellipse cx="71" cy="218" rx="44" ry="18" fill="#6b5236" stroke="#23261f" stroke-width="1.5"/><ellipse cx="71" cy="218" rx="26" ry="9" fill="#4a7fb0" opacity="0.6"/><text x="71" y="252" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Wallow</text><text x="71" y="270" font-size="14" fill="#23261f" text-anchor="middle">muddy, smells</text><rect x="138" y="164" width="122" height="114" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><ellipse cx="175" cy="204" rx="20" ry="11" fill="#cdbb95" stroke="#23261f" stroke-width="1"/><ellipse cx="217" cy="200" rx="20" ry="11" fill="#cdbb95" stroke="#23261f" stroke-width="1"/><ellipse cx="197" cy="224" rx="20" ry="11" fill="#cdbb95" stroke="#23261f" stroke-width="1"/><text x="199" y="252" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Beds</text><text x="199" y="270" font-size="14" fill="#23261f" text-anchor="middle">many, together</text><rect x="266" y="164" width="122" height="114" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><path d="M287 238 Q327 212 367 186" fill="none" stroke="#a58f6a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><text x="327" y="252" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Trail</text><text x="327" y="270" font-size="14" fill="#23261f" text-anchor="middle">deep, single file</text><text x="200" y="294" font-size="14" fill="#6b4f35" text-anchor="middle">Many sizes together: a herd (Tip)</text>
</svg>
