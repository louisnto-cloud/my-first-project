<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Hide step 1 of 4: skin the bear right away to get the heat out. Rug cuts: one long cut down the belly, then down the inside of each leg to the pad. From Alaska Department of Fish and Game guidance.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Hide 1 of 4: cuts</text><g stroke="#1d1d1b" stroke-width="24" stroke-linecap="round"><line x1="150" y1="120" x2="110" y2="80"/><line x1="150" y1="190" x2="110" y2="230"/><line x1="270" y1="120" x2="310" y2="80"/><line x1="270" y1="190" x2="310" y2="230"/></g><ellipse cx="210" cy="155" rx="90" ry="55" fill="#1d1d1b"/><circle cx="95" cy="155" r="34" fill="#1d1d1b"/><ellipse cx="68" cy="155" rx="12" ry="10" fill="#8b6a4a"/><g stroke="#e8590c" stroke-width="3" stroke-dasharray="6 4" fill="none"><path d="M120 155 L295 155"/><path d="M160 155 L110 80"/><path d="M160 155 L110 230"/><path d="M260 155 L310 80"/><path d="M260 155 L310 230"/></g><text x="330" y="160" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">tail</text><text x="210" y="70" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">On its back, head left</text><rect x="8" y="256" width="384" height="36" rx="8" fill="#2f3a2b"/><text x="200" y="280" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Skin now. Rug cuts down legs and belly.</text>
</svg>
