<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Small boat and kayak checklist: PFD on and zipped because of the cold shock gasp in the first minute; every gun unloaded while the motor pushes the boat; load low and centred because small boats tip; trip plan and a dry bag with phone, layers and light; stay with the boat because it is bigger to find. From the Water safety lesson, 75 to 99 percent.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Small boat and kayak, cold water</text><rect x="20" y="42.0" width="360" height="35.666666666666664" rx="4" fill="#2f3a2b"/><text x="28" y="65.33333333333333" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">Check</text><text x="188" y="65.33333333333333" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">Why</text><rect x="20" y="80.66666666666666" width="360" height="35.666666666666664" rx="4" fill="#dfe6d3"/><text x="28" y="103.99999999999999" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">PFD on, zipped</text><text x="188" y="103.99999999999999" font-size="15" fill="#23261f" text-anchor="start">the gasp in 1 minute</text><rect x="20" y="119.33333333333333" width="360" height="35.666666666666664" rx="4" fill="#eef2e6"/><text x="28" y="142.66666666666666" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Gun unloaded</text><text x="188" y="142.66666666666666" font-size="15" fill="#23261f" text-anchor="start">while the motor pushes</text><rect x="20" y="158.0" width="360" height="35.666666666666664" rx="4" fill="#dfe6d3"/><text x="28" y="181.33333333333334" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Load low, centred</text><text x="188" y="181.33333333333334" font-size="15" fill="#23261f" text-anchor="start">small boats tip</text><rect x="20" y="196.66666666666666" width="360" height="35.666666666666664" rx="4" fill="#eef2e6"/><text x="28" y="220.0" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Trip plan, dry bag</text><text x="188" y="220.0" font-size="15" fill="#23261f" text-anchor="start">phone, layers, light</text><rect x="20" y="235.33333333333331" width="360" height="35.666666666666664" rx="4" fill="#dfe6d3"/><text x="28" y="258.66666666666663" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Stay with the boat</text><text x="188" y="258.66666666666663" font-size="15" fill="#23261f" text-anchor="start">bigger to find</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Water safety lesson (75 to 99%)</text>
</svg>
