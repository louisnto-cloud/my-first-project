<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" font-family="sans-serif" role="img" aria-label="Simplified cross section of a deer hind quarter around the leg bone, split along natural seams: sirloin tip at the front, inside round on the inner side, outside round on the outer side, and the small eye of round within it. Pull the muscles apart along the white seams. A sketch: real seams wander.">
<rect x="0" y="0" width="400" height="350" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Hind quarter: follow the seams</text><path d="M200 70 Q320 90 310 190 Q300 280 200 290 Q90 280 90 180 Q90 80 200 70 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><clipPath id="lc-bt-hind-clip"><path d="M200 70 Q320 90 310 190 Q300 280 200 290 Q90 280 90 180 Q90 80 200 70 Z"/></clipPath><g clip-path="url(#lc-bt-hind-clip)"><rect x="90" y="70" width="220" height="220" fill="#a0643a"/><path d="M140 65 Q240 150 320 140 L320 65 Z" fill="#c47a4a" stroke="#fff" stroke-width="3"/><path d="M320 140 Q240 150 220 190 Q210 240 190 300 L320 300 Z" fill="#8b5a2b" stroke="#fff" stroke-width="3"/></g><text x="262" y="118" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Sirloin tip</text><text x="142" y="190" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Inside round</text><text x="262" y="186" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Outside round</text><ellipse cx="244" cy="242" rx="22" ry="14" fill="#e8590c" stroke="#fff" stroke-width="2"/><text x="244" y="247" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Eye</text><text x="200" y="64" font-size="13" fill="#6b4f35" text-anchor="middle">Front of leg</text><circle cx="204" cy="160" r="14" fill="#f5f0e0" stroke="#2f3a2b" stroke-width="2"/><text x="204" y="165" font-size="11" font-weight="bold" fill="#23261f" text-anchor="middle">bone</text><text x="200" y="318" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Pull the muscles apart along the white seams.</text><text x="200" y="338" font-size="13" fill="#6b4f35" text-anchor="middle">Simplified sketch: real seams wander (Tip).</text>
</svg>
