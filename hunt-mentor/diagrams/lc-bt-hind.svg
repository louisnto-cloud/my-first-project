<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 386" font-family="sans-serif" role="img" aria-label="Simplified cross section of a deer hind quarter around the leg bone, split along natural seams: sirloin tip at the front, inside round on the inner side, outside round on the outer side, and the small eye of round within it. Pull the muscles apart along the white seams. A sketch: real seams wander.">
