<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" font-family="sans-serif" role="img" aria-label="Bar chart of bullet drop for a .308 150 grain load with a 100 metre zero: zero at 100 m, 4 cm low at 150 m, 12 cm at 200 m, about a hand, 27 cm at 250 m and 47 cm at 300 m, about a forearm. A 20 cm band shows the deer vital zone around the crosshair: past 200 m the bullet falls out of it.">
<rect width="400" height="310" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">100 m zero, 150 gr: how far it drops</text>
<rect x="78" y="66.0" width="316" height="68.0" fill="#fde3d3"/>
<rect x="14" y="196" width="22" height="22" fill="#fde3d3" stroke="#e8a27c"/><text x="44" y="205" font-size="15" font-weight="bold" fill="#c2410c">deer vitals</text><text x="44" y="224" font-size="15" font-weight="bold" fill="#c2410c">20 cm</text>
<line x1="78" y1="100" x2="394" y2="100" stroke="#2f3a2b" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="40" cy="100" r="13" fill="none" stroke="#2f3a2b" stroke-width="2"/><path d="M27 100 H53 M40 87 V113" stroke="#2f3a2b" stroke-width="1.6"/>
<text x="40" y="132" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">crosshair</text>
<circle cx="112" cy="100" r="7" fill="#2f6e3b" stroke="#fff" stroke-width="2"/>
<text x="112" y="126" font-size="16" font-weight="bold" fill="#2f6e3b" text-anchor="middle">zero</text>
<text x="112" y="54" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">100 m</text>
<rect x="154" y="100" width="40" height="13.6" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="1"/>
<text x="174" y="132.6" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4 cm</text>
<text x="174" y="54" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">150 m</text>
<rect x="216" y="100" width="40" height="40.8" fill="#e8590c" stroke="#2f3a2b" stroke-width="1"/>
<text x="236" y="159.8" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">12 cm</text>
<text x="236" y="54" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">200 m</text>
<rect x="278" y="100" width="40" height="91.8" fill="#b3261e" stroke="#2f3a2b" stroke-width="1"/>
<text x="298" y="210.8" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">27 cm</text>
<text x="298" y="54" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">250 m</text>
<rect x="340" y="100" width="40" height="159.8" fill="#b3261e" stroke="#2f3a2b" stroke-width="1"/>
<text x="360" y="278.8" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">47 cm</text>
<text x="360" y="54" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">300 m</text>
<text x="236" y="177.8" font-size="15" fill="#6b4f35" text-anchor="middle">a hand</text>
<text x="360" y="296.8" font-size="15" fill="#6b4f35" text-anchor="middle">a forearm</text>
</svg>
