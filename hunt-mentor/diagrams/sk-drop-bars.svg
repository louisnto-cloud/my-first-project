<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of bullet drop for a .308 150 grain load with a 100 metre zero: zero at 100 m, 4 cm low at 150 m, 12 cm at 200 m, 27 cm at 250 m and 47 cm at 300 m. A 20 cm band shows the deer vital zone: past 200 m the bullet falls out of it.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">100 m zero, 150 gr: how far it drops</text><rect x="40" y="44" width="350" height="80" fill="#e8590c" fill-opacity=".12"/><text x="388" y="58" font-size="13" text-anchor="end" fill="#e8590c">deer vitals, 20 cm</text><line x1="40" y1="84" x2="390" y2="84" stroke="#2f3a2b" stroke-width="2" stroke-dasharray="7 5"/><text x="44" y="78" font-size="13" fill="#2f3a2b">crosshair</text><text x="70" y="102.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#23261f">zero</text><text x="70" y="290" font-size="14" text-anchor="middle" fill="#23261f">100 m</text><rect x="120" y="84" width="36" height="14.4" fill="#8a9a6b" stroke="#23261f" stroke-width="1.5"/><text x="138" y="116.4" font-size="15" font-weight="bold" text-anchor="middle" fill="#23261f">4 cm</text><text x="138" y="290" font-size="14" text-anchor="middle" fill="#23261f">150 m</text><rect x="188" y="84" width="36" height="43.2" fill="#e8590c" stroke="#23261f" stroke-width="1.5"/><text x="206" y="145.2" font-size="15" font-weight="bold" text-anchor="middle" fill="#23261f">12 cm</text><text x="206" y="290" font-size="14" text-anchor="middle" fill="#23261f">200 m</text><rect x="256" y="84" width="36" height="97.2" fill="#b3261e" stroke="#23261f" stroke-width="1.5"/><text x="274" y="199.2" font-size="15" font-weight="bold" text-anchor="middle" fill="#23261f">27 cm</text><text x="274" y="290" font-size="14" text-anchor="middle" fill="#23261f">250 m</text><rect x="324" y="84" width="36" height="169.20000000000002" fill="#b3261e" stroke="#23261f" stroke-width="1.5"/><text x="342" y="271.20000000000005" font-size="15" font-weight="bold" text-anchor="middle" fill="#23261f">47 cm</text><text x="342" y="290" font-size="14" text-anchor="middle" fill="#23261f">300 m</text><text x="200" y="268" font-size="1" fill="#23261f"></text><text x="206" y="168" font-size="13" text-anchor="middle" fill="#2f3a2b">a hand</text><text x="300" y="236" font-size="13" text-anchor="end" fill="#2f3a2b">47 cm: a forearm</text>
</svg>
