<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A forest of vertical tree trunks. Hidden among them is one flat horizontal line, a deer's back, plus a white ear flick and a leg. Look for the line that does not fit and for small parts, not a whole deer.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
  <rect x="10" y="10" width="380" height="230" fill="#dfe6d3"/>
  <g fill="#6b4f35">
    <rect x="30" y="10" width="14" height="230"/><rect x="72" y="10" width="10" height="230"/><rect x="110" y="10" width="16" height="230"/>
    <rect x="160" y="10" width="12" height="230"/><rect x="250" y="10" width="14" height="230"/><rect x="300" y="10" width="10" height="230"/><rect x="345" y="10" width="16" height="230"/>
  </g>
  <rect x="178" y="138" width="66" height="10" rx="5" fill="#8b5a2b"/>
  <rect x="190" y="146" width="44" height="26" fill="#8b5a2b"/>
  <rect x="196" y="172" width="5" height="34" fill="#8b5a2b"/><rect x="226" y="172" width="5" height="34" fill="#8b5a2b"/>
  <path d="M244 136 L256 124 L252 140 Z" fill="#ffffff" stroke="#8b5a2b" stroke-width="2"/>
  <g stroke="#e8590c" stroke-width="3" fill="none">
    <ellipse cx="211" cy="143" rx="44" ry="16"/>
    <circle cx="252" cy="130" r="14"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#23261f">
    <text x="20" y="266" font-weight="bold" fill="#e8590c">Flat back line</text>
    <text x="20" y="286">in a vertical forest</text>
    <text x="230" y="266" font-weight="bold" fill="#e8590c">Ear flick</text>
    <text x="230" y="286">a piece, not a deer</text>
  </g>
</svg>
