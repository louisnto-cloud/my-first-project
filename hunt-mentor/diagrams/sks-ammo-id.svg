<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Telling surplus ammunition: a steel cased full metal jacket surplus round and a brass cased soft point hunting round. A fired case with two flash holes inside (Berdan priming) is a surplus sign. If unknown, treat it as corrosive.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Spot surplus ammo</text>
<rect x="40.0" y="67.0" width="88.4" height="26.0" rx="1.5" fill="#7E8580" stroke="#17201A" stroke-width="1.2"/><line x1="43.0" y1="67.0" x2="43.0" y2="93.0" stroke="#17201A" stroke-width="1" stroke-linecap="round"/><path d="M128.4 69.1 Q163.5 72.2 170.0 80.0 Q163.5 87.8 128.4 90.9 Z" fill="#B87333" stroke="#17201A" stroke-width="1.2"/><text x="190.0" y="85.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Steel case, surplus FMJ</text><rect x="40.0" y="117.0" width="88.4" height="26.0" rx="1.5" fill="#C9A227" stroke="#17201A" stroke-width="1.2"/><line x1="43.0" y1="117.0" x2="43.0" y2="143.0" stroke="#17201A" stroke-width="1" stroke-linecap="round"/><path d="M128.4 119.1 Q163.5 122.2 170.0 130.0 Q163.5 137.8 128.4 140.9 Z" fill="#B87333" stroke="#17201A" stroke-width="1.2"/><path d="M157.0 125.3 Q168.7 130.0 157.0 134.7" fill="#9AA0A6" stroke="#17201A" stroke-width="1"/><text x="190.0" y="135.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Brass case, soft point</text><circle cx="100.0" cy="210.0" r="34.0" fill="#7E8580" stroke="#17201A" stroke-width="2"/><circle cx="92.0" cy="210.0" r="5.0" fill="#2A2F2B" stroke="#17201A" stroke-width="1"/><circle cx="108.0" cy="210.0" r="5.0" fill="#2A2F2B" stroke="#17201A" stroke-width="1"/><text x="150.0" y="204.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Inside: 2 flash holes</text><text x="150.0" y="224.0" font-size="14" fill="#17201A" text-anchor="start">(Berdan). Surplus sign.</text><text x="200.0" y="280.0" font-size="15" font-weight="bold" fill="#FF6A13" text-anchor="middle">Unknown? Treat it as corrosive.</text>
</svg>
