<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A detachable magazine seen from the side with three rounds inside. A new round is placed on the follower just in front of the lips, pressed down and slid back under the lips. Do not force more rounds than it holds.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Load the magazine, under the lips</text><rect x="140" y="90" width="120" height="150" rx="6" fill="#6b6f68" stroke="#2f3a2b" stroke-width="2"/><rect x="152" y="110" width="96" height="120" rx="4" fill="#4b4f48" stroke="none" stroke-width="2"/><path d="M150 90 L172 106 M250 90 L228 106" fill="none" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(160 200) scale(0.55)"><path d="M0 -14 L86 -14 L100 -9 L104 -9 L104 9 L100 9 L86 14 L0 14 Z" fill="#c9a227" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-4" y="-16" width="6" height="32" rx="0" fill="#c9a227" stroke="#2f3a2b" stroke-width="1.5"/><rect x="4" y="-14" width="3" height="28" rx="0" fill="#a88520" stroke="none" stroke-width="2"/><path d="M104 -8 L120 -8 Q 140 -6 146 0 Q 140 6 120 8 L104 8 Z" fill="#b87333" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(160 174) scale(0.55)"><path d="M0 -14 L86 -14 L100 -9 L104 -9 L104 9 L100 9 L86 14 L0 14 Z" fill="#c9a227" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-4" y="-16" width="6" height="32" rx="0" fill="#c9a227" stroke="#2f3a2b" stroke-width="1.5"/><rect x="4" y="-14" width="3" height="28" rx="0" fill="#a88520" stroke="none" stroke-width="2"/><path d="M104 -8 L120 -8 Q 140 -6 146 0 Q 140 6 120 8 L104 8 Z" fill="#b87333" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(160 148) scale(0.55)"><path d="M0 -14 L86 -14 L100 -9 L104 -9 L104 9 L100 9 L86 14 L0 14 Z" fill="#c9a227" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-4" y="-16" width="6" height="32" rx="0" fill="#c9a227" stroke="#2f3a2b" stroke-width="1.5"/><rect x="4" y="-14" width="3" height="28" rx="0" fill="#a88520" stroke="none" stroke-width="2"/><path d="M104 -8 L120 -8 Q 140 -6 146 0 Q 140 6 120 8 L104 8 Z" fill="#b87333" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.1s" dur="0.5s" fill="freeze"/><g transform="translate(160 96)"><g transform="translate(0 0) scale(0.55)"><path d="M0 -14 L86 -14 L100 -9 L104 -9 L104 9 L100 9 L86 14 L0 14 Z" fill="#c9a227" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-4" y="-16" width="6" height="32" rx="0" fill="#c9a227" stroke="#2f3a2b" stroke-width="1.5"/><rect x="4" y="-14" width="3" height="28" rx="0" fill="#a88520" stroke="none" stroke-width="2"/><path d="M104 -8 L120 -8 Q 140 -6 146 0 Q 140 6 120 8 L104 8 Z" fill="#b87333" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="40" y1="-26" x2="40" y2="-4" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><path d="M36.1 -12.1 L40 -4 L43.9 -12.1" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="70" y="100" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Lips</text><line x1="92" y1="98" x2="150" y2="96" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="330" y="140" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Press down,</text><text x="330" y="158" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">slide back</text><text x="330" y="200" font-size="14" fill="#23261f" text-anchor="middle">No more than</text><text x="330" y="218" font-size="14" fill="#23261f" text-anchor="middle">it holds</text><text x="200.0" y="276" font-size="14" fill="#2f3a2b" text-anchor="middle">Tikka: never force more than the maximum</text>
</svg>
