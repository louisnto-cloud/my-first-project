<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 346" font-family="sans-serif" role="img" aria-label="Do and do not cards for other hunters. Do: a truck at a pullout means someone is on that ridge, so drive on. Do not: walk in on another hunter&#x27;s stalk. Do: the first hunter on a meadow owns it for the morning. Do not: interfere with or obstruct a hunter, which is also law. Do: when you meet on a trail, unload and point the muzzle down. Do: offer a hand with the pack out.">
<rect x="0" y="0" width="400" height="346" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Other hunters</text><rect x="10" y="44" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(40 78) scale(0.9)"><rect x="-22" y="-6" width="26" height="16" rx="2" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 -2 h10 l6 6 v6 h-16 z" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-12" cy="12" r="5" fill="#2f3a2b"/><circle cx="12" cy="12" r="5" fill="#2f3a2b"/></g><circle cx="179" cy="60" r="11" fill="#8a9a6b"/><path d="M173 60 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Truck at a</text><text x="68" y="86" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">pullout?</text><text x="68" y="104" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Drive on</text><rect x="203" y="44" width="185" height="92" rx="10" fill="#fdf0e6" stroke="#e8590c" stroke-width="2"/><g transform="translate(233 78) scale(0.9)"><rect x="-18" y="-10" width="14" height="22" rx="6" fill="#2f3a2b"/><rect x="4" y="-10" width="14" height="22" rx="6" fill="#2f3a2b"/><rect x="-6" y="-4" width="12" height="8" fill="#2f3a2b"/><circle cx="-11" cy="10" r="4" fill="#dbe7f2"/><circle cx="11" cy="10" r="4" fill="#dbe7f2"/></g><circle cx="372" cy="60" r="11" fill="#e8590c"/><path d="M367 55 l10 10 M377 55 l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="261" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Walk in on a</text><text x="261" y="86" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">stalk</text><rect x="10" y="144" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(40 178) scale(0.9)"><circle cx="-9" cy="-10" r="6" fill="#2f3a2b"/><path d="M-18 16 V2 Q-9 -5 0 2 V16 Z" fill="#2f3a2b"/><circle cx="10" cy="-8" r="6" fill="#8a9a6b"/><path d="M1 18 V4 Q10 -3 19 4 V18 Z" fill="#8a9a6b"/></g><circle cx="179" cy="160" r="11" fill="#8a9a6b"/><path d="M173 160 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="168" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">First on the</text><text x="68" y="186" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">meadow owns</text><text x="68" y="204" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">the morning</text><rect x="203" y="144" width="185" height="92" rx="10" fill="#fdf0e6" stroke="#e8590c" stroke-width="2"/><g transform="translate(233 178) scale(0.9)"><path d="M-10 18 V-2 M-10 -2 V-14 Q-6 -18 -3 -14 V-4 V-18 Q0 -22 3 -18 V-4 V-16 Q6 -20 9 -16 V2 L14 -6 Q19 -6 16 2 L6 18 Z" fill="#f2d6c0" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="372" cy="160" r="11" fill="#e8590c"/><path d="M367 155 l10 10 M377 155 l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="261" y="168" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Block or</text><text x="261" y="186" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">interfere:</text><text x="261" y="204" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">also law</text><rect x="10" y="244" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(40 278) scale(0.9)"><path d="M-22 4 L-6 0 L20 -2 L20 2 L-4 6 L-10 12 L-22 12 Z" fill="#8b5a2b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -2 h12" stroke="#2f3a2b" stroke-width="4"/></g><circle cx="179" cy="260" r="11" fill="#8a9a6b"/><path d="M173 260 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="268" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Meet on a</text><text x="68" y="286" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">trail:</text><text x="68" y="304" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">unload,</text><text x="68" y="322" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">muzzle down</text><rect x="203" y="244" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(233 278) scale(0.9)"><rect x="-14" y="-16" width="28" height="34" rx="6" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-9" y="2" width="18" height="10" rx="3" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="372" cy="260" r="11" fill="#8a9a6b"/><path d="M366 260 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="261" y="268" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Offer a hand</text><text x="261" y="286" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">on the pack</text><text x="261" y="304" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">out</text>
