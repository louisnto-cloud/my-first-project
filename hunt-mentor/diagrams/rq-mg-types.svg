<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Four cards. Long distance migrants: ducks and geese. Elevational, up and down: mule deer, elk, moose and dusky grouse. Short shifts along or across valleys: white tailed deer. Residents that stay home: quail, chukar and ruffed grouse.">
<rect x="0" y="0" width="400" height="320" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Four ways animals move in BC</text>
<rect x="10" y="40" width="186" height="128" rx="10" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="1.5"/>
<g transform="translate(40 74) scale(0.9)"><ellipse rx="16" ry="6" fill="#2f3a2b"/><path d="M14 -2 L26 -10 L30 -9 L18 1 Z" fill="#111"/><rect x="24" y="-12" width="5" height="3" fill="#fff"/><path d="M-4 -3 L-16 -20 L8 -4 Z" fill="#2f3a2b"/><path d="M-4 3 L-14 19 L8 4 Z" fill="#2f3a2b"/></g>
<text x="70" y="70" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Long distance</text>
<text x="20" y="114" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Ducks, geese: thousands</text>
<text x="20" y="131" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">of km (80%).</text>
<rect x="204" y="40" width="186" height="128" rx="10" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="1.5"/>
<g transform="translate(234 74) scale(0.75)"><ellipse rx="20" ry="9" fill="#8b5a2b"/><circle cx="19" cy="-10" r="6.5" fill="#8b5a2b"/><rect x="-15" y="5" width="3.5" height="14" fill="#8b5a2b"/><rect x="-6" y="5" width="3.5" height="14" fill="#8b5a2b"/><rect x="7" y="5" width="3.5" height="14" fill="#8b5a2b"/><rect x="13" y="5" width="3.5" height="14" fill="#8b5a2b"/><ellipse cx="-20" cy="-2" rx="4" ry="5" fill="#f3ead8"/><path d="M19 -15 l-5 -10 m3 5 l-6 -2 M23 -15 l5 -10 m-3 5 l6 -2" stroke="#5c3b1c" stroke-width="2" fill="none"/></g>
<text x="264" y="70" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Up and down</text>
<text x="214" y="114" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Mule deer, elk, moose,</text>
<text x="214" y="131" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">dusky grouse (85%).</text>
<rect x="10" y="176" width="186" height="128" rx="10" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="1.5"/>
<g transform="translate(40 210) scale(0.75)"><ellipse rx="20" ry="9" fill="#a0703a"/><circle cx="19" cy="-10" r="6.5" fill="#a0703a"/><rect x="-15" y="5" width="3.5" height="14" fill="#a0703a"/><rect x="-6" y="5" width="3.5" height="14" fill="#a0703a"/><rect x="7" y="5" width="3.5" height="14" fill="#a0703a"/><rect x="13" y="5" width="3.5" height="14" fill="#a0703a"/><ellipse cx="-20" cy="-2" rx="4" ry="5" fill="#f3ead8"/></g>
<text x="70" y="206" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Short shifts</text>
<text x="20" y="250" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">White tails: along or</text>
<text x="20" y="267" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">across valleys (85%).</text>
<rect x="204" y="176" width="186" height="128" rx="10" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="1.5"/>
<g transform="translate(234 210) scale(0.9)"><ellipse rx="13" ry="10" fill="#6b4f35"/><circle cx="11" cy="-9" r="6" fill="#6b4f35"/><path d="M16 -9 l5 1 l-5 2 Z" fill="#23261f"/><path d="M-12 -2 l-8 -4 l2 8 Z" fill="#6b4f35"/><rect x="-3" y="9" width="2" height="6" fill="#23261f"/><rect x="3" y="9" width="2" height="6" fill="#23261f"/><path d="M10 -14 q 2 -9 6 -10" stroke="#23261f" stroke-width="2.5" fill="none"/></g>
<text x="264" y="206" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Stay home</text>
<text x="214" y="250" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Quail, chukar, ruffed</text>
<text x="214" y="267" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">grouse (75 to 85%).</text>
</svg>
