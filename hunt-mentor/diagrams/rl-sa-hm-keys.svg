<path d="M108.0 376.1 L63.6 357.7 A74 74 0 0 1 103.7 317.6 L122.1 362.0 A26 26 0 0 0 108.0 376.1z" fill="#9b4fd1" stroke="#fffaf0" stroke-width="1.5"/>
<text x="68.3604" y="328.36" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">NW</text>
<rect x="262" y="346" width="30" height="22" rx="4" fill="#ffffff" stroke="#2f3a2b" stroke-width="1.4"/>
<text x="262" y="388" font-size="15" font-weight="bold" fill="#2f3a2b">flat (under 8°):</text>
<text x="262" y="408" font-size="15" fill="#2f3a2b">no colour</text>
</svg>
