<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="The two Hunt Map colour keys. Slope steepness: under 15 degrees no colour, 15 to 25 yellow for a steady climb, 25 to 30 orange for steep, 30 to 45 red for very steep and avalanche terrain in snow, over 45 purple for cliffy ground. Slope direction: north blue, northeast teal, east green, southeast lime, south yellow, southwest orange, west red, northwest purple; flat ground under 8 degrees has no colour.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Hunt Map colour keys</text><text x="14" y="58" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">Slope steepness</text><rect x="14" y="70" width="26" height="22" rx="4" fill="#ffffff" stroke="#2f3a2b" stroke-width="1"/><text x="48" y="86" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Under 15°</text><text x="48" y="104" font-size="13" fill="#2f3a2b" text-anchor="start">no colour: easy</text><rect x="14" y="112" width="26" height="22" rx="4" fill="#f2c70c" stroke="#2f3a2b" stroke-width="1"/><text x="48" y="128" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">15 to 25°</text><text x="48" y="146" font-size="13" fill="#2f3a2b" text-anchor="start">steady climb</text><rect x="14" y="154" width="26" height="22" rx="4" fill="#f08c00" stroke="#2f3a2b" stroke-width="1"/><text x="48" y="170" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">25 to 30°</text><text x="48" y="188" font-size="13" fill="#2f3a2b" text-anchor="start">steep</text><rect x="14" y="196" width="26" height="22" rx="4" fill="#e03131" stroke="#2f3a2b" stroke-width="1"/><text x="48" y="212" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">30 to 45°</text><text x="48" y="230" font-size="13" fill="#2f3a2b" text-anchor="start">very steep, avalanche</text><rect x="14" y="238" width="26" height="22" rx="4" fill="#8e44d6" stroke="#2f3a2b" stroke-width="1"/><text x="48" y="254" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Over 45°</text><text x="48" y="272" font-size="13" fill="#2f3a2b" text-anchor="start">cliffy, scrambling</text><text x="250" y="58" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">Slope direction</text><path d="M290.8 137.8 L273.2 95.3 A70 70 0 0 1 326.8 95.3 L309.2 137.8 A24 24 0 0 0 290.8 137.8 Z" fill="#2f6fd6" opacity=".85"/><text x="300.0" y="79.0" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">N</text><path d="M309.2 137.8 L326.8 95.3 A70 70 0 0 1 364.7 133.2 L322.2 150.8 A24 24 0 0 0 309.2 137.8 Z" fill="#21a6c7" opacity=".85"/><text x="360.81118318204307" y="104.18881681795692" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">NE</text><path d="M322.2 150.8 L364.7 133.2 A70 70 0 0 1 364.7 186.8 L322.2 169.2 A24 24 0 0 0 322.2 150.8 Z" fill="#3db36b" opacity=".85"/><text x="386.0" y="165.0" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">E</text><path d="M322.2 169.2 L364.7 186.8 A70 70 0 0 1 326.8 224.7 L309.2 182.2 A24 24 0 0 0 322.2 169.2 Z" fill="#a8c83a" opacity=".85"/><text x="360.81118318204307" y="225.81118318204307" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">SE</text><path d="M309.2 182.2 L326.8 224.7 A70 70 0 0 1 273.2 224.7 L290.8 182.2 A24 24 0 0 0 309.2 182.2 Z" fill="#f2c70c" opacity=".85"/><text x="300.0" y="251.0" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">S</text><path d="M290.8 182.2 L273.2 224.7 A70 70 0 0 1 235.3 186.8 L277.8 169.2 A24 24 0 0 0 290.8 182.2 Z" fill="#f08c00" opacity=".85"/><text x="239.18881681795693" y="225.8111831820431" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">SW</text><path d="M277.8 169.2 L235.3 186.8 A70 70 0 0 1 235.3 133.2 L277.8 150.8 A24 24 0 0 0 277.8 169.2 Z" fill="#e03131" opacity=".85"/><text x="214.0" y="165.0" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">W</text><path d="M277.8 150.8 L235.3 133.2 A70 70 0 0 1 273.2 95.3 L290.8 137.8 A24 24 0 0 0 277.8 150.8 Z" fill="#9b4fd1" opacity=".85"/><text x="239.1888168179569" y="104.18881681795692" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">NW</text><text x="300" y="270" font-size="13" fill="#2f3a2b" text-anchor="middle">flat (under 8°): no colour</text>
</svg>
