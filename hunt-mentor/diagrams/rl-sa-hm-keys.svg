<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 494" font-family="sans-serif" role="img" aria-label="The two Hunt Map colour keys. Slope steepness: under 15 degrees no colour, easy; 15 to 25 yellow for a steady climb; 25 to 30 orange for steep; 30 to 45 red for very steep and avalanche terrain in snow; over 45 purple for cliffy, scrambling ground. Slope direction: north blue, northeast teal, east green, southeast lime, south yellow, southwest orange, west red, northwest purple; flat ground under 8 degrees has no colour.">
<rect width="400" height="494" fill="#fffaf0"/>
<text x="14" y="28" font-size="18" font-weight="bold" fill="#2f3a2b">Hunt Map colour keys</text>
<text x="14" y="60" font-size="17" font-weight="bold" fill="#c2410c">Slope steepness</text>
<rect x="8" y="70" width="384" height="34" rx="6" fill="#f4eedf"/>
<rect x="16" y="76" width="30" height="22" rx="4" fill="#ffffff" stroke="#2f3a2b" stroke-width="1.4"/>
<text x="56" y="93" font-size="16" font-weight="bold" fill="#2f3a2b">Under 15°</text>
<text x="150" y="93" font-size="15" fill="#2f3a2b">no colour: easy</text>
<rect x="16" y="112" width="30" height="22" rx="4" fill="#f2c70c" stroke="#2f3a2b" stroke-width="1.4"/>
<text x="56" y="129" font-size="16" font-weight="bold" fill="#2f3a2b">15 to 25°</text>
<text x="150" y="129" font-size="15" fill="#2f3a2b">steady climb</text>
<rect x="8" y="142" width="384" height="34" rx="6" fill="#f4eedf"/>
<rect x="16" y="148" width="30" height="22" rx="4" fill="#f08c00" stroke="#2f3a2b" stroke-width="1.4"/>
<text x="56" y="165" font-size="16" font-weight="bold" fill="#2f3a2b">25 to 30°</text>
<text x="150" y="165" font-size="15" fill="#2f3a2b">steep</text>
<rect x="16" y="184" width="30" height="22" rx="4" fill="#e03131" stroke="#2f3a2b" stroke-width="1.4"/>
<text x="56" y="201" font-size="16" font-weight="bold" fill="#2f3a2b">30 to 45°</text>
<text x="150" y="201" font-size="15" fill="#2f3a2b">very steep, avalanche</text>
<rect x="8" y="214" width="384" height="34" rx="6" fill="#f4eedf"/>
<rect x="16" y="220" width="30" height="22" rx="4" fill="#8e44d6" stroke="#2f3a2b" stroke-width="1.4"/>
<text x="56" y="237" font-size="16" font-weight="bold" fill="#2f3a2b">Over 45°</text>
<text x="150" y="237" font-size="15" fill="#2f3a2b">cliffy, scrambling</text>
<text x="14" y="276" font-size="17" font-weight="bold" fill="#c2410c">Slope direction</text>
<path d="M122.1 362.0 L103.7 317.6 A74 74 0 0 1 160.3 317.6 L141.9 362.0 A26 26 0 0 0 122.1 362.0z" fill="#2f6fd6" stroke="#fffaf0" stroke-width="1.5"/>
<text x="132" y="302" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">N</text>
<path d="M141.9 362.0 L160.3 317.6 A74 74 0 0 1 200.4 357.7 L156.0 376.1 A26 26 0 0 0 141.9 362.0z" fill="#21a6c7" stroke="#fffaf0" stroke-width="1.5"/>
