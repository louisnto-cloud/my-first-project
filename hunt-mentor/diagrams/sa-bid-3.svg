<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bear ID clue 3, the ears. Black bear: taller, more pointed ears. Grizzly: short, round ears that look small for the head.">
