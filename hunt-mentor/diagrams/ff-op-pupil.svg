<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three eyes. In bright day the pupil is about 2 to 3 mm, at dawn or dusk about 4 to 5 mm, in the dark about 7 to 8 mm. Hunting happens at dawn and dusk, so an exit pupil near 5 mm makes sense.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Your eye pupil opens as light fades</text><ellipse cx="70" cy="130" rx="54" ry="30" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><circle cx="70" cy="130" r="24" fill="#7aa3c8" stroke="none" stroke-width="2"/><circle cx="70" cy="130" r="7.5" fill="#23261f" stroke="none" stroke-width="2"/><text x="70" y="200" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bright day</text><text x="70" y="222" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">2 to 3 mm</text><ellipse cx="200" cy="130" rx="54" ry="30" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><circle cx="200" cy="130" r="24" fill="#7aa3c8" stroke="none" stroke-width="2"/><circle cx="200" cy="130" r="13.5" fill="#23261f" stroke="none" stroke-width="2"/><text x="200" y="200" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Dawn, dusk</text><text x="200" y="222" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">4 to 5 mm</text><ellipse cx="330" cy="130" rx="54" ry="30" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><circle cx="330" cy="130" r="24" fill="#7aa3c8" stroke="none" stroke-width="2"/><circle cx="330" cy="130" r="22.5" fill="#23261f" stroke="none" stroke-width="2"/><text x="330" y="200" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Dark</text><text x="330" y="222" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">7 to 8 mm</text><text x="200.0" y="272" font-size="14" fill="#2f3a2b" text-anchor="middle">Hunting light is dawn and dusk: aim for 5 mm</text>
</svg>
