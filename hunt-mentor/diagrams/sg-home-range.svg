<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Black tailed deer home ranges drawn to scale by area. Migrants use about 1,770 hectares a year. Residents use about 140 hectares, more than 12 times smaller.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Black tail home range, to scale</text>
  <circle cx="150" cy="160" r="105" fill="#8a9a6b" opacity=".6"/>
  <circle cx="330" cy="200" r="30" fill="#8b5a2b" opacity=".8"/>
  <text x="150" y="155" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Migrant</text>
  <text x="150" y="177" font-size="15" fill="#2f3a2b" text-anchor="middle">about 1,770 ha</text>
  <text x="330" y="150" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Resident</text>
  <text x="330" y="168" font-size="15" fill="#2f3a2b" text-anchor="middle">about 140 ha</text>
  <text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Vancouver Island studies; rough for the Fraser Valley</text>
</svg>
