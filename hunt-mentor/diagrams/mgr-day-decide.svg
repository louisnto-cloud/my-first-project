<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 385" role="img" aria-label="Decision chart for the day, Tip. Windy: hunt sheltered draws and thick cover. Raining: under conifers and the edges near them. Fresh snow: find a fresh track line and follow slowly. Early season: young birds on edges, clover and berries. Late season: adults in thicker cover far from roads. Midday lull: still hunt sitting birds with the .22." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="385" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Decide on the day (Tip)</text>
<rect x="10" y="44" width="130" height="46" rx="8" fill="#fbe3d3" stroke="#e8590c" stroke-width="2"/>
<text x="75" y="73" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Windy?</text>
<line x1="142" y1="67" x2="160.0" y2="67.0" stroke="#e8590c" stroke-width="3"/><polygon points="160.0,67.0 151.0,71.3 151.0,62.7" fill="#e8590c"/>
<rect x="162" y="44" width="228" height="46" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
<text x="172" y="73" font-size="14" fill="#23261f" text-anchor="start">Sheltered draws, thick cover</text>
<rect x="10" y="100" width="130" height="46" rx="8" fill="#fbe3d3" stroke="#e8590c" stroke-width="2"/>
<text x="75" y="129" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Raining?</text>
<line x1="142" y1="123" x2="160.0" y2="123.0" stroke="#e8590c" stroke-width="3"/><polygon points="160.0,123.0 151.0,127.3 151.0,118.7" fill="#e8590c"/>
<rect x="162" y="100" width="228" height="46" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
<text x="172" y="129" font-size="14" fill="#23261f" text-anchor="start">Under conifers, edges near them</text>
<rect x="10" y="156" width="130" height="46" rx="8" fill="#fbe3d3" stroke="#e8590c" stroke-width="2"/>
<text x="75" y="185" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Fresh snow?</text>
<line x1="142" y1="179" x2="160.0" y2="179.0" stroke="#e8590c" stroke-width="3"/><polygon points="160.0,179.0 151.0,183.3 151.0,174.7" fill="#e8590c"/>
<rect x="162" y="156" width="228" height="46" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
<text x="172" y="185" font-size="14" fill="#23261f" text-anchor="start">Find a fresh track line, follow slow</text>
<rect x="10" y="212" width="130" height="46" rx="8" fill="#fbe3d3" stroke="#e8590c" stroke-width="2"/>
<text x="75" y="241" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Early season?</text>
<line x1="142" y1="235" x2="160.0" y2="235.0" stroke="#e8590c" stroke-width="3"/><polygon points="160.0,235.0 151.0,239.3 151.0,230.7" fill="#e8590c"/>
<rect x="162" y="212" width="228" height="46" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
<text x="172" y="241" font-size="14" fill="#23261f" text-anchor="start">Young birds: edges, clover, berries</text>
<rect x="10" y="268" width="130" height="46" rx="8" fill="#fbe3d3" stroke="#e8590c" stroke-width="2"/>
<text x="75" y="297" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Late season?</text>
<line x1="142" y1="291" x2="160.0" y2="291.0" stroke="#e8590c" stroke-width="3"/><polygon points="160.0,291.0 151.0,295.3 151.0,286.7" fill="#e8590c"/>
<rect x="162" y="268" width="228" height="46" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
<text x="172" y="297" font-size="14" fill="#23261f" text-anchor="start">Adults: thick cover, off roads</text>
<rect x="10" y="324" width="130" height="46" rx="8" fill="#fbe3d3" stroke="#e8590c" stroke-width="2"/>
<text x="75" y="353" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Midday lull?</text>
<line x1="142" y1="347" x2="160.0" y2="347.0" stroke="#e8590c" stroke-width="3"/><polygon points="160.0,347.0 151.0,351.3 151.0,342.7" fill="#e8590c"/>
<rect x="162" y="324" width="228" height="46" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
<text x="172" y="353" font-size="14" fill="#23261f" text-anchor="start">Still hunt sitters with the .22</text>
</svg>
