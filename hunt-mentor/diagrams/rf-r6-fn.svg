<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 497" font-family="sans-serif" role="img" aria-label="Six First Nations notices in Region 6, requests not regulations. Haida Gwaii: complete the Haida Gwaii Pledge before you travel. Lake Babine Nation, 6-5 to 6-8: call 250 692 4780 to share parts you would leave. Teslin Tlingit Council, 6-25: Game Guardians 867 390 2532, extension 377 or 373. Gitxsan Laxyip: office 250 842 0755. Kaska Nation, 6-23 to 6-25: drop off parts you would leave. Nass Valley: the Nisga&#x27;a Government warns of many mushroom pickers in hunting season.">
<rect width="400" height="497" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="30" rx="6" fill="#2f3a2b"/>
<text x="18" y="29" font-size="15" font-weight="bold" fill="#fffaf0" letter-spacing="1">REQUESTS FROM FIRST NATIONS</text>
<rect x="8" y="44" width="384" height="74" rx="6" fill="#f4eedf"/>
<circle cx="41.0" cy="81.0" r="20" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/>
<g transform="translate(41.0 81.0) scale(0.8)" fill="#2f3a2b" stroke="none"><path d="M-10 -14 H5 L11 -8 V14 H-10z"/><path d="M5 -14 V-8 H11" fill="#fffaf0" opacity=".5"/><path d="M-6 -5 H6 M-6 0 H6 M-6 5 H6 M-6 10 H2" stroke="#fffaf0" stroke-width="2"/></g>
<text x="78" y="67" font-size="16" font-weight="bold" fill="#2f3a2b">Haida Gwaii</text>
<text x="78" y="86" font-size="15" fill="#2f3a2b">Complete the Haida Gwaii Pledge before</text>
<text x="78" y="105" font-size="15" fill="#2f3a2b">you travel</text>
<circle cx="41.0" cy="157.0" r="20" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/>
<g transform="translate(41.0 157.0) scale(0.8)" fill="#2f3a2b" stroke="none"><rect x="-8" y="-14" width="16" height="28" rx="3"/><rect x="-5.5" y="-10" width="11" height="17" fill="#fffaf0"/><circle cy="10.5" r="1.6" fill="#fffaf0"/></g>
<text x="78" y="143" font-size="16" font-weight="bold" fill="#2f3a2b">Lake Babine Nation</text>
<text x="78" y="162" font-size="15" fill="#2f3a2b">MUs 6-5 to 6-8. Share parts you would</text>
<text x="78" y="181" font-size="15" fill="#2f3a2b">leave: 250 692 4780</text>
<rect x="8" y="196" width="384" height="74" rx="6" fill="#f4eedf"/>
<circle cx="41.0" cy="233.0" r="20" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/>
<g transform="translate(41.0 233.0) scale(0.8)" fill="#2f3a2b" stroke="none"><rect x="-8" y="-14" width="16" height="28" rx="3"/><rect x="-5.5" y="-10" width="11" height="17" fill="#fffaf0"/><circle cy="10.5" r="1.6" fill="#fffaf0"/></g>
<text x="78" y="219" font-size="16" font-weight="bold" fill="#2f3a2b">Teslin Tlingit Council</text>
<text x="78" y="238" font-size="15" fill="#2f3a2b">MU 6-25. Game Guardians 867 390 2532,</text>
<text x="78" y="257" font-size="15" fill="#2f3a2b">ext. 377 or 373</text>
<circle cx="41.0" cy="299.5" r="20" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/>
<g transform="translate(41.0 299.5) scale(0.8)" fill="#2f3a2b" stroke="none"><rect x="-8" y="-14" width="16" height="28" rx="3"/><rect x="-5.5" y="-10" width="11" height="17" fill="#fffaf0"/><circle cy="10.5" r="1.6" fill="#fffaf0"/></g>
<text x="78" y="295" font-size="16" font-weight="bold" fill="#2f3a2b">Gitxsan Laxyip</text>
<text x="78" y="314" font-size="15" fill="#2f3a2b">Office 250 842 0755</text>
<rect x="8" y="329" width="384" height="74" rx="6" fill="#f4eedf"/>
<circle cx="41.0" cy="366.0" r="20" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/>
<g transform="translate(41.0 366.0) scale(0.8)" fill="#2f3a2b" stroke="none"><path d="M-12 8 L10 -8" stroke="#2f3a2b" stroke-width="4"/><circle cx="-13" cy="5" r="3.6"/><circle cx="-10" cy="11" r="3.6"/><circle cx="9" cy="-11" r="3.6"/><circle cx="13" cy="-6" r="3.6"/></g>
<text x="78" y="352" font-size="16" font-weight="bold" fill="#2f3a2b">Kaska Nation</text>
<text x="78" y="371" font-size="15" fill="#2f3a2b">MUs 6-23 to 6-25. Drop off parts you</text>
<text x="78" y="390" font-size="15" fill="#2f3a2b">would leave</text>
<circle cx="41.0" cy="442.0" r="20" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/>
<g transform="translate(41.0 442.0) scale(0.8)" fill="#2f3a2b" stroke="none"><path d="M-14 0 C-14 -10 14 -10 14 0z"/><path d="M-5 0 H5 L4 12 H-4z"/></g>
<text x="78" y="428" font-size="16" font-weight="bold" fill="#2f3a2b">Nass Valley</text>
<text x="78" y="447" font-size="15" fill="#2f3a2b">Nisga&#x27;a Government: many mushroom</text>
<text x="78" y="466" font-size="15" fill="#2f3a2b">pickers in season</text>
</svg>
