<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 691" font-family="sans-serif" role="img" aria-label="Maps A30 to A37, mainland and north, grouped by rule. Black bear closed areas: A30 Kingcome Inlet and A31 Wakeman Sound in Management Unit 1-14, A35 Glendale Cove and A36 Knight Inlet in 1-15. A33 Beaver Lodge Trust Lands: No Hunting Area, MU 1-6. A34 Buckley Bay: No Shooting Area, MU 1-6. A32 Quadra Island: bow or shot only, special antlerless season, MU 1-15. A37 Stamp Lagoon: firearms using shot only, MU 1-7.">
