<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" font-family="sans-serif" role="img" aria-label="Four legal jobs after the kill, in a 2 by 2 grid. 1, cancel the species licence by notching it. 2, keep evidence of sex attached, like the antlers on a buck. 3, the licence paper stays with the meat. 4, report, if your species needs it.">
