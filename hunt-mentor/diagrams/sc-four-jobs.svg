<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Four legal jobs after the kill, in a 2 by 2 grid. 1, cancel the species licence. 2, keep evidence of sex attached. 3, the paper stays with the meat. 4, report, if your species needs it." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">After the kill: 4 legal jobs</text>
<line x1="200" y1="40" x2="200" y2="294" stroke="#8a9a6b" stroke-dasharray="6 6" stroke-width="2"/>
<line x1="10" y1="166" x2="390" y2="166" stroke="#8a9a6b" stroke-dasharray="6 6" stroke-width="2"/>
<g transform="translate(100 92) scale(1.1)"><rect x="-40" y="-26" width="80" height="52" rx="4" fill="#ffffff" stroke="#23261f" stroke-width="2"/><rect x="-40" y="-26" width="80" height="12" fill="#f1ead8" stroke="#23261f" stroke-width="1"/><text x="0" y="8" font-size="13" fill="#23261f" text-anchor="middle" font-weight="bold">Deer</text><path d="M-24 14 h48" stroke="#23261f" stroke-width="2" stroke-dasharray="2 2"/><path d="M-14 -26 L-8 -18 L-2 -26 Z" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><path d="M40 -6 L32 0 L40 6 Z" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/></g>
<text x="100" y="146" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">1 Cancel the licence</text>
<g transform="translate(300 92)"><path d="M-30,-20 C-10,-30 20,-20 30,0 C20,20 -10,26 -30,16 Z" fill="#8b5a2b" stroke="#23261f"/><path d="M-30,-6 C-46,-10 -50,0 -40,6 Z" fill="#ffffff" stroke="#23261f"/><circle cx="-14" cy="18" r="7" fill="#e3b5b5" stroke="#23261f"/></g>
<text x="300" y="146" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">2 Keep evidence of sex</text>
<g transform="translate(100 222)"><rect x="-40" y="-14" width="70" height="40" rx="5" fill="#4a7fb0" stroke="#23261f"/><rect x="-40" y="-20" width="70" height="10" rx="3" fill="#ffffff" stroke="#23261f"/></g>
<g transform="translate(146 210) scale(0.55)"><rect x="-40" y="-26" width="80" height="52" rx="4" fill="#ffffff" stroke="#23261f" stroke-width="2"/><rect x="-40" y="-26" width="80" height="12" fill="#f1ead8" stroke="#23261f" stroke-width="1"/><text x="0" y="8" font-size="13" fill="#23261f" text-anchor="middle" font-weight="bold">Deer</text><path d="M-24 14 h48" stroke="#23261f" stroke-width="2" stroke-dasharray="2 2"/><path d="M-14 -26 L-8 -18 L-2 -26 Z" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><path d="M40 -6 L32 0 L40 6 Z" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/></g>
<text x="100" y="284" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">3 Paper stays with meat</text>
<g transform="translate(300 222)"><rect x="-26" y="-34" width="52" height="64" rx="4" fill="#ffffff" stroke="#23261f" stroke-width="2"/><path d="M-16 -18 h32 M-16 -6 h32 M-16 6 h24 M-16 18 h16" stroke="#23261f" stroke-width="2"/><circle cx="22" cy="22" r="10" fill="#2f6b3a"/><path d="M17 22 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none"/></g>
