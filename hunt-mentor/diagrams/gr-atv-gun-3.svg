<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="ATV gun step 3: load only once you are off and away from the quad, muzzle pointed a safe way. Hunt on foot, never from the seat or rack.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect y="230" width="400" height="70" fill="#dfe6d3"/>
  <text x="200" y="28" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Load away from the quad</text>
  <g transform="translate(80 196) scale(1.4)"><rect x="-40" y="-18" width="80" height="20" rx="6" fill="#4a5a3a" stroke="#2f3a2b" stroke-width="2"/><rect x="-46" y="-26" width="26" height="8" fill="#2f3a2b"/><rect x="20" y="-26" width="26" height="8" fill="#2f3a2b"/><circle cx="-28" cy="10" r="14" fill="#2f3a2b"/><circle cx="28" cy="10" r="14" fill="#2f3a2b"/><path d="M-6 -18 l6 -14 h10" stroke="#2f3a2b" stroke-width="4" fill="none"/></g><circle cx="290" cy="140" r="14" fill="#2f3a2b"/><line x1="290" y1="154" x2="290" y2="206" stroke="#2f3a2b" stroke-width="10" stroke-linecap="round"/><line x1="290" y1="206" x2="278" y2="234" stroke="#2f3a2b" stroke-width="8"/><line x1="290" y1="206" x2="304" y2="234" stroke="#2f3a2b" stroke-width="8"/><line x1="286" y1="172" x2="370" y2="200" stroke="#8b5a2b" stroke-width="7" stroke-linecap="round"/><text x="200" y="110" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Muzzle safe way</text>
  <text x="200" y="284" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Then hunt on foot. Never from the seat</text>
</svg>
