<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" font-family="sans-serif" role="img" aria-label="Your T3x Arctic in numbers: 1 barrel 508 mm, 20 inches; 2 overall length 1026 mm; 3 weight 4.1 kg without a scope; 4 twist 1 turn in 10 inches; 5 magazine holds 10 rounds; 6 factory trigger pull 13 to 15 newtons, about 3 pounds.">
<rect x="0" y="0" width="400" height="310" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Your rifle in numbers</text><g data-tip="508 mm|barrel (20 in). Source: Sako spec."><rect x="12" y="44" width="376" height="36" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="62" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="67" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="52" y="68" font-size="16" fill="#1F3D2B" text-anchor="start" font-weight="bold">508 mm</text><text x="160" y="68" font-size="14" fill="#17201A" text-anchor="start">barrel (20 in)</text></g><g data-tip="1026 mm|overall length. Source: Sako spec."><rect x="12" y="86" width="376" height="36" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="104" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="109" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="52" y="110" font-size="16" fill="#1F3D2B" text-anchor="start" font-weight="bold">1026 mm</text><text x="160" y="110" font-size="14" fill="#17201A" text-anchor="start">overall length</text></g><g data-tip="4.1 kg|weight, no scope. Source: Sako spec."><rect x="12" y="128" width="376" height="36" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="146" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="151" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="52" y="152" font-size="16" fill="#1F3D2B" text-anchor="start" font-weight="bold">4.1 kg</text><text x="160" y="152" font-size="14" fill="#17201A" text-anchor="start">weight, no scope</text></g><g data-tip="1 in 10|twist, inches per turn. Source: Sako spec."><rect x="12" y="170" width="376" height="36" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="188" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="193" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="52" y="194" font-size="16" fill="#1F3D2B" text-anchor="start" font-weight="bold">1 in 10</text><text x="160" y="194" font-size="14" fill="#17201A" text-anchor="start">twist, inches per turn</text></g><g data-tip="10|rounds in the magazine. Source: retailers."><rect x="12" y="212" width="376" height="36" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="230" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="235" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="52" y="236" font-size="16" fill="#1F3D2B" text-anchor="start" font-weight="bold">10</text><text x="160" y="236" font-size="14" fill="#17201A" text-anchor="start">rounds in the magazine</text></g><g data-tip="13 to 15 N|trigger, about 3 lb. Source: Tikka manual."><rect x="12" y="254" width="376" height="36" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="272" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="277" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text><text x="52" y="278" font-size="16" fill="#1F3D2B" text-anchor="start" font-weight="bold">13 to 15 N</text><text x="160" y="278" font-size="14" fill="#17201A" text-anchor="start">trigger, about 3 lb</text></g>
</svg>
