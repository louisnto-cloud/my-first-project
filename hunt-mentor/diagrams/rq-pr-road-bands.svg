<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Hunters by distance from a road open to vehicles. Most hunter dots sit within half a kilometre of the road: 73 percent in one Pennsylvania aerial survey. A few are between half and one kilometre. Beyond one kilometre, in the timber, deer stand with few hunters.">
