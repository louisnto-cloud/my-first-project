<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 302" font-family="sans-serif" role="img" aria-label="A moose year. Calves are born late May to June. Velvet comes off late August to early September. Rut runs late September to mid October. Mature bulls drop antlers in November. Region 3 general seasons fall between 20 September and 15 November, depending on the MU. In winter moose eat twigs, 15 to 20 kilograms a day.">
<rect x="0" y="0" width="400" height="302" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">A moose year</text><rect x="130.0" y="52" width="21.8" height="204" fill="#dfe6d3" opacity=".6"/><text x="140.91666666666666" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">J</text><text x="162.75" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">F</text><rect x="173.7" y="52" width="21.8" height="204" fill="#dfe6d3" opacity=".6"/><text x="184.58333333333331" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">M</text><text x="206.41666666666666" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A</text><rect x="217.3" y="52" width="21.8" height="204" fill="#dfe6d3" opacity=".6"/><text x="228.24999999999997" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">M</text><text x="250.08333333333331" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">J</text><rect x="261.0" y="52" width="21.8" height="204" fill="#dfe6d3" opacity=".6"/><text x="271.9166666666667" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">J</text><text x="293.75" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A</text><rect x="304.7" y="52" width="21.8" height="204" fill="#dfe6d3" opacity=".6"/><text x="315.5833333333333" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">S</text><text x="337.4166666666667" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">O</text><rect x="348.3" y="52" width="21.8" height="204" fill="#dfe6d3" opacity=".6"/><text x="359.25" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">N</text><text x="381.0833333333333" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">D</text><text x="8" y="77" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Calves born</text><rect x="234.8" y="60" width="26.2" height="24" rx="5" fill="#8b5a2b"/><text x="265.0" y="77" font-size="14" font-weight="bold" fill="#8b5a2b" text-anchor="start">late May to June</text><text x="8" y="111" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Velvet off</text><rect x="298.1" y="94" width="13.1" height="24" rx="5" fill="#8a9a6b"/><text x="8" y="145" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Rut</text><rect x="319.9" y="128" width="17.5" height="24" rx="5" fill="#e8590c"/><text x="315.94999999999993" y="145" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">late Sep to mid Oct</text><text x="8" y="179" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Antlers drop</text><rect x="348.3" y="162" width="21.8" height="24" rx="5" fill="#2f3a2b"/><text x="344.3333333333333" y="179" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">mature bulls, Nov</text><text x="8" y="213" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Hunt seasons</text><rect x="318.4" y="196" width="40.8" height="24" rx="5" fill="#4a7fb0"/><text x="314.4216666666667" y="213" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="end">Sep 20 to Nov 15</text><text x="8" y="247" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Winter food</text><rect x="130.0" y="230" width="65.5" height="24" rx="5" fill="#8a9a6b"/><text x="162.75" y="247" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">twigs</text><rect x="370.2" y="230" width="21.8" height="24" rx="5" fill="#8a9a6b"/><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Exact Region 3 dates depend on your MU.</text>
</svg>
