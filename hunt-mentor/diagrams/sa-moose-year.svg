<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 426" font-family="sans-serif" role="img" aria-label="A moose year, January to December. Calves are born late May to June. Velvet comes off late August to early September. The rut runs late September to mid October. Mature bulls drop antlers in November. Region 3 general seasons fall between 20 September and 15 November; exact dates depend on your MU (Management Unit). In winter, December to March, moose eat twigs, 15 to 20 kilograms a day.">
