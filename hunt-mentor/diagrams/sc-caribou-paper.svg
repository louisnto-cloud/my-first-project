<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 364" font-family="sans-serif" role="img" aria-label="Caribou paper trail in 5 steps. 1, win the Limited Entry Hunting, LEH, draw. 2, buy the $20.00 species licence, valid 2 days after issue. 3, hunt, with evidence of sex attached. 4, compulsory inspection within 30 days: the incisor tooth, the antlers, and the hide if no main beam is over 60 centimetres. 5, the Mandatory Hunter Report by March 31, hunted or not.">
