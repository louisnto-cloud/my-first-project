<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 286" role="img" aria-label="Memory hook: Name, Number, Up or Down. Rising numbers mean up. Dust means traffic. The sign beats the map.">
  <rect x="0" y="0" width="400" height="286" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Memory hook: the call</text>
<rect x="10" y="48" width="380" height="46" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="14" y="52" width="52" height="38" rx="8" fill="#e8590c"/>
<text x="40" y="80" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text>
<text x="78" y="70" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="start">Name</text>
<text x="78" y="88" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">the road, from the sign</text>
<rect x="10" y="100" width="380" height="46" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="14" y="104" width="52" height="38" rx="8" fill="#e8590c"/>
<text x="40" y="132" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text>
<text x="78" y="122" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="start">Number</text>
<text x="78" y="140" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">the kilometre you are at</text>
<rect x="10" y="152" width="380" height="46" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="14" y="156" width="52" height="38" rx="8" fill="#e8590c"/>
<text x="40" y="184" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">U</text>
<text x="78" y="174" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="start">Up or Down</text>
<text x="78" y="192" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">numbers rising = up</text>
<rect x="10" y="204" width="380" height="46" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="14" y="208" width="52" height="38" rx="8" fill="#e8590c"/>
<text x="40" y="236" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">D</text>
<text x="78" y="226" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="start">Dust = traffic</text>
<text x="78" y="244" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">slow, right, lights on</text>
<text x="200" y="276" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The sign beats the map</text>
</svg>
