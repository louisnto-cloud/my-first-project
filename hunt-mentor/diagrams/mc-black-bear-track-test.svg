<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Front track test from Idaho Fish and Game. Lay a straight edge across the top of the front foot pad. Black bear: the toes form an arc and the edge crosses them; claw marks about 2.5 to 6 centimetres ahead of the toe pads. Grizzly: the toes sit in a straighter line above the edge; claw marks about 5 to 11 centimetres ahead.">
