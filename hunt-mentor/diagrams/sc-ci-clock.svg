<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Timeline from September to December showing the compulsory inspection deadline for sheep and goats: within 30 days and before December 5, whichever comes first. Example 1: killed September 15, due October 15. Example 2: killed November 20, due December 5, not December 20. By appointment only, no drop ins, 98 percent." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Inspection deadline: sheep and goat</text>
<text x="200.0" y="46" font-size="14" fill="#8b5a2b" text-anchor="middle">Within 30 days AND before December 5</text>
<rect x="30.0" y="66" width="86.1" height="150" fill="#dfe6d3"/>
<text x="73.0" y="82" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Sep</text>
<rect x="116.1" y="66" width="88.9" height="150" fill="#fffaf0"/>
<text x="160.5" y="82" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Oct</text>
<rect x="205.0" y="66" width="86.1" height="150" fill="#dfe6d3"/>
<text x="248.0" y="82" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Nov</text>
<rect x="291.1" y="66" width="88.9" height="150" fill="#fffaf0"/>
<text x="335.5" y="82" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Dec</text>
<line x1="302.5" y1="66" x2="302.5" y2="220" stroke="#e8590c" stroke-width="3"/>
<text x="302.54098360655735" y="236" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Dec 5</text>
<rect x="70.2" y="100" width="86.1" height="26" rx="5" fill="#4a7fb0"/>
<text x="113.19672131147541" y="118" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">30 days</text>
<text x="70.1639344262295" y="144" font-size="14" fill="#23261f" text-anchor="start">Kill Sep 15: due Oct 15</text>
<rect x="259.5" y="164" width="86.1" height="26" rx="5" fill="#4a7fb0" opacity="0.3"/>
<rect x="259.5" y="164" width="43.0" height="26" rx="5" fill="#4a7fb0"/>
<text x="30" y="208" font-size="14" fill="#23261f" text-anchor="start">Kill Nov 20: due Dec 5, not Dec 20</text>
<rect x="20" y="248" width="360" height="44" rx="8" fill="#f3ead8" stroke="#2f3a2b" stroke-width="2"/>
<text x="200.0" y="275.2" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">By appointment only. No drop ins (98%).</text>
</svg>
