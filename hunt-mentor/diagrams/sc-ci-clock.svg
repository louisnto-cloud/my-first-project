<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 346" font-family="sans-serif" role="img" aria-label="Timeline from September to December showing the compulsory inspection deadline for sheep and goats: within 30 days and before December 5, whichever comes first. Example 1: killed September 15, due October 15. Example 2: killed November 20, due December 5, not December 20. By appointment only, no drop ins, 98 percent.">
<rect width="400" height="346" fill="#fffaf0"/>
<text x="12" y="24" font-size="17" font-weight="bold" fill="#2f3a2b">Inspection deadline: sheep and goat</text>
<text x="12" y="46" font-size="15" fill="#2f3a2b">Within <tspan font-weight="bold" fill="#c2410c">30 days</tspan> AND before <tspan font-weight="bold" fill="#c2410c">December 5</tspan></text>
<rect x="12.0" y="60" width="92.5" height="196" fill="#e9eddc"/>
<text x="58.2295" y="80" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Sep</text>
<rect x="104.5" y="60" width="95.5" height="196" fill="#f6f1e3"/>
<text x="152.23" y="80" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Oct</text>
<rect x="200.0" y="60" width="92.5" height="196" fill="#e9eddc"/>
<text x="246.23" y="80" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Nov</text>
<rect x="292.5" y="60" width="95.5" height="196" fill="#f6f1e3"/>
<text x="340.23" y="80" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Dec</text>
<rect x="55.1" y="110" width="92.5" height="28" rx="6" fill="#4a7fb0"/>
<text x="101.377" y="129" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">30 days</text>
<circle cx="55.1" cy="124" r="7" fill="#2f3a2b" stroke="#fffaf0" stroke-width="2"/>
<path d="M147.6 104 V144 M147.6 104 l14 5 l-14 5" stroke="#2f6e3b" stroke-width="2.4" fill="#2f6e3b"/>
<text x="47.1475" y="164" font-size="15" fill="#2f3a2b">Kill Sep 15: due <tspan font-weight="bold" fill="#2f6e3b">Oct 15</tspan></text>
<rect x="258.6" y="194" width="92.5" height="28" rx="6" fill="#4a7fb0" opacity="0.25"/>
<rect x="258.6" y="194" width="46.2" height="28" rx="6" fill="#4a7fb0"/>
<circle cx="258.6" cy="208" r="7" fill="#2f3a2b" stroke="#fffaf0" stroke-width="2"/>
<path d="M334.2 203.2 l9.6 9.6 M343.8 203.2 l-9.6 9.6" stroke="#c92a2a" stroke-width="2.6" stroke-linecap="round"/>
<text x="12" y="248" font-size="15" fill="#2f3a2b">Kill Nov 20: due <tspan font-weight="bold" fill="#c2410c">Dec 5</tspan>, not Dec 20</text>
<line x1="304.8" y1="88" x2="304.8" y2="256" stroke="#e8590c" stroke-width="3"/>
<rect x="276.7" y="90" width="56.1" height="24" rx="12.0" fill="#e8590c"/><text x="304.8" y="107.04" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">Dec 5</text>
<circle cx="24" cy="276" r="7" fill="#2f3a2b"/>
<text x="36" y="281" font-size="14" fill="#2f3a2b">kill</text>
<path d="M80 268 V284 M80 268 l12 4 l-12 4" stroke="#2f6e3b" stroke-width="2.2" fill="#2f6e3b"/>
<text x="98" y="281" font-size="14" fill="#2f3a2b">inspection due</text>
<rect x="8" y="296" width="384" height="42" rx="9" fill="#f4eedf" stroke="#2f3a2b" stroke-width="1.6"/>
<text x="200" y="323" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">By appointment only. No drop ins (98%).</text>
</svg>
