<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 384" font-family="sans-serif" role="img" aria-label="Your zero card: 1 rifle, Tikka T3x Arctic .308 Winchester; 2 sights, irons or which scope; 3 load and lot number; 4, in orange, zero distance and date; 5 clicks from bore sight; 6 plate test limits sitting, kneeling, standing; 7 next check before every hunt. Tape a copy in the case lid.">
