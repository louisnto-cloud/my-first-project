<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 356" font-family="sans-serif" role="img" aria-label="Two ways to open a deer. Gutted: guts out, carry it whole; lean: deer within 300 m of the truck. Gutless: meat off, guts stay in; lean: far in, or any moose. Licence notched first.">
<rect width="400" height="356" rx="12" fill="#EEF1EA"/>
<text x="16" y="30" font-size="18" font-weight="bold" fill="#1F3D2B">Two ways to open a deer</text><g data-tip="Gutted|Guts out, carry it whole. Lean: deer within 300 m of the truck. A skill, not law."><rect x="12" y="46" width="182" height="272" rx="10" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="103" y="74" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Gutted</text><g transform="translate(25 72) scale(0.4)">    <path d="M200 216 L212 218 L214 260 L216 298 L206 300 L204 262 L198 236z" fill="#7a5638"/>
