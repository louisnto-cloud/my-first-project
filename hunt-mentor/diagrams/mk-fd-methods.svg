    <path d="M340 158 C350 162 352 176 346 186 C342 178 340 168 340 158z" fill="#f3ead8" stroke="#5a3e26" stroke-width="1"/>
    <path d="M110 102 C116 86 126 76 134 72 C134 86 126 100 116 106z" fill="#a87b52" stroke="#5a3e26" stroke-width="1.4"/>
    <circle cx="90" cy="114" r="2.6" fill="#2f241a"/>
    <ellipse cx="64" cy="126" rx="3.4" ry="2.6" fill="#2f241a"/>
    <path d="M104 100 C102 80 108 62 122 50 M108 76 C98 70 94 60 96 50 M118 54 C122 44 132 40 140 40 M122 50 C118 40 118 32 122 26" fill="none" stroke="#6b4f35" stroke-width="3" stroke-linecap="round"/></g><text x="103" y="212" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">Guts out, carry it</text>
<text x="103" y="231" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">whole</text><rect x="22" y="246" width="162" height="62" rx="8" fill="#EEF1EA"/><text x="103" y="266" font-size="14" fill="#17201A" text-anchor="middle">Lean:</text>
<text x="103" y="284" font-size="14" fill="#17201A" text-anchor="middle">Deer within 300 m</text>
<text x="103" y="302" font-size="14" fill="#17201A" text-anchor="middle">of the truck</text></g><g data-tip="Gutless|Skin and take the meat, leave the guts in. Lean: far in, or any moose. A skill, not law."><rect x="206" y="46" width="182" height="272" rx="10" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="297" y="74" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Gutless</text><path d="M227 120 h26 l4 40 h-34 z" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><path d="M231 120 q9 -10 18 0" stroke="#1F3D2B" stroke-width="2" fill="none"/><path d="M263 120 h26 l4 40 h-34 z" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><path d="M267 120 q9 -10 18 0" stroke="#1F3D2B" stroke-width="2" fill="none"/><path d="M299 120 h26 l4 40 h-34 z" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><path d="M303 120 q9 -10 18 0" stroke="#1F3D2B" stroke-width="2" fill="none"/><path d="M335 120 h26 l4 40 h-34 z" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><path d="M339 120 q9 -10 18 0" stroke="#1F3D2B" stroke-width="2" fill="none"/><text x="297" y="212" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">Meat off, guts</text>
<text x="297" y="231" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">stay in</text><rect x="216" y="246" width="162" height="62" rx="8" fill="#EEF1EA"/><text x="297" y="266" font-size="14" fill="#17201A" text-anchor="middle">Lean:</text>
