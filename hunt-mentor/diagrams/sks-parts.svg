<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Right side of a Chinese Type 56 SKS with 10 numbered parts: 1 top cover, 2 operating handle, 3 rear sight, 4 front sight, 5 gas tube and handguard, 6 folded bayonet, 7 fixed magazine limited to 5 rounds, 8 safety behind the trigger, 9 magazine catch, 10 butt trap.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Your SKS: the parts that matter</text>
<polygon points="10.0,114.9 10.0,163.2 32.3,155.8 97.4,132.7 121.6,123.1 188.6,121.6 233.2,117.9 292.7,112.6 295.0,108.2 292.7,104.5 195.3,104.5 195.3,105.6 117.9,105.6 114.2,108.2 99.3,110.0" fill="#A8743F" stroke="#6E4A2A" stroke-width="1.5" stroke-linejoin="round"/><rect x="11.5" y="132.7" width="8.2" height="9.7" rx="0" fill="#8C5E33" stroke="#6E4A2A" stroke-width="1.2"/><polygon points="160.7,121.6 160.7,128.3 188.6,129.8 191.5,126.0 190.8,121.6" fill="#59625C" stroke="#17201A" stroke-width="1.5" stroke-linejoin="round"/><polygon points="158.1,122.3 160.3,122.3 159.5,129.0 157.7,129.0" fill="#3A403C" stroke="#17201A" stroke-width="1.2" stroke-linejoin="round"/><path d="M132.8 122.3 L133.9 132.0 L155.8 132.0 L157.3 122.3" fill="none" stroke="#3A403C" stroke-width="2.2" stroke-linejoin="round"/><path d="M146.9 122.3 Q144.7 126.0 146.2 129.8" fill="none" stroke="#3A403C" stroke-width="2.5" stroke-linecap="round"/><line x1="138.3" y1="123.4" x2="143.9" y2="126.4" stroke="#3A403C" stroke-width="3" stroke-linecap="round"/><circle cx="138.3" cy="123.4" r="2.0" fill="#3A403C" stroke="#17201A" stroke-width="1"/><polygon points="117.1,105.6 117.1,95.5 120.9,93.3 196.0,93.3 196.0,105.6" fill="#59625C" stroke="#17201A" stroke-width="1.5" stroke-linejoin="round"/><path d="M120.1 93.3 L121.6 90.0 Q158.8 88.5 196.0 90.0 L196.0 93.3 Z" fill="#8E9690" stroke="#17201A" stroke-width="1.5"/><line x1="120.9" y1="97.8" x2="123.8" y2="103.7" stroke="#3A403C" stroke-width="2.5" stroke-linecap="round"/><circle cx="120.9" cy="97.8" r="2.5" fill="#3A403C" stroke="#17201A" stroke-width="1"/><line x1="184.8" y1="96.3" x2="184.8" y2="99.3" stroke="#3A403C" stroke-width="2" stroke-linecap="round"/><circle cx="184.8" cy="97.8" r="4.0" fill="#C8CCC6" stroke="#17201A" stroke-width="1.5"/><rect x="195.3" y="91.1" width="23.1" height="11.9" rx="0" fill="#59625C" stroke="#17201A" stroke-width="1.5"/><polygon points="197.5,91.1 216.8,87.7 217.6,91.1" fill="#3A403C" stroke="#17201A" stroke-width="1.2" stroke-linejoin="round"/><rect x="195.3" y="97.4" width="194.2" height="5.2" rx="0" fill="#3A403C" stroke="#17201A" stroke-width="1.2"/><rect x="218.3" y="91.8" width="89.3" height="4.8" rx="0" fill="#59625C" stroke="#17201A" stroke-width="1.2"/><rect x="219.1" y="90.0" width="72.9" height="7.1" rx="1.116" fill="#A8743F" stroke="#6E4A2A" stroke-width="1.2"/><line x1="216.8" y1="95.5" x2="213.9" y2="100.7" stroke="#3A403C" stroke-width="2.5" stroke-linecap="round"/><circle cx="216.8" cy="95.5" r="2.5" fill="#3A403C" stroke="#17201A" stroke-width="1"/><polygon points="305.7,91.1 320.6,91.1 320.6,103.3 307.6,103.3" fill="#59625C" stroke="#17201A" stroke-width="1.2" stroke-linejoin="round"/><line x1="296.4" y1="107.8" x2="379.0" y2="107.8" stroke="#8E9690" stroke-width="1.5" stroke-linecap="round"/><circle cx="379.0" cy="107.8" r="2.0" fill="#8E9690" stroke="#17201A" stroke-width="1"/><polygon points="270.4,104.8 366.4,104.1 366.4,106.3 270.4,105.6" fill="#AEB4AE" stroke="#17201A" stroke-width="1.2" stroke-linejoin="round"/><rect x="364.1" y="102.6" width="8.2" height="5.2" rx="0" fill="#59625C" stroke="#17201A" stroke-width="1.2"/><rect x="372.7" y="96.3" width="10.0" height="6.7" rx="0" fill="#59625C" stroke="#17201A" stroke-width="1.2"/><rect x="376.4" y="88.8" width="2.6" height="7.4" rx="0" fill="#3A403C" stroke="#17201A" stroke-width="1"/><path d="M374.6 95.5 Q375.5 84.4 377.5 84.4 Q379.5 84.4 380.9 95.5" fill="none" stroke="#3A403C" stroke-width="1.5"/><g data-tip="Top cover|The sheet steel lid over the bolt. Comes off first in the field strip."><line x1="151.4" y1="89.2" x2="130.0" y2="48.0" stroke="#17201A" stroke-width="1.5"/><circle cx="151.4" cy="89.2" r="3" fill="#17201A"/><circle cx="130.0" cy="48.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="130.0" y="53.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text></g><g data-tip="Operating handle|Part of the bolt carrier. Pull it fully back and let go to load or clear."><line x1="184.8" y1="97.8" x2="185.0" y2="58.0" stroke="#17201A" stroke-width="1.5"/><circle cx="184.8" cy="97.8" r="3" fill="#17201A"/><circle cx="185.0" cy="58.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="185.0" y="63.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text></g><g data-tip="Rear sight|Tangent leaf with a slide. Numbers are hundreds of metres."><line x1="209.0" y1="88.5" x2="230.0" y2="48.0" stroke="#17201A" stroke-width="1.5"/><circle cx="209.0" cy="88.5" r="3" fill="#17201A"/><circle cx="230.0" cy="48.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="230.0" y="53.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text></g><g data-tip="Front sight|Hooded post. Screws up or down to zero."><line x1="377.5" y1="85.1" x2="360.0" y2="48.0" stroke="#17201A" stroke-width="1.5"/><circle cx="377.5" cy="85.1" r="3" fill="#17201A"/><circle cx="360.0" cy="48.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="360.0" y="53.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text></g><g data-tip="Gas tube and handguard|Holds the gas piston. Lifts off after the lock lever turns up."><line x1="255.5" y1="91.8" x2="280.0" y2="58.0" stroke="#17201A" stroke-width="1.5"/><circle cx="255.5" cy="91.8" r="3" fill="#17201A"/><circle cx="280.0" cy="58.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="280.0" y="63.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text></g><g data-tip="Bayonet|Folds under the barrel on a spring hinge. Keep it folded."><line x1="329.9" y1="105.2" x2="320.0" y2="160.0" stroke="#17201A" stroke-width="1.5"/><circle cx="329.9" cy="105.2" r="3" fill="#17201A"/><circle cx="320.0" cy="160.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="320.0" y="165.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text></g><g data-tip="Fixed magazine|Built in. Swings open to unload. By law it must hold no more than 5 rounds."><line x1="175.5" y1="129.0" x2="190.0" y2="172.0" stroke="#17201A" stroke-width="1.5"/><circle cx="175.5" cy="129.0" r="3" fill="#17201A"/><circle cx="190.0" cy="172.0" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="2"/><text x="190.0" y="177.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text></g><g data-tip="Safety|Lever behind the trigger. Forward and up is safe; it blocks the trigger."><line x1="140.9" y1="125.3" x2="110.0" y2="172.0" stroke="#17201A" stroke-width="1.5"/><circle cx="140.9" cy="125.3" r="3" fill="#17201A"/><circle cx="110.0" cy="172.0" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="2"/><text x="110.0" y="177.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">8</text></g><g data-tip="Magazine catch|Just in front of the trigger guard. Pull it back to swing the magazine open."><line x1="158.8" y1="127.5" x2="150.0" y2="178.0" stroke="#17201A" stroke-width="1.5"/><circle cx="158.8" cy="127.5" r="3" fill="#17201A"/><circle cx="150.0" cy="178.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="150.0" y="183.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">9</text></g><g data-tip="Butt trap|Holds the combination tool kit for cleaning."><line x1="15.6" y1="137.2" x2="30.0" y2="160.0" stroke="#17201A" stroke-width="1.5"/><circle cx="15.6" cy="137.2" r="3" fill="#17201A"/><circle cx="30.0" cy="160.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="30.0" y="165.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">10</text></g><circle cx="25.0" cy="204.0" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="25.0" y="209.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="41.0" y="209.0" font-size="14" fill="#17201A" text-anchor="start">Top cover</text><circle cx="25.0" cy="226.0" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="25.0" y="231.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="41.0" y="231.0" font-size="14" fill="#17201A" text-anchor="start">Operating handle</text><circle cx="25.0" cy="248.0" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="25.0" y="253.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="41.0" y="253.0" font-size="14" fill="#17201A" text-anchor="start">Rear sight</text><circle cx="25.0" cy="270.0" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="25.0" y="275.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="41.0" y="275.0" font-size="14" fill="#17201A" text-anchor="start">Front sight</text><circle cx="25.0" cy="292.0" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="25.0" y="297.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text><text x="41.0" y="297.0" font-size="14" fill="#17201A" text-anchor="start">Gas tube</text><circle cx="218.0" cy="204.0" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="218.0" y="209.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text><text x="234.0" y="209.0" font-size="14" fill="#17201A" text-anchor="start">Bayonet (folded)</text><circle cx="218.0" cy="226.0" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="2"/><text x="218.0" y="231.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text><text x="234.0" y="231.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Magazine: 5 max</text><circle cx="218.0" cy="248.0" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="2"/><text x="218.0" y="253.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">8</text><text x="234.0" y="253.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Safety</text><circle cx="218.0" cy="270.0" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="218.0" y="275.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">9</text><text x="234.0" y="275.0" font-size="14" fill="#17201A" text-anchor="start">Magazine catch</text><circle cx="218.0" cy="292.0" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="218.0" y="297.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">10</text><text x="234.0" y="297.0" font-size="14" fill="#17201A" text-anchor="start">Butt trap</text>
</svg>
