<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 346" font-family="sans-serif" role="img" aria-label="Non hunters cards. Do: say good morning first. Do not: leave a gut pile near a trail, campsite or recreation site. Do: at a trailhead keep the firearm cased or slung, muzzle down, action open. Do not: have a loaded firearm in or on a vehicle, an offence. Do not: argue hunting at a trailhead. Do: report poachers on the RAPP line.">
<rect x="0" y="0" width="400" height="346" fill="#fffaf0"/>
