/><g transform="translate(40 178) scale(0.9)"><rect x="-22" y="-8" width="44" height="16" rx="6" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6 -8 v-4 h12 v4" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="179" cy="160" r="11" fill="#8a9a6b"/><path d="M173 160 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="168" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Trailhead:</text><text x="68" y="186" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">cased,</text><text x="68" y="204" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">action open</text><rect x="203" y="144" width="185" height="92" rx="10" fill="#fdf0e6" stroke="#e8590c" stroke-width="2"/><g transform="translate(233 178) scale(0.9)"><rect x="-22" y="-6" width="26" height="16" rx="2" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 -2 h10 l6 6 v6 h-16 z" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-12" cy="12" r="5" fill="#2f3a2b"/><circle cx="12" cy="12" r="5" fill="#2f3a2b"/></g><circle cx="372" cy="160" r="11" fill="#e8590c"/><path d="M367 155 l10 10 M377 155 l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="261" y="168" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Loaded gun</text><text x="261" y="186" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">in a</text><text x="261" y="204" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">vehicle:</text><text x="261" y="222" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">offence</text><rect x="10" y="244" width="185" height="92" rx="10" fill="#fdf0e6" stroke="#e8590c" stro