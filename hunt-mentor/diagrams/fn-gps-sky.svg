<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Satellites overhead. In the open, signals reach the hunter cleanly: about 5 metres accuracy. Under thick timber the signals are blocked or bounced and accuracy gets worse.">
