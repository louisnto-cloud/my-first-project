<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 298" role="img" aria-label="ATV on a Forest Service Road: you need a valid driver licence and at least 200,000 dollars of third party liability insurance, plus registration and a helmet under the Off Road Vehicle Act.">
  <rect x="0" y="0" width="400" height="298" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">ATV on a Forest Service Road</text>
<rect x="10" y="46" width="380" height="56" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="24.0" y="62" width="36" height="24" rx="4" fill="#4a7fb0"/>
<text x="80" y="68" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Driver&#x27;s licence</text>
<text x="80" y="90" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">valid, carried (99%)</text>
<rect x="10" y="108" width="380" height="56" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<text x="42.0" y="142" font-family="sans-serif" font-size="26" font-weight="bold" fill="#2f3a2b" text-anchor="middle">$</text>
<text x="80" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">$200,000 insurance</text>
<text x="80" y="152" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">third party liability, minimum (99%)</text>
<rect x="10" y="170" width="380" height="56" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="26.0" y="184" width="32" height="22" rx="3" fill="#e8590c"/>
<text x="80" y="192" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Registered, plate shown</text>
<text x="80" y="214" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">front, back or left side (99%)</text>
<rect x="10" y="232" width="380" height="56" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<circle cx="42.0" cy="258" r="16" fill="#2f3a2b"/>
<text x="80" y="254" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Helmet</text>
<text x="80" y="276" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">on ride astride ORVs (99%)</text>
</svg>
