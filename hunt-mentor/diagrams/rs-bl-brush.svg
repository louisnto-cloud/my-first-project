<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" font-family="sans-serif" role="img" aria-label="Where blood sits on brush. High on both sides: a pass through, bleeding well. Low and on one side: maybe no exit hole, expect less blood. A fine mist of tiny drops: blood breathed out, often a lung hit.">
<rect x="0" y="0" width="400" height="296" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Read the brush, not just the ground</text>
<rect x="0" y="220" width="400" height="80" rx="0" fill="#cfdcb5"/><rect x="66" y="90" width="8" height="130" rx="2" fill="#7d8b74"/><line x1="70" y1="110" x2="54" y2="100" stroke="#7d8b74" stroke-width="3"/><line x1="70" y1="132" x2="86" y2="122" stroke="#7d8b74" stroke-width="3"/><line x1="70" y1="154" x2="54" y2="144" stroke="#7d8b74" stroke-width="3"/><line x1="70" y1="176" x2="86" y2="166" stroke="#7d8b74" stroke-width="3"/><line x1="70" y1="198" x2="54" y2="188" stroke="#7d8b74" stroke-width="3"/><rect x="196" y="90" width="8" height="130" rx="2" fill="#7d8b74"/><line x1="200" y1="110" x2="184" y2="100" stroke="#7d8b74" stroke-width="3"/><line x1="200" y1="132" x2="216" y2="122" stroke="#7d8b74" stroke-width="3"/><line x1="200" y1="154" x2="184" y2="144" stroke="#7d8b74" stroke-width="3"/><line x1="200" y1="176" x2="216" y2="166" stroke="#7d8b74" stroke-width="3"/><line x1="200" y1="198" x2="184" y2="188" stroke="#7d8b74" stroke-width="3"/><rect x="326" y="90" width="8" height="130" rx="2" fill="#7d8b74"/><line x1="330" y1="110" x2="314" y2="100" stroke="#7d8b74" stroke-width="3"/><line x1="330" y1="132" x2="346" y2="122" stroke="#7d8b74" stroke-width="3"/><line x1="330" y1="154" x2="314" y2="144" stroke="#7d8b74" stroke-width="3"/><line x1="330" y1="176" x2="346" y2="166" stroke="#7d8b74" stroke-width="3"/><line x1="330" y1="198" x2="314" y2="188" stroke="#7d8b74" stroke-width="3"/><g transform="translate(80 120) rotate(-90) scale(0.9)"><path d="M-5 0 A5 5 0 1 1 5 0 Q3 4 0 12 Q-3 4 -5 0 Z" fill="#c62828"/></g><g transform="translate(62 130) rotate(90) scale(0.9)"><path d="M-5 0 A5 5 0 1 1 5 0 Q3 4 0 12 Q-3 4 -5 0 Z" fill="#c62828"/></g><text x="70" y="76" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">high, both sides</text><text x="70" y="260" font-size="14" fill="#23261f" text-anchor="middle">pass through,</text><text x="70" y="278" font-size="14" fill="#23261f" text-anchor="middle">bleeding well</text><g transform="translate(212 200) rotate(-90) scale(0.9)"><path d="M-5 0 A5 5 0 1 1 5 0 Q3 4 0 12 Q-3 4 -5 0 Z" fill="#c62828"/></g><text x="200" y="76" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">low, one side</text><text x="200" y="260" font-size="14" fill="#23261f" text-anchor="middle">maybe no exit,</text><text x="200" y="278" font-size="14" fill="#23261f" text-anchor="middle">less blood</text><circle cx="320" cy="150" r="1.6" fill="#c62828"/><circle cx="329" cy="150" r="1.6" fill="#c62828"/><circle cx="338" cy="150" r="1.6" fill="#c62828"/><circle cx="320" cy="158" r="1.6" fill="#c62828"/><circle cx="329" cy="158" r="1.6" fill="#c62828"/><circle cx="338" cy="158" r="1.6" fill="#c62828"/><circle cx="320" cy="166" r="1.6" fill="#c62828"/><circle cx="329" cy="166" r="1.6" fill="#c62828"/><circle cx="338" cy="166" r="1.6" fill="#c62828"/><text x="330" y="76" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">fine mist</text><text x="330" y="260" font-size="14" fill="#23261f" text-anchor="middle">breathed out:</text><text x="330" y="278" font-size="14" fill="#23261f" text-anchor="middle">lungs (Tip)</text>
