<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="sans-serif" role="img" aria-label="A clearcut seen from above, ringed by forest cover. Deer use is concentrated in the band within 100 m of the cover. The centre of a big cut gets little use. Watch the edges, not the middle.">
<rect width="400" height="330" fill="#EEF1EA"/>
<text x="200" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Cutblocks: the 100 m band</text>
<rect x="14" y="46" width="372" height="230" rx="10" fill="#8a9a6b" stroke="#1F3D2B" stroke-width="1.5"/><rect x="60" y="80" width="280" height="160" rx="4" fill="#d9e4c8" stroke="#1F3D2B" stroke-width="1.5"/><rect x="100" y="110" width="200" height="100" rx="2" fill="#f3f1e4" stroke="#1F3D2B" stroke-width="1"/><text x="200" y="100" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F3D2B">within 100 m of cover</text><text x="200" y="156" font-size="14" text-anchor="middle" font-weight="bold" fill="#17201A">centre of a big cut:</text><text x="200" y="176" font-size="14" text-anchor="middle" font-weight="bold" fill="#17201A">little use (90%)</text><text x="200" y="68" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">forest (cover)</text><text x="200" y="298" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Most deer use is near the edge (90%)</text><text x="200" y="318" font-size="15" text-anchor="middle" font-weight="bold" fill="#FF6A13">Watch the edges, not the middle (Tip)</text>
</svg>
