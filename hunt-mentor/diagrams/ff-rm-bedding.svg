<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="The barrelled action sits in the stock. A recoil lug fits a slot in the stock and two action screws pull the action down. Tikka lists 7 newton metres, 62 inch pounds, for metal trigger guards. Check them after every cleaning.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Action screws hold your zero</text><rect x="60" y="110" width="290" height="26" rx="4" fill="#6b6f68" stroke="#2f3a2b" stroke-width="2"/><path d="M30 136 L370 136 L370 170 L250 170 L230 200 L200 200 L190 170 L30 176 Z" fill="#8b5a2b" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="150" y="136" width="14" height="18" rx="0" fill="#2f3a2b" stroke="none" stroke-width="2"/><text x="157" y="230" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">recoil lug</text><line x1="157" y1="154" x2="157" y2="216" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round"/><line x1="110" y1="200" x2="110" y2="130" stroke="#e8590c" stroke-width="5" stroke-linecap="round"/><circle cx="110" cy="204" r="7" fill="#e8590c" stroke="none" stroke-width="2"/><line x1="270" y1="200" x2="270" y2="130" stroke="#e8590c" stroke-width="5" stroke-linecap="round"/><circle cx="270" cy="204" r="7" fill="#e8590c" stroke="none" stroke-width="2"/><text x="110" y="250" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Screw</text><text x="270" y="250" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Screw</text><text x="200" y="86" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Metal trigger guard: 7 Nm (62 in lb)</text><text x="200.0" y="284" font-size="14" fill="#2f3a2b" text-anchor="middle">Check tightness after every clean (Tikka manual)</text>
</svg>
