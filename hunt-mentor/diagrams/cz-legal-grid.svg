<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 352" font-family="sans-serif" role="img" aria-label="What a .22 rimfire may legally hunt in BC, from the methods table on page 13 of the synopsis: grouse and ptarmigan yes, wild turkey yes (note 2: grouse, ptarmigan or turkey only among birds), snowshoe hare yes, coyote, raccoon and skunk yes. Quail and pheasant no, ducks and geese no, deer, bear, elk and moose no."><rect x="0" y="0" width="400" height="352" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">What the .22 may hunt in BC</text><text x="16" y="56" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Rimfire (.22) in the page 13 methods table:</text><rect x="14" y="70" width="372" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="26" y="91" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Grouse, ptarmigan</text><rect x="270" y="75" width="52" height="20" rx="5" fill="#1F3D2B"/><text x="296" y="90" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Yes</text><text x="332" y="90" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">note 2</text><rect x="14" y="106" width="372" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="26" y="127" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Wild turkey</text><rect x="270" y="111" width="52" height="20" rx="5" fill="#1F3D2B"/><text x="296" y="126" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Yes</text><text x="332" y="126" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">note 2</text><rect x="14" y="142" width="372" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="26" y="163" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Snowshoe hare</text><rect x="270" y="147" width="52" height="20" rx="5" fill="#1F3D2B"/><text x="296" y="162" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Yes</text><rect x="14" y="178" width="372" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="26" y="199" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Coyote, raccoon, skunk</text><rect x="270" y="183" width="52" height="20" rx="5" fill="#1F3D2B"/><text x="296" y="198" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Yes</text><rect x="14" y="214" width="372" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="26" y="235" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Quail, pheasant</text><rect x="270" y="219" width="52" height="20" rx="5" fill="#FF6A13"/><text x="296" y="234" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">No</text><text x="332" y="234" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">note 2</text><rect x="14" y="250" width="372" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="26" y="271" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Ducks, geese</text><rect x="270" y="255" width="52" height="20" rx="5" fill="#FF6A13"/><text x="296" y="270" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">No</text><rect x="14" y="286" width="372" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="26" y="307" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Deer, bear, elk, moose</text><rect x="270" y="291" width="52" height="20" rx="5" fill="#FF6A13"/><text x="296" y="306" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">No</text><text x="16" y="340" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Synopsis 2026 to 2028, page 13 (99%).</text></svg>
