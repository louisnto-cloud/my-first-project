<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Evidence meter for what drives elk movement. Strong: dawn and dusk activity from GPS collars, and people and hunting pressure from field experiments. Good: deep snow from field studies. Moderate, mixed: heat pushing elk to shade and north slopes. Weak, no elk study found: cold fronts and barometer, and the moon. Short bars are Tips, not facts.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Evidence meter: what moves elk?</text><text x="170" y="65" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">Dawn and dusk</text><rect x="180" y="48" width="130" height="24" rx="4" fill="#dfe6d3"/><rect x="180" y="48" width="123.5" height="24" rx="4" fill="#2f3a2b"/><text x="316" y="65" font-size="14" fill="#6b4f35" text-anchor="start">GPS collars</text><text x="170" y="101" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">People, pressure</text><rect x="180" y="84" width="130" height="24" rx="4" fill="#dfe6d3"/><rect x="180" y="84" width="123.5" height="24" rx="4" fill="#2f3a2b"/><text x="316" y="101" font-size="14" fill="#6b4f35" text-anchor="start">Experiments</text><text x="170" y="137" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">Deep snow</text><rect x="180" y="120" width="130" height="24" rx="4" fill="#dfe6d3"/><rect x="180" y="120" width="110.5" height="24" rx="4" fill="#2f3a2b"/><text x="316" y="137" font-size="14" fill="#6b4f35" text-anchor="start">Field studies</text><text x="170" y="173" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">Heat: shade, north</text><rect x="180" y="156" width="130" height="24" rx="4" fill="#dfe6d3"/><rect x="180" y="156" width="91.0" height="24" rx="4" fill="#8a9a6b"/><text x="316" y="173" font-size="14" fill="#6b4f35" text-anchor="start">Mixed results</text><text x="170" y="209" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">Cold front, barometer</text><rect x="180" y="192" width="130" height="24" rx="4" fill="#dfe6d3"/><rect x="180" y="192" width="32.5" height="24" rx="4" fill="#e8590c"/><text x="316" y="209" font-size="14" fill="#6b4f35" text-anchor="start">No elk study</text><text x="170" y="245" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">Moon</text><rect x="180" y="228" width="130" height="24" rx="4" fill="#dfe6d3"/><rect x="180" y="228" width="26.0" height="24" rx="4" fill="#e8590c"/><text x="316" y="245" font-size="14" fill="#6b4f35" text-anchor="start">No elk study</text><text x="200" y="290" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Short bar: treat as Tip, not fact</text>
</svg>
