<line x1="59.8" y1="124" x2="59.8" y2="186" stroke="#b9ad92" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="303.3" y1="124" x2="303.3" y2="186" stroke="#b9ad92" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="76.9" y1="108" x2="259.5" y2="108" stroke="#9a6a3a" stroke-width="3" stroke-dasharray="none"/>
<line x1="76.9" y1="108" x2="76.9" y2="186" stroke="#b9ad92" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="259.5" y1="108" x2="259.5" y2="186" stroke="#b9ad92" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="93.9" y1="92" x2="215.7" y2="92" stroke="#9a6a3a" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="93.9" y1="92" x2="93.9" y2="186" stroke="#b9ad92" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="215.7" y1="92" x2="215.7" y2="186" stroke="#b9ad92" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="111.0" y1="76" x2="171.8" y2="76" stroke="#9a6a3a" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="111.0" y1="76" x2="111.0" y2="186" stroke="#b9ad92" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="171.8" y1="76" x2="171.8" y2="186" stroke="#b9ad92" stroke-width="1" stroke-dasharray="2 3"/>
<text x="70" y="84" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="end">Steep</text>
<text x="250" y="92" font-size="17" font-weight="bold" fill="#2f6e3b">Gentle</text>
<path d="M0 166 H400" stroke="#d8ccb2" stroke-width="1.4"/>
<text x="14" y="186" font-size="14" font-weight="bold" fill="#6b5b4b">Map view</text>
