<text x="265.5" y="250.0" font-size="16" font-weight="bold" fill="#9a6a3a" text-anchor="middle" transform="rotate(-90 265.5 250.0)">1200</text>
<ellipse cx="154.8" cy="250" rx="60.9" ry="22.4" fill="none" stroke="#9a6a3a" stroke-width="1.5"/>
<ellipse cx="141.4" cy="250" rx="30.4" ry="11.2" fill="none" stroke="#9a6a3a" stroke-width="1.5"/>
