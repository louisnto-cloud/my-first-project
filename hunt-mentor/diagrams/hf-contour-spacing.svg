<text x="14" y="330" font-size="16" font-weight="bold" fill="#c0392b">Steep: lines close</text>
<text x="388" y="330" font-size="16" font-weight="bold" fill="#2f6e3b" text-anchor="end">Gentle: far apart</text>
<text x="200" y="356" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Thick line = index, has the height number.</text>
<text x="200" y="376" font-size="15" fill="#2f3a2b" text-anchor="middle">The top of the number faces uphill.</text>
</svg>
