<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 388" font-family="sans-serif" role="img" aria-label="Contour lines. Top: a side view of a hill, steep on the left and gentle on the right, cut by evenly spaced heights. Below: the same hill as a map. Each height becomes a contour line. On the steep side the lines bunch close together; on the gentle side they spread far apart. One thicker index line carries the height number 1200, and the top of the number faces uphill.">
<rect width="400" height="388" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Contour lines</text>
<text x="14" y="52" font-size="14" font-weight="bold" fill="#6b5b4b">Side view</text>
<path d="M30 152 L128 60 L380 152z" fill="#d9e0c6" stroke="#2f3a2b" stroke-width="2.4" stroke-linejoin="round"/>
<line x1="42.8" y1="140" x2="347.1" y2="140" stroke="#9a6a3a" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="42.8" y1="140" x2="42.8" y2="186" stroke="#b9ad92" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="347.1" y1="140" x2="347.1" y2="186" stroke="#b9ad92" stroke-width="1" stroke-dasharray="2 3"/>
