<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" font-family="sans-serif" role="img" aria-label="Three cards: searching (walking, looking), stalking (sneaking closer) and lying in wait for wildlife while in possession of a firearm or other weapon are all hunting, even if no shot is fired and nothing is killed.">
<rect width="400" height="250" fill="#fffaf0"/>
<text x="200" y="27" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">With a weapon, this is all hunting</text>
<text x="200" y="50" font-size="16" fill="#2f3a2b" text-anchor="middle">Even if you never fire a shot.</text>
<rect x="8" y="64" width="124" height="176" rx="10" fill="#fffaf0" stroke="#e8590c" stroke-width="2.4"/>
<path d="M8 74 a10 10 0 0 1 10 -10 H122 a10 10 0 0 1 10 10 V96 H8z" fill="#e8590c"/>
<text x="70" y="87" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">Searching</text>
<rect x="16" y="104" width="108" height="90" rx="6" fill="#e6eef4"/><rect x="16" y="186" width="108" height="12" fill="#c9cfa6"/>
<g transform="translate(58 194) scale(1.5 1.5)"><path d="M-5 -20 L-6 0 M4 -20 L6 0" stroke="#4a4136" stroke-width="5" stroke-linecap="round"/><path d="M-8 -40 C-8 -44 8 -44 8 -40 L7 -19 H-7z" fill="#e8590c"/><circle cx="0" cy="-47" r="5.5" fill="#e0b48c"/><path d="M-6 -49 C-6 -56 6 -56 6 -49z" fill="#e8590c"/><path d="M4 -36 L22 -42" stroke="#3b2a1a" stroke-width="2.6" stroke-linecap="round"/><path d="M4 -36 L10 -31" stroke="#e0b48c" stroke-width="3" stroke-linecap="round"/></g>
<path d="M84 120 l14 -4 M84 126 l14 4" stroke="#6b5b4b" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="70" y="224" font-size="15" fill="#2f3a2b" text-anchor="middle">walking, looking</text>
<rect x="138" y="64" width="124" height="176" rx="10" fill="#fffaf0" stroke="#e8590c" stroke-width="2.4"/>
<path d="M138 74 a10 10 0 0 1 10 -10 H252 a10 10 0 0 1 10 10 V96 H138z" fill="#e8590c"/>
<text x="200" y="87" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">Stalking</text>
<rect x="146" y="104" width="108" height="90" rx="6" fill="#e6eef4"/><rect x="146" y="186" width="108" height="12" fill="#c9cfa6"/>
<g transform="translate(172 194) scale(1.3)"><path d="M-6 -16 L-14 -2 L-8 0 M2 -16 L10 -8 L8 0" stroke="#4a4136" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M-10 -32 C-6 -38 8 -36 10 -30 L6 -14 H-8z" fill="#e8590c"/><circle cx="12" cy="-36" r="5.5" fill="#e0b48c"/><path d="M6 -38 C6 -45 18 -45 18 -38z" fill="#e8590c"/><path d="M2 -24 L28 -20" stroke="#3b2a1a" stroke-width="2.6" stroke-linecap="round"/><path d="M4 -26 L12 -22" stroke="#e0b48c" stroke-width="3" stroke-linecap="round"/></g>
<g transform="translate(230 194) scale(-0.8 0.8)"><path d="M-8 -18 L-10 0 M-4 -18 L-3 0 M12 -18 L13 0 M16 -18 L18 0" stroke="#5a3e26" stroke-width="2.4" stroke-linecap="round"/><path d="M-12 -28 C-12 -34 -4 -34 6 -34 C14 -34 20 -32 20 -26 C20 -20 16 -17 8 -17 L-6 -17 C-10 -17 -12 -21 -12 -28z" fill="#9a7350"/><path d="M-10 -30 L-16 -42 L-12 -44 L-6 -32z" fill="#9a7350"/><path d="M-16 -42 C-20 -43 -24 -40 -24 -38 L-20 -37 C-17 -37 -14 -39 -13 -41z" fill="#9a7350"/><path d="M-14 -44 L-18 -50 L-12 -45z M-12 -44 L-9 -50 L-10 -44z" fill="#9a7350"/><ellipse cx="18" cy="-27" rx="3" ry="4" fill="#f3ead8"/><circle cx="-18" cy="-41" r=".9" fill="#111"/></g>
<text x="200" y="224" font-size="15" fill="#2f3a2b" text-anchor="middle">sneaking closer</text>
<rect x="268" y="64" width="124" height="176" rx="10" fill="#fffaf0" stroke="#e8590c" stroke-width="2.4"/>
<path d="M268 74 a10 10 0 0 1 10 -10 H382 a10 10 0 0 1 10 10 V96 H268z" fill="#e8590c"/>
<text x="330" y="87" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">Waiting</text>
