<rect x="308.5" y="192.0" width="3" height="5" fill="#5a3d22"/><path d="M310.0 126.0 L326.2 157.5 L318.8 157.5 L339.4 193.0 L280.6 193.0 L301.2 157.5 L293.8 157.5z" fill="#3f5a3a"/>
<g transform="translate(322 194) scale(1.4)"><path d="M-4 -6 L14 -8 L18 0" stroke="#4a4136" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M-10 -34 C-10 -38 4 -38 4 -34 L4 -6 H-10z" fill="#e8590c"/><circle cx="-3" cy="-41" r="5.5" fill="#e0b48c"/><path d="M-9 -43 C-9 -50 3 -50 3 -43z" fill="#e8590c"/><path d="M-6 -14 L26 -18" stroke="#3b2a1a" stroke-width="2.6" stroke-linecap="round"/><path d="M0 -24 L8 -16" stroke="#e0b48c" stroke-width="3" stroke-linecap="round"/></g>
<text x="330" y="224" font-size="15" fill="#2f3a2b" text-anchor="middle">lying in wait</text>
</svg>
