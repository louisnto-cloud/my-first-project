<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 224" role="img" aria-label="Three cards: searching, stalking and lying in wait for wildlife while in possession of a firearm or other weapon are all hunting, even if no shot is fired and nothing is killed." font-family="sans-serif">
  <rect x="0" y="0" width="396" height="224" fill="#fffaf0"/>
<text x="198.0" y="26" font-size="19" fill="#23261f" text-anchor="middle" font-weight="bold">With a weapon, this is all hunting</text>
<text x="198.0" y="48" font-size="14" fill="#2f3a2b" text-anchor="middle">Even if you never fire a shot.</text>
<rect x="6" y="58" width="124" height="156" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<rect x="6" y="58" width="124" height="30" rx="10" fill="#e8590c"/><rect x="6" y="76" width="124" height="12" fill="#e8590c"/>
<text x="68.0" y="79" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Searching</text>
