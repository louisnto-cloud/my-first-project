<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A bullet path chart: the dashed line of sight and the orange bullet path, which rises, crosses the line at the 100 m zero, then drops more and more past 200 m. Plan: zero at 100 m (a Tip), practise at 50, 100 and 150 m, and no shot at deer past 150 m.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Zero plan for deer</text>
<line x1="40.0" y1="150.0" x2="370.0" y2="150.0" stroke="#1F3D2B" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><text x="370.0" y="196.0" font-size="14" fill="#1F3D2B" text-anchor="end">line of sight</text><line x1="40.0" y1="144.0" x2="40.0" y2="156.0" stroke="#17201A" stroke-width="1.5" stroke-linecap="round"/><text x="40.0" y="136.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">0</text><line x1="150.0" y1="144.0" x2="150.0" y2="156.0" stroke="#17201A" stroke-width="1.5" stroke-linecap="round"/><text x="150.0" y="136.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">100 m</text><line x1="260.0" y1="144.0" x2="260.0" y2="156.0" stroke="#17201A" stroke-width="1.5" stroke-linecap="round"/><text x="260.0" y="136.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">200 m</text><line x1="370.0" y1="144.0" x2="370.0" y2="156.0" stroke="#17201A" stroke-width="1.5" stroke-linecap="round"/><text x="370.0" y="136.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="end">300 m</text><path d="M40 166 Q95 136 150 150 Q230 166 300 205 Q340 228 370 250" fill="none" stroke="#FF6A13" stroke-width="4"/><circle cx="150.0" cy="150.0" r="6.0" fill="#FF6A13" stroke="#17201A" stroke-width="1.5"/><text x="30.0" y="62.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="start">Zero at 100 m (Tip).</text><text x="30.0" y="84.0" font-size="14" fill="#17201A" text-anchor="start">Practise at 50, 100 and 150 m.</text><text x="30.0" y="106.0" font-size="14" font-weight="bold" fill="#B3261E" text-anchor="start">Past 150 m: no shot at deer.</text><text x="200.0" y="280.0" font-size="14" fill="#17201A" text-anchor="middle">The bullet crosses the line at 100 m, then drops.</text>
</svg>
