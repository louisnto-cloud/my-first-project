<ellipse cx="-70" cy="10" rx="40" ry="26" fill="#bcd3ea"/>
<ellipse cx="20" cy="-52" rx="34" ry="12" fill="#e79aa0"/>
<path d="M30 0 q14 -18 28 0 q-14 24 -28 0 Z" fill="#b3222b"/>
<ellipse cx="-20" cy="34" rx="26" ry="20" fill="#8b5a2b"/>
<path d="M-20 70 Q60 80 100 30 L100 60 Q60 92 -20 78 Z" fill="#d98c8c" opacity=".8"/>
<ellipse cx="40" cy="-14" rx="62" ry="50" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="7 5"/>
</g>
<text x="270" y="128" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Crop</text>
<line x1="268" y1="124" x2="290" y2="140" stroke="#2f3a2b" stroke-width="1"/>
<text x="160" y="92" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Lungs</text>
<text x="100" y="118" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Air sacs</text>
