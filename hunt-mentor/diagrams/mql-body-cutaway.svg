<circle cx="110" cy="-80" r="38" fill="#cfd2d6"/>
<path d="M140 -78 l20 6 l-20 8 Z" fill="#555"/><circle cx="122" cy="-88" r="5" fill="#111"/>
<path d="M100 -112 q-6 -36 26 -30 q-14 4 -16 30 Z" fill="#111"/>
<ellipse cx="80" cy="-20" rx="20" ry="16" fill="#e8c27a"/>
