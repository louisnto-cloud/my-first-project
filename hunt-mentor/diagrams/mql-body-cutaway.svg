<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side view cutaway of a quail. Crop at the base of the neck. Lungs pressed up under the back. Pale blue air sacs fill much of the body. The heart sits low in the chest behind the crop. The gizzard is lower and further back. The big breast muscle covers the keel underneath. An orange dashed ring marks heart and lungs in the front half of the body. General bird anatomy, 70 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Inside a quail (side view)</text>
