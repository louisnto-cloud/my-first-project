<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Compass drill step 2: walk a measured 100 metres three times, counting each left foot, on flat, rough and uphill ground. Average the counts.">
<rect width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c"/><text x="26" y="31" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">2</text><text x="52" y="32" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Pace 100 m, three times</text><rect x="20" y="56" width="360" height="200" rx="8" fill="#dfe6d3"/><g transform="translate(90 190) scale(1.4)"><circle cx="0" cy="-30" r="7" fill="#2f3a2b"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" fill="none" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="170" y="100" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Count each left foot</text><text x="170" y="130" font-size="15" fill="#23261f" text-anchor="start">Flat, then rough,</text><text x="170" y="160" font-size="15" fill="#23261f" text-anchor="start">then uphill. Average</text>
</svg>
