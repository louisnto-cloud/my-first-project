<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 334" font-family="sans-serif" role="img" aria-label="How old is the scat? A timeline of 4 stages. Hours: wet, shiny, dark, flies. A day or two: dull with a dry crust, soft inside. Days to a week: dry, lighter colour, cracked. Weeks: faded, crumbling, moss or mould. Cold slows every stage.">
<rect width="400" height="334" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">How old is the scat?</text>
<g data-tip="Not by colour alone|Colour changes with diet. Read moisture and shine, or break one pellet with a stick: moist and green inside is recent. Tip." data-tip-dot="366,40">
<text x="200" y="47" font-size="15" fill="#6b5b4b" text-anchor="middle">Read shine and moisture, not colour</text></g>
<g data-tip="Hours old|Wet, shiny, warm, strong smell, flies (60%)." data-tip-dot="88,68">
<rect x="5" y="58" width="94" height="196" rx="10" fill="#f4eedf"/>
<circle cx="52" cy="78" r="12" fill="#e8590c"/><text x="52" y="83" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">1</text>
  <path d="M0 -12 C7 -12 8 -2 7 6 C6 11 2 13 0 14 C-2 13 -6 11 -7 6 C-8 -2 -7 -12 0 -12z" transform="translate(40 128) rotate(-20)" fill="#2b1a0e" stroke="#120a04" stroke-width="1"/>
  <path d="M0 -12 C7 -12 8 -2 7 6 C6 11 2 13 0 14 C-2 13 -6 11 -7 6 C-8 -2 -7 -12 0 -12z" transform="translate(52 122) rotate(10)" fill="#2b1a0e" stroke="#120a04" stroke-width="1"/>
  <path d="M0 -12 C7 -12 8 -2 7 6 C6 11 2 13 0 14 C-2 13 -6 11 -7 6 C-8 -2 -7 -12 0 -12z" transform="translate(64 129) rotate(25)" fill="#2b1a0e" stroke="#120a04" stroke-width="1"/>
  <path d="M0 -12 C7 -12 8 -2 7 6 C6 11 2 13 0 14 C-2 13 -6 11 -7 6 C-8 -2 -7 -12 0 -12z" transform="translate(47 138) rotate(80)" fill="#2b1a0e" stroke="#120a04" stroke-width="1"/>
  <path d="M0 -12 C7 -12 8 -2 7 6 C6 11 2 13 0 14 C-2 13 -6 11 -7 6 C-8 -2 -7 -12 0 -12z" transform="translate(60 140) rotate(-70)" fill="#2b1a0e" stroke="#120a04" stroke-width="1"/>
  <g fill="#fff" fill-opacity=".85"><ellipse cx="38" cy="120" rx="2" ry="4"/><ellipse cx="50" cy="114" rx="2" ry="4"/><ellipse cx="62" cy="121" rx="2" ry="4"/></g>
  <g fill="#2f3a2b"><circle cx="30" cy="100" r="2.6"/><circle cx="76" cy="104" r="2.6"/></g>
  <path d="M27 97 l-5 -4 M33 97 l5 -4 M73 101 l-5 -4 M79 101 l5 -4" stroke="#2f3a2b" stroke-width="1.4"/>
<text x="52" y="190" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hours</text>
<text x="52" y="214" font-size="14" fill="#2f3a2b" text-anchor="middle">wet, shiny</text>
<text x="52" y="234" font-size="14" fill="#2f3a2b" text-anchor="middle">flies</text>
</g>
<g data-tip="A day or two|Dull surface, a dry crust, still soft inside (60%)." data-tip-dot="186,68">
<rect x="103" y="58" width="94" height="196" rx="10" fill="#f4eedf"/>
<circle cx="150" cy="78" r="12" fill="#e8590c"/><text x="150" y="83" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text>
  <path d="M0 -12 C7 -12 8 -2 7 6 C6 11 2 13 0 14 C-2 13 -6 11 -7 6 C-8 -2 -7 -12 0 -12z" transform="translate(138 128) rotate(-20)" fill="#4d3420" stroke="#33210f" stroke-width="1"/>
  <path d="M0 -12 C7 -12 8 -2 7 6 C6 11 2 13 0 14 C-2 13 -6 11 -7 6 C-8 -2 -7 -12 0 -12z" transform="translate(150 122) rotate(10)" fill="#4d3420" stroke="#33210f" stroke-width="1"/>
  <path d="M0 -12 C7 -12 8 -2 7 6 C6 11 2 13 0 14 C-2 13 -6 11 -7 6 C-8 -2 -7 -12 0 -12z" transform="translate(162 129) rotate(25)" fill="#4d3420" stroke="#33210f" stroke-width="1"/>
  <path d="M0 -12 C7 -12 8 -2 7 6 C6 11 2 13 0 14 C-2 13 -6 11 -7 6 C-8 -2 -7 -12 0 -12z" transform="translate(145 138) rotate(80)" fill="#4d3420" stroke="#33210f" stroke-width="1"/>
  <path d="M0 -12 C7 -12 8 -2 7 6 C6 11 2 13 0 14 C-2 13 -6 11 -7 6 C-8 -2 -7 -12 0 -12z" transform="translate(158 140) rotate(-70)" fill="#4d3420" stroke="#33210f" stroke-width="1"/>
  <path d="M133 118 h6 M148 112 h6 M159 120 h6" stroke="#7a5c40" stroke-width="1.6"/>
<text x="150" y="190" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1 to 2 days</text>
<text x="150" y="214" font-size="14" fill="#2f3a2b" text-anchor="middle">dull crust</text>
<text x="150" y="234" font-size="14" fill="#2f3a2b" text-anchor="middle">soft inside</text>
</g>
<g data-tip="Days to a week|Dry, lighter colour, cracks (65%)." data-tip-dot="286,68">
<rect x="203" y="58" width="94" height="196" rx="10" fill="#f4eedf"/>
<circle cx="250" cy="78" r="12" fill="#e8590c"/><text x="250" y="83" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">3</text>
  <path d="M0 -12 C7 -12 8 -2 7 6 C6 11 2 13 0 14 C-2 13 -6 11 -7 6 C-8 -2 -7 -12 0 -12z" transform="translate(238 128) rotate(-20)" fill="#8a6a48" stroke="#6b4f35" stroke-width="1"/>
  <path d="M0 -12 C7 -12 8 -2 7 6 C6 11 2 13 0 14 C-2 13 -6 11 -7 6 C-8 -2 -7 -12 0 -12z" transform="translate(250 122) rotate(10)" fill="#8a6a48" stroke="#6b4f35" stroke-width="1"/>
  <path d="M0 -12 C7 -12 8 -2 7 6 C6 11 2 13 0 14 C-2 13 -6 11 -7 6 C-8 -2 -7 -12 0 -12z" transform="translate(262 129) rotate(25)" fill="#8a6a48" stroke="#6b4f35" stroke-width="1"/>
  <path d="M0 -12 C7 -12 8 -2 7 6 C6 11 2 13 0 14 C-2 13 -6 11 -7 6 C-8 -2 -7 -12 0 -12z" transform="translate(245 138) rotate(80)" fill="#8a6a48" stroke="#6b4f35" stroke-width="1"/>
  <path d="M0 -12 C7 -12 8 -2 7 6 C6 11 2 13 0 14 C-2 13 -6 11 -7 6 C-8 -2 -7 -12 0 -12z" transform="translate(258 140) rotate(-70)" fill="#8a6a48" stroke="#6b4f35" stroke-width="1"/>
  <path d="M236 118 l4 6 l-3 5 M251 110 l3 6 M262 121 l-3 6 M246 134 l5 3" stroke="#fffaf0" stroke-width="1.6" fill="none"/>
<text x="250" y="190" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A week</text>
<text x="250" y="214" font-size="14" fill="#2f3a2b" text-anchor="middle">dry, lighter</text>
<text x="250" y="234" font-size="14" fill="#2f3a2b" text-anchor="middle">cracks</text>
</g>
<g data-tip="Weeks old|Faded, crumbling, moss or mould, insect holes (60%)." data-tip-dot="384,68">
<rect x="301" y="58" width="94" height="196" rx="10" fill="#f4eedf"/>
<circle cx="348" cy="78" r="12" fill="#e8590c"/><text x="348" y="83" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">4</text>
  <path d="M0 -12 C7 -12 8 -2 7 6 C6 11 2 13 0 14 C-2 13 -6 11 -7 6 C-8 -2 -7 -12 0 -12z" transform="translate(336 128) rotate(-20)" fill="#b9a68a" stroke="#968466" stroke-width="1"/>
  <path d="M0 -12 C7 -12 8 -2 7 6 C6 11 2 13 0 14 C-2 13 -6 11 -7 6 C-8 -2 -7 -12 0 -12z" transform="translate(348 122) rotate(10)" fill="#b9a68a" stroke="#968466" stroke-width="1"/>
  <path d="M0 -12 C7 -12 8 -2 7 6 C6 11 2 13 0 14 C-2 13 -6 11 -7 6 C-8 -2 -7 -12 0 -12z" transform="translate(360 129) rotate(25)" fill="#b9a68a" stroke="#968466" stroke-width="1"/>
  <path d="M0 -12 C7 -12 8 -2 7 6 C6 11 2 13 0 14 C-2 13 -6 11 -7 6 C-8 -2 -7 -12 0 -12z" transform="translate(343 138) rotate(80)" fill="#b9a68a" stroke="#968466" stroke-width="1"/>
  <path d="M0 -12 C7 -12 8 -2 7 6 C6 11 2 13 0 14 C-2 13 -6 11 -7 6 C-8 -2 -7 -12 0 -12z" transform="translate(356 140) rotate(-70)" fill="#b9a68a" stroke="#968466" stroke-width="1"/>
  <g fill="#8a9a6b"><circle cx="336" cy="118" r="5"/><circle cx="360" cy="124" r="6"/><circle cx="345" cy="138" r="4"/><circle cx="351" cy="112" r="3"/></g>
<text x="348" y="190" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Weeks</text>
<text x="348" y="214" font-size="14" fill="#2f3a2b" text-anchor="middle">faded</text>
<text x="348" y="234" font-size="14" fill="#2f3a2b" text-anchor="middle">moss, mould</text>
</g>
<path d="M8 166 H382" stroke="#2f3a2b" stroke-width="3"/><path d="M380 159 l12 7 l-12 7z" fill="#2f3a2b"/>
<g fill="#e8590c" stroke="#fffaf0" stroke-width="2"><circle cx="52" cy="166" r="7"/><circle cx="150" cy="166" r="7"/><circle cx="250" cy="166" r="7"/><circle cx="348" cy="166" r="7"/></g>
<g data-tip="Pellet size|Deer pellets are oval, about 1 to 1.5 cm long, often with a small point (70%)." data-tip-dot="122,268">
<rect x="8" y="262" width="122" height="28" rx="6" fill="#fffaf0" stroke="#d8ccb4"/>
<path d="M18 282 v-8 M18 278 h20 M38 282 v-8" stroke="#2f3a2b" stroke-width="2"/>
<text x="46" y="282" font-size="14" font-weight="bold" fill="#2f3a2b">= 1 cm</text></g>
<g data-tip="Cold slows it|Cold slows all of this. Frozen pellets in November can look fresh for a week. Tip." data-tip-dot="384,270">
<rect x="138" y="262" width="254" height="64" rx="8" fill="#e3edf5"/>
<text x="265" y="286" font-size="15" font-weight="bold" fill="#2f5f8a" text-anchor="middle">Cold slows it all:</text>
<text x="265" y="308" font-size="14" fill="#2f5f8a" text-anchor="middle">frozen pellets look fresh a week</text></g>
</svg>
