<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Patterning step 5: count the pellets inside the circle and divide by the number of pellets in the shell. Example: 92 inside, 141 in the shell, about 65 percent.">
<rect width="400" height="300" fill="#EEF1EA"/>
<circle cx="24" cy="22" r="15" fill="#1F3D2B"/><text x="24" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="46" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Count and divide</text>
<text x="200.0" y="80.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Pellets in the circle</text>
<text x="200.0" y="108.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">÷ pellets in the shell</text>
<line x1="70" y1="120" x2="330" y2="120" stroke="#1F3D2B" stroke-width="2"/>
<text x="200.0" y="148.0" font-size="20" font-weight="bold" fill="#FF6A13" text-anchor="middle">= pattern %</text>
<rect x="40" y="170" width="320" height="76" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.6"/>
<text x="200.0" y="198.0" font-size="16" font-weight="bold" fill="#17201A" text-anchor="middle">Example: 92 in circle</text>
<text x="200.0" y="224.0" font-size="18" font-weight="bold" fill="#17201A" text-anchor="middle">92 ÷ 141 = 65%</text>
<text x="200.0" y="290.0" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Steel No. 2, 1 1/8 oz: about 141 pellets.</text>
</svg>
