<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Headspace: a round in the chamber with the bolt face behind it. The orange bracket marks headspace, the space from the bolt face to the point in the chamber that stops the case. A gunsmith checks it with gauges. Too much can split or rupture cases.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Headspace: a gunsmith check</text>
<rect x="40.0" y="110.0" width="200.0" height="60.0" rx="0" fill="#59625C" stroke="#17201A" stroke-width="2"/><polygon points="60.0,124.0 190.0,124.0 215.0,132.0 215.0,148.0 190.0,156.0 60.0,156.0" fill="#2A2F2B" stroke="#17201A" stroke-width="1.5" stroke-linejoin="round"/><rect x="62.0" y="125.0" width="102.0" height="30.0" rx="1.5" fill="#C9A227" stroke="#17201A" stroke-width="1.2"/><line x1="65.0" y1="125.0" x2="65.0" y2="155.0" stroke="#17201A" stroke-width="1" stroke-linecap="round"/><path d="M164.0 127.4 Q204.5 131.0 212.0 140.0 Q204.5 149.0 164.0 152.6 Z" fill="#B87333" stroke="#17201A" stroke-width="1.2"/><path d="M197.0 134.6 Q210.5 140.0 197.0 145.4" fill="#9AA0A6" stroke="#17201A" stroke-width="1"/><rect x="20.0" y="110.0" width="20.0" height="60.0" rx="0" fill="#D9DCD7" stroke="#17201A" stroke-width="1.5"/><text x="18.0" y="100.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Bolt face</text><line x1="40.0" y1="186.0" x2="190.0" y2="186.0" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><line x1="40.0" y1="178.0" x2="40.0" y2="194.0" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><line x1="190.0" y1="178.0" x2="190.0" y2="194.0" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><text x="115.0" y="210.0" font-size="15" font-weight="bold" fill="#FF6A13" text-anchor="middle">Headspace</text><text x="260.0" y="120.0" font-size="14" fill="#17201A" text-anchor="start">Bolt face to</text><text x="260.0" y="140.0" font-size="14" fill="#17201A" text-anchor="start">the point that</text><text x="260.0" y="160.0" font-size="14" fill="#17201A" text-anchor="start">stops the case.</text><text x="200.0" y="244.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Checked with gauges by a gunsmith.</text><text x="200.0" y="266.0" font-size="14" fill="#17201A" text-anchor="middle">Too much: cases can split or rupture.</text>
</svg>
