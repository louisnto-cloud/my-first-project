<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Warm day step 5: get the meat into a cooler or cold room the same day, below 4 degrees.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">5. Cooler or cold room, same day</text><rect x="0" y="40" width="400" height="260" fill="#fffaf0"/><rect x="120" y="110" width="160" height="100" rx="10" fill="#4a7fb0" stroke="#23261f" stroke-width="2"/><rect x="120" y="100" width="160" height="22" rx="6" fill="#7aa2c8" stroke="#23261f" stroke-width="2"/><text x="200" y="170" font-size="18" fill="#fffaf0" text-anchor="middle" font-weight="bold">below 4°C</text><text x="200" y="250" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">same day (80%)</text>
</svg>
