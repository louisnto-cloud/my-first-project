<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Decision flow before shooting an elk in Region 8. Open season, right MU and licence? A bull: count one antler. 6 tines or more on that antler, brow tine counted? Broadside, in range and standing still? Safe backstop with nothing behind? Any no means pass. All yes: shoot.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Shoot or not? (6 point bull, Region 8)</text><rect x="20" y="42" width="270" height="34" rx="8" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/><text x="155" y="64" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Open season, right MU, licence?</text><text x="300" y="64" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">No:</text><text x="330" y="64" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">pass</text><line x1="155" y1="76" x2="155" y2="86" stroke="#2f3a2b" stroke-width="2"/><path d="M155.0 86.0 L150.7 77.0 L159.3 77.0 Z" fill="#2f3a2b"/><rect x="20" y="86" width="270" height="34" rx="8" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/><text x="155" y="108" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">A bull? Count ONE antler</text><text x="300" y="108" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">No:</text><text x="330" y="108" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">pass</text><line x1="155" y1="120" x2="155" y2="130" stroke="#2f3a2b" stroke-width="2"/><path d="M155.0 130.0 L150.7 121.0 L159.3 121.0 Z" fill="#2f3a2b"/><rect x="20" y="130" width="270" height="34" rx="8" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/><text x="155" y="152" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">6 tines or more? Brow counts</text><text x="300" y="152" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">No:</text><text x="330" y="152" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">pass</text><line x1="155" y1="164" x2="155" y2="174" stroke="#2f3a2b" stroke-width="2"/><path d="M155.0 174.0 L150.7 165.0 L159.3 165.0 Z" fill="#2f3a2b"/><rect x="20" y="174" width="270" height="34" rx="8" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/><text x="155" y="196" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Broadside, in range, still?</text><text x="300" y="196" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">No:</text><text x="330" y="196" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">pass</text><line x1="155" y1="208" x2="155" y2="218" stroke="#2f3a2b" stroke-width="2"/><path d="M155.0 218.0 L150.7 209.0 L159.3 209.0 Z" fill="#2f3a2b"/><rect x="20" y="218" width="270" height="34" rx="8" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/><text x="155" y="240" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Safe backstop, nothing behind?</text><text x="300" y="240" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">No:</text><text x="330" y="240" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">pass</text><rect x="90" y="262" width="130" height="30" rx="8" fill="#2f3a2b"/><text x="155" y="282" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">All yes: shoot</text>
</svg>
