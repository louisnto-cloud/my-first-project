<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Foot step 1: before you step, look down and pick a clear spot for the next foot. Avoid the dry stick."><rect width="400" height="300" fill="#fffaf0"/><rect x="0" y="230" width="400" height="70" fill="#c9b79c"/><g fill="#8a9a6b"><ellipse cx="60" cy="232" rx="20" ry="5"/><ellipse cx="330" cy="232" rx="24" ry="5"/></g><g transform="translate(120 180) rotate(-10)"><path d="M0 0 L0 -70 L34 -70 L40 -30 L90 -22 C 104 -18, 104 0, 92 0 Z" fill="#6b4f35"/><rect x="-2" y="-4" width="96" height="8" rx="3" fill="#2f3a2b"/></g><g stroke="#6b4f35" stroke-width="5"><line x1="290" y1="226" x2="340" y2="220"/></g><path d="M300 200 L330 240 M330 200 L300 240" stroke="#c0392b" stroke-width="4"/><ellipse cx="230" cy="230" rx="30" ry="6" fill="#2f6e3b" opacity=".6"/><text x="230" y="214" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">clear spot</text><text x="316" y="190" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">dry stick</text><text x="200" y="30" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1. Pick the spot first</text><text x="200" y="272" font-size="15" fill="#2f3a2b" text-anchor="middle">Eyes down for a moment, then step</text></svg>
