t x="150" y="132" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Cutblock berries</text><text x="318" y="150" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Timber: beds</text><text x="290" y="46" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Avalanche chute</text><text x="250" y="282" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Spring low, summer up, fall berries, fish</text>
