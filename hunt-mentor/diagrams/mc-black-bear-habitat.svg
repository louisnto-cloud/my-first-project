<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Cross section of black bear country from creek to ridge. Creek bottom: fish where they run, shrubs and berries. Grassy south facing slope: first green food in spring. Cutblock: berries in summer and fall. Timber: beds and cover next to the food. Avalanche chute higher up: spring and summer greens. From the BC account: spring meadows, riparian, skunk cabbage, avalanche chutes, grassy south slopes, burns.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
