<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="The two lines cross at a near right angle. A red circle marks you are here.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c" stroke="none" stroke-width="2"/><text x="26" y="32" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="52" y="32" font-family="sans-serif" font-size="18" fill="#2f3a2b" text-anchor="start" font-weight="bold">Where they cross: you</text><rect x="30" y="60" width="340" height="200" rx="0" fill="#dfe6d3" stroke="#8b5a2b" stroke-width="2"/><polygon points="70,110 90,80 110,110" fill="#8a9a6b"/><text x="55" y="128" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Peak</text><polygon points="300,100 320,72 340,100" fill="#8a9a6b"/><text x="320" y="118" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Knob</text><line x1="90" y1="110" x2="250" y2="270" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><line x1="320" y1="100" x2="150" y2="260" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><circle cx="198" cy="218" r="14" fill="none" stroke="#c92a2a" stroke-width="3"/><text x="230" y="214" font-family="sans-serif" font-size="15" fill="#c92a2a" text-anchor="start" font-weight="bold">You are here</text><text x="40" y="285" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">Best when the lines cross near 90°</text>
</svg>
