<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 346" font-family="sans-serif" role="img" aria-label="The rear sight drum turns to six range steps covering 100 to 600 metres. The 100 metre step is marked in orange: zero on it and hunt on it. Test any other step on paper first. The screw in the centre of the drum must never be opened. The markings on your drum may differ.">
<rect x="0" y="0" width="400" height="346" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Six range steps on the drum</text><circle cx="200" cy="150" r="96" fill="#C9D0C6" stroke="#1F3D2B" stroke-width="2"/><g data-tip="Step 1|100 m step. Check where it hits with your load before you trust it."><circle cx="200.0" cy="84.0" r="14" fill="#FFFFFF" stroke="#FF6A13" stroke-width="4"/><text x="200.0" y="89.0" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">1</text></g><g data-tip="Step 2|200 m step. Check where it hits with your load before you trust it."><circle cx="257.2" cy="117.0" r="11" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="257.15767664977295" y="122.0" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">2</text></g><g data-tip="Step 3|300 m step. Check where it hits with your load before you trust it."><circle cx="257.2" cy="183.0" r="11" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="257.15767664977295" y="188.0" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">3</text></g><g data-tip="Step 4|400 m step. Check where it hits with your load before you trust it."><circle cx="200.0" cy="216.0" r="11" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="200.0" y="221.0" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">4</text></g><g data-tip="Step 5|500 m step. Check where it hits with your load before you trust it."><circle cx="142.8" cy="183.0" r="11" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="142.84232335022705" y="188.00000000000003" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">5</text></g><g data-tip="Step 6|600 m step. Check where it hits with your load before you trust it."><circle cx="142.8" cy="117.0" r="11" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="142.84232335022705" y="122.0" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">6</text></g><circle cx="200" cy="150" r="10" fill="#FF6A13"/><text x="340" y="66" font-size="14" fill="#17201A" text-anchor="middle">Centre screw:</text><text x="340" y="84" font-size="14" fill="#FF6A13" text-anchor="middle" font-weight="bold">never open</text><line x1="318" y1="92" x2="208" y2="144" stroke="#FF6A13" stroke-width="1.6"/><circle cx="208" cy="144" r="2.6" fill="#FF6A13"/><rect x="12" y="262" width="376" height="72" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="24" y="284" font-size="14" fill="#17201A" text-anchor="start">Steps cover 100 to 600 m.</text><text x="24" y="304" font-size="14" fill="#17201A" text-anchor="start">Zero on the 100 m step. Hunt on it.</text><text x="24" y="324" font-size="14" fill="#17201A" text-anchor="start">Test any other step on paper first.</text>
</svg>
