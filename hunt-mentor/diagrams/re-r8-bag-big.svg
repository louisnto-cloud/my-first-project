<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 422" role="img" aria-label="Grid: Region 8 bag limits: big game and furbearers. Moose: 1. Elk: 1. Black bear: 2. Wolf: 3. Coyote: NBL. Bobcat: 1. Lynx: 1. Cougar: 1. Skunk, raccoon: NBL. Snowshoe hare (daily): 10." font-family="sans-serif">
<rect x="0" y="0" width="400" height="422" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Region 8 bag limits: big game and</text>
<text x="200" y="47" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">furbearers</text>
<text x="200" y="68" font-size="14" fill="#8b5a2b" text-anchor="middle">Page 68. NBL means No Bag Limit.</text>
<rect x="6.0" y="90" width="124.0" height="70" rx="9" fill="#ffffff" stroke="#8b5a2b" stroke-width="2.5"/>
<text x="68.0" y="124" font-size="26" font-weight="bold" fill="#8b5a2b" text-anchor="middle">1</text>
<text x="68.0" y="148" font-size="14" fill="#23261f" text-anchor="middle">Moose</text>
