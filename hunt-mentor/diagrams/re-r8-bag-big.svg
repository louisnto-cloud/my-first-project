<text x="200.0" y="226" font-size="14" fill="#23261f" text-anchor="middle">Coyote</text>
<rect x="270.0" y="168" width="124.0" height="70" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<text x="332.0" y="202" font-size="26" font-weight="bold" fill="#e8590c" text-anchor="middle">1</text>
<text x="332.0" y="226" font-size="14" fill="#23261f" text-anchor="middle">Bobcat</text>
<rect x="6.0" y="246" width="124.0" height="70" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<text x="68.0" y="280" font-size="26" font-weight="bold" fill="#e8590c" text-anchor="middle">1</text>
<text x="68.0" y="304" font-size="14" fill="#23261f" text-anchor="middle">Lynx</text>
<rect x="138.0" y="246" width="124.0" height="70" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<text x="200.0" y="280" font-size="26" font-weight="bold" fill="#e8590c" text-anchor="middle">1</text>
<text x="200.0" y="304" font-size="14" fill="#23261f" text-anchor="middle">Cougar</text>
