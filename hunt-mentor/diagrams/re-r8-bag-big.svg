<text x="332.0" y="124" font-size="26" font-weight="bold" fill="#8b5a2b" text-anchor="middle">2</text>
<text x="332.0" y="148" font-size="14" fill="#23261f" text-anchor="middle">Black bear</text>
<rect x="6.0" y="168" width="124.0" height="70" rx="9" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
