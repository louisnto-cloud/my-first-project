<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two deer side by side. Summer coat: thin and tawny red. Winter coat: thick and grey brown. Hollow winter hairs trap more air. In winter the deer saves heat mostly by picking warm, low, sheltered slopes.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Two coats a year</text><g transform="translate(110 190) scale(1.100 1.100)"><rect x="-36" y="-40" width="6" height="40" rx="3" fill="#b5651d"/><rect x="10" y="-40" width="6" height="40" rx="3" fill="#b5651d"/><ellipse cx="-12" cy="-52" rx="34" ry="16" fill="#b5651d"/><rect x="-30" y="-44" width="6" height="44" rx="3" fill="#b5651d"/><rect x="16" y="-44" width="6" height="44" rx="3" fill="#b5651d"/><path d="M12 -60 L26 -84 L36 -80 L26 -52 Z" fill="#b5651d"/><ellipse cx="38" cy="-84" rx="13" ry="7" fill="#b5651d"/><path d="M28 -88 L18 -102 L32 -92 Z" fill="#b5651d"/><path d="M31 -89 L27 -104 L38 -92 Z" fill="#b5651d"/><circle cx="49" cy="-84" r="2" fill="#23261f"/><ellipse cx="-44" cy="-54" rx="5" ry="9" fill="#f4efe2"/><path d="M-46 -54 L-50 -40" stroke="#23261f" stroke-width="3" stroke-linecap="round"/></g><g transform="translate(300 190) scale(1.100 1.100)"><rect x="-36" y="-40" width="6" height="40" rx="3" fill="#7d7468"/><rect x="10" y="-40" width="6" height="40" rx="3" fill="#7d7468"/><ellipse cx="-12" cy="-52" rx="34" ry="16" fill="#7d7468"/><rect x="-30" y="-44" width="6" height="44" rx="3" fill="#7d7468"/><rect x="16" y="-44" width="6" height="44" rx="3" fill="#7d7468"/><path d="M12 -60 L26 -84 L36 -80 L26 -52 Z" fill="#7d7468"/><ellipse cx="38" cy="-84" rx="13" ry="7" fill="#7d7468"/><path d="M28 -88 L18 -102 L32 -92 Z" fill="#7d7468"/><path d="M31 -89 L27 -104 L38 -92 Z" fill="#7d7468"/><circle cx="49" cy="-84" r="2" fill="#23261f"/><ellipse cx="-44" cy="-54" rx="5" ry="9" fill="#f4efe2"/><path d="M-46 -54 L-50 -40" stroke="#23261f" stroke-width="3" stroke-linecap="round"/></g><text x="100" y="222" font-size="16" fill="#b5651d" text-anchor="middle" font-weight="bold">Summer</text><text x="100" y="240" font-size="14" fill="#23261f" text-anchor="middle">thin, tawny red</text><text x="290" y="222" font-size="16" fill="#7d7468" text-anchor="middle" font-weight="bold">Winter</text><text x="290" y="240" font-size="14" fill="#23261f" text-anchor="middle">thick, grey brown</text><rect x="14" y="254" width="372" height="42" rx="8" fill="#dfe6d3"/><text x="200" y="272" font-size="14" fill="#23261f" text-anchor="middle">Hollow winter hairs trap more air (60%)</text><text x="200" y="290" font-size="14" fill="#23261f" text-anchor="middle">In winter it saves heat by picking warm slopes (85%)</text>
</svg>
