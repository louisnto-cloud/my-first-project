<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Mount step 4: bring the stock up to your cheek first, then back into the shoulder pocket. Head stays still: the gun comes to your face.">
<rect width="400" height="300" fill="#EEF1EA"/>
<circle cx="24" cy="22" r="15" fill="#1F3D2B"/><text x="24" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="46" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Stock to face, then shoulder</text>
<circle cx="110" cy="70" r="16" fill="#6b5a45" stroke="#17201A" stroke-width="1.2"/><rect x="92" y="56" width="34" height="9" rx="3" fill="#FF6A13"/><path d="M96 86 L124 86 L128 160 L92 160 Z" fill="#1F3D2B"/><path d="M96 160 L80 220 M122 160 L142 220" stroke="#1F3D2B" stroke-width="12" stroke-linecap="round"/><line x1="98" y1="80" x2="247" y2="64" stroke="#3b4045" stroke-width="7" stroke-linecap="round"/><line x1="211.2" y1="144.0" x2="100.0" y2="66.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="100.0" cy="66.0" r="3" fill="#1F3D2B"/><rect x="211.2" y="143.0" width="97.5" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="260.0" y="160.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">cheek first</text><line x1="187.6" y1="184.0" x2="100.0" y2="92.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="100.0" cy="92.0" r="3" fill="#1F3D2B"/><rect x="187.6" y="183.0" width="144.7" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="260.0" y="200.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">then the shoulder</text><path d="M326 70 L335.3 79.8 L354 58.8" fill="none" stroke="#1F3D2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="200.0" y="290.0" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Gun to the face, never face to the gun.</text>
</svg>
