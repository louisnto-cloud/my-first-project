<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Does and fawns bed in groups of small beds near open edges. A mature buck often beds alone in a bigger bed on an edge with an escape route behind. This is hunter lore: a big bed can be a big doe.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Doe beds or buck bed?</text>
<rect x="16" y="62" width="176" height="200" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><rect x="208" y="62" width="176" height="200" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="104" y="88" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Does and fawns</text><text x="296" y="88" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Mature buck</text><ellipse cx="70" cy="130" rx="20" ry="8" fill="#e0d4b0" stroke="#6b4f35" stroke-width="1.5" stroke-dasharray="4 3"/><ellipse cx="120" cy="125" rx="20" ry="8" fill="#e0d4b0" stroke="#6b4f35" stroke-width="1.5" stroke-dasharray="4 3"/><ellipse cx="95" cy="165" rx="20" ry="8" fill="#e0d4b0" stroke="#6b4f35" stroke-width="1.5" stroke-dasharray="4 3"/><ellipse cx="140" cy="170" rx="20" ry="8" fill="#e0d4b0" stroke="#6b4f35" stroke-width="1.5" stroke-dasharray="4 3"/><ellipse cx="60" cy="185" rx="20" ry="8" fill="#e0d4b0" stroke="#6b4f35" stroke-width="1.5" stroke-dasharray="4 3"/><ellipse cx="296" cy="150" rx="30" ry="12" fill="#e0d4b0" stroke="#6b4f35" stroke-width="2" stroke-dasharray="5 3"/><g transform="translate(340 150) scale(0.5)"><rect x="-3" y="-10" width="6" height="12" fill="#6b4f35"/><path d="M0 -50 L16 -10 L-16 -10 Z" fill="#8a9a6b"/></g><g transform="translate(255 140) scale(0.4)"><rect x="-3" y="-10" width="6" height="12" fill="#6b4f35"/><path d="M0 -50 L16 -10 L-16 -10 Z" fill="#8a9a6b"/></g><text x="104" y="222" font-size="14" fill="#23261f" text-anchor="middle">groups, small beds</text><text x="104" y="242" font-size="14" fill="#23261f" text-anchor="middle">open edges (Tip)</text><text x="296" y="222" font-size="14" fill="#23261f" text-anchor="middle">alone, bigger bed</text><text x="296" y="242" font-size="14" fill="#23261f" text-anchor="middle">edge, escape behind (Tip)</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Lore, not law: big beds can be big does</text>
</svg>
