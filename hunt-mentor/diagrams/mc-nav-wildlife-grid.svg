<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Table of wildlife encounters. Black bear: never run; use bear spray at about 5 to 10 metres. Cougar: never run or turn your back; look big and fight back if attacked. Moose: do not stand your ground; run and put a tree between you. Sources WildSafeBC 75 percent, Alaska Department of Fish and Game 85 percent.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Bear, cougar, moose</text><rect x="20" y="42.0" width="360" height="55.0" rx="4" fill="#2f3a2b"/><text x="28" y="75.0" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold"></text><text x="128" y="75.0" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">Never</text><text x="223" y="75.0" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">Do</text><rect x="20" y="100.0" width="360" height="55.0" rx="4" fill="#dfe6d3"/><text x="28" y="133.0" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Black bear</text><text x="128" y="133.0" font-size="15" fill="#23261f" text-anchor="start">run</text><text x="223" y="133.0" font-size="15" fill="#23261f" text-anchor="start">spray at 5 to 10 m</text><rect x="20" y="158.0" width="360" height="55.0" rx="4" fill="#eef2e6"/><text x="28" y="191.0" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Cougar</text><text x="128" y="191.0" font-size="15" fill="#23261f" text-anchor="start">run, turn</text><text x="223" y="191.0" font-size="15" fill="#23261f" text-anchor="start">look big, fight back</text><rect x="20" y="216.0" width="360" height="55.0" rx="4" fill="#dfe6d3"/><text x="28" y="249.0" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Moose</text><text x="128" y="249.0" font-size="15" fill="#23261f" text-anchor="start">stand there</text><text x="223" y="249.0" font-size="15" fill="#23261f" text-anchor="start">run, get a tree</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">WildSafeBC (75%), Alaska F and G (85%)</text>
</svg>
