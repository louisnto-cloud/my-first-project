<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Hide step 2 of 4: paws. Cut around the pads, skin the toes out to the last joint and leave the claws attached to the hide.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Hide 2 of 4: paws</text><ellipse cx="200" cy="160" rx="70" ry="44" fill="#1d1d1b"/><ellipse cx="170" cy="112" rx="8" ry="10" fill="#1d1d1b"/><line x1="170" y1="102" x2="168" y2="84" stroke="#d8d0c0" stroke-width="4"/><ellipse cx="185" cy="112" rx="8" ry="10" fill="#1d1d1b"/><line x1="185" y1="102" x2="183" y2="84" stroke="#d8d0c0" stroke-width="4"/><ellipse cx="200" cy="112" rx="8" ry="10" fill="#1d1d1b"/><line x1="200" y1="102" x2="198" y2="84" stroke="#d8d0c0" stroke-width="4"/><ellipse cx="215" cy="112" rx="8" ry="10" fill="#1d1d1b"/><line x1="215" y1="102" x2="213" y2="84" stroke="#d8d0c0" stroke-width="4"/><ellipse cx="230" cy="112" rx="8" ry="10" fill="#1d1d1b"/><line x1="230" y1="102" x2="228" y2="84" stroke="#d8d0c0" stroke-width="4"/><line x1="130" y1="210" x2="270" y2="210" stroke="#e8590c" stroke-width="3" stroke-dasharray="6 4"/><text x="200" y="232" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Claws stay on the hide</text><rect x="8" y="256" width="384" height="36" rx="8" fill="#2f3a2b"/><text x="200" y="280" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Skin to the last toe joint.</text>
</svg>
