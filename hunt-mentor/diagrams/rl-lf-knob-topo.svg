<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Topo sketch of a knob: a small set of closed contour rings sitting on gentle ground, with a cross on the top.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Knob</text><text x="388" y="24" font-size="14" fill="#2f3a2b" text-anchor="end">Topo map</text><rect x="0" y="36" width="400" height="232" fill="#dfe6d3" opacity=".6"/>
  <g fill="none" stroke="#8b5a2b" stroke-width="2.3">
    <path d="M0 230 C 120 222, 280 222, 400 230"/>
    <path d="M0 80 C 120 74, 280 74, 400 80"/>
    <ellipse cx="200" cy="150" rx="70" ry="44"/><ellipse cx="200" cy="150" rx="40" ry="24"/><ellipse cx="200" cy="150" rx="14" ry="8"/>
  </g>
  <text x="200" y="155" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="middle">+</text><text x="290" y="120" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">knob</text>
  <text x="20" y="70" font-size="14" fill="#2f3a2b" text-anchor="start">gentle slope</text>
  <text x="200" y="292" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A small set of closed rings</text>
</svg>
