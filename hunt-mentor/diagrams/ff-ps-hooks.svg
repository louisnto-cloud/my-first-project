<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Memory hooks: bone, not muscle: stack the elbows. Body moves, not the rifle, for natural point of aim. Soft, not hard: pad between rifle and rest. Say it, do it: sitting, sticks. Low and slow: the lowest steady position.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Memory hooks</text><rect x="20" y="50" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="75" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Bone, not muscle</text><text x="190" y="75" font-size="14" fill="#23261f" text-anchor="start">stack the elbows</text><rect x="20" y="96" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="121" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Body moves</text><text x="190" y="121" font-size="14" fill="#23261f" text-anchor="start">not the rifle, for NPOA</text><rect x="20" y="142" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="167" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Soft, not hard</text><text x="190" y="167" font-size="14" fill="#23261f" text-anchor="start">pad between rifle and rest</text><rect x="20" y="188" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="213" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Say it, do it</text><text x="190" y="213" font-size="14" fill="#23261f" text-anchor="start">&quot;Sitting, sticks&quot;</text><rect x="20" y="234" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="259" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Low and slow</text><text x="190" y="259" font-size="14" fill="#23261f" text-anchor="start">lowest steady position</text>
</svg>
