<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 312" font-family="sans-serif" role="img" aria-label="Six kinds of mule deer sign. Track: heart shape, 2 toes, about 5.7 to 10 centimetres. Pellets: oval, 1 to 1.5 centimetres, shiny when fresh. Stot group: 4 prints together with gaps of 2.4 to 4.6 metres. Torn twig: deer leave a ragged end, hares cut clean at 45 degrees. Rub: on small conifers and shrubs. Bed: a flattened oval about 1 metre long.">
<rect x="0" y="0" width="400" height="312" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Mule deer sign: 6 things to find</text><rect x="8" y="40" width="124" height="128" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="60" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">Track</text><path d="M58 114 Q54 88 66 76 Q68 96 68 114 Z M82 114 Q86 88 74 76 Q72 96 72 114 Z" fill="#2f3a2b"/><text x="16" y="140" font-size="14" fill="#23261f" text-anchor="start">Heart, 2 toes,</text><text x="16" y="158" font-size="14" fill="#23261f" text-anchor="start">5.7 to 10 cm</text><rect x="138" y="40" width="124" height="128" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="146" y="60" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">Pellets</text><ellipse cx="184" cy="90" rx="4" ry="6" fill="#3b2a1c"/><ellipse cx="194" cy="90" rx="4" ry="6" fill="#3b2a1c"/><ellipse cx="204" cy="90" rx="4" ry="6" fill="#3b2a1c"/><ellipse cx="214" cy="90" rx="4" ry="6" fill="#3b2a1c"/><ellipse cx="184" cy="102" rx="4" ry="6" fill="#3b2a1c"/><ellipse cx="194" cy="102" rx="4" ry="6" fill="#3b2a1c"/><ellipse cx="204" cy="102" rx="4" ry="6" fill="#3b2a1c"/><ellipse cx="214" cy="102" rx="4" ry="6" fill="#3b2a1c"/><text x="146" y="140" font-size="14" fill="#23261f" text-anchor="start">Oval, 1 to 1.5 cm</text><text x="146" y="158" font-size="14" fill="#23261f" text-anchor="start">shiny = fresh</text><rect x="268" y="40" width="124" height="128" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="276" y="60" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">Stot group</text><g><ellipse cx="286" cy="90" rx="3" ry="5" fill="#2f3a2b"/><ellipse cx="294" cy="90" rx="3" ry="5" fill="#2f3a2b"/><ellipse cx="286" cy="104" rx="3" ry="5" fill="#2f3a2b"/><ellipse cx="294" cy="104" rx="3" ry="5" fill="#2f3a2b"/></g><g><ellipse cx="360" cy="90" rx="3" ry="5" fill="#2f3a2b"/><ellipse cx="368" cy="90" rx="3" ry="5" fill="#2f3a2b"/><ellipse cx="360" cy="104" rx="3" ry="5" fill="#2f3a2b"/><ellipse cx="368" cy="104" rx="3" ry="5" fill="#2f3a2b"/></g><path d="M302 96 L352 96" stroke="#e8590c" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="4 3"/><path d="M346.6 98.6 L352.0 96.0 L346.6 93.4" stroke="#e8590c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="276" y="140" font-size="14" fill="#23261f" text-anchor="start">4 prints, gaps</text><text x="276" y="158" font-size="14" fill="#23261f" text-anchor="start">2.4 to 4.6 m</text><rect x="8" y="174" width="124" height="128" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="194" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">Torn twig</text><path d="M40 246 L64 220 l3 -6 l2 5 l3 -4 l1 6" stroke="#8b5a2b" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M80 246 L102 222" stroke="#8a9a6b" stroke-width="5" stroke-linecap="round"/><text x="16" y="274" font-size="14" fill="#23261f" text-anchor="start">Ragged end.</text><text x="16" y="292" font-size="14" fill="#23261f" text-anchor="start">Hare: clean cut</text><rect x="138" y="174" width="124" height="128" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="146" y="194" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">Rub</text><rect x="194" y="200" width="12" height="60" fill="#8b5a2b"/><rect x="194" y="226" width="12" height="22" fill="#f1e3c0"/><text x="146" y="274" font-size="14" fill="#23261f" text-anchor="start">Small conifers</text><text x="146" y="292" font-size="14" fill="#23261f" text-anchor="start">and shrubs</text><rect x="268" y="174" width="124" height="128" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="276" y="194" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">Bed</text><ellipse cx="330" cy="234" rx="40" ry="16" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><ellipse cx="350" cy="236" rx="2" ry="3" fill="#3b2a1c"/><ellipse cx="355" cy="236" rx="2" ry="3" fill="#3b2a1c"/><ellipse cx="360" cy="236" rx="2" ry="3" fill="#3b2a1c"/><text x="276" y="274" font-size="14" fill="#23261f" text-anchor="start">Flat oval</text><text x="276" y="292" font-size="14" fill="#23261f" text-anchor="start">about 1 m long</text>
</svg>
