<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A hunting bullet side on. The tip at the front starts expansion. The ogive is the curved nose. The shank is the straight part that touches the rifling. A boat tail is a tapered base. Most hunting bullets have a copper jacket outside and a lead core inside.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Parts of a hunting bullet</text><path d="M40 120 L230 120 Q 320 126 360 150 Q 320 174 230 180 L60 180 L40 168 Z" fill="#b87333" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 150 L372 150" fill="none" stroke="#b3261e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="230" y1="116" x2="230" y2="184" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><line x1="60" y1="116" x2="60" y2="184" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><line x1="368" y1="144" x2="352" y2="108" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="352" y="94" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Tip</text><text x="340" y="110" font-size="14" fill="#23261f" text-anchor="middle">starts expansion</text><line x1="290" y1="168" x2="290" y2="198" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="290" y="214" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Ogive</text><text x="290" y="230" font-size="14" fill="#23261f" text-anchor="middle">the curve</text><line x1="150" y1="120" x2="150" y2="98" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="150" y="84" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Shank</text><text x="150" y="100" font-size="14" fill="#23261f" text-anchor="middle">touches the rifling</text><line x1="50" y1="176" x2="50" y2="198" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="50" y="214" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Boat tail</text><text x="50" y="230" font-size="14" fill="#23261f" text-anchor="middle">tapered base</text><text x="200.0" y="280" font-size="14" fill="#2f3a2b" text-anchor="middle">Copper jacket outside, lead core inside (cup and core)</text>
</svg>
