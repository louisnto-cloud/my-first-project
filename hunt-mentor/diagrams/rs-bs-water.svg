<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" font-family="sans-serif" role="img" aria-label="Waterfowl sign. Feathers on the shore: birds loaf or preen here. Droppings on a bar or bank: a resting spot. Fresh green goose droppings: a field fed on today. Grazed shoots: geese, or deer, check. Webbed tracks in mud: ducks or geese walked. Scout the field they fed on late in the day.">
<rect x="0" y="0" width="400" height="310" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Duck and goose sign</text>
<rect x="10" y="62" width="380" height="38" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="78" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Feathers on the shore</text><text x="20" y="95" font-size="14" fill="#6b4f35" text-anchor="start">birds loaf or preen here</text><rect x="10" y="106" width="380" height="38" rx="6" fill="#f3f1e6" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="122" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Droppings on a bar or bank</text><text x="20" y="139" font-size="14" fill="#6b4f35" text-anchor="start">a resting spot</text><rect x="10" y="150" width="380" height="38" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="166" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Fresh green goose droppings</text><text x="20" y="183" font-size="14" fill="#6b4f35" text-anchor="start">a field fed on today</text><rect x="10" y="194" width="380" height="38" rx="6" fill="#f3f1e6" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="210" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Grazed shoots, field</text><text x="20" y="227" font-size="14" fill="#6b4f35" text-anchor="start">geese, or deer: check</text><rect x="10" y="238" width="380" height="38" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="254" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Webbed tracks in mud</text><text x="20" y="271" font-size="14" fill="#6b4f35" text-anchor="start">ducks or geese walked</text><text x="200" y="298" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Scout the field they fed on late in the day (Tip)</text>
</svg>
