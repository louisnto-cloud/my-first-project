<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Age an elk by the cheek teeth in the lower jaw: a calf has 4 cheek teeth and baby incisors; a yearling has 5 and is replacing the middle incisors; an elk 2.5 years or older has 6 cheek teeth and all adult incisors. Both bulls and cows have ivories, rounded upper canine teeth. Source Idaho Fish and Game and the BC elk account.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Age by teeth, and the ivories</text><text x="20" y="76" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Calf</text><rect x="110" y="58" width="23" height="26" rx="5" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/><rect x="137" y="58" width="23" height="26" rx="5" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/><rect x="164" y="58" width="23" height="26" rx="5" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/><rect x="191" y="58" width="23" height="26" rx="5" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/><rect x="218" y="58" width="23" height="26" rx="5" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="1.5"/><rect x="245" y="58" width="23" height="26" rx="5" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="1.5"/><text x="280" y="72" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">4 cheek</text><text x="280" y="90" font-size="14" fill="#6b4f35" text-anchor="start">baby incisors</text><text x="20" y="138" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Yearling</text><rect x="110" y="120" width="23" height="26" rx="5" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/><rect x="137" y="120" width="23" height="26" rx="5" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/><rect x="164" y="120" width="23" height="26" rx="5" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/><rect x="191" y="120" width="23" height="26" rx="5" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/><rect x="218" y="120" width="23" height="26" rx="5" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/><rect x="245" y="120" width="23" height="26" rx="5" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="1.5"/><text x="280" y="134" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">5 cheek</text><text x="280" y="152" font-size="14" fill="#6b4f35" text-anchor="start">incisors changing</text><text x="20" y="200" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">2.5 years +</text><rect x="110" y="182" width="23" height="26" rx="5" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/><rect x="137" y="182" width="23" height="26" rx="5" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/><rect x="164" y="182" width="23" height="26" rx="5" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/><rect x="191" y="182" width="23" height="26" rx="5" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/><rect x="218" y="182" width="23" height="26" rx="5" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/><rect x="245" y="182" width="23" height="26" rx="5" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/><text x="280" y="196" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">6 cheek</text><text x="280" y="214" font-size="14" fill="#6b4f35" text-anchor="start">all adult teeth</text><circle cx="60" cy="250" r="14" fill="#f4ecdc" stroke="#23261f" stroke-width="2"/><circle cx="95" cy="250" r="14" fill="#f4ecdc" stroke="#23261f" stroke-width="2"/><text x="120" y="246" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Ivories: rounded upper canines,</text><text x="120" y="264" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">in bulls and cows (90%)</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Cheek teeth: Idaho Fish and Game (85%)</text>
</svg>
