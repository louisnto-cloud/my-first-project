<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Close up of a pump action like the Remington 870: action bar lock in front of the trigger guard, cross bolt safety behind the trigger, ejection port on the right side, loading port underneath, fore end that slides, magazine tube.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Pump: the controls</text>
<g transform="translate(-175 40) scale(2.3)"><path d="M0 16 L7 14 L92 22 L108 22 L108 38 L97 40 C88 42 81 46 75 53 L6 57 L0 57 Z" fill="#6b5a45" stroke="#17201A" stroke-width="0.7"/><path d="M0 16 L5 15 L5 57 L0 57 Z" fill="#3b4045"/><rect x="108" y="18" width="54" height="22" rx="2" fill="#5d646b" stroke="#17201A" stroke-width="0.7"/><rect x="122" y="21.5" width="27" height="8.5" rx="1" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><rect x="138" y="22.5" width="10" height="6.5" fill="#a7aeb3" stroke="#17201A" stroke-width="0.7"/><path d="M116 40 C116 53 140 53 142 40" fill="none" stroke="#3b4045" stroke-width="2"/><line x1="127" y1="40" x2="125" y2="49" stroke="#3b4045" stroke-width="2.2" /><circle cx="137" cy="42.5" r="2.3" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><rect x="124" y="39" width="22" height="2" fill="#1e2124" stroke="#17201A" stroke-width="0.7"/><rect x="160" y="20" width="218" height="7.5" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><line x1="160" y1="19.4" x2="378" y2="19.4" stroke="#a7aeb3" stroke-width="1.2"/><rect x="366" y="20" width="12" height="7.5" fill="#a7aeb3" stroke="#17201A" stroke-width="0.7"/><circle cx="375" cy="18.2" r="1.6" fill="#ffffff" stroke="#17201A" stroke-width="0.5"/><rect x="160" y="28.5" width="140" height="6.5" fill="#5d646b" stroke="#17201A" stroke-width="0.7"/><rect x="176" y="26" width="72" height="14" rx="4" fill="#6b5a45" stroke="#17201A" stroke-width="0.7"/><line x1="186" y1="28" x2="186" y2="38" stroke="#4e4132" stroke-width="1.4"/><line x1="194" y1="28" x2="194" y2="38" stroke="#4e4132" stroke-width="1.4"/><line x1="202" y1="28" x2="202" y2="38" stroke="#4e4132" stroke-width="1.4"/><line x1="210" y1="28" x2="210" y2="38" stroke="#4e4132" stroke-width="1.4"/><line x1="218" y1="28" x2="218" y2="38" stroke="#4e4132" stroke-width="1.4"/><line x1="226" y1="28" x2="226" y2="38" stroke="#4e4132" stroke-width="1.4"/><line x1="234" y1="28" x2="234" y2="38" stroke="#4e4132" stroke-width="1.4"/><rect x="300" y="27" width="10" height="9" rx="1.5" fill="#a7aeb3" stroke="#17201A" stroke-width="0.7"/><rect x="112" y="41" width="4" height="6" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/></g>

<g data-tip="Action bar lock|Push it to unlock the fore end when the gun is cocked. On the 870 it sits at the front of the trigger guard." data-tip-dot="87,144"><line x1="87.2" y1="246.0" x2="87.2" y2="143.5" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="87.2" cy="143.5" r="3" fill="#1F3D2B"/><rect x="7.6" y="245.0" width="124.8" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="70.0" y="262.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Action bar lock</text></g>
<g data-tip="Cross bolt safety|On the 870: red band hidden = safe. Red band showing = it can fire." data-tip-dot="140,138"><line x1="166.9" y1="246.0" x2="140.1" y2="137.8" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="140.1" cy="137.8" r="3" fill="#1F3D2B"/><rect x="166.9" y="245.0" width="146.3" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="240.0" y="262.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Cross bolt safety</text></g>
<g data-tip="Ejection port|Shells come out here. Look in here to check the chamber." data-tip-dot="136,100"><line x1="135.5" y1="70.0" x2="135.5" y2="99.8" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="135.5" cy="99.8" r="3" fill="#1F3D2B"/><rect x="91.9" y="47.0" width="116.2" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="150.0" y="64.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Ejection port</text></g>
<g data-tip="Loading port|Underneath. You push shells up and forward into the magazine here." data-tip-dot="136,132"><line x1="135.5" y1="210.0" x2="135.5" y2="132.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="135.5" cy="132.0" r="3" fill="#1F3D2B"/><rect x="96.2" y="209.0" width="107.6" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="150.0" y="226.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Loading port</text></g>
<g data-tip="Fore end|Pull it all the way back, push it all the way forward. Every time." data-tip-dot="313,116"><line x1="368.9" y1="115.1" x2="312.6" y2="115.9" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="312.6" cy="115.9" r="3" fill="#1F3D2B"/><rect x="291.1" y="103.0" width="77.8" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="330.0" y="120.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Fore end</text></g>
<g data-tip="Magazine tube|Holds the shells. The plug goes inside." data-tip-dot="359,114"><line x1="358.6" y1="174.0" x2="358.6" y2="113.6" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="358.6" cy="113.6" r="3" fill="#1F3D2B"/><rect x="270.5" y="173.0" width="119.0" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="330.0" y="190.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Magazine tube</text></g>
<text x="200.0" y="288.0" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Remington 870 layout. Others are similar.</text>
</svg>
