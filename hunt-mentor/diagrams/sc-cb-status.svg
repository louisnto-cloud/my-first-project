<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" role="img" aria-label="Status grid. Southern Mountain caribou: Threatened under the federal Species at Risk Act, no hunt. Boreal caribou: Threatened, no hunt. Northern Mountain caribou: Special Concern, draw hunts only. Wood bison: Threatened. Plains bison, the Pink Mountain herd: over 1,000 animals. Bison hunts are only in parts of Management Units 7-42, 7-57 and 7-58, 98 percent. Every caribou hunt is a draw." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="360" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Caribou and bison: status</text>
<text x="200.0" y="46" font-size="14" fill="#8b5a2b" text-anchor="middle">Federal Species at Risk Act listing</text>
<rect x="10" y="62" width="380" height="28" fill="#2f3a2b"/>
<text x="20" y="81" font-size="14" fill="#fff" text-anchor="start" font-weight="bold">Animal</text>
<text x="240" y="81" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">Status</text>
<text x="345" y="81" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">Hunt?</text>
<rect x="10" y="90" width="380" height="40" fill="#dfe6d3"/>
<text x="20" y="107" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Southern Mountain</text>
<text x="20" y="123" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">caribou</text>
<rect x="186" y="99" width="112" height="22" rx="11" fill="#e8590c"/><text x="242.0" y="114" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Threatened</text>
<text x="345" y="115" font-size="14" fill="#23261f" text-anchor="middle">No hunt</text>
<rect x="10" y="130" width="380" height="40" fill="#fffaf0"/>
<text x="20" y="155" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Boreal caribou</text>
<rect x="186" y="139" width="112" height="22" rx="11" fill="#e8590c"/><text x="242.0" y="154" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Threatened</text>
<text x="345" y="155" font-size="14" fill="#23261f" text-anchor="middle">No hunt</text>
<rect x="10" y="170" width="380" height="40" fill="#dfe6d3"/>
<text x="20" y="187" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Northern Mountain</text>
<text x="20" y="203" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">caribou</text>
<rect x="186" y="179" width="112" height="22" rx="11" fill="#c98a1a"/><text x="242.0" y="194" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Special Concern</text>
<text x="345" y="195" font-size="14" fill="#23261f" text-anchor="middle">Draw only</text>
<rect x="10" y="210" width="380" height="40" fill="#fffaf0"/>
<text x="20" y="235" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Wood bison</text>
<rect x="186" y="219" width="112" height="22" rx="11" fill="#e8590c"/><text x="242.0" y="234" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Threatened</text>
<text x="345" y="235" font-size="14" fill="#23261f" text-anchor="middle">See below</text>
<rect x="10" y="250" width="380" height="40" fill="#dfe6d3"/>
<text x="20" y="267" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Plains bison</text>
<text x="20" y="283" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Pink Mountain</text>
<rect x="186" y="259" width="112" height="22" rx="11" fill="#2f6b3a"/><text x="242.0" y="274" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Over 1,000</text>
<text x="345" y="275" font-size="14" fill="#23261f" text-anchor="middle">See below</text>
<rect x="10" y="300" width="380" height="52" rx="8" fill="#f3ead8" stroke="#2f3a2b" stroke-width="2"/>
<text x="200.0" y="321.9" font-size="14" fill="#23261f" text-anchor="middle">Bison hunts: parts of MUs 7-42, 7-57, 7-58</text>
<text x="200.0" y="339.9" font-size="14" fill="#23261f" text-anchor="middle">only (98%). Caribou: every hunt is a draw.</text>
</svg>
