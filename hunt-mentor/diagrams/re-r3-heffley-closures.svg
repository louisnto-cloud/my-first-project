<text x="212.0" y="401" font-size="14" font-weight="bold" fill="#ffffff">Both MUs</text>
<text x="212.0" y="447" font-size="14" fill="#23261f">1,700 m vehicle rule</text>
<text x="212.0" y="465" font-size="14" fill="#23261f">and the 200 m feeding</text>
<text x="212.0" y="483" font-size="14" fill="#23261f">and baiting ban</text>
</svg>
