<text x="74" y="323" font-size="16" font-weight="bold" fill="#2f3a2b">ATV and snowmobile</text>
<text x="388" y="323" font-size="14" fill="#6b5b4b" text-anchor="end">MU 3-28</text>
<text x="74" y="343" font-size="15" fill="#c2410c">No ATV or e bike for hunting Sept 1 to</text>
<text x="74" y="363" font-size="15" fill="#c2410c">Dec 10.</text>
<text x="74" y="383" font-size="15" fill="#c2410c">No snowmobile for hunting Apr 1 to Dec 14</text>
<rect x="8" y="402" width="56" height="67" rx="6" fill="#8b5a2b"/>
<text x="36" y="441.5" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Both</text>
<text x="74" y="421" font-size="16" font-weight="bold" fill="#2f3a2b">Both MUs</text>
<text x="74" y="441" font-size="15" fill="#8b5a2b">1,700 m vehicle rule and the 200 m feeding</text>
<text x="74" y="461" font-size="15" fill="#8b5a2b">and baiting ban</text>
<text x="8" y="497" font-size="15" fill="#6b5b4b">3-27 has no ATV (All Terrain Vehicle) for hunting</text>
