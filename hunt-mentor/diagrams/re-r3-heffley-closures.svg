<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 521" role="img" aria-label="Cards: Heffley Creek: closures in 3-27 and 3-28. Map C7, both MUs: South Thompson band: no hunting or shooting to the Lafarge Bridge, no shooting to the Pritchard Bridge. 3-27 Map C11 Sun Peaks: No hunting or shooting within 400 m. 3-28 Map C12 McQueen Lake: No shooting within 1 km. 3-28 Maps C13 and C15: Skull Mtn: open roads only Sept 1 to Dec 10. Lac du Bois: highlighted roads only. 3-28 ATV and snowmobile: No ATV or e bike for hunting Sept 1 to Dec 10. No snowmobile for hunting Apr 1 to Dec 14. Both MUs: 1,700 m vehicle rule and the 200 m feeding and baiting ban." font-family="sans-serif">
<rect x="0" y="0" width="400" height="521" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Heffley Creek: closures in 3-27 and 3-28</text>
<text x="200" y="47" font-size="14" fill="#8b5a2b" text-anchor="middle">3-27 has no ATV (All Terrain Vehicle) for</text>
<text x="200" y="65" font-size="14" fill="#8b5a2b" text-anchor="middle">hunting closure</text>
<rect x="6.0" y="87" width="190.0" height="148" rx="9" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M6.0 133 V96 Q6.0 87 15.0 87 H187.0 Q196.0 87 196.0 96 V133 Z" fill="#c92a2a"/>
