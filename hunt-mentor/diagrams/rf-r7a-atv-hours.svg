<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 402" font-family="sans-serif" role="img" aria-label="Bar chart of the hours when all terrain vehicles (ATVs), including motorcycles and electric bicycles, may not be used to hunt or to carry hunters, gear or game, in Management Units 7-7 to 7-15 and 7-24 to 7-29. 15 to 31 August: 4:30 to 8:00 am. 1 to 30 September: 5:30 to 9:00 am. 1 October to 15 November: 6:30 to 10:00 am. Outside these hours the ATV rule here does not apply.">
<rect width="400" height="402" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">No ATV for hunting: these hours</text>
<text x="200" y="48" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">MUs 7-7 to 7-15 and 7-24 to 7-29</text>
<text x="26" y="82" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">4 am</text>
<line x1="26.0" y1="92" x2="26.0" y2="290" stroke="#d8cfb8" stroke-width="1" stroke-dasharray="3 3"/><line x1="76.6" y1="92" x2="76.6" y2="290" stroke="#d8cfb8" stroke-width="1" stroke-dasharray="3 3"/><line x1="127.1" y1="92" x2="127.1" y2="290" stroke="#d8cfb8" stroke-width="1" stroke-dasharray="3 3"/><line x1="177.7" y1="92" x2="177.7" y2="290" stroke="#d8cfb8" stroke-width="1" stroke-dasharray="3 3"/><line x1="228.3" y1="92" x2="228.3" y2="290" stroke="#d8cfb8" stroke-width="1" stroke-dasharray="3 3"/><line x1="278.9" y1="92" x2="278.9" y2="290" stroke="#d8cfb8" stroke-width="1" stroke-dasharray="3 3"/><line x1="329.4" y1="92" x2="329.4" y2="290" stroke="#d8cfb8" stroke-width="1" stroke-dasharray="3 3"/><line x1="380.0" y1="92" x2="380.0" y2="290" stroke="#d8cfb8" stroke-width="1" stroke-dasharray="3 3"/>
<text x="76.5714" y="82" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">5</text>
<text x="127.143" y="82" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">6</text>
<text x="177.714" y="82" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">7</text>
<text x="228.286" y="82" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">8</text>
<text x="278.857" y="82" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">9</text>
<text x="329.429" y="82" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">10</text>
<text x="380" y="82" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">11</text>
<text x="14" y="113" font-size="16" font-weight="bold" fill="#2f3a2b">Aug 15 to 31</text>
<rect x="18" y="122" width="370" height="30" rx="6" fill="#f4eedf"/>
<rect x="51.3" y="124" width="177.0" height="26" rx="5" fill="#c92a2a"/>
<text x="139.8" y="142" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">4:30 to 8:00</text>
<text x="14" y="181" font-size="16" font-weight="bold" fill="#2f3a2b">Sept 1 to 30</text>
<rect x="18" y="190" width="370" height="30" rx="6" fill="#f4eedf"/>
<rect x="101.9" y="192" width="177.0" height="26" rx="5" fill="#c92a2a"/>
<text x="190.4" y="210" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">5:30 to 9:00</text>
<text x="14" y="249" font-size="16" font-weight="bold" fill="#2f3a2b">Oct 1 to Nov 15</text>
<rect x="18" y="258" width="370" height="30" rx="6" fill="#f4eedf"/>
<rect x="152.4" y="260" width="177.0" height="26" rx="5" fill="#c92a2a"/>
<text x="240.9" y="278" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">6:30 to 10:00</text>
<rect x="14" y="304" width="16" height="16" rx="3" fill="#c92a2a"/>
<text x="38" y="317" font-size="15" fill="#2f3a2b">No ATV (all terrain vehicle), motorcycle or e bike</text>
<text x="38" y="337" font-size="15" fill="#2f3a2b">to hunt, or to carry hunters, gear or game.</text>
<text x="14" y="367" font-size="15" font-weight="bold" fill="#2f6e3b">Outside these hours the ATV rule here does not</text>
<text x="14" y="387" font-size="15" font-weight="bold" fill="#2f6e3b">apply.</text>
</svg>
