<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A weather mast 10 metres tall where the forecast of 20 kilometres an hour applies, with long wind arrows. At the hunter head height, 2 metres, the wind is about 10 to 14 kilometres an hour, shown with a shorter arrow. Wind at head height is about 50 to 70 percent of the forecast.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Forecast wind is not your wind</text><rect x="0" y="250" width="400" height="50" fill="#dfe6d3"/><line x1="80" y1="250" x2="80" y2="60" stroke="#23261f" stroke-width="3"/><rect x="70" y="52" width="20" height="10" fill="#23261f"/><text x="96" y="66" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">10 m: forecast 20 km/h</text><line x1="220" y1="80" x2="380" y2="80" stroke="#4a7fb0" stroke-width="3"/><polygon points="380.0,80.0 371.0,84.3 371.0,75.7" fill="#4a7fb0"/><line x1="220" y1="84" x2="380" y2="84" stroke="#4a7fb0" stroke-width="3"/><polygon points="380.0,84.0 371.0,88.3 371.0,79.7" fill="#4a7fb0"/><line x1="220" y1="88" x2="380" y2="88" stroke="#4a7fb0" stroke-width="3"/><polygon points="380.0,88.0 371.0,92.3 371.0,83.7" fill="#4a7fb0"/><line x1="220" y1="92" x2="380" y2="92" stroke="#4a7fb0" stroke-width="3"/><polygon points="380.0,92.0 371.0,96.3 371.0,87.7" fill="#4a7fb0"/><g transform="translate(120 250) scale(1.1)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#e8590c"/><rect x="-6" y="-15" width="5" height="15" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" fill="#2f3a2b"/></g><text x="150" y="206" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">2 m: about 10 to 14 km/h</text><line x1="250" y1="220" x2="330" y2="220" stroke="#4a7fb0" stroke-width="2"/><polygon points="330.0,220.0 321.0,224.3 321.0,215.7" fill="#4a7fb0"/><text x="200" y="280" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">50 to 70% at head height (90%)</text>
</svg>
