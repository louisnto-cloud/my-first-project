<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Rear views side by side. Left, white tailed deer: a wide brown tail with white only on the underside and edges, small white patch under it. Right, mule deer: a thin white rope tail with a black tip on a large white rump patch." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">Look at the back end</text><rect x="71" y="190" width="12" height="70" rx="5" fill="#8b5a2b"/><rect x="127" y="190" width="12" height="70" rx="5" fill="#8b5a2b"/><ellipse cx="105" cy="160" rx="52" ry="50" fill="#8b5a2b"/><path d="M91 150 Q 105 140 119 150 L 115 200 Q 105 206 95 200 Z" fill="#f4efe4"/><path d="M85 118 C 79 150 83 190 105 196 C 127 190 131 150 125 118 Q 105 108 85 118 Z" fill="#6b4f35" stroke="#23261f" stroke-width="1.5"/><path d="M85 118 L81 128 M125 118 L129 128" stroke="#ffffff" stroke-width="4"/><rect x="261" y="190" width="12" height="70" rx="5" fill="#8b5a2b"/><rect x="317" y="190" width="12" height="70" rx="5" fill="#8b5a2b"/><ellipse cx="295" cy="160" rx="52" ry="50" fill="#8b5a2b"/><ellipse cx="295" cy="155" rx="36" ry="40" fill="#ffffff"/><rect x="290" y="120" width="10" height="56" rx="5" fill="#ffffff" stroke="#23261f" stroke-width="1"/><rect x="290" y="166" width="10" height="16" rx="5" fill="#23261f"/><text x="105" y="58" font-size="17" fill="#e8590c" text-anchor="middle" font-weight="bold">White tail</text><text x="295" y="58" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Mule deer</text><text x="105" y="280" font-size="14" fill="#23261f" text-anchor="middle">Wide brown tail,</text><text x="105" y="296" font-size="14" fill="#23261f" text-anchor="middle">white only underneath</text><text x="295" y="280" font-size="14" fill="#23261f" text-anchor="middle">Thin white tail, black tip,</text><text x="295" y="296" font-size="14" fill="#23261f" text-anchor="middle">big white rump patch</text><line x1="200" y1="40" x2="200" y2="270" stroke="#c9b79c" stroke-width="2" stroke-dasharray="5 5"/>
</svg>
