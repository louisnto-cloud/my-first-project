<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three kinds of feather. A wing feather: stiff and long with a strong quill, sometimes with a coloured patch. A body feather: curved and soft. Down: fluff. A coloured wing feather can name the duck, 80 percent. A pile of plucked feathers is a predator kill, a tip."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Three kinds of feather, three stories</text><path d="M70 190 Q52 120.0 70 50 Q88 120.0 70 190Z" fill="#5c5c5c"/><line x1="70" y1="204" x2="70" y2="54" stroke="#2f3a2b" stroke-width="2" fill="none"/><rect x="62" y="120" width="16" height="30" rx="2" fill="#3f51a0"/><text x="70" y="214" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Wing feather</text><text x="70" y="232" font-size="14" fill="#2f3a2b" text-anchor="middle">stiff, long</text><path d="M200 190 Q178 155.0 200 120 Q222 155.0 200 190Z" fill="#8b5a2b"/><line x1="200" y1="204" x2="200" y2="124" stroke="#2f3a2b" stroke-width="2" fill="none"/><text x="200" y="214" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Body feather</text><text x="200" y="232" font-size="14" fill="#2f3a2b" text-anchor="middle">curved, soft</text><line x1="330" y1="170" x2="360.0" y2="170.0" stroke="#9a9a8a" stroke-width="2" fill="none"/><line x1="330" y1="170" x2="354.24082524936455" y2="187.67434273826808" stroke="#9a9a8a" stroke-width="2" fill="none"/><line x1="330" y1="170" x2="339.1745072513487" y2="198.56271024771547" stroke="#9a9a8a" stroke-width="2" fill="none"/><line x1="330" y1="170" x2="320.58568321923354" y2="198.48456844593892" stroke="#9a9a8a" stroke-width="2" fill="none"/><line x1="330" y1="170" x2="305.6114388870033" y2="187.46991948572247" stroke="#9a9a8a" stroke-width="2" fill="none"/><line x1="330" y1="170" x2="300.0010602458597" y2="169.74778257898555" stroke="#9a9a8a" stroke-width="2" fill="none"/><line x1="330" y1="170" x2="305.9086240299081" y2="152.12248328576706" stroke="#9a9a8a" stroke-width="2" fill="none"/><line x1="330" y1="170" x2="321.065950760291" y2="141.3611668501935" stroke="#9a9a8a" stroke-width="2" fill="none"/><line x1="330" y1="170" x2="339.6534608774917" y2="141.59558673222173" stroke="#9a9a8a" stroke-width="2" fill="none"/><line x1="330" y1="170" x2="354.53457311856585" y2="152.73573859414347" stroke="#9a9a8a" stroke-width="2" fill="none"/><circle cx="330" cy="170" r="6" fill="#bdbdad"/><text x="330" y="214" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Down</text><text x="330" y="232" font-size="14" fill="#2f3a2b" text-anchor="middle">fluff</text><rect x="10" y="246" width="380" height="48" rx="8" fill="#dfe6d3"/><text x="200" y="266" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Coloured wing feather: names the duck (80%)</text><text x="200" y="286" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Pile of plucked feathers: a predator kill (Tip)</text></svg>
