<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Line chart of body reserves across the year, a Tip, shape only. Reserves peak in early spring before nesting, drop while the hen sits on the eggs, stay low through the summer moult, then climb in fall on grain. The hen stores enough for about a month of incubation, 80 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Reserves through the year (Tip)</text><text x="40" y="262" font-size="14" fill="#23261f" text-anchor="middle">J</text><text x="69" y="262" font-size="14" fill="#23261f" text-anchor="middle">F</text><text x="98" y="262" font-size="14" fill="#23261f" text-anchor="middle">M</text><text x="127" y="262" font-size="14" fill="#23261f" text-anchor="middle">A</text><text x="156" y="262" font-size="14" fill="#23261f" text-anchor="middle">M</text><text x="185" y="262" font-size="14" fill="#23261f" text-anchor="middle">J</text><text x="214" y="262" font-size="14" fill="#23261f" text-anchor="middle">J</text><text x="243" y="262" font-size="14" fill="#23261f" text-anchor="middle">A</text><text x="272" y="262" font-size="14" fill="#23261f" text-anchor="middle">S</text><text x="301" y="262" font-size="14" fill="#23261f" text-anchor="middle">O</text><text x="330" y="262" font-size="14" fill="#23261f" text-anchor="middle">N</text><text x="359" y="262" font-size="14" fill="#23261f" text-anchor="middle">D</text><line x1="30" y1="245" x2="380" y2="245" stroke="#2f3a2b" stroke-width="2"/><path d="M40 150 Q70 120 98 100 Q120 95 140 170 Q160 215 185 205 Q215 190 240 185 Q270 170 300 140 Q330 125 360 130" stroke="#e8590c" stroke-width="4" fill="none"/><text x="95" y="88" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Peak before nesting</text><text x="160" y="232" font-size="14" fill="#23261f" text-anchor="middle">Hen burns it sitting</text><text x="225" y="175" font-size="14" fill="#23261f" text-anchor="middle">Moult costs</text><text x="320" y="118" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Fall: fatten on grain</text><text x="200" y="288" font-size="14" fill="#2f3a2b" text-anchor="middle">Hen stores enough for about a month of sitting (80%)</text>
</svg>
