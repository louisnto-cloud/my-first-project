<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Six signs of black bears. Scat full of berries, seeds or hair. Torn up logs and stumps where it dug for ants and grubs. Rub trees with hair caught on the bark. Claw marks on smooth aspen bark. Flipped rocks with insects underneath. Trails where bears step in the same footprints year after year.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">6 signs a bear was here</text><rect x="10" y="50" width="186" height="76" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><path d="M24 102 q8 -20 22 -14 q14 -10 22 14 Z" fill="#6b4f35"/><circle cx="36" cy="92" r="2.5" fill="#7b2a3a"/><circle cx="43" cy="87" r="2.5" fill="#7b2a3a"/><circle cx="50" cy="92" r="2.5" fill="#7b2a3a"/><circle cx="57" cy="87" r="2.5" fill="#7b2a3a"/><text x="82" y="82" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Scat</text><text x="82" y="104" font-size="14" fill="#23261f" text-anchor="start">berries, hair</text><rect x="202" y="50" width="186" height="76" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><rect x="210" y="80" width="56" height="18" rx="9" fill="#6b4f35"/><path d="M230 80 l6 -10 l6 10 Z" fill="#c9b79c"/><text x="274" y="82" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Torn logs</text><text x="274" y="104" font-size="14" fill="#23261f" text-anchor="start">ants and grubs</text><rect x="10" y="132" width="186" height="76" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><rect x="40" y="140" width="12" height="60" fill="#6b4f35"/><line x1="40" y1="156" x2="32" y2="154" stroke="#1d1d1b" stroke-width="1.5"/><line x1="40" y1="162" x2="32" y2="160" stroke="#1d1d1b" stroke-width="1.5"/><line x1="40" y1="168" x2="32" y2="166" stroke="#1d1d1b" stroke-width="1.5"/><line x1="40" y1="174" x2="32" y2="172" stroke="#1d1d1b" stroke-width="1.5"/><text x="82" y="164" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Rub tree</text><text x="82" y="186" font-size="14" fill="#23261f" text-anchor="start">hair on bark</text><rect x="202" y="132" width="186" height="76" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><rect x="230" y="140" width="16" height="60" fill="#e8e2d0" stroke="#8a9a6b"/><line x1="233" y1="150" x2="231" y2="172" stroke="#1d1d1b" stroke-width="1.5"/><line x1="236" y1="150" x2="234" y2="172" stroke="#1d1d1b" stroke-width="1.5"/><line x1="239" y1="150" x2="237" y2="172" stroke="#1d1d1b" stroke-width="1.5"/><line x1="242" y1="150" x2="240" y2="172" stroke="#1d1d1b" stroke-width="1.5"/><text x="274" y="164" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Claw marks</text><text x="274" y="186" font-size="14" fill="#23261f" text-anchor="start">on aspen bark</text><rect x="10" y="214" width="186" height="76" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><ellipse cx="46" cy="258" rx="22" ry="12" fill="#9a9488"/><ellipse cx="52" cy="266" rx="18" ry="6" fill="#5c4a35"/><text x="82" y="246" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Flipped rocks</text><text x="82" y="268" font-size="14" fill="#23261f" text-anchor="start">insects under</text><rect x="202" y="214" width="186" height="76" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><ellipse cx="224" cy="246" rx="5" ry="8" fill="#6b4f35"/><ellipse cx="236" cy="262" rx="5" ry="8" fill="#6b4f35"/><ellipse cx="248" cy="246" rx="5" ry="8" fill="#6b4f35"/><ellipse cx="260" cy="262" rx="5" ry="8" fill="#6b4f35"/><text x="274" y="246" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Trail</text><text x="274" y="268" font-size="14" fill="#23261f" text-anchor="start">same prints</text>
</svg>
