<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Tourniquet step 2: pull the strap as tight as you can before you twist. No slack: you should not fit 3 fingers under it.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">2. Pull the strap tight</text><rect x="30" y="138" width="300" height="44" rx="22" fill="#d9b48f" stroke="#b08a66" stroke-width="2"/><circle cx="344" cy="160" r="24.0" fill="#d9b48f" stroke="#b08a66" stroke-width="2"/><ellipse cx="250" cy="160" rx="16" ry="7" fill="#c0392b"/><rect x="158" y="130" width="24" height="60" rx="4" fill="#e8590c" stroke="#2f3a2b" stroke-width="2"/><line x1="170" y1="98" x2="170" y2="128" stroke="#2f3a2b" stroke-width="7" stroke-linecap="round"/><line x1="170" y1="210" x2="129" y2="243" stroke="#e8590c" stroke-width="5" stroke-linecap="round"/><polygon points="120,250 134,248 125,237" fill="#e8590c"/><text x="230" y="250" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pull hard, no slack</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Strap tight before you twist</text>
</svg>
