<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A timeline on October 15: turn around at 16:15, walk out 1 hour 25 minutes, reach the truck about 17:40 before the 18:08 sunset, with legal light ending at 19:08. Add a 30 minute buffer for a shot, a drag or a wrong turn.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="32" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Work back from dark</text><line x1="30" y1="150" x2="370" y2="150" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><line x1="55" y1="135" x2="55" y2="165" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><text x="55" y="125" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">16:15</text><text x="55" y="190" font-family="sans-serif" font-size="13" fill="#e8590c" text-anchor="middle" font-weight="bold">Turn around</text><line x1="160" y1="135" x2="160" y2="165" stroke="#8a9a6b" stroke-width="4" stroke-linecap="round"/><text x="160" y="125" font-family="sans-serif" font-size="14" fill="#8a9a6b" text-anchor="middle" font-weight="bold">17:40</text><text x="160" y="190" font-family="sans-serif" font-size="13" fill="#8a9a6b" text-anchor="middle" font-weight="bold">Truck</text><line x1="245" y1="135" x2="245" y2="165" stroke="#6b4f35" stroke-width="4" stroke-linecap="round"/><text x="245" y="125" font-family="sans-serif" font-size="14" fill="#6b4f35" text-anchor="middle" font-weight="bold">18:08</text><text x="245" y="190" font-family="sans-serif" font-size="13" fill="#6b4f35" text-anchor="middle" font-weight="bold">Sunset</text><line x1="335" y1="135" x2="335" y2="165" stroke="#c92a2a" stroke-width="4" stroke-linecap="round"/><text x="335" y="125" font-family="sans-serif" font-size="14" fill="#c92a2a" text-anchor="middle" font-weight="bold">19:08</text><text x="335" y="190" font-family="sans-serif" font-size="13" fill="#c92a2a" text-anchor="middle" font-weight="bold">Legal end</text><line x1="55" y1="210" x2="152.3" y2="210.0" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="160.0,210.0 149.0,203.9 149.0,216.1" fill="#e8590c"/><text x="108" y="235" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="middle">1 h 25 walk out</text><text x="20" y="275" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Plus a buffer: 30 min for a shot, a drag, a wrong turn (Tip).</text>
</svg>
