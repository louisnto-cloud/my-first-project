<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 318" font-family="sans-serif" role="img" aria-label="Top view of a hedgerow in a field, a tip. The walker moves along the hedgerow toward the blocker, who stands in the open just past the far end. Birds flush out of the end of the hedgerow. A red wedge shows the no shot arc: never back toward the hedgerow and the walker. A green wedge shows the safe zone out over open ground. Agree the arc before you start.">
