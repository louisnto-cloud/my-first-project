<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Top view of a hedgerow in a field. The walker moves along the hedgerow toward the blocker, who stands in the open at the far end. Birds flush toward the blocker. A red wedge shows the no shot arc: never toward the walker. A green wedge shows the safe zone out over open ground. Agree the arc before you start. Tip.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="24" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pinch a hedgerow (Tip)</text>
  <rect x="0" y="36" width="400" height="264" fill="#d9c27a"/>
  <rect x="20" y="130" width="280" height="40" rx="18" fill="#8a9a6b"/>
  <text x="160" y="156" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hedgerow</text>
  <g transform="translate(40 110) scale(1.0)"><circle r="9" fill="#e8590c"/><text x="0" y="-18" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Walker</text></g>
  <path d="M56 110 L150 110 M141.0 114.3 L150 110 L141.0 105.7" stroke="#e8590c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g transform="translate(350 150) scale(1.0)"><circle r="9" fill="#4a7fb0"/><text x="0" y="-18" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Blocker</text></g>
  <path d="M350 150 L250 120 L250 180Z" fill="#c0392b" opacity=".3"/>
  <text x="250" y="214" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">No shot arc:</text>
  <text x="250" y="232" font-size="14" fill="#c0392b" text-anchor="middle">toward the walker</text>
  <path d="M40 110 L140 80 L140 60 Z" fill="#c0392b" opacity=".0"/>
  <g transform="translate(320 90) scale(0.6)"><ellipse rx="18" ry="5" fill="#8a7560"/><circle cx="18" cy="-1" r="4.5" fill="#8a7560"/><path d="M8 -3 Q2 -20.0 -10 -32.0 Q-8 -16.0 -8 -3Z" fill="#8a7560"/><path d="M8 3 Q2 20.0 -10 32.0 Q-8 16.0 -8 3Z" fill="#8a7560"/><path d="M-16 0 L-26 -5 L-26 5Z" fill="#8a7560"/></g>
  <path d="M300 140 L340 96 M337.2 105.6 L340 96 L330.7 99.7" stroke="#8b5a2b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="330" y="70" font-size="13" fill="#2f3a2b" text-anchor="middle">Birds flush</text>
  <path d="M350 150 L400 90 L400 210Z" fill="#2f6e3b" opacity=".3"/>
  <text x="360" y="282" font-size="14" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Safe: open sky</text>
  <text x="110" y="282" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Agree the arc before you start</text>
</svg>
