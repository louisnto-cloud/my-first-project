<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Top view of a hedgerow in a field. The walker moves along the hedgerow toward the blocker, who stands in the open just past the far end. Birds flush out of the end of the hedgerow. A red wedge shows the no shot arc: never back toward the hedgerow and the walker. A green wedge shows the safe zone out over open ground. Agree the arc before you start. Tip.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="24" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pinch a hedgerow (Tip)</text>
  <rect x="0" y="36" width="400" height="264" fill="#d9c27a"/>
  <path d="M300 190 L300 60 A130 130 0 0 1 400 120 L400 190Z" fill="#2f6e3b" opacity=".0"/>
  <path d="M310 200 L380 60 L400 60 L400 200Z" fill="#2f6e3b" opacity=".28"/>
  <text x="366" y="84" font-size="14" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Safe:</text>
  <text x="366" y="100" font-size="14" fill="#2f6e3b" text-anchor="middle">open</text>
  <text x="366" y="116" font-size="14" fill="#2f6e3b" text-anchor="middle">ground</text>
  <path d="M310 200 L200 160 L200 240Z" fill="#c0392b" opacity=".3"/>
  <rect x="20" y="180" width="230" height="40" rx="18" fill="#8a9a6b"/>
  <text x="120" y="206" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hedgerow</text>
  <g transform="translate(40 158) scale(1.0)"><circle r="9" fill="#e8590c"/><text x="0" y="-18" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Walker</text></g>
  <path d="M56 158 L150 158 M141.0 162.3 L150 158 L141.0 153.7" stroke="#e8590c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g transform="translate(310 200) scale(1.0)"><circle r="9" fill="#4a7fb0"/></g>
  <text x="310" y="232" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Blocker</text>
  <g transform="translate(330 120) scale(0.6)"><ellipse rx="18" ry="5" fill="#8a7560"/><circle cx="18" cy="-1" r="4.5" fill="#8a7560"/><path d="M8 -3 Q2 -20.0 -10 -32.0 Q-8 -16.0 -8 -3Z" fill="#8a7560"/><path d="M8 3 Q2 20.0 -10 32.0 Q-8 16.0 -8 3Z" fill="#8a7560"/><path d="M-16 0 L-26 -5 L-26 5Z" fill="#8a7560"/></g>
  <path d="M262 186 L318 128 M314.9 137.5 L318 128 L308.6 131.5" stroke="#8b5a2b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="150" y="262" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Red: no shot toward the walker</text>
  <text x="200" y="288" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Agree the arc before you start</text>
</svg>
