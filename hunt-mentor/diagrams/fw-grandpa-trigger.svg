<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Close up of a rifle trigger guard. Right: the trigger finger lies straight along the side of the stock, above and outside the trigger guard, ticked. Wrong: the finger curled inside the guard on the trigger while walking, crossed. Finger goes on the trigger only when the sights are on the target and you have decided to shoot.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
  <g>
    <rect x="20" y="70" width="170" height="34" rx="6" fill="#8b5a2b"/>
    <rect x="20" y="58" width="170" height="14" fill="#2f3a2b"/>
    <path d="M70 104 Q 70 150 110 150 Q 140 150 140 104" fill="none" stroke="#2f3a2b" stroke-width="5"/>
    <path d="M102 104 Q 98 122 106 132" fill="none" stroke="#2f3a2b" stroke-width="5"/>
    <rect x="60" y="80" width="90" height="16" rx="8" fill="#f2c9a0" stroke="#8b5a2b" stroke-width="2"/>
    <circle cx="190" cy="40" r="20" fill="#8a9a6b"/>
    <path d="M180 40 L188 48 L201 32" fill="none" stroke="#ffffff" stroke-width="4"/>
    <text x="105" y="190" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Finger straight,</text>
    <text x="105" y="210" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">outside the guard</text>
  </g>
  <g>
    <rect x="210" y="70" width="170" height="34" rx="6" fill="#8b5a2b"/>
    <rect x="210" y="58" width="170" height="14" fill="#2f3a2b"/>
    <path d="M260 104 Q 260 150 300 150 Q 330 150 330 104" fill="none" stroke="#2f3a2b" stroke-width="5"/>
    <path d="M292 104 Q 288 122 296 132" fill="none" stroke="#2f3a2b" stroke-width="5"/>
    <path d="M330 90 Q 300 92 296 118 Q 296 128 306 126" fill="none" stroke="#f2c9a0" stroke-width="14" stroke-linecap="round"/>
    <circle cx="380" cy="40" r="20" fill="#e8590c"/>
    <path d="M370 30 L390 50 M390 30 L370 50" stroke="#ffffff" stroke-width="4"/>
    <text x="295" y="190" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Finger on trigger</text>
    <text x="295" y="210" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">while walking</text>
  </g>
  <text x="200" y="262" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="middle">On the trigger only when the sights are on</text>
  <text x="200" y="282" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="middle">and you have decided to shoot.</text>
</svg>
