<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 646" font-family="sans-serif" role="img" aria-label="Cards about camping. Crown land: up to 14 consecutive days, then leave with your gear for 72 hours to reset. Recreation sites: the same 14 day limit, most first come first served, fees at some. At a rec site: no shooting within 100 metres of structures, no gut piles, no taking firewood. Pitt Addington Marsh, Boundary Bay, Bert Brink, Harrison Chehalis and Serpentine Wildlife Management Areas: no camping and no fires. Campfires: at most half a metre by half a metre, water or a hand tool ready, follow BC Wildfire Service bans.">
<rect x="0" y="0" width="400" height="646" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Where you can camp</text>
<rect x="16" y="42" width="368" height="116" rx="10" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2.5"/>
<text x="26" y="66" font-size="15" font-weight="bold" fill="#23261f">Crown land: 14 days</text>
<circle cx="368.0" cy="60" r="11" fill="#8a9a6b"/><path d="M363.05 60 l3.3 3.8499999999999996 l6.6 -7.699999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="26" y="84" font-size="14" fill="#2f3a2b">Then leave with your gear for 72 hours to</text>
<text x="26" y="102" font-size="14" fill="#2f3a2b">reset (99%).</text>
<g transform="translate(46.0 138) scale(0.62)"><path d="M-26 18 l26 -36 l26 36 z" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2"/><path d="M0 -18 v36 M-6 18 l6 -12 l6 12" stroke="#2f3a2b" stroke-width="2" fill="#fffaf0"/></g>
<g transform="translate(133.0 138) scale(0.62)"><rect x="-24" y="-18" width="48" height="40" rx="4" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/><rect x="-24" y="-18" width="48" height="11" fill="#e8590c"/><path d="M-13 -23 v9 M13 -23 v9" stroke="#2f3a2b" stroke-width="3"/><g fill="#8a9a6b"><rect x="-17" y="-1" width="7" height="6"/><rect x="-4" y="-1" width="7" height="6"/><rect x="9" y="-1" width="7" height="6"/><rect x="-17" y="10" width="7" height="6"/><rect x="-4" y="10" width="7" height="6" fill="#e8590c"/></g></g>
<rect x="16" y="168" width="368" height="116" rx="10" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2.5"/>
<text x="26" y="192" font-size="15" font-weight="bold" fill="#23261f">Rec sites: 14 days</text>
<circle cx="368.0" cy="186" r="11" fill="#8a9a6b"/><path d="M363.05 186 l3.3 3.8499999999999996 l6.6 -7.699999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="26" y="210" font-size="14" fill="#2f3a2b">Most first come, first served. Some charge a</text>
<text x="26" y="228" font-size="14" fill="#2f3a2b">fee (99%).</text>
<g transform="translate(46.0 264) scale(0.62)"><path d="M-26 18 l26 -36 l26 36 z" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2"/><path d="M0 -18 v36 M-6 18 l6 -12 l6 12" stroke="#2f3a2b" stroke-width="2" fill="#fffaf0"/></g>
<rect x="16" y="294" width="368" height="116" rx="10" fill="#f3ead6" stroke="#6b4f35" stroke-width="2.5"/>
<text x="26" y="318" font-size="15" font-weight="bold" fill="#23261f">At a rec site</text>
<circle cx="368.0" cy="312" r="11" fill="#4a7fb0"/><text x="368" y="316.62" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
<text x="26" y="336" font-size="14" fill="#2f3a2b">No shooting within 100 m of structures. No</text>
<text x="26" y="354" font-size="14" fill="#2f3a2b">gut piles. No taking firewood (99%).</text>
<g transform="translate(46.0 390) scale(0.62)"><path d="M-32 1 h36 l5 -3 h24 v3 h-22 l-3 4 h-12 l-6 9 h-10 l-4 -9 h-8 z" fill="#2f3a2b"/></g>
<rect x="16" y="420" width="368" height="76" rx="10" fill="#f6ddd0" stroke="#e8590c" stroke-width="2.5"/>
<text x="26" y="444" font-size="15" font-weight="bold" fill="#23261f">5 WMAs: no camping, no fires</text>
<circle cx="368.0" cy="438" r="11" fill="#e8590c"/><path d="M363.6 433.6 L372.4 442.4 M372.4 433.6 L363.6 442.4" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
<text x="26" y="462" font-size="14" fill="#2f3a2b">Pitt Addington, Boundary Bay, Bert Brink,</text>
<text x="26" y="480" font-size="14" fill="#2f3a2b">Harrison Chehalis, Serpentine (99%).</text>
<rect x="16" y="506" width="368" height="116" rx="10" fill="#f3ead6" stroke="#6b4f35" stroke-width="2.5"/>
<text x="26" y="530" font-size="15" font-weight="bold" fill="#23261f">Campfire</text>
<circle cx="368.0" cy="524" r="11" fill="#4a7fb0"/><text x="368" y="528.62" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
<text x="26" y="548" font-size="14" fill="#2f3a2b">At most 0.5 m by 0.5 m. Water or a tool</text>
<text x="26" y="566" font-size="14" fill="#2f3a2b">ready. Check bans (99%).</text>
<g transform="translate(46.0 602) scale(0.62)"><path d="M0 -20 q14 14 6 26 q8 -6 6 -14 q10 14 -2 24 h-20 q-12 -10 -2 -24 q-2 8 6 14 q-8 -12 6 -26 z" fill="#e8590c"/><path d="M-16 20 l32 -6 M-16 14 l32 6" stroke="#6b4f35" stroke-width="4"/></g>
</svg>
