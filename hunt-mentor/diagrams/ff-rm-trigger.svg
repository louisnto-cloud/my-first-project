<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A graph of trigger pressure. Stage 1, take up: light slack. Stage 2, the wall: pressure rises and you squeeze through it. Stage 3, the break: the shot goes and you keep pressing to follow through. Sako lists a two stage trigger on the Arctic; most T3x rifles have a single stage trigger.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A two stage trigger</text><line x1="40" y1="200" x2="360" y2="200" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><rect x="40" y="180" width="120" height="20" rx="0" fill="#d8ead7" stroke="none" stroke-width="2"/><rect x="160" y="150" width="100" height="50" rx="0" fill="#f8e3cf" stroke="none" stroke-width="2"/><rect x="260" y="180" width="100" height="20" rx="0" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="100" y="172" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">1. Take up</text><text x="100" y="222" font-size="14" fill="#23261f" text-anchor="middle">light slack</text><text x="210" y="142" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">2. The wall</text><text x="210" y="240" font-size="14" fill="#23261f" text-anchor="middle">squeeze through</text><text x="318" y="172" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3. Break</text><text x="318" y="222" font-size="14" fill="#23261f" text-anchor="middle">keep pressing</text><path d="M40 196 L160 190 L165 160 L255 150 L262 196 L360 198" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="120" font-size="13" fill="#23261f" text-anchor="start">pressure</text><line x1="30" y1="190" x2="30" y2="128" stroke="#23261f" stroke-width="2" stroke-linecap="round"/><path d="M33.0 134.3 L30 128 L27.0 134.3" fill="none" stroke="#23261f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200.0" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle">Arctic: two stage per Sako. Most T3x: single stage.</text>
</svg>
