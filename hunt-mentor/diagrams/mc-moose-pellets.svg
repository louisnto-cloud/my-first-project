<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" font-family="sans-serif" role="img" aria-label="Moose droppings. In fall and winter: piles of oval pellets about 2.5 to 4 centimetres long that look like pressed sawdust. In summer: soft clumps or patties from green food. Small deer pellets shown for scale.">
<rect x="0" y="0" width="400" height="280" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Droppings: winter and summer</text><ellipse cx="70" cy="110" rx="10" ry="7" fill="#9a7a4a" stroke="#23261f"/><ellipse cx="92" cy="110" rx="10" ry="7" fill="#9a7a4a" stroke="#23261f"/><ellipse cx="114" cy="110" rx="10" ry="7" fill="#9a7a4a" stroke="#23261f"/><ellipse cx="136" cy="110" rx="10" ry="7" fill="#9a7a4a" stroke="#23261f"/><ellipse cx="70" cy="126" rx="10" ry="7" fill="#9a7a4a" stroke="#23261f"/><ellipse cx="92" cy="126" rx="10" ry="7" fill="#9a7a4a" stroke="#23261f"/><ellipse cx="114" cy="126" rx="10" ry="7" fill="#9a7a4a" stroke="#23261f"/><ellipse cx="136" cy="126" rx="10" ry="7" fill="#9a7a4a" stroke="#23261f"/><ellipse cx="70" cy="142" rx="10" ry="7" fill="#9a7a4a" stroke="#23261f"/><ellipse cx="92" cy="142" rx="10" ry="7" fill="#9a7a4a" stroke="#23261f"/><text x="110" y="170" font-size="14" fill="#23261f" text-anchor="middle">Fall and winter</text><text x="110" y="187" font-size="14" fill="#23261f" text-anchor="middle">oval pellets, 2.5 to 4 cm</text><text x="110" y="204" font-size="14" fill="#23261f" text-anchor="middle">like pressed sawdust</text><path d="M260 120 Q300 90 340 120 Q350 140 300 146 Q250 140 260 120 Z" fill="#5a4026" stroke="#23261f"/><text x="300" y="170" font-size="14" fill="#23261f" text-anchor="middle">Summer</text><text x="300" y="187" font-size="14" fill="#23261f" text-anchor="middle">soft clumps, patties</text><text x="300" y="204" font-size="14" fill="#23261f" text-anchor="middle">green food, wet</text><ellipse cx="170" cy="250" rx="4" ry="3" fill="#8b5a2b"/><ellipse cx="180" cy="250" rx="4" ry="3" fill="#8b5a2b"/><ellipse cx="190" cy="250" rx="4" ry="3" fill="#8b5a2b"/><ellipse cx="200" cy="250" rx="4" ry="3" fill="#8b5a2b"/><text x="260" y="255" font-size="14" fill="#6b4f35" text-anchor="start">deer pellets for scale</text>
</svg>
