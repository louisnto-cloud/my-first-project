<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 354" font-family="sans-serif" role="img" aria-label="Three surfaces under the same noon sun in mid October near Kamloops, sun about 30 degrees up from the south, on the left. A south face tilted 30 degrees toward the sun gets about 87 percent strength. Flat ground gets 50 percent. A north face tilted 30 degrees away gets almost none, 0 percent: the rays skim past it. A 30 degree north slope gets almost no noon sun.">
<rect width="400" height="354" fill="#fffaf0"/>
<defs><clipPath id="rl-sa-sun-angle-c0"><rect x="10" y="92" width="124" height="128" rx="8"/></clipPath><clipPath id="rl-sa-sun-angle-c1"><rect x="138" y="92" width="124" height="128" rx="8"/></clipPath><clipPath id="rl-sa-sun-angle-c2"><rect x="266" y="92" width="124" height="128" rx="8"/></clipPath><marker id="rl-sa-sun-angle-ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L11 5 L0 10z" fill="#f2a516"/></marker></defs>
<text x="14" y="28" font-size="19" font-weight="bold" fill="#2f3a2b">Same sun, three slopes</text>
<text x="386" y="28" font-size="15" fill="#6b5b4b" text-anchor="end">noon, mid October</text>
