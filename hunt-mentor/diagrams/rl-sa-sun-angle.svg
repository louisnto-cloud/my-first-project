<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three surfaces under the same noon sun in mid October near Kamloops, sun about 30 degrees up from the south. A south face tilted 30 degrees toward the sun gets about 87 percent strength. Flat ground gets 50 percent. A north face tilted 30 degrees away gets almost none. Caption: a 30 degree north slope gets almost no noon sun.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Same sun, three slopes</text><text x="388" y="24" font-size="14" fill="#2f3a2b" text-anchor="end">noon, mid October</text><path d="M40 70 L92 100" stroke="#e8a20c" stroke-width="2.5" stroke-linecap="round" fill="none"/><path d="M92 100 L80.0 99.1 L85.2 90.1 Z" fill="#e8a20c"/><path d="M160 70 L212 100" stroke="#e8a20c" stroke-width="2.5" stroke-linecap="round" fill="none"/><path d="M212 100 L200.0 99.1 L205.2 90.1 Z" fill="#e8a20c"/><path d="M280 70 L332 100" stroke="#e8a20c" stroke-width="2.5" stroke-linecap="round" fill="none"/><path d="M332 100 L320.0 99.1 L325.2 90.1 Z" fill="#e8a20c"/><path d="M40 193 L120 147" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><rect x="40" y="236" width="80" height="16" rx="4" fill="#eee"/><rect x="40" y="236" width="69" height="16" rx="4" fill="#f2c70c"/><text x="80" y="230" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">South face 30°</text><text x="80" y="272" font-size="13" fill="#2f3a2b" text-anchor="middle">87% strength</text><path d="M154 170 L246 170" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><rect x="160" y="236" width="80" height="16" rx="4" fill="#eee"/><rect x="160" y="236" width="40" height="16" rx="4" fill="#f2c70c"/><text x="200" y="230" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Flat ground</text><text x="200" y="272" font-size="13" fill="#2f3a2b" text-anchor="middle">50% strength</text><path d="M280 147 L360 193" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><rect x="280" y="236" width="80" height="16" rx="4" fill="#eee"/><rect x="280" y="236" width="0" height="16" rx="4" fill="#f2c70c"/><text x="320" y="230" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">North face 30°</text><text x="320" y="272" font-size="13" fill="#2f3a2b" text-anchor="middle">0% strength</text>
  <text x="200" y="60" font-size="13" fill="#2f3a2b" text-anchor="middle">Sun 30 degrees up, from the south (left)</text>
  <text x="200" y="292" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A 30° north slope gets almost no noon sun</text>
</svg>
