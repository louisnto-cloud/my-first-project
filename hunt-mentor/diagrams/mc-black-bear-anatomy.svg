<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Cutaway of a black bear from the side. Lungs fill the front of the chest behind the shoulder. The heart sits low in the chest, just behind the elbow. A thin muscle wall, the diaphragm, separates the chest from the belly. Behind it are the liver, one simple stomach, and the gut. A thick fat layer lies under the hide, thickest in fall.">
