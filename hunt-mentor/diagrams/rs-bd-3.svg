<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 3: look for pellets and urine. Deer often drop pellets when they stand up. Mixed age pellets mean a bed used again and again.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3. Pellets and urine</text>
<ellipse cx="200" cy="140" rx="110" ry="46" fill="#e0d4b0" stroke="#6b4f35" stroke-width="2" stroke-dasharray="6 5"/><ellipse cx="300" cy="130" rx="2.6" ry="3.4" fill="#6b4f35"/><ellipse cx="306" cy="130" rx="2.6" ry="3.4" fill="#6b4f35"/><ellipse cx="312" cy="130" rx="2.6" ry="3.4" fill="#6b4f35"/><ellipse cx="300" cy="136" rx="2.6" ry="3.4" fill="#6b4f35"/><ellipse cx="306" cy="136" rx="2.6" ry="3.4" fill="#6b4f35"/><ellipse cx="312" cy="136" rx="2.6" ry="3.4" fill="#6b4f35"/><circle cx="200" cy="140" r="18" fill="#d8c27a" opacity=".8"/><text x="200" y="220" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Pellets beside it, urine stain?</text><text x="200" y="248" font-size="15" fill="#23261f" text-anchor="middle">Pellets: it stood up and stretched (Tip)</text><text x="200" y="272" font-size="15" fill="#6b4f35" text-anchor="middle">Mixed ages: a bed used often (Tip)</text>
</svg>
