<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" font-family="sans-serif" role="img" aria-label="Cougar kill site: blood in one spot where the kill happened, a drag mark into cover, and the carcass cached and neatly covered with needles, leaves or snow. The cougar is close and will come back.">
<rect x="0" y="0" width="400" height="296" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cougar kill: drag and cache</text>
<rect x="0" y="60" width="400" height="200" rx="0" fill="#e9efe0"/><path d="M260 60 H400 V260 H240 Q280 160 260 60 Z" fill="#b9c99a"/><g transform="translate(380 110) scale(0.7)"><rect x="-3" y="-10" width="6" height="12" fill="#6b4f35"/><path d="M0 -50 L16 -10 L-16 -10 Z" fill="#8a9a6b"/></g><g transform="translate(375 240) scale(0.7)"><rect x="-3" y="-10" width="6" height="12" fill="#6b4f35"/><path d="M0 -50 L16 -10 L-16 -10 Z" fill="#8a9a6b"/></g><circle cx="70" cy="200" r="9" fill="#c62828" opacity=".7"/><text x="70" y="230" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">kill: blood in</text><text x="70" y="246" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">one spot</text><path d="M80 200 Q160 190 300 170" fill="none" stroke="#6b4f35" stroke-width="3" stroke-dasharray="8 5"/><text x="180" y="176" font-size="14" font-weight="bold" fill="#6b4f35" text-anchor="middle">drag to cover</text><ellipse cx="305" cy="168" rx="40" ry="18" fill="#8a7a55"/><line x1="280" y1="160" x2="286" y2="172" stroke="#5f5236" stroke-width="2"/><line x1="288" y1="160" x2="294" y2="172" stroke="#5f5236" stroke-width="2"/><line x1="296" y1="160" x2="302" y2="172" stroke="#5f5236" stroke-width="2"/><line x1="304" y1="160" x2="310" y2="172" stroke="#5f5236" stroke-width="2"/><line x1="312" y1="160" x2="318" y2="172" stroke="#5f5236" stroke-width="2"/><line x1="320" y1="160" x2="326" y2="172" stroke="#5f5236" stroke-width="2"/><line x1="328" y1="160" x2="334" y2="172" stroke="#5f5236" stroke-width="2"/><text x="305" y="120" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">cached:</text><text x="305" y="136" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">covered neatly</text><text x="200" y="286" font-size="15" font-weight="bold" fill="#c62828" text-anchor="middle">Owner is close and coming back (75%)</text>
</svg>
