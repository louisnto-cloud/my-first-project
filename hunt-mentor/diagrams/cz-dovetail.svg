" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="282" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><text x="42" y="282" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Ring clamp jaws</text><circle cx="26" cy="301" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="306" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text><text x="42" y="306" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Dovetail grooves on the receiver</text><circle cx="26" cy="325" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="330" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text><text x="42" y="330" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Bolt inside the receiver</text><text x="16" y="362" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Weaver rail is the other option (CZ).</text></svg>
