<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Track stick step 1: on two clear tracks, set one rubber band at the step length and one at the stride length.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1. Set the stick</text>
<rect x="0" y="100" width="400" height="140" rx="0" fill="#e9e2cf"/><g transform="translate(80 190) rotate(90) scale(0.8)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><g transform="translate(160 150) rotate(90) scale(0.8)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><g transform="translate(240 190) rotate(90) scale(0.8)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><line x1="80" y1="220" x2="240" y2="220" stroke="#6b4f35" stroke-width="6"/><rect x="158" y="212" width="6" height="16" rx="2" fill="#e8590c"/><rect x="236" y="212" width="6" height="16" rx="2" fill="#4a7fb0"/><text x="160" y="262" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">step</text><text x="240" y="262" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">stride</text><text x="200" y="80" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Set the bands on clear tracks</text>
</svg>
