<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A map with bedding cover in the middle and a feeding area below. With wind 1 blowing from the left, use seat A on the right, downwind of the beds, reached by a dashed route. With wind 2 from the right, use seat B on the left. Plan a seat downwind of the beds for each likely wind.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Plan an A and a B seat</text><rect x="14" y="42" width="372" height="236" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><ellipse cx="200" cy="140" rx="46" ry="30" fill="#b9c7a3" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="145" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">beds</text><rect x="60" y="220" width="280" height="40" rx="6" fill="#e9dfa8"/><text x="200" y="245" font-size="15" fill="#6b4f35" text-anchor="middle" font-weight="bold">feed</text><line x1="30" y1="70" x2="90" y2="70" stroke="#4a7fb0" stroke-width="3"/><polygon points="90.0,70.0 81.0,74.3 81.0,65.7" fill="#4a7fb0"/><text x="30" y="92" font-size="14" fill="#4a7fb0" text-anchor="start">wind 1</text><line x1="370" y1="70" x2="310" y2="70" stroke="#4a7fb0" stroke-width="3"/><polygon points="310.0,70.0 319.0,65.7 319.0,74.3" fill="#4a7fb0"/><text x="370" y="92" font-size="14" fill="#4a7fb0" text-anchor="end">wind 2</text><circle cx="330" cy="160" r="14" fill="#e8590c"/><text x="330" y="165" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">A</text><text x="330" y="194" font-size="14" fill="#23261f" text-anchor="middle">seat A</text><circle cx="70" cy="160" r="14" fill="#4a7fb0"/><text x="70" y="165" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">B</text><text x="70" y="194" font-size="14" fill="#23261f" text-anchor="middle">seat B</text><path d="M346 270 Q 360 210 336 176" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="6 5"/><path d="M54 270 Q 40 210 64 176" fill="none" stroke="#4a7fb0" stroke-width="2" stroke-dasharray="6 5"/><text x="200" y="294" font-size="14" fill="#6b4f35" text-anchor="middle">Seat downwind of the beds for each wind (Tip)</text>
</svg>
