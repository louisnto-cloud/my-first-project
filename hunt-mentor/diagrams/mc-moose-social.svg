<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four cards on moose social life. Mostly alone, with no herd and no year round pecking order. The only lasting bond is cow and calf, for about one year, until the cow chases it off before her next calf in May. In the rut cows gather near a prime bull and choose their mate. In winter small groups gather at good food but have no real social bond.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A loner with one bond</text><rect x="14" y="40" width="182" height="112" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="105" y="66" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Mostly alone</text><text x="105" y="96" font-size="14" fill="#23261f" text-anchor="middle">no herd, no year round</text><text x="105" y="116" font-size="14" fill="#23261f" text-anchor="middle">pecking order</text><rect x="204" y="40" width="182" height="112" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="295" y="66" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Cow and calf</text><text x="295" y="96" font-size="14" fill="#23261f" text-anchor="middle">the one bond: 1 year</text><text x="295" y="116" font-size="14" fill="#23261f" text-anchor="middle">cow chases it off in May</text><rect x="14" y="160" width="182" height="112" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="105" y="186" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Rut</text><text x="105" y="216" font-size="14" fill="#23261f" text-anchor="middle">cows gather near a prime</text><text x="105" y="236" font-size="14" fill="#23261f" text-anchor="middle">bull; cows choose</text><rect x="204" y="160" width="182" height="112" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="295" y="186" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Winter</text><text x="295" y="216" font-size="14" fill="#23261f" text-anchor="middle">small groups at good food</text><text x="295" y="236" font-size="14" fill="#23261f" text-anchor="middle">no real social bond</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">BC moose account, 2000 (90%)</text>
</svg>
