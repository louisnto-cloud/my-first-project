<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Patterning step 2: measure 40 yards, about 37 metres, the standard distance. Then also try your real hunting range.">
<rect width="400" height="300" fill="#EEF1EA"/>
<circle cx="24" cy="22" r="15" fill="#1F3D2B"/><text x="24" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="46" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Pace off the distance</text>
<rect x="20" y="150" width="360" height="6" fill="#8a9a6b"/>
<rect x="330" y="96" width="34" height="54" fill="#ffffff" stroke="#1F3D2B" stroke-width="2"/>
<circle cx="347" cy="123" r="4" fill="#FF6A13"/>
<path d="M30 150 l14 -26 l10 0 l10 26 Z" fill="#1F3D2B"/>
<line x1="70.0" y1="180.0" x2="319.0" y2="180.0" stroke="#1F3D2B" stroke-width="3" stroke-linecap="round"/><path d="M326.0 180.0 L317.0 184.3 L317.0 175.7Z" fill="#1F3D2B"/>
<line x1="326.0" y1="180.0" x2="77.0" y2="180.0" stroke="#1F3D2B" stroke-width="3" stroke-linecap="round"/><path d="M70.0 180.0 L79.0 175.7 L79.0 184.3Z" fill="#1F3D2B"/>
<rect x="104.0" y="196.0" width="192.0" height="24.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="200.0" y="214.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">40 yd (37 m) standard</text>
<rect x="97.2" y="230.0" width="205.5" height="24.0" rx="5" fill="#ffffff" stroke="#FF6A13" stroke-width="1.3"/><text x="200.0" y="248.0" font-size="15" font-weight="bold" fill="#FF6A13" text-anchor="middle">or your real range: 35 m</text>
<text x="200.0" y="290.0" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Use a rangefinder or a tape.</text>
