<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" role="img" aria-label="Four wild sheep of BC in a grid. Top row, bighorn, heavy brown horns in a close curl. Rocky Mountain bighorn: brown with a white rump, East Kootenay and the Rockies. California bighorn: darker, horns flare more, Okanagan, Thompson, Fraser and Chilcotin. Bottom row, thinhorn, slimmer horns that flare wide. Stone&#x27;s sheep: dark grey to black, northern BC. Dall&#x27;s sheep: pure white with golden horns, far northwest only." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="430" fill="#fffaf0"/>
<text x="200" y="24" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Bighorn: heavy horns, close curl</text>
<text x="200" y="246" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Thinhorn: slimmer horns, flare wide</text>
<line x1="200" y1="34" x2="200" y2="222" stroke="#8a9a6b" stroke-dasharray="6 6" stroke-width="2"/>
<line x1="200" y1="258" x2="200" y2="420" stroke="#8a9a6b" stroke-dasharray="6 6" stroke-width="2"/>
<line x1="10" y1="226" x2="390" y2="226" stroke="#8a9a6b" stroke-dasharray="6 6" stroke-width="2"/>
<g transform="translate(110 100) scale(1.0)"><rect x="-28" y="8" width="7" height="30" fill="#8b5a2b" stroke="#23261f"/><rect x="-12" y="10" width="7" height="28" fill="#8b5a2b" stroke="#23261f"/><rect x="20" y="10" width="7" height="28" fill="#8b5a2b" stroke="#23261f"/><rect x="32" y="8" width="7" height="30" fill="#8b5a2b" stroke="#23261f"/><ellipse cx="8" cy="0" rx="40" ry="20" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><ellipse cx="42" cy="2" rx="8" ry="14" fill="#ffffff"/><path d="M-24,-8 L-38,-28 L-56,-24 L-62,-14 L-44,-10 L-30,4 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><circle cx="-44" cy="-22" r="2" fill="#23261f"/><path d="M-34,-30 C-12,-48 10,-28 -6,-12 C-16,-4 -28,-8 -30,-18" fill="none" stroke="#23261f" stroke-width="13" stroke-linecap="round"/><path d="M-34,-30 C-12,-48 10,-28 -6,-12 C-16,-4 -28,-8 -30,-18" fill="none" stroke="#6b4f35" stroke-width="10" stroke-linecap="round"/></g>
<text x="100" y="158" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Rocky Mountain bighorn</text>
<text x="100" y="176" font-size="14" fill="#23261f" text-anchor="middle">Brown, white rump</text>
<text x="100" y="194" font-size="14" fill="#23261f" text-anchor="middle">East Kootenay, Rockies</text>
<g transform="translate(310 100) scale(1.0)"><rect x="-28" y="8" width="7" height="30" fill="#6e4a2a" stroke="#23261f"/><rect x="-12" y="10" width="7" height="28" fill="#6e4a2a" stroke="#23261f"/><rect x="20" y="10" width="7" height="28" fill="#6e4a2a" stroke="#23261f"/><rect x="32" y="8" width="7" height="30" fill="#6e4a2a" stroke="#23261f"/><ellipse cx="8" cy="0" rx="40" ry="20" fill="#6e4a2a" stroke="#23261f" stroke-width="1.5"/><ellipse cx="42" cy="2" rx="8" ry="14" fill="#ffffff"/><path d="M-24,-8 L-38,-28 L-56,-24 L-62,-14 L-44,-10 L-30,4 Z" fill="#6e4a2a" stroke="#23261f" stroke-width="1.5"/><circle cx="-44" cy="-22" r="2" fill="#23261f"/><path d="M-34,-30 C-12,-48 10,-28 -6,-12 C-16,-4 -28,-8 -30,-18" fill="none" stroke="#23261f" stroke-width="13" stroke-linecap="round"/><path d="M-34,-30 C-12,-48 10,-28 -6,-12 C-16,-4 -28,-8 -30,-18" fill="none" stroke="#6b4f35" stroke-width="10" stroke-linecap="round"/></g>
<text x="300" y="158" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">California bighorn</text>
<text x="300" y="176" font-size="14" fill="#23261f" text-anchor="middle">Darker, horns flare more</text>
<text x="300" y="194" font-size="14" fill="#23261f" text-anchor="middle">Okanagan, Thompson,</text>
<text x="300" y="212" font-size="14" fill="#23261f" text-anchor="middle">Fraser, Chilcotin</text>
<g transform="translate(110 314) scale(1.0)"><rect x="-28" y="8" width="7" height="30" fill="#45474a" stroke="#23261f"/><rect x="-12" y="10" width="7" height="28" fill="#45474a" stroke="#23261f"/><rect x="20" y="10" width="7" height="28" fill="#45474a" stroke="#23261f"/><rect x="32" y="8" width="7" height="30" fill="#45474a" stroke="#23261f"/><ellipse cx="8" cy="0" rx="40" ry="20" fill="#45474a" stroke="#23261f" stroke-width="1.5"/><ellipse cx="42" cy="2" rx="8" ry="14" fill="#ffffff"/><path d="M-24,-8 L-38,-28 L-56,-24 L-62,-14 L-44,-10 L-30,4 Z" fill="#45474a" stroke="#23261f" stroke-width="1.5"/><circle cx="-44" cy="-22" r="2" fill="#23261f"/><path d="M-34,-30 C-10,-50 12,-30 -2,-12 C-10,-2 -26,0 -40,-10" fill="none" stroke="#23261f" stroke-width="10" stroke-linecap="round"/><path d="M-34,-30 C-10,-50 12,-30 -2,-12 C-10,-2 -26,0 -40,-10" fill="none" stroke="#c9a24a" stroke-width="7" stroke-linecap="round"/></g>
<text x="100" y="372" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Stone&#x27;s (thinhorn)</text>
<text x="100" y="390" font-size="14" fill="#23261f" text-anchor="middle">Dark grey to black</text>
<text x="100" y="408" font-size="14" fill="#23261f" text-anchor="middle">Northern BC</text>
<g transform="translate(310 314) scale(1.0)"><rect x="-28" y="8" width="7" height="30" fill="#ffffff" stroke="#23261f"/><rect x="-12" y="10" width="7" height="28" fill="#ffffff" stroke="#23261f"/><rect x="20" y="10" width="7" height="28" fill="#ffffff" stroke="#23261f"/><rect x="32" y="8" width="7" height="30" fill="#ffffff" stroke="#23261f"/><ellipse cx="8" cy="0" rx="40" ry="20" fill="#ffffff" stroke="#23261f" stroke-width="1.5"/><ellipse cx="42" cy="2" rx="8" ry="14" fill="#ffffff"/><path d="M-24,-8 L-38,-28 L-56,-24 L-62,-14 L-44,-10 L-30,4 Z" fill="#ffffff" stroke="#23261f" stroke-width="1.5"/><circle cx="-44" cy="-22" r="2" fill="#23261f"/><path d="M-34,-30 C-10,-50 12,-30 -2,-12 C-10,-2 -26,0 -40,-10" fill="none" stroke="#23261f" stroke-width="10" stroke-linecap="round"/><path d="M-34,-30 C-10,-50 12,-30 -2,-12 C-10,-2 -26,0 -40,-10" fill="none" stroke="#d9b44a" stroke-width="7" stroke-linecap="round"/></g>
<text x="300" y="372" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Dall&#x27;s (thinhorn)</text>
<text x="300" y="390" font-size="14" fill="#23261f" text-anchor="middle">Pure white,</text>
<text x="300" y="408" font-size="14" fill="#23261f" text-anchor="middle">golden horns</text>
<text x="300" y="426" font-size="14" fill="#23261f" text-anchor="middle">Far northwest only</text>
</svg>
