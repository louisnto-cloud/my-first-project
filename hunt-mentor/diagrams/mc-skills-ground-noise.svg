<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A bar chart of how loud ground is underfoot, a hunter tip ranking, loudest first: dry leaves, crusty snow, gravel and shale, dry sticks; quieter: game trails, soft snow; quietest: wet moss and grass.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Loud or quiet ground? (Tip)</text><text x="150" y="66" font-size="14" fill="#23261f" text-anchor="end">Dry leaves</text><rect x="160" y="52" width="216" height="20" rx="4" fill="#e8590c"/><text x="150" y="98" font-size="14" fill="#23261f" text-anchor="end">Crusty snow</text><rect x="160" y="84" width="192" height="20" rx="4" fill="#e8590c"/><text x="150" y="130" font-size="14" fill="#23261f" text-anchor="end">Gravel, shale</text><rect x="160" y="116" width="168" height="20" rx="4" fill="#e8590c"/><text x="150" y="162" font-size="14" fill="#23261f" text-anchor="end">Dry sticks</text><rect x="160" y="148" width="168" height="20" rx="4" fill="#e8590c"/><text x="150" y="194" font-size="14" fill="#23261f" text-anchor="end">Game trail</text><rect x="160" y="180" width="72" height="20" rx="4" fill="#8a9a6b"/><text x="150" y="226" font-size="14" fill="#23261f" text-anchor="end">Soft snow</text><rect x="160" y="212" width="48" height="20" rx="4" fill="#8a9a6b"/><text x="150" y="258" font-size="14" fill="#23261f" text-anchor="end">Wet moss, grass</text><rect x="160" y="244" width="24" height="20" rx="4" fill="#8a9a6b"/><text x="160" y="284" font-size="14" fill="#2f3a2b" text-anchor="start">quiet</text><text x="376" y="284" font-size="14" fill="#e8590c" text-anchor="end" font-weight="bold">loud</text>
</svg>
