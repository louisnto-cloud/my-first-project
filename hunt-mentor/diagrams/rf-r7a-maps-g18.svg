<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 691" font-family="sans-serif" role="img" aria-label="Maps G18 to G25, north and caribou, grouped by rule. Mountain goat closed areas: G18 Gleason Creek, MU 7-18; G21 Ospika River, MU 7-37; G23 Mitchell and Blanchet, MUs 7-27 and 7-28; G24 Driftwood, MU 7-27. Caribou: G22, caribou in Zone D of MU 7-39 only for Limited Entry Hunting (LEH) permit holders; G25, caribou hunting prohibited in parts of MUs 7-39 and 7-40. G20 Kennedy Siding: no hunting or shooting 1 September to 31 March, MU 7-23. G19 Monkman Lake Park area: open to hunting, MU 7-18.">
<rect width="400" height="691" fill="#fffaf0"/>
