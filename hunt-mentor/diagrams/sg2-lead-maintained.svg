<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Maintained lead: 1 start the muzzle ahead of the bird, 2 hold the same gap as you swing, 3 fire with the gap held and keep swinging.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Maintained lead</text>
<line x1="20" y1="90" x2="380" y2="90" stroke="#1F3D2B" stroke-width="2" stroke-dasharray="4 6"/>
<line x1="330.0" y1="90.0" x2="373.7" y2="90.0" stroke="#1F3D2B" stroke-width="2" stroke-linecap="round"/><path d="M380.0 90.0 L371.9 93.9 L371.9 86.1Z" fill="#1F3D2B"/>
<g transform="translate(150.0 122.0) scale(1.0)"><ellipse cx="0" cy="0" rx="13" ry="5" fill="#17201A"/><circle cx="13" cy="-2" r="4" fill="#17201A"/><path d="M17 -2 l6 1 l-6 2 Z" fill="#17201A"/><path d="M-4 -2 L4 -16 L8 -2 Z" fill="#17201A"/><path d="M-13 0 l-6 -3 l0 6 Z" fill="#17201A"/></g>
<circle cx="210" cy="120" r="7" fill="none" stroke="#1F3D2B" stroke-width="3"/>
<circle cx="26" cy="120" r="11" fill="#1F3D2B"/><text x="26" y="125.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="44.0" y="144.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Start ahead of the bird</text>
<g transform="translate(210.0 166.0) scale(1.0)"><ellipse cx="0" cy="0" rx="13" ry="5" fill="#17201A"/><circle cx="13" cy="-2" r="4" fill="#17201A"/><path d="M17 -2 l6 1 l-6 2 Z" fill="#17201A"/><path d="M-4 -2 L4 -16 L8 -2 Z" fill="#17201A"/><path d="M-13 0 l-6 -3 l0 6 Z" fill="#17201A"/></g>
<circle cx="270" cy="164" r="7" fill="none" stroke="#1F3D2B" stroke-width="3"/>
<circle cx="26" cy="164" r="11" fill="#1F3D2B"/><text x="26" y="169.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="44.0" y="188.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Hold the gap</text>
<g transform="translate(270.0 210.0) scale(1.0)"><ellipse cx="0" cy="0" rx="13" ry="5" fill="#17201A"/><circle cx="13" cy="-2" r="4" fill="#17201A"/><path d="M17 -2 l6 1 l-6 2 Z" fill="#17201A"/><path d="M-4 -2 L4 -16 L8 -2 Z" fill="#17201A"/><path d="M-13 0 l-6 -3 l0 6 Z" fill="#17201A"/></g>
<circle cx="330" cy="208" r="7" fill="none" stroke="#FF6A13" stroke-width="3"/>
<circle cx="26" cy="208" r="11" fill="#FF6A13"/><text x="26" y="213.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="44.0" y="232.0" font-size="14" font-weight="bold" fill="#FF6A13" text-anchor="start">Fire, keep swinging</text>
<text x="200.0" y="290.0" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">For long crossers. Needs practice.</text>
</svg>
