<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="GPS works with no cell signal. Satellites talk to the phone directly, shown with a tick. The cell tower is crossed out. But the map tiles only show if you downloaded them at home first.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <g fill="#4a7fb0"><rect x="40" y="30" width="24" height="16"/><rect x="20" y="34" width="18" height="8"/><rect x="66" y="34" width="18" height="8"/>
  <rect x="180" y="16" width="24" height="16"/><rect x="160" y="20" width="18" height="8"/><rect x="206" y="20" width="18" height="8"/></g>
  <g stroke="#4a7fb0" stroke-width="2" stroke-dasharray="5 5"><line x1="52" y1="50" x2="140" y2="160"/><line x1="192" y1="36" x2="160" y2="160"/></g>
  <text x="70" y="96" font-size="15" font-weight="bold" fill="#4a7fb0">satellites: free</text>
  <rect x="128" y="160" width="44" height="76" rx="8" fill="#2f3a2b"/><rect x="134" y="170" width="32" height="54" fill="#dfe6d3"/>
  <circle cx="150" cy="198" r="5" fill="#e8590c"/>
  <path d="M190 190 l12 12 l22 -26" fill="none" stroke="#2f6e3b" stroke-width="5"/>
  <g transform="translate(320 120)"><path d="M0 -60 L-20 40 M0 -60 L20 40 M-14 10 L14 10 M-8 -20 L8 -20" stroke="#2f3a2b" stroke-width="3" fill="none"/>
  <path d="M-30 -40 L30 30 M30 -40 L-30 30" stroke="#c0392b" stroke-width="5"/></g>
  <text x="320" y="186" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">no cell? fine</text>
  <rect x="12" y="250" width="376" height="42" rx="8" fill="#e8590c"/>
  <text x="200" y="277" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">But download the map at home first</text>
</svg>
