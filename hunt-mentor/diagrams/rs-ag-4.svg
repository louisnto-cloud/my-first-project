<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 4: write it down. Ground, weather, which control print matched, and an age range: about 4 to 8 hours old.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4. Write a range</text>
<rect x="30" y="70" width="340" height="150" rx="10" fill="#fff" stroke="#23261f" stroke-width="1.5"/><text x="50" y="102" font-size="16" fill="#23261f" text-anchor="start">Ground: dry clay, shade</text><text x="50" y="132" font-size="16" fill="#23261f" text-anchor="start">Weather: frost, then sun</text><text x="50" y="162" font-size="16" fill="#23261f" text-anchor="start">My print at 6 h = theirs</text><text x="50" y="192" font-size="16" fill="#23261f" text-anchor="start">Call: about 4 to 8 h old</text><text x="200" y="260" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Write the range, and why</text>
</svg>
