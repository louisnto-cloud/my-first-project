<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="sans-serif" role="img" aria-label="A moose with sound waves spreading out. A cow moose rutting moan can be heard up to 3 kilometres away. The big ears turn toward sound. Calls carry best on calm, cool days.">
