<rect x="8" y="150" width="384" height="50" rx="7" fill="#f4eedf"/>
<circle cx="30" cy="175.0" r="15" fill="#6b4f35"/><text x="30" y="180" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">31</text>
<g transform="translate(72 175.0) scale(0.8)"><circle r="16" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -20 V-6 M0 6 V20 M-20 0 H-6 M6 0 H20" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
