<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 462" font-family="sans-serif" role="img" aria-label="The shot: rules 29 to 35. Rule 29: No vital, no shot. Rule 30: Rest the rifle. Offhand: 50 m. Rule 31: Know your limit. Winded? Halve it. Rule 32: Reload and keep watching. Rule 33: Broadside or quartering away. Rule 34: Never at an unhit running deer. Rule 35: Never at a sound or shape. Also law. Rules without the law badge are wisdom, not law.">
<rect width="400" height="462" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The shot: rules 29 to 35</text>
