<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 444" font-family="sans-serif" role="img" aria-label="The shot: rules 29 to 35. Rule 29: No vital, no shot. Rule 30: Rest the rifle. Offhand: 50 m. Rule 31: Know your limit. Winded? Halve it. Rule 32: Reload and keep watching. Rule 33: Broadside or quartering away. Rule 34: Never at an unhit running deer. Rule 35: Never at a sound or shape. Also law. Rules without the law badge are wisdom, not law.">
<rect x="0" y="0" width="400" height="444" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">The shot: rules 29 to 35</text><rect x="10" y="44" width="185" height="84" rx="10" fill="#fff" stroke="#e8590c" stroke-width="2"/><circle cx="28" cy="62" r="14" fill="#e8590c"/><text x="28" y="67" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">29</text><g transform="translate(36 100) scale(0.8)"><circle r="18" fill="#e8590c"/><path d="M-7 -7 l14 14 M7 -7 l-14 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g><text x="64" y="66" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">No vital, no</text><text x="64" y="83" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">shot</text><rect x="205" y="44" width="185" height="84" rx="10" fill="#fff" stroke="#e8590c" stroke-width="2"/><circle cx="223" cy="62" r="14" fill="#e8590c"/><text x="223" y="67" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">30</text><g transform="translate(231 100) scale(0.8)"><path d="M-22 4 L-6 0 L20 -2 L20 2 L-4 6 L-10 12 L-22 12 Z" fill="#8b5a2b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -2 h12" stroke="#2f3a2b" stroke-width="4"/></g><text x="259" y="66" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Rest the rifle.</text><text x="259" y="83" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Offhand: 50 m</text><rect x="10" y="136" width="185" height="84" rx="10" fill="#fff" stroke="#e8590c" stroke-width="2"/><circle cx="28" cy="154" r="14" fill="#e8590c"/><text x="28" y="159" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">31</text><g transform="translate(36 192) scale(0.8)"><circle r="16" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -20 V-6 M0 6 V20 M-20 0 H-6 M6 0 H20" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="64" y="158" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Know your limit.</text><text x="64" y="175" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Winded? Halve it</text><rect x="205" y="136" width="185" height="84" rx="10" fill="#fff" stroke="#e8590c" stroke-width="2"/><circle cx="223" cy="154" r="14" fill="#e8590c"/><text x="223" y="159" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">32</text><g transform="translate(231 192) scale(0.8)"><path d="M-20 0 Q0 -16 20 0 Q0 16 -20 0 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle r="6" fill="#2f3a2b"/></g><text x="259" y="158" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Reload and keep</text><text x="259" y="175" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">watching</text><rect x="10" y="228" width="185" height="84" rx="10" fill="#fff" stroke="#e8590c" stroke-width="2"/><circle cx="28" cy="246" r="14" fill="#e8590c"/><text x="28" y="251" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">33</text><g transform="translate(36 284) scale(0.8)"><ellipse cx="2" cy="2" rx="15" ry="8" fill="#8b5a2b"/><path d="M-10 8 v12 M-4 8 v12 M8 8 v12 M14 8 v12" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/><path d="M-12 -2 L-18 -12" stroke="#8b5a2b" stroke-width="6" stroke-linecap="round"/><ellipse cx="-20" cy="-14" rx="6" ry="4" fill="#8b5a2b"/><path d="M-19 -18 l-2 -8 m2 4 l4 -5 M-17 -18 l3 -6" stroke="#6b4f35" stroke-width="2" fill="none" stroke-linecap="round"/></g><text x="64" y="250" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Broadside or</text><text x="64" y="267" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">quartering away</text><rect x="205" y="228" width="185" height="84" rx="10" fill="#fff" stroke="#e8590c" stroke-width="2"/><circle cx="223" cy="246" r="14" fill="#e8590c"/><text x="223" y="251" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">34</text><g transform="translate(231 284) scale(0.8)"><circle r="18" fill="#e8590c"/><path d="M-7 -7 l14 14 M7 -7 l-14 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g><text x="259" y="250" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Never at an</text><text x="259" y="267" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">unhit running</text><text x="259" y="284" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">deer</text><rect x="10" y="320" width="185" height="84" rx="10" fill="#eef3f8" stroke="#4a7fb0" stroke-width="2"/><circle cx="28" cy="338" r="14" fill="#e8590c"/><text x="28" y="343" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">35</text><g transform="translate(36 376) scale(0.8)"><path d="M-6 16 Q-14 -2 -4 -14 Q8 -22 12 -8 Q14 2 4 6 Q0 10 2 16 Z" fill="#f2d6c0" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="64" y="342" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Never at a sound</text><text x="64" y="359" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">or shape</text><rect x="141" y="380" width="48" height="20" rx="10" fill="#4a7fb0"/><text x="165" y="395" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">LAW</text><rect x="20" y="414" width="48" height="20" rx="10" fill="#4a7fb0"/><text x="44" y="429" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">LAW</text><text x="76" y="429" font-size="14" fill="#23261f" text-anchor="start">also law. The rest is wisdom (Tip).</text>
