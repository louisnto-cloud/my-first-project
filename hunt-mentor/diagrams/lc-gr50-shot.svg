<text x="104" y="343" font-size="16" font-weight="bold" fill="#2f3a2b">Never at an unhit running deer</text>
<rect x="8" y="366" width="384" height="50" rx="7" fill="#eef3f8" stroke="#4a7fb0" stroke-width="1.6"/>
<circle cx="30" cy="391.0" r="15" fill="#6b4f35"/><text x="30" y="396" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">35</text>
