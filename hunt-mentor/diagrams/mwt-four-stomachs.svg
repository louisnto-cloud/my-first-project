<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Flow chart of deer digestion. The mouth nips buds and twigs. Food goes to chamber 1, the rumen, where microbes ferment it, and chamber 2, the reticulum, which sends cud back up. The deer chews the cud lying down. Then food passes to chamber 3, the omasum, which squeezes out water, and chamber 4, the abomasum, the true stomach." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">Four stomach chambers</text><rect x="20" y="50" width="170" height="58" rx="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2.5"/><text x="105" y="74" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Mouth</text><text x="105" y="94" font-size="14" fill="#23261f" text-anchor="middle">nips buds, twigs</text><rect x="210" y="50" width="170" height="58" rx="10" fill="#fffaf0" stroke="#e8590c" stroke-width="2.5"/><text x="295" y="74" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">1 Rumen</text><text x="295" y="94" font-size="14" fill="#23261f" text-anchor="middle">microbes ferment</text><rect x="210" y="140" width="170" height="58" rx="10" fill="#fffaf0" stroke="#e8590c" stroke-width="2.5"/><text x="295" y="164" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">2 Reticulum</text><text x="295" y="184" font-size="14" fill="#23261f" text-anchor="middle">sorts, sends cud up</text><rect x="20" y="140" width="170" height="58" rx="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2.5"/><text x="105" y="164" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Chews cud</text><text x="105" y="184" font-size="14" fill="#23261f" text-anchor="middle">lying down</text><rect x="20" y="222" width="170" height="58" rx="10" fill="#fffaf0" stroke="#e8590c" stroke-width="2.5"/><text x="105" y="246" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">3 Omasum</text><text x="105" y="266" font-size="14" fill="#23261f" text-anchor="middle">squeezes water</text><rect x="210" y="222" width="170" height="58" rx="10" fill="#fffaf0" stroke="#e8590c" stroke-width="2.5"/><text x="295" y="246" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">4 Abomasum</text><text x="295" y="266" font-size="14" fill="#23261f" text-anchor="middle">true stomach</text><line x1="190" y1="79" x2="206" y2="79" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="206.0,79.0 197.9,82.9 197.9,75.1" fill="#e8590c"/><line x1="295" y1="108" x2="295" y2="136" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="295.0,136.0 291.1,127.9 298.9,127.9" fill="#e8590c"/><line x1="208" y1="169" x2="194" y2="169" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="194.0,169.0 202.1,165.1 202.1,172.9" fill="#e8590c"/><line x1="105" y1="198" x2="105" y2="218" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="105.0,218.0 101.1,209.9 108.9,209.9" fill="#e8590c"/><line x1="190" y1="251" x2="206" y2="251" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="206.0,251.0 197.9,254.9 197.9,247.1" fill="#e8590c"/><text x="200" y="296" font-size="14" fill="#6b4f35" text-anchor="middle">Swallow, ferment, chew again, digest.</text>
</svg>
