<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Hunt Map terrain tool frame: Slope steepness colours the ground by angle. Gentle valley floor and benches suit quail and Huns. Steep slopes of 30 to 45 degrees with rock suit chukar. Tip: use it to find chukar ground and to avoid slopes too steep to walk safely.">
