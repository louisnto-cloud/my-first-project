<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 338" font-family="sans-serif" role="img" aria-label="Pick one load in four steps: 1 buy one box each of two loads with 150 to 165 grain hunting bullets; 2 shoot three groups of three at 100 metres from the bench with a cool barrel; 3 keep the load that groups tighter and feeds and ejects cleanly; 4 buy three to four boxes from the same lot, zero with it and hunt with it. Change loads and you must zero again.">
<rect x="0" y="0" width="400" height="338" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Pick one load in 4 steps</text><rect x="12" y="42" width="376" height="54" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="34" cy="69" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="74" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="56" y="65" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">Buy 1 box each of 2 loads</text><text x="56" y="84" font-size="14" fill="#17201A" text-anchor="start">150 to 165 gr hunting bullets</text><line x1="34" y1="96" x2="34.0" y2="99.2" stroke="#1F3D2B" stroke-width="2" stroke-linecap="round"/><path d="M34 104 L31.4 98.6 L36.6 98.6z" fill="#1F3D2B"/><rect x="12" y="104" width="376" height="54" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="34" cy="131" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="136" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="56" y="127" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">3 groups of 3 at 100 m</text><text x="56" y="146" font-size="14" fill="#17201A" text-anchor="start">from the bench, cool barrel</text><line x1="34" y1="158" x2="34.0" y2="161.2" stroke="#1F3D2B" stroke-width="2" stroke-linecap="round"/><path d="M34 166 L31.4 160.6 L36.6 160.6z" fill="#1F3D2B"/><rect x="12" y="166" width="376" height="54" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="34" cy="193" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="198" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="56" y="189" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">Keep the tighter, reliable one</text><text x="56" y="208" font-size="14" fill="#17201A" text-anchor="start">it must feed and eject clean</text><line x1="34" y1="220" x2="34.0" y2="223.2" stroke="#1F3D2B" stroke-width="2" stroke-linecap="round"/><path d="M34 228 L31.4 222.6 L36.6 222.6z" fill="#1F3D2B"/><rect x="12" y="228" width="376" height="54" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="34" cy="255" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="260" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="56" y="251" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">Buy 3 to 4 boxes, same lot</text><text x="56" y="270" font-size="14" fill="#17201A" text-anchor="start">zero with it, hunt with it</text><rect x="12" y="292" width="376" height="34" rx="6" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="200" y="314" font-size="14" fill="#17201A" text-anchor="middle">Change loads? Zero again.</text>
</svg>
