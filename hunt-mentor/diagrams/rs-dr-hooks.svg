<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 292" font-family="sans-serif" role="img" aria-label="Memory hooks. S S C P A: shape, size, contents, place, age. Taper means dog family, blunt means cat, a pile never covered means bear. Thumb wide is wolf, finger wide is coyote; about 2.5 cm is the line.">
<rect x="0" y="0" width="400" height="292" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Memory hooks</text>
<rect x="20" y="60" width="360" height="66" rx="10" fill="#dfe6d3"/><text x="200" y="88" font-size="22" font-weight="bold" fill="#e8590c" text-anchor="middle">S S C P A</text><text x="200" y="112" font-size="14" fill="#23261f" text-anchor="middle">Shape, Size, Contents, Place, Age</text><rect x="20" y="136" width="360" height="66" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="200" y="164" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Taper: dog family. Blunt: cat.</text><text x="200" y="188" font-size="14" fill="#23261f" text-anchor="middle">Pile and never covered: bear</text><rect x="20" y="212" width="360" height="66" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="200" y="240" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Thumb wide: wolf. Finger: coyote.</text><text x="200" y="264" font-size="14" fill="#23261f" text-anchor="middle">About 2.5 cm is the line</text>
</svg>
