<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Card of old hand&#x27;s rules, opinion from hunting educators and articles, not law. 1 Listen first, walk second. 2 Stop often: the stop flushes them. 3 Get above chukar, always. 4 Mark the bird, not the covey. 5 Three birds from a covey: move on. 6 A low bird is a free bird.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Old hand&#x27;s rules (opinion)</text>
<rect x="10" y="40" width="380" height="32" rx="8" fill="#dfe6d3"/>
<circle cx="32" cy="57" r="12" fill="#e8590c"/>
<text x="32" y="61" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="54" y="61" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Listen first, walk second</text>
<rect x="10" y="78" width="380" height="32" rx="8" fill="#dfe6d3"/>
<circle cx="32" cy="95" r="12" fill="#e8590c"/>
<text x="32" y="99" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="54" y="99" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Stop often. The stop flushes them</text>
<rect x="10" y="116" width="380" height="32" rx="8" fill="#dfe6d3"/>
<circle cx="32" cy="133" r="12" fill="#e8590c"/>
<text x="32" y="137" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="54" y="137" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Get above chukar, always</text>
<rect x="10" y="154" width="380" height="32" rx="8" fill="#dfe6d3"/>
<circle cx="32" cy="171" r="12" fill="#e8590c"/>
<text x="32" y="175" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<text x="54" y="175" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Mark the bird, not the covey</text>
<rect x="10" y="192" width="380" height="32" rx="8" fill="#dfe6d3"/>
<circle cx="32" cy="209" r="12" fill="#e8590c"/>
<text x="32" y="213" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
<text x="54" y="213" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Three birds from a covey: move on</text>
<rect x="10" y="230" width="380" height="32" rx="8" fill="#dfe6d3"/>
<circle cx="32" cy="247" r="12" fill="#e8590c"/>
<text x="32" y="251" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
<text x="54" y="251" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">A low bird is a free bird</text>
<text x="200" y="292" font-size="14" fill="#2f3a2b" text-anchor="middle">From hunting educators and articles, not law</text>
</svg>
