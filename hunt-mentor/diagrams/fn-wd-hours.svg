<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A clear October day timeline, labelled Tip. Slopes: downslope at night, a calm switch around sunrise, upslope from about 8 to 4:30, a calm switch at shade, then downslope again. Valley: down valley until about mid morning, up valley until early evening, then down valley.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="32" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">A clear October day (75%, Tip)</text><line x1="40" y1="60" x2="40" y2="250" stroke="#868e96" stroke-width="1" stroke-linecap="round"/><text x="78" y="272" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">6</text><text x="135" y="272" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">9</text><text x="192" y="272" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">noon</text><text x="249" y="272" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">3</text><text x="306" y="272" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">6</text><text x="363" y="272" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">9 pm</text><text x="20" y="72" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Slopes</text><rect x="40" y="80" width="66.5" height="36" rx="4" fill="#4a7fb0" stroke="none" stroke-width="0"/><text x="73.25" y="104" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">down</text><rect x="106.5" y="80" width="13.299999999999983" height="36" rx="4" fill="#cccccc" stroke="none" stroke-width="0"/><rect x="119.79999999999998" y="80" width="157.70000000000002" height="36" rx="4" fill="#e8590c" stroke="none" stroke-width="0"/><text x="198.64999999999998" y="104" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">up</text><rect x="277.5" y="80" width="15.200000000000045" height="36" rx="4" fill="#cccccc" stroke="none" stroke-width="0"/><rect x="292.70000000000005" y="80" width="89.29999999999995" height="36" rx="4" fill="#4a7fb0" stroke="none" stroke-width="0"/><text x="337.35" y="104" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">down</text><text x="20" y="152" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Valley</text><rect x="40" y="160" width="114" height="36" rx="4" fill="#4a7fb0" stroke="none" stroke-width="0"/><text x="97.0" y="184" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">down valley</text><rect x="154" y="160" width="161.5" height="36" rx="4" fill="#e8590c" stroke="none" stroke-width="0"/><text x="234.75" y="184" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">up valley</text><rect x="315.5" y="160" width="66.5" height="36" rx="4" fill="#4a7fb0" stroke="none" stroke-width="0"/><text x="348.75" y="184" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">down</text><text x="20" y="295" font-family="sans-serif" font-size="13" fill="#868e96" text-anchor="start">Times shift with sunrise, aspect and cloud. Check on the day.</text>
</svg>
