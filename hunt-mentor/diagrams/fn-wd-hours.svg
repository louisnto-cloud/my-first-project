<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A clear October day timeline, labelled Tip. Slopes: downslope at night, a calm switch around sunrise, upslope from about 8 to 4:30, a calm switch at shade, then downslope again. Valley: down valley until about mid morning, up valley until early evening, then down valley.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="32" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">A clear October day (75%, Tip)</text><line x1="40" y1="60" x2="40" y2="250" stroke="#868e96" stroke-width="1" stroke-linecap="round"/><text x="80" y="272" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">6</text><text x="140" y="272" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">9</text><text x="200" y="272" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">noon</text><text x="260" y="272" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">3</text><text x="320" y="272" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">6</text><text x="380" y="272" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">9 pm</text><text x="20" y="72" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Slopes</text><rect x="40" y="80" width="70.0" height="36" rx="4" fill="#4a7fb0" stroke="none" stroke-width="0"/><text x="75.0" y="104" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">down</text><rect x="110.0" y="80" width="13.999999999999986" height="36" rx="4" fill="#cccccc" stroke="none" stroke-width="0"/><text x="117.0" y="104" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">calm</text><rect x="123.99999999999999" y="80" width="166.0" height="36" rx="4" fill="#e8590c" stroke="none" stroke-width="0"/><text x="207.0" y="104" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">up</text><rect x="290.0" y="80" width="16.0" height="36" rx="4" fill="#cccccc" stroke="none" stroke-width="0"/><rect x="306.0" y="80" width="104.0" height="36" rx="4" fill="#4a7fb0" stroke="none" stroke-width="0"/><text x="358.0" y="104" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">down</text><text x="20" y="152" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Valley</text><rect x="40" y="160" width="120" height="36" rx="4" fill="#4a7fb0" stroke="none" stroke-width="0"/><text x="100.0" y="184" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">down valley</text><rect x="160" y="160" width="170.0" height="36" rx="4" fill="#e8590c" stroke="none" stroke-width="0"/><text x="245.0" y="184" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">up valley</text><rect x="330.0" y="160" width="80.0" height="36" rx="4" fill="#4a7fb0" stroke="none" stroke-width="0"/><text x="370.0" y="184" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">down</text><text x="20" y="295" font-family="sans-serif" font-size="13" fill="#868e96" text-anchor="start">Times shift with sunrise, aspect and cloud. Check on the day.</text>
</svg>
