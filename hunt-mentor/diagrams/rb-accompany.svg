<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="Two hunters standing apart. To accompany means staying in the other person&#x27;s company, able to see them with your own eyes, ordinary glasses allowed but no binoculars, and able to talk by plain unamplified voice, no radio." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="280" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#23261f" text-anchor="middle" font-weight="bold">Accompany: what it means</text>
<rect x="0" y="40" width="400" height="160" fill="#dfe6d3"/>
<g transform="translate(90 150) scale(2.0)"><circle cx="0" cy="-16" r="7" fill="#2f3a2b"/><path d="M-8 -6 L8 -6 L6 14 L-6 14 Z" fill="#2f3a2b"/></g><g transform="translate(310 150) scale(2.0)"><circle cx="0" cy="-16" r="7" fill="#e8590c"/><path d="M-8 -6 L8 -6 L6 14 L-6 14 Z" fill="#e8590c"/></g>
<line x1="104" y1="116" x2="296" y2="116" stroke="#4a7fb0" stroke-width="3" stroke-dasharray="8 6"/>
<text x="200" y="106" font-size="15" fill="#4a7fb0" text-anchor="middle" font-weight="bold">sees with own eyes</text>
<rect x="120" y="136" width="160" height="40" rx="14" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="162" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">talks: plain voice</text>
<text x="14" y="226" font-size="15" fill="#23261f" text-anchor="start">Glasses are fine. Binoculars are not.</text>
<text x="14" y="247" font-size="15" fill="#23261f" text-anchor="start">No radio. Stay in each other&#x27;s company.</text>
</svg>
