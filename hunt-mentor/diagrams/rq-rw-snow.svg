<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Fresh snow scene. A line of deer tracks shows how many and which way. A melted oval shows where a deer bedded. A yellow urine spot. A small hole with wing marks where a grouse roosted under the snow.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">After fresh snow, read everything</text>
<rect x="0" y="40" width="400" height="260" fill="#ffffff"/>
<rect x="0" y="40" width="400" height="260" fill="#e9eef2" opacity=".5"/>
<ellipse cx="40" cy="250" rx="4" ry="6" fill="#9aa6b2"/>
