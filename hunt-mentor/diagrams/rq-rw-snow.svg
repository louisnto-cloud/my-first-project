<ellipse cx="280" cy="138" rx="4" ry="6" fill="#9aa6b2"/>
<text x="70" y="280" font-family="sans-serif" font-size="13" font-weight="bold" fill="#23261f" text-anchor="start">trail: count, direction</text>
<ellipse cx="320" cy="110" rx="34" ry="16" fill="#cfd8c0" stroke="#9aa6b2"/><text x="320" y="84" font-family="sans-serif" font-size="13" font-weight="bold" fill="#23261f" text-anchor="middle">bed: melted oval</text>
