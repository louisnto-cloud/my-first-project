<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 436" font-family="sans-serif" role="img" aria-label="Thermometer chart of cooking temperatures in degrees Celsius. 71: all wild game, ground meat and bear, the Canadian Food Inspection Agency food safety number, 95 percent. 74: game birds, 80 percent. 77: bear per Washington, 80 percent. 60 to 63: deer loin as many hunters cook it, a personal risk and not a safe number. Bear: never pink.">
<rect x="0" y="0" width="400" height="436" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Cooking temperatures, °C</text><rect x="58" y="50" width="24" height="340" rx="12" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/><circle cx="70" cy="402" r="20" fill="#b3261e" stroke="#2f3a2b" stroke-width="2.5"/><rect x="65" y="92" width="10" height="298" fill="#b3261e"/><line x1="82" y1="380" x2="92" y2="380" stroke="#2f3a2b" stroke-width="2"/><text x="52" y="385.0" font-size="13" fill="#23261f" text-anchor="end">50</text><line x1="82" y1="327" x2="92" y2="327" stroke="#2f3a2b" stroke-width="2"/><text x="52" y="331.6666666666667" font-size="13" fill="#23261f" text-anchor="end">55</text><line x1="82" y1="273" x2="92" y2="273" stroke="#2f3a2b" stroke-width="2"/><text x="52" y="278.3333333333333" font-size="13" fill="#23261f" text-anchor="end">60</text><line x1="82" y1="220" x2="92" y2="220" stroke="#2f3a2b" stroke-width="2"/><text x="52" y="225.0" font-size="13" fill="#23261f" text-anchor="end">65</text><line x1="82" y1="167" x2="92" y2="167" stroke="#2f3a2b" stroke-width="2"/><text x="52" y="171.66666666666666" font-size="13" fill="#23261f" text-anchor="end">70</text><line x1="82" y1="113" x2="92" y2="113" stroke="#2f3a2b" stroke-width="2"/><text x="52" y="118.33333333333331" font-size="13" fill="#23261f" text-anchor="end">75</text><line x1="82" y1="60" x2="92" y2="60" stroke="#2f3a2b" stroke-width="2"/><text x="52" y="65.0" font-size="13" fill="#23261f" text-anchor="end">80</text><line x1="82" y1="92" x2="110" y2="92" stroke="#8b5a2b" stroke-width="3"/><rect x="112" y="77.0" width="268" height="30" rx="8" fill="#fff" stroke="#8b5a2b" stroke-width="2"/><text x="122" y="97.0" font-size="14" fill="#8b5a2b" text-anchor="start">Bear: 77°C per Washington (80%)</text><line x1="82" y1="124" x2="110" y2="124" stroke="#4a7fb0" stroke-width="3"/><rect x="112" y="109.0" width="268" height="30" rx="8" fill="#fff" stroke="#4a7fb0" stroke-width="2"/><text x="122" y="129.0" font-size="14" fill="#4a7fb0" text-anchor="start">Game birds: 74°C (80%)</text><line x1="82" y1="156" x2="110" y2="156" stroke="#e8590c" stroke-width="3"/><rect x="112" y="141.0" width="268" height="30" rx="8" fill="#fff" stroke="#e8590c" stroke-width="2"/><text x="122" y="161.0" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="start">All wild game, ground, bear: 71°C</text><line x1="82" y1="257" x2="110" y2="257" stroke="#7a7a7a" stroke-width="3"/><rect x="112" y="242.33333333333331" width="268" height="30" rx="8" fill="#fff" stroke="#7a7a7a" stroke-width="2"/><text x="122" y="262.3333333333333" font-size="14" fill="#7a7a7a" text-anchor="start">Deer loin, 60 to 63°C: many hunters</text><text x="246" y="188.0" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="middle">Canadian food safety number (95%)</text><text x="246" y="289.3333333333333" font-size="13" fill="#7a7a7a" text-anchor="middle">Your risk, not a safe number. Lean.</text><text x="246" y="307.3333333333333" font-size="13" font-weight="bold" fill="#b3261e" text-anchor="middle">Bear: never.</text>
</svg>
