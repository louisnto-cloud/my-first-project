<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 254" role="img" aria-label="Four cards. Island black bears are uniformly black. A brown coloured bear on the Island is likely a grizzly: there is no open season in BC, do not shoot. Report it to the Nanaimo office, 250 751 7220, or the 24 hour line, 1 877 952 7277. Grizzlies have been seen on northern Vancouver Island in recent years." font-family="sans-serif">
<rect x="0" y="0" width="400" height="254" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Brown bear on the Island?</text>
<rect x="6" y="40" width="190" height="96" rx="10" fill="#ffffff" stroke="#5c7a3a" stroke-width="2.5"/>
<path d="M6 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#5c7a3a"/>
<text x="101" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Island black bear</text>
<ellipse cx="30.0" cy="98" rx="15" ry="9" fill="#2f3a2b"/><circle cx="44.0" cy="92" r="6" fill="#2f3a2b"/><circle cx="42.0" cy="86" r="2.5" fill="#2f3a2b"/>
<text x="52" y="88" font-size="14" fill="#23261f" text-anchor="start">Uniformly black</text>
<rect x="204" y="40" width="190" height="96" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M204 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#c92a2a"/>
<text x="299" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Brown coloured bear</text>
<ellipse cx="228.0" cy="98" rx="15" ry="9" fill="#2f3a2b"/><circle cx="242.0" cy="92" r="6" fill="#2f3a2b"/><circle cx="240.0" cy="86" r="2.5" fill="#2f3a2b"/>
<circle cx="228.0" cy="96" r="18" fill="none" stroke="#c92a2a" stroke-width="3"/><line x1="215.0" y1="109" x2="241.0" y2="83" stroke="#c92a2a" stroke-width="3"/>
<text x="250" y="88" font-size="14" fill="#23261f" text-anchor="start">Likely a grizzly.</text>
<text x="250" y="106" font-size="14" fill="#23261f" text-anchor="start">No open season in</text>
<text x="250" y="124" font-size="14" fill="#23261f" text-anchor="start">BC. Do not shoot</text>
<rect x="6" y="144" width="190" height="96" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
<path d="M6 154 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#2f3a2b"/>
<text x="101" y="162" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Report it</text>
<rect x="22.0" y="185" width="16" height="30" rx="3" fill="#2f3a2b"/><rect x="25.0" y="189" width="10" height="18" fill="#ffffff"/>
<text x="52" y="192" font-size="14" fill="#23261f" text-anchor="start">Nanaimo office 250</text>
<text x="52" y="210" font-size="14" fill="#23261f" text-anchor="start">751 7220, or 1 877</text>
<text x="52" y="228" font-size="14" fill="#23261f" text-anchor="start">952 7277, 24 hours</text>
<rect x="204" y="144" width="190" height="96" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
<path d="M204 154 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#2f3a2b"/>
<text x="299" y="162" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Why</text>
<text x="212" y="192" font-size="14" fill="#23261f" text-anchor="start">Grizzly sightings on</text>
<text x="212" y="210" font-size="14" fill="#23261f" text-anchor="start">northern Vancouver</text>
<text x="212" y="228" font-size="14" fill="#23261f" text-anchor="start">Island in recent years</text>
</svg>
