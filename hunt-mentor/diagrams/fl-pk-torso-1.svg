<circle cx="30" cy="32" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="30" y="39" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">1</text>
<text x="56" y="39" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="start">Find the neck bump</text>
<circle cx="200" cy="82" r="20" fill="#e9c9a8" stroke="#6b4f35" stroke-width="2"/><rect x="140" y="104" width="120" height="140" rx="30" fill="#e9c9a8" stroke="#6b4f35" stroke-width="2"/><line x1="200" y1="104" x2="200" y2="240" stroke="#6b4f35" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><circle cx="200" cy="108" r="9" fill="#e8590c"/><line x1="300" y1="108" x2="214" y2="108" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><polygon points="214.0,108.0 223.0,103.7 223.0,112.3" fill="#e8590c"/><text x="306" y="114" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Bump</text>
<rect x="10" y="262" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="285.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Tilt the head forward. Find the bump.</text>
