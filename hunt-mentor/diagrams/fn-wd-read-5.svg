<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="If the wind is steady, commit. If it swirls, back out to plan B.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c" stroke="none" stroke-width="2"/><text x="26" y="32" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">5</text><text x="52" y="32" font-family="sans-serif" font-size="18" fill="#2f3a2b" text-anchor="start" font-weight="bold">Commit or go to plan B</text><rect x="40" y="100" width="140" height="60" rx="8" fill="#e8f2e0" stroke="#8a9a6b" stroke-width="2"/><text x="110" y="136" font-family="sans-serif" font-size="16" fill="#8a9a6b" text-anchor="middle" font-weight="bold">Steady: go</text><rect x="220" y="100" width="140" height="60" rx="8" fill="#fde2d6" stroke="#e8590c" stroke-width="2"/><text x="290" y="136" font-family="sans-serif" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">Swirl: plan B</text><text x="20" y="270" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Steady wind: go. Swirl: back out</text>
</svg>
