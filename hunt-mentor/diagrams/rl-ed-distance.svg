<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of how far from cover animals feed. California quail seldom go more than 15 to 30 m from cover. Mule deer habitat needs security and thermal cover within about 200 m of feeding areas. At night, animals feed farther out, a tip. Caption: daylight feeding hugs the edge.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">How far from cover?</text><path d="M60 250 H390" stroke="#2f3a2b" stroke-width="2"/><rect x="20" y="70" width="40" height="180" fill="#a9b68e"/><text x="40" y="62" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">cover</text><text x="60" y="268" font-size="12" fill="#2f3a2b" text-anchor="middle">0</text><text x="170" y="268" font-size="12" fill="#2f3a2b" text-anchor="middle">100 m</text><text x="280" y="268" font-size="12" fill="#2f3a2b" text-anchor="middle">200 m</text><text x="390" y="268" font-size="12" fill="#2f3a2b" text-anchor="middle">300 m</text><rect x="60" y="100" width="12" height="26" rx="4" fill="#a8c83a"/><text x="80" y="118" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Quail: seldom past 15 to 30 m</text><rect x="60" y="150" width="220" height="26" rx="4" fill="#8b5a2b" opacity=".85"/><text x="70" y="168" font-size="14" font-weight="bold" fill="#fff" text-anchor="start">Mule deer: cover within 200 m</text><rect x="60" y="200" width="330" height="26" rx="4" fill="#8a9a6b" opacity=".5"/><text x="70" y="218" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Night: feed farther out (Tip)</text><text x="200" y="292" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Daylight feeding hugs the edge</text>
</svg>
