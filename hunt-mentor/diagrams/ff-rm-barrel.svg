<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A barrel cut open from back to front: the chamber that holds the round, the throat where the bullet jumps to the rifling, the bore with spiral rifling that spins the bullet, and the muzzle with its crown. Your Arctic barrel is 20 inches, 508 mm.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The barrel, back to front</text><rect x="30" y="120" width="340" height="40" rx="4" fill="#9a9e96" stroke="#2f3a2b" stroke-width="2"/><rect x="30" y="126" width="70" height="28" rx="0" fill="#c9a227" stroke="#2f3a2b" stroke-width="1.5"/><path d="M100 128 L118 136 L118 144 L100 152 Z" fill="#d9cbb0" stroke="#2f3a2b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><line x1="118" y1="140" x2="360" y2="140" stroke="#fffaf0" stroke-width="8" stroke-linecap="round"/><line x1="130" y1="134" x2="140" y2="146" stroke="#6b4f35" stroke-width="1.5" stroke-linecap="round"/><line x1="148" y1="134" x2="158" y2="146" stroke="#6b4f35" stroke-width="1.5" stroke-linecap="round"/><line x1="166" y1="134" x2="176" y2="146" stroke="#6b4f35" stroke-width="1.5" stroke-linecap="round"/><line x1="184" y1="134" x2="194" y2="146" stroke="#6b4f35" stroke-width="1.5" stroke-linecap="round"/><line x1="202" y1="134" x2="212" y2="146" stroke="#6b4f35" stroke-width="1.5" stroke-linecap="round"/><line x1="220" y1="134" x2="230" y2="146" stroke="#6b4f35" stroke-width="1.5" stroke-linecap="round"/><line x1="238" y1="134" x2="248" y2="146" stroke="#6b4f35" stroke-width="1.5" stroke-linecap="round"/><line x1="256" y1="134" x2="266" y2="146" stroke="#6b4f35" stroke-width="1.5" stroke-linecap="round"/><line x1="274" y1="134" x2="284" y2="146" stroke="#6b4f35" stroke-width="1.5" stroke-linecap="round"/><line x1="292" y1="134" x2="302" y2="146" stroke="#6b4f35" stroke-width="1.5" stroke-linecap="round"/><line x1="310" y1="134" x2="320" y2="146" stroke="#6b4f35" stroke-width="1.5" stroke-linecap="round"/><line x1="328" y1="134" x2="338" y2="146" stroke="#6b4f35" stroke-width="1.5" stroke-linecap="round"/><line x1="346" y1="134" x2="356" y2="146" stroke="#6b4f35" stroke-width="1.5" stroke-linecap="round"/><rect x="352" y="116" width="24" height="48" rx="3" fill="#6b6f68" stroke="#2f3a2b" stroke-width="1.5"/><line x1="65" y1="120" x2="65" y2="101" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="65" y="83" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Chamber</text><text x="65" y="99" font-size="13" fill="#23261f" text-anchor="middle">holds the round</text><line x1="118" y1="160" x2="118" y2="180" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="118" y="196" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Throat</text><text x="118" y="212" font-size="13" fill="#23261f" text-anchor="middle">bullet jumps here</text><line x1="240" y1="120" x2="240" y2="101" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="240" y="83" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Bore with rifling</text><text x="240" y="99" font-size="13" fill="#23261f" text-anchor="middle">spins the bullet</text><line x1="364" y1="160" x2="310" y2="180" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><text x="310" y="196" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Muzzle, crown</text><text x="310" y="212" font-size="13" fill="#23261f" text-anchor="middle">keep it clean</text><text x="200.0" y="280" font-size="14" fill="#2f3a2b" text-anchor="middle">20 inch barrel, 508 mm (Sako spec)</text>
</svg>
