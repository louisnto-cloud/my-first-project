<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 749" font-family="sans-serif" role="img" aria-label="Bag limits from the Region 7B season table, pages 62 and 63. NBL means No Bag Limit; 10 (30) means 10 a day and 30 in possession. Moose 1, elk 1, bighorn sheep 1, thinhorn sheep 1, mountain goat 1, bison 1, wolverine 1, lynx 1. Black bear 2, cougar 2, wolf 3, coyote no bag limit, snowshoe hare 10 a day. Dusky, spruce and ruffed grouse and ptarmigan 10 (30). Sharp tailed grouse 3 (6). Raven 5. Ducks 8 (24). Canada and cackling geese, snipe and coots 10 (30). Snow, Ross&#x27;s and white fronted geese 5 (15).">
<rect width="400" height="749" fill="#fffaf0"/>
<text x="14" y="23" font-size="14" font-weight="bold" fill="#6b5b4b">Pages 62, 63. NBL: No Bag Limit.</text>
<text x="14" y="42" font-size="14" font-weight="bold" fill="#6b5b4b">10 (30): 10 a day, 30 in possession.</text>
