<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 324" font-family="sans-serif" role="img" aria-label="Three rules that stop a .22 near Mission. Shot only areas, such as within 150 m of Highway 7 east of Mission, allow a shotgun only, no rifle. No shooting areas such as Map B12 Buntzen Lake allow no discharge at all. In or on any vehicle the chamber and the magazine must be empty; a magazine in the rifle counts as loaded."><rect x="0" y="0" width="400" height="324" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Where the .22 must stay quiet</text><rect x="12" y="44" width="376" height="74" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="2"/><text x="28" y="70" font-size="16" font-weight="bold" text-anchor="start" fill="#FF6A13">Shot only area</text><text x="28" y="94" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Shotgun only. No .22, no rifle.</text><text x="28" y="112" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Hwy 7 east of Mission: 150 m</text><rect x="12" y="128" width="376" height="74" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="28" y="154" font-size="16" font-weight="bold" text-anchor="start" fill="#1F3D2B">No shooting area</text><text x="28" y="178" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">No firearm discharge at all.</text><text x="28" y="196" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Map B12 Buntzen Lake and more</text><rect x="12" y="212" width="376" height="74" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="28" y="238" font-size="16" font-weight="bold" text-anchor="start" fill="#1F3D2B">Any vehicle</text><text x="28" y="262" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Chamber AND magazine empty.</text><text x="28" y="280" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Mag in the rifle = loaded</text><text x="16" y="312" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Region 2 page 27, Closed Areas Regulation (99%).</text></svg>
