<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Camp in bear country: keep the tent at least 100 metres from where you cook and from where food and meat hang, and never keep food in the tent.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Camp: the 100 m triangle</text><rect x="0" y="40" width="400" height="260" rx="0" fill="#dfe6d3"/><polygon points="70,250 100,200 130,250" fill="#e8590c"/><text x="100" y="272" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Tent</text><rect x="300" y="70" width="40" height="40" rx="6" fill="#ffffff" stroke="#9a9a8f" stroke-width="2"/><line x1="260" y1="66" x2="380" y2="66" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><text x="320" y="130" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Food, meat</text><text x="320" y="148" font-size="14" fill="#2f3a2b" text-anchor="middle">hung</text><path d="M291 250 Q288 235 300 222 Q312 235 309 250 Z" fill="#e8590c"/><path d="M296 250 Q294 242 300 234 Q306 242 304 250 Z" fill="#f6c344"/><text x="300" y="276" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cook</text><line x1="120" y1="220" x2="290" y2="110" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><text x="190" y="150" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">100 m</text><line x1="140" y1="250" x2="280" y2="250" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><text x="210" y="240" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">100 m</text>
</svg>
