<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four panels of a deer seen at 100, 200, 300 and 400 m, smaller each time. At 100 m you see eyes, ears and antler tines; at 200 m ears and legs are clear; at 300 m the body shape and thin legs; at 400 m only a brown shape. These are tips: build your own pictures by ranging real deer.">
