<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Crossing a fence alone in 4 steps. 1: unload, action open. 2: slide the rifle under the fence, muzzle pointed away from where you will cross. 3: cross the fence away from the muzzle. 4: pick the rifle up by the stock and check the barrel is clear of mud or snow before you reload.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
  <g fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2">
    <rect x="8" y="8" width="188" height="138" rx="8"/><rect x="204" y="8" width="188" height="138" rx="8"/>
    <rect x="8" y="154" width="188" height="138" rx="8"/><rect x="204" y="154" width="188" height="138" rx="8"/>
  </g>
  <g font-family="sans-serif" font-size="22" font-weight="bold" fill="#e8590c">
    <text x="18" y="34">1</text><text x="214" y="34">2</text><text x="18" y="180">3</text><text x="214" y="180">4</text>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#23261f">
    <text x="40" y="34">Unload, open</text><text x="236" y="34">Under, muzzle away</text>
    <text x="40" y="180">Cross away from it</text><text x="236" y="180">Check the barrel</text>
  </g>
  <!-- panel 1: rifle with open bolt and 3 rounds out -->
  <rect x="30" y="80" width="140" height="10" fill="#2f3a2b"/><rect x="40" y="88" width="60" height="18" rx="4" fill="#8b5a2b"/>
  <rect x="104" y="72" width="16" height="8" fill="#2f3a2b"/>
  <g fill="#e8590c"><rect x="60" y="118" width="8" height="18" rx="3"/><rect x="76" y="118" width="8" height="18" rx="3"/><rect x="92" y="118" width="8" height="18" rx="3"/></g>
  <!-- panel 2: fence and rifle on ground -->
  <g stroke="#6b4f35" stroke-width="3"><line x1="300" y1="50" x2="300" y2="140"/><line x1="230" y1="80" x2="380" y2="80"/><line x1="230" y1="105" x2="380" y2="105"/></g>
  <rect x="240" y="126" width="120" height="8" fill="#2f3a2b"/><rect x="240" y="122" width="40" height="14" rx="4" fill="#8b5a2b"/>
  <path d="M362 130 L384 130" stroke="#e8590c" stroke-width="3"/><path d="M378 124 L386 130 L378 136" fill="#e8590c"/>
  <!-- panel 3: person crossing -->
  <g stroke="#6b4f35" stroke-width="3"><line x1="100" y1="196" x2="100" y2="286"/><line x1="30" y1="226" x2="180" y2="226"/><line x1="30" y1="251" x2="180" y2="251"/></g>
  <circle cx="60" cy="214" r="9" fill="#2f3a2b"/><rect x="54" y="224" width="12" height="34" fill="#e8590c"/>
  <rect x="120" y="272" width="60" height="7" fill="#2f3a2b"/>
  <!-- panel 4: looking into barrel from breech -->
  <rect x="230" y="236" width="140" height="10" fill="#2f3a2b"/><rect x="240" y="244" width="50" height="18" rx="4" fill="#8b5a2b"/>
  <circle cx="370" cy="241" r="6" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/>
  <path d="M250 206 L360 236" stroke="#4a7fb0" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="246" cy="204" r="7" fill="#2f3a2b"/>
</svg>
