<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 396" font-family="sans-serif" role="img" aria-label="Scaling a deer vital zone of about 20 cm to a target at 50 m. A 10 cm dot at 50 m is the same angle as the vitals at 100 m, 5 cm is 200 m, 3.3 cm is 300 m and 2.5 cm is 400 m. Dot size equals 20 cm times 50 divided by the deer distance."><rect x="0" y="0" width="400" height="396" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Shrink the deer to 50 m</text><text x="16" y="56" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Deer vitals: about 20 to 25 cm (70%).</text><text x="16" y="78" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Same angle on a target at 50 m:</text><circle cx="70" cy="120" r="26.0" fill="#FF6A13"/><text x="130" y="126" font-size="16" font-weight="bold" text-anchor="start" fill="#17201A">10 cm dot</text><text x="250" y="126" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">= deer at 100 m</text><circle cx="70" cy="178" r="13.0" fill="#FF6A13"/><text x="130" y="184" font-size="16" font-weight="bold" text-anchor="start" fill="#17201A">5 cm dot</text><text x="250" y="184" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">= deer at 200 m</text><circle cx="70" cy="236" r="8.6" fill="#FF6A13"/><text x="130" y="242" font-size="16" font-weight="bold" text-anchor="start" fill="#17201A">3.3 cm dot</text><text x="250" y="242" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">= deer at 300 m</text><circle cx="70" cy="294" r="6.5" fill="#FF6A13"/><text x="130" y="300" font-size="16" font-weight="bold" text-anchor="start" fill="#17201A">2.5 cm dot</text><text x="250" y="300" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">= deer at 400 m</text><rect x="8" y="350" width="384" height="34" rx="9" fill="#1F3D2B"/><text x="200" y="372.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Dot size = 20 cm x 50 / deer distance</text></svg>
