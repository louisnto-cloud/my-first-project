<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="sans-serif" role="img" aria-label="Four cards. Free help: taking your brother along for nothing is fine, not guiding, this app reading at 90 percent. Paid help: taking pay or a promised reward to help someone hunt is guiding and needs a guide licence. Paid boat ride: running hunters to their spot by boat for money needs a transport licence. You pay them: if you pay an unlicensed guide, you can be charged with the same offence too.">
<rect width="400" height="420" fill="#fffaf0"/>
<text x="200" y="28" font-size="20" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Helping, or guiding?</text>
<g data-tip="1. Free help|Helping your brother for nothing is not guiding (this app's reading, 90%). Help for free, or not at all.">
<rect x="8" y="44" width="188" height="156" rx="10" fill="#fffaf0" stroke="#2f6e3b" stroke-width="2.4"/>
<path d="M8 54 a10 10 0 0 1 10 -10 H186 a10 10 0 0 1 10 10 V74 H8z" fill="#2f6e3b"/>
<text x="102" y="66" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">Free help</text>
<g transform="translate(102.0 104) scale(1.35) translate(-102.0 -104)">
<g transform="translate(92.0 108)" fill="#2f3a2b"><circle cx="-11" cy="-14" r="7"/><path d="M-22 12 C-22 -2 -18 -6 -11 -6 C-4 -6 0 -2 0 12z"/><circle cx="11" cy="-12" r="6"/><path d="M1 12 C1 0 4 -4 11 -4 C18 -4 21 0 21 12z"/></g><path transform="translate(132.0 94)" d="M0 6 C-10 -2 -10 -10 -5 -11 C-2 -12 0 -9 0 -7 C0 -9 2 -12 5 -11 C10 -10 10 -2 0 6z" fill="#c2410c"/>
</g>
<text x="102" y="150" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Your brother,</text>
<text x="102" y="170" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">for nothing:</text>
<text x="102" y="190" font-size="16" font-weight="bold" fill="#2f6e3b" text-anchor="middle">fine (90%)</text>
<circle cx="28" cy="59" r="11" fill="#fffaf0"/><text x="28" y="64.5" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1</text></g>
<g data-tip="2. Paid help|Going along to help someone hunt for pay or a promised reward is guiding. It needs a guide licence.">
<rect x="204" y="44" width="188" height="156" rx="10" fill="#fffaf0" stroke="#c92a2a" stroke-width="2.4"/>
<path d="M204 54 a10 10 0 0 1 10 -10 H382 a10 10 0 0 1 10 10 V74 H204z" fill="#c92a2a"/>
<text x="298" y="66" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">Paid help</text>
<g transform="translate(298.0 104) scale(1.35) translate(-298.0 -104)">
<g transform="translate(282.0 108)" fill="#2f3a2b"><circle cx="-11" cy="-14" r="7"/><path d="M-22 12 C-22 -2 -18 -6 -11 -6 C-4 -6 0 -2 0 12z"/><circle cx="11" cy="-12" r="6"/><path d="M1 12 C1 0 4 -4 11 -4 C18 -4 21 0 21 12z"/></g><g transform="translate(330.0 104)"><rect x="-16" y="-10" width="32" height="20" rx="3" fill="#5b8a4a"/><rect x="-13" y="-7" width="26" height="14" rx="2" fill="none" stroke="#d9ecd0" stroke-width="1.2"/><text x="0" y="5" font-size="14" font-weight="bold" fill="#eef7e8" text-anchor="middle">$</text></g>
</g>
<text x="298" y="170" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Guide licence</text>
<text x="298" y="190" font-size="16" font-weight="bold" fill="#c92a2a" text-anchor="middle">needed</text>
<circle cx="224" cy="59" r="11" fill="#fffaf0"/><text x="224" y="64.5" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">2</text></g>
<g data-tip="3. Paid boat ride|Carrying hunters to, from or between hunting spots for money makes you a transporter. It needs a transport or guide outfitter licence.">
<rect x="8" y="208" width="188" height="156" rx="10" fill="#fffaf0" stroke="#c92a2a" stroke-width="2.4"/>
<path d="M8 218 a10 10 0 0 1 10 -10 H186 a10 10 0 0 1 10 10 V238 H8z" fill="#c92a2a"/>
<text x="102" y="230" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">Paid boat ride</text>
<g transform="translate(102.0 268) scale(1.35) translate(-102.0 -268)">
<g transform="translate(90.0 268)" fill="#2f3a2b"><path d="M-24 0 H24 L17 12 H-17z"/><rect x="-8" y="-10" width="14" height="10" rx="2"/><path d="M-26 17 Q-13 12 0 17 T26 17" stroke="#4a7fb0" stroke-width="2.4" fill="none"/></g><g transform="translate(140.0 264)"><rect x="-16" y="-10" width="32" height="20" rx="3" fill="#5b8a4a"/><rect x="-13" y="-7" width="26" height="14" rx="2" fill="none" stroke="#d9ecd0" stroke-width="1.2"/><text x="0" y="5" font-size="14" font-weight="bold" fill="#eef7e8" text-anchor="middle">$</text></g>
</g>
<text x="102" y="330" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Transport licence</text>
<text x="102" y="350" font-size="16" font-weight="bold" fill="#c92a2a" text-anchor="middle">needed</text>
<circle cx="28" cy="223" r="11" fill="#fffaf0"/><text x="28" y="228.5" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3</text></g>
<g data-tip="4. You pay them|A person who uses an illegal guide can be charged and convicted of the same offence.">
<rect x="204" y="208" width="188" height="156" rx="10" fill="#fffaf0" stroke="#c92a2a" stroke-width="2.4"/>
<path d="M204 218 a10 10 0 0 1 10 -10 H382 a10 10 0 0 1 10 10 V238 H204z" fill="#c92a2a"/>
<text x="298" y="230" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">You pay them</text>
<g transform="translate(298.0 268) scale(1.35) translate(-298.0 -268)">
<g transform="translate(272.0 268)"><rect x="-16" y="-10" width="32" height="20" rx="3" fill="#5b8a4a"/><rect x="-13" y="-7" width="26" height="14" rx="2" fill="none" stroke="#d9ecd0" stroke-width="1.2"/><text x="0" y="5" font-size="14" font-weight="bold" fill="#eef7e8" text-anchor="middle">$</text></g><g transform="translate(324.0 268)" fill="none" stroke="#c92a2a" stroke-width="4"><circle cx="-10" cy="2" r="9"/><circle cx="12" cy="2" r="9"/><path d="M-2 -4 C0 -9 2 -9 4 -4" stroke-width="3"/></g>
</g>
<text x="298" y="330" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">You can be</text>
<text x="298" y="350" font-size="16" font-weight="bold" fill="#c92a2a" text-anchor="middle">charged too</text>
<circle cx="224" cy="223" r="11" fill="#fffaf0"/><text x="224" y="228.5" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4</text></g>
<g data-tip="5. Never block a hunter|No interfering with or blocking a person lawfully hunting, guiding or trapping. First there keeps the spot (Tip).">
<rect x="8" y="372" width="384" height="40" rx="10" fill="#2f3a2b"/>
<circle cx="28" cy="392" r="11" fill="#fffaf0"/><text x="28" y="397.5" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">5</text>
<text x="212" y="398" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Never block another legal hunter</text>
</g>
</svg>
