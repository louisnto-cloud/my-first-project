<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Category 1 campfire rules: no larger than 0.5 m high by 0.5 m wide, at least 8 litres of water or a hand tool on hand, a fuel break around it, never unattended, fully out before you leave. Check for bans first.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Campfire rules (Category 1)</text>
<rect x="10" y="214" width="210" height="10" rx="2" fill="#c9b79c"/>
<circle cx="130" cy="190" r="62" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M130 214 q-28.8 -28.8 0 -64.0 q28.8 35.2 0 64.0 z" fill="#e8590c" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 214 q-12.8 -16.0 0 -32.0 q12.8 16.0 0 32.0 z" fill="#f6c343" stroke="#f6c343" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="36" y1="150" x2="36" y2="214" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><text x="36" y="140" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">0.5 m</text>
<text x="130" y="286" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Fuel break all round</text>
<rect x="232" y="60" width="158" height="44" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="311" y="79" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">No bigger than</text><text x="311" y="97" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">0.5 m high, 0.5 m wide</text>
<rect x="232" y="110" width="158" height="44" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="311" y="129" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">8 L water or</text><text x="311" y="147" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">a hand tool, always</text>
<rect x="232" y="160" width="158" height="44" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="311" y="179" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Never leave it</text><text x="311" y="197" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">alone, not a minute</text>
<rect x="232" y="210" width="158" height="44" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="311" y="229" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Out cold</text><text x="311" y="247" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">before you leave</text>
</svg>
