<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 303" font-family="sans-serif" role="img" aria-label="Season bars for Region 3 deer, September to December, synopsis page 34 (99%). White tailed deer bucks: 10 September to 10 December. White tailed deer antlerless: 10 to 31 October. Mule deer bucks: 1 to 31 October. Mule deer 4 point bucks only: 1 November to 10 December. The class is the rule, not just the date. Units are listed in the synopsis rows.">
