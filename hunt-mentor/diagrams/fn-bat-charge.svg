<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A temperature bar for charging lithium ion batteries. Below 0 degrees: no charging. 0 to 5: slow charging only. 5 to 45: normal. Warm a cold phone or power bank inside your jacket first.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="36" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">When a lithium battery can charge</text><rect x="40" y="120" width="320" height="40" rx="6" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><rect x="40" y="120" width="80" height="40" rx="6" fill="#c92a2a" stroke="none" stroke-width="0"/><rect x="120" y="120" width="40" height="40" rx="0" fill="#f2c70c" stroke="none" stroke-width="2"/><rect x="160" y="120" width="200" height="40" rx="6" fill="#8a9a6b" stroke="none" stroke-width="0"/><line x1="120" y1="112" x2="120" y2="168" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><text x="120" y="188" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="middle">0°C</text><line x1="160" y1="112" x2="160" y2="168" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><text x="160" y="188" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="middle">5°C</text><line x1="360" y1="112" x2="360" y2="168" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><text x="360" y="188" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="middle">45°C</text><text x="80" y="100" font-family="sans-serif" font-size="15" fill="#c92a2a" text-anchor="middle" font-weight="bold">No charge</text><text x="140" y="100" font-family="sans-serif" font-size="15" fill="#6b4f35" text-anchor="middle" font-weight="bold">Slow</text><text x="260" y="100" font-family="sans-serif" font-size="15" fill="#8a9a6b" text-anchor="middle" font-weight="bold">Normal</text><text x="20" y="240" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">Cold phone or bank? Warm both inside</text><text x="20" y="260" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">your jacket first (Battery University).</text>
</svg>
