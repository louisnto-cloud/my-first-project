<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 308" font-family="sans-serif" role="img" aria-label="CZ 457 trigger pull ranges from the manual. Standard trigger: adjustable 8 to 15 newtons, set at the factory to 11.1 to 14 newtons. Comfort trigger: 5 to 7 newtons, factory 6 newtons give or take 0.5. 4.45 newtons is about 1 pound. Stay inside the range."><rect x="0" y="0" width="400" height="308" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Trigger pull: the CZ ranges</text><line x1="40.0" y1="58" x2="40.0" y2="210" stroke="#D9E0D5" stroke-width="1"/><text x="40.0" y="226" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">4</text><line x1="95.0" y1="58" x2="95.0" y2="210" stroke="#D9E0D5" stroke-width="1"/><text x="95.0" y="226" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">6</text><line x1="150.0" y1="58" x2="150.0" y2="210" stroke="#D9E0D5" stroke-width="1"/><text x="150.0" y="226" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">8</text><line x1="205.0" y1="58" x2="205.0" y2="210" stroke="#D9E0D5" stroke-width="1"/><text x="205.0" y="226" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">10</text><line x1="260.0" y1="58" x2="260.0" y2="210" stroke="#D9E0D5" stroke-width="1"/><text x="260.0" y="226" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">12</text><line x1="315.0" y1="58" x2="315.0" y2="210" stroke="#D9E0D5" stroke-width="1"/><text x="315.0" y="226" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">14</text><line x1="370.0" y1="58" x2="370.0" y2="210" stroke="#D9E0D5" stroke-width="1"/><text x="370.0" y="226" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">16</text><text x="200" y="246" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">newtons (N); 4.45 N = 1 lb</text><text x="40" y="70" font-size="15" font-weight="bold" text-anchor="start" fill="#1F3D2B">Standard: 8 to 15 N</text><rect x="150.0" y="80" width="192.5" height="22" rx="4" fill="#D9E0D5" stroke="#1F3D2B"/><rect x="235.2" y="80" width="79.8" height="22" rx="4" fill="#1F3D2B"/><text x="40" y="124" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Factory: 11.1 to 14 N (dark)</text><text x="40" y="152" font-size="15" font-weight="bold" text-anchor="start" fill="#1F3D2B">Comfort: 5 to 7 N</text><rect x="67.5" y="162" width="55.0" height="22" rx="4" fill="#D9E0D5" stroke="#1F3D2B"/><rect x="81.2" y="162" width="27.5" height="22" rx="4" fill="#1F3D2B"/><text x="133.5" y="178" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">Factory 6 N, give or take 0.5</text><rect x="8" y="262" width="384" height="34" rx="9" fill="#FF6A13"/><text x="200" y="284.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Stay inside the range. Never lighter.</text></svg>
