<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 411" font-family="sans-serif" role="img" aria-label="Season bars for migratory birds in District No. 8, Okanagan, Table 1, item 8. All ducks, white fronted, snow and Ross&#x27;s geese, coots and snipe: 23 September to 7 January. Canada and cackling geese: 20 September to 28 November, 20 December to 5 January, and 21 February to 10 March; in a leap year the late period starts 22 February. Mourning and collared doves: 1 to 30 September. Brant: no open season. Band tailed pigeons: no open season.">
