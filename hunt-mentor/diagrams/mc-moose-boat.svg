<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Grid of boat and water rules. With the motor pushing the boat: no hunting. Motor off, drifting or paddling: you may hunt big game. A swimming moose: no, unless already wounded. Fetching game by boat with the motor running: only if nobody aboard has a loaded firearm. Wear a zipped PFD; remember 1 minute, 10 minutes, 1 hour in cold water. A moose in a 10 foot boat sinks it.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Boat and water rules for moose</text><rect x="10" y="40" width="380" height="44" rx="6" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1"/><text x="20" y="60" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Motor pushing the boat</text><text x="20" y="78" font-size="14" fill="#c0392b" text-anchor="start" font-weight="bold">No hunting</text><rect x="10" y="92" width="380" height="44" rx="6" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="1"/><text x="20" y="112" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Motor off, drifting or paddling</text><text x="20" y="130" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">May hunt big game</text><rect x="10" y="144" width="380" height="44" rx="6" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1"/><text x="20" y="164" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Moose swimming</text><text x="20" y="182" font-size="14" fill="#c0392b" text-anchor="start" font-weight="bold">No: unless already wounded</text><rect x="10" y="196" width="380" height="44" rx="6" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="1"/><text x="20" y="216" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Fetching game, motor running</text><text x="20" y="234" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">Only if nobody has a loaded gun</text><rect x="10" y="252" width="380" height="40" rx="8" fill="#e3e8ef" stroke="#4a7fb0" stroke-width="2"/><text x="200" y="270" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">PFD zipped. Cold water: 1 minute, 10 minutes, 1 hour.</text><text x="200" y="287" font-size="14" fill="#23261f" text-anchor="middle">A moose in a 10 ft boat sinks it.</text>
</svg>
