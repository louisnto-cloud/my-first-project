<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 362" font-family="sans-serif" role="img" aria-label="One moose packed out by two people, drawn as the loads. Two hind quarters of about 45 to 55 kilograms each, split in two; two front quarters of about 35 to 40 kilograms each; game bags of loins, neck, ribs and trim; antlers and gear. About 7 loads at 30 kilograms each: 4 trips each, plus antlers. A full day for 1 kilometre. A tip, not a measured figure.">
