<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="One moose packed by two people: two hind quarters of about 45 to 55 kg each, two front quarters of about 35 to 40 kg each, and bags of loins, neck, rib meat and trim, plus antlers and gear. About 7 loads at 30 kg each, 4 trips each, a full day for 1 kilometre. A tip, not a measured figure.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">One moose, two people: count the trips</text><path d="M36 54 q 23.0 -8 46 0 l -3 56 q -20.0 7 -40 0 Z" fill="#e6b9a0" stroke="#23261f" stroke-width="2"/><text x="58" y="88" font-size="13" font-weight="bold" text-anchor="middle" fill="#23261f">Hind</text><text x="58" y="130" font-size="12" text-anchor="middle" fill="#2f3a2b">45 to 55 kg</text><path d="M132 54 q 23.0 -8 46 0 l -3 56 q -20.0 7 -40 0 Z" fill="#e6b9a0" stroke="#23261f" stroke-width="2"/><text x="154" y="88" font-size="13" font-weight="bold" text-anchor="middle" fill="#23261f">Hind</text><text x="154" y="130" font-size="12" text-anchor="middle" fill="#2f3a2b">45 to 55 kg</text><path d="M228 54 q 23.0 -8 46 0 l -3 56 q -20.0 7 -40 0 Z" fill="#e6b9a0" stroke="#23261f" stroke-width="2"/><text x="250" y="88" font-size="13" font-weight="bold" text-anchor="middle" fill="#23261f">Front</text><text x="250" y="130" font-size="12" text-anchor="middle" fill="#2f3a2b">35 to 40 kg</text><path d="M324 54 q 23.0 -8 46 0 l -3 56 q -20.0 7 -40 0 Z" fill="#e6b9a0" stroke="#23261f" stroke-width="2"/><text x="346" y="88" font-size="13" font-weight="bold" text-anchor="middle" fill="#23261f">Front</text><text x="346" y="130" font-size="12" text-anchor="middle" fill="#2f3a2b">35 to 40 kg</text><path d="M36 158 q 23.0 -8 46 0 l -3 56 q -20.0 7 -40 0 Z" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><text x="58" y="192" font-size="13" font-weight="bold" text-anchor="middle" fill="#23261f">Bags</text><text x="58" y="234" font-size="12" text-anchor="middle" fill="#2f3a2b">loins, neck</text><path d="M132 158 q 23.0 -8 46 0 l -3 56 q -20.0 7 -40 0 Z" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><text x="154" y="192" font-size="13" font-weight="bold" text-anchor="middle" fill="#23261f">Bags</text><text x="154" y="234" font-size="12" text-anchor="middle" fill="#2f3a2b">ribs, trim</text><path d="M228 158 q 23.0 -8 46 0 l -3 56 q -20.0 7 -40 0 Z" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><text x="250" y="192" font-size="13" font-weight="bold" text-anchor="middle" fill="#23261f">Bags</text><text x="250" y="234" font-size="12" text-anchor="middle" fill="#2f3a2b">trim</text><path d="M324 188 q 22 -30 44 0 M330 178 l -8 -14 M346 166 l 0 -16 M362 178 l 8 -14" stroke="#6b4f35" stroke-width="5" fill="none" stroke-linecap="round"/><text x="346" y="212" font-size="13" font-weight="bold" text-anchor="middle" fill="#23261f">Antlers</text><text x="346" y="230" font-size="13" text-anchor="middle" fill="#2f3a2b">and gear</text><text x="200" y="268" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">About 7 loads at 30 kg each: 4 trips each,</text><text x="200" y="288" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">plus antlers. A full day for 1 km (Tip)</text>
</svg>
