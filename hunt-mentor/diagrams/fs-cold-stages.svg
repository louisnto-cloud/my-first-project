<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Hypothermia stages from the Wilderness Medical Society: mild, strong shivering, alert, core 35 to 32 degrees. Moderate, shivering slows or stops, drowsy, core 32 to 28. Severe, no shivering, unconscious, under 28. Shivering that stops is an emergency.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hypothermia: 3 stages</text><rect x="10" y="50" width="80" height="48" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="50" y="79" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Stage</text><rect x="90" y="50" width="110" height="48" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="145" y="79" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Shivering</text><rect x="200" y="50" width="90" height="48" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="245" y="79" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Mind</text><rect x="290" y="50" width="100" height="48" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="340" y="79" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Core</text><rect x="10" y="98" width="80" height="48" rx="0" fill="#fff3d6" stroke="#c9c2ad" stroke-width="1"/><text x="50" y="127" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Mild</text><rect x="90" y="98" width="110" height="48" rx="0" fill="#fff3d6" stroke="#c9c2ad" stroke-width="1"/><text x="145" y="127" font-size="14" fill="#2f3a2b" text-anchor="middle">Strong</text><rect x="200" y="98" width="90" height="48" rx="0" fill="#fff3d6" stroke="#c9c2ad" stroke-width="1"/><text x="245" y="127" font-size="14" fill="#2f3a2b" text-anchor="middle">Alert</text><rect x="290" y="98" width="100" height="48" rx="0" fill="#fff3d6" stroke="#c9c2ad" stroke-width="1"/><text x="340" y="127" font-size="14" fill="#2f3a2b" text-anchor="middle">35 to 32 °C</text><rect x="10" y="146" width="80" height="48" rx="0" fill="#ffe0cc" stroke="#c9c2ad" stroke-width="1"/><text x="50" y="175" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Moderate</text><rect x="90" y="146" width="110" height="48" rx="0" fill="#ffe0cc" stroke="#c9c2ad" stroke-width="1"/><text x="145" y="175" font-size="14" fill="#2f3a2b" text-anchor="middle">Slows or stops</text><rect x="200" y="146" width="90" height="48" rx="0" fill="#ffe0cc" stroke="#c9c2ad" stroke-width="1"/><text x="245" y="175" font-size="14" fill="#2f3a2b" text-anchor="middle">Drowsy</text><rect x="290" y="146" width="100" height="48" rx="0" fill="#ffe0cc" stroke="#c9c2ad" stroke-width="1"/><text x="340" y="175" font-size="14" fill="#2f3a2b" text-anchor="middle">32 to 28 °C</text><rect x="10" y="194" width="80" height="48" rx="0" fill="#f8d0c8" stroke="#c9c2ad" stroke-width="1"/><text x="50" y="223" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Severe</text><rect x="90" y="194" width="110" height="48" rx="0" fill="#f8d0c8" stroke="#c9c2ad" stroke-width="1"/><text x="145" y="223" font-size="14" fill="#2f3a2b" text-anchor="middle">None</text><rect x="200" y="194" width="90" height="48" rx="0" fill="#f8d0c8" stroke="#c9c2ad" stroke-width="1"/><text x="245" y="223" font-size="14" fill="#2f3a2b" text-anchor="middle">Unconscious</text><rect x="290" y="194" width="100" height="48" rx="0" fill="#f8d0c8" stroke="#c9c2ad" stroke-width="1"/><text x="340" y="223" font-size="14" fill="#2f3a2b" text-anchor="middle">Under 28 °C</text><rect x="68" y="250" width="265" height="30" rx="6" fill="#c0392b"/><text x="200" y="271" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Shivering stops = emergency</text>
</svg>
