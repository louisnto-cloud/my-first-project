<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 372" font-family="sans-serif" role="img" aria-label="Closed by regulation but not printed on the Region 3 pages; from the Closed Areas Regulation. MU means Management Unit. Roderick Haig Brown Recreation Area, MU 3-37: no hunting or shooting south of the Squilax Anglement Road, below the Adams River bridge. Tunkwa Lake: on the largest island, no hunting, shooting or trapping. Trophy Mountain: a No Shooting or Hunting Area of about 6,934 hectares. Murtle Lake Nature Conservancy Area, MU 3-45: no open season except trapping.">
