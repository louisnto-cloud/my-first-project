<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 404" role="img" aria-label="Cards: Closed by regulation, not on the Region 3 pages. Roderick Haig Brown Recreation Area, MU 3-37: No hunting or shooting south of Squilax Anglement Rd, below the Adams River bridge. Tunkwa Lake: Largest island: no hunting, shooting or trapping. Trophy Mountain: No Shooting or Hunting Area, about 6,934 hectares. Murtle Lake Nature Conservancy Area, MU 3-45: No open season except trapping." font-family="sans-serif">
