<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four boxes: why good spots get skipped by other hunters. Too small: nothing could hide in that. Too close: too near the road to hold game. Too awkward: steep, wet, thorny or across water. In between: between two spots everyone drives to. Caption, a tip: each is a reason to look twice.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Why good spots get skipped</text><rect x="10" y="44" width="186" height="100" rx="8" fill="#dfe6d3"/><text x="103" y="74" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Too small</text><text x="103" y="100" font-size="13" fill="#2f3a2b" text-anchor="middle">&quot;Nothing could hide</text><text x="103" y="120" font-size="13" fill="#2f3a2b" text-anchor="middle">in that&quot;</text><rect x="204" y="44" width="186" height="100" rx="8" fill="#dfe6d3"/><text x="297" y="74" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Too close</text><text x="297" y="100" font-size="13" fill="#2f3a2b" text-anchor="middle">&quot;Too near the road</text><text x="297" y="120" font-size="13" fill="#2f3a2b" text-anchor="middle">to hold game&quot;</text><rect x="10" y="160" width="186" height="100" rx="8" fill="#dfe6d3"/><text x="103" y="190" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Too awkward</text><text x="103" y="216" font-size="13" fill="#2f3a2b" text-anchor="middle">Steep, wet, thorny,</text><text x="103" y="236" font-size="13" fill="#2f3a2b" text-anchor="middle">across water</text><rect x="204" y="160" width="186" height="100" rx="8" fill="#dfe6d3"/><text x="297" y="190" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">In between</text><text x="297" y="216" font-size="13" fill="#2f3a2b" text-anchor="middle">Between two spots</text><text x="297" y="236" font-size="13" fill="#2f3a2b" text-anchor="middle">everyone drives to</text><text x="200" y="292" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Each is a reason to look twice (Tip)</text>
</svg>
