<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A deer muzzle in side view with folded scent tissue running from the nose tip back toward the brain. A biologist estimates deer have about 100,000 times more scent cells than people; the old 297 million receptor figure is an early 1990s estimate. No measured distance at which a deer can smell you was found.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">The nose you are up against</text><path d="M40 170 Q 60 90 160 80 L300 96 Q 340 110 350 150 Q 340 186 300 196 L160 210 Q 60 214 40 170 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><path d="M110 120 q 10 20 0 40 q -10 20 0 40" fill="none" stroke="#f2b8b0" stroke-width="4"/><path d="M138 120 q 10 20 0 40 q -10 20 0 40" fill="none" stroke="#f2b8b0" stroke-width="4"/><path d="M166 120 q 10 20 0 40 q -10 20 0 40" fill="none" stroke="#f2b8b0" stroke-width="4"/><path d="M194 120 q 10 20 0 40 q -10 20 0 40" fill="none" stroke="#f2b8b0" stroke-width="4"/><path d="M222 120 q 10 20 0 40 q -10 20 0 40" fill="none" stroke="#f2b8b0" stroke-width="4"/><path d="M250 120 q 10 20 0 40 q -10 20 0 40" fill="none" stroke="#f2b8b0" stroke-width="4"/><circle cx="340" cy="150" r="8" fill="#23261f"/><text x="200" y="236" font-size="14" fill="#23261f" text-anchor="middle">Folded scent tissue, tip to brain</text><rect x="20" y="250" width="360" height="40" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="268" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">About 100,000 times more scent cells</text><text x="200" y="285" font-size="14" fill="#23261f" text-anchor="middle">than you (65%). Exact range: unknown</text><text x="200" y="58" font-size="14" fill="#6b4f35" text-anchor="middle">&quot;297 million&quot; is an old estimate (65%)</text>
</svg>
