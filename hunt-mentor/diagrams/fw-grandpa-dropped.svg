<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A deer that dropped at the shot lies on the ground. A spine hit can stun a deer for about a minute and then it gets up and runs. Stay ready, reload, watch it, and walk in from behind its back, not toward its legs and head. Tip, not a study.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
  <rect x="0" y="170" width="400" height="80" fill="#dfe6d3"/>
  <g fill="#8b5a2b">
    <ellipse cx="200" cy="176" rx="70" ry="22"/>
    <ellipse cx="270" cy="168" rx="20" ry="12"/>
    <rect x="160" y="190" width="40" height="7" rx="3" transform="rotate(20 160 190)"/>
    <rect x="210" y="192" width="40" height="7" rx="3" transform="rotate(10 210 192)"/>
  </g>
  <path d="M200 150 L200 154" stroke="#2f3a2b" stroke-width="2"/>
  <circle cx="60" cy="120" r="10" fill="#2f3a2b"/><rect x="52" y="131" width="16" height="36" fill="#e8590c"/>
  <rect x="66" y="136" width="44" height="6" fill="#2f3a2b"/>
  <path d="M80 160 Q 120 140 150 156" stroke="#2f3a2b" stroke-width="3" stroke-dasharray="6 5" fill="none"/>
  <path d="M144 148 L156 158 L142 162" fill="#2f3a2b"/>
  <text x="200" y="40" font-family="sans-serif" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">Down is not dead</text>
  <g font-family="sans-serif" font-size="15" fill="#23261f">
    <text x="20" y="272">Reload. Watch. Walk in from its back.</text>
    <text x="20" y="292">Stunned deer can get up in about a minute.</text>
  </g>
  <text x="160" y="140" font-family="sans-serif" font-size="14" fill="#2f3a2b">back side</text>
</svg>
