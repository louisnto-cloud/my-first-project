<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 345" font-family="sans-serif" role="img" aria-label="Four checks before a shot in Region 2. 1 a deer, not an elk: elk have no general season in Region 2. 2 tail dark on top: a white flag tail is a white tailed deer, with no season. 3 visible bony antlers: that is a buck, and a spike counts. 4 a safe and legal spot: backstop, no road, no house, legal light. Any no or not sure: no shot.">
<rect width="400" height="345" fill="#EEF1EA"/>
<text x="200" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Legal or not? 4 checks</text>
<rect x="14" y="48" width="372" height="56" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="2"/><circle cx="38" cy="76" r="13" fill="#1F3D2B" stroke="none"/><text x="38" y="81" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text><text x="62" y="72" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Deer, not elk?</text><text x="62" y="93" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">Elk: no general season in Region 2</text><path d="M200 104 L200 114" fill="none" stroke="#1F3D2B" stroke-width="2"/><rect x="14" y="114" width="372" height="56" rx="8" fill="#ffffff" stroke="#FF6A13" stroke-width="2"/><circle cx="38" cy="142" r="13" fill="#FF6A13" stroke="none"/><text x="38" y="147" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text><text x="62" y="138" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Tail dark on top?</text><text x="62" y="159" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">White flag tail = white tail: NO season</text><path d="M200 170 L200 180" fill="none" stroke="#1F3D2B" stroke-width="2"/><rect x="14" y="180" width="372" height="56" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="2"/><circle cx="38" cy="208" r="13" fill="#1F3D2B" stroke="none"/><text x="38" y="213" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text><text x="62" y="204" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Visible bony antlers?</text><text x="62" y="225" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">That is a buck. A spike counts</text><path d="M200 236 L200 246" fill="none" stroke="#1F3D2B" stroke-width="2"/><rect x="14" y="246" width="372" height="56" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="2"/><circle cx="38" cy="274" r="13" fill="#1F3D2B" stroke="none"/><text x="38" y="279" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text><text x="62" y="270" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Safe and legal spot?</text><text x="62" y="291" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">Backstop, no road, no house, legal light</text><text x="200" y="330" font-size="16" text-anchor="middle" font-weight="bold" fill="#FF6A13">Any no or not sure: no shot</text>
</svg>
