<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 412" font-family="sans-serif" role="img" aria-label="Range day kit: 1 rifle unloaded and cased; 2 two test loads, one box each; 3, in orange, eye and ear protection; 4 a rest or bags, sticks and your pack; 5 targets, stapler and marker; 6 binoculars or a spotting scope; 7 screwdriver, Torx bits and torque driver; 8 snap caps and a cleaning rod; 9 your licence, journal and pen. Ammunition kept separate from the rifle in transit.">
<rect x="0" y="0" width="400" height="412" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Range day kit</text><rect x="12" y="40" width="376" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="55" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="60" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="48" y="60" font-size="14" fill="#17201A" text-anchor="start">Rifle, bolt in, empty, cased</text><rect x="12" y="76" width="376" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="91" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="96" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="48" y="96" font-size="14" fill="#17201A" text-anchor="start">2 test loads, 1 box each</text><rect x="12" y="112" width="376" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="127" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="132" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="48" y="132" font-size="14" fill="#17201A" text-anchor="start">Eye and ear protection</text><rect x="12" y="148" width="376" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="163" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="168" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="48" y="168" font-size="14" fill="#17201A" text-anchor="start">Rest or bags, sticks, pack</text><rect x="12" y="184" width="376" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="199" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="204" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="48" y="204" font-size="14" fill="#17201A" text-anchor="start">Targets, stapler, marker</text><rect x="12" y="220" width="376" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="235" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="240" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text><text x="48" y="240" font-size="14" fill="#17201A" text-anchor="start">Binoculars or spotting scope</text><rect x="12" y="256" width="376" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="271" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="276" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">7</text><text x="48" y="276" font-size="14" fill="#17201A" text-anchor="start">Screwdriver, Torx, torque</text><rect x="12" y="292" width="376" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="307" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="312" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">8</text><text x="48" y="312" font-size="14" fill="#17201A" text-anchor="start">Snap caps, cleaning rod</text><rect x="12" y="328" width="376" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="343" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="348" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">9</text><text x="48" y="348" font-size="14" fill="#17201A" text-anchor="start">Firearms licence, journal, pen</text><rect x="12" y="368" width="376" height="32" rx="6" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="200" y="389" font-size="14" fill="#17201A" text-anchor="middle">Ammunition separate from the rifle in transit.</text>
