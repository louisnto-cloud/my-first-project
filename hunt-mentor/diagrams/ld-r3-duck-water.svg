<text x="26" y="120" font-size="14" fill="#2f3a2b">North of the city</text>
<text x="26" y="138" font-size="14" fill="#2f3a2b">line. Deep Lake: walk</text>
<text x="26" y="156" font-size="14" fill="#2f3a2b">in.</text>
