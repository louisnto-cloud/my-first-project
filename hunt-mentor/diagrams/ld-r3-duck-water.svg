<text x="60" y="378" font-size="16" font-weight="bold" fill="#2f3a2b">McQueen, Griffin, Isobel</text>
<text x="60" y="398" font-size="15" fill="#2f3a2b">No shooting within 1 km.</text>
<rect x="10" y="420" width="380" height="76" rx="8" fill="#f8e9e5" stroke="#c0392b" stroke-width="1.4"/>
<circle cx="34" cy="458.0" r="14" fill="#c0392b"/><path d="M28.9 452.9 l10.2 10.2 M39.1 452.9 l-10.2 10.2" stroke="#fffaf0" stroke-width="2.7" stroke-linecap="round"/>
<text x="60" y="442" font-size="16" font-weight="bold" fill="#2f3a2b">Farther out</text>
<text x="60" y="462" font-size="15" fill="#2f3a2b">Logan Lake, Salmon Arm bay, Blind Bay,</text>
<text x="60" y="481" font-size="15" fill="#2f3a2b">Mara Lake, Sicamous end.</text>
<text x="14" y="521" font-size="16" font-weight="bold" fill="#2c5d86">Rivers</text>
