<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 666" font-family="sans-serif" role="img" aria-label="Cards for duck water near Kamloops. Open, confirmed on official pages: Lac du Bois Grasslands potholes north of the city line, Deep Lake walk in only. Roche Lake Park south of Kamloops, 7 lakes, 2 with gravel roads. Bonaparte Park, by logging roads up Jamieson Creek or float plane. Closed to shooting: Tranquille marsh, McQueen, Griffin and Isobel Lakes within 1 kilometre, and farther out Logan Lake, Salmon Arm bay, Blind Bay, Mara Lake and the Sicamous end of Shuswap Lake. North and South Thompson rivers: no official spot, Crown land or written permission only.">
<rect x="0" y="0" width="400" height="666" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Ducks near Kamloops: which water</text>
<text x="200" y="46" font-size="14" fill="#6b4f35" text-anchor="middle">Confirmed on an official page (99%)</text>
<rect x="16" y="58" width="179" height="154" rx="10" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2.5"/>
