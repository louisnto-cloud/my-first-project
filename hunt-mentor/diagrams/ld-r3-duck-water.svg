<circle cx="34" cy="569.0" r="14" fill="#2c5d86"/><text x="34" y="575" font-size="18" font-weight="bold" fill="#fffaf0" text-anchor="middle">?</text>
<text x="60" y="553" font-size="16" font-weight="bold" fill="#2f3a2b">North and South Thompson</text>
<text x="60" y="573" font-size="15" fill="#2f3a2b">No official spot. Crown land or permission</text>
<text x="60" y="592" font-size="15" fill="#2f3a2b">only.</text>
</svg>
