<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Scouting step 5: plan your hide on the X or in cover within 45 to 90 metres, 50 to 100 yards, with the wind at your back, 65 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Scout 5: plan the hide on or beside the X</text><rect x="0" y="40" width="400" height="260" rx="0" fill="#dfe6d3"/><rect x="150" y="70" width="230" height="170" rx="4" fill="#d9c48f" stroke="#6b4f35" stroke-width="2"/><line x1="0" y1="262" x2="400" y2="262" stroke="#9e9e9e" stroke-width="10"/><text x="60" y="285" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Public road</text><circle cx="285" cy="150" r="30" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="6 4"/><text x="285" y="156" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">X</text><g transform="translate(200 150) scale(1.2)"><rect x="-22" y="-8" width="44" height="16" rx="8" fill="#d9c48f" stroke="#6b4f35" stroke-width="2"/><circle cx="14" cy="0" r="5" fill="#2f3a2b"/></g><line x1="170" y1="95" x2="240.0" y2="95.0" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="240.0,95.0 229.2,100.2 229.2,89.8" fill="#4a7fb0"/><text x="205.0" y="86" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Wind</text><text x="265" y="222" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cover within 45 to 90 m</text><text x="265" y="240" font-size="14" fill="#2f3a2b" text-anchor="middle">(50 to 100 yd) (65%)</text>
</svg>
