<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three boxes for a storm day, hunter lore only. Before: feeding hard. During: bedded tight. After: up and moving. Widely told, weakly tested. Strong or shifting wind ruins a steady wind for stalks. Go anyway and log what you see.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A storm day, hunter lore (Tip)</text><rect x="14" y="50" width="118" height="150" rx="10" fill="#8a9a6b"/><text x="73" y="80" font-size="17" fill="#fffaf0" text-anchor="middle" font-weight="bold">Before</text><text x="73" y="112" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Feeding hard?</text><rect x="142" y="50" width="118" height="150" rx="10" fill="#7d7468"/><text x="201" y="80" font-size="17" fill="#fffaf0" text-anchor="middle" font-weight="bold">During</text><text x="201" y="112" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Bedded tight</text><line x1="162" y1="140" x2="154" y2="170" stroke="#fffaf0" stroke-width="2"/><line x1="182" y1="140" x2="174" y2="170" stroke="#fffaf0" stroke-width="2"/><line x1="202" y1="140" x2="194" y2="170" stroke="#fffaf0" stroke-width="2"/><line x1="222" y1="140" x2="214" y2="170" stroke="#fffaf0" stroke-width="2"/><line x1="242" y1="140" x2="234" y2="170" stroke="#fffaf0" stroke-width="2"/><rect x="270" y="50" width="118" height="150" rx="10" fill="#e8590c"/><text x="329" y="80" font-size="17" fill="#fffaf0" text-anchor="middle" font-weight="bold">After</text><text x="329" y="112" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Up and moving</text><line x1="132" y1="125" x2="142" y2="125" stroke="#23261f" stroke-width="2"/><polygon points="142.0,125.0 133.0,129.3 133.0,120.7" fill="#23261f"/><line x1="260" y1="125" x2="270" y2="125" stroke="#23261f" stroke-width="2"/><polygon points="270.0,125.0 261.0,129.3 261.0,120.7" fill="#23261f"/><text x="200" y="230" font-size="14" fill="#23261f" text-anchor="middle">Widely told, weakly tested (50 to 55%)</text><text x="200" y="250" font-size="14" fill="#23261f" text-anchor="middle">Strong wind kills a steady wind for stalks (65%)</text><text x="200" y="280" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Go anyway. Log what you see in the Journal.</text>
</svg>
