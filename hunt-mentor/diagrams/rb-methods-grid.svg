<text x="14" y="348" font-size="14" fill="#2f3a2b" text-anchor="start">Moose column: elk and caribou are the same.</text>
<text x="14" y="368" font-size="14" fill="#2f3a2b" text-anchor="start">1  Shotgun: 20 gauge or larger, No. 1 Buck or larger.</text>
<text x="14" y="388" font-size="14" fill="#2f3a2b" text-anchor="start">2  Rimfire: grouse, ptarmigan or turkey only.</text>
<text x="14" y="408" font-size="14" fill="#2f3a2b" text-anchor="start">3  Centrefire: grouse or ptarmigan only.</text>
<text x="14" y="428" font-size="14" fill="#2f3a2b" text-anchor="start">4  Ducks: non toxic shot, 10 gauge or smaller.</text>
<text x="14" y="448" font-size="14" fill="#2f3a2b" text-anchor="start">8  Air rifle: .35 calibre or larger.</text>
</svg>
