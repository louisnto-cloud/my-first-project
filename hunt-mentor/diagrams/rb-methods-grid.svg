<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="sans-serif" role="img" aria-label="Grid of legal hunting methods from the page 13 table. Columns: deer, moose, black bear, grouse, ducks. Centrefire rifle: yes for deer, moose and bear, yes for grouse or ptarmigan only, no for ducks. Rimfire .22: no for deer, moose, bear and ducks, yes for grouse, ptarmigan or turkey only. Shotgun: yes for deer and bear with 20 gauge or larger and No. 1 Buck or larger, no for moose, yes for grouse, yes for ducks with non toxic shot, 10 gauge or smaller. Air rifle: yes for deer and bear at .35 calibre or larger, no for moose, yes for grouse, no for ducks. Bow classes: deer B C D, moose A C D, bear A C D, grouse B C D, ducks D. Elk and caribou match moose.">
