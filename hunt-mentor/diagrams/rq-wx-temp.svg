<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="A thermometer beside two cards. Warm spell: deer bed in shade and move at first and last light, a tip. Cold snap: in an Oklahoma collar study temperature explained most of the change in deer movement, 65 percent certainty.">
<rect x="0" y="0" width="400" height="280" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Temperature: the factor that shows up</text>
<rect x="40" y="60" width="26" height="170" rx="13" fill="#eee" stroke="#2f3a2b" stroke-width="2"/>
<circle cx="53" cy="240" r="22" fill="#e8590c"/>
<rect x="46" y="150" width="14" height="90" fill="#e8590c"/>
<text x="53" y="52" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">C</text>
<rect x="100" y="60" width="290" height="70" rx="8" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="2"/>
<text x="112" y="84" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Warm spell in October: deer bed in</text>
<text x="112" y="101" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">shade, move at first and last light</text>
<text x="112" y="118" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">(Tip).</text>
<rect x="100" y="150" width="290" height="70" rx="8" fill="#e6eef6" stroke="#4a7fb0" stroke-width="2"/>
<text x="112" y="174" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Cold snap: in one Oklahoma collar</text>
<text x="112" y="191" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">study, temperature explained most</text>
<text x="112" y="208" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">change in movement (65%).</text>
<text x="100" y="248" font-family="sans-serif" font-size="14" fill="#6b4f35" text-anchor="start">Watch the trend over days, not one hour</text>
<text x="100" y="265" font-family="sans-serif" font-size="14" fill="#6b4f35" text-anchor="start">(Tip).</text>
</svg>
