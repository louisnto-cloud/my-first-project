<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A dry brown hillside seen from above, like the Hunt Map Satellite base. A green strip of brush runs down a draw: water below. A green clump of aspen on the open slope marks a seep. A small bright green spot marks a spring. Caption: in October, look for the greenest spot.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Green in a brown hill = water</text>
  <rect x="0" y="36" width="400" height="232" fill="#d8c79c"/>
  <path d="M60 36 C 70 100, 50 160, 80 268" stroke="#6f9a52" stroke-width="22" fill="none" opacity=".9"/>
  <ellipse cx="250" cy="130" rx="40" ry="22" fill="#6f9a52"/><ellipse cx="300" cy="210" rx="24" ry="14" fill="#7fb069"/>
  <path d="M240 108.8 l7.2 14.4 h-4.0 l5.6000000000000005 9.600000000000001 h-17.6 l5.6000000000000005 -9.600000000000001 h-4.0 Z" fill="#4f7a3a"/><rect x="238.8" y="132.8" width="2.4000000000000004" height="4.0" fill="#6b4f35"/><path d="M256 102.8 l7.2 14.4 h-4.0 l5.6000000000000005 9.600000000000001 h-17.6 l5.6000000000000005 -9.600000000000001 h-4.0 Z" fill="#4f7a3a"/><rect x="254.8" y="126.8" width="2.4000000000000004" height="4.0" fill="#6b4f35"/><path d="M266 114.8 l7.2 14.4 h-4.0 l5.6000000000000005 9.600000000000001 h-17.6 l5.6000000000000005 -9.600000000000001 h-4.0 Z" fill="#4f7a3a"/><rect x="264.8" y="138.8" width="2.4000000000000004" height="4.0" fill="#6b4f35"/>
  <rect x="110" y="60" width="217" height="24" rx="6" fill="#2f3a2b"/><text x="218.5" y="77" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Brushy draw: water below</text><rect x="214" y="166" width="158" height="24" rx="6" fill="#2f3a2b"/><text x="293.0" y="183" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Aspen clump: seep</text><rect x="227" y="236" width="167" height="24" rx="6" fill="#2f3a2b"/><text x="310.5" y="253" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Green spot: spring</text>
  <text x="200" y="292" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">In October, look for the greenest spot</text>
</svg>
