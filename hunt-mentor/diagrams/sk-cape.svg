<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Caping a deer for a shoulder mount: a ring cut around the body well behind the front shoulders, one cut up the back of the neck to between the antlers, and never a cut down the throat. Leave 20 to 30 cm of hide behind the shoulder.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">Caping for a shoulder mount</text><g transform="translate(230 170)"><g stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"><rect x="-58" y="18" width="11" height="62" rx="4" fill="#8a9a6b"/><rect x="-48" y="18" width="11" height="62" rx="4" fill="#8a9a6b"/><rect x="46" y="16" width="11" height="64" rx="4" fill="#8a9a6b"/><rect x="58" y="16" width="11" height="64" rx="4" fill="#8a9a6b"/><path d="M-60 -14 L-92 -60 L-74 -70 L-40 -24 Z" fill="#8a9a6b"/><ellipse cx="0" cy="0" rx="80" ry="32" fill="#8a9a6b"/><ellipse cx="-98" cy="-62" rx="19" ry="10" fill="#8a9a6b"/><path d="M-84 -70 L-74 -86 L-76 -66 Z" fill="#8a9a6b"/><path d="M78 -12 L92 -18 L88 -2 Z" fill="#fff"/></g><circle cx="-106" cy="-64" r="2" fill="#23261f"/><path d="M-88 -71 L-90 -98 M-90 -86 L-100 -94 M-90 -92 L-80 -104" fill="none" stroke="#6b4f35" stroke-width="3.5" stroke-linecap="round"/><path d="M-10 -32 C 4 -10, 4 14, -10 32" fill="none" stroke="#e8590c" stroke-width="4" stroke-dasharray="8 5"/><path d="M-42 -27 L-74 -70 L-86 -74" fill="none" stroke="#e8590c" stroke-width="4" stroke-dasharray="8 5"/></g><path d="M143 125 L161 143 M161 125 L143 143" stroke="#b3261e" stroke-width="4" stroke-linecap="round"/><text x="20" y="48" font-size="14" font-weight="bold" fill="#e8590c">One cut up the back of</text><text x="20" y="64" font-size="14" font-weight="bold" fill="#e8590c">the neck to the antlers</text><text x="260" y="96" font-size="14" font-weight="bold" fill="#e8590c">Ring cut well</text><text x="260" y="112" font-size="14" font-weight="bold" fill="#e8590c">behind the shoulder</text><line x1="280" y1="120" x2="226.0" y2="150.0" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><path d="M231.2 142.6 L226.0 150.0 L235.0 149.5" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="196" font-size="14" font-weight="bold" fill="#b3261e">Never cut</text><text x="20" y="212" font-size="14" font-weight="bold" fill="#b3261e">the throat</text><line x1="70" y1="186" x2="146.0" y2="142.0" stroke="#b3261e" stroke-width="2" stroke-linecap="round"/><path d="M140.9 149.4 L146.0 142.0 L137.0 142.7" fill="none" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="276" font-size="14" text-anchor="middle" fill="#2f3a2b">Leave 20 to 30 cm of hide behind the shoulder</text><text x="200" y="294" font-size="14" text-anchor="middle" fill="#2f3a2b">Cool it fast. Freeze or salt within 24 to 48 h</text>
</svg>
