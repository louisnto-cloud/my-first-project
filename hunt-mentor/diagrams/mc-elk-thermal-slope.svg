<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two slopes with a hunter below and an elk above. Left: in cool air at dawn and dusk the air sinks, so your scent flows downhill, away from elk above you: come from below. Right: once the sun warms the slope the air rises, so your scent flows uphill toward the elk: come from above or from the side. Sources Colorado Parks and Wildlife and the Rocky Mountain Elk Foundation.">
<rect width="400" height="300" fill="#fffaf0"/>
