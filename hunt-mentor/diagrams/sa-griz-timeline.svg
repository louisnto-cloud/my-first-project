<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 324" font-family="sans-serif" role="img" aria-label="Timeline. 30 November 2017: grizzly trophy hunting ends, and all grizzly hunting in the Great Bear Rainforest. 18 December 2017: the BC government ends all grizzly hunting province wide, for residents and non residents. Today, the 2026 to 2028 synopsis, page 19: no open season for grizzly bears in BC. Report any wildlife crime to RAPP, Report All Poachers and Polluters, 1 877 952 7277.">
<rect x="0" y="0" width="400" height="324" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Grizzly: closed in all of BC</text><line x1="40" y1="56" x2="40" y2="270" stroke="#2f3a2b" stroke-width="4"/><circle cx="40" cy="72" r="12" fill="#8a9a6b"/><text x="64" y="68" font-size="16" font-weight="bold" fill="#8a9a6b" text-anchor="start">30 Nov 2017</text><text x="64" y="90" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Trophy hunt ends, and all grizzly</text><text x="64" y="110" font-size="14" fill="#23261f" text-anchor="start">hunting in the Great Bear Rainforest</text><circle cx="40" cy="148" r="12" fill="#e8590c"/><text x="64" y="144" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">18 Dec 2017</text><text x="64" y="166" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">All grizzly hunting ends,</text><text x="64" y="186" font-size="14" fill="#23261f" text-anchor="start">province wide, residents and all</text><circle cx="40" cy="224" r="12" fill="#c92a2a"/><text x="64" y="220" font-size="16" font-weight="bold" fill="#c92a2a" text-anchor="start">Synopsis 2026 to 2028</text><text x="64" y="242" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">No open season for grizzly</text><text x="64" y="262" font-size="14" fill="#23261f" text-anchor="start">bears in BC (page 19)</text><rect x="8" y="276" width="384" height="40" rx="8" fill="#fffaf0" stroke="#c92a2a" stroke-width="1.5"/><text x="18" y="302" font-size="14" font-weight="bold" fill="#c92a2a" text-anchor="start">Shot a grizzly? Report to RAPP: 1 877 952 7277</text>
</svg>
