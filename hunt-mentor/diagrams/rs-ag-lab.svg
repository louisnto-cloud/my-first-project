<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="sans-serif" role="img" aria-label="Aging lab: make 6 boot prints, 3 in sun and 3 in shade, in mud, dust and sand. Check and photograph them at 1, 6, 24 and 72 hours from the same spot.">
<rect x="0" y="0" width="400" height="290" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Build your own aging lab</text>
<rect x="20" y="64" width="360" height="150" rx="10" fill="#dfe6d3"/><text x="110" y="90" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">sun</text><g transform="translate(60 150)"><path d="M-10 -18 Q0 -24 10 -18 L11 14 Q0 20 -11 14 Z" fill="#6b4f35"/></g><g transform="translate(110 150)"><path d="M-10 -18 Q0 -24 10 -18 L11 14 Q0 20 -11 14 Z" fill="#6b4f35"/></g><g transform="translate(160 150)"><path d="M-10 -18 Q0 -24 10 -18 L11 14 Q0 20 -11 14 Z" fill="#6b4f35"/></g><text x="110" y="200" font-size="14" fill="#23261f" text-anchor="middle">mud, dust, sand</text><text x="290" y="90" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">shade</text><g transform="translate(240 150)"><path d="M-10 -18 Q0 -24 10 -18 L11 14 Q0 20 -11 14 Z" fill="#6b4f35"/></g><g transform="translate(290 150)"><path d="M-10 -18 Q0 -24 10 -18 L11 14 Q0 20 -11 14 Z" fill="#6b4f35"/></g><g transform="translate(340 150)"><path d="M-10 -18 Q0 -24 10 -18 L11 14 Q0 20 -11 14 Z" fill="#6b4f35"/></g><text x="290" y="200" font-size="14" fill="#23261f" text-anchor="middle">mud, dust, sand</text><text x="200" y="244" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Make 6 prints. Check at 1, 6, 24, 72 h</text><text x="200" y="268" font-size="15" fill="#6b4f35" text-anchor="middle">Photo each time from the same spot</text>
</svg>
