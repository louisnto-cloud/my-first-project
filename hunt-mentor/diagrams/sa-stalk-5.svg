<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 5 of a stalk: at the end, lie or sit with the rifle on your pack as a rest. Wait until the deer stands broadside before you shoot. If it never turns, let it go.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="200" width="400" height="100" fill="#dfe6d3"/><circle cx="112" cy="222" r="9" fill="#e8590c"/><rect x="20" y="226" width="90" height="16" rx="7" fill="#e8590c"/><rect x="140" y="222" width="36" height="22" rx="6" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><text x="158" y="266" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">pack</text><line x1="96" y1="226" x2="210" y2="214" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><g transform="translate(320 176) scale(0.6 0.6)"><rect x="-30" y="6" width="7" height="38" rx="3.5" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><rect x="-21" y="6" width="7" height="38" rx="3.5" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><rect x="22" y="6" width="7" height="38" rx="3.5" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><rect x="31" y="6" width="7" height="38" rx="3.5" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><ellipse cx="0" cy="0" rx="42" ry="17" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="-37" cy="-2" rx="8" ry="11" fill="#fff" stroke="#23261f" stroke-width="1"/><path d="M-42 -6 Q-47 4 -45 14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M-45 10 L-45 16" stroke="#111" stroke-width="5" stroke-linecap="round"/><path d="M26 -10 L42 -40 L56 -36 L40 6 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="2" stroke-linejoin="round"/><ellipse cx="56" cy="-40" rx="14" ry="7" transform="rotate(18 56 -40)" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="42" cy="-50" rx="11" ry="4.5" transform="rotate(-35 42 -50)" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><circle cx="58" cy="-42" r="1.8" fill="#23261f"/><path d="M48 -46 L50 -62 M50 -62 L42 -76 M50 -62 L60 -72 M42 -76 L36 -88 M42 -76 L48 -90 M60 -72 L58 -86 M60 -72 L70 -82" stroke="#6b4f35" stroke-width="3.5" fill="none" stroke-linecap="round"/></g><text x="40" y="84" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Broadside? Then shoot.</text><text x="40" y="106" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">If not, wait.</text><rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">5  Get a solid rest, then wait for broadside</text><text x="20" y="292" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Prone or sitting, rifle on a pack (Tip)</text>
