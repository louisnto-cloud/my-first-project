<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Wading a cold creek: face upstream, use a pole as a third leg, undo the pack hip belt, move one foot at a time. If it is over the knee and fast, find another way.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wading a cold creek</text><rect x="0" y="120" width="400" height="180" rx="0" fill="#4a7fb0"/><path d="M0 140 q 50 -10 100 0 t 100 0 t 100 0 t 100 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="380" y1="170" x2="312" y2="170" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/><polygon points="300,170 312,177 312,163" fill="#ffffff"/><text x="350" y="160" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">current</text><line x1="162" y1="230" x2="166" y2="201" stroke="#2f3a2b" stroke-width="7.0" stroke-linecap="round"/><line x1="178" y1="230" x2="174" y2="201" stroke="#2f3a2b" stroke-width="7.0" stroke-linecap="round"/><rect x="159" y="173" width="22" height="31" rx="6.0" fill="#e8590c"/><line x1="160" y1="178" x2="152" y2="198" stroke="#2f3a2b" stroke-width="6.0" stroke-linecap="round"/><line x1="180" y1="178" x2="188" y2="198" stroke="#2f3a2b" stroke-width="6.0" stroke-linecap="round"/><circle cx="170" cy="164" r="10.0" fill="#d9b48f"/><line x1="196" y1="150" x2="230" y2="236" stroke="#8b5a2b" stroke-width="5" stroke-linecap="round"/><text x="110" y="80" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Face upstream, pole as</text><text x="110" y="100" font-size="15" fill="#2f3a2b" text-anchor="middle">a third leg</text><text x="300" y="80" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Hip belt open</text><text x="300" y="100" font-size="15" fill="#2f3a2b" text-anchor="middle">one foot at a time</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Over the knee and fast? Find another way</text>
</svg>
