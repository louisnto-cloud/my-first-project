<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A general pattern of a duck&#x27;s fat through the year, 75 percent. Spring: hens store fat for eggs. Nesting: hens burn it. Summer moult: low. Fall: fatten before migration. Migration: burn it. Winter: regain on grain in early winter, then a slow drop in mid to late winter. Flying burns about 12 times the energy of resting."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A duck&#x27;s fat through the year (75%)</text><line x1="40" y1="220" x2="390" y2="220" stroke="#2f3a2b" stroke-width="2" fill="none"/><line x1="40" y1="50" x2="40" y2="220" stroke="#2f3a2b" stroke-width="2" fill="none"/><text x="30" y="60" font-size="14" fill="#2f3a2b" text-anchor="end" font-weight="bold">Fat</text><path d="M50 150 L90 120 L130 90 L170 170 L210 200 L250 180 L290 120 L320 160 L350 110 L385 130" stroke="#e8590c" stroke-width="5" fill="none" stroke-linejoin="round"/><text x="80" y="80" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Spring:</text><text x="80" y="96" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">hens store</text><text x="170" y="196" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Nesting</text><text x="170" y="212" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">burns it</text><text x="230" y="168" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Moult</text><text x="288" y="96" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Fall: fatten</text><text x="322" y="190" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Migrate:</text><text x="322" y="206" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">burn it</text><text x="360" y="98" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Winter</text><text x="60" y="240" font-size="14" fill="#2f3a2b" text-anchor="middle">Mar</text><text x="124" y="240" font-size="14" fill="#2f3a2b" text-anchor="middle">May</text><text x="188" y="240" font-size="14" fill="#2f3a2b" text-anchor="middle">Jul</text><text x="252" y="240" font-size="14" fill="#2f3a2b" text-anchor="middle">Sep</text><text x="316" y="240" font-size="14" fill="#2f3a2b" text-anchor="middle">Nov</text><text x="380" y="240" font-size="14" fill="#2f3a2b" text-anchor="middle">Jan</text><rect x="10" y="254" width="380" height="40" rx="8" fill="#dfe6d3"/><text x="200" y="280" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Flying burns about 12 times resting energy</text></svg>
