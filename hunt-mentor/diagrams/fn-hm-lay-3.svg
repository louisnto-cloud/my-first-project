<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="An Opacity slider under a switched on layer. Slide it left so the topo shows through.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c" stroke="none" stroke-width="2"/><text x="26" y="32" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="52" y="32" font-family="sans-serif" font-size="18" fill="#2f3a2b" text-anchor="start" font-weight="bold">Set opacity</text><rect x="20" y="110" width="360" height="100" rx="10" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="36" y="140" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Opacity</text><line x1="120" y1="135" x2="350" y2="135" stroke="#cccccc" stroke-width="6" stroke-linecap="round"/><line x1="120" y1="135" x2="260" y2="135" stroke="#8a9a6b" stroke-width="6" stroke-linecap="round"/><circle cx="260" cy="135" r="12" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="36" y="180" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="start">Legend, data date, certainty</text><text x="20" y="260" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Slide left so the topo shows through.</text>
</svg>
