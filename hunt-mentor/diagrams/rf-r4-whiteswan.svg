<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 308" role="img" aria-label="Three cards. Whiteswan Forest Service Road: no firearms on or within 50 metres of either side of the road, about 4.9 kilometres in total, on two stretches: Inlet Creek Campground to the White River bridge, and the White Moscow junction to the Moscow and Home Basin Campground junction. Other No Shooting Areas are on Maps D1 to D27." font-family="sans-serif">
<rect x="0" y="0" width="400" height="308" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">No Shooting Area in the text</text>
<rect x="6" y="40" width="190" height="168" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<path d="M6 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#e8590c"/>
<text x="101" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Whiteswan Forest</text>
<text x="101" y="76" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Service Road</text>
<path d="M14.0 118 l6 -6 h22 v3 h-16 l-4 6 z" fill="#8b5a2b"/><line x1="28.0" y1="111" x2="46.0" y2="111" stroke="#2f3a2b" stroke-width="2.5"/>
<circle cx="30.0" cy="114" r="18" fill="none" stroke="#c92a2a" stroke-width="3"/><line x1="17.0" y1="127" x2="43.0" y2="101" stroke="#c92a2a" stroke-width="3"/>
<text x="52" y="106" font-size="14" fill="#23261f" text-anchor="start">No firearms on or</text>
<text x="52" y="124" font-size="14" fill="#23261f" text-anchor="start">within 50 m of the</text>
<text x="52" y="142" font-size="14" fill="#23261f" text-anchor="start">road, about 4.9 km</text>
<rect x="204" y="40" width="190" height="168" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<path d="M204 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#e8590c"/>
<text x="299" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Two stretches</text>
<text x="212" y="106" font-size="14" fill="#23261f" text-anchor="start">Inlet Creek Campground</text>
<text x="212" y="124" font-size="14" fill="#23261f" text-anchor="start">to White River bridge.</text>
<text x="212" y="142" font-size="14" fill="#23261f" text-anchor="start">White Moscow junction</text>
<text x="212" y="160" font-size="14" fill="#23261f" text-anchor="start">to the Moscow and Home</text>
<text x="212" y="178" font-size="14" fill="#23261f" text-anchor="start">Basin Campground</text>
<text x="212" y="196" font-size="14" fill="#23261f" text-anchor="start">junction</text>
<rect x="6" y="216" width="190" height="78" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
<path d="M6 226 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#2f3a2b"/>
<text x="101" y="234" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Other areas</text>
<text x="14" y="264" font-size="14" fill="#23261f" text-anchor="start">See Maps D1 to D27 on</text>
<text x="14" y="282" font-size="14" fill="#23261f" text-anchor="start">the map screens</text>
</svg>
