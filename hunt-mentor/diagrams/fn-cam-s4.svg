<circle cx="26" cy="26" r="17" fill="#e8590c" stroke="none" stroke-width="2"/><text x="26" y="32" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="52" y="32" font-family="sans-serif" font-size="18" fill="#2f3a2b" text-anchor="start" font-weight="bold">Silhouette</text><rect x="0" y="60" width="400" height="190" rx="0" fill="#e7f0f7" stroke="none" stroke-width="2"/><path d="M0 200 L200 120 L400 200 L400 250 L0 250 Z" fill="#c9d3b8" stroke="#8b5a2b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><g transform="translate(200 120) scale(1.1)"><circle cx="0" cy="-30" r="7" fill="#2f3a2b"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" fill="none"/></g><text x="110" y="110" font-family="sans-serif" font-size="15" fill="#c92a2a" text-anchor="middle" font-weight="bold">Skylined</text><g transform="translate(300 185) scale(1.0)"><circle cx="0" cy="-30" r="7" fill="#2f3a2b"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" fill="none"/></g><text x="330" y="230" font-family="sans-serif" font-size="14" fill="#8a9a6b" text-anchor="middle" font-weight="bold">Below the crest</text><text x="20" y="290" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start"></text>
