<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Top view of an elk head. Eyes on the sides of the head give a very wide view, most of it seen by one eye only, and a small zone ahead seen by both eyes. Only a narrow strip behind the animal is blind. Wide field of view is from a 2024 review of deer family vision; exact degrees for elk were not found.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Field of view from above</text><circle cx="200" cy="165" r="110" fill="#8a9a6b" opacity="0.35"/><path d="M200 165 L170 55 A110 110 0 0 1 230 55 Z" fill="#4a7fb0" opacity="0.5"/><path d="M200 165 L185 274 A110 110 0 0 0 215 274 Z" fill="#e8590c" opacity="0.7"/><ellipse cx="200" cy="170" rx="16" ry="28" fill="#5c3b1c" stroke="#23261f" stroke-width="2"/><ellipse cx="200" cy="134" rx="9" ry="13" fill="#5c3b1c"/><text x="200" y="48" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Both eyes: small zone ahead</text><text x="45" y="170" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">One eye</text><text x="355" y="170" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">One eye</text><text x="330" y="262" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Blind strip</text><text x="330" y="280" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">behind</text><text x="60" y="280" font-size="14" fill="#6b4f35" text-anchor="middle">Wide view (80%)</text>
</svg>
