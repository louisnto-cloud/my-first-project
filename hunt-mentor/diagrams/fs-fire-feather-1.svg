<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Feather stick step 1: split a wrist thick piece of dead wood to reach the dry wood inside.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1. Split to the dry core</text><rect x="150" y="70" width="40" height="160" rx="6" fill="#8b5a2b"/><rect x="194" y="70" width="40" height="160" rx="6" fill="#d9b98c"/><text x="320" y="120" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wet outside</text><text x="320" y="140" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">dry inside</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Split it. Work the dry inside</text>
</svg>
