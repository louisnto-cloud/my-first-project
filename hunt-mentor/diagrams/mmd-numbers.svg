<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bars of BC mule deer numbers. Interior about 165,000 in the 2000 BC account. All BC 100,000 to 170,000 in the 2020 western agencies report. Harvest about 9,986 in that report, 87% bucks. Harvest of all deer fell from about 75,000 in the late 1960s to about 20,000 by 2000.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">How many? BC mule deer</text><rect x="30" y="42" width="340" height="150" rx="10" fill="#dfe6d3"/><rect x="70" y="81.0" width="50" height="99.0" rx="3" fill="#8b5a2b"/><text x="95" y="76.0" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">165,000</text><text x="95" y="212" font-size="14" fill="#23261f" text-anchor="middle">Interior, 2000</text><text x="95" y="230" font-size="14" fill="#6b4f35" text-anchor="middle">BC account (90%)</text><rect x="180" y="78.0" width="50" height="102.0" rx="3" fill="#8b5a2b"/><rect x="180" y="120.0" width="50" height="3" fill="#fffaf0"/><text x="205" y="57.0" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">100,000 to</text><text x="205" y="73.0" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">170,000</text><text x="205" y="212" font-size="14" fill="#23261f" text-anchor="middle">All BC, 2020</text><text x="205" y="230" font-size="14" fill="#6b4f35" text-anchor="middle">West agencies (85%)</text><rect x="290" y="174.0" width="50" height="6.0" rx="3" fill="#e8590c"/><text x="315" y="169.0" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">9,986</text><text x="315" y="212" font-size="14" fill="#23261f" text-anchor="middle">Harvest 2020</text><text x="315" y="230" font-size="14" fill="#6b4f35" text-anchor="middle">87% bucks (85%)</text><text x="200" y="262" font-size="14" fill="#23261f" text-anchor="middle">Late 1960s harvest about 75,000 deer;</text><text x="200" y="280" font-size="14" fill="#23261f" text-anchor="middle">about 20,000 by 2000 (both races) (90%)</text>
</svg>
