<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 1 of mirror signalling: hold two fingers up in a V and line it up on the aircraft. Tip.">
<rect width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c"/><text x="26" y="31" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">1</text><text x="52" y="32" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Aim: two fingers in a V on the target</text><rect x="20" y="56" width="360" height="196" rx="6" fill="#e7eef5"/><path d="M330 90 l-26 6 l26 6 l-6 -6 Z" fill="#2f3a2b" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="125" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Aircraft</text><rect x="70" y="170" width="40" height="30" rx="3" fill="#cfd8e3" stroke="#2f3a2b" stroke-width="2"/><path d="M140 190 l0 -30 M150 190 l0 -30" fill="none" stroke="#6b4f35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="145" y="225" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">V of two fingers</text><line x1="145" y1="160" x2="320" y2="96" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
</svg>
