<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 415" font-family="sans-serif" role="img" aria-label="Scoring card out of 20, shown as dots: legal checks done the night before, 4 points; deer found while glassing, 3; sign read right, who, which way and how old, 4; wind plan and seat choice, 4; journal written the same night, 5. Tip: 16 or more, you are reading land. Under 10, repeat the drill.">
<rect width="400" height="415" fill="#fffaf0"/>
<text x="14" y="28" font-size="18" font-weight="bold" fill="#2f3a2b">Score your drill (out of 20)</text>
<text x="14" y="58" font-size="16" font-weight="bold" fill="#2f3a2b">Legal checks done the night before</text>
<circle cx="26" cy="78" r="11" fill="#2f3a2b"/>
<circle cx="56" cy="78" r="11" fill="#2f3a2b"/>
<circle cx="86" cy="78" r="11" fill="#2f3a2b"/>
<circle cx="116" cy="78" r="11" fill="#2f3a2b"/>
<circle cx="146" cy="78" r="10" fill="none" stroke="#d8cfb8" stroke-width="1.6"/>
<text x="180" y="84" font-size="16" font-weight="bold" fill="#2f3a2b">4 points</text>
<text x="14" y="119" font-size="16" font-weight="bold" fill="#2f3a2b">Deer found while glassing</text>
<circle cx="26" cy="139" r="11" fill="#8a9a6b"/>
<circle cx="56" cy="139" r="11" fill="#8a9a6b"/>
<circle cx="86" cy="139" r="11" fill="#8a9a6b"/>
<circle cx="116" cy="139" r="10" fill="none" stroke="#d8cfb8" stroke-width="1.6"/>
<circle cx="146" cy="139" r="10" fill="none" stroke="#d8cfb8" stroke-width="1.6"/>
<text x="180" y="145" font-size="16" font-weight="bold" fill="#2f3a2b">3 points</text>
<text x="14" y="180" font-size="16" font-weight="bold" fill="#2f3a2b">Sign read right: who, which way, how old</text>
<circle cx="26" cy="200" r="11" fill="#8b5a2b"/>
<circle cx="56" cy="200" r="11" fill="#8b5a2b"/>
<circle cx="86" cy="200" r="11" fill="#8b5a2b"/>
<circle cx="116" cy="200" r="11" fill="#8b5a2b"/>
<circle cx="146" cy="200" r="10" fill="none" stroke="#d8cfb8" stroke-width="1.6"/>
<text x="180" y="206" font-size="16" font-weight="bold" fill="#2f3a2b">4 points</text>
<text x="14" y="241" font-size="16" font-weight="bold" fill="#2f3a2b">Wind plan and seat choice</text>
<circle cx="26" cy="261" r="11" fill="#4a7fb0"/>
<circle cx="56" cy="261" r="11" fill="#4a7fb0"/>
<circle cx="86" cy="261" r="11" fill="#4a7fb0"/>
<circle cx="116" cy="261" r="11" fill="#4a7fb0"/>
<circle cx="146" cy="261" r="10" fill="none" stroke="#d8cfb8" stroke-width="1.6"/>
<text x="180" y="267" font-size="16" font-weight="bold" fill="#2f3a2b">4 points</text>
<text x="14" y="302" font-size="16" font-weight="bold" fill="#2f3a2b">Journal written the same night</text>
<circle cx="26" cy="322" r="11" fill="#e8590c"/>
<circle cx="56" cy="322" r="11" fill="#e8590c"/>
<circle cx="86" cy="322" r="11" fill="#e8590c"/>
<circle cx="116" cy="322" r="11" fill="#e8590c"/>
<circle cx="146" cy="322" r="11" fill="#e8590c"/>
<text x="180" y="328" font-size="16" font-weight="bold" fill="#c2410c">5 points</text>
<rect x="8" y="347" width="384" height="58" rx="8" fill="#f4eedf"/>
<text x="20" y="371" font-size="15" font-weight="bold" fill="#2f3a2b">Tip: 16 or more, you are reading land.</text>
<text x="20" y="393" font-size="15" font-weight="bold" fill="#c2410c">Under 10, repeat the drill.</text>
</svg>
