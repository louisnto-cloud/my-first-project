<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" font-family="sans-serif" role="img" aria-label="Year wheel for grouse. January and February: winter, buds, needles and snow roosts. March to May: drumming, hooting and leks. May and June: nests, hatch in June. July and August: broods grow, adults moult. September and October: families split and young birds move. November and December: dusky grouse move uphill into conifers, winter starts. Orange arc: Region 3 general season, September 10 to November 30.">
