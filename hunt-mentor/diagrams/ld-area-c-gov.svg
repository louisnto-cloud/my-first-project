<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 692" font-family="sans-serif" role="img" aria-label="Places in Area C, South Okanagan, named by government, grouped by status. MU means Management Unit, WMA means Wildlife Management Area. Quail open in MUs 8-1 to 8-15 and 8-21 to 8-26 from 1 October to 30 November, 99 percent. Hunting allowed in season: South Okanagan Grasslands Protected Area, Kilpoola MU 8-2, Mount Kobau MU 8-1 and Chopaka, a park with bighorn and mule deer winter range, 95 percent. White Lake Grasslands, MU 8-1: park, no vehicles, 95 percent. Vaseux Protected Area: park, bighorn winter range, next to the closed sanctuary, 90 percent. Check first: Osoyoos Oxbows, MU 8-1, no shooting or hunting 1 March to 30 September, 99 percent. South Okanagan WMA: status VERIFY with the Penticton office, 85 percent. McTaggart Cowan nsək&#x27;łniw&#x27;t WMA east of Skaha Lake: status VERIFY, 85 percent. Closed: Vaseux Lake, MU 8-1, bird sanctuary and National Wildlife Areas, 99 percent.">
