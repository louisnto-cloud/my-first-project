<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Pick a live branch high enough that the bag will hang about 4 m up and 3 m out from the trunk.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="30" cy="32" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="30" y="39" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">1</text>
<text x="56" y="39" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="start">Pick the branch</text>
<rect x="40" y="60" width="22" height="190" rx="4" fill="#6b4f35"/><line x1="60" y1="90" x2="330" y2="84" stroke="#6b4f35" stroke-width="8" stroke-linecap="round"/><rect x="10" y="248" width="380" height="8" rx="2" fill="#c9b79c"/><line x1="250" y1="100" x2="250" y2="240" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><text x="268" y="180" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">4 m up</text><line x1="62" y1="230" x2="250" y2="230" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><text x="156" y="222" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">3 m from trunk</text>
<rect x="10" y="262" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="285.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">High branch, far out from the trunk.</text>
</svg>
