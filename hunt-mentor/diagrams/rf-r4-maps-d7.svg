<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 514" font-family="sans-serif" role="img" aria-label="Cards for Region 4 Maps D7 to D12, page 40. D7 Argenta Marsh Wildlife Management Area, 4-19: No Shooting or Hunting Area. D8 Fry Creek, 4-19: No Shooting Area. D9 Skookumchuck Pulp Mill, 4-20: No Shooting Area. D10 Wasa Slough Wildlife Sanctuary, 4-21: no shooting, hunting or trapping. D11 Baynes Lake, 4-22: motorized use prohibited all year, public access prohibited 15 April to 15 July except public beaches 1 and 2. D12 Sulphur Creek, 4-22: no access beyond 3 metres of either side of Sulphur Creek Road, up to 1,310 metres elevation.">
