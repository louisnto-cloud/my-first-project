<text x="101" y="198" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Mill</text>
<text x="14" y="228" font-size="14" fill="#23261f" text-anchor="start">No Shooting Area,</text>
<text x="14" y="246" font-size="14" fill="#23261f" text-anchor="start">MU 4-20</text>
<rect x="204" y="162" width="190" height="96" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M204 172 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#c92a2a"/>
<text x="299" y="180" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">D10 Wasa Slough</text>
<text x="299" y="198" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Wildlife Sanctuary</text>
<text x="212" y="228" font-size="14" fill="#23261f" text-anchor="start">No shooting, hunting or</text>
<text x="212" y="246" font-size="14" fill="#23261f" text-anchor="start">trapping, MU 4-21</text>
<rect x="6" y="266" width="190" height="114" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<path d="M6 276 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#4a7fb0"/>
<text x="101" y="284" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">D11 Baynes Lake</text>
<text x="14" y="314" font-size="14" fill="#23261f" text-anchor="start">No motor use all year.</text>
<text x="14" y="332" font-size="14" fill="#23261f" text-anchor="start">Access closed Apr 15 to</text>
<text x="14" y="350" font-size="14" fill="#23261f" text-anchor="start">July 15, beaches</text>
<text x="14" y="368" font-size="14" fill="#23261f" text-anchor="start">excepted</text>
<rect x="204" y="266" width="190" height="114" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M204 276 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#c92a2a"/>
<text x="299" y="284" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">D12 Sulphur Creek</text>
<text x="212" y="314" font-size="14" fill="#23261f" text-anchor="start">Stay within 3 m of the</text>
