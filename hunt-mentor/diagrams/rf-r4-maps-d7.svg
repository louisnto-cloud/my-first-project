<text x="212" y="124" font-size="14" fill="#23261f" text-anchor="start">No Shooting Area,</text>
<text x="212" y="142" font-size="14" fill="#23261f" text-anchor="start">MU 4-19</text>
<rect x="6" y="162" width="190" height="96" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<path d="M6 172 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#e8590c"/>
