<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Twenty four hour clock of an elk day in late September. Feeding peaks start after dawn, about 6:30 to 10, and again at dusk, about 17:30 to 20:30. Midday bedded in timber. At night feeding continues and rutting bulls move. An Alberta GPS collar study found peaks at dawn and dusk, with the morning peak almost 2 hours after first light. Times are a sketch, Tip.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">An elk day (late September)</text><circle cx="130" cy="165" r="112" fill="#dfe6d3"/><text x="130" y="70" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">00</text><text x="201" y="99" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">03</text><text x="230" y="170" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">06</text><text x="201" y="241" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">09</text><text x="130" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">12</text><text x="59" y="241" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">15</text><text x="30" y="170" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">18</text><text x="59" y="99" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">21</text><path d="M77.8 151.0 A54 54 0 0 1 183.5 172.0" fill="none" stroke="#3d4a6b" stroke-width="14" stroke-linecap="butt"/><path d="M203.4 174.7 A74 74 0 0 1 167.0 229.1" fill="none" stroke="#e8590c" stroke-width="18" stroke-linecap="butt"/><path d="M56.6 174.7 A74 74 0 0 1 71.3 120.0" fill="none" stroke="#e8590c" stroke-width="18" stroke-linecap="butt"/><path d="M149.2 236.5 A74 74 0 0 1 61.6 193.3" fill="none" stroke="#8a9a6b" stroke-width="18" stroke-linecap="butt"/><circle cx="130" cy="165" r="36" fill="#fffaf0"/><text x="130" y="170" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">24 h</text><rect x="258" y="70" width="18" height="14" rx="3" fill="#e8590c"/><text x="282" y="82" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Feed</text><text x="282" y="98" font-size="14" fill="#23261f" text-anchor="start">after dawn, dusk</text><rect x="258" y="104" width="18" height="14" rx="3" fill="#8a9a6b"/><text x="282" y="116" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Bed in timber</text><rect x="258" y="138" width="18" height="14" rx="3" fill="#3d4a6b"/><text x="282" y="150" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Night</text><text x="282" y="166" font-size="14" fill="#23261f" text-anchor="start">feed, rut moves</text><text x="320" y="250" font-size="14" fill="#6b4f35" text-anchor="middle">Alberta collars:</text><text x="320" y="268" font-size="14" fill="#6b4f35" text-anchor="middle">dawn, dusk peaks (80%)</text>
</svg>
