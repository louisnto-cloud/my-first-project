<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 4 of a stalk: walk a hidden route below the ridge and behind trees and bushes, never on the skyline, toward the landmarks near the deer.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
