<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="At the hit site look for five things: blood, hair, bone chips, tissue and scuffed ground. Pink froth means lungs; green bits mean gut; hair only means back out and wait longer.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">At the hit site, look for</text><circle cx="52" cy="120" r="28" fill="#b3261e" stroke="#23261f" stroke-width="2"/><text x="52" y="172" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Blood</text><circle cx="126" cy="120" r="28" fill="#6b4f35" stroke="#23261f" stroke-width="2"/><text x="126" y="172" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Hair</text><circle cx="200" cy="120" r="28" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><text x="200" y="172" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Bone chips</text><circle cx="274" cy="120" r="28" fill="#f2b8b0" stroke="#23261f" stroke-width="2"/><text x="274" y="172" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Tissue</text><circle cx="348" cy="120" r="28" fill="#e9dfa8" stroke="#23261f" stroke-width="2"/><text x="348" y="172" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Scuffs</text><rect x="20" y="196" width="360" height="64" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="220" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Pink froth: lungs. Green bits: gut</text><text x="200" y="244" font-size="14" fill="#23261f" text-anchor="middle">Hair only: back out, wait longer (70%)</text><text x="200" y="288" font-size="14" fill="#6b4f35" text-anchor="middle">Photograph it before you move it (Tip)</text>
</svg>
