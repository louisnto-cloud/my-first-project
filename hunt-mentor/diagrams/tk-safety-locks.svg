<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 304" font-family="sans-serif" role="img" aria-label="Safety ON locks three things on the Tikka: 1 the bolt in the closed position, so to unload you push the safety forward first; 2 the firing pin in the cocked position; 3 the sear and trigger. It only goes ON when the rifle is cocked. A safety is a part; safe is a habit.">
<rect x="0" y="0" width="400" height="304" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Safety ON locks 3 things</text><g data-tip="The bolt, closed|The handle will not lift."><rect x="12" y="44" width="376" height="56" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="34" cy="72" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="77" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="56" y="68" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">The bolt, closed</text><text x="56" y="88" font-size="14" fill="#17201A" text-anchor="start">The handle will not lift.</text></g><g data-tip="The firing pin, cocked|The pin stays held back."><rect x="12" y="108" width="376" height="56" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="34" cy="136" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="141" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="56" y="132" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">The firing pin, cocked</text><text x="56" y="152" font-size="14" fill="#17201A" text-anchor="start">The pin stays held back.</text></g><g data-tip="The sear and trigger|The trigger cannot release the sear."><rect x="12" y="172" width="376" height="56" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="34" cy="200" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="205" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="56" y="196" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">The sear and trigger</text><text x="56" y="216" font-size="14" fill="#17201A" text-anchor="start">The trigger cannot release the sear.</text></g><rect x="12" y="240" width="376" height="52" rx="8" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="24" y="262" font-size="14" fill="#17201A" text-anchor="start">It only goes ON when the rifle is cocked.</text><text x="24" y="282" font-size="14" fill="#17201A" text-anchor="start">A safety is a part. Safe is a habit.</text>
</svg>
