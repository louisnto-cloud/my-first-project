<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A hunter frozen mid step, balanced on one leg. With weight kept on the back foot you can stop at any moment.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="200" width="400" height="100" rx="0" fill="#c9b79c" stroke="none" stroke-width="2"/><path d="M20 200 l6 -6 l6 6" fill="none" stroke="#8b5a2b" stroke-width="2"/><path d="M80 200 l6 -6 l6 6" fill="none" stroke="#8b5a2b" stroke-width="2"/><path d="M140 200 l6 -6 l6 6" fill="none" stroke="#8b5a2b" stroke-width="2"/><path d="M200 200 l6 -6 l6 6" fill="none" stroke="#8b5a2b" stroke-width="2"/><path d="M260 200 l6 -6 l6 6" fill="none" stroke="#8b5a2b" stroke-width="2"/><path d="M320 200 l6 -6 l6 6" fill="none" stroke="#8b5a2b" stroke-width="2"/><path d="M380 200 l6 -6 l6 6" fill="none" stroke="#8b5a2b" stroke-width="2"/><g transform="translate(200 198)"><circle cx="0" cy="-110" r="11" fill="#2f3a2b"/><path d="M0 -98 V-50 M0 -50 L-4 0 M0 -50 L22 -32 L30 -10 M0 -86 L-16 -64 M0 -86 L16 -66" stroke="#2f3a2b" stroke-width="6" fill="none" stroke-linecap="round"/></g><text x="20" y="40" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Can you freeze mid step?</text><line x1="270" y1="90" x2="225.4" y2="134.6" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="220.0,140.0 232.1,136.5 223.5,127.9" fill="#e8590c"/><text x="250" y="80" font-family="sans-serif" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">balanced on one leg</text><text x="20" y="280" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Weight back means you can stop anytime (Tip).</text>
