<text x="48" y="154" font-size="18" font-weight="bold" fill="#c2410c">Shape</text>
<text x="20" y="174" font-size="15" fill="#2f3a2b">ridges, saddles,</text>
<text x="20" y="192" font-size="15" fill="#2f3a2b">benches</text>
<rect x="204" y="126" width="188" height="74" rx="8" fill="#e9eedd"/>
<circle cx="224.0" cy="148.0" r="13" fill="#e8590c" stroke="#fffaf0" stroke-width="1.5"/><text x="224" y="153" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">4</text>
