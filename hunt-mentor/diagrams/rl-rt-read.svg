<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 404" font-family="sans-serif" role="img" aria-label="Eight numbered boxes: the 10 minute map read. 1 Law: MU, season, land status. 2 Access: roads, gates, closures. 3 Shape: ridges, saddles, benches. 4 Face: aspect for the weather. 5 Water: blue lines and green spots. 6 Cover: edges, cutblocks, burns. 7 Pressure: roads, trails, parking. 8 Wind: seat and approach. Same 8 every time, in the same order.">
