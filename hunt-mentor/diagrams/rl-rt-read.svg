<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Eight boxes: the 10 minute map read. 1 Law: MU, season, land status. 2 Access: roads, gates, closures. 3 Shape: ridges, saddles, benches. 4 Face: aspect for the weather. 5 Water: blue lines and green spots. 6 Cover: edges, cutblocks, burns. 7 Pressure: roads, trails, parking. 8 Wind: seat and approach. Same 8 every time, in the same order.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">The 10 minute map read</text><rect x="10" y="44" width="186" height="50" rx="8" fill="#dfe6d3"/><text x="20" y="65" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">1 Law</text><text x="20" y="85" font-size="13" fill="#2f3a2b" text-anchor="start">MU, season, land status</text><rect x="204" y="44" width="186" height="50" rx="8" fill="#dfe6d3"/><text x="214" y="65" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">2 Access</text><text x="214" y="85" font-size="13" fill="#2f3a2b" text-anchor="start">roads, gates, closures</text><rect x="10" y="100" width="186" height="50" rx="8" fill="#dfe6d3"/><text x="20" y="121" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">3 Shape</text><text x="20" y="141" font-size="13" fill="#2f3a2b" text-anchor="start">ridges, saddles, benches</text><rect x="204" y="100" width="186" height="50" rx="8" fill="#dfe6d3"/><text x="214" y="121" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">4 Face</text><text x="214" y="141" font-size="13" fill="#2f3a2b" text-anchor="start">aspect for the weather</text><rect x="10" y="156" width="186" height="50" rx="8" fill="#dfe6d3"/><text x="20" y="177" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">5 Water</text><text x="20" y="197" font-size="13" fill="#2f3a2b" text-anchor="start">blue lines, green spots</text><rect x="204" y="156" width="186" height="50" rx="8" fill="#dfe6d3"/><text x="214" y="177" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">6 Cover</text><text x="214" y="197" font-size="13" fill="#2f3a2b" text-anchor="start">edges, cutblocks, burns</text><rect x="10" y="212" width="186" height="50" rx="8" fill="#dfe6d3"/><text x="20" y="233" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">7 Pressure</text><text x="20" y="253" font-size="13" fill="#2f3a2b" text-anchor="start">roads, trails, parking</text><rect x="204" y="212" width="186" height="50" rx="8" fill="#dfe6d3"/><text x="214" y="233" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">8 Wind</text><text x="214" y="253" font-size="13" fill="#2f3a2b" text-anchor="start">seat and approach</text><text x="200" y="292" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Same 8 every time, in the same order</text>
</svg>
