<circle cx="28.0" cy="230.0" r="13" fill="#e8590c" stroke="#fffaf0" stroke-width="1.5"/><text x="28" y="235" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">5</text>
<text x="48" y="236" font-size="18" font-weight="bold" fill="#c2410c">Water</text>
<text x="20" y="260" font-size="15" fill="#2f3a2b">blue lines, green spots</text>
<rect x="204" y="208" width="188" height="74" rx="8" fill="#e9eedd"/>
<circle cx="224.0" cy="230.0" r="13" fill="#e8590c" stroke="#fffaf0" stroke-width="1.5"/><text x="224" y="235" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">6</text>
