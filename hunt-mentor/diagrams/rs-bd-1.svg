<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 1: measure the bed length. It tells you deer, elk or moose, and fawn or adult.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1. Size</text>
<ellipse cx="200" cy="150" rx="120" ry="50" fill="#e0d4b0" stroke="#6b4f35" stroke-width="2" stroke-dasharray="6 5"/><line x1="80" y1="215" x2="320" y2="215" stroke="#e8590c" stroke-width="3"/><text x="200" y="240" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Measure the length</text><text x="200" y="270" font-size="15" fill="#23261f" text-anchor="middle">Deer, elk or moose? Fawn or adult?</text>
</svg>
