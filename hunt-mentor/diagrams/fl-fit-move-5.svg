<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Plank or loaded carry: hold a straight plank, or walk carrying two heavy jugs. Builds the trunk that holds a pack steady.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="30" cy="32" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="30" y="39" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">5</text>
<text x="56" y="39" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="start">Trunk: plank or carry</text>
<rect x="10" y="228" width="380" height="8" rx="2" fill="#c9b79c"/><circle cx="110" cy="186" r="10" fill="#2f3a2b"/><line x1="120" y1="190" x2="300" y2="206" stroke="#2f3a2b" stroke-width="7" stroke-linecap="round"/><line x1="300" y1="206" x2="320" y2="226" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><line x1="130" y1="196" x2="130" y2="226" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><text x="200" y="140" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Straight line, head to heel</text><text x="200" y="100" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Hold 20 to 45 seconds (Tip)</text>
<rect x="10" y="262" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="285.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Straight line. Breathe.</text>
</svg>
