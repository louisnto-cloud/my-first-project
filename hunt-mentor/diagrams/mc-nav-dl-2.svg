<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Lost scenario drill step 2: he says you are lost. You do STOP out loud: sit, think, observe, plan, while he times you.">
<rect width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c"/><text x="26" y="31" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">2</text><text x="52" y="32" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">&quot;You are lost&quot;: STOP</text><rect x="20" y="56" width="360" height="200" rx="8" fill="#dfe6d3"/><circle cx="90" cy="160" r="40" fill="#e8590c"/><text x="90" y="166" font-size="18" fill="#fffaf0" text-anchor="middle" font-weight="bold">STOP</text><text x="170" y="100" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Sit. Think. Observe.</text><text x="170" y="130" font-size="15" fill="#23261f" text-anchor="start">Plan out loud</text><text x="170" y="160" font-size="15" fill="#23261f" text-anchor="start">He times you</text>
</svg>
