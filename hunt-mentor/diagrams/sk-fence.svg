<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A blood trail reaches a fence with a No Trespassing sign. The hunter stops. Ask the owner first, in writing if you can. No answer: call a conservation officer. The Trespass Act has no tracking exception.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">Trail hits a fence or a sign: stop</text><circle cx="40" cy="250" r="5" fill="#b3261e"/><circle cx="80" cy="230" r="5" fill="#b3261e"/><circle cx="120" cy="214" r="5" fill="#b3261e"/><circle cx="160" cy="200" r="5" fill="#b3261e"/><g stroke="#6b4f35" stroke-width="4"><line x1="230" y1="120" x2="230" y2="270"/></g><line x1="200" y1="80" x2="260" y2="160" stroke="#23261f" stroke-width="1.5" opacity="0"/><line x1="200" y1="110" x2="260" y2="190" stroke="#23261f" stroke-width="1.5" opacity="0"/><line x1="200" y1="140" x2="260" y2="220" stroke="#23261f" stroke-width="1.5" opacity="0"/><line x1="200" y1="170" x2="260" y2="250" stroke="#23261f" stroke-width="1.5" opacity="0"/><line x1="200" y1="200" x2="260" y2="280" stroke="#23261f" stroke-width="1.5" opacity="0"/><line x1="230" y1="60" x2="230" y2="280" stroke="#6b4f35" stroke-width="5"/><line x1="200" y1="110" x2="400" y2="110" stroke="#23261f" stroke-width="1.5" stroke-dasharray="10 4"/><line x1="200" y1="150" x2="400" y2="150" stroke="#23261f" stroke-width="1.5" stroke-dasharray="10 4"/><line x1="200" y1="190" x2="400" y2="190" stroke="#23261f" stroke-width="1.5" stroke-dasharray="10 4"/><line x1="200" y1="230" x2="400" y2="230" stroke="#23261f" stroke-width="1.5" stroke-dasharray="10 4"/><rect x="246" y="70" width="130" height="50" rx="4" fill="#fff" stroke="#b3261e" stroke-width="3"/><text x="311" y="92" font-size="15" font-weight="bold" text-anchor="middle" fill="#b3261e">NO</text><text x="311" y="110" font-size="13" font-weight="bold" text-anchor="middle" fill="#b3261e">TRESPASSING</text><circle cx="184" cy="178" r="11" fill="#e8590c"/><text x="150" y="150" font-size="16" font-weight="bold" text-anchor="middle" fill="#e8590c">Stop</text><text x="20" y="60" font-size="15" font-weight="bold" fill="#23261f">Ask the owner first,</text><text x="20" y="80" font-size="15" fill="#23261f">in writing if you can.</text><text x="20" y="108" font-size="15" fill="#23261f">No answer: call a</text><text x="20" y="126" font-size="15" fill="#23261f">conservation officer.</text><text x="316" y="270" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">No tracking</text><text x="316" y="288" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">exception</text>
</svg>
