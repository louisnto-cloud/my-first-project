<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Memory hooks: 10 a day, minutes of dry fire. One cold shot: the first shot counts. No ammo in the dry fire room. Write it before you leave. Bump equals check: confirm zero after a knock.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Memory hooks</text><rect x="20" y="50" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="75" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">10 a day</text><text x="170" y="75" font-size="15" fill="#23261f" text-anchor="start">minutes of dry fire</text><rect x="20" y="96" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="121" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">1 cold shot</text><text x="170" y="121" font-size="15" fill="#23261f" text-anchor="start">first shot counts</text><rect x="20" y="142" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="167" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">No ammo</text><text x="170" y="167" font-size="15" fill="#23261f" text-anchor="start">in the dry fire room</text><rect x="20" y="188" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="213" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Write it</text><text x="170" y="213" font-size="15" fill="#23261f" text-anchor="start">before you leave</text><rect x="20" y="234" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="259" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Bump = check</text><text x="170" y="259" font-size="15" fill="#23261f" text-anchor="start">zero after a knock</text>
</svg>
