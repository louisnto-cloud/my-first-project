<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Middle against your back: the heaviest things, water and food now, meat later.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="30" cy="32" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="30" y="39" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">2</text>
<text x="56" y="39" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="start">Core: heavy, close</text>
<rect x="140" y="60" width="120" height="180" rx="20" fill="#dfe6d3" stroke="#8b5a2b" stroke-width="4"/><rect x="150" y="190" width="100" height="42" rx="10" fill="#2f3a2b"/><rect x="150" y="120" width="46" height="66" rx="8" fill="#e8590c"/><text x="173" y="158" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Water</text><line x1="140" y1="120" x2="140" y2="186" stroke="#e8590c" stroke-width="6" stroke-linecap="round"/><text x="100" y="150" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Back</text>
<rect x="10" y="262" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="285.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Heavy against your spine.</text>
</svg>
