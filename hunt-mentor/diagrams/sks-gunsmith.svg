<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Take it to a gunsmith if: the firing pin is silent or stuck after cleaning; the bore is pitted, bulged or ringed; a 6th round fits the magazine; you have any headspace doubt; it fires on its own, doubles or slam fires; cases come out cracked, bulged or split; the safety does not block the trigger.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Take it to a gunsmith if</text>
<circle cx="32.0" cy="56.0" r="11.0" fill="#FF6A13" stroke="#FFFFFF" stroke-width="2"/><text x="32.0" y="61.0" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">!</text><text x="52.0" y="61.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Pin silent or stuck after cleaning</text><circle cx="32.0" cy="88.0" r="11.0" fill="#FF6A13" stroke="#FFFFFF" stroke-width="2"/><text x="32.0" y="93.0" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">!</text><text x="52.0" y="93.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Bore pitted, bulged or ringed</text><circle cx="32.0" cy="120.0" r="11.0" fill="#FF6A13" stroke="#FFFFFF" stroke-width="2"/><text x="32.0" y="125.0" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">!</text><text x="52.0" y="125.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">A 6th round fits the magazine</text><circle cx="32.0" cy="152.0" r="11.0" fill="#FF6A13" stroke="#FFFFFF" stroke-width="2"/><text x="32.0" y="157.0" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">!</text><text x="52.0" y="157.0" font-size="14" fill="#17201A" text-anchor="start">Bolt closes on a headspace doubt</text><circle cx="32.0" cy="184.0" r="11.0" fill="#FF6A13" stroke="#FFFFFF" stroke-width="2"/><text x="32.0" y="189.0" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">!</text><text x="52.0" y="189.0" font-size="14" fill="#17201A" text-anchor="start">Fires, doubles or slam fires</text><circle cx="32.0" cy="216.0" r="11.0" fill="#FF6A13" stroke="#FFFFFF" stroke-width="2"/><text x="32.0" y="221.0" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">!</text><text x="52.0" y="221.0" font-size="14" fill="#17201A" text-anchor="start">Cracks, bulged or split cases</text><circle cx="32.0" cy="248.0" r="11.0" fill="#FF6A13" stroke="#FFFFFF" stroke-width="2"/><text x="32.0" y="253.0" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">!</text><text x="52.0" y="253.0" font-size="14" fill="#17201A" text-anchor="start">Safety does not block the trigger</text>
<text x="200.0" y="288.0" font-size="14" fill="#17201A" text-anchor="middle">Unload first. Never ship or carry it loaded.</text>
</svg>
