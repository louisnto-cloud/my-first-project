<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 426" font-family="sans-serif" role="img" aria-label="Season bars, September 2026 to March 2027, for Canada and cackling geese, 10 a day, 30 in possession (99%). District 3, Kamloops: 8 to 20 September, 1 October to 23 December, 1 to 10 March. District 8, Okanagan: 20 September to 28 November, 20 December to 5 January, 21 February to 10 March in a year that is not a leap year. District 2, Mission: 5 to 15 September, 10 October to 22 November, 19 December to 10 January, 10 February to 10 March. Gaps are closed. District 3 is closed 21 to 30 September.">
