<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 344" font-family="sans-serif" role="img" aria-label="Deer hearing chart. Deer hear from about 115 hertz to 54 kilohertz, best around 4 to 8 kilohertz. Zippers, Velcro, nylon swish, metal on metal and snapping twigs all sit in that best band.">
<rect width="400" height="344" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">What a deer hears best</text>
<g stroke="#dfe6d3" stroke-width="2" fill="none"><line x1="30" y1="62" x2="30" y2="176"/><line x1="156" y1="62" x2="156" y2="176"/><line x1="282" y1="62" x2="282" y2="176"/><line x1="370" y1="62" x2="370" y2="176"/></g>
<g font-size="14" fill="#2f3a2b" text-anchor="middle"><text x="34" y="54">100 Hz</text><text x="156" y="54">1 kHz</text><text x="282" y="54">10 kHz</text><text x="366" y="54">50 kHz</text></g>
<g data-tip="Deer range|Deer hear about 115 Hz (hertz) to 54 kHz (kilohertz). Truck doors, tailgates and loud voices at the pullout can clear a slope (Tip).">
<rect x="38" y="68" width="337" height="38" rx="8" fill="#8a9a6b"/>
<text x="48" y="93" font-size="16" font-weight="bold" fill="#ffffff">Deer: 115 Hz to 54 kHz</text>
</g>
<g data-tip="Best band: 4 to 8 kHz|Deer hear best around 4 to 8 kHz (kilohertz). Each ear swivels on its own to point at a sound.">
<rect x="232" y="114" width="38" height="38" rx="6" fill="#e8590c"/>
<text x="216" y="140" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="end">best: 4 to 8 kHz</text>
<path d="M251 152 V194" stroke="#e8590c" stroke-width="3" fill="none"/><path d="M251 200 l-7 -10 h14z" fill="#e8590c"/>
</g>
<text x="30" y="170" font-size="14" fill="#6b4f35">low pitch</text>
<text x="370" y="170" font-size="14" fill="#6b4f35" text-anchor="end">high pitch</text>
<g data-tip="Your gear is in the band|Zippers, Velcro, nylon swish, metal on metal and snapping twigs sit right in the best band. Tape over any clinking metal on pack and sling.">
<rect x="10" y="200" width="380" height="104" rx="10" fill="#f6dccb"/>
<text x="200" y="224" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">In the danger band</text>
<g transform="translate(46 252)"><path d="M-3 -14 V14 M3 -14 V14" stroke="#6b4f35" stroke-width="2" fill="none"/><path d="M-6 -12 h5 M1 -8 h5 M-6 -4 h5 M1 0 h5 M-6 4 h5" stroke="#6b4f35" stroke-width="2" fill="none"/><rect x="-5" y="6" width="10" height="10" rx="2" fill="#6b4f35"/></g>
<g transform="translate(122 252)"><rect x="-16" y="-12" width="32" height="10" rx="2" fill="#4a7fb0"/><rect x="-16" y="2" width="32" height="10" rx="2" fill="#2f63a6"/><path d="M-12 -2 v4 M-6 -2 v4 M0 -2 v4 M6 -2 v4 M12 -2 v4" stroke="#2f3a2b" stroke-width="1.6" fill="none"/></g>
<g transform="translate(200 252)"><path d="M-16 -12 C-8 -16 8 -16 16 -12 L14 14 H-14z" fill="#6b7a55"/><path d="M-16 -2 q8 -6 16 0 t16 0" stroke="#dfe6d3" stroke-width="2" fill="none"/></g>
<g transform="translate(278 252)"><rect x="-16" y="-6" width="18" height="8" rx="3" fill="#8a8f96"/><rect x="-2" y="2" width="18" height="8" rx="3" fill="#5f656b"/><path d="M4 -10 l4 -4 M10 -8 l5 -3" stroke="#e8590c" stroke-width="2" fill="none"/></g>
<g transform="translate(354 252)"><path d="M-18 6 L-2 -2 M2 -2 L18 -10" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M-1 -10 l2 6 M4 -11 l-1 6" stroke="#e8590c" stroke-width="2" fill="none"/></g>
<g font-size="15" fill="#2f3a2b" text-anchor="middle"><text x="46" y="292">zipper</text><text x="122" y="292">Velcro</text><text x="200" y="292">nylon</text><text x="278" y="292">metal</text><text x="354" y="292">twig</text></g>
</g>
<g data-tip="Walk like a deer (Tip)|Walk, stop, walk. Natural rhythms like a squirrel or another deer pass. Steady two legged crunching does not.">
<text x="200" y="330" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Tip: walk, stop, walk, like a deer</text>
</g>
</svg>
