<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 236" role="img" aria-label="Four cards. Limited Entry Hunting, a draw, in Region 7A. Caribou: draw only. Maps G6, G7 and G8: goat hunting only for permit holders. Map G22: caribou in Zone D of 7-39 only for permit holders. Goat closed or draw only areas: Maps G1, G5 to G9, G18, G21, G23 and G24." font-family="sans-serif">
<rect x="0" y="0" width="400" height="236" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Draw only (LEH) in Region 7A</text>
<rect x="6" y="40" width="190" height="96" rx="10" fill="#ffffff" stroke="#6a4c93" stroke-width="2.5"/>
<path d="M6 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#6a4c93"/>
<text x="101" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Caribou</text>
<text x="14" y="106" font-size="14" fill="#23261f" text-anchor="start">Limited Entry Hunting</text>
<text x="14" y="124" font-size="14" fill="#23261f" text-anchor="start">only</text>
<rect x="204" y="40" width="190" height="96" rx="10" fill="#ffffff" stroke="#6a4c93" stroke-width="2.5"/>
<path d="M204 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#6a4c93"/>
<text x="299" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Goats, Maps G6, G7,</text>
<text x="299" y="76" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">G8</text>
<text x="212" y="106" font-size="14" fill="#23261f" text-anchor="start">Goat hunting for LEH</text>
<text x="212" y="124" font-size="14" fill="#23261f" text-anchor="start">permit holders only</text>
<rect x="6" y="144" width="190" height="78" rx="10" fill="#ffffff" stroke="#6a4c93" stroke-width="2.5"/>
<path d="M6 154 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#6a4c93"/>
<text x="101" y="162" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Caribou, Map G22</text>
<text x="14" y="192" font-size="14" fill="#23261f" text-anchor="start">Zone D of MU 7-39: LEH</text>
