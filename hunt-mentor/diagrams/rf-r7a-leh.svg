<rect x="204" y="144" width="190" height="78" rx="10" fill="#ffffff" stroke="#6a4c93" stroke-width="2.5"/>
<path d="M204 154 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#6a4c93"/>
<text x="299" y="162" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Goat closed or LEH</text>
<text x="212" y="192" font-size="14" fill="#23261f" text-anchor="start">Maps G1, G5 to G9, G18,</text>
<text x="212" y="210" font-size="14" fill="#23261f" text-anchor="start">G21, G23, G24</text>
