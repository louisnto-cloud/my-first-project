<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Wolf or dog. Measure length without claws. A front print 10 cm or longer, or a hind print 9 cm or longer, is likely a wolf; 82 percent of dogs have smaller feet. Big dog breeds overlap, so read the trail too.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wolf or dog? Measure it</text>
<g transform="translate(110 150) rotate(0) scale(2.6)" fill="#8b5a2b"><path d="M-10 6 Q0 -4 10 6 Q12 16 0 18 Q-12 16 -10 6 Z"/><ellipse cx="-11" cy="-6" rx="4" ry="5.5"/><ellipse cx="11" cy="-6" rx="4" ry="5.5"/><ellipse cx="-4" cy="-15" rx="4" ry="5.5"/><ellipse cx="4" cy="-15" rx="4" ry="5.5"/><path d="M-4 -23 l0 -4 M4 -23 l0 -4 M-12 -13 l-1 -4 M12 -13 l1 -4" stroke="#23261f" stroke-width="2"/></g><line x1="170" y1="92" x2="170" y2="200" stroke="#e8590c" stroke-width="3"/><text x="170" y="222" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">length</text><rect x="210" y="76" width="176" height="130" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="298" y="102" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Likely wolf if</text><text x="298" y="128" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Front 10 cm+</text><text x="298" y="152" font-size="14" fill="#23261f" text-anchor="middle">or</text><text x="298" y="176" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Hind 9 cm+</text><text x="298" y="198" font-size="13" fill="#6b4f35" text-anchor="middle">no claws in length</text><text x="200" y="240" font-size="15" fill="#23261f" text-anchor="middle">82% of dogs have smaller feet</text><text x="200" y="262" font-size="15" fill="#6b4f35" text-anchor="middle">Big breeds overlap. Use the trail too.</text>
</svg>
