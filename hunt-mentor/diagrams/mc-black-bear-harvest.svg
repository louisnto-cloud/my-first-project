<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart, resident black bear hunters in MU 3-27 who killed a bear: 2020 29 percent, 2021 18 percent, 2022 26 percent, 2023 14 percent, 2024 31 percent. About 1 in 4 on average, about 28 hunter days per bear. Source: BC big game harvest statistics, survey estimates.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">MU 3-27: hunters who got a bear</text><rect x="40" y="92.15" width="46" height="157.85" rx="4" fill="#8b5a2b"/><text x="63" y="86.15" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">29%</text><text x="63" y="272" font-size="14" fill="#23261f" text-anchor="middle">2020</text><rect x="110" y="152.65" width="46" height="97.35" rx="4" fill="#8b5a2b"/><text x="133" y="146.65" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">18%</text><text x="133" y="272" font-size="14" fill="#23261f" text-anchor="middle">2021</text><rect x="180" y="108.1" width="46" height="141.9" rx="4" fill="#8b5a2b"/><text x="203" y="102.1" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">26%</text><text x="203" y="272" font-size="14" fill="#23261f" text-anchor="middle">2022</text><rect x="250" y="170.8" width="46" height="79.2" rx="4" fill="#8b5a2b"/><text x="273" y="164.8" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">14%</text><text x="273" y="272" font-size="14" fill="#23261f" text-anchor="middle">2023</text><rect x="320" y="78.94999999999999" width="46" height="171.05" rx="4" fill="#8b5a2b"/><text x="343" y="72.94999999999999" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">31%</text><text x="343" y="272" font-size="14" fill="#23261f" text-anchor="middle">2024</text><line x1="30" y1="250" x2="380" y2="250" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="292" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">About 1 in 4. About 28 hunter days a bear.</text>
</svg>
