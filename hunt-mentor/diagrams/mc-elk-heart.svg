<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Chest seen from the side, enlarged. Two big lungs fill the chest. The heart sits low between them, at the elbow line. The aorta and the big vein run from the heart up along the spine. The lungs are the bigger and safer target.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Heart and the big pipes</text><rect x="40" y="50" width="320" height="200" rx="30" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/><path d="M60 70 Q200 56 340 70" fill="none" stroke="#6b4f35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="150" cy="130" rx="70" ry="50" fill="#e89a9a" stroke="#23261f" stroke-width="1.5"/><ellipse cx="250" cy="130" rx="70" ry="50" fill="#f0b3b3" stroke="#23261f" stroke-width="1.5"/><path d="M200 190 C176 170 186 212 200 226 C214 212 224 170 200 190 Z" fill="#b03a2e" stroke="#23261f" stroke-width="1.5"/><path d="M204 194 Q214 140 210 92 Q206 76 300 72" fill="none" stroke="#b03a2e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M196 196 Q180 150 190 96 Q190 80 100 76" fill="none" stroke="#4a6fa5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="140" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Lung</text><text x="290" y="140" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Lung</text><text x="200" y="270" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Heart: low, at the elbow line</text><line x1="200" y1="256" x2="200" y2="226" stroke="#e8590c" stroke-width="1.5"/><text x="330" y="100" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Aorta</text><line x1="330" y1="86" x2="300" y2="74" stroke="#e8590c" stroke-width="1.5"/><text x="78" y="100" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Big vein</text><line x1="78" y1="86" x2="110" y2="78" stroke="#e8590c" stroke-width="1.5"/><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Lungs are the bigger, safer target (85%)</text>
</svg>
