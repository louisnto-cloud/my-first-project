<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 428" font-family="sans-serif" role="img" aria-label="Taking the barrelled action out of the stock, which you rarely need: remove the bolt and magazine, undo 1 the rear and 2 the front Torx receiver screws, pull the trigger guard down, and lift the barrelled action up out of the stock. To refit: the metal recoil block goes in the stock, pull the action back to take up the slack, then tighten to 7 newton metres with a metal guard. Check zero after.">
