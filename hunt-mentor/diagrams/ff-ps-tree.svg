<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Standing against a tree. The support hand or glove goes between the rifle and the bark. Never lay the barrel on the bark: a hard rest under the barrel makes the shot go high.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Tree rest: hand between rifle and bark</text><rect x="280" y="40" width="40" height="220" rx="6" fill="#6b4f35" stroke="none" stroke-width="2"/><g transform="translate(190 240) scale(1.0)"><circle cx="0" cy="-78" r="9" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3.5"/><line x1="0" y1="-68" x2="0" y2="-30" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-30" x2="-10" y2="0" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-30" x2="10" y2="0" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-60" x2="14" y2="-44" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-60" x2="-12" y2="-44" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/></g><line x1="184" y1="178" x2="360" y2="172" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/><circle cx="282" cy="175" r="9" fill="#d4a373" stroke="#2f3a2b" stroke-width="2"/><text x="110" y="90" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Hand or glove</text><text x="110" y="108" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">against the tree</text><line x1="170" y1="110" x2="276" y2="172" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><path d="M321 221 l18 18 M339 221 l-18 18" fill="none" stroke="#b3261e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="352" y="285" font-size="13" font-weight="bold" fill="#b3261e" text-anchor="end">barrel on bark</text>
</svg>
