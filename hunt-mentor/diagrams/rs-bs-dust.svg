<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" font-family="sans-serif" role="img" aria-label="Dust bowls. Grouse: one round scrape about 20 centimetres across in fine dry soil, often with a feather or two. Quail: many small bowls 7 to 15 centimetres across where a covey bathed together. Look on dry, fine, sunny soil on trails and road edges.">
<rect x="0" y="0" width="400" height="296" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Dust bowls</text>
<rect x="0" y="150" width="400" height="110" rx="0" fill="#d9c49a"/><ellipse cx="120" cy="190" rx="64" ry="22" fill="#c4a979" stroke="#8b6b3e" stroke-width="2"/><line x1="56" y1="228" x2="184" y2="228" stroke="#e8590c" stroke-width="3"/><text x="120" y="250" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">grouse: ~20 cm</text><line x1="100" y1="186" x2="106" y2="178" stroke="#6b4f35" stroke-width="2"/><line x1="112" y1="186" x2="118" y2="178" stroke="#6b4f35" stroke-width="2"/><line x1="124" y1="186" x2="130" y2="178" stroke="#6b4f35" stroke-width="2"/><ellipse cx="270" cy="190" rx="22" ry="9" fill="#c4a979" stroke="#8b6b3e" stroke-width="2"/><ellipse cx="320" cy="190" rx="22" ry="9" fill="#c4a979" stroke="#8b6b3e" stroke-width="2"/><ellipse cx="350" cy="190" rx="22" ry="9" fill="#c4a979" stroke="#8b6b3e" stroke-width="2"/><line x1="248" y1="228" x2="292" y2="228" stroke="#e8590c" stroke-width="3"/><text x="310" y="250" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">quail: 7 to 15 cm</text><text x="120" y="90" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">one big bowl,</text><text x="120" y="110" font-size="15" fill="#23261f" text-anchor="middle">a feather or two</text><text x="310" y="90" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">many small bowls</text><text x="310" y="110" font-size="15" fill="#23261f" text-anchor="middle">a covey bathed</text><text x="200" y="286" font-size="14" fill="#6b4f35" text-anchor="middle">Dry, fine, sunny soil on a trail or road edge</text>
</svg>
