<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Elk activity over 24 hours: two peaks, around dawn and dusk, from a collar study. Dawn: feeding in meadows and openings, then a drift into timber. Midday: bedded in cool timber. Dusk: back out to feed. In the rut, bulls move all night.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Elk day: two peaks</text><line x1="30" y1="230" x2="390" y2="230" stroke="#2f3a2b" stroke-width="2"/><text x="30" y="252" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">00</text><text x="120" y="252" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">06</text><text x="210" y="252" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">12</text><text x="300" y="252" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">18</text><text x="390" y="252" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">24</text><path d="M30 200 Q70 190 100 120 Q115 90 130 120 Q160 200 210 210 Q260 210 280 120 Q295 90 310 120 Q340 190 390 200" fill="#e8590c" fill-opacity=".25" stroke="#e8590c" stroke-width="4"/><text x="115" y="82" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Dawn feed</text><text x="295" y="82" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Dusk feed</text><text x="205" y="160" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bedded in</text><text x="205" y="178" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">cool timber</text><path d="M30 170 L60 160 M330 160 L390 170" stroke="#8b5a2b" stroke-width="3" stroke-dasharray="6 5"/><text x="10" y="286" font-size="14" font-weight="bold" fill="#8b5a2b" text-anchor="start">Dashed: in the rut, bulls move all night</text>
</svg>
