<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Black bear year by month. Denned roughly December to March. Leave the den April to May. Green up feeding April to June. Mating early June to mid July. Berries July to September and fall feeding, called hyperphagia, August to October. Den entry mid October to late November. Bars are approximate, from the BC account, WildSafeBC and a study just south of BC.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">The black bear year</text><text x="116.0" y="62" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">J</text><text x="140.0" y="62" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">F</text><text x="164.0" y="62" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">M</text><text x="188.0" y="62" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">A</text><text x="212.0" y="62" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">M</text><text x="236.0" y="62" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">J</text><text x="260.0" y="62" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">J</text><text x="284.0" y="62" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">A</text><text x="308.0" y="62" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">S</text><text x="332.0" y="62" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">O</text><text x="356.0" y="62" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">N</text><text x="380.0" y="62" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">D</text><text x="12" y="87" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Denned</text><rect x="104" y="73" width="288.0" height="20" rx="4" fill="#dfe6d3"/><rect x="104.0" y="73" width="79.19999999999999" height="20" rx="4" fill="#4a7fb0"/><rect x="356.0" y="73" width="36.0" height="20" rx="4" fill="#4a7fb0"/><text x="12" y="115" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Den out</text><rect x="104" y="101" width="288.0" height="20" rx="4" fill="#dfe6d3"/><rect x="178.4" y="101" width="40.8" height="20" rx="4" fill="#8a9a6b"/><text x="12" y="143" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Green up</text><rect x="104" y="129" width="288.0" height="20" rx="4" fill="#dfe6d3"/><rect x="183.2" y="129" width="64.80000000000001" height="20" rx="4" fill="#8a9a6b"/><text x="12" y="171" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Mating</text><rect x="104" y="157" width="288.0" height="20" rx="4" fill="#dfe6d3"/><rect x="224.0" y="157" width="36.0" height="20" rx="4" fill="#8b5a2b"/><text x="12" y="199" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Berries</text><rect x="104" y="185" width="288.0" height="20" rx="4" fill="#dfe6d3"/><rect x="255.2" y="185" width="84.00000000000003" height="20" rx="4" fill="#e8590c"/><text x="12" y="227" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Fall feed</text><rect x="104" y="213" width="288.0" height="20" rx="4" fill="#dfe6d3"/><rect x="272.0" y="213" width="72.0" height="20" rx="4" fill="#e8590c"/><text x="12" y="255" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Den in</text><rect x="104" y="241" width="288.0" height="20" rx="4" fill="#dfe6d3"/><rect x="332.0" y="241" width="36.0" height="20" rx="4" fill="#4a7fb0"/><text x="200" y="292" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cubs are born in the den in January or February</text>
</svg>
