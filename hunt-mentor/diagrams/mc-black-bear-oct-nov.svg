<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="October versus November for black bears. October: most bears are still out, feeding on the last berries, fruit, apples and fish for much of the day, and sows with cubs start to den. November: many bears are denned, sows first and big males last; bears stay out only where food lasts, like orchards or fish; snow tracks show who is still up. The Region 3 fall season runs to 30 November.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">October vs November</text><rect x="10" y="52" width="186" height="200" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><rect x="204" y="52" width="186" height="200" rx="8" fill="#fffaf0" stroke="#4a7fb0" stroke-width="2"/><text x="103" y="78" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">October</text><text x="297" y="78" font-size="17" font-weight="bold" fill="#4a7fb0" text-anchor="middle">November</text><text x="20" y="104" font-size="14" fill="#23261f" text-anchor="start">Most bears still out</text><text x="20" y="123" font-size="14" fill="#23261f" text-anchor="start">Last berries, fruit,</text><text x="20" y="142" font-size="14" fill="#23261f" text-anchor="start">apples, fish</text><text x="20" y="161" font-size="14" fill="#23261f" text-anchor="start">Feeding much of</text><text x="20" y="180" font-size="14" fill="#23261f" text-anchor="start">the day</text><text x="20" y="199" font-size="14" fill="#23261f" text-anchor="start">Sows with cubs</text><text x="20" y="218" font-size="14" fill="#23261f" text-anchor="start">start to den</text><text x="214" y="104" font-size="14" fill="#23261f" text-anchor="start">Many bears denned</text><text x="214" y="123" font-size="14" fill="#23261f" text-anchor="start">Sows den first</text><text x="214" y="142" font-size="14" fill="#23261f" text-anchor="start">Big males last</text><text x="214" y="161" font-size="14" fill="#23261f" text-anchor="start">Out only where food</text><text x="214" y="180" font-size="14" fill="#23261f" text-anchor="start">lasts (orchards, fish)</text><text x="214" y="199" font-size="14" fill="#23261f" text-anchor="start">Snow tracks show</text><text x="214" y="218" font-size="14" fill="#23261f" text-anchor="start">who is still up</text><text x="200" y="284" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fall season runs to 30 November (Region 3)</text>
</svg>
