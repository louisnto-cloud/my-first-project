<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 410" font-family="sans-serif" role="img" aria-label="After you shoot a moose, five musts. 1: cancel the species licence immediately after the kill, before handling. 2: keep the antlers naturally attached to part of the upper skull, with the licence, until home. 3: leave evidence of sex attached, the tail or a hide piece plus a testicle or part of the penis. 4: take all edible portions, neck, ribs, four quarters and loins. 5: file the Mandatory Hunter Report by 31 March, hunt or no hunt.">
<rect x="0" y="0" width="400" height="410" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">After the shot: 5 musts</text><rect x="8" y="42" width="384" height="58" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><circle cx="36" cy="71" r="17" fill="#e8590c"/><text x="36" y="77" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="64" y="66" font-size="16" font-weight="bold" fill="#23261f" text-anchor="start">Cancel the licence</text><text x="64" y="88" font-size="14" fill="#23261f" text-anchor="start">right away, before handling</text><path d="M36 92 L36 112" stroke="#2f3a2b" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M33.4 106.6 L36.0 112.0 L38.6 106.6" stroke="#2f3a2b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="114" width="384" height="58" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="2"/><circle cx="36" cy="143" r="17" fill="#e8590c"/><text x="36" y="149" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="64" y="138" font-size="16" font-weight="bold" fill="#23261f" text-anchor="start">Antlers stay on the skull</text><text x="64" y="160" font-size="14" fill="#23261f" text-anchor="start">with the licence, until home</text><path d="M36 164 L36 184" stroke="#2f3a2b" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M33.4 178.6 L36.0 184.0 L38.6 178.6" stroke="#2f3a2b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="186" width="384" height="58" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="2"/><circle cx="36" cy="215" r="17" fill="#e8590c"/><text x="36" y="221" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="64" y="210" font-size="16" font-weight="bold" fill="#23261f" text-anchor="start">Evidence of sex attached</text><text x="64" y="232" font-size="14" fill="#23261f" text-anchor="start">tail or hide, plus testicle or penis</text><path d="M36 236 L36 256" stroke="#2f3a2b" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M33.4 250.6 L36.0 256.0 L38.6 250.6" stroke="#2f3a2b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="258" width="384" height="58" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="2"/><circle cx="36" cy="287" r="17" fill="#e8590c"/><text x="36" y="293" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="64" y="282" font-size="16" font-weight="bold" fill="#23261f" text-anchor="start">Take all edible portions</text><text x="64" y="304" font-size="14" fill="#23261f" text-anchor="start">neck, ribs, 4 quarters, loins</text><path d="M36 308 L36 328" stroke="#2f3a2b" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M33.4 322.6 L36.0 328.0 L38.6 322.6" stroke="#2f3a2b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="330" width="384" height="58" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><circle cx="36" cy="359" r="17" fill="#e8590c"/><text x="36" y="365" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="64" y="354" font-size="16" font-weight="bold" fill="#23261f" text-anchor="start">Mandatory Hunter Report</text><text x="64" y="376" font-size="14" fill="#23261f" text-anchor="start">by 31 March, hunt or no hunt</text>
</svg>
