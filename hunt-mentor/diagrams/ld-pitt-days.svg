<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 274" font-family="sans-serif" role="img" aria-label="Week grid for Pitt Addington Marsh Wildlife Management Area. Waterfowl hunting only on Wednesdays, Saturdays and Sundays in the general season, only in the marked parts. Monday, Tuesday, Thursday and Friday: no hunting. Blinds come out each day. No vehicles, camping or fires. The Fraser Valley special licence and insurance apply.">
