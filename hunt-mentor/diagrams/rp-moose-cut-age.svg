<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart from one BC study of 46 GPS collared moose, 2004 to 2019. Cutblocks 0 to 9 years old: avoided. 10 to 30 years old: selected. Over 30 years old: avoided. Bar heights show the pattern, not exact values.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Moose and cutblock age (one BC study)</text><rect x="25" y="180" width="90" height="70" rx="6" fill="#bbb"/><text x="70" y="272" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">0 to 9 yrs</text><text x="70" y="170" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">avoided</text><rect x="155" y="75" width="90" height="175" rx="6" fill="#e8590c"/><text x="200" y="272" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">10 to 30 yrs</text><text x="200" y="65" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">selected</text><rect x="285" y="180" width="90" height="70" rx="6" fill="#bbb"/><text x="330" y="272" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">over 30 yrs</text><text x="330" y="170" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">avoided</text><line x1="20" y1="250" x2="380" y2="250" stroke="#2f3a2b" stroke-width="2"/><text x="200.0" y="294" font-size="14" fill="#6b4f35" text-anchor="middle">46 GPS collared moose, 2004 to 2019 (65%)</text>
</svg>
