<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Mount step 1: stand with feet about shoulder width, front foot toward where the bird will be, gun low with the butt under the armpit and the muzzle up, safety on.">
<rect width="400" height="300" fill="#EEF1EA"/>
<circle cx="24" cy="22" r="15" fill="#1F3D2B"/><text x="24" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="46" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Ready: low gun</text>
<circle cx="110" cy="70" r="16" fill="#6b5a45" stroke="#17201A" stroke-width="1.2"/><rect x="92" y="56" width="34" height="9" rx="3" fill="#FF6A13"/><path d="M96 86 L124 86 L128 160 L92 160 Z" fill="#1F3D2B"/><path d="M96 160 L80 220 M122 160 L142 220" stroke="#1F3D2B" stroke-width="12" stroke-linecap="round"/><line x1="94" y1="130" x2="226" y2="60" stroke="#3b4045" stroke-width="7" stroke-linecap="round"/><line x1="211.1" y1="126.0" x2="106.0" y2="130.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="106.0" cy="130.0" r="3" fill="#1F3D2B"/><rect x="211.1" y="103.0" width="157.9" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="290.0" y="120.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">butt under the arm</text><line x1="200.4" y1="225.1" x2="142.0" y2="220.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="142.0" cy="220.0" r="3" fill="#1F3D2B"/><rect x="200.4" y="213.0" width="179.3" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="290.0" y="230.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">front foot to the bird</text>
<text x="200.0" y="290.0" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Safety on until the gun is up.</text>
</svg>
