<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Memory hooks: C P P B, case primer powder bullet. Three stamps: barrel, box, headstamp. 7,000 grains in a pound. 10 years: Tikka says too old to fire. F M J equals no: expanding bullets only.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Memory hooks</text><rect x="20" y="50" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="75" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">CPPB</text><text x="150" y="75" font-size="15" fill="#23261f" text-anchor="start">Case, Primer, Powder, Bullet</text><rect x="20" y="96" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="121" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">3 stamps</text><text x="150" y="121" font-size="15" fill="#23261f" text-anchor="start">barrel, box, headstamp</text><rect x="20" y="142" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="167" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">7,000</text><text x="150" y="167" font-size="15" fill="#23261f" text-anchor="start">grains in a pound</text><rect x="20" y="188" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="213" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">10 years</text><text x="150" y="213" font-size="15" fill="#23261f" text-anchor="start">Tikka: too old to fire</text><rect x="20" y="234" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="259" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">FMJ = No</text><text x="150" y="259" font-size="15" fill="#23261f" text-anchor="start">expanding bullets only</text>
</svg>
