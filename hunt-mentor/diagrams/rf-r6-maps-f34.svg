<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 578" font-family="sans-serif" role="img" aria-label="Maps F34 to F40, grouped by rule. Draw only, LEH (Limited Entry Hunting): F34 Atlin, mountain sheep draw only area and open area, MUs 6-25 and 6-27; F36 Atlin, goat draw only area, and Atlin Park sheep closed; F37 Tagish Highlands, goat draw only, MUs 6-27 and 6-28; F40 North Skeena, new, moose draw only areas in parts of MUs 6-19 to 6-25. No hunting: F35 Atlin Park No Hunting Area; F38 K&#x27;waal Kitkiata, no hunting 1 January to 31 October, MU 6-11. Moose rule: F39 Haines Highway moose restricted area, 23 to 31 August any bull, 1 September to 31 October spike fork, tripalm or 10 point bull only.">
