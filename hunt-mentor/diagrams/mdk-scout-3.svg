<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Scouting step 3. A notebook page: which pond, how many ducks, what kind, the time they came in, and the wind. Caption: write down where, how many, when and the wind."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Scout 3: write it down</text><rect x="90" y="40" width="220" height="206" rx="6" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="110" y="72" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Where: north pond</text><text x="110" y="106" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">How many: 40</text><text x="110" y="140" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Kind: mallard, wigeon</text><text x="110" y="174" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">When: 17:50</text><text x="110" y="208" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Wind: from the west</text><rect x="10" y="256" width="380" height="38" rx="8" fill="#2f3a2b"/><text x="200" y="281" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Where, how many, what, when, wind</text></svg>
