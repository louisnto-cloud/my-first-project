<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Comparison of a deer gut and a black bear gut. A deer has a four chambered stomach that ferments plants. A black bear has one simple stomach and a short gut, like a carnivore. Bears digest grass poorly, so they seek rich, easy to digest food: berries, fish, insects and young animals.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Bear gut vs deer gut</text><rect x="10" y="52" width="186" height="200" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><rect x="204" y="52" width="186" height="200" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="103" y="76" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Deer</text><text x="297" y="76" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Black bear</text><circle cx="70" cy="130" r="34" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2"/><circle cx="122" cy="118" r="20" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2"/><circle cx="130" cy="160" r="18" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2"/><circle cx="80" cy="190" r="22" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2"/><text x="103" y="236" font-size="14" fill="#23261f" text-anchor="middle">4 chambers, ferments</text><path d="M260 110 Q300 95 330 120 Q340 160 300 168 Q262 160 260 110 Z" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2"/><path d="M300 168 q20 10 0 20 q-20 10 0 20 q20 10 0 10" fill="none" stroke="#2f3a2b" stroke-width="5"/><text x="297" y="236" font-size="14" fill="#23261f" text-anchor="middle">1 stomach, short gut</text><text x="16" y="276" font-size="14" fill="#23261f" text-anchor="start">Grass digests poorly: bears seek rich food</text><text x="16" y="294" font-size="14" fill="#23261f" text-anchor="start">like berries, fish, insects, young animals.</text>
</svg>
