<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="The 5 level avalanche danger scale: 1 Low, be careful on steep slopes. 2 Moderate, watch the avalanche problems in the forecast. 3 Considerable, many slopes should be avoided. 4 High, avoid all avalanche terrain. 5 Extreme, stay out.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Avalanche danger scale</text><rect x="20" y="44" width="150" height="38" rx="6" fill="#5aa05a"/><text x="95" y="69" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1 Low</text><text x="184" y="69" font-size="15" fill="#2f3a2b" text-anchor="start">Careful on steep slopes</text><rect x="20" y="90" width="150" height="38" rx="6" fill="#f6c344"/><text x="95" y="115" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">2 Moderate</text><text x="184" y="115" font-size="15" fill="#2f3a2b" text-anchor="start">Watch the forecast problems</text><rect x="20" y="136" width="150" height="38" rx="6" fill="#e8590c"/><text x="95" y="161" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3 Considerable</text><text x="184" y="161" font-size="15" fill="#2f3a2b" text-anchor="start">Many slopes to avoid</text><rect x="20" y="182" width="150" height="38" rx="6" fill="#c0392b"/><text x="95" y="207" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4 High</text><text x="184" y="207" font-size="15" fill="#2f3a2b" text-anchor="start">Avoid all avalanche terrain</text><rect x="20" y="228" width="150" height="38" rx="6" fill="#222"/><text x="95" y="253" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5 Extreme</text><text x="184" y="253" font-size="15" fill="#2f3a2b" text-anchor="start">Stay out</text>
</svg>
