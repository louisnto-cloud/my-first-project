<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Close up of a gas semi auto like the Beretta A300 Outlander: cocking handle on the bolt, breech bolt release button, cross bolt safety, ejection port, loading gate and carrier underneath, fore end cap.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Semi auto: the controls</text>
<g transform="translate(-175 40) scale(2.3)"><path d="M0 16 L7 14 L92 22 L108 22 L108 38 L97 40 C88 42 81 46 75 53 L6 57 L0 57 Z" fill="#6b5a45" stroke="#17201A" stroke-width="0.7"/><path d="M0 16 L5 15 L5 57 L0 57 Z" fill="#3b4045"/><rect x="108" y="18" width="54" height="22" rx="2" fill="#5d646b" stroke="#17201A" stroke-width="0.7"/><rect x="122" y="21.5" width="27" height="8.5" rx="1" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><rect x="138" y="22.5" width="10" height="6.5" fill="#a7aeb3" stroke="#17201A" stroke-width="0.7"/><path d="M116 40 C116 53 140 53 142 40" fill="none" stroke="#3b4045" stroke-width="2"/><line x1="127" y1="40" x2="125" y2="49" stroke="#3b4045" stroke-width="2.2" /><circle cx="137" cy="42.5" r="2.3" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><rect x="124" y="39" width="22" height="2" fill="#1e2124" stroke="#17201A" stroke-width="0.7"/><rect x="160" y="20" width="218" height="7.5" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><line x1="160" y1="19.4" x2="378" y2="19.4" stroke="#a7aeb3" stroke-width="1.2"/><rect x="366" y="20" width="12" height="7.5" fill="#a7aeb3" stroke="#17201A" stroke-width="0.7"/><circle cx="375" cy="18.2" r="1.6" fill="#ffffff" stroke="#17201A" stroke-width="0.5"/><rect x="160" y="28.5" width="140" height="6.5" fill="#5d646b" stroke="#17201A" stroke-width="0.7"/><path d="M162 25 L292 25 L292 41 L170 41 C166 41 162 38 162 34 Z" fill="#6b5a45" stroke="#17201A" stroke-width="0.7"/><rect x="292" y="26.5" width="11" height="10" rx="2" fill="#a7aeb3" stroke="#17201A" stroke-width="0.7"/><rect x="140" y="30.5" width="8" height="4" rx="1" fill="#a7aeb3" stroke="#17201A" stroke-width="0.7"/><rect x="152" y="32" width="6" height="4" rx="1" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/></g>

<g data-tip="Cocking handle|Pull it back to open the bolt. It locks open on the A300." data-tip-dot="156,114"><line x1="239.8" y1="115.1" x2="156.2" y2="113.6" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="156.2" cy="113.6" r="3" fill="#1F3D2B"/><rect x="239.8" y="103.0" width="120.4" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="300.0" y="120.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Cocking handle</text></g>
<g data-tip="Bolt release|Press it and the bolt slams forward. Hands clear of the port." data-tip-dot="182,118"><line x1="248.4" y1="160.0" x2="181.5" y2="118.2" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="181.5" cy="118.2" r="3" fill="#1F3D2B"/><rect x="248.4" y="159.0" width="103.3" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="300.0" y="176.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Bolt release</text></g>
<g data-tip="Safety|A300: red ring hidden = safe. Red ring showing = it can fire." data-tip-dot="140,138"><line x1="187.6" y1="246.0" x2="140.1" y2="137.8" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="140.1" cy="137.8" r="3" fill="#1F3D2B"/><rect x="187.6" y="245.0" width="64.8" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="220.0" y="262.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Safety</text></g>
<g data-tip="Ejection port|Look in here. On the A300 you drop the first shell in here." data-tip-dot="136,100"><line x1="135.5" y1="70.0" x2="135.5" y2="99.8" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="135.5" cy="99.8" r="3" fill="#1F3D2B"/><rect x="91.9" y="47.0" width="116.2" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="150.0" y="64.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Ejection port</text></g>
<g data-tip="Loading gate and carrier|Underneath. Shells go into the magazine here." data-tip-dot="136,132"><line x1="135.5" y1="210.0" x2="135.5" y2="132.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="135.5" cy="132.0" r="3" fill="#1F3D2B"/><rect x="1.2" y="209.0" width="197.6" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="100.0" y="226.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Loading gate and carrier</text></g>
<text x="200.0" y="288.0" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Beretta A300 layout. Read your manual.</text>
</svg>
