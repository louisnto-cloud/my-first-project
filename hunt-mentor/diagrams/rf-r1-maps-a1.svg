<path d="M6 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v54 h-190 z" fill="#8a9a6b"/>
<text x="101" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">A1 Saanich</text>
<text x="101" y="76" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Peninsula, Gulf</text>
