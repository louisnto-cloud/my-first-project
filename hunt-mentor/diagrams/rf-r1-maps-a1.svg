<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 522" role="img" aria-label="Cards for Maps A1 to A4. Map A1: Saanich Peninsula and Gulf Islands, rifles prohibited, special antlerless season. Valdes Island: rifles permitted, 1 to 10 November antlerless deer season. Sidney and James Islands: rifles permitted, special antlerless season. Mudge and DeCourcy Islands: no hunting, no shooting. Link Island: no shooting. Map A2 Ganges: No Shooting Area. Map A3 Cherry Point: No Shooting Area. Map A4 Saturna Island: No Shooting or Hunting Area." font-family="sans-serif">
<rect x="0" y="0" width="400" height="522" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Maps A1 to A4</text>
