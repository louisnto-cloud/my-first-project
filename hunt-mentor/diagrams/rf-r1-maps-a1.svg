<text x="14" y="124" font-size="14" fill="#23261f" text-anchor="start">Rifles prohibited.</text>
<text x="14" y="142" font-size="14" fill="#23261f" text-anchor="start">Special antlerless</text>
<text x="14" y="160" font-size="14" fill="#23261f" text-anchor="start">season</text>
<rect x="204" y="40" width="190" height="132" rx="10" fill="#ffffff" stroke="#5c7a3a" stroke-width="2.5"/>
<path d="M204 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v54 h-190 z" fill="#5c7a3a"/>
<text x="299" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">A1 Valdes Island</text>
<text x="212" y="124" font-size="14" fill="#23261f" text-anchor="start">Rifles permitted. Nov 1</text>
<text x="212" y="142" font-size="14" fill="#23261f" text-anchor="start">to 10 antlerless deer</text>
<rect x="6" y="180" width="190" height="114" rx="10" fill="#ffffff" stroke="#5c7a3a" stroke-width="2.5"/>
<path d="M6 190 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#5c7a3a"/>
