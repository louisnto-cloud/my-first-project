<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 665" font-family="sans-serif" role="img" aria-label="Maps A1 to A4, the Gulf Islands and Saanich, grouped by rule. Rifles prohibited: Map A1 Saanich Peninsula and Gulf Islands, with a special antlerless season. Rifles permitted: Map A1 Valdes Island, with a 1 to 10 November antlerless deer season; Map A1 Sidney and James Islands, with a special antlerless season. No shooting or hunting: Map A1 Mudge and DeCourcy Islands, no hunting and no shooting; Map A4 Saturna Island, No Shooting or Hunting Area, MU 1-1. No shooting: Map A1 Link Island; Map A2 Ganges, No Shooting Area, MU 1-1; Map A3 Cherry Point, No Shooting Area, MU 1-4.">
