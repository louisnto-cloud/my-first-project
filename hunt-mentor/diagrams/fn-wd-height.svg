<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Forecast wind is measured at 10 metres. At 2 metres, head height, it may be only 50 to 70 percent: a 20 km/h forecast is about 10 to 14 km/h where you stand. In timber it is lower still.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="32" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Forecast wind is at 10 m</text><line x1="80" y1="260" x2="80" y2="70" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round"/><rect x="76" y="66" width="40" height="10" rx="0" fill="#e8590c" stroke="none" stroke-width="2"/><text x="130" y="80" font-family="sans-serif" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">10 m: forecast 20 km/h</text><g transform="translate(200 260) scale(1)"><circle cx="0" cy="-30" r="7" fill="#2f3a2b"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" fill="none"/></g><text x="230" y="200" font-family="sans-serif" font-size="15" fill="#8a9a6b" text-anchor="start" font-weight="bold">2 m: about 10 to 14</text><g fill="#2f3a2b"><polygon points="300,218.0 285.0,260 315.0,260"/><rect x="297.0" y="260" width="6.0" height="9.0"/></g><g fill="#2f3a2b"><polygon points="330,218.0 315.0,260 345.0,260"/><rect x="327.0" y="260" width="6.0" height="9.0"/></g><g fill="#2f3a2b"><polygon points="360,218.0 345.0,260 375.0,260"/><rect x="357.0" y="260" width="6.0" height="9.0"/></g><text x="230" y="225" font-family="sans-serif" font-size="14" fill="#8a9a6b" text-anchor="start">(50 to 70%)</text><line x1="0" y1="262" x2="400" y2="262" stroke="#8a9a6b" stroke-width="4" stroke-linecap="round"/><text x="20" y="290" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">In timber it is lower still (Tip).</text>
</svg>
