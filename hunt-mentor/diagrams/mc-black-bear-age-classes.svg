<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Black bear age classes and the law. Cub, 0 to 1 year: never legal. Yearling, 1 to 2 years: under 2, never legal. A sow or any bear with a young bear: in its company, never legal. Young adult, 2 to 4 years: legal, better to let it grow. Adult boar, 5 years plus: legal, the target. From the synopsis rule on bears under 2 years old and the Notice to Black Bear Hunters.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Age classes and the law</text><rect x="10" y="50" width="380" height="42" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="20" y="77" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Cub</text><text x="160" y="77" font-size="14" fill="#23261f" text-anchor="start">0 to 1 year</text><text x="382" y="77" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">With sow. NEVER</text><rect x="10" y="99" width="380" height="42" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="20" y="126" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Yearling</text><text x="160" y="126" font-size="14" fill="#23261f" text-anchor="start">1 to 2 years</text><text x="382" y="126" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">Under 2. NEVER</text><rect x="10" y="148" width="380" height="42" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="20" y="175" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Sow with young</text><text x="160" y="175" font-size="14" fill="#23261f" text-anchor="start">any age</text><text x="382" y="175" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">In its company. NEVER</text><rect x="10" y="197" width="380" height="42" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="2"/><text x="20" y="224" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Young adult</text><text x="160" y="224" font-size="14" fill="#23261f" text-anchor="start">2 to 4 years</text><text x="382" y="224" font-size="14" font-weight="bold" fill="#8a9a6b" text-anchor="end">Legal. Let it grow</text><rect x="10" y="246" width="380" height="42" rx="8" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/><text x="20" y="273" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Adult boar</text><text x="160" y="273" font-size="14" fill="#23261f" text-anchor="start">5 plus years</text><text x="382" y="273" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">Legal. The target</text>
</svg>
