<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 774" font-family="sans-serif" role="img" aria-label="Flowchart: is it legal to shoot? Answer nine questions in order. Yes goes down to the next question; no at any step goes right, to DO NOT SHOOT. 1. Licences on me? 2. Legal hours right now? 3. Season open, MU (Management Unit), sex? 4. 100% sure what it is? 5. Off road, out of vehicle? 6. Over 100 m from buildings? 7. Allowed on this land? 8. Safe backstop? 9. Clean shot, in my range? All 9 yes: you may shoot. Any doubt at any step means no.">
