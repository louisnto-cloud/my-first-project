<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Clean a cut, step 3: cover it with a clean dressing and check it every day for spreading redness, heat, pus or a red streak.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3. Cover and watch</text><rect x="30" y="138" width="300" height="44" rx="22" fill="#d9b48f" stroke="#b08a66" stroke-width="2"/><circle cx="344" cy="160" r="24.0" fill="#d9b48f" stroke="#b08a66" stroke-width="2"/><ellipse cx="250" cy="160" rx="16" ry="7" fill="#c0392b"/><rect x="215" y="140" width="70" height="40" rx="4" fill="#ffffff" stroke="#9a9a8f" stroke-width="2"/><line x1="221" y1="154" x2="279" y2="154" stroke="#9a9a8f" stroke-width="1" stroke-linecap="round"/><line x1="221" y1="166" x2="279" y2="166" stroke="#9a9a8f" stroke-width="1" stroke-linecap="round"/><rect x="40" y="60" width="150" height="70" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="115" y="91" font-size="15" fill="#2f3a2b" text-anchor="middle">Red spreading?</text><text x="115" y="110" font-size="15" fill="#2f3a2b" text-anchor="middle">Pus? Red streak?</text><text x="115" y="240" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Check daily</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cover. Check daily for infection</text>
</svg>
