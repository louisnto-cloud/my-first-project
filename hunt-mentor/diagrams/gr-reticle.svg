<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two reticles. Duplex: thick outer posts lead your eye to a thin centre crosshair, the simplest choice. BDC: extra hash marks below the centre for longer shots, useful only after you confirm drops on paper.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Reticles: what you see</text>
  <circle cx="100" cy="140" r="86" fill="#fff" stroke="#2f3a2b" stroke-width="6"/>
  <g stroke="#2f3a2b"><line x1="14" y1="140" x2="70" y2="140" stroke-width="6"/><line x1="130" y1="140" x2="186" y2="140" stroke-width="6"/><line x1="70" y1="140" x2="130" y2="140" stroke-width="1.5"/><line x1="100" y1="54" x2="100" y2="110" stroke-width="6"/><line x1="100" y1="170" x2="100" y2="226" stroke-width="6"/><line x1="100" y1="110" x2="100" y2="170" stroke-width="1.5"/></g>
  <circle cx="300" cy="140" r="86" fill="#fff" stroke="#2f3a2b" stroke-width="6"/>
  <g stroke="#2f3a2b"><line x1="214" y1="140" x2="270" y2="140" stroke-width="6"/><line x1="330" y1="140" x2="386" y2="140" stroke-width="6"/><line x1="270" y1="140" x2="330" y2="140" stroke-width="1.5"/><line x1="300" y1="54" x2="300" y2="110" stroke-width="6"/><line x1="300" y1="200" x2="300" y2="226" stroke-width="6"/><line x1="300" y1="110" x2="300" y2="200" stroke-width="1.5"/>
    <line x1="290" y1="156" x2="310" y2="156" stroke-width="1.5"/><line x1="288" y1="172" x2="312" y2="172" stroke-width="1.5"/><line x1="286" y1="188" x2="314" y2="188" stroke-width="1.5"/></g>
  <g font-size="13" fill="#e8590c" font-weight="bold"><text x="316" y="160">200</text><text x="318" y="176">300</text><text x="320" y="192">400</text></g>
  <g font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle"><text x="100" y="252">Duplex</text><text x="300" y="252">BDC hash marks</text></g>
  <g font-size="14" fill="#2f3a2b" text-anchor="middle"><text x="100" y="272">Simplest. My lean</text><text x="300" y="272">Only after paper tests</text><text x="300" y="290">Example marks only</text></g>
</svg>
