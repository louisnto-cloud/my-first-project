<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" font-family="sans-serif" role="img" aria-label="Bar chart of estimated one way driving distance from Heffley Creek. Alberta, Lethbridge area: about 800 kilometres. Saskatchewan, Saskatoon area: about 1,400. Manitoba, Winnipeg area: about 2,100. Yukon, Whitehorse: about 2,300. Alaska, Tok: about 3,300. Double each for the round trip.">
<rect x="0" y="0" width="400" height="360" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Drive from Heffley Creek, one way</text>
<text x="200" y="48" font-size="15" fill="#6b4f35" text-anchor="middle">Kilometres, about. My estimates</text>
<line x1="124.0" y1="84" x2="124.0" y2="312" stroke="#dfe6d3" stroke-width="2"/>
<text x="124.0" y="78" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">0</text>
<line x1="197.1" y1="84" x2="197.1" y2="312" stroke="#dfe6d3" stroke-width="2"/>
<text x="197.1" y="78" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1,000</text>
<line x1="270.3" y1="84" x2="270.3" y2="312" stroke="#dfe6d3" stroke-width="2"/>
<text x="270.3" y="78" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">2,000</text>
<line x1="343.4" y1="84" x2="343.4" y2="312" stroke="#dfe6d3" stroke-width="2"/>
<text x="343.4" y="78" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3,000</text>
<g data-tip="Alberta, Lethbridge area|About 800 km each way (estimate). Fuel there and back: $350 to $400, assuming $0.22 per km.">
<text x="8" y="110" font-size="15" font-weight="bold" fill="#2f3a2b">Alberta</text>
<rect x="124" y="92" width="58.5" height="26" rx="4" fill="#4a7fb0"/>
<text x="188.5" y="111" font-size="15" font-weight="bold" fill="#2f3a2b">800 km</text>
<text x="8" y="128" font-size="14" fill="#6b5b4b">Lethbridge area</text>
</g>
<g data-tip="Saskatchewan, Saskatoon area|About 1,400 km each way (estimate). Fuel there and back: $600 to $700, assuming $0.22 per km.">
<text x="8" y="154" font-size="15" font-weight="bold" fill="#2f3a2b">Saskatchewan</text>
<rect x="124" y="136" width="102.4" height="26" rx="4" fill="#4a7fb0"/>
<text x="218.4" y="155" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="end">1,400 km</text>
<text x="8" y="172" font-size="14" fill="#6b5b4b">Saskatoon area</text>
</g>
<g data-tip="Manitoba, Winnipeg area|About 2,100 km each way (estimate). Fuel there and back: $900 to $1,000, assuming $0.22 per km.">
<text x="8" y="198" font-size="15" font-weight="bold" fill="#2f3a2b">Manitoba</text>
<rect x="124" y="180" width="153.6" height="26" rx="4" fill="#4a7fb0"/>
<text x="269.6" y="199" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="end">2,100 km</text>
<text x="8" y="216" font-size="14" fill="#6b5b4b">Winnipeg area</text>
</g>
<g data-tip="Yukon, Whitehorse|About 2,300 km each way (estimate). Fuel there and back: $900 to $1,100, assuming $0.22 per km.">
<text x="8" y="242" font-size="15" font-weight="bold" fill="#2f3a2b">Yukon</text>
<rect x="124" y="224" width="168.2" height="26" rx="4" fill="#4a7fb0"/>
<text x="284.2" y="243" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="end">2,300 km</text>
<text x="8" y="260" font-size="14" fill="#6b5b4b">Whitehorse</text>
</g>
<g data-tip="Alaska, Tok|About 3,300 km each way (estimate). Fuel there and back: about $1,400 to $1,600 Canadian, assuming $0.22 per km.">
<text x="8" y="286" font-size="15" font-weight="bold" fill="#2f3a2b">Alaska</text>
<rect x="124" y="268" width="241.4" height="26" rx="4" fill="#e8590c"/>
<text x="357.4" y="287" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="end">3,300 km</text>
<text x="8" y="304" font-size="14" fill="#6b5b4b">Tok</text>
</g>
<g data-tip="Round trip|Each bar is one way. Double it for the drive home. These are estimates."><text x="200" y="344" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Each way. Double it for the round trip.</text></g>
</svg>
