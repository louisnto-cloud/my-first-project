<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 324" font-family="sans-serif" role="img" aria-label="Bar chart of estimated one way driving distance from Heffley Creek. Alberta, Lethbridge area: about 800 kilometres. Saskatchewan, Saskatoon area: about 1,400. Manitoba, Winnipeg area: about 2,100. Yukon, Whitehorse: about 2,300. Alaska, Tok: about 3,300. Double each for the round trip.">
<rect x="0" y="0" width="400" height="324" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Drive from Heffley Creek, one way</text>
<text x="200" y="46" font-size="14" fill="#6b4f35" text-anchor="middle">About, in km. My estimates</text>
<line x1="120.0" y1="84" x2="120.0" y2="284" stroke="#dfe6d3" stroke-width="2"/>
<text x="120" y="78" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">0</text>
<line x1="193.1" y1="84" x2="193.1" y2="284" stroke="#dfe6d3" stroke-width="2"/>
<text x="193.143" y="78" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1000</text>
<line x1="266.3" y1="84" x2="266.3" y2="284" stroke="#dfe6d3" stroke-width="2"/>
<text x="266.286" y="78" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">2000</text>
<line x1="339.4" y1="84" x2="339.4" y2="284" stroke="#dfe6d3" stroke-width="2"/>
<text x="339.429" y="78" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3000</text>
<text x="8" y="108" font-size="14" font-weight="bold" fill="#2f3a2b">Alberta</text>
<rect x="120.0" y="92" width="58.5" height="22" rx="4" fill="#4a7fb0"/>
<text x="184.514" y="108" font-size="14" font-weight="bold" fill="#2f3a2b">800, Lethbridge area</text>
<text x="8" y="148" font-size="14" font-weight="bold" fill="#2f3a2b">Saskatchewan</text>
<rect x="120.0" y="132" width="102.4" height="22" rx="4" fill="#4a7fb0"/>
<text x="228.4" y="148" font-size="14" font-weight="bold" fill="#2f3a2b">1,400, Saskatoon</text>
<text x="8" y="188" font-size="14" font-weight="bold" fill="#2f3a2b">Manitoba</text>
<rect x="120.0" y="172" width="153.6" height="22" rx="4" fill="#4a7fb0"/>
<text x="279.6" y="188" font-size="14" font-weight="bold" fill="#2f3a2b">2,100, Winnipeg</text>
<text x="8" y="228" font-size="14" font-weight="bold" fill="#2f3a2b">Yukon</text>
<rect x="120.0" y="212" width="168.2" height="22" rx="4" fill="#4a7fb0"/>
<text x="124" y="228" font-size="14" font-weight="bold" fill="#fff">2,300, Whitehorse</text>
<text x="8" y="268" font-size="14" font-weight="bold" fill="#2f3a2b">Alaska</text>
<rect x="120.0" y="252" width="241.4" height="22" rx="4" fill="#e8590c"/>
<text x="124" y="268" font-size="14" font-weight="bold" fill="#fff">3,300, Tok</text>
<text x="200" y="302" font-size="14" fill="#2f3a2b" text-anchor="middle">Each way. Double it for the round trip.</text>
</svg>
