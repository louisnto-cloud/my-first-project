<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="BC Search and Rescue Association list of the top 10 worst things you can do: 1 wrong footwear, 2 no trip plan, 3 recreating above your skills, 4 thinking easy access means an easy hike, 5 going with only a cell phone and maybe some water, 6 not thinking what if, 7 not knowing your location, 8 relying on search and rescue for preventable incidents, 9 being over confident, 10 being under prepared. Items 2, 5, 6 and 7 are highlighted as the ones this chapter fixes.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">SAR&#x27;s 10 worst things you can do</text><rect x="30" y="44.0" width="340" height="20" rx="4" fill="#dfe6d3"/><text x="52" y="59.0" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">1</text><text x="70" y="59.0" font-size="14" fill="#23261f" text-anchor="start">Wrong footwear</text><rect x="30" y="67.5" width="340" height="20" rx="4" fill="#f6d7c3"/><text x="52" y="82.5" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">2</text><text x="70" y="82.5" font-size="14" fill="#23261f" text-anchor="start">No trip plan</text><rect x="30" y="91.0" width="340" height="20" rx="4" fill="#dfe6d3"/><text x="52" y="106.0" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">3</text><text x="70" y="106.0" font-size="14" fill="#23261f" text-anchor="start">Above your skills</text><rect x="30" y="114.5" width="340" height="20" rx="4" fill="#dfe6d3"/><text x="52" y="129.5" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">4</text><text x="70" y="129.5" font-size="14" fill="#23261f" text-anchor="start">Easy access, easy hike?</text><rect x="30" y="138.0" width="340" height="20" rx="4" fill="#f6d7c3"/><text x="52" y="153.0" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">5</text><text x="70" y="153.0" font-size="14" fill="#23261f" text-anchor="start">Only a phone and some water</text><rect x="30" y="161.5" width="340" height="20" rx="4" fill="#f6d7c3"/><text x="52" y="176.5" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">6</text><text x="70" y="176.5" font-size="14" fill="#23261f" text-anchor="start">No &quot;what if&quot;</text><rect x="30" y="185.0" width="340" height="20" rx="4" fill="#f6d7c3"/><text x="52" y="200.0" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">7</text><text x="70" y="200.0" font-size="14" fill="#23261f" text-anchor="start">Not knowing your location</text><rect x="30" y="208.5" width="340" height="20" rx="4" fill="#dfe6d3"/><text x="52" y="223.5" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">8</text><text x="70" y="223.5" font-size="14" fill="#23261f" text-anchor="start">Preventable callouts</text><rect x="30" y="232.0" width="340" height="20" rx="4" fill="#dfe6d3"/><text x="52" y="247.0" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">9</text><text x="70" y="247.0" font-size="14" fill="#23261f" text-anchor="start">Over confident</text><rect x="30" y="255.5" width="340" height="20" rx="4" fill="#dfe6d3"/><text x="52" y="270.5" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">10</text><text x="70" y="270.5" font-size="14" fill="#23261f" text-anchor="start">Under prepared</text><text x="200" y="293" font-size="14" fill="#6b4f35" text-anchor="middle">BCSARA 2022 review. Orange: this chapter (95%)</text>
</svg>
