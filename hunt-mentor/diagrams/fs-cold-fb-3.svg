<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Frostbite step 3: only thaw it if it will stay warm. Thawing and then refreezing does more damage.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3. Refreeze risk? Keep it frozen</text><rect x="30" y="60" width="340" height="70" rx="8" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="90" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Will it freeze again</text><text x="200" y="111" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">on the way out?</text><rect x="30" y="160" width="160" height="70" rx="8" fill="#e3eef8" stroke="#4a7fb0" stroke-width="2"/><text x="110" y="191" font-size="16" fill="#2f3a2b" text-anchor="middle">Yes: keep</text><text x="110" y="211" font-size="16" fill="#2f3a2b" text-anchor="middle">it frozen</text><rect x="210" y="160" width="160" height="70" rx="8" fill="#fbe9e7" stroke="#e8590c" stroke-width="2"/><text x="290" y="191" font-size="16" fill="#2f3a2b" text-anchor="middle">No: rewarm</text><text x="290" y="211" font-size="16" fill="#2f3a2b" text-anchor="middle">now</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Never thaw, then refreeze</text>
</svg>
