<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="The Kamloops deer CWD plan in three pictures: meat in the cooler, head in the freezer, bones on the hill. Bones stay where the deer fell, never dumped in a new drainage, 95 percent. Hold the meat until the result is back, a tip." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">The Kamloops deer CWD plan</text>
<g transform="translate(70 110)"><rect x="-44" y="-26" width="88" height="56" rx="6" fill="#4a7fb0" stroke="#23261f" stroke-width="2"/><rect x="-46" y="-34" width="92" height="12" rx="4" fill="#ffffff" stroke="#23261f" stroke-width="2"/></g>
<text x="70" y="176" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Meat in</text>
<text x="70" y="196" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">the cooler</text>
<g transform="translate(200 110)"><rect x="-36" y="-40" width="72" height="80" rx="6" fill="#ffffff" stroke="#23261f" stroke-width="2"/><path d="M-36 -10 H36" stroke="#23261f" stroke-width="2"/><rect x="-28" y="-30" width="20" height="6" rx="2" fill="#4a7fb0"/></g>
<text x="200" y="176" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Head in</text>
<text x="200" y="196" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">the freezer</text>
<g transform="translate(330 110)"><path d="M-50,30 C-30,-20 30,-30 50,30 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><path d="M-14,14 h28 M-8,8 l16,12 M8,8 l-16,12" stroke="#f3ead8" stroke-width="5" stroke-linecap="round"/></g>
<text x="330" y="176" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Bones on</text>
<text x="330" y="196" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">the hill</text>
<rect x="10" y="220" width="380" height="72" rx="8" fill="#fde8d8" stroke="#e8590c" stroke-width="2"/>
<text x="200.0" y="242.9" font-size="14" fill="#23261f" text-anchor="middle">Bones stay where it fell, never in a</text>
<text x="200.0" y="260.9" font-size="14" fill="#23261f" text-anchor="middle">new drainage (95%). Hold the meat</text>
<text x="200.0" y="278.9" font-size="14" fill="#23261f" text-anchor="middle">until the result is back (Tip).</text>
</svg>
