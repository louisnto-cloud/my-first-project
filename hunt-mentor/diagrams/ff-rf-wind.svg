<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of wind drift for a 40 grain .22 long rifle in a 10 km/h full crosswind: 1 cm at 25 m, 3 cm at 50 m, 6 cm at 75 m, 11 cm at 100 m. A grouse head is small, so stay close.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Light wind moves a .22 a lot</text><text x="84" y="81.0" font-size="14" fill="#23261f" text-anchor="end">25 m</text><rect x="90" y="60" width="13.333333333333334" height="30" rx="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="109.33333333333333" y="81.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">1 cm</text><text x="84" y="125.0" font-size="14" fill="#23261f" text-anchor="end">50 m</text><rect x="90" y="104" width="48.333333333333336" height="30" rx="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="144.33333333333334" y="125.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">3 cm</text><text x="84" y="169.0" font-size="14" fill="#23261f" text-anchor="end">75 m</text><rect x="90" y="148" width="106.66666666666667" height="30" rx="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="202.66666666666669" y="169.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">6 cm</text><text x="84" y="213.0" font-size="14" fill="#23261f" text-anchor="end">100 m</text><rect x="90" y="192" width="185.0" height="30" rx="3" fill="#b3261e" stroke="none" stroke-width="2"/><text x="281.0" y="213.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">11 cm</text><text x="200" y="240" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">10 km/h full crosswind (model)</text><text x="200.0" y="280" font-size="14" fill="#2f3a2b" text-anchor="middle">Grouse head: about 4 cm. Stay close.</text>
</svg>
