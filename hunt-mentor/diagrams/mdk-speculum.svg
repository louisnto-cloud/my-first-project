<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="sans-serif" role="img" aria-label="Grid of twelve wing patches. Mallard: blue with white bars on both sides. Gadwall: white square. Wigeon: white front of the wing, green patch. Pintail: green with a white trailing edge. Green winged teal: green. Shoveler and blue winged teal: pale blue front of the wing, green patch. Wood duck: blue with a white trailing edge. Goldeneyes: big white block. Bufflehead: white block. Scaup: white stripe. Ring necked duck: grey stripe. Canvasback and redhead: plain grey. Puddle ducks have a bright patch, divers white or grey, 80 percent."><rect width="400" height="470" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Wing patch: name it from below</text><rect x="4" y="36" width="392" height="31" rx="4" fill="#dfe6d3"/><g transform="translate(8 39) scale(0.95 0.95)"><path d="M0 0 L70 0 L86 26 L6 26 Z" fill="#7a6450"/><path d="M20 2 L24 2 L32 24 L28 24 Z" fill="#ffffff"/><path d="M24 2 L50 2 L58 24 L32 24 Z" fill="#4b3fa0"/><path d="M50 2 L54 2 L62 24 L58 24 Z" fill="#ffffff"/></g><text x="102" y="57" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Mallard</text><text x="392" y="57" font-size="14" fill="#2f3a2b" text-anchor="end">Blue, white bars</text><rect x="4" y="70" width="392" height="31" rx="4" fill="#eef2e6"/><g transform="translate(8 73) scale(0.95 0.95)"><path d="M0 0 L70 0 L86 26 L6 26 Z" fill="#7a6450"/><path d="M10 2 L28 2 L36 24 L18 24 Z" fill="#7a3b22"/><path d="M40 2 L60 2 L68 24 L48 24 Z" fill="#ffffff"/></g><text x="102" y="91" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Gadwall</text><text x="392" y="91" font-size="14" fill="#2f3a2b" text-anchor="end">White square</text><rect x="4" y="104" width="392" height="31" rx="4" fill="#dfe6d3"/><g transform="translate(8 107) scale(0.95 0.95)"><path d="M0 0 L70 0 L86 26 L6 26 Z" fill="#7a6450"/><path d="M0 2 L30 2 L38 24 L8 24 Z" fill="#ffffff"/><path d="M40 2 L62 2 L70 24 L48 24 Z" fill="#2f6e3b"/></g><text x="102" y="125" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Wigeon</text><text x="392" y="125" font-size="14" fill="#2f3a2b" text-anchor="end">White front, green</text><rect x="4" y="138" width="392" height="31" rx="4" fill="#eef2e6"/><g transform="translate(8 141) scale(0.95 0.95)"><path d="M0 0 L70 0 L86 26 L6 26 Z" fill="#7a6450"/><path d="M22 2 L26 2 L34 24 L30 24 Z" fill="#d8b07a"/><path d="M26 2 L52 2 L60 24 L34 24 Z" fill="#2f6e3b"/><path d="M52 2 L58 2 L66 24 L60 24 Z" fill="#ffffff"/></g><text x="102" y="159" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Pintail</text><text x="392" y="159" font-size="14" fill="#2f3a2b" text-anchor="end">Green, white edge</text><rect x="4" y="172" width="392" height="31" rx="4" fill="#dfe6d3"/><g transform="translate(8 175) scale(0.95 0.95)"><path d="M0 0 L70 0 L86 26 L6 26 Z" fill="#7a6450"/><path d="M22 2 L26 2 L34 24 L30 24 Z" fill="#d8b07a"/><path d="M26 2 L54 2 L62 24 L34 24 Z" fill="#2f6e3b"/></g><text x="102" y="193" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Green winged teal</text><text x="392" y="193" font-size="14" fill="#2f3a2b" text-anchor="end">Green</text><rect x="4" y="206" width="392" height="31" rx="4" fill="#eef2e6"/><g transform="translate(8 209) scale(0.95 0.95)"><path d="M0 0 L70 0 L86 26 L6 26 Z" fill="#7a6450"/><path d="M0 2 L30 2 L38 24 L8 24 Z" fill="#9cc3e4"/><path d="M40 2 L60 2 L68 24 L48 24 Z" fill="#2f6e3b"/></g><text x="102" y="227" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Shoveler, blue w. teal</text><text x="392" y="227" font-size="14" fill="#2f3a2b" text-anchor="end">Blue front</text><rect x="4" y="240" width="392" height="31" rx="4" fill="#dfe6d3"/><g transform="translate(8 243) scale(0.95 0.95)"><path d="M0 0 L70 0 L86 26 L6 26 Z" fill="#4a3a2c"/><path d="M24 2 L50 2 L58 24 L32 24 Z" fill="#3f51a0"/><path d="M52 2 L58 2 L66 24 L60 24 Z" fill="#ffffff"/></g><text x="102" y="261" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Wood duck</text><text x="392" y="261" font-size="14" fill="#2f3a2b" text-anchor="end">Blue, white edge</text><rect x="4" y="274" width="392" height="31" rx="4" fill="#eef2e6"/><g transform="translate(8 277) scale(0.95 0.95)"><path d="M0 0 L70 0 L86 26 L6 26 Z" fill="#3a3f3a"/><path d="M14 2 L60 2 L68 24 L22 24 Z" fill="#ffffff"/></g><text x="102" y="295" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Goldeneyes</text><text x="392" y="295" font-size="14" fill="#2f3a2b" text-anchor="end">Big white block</text><rect x="4" y="308" width="392" height="31" rx="4" fill="#dfe6d3"/><g transform="translate(8 311) scale(0.95 0.95)"><path d="M0 0 L70 0 L86 26 L6 26 Z" fill="#3a3f3a"/><path d="M20 2 L56 2 L64 24 L28 24 Z" fill="#ffffff"/></g><text x="102" y="329" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Bufflehead</text><text x="392" y="329" font-size="14" fill="#2f3a2b" text-anchor="end">White block</text><rect x="4" y="342" width="392" height="31" rx="4" fill="#eef2e6"/><g transform="translate(8 345) scale(0.95 0.95)"><path d="M0 0 L70 0 L86 26 L6 26 Z" fill="#3a3f3a"/><path d="M30 2 L70 2 L78 24 L38 24 Z" fill="#ffffff"/></g><text x="102" y="363" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Scaup</text><text x="392" y="363" font-size="14" fill="#2f3a2b" text-anchor="end">White stripe</text><rect x="4" y="376" width="392" height="31" rx="4" fill="#dfe6d3"/><g transform="translate(8 379) scale(0.95 0.95)"><path d="M0 0 L70 0 L86 26 L6 26 Z" fill="#3a3f3a"/><path d="M30 2 L70 2 L78 24 L38 24 Z" fill="#b9c0c8"/></g><text x="102" y="397" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Ring necked duck</text><text x="392" y="397" font-size="14" fill="#2f3a2b" text-anchor="end">Grey stripe</text><rect x="4" y="410" width="392" height="31" rx="4" fill="#eef2e6"/><g transform="translate(8 413) scale(0.95 0.95)"><path d="M0 0 L70 0 L86 26 L6 26 Z" fill="#8c939b"/><path d="M30 2 L70 2 L78 24 L38 24 Z" fill="#aab1b9"/></g><text x="102" y="431" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Canvasback, redhead</text><text x="392" y="431" font-size="14" fill="#2f3a2b" text-anchor="end">Plain grey</text><text x="200" y="460" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Puddle ducks: bright patch. Divers: white or grey (80%)</text></svg>
