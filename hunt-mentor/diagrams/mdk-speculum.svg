<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 518" font-family="sans-serif" role="img" aria-label="Wing patches in two groups. Puddle ducks have a bright patch: Mallard, blue with white bars on both sides. Gadwall, white square. Wigeon, white front of the wing, green patch. Pintail, green with a white trailing edge. Green winged teal, green. Shoveler and blue winged teal, pale blue front of the wing, green patch. Wood duck, blue with a white trailing edge. Divers show white or grey, 80 percent: Goldeneyes, big white block. Bufflehead, white block. Scaup, white stripe. Ring necked duck, grey stripe. Canvasback and redhead, plain grey.">
<rect width="400" height="518" fill="#fffaf0"/>
<text x="14" y="22" font-size="17" font-weight="bold" fill="#2f3a2b">Wing patch: name it from below</text>
<rect x="8" y="32" width="384" height="28" rx="6" fill="#2c5d86"/>
<text x="18" y="52" font-size="15" font-weight="bold" fill="#fffaf0" letter-spacing="1">PUDDLE DUCKS: BRIGHT PATCH</text>
<rect x="8" y="64" width="384" height="32" rx="4" fill="#dfe6d3"/>
<g transform="translate(12 67) scale(0.95 0.95)"><path d="M0 0 L70 0 L86 26 L6 26 Z" fill="#7a6450"/><path d="M20 2 L24 2 L32 24 L28 24 Z" fill="#ffffff"/><path d="M24 2 L50 2 L58 24 L32 24 Z" fill="#4b3fa0"/><path d="M50 2 L54 2 L62 24 L58 24 Z" fill="#ffffff"/></g>
