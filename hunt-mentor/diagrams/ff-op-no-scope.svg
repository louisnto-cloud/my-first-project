<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A hunter looking at a distant person through a rifle scope, crossed out. Your muzzle goes wherever you look through the scope. Use binoculars to look; point the rifle only at legal game.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Never glass with the rifle scope</text><g transform="translate(120 250) scale(1.0)"><circle cx="0" cy="-78" r="9" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3.5"/><line x1="0" y1="-68" x2="0" y2="-30" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-30" x2="-10" y2="0" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-30" x2="10" y2="0" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-60" x2="14" y2="-44" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-60" x2="-12" y2="-44" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/></g><line x1="120" y1="186" x2="300" y2="176" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/><rect x="160" y="166" width="50" height="12" rx="4" fill="#4b4f48" stroke="none" stroke-width="2"/><g transform="translate(330 250) scale(0.9)"><circle cx="0" cy="-78" r="9" fill="#fffaf0" stroke="#e8590c" stroke-width="3.5"/><line x1="0" y1="-68" x2="0" y2="-30" stroke="#e8590c" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-30" x2="-10" y2="0" stroke="#e8590c" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-30" x2="10" y2="0" stroke="#e8590c" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-60" x2="14" y2="-44" stroke="#e8590c" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-60" x2="-12" y2="-44" stroke="#e8590c" stroke-width="5" stroke-linecap="round"/></g><path d="M225.6 95.6 l28.8 28.8 M254.4 95.6 l-28.8 28.8" fill="none" stroke="#b3261e" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="70" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle">Your muzzle goes where you look</text><text x="200.0" y="284" font-size="14" fill="#2f3a2b" text-anchor="middle">Binoculars to look. Rifle only at legal game.</text>
</svg>
