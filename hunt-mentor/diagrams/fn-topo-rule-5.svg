<circle cx="26" cy="26" r="17" fill="#e8590c" stroke="none" stroke-width="2"/><text x="26" y="32" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">5</text><text x="52" y="32" font-family="sans-serif" font-size="18" fill="#2f3a2b" text-anchor="start" font-weight="bold">V points upstream</text><path d="M30 90 L170 90 L200 30 L230 90 L370 90" fill="none" stroke="#8b5a2b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 140 L170 140 L200 86 L230 140 L370 140" fill="none" stroke="#8b5a2b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 190 L170 190 L200 142 L230 190 L370 190" fill="none" stroke="#8b5a2b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 240 L170 240 L200 198 L230 240 L370 240" fill="none" stroke="#8b5a2b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M200 40 L200 280" fill="none" stroke="#4a7fb0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line x1="200" y1="250" x2="200.0" y2="277.3" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="200.0,285.0 206.1,274.0 193.9,274.0" fill="#4a7fb0"/><text x="270" y="60" font-family="sans-serif" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">V points uphill</text><text x="214" y="284" font-family="sans-serif" font-size="15" fill="#4a7fb0" text-anchor="start">water flows out</text>
</svg>
