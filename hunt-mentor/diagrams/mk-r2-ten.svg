<text x="66" y="1091" font-size="16" font-weight="bold" fill="#17201A">to Compulsory Inspection</text><text x="66" y="1113" font-size="14" fill="#1F3D2B">By appointment. Wolf and bobcat:</text>
<text x="66" y="1131" font-size="14" fill="#1F3D2B">Compulsory Reporting</text><circle cx="28" cy="1068" r="14" fill="#1F3D2B"/><text x="28" y="1073" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">10</text></g>
