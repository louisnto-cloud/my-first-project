<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1162" font-family="sans-serif" role="img" aria-label="10 rules that catch hunters here. 1, Fraser Valley Special Area licence ($10) and $1,000,000 insurance, All of MU 2-4, and MU 2-8 inside Maple Ridge, Pitt Meadows, Mission and Coquitlam. Pages 8, 29. 2, Deer in MU 2-8: bucks only, 10 September to 15 December. A doe is never legal there. Page 28. 3, No season means no hunting, No white tailed deer in Region 2, no wolf in MU 2-8. 4, Fraser Valley Regional District roads: no shooting within 400 m, Unless lawfully hunting or trapping. Target shooting is out. Page 27. 5, Pitt Addington Marsh and Bert Brink: no motor vehicles, all year, Page 27. 6, Other Region 2 vehicle closures: 1 April to 15 June, No sign does not mean no closure. 7, Regional district parks: no hunting or shooting within 100 m, Page 9. 8, Highway 7, east of Mission to Highway 1: shot only within 150 m, More shot only and No Shooting land at Nicomen and Hatzic. 9, Ducks and geese: federal permit, No lead shot on Delta and Mud Bay dykes, no snipe in Boundary Bay, no hunting in Burns Bog. 10, Every cougar and mountain goat to Compulsory Inspection, By appointment. Wolf and bobcat: Compulsory Reporting.">
<rect width="400" height="1162" rx="12" fill="#EEF1EA"/>
<text x="16" y="30" font-size="18" font-weight="bold" fill="#1F3D2B">10 rules that catch hunters here</text>
<text x="16" y="52" font-size="14" fill="#17201A">Every rule: 99% (rule 8 boundary lines 85%, my</text>
<text x="16" y="70" font-size="14" fill="#17201A">reading)</text>
<path d="M28 114 V1068" stroke="#1F3D2B" stroke-width="3" fill="none"/>
<g><rect x="54" y="92" width="334" height="136" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="3"/><text x="66" y="117" font-size="16" font-weight="bold" fill="#17201A">Fraser Valley Special Area</text>
<text x="66" y="137" font-size="16" font-weight="bold" fill="#17201A">licence ($10) and $1,000,000</text>
<text x="66" y="157" font-size="16" font-weight="bold" fill="#17201A">insurance</text><text x="66" y="179" font-size="14" fill="#1F3D2B">All of MU 2-4, and MU 2-8 inside Maple</text>
<text x="66" y="197" font-size="14" fill="#1F3D2B">Ridge, Pitt Meadows, Mission and</text>
<text x="66" y="215" font-size="14" fill="#1F3D2B">Coquitlam. Pages 8, 29</text><circle cx="28" cy="114" r="14" fill="#FF6A13"/><text x="28" y="119" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text></g>
<g><rect x="54" y="238" width="334" height="78" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="3"/><text x="66" y="263" font-size="16" font-weight="bold" fill="#17201A">Deer in MU 2-8: bucks only</text><text x="66" y="285" font-size="14" fill="#1F3D2B">10 September to 15 December. A doe is</text>
<text x="66" y="303" font-size="14" fill="#1F3D2B">never legal there. Page 28</text><circle cx="28" cy="260" r="14" fill="#FF6A13"/><text x="28" y="265" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text></g>
<g><rect x="54" y="326" width="334" height="78" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><text x="66" y="351" font-size="16" font-weight="bold" fill="#17201A">No season means no hunting</text><text x="66" y="373" font-size="14" fill="#1F3D2B">No white tailed deer in Region 2, no wolf</text>
<text x="66" y="391" font-size="14" fill="#1F3D2B">in MU 2-8</text><circle cx="28" cy="348" r="14" fill="#1F3D2B"/><text x="28" y="353" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text></g>
<g><rect x="54" y="414" width="334" height="98" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><text x="66" y="439" font-size="16" font-weight="bold" fill="#17201A">Fraser Valley Regional District</text>
<text x="66" y="459" font-size="16" font-weight="bold" fill="#17201A">roads: no shooting within 400 m</text><text x="66" y="481" font-size="14" fill="#1F3D2B">Unless lawfully hunting or trapping.</text>
<text x="66" y="499" font-size="14" fill="#1F3D2B">Target shooting is out. Page 27</text><circle cx="28" cy="436" r="14" fill="#1F3D2B"/><text x="28" y="441" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text></g>
<g><rect x="54" y="522" width="334" height="100" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><text x="66" y="547" font-size="16" font-weight="bold" fill="#17201A">Pitt Addington Marsh and Bert</text>
<text x="66" y="567" font-size="16" font-weight="bold" fill="#17201A">Brink: no motor vehicles, all</text>
<text x="66" y="587" font-size="16" font-weight="bold" fill="#17201A">year</text><text x="66" y="609" font-size="14" fill="#1F3D2B">Page 27</text><circle cx="28" cy="544" r="14" fill="#1F3D2B"/><text x="28" y="549" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text></g>
