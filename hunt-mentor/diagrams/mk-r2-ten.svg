<text x="66" y="767" font-size="16" font-weight="bold" fill="#17201A">hunting or shooting within 100 m</text><text x="66" y="789" font-size="14" fill="#1F3D2B">Page 9</text><circle cx="28" cy="744" r="14" fill="#1F3D2B"/><text x="28" y="749" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text></g>
<g><rect x="54" y="812" width="334" height="118" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><text x="66" y="837" font-size="16" font-weight="bold" fill="#17201A">Highway 7, east of Mission to</text>
<text x="66" y="857" font-size="16" font-weight="bold" fill="#17201A">Highway 1: shot only within 150</text>
<text x="66" y="877" font-size="16" font-weight="bold" fill="#17201A">m</text><text x="66" y="899" font-size="14" fill="#1F3D2B">More shot only and No Shooting land at</text>
<text x="66" y="917" font-size="14" fill="#1F3D2B">Nicomen and Hatzic</text><circle cx="28" cy="834" r="14" fill="#1F3D2B"/><text x="28" y="839" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">8</text></g>
