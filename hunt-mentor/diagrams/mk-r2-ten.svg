<text x="66" y="677" font-size="16" font-weight="bold" fill="#17201A">1 April to 15 June</text><text x="66" y="699" font-size="14" fill="#1F3D2B">No sign does not mean no closure</text><circle cx="28" cy="654" r="14" fill="#1F3D2B"/><text x="28" y="659" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text></g>
