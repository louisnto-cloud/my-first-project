<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 346" font-family="sans-serif" role="img" aria-label="Camps and cabins cards. Do: pack out everything you pack in. Do not: litter, which is an offence. Do not: enter, damage or disturb trappers&#x27; and guides&#x27; cabins. Do not: shoot on or into the developed part of a recreation site, 100 metres from structures and camping areas. Do: keep camp small, the fire legal and take the meat pole down. Do: no generators or engines before shooting light.">
<rect x="0" y="0" width="400" height="346" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Camps and cabins</text><rect x="10" y="44" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(40 78) scale(0.9)"><path d="M-14 -8 h28 l-3 26 h-22 z" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6 -8 q6 -10 12 0" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="179" cy="60" r="11" fill="#8a9a6b"/><path d="M173 60 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Pack out</text><text x="68" y="86" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">everything</text><text x="68" y="104" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">you pack in</text><rect x="203" y="44" width="185" height="92" rx="10" fill="#fdf0e6" stroke="#e8590c" stroke-width="2"/><g transform="translate(233 78) scale(0.9)"><path d="M-12 -8 h24 l-3 26 h-18 z" fill="#cfd6bf" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-16 -12 h32 M-5 -16 h10" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="372" cy="60" r="11" fill="#e8590c"/><path d="M367 55 l10 10 M377 55 l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="261" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Litter: also</text><text x="261" y="86" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">an offence</text><rect x="10" y="144" width="185" height="92" rx="10" fill="#fdf0e6" stroke="#e8590c" stroke-width="2"/><g transform="translate(40 178) scale(0.9)"><rect x="-13" y="-20" width="26" height="40" rx="2" fill="#8b5a2b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="2" r="2.5" fill="#f5f0e0"/></g><circle cx="179" cy="160" r="11" fill="#e8590c"/><path d="M174 155 l10 10 M184 155 l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="68" y="168" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Trapper or</text><text x="68" y="186" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">guide cabin:</text><text x="68" y="204" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">do not enter</text><rect x="203" y="144" width="185" height="92" rx="10" fill="#fdf0e6" stroke="#e8590c" stroke-width="2"/><g transform="translate(233 178) scale(0.9)"><circle r="16" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -20 V-6 M0 6 V20 M-20 0 H-6 M6 0 H20" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="372" cy="160" r="11" fill="#e8590c"/><path d="M367 155 l10 10 M377 155 l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="261" y="168" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Shoot into a</text><text x="261" y="186" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">rec site</text><text x="261" y="204" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">camp area</text><rect x="10" y="244" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(40 278) scale(0.9)"><path d="M0 -18 C10 -6 14 2 8 12 C4 18 -6 18 -9 10 C-12 2 -4 -2 0 -18 Z" fill="#e8590c"/><path d="M-14 16 L14 10 M-14 10 L14 16" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round"/></g><circle cx="179" cy="260" r="11" fill="#8a9a6b"/><path d="M173 260 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="268" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Small camp,</text><text x="68" y="286" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">legal fire,</text><text x="68" y="304" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">meat pole</text><text x="68" y="322" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">down</text><rect x="203" y="244" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(233 278) scale(0.9)"><circle r="18" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 0 V-11 M0 0 L8 5" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="372" cy="260" r="11" fill="#8a9a6b"/><path d="M366 260 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="261" y="268" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">No engines</text><text x="261" y="286" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">before</text><text x="261" y="304" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">shooting</text><text x="261" y="322" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">light</text>
</svg>
