<text x="250" y="142" font-size="14" fill="#23261f" text-anchor="start">allowance, MU 6-8</text>
<rect x="6" y="180" width="190" height="114" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M6 190 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#c92a2a"/>
<text x="101" y="198" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Muddy Lake, Golden</text>
<text x="101" y="216" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Bear road</text>
<text x="14" y="246" font-size="14" fill="#23261f" text-anchor="start">No hunting within 2 km</text>
<text x="14" y="264" font-size="14" fill="#23261f" text-anchor="start">either side, MUs 6-22,</text>
<text x="14" y="282" font-size="14" fill="#23261f" text-anchor="start">6-26</text>
<rect x="204" y="180" width="190" height="114" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M204 190 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#c92a2a"/>
<text x="299" y="198" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Lucy Island, MU 6-13</text>
<text x="212" y="246" font-size="14" fill="#23261f" text-anchor="start">No hunting, trapping or</text>
<text x="212" y="264" font-size="14" fill="#23261f" text-anchor="start">shooting</text>
<rect x="6" y="302" width="190" height="132" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
