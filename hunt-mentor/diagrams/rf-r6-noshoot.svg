<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 449" font-family="sans-serif" role="img" aria-label="Region 6 highways and other closures, synopsis pages 10 and 49. Highway 113, the Nisga&#x27;a Highway: no shooting or hunting within 400 metres of the centre line between Sterling Mountain Parking Lot Recreation Site and Kincolith, and east to Nass Camp. Highway 118 between Topley and Granisle, Management Unit 6-8: no firearm within 400 metres of either side of the road allowance. Muddy Lake and Golden Bear Access Road, MUs 6-22 and 6-26: no hunting within 2 kilometres either side. Lucy Island, MU 6-13: no hunting, trapping or shooting. Shaman Island, MU 6-25, new: no shooting, no hunting, a sacred site of the Teslin Tlingit Council.">
