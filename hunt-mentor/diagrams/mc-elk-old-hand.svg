<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Six habits of an experienced elk hunter, opinion: walks past the road hunters; hunts the wind first and the elk second; listens at first light before moving; calls less and waits longer; plans the pack out before the shot; counts one antler twice.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">What a 40 year elk hunter does (opinion)</text><rect x="12" y="46" width="376" height="32" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="26" y="67" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Walks past the road hunters</text><rect x="12" y="84" width="376" height="32" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="26" y="105" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Hunts the wind first, the elk second</text><rect x="12" y="122" width="376" height="32" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="26" y="143" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Listens at first light before moving</text><rect x="12" y="160" width="376" height="32" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="26" y="181" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Calls less, waits longer</text><rect x="12" y="198" width="376" height="32" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="26" y="219" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Plans the pack out before the shot</text><rect x="12" y="236" width="376" height="32" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="26" y="257" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Counts one antler twice</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Widely taught hunter wisdom: opinion</text>
</svg>
