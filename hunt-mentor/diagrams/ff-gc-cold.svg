<text x="170" y="242" font-size="16" font-weight="bold" fill="#2f3a2b">accessible parts, or a</text>
<text x="170" y="262" font-size="16" font-weight="bold" fill="#2f3a2b">lube made for cold</text>
<text x="170" y="281" font-size="14" fill="#6b5b4b">CZ manual (95%)</text>
<rect x="8" y="300" width="384" height="55" rx="8" fill="#2f3a2b"/><text x="200" y="323.6" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Tikka: oil in the bolt? Clean it</text><text x="200" y="343.6" font-size="14" fill="#fffaf0" text-anchor="middle">before cold hunts (95%)</text>
</svg>
