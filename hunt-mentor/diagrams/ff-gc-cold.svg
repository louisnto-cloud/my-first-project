<rect x="29" y="66" width="14" height="66" rx="7" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><rect x="32.5" y="116.1" width="7" height="15.9" fill="#4a7fb0"/><circle cx="36" cy="132" r="11" fill="#4a7fb0" stroke="#2f3a2b" stroke-width="2"/><line x1="43" y1="114.0" x2="49" y2="114.0" stroke="#2f3a2b" stroke-width="1.6"/><line x1="43" y1="100.7" x2="49" y2="100.7" stroke="#2f3a2b" stroke-width="1.6"/><line x1="43" y1="87.3" x2="49" y2="87.3" stroke="#2f3a2b" stroke-width="1.6"/><line x1="43" y1="74.0" x2="49" y2="74.0" stroke="#2f3a2b" stroke-width="1.6"/>
<line x1="58.0" y1="62.0" x2="74.0" y2="62.0" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="62.0" y1="55.1" x2="70.0" y2="68.9" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="70.0" y1="55.1" x2="62.0" y2="68.9" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/>
<text x="60" y="92" font-size="20" font-weight="bold" fill="#2f5f8a">minus 25 C</text>
<text x="60" y="112" font-size="14" fill="#6b5b4b">illustration</text>
<g transform="translate(194 70) scale(1.0)"><rect x="0" y="-13" width="22" height="26" rx="5" fill="#3f443d"/><rect x="20" y="-11" width="130" height="22" rx="4" fill="#a9ada6" stroke="#3f443d" stroke-width="1.6"/><path d="M24 -5 H146" stroke="#e4e6e1" stroke-width="3"/><path d="M40 8 L56 36" stroke="#3f443d" stroke-width="6" stroke-linecap="round"/><circle cx="58" cy="40" r="8" fill="#3f443d"/><rect x="148" y="-13" width="8" height="26" rx="2" fill="#8d918a" stroke="#3f443d" stroke-width="1.6"/><path d="M70 -10.0 C75 -3.0 75 3 70 3 C65 3 65 -3.0 70 -10.0z" fill="#8a5a12" opacity=".85"/><path d="M96 -6.600000000000001 C102 1.7999999999999998 102 9 96 9 C90 9 90 1.7999999999999998 96 -6.600000000000001z" fill="#8a5a12" opacity=".85"/><path d="M122 -11.0 C127 -4.0 127 2 122 2 C117 2 117 -4.0 122 -11.0z" fill="#8a5a12" opacity=".85"/><path d="M84 2.5999999999999996 C88 8.2 88 13 84 13 C80 13 80 8.2 84 2.5999999999999996z" fill="#8a5a12" opacity=".85"/></g>
<text x="270" y="124" font-size="15" font-weight="bold" fill="#2f3a2b">Thick oil slows</text><text x="270" y="143" font-size="15" font-weight="bold" fill="#2f3a2b">the firing pin</text>
