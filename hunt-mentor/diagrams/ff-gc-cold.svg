<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="In deep cold, thick oil can slow the firing pin. The CZ manual says at very low temperatures remove the oil from accessible parts or use a lubricant made for those conditions. Tikka says strip and clean the bolt if oil got inside, which matters most in cold or harsh weather.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Deep cold: less oil, or a cold rated lube</text><text x="90" y="80" font-size="22" font-weight="bold" fill="#4a7fb0" text-anchor="middle">minus 25 C</text><text x="90" y="120" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">thick oil</text><text x="90" y="139" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">slows the</text><text x="90" y="158" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">firing pin</text><line x1="170" y1="120" x2="230" y2="120" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><path d="M221.9 123.9 L230 120 L221.9 116.1" fill="none" stroke="#e8590c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="90" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wipe oil off</text><text x="300" y="109" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">accessible parts,</text><text x="300" y="128" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">or use a lube</text><text x="300" y="147" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">made for cold</text><text x="300" y="166" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">(CZ manual)</text><text x="200.0" y="280" font-size="13" fill="#2f3a2b" text-anchor="middle">Tikka: strip the bolt if oil got inside, before cold hunts</text>
</svg>
