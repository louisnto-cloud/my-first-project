<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 363" font-family="sans-serif" role="img" aria-label="In deep cold, for example minus 25 C (an illustration, not a rated limit), thick oil on the bolt can slow the firing pin. The CZ manual says at very low temperatures remove the oil from accessible parts or use a lubricant made for those conditions (95%). Tikka says if oil got inside the bolt, clean it, which matters most in cold or harsh weather (95%).">
<rect width="400" height="363" fill="#fffaf0"/>
<text x="200" y="27" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Deep cold: less oil, or a cold lube</text>
