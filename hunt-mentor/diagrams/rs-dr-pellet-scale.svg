<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif" role="img" aria-label="Pellets drawn to the same scale. Cottontail: a pea, about 0.6 cm. Snowshoe hare: a flat ball, about 1.2 cm. Deer: about 1.3 cm long. Elk: about 1.3 to 2.5 cm long. Moose: about 2.5 to 3.8 cm long.">
<rect x="0" y="0" width="400" height="320" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pellets to scale</text>
<text x="16" y="86" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Cottontail</text><text x="16" y="104" font-size="14" fill="#6b4f35" text-anchor="start">pea, 0.6 cm (85%)</text><g transform="translate(300 86) rotate(90) scale(0.78)"><path d="M0 -8 Q6 -6 6 2 Q5 9 0 9 Q-5 9 -6 2 Q-6 -6 0 -8 Z" fill="#6b4f35"/></g><text x="16" y="132" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Snowshoe hare</text><text x="16" y="150" font-size="14" fill="#6b4f35" text-anchor="start">flat ball, 1.2 cm (70%)</text><g transform="translate(300 132) rotate(90) scale(1.56)"><path d="M0 -8 Q6 -6 6 2 Q5 9 0 9 Q-5 9 -6 2 Q-6 -6 0 -8 Z" fill="#6b4f35"/></g><text x="16" y="178" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Deer</text><text x="16" y="196" font-size="14" fill="#6b4f35" text-anchor="start">about 1.3 cm long (85%)</text><g transform="translate(300 178) rotate(90) scale(1.6900000000000002)"><path d="M0 -8 Q6 -6 6 2 Q5 9 0 9 Q-5 9 -6 2 Q-6 -6 0 -8 Z" fill="#6b4f35"/></g><text x="16" y="224" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Elk</text><text x="16" y="242" font-size="14" fill="#6b4f35" text-anchor="start">1.3 to 2.5 cm long (65%)</text><g transform="translate(300 224) rotate(90) scale(2.3400000000000003)"><path d="M0 -8 Q6 -6 6 2 Q5 9 0 9 Q-5 9 -6 2 Q-6 -6 0 -8 Z" fill="#6b4f35"/></g><text x="16" y="270" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Moose</text><text x="16" y="288" font-size="14" fill="#6b4f35" text-anchor="start">2.5 to 3.8 cm long (80%)</text><g transform="translate(300 270) rotate(90) scale(4.16)"><path d="M0 -8 Q6 -6 6 2 Q5 9 0 9 Q-5 9 -6 2 Q-6 -6 0 -8 Z" fill="#6b4f35"/></g><line x1="330" y1="300" x2="352.4" y2="300" stroke="#23261f" stroke-width="3"/><text x="342" y="316" font-size="14" fill="#23261f" text-anchor="middle">1 cm</text>
</svg>
