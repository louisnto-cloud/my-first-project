<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="The scent cone tool: a shaded wedge 30 degrees wide and 400 metres long runs downwind from you. Keep the animals out of it. Opinion, labelled Tip.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#dfe6d3" stroke="none" stroke-width="2"/><circle cx="120" cy="200" r="8" fill="#e8590c" stroke="none" stroke-width="2"/><text x="120" y="230" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">You</text><path d="M120 200 L356 90 L379 223 Z" fill="#e8590c" opacity=".25"/><line x1="20" y1="150" x2="87.3" y2="150.0" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="95.0,150.0 84.0,143.9 84.0,156.1" fill="#4a7fb0"/><text x="20" y="135" font-family="sans-serif" font-size="14" fill="#4a7fb0" text-anchor="start" font-weight="bold">Wind from the west</text><text x="230" y="150" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">Scent: 30° wide,</text><text x="230" y="168" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">400 m long (Tip)</text><g transform="translate(300 80) scale(0.8 0.8)"><ellipse rx="20" ry="9" fill="#8b5a2b"/><path d="M14 -5 L22 -18 L28 -17 L24 -6 Z" fill="#8b5a2b"/><circle cx="25" cy="-19" r="5" fill="#8b5a2b"/><path d="M-12 6 v14 M-6 6 v14 M10 6 v14 M15 6 v14" stroke="#8b5a2b" stroke-width="3"/></g><text x="250" y="50" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Keep deer out of it</text><text x="14" y="24" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Scent cone</text>
</svg>
