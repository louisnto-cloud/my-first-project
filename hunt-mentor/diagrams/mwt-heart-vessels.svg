<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Front view of a deer chest cut just behind the shoulders. The spine is at the top with the aorta, the main artery, just below it. Two large lungs fill the left and right of the chest. The heart sits low in the middle between them, near the bottom of the chest." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">Chest cut behind the shoulder (front view)</text><ellipse cx="200" cy="150" rx="110" ry="105" fill="#e9dcc2" stroke="#6b4f35" stroke-width="3"/><path d="M110 90 Q 200 70 290 90" fill="none" stroke="#d6c4a2" stroke-width="2"/><path d="M114 120 Q 200 100 286 120" fill="none" stroke="#d6c4a2" stroke-width="2"/><path d="M118 150 Q 200 130 282 150" fill="none" stroke="#d6c4a2" stroke-width="2"/><path d="M122 180 Q 200 160 278 180" fill="none" stroke="#d6c4a2" stroke-width="2"/><path d="M126 210 Q 200 190 274 210" fill="none" stroke="#d6c4a2" stroke-width="2"/><rect x="185" y="46" width="30" height="26" rx="6" fill="#f4efe4" stroke="#23261f" stroke-width="2"/><circle cx="200" cy="86" r="9" fill="#9b2c1c"/><ellipse cx="148" cy="148" rx="44" ry="66" fill="#f2b48e" stroke="#e8590c" stroke-width="2"/><ellipse cx="252" cy="148" rx="44" ry="66" fill="#f2b48e" stroke="#e8590c" stroke-width="2"/><ellipse cx="200" cy="214" rx="26" ry="30" fill="#9b2c1c"/><text x="232" y="56" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Spine</text><text x="214" y="100" font-size="14" fill="#9b2c1c" text-anchor="start" font-weight="bold">Aorta (main artery)</text><text x="148" y="152" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Lung</text><text x="252" y="152" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Lung</text><text x="200" y="219" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Heart</text><text x="200" y="284" font-size="14" fill="#6b4f35" text-anchor="middle">Heart sits low. Big vessels run under the spine.</text>
</svg>
