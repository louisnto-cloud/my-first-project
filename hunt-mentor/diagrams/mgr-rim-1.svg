<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="Rimfire step 1. A dark grouse sits in a conifer. Before anything, check: which grouse is it, is this MU and season open today, do you have room left in the bag, and is it legal hours." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="280" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">1. Name the bird, count the bag</text>
<polygon points="130,60 40.0,260 220.0,260" fill="#2f3a2b"/><rect x="127" y="260" width="6" height="30" fill="#6b4f35"/>
<g transform="translate(150 140) scale(0.9 0.9)"><polygon points="-22,-4 -36,-8 -36,4 -22,6" fill="#23261f"/><ellipse cx="0" cy="0" rx="26" ry="15" fill="#3d3a35"/><circle cx="21" cy="-14" r="8" fill="#3d3a35"/><path d="M18 -20 q5 -5 10 0" fill="none" stroke="#c23b22" stroke-width="3"/><polygon points="28,-16 35,-13 28,-10" fill="#6b4f35"/><circle cx="23" cy="-16" r="1.8" fill="#23261f"/><path d="M2 13 l-2 11 M10 13 l2 11" stroke="#6b4f35" stroke-width="2.5" fill="none"/></g>
<rect x="230" y="60" width="160" height="150" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
<text x="242" y="88" font-size="14" fill="#23261f" text-anchor="start">Which grouse?</text>
<text x="242" y="112" font-size="14" fill="#23261f" text-anchor="start">Open MU, open</text>
<text x="242" y="136" font-size="14" fill="#23261f" text-anchor="start">season, today?</text>
<text x="242" y="160" font-size="14" fill="#23261f" text-anchor="start">Bag room left?</text>
<text x="242" y="184" font-size="14" fill="#23261f" text-anchor="start">Legal hours?</text>
</svg>
