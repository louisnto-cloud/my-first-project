<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="sans-serif" role="img" aria-label="Six burn hazards. Danger trees: fire damaged trees fall with no warning. Ash pits: hard to see and can stay hot long after the flames. Floods and mud flows after heavy rain. Rockfall and slides on unstable slopes. Deadfall: twisted ankles and a slow way out. Closures: area restrictions under the Wildfire Act.">
<rect width="400" height="290" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Burn hazards</text><rect x="12" y="44" width="120" height="110" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="72" y="74" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Danger trees</text><text x="72" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">fall, no warning</text><text x="72" y="128" font-size="14" fill="#6b4f35" text-anchor="middle">(85%)</text><rect x="140" y="44" width="120" height="110" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="200" y="74" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Ash pits</text><text x="200" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">hidden, stay hot</text><text x="200" y="128" font-size="14" fill="#6b4f35" text-anchor="middle">(85%)</text><rect x="268" y="44" width="120" height="110" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="328" y="74" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Floods, mud</text><text x="328" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">after heavy rain</text><text x="328" y="128" font-size="14" fill="#6b4f35" text-anchor="middle">(85%)</text><rect x="12" y="164" width="120" height="110" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="72" y="194" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Rockfall</text><text x="72" y="224" font-size="14" fill="#2f3a2b" text-anchor="middle">unstable slopes</text><text x="72" y="248" font-size="14" fill="#6b4f35" text-anchor="middle">(85%)</text><rect x="140" y="164" width="120" height="110" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="194" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Deadfall</text><text x="200" y="224" font-size="14" fill="#2f3a2b" text-anchor="middle">ankles, slow exit</text><text x="200" y="248" font-size="14" fill="#6b4f35" text-anchor="middle">(Tip)</text><rect x="268" y="164" width="120" height="110" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="328" y="194" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Closures</text><text x="328" y="224" font-size="14" fill="#2f3a2b" text-anchor="middle">area restrictions</text><text x="328" y="248" font-size="14" fill="#6b4f35" text-anchor="middle">(85%)</text>
</svg>
