<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A bolt drawn side on. At the front, locking lugs that turn into the receiver to lock. A firing pin runs inside the bolt, drawn as a dashed orange line. At the back, the shroud with the cocking piece. The bolt handle drops down. An extractor claw at the front pulls out the case.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Inside the bolt</text><rect x="40" y="110" width="300" height="36" rx="10" fill="#9a9e96" stroke="#2f3a2b" stroke-width="2"/><rect x="320" y="100" width="26" height="56" rx="4" fill="#9a9e96" stroke="#2f3a2b" stroke-width="2"/><rect x="40" y="104" width="30" height="48" rx="6" fill="#6b6f68" stroke="#2f3a2b" stroke-width="2"/><line x1="90" y1="146" x2="76" y2="190" stroke="#2f3a2b" stroke-width="7" stroke-linecap="round"/><circle cx="74" cy="196" r="10" fill="#2f3a2b" stroke="none" stroke-width="2"/><line x1="60" y1="128" x2="330" y2="128" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/><rect x="340" y="120" width="8" height="16" rx="0" fill="#c9a227" stroke="none" stroke-width="2"/><line x1="334" y1="100" x2="320" y2="76" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round"/><text x="320" y="70" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Locking lugs</text><line x1="210" y1="126" x2="200" y2="76" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round"/><text x="200" y="70" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Firing pin inside</text><line x1="56" y1="104" x2="80" y2="76" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round"/><text x="80" y="70" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cocking piece</text><line x1="346" y1="152" x2="300" y2="216" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round"/><text x="300" y="210" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Extractor claw</text><line x1="86" y1="196" x2="150" y2="242" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round"/><text x="150" y="236" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bolt handle</text><text x="200.0" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle">Lugs lock into the receiver. The pin hits the primer.</text>
</svg>
