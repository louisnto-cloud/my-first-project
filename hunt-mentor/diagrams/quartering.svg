<line x1="282" y1="222" x2="282" y2="368" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="282" cy="222" r="2.6" fill="#2f3a2b"/><rect x="209.8" y="368.0" width="182.2" height="45.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="300.898" y="387.5" font-size="16" font-weight="bold" fill="#c2410c" text-anchor="middle">Tenderloin</text>
<text x="300.898" y="405" font-size="15" fill="#2f3a2b" text-anchor="middle">inside, under the spine</text>
<rect x="8" y="430" width="384" height="104" rx="8" fill="#eef2e6" stroke="#2f6e3b" stroke-width="1.4"/>
<text x="20" y="454" font-size="16" font-weight="bold" fill="#2f3a2b">BC legal edible portions, big game:</text>
<text x="20" y="475" font-size="16" fill="#2f3a2b">neck, ribs, four quarters and the loins.</text>
<text x="20" y="500" font-size="15" font-weight="bold" fill="#c0392b">Take every one out. Leaving them is wastage.</text>
<text x="20" y="522" font-size="15" fill="#6b5b4b">Heart and liver: optional extras, if you like them.</text>
</svg>
