<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 542" font-family="sans-serif" role="img" aria-label="A deer in side view, a field guide plate coloured by meat cut, for quartering. Neck, in tan. Front quarter, shoulder and shank, in green. Backstrap, the loin, an orange band along both sides of the spine. Tenderloin, a dashed orange line inside the body, under the spine ahead of the hip. Ribs and flank in the middle: trim the meat off the bone. Hind quarter, brown, the big roasts. BC legal edible portions for big game: neck, ribs, four quarters and the loins. Take every one of these out; leaving them is wastage. Heart and liver are optional extras: take them if you like them.">
