<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 298" font-family="sans-serif" role="img" aria-label="Grouse menu through the year. Fall: berries, clover, leaves and seeds. Winter, ruffed grouse: buds and catkins of aspen, birch and alder. Winter, spruce grouse: pine and spruce needles. Winter, dusky grouse: conifer needles, high in dense timber.">
<rect width="400" height="298" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Grouse menu through the year</text><rect x="12" y="44" width="184" height="110" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><rect x="12" y="44" width="184" height="30" rx="8" fill="#e8590c"/><text x="104" y="65" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Fall</text><text x="104" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">berries, clover,</text><text x="104" y="124" font-size="14" fill="#2f3a2b" text-anchor="middle">leaves, seeds</text><rect x="204" y="44" width="184" height="110" rx="8" fill="#ffffff" stroke="#4a7fb0" stroke-width="2"/><rect x="204" y="44" width="184" height="30" rx="8" fill="#4a7fb0"/><text x="296" y="65" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Winter, ruffed</text><text x="296" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">aspen, birch and</text><text x="296" y="124" font-size="14" fill="#2f3a2b" text-anchor="middle">alder buds, catkins</text><rect x="12" y="164" width="184" height="110" rx="8" fill="#ffffff" stroke="#2c4a3a" stroke-width="2"/><rect x="12" y="164" width="184" height="30" rx="8" fill="#2c4a3a"/><text x="104" y="185" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Winter, spruce</text><text x="104" y="224" font-size="14" fill="#2f3a2b" text-anchor="middle">pine and spruce</text><text x="104" y="244" font-size="14" fill="#2f3a2b" text-anchor="middle">needles</text><rect x="204" y="164" width="184" height="110" rx="8" fill="#ffffff" stroke="#3c5a3a" stroke-width="2"/><rect x="204" y="164" width="184" height="30" rx="8" fill="#3c5a3a"/><text x="296" y="185" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Winter, dusky</text><text x="296" y="224" font-size="14" fill="#2f3a2b" text-anchor="middle">conifer needles,</text><text x="296" y="244" font-size="14" fill="#2f3a2b" text-anchor="middle">up in the timber</text><text x="200.0" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">From the app grouse sessions (70 to 85%)</text>
</svg>
