<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Defensive or predatory attack. Defensive: the bear was surprised or is protecting cubs or food, it comes fast and noisy from close; spray, and if it makes contact, lie flat and still. Predatory: the bear sees you as food, it is quiet, stalks and keeps coming; spray and fight back hard. Cougar: always fight back.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Attack: defensive or predatory?</text><rect x="10" y="46" width="100" height="50" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="60" y="76" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle"></text><rect x="110" y="46" width="140" height="50" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="180" y="76" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Defensive</text><rect x="250" y="46" width="140" height="50" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="320" y="76" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Predatory</text><rect x="10" y="96" width="100" height="50" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="60" y="126" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Why</text><rect x="110" y="96" width="140" height="50" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="180" y="118" font-size="14" fill="#2f3a2b" text-anchor="middle">Surprised, cubs,</text><text x="180" y="134" font-size="14" fill="#2f3a2b" text-anchor="middle">food</text><rect x="250" y="96" width="140" height="50" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="320" y="118" font-size="14" fill="#2f3a2b" text-anchor="middle">Sees you</text><text x="320" y="134" font-size="14" fill="#2f3a2b" text-anchor="middle">as food</text><rect x="10" y="146" width="100" height="50" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="60" y="176" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Looks like</text><rect x="110" y="146" width="140" height="50" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="180" y="168" font-size="14" fill="#2f3a2b" text-anchor="middle">Fast, noisy,</text><text x="180" y="184" font-size="14" fill="#2f3a2b" text-anchor="middle">from close</text><rect x="250" y="146" width="140" height="50" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="320" y="168" font-size="14" fill="#2f3a2b" text-anchor="middle">Quiet, stalks,</text><text x="320" y="184" font-size="14" fill="#2f3a2b" text-anchor="middle">keeps coming</text><rect x="10" y="196" width="100" height="50" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="60" y="226" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">You</text><rect x="110" y="196" width="140" height="50" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="180" y="218" font-size="14" fill="#2f3a2b" text-anchor="middle">Spray. Contact:</text><text x="180" y="234" font-size="14" fill="#2f3a2b" text-anchor="middle">lie flat, still</text><rect x="250" y="196" width="140" height="50" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="320" y="218" font-size="14" fill="#2f3a2b" text-anchor="middle">Spray. Fight</text><text x="320" y="234" font-size="14" fill="#2f3a2b" text-anchor="middle">back hard</text><text x="200" y="285" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cougar: always fight back</text>
</svg>
