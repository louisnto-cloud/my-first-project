<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Before every season: 1 read the marks on the left side of the receiver, 2 find the record in the RCMP Firearms Reference Table, 3 read the news on the federal SKS review, 4 ask a gunsmith or the RCMP.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Check the status each season</text>
<rect x="40.0" y="56.0" width="320.0" height="42.0" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><circle cx="62.0" cy="77.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="62.0" y="82.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="84.0" y="74.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Read the marks</text><text x="84.0" y="92.0" font-size="14" fill="#17201A" text-anchor="start">left side of the receiver</text><rect x="40.0" y="108.0" width="320.0" height="42.0" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><circle cx="62.0" cy="129.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="62.0" y="134.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="84.0" y="126.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Find the record</text><text x="84.0" y="144.0" font-size="14" fill="#17201A" text-anchor="start">RCMP reference table</text><rect x="40.0" y="160.0" width="320.0" height="42.0" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><circle cx="62.0" cy="181.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="62.0" y="186.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="84.0" y="178.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Read the news</text><text x="84.0" y="196.0" font-size="14" fill="#17201A" text-anchor="start">federal SKS review</text><rect x="40.0" y="212.0" width="320.0" height="42.0" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><circle cx="62.0" cy="233.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="62.0" y="238.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="84.0" y="230.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Ask</text><text x="84.0" y="248.0" font-size="14" fill="#17201A" text-anchor="start">gunsmith or RCMP</text>
<text x="200.0" y="288.0" font-size="14" fill="#17201A" text-anchor="middle">Laws change. VERIFY each season.</text>
</svg>
