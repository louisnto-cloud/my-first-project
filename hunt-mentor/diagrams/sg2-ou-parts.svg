<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Parts of an over under like the Browning Citori: top lever, tang safety and barrel selector, receiver, hinge pin, two barrels, forearm and its latch, ejectors at the breech, a choke in each barrel.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Over under: the parts</text>
<g transform="translate(10 100) scale(1.0)"><path d="M0 16 L7 14 L92 22 L108 22 L108 38 L97 40 C88 42 81 46 75 53 L6 57 L0 57 Z" fill="#6b5a45" stroke="#17201A" stroke-width="0.7"/><path d="M0 16 L5 15 L5 57 L0 57 Z" fill="#3b4045"/><path d="M108 18 L150 18 L156 24 L156 40 L108 40 Z" fill="#a7aeb3" stroke="#17201A" stroke-width="0.7"/><path d="M100 18 L114 15 L116 18 Z" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><rect x="90" y="19" width="8" height="3" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><rect x="156" y="19" width="222" height="7.5" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><rect x="156" y="27" width="222" height="7.5" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><line x1="156" y1="26.7" x2="378" y2="26.7" stroke="#a7aeb3" stroke-width="0.8"/><line x1="156" y1="18.4" x2="378" y2="18.4" stroke="#a7aeb3" stroke-width="1.2"/><rect x="366" y="19" width="12" height="15.5" fill="#a7aeb3" stroke="#17201A" stroke-width="0.7"/><circle cx="375" cy="17.2" r="1.6" fill="#ffffff" stroke="#17201A" stroke-width="0.5"/><path d="M160 33 L240 33 L240 42 L168 42 C163 42 160 39 160 36 Z" fill="#6b5a45" stroke="#17201A" stroke-width="0.7"/><rect x="186" y="40" width="10" height="3" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><circle cx="152" cy="37" r="2.6" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><path d="M116 40 C116 53 138 53 140 40" fill="none" stroke="#3b4045" stroke-width="2"/><line x1="127" y1="40" x2="125" y2="49" stroke="#3b4045" stroke-width="2.2"/></g>
<g data-tip="Top lever|Push it right to open the gun. Let it snap back when you close." data-tip-dot="120,115"><line x1="120.0" y1="72.0" x2="120.0" y2="115.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="120.0" cy="115.0" r="3" fill="#1F3D2B"/><rect x="69.0" y="49.0" width="82.0" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="110.0" y="66.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Top lever</text></g>
<g data-tip="Safety, selector|Citori: slide back = safe (S shows). Sideways picks the barrel: O over, U under." data-tip-dot="104,120"><line x1="104.0" y1="184.0" x2="104.0" y2="120.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="104.0" cy="120.0" r="3" fill="#1F3D2B"/><rect x="1.3" y="183.0" width="137.4" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="70.0" y="200.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Safety, selector</text></g>
<g data-tip="Hinge pin|The barrels pivot here. Keep it greased." data-tip-dot="162,137"><line x1="162.0" y1="220.0" x2="162.0" y2="137.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="162.0" cy="137.0" r="3" fill="#1F3D2B"/><rect x="131.2" y="219.0" width="77.7" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="170.0" y="236.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Hinge pin</text></g>
<g data-tip="Two barrels|Each has its own choke. Two shots, then reload." data-tip-dot="270,123"><line x1="270.0" y1="72.0" x2="270.0" y2="123.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="270.0" cy="123.0" r="3" fill="#1F3D2B"/><rect x="208.3" y="49.0" width="103.4" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="260.0" y="66.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Two barrels</text></g>
<g data-tip="Forearm latch|Pull it out to take the forearm off." data-tip-dot="201,142"><line x1="201.0" y1="184.0" x2="201.0" y2="142.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="201.0" cy="142.0" r="3" fill="#1F3D2B"/><rect x="189.8" y="183.0" width="120.5" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="250.0" y="200.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Forearm latch</text></g>
<g data-tip="Chokes|One in each muzzle. Learn the notches." data-tip-dot="382,126"><line x1="382.0" y1="220.0" x2="382.0" y2="126.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="382.0" cy="126.0" r="3" fill="#1F3D2B"/><rect x="317.6" y="219.0" width="64.8" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="350.0" y="236.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Chokes</text></g>
<text x="200.0" y="266.0" font-size="15" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Two barrels, no magazine: no plug needed.</text>
<text x="200.0" y="292.0" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Browning Citori layout. Others are similar.</text>
</svg>
