<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 305" font-family="sans-serif" role="img" aria-label="Sketch of British Columbia showing three moose subspecies. Alaskan moose in the far northwest, the biggest. Northwestern moose across most of BC, including Kamloops. Shiras moose in the far southeast corner, the smallest. A sketch, not a map.">
<rect x="0" y="0" width="400" height="305" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Three races of moose in BC</text><path d="M60 50 L240 46 L300 120 L360 200 L380 262 L170 268 L110 250 L70 200 L40 150 L52 90 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="3"/><path d="M60 50 L120 48 L100 110 L52 100 Z" fill="#c9a77a" opacity=".8"/><path d="M330 190 L360 200 L380 262 L345 264 Z" fill="#c9a77a" opacity=".8"/><text x="84" y="72" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Alaskan</text><text x="84" y="89" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">biggest</text><text x="205" y="140" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Northwestern moose</text><text x="205" y="158" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">most of BC</text><text x="322" y="250" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">Shiras: far southeast,</text><text x="322" y="267" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">smallest</text><circle cx="222" cy="196" r="7" fill="#e8590c"/><text x="222" y="222" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Kamloops</text><text x="200" y="298" font-size="14" fill="#6b4f35" text-anchor="middle">Sketch, not a map</text>
</svg>
