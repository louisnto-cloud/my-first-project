<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three deer rumps from behind. Mule deer: big white rump, thin white tail with only a black tip. Black tailed deer: smaller rump, wide tail dark on top for its whole length. White tailed deer: wide brown tail, flipped up as a white flag when alarmed. Mule and black tailed deer are one species, two races.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Read the tail from behind</text><ellipse cx="70" cy="120" rx="48" ry="58" fill="#8b5a2b"/><ellipse cx="70" cy="110" rx="34" ry="40" fill="#f4efe2"/><rect x="65" y="92" width="10" height="52" rx="5" fill="#f4efe2"/><rect x="65" y="132" width="10" height="16" rx="5" fill="#23261f"/><text x="70" y="210" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Mule deer</text><text x="70" y="230" font-size="14" fill="#23261f" text-anchor="middle">thin, white,</text><text x="70" y="248" font-size="14" fill="#23261f" text-anchor="middle">black tip only</text><ellipse cx="200" cy="120" rx="48" ry="58" fill="#8b5a2b"/><ellipse cx="200" cy="110" rx="26" ry="32" fill="#f4efe2"/><rect x="189" y="88" width="22" height="58" rx="10" fill="#23261f"/><text x="200" y="210" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Black tail</text><text x="200" y="230" font-size="14" fill="#23261f" text-anchor="middle">wide, dark on</text><text x="200" y="248" font-size="14" fill="#23261f" text-anchor="middle">top all the way</text><ellipse cx="330" cy="120" rx="48" ry="58" fill="#8b5a2b"/><rect x="316" y="84" width="28" height="62" rx="12" fill="#8b5a2b" stroke="#23261f" stroke-width="1"/><path d="M316 84 L306 40 L354 40 L344 84 Z" fill="#f4efe2" stroke="#8a9a6b" stroke-width="1"/><text x="330" y="210" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">White tail</text><text x="330" y="230" font-size="14" fill="#23261f" text-anchor="middle">wide, brown,</text><text x="330" y="248" font-size="14" fill="#23261f" text-anchor="middle">white flag up</text><text x="200" y="288" font-size="14" fill="#6b4f35" text-anchor="middle">Mule and black tail: one species, two races (90%)</text>
</svg>
