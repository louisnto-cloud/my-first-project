<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 308" font-family="sans-serif" role="img" aria-label="Left: the CZ 457 front sight in its hood, with a pair of screws that set the height (manual Fig. 9). Right: the rule of thumb. Move the rear sight the way you want the hits to go. Raise the front blade and the hits go lower. CZ zeroes the open sights at 50 m in the factory."><rect x="0" y="0" width="400" height="308" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Front sight and which way to move</text><rect x="12" y="44" width="184" height="160" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><rect x="20" y="150" width="168" height="26" fill="#4A5156"/><path d="M60 150 L70 82 Q104 64 138 82 L148 150 Z" fill="#2B3034"/><path d="M84 150 L90 100 Q104 92 118 100 L124 150 Z" fill="#D9E0D5"/><rect x="100" y="108" width="8" height="42" fill="#2B3034"/><circle cx="136" cy="118" r="5" fill="#D8B23A"/><circle cx="138" cy="136" r="5" fill="#D8B23A"/><circle cx="166" cy="118" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="166" y="123" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><line x1="156" y1="118" x2="141" y2="118" stroke="#17201A" stroke-width="1.4"/><line x1="156" y1="124" x2="143" y2="136" stroke="#17201A" stroke-width="1.4"/><text x="104" y="226" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">Front: 2 screws set</text><text x="104" y="244" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">the height (Fig. 9)</text><rect x="204" y="44" width="184" height="200" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="296" y="70" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Which way?</text><text x="216" y="98" font-size="15" font-weight="bold" text-anchor="start" fill="#17201A">Rear sight:</text><text x="216" y="118" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">move it the way</text><text x="216" y="138" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">you want hits to go</text><text x="216" y="170" font-size="15" font-weight="bold" text-anchor="start" fill="#17201A">Front sight:</text><text x="216" y="190" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">higher blade =</text><text x="216" y="210" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">hits go lower</text><rect x="8" y="262" width="384" height="34" rx="9" fill="#1F3D2B"/><text x="200" y="284.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Factory zero: 50 m (CZ)</text></svg>
