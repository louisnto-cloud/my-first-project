<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 473" font-family="sans-serif" role="img" aria-label="Season bars for Region 8 birds near the Okanagan, fall 2026, Region 8 table on synopsis page 68, MUs 8-1 to 8-15 and 8-21 to 8-26 (99%). Quail 1 October to 30 November, 10 a day, 30 in possession. Chukar same dates, 5 a day, 15 in possession. Grey partridge same dates, 3 and 9. Pheasant cocks same dates, 2 and 6. Grouse 10 September to 30 November, 5 and 15. Shotgun with the plug in, and one feathered wing stays on each bird.">
