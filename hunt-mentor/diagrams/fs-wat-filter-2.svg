<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Filter step 2: keep the dirty bag and the clean bottle apart. One drop of raw water on the clean side undoes it.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">2. Dirty side, clean side</text><rect x="70" y="70" width="90" height="120" rx="10" fill="#8aa0a8" stroke="#2f3a2b" stroke-width="2"/><text x="115" y="210" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Dirty</text><rect x="170" y="120" width="40" height="30" rx="4" fill="#2f3a2b"/><rect x="260" y="130" width="40" height="80" rx="8" fill="#4a7fb0" stroke="#2f3a2b" stroke-width="2"/><rect x="270" y="118" width="20" height="12" rx="2" fill="#2f3a2b"/><text x="280" y="230" font-size="16" font-weight="bold" fill="#2e7d32" text-anchor="middle">Clean</text><line x1="160" y1="135" x2="166" y2="135" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><polygon points="172,135 166,131 166,139" fill="#2f3a2b"/><line x1="210" y1="135" x2="251" y2="156" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><polygon points="258,160 253,152 249,161" fill="#4a7fb0"/><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Never mix the two</text>
</svg>
