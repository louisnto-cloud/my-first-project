<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="The five BC natural disturbance types, NDT. NDT1: rare stand initiating events, the wettest coast forest. NDT2: infrequent stand initiating events, like the coast forest near Mission. NDT3: frequent stand initiating events, like Montane spruce and dry cold Engelmann spruce forests full of lodgepole pine. NDT4: frequent stand maintaining ground fires, in Bunchgrass, Ponderosa pine and Interior Douglas fir, which keep the forest open. NDT5: alpine tundra and subalpine parkland.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">How often fire comes back</text><rect x="12" y="40" width="70" height="40" rx="6" fill="#4a7fb0"/><text x="47" y="66" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">NDT1</text><text x="92" y="57" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Rare, big fires</text><text x="92" y="75" font-size="14" fill="#6b4f35" text-anchor="start">wettest coast forest</text><rect x="12" y="88" width="70" height="40" rx="6" fill="#6d8fa8"/><text x="47" y="114" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">NDT2</text><text x="92" y="105" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Infrequent, big fires</text><text x="92" y="123" font-size="14" fill="#6b4f35" text-anchor="start">Mission coast forest</text><rect x="12" y="136" width="70" height="40" rx="6" fill="#8a9a6b"/><text x="47" y="162" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">NDT3</text><text x="92" y="153" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Frequent, big fires</text><text x="92" y="171" font-size="14" fill="#6b4f35" text-anchor="start">MS, ESSF dc: lodgepole</text><rect x="12" y="184" width="70" height="40" rx="6" fill="#e8590c"/><text x="47" y="210" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">NDT4</text><text x="92" y="201" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Frequent ground fires</text><text x="92" y="219" font-size="14" fill="#6b4f35" text-anchor="start">BG, PP, IDF: open parks</text><rect x="12" y="232" width="70" height="40" rx="6" fill="#bbbbb0"/><text x="47" y="258" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">NDT5</text><text x="92" y="249" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Alpine and parkland</text><text x="92" y="267" font-size="14" fill="#6b4f35" text-anchor="start">above the trees</text><text x="200.0" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">NDT: natural disturbance type (90%)</text>
</svg>
