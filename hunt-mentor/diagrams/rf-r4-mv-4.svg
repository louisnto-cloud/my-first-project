<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" font-family="sans-serif" role="img" aria-label="Cards of vehicle closures in Management Units 4-25 to 4-38, synopsis page 38. A star means closed to all vehicles; a diamond means closed for hunting use, in spring and 1 September to 28 February unless dated. 4-25: Stoddart Creek and Columbia Lake closed to all vehicles; five watershed areas closed for hunting use in spring and 1 September to 28 February. 4-26: Hoodoo Conservation Property, Goldie Creek above 1,525 metres, Dutch Creek Findlay and the Dutch and Brewer drainages closed to all vehicles; Lavington Creek Crown land closed for hunting use. 4-29: east Lardeau River watershed, 20 October to 10 December. 4-30: Duncan Lardeau area closed to all vehicles, Highway 31 open. 4-32 Barnes Creek, 4-35 Ice River and Beaverfoot, and 4-38 Downie and Sorcerer creeks: spring and 1 September to 28 February. 4-34: Holt Creek past about 4.8 kilometres and Lang Creek past about 3.4 kilometres closed to all vehicles.">
