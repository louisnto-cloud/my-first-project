<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Call step 4: after the call, save the battery. Screen dim, apps closed, phone warm in an inside pocket. Agree check in times.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4. Then save battery</text><rect x="160" y="60" width="80" height="150" rx="12" fill="#2f3a2b"/><rect x="170" y="74" width="60" height="30" rx="3" fill="#2e7d32"/><text x="200" y="240" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Warm pocket</text><text x="310" y="120" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Check in</text><text x="310" y="140" font-size="15" fill="#2f3a2b" text-anchor="middle">on the hour</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Warm, dim, check in on the hour</text>
</svg>
