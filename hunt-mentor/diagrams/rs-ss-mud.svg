<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 306" font-family="sans-serif" role="img" aria-label="A print in mud, side view. The pushed up rim and the water seeping into the floor show it is fresh. Mud gives the best detail of toes, pads and nails, but it keeps a fresh look for days.">
<rect x="0" y="0" width="400" height="306" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Mud: detail and a trap</text>
<path d="M20 120 H120 Q130 120 136 140 L150 200 H250 L264 140 Q270 120 280 120 H380 V250 H20 Z" fill="#8a6f4e" stroke="#5c4532" stroke-width="2"/><rect x="152" y="186" width="96" height="12" rx="3" fill="#4a7fb0" opacity=".7"/><text x="200" y="172" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">water seeps in</text><path d="M120 120 q8 -10 16 0 M264 120 q8 -10 16 0" fill="none" stroke="#5c4532" stroke-width="3"/><text x="90" y="104" font-size="14" font-weight="bold" fill="#6b4f35" text-anchor="middle">pushed up rim</text><text x="200" y="276" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Best detail: toes, pads, nails (65%)</text><text x="200" y="296" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">But mud keeps a fresh look for days (65%)</text>
</svg>
