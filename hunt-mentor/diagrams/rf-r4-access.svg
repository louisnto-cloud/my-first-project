<text x="78" y="51" font-size="16" font-weight="bold" fill="#2f3a2b">Area</text>
<text x="78" y="70" font-size="15" fill="#2f3a2b">Access permit to hunt or fish. 250 402</text>
<text x="78" y="89" font-size="15" fill="#2f3a2b">6900</text>
