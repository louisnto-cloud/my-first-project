<text x="14" y="264" font-size="14" fill="#23261f" text-anchor="start">No sign does not mean</text>
<text x="14" y="282" font-size="14" fill="#23261f" text-anchor="start">no closure</text>
<rect x="204" y="198" width="190" height="150" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<path d="M204 208 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#4a7fb0"/>
<text x="299" y="216" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Baynes Lake,</text>
<text x="299" y="234" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">MU 4-22, Map D11</text>
