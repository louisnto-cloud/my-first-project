<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 484" role="img" aria-label="Six cards. Creston Valley Wildlife Management Area: an access permit is needed to hunt or fish, phone 250 402 6900. About one million hectares of Crown land is closed to snowmobiles for mountain caribou; maps online only. No sign does not mean no closure. Baynes Lake, Management Unit 4-22, Map D11: motorized use prohibited all year, no public access 15 April to 15 July except public beaches 1 and 2, dogs leashed 1 April to 31 July, Waldo Cove Road open all year. Sulphur Creek mineral lick, 4-22, Map D12: no access beyond 3 metres of the road, all year." font-family="sans-serif">
<rect x="0" y="0" width="400" height="484" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Access rules</text>
<rect x="6" y="40" width="190" height="150" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
<path d="M6 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v54 h-190 z" fill="#2f3a2b"/>
<text x="101" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Creston Valley</text>
<text x="101" y="76" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Wildlife Management</text>
<text x="101" y="94" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Area</text>
<rect x="19.0" y="118" width="22" height="28" rx="2" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/><line x1="24.0" y1="125" x2="36.0" y2="125" stroke="#2f3a2b" stroke-width="2"/><line x1="24.0" y1="131" x2="36.0" y2="131" stroke="#2f3a2b" stroke-width="2"/><line x1="24.0" y1="137" x2="36.0" y2="137" stroke="#2f3a2b" stroke-width="2"/><line x1="24.0" y1="143" x2="36.0" y2="143" stroke="#2f3a2b" stroke-width="2"/>
<text x="52" y="124" font-size="14" fill="#23261f" text-anchor="start">Access permit to</text>
<text x="52" y="142" font-size="14" fill="#23261f" text-anchor="start">hunt or fish. 250</text>
<text x="52" y="160" font-size="14" fill="#23261f" text-anchor="start">402 6900</text>
<rect x="204" y="40" width="190" height="150" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<path d="M204 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v54 h-190 z" fill="#4a7fb0"/>
