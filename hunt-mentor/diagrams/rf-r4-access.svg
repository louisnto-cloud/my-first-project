<path d="M6 366 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#2f3a2b"/>
<text x="101" y="374" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Baynes Lake dogs</text>
<text x="14" y="422" font-size="14" fill="#23261f" text-anchor="start">Leashed Apr 1 to July</text>
<text x="14" y="440" font-size="14" fill="#23261f" text-anchor="start">31. Waldo Cove Road</text>
<text x="14" y="458" font-size="14" fill="#23261f" text-anchor="start">open all year</text>
<rect x="204" y="356" width="190" height="114" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
