<text x="250" y="264" font-size="14" fill="#23261f" text-anchor="start">No motor use all</text>
<text x="250" y="282" font-size="14" fill="#23261f" text-anchor="start">year. No public</text>
<text x="250" y="300" font-size="14" fill="#23261f" text-anchor="start">access Apr 15 to</text>
<text x="250" y="318" font-size="14" fill="#23261f" text-anchor="start">July 15, beaches 1</text>
<text x="250" y="336" font-size="14" fill="#23261f" text-anchor="start">and 2 excepted</text>
