<circle cx="228.0" cy="132" r="18" fill="none" stroke="#c92a2a" stroke-width="3"/><line x1="215.0" y1="145" x2="241.0" y2="119" stroke="#c92a2a" stroke-width="3"/>
<text x="250" y="124" font-size="14" fill="#23261f" text-anchor="start">About 1 million</text>
<text x="250" y="142" font-size="14" fill="#23261f" text-anchor="start">hectares of Crown</text>
<text x="250" y="160" font-size="14" fill="#23261f" text-anchor="start">land. Maps online</text>
<text x="250" y="178" font-size="14" fill="#23261f" text-anchor="start">only</text>
<rect x="6" y="198" width="190" height="150" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
