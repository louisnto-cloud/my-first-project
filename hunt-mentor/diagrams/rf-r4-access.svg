<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 481" font-family="sans-serif" role="img" aria-label="Six access rules for Region 4. Creston Valley Wildlife Management Area: an access permit is needed to hunt or fish, phone 250 402 6900. About one million hectares of Crown land is closed to snowmobiles for mountain caribou; maps online only. No sign does not mean no closure. Baynes Lake, Management Unit 4-22, Map D11: motorized use prohibited all year, no public access 15 April to 15 July except public beaches 1 and 2, dogs leashed 1 April to 31 July, Waldo Cove Road open all year. Sulphur Creek mineral lick, 4-22, Map D12: no access beyond 3 metres of the road, all year.">
