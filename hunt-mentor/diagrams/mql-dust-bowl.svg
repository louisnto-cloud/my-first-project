<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Top view of a dirt lane beside a brush edge. Shallow round dusting bowls in the dirt, small three toed tracks, and a grey body feather. Washington Fish and Wildlife says dusting holes, tracks and droppings show quail are near, 75 percent. Tip: dusting happens at midday, so check the spot then.">
