<rect x="10" y="236" width="380" height="56" rx="8" fill="#2f3a2b"/>
<text x="200" y="258" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Dusting holes, tracks, droppings: birds near (75%)</text>
