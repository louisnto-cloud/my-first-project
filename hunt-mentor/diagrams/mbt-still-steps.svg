<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 322" font-family="sans-serif" role="img" aria-label="Still hunting in 4 steps. 1 wind in your face or across. 2 a few steps, then stop, and look longer than you walk. 3 look for parts: an ear, a leg, a flick. 4 rifle ready: shots are short in timber. All tips.">
<rect width="400" height="322" fill="#EEF1EA"/>
<text x="200" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Still hunting in 4 steps</text>
<rect x="14" y="48" width="372" height="52" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="38" cy="74" r="13" fill="#1F3D2B" stroke="none"/><text x="38" y="79" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text><text x="62" y="70" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Wind in your face</text><text x="62" y="91" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">or across</text><rect x="14" y="110" width="372" height="52" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="38" cy="136" r="13" fill="#1F3D2B" stroke="none"/><text x="38" y="141" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text><text x="62" y="132" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">A few steps, then stop</text><text x="62" y="153" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">and look longer than you walk</text><rect x="14" y="172" width="372" height="52" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="38" cy="198" r="13" fill="#1F3D2B" stroke="none"/><text x="38" y="203" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text><text x="62" y="194" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Look for parts</text><text x="62" y="215" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">an ear, a leg, a flick</text><rect x="14" y="234" width="372" height="52" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="38" cy="260" r="13" fill="#1F3D2B" stroke="none"/><text x="38" y="265" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text><text x="62" y="256" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Rifle ready</text><text x="62" y="277" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">shots are short in timber</text><text x="200" y="310" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">All Tips (hunter experience)</text>
</svg>
