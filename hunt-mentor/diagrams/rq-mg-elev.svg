<text x="299.5454545454545" y="278" font-family="sans-serif" font-size="12" fill="#6b4f35" text-anchor="middle">1500 m</text>
<line x1="363" y1="44" x2="363" y2="262" stroke="#e2dccb"/>
<text x="362.72727272727275" y="278" font-family="sans-serif" font-size="12" fill="#6b4f35" text-anchor="middle">2000 m</text>
<text x="10" y="76" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Mule deer</text>
<rect x="161" y="58" width="177" height="16" rx="4" fill="#e8590c"/>
