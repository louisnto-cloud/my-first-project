<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 304" role="img" aria-label="Range bars of elevation in October, orange, and December, blue. Mule deer about 400 to 1,800 metres in October, 300 to 1,100 in December. Moose 800 to 1,900, then 400 to 1,600. Elk 600 to 2,000, then sea level to 1,200 across BC. White tails 300 to 1,000, then 300 to 900. General pattern, 55 to 70 percent.">
<rect x="0" y="0" width="400" height="304" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Elevation band: October vs December</text>
