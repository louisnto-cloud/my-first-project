<text x="173.1818181818182" y="278" font-family="sans-serif" font-size="12" fill="#6b4f35" text-anchor="middle">500 m</text>
<line x1="236" y1="44" x2="236" y2="262" stroke="#e2dccb"/>
<text x="236.36363636363637" y="278" font-family="sans-serif" font-size="12" fill="#6b4f35" text-anchor="middle">1000 m</text>
