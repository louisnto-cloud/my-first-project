<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Set a time, not later or when you are done.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="30" cy="32" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="30" y="39" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">2</text>
<text x="56" y="39" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="start">A clock time</text>
<circle cx="200" cy="140" r="70" fill="#fffaf0" stroke="#2f3a2b" stroke-width="6"/><line x1="200" y1="140" x2="200" y2="86" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="200" y1="140" x2="236" y2="140" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><text x="200" y="236" font-family="sans-serif" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="middle">12:00, not &quot;later&quot;</text>
<rect x="10" y="262" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="285.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">A time you both repeat out loud.</text>
</svg>
