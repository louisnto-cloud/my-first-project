<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Light passing through many glass surfaces. Without coatings, each surface reflects about 4 to 5 percent and almost half the light can be lost. With fully multi coated optics most of the light gets through.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Coatings save light</text><text x="110" y="70" font-size="16" font-weight="bold" fill="#b3261e" text-anchor="middle">Uncoated</text><text x="290" y="70" font-size="16" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Fully multi coated</text><rect x="50" y="90" width="8" height="100" rx="0" fill="#cfe0ee" stroke="#2f3a2b" stroke-width="1"/><rect x="232" y="90" width="8" height="100" rx="0" fill="#cfe0ee" stroke="#2f3a2b" stroke-width="1"/><rect x="68" y="90" width="8" height="100" rx="0" fill="#cfe0ee" stroke="#2f3a2b" stroke-width="1"/><rect x="250" y="90" width="8" height="100" rx="0" fill="#cfe0ee" stroke="#2f3a2b" stroke-width="1"/><rect x="86" y="90" width="8" height="100" rx="0" fill="#cfe0ee" stroke="#2f3a2b" stroke-width="1"/><rect x="268" y="90" width="8" height="100" rx="0" fill="#cfe0ee" stroke="#2f3a2b" stroke-width="1"/><rect x="104" y="90" width="8" height="100" rx="0" fill="#cfe0ee" stroke="#2f3a2b" stroke-width="1"/><rect x="286" y="90" width="8" height="100" rx="0" fill="#cfe0ee" stroke="#2f3a2b" stroke-width="1"/><rect x="122" y="90" width="8" height="100" rx="0" fill="#cfe0ee" stroke="#2f3a2b" stroke-width="1"/><rect x="304" y="90" width="8" height="100" rx="0" fill="#cfe0ee" stroke="#2f3a2b" stroke-width="1"/><rect x="140" y="90" width="8" height="100" rx="0" fill="#cfe0ee" stroke="#2f3a2b" stroke-width="1"/><rect x="322" y="90" width="8" height="100" rx="0" fill="#cfe0ee" stroke="#2f3a2b" stroke-width="1"/><path d="M30 140 L170 140" fill="none" stroke="#f2c94c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M170 140 L190 140" fill="none" stroke="#f2c94c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M212 140 L372 140" fill="none" stroke="#f2c94c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="220" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle">almost half lost</text><text x="290" y="220" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">most gets through</text><text x="200.0" y="272" font-size="14" fill="#2f3a2b" text-anchor="middle">Each bare glass surface reflects 4 to 5%</text>
</svg>
