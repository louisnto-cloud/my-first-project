<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A legal Category 1 campfire in BC: the pile is no more than 0.5 metres high and 0.5 metres wide, on cleared ground, with 8 litres of water or a hand tool such as a shovel on hand the whole time. Check bans first.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A legal campfire: Category 1</text><rect x="0" y="210" width="400" height="90" rx="0" fill="#dfe6d3"/><rect x="130" y="200" width="140" height="12" rx="3" fill="#b9b2a0" stroke="#2f3a2b" stroke-width="1"/><line x1="169" y1="196" x2="226" y2="186" stroke="#8b5a2b" stroke-width="10.799999999999999" stroke-linecap="round"/><line x1="174" y1="186" x2="231" y2="196" stroke="#8b5a2b" stroke-width="10.799999999999999" stroke-linecap="round"/><path d="M184 186 Q178 159 200 136 Q222 159 216 186 Z" fill="#e8590c"/><path d="M192 186 Q189 172 200 157 Q211 172 208 186 Z" fill="#f6c344"/><line x1="130" y1="120" x2="130" y2="196" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="270" y1="120" x2="270" y2="196" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="150" y1="112" x2="138" y2="112" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><polygon points="130,112 138,117 138,107" fill="#2f3a2b"/><line x1="250" y1="112" x2="262" y2="112" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><polygon points="270,112 262,107 262,117" fill="#2f3a2b"/><text x="200" y="118" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">0.5 m</text><text x="200" y="92" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">0.5 m high, 0.5 m wide max</text><rect x="310" y="160" width="40" height="50" rx="6" fill="#4a7fb0"/><text x="330" y="240" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">8 L water</text><path d="M40 160 L60 210" fill="none" stroke="#9a9a8f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="46" y="150" width="30" height="14" rx="2" fill="#9a9a8f"/><text x="60" y="240" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">or a tool</text><text x="200" y="285" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cleared ground all round. Check bans first</text>
</svg>
