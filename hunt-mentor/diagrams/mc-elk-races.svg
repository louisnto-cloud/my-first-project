<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two races of elk in BC, split by the Coast Mountains. Roosevelt elk on the coast: slightly bigger and darker, antler tips may end in a crown of 3 or 4 points; Vancouver Island, Sunshine Coast and Lower Mainland valleys. Rocky Mountain elk in the interior: more migratory; Kootenay, Peace and northern Rockies, with small herds in the Thompson and Okanagan. Source BC elk account 2000.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Two races of elk in BC</text><rect x="10" y="40" width="380" height="70" rx="8" fill="#dfe6d3"/><path d="M150 40 L170 75 L150 110" fill="none" stroke="#6b4f35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="68" font-size="15" fill="#4a7fb0" text-anchor="middle" font-weight="bold">Coast</text><text x="80" y="90" font-size="14" fill="#23261f" text-anchor="middle">Roosevelt</text><text x="270" y="68" font-size="15" fill="#8b5a2b" text-anchor="middle" font-weight="bold">Interior</text><text x="270" y="90" font-size="14" fill="#23261f" text-anchor="middle">Rocky Mountain</text><text x="160" y="128" font-size="14" fill="#6b4f35" text-anchor="middle">Coast Mountains</text><rect x="10" y="140" width="185" height="132" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><rect x="10" y="140" width="185" height="26" rx="8" fill="#4a7fb0"/><rect x="10" y="154" width="185" height="12" rx="0" fill="#4a7fb0"/><text x="102.5" y="158" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Roosevelt</text><text x="102.5" y="184" font-size="14" fill="#23261f" text-anchor="middle">Slightly bigger, darker</text><text x="102.5" y="202" font-size="14" fill="#23261f" text-anchor="middle">Tips may end in a</text><text x="102.5" y="220" font-size="14" fill="#23261f" text-anchor="middle">crown of 3 or 4</text><text x="102.5" y="238" font-size="14" fill="#23261f" text-anchor="middle">Island, Sunshine Coast,</text><text x="102.5" y="256" font-size="14" fill="#23261f" text-anchor="middle">Lower Mainland valleys</text><rect x="205" y="140" width="185" height="132" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><rect x="205" y="140" width="185" height="26" rx="8" fill="#8b5a2b"/><rect x="205" y="154" width="185" height="12" rx="0" fill="#8b5a2b"/><text x="297.5" y="158" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Rocky Mountain</text><text x="297.5" y="184" font-size="14" fill="#23261f" text-anchor="middle">More migratory</text><text x="297.5" y="202" font-size="14" fill="#23261f" text-anchor="middle">Kootenay, Peace,</text><text x="297.5" y="220" font-size="14" fill="#23261f" text-anchor="middle">northern Rockies</text><text x="297.5" y="238" font-size="14" fill="#23261f" text-anchor="middle">Small herds in the</text><text x="297.5" y="256" font-size="14" fill="#23261f" text-anchor="middle">Thompson, Okanagan</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">BC elk account 2000 (90%)</text>
</svg>
