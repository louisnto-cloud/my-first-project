<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="sans-serif" role="img" aria-label="Two races of elk in BC, split by the Coast Mountains. Coast: Roosevelt elk, slightly bigger and darker; antler tips may end in a crown of 3 or 4 points; Vancouver Island, the Sunshine Coast and Lower Mainland valleys. Interior: Rocky Mountain elk, more migratory; Kootenay, Peace and northern Rockies, with small herds in the Thompson and Okanagan. Source: BC elk account 2000, 90 percent.">
