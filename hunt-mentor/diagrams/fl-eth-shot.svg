<circle cx="36.0" cy="182.0" r="12" fill="#2f3a2b" stroke="#fffaf0" stroke-width="1.5"/><text x="36" y="187" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">3</text>
<text x="56" y="188" font-size="16" font-weight="bold" fill="#2f3a2b">Safe backstop?</text>
