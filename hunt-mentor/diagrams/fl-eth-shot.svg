<text x="286" y="59" font-size="14" font-weight="bold" fill="#c92a2a" text-anchor="middle">No</text>
<rect x="314" y="50" width="74" height="32" rx="16" fill="#fbe3df" stroke="#c92a2a" stroke-width="2"/>
<text x="351" y="72" font-size="16" font-weight="bold" fill="#c92a2a" text-anchor="middle">Pass</text>
<line x1="139.0" y1="86" x2="139.0" y2="98" stroke="#2f3a2b" stroke-width="2.5"/><polygon points="133.0,96 145.0,96 139.0,104" fill="#2f3a2b"/>
<text x="149" y="100" font-size="14" font-weight="bold" fill="#2f6e3b">Yes</text>
<rect x="14" y="104" width="250" height="40" rx="8" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2"/>
<circle cx="36.0" cy="124.0" r="12" fill="#2f3a2b" stroke="#fffaf0" stroke-width="1.5"/><text x="36" y="129" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text>
<text x="56" y="130" font-size="16" font-weight="bold" fill="#2f3a2b">Sure what it is?</text>
