<text x="286" y="349" font-size="14" font-weight="bold" fill="#c92a2a" text-anchor="middle">No</text>
<rect x="314" y="340" width="74" height="32" rx="16" fill="#fbe3df" stroke="#c92a2a" stroke-width="2"/>
<text x="351" y="362" font-size="16" font-weight="bold" fill="#c92a2a" text-anchor="middle">Pass</text>
<line x1="139.0" y1="376" x2="139.0" y2="388" stroke="#2f3a2b" stroke-width="2.5"/><polygon points="133.0,386 145.0,386 139.0,394" fill="#2f3a2b"/>
<text x="149" y="390" font-size="14" font-weight="bold" fill="#2f6e3b">Yes</text>
<rect x="14" y="394" width="250" height="42" rx="8" fill="#2f3a2b"/><text x="139" y="422" font-size="18" font-weight="bold" fill="#fffaf0" text-anchor="middle">Shoot</text>
<text x="351" y="412" font-size="15" font-weight="bold" fill="#c92a2a" text-anchor="middle">Any no:</text>
<text x="351" y="431" font-size="15" font-weight="bold" fill="#c92a2a" text-anchor="middle">pass</text>
</svg>
