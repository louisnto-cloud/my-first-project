<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 448" font-family="sans-serif" role="img" aria-label="Shoot or pass: six questions, each a yes before you shoot. Legal here and now? Sure of species, sex and antlers? Safe backstop? Clear shot at the vitals? Inside your tested range? Steady and calm? Any no means pass.">
<rect width="400" height="448" fill="#fffaf0"/>
<text x="200" y="28" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Shoot or pass? Six yes answers</text>
<rect x="14" y="46" width="250" height="40" rx="8" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2"/>
<circle cx="36.0" cy="66.0" r="12" fill="#2f3a2b" stroke="#fffaf0" stroke-width="1.5"/><text x="36" y="71" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">1</text>
<text x="56" y="72" font-size="16" font-weight="bold" fill="#2f3a2b">Legal here and now?</text>
