<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 3: a track stick laid from the last print, with a rubber band at stride length. Sweep it in an arc to find where the next print should be.">
