<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A made up example of a finished hunting map. A road crosses the lower part with a tan pressure band. A red private block sits at upper right. A green south facing burn at upper left. A dashed trail runs from the burn down toward the road. Two orange sign pins on the trail. A glassing point across from the burn, noted for a morning north wind. A parking spot on the road.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Example finished map (made up area)</text>
<rect x="10" y="40" width="380" height="250" fill="#dfe6d3" stroke="#8a9a6b"/>
<path d="M10 250 Q 120 240 200 200 T 390 150" stroke="#23261f" stroke-width="5" fill="none"/>
<path d="M10 250 Q 120 240 200 200 T 390 150" stroke="#c08a3e" stroke-width="60" fill="none" opacity=".35"/>
<rect x="300" y="40" width="90" height="70" fill="#c0392b" opacity=".45"/><text x="345" y="80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">private</text>
<path d="M30 70 L150 60 L170 130 L60 150 Z" fill="#8a9a6b"/><text x="100" y="108" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">S facing burn</text>
<path d="M150 60 Q 200 120 230 160" stroke="#8b5a2b" stroke-width="3" stroke-dasharray="6 4" fill="none"/>
<g transform="translate(250 90)"><g transform="translate(0 0) scale(0.8)"><rect x="-14" y="-8" width="11" height="18" rx="3" fill="#2f3a2b"/><rect x="3" y="-8" width="11" height="18" rx="3" fill="#2f3a2b"/><rect x="-4" y="-4" width="8" height="6" fill="#2f3a2b"/><circle cx="-8.5" cy="10" r="4" fill="#4a7fb0"/><circle cx="8.5" cy="10" r="4" fill="#4a7fb0"/></g></g><text x="250" y="122" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2f3a2b" text-anchor="middle">glass, AM: N wind</text>
<g><path d="M185 120 l-7 -12 a8 8 0 1 1 14 0 Z" fill="#e8590c"/><circle cx="185" cy="105" r="3" fill="#fff"/></g><g><path d="M205 150 l-7 -12 a8 8 0 1 1 14 0 Z" fill="#e8590c"/><circle cx="205" cy="135" r="3" fill="#fff"/></g>
<g transform="translate(220 210) scale(0.8)"><rect x="-22" y="-14" width="28" height="14" fill="#2f3a2b"/><path d="M6 -14 h10 l8 8 v6 h-18 Z" fill="#2f3a2b"/><circle cx="-12" cy="2" r="5" fill="#23261f"/><circle cx="14" cy="2" r="5" fill="#23261f"/></g><text x="222" y="236" font-family="sans-serif" font-size="12" font-weight="bold" fill="#23261f" text-anchor="middle">park</text>
<text x="30" y="280" font-family="sans-serif" font-size="13" fill="#6b4f35" text-anchor="start">Roads: pressure band. Red: no go. Green: habitat.</text>
</svg>
