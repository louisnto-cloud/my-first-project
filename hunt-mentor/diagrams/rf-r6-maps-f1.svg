<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 766" role="img" aria-label="Cards for Maps F1 to F12. F1 Tweedsmuir Park: No Hunting Areas in 6-1 and 6-2, and bull moose in the 6-2 part of the park 20 October to 15 November. F2: general open season area for mountain goat, parts of 6-9. F3 Babine River: no shooting 1 kilometre either side, all year. F4 Blunt Mountain: bow only billy goats 15 August to 19 October. F5 Tatlow Road: no shooting 0.4 kilometres either side. F6 Netalzul Mountain: no motor vehicles above 1,500 metres 1 October to 30 April. F7 Grantham Road, F8 Kathlyn Lake, F9 Hudson Bay Mountain and Smithers Community Forest, F11 Equity Mines property and F12 Houston Community Forest: No Shooting Areas. F10 Telkwa Mountains: motor vehicles prohibited all year except Grizzly Plateau and the Meat Cache in their winter windows." font-family="sans-serif">
