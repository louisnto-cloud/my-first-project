<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" font-family="sans-serif" role="img" aria-label="Cleaning kit for all three guns: a smooth, straight one piece rod; a bore guide that keeps the rod centred; brushes for .22, .30 calibre and 12 gauge; patches or felt pellets; bore solvent, for the bore only; a CLP gun oil that cleans, lubricates and protects; light grease for the lugs and cam; and a torque driver for the action and ring screws.">
<rect width="400" height="350" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A cleaning kit that covers all three guns</text>
