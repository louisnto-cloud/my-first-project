<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Cleaning kit: a smooth one piece rod, a bore guide to keep it centred, brushes for .22, .30 calibre and 12 gauge, patches or felt pellets, bore solvent for the bore only, a CLP gun oil that cleans lubricates and protects, light grease for the lugs and cam, and a torque driver for action and ring screws.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A cleaning kit that covers all three guns</text><rect x="14" y="44" width="180" height="52" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="104" y="66" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">One piece rod</text><text x="104" y="86" font-size="13" fill="#23261f" text-anchor="middle">smooth, straight</text><rect x="202" y="44" width="180" height="52" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="292" y="66" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bore guide</text><text x="292" y="86" font-size="13" fill="#23261f" text-anchor="middle">keeps the rod centred</text><rect x="14" y="104" width="180" height="52" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="104" y="126" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Brushes</text><text x="104" y="146" font-size="13" fill="#23261f" text-anchor="middle">.22, .30, 12 ga</text><rect x="202" y="104" width="180" height="52" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="292" y="126" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Patches</text><text x="292" y="146" font-size="13" fill="#23261f" text-anchor="middle">or felt pellets</text><rect x="14" y="164" width="180" height="52" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="104" y="186" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bore solvent</text><text x="104" y="206" font-size="13" fill="#23261f" text-anchor="middle">for the bore only</text><rect x="202" y="164" width="180" height="52" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="292" y="186" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">CLP gun oil</text><text x="292" y="206" font-size="13" fill="#23261f" text-anchor="middle">clean, lube, protect</text><rect x="14" y="224" width="180" height="52" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="104" y="246" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Light grease</text><text x="104" y="266" font-size="13" fill="#23261f" text-anchor="middle">lugs and cam</text><rect x="202" y="224" width="180" height="52" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="292" y="246" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Torque driver</text><text x="292" y="266" font-size="13" fill="#23261f" text-anchor="middle">action and ring screws</text>
</svg>
