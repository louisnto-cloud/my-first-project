<rect x="204" y="270" width="188" height="70" rx="9" fill="#f4eedf" stroke="#8a9a6b" stroke-width="1.2"/>
<rect x="209" y="275" width="56" height="60" rx="7" fill="#fffaf0"/>
<g transform="translate(237 305.0) rotate(-30)"><rect x="-26" y="-7" width="26" height="14" rx="6" fill="#2f3a2b"/><rect x="-6" y="-5" width="8" height="10" rx="2" fill="#c0392b"/><rect x="2" y="-2" width="20" height="4" fill="#9aa3a8"/><path d="M-22 -4 V4 M-17 -4 V4 M-12 -4 V4" stroke="#5d666b" stroke-width="1"/></g>
<text x="272" y="295" font-size="16" font-weight="bold" fill="#2f3a2b">Torque driver</text>
