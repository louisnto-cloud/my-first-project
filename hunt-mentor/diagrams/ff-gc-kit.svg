<text x="272" y="219" font-size="16" font-weight="bold" fill="#2f3a2b">CLP gun oil</text>
<text x="272" y="239" font-size="14.5" fill="#2f3a2b">clean, lube,</text>
<text x="272" y="256" font-size="14.5" fill="#2f3a2b">protect</text>
