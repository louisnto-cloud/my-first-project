<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Red sky at night and at morning, simplified. Weather usually moves west to east. Evening: the sun sets in the west through clear dry air under high pressure, the red glow means the dry air is coming your way. Morning: red in the east means the clear air has passed east and cloud from the west may follow. A rough sign only.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="24" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Weather mostly moves west to east</text>
  <path d="M60 46 L340 46" stroke="#4a7fb0" stroke-width="3"/><path d="M334 40 L346 46 L334 52" fill="#4a7fb0"/>
  <text x="40" y="51" font-family="sans-serif" font-size="14" fill="#23261f">W</text><text x="352" y="51" font-family="sans-serif" font-size="14" fill="#23261f">E</text>
  <rect x="10" y="66" width="185" height="150" rx="8" fill="#f6c8a8"/>
  <circle cx="40" cy="190" r="22" fill="#e8590c"/>
  <rect x="10" y="190" width="185" height="26" fill="#8a9a6b"/>
  <circle cx="175" cy="96" r="12" fill="#ffffff"/><circle cx="160" cy="100" r="10" fill="#ffffff"/>
  <rect x="205" y="66" width="185" height="150" rx="8" fill="#f6c8a8"/>
  <circle cx="360" cy="190" r="22" fill="#e8590c"/>
  <rect x="205" y="190" width="185" height="26" fill="#8a9a6b"/>
  <g fill="#9aa3a8"><circle cx="232" cy="96" r="18"/><circle cx="256" cy="90" r="20"/><circle cx="280" cy="98" r="16"/></g>
  <g font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="middle">
    <text x="102" y="240" font-weight="bold">Red at night</text>
    <text x="102" y="260">Dry air coming</text>
    <text x="102" y="280">from the west</text>
    <text x="298" y="240" font-weight="bold" fill="#e8590c">Red at morning</text>
    <text x="298" y="260">Clear air gone east,</text>
    <text x="298" y="280">cloud may follow</text>
  </g>
</svg>
