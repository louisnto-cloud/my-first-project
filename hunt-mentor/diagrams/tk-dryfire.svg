"200" font-size="14" fill="#17201A" text-anchor="start">Use for dry fire.</text><text x="218" y="160" font-size="14" fill="#17201A" text-anchor="start">Empty primer pocket.</text><text x="218" y="180" font-size="14" fill="#17201A" text-anchor="start">Loading drills only.</text><text x="218" y="200" font-size="14" fill="#17201A" text-anchor="start">No pin protection.</text><circle cx="30" cy="58" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="63" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><circle cx="222" cy="58" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="222" y="63" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><rect x="10" y="244" width="380" height="28" rx="6" fill="#1F3D2B"/><text x="200" y="263.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">No live rounds in the room. Proved unloaded.</text><rect x="12" y="282" width="376" height="34" rx="6" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="200" y="304" font-size="14" fill="#17201A" text-anchor="middle">Long dry fire, no snap cap: bolt damage.</text>
</svg>
