<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 328" font-family="sans-serif" role="img" aria-label="Dry fire practice. 1, in orange: a snap cap has a spring loaded primer that cushions the firing pin; use it for dry fire. 2: a dummy round has an empty primer pocket; use it only for loading drills, it does not protect the firing pin. No live rounds in the room; rifle proved unloaded. The Tikka manual says long dry firing may damage the bolt.">
<rect x="0" y="0" width="400" height="328" fill="#EEF1EA"/>
