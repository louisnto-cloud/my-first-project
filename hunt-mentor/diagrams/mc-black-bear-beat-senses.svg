<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="How to beat each bear sense, as tips. Nose: keep the wind in your face, crosswind at worst, never let the bear get downwind. Ears: move slowly, step while it feeds noisily; wind and creek noise help. Eyes: move only when its head is down, freeze when it looks, stay low.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">How to beat each sense</text><rect x="10" y="50" width="380" height="68" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="20" y="76" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">Nose</text><text x="90" y="76" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Wind in your face. Crosswind at worst.</text><text x="90" y="100" font-size="14" fill="#23261f" text-anchor="start">Never let it get downwind.</text><rect x="10" y="126" width="380" height="68" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="20" y="152" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="start">Ears</text><text x="90" y="152" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Slow steps. Move when it feeds noisily.</text><text x="90" y="176" font-size="14" fill="#23261f" text-anchor="start">Wind and creek noise help.</text><rect x="10" y="202" width="380" height="68" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="20" y="228" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="start">Eyes</text><text x="90" y="228" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Move only when its head is down.</text><text x="90" y="252" font-size="14" fill="#23261f" text-anchor="start">Freeze when it looks. Stay low.</text><text x="200" y="294" font-size="14" fill="#2f3a2b" text-anchor="middle">Tips, from hunting educators</text>
</svg>
