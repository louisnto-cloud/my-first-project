<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="sans-serif" role="img" aria-label="Line chart of day length at Heffley Creek, fall 2026. 11.7 hours on 1 October, 10.8 hours on 15 October, 9.8 hours on 31 October, 8.3 hours on 30 November, 7.9 hours on 21 December. Mid October loses about 3.8 minutes of daylight a day. Your hunts in mid to late October are shaded. My calculation with the NOAA solar method, 85 percent.">
