<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Five step timeline of a hunter&#x27;s day, labelled as a tip. 1 before light: walk in quietly and sit. 2 first two hours: stand on the trail. 3 midday: scout or still hunt slowly. 4 two hours before dark: stand near food. 5 after dark: leave without bumping deer. A side box says on rut days stay out all day because bucks also move midday." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">A white tail hunter&#x27;s day (Tip)</text><circle cx="34" cy="60" r="12" fill="#2f3a2b"/><text x="34" y="65" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="58" y="56" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Before light</text><text x="58" y="74" font-size="14" fill="#23261f" text-anchor="start">Walk in quiet, sit</text><line x1="34" y1="72" x2="34" y2="98" stroke="#c9b79c" stroke-width="3"/><circle cx="34" cy="110" r="12" fill="#e8590c"/><text x="34" y="115" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="58" y="106" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">First 2 h</text><text x="58" y="124" font-size="14" fill="#23261f" text-anchor="start">Stand on the trail</text><line x1="34" y1="122" x2="34" y2="148" stroke="#c9b79c" stroke-width="3"/><circle cx="34" cy="160" r="12" fill="#8a9a6b"/><text x="34" y="165" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="58" y="156" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Midday</text><text x="58" y="174" font-size="14" fill="#23261f" text-anchor="start">Scout, still hunt slow</text><line x1="34" y1="172" x2="34" y2="198" stroke="#c9b79c" stroke-width="3"/><circle cx="34" cy="210" r="12" fill="#e8590c"/><text x="34" y="215" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="58" y="206" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">2 h before dark</text><text x="58" y="224" font-size="14" fill="#23261f" text-anchor="start">Stand near food</text><line x1="34" y1="222" x2="34" y2="248" stroke="#c9b79c" stroke-width="3"/><circle cx="34" cy="260" r="12" fill="#2f3a2b"/><text x="34" y="265" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><text x="58" y="256" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">After dark</text><text x="58" y="274" font-size="14" fill="#23261f" text-anchor="start">Leave without bumping</text><rect x="250" y="60" width="140" height="150" rx="10" fill="#fbe3d4" stroke="#e8590c" stroke-width="2"/><text x="320" y="88" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Rut days:</text><text x="320" y="112" font-size="14" fill="#23261f" text-anchor="middle">stay out</text><text x="320" y="130" font-size="14" fill="#23261f" text-anchor="middle">all day, bucks</text><text x="320" y="148" font-size="14" fill="#23261f" text-anchor="middle">move midday</text><text x="320" y="166" font-size="14" fill="#23261f" text-anchor="middle">too</text><text x="200" y="294" font-size="14" fill="#6b4f35" text-anchor="middle">Orange: best odds. Plan the wind for each sit.</text>
</svg>
