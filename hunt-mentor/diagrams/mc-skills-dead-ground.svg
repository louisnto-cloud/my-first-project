<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A side view of rolling ground. A deer stands on a high knoll on the right. Its sight lines, dashed orange, pass over a hollow in front of the hunter. The hunter moves through the hollow, the dead ground the deer cannot see into. Fast where it cannot see you, slow where it can.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Use dead ground</text><rect x="0" y="40" width="400" height="260" fill="#eef2f7"/><path d="M0 240 L60 200 L130 250 L200 170 L260 210 L330 120 L400 140 L400 300 L0 300 Z" fill="#dfe6d3" stroke="#23261f" stroke-width="2"/><g transform="translate(350 128) scale(0.450 0.450)"><rect x="-36" y="-40" width="6" height="40" rx="3" fill="#8b5a2b"/><rect x="10" y="-40" width="6" height="40" rx="3" fill="#8b5a2b"/><ellipse cx="-12" cy="-52" rx="34" ry="16" fill="#8b5a2b"/><rect x="-30" y="-44" width="6" height="44" rx="3" fill="#8b5a2b"/><rect x="16" y="-44" width="6" height="44" rx="3" fill="#8b5a2b"/><path d="M12 -60 L26 -84 L36 -80 L26 -52 Z" fill="#8b5a2b"/><ellipse cx="38" cy="-84" rx="13" ry="7" fill="#8b5a2b"/><path d="M28 -88 L18 -102 L32 -92 Z" fill="#8b5a2b"/><path d="M31 -89 L27 -104 L38 -92 Z" fill="#8b5a2b"/><circle cx="49" cy="-84" r="2" fill="#23261f"/><ellipse cx="-44" cy="-54" rx="5" ry="9" fill="#f4efe2"/><path d="M-46 -54 L-50 -40" stroke="#23261f" stroke-width="3" stroke-linecap="round"/></g><line x1="336" y1="92" x2="20" y2="210" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="336" y1="92" x2="200" y2="170" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M80 214 L130 246 L190 186" fill="none" stroke="#2f3a2b" stroke-width="4" stroke-dasharray="2 6" stroke-linecap="round"/><text x="130" y="280" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">dead ground: it cannot see</text><text x="300" y="220" font-size="14" fill="#e8590c" text-anchor="middle">its sight line</text><g transform="translate(132 252) scale(0.6)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#e8590c"/><rect x="-6" y="-15" width="5" height="15" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" fill="#2f3a2b"/></g><text x="200" y="296" font-size="14" fill="#6b4f35" text-anchor="middle">Fast where it cannot see you, slow where it can (Tip)</text>
</svg>
