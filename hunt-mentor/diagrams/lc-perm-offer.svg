<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 346" font-family="sans-serif" role="img" aria-label="What to offer a landowner. Do: phone number and plate before they ask. Do: walk, not drive, and park where they say. Do: shoot only in the directions they say. Do: report anything wrong, like a cut fence, a sick cow or a stranger&#x27;s truck. Do: help, like a day on fence or firewood. Do not: offer money.">
<rect x="0" y="0" width="400" height="346" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">What to offer</text><rect x="10" y="44" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(40 78) scale(0.9)"><rect x="-10" y="-18" width="20" height="36" rx="4" fill="#2f3a2b"/><rect x="-7" y="-13" width="14" height="24" fill="#dbe7f2"/><circle cx="0" cy="14" r="1.8" fill="#fff"/></g><circle cx="179" cy="60" r="11" fill="#8a9a6b"/><path d="M173 60 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Phone and</text><text x="68" y="86" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">plate before</text><text x="68" y="104" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">they ask</text><rect x="203" y="44" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(233 78) scale(0.9)"><rect x="-22" y="-6" width="26" height="16" rx="2" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 -2 h10 l6 6 v6 h-16 z" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-12" cy="12" r="5" fill="#2f3a2b"/><circle cx="12" cy="12" r="5" fill="#2f3a2b"/></g><circle cx="372" cy="60" r="11" fill="#8a9a6b"/><path d="M366 60 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="261" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Walk, park</text><text x="261" y="86" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">where they</text><text x="261" y="104" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">say</text><rect x="10" y="144" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(40 178) scale(0.9)"><circle r="16" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -20 V-6 M0 6 V20 M-20 0 H-6 M6 0 H20" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="179" cy="160" r="11" fill="#8a9a6b"/><path d="M173 160 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="168" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Shoot only</text><text x="68" y="186" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">where they</text><text x="68" y="204" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">say</text><rect x="203" y="144" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(233 178) scale(0.9)"><path d="M-20 0 Q0 -16 20 0 Q0 16 -20 0 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle r="6" fill="#2f3a2b"/></g><circle cx="372" cy="160" r="11" fill="#8a9a6b"/><path d="M366 160 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="261" y="168" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Report a cut</text><text x="261" y="186" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">fence or a</text><text x="261" y="204" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">sick cow</text><rect x="10" y="244" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(40 278) scale(0.9)"><path d="M-10 18 V-2 M-10 -2 V-14 Q-6 -18 -3 -14 V-4 V-18 Q0 -22 3 -18 V-4 V-16 Q6 -20 9 -16 V2 L14 -6 Q19 -6 16 2 L6 18 Z" fill="#f2d6c0" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="179" cy="260" r="11" fill="#8a9a6b"/><path d="M173 260 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="268" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">A day on</text><text x="68" y="286" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">fence,</text><text x="68" y="304" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">firewood</text><rect x="203" y="244" width="185" height="92" rx="10" fill="#fdf0e6" stroke="#e8590c" stroke-width="2"/><g transform="translate(233 278) scale(0.9)"><circle r="18" fill="#fff" stroke="#e8590c" stroke-width="3"/><text x="0" y="8" font-size="24" font-weight="bold" fill="#2f3a2b" text-anchor="middle">$</text><line x1="-12" y1="12" x2="12" y2="-12" stroke="#e8590c" stroke-width="3.5"/></g><circle cx="372" cy="260" r="11" fill="#e8590c"/><path d="M367 255 l10 10 M377 255 l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="261" y="268" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Money: never</text>
</svg>
