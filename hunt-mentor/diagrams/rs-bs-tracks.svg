<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 312" font-family="sans-serif" role="img" aria-label="Bird tracks. Grouse: 3 toes forward and a short one back, about 5 centimetres. Quail: smaller. Duck: webbed, 5 to 7.6 centimetres. Goose: webbed, 7.6 to 10 centimetres. Game birds walk, one print ahead of the next.">
<rect x="0" y="0" width="400" height="312" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bird tracks</text>
<rect x="16" y="62" width="180" height="106" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><g transform="translate(66 136) rotate(0) scale(1.0)"><path d="M0 0 L0 -26 M0 0 L-14 -20 M0 0 L14 -20 M0 0 L0 8" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round" fill="none"/></g><text x="136" y="110" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Grouse</text><text x="136" y="134" font-size="13" fill="#23261f" text-anchor="middle">~5 cm (85%)</text><rect x="204" y="62" width="180" height="106" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><g transform="translate(254 136) rotate(0) scale(0.7)"><path d="M0 0 L0 -26 M0 0 L-14 -20 M0 0 L14 -20 M0 0 L0 8" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round" fill="none"/></g><text x="324" y="110" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Quail</text><text x="324" y="134" font-size="13" fill="#23261f" text-anchor="middle">smaller (Tip)</text><rect x="16" y="178" width="180" height="106" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><g transform="translate(66 252) rotate(0) scale(1.1)"><path d="M0 4 L-16 -20 Q0 -14 0 -26 Q0 -14 16 -20 Z" fill="#8b5a2b"/></g><text x="136" y="226" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Duck</text><text x="136" y="250" font-size="13" fill="#23261f" text-anchor="middle">5 to 7.6 cm (85%)</text><rect x="204" y="178" width="180" height="106" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><g transform="translate(254 252) rotate(0) scale(1.5)"><path d="M0 4 L-16 -20 Q0 -14 0 -26 Q0 -14 16 -20 Z" fill="#8b5a2b"/></g><text x="324" y="226" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Goose</text><text x="324" y="250" font-size="13" fill="#23261f" text-anchor="middle">7.6 to 10 cm (85%)</text><text x="200" y="302" font-size="14" fill="#6b4f35" text-anchor="middle">Game birds walk: one print ahead of the next</text>
</svg>
