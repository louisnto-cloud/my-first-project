<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="sans-serif" role="img" aria-label="Grid of who needs what in BC. Status Indians living in BC, hunting on their traditional territory: no BC hunting licence or species licence, and provincial open seasons, gear rules and bag limits do not apply to food, social and ceremonial harvest, but a federal firearms licence is needed. Métis hunters: BC hunting licence and all regulations. You: licences and all regulations. Everyone follows conservation, public health and public safety rules. Synopsis page 6, 99 percent. BC Parks, 95 percent.">
<rect width="400" height="400" fill="#fffaf0"/>
<text x="200" y="27" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Who needs what in BC</text>
<rect x="164" y="40" width="100" height="44" rx="6" fill="#2f3a2b"/><rect x="270" y="40" width="122" height="44" rx="6" fill="#2f3a2b"/>
<text x="214" y="58" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">BC hunting</text>
<text x="214" y="76" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">licence</text>
<text x="321" y="58" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">Provincial</text>
<text x="321" y="76" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">seasons, limits</text>
<rect x="8" y="90" width="384" height="96" rx="6" fill="#f4eedf"/><rect x="8" y="90" width="6" height="96" rx="3" fill="#e8590c"/>
<g transform="translate(34 138.0)"><circle cy="-7" r="6" fill="#e8590c"/><path d="M-10 12 C-10 0 10 0 10 12z" fill="#e8590c"/></g>
<text x="52" y="135" font-size="16" font-weight="bold" fill="#2f3a2b">Status Indian</text>
<text x="52" y="153" font-size="16" font-weight="bold" fill="#2f3a2b">living in BC</text>
<text x="214" y="144" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">Not needed</text>
<text x="322" y="115.5" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">Not on own</text>
<text x="322" y="134.5" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">territory (food,</text>
<text x="322" y="153.5" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">social,</text>
<text x="322" y="172.5" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">ceremonial)</text>
<rect x="8" y="192" width="384" height="52" rx="6" fill="#f4eedf"/><rect x="8" y="192" width="6" height="52" rx="3" fill="#8b5a2b"/>
<g transform="translate(34 218.0)"><circle cy="-7" r="6" fill="#8b5a2b"/><path d="M-10 12 C-10 0 10 0 10 12z" fill="#8b5a2b"/></g>
<text x="52" y="224" font-size="16" font-weight="bold" fill="#2f3a2b">Métis hunter</text>
<text x="214" y="224" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Yes</text>
<text x="322" y="224" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Yes, all rules</text>
<rect x="8" y="250" width="384" height="52" rx="6" fill="#f4eedf"/><rect x="8" y="250" width="6" height="52" rx="3" fill="#4a7fb0"/>
<g transform="translate(34 276.0)"><circle cy="-7" r="6" fill="#4a7fb0"/><path d="M-10 12 C-10 0 10 0 10 12z" fill="#4a7fb0"/></g>
<text x="52" y="282" font-size="16" font-weight="bold" fill="#2f3a2b">You</text>
<text x="214" y="282" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Yes</text>
<text x="322" y="282" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Yes, all rules</text>
<rect x="8" y="308" width="384" height="58" rx="8" fill="#fde8d8"/>
<text x="200" y="331" font-size="15" fill="#2f3a2b" text-anchor="middle">Status Indians: federal firearms licence needed.</text>
<text x="200" y="353" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Everyone: conservation, health and safety rules.</text>
<text x="200" y="388" font-size="14" fill="#6b5b4b" text-anchor="middle">Synopsis page 6, 99%. BC Parks, 95%.</text>
</svg>
