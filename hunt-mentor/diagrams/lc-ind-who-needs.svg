<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 394" font-family="sans-serif" role="img" aria-label="Grid of who needs what in BC. Status Indians living in BC, hunting on their traditional territory: no BC hunting licence or species licence, and provincial open seasons, gear rules and bag limits do not apply to food, social and ceremonial harvest, but a federal firearms licence is needed. Métis hunters: BC hunting licence and all regulations. You: licences and all regulations. Everyone follows conservation, public health and public safety rules. Synopsis page 6.">
<rect x="0" y="0" width="400" height="394" fill="#fffaf0"/>
