width="380" height="76" rx="0" fill="#fff" stroke="#2f3a2b" stroke-width="1.5"/><text x="16" y="266" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">You</text><text x="214.0" y="266" font-size="14" font-weight="bold" fill="#55663f" text-anchor="middle">Yes</text><text x="330.0" y="266" font-size="14" font-weight="bold" fill="#55663f" text-anchor="middle">Yes, all rules</text><text x="200" y="338" font-size="14" fill="#23261f" text-anchor="middle">Status Indians: federal firearms licence needed.</text><text x="200" y="360" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Everyone: conservation, health and safety rules.</text><text x="200" y="382" font-size="13" fill="#6b4f35" text-anchor="middle">Synopsis page 6, 99%. BC Parks, 95%.</text>
