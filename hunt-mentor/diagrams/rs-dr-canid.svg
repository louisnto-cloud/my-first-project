<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="End view of canid scat to scale. Coyote: under 2.5 cm across, holds mouse and hare hair. Dog: any size, often kibble. Wolf: over 2.5 cm across, holds deer, elk and moose hair and bone.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Canid scat: measure across</text>
<circle cx="80" cy="130" r="28.0" fill="#6b4f35"/><text x="80" y="200" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Coyote</text><text x="80" y="222" font-size="14" fill="#23261f" text-anchor="middle">under 2.5 cm</text><circle cx="200" cy="130" r="33.6" fill="#6b4f35"/><text x="200" y="200" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Dog</text><text x="200" y="222" font-size="14" fill="#23261f" text-anchor="middle">any size</text><circle cx="320" cy="130" r="44.800000000000004" fill="#6b4f35"/><text x="320" y="200" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wolf</text><text x="320" y="222" font-size="14" fill="#23261f" text-anchor="middle">over 2.5 cm</text><line x1="20" y1="250" x2="90" y2="250" stroke="#e8590c" stroke-width="3"/><text x="55" y="270" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">2.5 cm</text><text x="250" y="256" font-size="14" fill="#23261f" text-anchor="middle">Coyote: mouse and hare hair</text><text x="250" y="278" font-size="14" fill="#23261f" text-anchor="middle">Wolf: deer, elk, moose hair</text>
</svg>
