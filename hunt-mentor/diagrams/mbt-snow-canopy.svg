<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 325" font-family="sans-serif" role="img" aria-label="The same snowfall left about 50 cm of snow in a clearcut and about 5 cm under a conifer stand with 70% crown closure. A black tailed deer chest is about 57 cm high. Walking cost rose about 500% in the clearcut and 10% in the forest.">
<rect width="400" height="325" fill="#EEF1EA"/>
<text x="200" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Why winter deer hide under big trees</text>
<rect x="14" y="46" width="180" height="222" rx="10" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.5"/><rect x="206" y="46" width="180" height="222" rx="10" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.5"/><text x="104" y="70" font-size="16" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Clearcut</text><text x="296" y="70" font-size="16" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Conifer stand</text><rect x="34" y="170" width="140" height="80" rx="2" fill="#ffffff" stroke="#9aa8b8" stroke-width="1"/><text x="104" y="220" font-size="16" text-anchor="middle" font-weight="bold" fill="#17201A">about 50 cm</text><path d="M246 140 L270 84 L294 140 Z M300 140 L324 84 L348 140 Z" fill="#8a9a6b" stroke="#1F3D2B" stroke-width="1"/><rect x="226" y="242" width="140" height="8" rx="2" fill="#ffffff" stroke="#9aa8b8" stroke-width="1"/><text x="296" y="232" font-size="16" text-anchor="middle" font-weight="bold" fill="#17201A">about 5 cm</text><line x1="24" y1="159" x2="376" y2="159" stroke="#FF6A13" stroke-width="2" stroke-dasharray="6 4"/><rect x="104" y="137" width="192" height="21" rx="4" fill="#EEF1EA" stroke="none" stroke-width="0"/><text x="200" y="152" font-size="14" text-anchor="middle" font-weight="bold" fill="#FF6A13">deer chest height 57 cm</text><text x="104" y="290" font-size="14" text-anchor="middle" font-weight="bold" fill="#17201A">walking cost +500%</text><text x="296" y="290" font-size="14" text-anchor="middle" font-weight="bold" fill="#17201A">walking cost +10%</text><text x="200" y="312" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">Same snowfall, 70% crown closure</text>
</svg>
