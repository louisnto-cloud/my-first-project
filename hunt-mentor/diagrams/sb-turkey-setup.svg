<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Top view of a dawn turkey setup. A roost tree on a ridge holds a tom. You sit 100 metres away, set up before light, with your back against a tree wider than your shoulders. A hen decoy sits in front of you. The tom flies down and walks in to the decoy. Tip.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="24" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Roost and call at dawn, top view (Tip)</text>
  <rect x="0" y="36" width="400" height="264" fill="#dfe6d3"/>
  <path d="M0 90 Q200 50 400 80" stroke="#8b5a2b" stroke-width="3" fill="none" stroke-dasharray="8 6"/>
  <text x="360" y="64" font-size="13" font-weight="bold" fill="#8b5a2b" text-anchor="middle">Ridge</text>
  <g fill="#2f3a2b" transform="translate(80 96) scale(1.6)"><polygon points="-12,0 0,-34 12,0"/><rect x="-3" y="0" width="6" height="8"/></g>
  <ellipse cx="82" cy="70" rx="8" ry="5" fill="#4a3b2c"/>
  <text x="80" y="122" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Roost tree</text>
  <circle cx="300" cy="230" r="22" fill="#2f3a2b"/>
  <g transform="translate(300 262) scale(1.0)"><circle r="9" fill="#e8590c"/></g>
  <text x="300" y="290" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">You, back to a wide tree</text>
  <g transform="translate(220 200) scale(0.4)"><path d="M-24 -6 L-48 -2 L-24 6Z" fill="#8a6e4f"/><ellipse cx="0" cy="0" rx="28" ry="20" fill="#8a6e4f"/><path d="M18 -8 Q26 -30 30 -40" stroke="#8fa3b8" stroke-width="7" fill="none"/><circle cx="31" cy="-42" r="7" fill="#8fa3b8"/><path d="M37 -43 L44 -41 L37 -39Z" fill="#2f3a2b"/><path d="M-4 18 L-6 34 M8 18 L10 34" stroke="#b07a5a" stroke-width="3"/></g>
  <text x="214" y="236" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hen decoy</text>
  <path d="M80 130 Q120 200 196 196" stroke="#e8590c" stroke-width="3" fill="none" stroke-dasharray="6 5"/>
  <text x="130" y="220" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="middle">Tom walks in</text>
  <path d="M100 140 L276 222 M266.0 222.1 L276 222 L269.7 214.3" stroke="#2f3a2b" stroke-width="1.5" stroke-dasharray="3 4" fill="none" stroke-linecap="round"/>
  <text x="170" y="160" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">100 m</text>
  <text x="80" y="280" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Set up before light</text>
</svg>
