<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Who gets Chronic Wasting Disease: the deer family, mule deer, white tailed deer, elk, moose and caribou, 95 percent. Sick animals look thin, drool, stumble and tremble, and signs take months to show. Report one to RAPP, Report All Poachers and Polluters, at 1 877 952 7277 or CWD@gov.bc.ca, 95 percent." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Who gets CWD? The deer family (95%)</text>
