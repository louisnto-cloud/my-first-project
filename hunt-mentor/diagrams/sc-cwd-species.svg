<text x="360" y="150" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Caribou</text>
<rect x="20" y="172" width="360" height="54" rx="8" fill="#f3ead8" stroke="#2f3a2b" stroke-width="2"/>
<text x="200.0" y="194.8" font-size="15" fill="#23261f" text-anchor="middle">Sick ones look thin, drool, stumble,</text>
