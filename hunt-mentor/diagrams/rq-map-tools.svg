<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Four map tools: the app Hunt Map with layers, pins, range rings, scent cone and offline maps; iMapBC for official BC layers and land status; the Rule Book for seasons, closures and maps C1 to C22; and the Journal for what you saw, when and in what wind.">
<rect x="0" y="0" width="400" height="320" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Your map tools</text>
<rect x="10" y="40" width="186" height="128" rx="10" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="1.5"/>
<g transform="translate(40 74) scale(0.9)"><rect x="-12" y="-20" width="24" height="40" rx="4" fill="#2f3a2b"/><rect x="-9" y="-15" width="18" height="28" fill="#dfe6d3"/><path d="M-9 5 l6 -8 l5 5 l7 -9 v20 h-18 Z" fill="#8a9a6b"/></g>
<text x="70" y="70" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Hunt Map</text>
<text x="20" y="114" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Layers, pins, rings,</text>
<text x="20" y="131" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">scent cone, offline</text>
<text x="20" y="148" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">(app).</text>
<rect x="204" y="40" width="186" height="128" rx="10" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="1.5"/>
<rect x="216" y="60" width="36" height="28" fill="#dfe6d3" stroke="#8a9a6b"/>
<text x="264" y="70" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">iMapBC</text>
<text x="214" y="114" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Official BC layers, land</text>
<text x="214" y="131" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">status (90%).</text>
<rect x="10" y="176" width="186" height="128" rx="10" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="1.5"/>
<rect x="24" y="192" width="32" height="36" fill="#fff" stroke="#2f3a2b"/><path d="M30 202 h20 M30 210 h20 M30 218 h14" stroke="#2f3a2b" stroke-width="2"/>
<text x="70" y="206" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Rule Book</text>
<text x="20" y="250" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Seasons, closures, maps</text>
<text x="20" y="267" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">C1 to C22.</text>
<rect x="204" y="176" width="186" height="128" rx="10" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="1.5"/>
<rect x="218" y="192" width="32" height="36" rx="3" fill="#6b4f35"/>
<text x="264" y="206" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Journal</text>
<text x="214" y="250" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">What you saw, when, in</text>
<text x="214" y="267" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">what wind.</text>
</svg>
