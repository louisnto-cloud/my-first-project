<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="sans-serif" role="img" aria-label="Phone sketch of the Hunt Map in 3D. Step 1: the Topo base button in the pill at the bottom right of the map is ringed. Tap it to open the Basemap sheet. Step 2: slide 3D height boost. It runs 1 to 2.5 times, default 1.5; the slider is set to 2, to make benches and saddles pop.">
