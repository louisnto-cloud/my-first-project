<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Phone sketch of the Hunt Map. The Topo base button in the pill is ringed. Tap it to open the Basemap sheet, where a slider sets the 3D height boost from 1 to 2.5 times. Default 1.5; try 2 to make benches and saddles pop.">
  <rect width="400" height="300" fill="#fffaf0"/>
