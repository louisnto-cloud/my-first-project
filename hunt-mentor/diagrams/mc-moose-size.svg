<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 295" font-family="sans-serif" role="img" aria-label="Bar chart of shoulder height. Bull moose nearly 2 metres, 450 to 500 kilograms in autumn. Cow 1.8 metres, 340 to 420 kilograms. Calf under 1.5 metres, 135 to 180 kilograms. Mule deer buck 0.9 metres, 68 to 113 kilograms.">
<rect x="0" y="0" width="400" height="295" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Shoulder height and weight</text><line x1="30" y1="250" x2="390" y2="250" stroke="#23261f" stroke-width="2"/><rect x="50" y="74" width="54" height="176" rx="4" fill="#3b2a1c"/><text x="77" y="69.5" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">about 2 m</text><text x="77" y="268" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Bull</text><text x="77" y="286" font-size="14" fill="#6b4f35" text-anchor="middle">450 to 500</text><rect x="138" y="88" width="54" height="162" rx="4" fill="#3b2a1c"/><text x="165" y="83.0" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">1.8 m</text><text x="165" y="268" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Cow</text><text x="165" y="286" font-size="14" fill="#6b4f35" text-anchor="middle">340 to 420</text><rect x="226" y="120" width="54" height="130" rx="4" fill="#7a5a3a"/><text x="253" y="114.5" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">under 1.5 m</text><text x="253" y="268" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Calf</text><text x="253" y="286" font-size="14" fill="#6b4f35" text-anchor="middle">135 to 180</text><rect x="314" y="166" width="54" height="84" rx="4" fill="#8b5a2b"/><text x="341" y="161.3" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">0.9 m</text><text x="341" y="268" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Mule deer</text><text x="341" y="286" font-size="14" fill="#6b4f35" text-anchor="middle">68 to 113</text><text x="392" y="52" font-size="14" fill="#6b4f35" text-anchor="end">weights in kg</text>
</svg>
