<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Six hand signals for two hunters: 1 flat hand up, stop and freeze; 2 point, game that way; 3 palm pushed down, get low; 4 wave toward you, come to me; 5 thumb up, all OK; 6 arms crossed over the head, done and unloaded. Agree them at the truck; one moves while the other watches.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Six hand signals (Tip)</text><rect x="14" y="44" width="182" height="68" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="44" cy="78" r="20" fill="#f6d7c3"/><text x="44" y="84" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">1</text><text x="74" y="74" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Flat hand up</text><text x="74" y="94" font-size="14" fill="#23261f" text-anchor="start">stop, freeze</text><rect x="204" y="44" width="182" height="68" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="234" cy="78" r="20" fill="#f6d7c3"/><text x="234" y="84" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">2</text><text x="264" y="74" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Point</text><text x="264" y="94" font-size="14" fill="#23261f" text-anchor="start">game, that way</text><rect x="14" y="122" width="182" height="68" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="44" cy="156" r="20" fill="#f6d7c3"/><text x="44" y="162" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">3</text><text x="74" y="152" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Palm down</text><text x="74" y="172" font-size="14" fill="#23261f" text-anchor="start">get low</text><rect x="204" y="122" width="182" height="68" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="234" cy="156" r="20" fill="#f6d7c3"/><text x="234" y="162" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">4</text><text x="264" y="152" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Wave to you</text><text x="264" y="172" font-size="14" fill="#23261f" text-anchor="start">come to me</text><rect x="14" y="200" width="182" height="68" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="44" cy="234" r="20" fill="#f6d7c3"/><text x="44" y="240" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">5</text><text x="74" y="230" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Thumb up</text><text x="74" y="250" font-size="14" fill="#23261f" text-anchor="start">all OK</text><rect x="204" y="200" width="182" height="68" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="234" cy="234" r="20" fill="#f6d7c3"/><text x="234" y="240" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">6</text><text x="264" y="230" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Arms crossed</text><text x="264" y="250" font-size="14" fill="#23261f" text-anchor="start">done, unloaded</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Agree them at the truck. One moves, one watches</text>
</svg>
