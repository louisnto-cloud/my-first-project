<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" role="img" aria-label="Grid of duck daily bag limits as 8 boxes. All ducks together: 8. Inside that 8, at most 4 canvasback, 4 northern pintail, 2 goldeneye counting Barrow&#x27;s and common together, and 2 harlequin. The restricted species count inside the 8, never on top. Regions can set lower limits." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="350" fill="#fffaf0"/>
<text x="200" y="26" font-size="20" fill="#23261f" text-anchor="middle" font-weight="bold">Ducks: daily bag limit</text>
