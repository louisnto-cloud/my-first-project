<text x="12" y="288" font-size="15" fill="#2f3a2b" text-anchor="start">The 4 orange species count INSIDE the 8,</text>
<text x="12" y="308" font-size="15" fill="#2f3a2b" text-anchor="start">never on top. Goldeneye: Barrow&#x27;s and common</text>
<text x="12" y="328" font-size="15" fill="#2f3a2b" text-anchor="start">together. Regions can set lower limits.</text>
</svg>
