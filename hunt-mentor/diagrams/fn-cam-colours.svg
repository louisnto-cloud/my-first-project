<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Two colour bars. Your bar runs blue, green, yellow, orange, red. The deer bar, an approximate drawing, keeps blue bright but turns green, orange and red into dull browns and greys.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="32" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">What a deer likely sees (approximate)</text><text x="20" y="70" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">You</text><text x="20" y="150" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Deer</text><rect x="80" y="50" width="36" height="40" rx="0" fill="#3b5bdb" stroke="none" stroke-width="2"/><rect x="80" y="130" width="36" height="40" rx="0" fill="#3b5bdb" stroke="none" stroke-width="2"/><rect x="118" y="50" width="36" height="40" rx="0" fill="#1c7ed6" stroke="none" stroke-width="2"/><rect x="118" y="130" width="36" height="40" rx="0" fill="#4c6ef5" stroke="none" stroke-width="2"/><rect x="156" y="50" width="36" height="40" rx="0" fill="#2f9e44" stroke="none" stroke-width="2"/><rect x="156" y="130" width="36" height="40" rx="0" fill="#8f9c9c" stroke="none" stroke-width="2"/><rect x="194" y="50" width="36" height="40" rx="0" fill="#94d82d" stroke="none" stroke-width="2"/><rect x="194" y="130" width="36" height="40" rx="0" fill="#a5a99a" stroke="none" stroke-width="2"/><rect x="232" y="50" width="36" height="40" rx="0" fill="#fab005" stroke="none" stroke-width="2"/><rect x="232" y="130" width="36" height="40" rx="0" fill="#b0ab8c" stroke="none" stroke-width="2"/><rect x="270" y="50" width="36" height="40" rx="0" fill="#fd7e14" stroke="none" stroke-width="2"/><rect x="270" y="130" width="36" height="40" rx="0" fill="#a7a28a" stroke="none" stroke-width="2"/><rect x="308" y="50" width="36" height="40" rx="0" fill="#e8590c" stroke="none" stroke-width="2"/><rect x="308" y="130" width="36" height="40" rx="0" fill="#9c9784" stroke="none" stroke-width="2"/><rect x="346" y="50" width="36" height="40" rx="0" fill="#c92a2a" stroke="none" stroke-width="2"/><rect x="346" y="130" width="36" height="40" rx="0" fill="#8e8a7c" stroke="none" stroke-width="2"/><text x="100" y="110" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">blue</text><text x="270" y="110" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">orange</text><text x="363" y="110" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">red</text><text x="20" y="210" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Blue stands out. Orange and red look dull,</text><text x="20" y="228" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">like browns and greys (75%).</text><text x="20" y="265" font-family="sans-serif" font-size="13" fill="#868e96" text-anchor="start">A drawing, not a measurement (Tip).</text>
</svg>
