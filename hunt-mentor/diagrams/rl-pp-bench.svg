<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Contour sketch of a bench that runs along a slope and narrows to a thin ledge where tight lines from a cliff above and a cliff below come close. A dotted trail runs along the bench and squeezes through the narrow part, marked orange.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Bench pinch</text><text x="388" y="24" font-size="14" fill="#2f3a2b" text-anchor="end">map view</text><rect x="0" y="36" width="400" height="232" fill="#dfe6d3" opacity=".6"/><text x="388" y="24" font-size="13" fill="#2f3a2b" text-anchor="end"></text><g fill="none" stroke="#8b5a2b" stroke-width="2"><path d="M0 70 C 150 74, 250 74, 400 70"/><path d="M0 84 C 150 90, 200 120, 400 88"/><path d="M0 98 C 150 104, 200 128, 400 104"/><path d="M0 200 C 150 196, 200 136, 400 190"/><path d="M0 214 C 150 210, 200 146, 400 206"/><path d="M0 228 C 150 224, 200 156, 400 222"/></g><path d="M0 150 C 120 150, 180 132, 200 132 C 230 132, 280 150, 400 150" stroke="#8b5a2b" stroke-width="3" stroke-dasharray="3 6" fill="none"/><circle cx="200" cy="132" r="13" fill="none" stroke="#e8590c" stroke-width="4"/><text x="40" y="140" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">wide bench</text><text x="310" y="140" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">wide bench</text><rect x="150" y="236" width="116" height="24" rx="6" fill="#e8590c"/><text x="208.0" y="253" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Narrow ledge</text><text x="200" y="292" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wide, then narrow, then wide: sit the narrow part</text>
</svg>
