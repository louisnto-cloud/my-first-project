<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four cards on how a mule deer lives. Eats: a browser of twigs, leaves, buds and forbs, with little grass in fall. Chews cud: it fills up fast, then lies down to chew again. Pellets: oval, 1 to 1.5 centimetres, roughly 13 to 34 piles a day. Sleeps: short naps, waking often, and walks the same trails each day.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">How a mule deer lives</text><rect x="8" y="42" width="188" height="120" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="66" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Eats</text><path d="M128 96 L168 68 M142 86 l-8 -12 M154 78 l10 -6" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/><ellipse cx="162" cy="64" rx="6" ry="3" fill="#8a9a6b"/><text x="18" y="128" font-size="14" fill="#23261f" text-anchor="start">Browser: twigs, leaves,</text><text x="18" y="148" font-size="14" fill="#23261f" text-anchor="start">buds, forbs. Little grass.</text><rect x="204" y="42" width="188" height="120" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="214" y="66" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Chews cud</text><ellipse cx="344" cy="82" rx="24" ry="12" fill="#8b5a2b"/><path d="M358 76 l14 -12" stroke="#8b5a2b" stroke-width="8" stroke-linecap="round"/><text x="320" y="68" font-size="14" fill="#2f3a2b">z</text><text x="214" y="128" font-size="14" fill="#23261f" text-anchor="start">Fills up fast, then lies</text><text x="214" y="148" font-size="14" fill="#23261f" text-anchor="start">down to chew again.</text><rect x="8" y="170" width="188" height="120" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="194" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Pellets</text><ellipse cx="130" cy="210" rx="4" ry="5.5" fill="#3b2a1c"/><ellipse cx="139" cy="216" rx="4" ry="5.5" fill="#3b2a1c"/><ellipse cx="148" cy="210" rx="4" ry="5.5" fill="#3b2a1c"/><ellipse cx="157" cy="216" rx="4" ry="5.5" fill="#3b2a1c"/><ellipse cx="166" cy="210" rx="4" ry="5.5" fill="#3b2a1c"/><text x="18" y="256" font-size="14" fill="#23261f" text-anchor="start">Oval, 1 to 1.5 cm.</text><text x="18" y="276" font-size="14" fill="#23261f" text-anchor="start">About 13 to 34 piles a day.</text><rect x="204" y="170" width="188" height="120" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="214" y="194" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Sleeps</text><path d="M322 220 Q344 196 366 220" fill="none" stroke="#8a9a6b" stroke-width="4"/><circle cx="344" cy="210" r="6" fill="#8b5a2b"/><text x="214" y="256" font-size="14" fill="#23261f" text-anchor="start">Short naps, wakes often.</text><text x="214" y="276" font-size="14" fill="#23261f" text-anchor="start">Same trails each day.</text>
</svg>
