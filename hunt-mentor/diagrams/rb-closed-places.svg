<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 582" font-family="sans-serif" role="img" aria-label="Places where hunting is closed or limited. No hunting: National Park, no hunting at all. Ecological reserve, no hunting and no firing a gun or bow. Limited, check first: National Wildlife Areas and Migratory Bird Sanctuaries, federal bird land, closed unless a federal permit or posted notices allow it, boundaries marked with blue loon signs. BC Park: only if its own page allows hunting, and only in open season. Regional district park: most ban firing; in Regions 1 and 2, no hunting or shooting within 100 metres. Recreation site: no firing within 100 metres of camps and structures. Conservation land: call the regional office first. Reserve: private land, band office permission needed. Town: the local bylaw decides.">
<rect width="400" height="582" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="28" rx="6" fill="#c0392b"/>
<text x="20" y="28" font-size="15" font-weight="bold" fill="#fffaf0" letter-spacing="1.5">NO HUNTING</text>
<g data-tip="National Park|No hunting in any National Park. Passing through, the firearm is dismantled, cased, or wrapped and tied, and it stays in the vehicle (99%, page 9).">
<rect x="8" y="44" width="384" height="46" rx="6" fill="#f4eedf"/>
<circle cx="34" cy="67.0" r="19" fill="#fffaf0" stroke="#c0392b" stroke-width="2"/>
<g transform="translate(34 67.0) scale(0.82)" fill="#c0392b" stroke="none"><path d="M-15 11 L-4 -9 L2 1 L6 -4 L15 11z"/><path d="M-4 -9 L-1 -4 L-6 -3z" fill="#fffaf0"/></g>
<text x="62" y="73" font-size="16" font-weight="bold" fill="#2f3a2b">National Park</text>
<text x="384" y="73" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="end">No hunting</text>
</g>
<circle cx="34" cy="115.0" r="19" fill="#fffaf0" stroke="#c0392b" stroke-width="2"/>
<g transform="translate(34 115.0) scale(0.82)" fill="#c0392b" stroke="none"><path d="M-12 12 C-14 -4 -2 -14 14 -13 C14 4 4 13 -12 12z"/><path d="M-12 12 L6 -6" stroke="#fffaf0" stroke-width="1.8"/></g>
<text x="62" y="121" font-size="16" font-weight="bold" fill="#2f3a2b">Eco reserve</text>
<text x="384" y="121" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="end">No firing, gun or bow</text>
<rect x="8" y="148" width="384" height="28" rx="6" fill="#e8590c"/>
<text x="20" y="168" font-size="15" font-weight="bold" fill="#fffaf0" letter-spacing="1.5">LIMITED</text>
<g data-tip="Federal bird land|National Wildlife Areas and Migratory Bird Sanctuaries are closed unless a special federal permit is granted or notices say otherwise. Blue signs with a loon mark the line (99%).">
<rect x="8" y="184" width="384" height="64" rx="6" fill="#f4eedf"/>
<circle cx="34" cy="216.0" r="19" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/>
<g transform="translate(34 216.0) scale(0.82)" fill="#2f3a2b" stroke="none"><rect x="-15" y="-12" width="30" height="24" rx="2" fill="#2f63a6"/><path d="M-10 5 C-6 -1 4 -1 8 3 L12 1 L10 5 C6 8 -6 8 -10 5z M8 3 C8 -2 4 -4 2 -2" fill="#fffaf0"/></g>
<text x="62" y="222" font-size="16" font-weight="bold" fill="#2f3a2b">Federal bird land</text>
<text x="384" y="212" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="end">Permit or posted</text>
<text x="384" y="232" font-size="15" fill="#2f3a2b" text-anchor="end">blue loon signs</text>
</g>
<g data-tip="BC Park|Only where that park allows hunting, and only in open season (99%). No hunting or shooting within 400 m (437 yd) of a park road (99%).">
<circle cx="34" cy="273.0" r="19" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/>
<g transform="translate(34 273.0) scale(0.82)" fill="#e8590c" stroke="none"><path d="M-8 -14 L-1 0 L-4 0 L1 9 L-17 9 L-12 0 L-15 0z"/><path d="M8 -10 L14 1 L12 1 L16 10 L0 10 L4 1 L2 1z"/><rect x="-9.5" y="9" width="3" height="4"/><rect x="6.5" y="10" width="3" height="3"/></g>
<text x="62" y="279" font-size="16" font-weight="bold" fill="#2f3a2b">BC Park</text>
<text x="384" y="279" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="end">If allowed, in season</text>
</g>
<g data-tip="Regional park|In Regions 1 and 2, no hunting or shooting within 100 m of any regional district park (99%).">
<rect x="8" y="298" width="384" height="64" rx="6" fill="#f4eedf"/>
<circle cx="34" cy="330.0" r="19" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/>
<g transform="translate(34 330.0) scale(0.82)" fill="#e8590c" stroke="none"><rect x="-15" y="-6" width="30" height="4" rx="1"/><rect x="-13" y="2" width="26" height="3" rx="1"/><path d="M-10 -2 L-13 12 M10 -2 L13 12 M-5 -2 L-8 12 M5 -2 L8 12" stroke="#e8590c" stroke-width="2.4"/></g>
<text x="62" y="336" font-size="16" font-weight="bold" fill="#2f3a2b">Regional park</text>
<text x="384" y="326" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="end">Most ban firing</text>
<text x="384" y="346" font-size="15" fill="#2f3a2b" text-anchor="end">Regions 1, 2: 100 m</text>
</g>
<g data-tip="Recreation site|No shooting a firearm, bow or crossbow on or into the developed part: 100 m (109 yd) from any structure, campsite or staging area (99%).">
<circle cx="34" cy="396.0" r="19" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/>
<g transform="translate(34 396.0) scale(0.82)" fill="#e8590c" stroke="none"><path d="M-16 12 L0 -13 L16 12z"/><path d="M0 -1 L-5 12 L5 12z" fill="#fffaf0"/></g>
<text x="62" y="402" font-size="16" font-weight="bold" fill="#2f3a2b">Recreation site</text>
<text x="384" y="392" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="end">No firing 100 m</text>
<text x="384" y="412" font-size="15" fill="#2f3a2b" text-anchor="end">from camps</text>
</g>
<g data-tip="Conservation land|Wildlife Management Areas, Crown reserves and land bought for fish and wildlife. Rules differ by area: call the regional office before you hunt (99%).">
<rect x="8" y="430" width="384" height="46" rx="6" fill="#f4eedf"/>
<circle cx="34" cy="453.0" r="19" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/>
<g transform="translate(34 453.0) scale(0.82)" fill="#e8590c" stroke="none"><rect x="-8" y="-14" width="16" height="28" rx="3"/><rect x="-5.5" y="-10" width="11" height="17" fill="#fffaf0"/><circle cy="10.5" r="1.6" fill="#fffaf0"/></g>
<text x="62" y="459" font-size="16" font-weight="bold" fill="#2f3a2b">Conservation land</text>
<text x="384" y="459" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="end">Call regional office</text>
</g>
<g data-tip="First Nations reserve|Private land. Get permission from the local band office to hunt on or across it (99%).">
<circle cx="34" cy="501.0" r="19" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/>
<g transform="translate(34 501.0) scale(0.82)" fill="#e8590c" stroke="none"><rect x="-15" y="-10" width="3.5" height="23"/><rect x="11.5" y="-10" width="3.5" height="23"/><path d="M-12 -5 H12 M-12 3 H12 M-12 3 L12 -5" stroke="#e8590c" stroke-width="2.6"/></g>
<text x="62" y="507" font-size="16" font-weight="bold" fill="#2f3a2b">Reserve</text>
<text x="384" y="507" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="end">Band office permission</text>
</g>
<g data-tip="Town|Municipal bylaws are not in the synopsis. Inside towns, the local bylaw decides: ask the municipal clerk (99%).">
<rect x="8" y="526" width="384" height="46" rx="6" fill="#f4eedf"/>
<circle cx="34" cy="549.0" r="19" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/>
<g transform="translate(34 549.0) scale(0.82)" fill="#e8590c" stroke="none"><rect x="-15" y="-4" width="10" height="17"/><rect x="-4" y="-14" width="11" height="27"/><rect x="8" y="0" width="8" height="13"/><path d="M-1 -10 h2 v2 h-2z M3 -10 h2 v2 h-2z M-1 -4 h2 v2 h-2z M3 -4 h2 v2 h-2z M-1 2 h2 v2 h-2z M3 2 h2 v2 h-2z" fill="#fffaf0"/></g>
<text x="62" y="555" font-size="16" font-weight="bold" fill="#2f3a2b">Town</text>
<text x="384" y="555" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="end">Bylaw decides</text>
</g>
</svg>
