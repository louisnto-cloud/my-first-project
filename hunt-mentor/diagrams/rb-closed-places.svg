<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 410" role="img" aria-label="Nine cards of places where hunting is closed or limited. National Park: no hunting at all. Ecological reserve: no hunting, no firing a firearm or bow. National Wildlife Areas and Migratory Bird Sanctuaries: closed unless a federal permit or posted notices allow it, boundaries marked with blue loon signs. BC Park: only if its own page allows hunting, and only in open season. Regional district park: most ban firing, and in Regions 1 and 2 no hunting or shooting within 100 metres. Recreation site: no firing within the developed portion, 100 metres from camps and structures. Conservation land: call the regional office first. Reserve: private land, band office permission needed. Town: the local bylaw decides." font-family="sans-serif">
  <rect x="0" y="0" width="396" height="410" fill="#fffaf0"/>
<text x="198.0" y="26" font-size="19" fill="#23261f" text-anchor="middle" font-weight="bold">Where hunting is closed or limited</text>
<rect x="6" y="40" width="124" height="116" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<rect x="6" y="40" width="124" height="30" rx="10" fill="#c92a2a"/><rect x="6" y="58" width="124" height="12" fill="#c92a2a"/>
<text x="68.0" y="61" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">National Park</text>
<text x="68.0" y="92" font-size="14" fill="#23261f" text-anchor="middle">No hunting</text>
<text x="68.0" y="110" font-size="14" fill="#23261f" text-anchor="middle">at all</text>
<rect x="136" y="40" width="124" height="116" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<rect x="136" y="40" width="124" height="30" rx="10" fill="#c92a2a"/><rect x="136" y="58" width="124" height="12" fill="#c92a2a"/>
<text x="198.0" y="61" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Eco reserve</text>
<text x="198.0" y="92" font-size="14" fill="#23261f" text-anchor="middle">No hunting,</text>
<text x="198.0" y="110" font-size="14" fill="#23261f" text-anchor="middle">no firing a gun</text>
<text x="198.0" y="128" font-size="14" fill="#23261f" text-anchor="middle">or bow</text>
<rect x="266" y="40" width="124" height="116" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<rect x="266" y="40" width="124" height="30" rx="10" fill="#c92a2a"/><rect x="266" y="58" width="124" height="12" fill="#c92a2a"/>
<text x="328.0" y="61" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Federal bird land</text>
<text x="328.0" y="92" font-size="14" fill="#23261f" text-anchor="middle">Closed unless</text>
<text x="328.0" y="110" font-size="14" fill="#23261f" text-anchor="middle">permit or posted.</text>
<text x="328.0" y="128" font-size="14" fill="#23261f" text-anchor="middle">Blue loon signs</text>
<rect x="6" y="162" width="124" height="116" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<rect x="6" y="162" width="124" height="30" rx="10" fill="#e8590c"/><rect x="6" y="180" width="124" height="12" fill="#e8590c"/>
<text x="68.0" y="183" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">BC Park</text>
<text x="68.0" y="214" font-size="14" fill="#23261f" text-anchor="middle">Only if its page</text>
<text x="68.0" y="232" font-size="14" fill="#23261f" text-anchor="middle">allows it, and</text>
<text x="68.0" y="250" font-size="14" fill="#23261f" text-anchor="middle">only in season</text>
<rect x="136" y="162" width="124" height="116" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<rect x="136" y="162" width="124" height="30" rx="10" fill="#e8590c"/><rect x="136" y="180" width="124" height="12" fill="#e8590c"/>
<text x="198.0" y="183" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Regional park</text>
<text x="198.0" y="214" font-size="14" fill="#23261f" text-anchor="middle">Most ban firing.</text>
<text x="198.0" y="232" font-size="14" fill="#23261f" text-anchor="middle">Regions 1 and 2:</text>
<text x="198.0" y="250" font-size="14" fill="#23261f" text-anchor="middle">100 m buffer</text>
<rect x="266" y="162" width="124" height="116" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<rect x="266" y="162" width="124" height="30" rx="10" fill="#e8590c"/><rect x="266" y="180" width="124" height="12" fill="#e8590c"/>
<text x="328.0" y="183" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Recreation site</text>
<text x="328.0" y="214" font-size="14" fill="#23261f" text-anchor="middle">No firing within</text>
<text x="328.0" y="232" font-size="14" fill="#23261f" text-anchor="middle">100 m of camps,</text>
<text x="328.0" y="250" font-size="14" fill="#23261f" text-anchor="middle">structures</text>
<rect x="6" y="284" width="124" height="116" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<rect x="6" y="284" width="124" height="30" rx="10" fill="#4a7fb0"/><rect x="6" y="302" width="124" height="12" fill="#4a7fb0"/>
<text x="68.0" y="305" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Conservation</text>
<text x="68.0" y="336" font-size="14" fill="#23261f" text-anchor="middle">Conservation land:</text>
<text x="68.0" y="354" font-size="14" fill="#23261f" text-anchor="middle">call the regional</text>
<text x="68.0" y="372" font-size="14" fill="#23261f" text-anchor="middle">office first</text>
<rect x="136" y="284" width="124" height="116" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<rect x="136" y="284" width="124" height="30" rx="10" fill="#4a7fb0"/><rect x="136" y="302" width="124" height="12" fill="#4a7fb0"/>
<text x="198.0" y="305" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Reserve</text>
<text x="198.0" y="336" font-size="14" fill="#23261f" text-anchor="middle">Private land.</text>
<text x="198.0" y="354" font-size="14" fill="#23261f" text-anchor="middle">Band office</text>
<text x="198.0" y="372" font-size="14" fill="#23261f" text-anchor="middle">permission</text>
<rect x="266" y="284" width="124" height="116" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<rect x="266" y="284" width="124" height="30" rx="10" fill="#4a7fb0"/><rect x="266" y="302" width="124" height="12" fill="#4a7fb0"/>
<text x="328.0" y="305" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Town</text>
<text x="328.0" y="336" font-size="14" fill="#23261f" text-anchor="middle">The local bylaw</text>
<text x="328.0" y="354" font-size="14" fill="#23261f" text-anchor="middle">decides</text>
</svg>
