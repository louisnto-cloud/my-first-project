<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A fan of slope angles: 25, 30, 45 and 60 degrees. The wedge from 30 to 45 degrees is shaded red: most avalanches start there. Caption: an avalanche can run far out onto flat ground below the slope.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Where avalanches start</text><path d="M30 260 H390" stroke="#2f3a2b" stroke-width="2"/><path d="M30 260 L302 133" stroke="#2f3a2b" stroke-width="1.5" stroke-dasharray="4 4"/><text x="309.1427984072882" y="129.83357538386457" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">25°</text><path d="M30 260 L290 110" stroke="#2f3a2b" stroke-width="1.5" stroke-dasharray="4 4"/><text x="296.73582436560713" y="106.00000000000003" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">30°</text><path d="M30 260 L242 48" stroke="#2f3a2b" stroke-width="1.5" stroke-dasharray="4 4"/><text x="247.78888860545666" y="42.211111394543394" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">45°</text><path d="M30 260 L180 0" stroke="#2f3a2b" stroke-width="1.5" stroke-dasharray="4 4"/><text x="184.00000000000003" y="-6.735824365607073" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">60°</text><path d="M30 260 L290 110 A300 300 0 0 0 242 48 Z" fill="#e03131" opacity=".35"/><rect x="185" y="200" width="209" height="24" rx="6" fill="#e03131"/><text x="289.5" y="217" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Most start at 30 to 45°</text><text x="200" y="292" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Can run far onto flat ground below</text>
</svg>
