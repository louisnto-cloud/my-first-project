<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Side view of a cold front: cold air pushes under warm air and throws up tall towering clouds with an anvil and heavy showers. After it passes the wind swings west or northwest, it gets colder and the pressure rises.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#e7f0f7" stroke="none" stroke-width="2"/><text x="14" y="26" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Cold front: fast, gusty, clears behind</text><path d="M60 250 C 120 250, 160 120, 190 70 L240 70 C 220 120, 230 200, 260 250 Z" fill="#d0d6dc" stroke="#9aa5b1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M180 70 L280 60 L250 78 Z" fill="#d0d6dc" stroke="#9aa5b1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="285" y="66" font-family="sans-serif" font-size="13" fill="#868e96" text-anchor="start">anvil</text><line x1="170" y1="200" x2="164" y2="248" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="182" y1="200" x2="176" y2="248" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="194" y1="200" x2="188" y2="248" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="206" y1="200" x2="200" y2="248" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="218" y1="200" x2="212" y2="248" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="230" y1="200" x2="224" y2="248" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="242" y1="200" x2="236" y2="248" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="120" y1="200" x2="162.3" y2="200.0" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><polygon points="170.0,200.0 159.0,193.9 159.0,206.1" fill="#4a7fb0"/><text x="70" y="190" font-family="sans-serif" font-size="14" fill="#4a7fb0" text-anchor="start" font-weight="bold">cold air</text><text x="290" y="190" font-family="sans-serif" font-size="13" fill="#6b4f35" text-anchor="start">warm, south wind</text><text x="20" y="275" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Wind swings W or NW, temp drops, pressure rises.</text><line x1="0" y1="250" x2="400" y2="250" stroke="#8a9a6b" stroke-width="4" stroke-linecap="round"/>
</svg>
