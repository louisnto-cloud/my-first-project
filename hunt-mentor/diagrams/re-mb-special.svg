<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 329" role="img" aria-label="Cards: Special measures in BC. No Table 2 for BC: Part 10 has only Table 1 (99%). So in BC: No spring snow goose conservation season, no electronic calls, no special equipment (95%, my reading). Minister&#x27;s notice: Can vary seasons or limits, valid to 31 July at the latest. 2026 to 2027: VERIFY." font-family="sans-serif">
