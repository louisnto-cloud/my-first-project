<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three sitting positions. Crossed ankle: low and very steady. Open leg: flexible on slopes. With shooting sticks: the rifle rides above tall grass. Sticks often win in BC grass and sage.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Three ways to sit</text><rect x="14" y="44" width="120" height="210" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="74" y="66" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Crossed ankle</text><text x="74" y="240" font-size="13" fill="#23261f" text-anchor="middle">low, very steady</text><circle cx="64" cy="120" r="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3.5"/><path d="M64 130 L52 190" fill="none" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="22" y1="192" x2="126" y2="192" stroke="#8a9a6b" stroke-width="2" stroke-linecap="round"/><path d="M52 190 L84 168 L104 190" fill="none" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 188 L90 172 L110 192" fill="none" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="64" y1="132" x2="130" y2="128" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/><rect x="142" y="44" width="120" height="210" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="202" y="66" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Open leg</text><text x="202" y="240" font-size="13" fill="#23261f" text-anchor="middle">flexible on slopes</text><circle cx="192" cy="120" r="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3.5"/><path d="M192 130 L180 190" fill="none" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="150" y1="192" x2="254" y2="192" stroke="#8a9a6b" stroke-width="2" stroke-linecap="round"/><path d="M180 190 L214 158 L232 190" fill="none" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M182 190 L202 166 L208 190" fill="none" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="192" y1="132" x2="258" y2="128" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/><rect x="270" y="44" width="120" height="210" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="330" y="66" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">With sticks</text><text x="330" y="240" font-size="13" fill="#23261f" text-anchor="middle">over tall grass</text><circle cx="320" cy="120" r="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3.5"/><path d="M320 130 L308 190" fill="none" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="278" y1="192" x2="382" y2="192" stroke="#8a9a6b" stroke-width="2" stroke-linecap="round"/><path d="M308 190 L340 168 L360 190" fill="none" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="366" y1="136" x2="350" y2="190" stroke="#6b4f35" stroke-width="3" stroke-linecap="round"/><line x1="366" y1="136" x2="380" y2="190" stroke="#6b4f35" stroke-width="3" stroke-linecap="round"/><line x1="320" y1="132" x2="386" y2="134" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/><text x="200.0" y="280" font-size="14" fill="#2f3a2b" text-anchor="middle">Sticks win in BC grass and sage</text>
