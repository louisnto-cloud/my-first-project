<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 304" font-family="sans-serif" role="img" aria-label="Three sitting positions for a rifle. Crossed ankle: legs crossed at the ankles, elbows on the knees; low and very steady. Open leg: feet apart, knees up; flexible on slopes. With shooting sticks: the rifle rides on the sticks above tall grass. Sticks often win in BC grass and sage.">
