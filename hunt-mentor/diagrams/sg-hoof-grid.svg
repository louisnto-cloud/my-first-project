<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif" role="img" aria-label="Hoof tracks drawn to the same scale. Deer: pointed heart, about 4 to 10 cm long. Elk: rounder with blunt tips, 10 to 13 cm. Moose: long pointed heart, 11 to 18 cm, often with two dewclaw dots behind. Cow: round, blunt and wide, with no point.">
  <rect width="400" height="320" fill="#fffaf0"/>
  <text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hoof tracks, same scale</text>
  <line x1="10" y1="215" x2="390" y2="215" stroke="#8a9a6b" stroke-width="2"/>
  <g fill="#8b5a2b">
    <g transform="translate(55 180) scale(1.6)"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g>
    <g transform="translate(150 162) scale(2.4,2.2)"><path d="M-2 -20 C-11 -18 -14 -2 -13 12 C-12 19 -3 20 -2 14 Z"/><path d="M2 -20 C11 -18 14 -2 13 12 C12 19 3 20 2 14 Z"/></g>
    <g transform="translate(250 140) scale(2.6,3.4)"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g>
    <circle cx="238" cy="207" r="4"/><circle cx="262" cy="207" r="4"/>
    <g transform="translate(345 170)"><path d="M-3 -24 C-22 -22 -26 6 -22 18 C-18 26 -4 26 -3 18 Z"/><path d="M3 -24 C22 -22 26 6 22 18 C18 26 4 26 3 18 Z"/></g>
  </g>
  <g text-anchor="middle">
    <text x="55" y="242" font-size="17" font-weight="bold" fill="#2f3a2b">Deer</text>
    <text x="150" y="242" font-size="17" font-weight="bold" fill="#2f3a2b">Elk</text>
    <text x="250" y="242" font-size="17" font-weight="bold" fill="#2f3a2b">Moose</text>
    <text x="345" y="242" font-size="17" font-weight="bold" fill="#2f3a2b">Cow</text>
    <text x="55" y="264" font-size="15" fill="#e8590c">4 to 10 cm</text>
    <text x="150" y="264" font-size="15" fill="#e8590c">10 to 13 cm</text>
    <text x="250" y="264" font-size="15" fill="#e8590c">11 to 18 cm</text>
    <text x="345" y="264" font-size="15" fill="#e8590c">no point</text>
    <text x="55" y="286" font-size="14" fill="#2f3a2b">pointed</text>
    <text x="150" y="286" font-size="14" fill="#2f3a2b">blunt tips</text>
    <text x="250" y="286" font-size="14" fill="#2f3a2b">dewclaws</text>
    <text x="345" y="286" font-size="14" fill="#2f3a2b">round, wide</text>
  </g>
  <text x="200" y="312" font-size="14" fill="#6b4f35" text-anchor="middle">Front track length. Pointed end = the way it went</text>
</svg>
