<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 463" font-family="sans-serif" role="img" aria-label="Grid for Manitoba, you are a Canadian resident. White tailed deer: no guide, in listed Game Hunting Areas only. Ducks, geese, grouse and partridge: no guide, game bird licence. Black bear: a Canadian resident licence exists, outfitter need and areas VERIFY. Moose: general and conservation licences exist, areas and any draw VERIFY. Coyote and wolf: VERIFY. Elk: Manitoba resident draw, assume no.">
<rect x="0" y="0" width="400" height="463" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Manitoba: who may hunt what</text>
<text x="200" y="46" font-size="14" fill="#6b4f35" text-anchor="middle">You are a Canadian resident (85%)</text>
<text x="280" y="74" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">BC resident</text>
