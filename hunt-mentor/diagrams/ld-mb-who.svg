<text x="14" y="105" font-size="14" font-weight="bold" fill="#2f3a2b">White tailed</text>
<text x="14" y="123" font-size="14" font-weight="bold" fill="#2f3a2b">deer</text>
<circle cx="280.0" cy="103" r="12" fill="#8a9a6b"/><path d="M274.6 103 l3.5999999999999996 4.199999999999999 l7.199999999999999 -8.399999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
