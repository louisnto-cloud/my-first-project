<text x="14" y="156" font-size="14" font-weight="bold" fill="#2f3a2b">Ducks, geese,</text>
<text x="14" y="174" font-size="14" font-weight="bold" fill="#2f3a2b">grouse,</text>
<text x="14" y="192" font-size="14" font-weight="bold" fill="#2f3a2b">partridge</text>
<circle cx="280.0" cy="155" r="12" fill="#8a9a6b"/><path d="M274.6 155 l3.5999999999999996 4.199999999999999 l7.199999999999999 -8.399999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="280" y="183" font-size="14" fill="#2f3a2b" text-anchor="middle">No guide. Game bird</text>
<text x="280" y="199" font-size="14" fill="#2f3a2b" text-anchor="middle">licence</text>
<rect x="8" y="203" width="384" height="68" fill="#dfe6d3" rx="4"/>
<text x="14" y="242" font-size="14" font-weight="bold" fill="#2f3a2b">Black bear</text>
<circle cx="280.0" cy="223" r="12" fill="#4a7fb0"/><text x="280" y="228.04" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
<text x="280" y="251" font-size="14" fill="#2f3a2b" text-anchor="middle">Licence exists. Guide and</text>
<text x="280" y="267" font-size="14" fill="#2f3a2b" text-anchor="middle">areas: VERIFY</text>
<text x="14" y="310" font-size="14" font-weight="bold" fill="#2f3a2b">Moose</text>
<circle cx="280.0" cy="291" r="12" fill="#4a7fb0"/><text x="280" y="296.04" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
<text x="280" y="319" font-size="14" fill="#2f3a2b" text-anchor="middle">Licences exist. Areas and</text>
<text x="280" y="335" font-size="14" fill="#2f3a2b" text-anchor="middle">draw: VERIFY</text>
<rect x="8" y="339" width="384" height="52" fill="#dfe6d3" rx="4"/>
<text x="14" y="370" font-size="14" font-weight="bold" fill="#2f3a2b">Coyote, wolf</text>
<circle cx="280.0" cy="359" r="12" fill="#4a7fb0"/><text x="280" y="364.04" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
<text x="280" y="387" font-size="14" fill="#2f3a2b" text-anchor="middle">VERIFY</text>
<text x="14" y="422" font-size="14" font-weight="bold" fill="#2f3a2b">Elk</text>
