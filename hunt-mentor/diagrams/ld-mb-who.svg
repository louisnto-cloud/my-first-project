<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 487" font-family="sans-serif" role="img" aria-label="Grid for Manitoba, you are a Canadian resident. White tailed deer: no guide, in listed Game Hunting Areas only. Ducks, geese, grouse and partridge: no guide, game bird licence. Black bear: a Canadian resident licence exists, outfitter need and areas VERIFY. Moose: general and conservation licences exist, areas and any draw VERIFY. Coyote and wolf: VERIFY. Elk: Manitoba resident draw, assume no.">
<rect x="0" y="0" width="400" height="487" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Manitoba: who may hunt what</text>
<text x="200" y="46" font-size="14" fill="#6b4f35" text-anchor="middle">You are a Canadian resident (85%)</text>
<text x="280" y="74" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">BC resident</text>
<rect x="8" y="83" width="384" height="56" fill="#dfe6d3" rx="4"/>
<text x="14" y="107" font-size="14" font-weight="bold" fill="#2f3a2b">White tailed</text>
<text x="14" y="125" font-size="14" font-weight="bold" fill="#2f3a2b">deer</text>
<circle cx="280.0" cy="103" r="12" fill="#8a9a6b"/><path d="M274.6 103 l3.5999999999999996 4.199999999999999 l7.199999999999999 -8.399999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="280" y="131" font-size="14" fill="#2f3a2b" text-anchor="middle">No guide, listed GHAs only</text>
<text x="14" y="162" font-size="14" font-weight="bold" fill="#2f3a2b">Ducks, geese,</text>
<text x="14" y="180" font-size="14" font-weight="bold" fill="#2f3a2b">grouse,</text>
<text x="14" y="198" font-size="14" font-weight="bold" fill="#2f3a2b">partridge</text>
<circle cx="280.0" cy="159" r="12" fill="#8a9a6b"/><path d="M274.6 159 l3.5999999999999996 4.199999999999999 l7.199999999999999 -8.399999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="280" y="187" font-size="14" fill="#2f3a2b" text-anchor="middle">No guide. Game bird</text>
<text x="280" y="203" font-size="14" fill="#2f3a2b" text-anchor="middle">licence</text>
<rect x="8" y="211" width="384" height="72" fill="#dfe6d3" rx="4"/>
<text x="14" y="252" font-size="14" font-weight="bold" fill="#2f3a2b">Black bear</text>
<circle cx="280.0" cy="231" r="12" fill="#4a7fb0"/><text x="280" y="236.04" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
<text x="280" y="259" font-size="14" fill="#2f3a2b" text-anchor="middle">Licence exists. Guide and</text>
<text x="280" y="275" font-size="14" fill="#2f3a2b" text-anchor="middle">areas: VERIFY</text>
<text x="14" y="324" font-size="14" font-weight="bold" fill="#2f3a2b">Moose</text>
<circle cx="280.0" cy="303" r="12" fill="#4a7fb0"/><text x="280" y="308.04" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
<text x="280" y="331" font-size="14" fill="#2f3a2b" text-anchor="middle">Licences exist. Areas and</text>
<text x="280" y="347" font-size="14" fill="#2f3a2b" text-anchor="middle">draw: VERIFY</text>
<rect x="8" y="355" width="384" height="56" fill="#dfe6d3" rx="4"/>
<text x="14" y="388" font-size="14" font-weight="bold" fill="#2f3a2b">Coyote, wolf</text>
<circle cx="280.0" cy="375" r="12" fill="#4a7fb0"/><text x="280" y="380.04" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
<text x="280" y="403" font-size="14" fill="#2f3a2b" text-anchor="middle">VERIFY</text>
<text x="14" y="444" font-size="14" font-weight="bold" fill="#2f3a2b">Elk</text>
<circle cx="280.0" cy="431" r="12" fill="#e8590c"/><path d="M275.2 426.2 L284.8 435.8 M284.8 426.2 L275.2 435.8" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
<text x="280" y="459" font-size="14" fill="#2f3a2b" text-anchor="middle">Resident draw. Assume no</text>
