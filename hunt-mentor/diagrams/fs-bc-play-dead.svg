<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Defensive bear contact position: lie on your stomach with your pack on, hands clasped over the back of your neck, legs spread so it is hard to flip you. Stay still until the bear leaves.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Defensive contact: lie flat</text><rect x="0" y="230" width="400" height="70" rx="0" fill="#dfe6d3"/><rect x="110" y="206" width="180" height="24" rx="8" fill="#e8590c"/><circle cx="96" cy="216" r="14.0" fill="#d9b48f"/><rect x="70" y="196" width="50" height="14" rx="6" fill="#d9b48f"/><text x="90" y="180" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hands on neck</text><line x1="290" y1="222" x2="340" y2="210" stroke="#2f3a2b" stroke-width="8" stroke-linecap="round"/><line x1="290" y1="222" x2="340" y2="236" stroke="#2f3a2b" stroke-width="8" stroke-linecap="round"/><text x="330" y="190" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Legs apart</text><text x="200" y="100" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">On your stomach, pack on</text><text x="200" y="122" font-size="15" fill="#2f3a2b" text-anchor="middle">Stay still until it leaves</text>
</svg>
