<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Frostbite step 1: numb, white or waxy skin on fingers, toes, ears, nose or cheeks. Check each other often.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1. Spot it early</text><circle cx="200" cy="140" r="70.0" fill="#d9b48f"/><circle cx="150" cy="130" r="12.0" fill="#ffffff"/><circle cx="200" cy="170" r="12.0" fill="#ffffff"/><circle cx="250" cy="130" r="12.0" fill="#ffffff"/><text x="200" y="245" font-size="18" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Numb, white, waxy</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Check each other's faces</text>
</svg>
