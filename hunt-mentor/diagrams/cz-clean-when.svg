<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="sans-serif" role="img" aria-label="When CZ says to clean the CZ 457: 1 each time you use it, 2 if you get it wet, 3 as soon as possible after shooting, 4 at least once a year in a temperate climate, 5 as often as once a month in a tropical or other demanding climate. In Harrison rain, rule 2 applies most hunting days."><rect x="0" y="0" width="400" height="330" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">When to clean</text><rect x="14" y="46" width="372" height="38" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="36" cy="65" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="36" y="70" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><text x="58" y="71" font-size="16" font-weight="normal" text-anchor="start" fill="#17201A">Each time you use it</text><rect x="14" y="92" width="372" height="38" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="36" cy="111" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="36" y="116" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text><text x="58" y="117" font-size="16" font-weight="normal" text-anchor="start" fill="#17201A">If it gets wet</text><rect x="14" y="138" width="372" height="38" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="36" cy="157" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="36" y="162" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text><text x="58" y="163" font-size="16" font-weight="normal" text-anchor="start" fill="#17201A">Soon after shooting</text><rect x="14" y="184" width="372" height="38" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="36" cy="203" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="36" y="208" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4</text><text x="58" y="209" font-size="16" font-weight="normal" text-anchor="start" fill="#17201A">At least once a year</text><rect x="14" y="230" width="372" height="38" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="36" cy="249" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="36" y="254" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">5</text><text x="58" y="255" font-size="16" font-weight="normal" text-anchor="start" fill="#17201A">Monthly in harsh places</text><text x="16" y="296" font-size="14" font-weight="bold" text-anchor="start" fill="#FF6A13">Harrison rain: rule 2 most days (Tip).</text><text x="16" y="318" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">CZ manual, page 9 (95%).</text></svg>
