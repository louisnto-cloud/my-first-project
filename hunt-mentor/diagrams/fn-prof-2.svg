<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="The A to B line crosses the rings six times. Each crossing is marked with an orange dot.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c" stroke="none" stroke-width="2"/><text x="26" y="32" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="52" y="32" font-family="sans-serif" font-size="18" fill="#2f3a2b" text-anchor="start" font-weight="bold">Mark each crossing</text><ellipse cx="200" cy="120" rx="150" ry="70" fill="none" stroke="#8b5a2b" stroke-width="2"/><ellipse cx="200" cy="120" rx="105" ry="48" fill="none" stroke="#8b5a2b" stroke-width="2"/><ellipse cx="200" cy="120" rx="60" ry="28" fill="none" stroke="#8b5a2b" stroke-width="2"/><text x="345" y="40" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start"></text><line x1="40" y1="120" x2="360" y2="120" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="120" r="5" fill="#e8590c" stroke="none" stroke-width="2"/><circle cx="95" cy="120" r="5" fill="#e8590c" stroke="none" stroke-width="2"/><circle cx="140" cy="120" r="5" fill="#e8590c" stroke="none" stroke-width="2"/><circle cx="260" cy="120" r="5" fill="#e8590c" stroke="none" stroke-width="2"/><circle cx="305" cy="120" r="5" fill="#e8590c" stroke="none" stroke-width="2"/><circle cx="350" cy="120" r="5" fill="#e8590c" stroke="none" stroke-width="2"/><text x="120" y="240" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">Mark where the line crosses each ring</text>
</svg>
