<text x="102.5" y="157" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">up and down, all day</text>
<rect x="205.0" y="50" width="185.0" height="118" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
