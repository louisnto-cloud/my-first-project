<text x="297.5" y="413" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">knees and quads</text>
<text x="200" y="452" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Fit enough means safe, steady and still sharp at the shot</text>
