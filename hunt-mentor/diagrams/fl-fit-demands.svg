<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 464" role="img" aria-label="What a hunt day asks of your body: climb hills, carry a pack, walk 10 hours of daylight, drag or pack meat, stay warm in cold and wet, and walk steep ground downhill.">
