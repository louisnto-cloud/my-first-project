<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" font-family="sans-serif" role="img" aria-label="Bar chart of average carcass weights from central BC meat cutter records, 1995 to 2007. Carcass means the four quarters with no head, hide, lower legs or organs. Calf 82 kilograms. Spike fork bull 162 kilograms. Adult cow 199 kilograms. Adult bull 249 kilograms.">
<rect x="0" y="0" width="400" height="270" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">How much moose? Carcass weights</text><text x="142" y="70" font-size="14" fill="#23261f" text-anchor="end">Calf</text><rect x="150" y="48" width="63.1" height="28" rx="3" fill="#8a9a6b"/><text x="219.0769230769231" y="70" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">82 kg</text><text x="142" y="110" font-size="14" fill="#23261f" text-anchor="end">Spike fork bull</text><rect x="150" y="88" width="124.6" height="28" rx="3" fill="#e8590c"/><text x="268.61538461538464" y="110" font-size="14" fill="#fffaf0" text-anchor="end" font-weight="bold">162 kg</text><text x="142" y="150" font-size="14" fill="#23261f" text-anchor="end">Adult cow</text><rect x="150" y="128" width="153.1" height="28" rx="3" fill="#2f3a2b"/><text x="297.0769230769231" y="150" font-size="14" fill="#fffaf0" text-anchor="end" font-weight="bold">199 kg</text><text x="142" y="190" font-size="14" fill="#23261f" text-anchor="end">Adult bull</text><rect x="150" y="168" width="191.5" height="28" rx="3" fill="#6b4f35"/><text x="335.53846153846155" y="190" font-size="14" fill="#fffaf0" text-anchor="end" font-weight="bold">249 kg</text><text x="200" y="222" font-size="14" fill="#23261f" text-anchor="middle">Carcass: 4 quarters, no head, hide,</text><text x="200" y="239" font-size="14" fill="#23261f" text-anchor="middle">lower legs or organs. Central BC, 1995 to 2007.</text>
</svg>
