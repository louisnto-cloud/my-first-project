<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 292" font-family="sans-serif" role="img" aria-label="Memory hooks. Glance down, look ahead: the deer is ahead, not at your feet. Lost it? Flag, circle, widen: 10 metres, then 20. Its pace sets your pace: feeding means slow right down.">
<rect x="0" y="0" width="400" height="292" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Memory hooks</text>
<rect x="20" y="60" width="360" height="66" rx="10" fill="#dfe6d3"/><text x="200" y="88" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="middle">Glance down, look ahead</text><text x="200" y="112" font-size="14" fill="#23261f" text-anchor="middle">The deer is ahead, not at your feet</text><rect x="20" y="136" width="360" height="66" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="200" y="164" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Lost it? Flag, circle, widen</text><text x="200" y="188" font-size="14" fill="#23261f" text-anchor="middle">10 m, then 20 m</text><rect x="20" y="212" width="360" height="66" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="200" y="240" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Its pace sets your pace</text><text x="200" y="264" font-size="14" fill="#23261f" text-anchor="middle">Feeding means slow right down</text>
</svg>
