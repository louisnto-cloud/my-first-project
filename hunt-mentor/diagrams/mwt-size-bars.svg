<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Bar chart of white tailed deer live weights. Fawn at birth 2 to 4 kilograms. Average doe about 57 kilograms. Average buck about 91 kilograms. Mature buck 91 to 136 kilograms. Figures from Idaho and Montana agencies; BC weights not confirmed." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">How heavy? (live weight)</text><text x="16" y="54" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Fawn at birth</text><text x="384" y="54" font-size="14" fill="#2f3a2b" text-anchor="end">2 to 4 kg (5 to 8 lb)</text><rect x="16" y="62" width="6" height="20" rx="4" fill="#8b5a2b"/><rect x="22" y="62" width="3" height="20" rx="4" fill="#8b5a2b" opacity=".45"/><text x="16" y="112" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Doe, average</text><text x="384" y="112" font-size="14" fill="#2f3a2b" text-anchor="end">about 57 kg (125 lb)</text><rect x="16" y="120" width="148" height="20" rx="4" fill="#8b5a2b"/><text x="16" y="170" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Buck, average</text><text x="384" y="170" font-size="14" fill="#2f3a2b" text-anchor="end">about 91 kg (200 lb)</text><rect x="16" y="178" width="237" height="20" rx="4" fill="#8b5a2b"/><text x="16" y="228" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Mature buck</text><text x="384" y="228" font-size="14" fill="#2f3a2b" text-anchor="end">91 to 136 kg (200 to 300 lb)</text><rect x="16" y="236" width="237" height="20" rx="4" fill="#8b5a2b"/><rect x="253" y="236" width="117" height="20" rx="4" fill="#8b5a2b" opacity=".45"/><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Idaho and Montana figures. BC deer: VERIFY.</text>
</svg>
