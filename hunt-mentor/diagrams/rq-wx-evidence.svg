<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 510" role="img" aria-label="Bar chart of evidence strength. Strong: snow and cold, the rut, hunting pressure, freeze up for ducks. Moderate: temperature. Mixed: rain and wind. Weak: barometric pressure. Near zero: moon phase.">
<rect x="0" y="0" width="400" height="510" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">What moves game: evidence strength</text>
<text x="14" y="64" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Snow and cold (mule deer move down)</text>
<rect x="14" y="70" width="335" height="20" rx="4" fill="#2f3a2b"/>
<text x="342.8" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="end">strong</text>
<text x="14" y="116" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">The rut (bucks travel more)</text>
<rect x="14" y="122" width="335" height="20" rx="4" fill="#2f3a2b"/>
<text x="342.8" y="137" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="end">strong</text>
<text x="14" y="168" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Hunting pressure</text>
<rect x="14" y="174" width="298" height="20" rx="4" fill="#2f3a2b"/>
<text x="317.6" y="189" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">strong</text>
<text x="14" y="220" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Freeze up (ducks leave)</text>
<rect x="14" y="226" width="298" height="20" rx="4" fill="#4a7fb0"/>
<text x="317.6" y="241" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">strong</text>
<text x="14" y="272" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Temperature (day to day)</text>
<rect x="14" y="278" width="186" height="20" rx="4" fill="#8a9a6b"/>
<text x="206.0" y="293" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">moderate</text>
<text x="14" y="324" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Rain, wind</text>
<rect x="14" y="330" width="112" height="20" rx="4" fill="#8b5a2b"/>
<text x="131.6" y="345" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">mixed</text>
<text x="14" y="376" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Barometric pressure</text>
<rect x="14" y="382" width="74" height="20" rx="4" fill="#e8590c"/>
<text x="94.4" y="397" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">weak</text>
<text x="14" y="428" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Moon phase</text>
<rect x="14" y="434" width="37" height="20" rx="4" fill="#e8590c"/>
<text x="57.2" y="449" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">near zero</text>
<text x="14" y="486" font-family="sans-serif" font-size="13" fill="#6b4f35" text-anchor="start">My rating of the studies in this session (Tip).</text>
<text x="14" y="502" font-family="sans-serif" font-size="13" fill="#6b4f35" text-anchor="start">Most collar data is on white tailed deer.</text>
</svg>
