<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 1: the hunter stands at the base of the tree and inspects the stand, straps and harness with a magnifier icon, every trip.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">1. Inspect stand, straps, harness</text><rect x="0" y="250" width="400" height="50" fill="#dfe6d3"/><rect x="180" y="40" width="30" height="210" fill="#6b4f35"/><rect x="210" y="120" width="60" height="8" fill="#23261f"/><line x1="210" y1="128" x2="196" y2="150" stroke="#23261f" stroke-width="3"/><g transform="translate(110 250) scale(1.1)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#e8590c"/><rect x="-6" y="-15" width="5" height="15" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" fill="#2f3a2b"/></g><circle cx="150" cy="150" r="22" fill="none" stroke="#e8590c" stroke-width="3"/><line x1="166" y1="166" x2="180" y2="180" stroke="#e8590c" stroke-width="4"/><text x="110" y="280" font-size="16" fill="#23261f" text-anchor="middle" font-weight="bold">every trip</text>
</svg>
