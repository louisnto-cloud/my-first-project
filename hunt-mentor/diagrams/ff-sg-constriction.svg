<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A shotgun barrel cut open. The last few centimetres, the choke, narrow the bore. Constriction in inches: cylinder .000, improved cylinder .010, modified .020, full .030, per one maker.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A choke squeezes the last few cm</text><rect x="20" y="110" width="240" height="80" rx="0" fill="#9a9e96" stroke="#2f3a2b" stroke-width="2"/><path d="M260 110 L330 124 L380 124 L380 176 L330 176 L260 190 Z" fill="#b6b9b3" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="124" width="240" height="52" rx="0" fill="#fffaf0" stroke="none" stroke-width="2"/><path d="M260 124 L330 132 L380 132 L380 168 L330 168 L260 176 Z" fill="#fffaf0" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="100" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">bore</text><text x="340" y="100" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">choke</text><line x1="355" y1="210" x2="355" y2="172" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><path d="M358.0 178.3 L355 172 L352.0 178.3" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="355" y="230" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">narrower</text><text x="150" y="240" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cylinder .000 in</text><text x="150" y="258" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">IC .010, Modified .020, Full .030</text>
</svg>
