  <text x="186" y="274" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Snow</text>
  <text x="186" y="292" font-size="13" fill="#2f3a2b" text-anchor="middle">3 to 3.4 kg</text>
  <g transform="translate(268 238.0) scale(1.0)"><path d="M-34 0 Q-38 -16 -18 -16 L12 -14 Q26 -10 24 2 Q18 12 -4 12 L-24 12 Q-36 8 -34 0Z" fill="#7a6a58"/><path d="M14 -12 Q18 -40 24 -46 L30 -44 Q24 -36 22 -10Z" fill="#2f3a2b"/><ellipse cx="28" cy="-48" rx="7" ry="5" fill="#2f3a2b"/><path d="M34 -49 L44 -46 L34 -44Z" fill="#2f3a2b"/><path d="M24 -50 Q28 -44 30 -46" stroke="#fff" stroke-width="3" fill="none"/></g>
