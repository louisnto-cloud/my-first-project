<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 304" font-family="sans-serif" role="img" aria-label="Geese drawn side by side to scale on one line. Brant, small, a coast bird. Cackling goose, 1 to 2 kilograms. Snow goose, about 3 to 3.4 kilograms, white with black wing tips. Canada goose, up to 5.45 kilograms, 1.35 to 5.45 by race, 80 percent. A swan, far bigger and all white, is protected, 90 percent.">
  <rect width="400" height="304" fill="#fffaf0"/>
  <text x="200" y="24" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Size check: side by side</text>
  <line x1="10" y1="250" x2="390" y2="250" stroke="#8a9a6b" stroke-width="3"/>
  <g transform="translate(42 243.4) scale(0.55)"><path d="M-34 0 Q-38 -16 -18 -16 L12 -14 Q26 -10 24 2 Q18 12 -4 12 L-24 12 Q-36 8 -34 0Z" fill="#2f3a2b"/><path d="M14 -12 Q18 -40 24 -46 L30 -44 Q24 -36 22 -10Z" fill="#2f3a2b"/><ellipse cx="28" cy="-48" rx="7" ry="5" fill="#2f3a2b"/><path d="M34 -49 L44 -46 L34 -44Z" fill="#2f3a2b"/><path d="M24 -50 Q28 -44 30 -46" stroke="#fff" stroke-width="3" fill="none"/></g>
