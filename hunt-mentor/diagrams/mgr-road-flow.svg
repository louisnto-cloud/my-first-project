<text x="48" y="318" font-size="16" font-weight="bold" fill="#2f3a2b">Get out and walk</text>
<text x="48" y="337" font-size="15" fill="#2f3a2b">Out of the road allowance: 15 m from the middle</text>
<circle cx="28.0" cy="377.5" r="12" fill="#e8590c" stroke="#fffaf0" stroke-width="1.5"/><text x="28" y="382.5" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">4</text>
