<circle cx="184.0" cy="112.0" r="11" fill="#e8590c" stroke="#fffaf0" stroke-width="1.5"/><text x="184" y="117" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">4</text>
