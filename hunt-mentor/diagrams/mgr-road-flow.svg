<text x="48" y="208" font-size="16" font-weight="bold" fill="#2f3a2b">Seen from the truck</text>
<text x="48" y="227" font-size="15" fill="#2f3a2b">Never hunt from it (item 22)</text>
<circle cx="28.0" cy="267.5" r="12" fill="#e8590c" stroke="#fffaf0" stroke-width="1.5"/><text x="28" y="272.5" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text>
