<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 486" font-family="sans-serif" role="img" aria-label="Five step flow for a grouse seen from the road, with a top down sketch: the truck parked at the road edge, a dashed road allowance line 15 metres from the middle of the road, the hunter walking past it and shooting away from the road. 1: seen from the truck; never hunt from a motor vehicle, item 22. 2: pull over safely, engine off; the gun stays unloaded in the vehicle, item 28. 3: get out and walk out of the road allowance, 15 metres from the middle of a road under three lanes. 4: load and check the backstop; never shoot across the road; no backstop, no shot. 5: shoot away from the road. Forest Service roads: whether the road allowance wording covers them is unclear, VERIFY, so keep the same habit.">
