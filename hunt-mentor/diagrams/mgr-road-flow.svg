<circle cx="28.0" cy="442.0" r="12" fill="#2f3a2b" stroke="#fffaf0" stroke-width="1.5"/><text x="28" y="447" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">5</text>
<text x="48" y="428" font-size="16" font-weight="bold" fill="#2f3a2b">Shoot away from the road</text>
<text x="48" y="447" font-size="15" fill="#2f3a2b">FSRs (Forest Service Roads): rule wording</text>
<text x="48" y="466" font-size="15" fill="#c0392b">unclear, VERIFY. Same habit</text>
