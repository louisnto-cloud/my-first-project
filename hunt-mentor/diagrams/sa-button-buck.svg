<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Doe or button buck, front view of two heads. Doe: smooth head between the ears and a longer face. Button buck, a male fawn: two small bumps where antlers will grow and a flatter, wider head. Both count as antlerless under the synopsis, page 3. Know the rule before you shoot.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Doe or button buck?</text><rect x="8" y="40" width="188" height="220" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><rect x="204" y="40" width="188" height="220" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><ellipse cx="102" cy="140" rx="34" ry="44" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="62" cy="100" rx="22" ry="10" transform="rotate(-30 62 100)" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="142" cy="100" rx="22" ry="10" transform="rotate(30 142 100)" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><circle cx="88" cy="136" r="4" fill="#23261f"/><circle cx="116" cy="136" r="4" fill="#23261f"/><ellipse cx="102" cy="174" rx="12" ry="8" fill="#23261f"/><path d="M80 160 Q102 168 124 160" stroke="#fff" stroke-width="4" fill="none"/><ellipse cx="298" cy="140" rx="34" ry="44" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="258" cy="100" rx="22" ry="10" transform="rotate(-30 258 100)" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="338" cy="100" rx="22" ry="10" transform="rotate(30 338 100)" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><circle cx="284" cy="136" r="4" fill="#23261f"/><circle cx="312" cy="136" r="4" fill="#23261f"/><ellipse cx="298" cy="174" rx="12" ry="8" fill="#23261f"/><path d="M276 160 Q298 168 320 160" stroke="#fff" stroke-width="4" fill="none"/><ellipse cx="286" cy="100" rx="6" ry="4" fill="#c9b79c" stroke="#23261f" stroke-width="2"/><ellipse cx="310" cy="100" rx="6" ry="4" fill="#c9b79c" stroke="#23261f" stroke-width="2"/><circle cx="298" cy="100" r="26" fill="none" stroke="#e8590c" stroke-width="3"/><text x="102" y="226" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Doe: smooth head</text><text x="298" y="226" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Button buck: 2 bumps</text><text x="102" y="248" font-size="14" fill="#23261f" text-anchor="middle">longer face</text><text x="298" y="248" font-size="14" fill="#23261f" text-anchor="middle">flatter, wider head</text><rect x="8" y="268" width="384" height="28" rx="6" fill="#2f3a2b"/><text x="200" y="288" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Both are antlerless (page 3). Know your rule.</text>
</svg>
