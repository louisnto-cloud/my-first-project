<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 382" font-family="sans-serif" role="img" aria-label="Sharing meat cards. Do: give meat away. Do not: sell it, trafficking in wildlife meat is an offence, 99 percent, synopsis page 11, item 7. Do: write a Record of Receipt when meat travels without you, 99 percent, page 15. Do: game birds other than ducks and geese, upland birds, keep one feathered wing on while transported. Do: share the good cuts and label the date and cut. Do: tell people how to cook it.">
<rect width="400" height="382" fill="#fffaf0"/>
<text x="200" y="28" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Sharing meat</text>
<rect x="10" y="44" width="186" height="104" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(38 74) scale(0.8)"><rect x="-16" y="-6" width="32" height="22" fill="#e8590c" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-18" y="-12" width="36" height="7" fill="#e8590c" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -12 V16" stroke="#fff" stroke-width="3"/><path d="M0 -12 Q-10 -22 -10 -14 Q-10 -10 0 -12 Q10 -22 10 -14 Q10 -10 0 -12" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="64" y="72" font-size="16" font-weight="bold" fill="#23261f">Give it away</text><circle cx="180" cy="60" r="11" fill="#8a9a6b"/><path d="M174 60 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="204" y="44" width="186" height="104" rx="10" fill="#fdf0e6" stroke="#e8590c" stroke-width="2"/><g transform="translate(232 74) scale(0.8)"><circle r="18" fill="#fff" stroke="#e8590c" stroke-width="3"/><path d="M6 -7 C4 -11 -7 -11 -7 -5 C-7 1 7 -1 7 6 C7 12 -5 12 -7 7 M0 -14 V14" fill="none" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><line x1="-12" y1="12" x2="12" y2="-12" stroke="#e8590c" stroke-width="3.5"/></g><text x="258" y="72" font-size="16" font-weight="bold" fill="#23261f">Sell it:</text><text x="258" y="92" font-size="16" font-weight="bold" fill="#23261f">trafficking is</text><text x="258" y="112" font-size="16" font-weight="bold" fill="#23261f">an offence</text><circle cx="374" cy="60" r="11" fill="#e8590c"/><path d="M369 55 l10 10 M379 55 l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<rect x="10" y="156" width="186" height="104" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(38 186) scale(0.8)"><path d="M-14 -18 H8 L16 -10 V18 H-14 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -6 H10 M-8 2 H10 M-8 10 H4" stroke="#8a9a6b" stroke-width="2.5"/></g><text x="64" y="184" font-size="16" font-weight="bold" fill="#23261f">Record of</text><text x="64" y="204" font-size="16" font-weight="bold" fill="#23261f">Receipt if it</text><text x="64" y="224" font-size="16" font-weight="bold" fill="#23261f">travels without</text><text x="64" y="244" font-size="16" font-weight="bold" fill="#23261f">you</text><circle cx="180" cy="172" r="11" fill="#8a9a6b"/><path d="M174 172 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="204" y="156" width="186" height="104" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(232 186) scale(0.8)"><path d="M-14 18 Q-8 -8 14 -18 Q8 4 -14 18 Z" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 18 L6 -8" stroke="#2f3a2b" stroke-width="1.5"/></g><text x="258" y="184" font-size="16" font-weight="bold" fill="#23261f">Upland</text><text x="258" y="204" font-size="16" font-weight="bold" fill="#23261f">birds: one</text><text x="258" y="224" font-size="16" font-weight="bold" fill="#23261f">feathered wing</text><text x="258" y="244" font-size="16" font-weight="bold" fill="#23261f">on</text><circle cx="374" cy="172" r="11" fill="#8a9a6b"/><path d="M368 172 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="10" y="268" width="186" height="104" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(38 298) scale(0.8)"><path d="M-18 -4 Q-14 -18 6 -14 Q22 -10 18 6 Q12 18 -6 14 Q-20 10 -18 -4 Z" fill="#c0504d" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -2 Q2 -8 10 0" stroke="#f5e0d8" stroke-width="3" fill="none"/><circle cx="8" cy="6" r="3" fill="#f5f0e0"/></g><text x="64" y="296" font-size="16" font-weight="bold" fill="#23261f">Share good</text><text x="64" y="316" font-size="16" font-weight="bold" fill="#23261f">cuts, label</text><text x="64" y="336" font-size="16" font-weight="bold" fill="#23261f">date and cut</text><circle cx="180" cy="284" r="11" fill="#8a9a6b"/><path d="M174 284 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="204" y="268" width="186" height="104" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(232 298) scale(0.8)"><ellipse cx="-4" cy="4" rx="16" ry="8" fill="#2f3a2b"/><path d="M12 2 L24 -2" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round"/><path d="M-10 -6 q3 -5 0 -10 M-3 -6 q3 -5 0 -10 M4 -6 q3 -5 0 -10" stroke="#e8590c" stroke-width="2" fill="none"/></g><text x="258" y="296" font-size="16" font-weight="bold" fill="#23261f">Tell them</text><text x="258" y="316" font-size="16" font-weight="bold" fill="#23261f">how to cook it</text><circle cx="374" cy="284" r="11" fill="#8a9a6b"/><path d="M368 284 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
