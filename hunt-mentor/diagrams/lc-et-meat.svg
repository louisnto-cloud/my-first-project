<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 346" font-family="sans-serif" role="img" aria-label="Sharing meat cards. Do: give meat away. Do not: sell it, trafficking in wildlife meat is an offence. Do: write a Record of Receipt when meat travels without you. Do: game birds other than ducks and geese keep one feathered wing on while transported. Do: share the good cuts and label the date and cut. Do: tell people how to cook it.">
<rect x="0" y="0" width="400" height="346" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Sharing meat</text><rect x="10" y="44" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(40 78) scale(0.9)"><rect x="-16" y="-6" width="32" height="22" fill="#e8590c" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-18" y="-12" width="36" height="7" fill="#e8590c" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -12 V16" stroke="#fff" stroke-width="3"/><path d="M0 -12 Q-10 -22 -10 -14 Q-10 -10 0 -12 Q10 -22 10 -14 Q10 -10 0 -12" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="179" cy="60" r="11" fill="#8a9a6b"/><path d="M173 60 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Give it away</text><rect x="203" y="44" width="185" height="92" rx="10" fill="#fdf0e6" stroke="#e8590c" stroke-width="2"/><g transform="translate(233 78) scale(0.9)"><circle r="18" fill="#fff" stroke="#e8590c" stroke-width="3"/><text x="0" y="8" font-size="24" font-weight="bold" fill="#2f3a2b" text-anchor="middle">$</text><line x1="-12" y1="12" x2="12" y2="-12" stroke="#e8590c" stroke-width="3.5"/></g><circle cx="372" cy="60" r="11" fill="#e8590c"/><path d="M367 55 l10 10 M377 55 l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="261" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Sell it:</text><text x="261" y="86" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">trafficking</text><text x="261" y="104" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">is an</text><text x="261" y="122" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">offence</text><rect x="10" y="144" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(40 178) scale(0.9)"><path d="M-14 -18 H8 L16 -10 V18 H-14 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -6 H10 M-8 2 H10 M-8 10 H4" stroke="#8a9a6b" stroke-width="2.5"/></g><circle cx="179" cy="160" r="11" fill="#8a9a6b"/><path d="M173 160 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="168" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Record of</text><text x="68" y="186" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Receipt if</text><text x="68" y="204" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">it travels</text><text x="68" y="222" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">without you</text><rect x="203" y="144" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(233 178) scale(0.9)"><path d="M-14 18 Q-8 -8 14 -18 Q8 4 -14 18 Z" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 18 L6 -8" stroke="#2f3a2b" stroke-width="1.5"/></g><circle cx="372" cy="160" r="11" fill="#8a9a6b"/><path d="M366 160 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="261" y="168" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Upland</text><text x="261" y="186" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">birds: one</text><text x="261" y="204" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">feathered</text><text x="261" y="222" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">wing on</text><rect x="10" y="244" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(40 278) scale(0.9)"><path d="M-18 -4 Q-14 -18 6 -14 Q22 -10 18 6 Q12 18 -6 14 Q-20 10 -18 -4 Z" fill="#c0504d" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -2 Q2 -8 10 0" stroke="#f5e0d8" stroke-width="3" fill="none"/><circle cx="8" cy="6" r="3" fill="#f5f0e0"/></g><circle cx="179" cy="260" r="11" fill="#8a9a6b"/><path d="M173 260 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="268" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Share good</text><text x="68" y="286" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">cuts, label</text><text x="68" y="304" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">date and cut</text><rect x="203" y="244" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(233 278) scale(0.9)"><ellipse cx="-4" cy="4" rx="16" ry="8" fill="#2f3a2b"/><path d="M12 2 L24 -2" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round"/><path d="M-10 -6 q3 -5 0 -10 M-3 -6 q3 -5 0 -10 M4 -6 q3 -5 0 -10" stroke="#e8590c" stroke-width="2" fill="none"/></g><circle cx="372" cy="260" r="11" fill="#8a9a6b"/><path d="M366 260 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="261" y="268" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Tell them</text><text x="261" y="286" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">how to cook</text><text x="261" y="304" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">it</text>
</svg>
