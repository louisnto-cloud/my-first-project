<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Flowchart, opinion. Time of day? Dawn or dusk: glass open slopes. Midday: stalk a bedded deer or still hunt. Snow on the ground: track or glass low slopes. Any time the wind is wrong for that slope, go to another slope.">
