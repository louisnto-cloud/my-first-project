<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 405" font-family="sans-serif" role="img" aria-label="Browse shrub key. First: is it green in winter? If yes, evergreen: a ground mat with red berries is kinnikinnick; spiny holly like leaflets is Oregon grape; glossy sticky leaves with 3 veins is snowbrush; small opposite toothed leaves is falsebox; big leathery leaves on the coast is salal. If no, are the leaves opposite? Yes: red stems means red osier dogwood, 3 to 5 lobes means Douglas maple, white berries means snowberry, scaly undersides means soopolallie. No, alternate: oval leaves toothed on the top half is saskatoon, wedge shaped with 3 teeth is bitterbrush, long narrow leaves is willow, round shaky leaves is aspen, thorns means rose or hawthorn.">
<rect width="400" height="405" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Name that browse shrub</text><rect x="130" y="40" width="140" height="40" rx="8" fill="#fff3e0" stroke="#e8590c" stroke-width="2"/><text x="200.0" y="65.25" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Green in winter?</text><line x1="160" y1="80" x2="90" y2="108" stroke="#2f3a2b" stroke-width="2"/><polygon points="90.0,108.0 96.7,100.6 100.0,108.7" fill="#2f3a2b"/><line x1="240" y1="80" x2="310" y2="108" stroke="#2f3a2b" stroke-width="2"/><polygon points="310.0,108.0 300.0,108.7 303.3,100.6" fill="#2f3a2b"/><text x="108" y="96" font-size="14" fill="#6b4f35" text-anchor="middle" font-weight="bold">yes</text><text x="292" y="96" font-size="14" fill="#6b4f35" text-anchor="middle" font-weight="bold">no</text><rect x="8" y="110" width="180" height="230" rx="8" fill="#eef2e4" stroke="#8a9a6b" stroke-width="2"/><text x="16" y="130" font-size="14" fill="#6b4f35" text-anchor="start">Ground mat, red berry:</text><text x="16" y="151" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">kinnikinnick</text><text x="16" y="172" font-size="14" fill="#6b4f35" text-anchor="start">Spiny holly leaflets:</text><text x="16" y="193" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Oregon grape</text><text x="16" y="214" font-size="14" fill="#6b4f35" text-anchor="start">Glossy, sticky, 3 veins:</text><text x="16" y="235" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">snowbrush</text><text x="16" y="256" font-size="14" fill="#6b4f35" text-anchor="start">Small, opposite, toothed:</text><text x="16" y="277" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">falsebox</text><text x="16" y="298" font-size="14" fill="#6b4f35" text-anchor="start">Big leathery, coast:</text><text x="16" y="319" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">salal</text><rect x="212" y="110" width="180" height="40" rx="8" fill="#fff3e0" stroke="#e8590c" stroke-width="2"/><text x="302.0" y="135.25" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Leaves opposite?</text><text x="240" y="168" font-size="14" fill="#6b4f35" text-anchor="start" font-weight="bold">yes:</text><text x="216" y="188" font-size="14" fill="#2f3a2b" text-anchor="start">red stems: dogwood</text><text x="216" y="207" font-size="14" fill="#2f3a2b" text-anchor="start">3 to 5 lobes: maple</text><text x="216" y="226" font-size="14" fill="#2f3a2b" text-anchor="start">white berries: snowberry</text><text x="216" y="245" font-size="14" fill="#2f3a2b" text-anchor="start">scaly under: soopolallie</text><text x="240" y="274" font-size="14" fill="#6b4f35" text-anchor="start" font-weight="bold">no:</text><text x="216" y="294" font-size="14" fill="#2f3a2b" text-anchor="start">toothed top half: saskatoon</text><text x="216" y="313" font-size="14" fill="#2f3a2b" text-anchor="start">wedge, 3 teeth: bitterbrush</text><text x="216" y="332" font-size="14" fill="#2f3a2b" text-anchor="start">long, narrow: willow</text><text x="216" y="351" font-size="14" fill="#2f3a2b" text-anchor="start">round, shaky: aspen</text><text x="216" y="370" font-size="14" fill="#2f3a2b" text-anchor="start">thorns: rose, hawthorn</text><text x="200.0" y="398" font-size="14" fill="#6b4f35" text-anchor="middle">Leaf traits from E Flora BC (85%)</text>
</svg>
