<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Map of natural track traps: where a creek and a dirt road cross, where a fence line meets the road, and creek and fence crossings. Tracks pile up at crossings.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Natural track traps</text>
<rect x="10" y="60" width="380" height="210" rx="10" fill="#e9efe0"/><path d="M10 200 Q140 170 220 200 T390 180" fill="none" stroke="#cbb994" stroke-width="18"/><text x="330" y="160" font-size="14" font-weight="bold" fill="#6b4f35" text-anchor="middle">dirt road</text><path d="M120 60 Q100 160 130 270" fill="none" stroke="#4a7fb0" stroke-width="8"/><text x="80" y="90" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">creek</text><line x1="250" y1="70" x2="250" y2="260" stroke="#6b4f35" stroke-width="2" stroke-dasharray="2 6"/><text x="285" y="90" font-size="14" font-weight="bold" fill="#6b4f35" text-anchor="middle">fence line</text><circle cx="124" cy="195" r="14" fill="none" stroke="#e8590c" stroke-width="3"/><circle cx="250" cy="190" r="14" fill="none" stroke="#e8590c" stroke-width="3"/><circle cx="124" cy="120" r="14" fill="none" stroke="#e8590c" stroke-width="3"/><circle cx="250" cy="130" r="14" fill="none" stroke="#e8590c" stroke-width="3"/><text x="200" y="292" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Circles: crossings where tracks pile up (Tip)</text>
</svg>
