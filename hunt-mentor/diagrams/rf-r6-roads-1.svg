<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" role="img" aria-label="Five cards. Seasonal Motor Vehicle Closed Areas in Region 6, 1 May to 15 November: on these routes, drive only within 400 metres of the road or trail, or 10 metres where stated. Jade and Boulder Mining Access Road in 6-19, from Highway 37 to the height of land at Cariboo Pass. Middle Range Road in 6-19, from Jade and Boulder Road to 400 metres from the trail ends. Goldpan Road in 6-23, from Highway 37 to where it crosses the Little Eagle River. Adsit Lake Road in 6-24, to 400 metres beyond the end of both roads, including the road to Porcupine Lake." font-family="sans-serif">
<rect x="0" y="0" width="400" height="430" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Seasonal road closures, part 1</text>
<rect x="6" y="40" width="190" height="150" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<path d="M6 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#4a7fb0"/>
<text x="101" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">May 1 to Nov 15</text>
<rect x="15.0" y="106" width="20" height="12" fill="#2f3a2b"/><path d="M35.0 110 h7 l4 5 v3 h-11 z" fill="#2f3a2b"/><circle cx="21.0" cy="120" r="3.5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/><circle cx="39.0" cy="120" r="3.5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/>
<text x="52" y="106" font-size="14" fill="#23261f" text-anchor="start">On these routes,</text>
<text x="52" y="124" font-size="14" fill="#23261f" text-anchor="start">drive only within</text>
<text x="52" y="142" font-size="14" fill="#23261f" text-anchor="start">400 m of the road,</text>
<text x="52" y="160" font-size="14" fill="#23261f" text-anchor="start">or 10 m where</text>
<text x="52" y="178" font-size="14" fill="#23261f" text-anchor="start">stated</text>
<rect x="204" y="40" width="190" height="150" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<path d="M204 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#4a7fb0"/>
<text x="299" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Jade, Boulder Mining</text>
<text x="299" y="76" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Access Road</text>
<text x="212" y="106" font-size="14" fill="#23261f" text-anchor="start">MU 6-19. Hwy 37 to the</text>
<text x="212" y="124" font-size="14" fill="#23261f" text-anchor="start">height of land at</text>
<text x="212" y="142" font-size="14" fill="#23261f" text-anchor="start">Cariboo Pass</text>
<rect x="6" y="198" width="190" height="96" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<path d="M6 208 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#4a7fb0"/>
<text x="101" y="216" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Middle Range Road</text>
<text x="14" y="246" font-size="14" fill="#23261f" text-anchor="start">MU 6-19. From Jade,</text>
<text x="14" y="264" font-size="14" fill="#23261f" text-anchor="start">Boulder Road to 400 m</text>
<text x="14" y="282" font-size="14" fill="#23261f" text-anchor="start">from the trail ends</text>
<rect x="204" y="198" width="190" height="96" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<path d="M204 208 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#4a7fb0"/>
<text x="299" y="216" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Goldpan Road</text>
<text x="212" y="246" font-size="14" fill="#23261f" text-anchor="start">MU 6-23. Hwy 37 to the</text>
<text x="212" y="264" font-size="14" fill="#23261f" text-anchor="start">Little Eagle River</text>
<text x="212" y="282" font-size="14" fill="#23261f" text-anchor="start">crossing</text>
<rect x="6" y="302" width="190" height="114" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<path d="M6 312 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#4a7fb0"/>
<text x="101" y="320" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Adsit Lake Road</text>
<text x="14" y="350" font-size="14" fill="#23261f" text-anchor="start">MU 6-24. To 400 m</text>
<text x="14" y="368" font-size="14" fill="#23261f" text-anchor="start">beyond both road ends,</text>
<text x="14" y="386" font-size="14" fill="#23261f" text-anchor="start">Porcupine Lake road</text>
<text x="14" y="404" font-size="14" fill="#23261f" text-anchor="start">included</text>
</svg>
