<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 443" font-family="sans-serif" role="img" aria-label="Seasonal Motor Vehicle Closed Areas in Region 6, synopsis page 49. From 1 May to 15 November, on these routes, drive only within 400 metres of the road or trail, or 10 metres where stated. Jade and Boulder Mining Access Road in Management Unit 6-19, from Highway 37 to the height of land at Cariboo Pass. Middle Range Road in 6-19, from Jade and Boulder Road to 400 metres from the trail ends. Goldpan Road in 6-23, from Highway 37 to where it crosses the Little Eagle River. Adsit Lake Road in 6-24, to 400 metres beyond the end of both roads, including the road to Porcupine Lake.">
