 x="210" y="100" width="2" height="2" fill="#2B3034"/><rect x="176" y="105" width="36" height="8" rx="1.5" fill="#2B3034"/><rect x="176" y="106" width="36" height="6" fill="#C9CFD3"/><rect x="128" y="104" width="13" height="13" rx="3" fill="#2B3034"/><path d="M153 111 L148 131" stroke="#2B3034" stroke-width="5" stroke-linecap="round"/><circle cx="147" cy="136" r="6.5" fill="#2B3034"/><rect x="130" y="119" width="22" height="6" rx="2" fill="#2B3034"/><circle cx="146" cy="122" r="2.6" fill="#FFFFFF"/><rect x="131" y="117.5" width="9" height="9" rx="2" fill="#D8B23A" stroke="#2B3034" stroke-width=".8"/><path d="M158 141 Q156 160 176 160 L196 160 Q204 160 204 141" stroke="#2B3034" stroke-width="3" fill="none"/><path d="M178 141 Q183 150 176 156" stroke="#2B3034" stroke-width="3.5" fill="none" stroke-linecap="round"/><rect x="208" y="138" width="22" height="20" rx="2" fill="#2B3034"/><rect x="231" y="139" width="4" height="9" rx="1" fill="#D8B23A"/><circle cx="70" cy="158" r="2.6" fill="#2B3034"/><circle cx="300" cy="138" r="2.6" fill="#2B3034"/></g></g><rect x="208" y="44" width="180" height="140" rx="8" fill="none" stroke="#1F3D2B" stroke-width="1.5"/><text x="102" y="206" font-size="16" font-weight="bold" text-anchor="middle" fill="#FF6A13">Cocked</text><text x="102" y="228" font-size="15" font-weight="normal" text-anchor="middle" fill="#17201A">Pin sticks out</text><text x="102" y="248" font-size="15" font-weight="normal" text-anchor="middle" fill="#17201A">See it, feel it</text><text x="298" y="206" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Not cocked</text><text x="298" y="228" font-size="15" font-weight="normal" text-anchor="middle" fill="#17201A">Flush with plug</text><text x="298" y="248" font-size="15" font-weight="normal" text-anchor="middle" fill="#17201A">Store it this way</text><g data-tip="Cocking indicator|When the striker is cocked its rear part sticks out past the bolt plug. You can check by sight and by touch, even in the dark."><circle cx="30" cy="62" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="67" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text></g><rect x="8" y="266" width="384" height="34" rx="9" fill="#1F3D2B"/><text x="200" y="288.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Cocked is not loaded. Still PROVE it.</text></svg>
