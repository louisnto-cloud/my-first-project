<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="sans-serif">
  <rect x="0" y="0" width="400" height="330" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">6 point bull elk: count tines on ONE antler</text>
  <text x="200" y="46" font-size="14" fill="#6b4f35" text-anchor="middle">Brow tine counts. Each tine at least 2.5 cm and longer than wide.</text>
  <line x1="200" y1="56" x2="200" y2="296" stroke="#8a9a6b" stroke-width="2" stroke-dasharray="6 6" fill="none"/>

  <!-- LEFT: 6 point antler -->
  <text x="100" y="74" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">6 point: legal</text>
  <g stroke="#6b4f35" stroke-width="7" stroke-linecap="round" fill="none">
    <!-- main beam sweeping up and back -->
    <path d="M70 270 C72 220 90 170 120 130 C140 104 160 92 176 86"/>
    <!-- tines -->
    <path d="M74 240 L48 226"/>
    <path d="M80 206 L54 186"/>
    <path d="M96 170 L76 142"/>
    <path d="M118 134 L112 100"/>
    <path d="M150 104 L156 72"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#fffaf0" text-anchor="middle">
    <circle cx="44" cy="224" r="8" fill="#e8590c" stroke="#23261f" stroke-width="1.5"/><text x="44" y="228">1</text>
    <circle cx="50" cy="184" r="8" fill="#e8590c" stroke="#23261f" stroke-width="1.5"/><text x="50" y="188">2</text>
    <circle cx="72" cy="138" r="8" fill="#e8590c" stroke="#23261f" stroke-width="1.5"/><text x="72" y="142">3</text>
    <circle cx="110" cy="94" r="8" fill="#e8590c" stroke="#23261f" stroke-width="1.5"/><text x="110" y="98">4</text>
    <circle cx="158" cy="66" r="8" fill="#e8590c" stroke="#23261f" stroke-width="1.5"/><text x="158" y="70">5</text>
    <circle cx="184" cy="82" r="8" fill="#e8590c" stroke="#23261f" stroke-width="1.5"/><text x="184" y="86">6</text>
  </g>
  <text x="44" y="248" font-size="11" fill="#6b4f35" text-anchor="middle">brow</text>
  <text x="184" y="104" font-size="11" fill="#6b4f35" text-anchor="middle">beam tip</text>
  <text x="100" y="290" font-size="13" fill="#23261f" text-anchor="middle">Main beam tip counts as a tine</text>

  <!-- RIGHT: 5 point antler -->
  <text x="300" y="74" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">5 point: NOT legal</text>
  <g stroke="#6b4f35" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M270 270 C272 220 290 170 320 130 C340 104 360 92 376 86"/>
    <path d="M274 240 L248 226"/>
    <path d="M280 206 L254 186"/>
    <path d="M296 170 L276 142"/>
    <path d="M350 104 L356 72"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#fffaf0" text-anchor="middle">
    <circle cx="244" cy="224" r="8" fill="#8a9a6b" stroke="#23261f" stroke-width="1.5"/><text x="244" y="228">1</text>
    <circle cx="250" cy="184" r="8" fill="#8a9a6b" stroke="#23261f" stroke-width="1.5"/><text x="250" y="188">2</text>
    <circle cx="272" cy="138" r="8" fill="#8a9a6b" stroke="#23261f" stroke-width="1.5"/><text x="272" y="142">3</text>
    <circle cx="358" cy="66" r="8" fill="#8a9a6b" stroke="#23261f" stroke-width="1.5"/><text x="358" y="70">4</text>
    <circle cx="384" cy="82" r="8" fill="#8a9a6b" stroke="#23261f" stroke-width="1.5"/><text x="384" y="86">5</text>
  </g>
  <text x="300" y="290" font-size="13" fill="#23261f" text-anchor="middle">A 5 by 6 bull is legal: one side is enough</text>
  <text x="200" y="316" font-size="13" fill="#e8590c" font-weight="bold" text-anchor="middle">Can't count every tine clearly? Then it is not a 6 point. Do not shoot.</text>
</svg>
