<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 482" font-family="sans-serif" role="img" aria-label="Two bull elk heads in side view with the antler drawn and its tines numbered. Count ONE antler. Left: 6 point, legal: brow tine 1, then tines 2 to 5 up the beam, and the beam tip is tine 6. The brow tine counts and the beam tip counts as a tine. Right: the same antler missing one tine, 5 point, NOT legal. Each tine is at least 2.5 centimetres and longer than it is wide. 5 on one side and 6 on the other is legal. Cannot count every tine clearly? Then it is not a 6 point. Do not shoot.">
