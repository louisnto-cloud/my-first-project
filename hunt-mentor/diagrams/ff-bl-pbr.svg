<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A green pipe 15 cm tall stands for the vital zone. With a 100 m zero the 150 grain bullet stays inside the pipe from the muzzle to about 170 m, so you can hold dead centre out to there. A 200 m zero stretches that to about 235 m.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Point blank: hold centre, stay in the pipe</text><rect x="30" y="120" width="350" height="60" rx="6" fill="#d8ead7" stroke="#2f6e3b" stroke-width="2"/><line x1="30" y1="150" x2="380" y2="150" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M30.0 161.4 L95.0 147.3 L160.0 150.0 L225.0 162.6 L251.0 168.9 L270.5 174.9 L290.0 189.6 L355.0 232.8" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="251.0" y1="110" x2="251.0" y2="200" stroke="#b3261e" stroke-width="2" stroke-linecap="round"/><text x="251.0" y="104" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle">170 m</text><text x="120" y="112" font-size="14" font-weight="bold" fill="#2f6e3b" text-anchor="middle">15 cm vital pipe</text><text x="300" y="220" font-size="14" fill="#2f3a2b" text-anchor="middle">100 m zero:</text><text x="300" y="238" font-size="14" fill="#2f3a2b" text-anchor="middle">centre hold to</text><text x="300" y="256" font-size="14" fill="#2f3a2b" text-anchor="middle">about 170 m</text><text x="200.0" y="286" font-size="14" fill="#2f3a2b" text-anchor="middle">200 m zero stretches it to about 235 m</text>
</svg>
