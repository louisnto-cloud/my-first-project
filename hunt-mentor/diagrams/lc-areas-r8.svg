<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 404" font-family="sans-serif" role="img" aria-label="Region 8 bar charts, average harvest a year by MU (Management Unit). Quail: MU 8-1 Oliver and Osoyoos about 249, every other MU a handful each. Mule deer: 8-5 Princeton 268, 8-8 Summerland and Peachland 266, 8-6 173, 8-1 163, 8-11 158, 8-10 Kelowna 151. MU 8-1 is mostly private land, so permission is the game. Lean.">
