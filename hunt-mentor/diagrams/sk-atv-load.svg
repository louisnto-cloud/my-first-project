<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Game bags strapped on the front and rear racks of an all terrain vehicle, meat kept away from the exhaust. Drive slowly with no side hills. Take the rifle with you, never leave it on a parked quad.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">Meat on the ATV rack</text><g transform="translate(200 200)"><circle cx="-60" cy="40" r="26" fill="#2f3a2b"/><circle cx="60" cy="40" r="26" fill="#2f3a2b"/><circle cx="-60" cy="40" r="10" fill="#9a9a8a"/><circle cx="60" cy="40" r="10" fill="#9a9a8a"/><path d="M-96 18 L-70 -4 L70 -4 L98 18 L90 30 L-90 30 Z" fill="#4a7fb0" stroke="#23261f" stroke-width="2.5"/><rect x="-14" y="-16" width="44" height="14" rx="5" fill="#23261f"/><path d="M-56 -4 L-50 -32 M-62 -32 L-38 -32" stroke="#23261f" stroke-width="4" stroke-linecap="round"/><rect x="-100" y="-12" width="44" height="8" fill="none" stroke="#23261f" stroke-width="2.5"/><rect x="56" y="-12" width="44" height="8" fill="none" stroke="#23261f" stroke-width="2.5"/></g><path d="M108 126 q 22.0 -8 44 0 l -3 50 q -19.0 7 -38 0 Z" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><path d="M156 126 q 22.0 -8 44 0 l -3 50 q -19.0 7 -38 0 Z" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><path d="M250 126 q 22.0 -8 44 0 l -3 50 q -19.0 7 -38 0 Z" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><path d="M298 126 q 22.0 -8 44 0 l -3 50 q -19.0 7 -38 0 Z" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><path d="M100 166 L350 166" stroke="#e8590c" stroke-width="3" stroke-dasharray="6 4"/><text x="225" y="108" font-size="14" font-weight="bold" text-anchor="middle" fill="#e8590c">straps over every bag</text><rect x="300" y="222" width="22" height="8" fill="#23261f"/><text x="318" y="258" font-size="13" font-weight="bold" fill="#b3261e">exhaust:</text><text x="318" y="274" font-size="13" font-weight="bold" fill="#b3261e">meat away</text><text x="200" y="56" font-size="15" font-weight="bold" text-anchor="middle" fill="#23261f">Low speed. No side hills (Tip).</text><text x="200" y="76" font-size="13" text-anchor="middle" fill="#2f3a2b">The rifle goes with you, not on a parked quad</text>
</svg>
