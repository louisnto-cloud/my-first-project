<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif" role="img" aria-label="Parts of a bolt action rifle, like your Tikka T3x and CZ 457. From the back: recoil pad, stock, grip, trigger and trigger guard, safety beside the bolt, bolt handle, receiver with the ejection port and chamber, detachable magazine underneath, scope rail on top, barrel, and muzzle at the front.">
  <rect width="400" height="320" fill="#fffaf0"/>
  <text x="200" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Parts of a bolt rifle</text>
  <path d="M24 136 L120 128 L130 128 L140 156 L240 152 L240 164 L130 170 L112 182 L98 174 L24 194 Z" fill="#8b5a2b" stroke="#2f3a2b" stroke-width="2"/>
  <rect x="14" y="134" width="12" height="62" rx="3" fill="#2f3a2b"/>
  <rect x="120" y="118" width="84" height="22" fill="#6b6f68" stroke="#2f3a2b" stroke-width="2"/>
  <rect x="122" y="110" width="80" height="8" fill="#2f3a2b"/>
  <rect x="146" y="122" width="34" height="10" fill="#fffaf0" stroke="#2f3a2b"/>
  <path d="M138 140 l-8 20" stroke="#2f3a2b" stroke-width="5"/><circle cx="128" cy="164" r="6" fill="#2f3a2b"/>
  <rect x="122" y="124" width="8" height="8" fill="#e8590c"/>
  <rect x="204" y="122" width="182" height="9" fill="#6b6f68" stroke="#2f3a2b" stroke-width="1"/>
  <rect x="160" y="156" width="28" height="22" rx="2" fill="#2f3a2b"/>
  <path d="M136 170 q 2 16 22 14 l2 -14" fill="none" stroke="#2f3a2b" stroke-width="3"/>
  <path d="M148 170 q -2 8 3 12" stroke="#e8590c" stroke-width="3" fill="none"/>
  <circle cx="190" cy="127" r="3" fill="#e8590c"/>
  <g stroke="#2f3a2b" stroke-width="1.2">
    <line x1="70" y1="140" x2="70" y2="66"/><line x1="162" y1="110" x2="162" y2="66"/><line x1="163" y1="124" x2="250" y2="96"/><line x1="190" y1="124" x2="300" y2="66"/><line x1="380" y1="126" x2="380" y2="96"/>
    <line x1="20" y1="196" x2="20" y2="236"/><line x1="128" y1="168" x2="120" y2="218"/><line x1="126" y1="128" x2="40" y2="100"/><line x1="150" y1="180" x2="150" y2="276"/><line x1="174" y1="178" x2="210" y2="236"/><line x1="290" y1="131" x2="290" y2="276"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">
    <text x="70" y="60">Stock</text><text x="150" y="60">Scope rail</text><text x="250" y="90">Ejection port</text><text x="314" y="60" fill="#e8590c">Chamber</text><text x="370" y="90">Muzzle</text>
    <text x="40" y="96" fill="#e8590c">Safety</text>
    <text x="4" y="252" text-anchor="start">Recoil pad</text><text x="120" y="232">Bolt handle</text><text x="150" y="292" fill="#e8590c">Trigger</text><text x="226" y="252">Magazine</text><text x="300" y="292">Barrel</text>
  </g>
  <text x="200" y="314" font-size="14" fill="#2f3a2b" text-anchor="middle">Bolt out = rifle cannot fire. Tikka and CZ: same layout</text>
</svg>
