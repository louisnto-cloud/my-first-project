<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="How to read a BEC zone code, using IDFxh2. IDF is the zone, Interior Douglas fir. The subzone letters xh mean very dry and hot. The number 2 is the variant, a local version of the subzone. First subzone letter is how wet: x very dry, d dry, m moist, w wet, v very wet. Second letter in the Interior is how warm: h hot, w warm, m mild, k cool, c cold.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Read a zone code: IDFxh2</text><rect x="20" y="44" width="110" height="60" rx="8" fill="#cdd8a6" stroke="#2f3a2b" stroke-width="2"/><text x="75.0" y="83.1" font-size="26" fill="#2f3a2b" text-anchor="middle" font-weight="bold">IDF</text><rect x="145" y="44" width="110" height="60" rx="8" fill="#f4e3c3" stroke="#2f3a2b" stroke-width="2"/><text x="200.0" y="83.1" font-size="26" fill="#2f3a2b" text-anchor="middle" font-weight="bold">xh</text><rect x="270" y="44" width="110" height="60" rx="8" fill="#e7e0f0" stroke="#2f3a2b" stroke-width="2"/><text x="325.0" y="83.1" font-size="26" fill="#2f3a2b" text-anchor="middle" font-weight="bold">2</text><text x="75" y="124" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Zone</text><text x="75" y="142" font-size="14" fill="#2f3a2b" text-anchor="middle">Interior</text><text x="75" y="158" font-size="14" fill="#2f3a2b" text-anchor="middle">Douglas fir</text><text x="200" y="124" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Subzone</text><text x="200" y="142" font-size="14" fill="#2f3a2b" text-anchor="middle">x = very dry</text><text x="200" y="158" font-size="14" fill="#2f3a2b" text-anchor="middle">h = hot</text><text x="325" y="124" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Variant</text><text x="325" y="142" font-size="14" fill="#2f3a2b" text-anchor="middle">local version</text><text x="325" y="158" font-size="14" fill="#2f3a2b" text-anchor="middle">of the subzone</text><rect x="14" y="172" width="372" height="118" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="24" y="194" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">1st letter: how wet</text><text x="24" y="214" font-size="14" fill="#2f3a2b" text-anchor="start">x very dry  d dry  m moist</text><text x="24" y="232" font-size="14" fill="#2f3a2b" text-anchor="start">w wet  v very wet</text><text x="24" y="256" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">2nd letter: how warm (Interior)</text><text x="24" y="276" font-size="14" fill="#2f3a2b" text-anchor="start">h hot  w warm  m mild  k cool  c cold</text>
</svg>
