<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 514" font-family="sans-serif" role="img" aria-label="Map of Scenario A, drawn to scale. Your brother&#x27;s 20 acre property with his house and a barn, and the neighbour&#x27;s house just outside it. Each building has a red 100 metre ring: no hunting or shooting within 100 m (109 yd) of a dwelling or occupied farm building (99%). The rings cover much of the 20 acres. Behind the property line lies Crown land, the real option. A centre line splits it: your side on the left, his side on the right. Shots go only into the hillside backstop at the top. Scale bar 0, 50, 100 metres.">
