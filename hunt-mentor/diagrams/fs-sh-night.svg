<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Night routine for an unplanned night: eat before sleep, pee before sleep, put on dry socks and dry wet ones inside your shirt, keep the toque on all night, keep boots in a bag so they do not freeze, and when cold, clench muscles, eat and move.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Night routine</text><rect x="20" y="46" width="112" height="90" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="76" y="86" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Eat</text><text x="76" y="110" font-size="14" fill="#2f3a2b" text-anchor="middle">before sleep</text><rect x="145" y="46" width="112" height="90" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="201" y="86" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pee</text><text x="201" y="110" font-size="14" fill="#2f3a2b" text-anchor="middle">before sleep</text><rect x="270" y="46" width="112" height="90" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="326" y="86" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Dry socks</text><text x="326" y="110" font-size="14" fill="#2f3a2b" text-anchor="middle">wet in shirt</text><rect x="20" y="150" width="112" height="90" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="76" y="190" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Toque on</text><text x="76" y="214" font-size="14" fill="#2f3a2b" text-anchor="middle">all night</text><rect x="145" y="150" width="112" height="90" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="201" y="190" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Boots</text><text x="201" y="214" font-size="14" fill="#2f3a2b" text-anchor="middle">in a bag, not out</text><rect x="270" y="150" width="112" height="90" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="326" y="190" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cold?</text><text x="326" y="214" font-size="14" fill="#2f3a2b" text-anchor="middle">eat, move</text><text x="200" y="285" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Small habits, warmer night</text>
</svg>
