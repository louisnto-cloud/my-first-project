<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 572" font-family="sans-serif" role="img" aria-label="Firearm and hunting closures in Region 7B, part 2. No hunting: Lower Burnt River, new, MU 7-22, on either side of the Lower Burnt Forest Service Road between kilometre 20 and 22.2, north bank of the Burnt River to 400 metres from the road centre line, Map H10; Fontas, the map is H24 by its caption though H21 is printed, 95%. No shooting or hunting: Radar Lake, within 200 metres of the high water mark; Stone Mountain Park, within 1 mile of the Alaska Highway. No firearms: Dokie subdivision, MUs 7-22 and 7-31, Map H9. Firearms using shot only: One Mile Pasture, 1 June to 15 October; Map H3 is captioned One Island Pasture, name to verify.">
