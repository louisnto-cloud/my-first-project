<rect x="112.0" y="368" width="14" height="14" rx="3" fill="#e8590c"/>
<text x="130" y="380" font-size="14" fill="#23261f" text-anchor="start">No shooting</text>
<rect x="225.4" y="368" width="14" height="14" rx="3" fill="#8a9a6b"/>
<text x="243" y="380" font-size="14" fill="#23261f" text-anchor="start">Shot only or bow</text>
</svg>
