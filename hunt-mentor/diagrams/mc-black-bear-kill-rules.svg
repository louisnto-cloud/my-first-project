<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Rules at a dead black bear, in order, from the Rule Book. 1: cancel the species licence before you handle it. 2: you may remove the gall bladder and leave it at the kill site. 3: if you moved the bear whole, dispose of the gut pile including the gall within 48 hours. 4: the edible portions must go home or to a meat cutter; the meat rule applies to black bear. 5: never sell or trade paws, galls or genitalia. 6: taking a bear or its parts out of Canada needs a CITES export permit.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">At the bear: rules in order</text><rect x="10" y="50" width="380" height="34" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><circle cx="30" cy="67" r="12" fill="#2f3a2b"/><text x="30" y="72" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="50" y="72" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Cancel licence before you touch it</text><text x="384" y="72" font-size="14" fill="#2f3a2b" text-anchor="end">99%</text><rect x="10" y="90" width="380" height="34" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><circle cx="30" cy="107" r="12" fill="#2f3a2b"/><text x="30" y="112" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="50" y="112" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Gall bladder: leave it at the kill site</text><text x="384" y="112" font-size="14" fill="#2f3a2b" text-anchor="end">99%</text><rect x="10" y="130" width="380" height="34" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><circle cx="30" cy="147" r="12" fill="#2f3a2b"/><text x="30" y="152" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="50" y="152" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Gut pile with gall moved? Gone in 48 h</text><text x="384" y="152" font-size="14" fill="#2f3a2b" text-anchor="end">99%</text><rect x="10" y="170" width="380" height="34" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><circle cx="30" cy="187" r="12" fill="#2f3a2b"/><text x="30" y="192" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="50" y="192" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Edible portions go home. Meat counts</text><text x="384" y="192" font-size="14" fill="#2f3a2b" text-anchor="end">99%</text><rect x="10" y="210" width="380" height="34" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><circle cx="30" cy="227" r="12" fill="#2f3a2b"/><text x="30" y="232" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="50" y="232" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Never sell paws, galls, parts</text><text x="384" y="232" font-size="14" fill="#2f3a2b" text-anchor="end">99%</text><rect x="10" y="250" width="380" height="34" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><circle cx="30" cy="267" r="12" fill="#2f3a2b"/><text x="30" y="272" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">6</text><text x="50" y="272" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Leaving Canada with it? CITES permit</text><text x="384" y="272" font-size="14" fill="#2f3a2b" text-anchor="end">99%</text>
</svg>
