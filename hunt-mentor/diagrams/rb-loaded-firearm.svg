<text x="332" y="327" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">clipped in</text>
<rect x="8" y="344" width="188" height="84" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="20" y="369" font-size="16" font-weight="bold" fill="#c0392b">LOADED, even with</text>
