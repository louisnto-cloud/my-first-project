<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 436" font-family="sans-serif" role="img" aria-label="Side view of a scoped bolt action rifle, cut away to show a round in the chamber and rounds in the magazine. The four places that make it loaded under the BC definition: 1, the chamber; 2, a fixed magazine inside the firearm; 3, a magazine with a hinged floor plate; 4, a detachable magazine clipped in or inside. Three close ups show the magazine types. A round in any one of them means the firearm is loaded, even with the safety on, the bolt open or the action broken. A magazine taken out and carried in your pocket is not a loaded firearm, which is this app&#x27;s reading.">
<rect width="400" height="436" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">What makes a firearm loaded</text>
<text x="200" y="51" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">A round in ANY one spot = loaded</text>
