" height="5" fill="#3a3f44"/><rect x="170" y="-12" width="8" height="5" fill="#3a3f44"/><path d="M104 -25 L118 -22 L184 -22 L202 -26 L206 -26 L206 -11 L202 -11 L184 -15 L118 -15 L104 -12z" fill="#22262a"/><rect x="145" y="-26" width="8" height="5" rx="1" fill="#22262a"/><path d="M120 -20 L180 -20" stroke="#4d555c" stroke-width="1.4"/></g>
