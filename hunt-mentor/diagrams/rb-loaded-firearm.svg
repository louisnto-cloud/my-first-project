<text x="68" y="308" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fixed magazine</text>
<text x="68" y="327" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">inside</text>
