<line x1="229" y1="103.96" x2="240.147" y2="93" stroke="#e8590c" stroke-width="1.8"/><rect x="232.1" y="66.0" width="99.7" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
