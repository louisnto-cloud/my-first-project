<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Sun and shade tool: a low morning sun lights the slopes facing it bright yellow while slopes facing away stay dark in shade. Tip: on cold mornings deer often bed where first sun hits.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0" stroke="none" stroke-width="2"/><path d="M0 250 L120 110 L200 180 L300 90 L400 250 Z" fill="#b8c4a4" stroke="#8b5a2b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M0 250 L120 110 L120 250 Z M200 180 L300 90 L300 250 L200 250 Z" fill="#4d5a40" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" opacity=".6"/><path d="M120 110 L200 180 L200 250 L120 250 Z M300 90 L400 250 L300 250 Z" fill="#f2c70c" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" opacity=".5"/><circle cx="370" cy="40" r="18" fill="#f2c70c" stroke="none" stroke-width="2"/><text x="330" y="45" font-family="sans-serif" font-size="14" fill="#6b4f35" text-anchor="end" font-weight="bold">8 am, sun in the SE</text><text x="14" y="280" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Bright slopes face the sun. Dark ones are in shade.</text><text x="14" y="24" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Sun and shade</text>
</svg>
