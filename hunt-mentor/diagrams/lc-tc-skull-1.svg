<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Skull step 1: skin the head, remove the eyes, tongue and jaw muscles and as much meat as you can, and flush the brain out. Common practice, a tip.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" fill="#dfe6d3" opacity=".35"/><circle cx="28" cy="30" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="2.5"/><text x="28" y="35" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">1</text><text x="54" y="37" font-size="19" font-weight="bold" fill="#23261f" text-anchor="start">Strip the skull</text><g transform="translate(200 140) scale(3.0)"><path d="M-12 -12 Q0 -20 12 -12 L8 14 Q0 20 -8 14 Z" fill="#f5f0e0" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-5" cy="-4" r="3" fill="#2f3a2b"/><circle cx="5" cy="-4" r="3" fill="#2f3a2b"/><path d="M-10 -14 Q-20 -24 -14 -30 M-15 -22 l-6 -2 M10 -14 Q20 -24 14 -30 M15 -22 l6 -2" stroke="#6b4f35" stroke-width="3" fill="none" stroke-linecap="round"/></g><g transform="translate(300 110) scale(1.4)"><path d="M-20 6 L6 -4 Q16 -8 20 -12 Q18 2 6 6 Z" fill="#cfd6bf" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-24" y="2" width="14" height="9" rx="3" fill="#8b5a2b" transform="rotate(-20 -17 6)"/></g><text x="200" y="250" font-size="15" fill="#23261f" text-anchor="middle">Skin it. Eyes, tongue, jaw muscle out. Flush</text><text x="200" y="269" font-size="15" fill="#23261f" text-anchor="middle">the brain.</text>
</svg>
