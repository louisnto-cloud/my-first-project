<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Fence step 2, seen from above: slide the unloaded rifle under the fence and lay it on the far side, muzzle pointing away from where you will cross.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect y="36" width="400" height="230" fill="#dfe6d3" opacity=".6"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Slide it under</text>
  <line x1="200" y1="40" x2="200" y2="262" stroke="#6b4f35" stroke-width="4" stroke-dasharray="2 10"/>
  <g fill="#6b4f35"><rect x="194" y="50" width="12" height="12"/><rect x="194" y="150" width="12" height="12"/><rect x="194" y="250" width="12" height="12"/></g>
  <text x="208" y="54" font-size="14" fill="#2f3a2b">Fence</text>
  <line x1="240" y1="230" x2="240" y2="90" stroke="#8b5a2b" stroke-width="9" stroke-linecap="round"/><line x1="240" y1="160" x2="240" y2="90" stroke="#6b6f68" stroke-width="5"/><circle cx="240" cy="86" r="9" fill="none" stroke="#e8590c" stroke-width="3"/><text x="254" y="94" font-size="14" font-weight="bold" fill="#e8590c">Muzzle</text><circle cx="150" cy="200" r="14" fill="#2f3a2b"/><path d="M164 198 Q 200 210 232 220" stroke="#2f3a2b" stroke-width="3" fill="none" stroke-dasharray="5 4"/>
  <text x="200" y="290" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Lay it on the far side, muzzle away</text>
  <text x="392" y="54" font-size="13" fill="#2f3a2b" text-anchor="end">Seen from above</text>
</svg>
