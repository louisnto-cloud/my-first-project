<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 516" font-family="sans-serif" role="img" aria-label="Camp and people: rules 43 to 50. Rule 43: Leave camp cleaner. Rule 44: First on the ridge owns it. Rule 45: Quiet before shooting light. Rule 46: Share the meat, never sell. Also law. Rule 47: Photos: no GPS, gate or name. Rule 48: Be the good one to hikers. Rule 49: Teach the kid, not the trophy. Rule 50: Go home before the storm. Rules without the law badge are wisdom, not law.">
