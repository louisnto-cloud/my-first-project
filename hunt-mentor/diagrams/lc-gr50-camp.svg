<g transform="translate(72 445.0) scale(0.8)"><path d="M-18 -2 L0 -18 L18 -2" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-14" y="-4" width="28" height="22" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-4" y="6" width="8" height="12" fill="#8b5a2b"/></g>
