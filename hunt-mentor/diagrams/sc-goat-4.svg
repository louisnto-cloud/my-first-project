<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Step 4: look at the horns. Billy: thick at the base, curving evenly along the whole length. Nanny: more slender at the base and a bit more curved toward the tip, 85 percent. Tip: compare the horn base to the eye width." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Step 4: horn base and shape</text>
<line x1="200" y1="40" x2="200" y2="240" stroke="#8a9a6b" stroke-width="2" stroke-dasharray="6 6"/>
<text x="100" y="60" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Billy</text>
<text x="300" y="60" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Nanny</text>
<rect x="40" y="170" width="120" height="30" rx="6" fill="#ffffff" stroke="#23261f"/>
<g transform="translate(100 110)"><path d="M-14,60 C-16,20 -6,-10 20,-30" fill="none" stroke="#23261f" stroke-width="16" stroke-linecap="round"/><path d="M-14,60 C-16,20 -6,-10 20,-30" fill="none" stroke="#3a3a36" stroke-width="10" stroke-linecap="round"/></g>
<rect x="240" y="170" width="120" height="30" rx="6" fill="#ffffff" stroke="#23261f"/>
<g transform="translate(300 110)"><path d="M-8,60 L-6,0 C-4,-24 6,-32 18,-26" fill="none" stroke="#23261f" stroke-width="8" stroke-linecap="round"/></g>
<text x="100" y="220" font-size="14" fill="#23261f" text-anchor="middle">Thick base,</text>
<text x="100" y="238" font-size="14" fill="#23261f" text-anchor="middle">even curve</text>
<text x="300" y="220" font-size="14" fill="#23261f" text-anchor="middle">Slender base,</text>
<text x="300" y="238" font-size="14" fill="#23261f" text-anchor="middle">curve near tip</text>
<rect x="20" y="256" width="360" height="38" rx="8" fill="#f3ead8" stroke="#2f3a2b" stroke-width="2"/>
<text x="200.0" y="279.9" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Compare horn base to eye width (Tip)</text>
</svg>
