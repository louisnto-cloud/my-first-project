<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Five kinds of wetland used in Canada. Shallow open water: under 2 m deep at midsummer with few plants sticking up. Marsh: cattail, bulrush and sedges in nutrient rich water. Fen: sedges over peat, fed by groundwater. Swamp: at least a quarter covered by trees or tall shrubs such as willow. Bog: moss peat, acid, fed by rain.">
