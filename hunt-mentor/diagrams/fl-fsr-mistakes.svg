<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" role="img" aria-label="Three road mistakes: driving a haul road with no radio and not waiting, stopping on a corner to glass, and a loaded rifle in the truck.">
  <rect x="0" y="0" width="400" height="296" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Three common mistakes</text>
<rect x="10" y="50" width="380" height="70" rx="10" fill="#f6e3dc" stroke="#b3261e" stroke-width="1.5"/>
<circle cx="42" cy="85" r="20" fill="#ffffff" stroke="#b3261e" stroke-width="3"/><path d="M33.9 76.9 l16.2 16.2 M50.1 76.9 l-16.2 16.2" fill="none" stroke="#b3261e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#23261f" text-anchor="start">No radio, no waiting</text>
<text x="74" y="104" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Follow a radio truck or go with extreme care</text>
<rect x="10" y="130" width="380" height="70" rx="10" fill="#f6e3dc" stroke="#b3261e" stroke-width="1.5"/>
<circle cx="42" cy="165" r="20" fill="#ffffff" stroke="#b3261e" stroke-width="3"/><path d="M33.9 156.9 l16.2 16.2 M50.1 156.9 l-16.2 16.2" fill="none" stroke="#b3261e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="160" font-family="sans-serif" font-size="16" font-weight="bold" fill="#23261f" text-anchor="start">Stopping on a corner to glass</text>
<text x="74" y="184" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Use a pullout on a straight</text>
<rect x="10" y="210" width="380" height="70" rx="10" fill="#f6e3dc" stroke="#b3261e" stroke-width="1.5"/>
<circle cx="42" cy="245" r="20" fill="#ffffff" stroke="#b3261e" stroke-width="3"/><path d="M33.9 236.9 l16.2 16.2 M50.1 236.9 l-16.2 16.2" fill="none" stroke="#b3261e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="240" font-family="sans-serif" font-size="16" font-weight="bold" fill="#23261f" text-anchor="start">Loaded rifle in the truck</text>
<text x="74" y="264" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Unlawful. Unload before you get in</text>
</svg>
