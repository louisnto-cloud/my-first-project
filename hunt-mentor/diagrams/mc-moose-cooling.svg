<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" font-family="sans-serif" role="img" aria-label="Cross section of a moose hind quarter shaded from cool outside to hot at the bone. Heat sits deep at the bone. Skin it, quarter it, bag it, hang it in shade with air all round. Goal: meat under 4 degrees Celsius as fast as you can.">
<rect x="0" y="0" width="400" height="296" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Big body, slow to cool</text><ellipse cx="140" cy="140" rx="100" ry="80" fill="#c0392b" opacity=".85"/><ellipse cx="140" cy="140" rx="64" ry="50" fill="#e0603f"/><ellipse cx="140" cy="140" rx="30" ry="24" fill="#f39c5a"/><ellipse cx="140" cy="140" rx="10" ry="8" fill="#f6f0e0"/><text x="140" y="238" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Hind quarter: heat sits at the bone</text><text x="260" y="80" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Skin it</text><text x="260" y="106" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Quarter it</text><text x="260" y="132" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Bag it</text><text x="260" y="158" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Hang it in shade</text><text x="260" y="184" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Air all round</text><rect x="20" y="252" width="360" height="34" rx="8" fill="#e3e8ef" stroke="#4a7fb0" stroke-width="2"/><text x="200" y="274" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Goal: under 4°C as fast as you can</text>
</svg>
