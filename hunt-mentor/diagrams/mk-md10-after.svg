<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 418" font-family="sans-serif" role="img" aria-label="After the kill, before the knife. 1, Cancel (notch) your species licence, Before you handle the deer (99%, page 11). 2, Leave evidence of sex attached, Unskinned tail, plus a testicle or part of the penis (99%, page 15). 3, 4 point season: antlers go with the licence, Attached to part of the upper skull (99%). 4, Region 3: submit the head for CWD testing, 95%.">
<rect width="400" height="418" rx="12" fill="#EEF1EA"/>
<text x="16" y="30" font-size="18" font-weight="bold" fill="#1F3D2B">After the kill, before the knife</text>
<path d="M28 74 V342" stroke="#1F3D2B" stroke-width="3" fill="none"/>
<g><rect x="54" y="52" width="334" height="80" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="3"/><text x="66" y="77" font-size="16" font-weight="bold" fill="#17201A">Cancel (notch) your species</text>
<text x="66" y="97" font-size="16" font-weight="bold" fill="#17201A">licence</text><text x="66" y="119" font-size="14" fill="#1F3D2B">Before you handle the deer (99%, page 11)</text><circle cx="28" cy="74" r="14" fill="#FF6A13"/><text x="28" y="79" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text></g>
<g><rect x="54" y="142" width="334" height="78" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><text x="66" y="167" font-size="16" font-weight="bold" fill="#17201A">Leave evidence of sex attached</text><text x="66" y="189" font-size="14" fill="#1F3D2B">Unskinned tail, plus a testicle or part</text>
<text x="66" y="207" font-size="14" fill="#1F3D2B">of the penis (99%, page 15)</text><circle cx="28" cy="164" r="14" fill="#1F3D2B"/><text x="28" y="169" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text></g>
<g><rect x="54" y="230" width="334" height="80" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><text x="66" y="255" font-size="16" font-weight="bold" fill="#17201A">4 point season: antlers go with</text>
<text x="66" y="275" font-size="16" font-weight="bold" fill="#17201A">the licence</text><text x="66" y="297" font-size="14" fill="#1F3D2B">Attached to part of the upper skull (99%)</text><circle cx="28" cy="252" r="14" fill="#1F3D2B"/><text x="28" y="257" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text></g>
<g><rect x="54" y="320" width="334" height="80" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><text x="66" y="345" font-size="16" font-weight="bold" fill="#17201A">Region 3: submit the head for</text>
<text x="66" y="365" font-size="16" font-weight="bold" fill="#17201A">CWD testing</text><text x="66" y="387" font-size="14" fill="#1F3D2B">95%</text><circle cx="28" cy="342" r="14" fill="#1F3D2B"/><text x="28" y="347" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text></g>
</svg>
