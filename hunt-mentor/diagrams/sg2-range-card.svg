<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Range card for a duck spread: put your farthest decoy at 35 metres. Birds inside it are in range; birds past it you watch, not shoot.">
