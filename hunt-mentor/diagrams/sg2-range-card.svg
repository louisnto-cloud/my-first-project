<rect x="10" y="250" width="70" height="40" rx="6" fill="#6b5a45"/>
<text x="45.0" y="276.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">blind</text>
<path d="M45 60 A210 210 0 0 1 255 270" fill="none" stroke="#FF6A13" stroke-width="3" stroke-dasharray="8 6"/>
<ellipse cx="100" cy="220" rx="12" ry="6" fill="#1F3D2B"/>
<ellipse cx="140" cy="200" rx="12" ry="6" fill="#1F3D2B"/>
<ellipse cx="120" cy="244" rx="12" ry="6" fill="#1F3D2B"/>
<ellipse cx="170" cy="232" rx="12" ry="6" fill="#1F3D2B"/>
<ellipse cx="150" cy="170" rx="12" ry="6" fill="#1F3D2B"/>
<ellipse cx="193" cy="122" rx="12" ry="6" fill="#FF6A13"/>
<line x1="245.9" y1="134.0" x2="200.0" y2="124.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="200.0" cy="124.0" r="3" fill="#1F3D2B"/><rect x="245.9" y="133.0" width="128.2" height="23.0" rx="5" fill="#ffffff" stroke="#FF6A13" stroke-width="1.3"/><text x="310.0" y="150.0" font-size="14" font-weight="bold" fill="#FF6A13" text-anchor="middle">far decoy: 35 m</text>
<rect x="43.7" y="112.0" width="112.7" height="24.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="100.0" y="130.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">inside: shoot</text>
<rect x="256.6" y="62.0" width="126.8" height="24.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="320.0" y="80.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">past it: watch</text>
<line x1="60.0" y1="255.0" x2="178.1" y2="136.0" stroke="#1F3D2B" stroke-width="2" stroke-linecap="round"/><path d="M182.0 132.0 L179.4 139.6 L174.5 134.7Z" fill="#1F3D2B"/>
