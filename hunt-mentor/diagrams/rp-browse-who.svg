<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 345" font-family="sans-serif" role="img" aria-label="Grid of who browses what, from BC Ministry of Environment species brochures and the app deer sources. Willow: key moose winter food, also eaten by deer and elk. Red osier dogwood: deer and moose. Saskatoon: deer key food, elk minor. Aspen and paper birch: moose. Bitterbrush, snowbrush, rose and Douglas fir: mule deer winter foods; rose also elk. Salal: key winter food of coast black tailed deer.">
<rect width="400" height="345" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Who browses what</text><text x="220" y="52" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Deer</text><text x="285" y="52" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Moose</text><text x="350" y="52" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Elk</text><rect x="8" y="60" width="384" height="24" rx="0" fill="#f3f0e2"/><text x="16" y="77" font-size="14" fill="#2f3a2b" text-anchor="start">Willow</text><circle cx="220" cy="72" r="7" fill="none" stroke="#e8590c" stroke-width="2"/><circle cx="285" cy="72" r="8" fill="#e8590c"/><circle cx="350" cy="72" r="7" fill="none" stroke="#e8590c" stroke-width="2"/><rect x="8" y="86" width="384" height="24" rx="0" fill="#ffffff"/><text x="16" y="103" font-size="14" fill="#2f3a2b" text-anchor="start">Red osier dogwood</text><circle cx="220" cy="98" r="8" fill="#e8590c"/><circle cx="285" cy="98" r="8" fill="#e8590c"/><rect x="8" y="112" width="384" height="24" rx="0" fill="#f3f0e2"/><text x="16" y="129" font-size="14" fill="#2f3a2b" text-anchor="start">Saskatoon</text><circle cx="220" cy="124" r="8" fill="#e8590c"/><circle cx="350" cy="124" r="7" fill="none" stroke="#e8590c" stroke-width="2"/><rect x="8" y="138" width="384" height="24" rx="0" fill="#ffffff"/><text x="16" y="155" font-size="14" fill="#2f3a2b" text-anchor="start">Aspen, birch</text><circle cx="285" cy="150" r="8" fill="#e8590c"/><rect x="8" y="164" width="384" height="24" rx="0" fill="#f3f0e2"/><text x="16" y="181" font-size="14" fill="#2f3a2b" text-anchor="start">Bitterbrush</text><circle cx="220" cy="176" r="8" fill="#e8590c"/><rect x="8" y="190" width="384" height="24" rx="0" fill="#ffffff"/><text x="16" y="207" font-size="14" fill="#2f3a2b" text-anchor="start">Snowbrush</text><circle cx="220" cy="202" r="8" fill="#e8590c"/><rect x="8" y="216" width="384" height="24" rx="0" fill="#f3f0e2"/><text x="16" y="233" font-size="14" fill="#2f3a2b" text-anchor="start">Rose</text><circle cx="220" cy="228" r="8" fill="#e8590c"/><circle cx="350" cy="228" r="7" fill="none" stroke="#e8590c" stroke-width="2"/><rect x="8" y="242" width="384" height="24" rx="0" fill="#ffffff"/><text x="16" y="259" font-size="14" fill="#2f3a2b" text-anchor="start">Douglas fir</text><circle cx="220" cy="254" r="8" fill="#e8590c"/><rect x="8" y="268" width="384" height="24" rx="0" fill="#f3f0e2"/><text x="16" y="285" font-size="14" fill="#2f3a2b" text-anchor="start">Salal</text><circle cx="220" cy="280" r="8" fill="#e8590c"/><circle cx="30" cy="310" r="8" fill="#e8590c"/><text x="44" y="315" font-size="14" fill="#2f3a2b" text-anchor="start">named key food</text><circle cx="200" cy="310" r="7" fill="none" stroke="#e8590c" stroke-width="2"/><text x="214" y="315" font-size="14" fill="#2f3a2b" text-anchor="start">named, minor</text><text x="200.0" y="340" font-size="14" fill="#6b4f35" text-anchor="middle">BC brochures and app deer sources (80 to 85%)</text>
</svg>
