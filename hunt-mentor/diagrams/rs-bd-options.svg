<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" font-family="sans-serif" role="img" aria-label="Three ways to use a bedding area. A: ambush the trail between bed and feed, safe for a beginner, but the deer may use another trail. B: still hunt into the beds when wind and rain cover noise, but it is easy to bump them. C: stalk a bedded buck in open country after glassing, which needs skill and the right wind.">
<rect x="0" y="0" width="400" height="296" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3 ways to hunt beds</text>
<rect x="10" y="62" width="380" height="68" rx="8" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><circle cx="36" cy="96" r="18" fill="#e8590c"/><text x="36" y="102" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">A</text><text x="66" y="86" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Ambush the trail</text><text x="66" y="106" font-size="14" fill="#23261f" text-anchor="start">+ safe, beginner (Tip)</text><text x="66" y="124" font-size="14" fill="#c62828" text-anchor="start">− deer may go another way</text><rect x="10" y="138" width="380" height="68" rx="8" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><circle cx="36" cy="172" r="18" fill="#e8590c"/><text x="36" y="178" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">B</text><text x="66" y="162" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Still hunt into beds</text><text x="66" y="182" font-size="14" fill="#23261f" text-anchor="start">+ wind, rain, noise cover</text><text x="66" y="200" font-size="14" fill="#c62828" text-anchor="start">− easy to bump them</text><rect x="10" y="214" width="380" height="68" rx="8" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><circle cx="36" cy="248" r="18" fill="#e8590c"/><text x="36" y="254" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">C</text><text x="66" y="238" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Stalk a bedded buck</text><text x="66" y="258" font-size="14" fill="#23261f" text-anchor="start">+ open country, glass first</text><text x="66" y="276" font-size="14" fill="#c62828" text-anchor="start">− needs skill, wind</text>
</svg>
