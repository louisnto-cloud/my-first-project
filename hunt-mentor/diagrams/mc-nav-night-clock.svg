<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Timeline for an unplanned night: one hour before dark decide you are staying; 45 minutes before dark build the shelter and bed; 20 minutes before dark gather wood in three piles; at dark light the fire, send a text and rest; through the night eat small snacks and move to stay warm; at dawn signal and stay put. Tip.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">The long night, step by step</text><circle cx="40" cy="62" r="8" fill="#e8590c"/><text x="60" y="67" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Dark minus 1 h</text><text x="205" y="67" font-size="15" fill="#23261f" text-anchor="start">Decide: staying</text><line x1="40" y1="70" x2="40" y2="92" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round"/><circle cx="40" cy="100" r="8" fill="#8a9a6b"/><text x="60" y="105" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Dark minus 45</text><text x="205" y="105" font-size="15" fill="#23261f" text-anchor="start">Shelter and bed</text><line x1="40" y1="108" x2="40" y2="130" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round"/><circle cx="40" cy="138" r="8" fill="#8a9a6b"/><text x="60" y="143" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Dark minus 20</text><text x="205" y="143" font-size="15" fill="#23261f" text-anchor="start">Wood: 3 piles</text><line x1="40" y1="146" x2="40" y2="168" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round"/><circle cx="40" cy="176" r="8" fill="#8a9a6b"/><text x="60" y="181" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Dark</text><text x="205" y="181" font-size="15" fill="#23261f" text-anchor="start">Fire, text, rest</text><line x1="40" y1="184" x2="40" y2="206" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round"/><circle cx="40" cy="214" r="8" fill="#8a9a6b"/><text x="60" y="219" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Night</text><text x="205" y="219" font-size="15" fill="#23261f" text-anchor="start">Small snacks, move</text><line x1="40" y1="222" x2="40" y2="244" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round"/><circle cx="40" cy="252" r="8" fill="#e8590c"/><text x="60" y="257" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Dawn</text><text x="205" y="257" font-size="15" fill="#23261f" text-anchor="start">Signal, stay</text><text x="200" y="293" font-size="14" fill="#6b4f35" text-anchor="middle">Tip: timing is a plan, not a rule</text>
</svg>
