<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 304" role="img" aria-label="Cold weather water tips: carry bottles in an insulated sleeve, stored upside down so the lid does not freeze first, keep a bottle inside your jacket, drink warm drinks from a thermos, and refill when you can.">
  <rect x="0" y="0" width="400" height="304" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Water in the cold (Tips)</text>
<rect x="10.0" y="50" width="185.0" height="112" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="90.5" y="63.400000000000006" width="24" height="44" rx="6" fill="#4a7fb0"/><rect x="86.5" y="59.400000000000006" width="32" height="52" rx="8" fill="none" stroke="#8a9a6b" stroke-width="4"/>
<text x="102.5" y="132" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Insulated sleeve</text>
<text x="102.5" y="151" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">slows freezing</text>
<rect x="205.0" y="50" width="185.0" height="112" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="285.5" y="67.4" width="24" height="40" rx="6" fill="#4a7fb0"/><rect x="289.5" y="105.4" width="16" height="8" rx="2" fill="#23261f"/>
<text x="297.5" y="132" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Upside down</text>
<text x="297.5" y="151" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">lid freezes last</text>
<rect x="10.0" y="172" width="185.0" height="112" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="88.5" y="183.4" width="28" height="50" rx="8" fill="#888888"/><rect x="92.5" y="177.4" width="20" height="8" rx="2" fill="#23261f"/>
<text x="102.5" y="254" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Thermos</text>
<text x="102.5" y="273" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">warm drink at noon</text>
<rect x="205.0" y="172" width="185.0" height="112" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<circle cx="297.5" cy="206.4" r="4.5" fill="#2f3a2b"/>
<line x1="297.5" y1="210.9" x2="297.5" y2="227.4" stroke="#2f3a2b" stroke-width="3.0" stroke-linecap="round"/>
<line x1="297.5" y1="227.4" x2="293.0" y2="240.4" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round"/>
<line x1="297.5" y1="227.4" x2="302.0" y2="240.4" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round"/>
<line x1="297.5" y1="214.4" x2="292.0" y2="223.4" stroke="#2f3a2b" stroke-width="2.0" stroke-linecap="round"/>
<line x1="297.5" y1="214.4" x2="303.0" y2="223.4" stroke="#2f3a2b" stroke-width="2.0" stroke-linecap="round"/><rect x="293.5" y="203.4" width="8" height="12" rx="2" fill="#4a7fb0"/>
<text x="297.5" y="254" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Inside your jacket</text>
<text x="297.5" y="273" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">body heat keeps it liquid</text>
</svg>
