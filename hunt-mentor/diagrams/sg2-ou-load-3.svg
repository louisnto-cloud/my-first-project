<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Over under loading step 3: lift the stock up to the barrels, not the barrels to the stock, so the muzzles stay pointed down. The top lever snaps back. It is loaded. Safety stays on.">
<rect width="400" height="300" fill="#EEF1EA"/>
<circle cx="24" cy="22" r="15" fill="#1F3D2B"/><text x="24" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="46" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Close it: stock to barrels</text>
