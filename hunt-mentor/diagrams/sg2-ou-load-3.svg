<line x1="60.0" y1="224.0" x2="60.0" y2="200.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="60.0" cy="200.0" r="3" fill="#1F3D2B"/><rect x="31.8" y="223.0" width="136.3" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="100.0" y="240.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">lift the stock up</text>
<rect x="223.3" y="183.0" width="153.4" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="300.0" y="200.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">muzzles stay down</text>
<rect x="27.9" y="42.0" width="164.1" height="24.0" rx="5" fill="#ffffff" stroke="#FF6A13" stroke-width="1.3"/><text x="110.0" y="60.0" font-size="15" font-weight="bold" fill="#FF6A13" text-anchor="middle">LOADED: safety on</text>
<text x="200.0" y="290.0" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Never swing the muzzles up to close.</text>
