<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 492" font-family="sans-serif" role="img" aria-label="Five cards. Bought online: the species licence is mailed to you, so allow for the post. Bought in person: it is in your hand right away. 2 day wait: cougar, goat, sheep, caribou, bobcat, lynx and wolverine licences are not valid until 2 days after issue. No wait: deer, moose, elk and black bear. Carry them all: every species licence from this licence year, used or not, while you hunt.">
<rect width="400" height="492" fill="#fffaf0"/>
<text x="200" y="28" font-size="20" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Species licence: in hand first</text>
<rect x="8" y="44" width="188" height="140" rx="10" fill="#fffaf0" stroke="#e8590c" stroke-width="2.4"/>
<path d="M8 54 a10 10 0 0 1 10 -10 H186 a10 10 0 0 1 10 10 V74 H8z" fill="#e8590c"/>
<text x="102" y="66" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">Online</text>
<g transform="translate(102.0 110)"><rect x="-24" y="-15" width="48" height="32" rx="3" fill="#fbeee0" stroke="#2f3a2b" stroke-width="2.2"/><path d="M-24 -13 L0 5 L24 -13" fill="none" stroke="#2f3a2b" stroke-width="2.2" stroke-linejoin="round"/><rect x="10" y="-11" width="10" height="9" fill="#e8590c"/></g>
<text x="102" y="148" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Mailed to you.</text>
<text x="102" y="168" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Allow for the post.</text>
<rect x="204" y="44" width="188" height="140" rx="10" fill="#fffaf0" stroke="#2f6e3b" stroke-width="2.4"/>
<path d="M204 54 a10 10 0 0 1 10 -10 H382 a10 10 0 0 1 10 10 V74 H204z" fill="#2f6e3b"/>
<text x="298" y="66" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">In person</text>
<g transform="translate(298.0 110)"><rect x="-20" y="-20" width="34" height="24" rx="3" fill="#fbeee0" stroke="#2f3a2b" stroke-width="2" transform="rotate(-12)"/><path d="M-14 -12 h16 M-14 -6 h10" stroke="#2f3a2b" stroke-width="2" transform="rotate(-12)"/><path d="M-26 20 C-26 8 -18 2 -8 2 L10 2 C14 2 14 8 10 8 L0 8 L20 4 C25 3 26 9 22 11 L2 20z" fill="#e0b48c" stroke="#2f3a2b" stroke-width="1.6" stroke-linejoin="round"/></g>
<text x="298" y="148" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">In your hand</text>
<text x="298" y="168" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">right away.</text>
<rect x="8" y="192" width="188" height="184" rx="10" fill="#fffaf0" stroke="#c92a2a" stroke-width="2.4"/>
<path d="M8 202 a10 10 0 0 1 10 -10 H186 a10 10 0 0 1 10 10 V222 H8z" fill="#c92a2a"/>
<text x="102" y="214" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">2 day wait</text>
<g transform="translate(102.0 254)"><rect x="-22" y="-18" width="44" height="40" rx="5" fill="#fffaf0" stroke="#c92a2a" stroke-width="2.4"/><rect x="-22" y="-18" width="44" height="11" rx="3" fill="#c92a2a"/><path d="M-12 -23 v8 M12 -23 v8" stroke="#2f3a2b" stroke-width="2.4" stroke-linecap="round"/><text x="0" y="17" font-size="20" font-weight="bold" fill="#c92a2a" text-anchor="middle">2</text></g>
<text x="102" y="300" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cougar, goat,</text>
<text x="102" y="319" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">sheep, caribou,</text>
<text x="102" y="338" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">bobcat, lynx,</text>
<text x="102" y="357" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">wolverine</text>
<rect x="204" y="192" width="188" height="184" rx="10" fill="#fffaf0" stroke="#2c5d86" stroke-width="2.4"/>
<path d="M204 202 a10 10 0 0 1 10 -10 H382 a10 10 0 0 1 10 10 V222 H204z" fill="#2c5d86"/>
<text x="298" y="214" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">No wait</text>
<circle cx="298.0" cy="262" r="24" fill="#2f6e3b"/><path d="M286.4 263.0 l9.0 9.0 l18.0 -19.8" fill="none" stroke="#fffaf0" stroke-width="6.1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="298" y="328" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Deer, moose,</text>
<text x="298" y="348" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">elk, black bear</text>
<rect x="8" y="384" width="384" height="100" rx="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2.4"/>
<path d="M8 394 a10 10 0 0 1 10 -10 H382 a10 10 0 0 1 10 10 V414 H8z" fill="#2f3a2b"/>
<text x="200" y="406" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">Carry them all</text>
<rect x="28" y="428" width="44" height="30" rx="3" fill="#fbeee0" stroke="#2f3a2b" stroke-width="1.8"/>
<rect x="36" y="434" width="44" height="30" rx="3" fill="#fbeee0" stroke="#2f3a2b" stroke-width="1.8"/>
<rect x="44" y="440" width="44" height="30" rx="3" fill="#fbeee0" stroke="#2f3a2b" stroke-width="1.8"/>
<path d="M44 446 h20 M44 452 h14" stroke="#2f3a2b" stroke-width="1.8"/>
<text x="236" y="444" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Every species licence this licence year,</text>
<text x="236" y="466" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">used or not, while you hunt.</text>
</svg>
