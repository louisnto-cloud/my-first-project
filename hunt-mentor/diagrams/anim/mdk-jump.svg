<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, top view of a winding creek with willows on the bends. Two hunters sneak in behind cover, out of sight, and stop at a bend. Ducks on the creek beyond the bend flush and climb into the wind. End card: pick one drake, then shoot. Tactics are tips."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="22" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Jump a creek: bend to bend (Tip)</text><path d="M0 220 Q80 200 120 150 Q160 90 240 110 Q320 130 400 70" stroke="#4a7fb0" stroke-width="30" fill="none"/><circle cx="150" cy="70" r="14" fill="#8a9a6b"/><circle cx="170" cy="76" r="14" fill="#8a9a6b"/><circle cx="90" cy="250" r="14" fill="#8a9a6b"/><circle cx="60" cy="240" r="14" fill="#8a9a6b"/><circle cx="300" cy="170" r="14" fill="#8a9a6b"/><circle cx="330" cy="160" r="14" fill="#8a9a6b"/><line x1="380" y1="250" x2="336.0" y2="250.0" stroke="#3a6fb0" stroke-width="4" fill="none"/><polygon points="330.0,250.0 341.0,256.0 341.0,244.0" fill="#3a6fb0"/><text x="372" y="276" font-size="14" fill="#3a6fb0" text-anchor="middle" font-weight="bold">Wind</text><g><animateTransform attributeName="transform" type="translate" values="230 108;230 108;330 20" keyTimes="0;0.6;1" dur="7s" fill="freeze"/><ellipse rx="10" ry="5" fill="#8b5a2b"/><circle cx="9" cy="-2" r="4" fill="#2f6e3b"/></g><g><animateTransform attributeName="transform" type="translate" values="246 114;246 114;346 26" keyTimes="0;0.6;1" dur="7s" fill="freeze"/><ellipse rx="10" ry="5" fill="#8b5a2b"/><circle cx="9" cy="-2" r="4" fill="#2f6e3b"/></g><g><animateTransform attributeName="transform" type="translate" values="260 106;260 106;360 18" keyTimes="0;0.6;1" dur="7s" fill="freeze"/><ellipse rx="10" ry="5" fill="#8b5a2b"/><circle cx="9" cy="-2" r="4" fill="#2f6e3b"/></g><g><animateMotion dur="4s" fill="freeze" path="M20 290 Q120 250 170 150"/><circle r="9" fill="#e8590c"/></g><g><animateMotion dur="4s" fill="freeze" path="M42 290 Q120 250 194 150"/><circle r="9" fill="#e8590c"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="4s" dur="0.5s" fill="freeze"/><text x="200" y="52" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Rise together</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="7.2s" dur="0.5s" fill="freeze"/><rect x="10" y="258" width="300" height="34" rx="8" fill="#2f3a2b"/><text x="160" y="281" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Pick one drake, then shoot</text></g></svg>
