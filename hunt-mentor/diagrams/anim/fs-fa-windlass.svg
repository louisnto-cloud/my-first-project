<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a tourniquet sits above an arm wound. The windlass rod turns around and around. Blood drips at first, then stops as the band tightens. Then: bleeding stopped, lock the rod and write the time.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Tourniquet: twist until it stops</text><rect x="20" y="138" width="310" height="44" rx="22" fill="#d9b48f" stroke="#b08a66" stroke-width="2"/><circle cx="344" cy="160" r="24.0" fill="#d9b48f" stroke="#b08a66" stroke-width="2"/><ellipse cx="270" cy="160" rx="16" ry="7" fill="#c0392b"/><rect x="158" y="130" width="24" height="60" rx="4" fill="#e8590c" stroke="#2f3a2b" stroke-width="2"/><g><animateTransform attributeName="transform" type="rotate" values="0 170 120;180 170 120;360 170 120;540 170 120" dur="3s" begin="0.5s" fill="freeze"/><line x1="170" y1="92" x2="170" y2="148" stroke="#2f3a2b" stroke-width="7" stroke-linecap="round"/></g><circle cx="270" cy="186" r="5" fill="#c0392b"><animate attributeName="cy" values="186;250" dur="0.8s" begin="0.0s" repeatCount="4"/><animate attributeName="opacity" values="1;0" begin="3.5s" dur="0.3s" fill="freeze"/></circle><circle cx="280" cy="186" r="5" fill="#c0392b"><animate attributeName="cy" values="186;250" dur="0.8s" begin="0.3s" repeatCount="4"/><animate attributeName="opacity" values="1;0" begin="3.5s" dur="0.3s" fill="freeze"/></circle><circle cx="262" cy="186" r="5" fill="#c0392b"><animate attributeName="cy" values="186;250" dur="0.8s" begin="0.6s" repeatCount="4"/><animate attributeName="opacity" values="1;0" begin="3.5s" dur="0.3s" fill="freeze"/></circle><rect x="200" y="252" width="140" height="10" rx="5" fill="#c0392b" opacity=".7"><animate attributeName="width" values="20;140" dur="3.5s" fill="freeze"/></rect><g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.8s" dur="0.4s" fill="freeze"/><rect x="7" y="262" width="387" height="30" rx="6" fill="#2e7d32"/><text x="200" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Bleeding stopped: lock it, write the time</text></g>
</svg>
