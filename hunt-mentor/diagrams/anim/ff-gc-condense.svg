<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, a tip: a rifle moves from minus 15 C outside into a plus 20 C cabin and water beads form on the cold metal. Either leave it cased somewhere cold and secure, or bring it in and dry it well.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cold rifle, warm cabin: fog and water (Tip)</text><rect x="0" y="40" width="160" height="220" rx="0" fill="#dfeaf3" stroke="none" stroke-width="2"/><text x="80" y="70" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">outside</text><text x="80" y="92" font-size="14" fill="#23261f" text-anchor="middle">minus 15 C</text><rect x="240" y="40" width="160" height="220" rx="0" fill="#f8e3cf" stroke="none" stroke-width="2"/><text x="320" y="70" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">cabin</text><text x="320" y="92" font-size="14" fill="#23261f" text-anchor="middle">plus 20 C</text><g><animateTransform attributeName="transform" type="translate" values="30 150;280 150" dur="2.5s" fill="freeze"/><rect x="0" y="0" width="100" height="14" rx="3" fill="#6b6f68" stroke="#2f3a2b" stroke-width="1.5"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.6s" dur="0.5s" fill="freeze"/><circle cx="290" cy="172" r="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><circle cx="302" cy="178" r="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><circle cx="314" cy="172" r="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><circle cx="326" cy="178" r="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><circle cx="338" cy="172" r="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><circle cx="350" cy="178" r="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><circle cx="362" cy="172" r="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="330" y="210" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">water beads form</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.6s" dur="0.5s" fill="freeze"/><rect x="60" y="240" width="280" height="30" rx="15.0" fill="#2f3a2b" stroke="none" stroke-width="2"/><text x="200.0" y="259.55" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Leave it cased in the cold, or dry it well</text></g>
</svg>
