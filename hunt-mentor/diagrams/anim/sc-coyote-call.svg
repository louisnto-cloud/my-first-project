<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="sans-serif" role="img" aria-label="Animation, top view, a tip. Wind blows across the field from left to right. The hunter sits at the bottom edge with brush behind. An electronic caller sits about 40 metres out, a little upwind. The hunter&#x27;s scent drifts off to the right, downwind. A coyote comes out of the timber, trots toward the call, then hooks downwind to smell it. That puts him in the open in front of the hunter, before he reaches the hunter&#x27;s scent. The shot comes then.">
<rect width="400" height="330" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Crosswind setup for coyotes (Tip)</text>
