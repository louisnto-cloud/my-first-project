<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: three Canada geese glide toward a hunter hidden in a layout blind in stubble. As they come close, the hunter lifts a pale face to look: face up. The geese flare: they flap hard, turn and climb away out of range. Final card: face down, hat brim low, until the shot call, a Tip.">
