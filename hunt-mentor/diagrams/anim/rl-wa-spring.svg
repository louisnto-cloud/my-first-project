<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 314" font-family="sans-serif" role="img" aria-label="Animation, side view of a hillside. Rain soaks into the soil and sinks until it hits a tight layer of rock or clay. It runs along that layer and comes out of the slope at the toe of a bench as a spring. A patch of green grows around it and a deer comes to drink.">
