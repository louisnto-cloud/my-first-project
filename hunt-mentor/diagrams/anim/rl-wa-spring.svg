<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, side view of a hillside. Rain soaks into the soil and sinks until it hits a tight layer of rock or clay. It runs along that layer and comes out of the slope at the foot of a bench as a spring. A patch of green grows around it and a deer comes to drink.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Where a spring comes from</text><text x="388" y="24" font-size="14" fill="#2f3a2b" text-anchor="end">side view</text>
  <rect x="0" y="40" width="400" height="60" fill="#e3ecf3" opacity=".6"/>
  <path d="M0 110 L180 90 L280 150 L330 160 L400 200 L400 268 L0 268 Z" fill="#d9c9a3"/>
  <path d="M0 160 L240 150 L320 166 L400 210" stroke="#8a8170" stroke-width="10" fill="none"/>
  <text x="20" y="190" font-size="13" fill="#2f3a2b" text-anchor="start">tight rock or clay layer</text>
  <path d="M0 110 L180 90 L280 150 L330 160 L400 200" stroke="#2f3a2b" stroke-width="2.5" fill="none"/>
  <path d="M80 60 l-3 10" stroke="#4a7fb0" stroke-width="2.5"><animate attributeName="opacity" values="1;0" begin="0.0s" dur="1.2s" fill="freeze"/></path><path d="M120 54 l-3 10" stroke="#4a7fb0" stroke-width="2.5"><animate attributeName="opacity" values="1;0" begin="0.2s" dur="1.2s" fill="freeze"/></path><path d="M160 66 l-3 10" stroke="#4a7fb0" stroke-width="2.5"><animate attributeName="opacity" values="1;0" begin="0.4s" dur="1.2s" fill="freeze"/></path><path d="M200 58 l-3 10" stroke="#4a7fb0" stroke-width="2.5"><animate attributeName="opacity" values="1;0" begin="0.6000000000000001s" dur="1.2s" fill="freeze"/></path><path d="M240 62 l-3 10" stroke="#4a7fb0" stroke-width="2.5"><animate attributeName="opacity" values="1;0" begin="0.8s" dur="1.2s" fill="freeze"/></path>
  <g fill="#4a7fb0"><circle r="3.5"><animateMotion dur="3s" begin="1.0s" fill="freeze" path="M60 115 L60 150 L320 160"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" begin="1.0s" dur="3s" fill="freeze"/></circle><circle r="3.5"><animateMotion dur="3s" begin="1.4s" fill="freeze" path="M90 115 L90 150 L320 160"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" begin="1.4s" dur="3s" fill="freeze"/></circle><circle r="3.5"><animateMotion dur="3s" begin="1.8s" fill="freeze" path="M120 115 L120 150 L320 160"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" begin="1.8s" dur="3s" fill="freeze"/></circle><circle r="3.5"><animateMotion dur="3s" begin="2.2s" fill="freeze" path="M150 115 L150 150 L320 160"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" begin="2.2s" dur="3s" fill="freeze"/></circle><circle r="3.5"><animateMotion dur="3s" begin="2.6s" fill="freeze" path="M180 115 L180 150 L320 160"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" begin="2.6s" dur="3s" fill="freeze"/></circle><circle r="3.5"><animateMotion dur="3s" begin="3.0s" fill="freeze" path="M210 115 L210 150 L320 160"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" begin="3.0s" dur="3s" fill="freeze"/></circle></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.4s" dur=".6s" fill="freeze"/>
    <path d="M310 156 C 330 170, 350 190, 380 200" stroke="#4a7fb0" stroke-width="4" fill="none"/>
    <ellipse cx="335" cy="168" rx="40" ry="10" fill="#7fb069" opacity=".8"/>
    <rect x="126" y="112" width="268" height="24" rx="6" fill="#4a7fb0"/><text x="260.0" y="129" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Spring at the toe of the bench</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="5.6s" dur=".6s" fill="freeze"/><g transform="translate(368 186) scale(0.9)"><ellipse rx="14" ry="7" fill="#8b5a2b"/><circle cx="12" cy="-10" r="5.5" fill="#8b5a2b"/><path d="M9 -14 l-3 -7 M14 -14 l4 -6" stroke="#5c3b1c" stroke-width="2"/><path d="M-9 5 v9 M-4 5 v9 M6 5 v9 M10 5 v9" stroke="#8b5a2b" stroke-width="2.5"/></g></g>
  <text x="200" y="292" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Rain soaks in, hits a tight layer, runs out the side</text>
</svg>
