<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: a deer feeds on a snowy winter range slope. A person walks toward it off trail. The deer bounds uphill through the snow into the timber, and an illustrative fat reserve bar drops. Final label: hunt the edges, then leave, do not push twice, a tip.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Every flight in snow costs fat</text>
<path d="M0 300 L0 250 L120 200 L260 120 L400 80 L400 300 Z" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
<g><polygon points="288.1,120 300,86 311.9,120" fill="#2f3a2b"/><rect x="298" y="120" width="4" height="6.800000000000001" fill="#6b4f35"/></g><g><polygon points="327.4,105 340,69 352.6,105" fill="#2f3a2b"/><rect x="338" y="105" width="4" height="7.2" fill="#6b4f35"/></g><g><polygon points="359.5,95 370,65 380.5,95" fill="#2f3a2b"/><rect x="368" y="95" width="4" height="6.0" fill="#6b4f35"/></g>
<path id="rq-wr-dpath" d="M140 200 Q 220 150 320 115" fill="none"/>
<g><g transform="translate(0 0) scale(0.7)"><ellipse rx="20" ry="9" fill="#8b5a2b"/><circle cx="19" cy="-10" r="6.5" fill="#8b5a2b"/><rect x="-15" y="5" width="3.5" height="14" fill="#8b5a2b"/><rect x="-6" y="5" width="3.5" height="14" fill="#8b5a2b"/><rect x="7" y="5" width="3.5" height="14" fill="#8b5a2b"/><rect x="13" y="5" width="3.5" height="14" fill="#8b5a2b"/><ellipse cx="-20" cy="-2" rx="4" ry="5" fill="#f3ead8"/></g><animateMotion dur="8s" keyPoints="0;0;1;1" keyTimes="0;0.35;0.75;1" calcMode="linear" fill="freeze"><mpath href="#rq-wr-dpath"/></animateMotion></g>
<g><g transform="translate(0 0) scale(0.9)"><circle cy="-14" r="6" fill="#4a7fb0"/><rect x="-6" y="-8" width="12" height="16" rx="3" fill="#4a7fb0"/><rect x="-5" y="8" width="4" height="10" fill="#2f3a2b"/><rect x="1" y="8" width="4" height="10" fill="#2f3a2b"/></g><animateTransform attributeName="transform" type="translate" values="-30 260;90 225;110 220" keyTimes="0;0.4;1" dur="8s" fill="freeze"/></g>
<text x="20" y="60" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Fat reserve (illustration)</text>
<rect x="20" y="68" width="160" height="18" rx="4" fill="#eee" stroke="#2f3a2b"/>
<rect x="21" y="69" width="158" height="16" rx="4" fill="#e8590c"><animate attributeName="width" values="158;158;80;80" keyTimes="0;0.35;0.75;1" dur="8s" fill="freeze"/></rect>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="6.2s" dur="0.5s" fill="freeze"/><rect x="200" y="160" width="190" height="52" rx="8" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="2"/><text x="295" y="182" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Hunt edges, then leave.</text><text x="295" y="201" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Do not push twice (Tip)</text></g>
</svg>
