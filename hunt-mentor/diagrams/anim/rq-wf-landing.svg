<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: three ducks fly past the decoys high, swing around downwind, turn to face the wind, and drop into the open hole in front of the blind. The wind blows from behind the blind. Final label: into the wind, into the hole.">
