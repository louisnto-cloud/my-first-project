<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" font-family="sans-serif" role="img" aria-label="Animation, a tip: a steak in a hot pan. The thermometer climbs to 5 degrees below the target, then you pull it off the heat and rest it 5 minutes while it climbs the last few degrees. Ground meat and bear still need 71 degrees.">
<rect x="0" y="0" width="400" height="310" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Pull early, then rest (Tip)</text><g transform="translate(110 150) scale(3.0)"><ellipse cx="-4" cy="4" rx="16" ry="8" fill="#2f3a2b"/><path d="M12 2 L24 -2" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round"/><path d="M-10 -6 q3 -5 0 -10 M-3 -6 q3 -5 0 -10 M4 -6 q3 -5 0 -10" stroke="#e8590c" stroke-width="2" fill="none"/></g><rect x="268" y="60" width="26" height="180" rx="13" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/><circle cx="281" cy="250" r="20" fill="#b3261e" stroke="#2f3a2b" stroke-width="2.5"/><rect x="276" y="230" width="10" height="10" fill="#b3261e"><animate attributeName="y" values="230;120;120;100" keyTimes="0;.5;.7;1" dur="8s" fill="freeze"/><animate attributeName="height" values="10;120;120;140" keyTimes="0;.5;.7;1" dur="8s" fill="freeze"/></rect><line x1="300" y1="100" x2="330" y2="100" stroke="#e8590c" stroke-width="3"/><text x="334" y="105" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="start">Target</text><line x1="300" y1="120" x2="330" y2="120" stroke="#2f3a2b" stroke-width="2" stroke-dasharray="4 3"/><text x="334" y="125" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">5° less</text><g opacity="0"><set attributeName="opacity" to="1" begin="4s" fill="freeze"/><rect x="20" y="236" width="210" height="30" rx="15" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="1"/><text x="125" y="256" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Pull it off the heat</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="5.6s" fill="freeze"/><rect x="20" y="272" width="210" height="30" rx="15" fill="#e8590c" stroke="#e8590c" stroke-width="1"/><text x="125" y="292" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Rest 5 minutes</text></g>
</svg>
