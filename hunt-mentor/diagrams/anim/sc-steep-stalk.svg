<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation of a steep slope stalk, side view. A ram is bedded on a bench below the summit, watching the slope below him. The hunter leaves the glassing knob, drops into the valley, and climbs a gully hidden behind a rib of rock, out of the ram&#x27;s sight. The hunter tops out on the ridge and comes down to a spot above the ram. Final message: above him, in range, never seen. That sheep watch below is a tip, not a fact." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" fill="#e7eef5"/>
<path d="M150 300 L230 60 L300 30 L400 90 L400 300 Z" fill="#cfd8c0" stroke="#8a9a6b" stroke-width="2"/>
<path d="M300 150 L370 146" stroke="#8a9a6b" stroke-width="5"/>
<g fill="#9a9a90" stroke="#6b6b62"><path d="M300 150 L370 146 L376 200 L310 206 Z"/></g>
<g transform="translate(338 148) scale(1.6)"><ellipse cx="0" cy="-5" rx="12" ry="5.5" fill="#8b6a4a"/><ellipse cx="9" cy="-5" rx="3.6" ry="4" fill="#f3ead8"/><path d="M-8 -9 L-11 -14" stroke="#8b6a4a" stroke-width="5" stroke-linecap="round"/><circle cx="-12" cy="-15" r="3.6" fill="#8b6a4a"/><ellipse cx="-15.5" cy="-14" rx="2" ry="1.6" fill="#e9dcc4"/><circle cx="-12.5" cy="-16" r=".7" fill="#1d1a16"/><path d="M-11 -18 C-6 -22 -1 -17 -4 -12.5 C-6 -10.5 -9 -11.5 -8.5 -13.5" fill="none" stroke="#c9b38a" stroke-width="2.6" stroke-linecap="round"/></g>
<path d="M326 140 L262 300 L400 300 L400 240 Z" fill="#e8590c" opacity="0.12"/>
<path d="M0 300 L0 170 C40 160 80 175 120 300 Z" fill="#c9b79c"/>
<path id="sc-steep-stalk-path" d="M40 160 C80 190 130 250 170 250 C200 220 215 140 236 70 C260 52 290 60 318 110" fill="none" stroke="#2f3a2b" stroke-width="2" stroke-dasharray="5 6"/>
<g><circle r="8" fill="#e8590c"/><animateMotion dur="9s" fill="freeze" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#sc-steep-stalk-path"/></animateMotion></g>
<path d="M150 300 C175 230 205 150 238 70 C246 110 258 200 262 300 Z" fill="#b9c4a8" stroke="#8a9a6b" stroke-width="2"/>
<path d="M170 250 C200 220 215 140 236 70" fill="none" stroke="#2f3a2b" stroke-width="2" stroke-dasharray="5 6" opacity="0.5"/>
<text x="40" y="148" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">You</text>
<text x="210" y="234" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Behind</text>
<text x="210" y="252" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">the rib:</text>
<text x="210" y="270" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">unseen</text>
<text x="332" y="270" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Ram watches</text>
<text x="332" y="288" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">below (Tip)</text>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Stalk out of sight, finish above</text>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="9s" dur="0.5s" fill="freeze"/><rect x="12" y="36" width="206" height="50" rx="8" fill="#2f3a2b"/><text x="115" y="57" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">Above him, in range,</text><text x="115" y="77" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">never seen</text></g>
</svg>
