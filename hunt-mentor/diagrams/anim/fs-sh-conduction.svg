<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: red heat dots drain down out of a person lying on bare ground, while a person on a thick bed of boughs keeps the heat dots near the body. Bed first, roof second.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bare ground vs a bed</text><rect x="0" y="200" width="400" height="100" rx="0" fill="#dfe6d3"/><rect x="74" y="187" width="45" height="13" rx="4.5" fill="#e8590c"/><line x1="119" y1="195" x2="151" y2="196" stroke="#2f3a2b" stroke-width="7.2" stroke-linecap="round"/><circle cx="65" cy="192" r="8.1" fill="#d9b48f"/><rect x="230" y="184" width="150" height="16" rx="4" fill="#8a9a6b"/><rect x="284" y="171" width="45" height="13" rx="4.5" fill="#e8590c"/><line x1="329" y1="179" x2="361" y2="180" stroke="#2f3a2b" stroke-width="7.2" stroke-linecap="round"/><circle cx="275" cy="176" r="8.1" fill="#d9b48f"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 50" dur="1.5s" repeatCount="4" begin="0.0s"/><circle cx="80" cy="210" r="6.0" fill="#c0392b"/></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 50" dur="1.5s" repeatCount="4" begin="0.3s"/><circle cx="110" cy="210" r="6.0" fill="#c0392b"/></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 50" dur="1.5s" repeatCount="4" begin="0.6s"/><circle cx="140" cy="210" r="6.0" fill="#c0392b"/></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="1.5s" repeatCount="4" begin="0.0s"/><circle cx="290" cy="170" r="6.0" fill="#c0392b"/></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="1.5s" repeatCount="4" begin="0.3s"/><circle cx="320" cy="170" r="6.0" fill="#c0392b"/></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="1.5s" repeatCount="4" begin="0.6s"/><circle cx="350" cy="170" r="6.0" fill="#c0392b"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1s" dur="0.4s" fill="freeze"/><text x="110" y="110" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Heat drains down</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="2s" dur="0.4s" fill="freeze"/><text x="310" y="110" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="middle">Bed stops it</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="6s" dur="0.4s" fill="freeze"/><rect x="89" y="262" width="221" height="30" rx="6" fill="#2f3a2b"/><text x="200" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Bed first, roof second</text></g>
</svg>
