<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation of one slope through a day. At night blue arrows show air sinking downhill. When the sun reaches the slope, orange arrows show air climbing. When shade returns, it goes calm, then the air sinks downhill again.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#e7f0f7" stroke="none" stroke-width="2"/><path d="M0 260 L200 80 L400 260 Z" fill="#c9d3b8" stroke="#8b5a2b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="14" y="26" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">One slope, one day</text><g opacity="0"><animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;.15;.2;.6;.75;1" dur="10s" fill="freeze"/><line x1="150" y1="150" x2="85.6" y2="209.8" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="80.0,215.0 92.2,211.9 83.9,203.1" fill="#4a7fb0"/><line x1="250" y1="150" x2="314.4" y2="209.8" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="320.0,215.0 316.1,203.1 307.8,211.9" fill="#4a7fb0"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.2;.25;.6;.65;1" dur="10s" fill="freeze"/><line x1="80" y1="215" x2="144.4" y2="155.2" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><polygon points="150.0,150.0 137.8,153.1 146.1,161.9" fill="#e8590c"/><line x1="320" y1="215" x2="255.6" y2="155.2" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><polygon points="250.0,150.0 253.9,161.9 262.2,153.1" fill="#e8590c"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;.2;.6;.7;.75;1" dur="10s" fill="freeze"/><line x1="150" y1="150" x2="85.6" y2="209.8" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="80.0,215.0 92.2,211.9 83.9,203.1" fill="#4a7fb0"/><line x1="250" y1="150" x2="314.4" y2="209.8" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="320.0,215.0 316.1,203.1 307.8,211.9" fill="#4a7fb0"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;.15;.2;.6;.75;1" dur="10s" fill="freeze"/><rect x="60" y="270" width="280" height="26" rx="6" fill="#ffffff" stroke="#2f3a2b" stroke-width="1"/><text x="200" y="289" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Night: air sinks downhill</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.2;.25;.6;.65;1" dur="10s" fill="freeze"/><rect x="60" y="270" width="280" height="26" rx="6" fill="#ffffff" stroke="#2f3a2b" stroke-width="1"/><text x="200" y="289" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Sun on the slope: air climbs</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;.2;.6;.7;.75;1" dur="10s" fill="freeze"/><rect x="60" y="270" width="280" height="26" rx="6" fill="#ffffff" stroke="#2f3a2b" stroke-width="1"/><text x="200" y="289" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Shade: calm, then sinks again</text></g><circle cx="40" cy="60" r="16" fill="#f2c70c" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.18;.22;.65;.7;1" dur="10s" fill="freeze"/><animate attributeName="cx" values="40;40;60;340;360;360" keyTimes="0;.18;.22;.65;.7;1" dur="10s" fill="freeze"/></circle>
</svg>
