<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: from the last blood, a circle is walked at 20 metres, then at 40 metres. Then two hunters walk parallel lanes about 10 metres apart, down and back, staying in sight of each other, until they find the deer.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="16" font-weight="bold" text-anchor="middle" fill="#23261f">Lost the trail? Circles, then lanes</text><circle cx="110" cy="160" r="7" fill="#b3261e" stroke="#23261f" stroke-width="2"/><text x="110" y="184" font-size="13" font-weight="bold" text-anchor="middle" fill="#23261f">last blood</text><circle cx="110" cy="160" r="40" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-dasharray="251.3" stroke-dashoffset="251.3"><animate attributeName="stroke-dashoffset" values="251.3;0" begin="0.2s" dur="2.2s" fill="freeze"/></circle><g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.2s" dur="0.5s" fill="freeze"/><text x="144.8" y="131.2" font-size="14" font-weight="bold" fill="#2f3a2b">20 m</text></g><circle cx="110" cy="160" r="80" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-dasharray="502.7" stroke-dashoffset="502.7"><animate attributeName="stroke-dashoffset" values="502.7;0" begin="2.6s" dur="2.2s" fill="freeze"/></circle><g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.6s" dur="0.5s" fill="freeze"/><text x="173.6" y="102.4" font-size="14" font-weight="bold" fill="#2f3a2b">40 m</text></g><line x1="220" y1="50" x2="220" y2="270" stroke="#8a9a6b" stroke-width="1.5" stroke-dasharray="3 5" opacity="0"><animate attributeName="opacity" values="0;1" begin="5s" dur="0.5s" fill="freeze"/></line><line x1="240" y1="50" x2="240" y2="270" stroke="#8a9a6b" stroke-width="1.5" stroke-dasharray="3 5" opacity="0"><animate attributeName="opacity" values="0;1" begin="5s" dur="0.5s" fill="freeze"/></line><line x1="260" y1="50" x2="260" y2="270" stroke="#8a9a6b" stroke-width="1.5" stroke-dasharray="3 5" opacity="0"><animate attributeName="opacity" values="0;1" begin="5s" dur="0.5s" fill="freeze"/></line><line x1="280" y1="50" x2="280" y2="270" stroke="#8a9a6b" stroke-width="1.5" stroke-dasharray="3 5" opacity="0"><animate attributeName="opacity" values="0;1" begin="5s" dur="0.5s" fill="freeze"/></line><line x1="300" y1="50" x2="300" y2="270" stroke="#8a9a6b" stroke-width="1.5" stroke-dasharray="3 5" opacity="0"><animate attributeName="opacity" values="0;1" begin="5s" dur="0.5s" fill="freeze"/></line><g opacity="0"><animate attributeName="opacity" values="0;1" begin="5s" dur="0.5s" fill="freeze"/><text x="330" y="270" font-size="13" font-weight="bold" text-anchor="middle" fill="#2f3a2b">10 m</text><text x="330" y="286" font-size="13" font-weight="bold" text-anchor="middle" fill="#2f3a2b">apart</text></g><circle r="7" fill="#e8590c" cx="0" cy="0" opacity="0"><animate attributeName="opacity" values="0;1" begin="5s" dur="0.2s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="220 60;220 60;220 260;260 260;260 110;260 110" keyTimes="0;.52;.7;.74;.9;1" dur="10s" fill="freeze"/></circle><circle r="7" fill="#4a7fb0" cx="0" cy="0" opacity="0"><animate attributeName="opacity" values="0;1" begin="5s" dur="0.2s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="240 60;240 60;240 260;280 260;280 110;280 110" keyTimes="0;.52;.7;.74;.9;1" dur="10s" fill="freeze"/></circle><g opacity="0"><animate attributeName="opacity" values="0;1" begin="9s" dur="0.5s" fill="freeze"/><g transform="translate(286 88) scale(.3)"><g stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"><path d="M-55 22 L-80 56 L-68 60 L-43 26 Z" fill="#6b4f35"/><path d="M-42 22 L-64 56 L-52 60 L-30 26 Z" fill="#6b4f35"/><path d="M48 22 L24 56 L36 60 L60 26 Z" fill="#6b4f35"/><path d="M62 22 L40 56 L52 60 L74 26 Z" fill="#6b4f35"/><path d="M-62 -10 L-98 -44 L-84 -56 L-44 -22 Z" fill="#6b4f35"/><ellipse cx="0" cy="0" rx="85" ry="34" fill="#6b4f35"/><ellipse cx="-106" cy="-50" rx="19" ry="10" fill="#6b4f35"/><path d="M-92 -58 L-82 -74 L-84 -54 Z" fill="#6b4f35"/></g><path d="M-96 -59 L-98 -86 M-98 -74 L-108 -82 M-98 -80 L-88 -92" fill="none" stroke="#6b4f35" stroke-width="3.5" stroke-linecap="round"/></g><text x="340" y="64" font-size="15" font-weight=