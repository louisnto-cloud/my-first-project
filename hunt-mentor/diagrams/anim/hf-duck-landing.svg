<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 344" font-family="sans-serif" role="img" aria-label="Animation, top view of a pond with a J hook decoy spread, mallard decoys drawn as drakes and hens, the wind blowing left to right. The main bunch sits upwind close to your hide on the shore, a tail line runs out downwind, and an open pocket is left in front of the hide. Three ducks fly in from downwind, pass high over the spread, circle back and look, then turn and glide in against the wind, wings cupped, landing in the open pocket. Final caption: land INTO the wind.">
