<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation of glassing an alpine basin at first light. The hunter sits on a high knob with binoculars on a rest. An orange binocular circle sweeps the basin in strips, near strip first, then the middle, then the far slope. It stops on three rams bedded on a bench just below a cliff band. Message: rams bedded on a bench, cliffs right above them." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" fill="#e7eef5"/>
<circle cx="60" cy="70" r="18" fill="#f2b33d" opacity="0.3"><animate attributeName="cy" values="90;60" dur="8s" fill="freeze"/><animate attributeName="opacity" values="0.3;1" dur="8s" fill="freeze"/></circle>
<path d="M0 120 L60 60 L120 110 L190 40 L260 100 L320 50 L400 110 L400 300 L0 300 Z" fill="#cfd8c0" stroke="#8a9a6b" stroke-width="2"/>
