<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="Animation: six map layers drop into place one at a time, starting with the legal base, then closures, access and pressure, habitat and season, terrain and wind, and finally your sign, seats and routes. Final label: one map, ready to hunt.">
<rect x="0" y="0" width="400" height="340" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Watch the map build, layer by layer</text>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 -30;0 0" begin="0.3s" dur="0.5s" fill="freeze"/><path d="M60 278 L200 250 L340 278 L200 306 Z" fill="#2f3a2b" opacity=".88" stroke="#fff" stroke-width="2"/><text x="200" y="283" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1 Legal base: MU, land</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.4s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 -30;0 0" begin="1.4s" dur="0.5s" fill="freeze"/><path d="M60 236 L200 208 L340 236 L200 264 Z" fill="#c0392b" opacity=".88" stroke="#fff" stroke-width="2"/><text x="200" y="241" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2 Closures, No Shooting</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.5s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 -30;0 0" begin="2.5s" dur="0.5s" fill="freeze"/><path d="M60 194 L200 166 L340 194 L200 222 Z" fill="#c08a3e" opacity=".88" stroke="#fff" stroke-width="2"/><text x="200" y="199" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3 Access and pressure</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.6s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 -30;0 0" begin="3.6s" dur="0.5s" fill="freeze"/><path d="M60 152 L200 124 L340 152 L200 180 Z" fill="#8a9a6b" opacity=".88" stroke="#fff" stroke-width="2"/><text x="200" y="157" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4 Habitat and season</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.7s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 -30;0 0" begin="4.7s" dur="0.5s" fill="freeze"/><path d="M60 110 L200 82 L340 110 L200 138 Z" fill="#6b4f35" opacity=".88" stroke="#fff" stroke-width="2"/><text x="200" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">5 Terrain and wind</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="5.8s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 -30;0 0" begin="5.8s" dur="0.5s" fill="freeze"/><path d="M60 68 L200 40 L340 68 L200 96 Z" fill="#e8590c" opacity=".88" stroke="#fff" stroke-width="2"/><text x="200" y="73" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">6 Your sign, seats, routes</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="7.2s" dur="0.5s" fill="freeze"/><rect x="80" y="300" width="240" height="30" rx="8" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="321" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">One map, ready to hunt</text></g>
</svg>
