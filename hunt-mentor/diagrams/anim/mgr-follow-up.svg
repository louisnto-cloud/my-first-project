<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation. A grouse flushes from a bush, glides in an arc and lands in a conifer about 80 metres away. A circle marks the tree. You wait a moment, then walk straight toward the marked tree, ready for a second flush." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Flush, glide, land: mark it</text>
<rect x="0" y="230" width="400" height="70" fill="#dfe6d3"/>
<ellipse cx="70" cy="232" rx="40" ry="18" fill="#8a9a6b"/>
<polygon points="330,122 280.5,232 379.5,232" fill="#2f3a2b"/><rect x="327" y="232" width="6" height="16" fill="#6b4f35"/>
<path id="mgr-follow-up-p" d="M70 220 Q120 120 200 130 Q280 140 318 172" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="6 6"/>
<g><g transform="translate(0 0) scale(0.55 0.55)"><polygon points="-20,-6 -38,-20 -48,-12 -52,0 -48,8 -20,8" fill="#6b4f35"/><path d="M-40 -18 Q-50 -10 -48 6" fill="none" stroke="#23261f" stroke-width="3"/><ellipse cx="0" cy="0" rx="26" ry="15" fill="#9a6b45"/><circle cx="21" cy="-14" r="8" fill="#9a6b45"/><polygon points="16,-20 20,-28 25,-20" fill="#9a6b45"/><polygon points="28,-16 35,-13 28,-10" fill="#6b4f35"/><circle cx="23" cy="-16" r="1.8" fill="#23261f"/><path d="M2 13 l-2 11 M10 13 l2 11" stroke="#6b4f35" stroke-width="2.5" fill="none"/></g><animateMotion dur="3s" fill="freeze"><mpath href="#mgr-follow-up-p"/></animateMotion></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="3s" fill="freeze"/><circle cx="318" cy="172" r="16" fill="none" stroke="#e8590c" stroke-width="3"/></g>
<g><circle cx="20" cy="262" r="9" fill="#e8590c"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;250 -6" keyTimes="0;0.45;1" dur="7s" fill="freeze"/></g>
<text x="20" y="290" font-size="14" fill="#23261f" text-anchor="start">You</text>
<g opacity="0"><set attributeName="opacity" to="1" begin="3.2s" fill="freeze"/><rect x="10" y="44" width="240" height="30" rx="8" fill="#2f3a2b" stroke="none" stroke-width="0"/><text x="130" y="65" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Mark the tree. Go now.</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="7s" fill="freeze"/><text x="200" y="110" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Second flush: be ready</text></g>
</svg>
