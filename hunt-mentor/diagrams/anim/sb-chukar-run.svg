<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, side view of a steep rocky slope. You walk up from the bottom. A covey of chukar runs ahead of you uphill, faster than you can climb. Then the birds flush and fly back downhill and across the slope, past and below you. Lesson: climb above them first, so they flush down toward you. Hunter lore, 65 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <path d="M0 300 L0 270 L400 70 L400 300Z" fill="#c9b79c"/>
  <path d="M0 270 L400 70" stroke="#8b5a2b" stroke-width="3"/>
  <g fill="#8a9a6b"><ellipse cx="120" cy="226" rx="14" ry="6"/><ellipse cx="250" cy="160" rx="14" ry="6"/><ellipse cx="330" cy="122" rx="12" ry="5"/></g>
  <g><g><g transform="translate(0 0) scale(1.0)"><circle r="9" fill="#e8590c"/></g><rect x="-6" y="8" width="12" height="22" rx="4" fill="#e8590c"/></g><animateTransform attributeName="transform" type="translate" values="40 222;150 166;150 166" keyTimes="0;.55;1" dur="9s" fill="freeze"/></g>
  <g><g transform="translate(0 0) scale(0.7)"><ellipse rx="20" ry="13" fill="#a89a86"/><path d="M-6 -2 v10 M0 -3 v11 M6 -3 v10" stroke="#2f3a2b" stroke-width="2.5"/><circle cx="16" cy="-12" r="8" fill="#a89a86"/><path d="M10 -16 Q16 -6 24 -12" stroke="#2f3a2b" stroke-width="2.5" fill="none"/><path d="M23 -13 L29 -11 L23 -9Z" fill="#c0392b"/><path d="M-4 12 L-6 20 M6 12 L8 20" stroke="#c0392b" stroke-width="2.5"/></g><animateTransform attributeName="transform" type="translate" values="180 178;300 118;300 118;220 30;60 120" keyTimes="0;.45;.55;.75;1" dur="9s" fill="freeze"/></g>
  <g><g transform="translate(0 0) scale(0.7)"><ellipse rx="20" ry="13" fill="#a89a86"/><path d="M-6 -2 v10 M0 -3 v11 M6 -3 v10" stroke="#2f3a2b" stroke-width="2.5"/><circle cx="16" cy="-12" r="8" fill="#a89a86"/><path d="M10 -16 Q16 -6 24 -12" stroke="#2f3a2b" stroke-width="2.5" fill="none"/><path d="M23 -13 L29 -11 L23 -9Z" fill="#c0392b"/><path d="M-4 12 L-6 20 M6 12 L8 20" stroke="#c0392b" stroke-width="2.5"/></g><animateTransform attributeName="transform" type="translate" values="202 167;322 107;322 107;286 19;104 98" keyTimes="0;.45;.55;.75;1" dur="9s" fill="freeze"/></g>
  <g><g transform="translate(0 0) scale(0.7)"><ellipse rx="20" ry="13" fill="#a89a86"/><path d="M-6 -2 v10 M0 -3 v11 M6 -3 v10" stroke="#2f3a2b" stroke-width="2.5"/><circle cx="16" cy="-12" r="8" fill="#a89a86"/><path d="M10 -16 Q16 -6 24 -12" stroke="#2f3a2b" stroke-width="2.5" fill="none"/><path d="M23 -13 L29 -11 L23 -9Z" fill="#c0392b"/><path d="M-4 12 L-6 20 M6 12 L8 20" stroke="#c0392b" stroke-width="2.5"/></g><animateTransform attributeName="transform" type="translate" values="160 187;280 127;280 127;160 39;20 138" keyTimes="0;.45;.55;.75;1" dur="9s" fill="freeze"/></g>
  <rect x="10" y="232" width="250" height="40" rx="8" fill="#2f3a2b"/>
  <g><set attributeName="opacity" to="0" begin="4.6s"/><text x="135" y="258" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">They run uphill...</text></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="4.6s"/><set attributeName="opacity" to="0" begin="8.4s"/><text x="135" y="258" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">...then flush downhill</text></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="8.4s"/><text x="135" y="258" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Climb above them first</text></g>
  <text x="200" y="292" font-size="13" fill="#2f3a2b" text-anchor="middle">Hunter lore, 65%</text>
</svg>
