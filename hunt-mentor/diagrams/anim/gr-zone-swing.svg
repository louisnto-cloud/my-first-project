<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation seen from above: two hunters walk side by side, each with a slice of ground in front. A deer runs from right to left. The right hunter's muzzle follows it only inside his own zone. When the deer runs into the gap between the hunters, the muzzle stops at the edge of the zone and goes back to the middle of his own zone. Hold fire.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect width="400" height="300" fill="#dfe6d3" opacity=".5"/>
  <path d="M110 256 L37 80 A 190 190 0 0 1 183 80 Z" fill="#8a9a6b" opacity=".55"/>
  <path d="M290 256 L217 80 A 190 190 0 0 1 363 80 Z" fill="#8a9a6b" opacity=".55"/>
  <text x="200" y="200" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">No shot</text><text x="200" y="218" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">zone</text>
  <circle cx="110" cy="256" r="12" fill="#2f3a2b"/><circle cx="290" cy="256" r="12" fill="#2f3a2b"/>
  <text x="110" y="290" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Partner</text><text x="290" y="290" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">You</text>
  <path id="gr-zone-swing-run" d="M390 110 L10 110" fill="none"/>
  <g>
    <animateMotion dur="6s" fill="freeze"><mpath href="#gr-zone-swing-run"/></animateMotion>
    <g transform="scale(-1 1)"><ellipse rx="16" ry="8" fill="#8b5a2b"/><circle cx="15" cy="-8" r="6" fill="#8b5a2b"/></g>
  </g>
  <line x1="290" y1="256" x2="290" y2="150" stroke="#e8590c" stroke-width="5" stroke-linecap="round">
    <animate attributeName="x2" values="290;290;334;246;246;290" keyTimes="0;0.06;0.105;0.42;0.48;1" dur="6s" fill="freeze"/>
    <animate attributeName="y2" values="150;150;150;150;150;176" keyTimes="0;0.06;0.105;0.42;0.48;1" dur="6s" fill="freeze"/>
  </line>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.6s" dur=".4s" fill="freeze"/>
    <rect x="110" y="20" width="180" height="40" rx="8" fill="#c0392b"/><text x="200" y="46" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">Hold fire</text>
  </g>
</svg>
