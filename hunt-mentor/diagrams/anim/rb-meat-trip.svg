<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: the cancelled species licence travels with the deer from the kill site, in the truck, to home. All the way, the tail and evidence of sex stay attached. Once the meat is butchered and stored at home, the evidence may come off." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#23261f" text-anchor="middle" font-weight="bold">Evidence stays on all the way</text>
<line x1="40" y1="170" x2="360" y2="170" stroke="#8a9a6b" stroke-width="6" stroke-dasharray="2 10" stroke-linecap="round"/>
<g transform="translate(50 120) scale(0.8)"><ellipse cx="0" cy="6" rx="30" ry="10" fill="#8b5a2b"/><circle cx="30" cy="4" r="7" fill="#8b5a2b"/><path d="M-24 12 l-10 4 M-16 14 l-6 6 M18 14 l8 6 M24 12 l12 2" stroke="#8b5a2b" stroke-width="3"/><path d="M33 -2 l6 -10 l4 3 M36 -6 l-2 -8" stroke="#5c3b1c" stroke-width="2" fill="none"/></g><text x="50" y="210" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Kill site</text>
<g transform="translate(200 150) scale(1.1)"><rect x="-34" y="-14" width="40" height="22" rx="3" fill="#4a7fb0"/><path d="M6 -14 L22 -14 L32 -2 L32 8 L6 8 Z" fill="#4a7fb0"/><path d="M10 -10 L20 -10 L27 -2 L10 -2 Z" fill="#ffffff"/><circle cx="-20" cy="10" r="7" fill="#2f3a2b"/><circle cx="20" cy="10" r="7" fill="#2f3a2b"/></g><text x="200" y="210" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Drive</text>
<g transform="translate(350 150) scale(1.2)"><rect x="-18" y="-6" width="36" height="24" fill="#8b5a2b"/><path d="M-24 -4 L0 -24 L24 -4 Z" fill="#2f3a2b"/><rect x="-5" y="6" width="10" height="12" fill="#fffaf0"/></g><text x="350" y="210" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Home</text>
<g transform="translate(50 82)"><g><g transform="translate(0 0) scale(0.6)"><rect x="-26" y="-18" width="52" height="36" rx="4" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><line x1="-18" y1="-8" x2="18" y2="-8" stroke="#2f3a2b" stroke-width="2.5"/><line x1="-18" y1="0" x2="10" y2="0" stroke="#2f3a2b" stroke-width="2"/><line x1="-18" y1="8" x2="14" y2="8" stroke="#2f3a2b" stroke-width="2"/><path d="M-26 -8 l6 3 l-6 3 Z M26 2 l-6 3 l6 3 Z" fill="#e8590c"/></g><animateTransform attributeName="transform" type="translate" values="0 0;150 26;300 26" keyTimes="0;0.45;1" begin="0.5s" dur="5s" fill="freeze"/></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0s" dur="0.3s" fill="freeze"/><animate attributeName="opacity" values="1;0" begin="5.5s" dur="0.3s" fill="freeze"/><rect x="10" y="244" width="380" height="36" rx="8" fill="#e8590c" stroke="#e8590c" stroke-width="2"/><text x="200" y="268" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Tail and evidence of sex: attached</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="5.5s" dur="0.4s" fill="freeze"/><rect x="10" y="244" width="380" height="36" rx="8" fill="#5c7a3a" stroke="#5c7a3a" stroke-width="2"/><text x="200" y="268" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Butchered and stored at home: may come off</text></g>
</svg>
