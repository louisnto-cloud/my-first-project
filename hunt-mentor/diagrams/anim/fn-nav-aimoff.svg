<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: the truck is on a road. Walking straight at it, a small error leaves you unsure whether to turn left or right at the road. Instead you aim to the left on purpose, hit the road, and turn right to the truck.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#dfe6d3" stroke="none" stroke-width="2"/><line x1="0" y1="70" x2="400" y2="70" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><text x="10" y="60" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Road</text><g transform="translate(260 58)"><rect x="-22" y="-14" width="30" height="14" fill="#2f3a2b"/><path d="M8 -14 h10 l6 7 v7 h-16 Z" fill="#2f3a2b"/><circle cx="-12" cy="2" r="5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/><circle cx="14" cy="2" r="5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/></g><text x="260" y="40" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Truck</text><text x="14" y="290" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Aim left on purpose, then turn right.</text><path id="fn-nav-aimoff-p" d="M200 260 L150 72 L245 72" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="8 6"/><line x1="200" y1="260" x2="260" y2="72" stroke="#868e96" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 6"/><text x="250" y="150" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="start">Straight at it?</text><text x="250" y="166" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="start">Left or right?</text><g><circle r="9" fill="#2f3a2b"/><animateMotion dur="7s" fill="freeze"><mpath href="#fn-nav-aimoff-p"/></animateMotion></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.5s" dur=".5s" fill="freeze"/><text x="150" y="100" font-family="sans-serif" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Hit road: turn right</text></g>
</svg>
