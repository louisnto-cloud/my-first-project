<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a bedded deer on a slope. Wind flows over the ridge from behind it, so its nose covers behind and above. Its eyes cover the slope below. Approach from the side or from above with the wind in your face.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Eyes below, nose behind</text>
<path d="M0 260 L150 170 L230 140 L400 60 V300 H0 Z" fill="#cfdcb5"/><g transform="translate(330 92) scale(0.6)"><rect x="-3" y="-10" width="6" height="12" fill="#6b4f35"/><path d="M0 -50 L16 -10 L-16 -10 Z" fill="#8a9a6b"/></g><g transform="translate(360 80) scale(0.6)"><rect x="-3" y="-10" width="6" height="12" fill="#6b4f35"/><path d="M0 -50 L16 -10 L-16 -10 Z" fill="#8a9a6b"/></g><ellipse cx="240" cy="136" rx="26" ry="9" fill="#8b5a2b"/><g opacity="0"><animate attributeName="opacity" values="0;1;0" begin="0.0s" dur="2.4s" repeatCount="indefinite"/><path d="M380 70 q-40 10 -120 50" fill="none" stroke="#4a7fb0" stroke-width="3" stroke-dasharray="6 6"/></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" begin="1.2s" dur="2.4s" repeatCount="indefinite"/><path d="M380 84 q-40 10 -120 56" fill="none" stroke="#4a7fb0" stroke-width="3" stroke-dasharray="6 6"/></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" begin="2.4s" dur="2.4s" repeatCount="indefinite"/><path d="M380 98 q-40 10 -120 62" fill="none" stroke="#4a7fb0" stroke-width="3" stroke-dasharray="6 6"/></g><path d="M240 136 L60 250 L140 270 Z" fill="#e8590c" opacity="0"><animate attributeName="opacity" from="0" to="0.25" begin="1s" dur="1s" fill="freeze"/></path><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.4s" fill="freeze"/><text x="110" y="230" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">eyes cover below</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.4s" fill="freeze"/><text x="300" y="62" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">nose covers behind</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.0s" dur="0.4s" fill="freeze"/><rect x="20" y="266" width="360" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="287.6666666666667" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Come from the side or from above, wind right</text></g>
</svg>
