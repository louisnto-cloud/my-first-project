stroke="#23261f" stroke-width="1.5"/><rect x="31" y="6" width="7" height="38" rx="3.5" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><ellipse cx="0" cy="0" rx="42" ry="17" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="-37" cy="-2" rx="8" ry="11" fill="#fff" stroke="#23261f" stroke-width="1"/><path d="M-42 -6 Q-47 4 -45 14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M-45 10 L-45 16" stroke="#111" stroke-width="5" stroke-linecap="round"/><path d="M26 -10 L42 -40 L56 -36 L40 6 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="2" stroke-linejoin="round"/><ellipse cx="56" cy="-40" rx="14" ry="7" transform="rotate(18 56 -40)" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="42" cy="-50" rx="11" ry="4.5" transform="rotate(-35 42 -50)" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><circle cx="58" cy="-42" r="1.8" fill="#23261f"/><path d="M48 -46 L50 -62 M50 -62 L42 -76 M50 -62 L60 -72 M42 -76 L36 -88 M42 -76 L48 -90 M60 -72 L58 -86 M60 -72 L70 -82" stroke="#6b4f35" stroke-width="3.5" fill="none" stroke-linecap="round"/></g><set attributeName="transform" to="scale(-1 1)" begin="5.6s"/></g></g><animateMotion dur="10s" fill="freeze" calcMode="linear" keyPoints="0;0;0.27;0.5;0.5;0.5;0.73;0.73;1;1" keyTimes="0;0.15;0.33;0.45;0.5;0.56;0.64;0.8;0.95;1"><mpath href="#sa-deer-day-path"/></animateMotion></g><g opacity="1"><set attributeName="opacity" to="1" begin="0s"/><set attributeName="opacity" to="0" begin="1.5s"/><rect x="150" y="8" width="244" height="54" rx="8" fill="#2f3a2b"/><text x="162" y="30" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">10:00 to 15:00</text><text x="162" y="52" font-size="14" fill="#fff" text-anchor="start">Bedded, chewing cud</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="1.5s"/><set attributeName="opacity" to="0" begin="4.2s"/><rect x="150" y="8" width="244" height="54" rx="8" fill="#2f3a2b"/><text x="162" y="30" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">16:00 to 21:00</text><text x="162" y="52" font-size="14" fill="#fff" text-anchor="start">Rises, browses, walks out to feed</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="4.2s"/><set attributeName="opacity" to="0" begin="5.6s"/><rect x="150" y="8" width="244" height="54" rx="8" fill="#2f3a2b"/><text x="162" y="30" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">Dusk or dawn, dry fall</text><text x="162" y="52" font-size="14" fill="#fff" text-anchor="start">Drinks near water (Tip)</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="5.6s"/><set attributeName="opacity" to="0" begin="6.4s"/><rect x="150" y="8" width="244" height="54" rx="8" fill="#2f3a2b"/><text x="162" y="30" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">Night</text><text x="162" y="52" font-size="14" fill="#fff" text-anchor="start">Feeds on and off, rests</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="6.4s"/><set attributeName="opacity" to="0" begin="8.0s"/><rect x="150" y="8" width="244" height="54" rx="8" fill="#2f3a2b"/><text x="162" y="30" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">04:00 to 09:00</text><text x="162" y="52" font-size="14" fill="#fff" text-anchor="start">Big morning feed</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="8.0s"/><set attributeName="opacity" to="0" begin="9.6s"/><rect x="150" y="8" width="244" height="54" rx="8" fill="#2f3a2b"/><text x="162" y="30" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">After sunrise</text><text x="162" y="52" font-size="14" fill="#fff" text-anchor="start">Drifts uphill to cover</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="9.6s"/><rect x="150" y="8" width="244" height="54" rx="8" fill="#e8590c"/><text x="162" y="30" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">Your move</text><text x="162" y="52" font-size="14" fill="#fff" text-anchor="start">Be glassing before legal light</text></g>
</svg>
