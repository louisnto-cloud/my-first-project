<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation of a mule deer day in late October, side view of a slope. Midday, about 10:00 to 15:00, the deer is bedded in timber near the top, chewing cud. From about 16:00 it rises, browses and walks down to the open feeding slope, feeding until about 21:00. In a dry fall it drinks near water at dusk or dawn, a tip. It feeds on and off through the night. The big morning feed runs about 04:00 to 09:00. After sunrise it drifts uphill back to the timber and beds. Lesson: be glassing before legal light.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
