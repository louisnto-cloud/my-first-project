<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation. A lone black bear feeds in the open while a timer counts minutes 0 to 5. At about minute 4 a small cub walks out of the bushes behind it. An orange ring marks the cub. The sow is closed to hunting because the cub, under 2 years old, is in her company. Grandpa&#x27;s rule: watch every bear for five minutes; cubs show up in the fourth.">
