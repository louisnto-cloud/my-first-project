"1.8" fill="#eee"/></g><animateTransform attributeName="transform" type="translate" from="360 230" to="300 226" begin="6.2s" dur="1s" fill="freeze"/></g></g><ellipse cx="360" cy="226" rx="38.4" ry="24.0" fill="#8a9a6b"/><ellipse cx="384.0" cy="214.0" rx="24.0" ry="19.2" fill="#8a9a6b"/><ellipse cx="330" cy="240" rx="25.6" ry="16.0" fill="#8a9a6b"/><ellipse cx="346.0" cy="232.0" rx="16.0" ry="12.8" fill="#8a9a6b"/><rect x="8" y="8" width="150" height="54" rx="8" fill="#2f3a2b"/><text x="20" y="30" font-size="14" font-weight="bold" fill="#fff" text-anchor="start">Watching</text><g opacity="1"><set attributeName="opacity" to="1" begin="0.0s"/><set attributeName="opacity" to="0" begin="1.5s"/><text x="20" y="54" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="start">minute 0</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="1.5s"/><set attributeName="opacity" to="0" begin="3.0s"/><text x="20" y="54" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="start">minute 1</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="3.0s"/><set attributeName="opacity" to="0" begin="4.5s"/><text x="20" y="54" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="start">minute 2</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="4.5s"/><set attributeName="opacity" to="0" begin="6.0s"/><text x="20" y="54" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="start">minute 3</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="6.0s"/><set attributeName="opacity" to="0" begin="7.5s"/><text x="20" y="54" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="start">minute 4</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="7.5s"/><text x="20" y="54" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="start">minute 5</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="6.8s"/><circle cx="300" cy="226" r="34" fill="none" stroke="#e8590c" stroke-width="4"/><rect x="170" y="70" width="222" height="58" rx="8" fill="#c92a2a"/><text x="182" y="94" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">A cub! Mother is closed:</text><text x="182" y="116" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">it is in her company.</text></g><text x="10" y="290" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Grandpa&#x27;s rule: cubs show up in the fourth minute.</text>
