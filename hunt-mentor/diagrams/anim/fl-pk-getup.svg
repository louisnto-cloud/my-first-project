<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation in four steps: sit with your back against the pack and buckle the hip belt, roll onto one knee, push up with your hands on the front knee, stand tall with a pole for balance.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Getting up with a heavy pack</text>
<rect x="10" y="240" width="380" height="10" rx="3" fill="#c9b79c"/>
<g opacity="0"><set attributeName="opacity" to="1" begin="0s" dur="2s"/><circle cx="150" cy="180" r="11" fill="#2f3a2b"/><line x1="150" y1="191" x2="160" y2="232" stroke="#2f3a2b" stroke-width="7" stroke-linecap="round"/><line x1="160" y1="232" x2="214" y2="236" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><rect x="112" y="186" width="34" height="52" rx="8" fill="#8b5a2b"/><text x="200" y="282" font-family="sans-serif" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">Sit, back to the pack, buckle up</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="2s" dur="2s"/><circle cx="190" cy="150" r="11" fill="#2f3a2b"/><line x1="190" y1="161" x2="196" y2="210" stroke="#2f3a2b" stroke-width="7" stroke-linecap="round"/><line x1="196" y1="210" x2="230" y2="214" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="230" y1="214" x2="230" y2="240" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="196" y1="210" x2="176" y2="240" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><rect x="160" y="160" width="30" height="48" rx="8" fill="#8b5a2b"/><text x="200" y="282" font-family="sans-serif" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">Roll onto one knee</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="4s" dur="2s"/><circle cx="210" cy="120" r="11" fill="#2f3a2b"/><line x1="210" y1="131" x2="214" y2="190" stroke="#2f3a2b" stroke-width="7" stroke-linecap="round"/><line x1="214" y1="190" x2="246" y2="194" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="246" y1="194" x2="246" y2="240" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="214" y1="190" x2="200" y2="240" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="212" y1="150" x2="240" y2="190" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><rect x="180" y="130" width="30" height="50" rx="8" fill="#8b5a2b"/><text x="200" y="282" font-family="sans-serif" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">Hands on the front knee, push</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="6s" fill="freeze"/><circle cx="230" cy="74" r="11" fill="#2f3a2b"/><line x1="230" y1="85" x2="230" y2="160" stroke="#2f3a2b" stroke-width="7" stroke-linecap="round"/><line x1="230" y1="160" x2="220" y2="240" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="230" y1="160" x2="240" y2="240" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><rect x="200" y="92" width="30" height="52" rx="8" fill="#8b5a2b"/><line x1="244" y1="120" x2="262" y2="238" stroke="#23261f" stroke-width="3" stroke-linecap="round"/><text x="200" y="282" font-family="sans-serif" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">Stand tall, use a pole</text></g>
</svg>
