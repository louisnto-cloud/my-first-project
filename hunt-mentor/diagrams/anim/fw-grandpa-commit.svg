<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, side view over decoys. The wind blows from behind the blind on the left toward the decoys. A drake mallard flies in high from the right, circles, turns into the wind, cups its wings and drops its feet over the open hole in front of the blind. Only then the label says: wings cupped, feet down, now pick one bird. Shooting early, while it is still high, means a longer shot and more cripples.">
