<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation, side view over decoys. The wind blows from behind the blind on the left toward the decoys. A duck flies in high from the right, circles, turns into the wind, cups its wings and drops its feet over the open hole in front of the blind. Only then the label says: now, stand and pick the bird. Shooting early, while it is still high, means a longer shot and more cripples.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect x="0" y="210" width="400" height="90" fill="#4a7fb0"/>
  <rect x="0" y="180" width="60" height="40" fill="#8a9a6b"/>
  <rect x="10" y="150" width="40" height="40" rx="4" fill="#6b4f35"/>
  <text x="30" y="144" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Blind</text>
  <g fill="#8b5a2b"><ellipse cx="200" cy="214" rx="14" ry="6"/><ellipse cx="240" cy="218" rx="14" ry="6"/><ellipse cx="300" cy="214" rx="14" ry="6"/><ellipse cx="340" cy="220" rx="14" ry="6"/><ellipse cx="270" cy="226" rx="14" ry="6"/></g>
  <rect x="100" y="232" width="70" height="20" rx="4" fill="#fffaf0" opacity="0.6"/>
  <text x="135" y="247" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="middle">Hole</text>
  <g stroke="#4a7fb0" stroke-width="3" fill="none">
    <path d="M70 40 h60 m-10 -6 l10 6 l-10 6"><animateTransform attributeName="transform" type="translate" values="0 0;16 0;0 0" dur="2s" repeatCount="indefinite"/></path>
  </g>
  <text x="70" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4a7fb0">Wind at your back</text>
  <path id="fw-grandpa-commit-path" d="M380 60 C 300 40, 220 50, 180 80 S 300 140, 260 150 S 160 170, 140 210" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="6 6" opacity="0.5"/>
  <g>
    <ellipse rx="14" ry="7" fill="#2f3a2b"/><circle cx="-12" cy="-4" r="5" fill="#2f3a2b"/>
    <path d="M-6 -2 L4 -16 L10 -2 Z" fill="#2f3a2b">
      <animate attributeName="d" values="M-6 -2 L4 -16 L10 -2 Z;M-6 -2 L4 10 L10 -2 Z;M-6 -2 L4 -16 L10 -2 Z" dur="0.4s" repeatCount="12"/>
    </path>
    <g opacity="0"><animate attributeName="opacity" values="0;1" begin="5s" dur="0.3s" fill="freeze"/>
      <path d="M-4 6 L-6 16 M4 6 L6 16" stroke="#e8590c" stroke-width="3"/>
    </g>
    <animateMotion dur="6s" fill="freeze" rotate="0"><mpath href="#fw-grandpa-commit-path"/></animateMotion>
  </g>
  <g opacity="1"><animate attributeName="opacity" values="1;0" begin="5.2s" dur="0.3s" fill="freeze"/>
    <text x="250" y="110" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b">Still high: wait</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="6s" dur="0.4s" fill="freeze"/>
    <rect x="190" y="90" width="190" height="56" rx="8" fill="#2f3a2b"/>
    <text x="285" y="114" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Wings cupped, feet down</text>
    <text x="285" y="136" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Now: pick one bird</text>
  </g>
</svg>
