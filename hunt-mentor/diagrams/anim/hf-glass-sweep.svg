<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation of the grid method. A binocular view moves across a hillside in slow strips, stopping at each spot. Near strip left to right, middle strip right to left, far strip left to right. Each view overlaps the last by about a third, leaving no gaps. On the far strip it stops on two ears showing above a bush: a bedded deer.">
