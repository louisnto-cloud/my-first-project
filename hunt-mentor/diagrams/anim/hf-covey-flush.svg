<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation of a covey flush, top view. You walk with your partner off to the right. The covey bursts out of the brush with a whirr and fans in every direction. You pick one bird high in the safe wedge ahead of you. One bird flies low toward your partner: no shot."><rect width="400" height="300" fill="#efe6cf"/>
<path d="M200 270 L40 20 L360 20 Z" fill="#dfe6d3" opacity=".8"/>
<ellipse cx="200" cy="165" rx="60" ry="26" fill="#8a9a6b"/>
<circle cx="200" cy="270" r="10" fill="#e8590c"/><circle cx="330" cy="270" r="10" fill="#4a7fb0"/>
<line x1="210" y1="270" x2="320" y2="270" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4"/>
<text x="200" y="296" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">You</text><text x="330" y="296" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Partner</text>
<g><animateTransform attributeName="transform" type="translate" values="200 160;200 160;80 40;80 40" keyTimes="0;0.2;0.55;1" dur="7s" fill="freeze"/><g transform="scale(1.2)"><ellipse rx="8" ry="6" fill="#6b6f78"/><circle cx="7" cy="-4" r="4" fill="#2f3a2b"/></g></g><g><animateTransform attributeName="transform" type="translate" values="200 160;200 160;150 20;150 20" keyTimes="0;0.2;0.55;1" dur="7s" fill="freeze"/><g transform="scale(1.2)"><ellipse rx="8" ry="6" fill="#6b6f78"/><circle cx="7" cy="-4" r="4" fill="#2f3a2b"/></g></g><g><animateTransform attributeName="transform" type="translate" values="200 160;200 160;220 30;220 30" keyTimes="0;0.2;0.55;1" dur="7s" fill="freeze"/><g transform="scale(1.2)"><ellipse rx="8" ry="6" fill="#6b6f78"/><circle cx="7" cy="-4" r="4" fill="#2f3a2b"/></g></g><g><animateTransform attributeName="transform" type="translate" values="200 160;200 160;300 30;300 30" keyTimes="0;0.2;0.55;1" dur="7s" fill="freeze"/><g transform="scale(1.2)"><ellipse rx="8" ry="6" fill="#6b6f78"/><circle cx="7" cy="-4" r="4" fill="#2f3a2b"/></g></g><g><animateTransform attributeName="transform" type="translate" values="200 160;200 160;350 80;350 80" keyTimes="0;0.2;0.55;1" dur="7s" fill="freeze"/><g transform="scale(1.2)"><ellipse rx="8" ry="6" fill="#6b6f78"/><circle cx="7" cy="-4" r="4" fill="#2f3a2b"/></g></g><g><animateTransform attributeName="transform" type="translate" values="200 160;200 160;60 110;60 110" keyTimes="0;0.2;0.55;1" dur="7s" fill="freeze"/><g transform="scale(1.2)"><ellipse rx="8" ry="6" fill="#6b6f78"/><circle cx="7" cy="-4" r="4" fill="#2f3a2b"/></g></g><g><animateTransform attributeName="transform" type="translate" values="200 160;200 160;270 230;380 250" keyTimes="0;0.2;0.5;1" dur="7s" fill="freeze"/><g transform="scale(1.2)"><ellipse rx="8" ry="6" fill="#6b6f78"/><circle cx="7" cy="-4" r="4" fill="#2f3a2b"/></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.6s" dur=".3s" fill="freeze"/><circle cx="150" cy="20" r="16" fill="none" stroke="#e8590c" stroke-width="3"/><text x="172" y="58" font-size="15" font-weight="bold" fill="#e8590c">pick ONE</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="4s" dur=".3s" fill="freeze"/><path d="M276 196 L304 224 M304 196 L276 224" stroke="#c0392b" stroke-width="5"/><text x="268" y="204" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="end">low, near partner:</text><text x="268" y="222" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="end">NO shot</text></g>
<text x="12" y="150" font-size="14" font-weight="bold" fill="#2f3a2b">safe wedge,</text><text x="12" y="168" font-size="14" font-weight="bold" fill="#2f3a2b">birds above head</text>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.3s" dur=".2s" fill="freeze"/><animate attributeName="opacity" values="1;0" begin="2.3s" dur=".3s" fill="freeze"/><text x="200" y="120" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">WHIRR!</text></g></svg>
