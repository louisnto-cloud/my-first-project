<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: in a forest with no sun or landmark, a walker who feels they are going straight draws a path that curves back and crosses their own start. Felt straight, was a circle.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">No sun, no landmark: you circle</text><rect x="0" y="40" width="400" height="260" rx="0" fill="#dfe6d3"/><rect x="37" y="100" width="6" height="10" rx="0" fill="#8b5a2b"/><polygon points="40,60 29,100 51,100" fill="#8a9a6b"/><rect x="87" y="250" width="6" height="10" rx="0" fill="#8b5a2b"/><polygon points="90,210 79,250 101,250" fill="#8a9a6b"/><rect x="337" y="100" width="6" height="10" rx="0" fill="#8b5a2b"/><polygon points="340,60 329,100 351,100" fill="#8a9a6b"/><rect x="357" y="230" width="6" height="10" rx="0" fill="#8b5a2b"/><polygon points="360,190 349,230 371,230" fill="#8a9a6b"/><rect x="57" y="170" width="6" height="10" rx="0" fill="#8b5a2b"/><polygon points="60,130 49,170 71,170" fill="#8a9a6b"/><rect x="327" y="160" width="6" height="10" rx="0" fill="#8b5a2b"/><polygon points="330,120 319,160 341,160" fill="#8a9a6b"/><rect x="197" y="270" width="6" height="10" rx="0" fill="#8b5a2b"/><polygon points="200,230 189,270 211,270" fill="#8a9a6b"/><rect x="147" y="90" width="6" height="10" rx="0" fill="#8b5a2b"/><polygon points="150,50 139,90 161,90" fill="#8a9a6b"/><circle cx="200" cy="150" r="6.0" fill="#e8590c"/><text x="200" y="136" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">start</text><path d="M200 150 C260 120 300 180 260 220 C220 260 140 240 130 190 C120 140 170 110 210 130 C250 150 240 200 200 205" fill="none" stroke="#e8590c" stroke-width="4" stroke-dasharray="600" stroke-dashoffset="600"><animate attributeName="stroke-dashoffset" values="600;0" dur="6s" fill="freeze"/></path><g opacity="0"><animate attributeName="opacity" values="0;1" begin="6s" dur="0.4s" fill="freeze"/><rect x="68" y="262" width="265" height="30" rx="6" fill="#c0392b"/><text x="200" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Felt straight. Was a circle</text></g>
</svg>
