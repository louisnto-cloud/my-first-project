<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: water slowly floods a hill in side view. Each time the water rises one step, its shoreline appears as a new brown ring on the map view to the right. Four rings appear, crowded on the steep side. Every shoreline is a contour line.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0" stroke="none" stroke-width="2"/><path d="M20 200 C 60 195, 90 90, 130 70 C 150 62, 165 95, 190 200 Z" fill="#dfe6d3" stroke="#8b5a2b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="105" y="240" font-family="sans-serif" font-size="15" fill="#4a7fb0" text-anchor="middle" font-weight="bold">Water rises</text><rect x="10" y="200" width="200" height="0" fill="#4a7fb0" opacity=".35"><animate attributeName="y" values="200;170;140;110;80" keyTimes="0;.25;.5;.75;1" dur="8s" fill="freeze"/><animate attributeName="height" values="0;30;60;90;120" keyTimes="0;.25;.5;.75;1" dur="8s" fill="freeze"/></rect><ellipse cx="300" cy="150" rx="78" ry="100" fill="none" stroke="#8b5a2b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.6s" dur=".4s" fill="freeze"/></ellipse><ellipse cx="314" cy="150" rx="56" ry="76" fill="none" stroke="#8b5a2b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1" begin="3.6s" dur=".4s" fill="freeze"/></ellipse><ellipse cx="326" cy="150" rx="36" ry="52" fill="none" stroke="#8b5a2b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1" begin="5.6s" dur=".4s" fill="freeze"/></ellipse><ellipse cx="336" cy="150" rx="16" ry="26" fill="none" stroke="#8b5a2b" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;1" begin="7.6s" dur=".4s" fill="freeze"/></ellipse><text x="300" y="285" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Each shoreline is a contour</text><text x="105" y="285" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Side view</text>
</svg>
