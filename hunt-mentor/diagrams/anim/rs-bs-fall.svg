<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a bird flies, the shot hits, a puff of feathers drifts down, and the bird falls behind a bush. Mark the spot by lining it up with a tree, keep your eyes on it, and walk straight to it.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">After your shot: mark the fall</text>
<rect x="0" y="220" width="400" height="80" rx="0" fill="#cfdcb5"/><g transform="translate(330 222) scale(1.2)"><rect x="-3" y="-10" width="6" height="12" fill="#6b4f35"/><path d="M0 -50 L16 -10 L-16 -10 Z" fill="#8a9a6b"/></g><g transform="translate(370 222) scale(0.9)"><rect x="-3" y="-10" width="6" height="12" fill="#6b4f35"/><path d="M0 -50 L16 -10 L-16 -10 Z" fill="#8a9a6b"/></g><g><path d="M-10 0 l10 -4 l10 4 l-10 2 Z" fill="#6b4f35"/><animateMotion dur="2.2s" fill="freeze" path="M40 90 L200 70 Q250 66 280 120 Q300 170 306 214"/></g><g opacity="0" transform="translate(200 70)"><animate attributeName="opacity" values="0;1;0" begin="1.0s" dur="2s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="200 70" to="190 110" begin="1.0s" dur="2s" fill="freeze"/><path d="M0 -4 Q2 0 0 4 Q-2 0 0 -4 Z" fill="#9aa3ad"/></g><g opacity="0" transform="translate(200 70)"><animate attributeName="opacity" values="0;1;0" begin="1.0s" dur="2s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="200 70" to="196 118" begin="1.0s" dur="2s" fill="freeze"/><path d="M0 -4 Q2 0 0 4 Q-2 0 0 -4 Z" fill="#9aa3ad"/></g><g opacity="0" transform="translate(200 70)"><animate attributeName="opacity" values="0;1;0" begin="1.0s" dur="2s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="200 70" to="202 126" begin="1.0s" dur="2s" fill="freeze"/><path d="M0 -4 Q2 0 0 4 Q-2 0 0 -4 Z" fill="#9aa3ad"/></g><g opacity="0" transform="translate(200 70)"><animate attributeName="opacity" values="0;1;0" begin="1.0s" dur="2s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="200 70" to="208 134" begin="1.0s" dur="2s" fill="freeze"/><path d="M0 -4 Q2 0 0 4 Q-2 0 0 -4 Z" fill="#9aa3ad"/></g><g opacity="0" transform="translate(200 70)"><animate attributeName="opacity" values="0;1;0" begin="1.0s" dur="2s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="200 70" to="214 142" begin="1.0s" dur="2s" fill="freeze"/><path d="M0 -4 Q2 0 0 4 Q-2 0 0 -4 Z" fill="#9aa3ad"/></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.4s" fill="freeze"/><text x="200" y="52" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">feathers puff: a hit</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.4s" fill="freeze"/><line x1="306" y1="214" x2="306" y2="150" stroke="#e8590c" stroke-width="2" stroke-dasharray="4 3"/><text x="306" y="140" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">mark it: line it up</text><text x="306" y="158" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">with a tree</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.4s" fill="freeze"/><rect x="20" y="250" width="360" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="272.0" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Eyes on the spot. Walk straight to it.</text></g>
</svg>
