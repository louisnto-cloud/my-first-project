<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a pickup drives a resource road past kilometre signs 2, 4, 6 and 8. Numbers going up means you call up. It turns and drives back toward lower numbers: coming back down, you call down.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="30" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Up or down? Read the kilometre signs</text>
<rect x="0" y="44" width="400" height="256" fill="#e7ecd9"/>
<path d="M40 262 C 120 236, 200 220, 260 170 S 340 100, 380 92" fill="none" stroke="#c9b79c" stroke-width="28" stroke-linecap="round"/>
<path d="M40 262 C 120 236, 200 220, 260 170 S 340 100, 380 92" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="8 8"/>
<rect x="68" y="214" width="4" height="28" rx="1" fill="#6b4f35"/><rect x="53" y="190" width="34" height="26" rx="3" fill="#1f5a2f" stroke="#fff" stroke-width="1.5"/><text x="70" y="209" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<rect x="154" y="192" width="4" height="28" rx="1" fill="#6b4f35"/><rect x="139" y="168" width="34" height="26" rx="3" fill="#1f5a2f" stroke="#fff" stroke-width="1.5"/><text x="156" y="187" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<rect x="234" y="156" width="4" height="28" rx="1" fill="#6b4f35"/><rect x="219" y="132" width="34" height="26" rx="3" fill="#1f5a2f" stroke="#fff" stroke-width="1.5"/><text x="236" y="151" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
<rect x="316" y="98" width="4" height="28" rx="1" fill="#6b4f35"/><rect x="301" y="74" width="34" height="26" rx="3" fill="#1f5a2f" stroke="#fff" stroke-width="1.5"/><text x="318" y="93" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">8</text>
<path id="fl-fsr-updown-p" d="M40 262 C 120 236, 200 220, 260 170 S 340 100, 380 92" fill="none" stroke="none"/>
<g><rect x="-16" y="-9" width="32" height="18" rx="4" fill="#e8590c" stroke="#7a2f08" stroke-width="1.2"/><rect x="4" y="-7.5" width="8" height="15" rx="2" fill="#2b3a4a"/><path d="M-13 -6 H1 V6 H-13z" fill="none" stroke="#7a2f08" stroke-width="1.2"/><animateMotion dur="4.5s" fill="freeze" rotate="auto"><mpath href="#fl-fsr-updown-p"/></animateMotion><animateMotion begin="5.5s" dur="4.5s" fill="freeze" rotate="auto-reverse" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#fl-fsr-updown-p"/></animateMotion></g>
<g display="none"><set attributeName="display" to="inline" begin="0.3s" fill="freeze"/><set attributeName="display" to="none" begin="5.5s" fill="freeze"/><rect x="196" y="214" width="196" height="72" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="2.5"/><text x="294" y="242" font-size="16" font-weight="bold" fill="#c2410c" text-anchor="middle">Numbers going up</text><text x="294" y="270" font-size="19" font-weight="bold" fill="#c2410c" text-anchor="middle">You call: UP</text></g>
<g display="none"><set attributeName="display" to="inline" begin="5.5s" fill="freeze"/><rect x="196" y="214" width="196" height="72" rx="8" fill="#2f3a2b"/><text x="294" y="242" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Coming back down</text><text x="294" y="270" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">You call: DOWN</text></g>
</svg>
