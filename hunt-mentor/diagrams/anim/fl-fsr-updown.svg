<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: a pickup drives a resource road past kilometre signs 2, 4, 6 and 8. Numbers going up means you call up. Coming back toward lower numbers you call down.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Up or down? Read the kilometre signs</text>
<path d="M40 270 C 120 240, 200 220, 260 170 S 340 100, 380 92" fill="none" stroke="#c9b79c" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M40 270 C 120 240, 200 220, 260 170 S 340 100, 380 92" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8"/>
<rect x="68" y="200" width="4" height="30" rx="1" fill="#6b4f35"/><rect x="54" y="180" width="32" height="24" rx="3" fill="#1f5a2f"/><text x="70" y="198" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<rect x="158" y="176" width="4" height="30" rx="1" fill="#6b4f35"/><rect x="144" y="156" width="32" height="24" rx="3" fill="#1f5a2f"/><text x="160" y="174" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<rect x="236" y="140" width="4" height="30" rx="1" fill="#6b4f35"/><rect x="222" y="120" width="32" height="24" rx="3" fill="#1f5a2f"/><text x="238" y="138" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<rect x="316" y="80" width="4" height="30" rx="1" fill="#6b4f35"/><rect x="302" y="60" width="32" height="24" rx="3" fill="#1f5a2f"/><text x="318" y="78" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
<path id="fl-fsr-updown-p" d="M40 270 C 120 240, 200 220, 260 170 S 340 100, 380 92" fill="none" stroke="none"/>
<g><rect x="-14" y="-9" width="28" height="18" rx="4" fill="#e8590c"/><animateMotion dur="5s" fill="freeze" rotate="auto"><mpath href="#fl-fsr-updown-p"/></animateMotion></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="5s" fill="freeze"/><rect x="20" y="50" width="170" height="70" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="105" y="78" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Numbers going up</text><text x="105" y="104" font-family="sans-serif" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="middle">You call: UP</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="5s" dur="0.5s" fill="freeze"/><rect x="20" y="50" width="190" height="70" rx="8" fill="#2f3a2b"/><text x="115" y="78" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Coming back down</text><text x="115" y="104" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">You call: DOWN</text></g>
</svg>
