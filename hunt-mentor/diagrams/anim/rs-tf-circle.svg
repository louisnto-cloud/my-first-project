<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: from the last clear track, flagged, walk a slow circle about 10 metres out. Where the trail crosses the circle, you find it again. If nothing, go wider, about 20 metres.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Lost it? Circle out</text>
<rect x="0" y="60" width="400" height="230" rx="0" fill="#e9efe0"/><g transform="translate(200 175) rotate(90) scale(0.8)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><line x1="200" y1="175" x2="200" y2="140" stroke="#23261f" stroke-width="2"/><path d="M200 140 L214 145 L200 150 Z" fill="#e8590c" stroke="#e8590c" stroke-width="1"/><text x="200" y="205" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">last clear track</text><circle cx="200" cy="175" r="80" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="503" stroke-dashoffset="503"><animate attributeName="stroke-dashoffset" from="503" to="0" begin="0.3s" dur="3s" fill="freeze"/></circle><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.4s" fill="freeze"/><g transform="translate(282 150) rotate(70) scale(0.7)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><g transform="translate(300 140) rotate(70) scale(0.7)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><circle cx="282" cy="150" r="16" fill="none" stroke="#2f3a2b" stroke-width="2"/></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.0s" dur="0.4s" fill="freeze"/><text x="320" y="112" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">trail leaves here</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.4s" fill="freeze"/><text x="200" y="280" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Nothing? Go wider, about 20 m (Tip)</text></g>
</svg>
