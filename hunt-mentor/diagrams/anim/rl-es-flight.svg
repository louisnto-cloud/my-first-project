<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 304" font-family="sans-serif" role="img" aria-label="Animation, side view. A steep rough hill with rocks near the top rises on the right behind a flat that runs away downhill. A coyote trots in from the left. A mule deer bounds uphill in stiff legged hops into the rough rocky ground. A white tailed deer, its white tail up, runs down and away across the flat. Mule deer: up, into rough ground. White tail: down and away. Based on Lingle 2002, a study of coyote attacks.">
