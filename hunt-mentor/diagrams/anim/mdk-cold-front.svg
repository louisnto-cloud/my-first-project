<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, a map with north at the top. A blue cold front line moves south. Behind it, on a north wind, a flock of new ducks flies south and drops onto your pond. End card: hunt the morning after the front passes, 65 percent, hunter lore."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="22" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A cold front pushes new ducks in</text><rect x="10" y="34" width="380" height="214" rx="8" fill="#dfe6d3"/><text x="30" y="56" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">N</text><line x1="30" y1="80" x2="30.0" y2="68.0" stroke="#2f3a2b" stroke-width="2" fill="none"/><polygon points="30.0,62.0 24.0,73.0 36.0,73.0" fill="#2f3a2b"/><ellipse cx="250" cy="200" rx="60" ry="22" fill="#4a7fb0" opacity=".7"/><text x="250" y="205" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Your pond</text><g><animateTransform attributeName="transform" type="translate" from="0 40" to="0 150" dur="6s" fill="freeze"/><path d="M20 0 L380 0" stroke="#3a6fb0" stroke-width="5"/><polygon points="30,0 40,0 35,12" fill="#3a6fb0"/><polygon points="64,0 74,0 69,12" fill="#3a6fb0"/><polygon points="98,0 108,0 103,12" fill="#3a6fb0"/><polygon points="132,0 142,0 137,12" fill="#3a6fb0"/><polygon points="166,0 176,0 171,12" fill="#3a6fb0"/><polygon points="200,0 210,0 205,12" fill="#3a6fb0"/><polygon points="234,0 244,0 239,12" fill="#3a6fb0"/><polygon points="268,0 278,0 273,12" fill="#3a6fb0"/><polygon points="302,0 312,0 307,12" fill="#3a6fb0"/><polygon points="336,0 346,0 341,12" fill="#3a6fb0"/><polygon points="370,0 380,0 375,12" fill="#3a6fb0"/></g><g><animateTransform attributeName="transform" type="translate" values="200 40;200 40;160 188" keyTimes="0;0.3;1" dur="6.5s" fill="freeze"/><ellipse rx="10" ry="4" fill="#8b5a2b"/><circle cx="0" cy="6" r="3" fill="#2f6e3b"/><