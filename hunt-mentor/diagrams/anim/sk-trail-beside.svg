<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: the hunter walks slowly beside the blood trail, not on it, and flags each blood spot. When the blood stops, go back to the last flag. Never wander ahead.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="16" font-weight="bold" text-anchor="middle" fill="#23261f">Walk beside the blood, look ahead</text><circle cx="40" cy="230" r="5" fill="#b3261e"/><circle cx="90" cy="200" r="5" fill="#b3261e"/><circle cx="140" cy="196" r="5" fill="#b3261e"/><circle cx="190" cy="170" r="5" fill="#b3261e"/><circle cx="240" cy="160" r="5" fill="#b3261e"/><circle cx="290" cy="130" r="5" fill="#b3261e"/><path id="sk-trail-beside-p" d="M30 262 C39.0 256.7, 66.3 236.0, 84.0 230.0 C101.7 224.0, 119.0 231.0, 136.0 226.0 C153.0 221.0, 169.3 206.0, 186.0 200.0 C202.7 194.0, 218.7 196.3, 236.0 190.0 C253.3 183.7, 279.3 167.0, 290.0 162.0 C300.7 157.0, 298.3 160.3, 300.0 160.0" fill="none" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="4 5"/><g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.6s" dur="0.3s" fill="freeze"/><line x1="40" y1="230" x2="40" y2="210" stroke="#23261f" stroke-width="2"/><path d="M40 210 L52 215 L40 220 Z" fill="#fff" stroke="#23261f" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.6s" dur="0.3s" fill="freeze"/><line x1="90" y1="200" x2="90" y2="180" stroke="#23261f" stroke-width="2"/><path d="M90 180 L102 185 L90 190 Z" fill="#fff" stroke="#23261f" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.6s" dur="0.3s" fill="freeze"/><line x1="140" y1="196" x2="140" y2="176" stroke="#23261f" stroke-width="2"/><path d="M140 176 L152 181 L140 186 Z" fill="#fff" stroke="#23261f" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.6s" dur="0.3s" fill="freeze"/><line x1="190" y1="170" x2="190" y2="150" stroke="#23261f" stroke-width="2"/><path d="M190 150 L202 155 L190 160 Z" fill="#fff" stroke="#23261f" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.6s" dur="0.3s" fill="freeze"/><line x1="240" y1="160" x2="240" y2="140" stroke="#23261f" stroke-width="2"/><path d="M240 140 L252 145 L240 150 Z" fill="#fff" stroke="#23261f" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="5.6s" dur="0.3s" fill="freeze"/><line x1="290" y1="130" x2="290" y2="110" stroke="#23261f" stroke-width="2"/><path d="M290 110 L302 115 L290 120 Z" fill="#fff" stroke="#23261f" stroke-width="1"/></g><g><circle r="9" fill="#e8590c"/><animateMotion dur="5.6s" fill="freeze" calcMode="linear"><mpath href="#sk-trail-beside-p"/></animateMotion></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="5.8s" dur="0.5s" fill="freeze"/><text x="300" y="104" font-size="15" font-weight="bold" text-anchor="middle" fill="#b3261e">Blood stops?</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="6.6s" dur="0.5s" fill="freeze"/><text x="200" y="286" font-size="15" font-weight="bold" text-anchor="middle" fill="#2f3a2b">Back to the last flag. Never wander ahead.</text></g><text x="20" y="60" font-size="14" font-weight="bold" fill="#23261f">Flag every spot</text><text x="20" y="78" font-size="14" fill="#23261f">as you pass it</text>
</svg>
