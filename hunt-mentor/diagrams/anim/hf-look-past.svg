<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation through binoculars. A buck stands on a rise. The view pulls back to show a house beyond it on the same line: no shot. The buck walks down in front of a steep dirt bank. Now the bank is behind it: safe backstop, shot OK.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <path d="M0 150 L400 120 L400 300 L0 300 Z" fill="#dfe6d3"/>
  <path d="M220 300 L220 170 C 270 140, 340 130, 400 140 L400 300 Z" fill="#8b5a2b" opacity=".5"/>
  <g fill="#2f3a2b"><rect x="80" y="100" width="40" height="30"/><polygon points="74,100 100,78 126,100"/></g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="100 150;100 150;300 230;300 230" keyTimes="0;0.5;0.85;1" dur="8s" fill="freeze"/>
    <ellipse rx="22" ry="10" fill="#8b5a2b"/><circle cx="20" cy="-10" r="7" fill="#8b5a2b"/><path d="M18 -16 l-4 -10 M24 -16 l4 -10" stroke="#5c3b1c" stroke-width="2"/>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.45;0.5;1" dur="8s" fill="freeze"/>
    <path d="M100 150 L100 120" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="160" y="40" width="200" height="34" rx="8" fill="#c0392b"/><text x="260" y="63" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">House behind: NO</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="7s" dur=".5s" fill="freeze"/>
    <rect x="20" y="230" width="200" height="34" rx="8" fill="#2f6e3b"/><text x="120" y="253" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Dirt bank: shot OK</text></g>
  <circle cx="200" cy="150" r="150" fill="none" stroke="#2f3a2b" stroke-width="20" opacity=".25"/>
</svg>
