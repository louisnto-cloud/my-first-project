<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation. At the kill site the head and brain, spine and guts stay behind. A cooler of boned out meat and a skull plate with antlers, cleaned of all tissue, load into the truck. The truck drives across the BC line. Final label: only boned meat and a cleaned hide, antlers and skull plate enter BC, synopsis page 12 item 50, 99 percent.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Bring the meat home to BC</text>
<rect x="0" y="200" width="400" height="20" fill="#6b4f35"/>
<line x1="330" y1="60" x2="330" y2="230" stroke="#e8590c" stroke-width="4" stroke-dasharray="10 6"/>
<text x="366" y="60" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">BC</text>
<rect x="10" y="44" width="150" height="100" rx="10" fill="#f6ddd0" stroke="#e8590c" stroke-width="2"/>
<text x="85" y="64" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Stays at the kill</text>
<text x="85" y="84" font-size="14" fill="#2f3a2b" text-anchor="middle">Head and brain,</text>
<text x="85" y="102" font-size="14" fill="#2f3a2b" text-anchor="middle">spine, guts</text>
<circle cx="140" cy="124" r="11" fill="#e8590c"/><path d="M135.6 119.6 L144.4 128.4 M144.4 119.6 L135.6 128.4" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
<g><g transform="translate(0 0) scale(0.8)"><rect x="-26" y="-14" width="52" height="32" rx="4" fill="#fff" stroke="#4a7fb0" stroke-width="3"/><rect x="-28" y="-20" width="56" height="9" rx="3" fill="#4a7fb0"/><text x="0" y="9" font-size="13" font-weight="bold" fill="#4a7fb0" text-anchor="middle">MEAT</text></g><animateTransform attributeName="transform" type="translate" values="210 100;80 176;80 176" keyTimes="0;.3;1" dur="2.5s" fill="freeze"/></g>
<g><g transform="translate(0 0) scale(0.8)"><ellipse cx="0" cy="8" rx="12" ry="7" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><path d="M-6 4 q-14 -10 -16 -26 M-14 -8 l-8 -4 M6 4 q14 -10 16 -26 M14 -8 l8 -4" stroke="#6b4f35" stroke-width="3.5" fill="none"/></g><animateTransform attributeName="transform" type="translate" values="270 110;80 170;80 170" keyTimes="0;.3;1" dur="2.5s" fill="freeze"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.6;1" dur="2.5s" fill="freeze"/></g>
<g opacity="1"><text x="240" y="150" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Boned meat,</text><text x="240" y="168" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">clean skull plate</text><animate attributeName="opacity" values="1;0" begin="1s" dur=".5s" fill="freeze"/></g>
<g><g transform="translate(0 0) scale(1.3)"><path d="M-30 8 v-12 h28 v-10 h18 l10 10 h4 v12 z" fill="#4a7fb0"/><circle cx="-18" cy="10" r="6" fill="#2f3a2b"/><circle cx="18" cy="10" r="6" fill="#2f3a2b"/><rect x="0" y="-11" width="11" height="7" fill="#fff"/></g><animateTransform attributeName="transform" type="translate" values="80 186;80 186;360 186" keyTimes="0;.35;1" dur="7s" fill="freeze"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="7s" dur=".5s" fill="freeze"/><rect x="20" y="236" width="360" height="52" rx="8" fill="#2f3a2b"/><text x="200" y="257" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Only boned meat and cleaned hide,</text><text x="200" y="278" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">antlers and skull plate enter BC (99%)</text></g>
</svg>
