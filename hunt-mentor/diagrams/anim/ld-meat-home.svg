<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation. At the kill site the head and brain, spine and guts stay behind. A cooler of boned out meat and a skull plate with antlers, cleaned of all tissue, load into the truck. The truck drives across the BC line. Final label: only boned meat and a cleaned hide, antlers and skull plate enter BC, synopsis page 12 item 50, 99 percent.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bring the meat home to BC</text>
<rect x="0" y="206" width="400" height="16" fill="#8a8476"/><path d="M0 214 H400" stroke="#fffaf0" stroke-width="1.6" stroke-dasharray="12 10"/>
<rect x="0" y="222" width="400" height="8" fill="#dfe6d3"/>
<line x1="326" y1="62" x2="326" y2="232" stroke="#e8590c" stroke-width="4" stroke-dasharray="10 6"/>
<text x="362" y="66" font-size="22" font-weight="bold" fill="#e8590c" text-anchor="middle">BC</text>
<rect x="10" y="42" width="160" height="112" rx="10" fill="#f6ddd0" stroke="#e8590c" stroke-width="2"/>
<text x="90" y="64" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Stays at the kill</text>
<text x="90" y="86" font-size="16" fill="#2f3a2b" text-anchor="middle">Head and brain,</text>
<text x="90" y="106" font-size="16" fill="#2f3a2b" text-anchor="middle">spine, guts</text>
<circle cx="148" cy="134" r="12" fill="#e8590c"/><path d="M143 129 L153 139 M153 129 L143 139" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
<g><g><rect x="-24" y="-12" width="48" height="28" rx="4" fill="#ffffff" stroke="#4a7fb0" stroke-width="3"/><rect x="-26" y="-19" width="52" height="9" rx="3" fill="#4a7fb0"/><rect x="-8" y="-24" width="16" height="5" rx="2" fill="#4a7fb0"/><path d="M-12 2 C-8 -6 4 -6 10 0 C6 8 -6 8 -12 2z" fill="#c0392b"/><path d="M-8 2 C-4 -2 2 -2 6 1" stroke="#f2c4b8" stroke-width="1.6" fill="none"/></g><animateTransform attributeName="transform" type="translate" values="214 104;80 186;80 186" keyTimes="0;.3;1" dur="2.5s" fill="freeze"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.9;1" dur="2.5s" fill="freeze"/></g>
<g><g><ellipse cx="0" cy="8" rx="11" ry="7" fill="#f3ede0" stroke="#2f3a2b" stroke-width="2"/><path d="M-6 4 C-18 -4 -20 -16 -18 -26 M-15 -8 L-24 -12 M-18 -18 L-26 -22 M6 4 C18 -4 20 -16 18 -26 M15 -8 L24 -12 M18 -18 L26 -22" stroke="#6b4f35" stroke-width="3.5" fill="none" stroke-linecap="round"/></g><animateTransform attributeName="transform" type="translate" values="276 112;80 178;80 178" keyTimes="0;.3;1" dur="2.5s" fill="freeze"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.6;1" dur="2.5s" fill="freeze"/></g>
<g opacity="1"><text x="246" y="160" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Boned meat,</text><text x="246" y="180" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">clean skull plate</text><animate attributeName="opacity" values="1;0" begin="1s" dur=".5s" fill="freeze"/></g>
<g><g transform="scale(1.3)"><path d="M-32 8 V-6 H0 V-16 H17 L26 -6 H30 V8z" fill="#4a7fb0"/><rect x="3" y="-13" width="11" height="7" rx="1" fill="#e7f0f7"/><rect x="-30" y="-10" width="28" height="4" fill="#2c5d86"/><circle cx="-19" cy="10" r="6" fill="#2f3a2b"/><circle cx="19" cy="10" r="6" fill="#2f3a2b"/><circle cx="-19" cy="10" r="2.2" fill="#9aa3ad"/><circle cx="19" cy="10" r="2.2" fill="#9aa3ad"/></g><animateTransform attributeName="transform" type="translate" values="80 192;80 192;360 192" keyTimes="0;.35;1" dur="7s" fill="freeze"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="7s" dur="0.5s" fill="freeze"/><rect x="14" y="238" width="372" height="56" rx="8" fill="#2f3a2b"/><text x="200" y="261" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Only boned meat and cleaned hide,</text><text x="200" y="283" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">antlers and skull plate enter BC (99%)</text></g>
