<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: a load bar fills in small steps from week 5 to week 12: 5, 6, 8 kg, an easy week back to 5 kg, then 10, 12, 14 and 16 kg. Ends with Ready to test. Example for an 80 kg person. Tip.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Add a little load, week by week</text><g opacity="0"><set attributeName="opacity" to="1" begin="0.0s" dur="1s"/><text x="200" y="92" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">Week 5: 5 kg</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="1.0s" dur="1s"/><text x="200" y="92" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">Week 6: 6 kg</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="2.0s" dur="1s"/><text x="200" y="92" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">Week 7: 8 kg</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="3.0s" dur="1s"/><text x="200" y="92" font-family="sans-serif" font-size="20" font-weight="bold" fill="#8a9a6b" text-anchor="middle">Week 8: 5 kg (easy week)</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="4.0s" dur="1s"/><text x="200" y="92" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">Week 9: 10 kg</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="5.0s" dur="1s"/><text x="200" y="92" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">Week 10: 12 kg</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="6.0s" dur="1s"/><text x="200" y="92" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">Week 11: 14 kg</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="7.0s" dur="1s" fill="freeze"/><text x="200" y="92" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">Week 12: 16 kg</text></g><rect x="40" y="130" width="320" height="40" rx="8" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2"/><rect x="40" y="130" width="90" height="40" rx="8" fill="#e8590c"><animate attributeName="width" values="90;108;144;90;180;216;252;288" keyTimes="0.000;0.143;0.286;0.429;0.571;0.714;0.857;1.000" dur="7s" calcMode="discrete" fill="freeze"/></rect><text x="40" y="196" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">0 kg</text><text x="360" y="196" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="end">16 kg</text><rect x="183.8" y="235.0" width="32.4" height="45.0" rx="7.2" fill="#8b5a2b"/><rect x="189.2" y="244.0" width="21.6" height="12.6" rx="3.6" fill="#6b4f35"/><rect x="180.2" y="267.4" width="39.6" height="7.2" rx="2.7" fill="#2f3a2b"/><g opacity="0"><animate attributeName="opacity" values="0;1" begin="7s" dur="0.5s" fill="freeze"/><rect x="250" y="220" width="140" height="50" rx="8" fill="#2f3a2b"/><text x="320" y="251" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Ready to test</text></g>
</svg>
