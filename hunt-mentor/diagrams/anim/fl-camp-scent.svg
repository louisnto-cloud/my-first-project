<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: wind blows from the tent toward the kitchen and the hung food. Cooking smell drifts downwind. A bear comes in from downwind following the smell and reaches the food hang, far from the tent.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Smell goes downwind. So does the bear.</text>
<polygon points="70,166.0 40.0,200 100.0,200" fill="#e8590c"/><polygon points="70,166.0 62.0,200 78.0,200" fill="#2f3a2b"/><text x="70" y="226" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Tent</text>
<rect x="170" y="180" width="46" height="24" rx="4" fill="#6b4f35"/><text x="193" y="226" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Kitchen</text>
<line x1="290" y1="120" x2="350" y2="120" stroke="#6b4f35" stroke-width="4" stroke-linecap="round"/><rect x="312" y="120" width="18" height="22" rx="3" fill="#8b5a2b"/><text x="320" y="108" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Food</text>
<g opacity="0"><animate attributeName="opacity" values="0;0.6;0" dur="3s" begin="0s" repeatCount="indefinite"/><ellipse cx="230" cy="180" rx="12" ry="6" fill="#c9b79c"><animate attributeName="cx" values="220;380" dur="3s" begin="0s" repeatCount="indefinite"/></ellipse></g>
<g opacity="0"><animate attributeName="opacity" values="0;0.6;0" dur="3s" begin="1s" repeatCount="indefinite"/><ellipse cx="230" cy="180" rx="12" ry="6" fill="#c9b79c"><animate attributeName="cx" values="220;380" dur="3s" begin="1s" repeatCount="indefinite"/></ellipse></g>
<g opacity="0"><animate attributeName="opacity" values="0;0.6;0" dur="3s" begin="2s" repeatCount="indefinite"/><ellipse cx="230" cy="180" rx="12" ry="6" fill="#c9b79c"><animate attributeName="cx" values="220;380" dur="3s" begin="2s" repeatCount="indefinite"/></ellipse></g>
<line x1="20" y1="70" x2="80" y2="70" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="80.0,70.0 71.0,74.3 71.0,65.7" fill="#4a7fb0"/><text x="20" y="56" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="start">Wind</text>
<g><ellipse cx="0" cy="-14.4" rx="24.0" ry="12.8" fill="#23261f"/><circle cx="24.0" cy="-20.8" r="8.8" fill="#23261f"/><circle cx="20.8" cy="-28.8" r="3.2" fill="#23261f"/><rect x="-19.200000000000003" y="-6.4" width="7.2" height="11.200000000000001" rx="2" fill="#23261f"/><rect x="9.600000000000001" y="-6.4" width="7.2" height="11.200000000000001" rx="2" fill="#23261f"/><circle cx="31.200000000000003" cy="-20.0" r="2.4000000000000004" fill="#c9b79c"/><animateTransform attributeName="transform" type="translate" values="420 270;330 220;300 160" keyTimes="0;0.6;1" dur="6s" fill="freeze"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="6s" dur="0.5s" fill="freeze"/><rect x="20" y="240" width="240" height="44" rx="8" fill="#2f3a2b"/><text x="140" y="268" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Bear finds food, not you</text></g>
</svg>
