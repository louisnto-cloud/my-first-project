<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a hunter below a slope. A mule deer stots uphill in long bounces, 2.7 to 5.2 m each, and stops on the rise to look back. Be ready for that pause. Mule deer tend to flee uphill. Big old bucks often keep going without looking back.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">The stot uphill and the look back</text><path d="M0 280 L120 250 L260 150 L330 110 L400 105 L400 300 L0 300 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(60 282) scale(0.9)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#e8590c"/><rect x="-6" y="-15" width="5" height="15" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" fill="#2f3a2b"/></g><path d="M130 245 Q 150 205 170 220 Q 190 180 210 190 Q 230 150 250 160 Q 270 120 290 130 Q 305 108 320 113" fill="none" stroke="#8b5a2b" stroke-width="1.5" id="mmd-sl-path" stroke-dasharray="3 4"/><g><g transform="translate(0 0) scale(0.450 0.450)"><rect x="-36" y="-40" width="6" height="40" rx="3" fill="#8b5a2b"/><rect x="10" y="-40" width="6" height="40" rx="3" fill="#8b5a2b"/><ellipse cx="-12" cy="-52" rx="34" ry="16" fill="#8b5a2b"/><rect x="-30" y="-44" width="6" height="44" rx="3" fill="#8b5a2b"/><rect x="16" y="-44" width="6" height="44" rx="3" fill="#8b5a2b"/><path d="M12 -60 L26 -84 L36 -80 L26 -52 Z" fill="#8b5a2b"/><ellipse cx="38" cy="-84" rx="13" ry="7" fill="#8b5a2b"/><path d="M28 -88 L18 -102 L32 -92 Z" fill="#8b5a2b"/><path d="M31 -89 L27 -104 L38 -92 Z" fill="#8b5a2b"/><circle cx="49" cy="-84" r="2" fill="#23261f"/><ellipse cx="-44" cy="-54" rx="5" ry="9" fill="#f4efe2"/><path d="M-46 -54 L-50 -40" stroke="#23261f" stroke-width="3" stroke-linecap="round"/></g><animateMotion dur="5s" fill="freeze"><mpath href="#mmd-sl-path"/></animateMotion></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="5s" dur="0.4s" fill="freeze"/><rect x="14" y="44" width="210" height="46" rx="8" fill="#2f3a2b"/><text x="119" y="64" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Stops on the rise, looks</text><text x="119" y="82" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">back. Be ready (65%)</text></g><text x="14" y="120" font-size="14" fill="#23261f" text-anchor="start">Mule deer flee uphill</text><text x="14" y="138" font-size="14" fill="#23261f" text-anchor="start">(70%)</text><text x="14" y="190" font-size="14" fill="#23261f" text-anchor="start">Each bounce 2.7 to 5.2 m</text><text x="14" y="208" font-size="14" fill="#23261f" text-anchor="start">(80%)</text><text x="390" y="160" font-size="14" fill="#e8590c" text-anchor="end" font-weight="bold">Big old bucks</text><text x="390" y="178" font-size="14" fill="#e8590c" text-anchor="end" font-weight="bold">often keep going</text>
</svg>
