<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, top view. A white tailed deer stands in a field near cover. At the shot it runs about 50 to 100 metres and disappears into the brush. Two orange rings mark the spots: 1, where it stood, and 2, where it went into cover. Final text: mark both spots, then wait. Tip.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" fill="#e3d38a" opacity=".45"/><path d="M260 0 L400 0 L400 300 L300 300 Q250 200 290 120 Q300 60 260 0 Z" fill="#8a9a6b"/><text x="312" y="30" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Cover</text><circle cx="40" cy="250.2" r="6.6000000000000005" fill="#e8590c"/><rect x="33.4" y="256.8" width="13.200000000000001" height="17.6" rx="4.4" fill="#e8590c"/><text x="40" y="287.6" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="middle">You</text><path id="sa-wt-mark-run" d="M120 170 Q200 150 240 130 Q270 116 300 110" fill="none"/><g><g transform="translate(0 -12) scale(0.4 0.4)"><rect x="-30" y="6" width="7" height="38" rx="3.5" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><rect x="-21" y="6" width="7" height="38" rx="3.5" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><rect x="22" y="6" width="7" height="38" rx="3.5" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><rect x="31" y="6" width="7" height="38" rx="3.5" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><ellipse cx="0" cy="0" rx="42" ry="17" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><path d="M-40 -8 Q-58 -4 -54 8" stroke="#8b5a2b" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M-41 -4 Q-55 0 -52 7" stroke="#fff" stroke-width="3" fill="none"/><path d="M26 -10 L42 -40 L54 -36 L40 6 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="2" stroke-linejoin="round"/><ellipse cx="56" cy="-40" rx="14" ry="7" transform="rotate(18 56 -40)" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="42" cy="-50" rx="7" ry="3.5" transform="rotate(-35 42 -50)" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><circle cx="58" cy="-42" r="1.8" fill="#23261f"/></g><animateMotion dur="2.4s" begin="1s" fill="freeze"><mpath href="#sa-wt-mark-run"/></animateMotion><set attributeName="opacity" to="0" begin="3.4s"/></g><g opacity="0"><set attributeName="opacity" to="1" begin="1s"/><circle cx="120" cy="170" r="12" fill="none" stroke="#e8590c" stroke-width="3"/><text x="80" y="200" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">1 Where it stood</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="3.4s"/><circle cx="292" cy="112" r="12" fill="none" stroke="#e8590c" stroke-width="3"/><text x="282" y="92" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="end">2 Where it went in</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="4.4s"/><rect x="20" y="16" width="240" height="56" rx="8" fill="#2f3a2b"/><text x="32" y="40" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Mark both spots. Wait.</text><text x="32" y="62" font-size="14" fill="#fff" text-anchor="start">Often runs 50 to 100 m (Tip)</text></g><g><path d="M60 250 L120 172" stroke="#e8590c" stroke-width="2" stroke-dasharray="4 4" opacity="0"><set attributeName="opacity" to="1" begin="0.5s"/><set attributeName="opacity" to="0" begin="1.4s"/></path></g>
</svg>
