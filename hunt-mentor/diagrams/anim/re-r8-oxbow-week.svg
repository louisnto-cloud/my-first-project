<text x="380" y="191" font-size="14" font-weight="bold" fill="#c92a2a" text-anchor="end" visibility="hidden"><set attributeName="visibility" to="visible" begin="0.00s" fill="freeze"/><set attributeName="visibility" to="hidden" begin="6.73s" fill="freeze"/>CLOSED</text>
<text x="380" y="191" font-size="14" font-weight="bold" fill="#5c7a3a" text-anchor="end" visibility="hidden"><set attributeName="visibility" to="visible" begin="6.73s" fill="freeze"/><set attributeName="visibility" to="hidden" begin="8.24s" fill="freeze"/>OPEN</text>
<text x="380" y="191" font-size="14" font-weight="bold" fill="#c92a2a" text-anchor="end" visibility="hidden"><set attributeName="visibility" to="visible" begin="8.24s" fill="freeze"/>CLOSED</text>
<g><line x1="20" y1="123" x2="20" y2="223" stroke="#e8590c" stroke-width="3"/><animateTransform attributeName="transform" type="translate" from="0 0" to="360.0 0" begin="0s" dur="9.0s" fill="freeze"/></g>
<g visibility="hidden"><set attributeName="visibility" to="visible" begin="0.00s" fill="freeze"/><set attributeName="visibility" to="hidden" begin="1.45s" fill="freeze"/><text x="200" y="69" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Vehicles: established roads only, all year</text></g>
<g visibility="hidden"><set attributeName="visibility" to="visible" begin="1.45s" fill="freeze"/><set attributeName="visibility" to="hidden" begin="6.73s" fill="freeze"/><text x="200" y="69" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Mar 1: no shooting or hunting at the</text><text x="200" y="88" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Oxbows</text></g>
<g visibility="hidden"><set attributeName="visibility" to="visible" begin="6.73s" fill="freeze"/><set attributeName="visibility" to="hidden" begin="8.24s" fill="freeze"/><text x="200" y="69" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Oct 1: Oxbows closure off, quail open</text></g>
<g visibility="hidden"><set attributeName="visibility" to="visible" begin="8.24s" fill="freeze"/><text x="200" y="69" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Dec 1: quail closed</text></g>
</svg>
