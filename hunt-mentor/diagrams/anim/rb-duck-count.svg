<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: eight boxes fill with ducks one at a time. At 8 the daily bag limit is reached, and you must stop hunting ducks for the rest of that day." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="30" font-size="19" fill="#23261f" text-anchor="middle" font-weight="bold">Counting your ducks today</text>
<rect x="30" y="70" width="70" height="60" rx="8" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.4s" fill="freeze"/><g transform="translate(66 102) scale(1.0)"><ellipse cx="0" cy="0" rx="18" ry="9" fill="#8b5a2b"/><circle cx="15" cy="-9" r="7" fill="#2e6b3a"/><path d="M21 -9 L29 -7 L21 -5 Z" fill="#e0a526"/><path d="M-18 -2 L-26 -6 L-22 2 Z" fill="#8b5a2b"/></g></g>
<text x="40" y="88" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">1</text>
<rect x="120" y="70" width="70" height="60" rx="8" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.2s" dur="0.4s" fill="freeze"/><g transform="translate(156 102) scale(1.0)"><ellipse cx="0" cy="0" rx="18" ry="9" fill="#8b5a2b"/><circle cx="15" cy="-9" r="7" fill="#2e6b3a"/><path d="M21 -9 L29 -7 L21 -5 Z" fill="#e0a526"/><path d="M-18 -2 L-26 -6 L-22 2 Z" fill="#8b5a2b"/></g></g>
<text x="130" y="88" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">2</text>
<rect x="210" y="70" width="70" height="60" rx="8" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.9s" dur="0.4s" fill="freeze"/><g transform="translate(246 102) scale(1.0)"><ellipse cx="0" cy="0" rx="18" ry="9" fill="#8b5a2b"/><circle cx="15" cy="-9" r="7" fill="#2e6b3a"/><path d="M21 -9 L29 -7 L21 -5 Z" fill="#e0a526"/><path d="M-18 -2 L-26 -6 L-22 2 Z" fill="#8b5a2b"/></g></g>
<text x="220" y="88" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">3</text>
<rect x="300" y="70" width="70" height="60" rx="8" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.5999999999999996s" dur="0.4s" fill="freeze"/><g transform="translate(336 102) scale(1.0)"><ellipse cx="0" cy="0" rx="18" ry="9" fill="#8b5a2b"/><circle cx="15" cy="-9" r="7" fill="#2e6b3a"/><path d="M21 -9 L29 -7 L21 -5 Z" fill="#e0a526"/><path d="M-18 -2 L-26 -6 L-22 2 Z" fill="#8b5a2b"/></g></g>
<text x="310" y="88" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">4</text>
<rect x="30" y="150" width="70" height="60" rx="8" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.3s" dur="0.4s" fill="freeze"/><g transform="translate(66 182) scale(1.0)"><ellipse cx="0" cy="0" rx="18" ry="9" fill="#8b5a2b"/><circle cx="15" cy="-9" r="7" fill="#2e6b3a"/><path d="M21 -9 L29 -7 L21 -5 Z" fill="#e0a526"/><path d="M-18 -2 L-26 -6 L-22 2 Z" fill="#8b5a2b"/></g></g>
<text x="40" y="168" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">5</text>
<rect x="120" y="150" width="70" height="60" rx="8" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.0s" dur="0.4s" fill="freeze"/><g transform="translate(156 182) scale(1.0)"><ellipse cx="0" cy="0" rx="18" ry="9" fill="#8b5a2b"/><circle cx="15" cy="-9" r="7" fill="#2e6b3a"/><path d="M21 -9 L29 -7 L21 -5 Z" fill="#e0a526"/><path d="M-18 -2 L-26 -6 L-22 2 Z" fill="#8b5a2b"/></g></g>
<text x="130" y="168" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">6</text>
<rect x="210" y="150" width="70" height="60" rx="8" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.699999999999999s" dur="0.4s" fill="freeze"/><g transform="translate(246 182) scale(1.0)"><ellipse cx="0" cy="0" rx="18" ry="9" fill="#8b5a2b"/><circle cx="15" cy="-9" r="7" fill="#2e6b3a"/><path d="M21 -9 L29 -7 L21 -5 Z" fill="#e0a526"/><path d="M-18 -2 L-26 -6 L-22 2 Z" fill="#8b5a2b"/></g></g>
<text x="220" y="168" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">7</text>
<rect x="300" y="150" width="70" height="60" rx="8" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="5.3999999999999995s" dur="0.4s" fill="freeze"/><g transform="translate(336 182) scale(1.0)"><ellipse cx="0" cy="0" rx="18" ry="9" fill="#8b5a2b"/><circle cx="15" cy="-9" r="7" fill="#2e6b3a"/><path d="M21 -9 L29 -7 L21 -5 Z" fill="#e0a526"/><path d="M-18 -2 L-26 -6 L-22 2 Z" fill="#8b5a2b"/></g></g>
<text x="310" y="168" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">8</text>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="6.3s" dur="0.4s" fill="freeze"/><rect x="10" y="246" width="380" height="36" rx="8" fill="#c92a2a" stroke="#c92a2a" stroke-width="2"/><text x="200" y="270" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">8: daily limit reached. Done with ducks today.</text></g>
</svg>
