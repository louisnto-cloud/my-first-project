<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 302" font-family="sans-serif" role="img" aria-label="Animation: a hunting bullet flies into an animal and its soft nose flattens and widens like a mushroom. The wider front does more damage for a quick kill. Too slow and a bullet may not open; too fast and a soft one can break up.">
<rect width="400" height="302" fill="#fffaf0"/>
<text x="200" y="28" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Expansion: the bullet mushrooms</text>
<rect x="232" y="56" width="160" height="190" rx="10" fill="#f0cfc8"/><rect x="232" y="56" width="12" height="190" fill="#8b5a2b"/>
<rect x="286.6" y="64.0" width="62.8" height="27.0" rx="5" fill="#fffaf0" stroke="#b3261e" stroke-width="1.2"/>
<text x="318" y="83" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle">animal</text>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="2s" dur="0.6s" fill="freeze"/><path d="M244 156 L328 140 L328 172z" fill="#c0392b" opacity=".38"/></g>
<g><animateTransform attributeName="transform" type="translate" values="40 156;232 156;318 156" keyTimes="0;0.4;1" dur="4s" fill="freeze"/><g><set attributeName="display" to="none" begin="1.8s" fill="freeze"/><path d="M-30 -7 H6 C14 -7 22 -4 28 0 C22 4 14 7 6 7 H-30z" fill="#c07a3a" stroke="#2f3a2b" stroke-width="1.6"/><path d="M16 -5.4 C22 -3.4 25 -1.6 28 0 C25 1.6 22 3.4 16 5.4z" fill="#9aa0a6"/><path d="M-30 -7 V7" stroke="#8a5222" stroke-width="3"/></g><g display="none"><set attributeName="display" to="inline" begin="1.8s" fill="freeze"/><g><animateTransform attributeName="transform" type="scale" values="0.4 0.4;1 1" begin="1.8s" dur="1s" fill="freeze"/><path d="M-26 -6 H2 C6 -18 14 -22 22 -20 C28 -14 30 -6 28 0 C30 6 28 14 22 20 C14 22 6 18 2 6 H-26z" fill="#c07a3a" stroke="#2f3a2b" stroke-width="1.6"/><path d="M8 -16 C16 -18 24 -12 26 0 C24 12 16 18 8 16 C14 8 14 -8 8 -16z" fill="#9aa0a6"/></g></g></g>
<g display="none"><set attributeName="display" to="inline" begin="3.4s" fill="freeze"/><text x="116" y="206" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wider front:</text><text x="116" y="226" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">more damage,</text><text x="116" y="246" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">quick kill</text></g>
<g display="none"><set attributeName="display" to="inline" begin="3.8s" fill="freeze"/><text x="200" y="272" font-size="15" fill="#2f3a2b" text-anchor="middle">Too slow and it will not open.</text><text x="200" y="292" font-size="15" fill="#2f3a2b" text-anchor="middle">Too fast and it can break up.</text></g>
</svg>
