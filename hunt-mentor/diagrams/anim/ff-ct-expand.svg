<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a bullet flies into an animal and its nose flattens and widens like a mushroom. The wider front does more damage for a quick kill. Too slow and a bullet may not open; too fast and a soft one can break up.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Expansion: the bullet mushrooms</text><rect x="220" y="60" width="160" height="200" rx="10" fill="#f3d5d2" stroke="none" stroke-width="2"/><text x="300" y="84" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle">animal</text><g><animateTransform attributeName="transform" type="translate" values="30 160;240 160;330 160" keyTimes="0;0.4;1" dur="4s" fill="freeze"/><g><animateTransform attributeName="transform" type="scale" values="1 1;1 1;0.6 2.4" keyTimes="0;0.4;0.7" dur="4s" fill="freeze"/><ellipse cx="0" cy="0" rx="26" ry="9" fill="#b87333" stroke="#2f3a2b" stroke-width="2"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="2s" dur="0.5s" fill="freeze"/><path d="M240 160 L330 150 L330 170 Z" fill="#c0392b" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.4s" dur="0.5s" fill="freeze"/><text x="110" y="214" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wider front:</text><text x="110" y="233" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">more damage,</text><text x="110" y="252" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">quick kill</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.8s" dur="0.5s" fill="freeze"/><text x="200.0" y="288" font-size="13" fill="#2f3a2b" text-anchor="middle">Too slow and it will not open. Too fast and it can break up.</text></g>
</svg>
