<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" font-family="sans-serif" role="img" aria-label="Animation of a truck carrying a rifle from Canada to Alaska and back. Leaving Canada: no CBSA stop needed, have the BSF407 card ready. Entering the US: show Customs and Border Protection the approved ATF Form 6NIA and the Alaska licence. Hunt, with the papers kept with the rifle. Coming home to Canada: show your PAL to CBSA and declare the firearms and ammunition.">
<rect x="0" y="0" width="400" height="280" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Your rifle across the border and back</text>
<rect x="0" y="170" width="400" height="22" fill="#6b4f35"/>
<line x1="200" y1="50" x2="200" y2="230" stroke="#e8590c" stroke-width="4" stroke-dasharray="10 6"/>
<text x="100" y="60" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Canada</text>
<text x="300" y="60" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">USA, Alaska</text>
<g><g transform="translate(0 0) scale(1.2)"><path d="M-30 8 v-12 h28 v-10 h18 l10 10 h4 v12 z" fill="#4a7fb0"/><circle cx="-18" cy="10" r="6" fill="#2f3a2b"/><circle cx="18" cy="10" r="6" fill="#2f3a2b"/><rect x="0" y="-11" width="11" height="7" fill="#fff"/></g><animateTransform attributeName="transform" type="translate" values="50 160;170 160;170 160;340 160;340 160;230 160;230 160;60 160" keyTimes="0;.15;.3;.45;.55;.7;.8;1" dur="10s" fill="freeze"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" begin="0.2s" dur="2.8s"/><rect x="20" y="210" width="360" height="56" rx="8" fill="#2f3a2b"/><text x="200" y="233" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Leaving Canada: no stop needed</text><text x="200" y="254" font-size="15" fill="#fff" text-anchor="middle">BSF407 card ready (85%)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" begin="3s" dur="2.5s"/><rect x="20" y="210" width="360" height="56" rx="8" fill="#2f3a2b"/><text x="200" y="233" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Entering the US: CBP</text><text x="200" y="254" font-size="15" fill="#fff" text-anchor="middle">Approved 6NIA plus Alaska licence (85%)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" begin="5.5s" dur="1.5s"/><rect x="20" y="210" width="360" height="56" rx="8" fill="#2f3a2b"/><text x="200" y="233" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Hunt. Rifle stays with you</text><text x="200" y="254" font-size="15" fill="#fff" text-anchor="middle">and the papers stay with the rifle</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="7.5s" dur=".5s" fill="freeze"/><rect x="20" y="210" width="360" height="56" rx="8" fill="#2f3a2b"/><text x="200" y="233" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Home: CBSA</text><text x="200" y="254" font-size="15" fill="#fff" text-anchor="middle">Show your PAL, declare guns and ammo</text></g>
</svg>
