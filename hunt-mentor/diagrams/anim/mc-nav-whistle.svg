<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a whistle sends three blasts, shown as three bursts of sound waves, then a pause to listen, then repeat. Three of anything means help, 75 percent, BC Search and Rescue Association.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Whistle: three blasts, then listen</text><g transform="translate(80 160) scale(2.4) translate(-80 -160)"><rect x="62" y="152" width="30" height="16" rx="6" fill="#e8590c"/><circle cx="92" cy="160" r="9" fill="#e8590c"/><circle cx="92" cy="160" r="3" fill="#fffaf0"/></g><path d="M136.0 130 A30 30 0 0 1 136.0 190" fill="none" stroke="#e8590c" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="0.0s" dur="0.8s"/></path><path d="M140.0 110 A50 50 0 0 1 140.0 210" fill="none" stroke="#e8590c" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="0.15s" dur="0.8s"/></path><path d="M144.0 90 A70 70 0 0 1 144.0 230" fill="none" stroke="#e8590c" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="0.3s" dur="0.8s"/></path><path d="M136.0 130 A30 30 0 0 1 136.0 190" fill="none" stroke="#e8590c" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="1.2s" dur="0.8s"/></path><path d="M140.0 110 A50 50 0 0 1 140.0 210" fill="none" stroke="#e8590c" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="1.3499999999999999s" dur="0.8s"/></path><path d="M144.0 90 A70 70 0 0 1 144.0 230" fill="none" stroke="#e8590c" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="1.5s" dur="0.8s"/></path><path d="M136.0 130 A30 30 0 0 1 136.0 190" fill="none" stroke="#e8590c" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.4s" dur="0.8s" fill="freeze"/></path><path d="M140.0 110 A50 50 0 0 1 140.0 210" fill="none" stroke="#e8590c" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.55s" dur="0.8s" fill="freeze"/></path><path d="M144.0 90 A70 70 0 0 1 144.0 230" fill="none" stroke="#e8590c" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.6999999999999997s" dur="0.8s" fill="freeze"/></path><g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.6s" dur="0.4s" fill="freeze"/><text x="300" y="150" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Pause. Listen.</text><text x="300" y="175" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Repeat.</text></g><text x="200" y="280" font-size="15" fill="#23261f" text-anchor="middle">Three of anything means help (75%)</text>
</svg>
