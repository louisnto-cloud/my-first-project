<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, side view. The wind blows from the hunter in a layout blind toward the decoys. A goose comes in from downwind, glides lower into the wind toward the decoys and drops its feet. Final card: feet down, inside 35 metres: call the shot, a Tip.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Into the wind, feet down: that is the moment</text><rect x="0" y="240" width="400" height="60" rx="0" fill="#d9c48f"/><g transform="translate(60 250) scale(1.4)"><rect x="-22" y="-8" width="44" height="16" rx="8" fill="#d9c48f" stroke="#6b4f35" stroke-width="2"/><circle cx="14" cy="0" r="5" fill="#2f3a2b"/></g><line x1="20" y1="60" x2="100.0" y2="60.0" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="100.0,60.0 89.2,65.2 89.2,54.8" fill="#4a7fb0"/><text x="60.0" y="51" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Wind</text><g transform="translate(170 240) scale(-0.4 0.4)"><path d="M-34 0 Q-38 -16 -18 -16 L12 -14 Q26 -10 24 2 Q18 12 -4 12 L-24 12 Q-36 8 -34 0Z" fill="#7a6a58"/><path d="M14 -10 Q30 -6 34 14 L28 16 Q24 0 12 -2Z" fill="#2f3a2b"/><ellipse cx="33" cy="18" rx="6" ry="4" fill="#2f3a2b"/><path d="M30 16 Q34 22 36 19" stroke="#fff" stroke-width="2.5" fill="none"/><path fill="none" d="M-6 12 L-8 24 M2 12 L4 24" stroke="#2f3a2b" stroke-width="3"/></g><g transform="translate(210 240) scale(-0.4 0.4)"><path d="M-34 0 Q-38 -16 -18 -16 L12 -14 Q26 -10 24 2 Q18 12 -4 12 L-24 12 Q-36 8 -34 0Z" fill="#7a6a58"/><path d="M14 -10 Q30 -6 34 14 L28 16 Q24 0 12 -2Z" fill="#2f3a2b"/><ellipse cx="33" cy="18" rx="6" ry="4" fill="#2f3a2b"/><path d="M30 16 Q34 22 36 19" stroke="#fff" stroke-width="2.5" fill="none"/><path fill="none" d="M-6 12 L-8 24 M2 12 L4 24" stroke="#2f3a2b" stroke-width="3"/></g><g transform="translate(250 240) scale(-0.4 0.4)"><path d="M-34 0 Q-38 -16 -18 -16 L12 -14 Q26 -10 24 2 Q18 12 -4 12 L-24 12 Q-36 8 -34 0Z" fill="#7a6a58"/><path d="M14 -10 Q30 -6 34 14 L28 16 Q24 0 12 -2Z" fill="#2f3a2b"/><ellipse cx="33" cy="18" rx="6" ry="4" fill="#2f3a2b"/><path d="M30 16 Q34 22 36 19" stroke="#fff" stroke-width="2.5" fill="none"/><path fill="none" d="M-6 12 L-8 24 M2 12 L4 24" stroke="#2f3a2b" stroke-width="3"/></g><g transform="translate(290 240) scale(-0.4 0.4)"><path d="M-34 0 Q-38 -16 -18 -16 L12 -14 Q26 -10 24 2 Q18 12 -4 12 L-24 12 Q-36 8 -34 0Z" fill="#7a6a58"/><path d="M14 -10 Q30 -6 34 14 L28 16 Q24 0 12 -2Z" fill="#2f3a2b"/><ellipse cx="33" cy="18" rx="6" ry="4" fill="#2f3a2b"/><path d="M30 16 Q34 22 36 19" stroke="#fff" stroke-width="2.5" fill="none"/><path fill="none" d="M-6 12 L-8 24 M2 12 L4 24" stroke="#2f3a2b" stroke-width="3"/></g><path id="mgs-landing-p" d="M390 70 C 330 90, 280 150, 230 205" fill="none"/><g><g><g transform="translate(0 0) scale(-0.9 0.9)"><ellipse cx="0" cy="0" rx="20" ry="7" fill="#2f3a2b"/><path d="M16 -2 L36 -4 L36 1 L16 3Z" fill="#2f3a2b"/><ellipse cx="40" cy="-2" rx="6" ry="4" fill="#2f3a2b"/><path d="M45 -3 L51 -1 L45 1Z" fill="#2f3a2b"/><path d="M-8 -3 L6 -30 L12 -3Z" fill="#2f3a2b"/><path d="M-20 0 L-28 -3 L-28 3Z" fill="#2f3a2b"/></g></g><g opacity="0"><set attributeName="opacity" to="1" begin="4s"/><path fill="none" d="M-2 6 L-6 18 M6 6 L4 18" stroke="#2f3a2b" stroke-width="3"/></g><animateMotion dur="5s" fill="freeze"><mpath href="#mgs-landing-p"/></animateMotion></g><g opacity="0"><set attributeName="opacity" to="1" begin="4.6s"/><rect x="110" y="96" width="200" height="48" rx="8" fill="#2f3a2b"/><text x="210" y="116" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Feet down, inside 35 m</text><text x="210" y="134" font-size="14" fill="#fff" text-anchor="middle">Call the shot (Tip)</text></g>
