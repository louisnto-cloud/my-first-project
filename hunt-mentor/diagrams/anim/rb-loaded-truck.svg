<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: a rifle starts loaded, with a magazine clipped in and a round in the chamber. Step 1, the magazine comes out. Step 2, the round comes out of the chamber. Step 3, now unloaded, the rifle goes into the truck." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Unload before it goes in the truck</text>
<g transform="translate(320 180) scale(1.8)"><rect x="-34" y="-14" width="40" height="22" rx="3" fill="#4a7fb0"/><path d="M6 -14 L22 -14 L32 -2 L32 8 L6 8 Z" fill="#4a7fb0"/><path d="M10 -10 L20 -10 L27 -2 L10 -2 Z" fill="#ffffff"/><circle cx="-20" cy="10" r="7" fill="#2f3a2b"/><circle cx="20" cy="10" r="7" fill="#2f3a2b"/></g>
<g transform="translate(120 140)"><g><path d="M-90 4 L-30 -6 L-30 10 L-86 22 Z" fill="#8b5a2b"/><rect x="-32" y="-8" width="56" height="18" fill="#2f3a2b"/><rect x="24" y="-3" width="76" height="7" fill="#2f3a2b"/><rect x="-22" y="-22" width="44" height="9" rx="4" fill="#2f3a2b"/><g><rect x="-14" y="10" width="20" height="22" fill="#4d4d4d" stroke="#2f3a2b" stroke-width="1.5"/><rect x="-11" y="14" width="14" height="5" rx="2" fill="#e0a526"/><rect x="-11" y="22" width="14" height="5" rx="2" fill="#e0a526"/><animateTransform attributeName="transform" type="translate" values="0 0;0 70" begin="1s" dur="1s" fill="freeze"/><animate attributeName="opacity" values="1;0" begin="1.6s" dur="0.6s" fill="freeze"/></g><g><rect x="8" y="-3" width="16" height="6" rx="2" fill="#e0a526"/><animateTransform attributeName="transform" type="translate" values="0 0;10 -50;30 -40" begin="3s" dur="1s" fill="freeze"/><animate attributeName="opacity" values="1;0" begin="3.6s" dur="0.5s" fill="freeze"/></g><animateTransform attributeName="transform" type="translate" values="0 0;150 20" begin="5.2s" dur="1.6s" fill="freeze"/></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0s" dur="0.3s" fill="freeze"/><animate attributeName="opacity" values="1;0" begin="1s" dur="0.3s" fill="freeze"/><rect x="10" y="248" width="380" height="36" rx="8" fill="#c92a2a" stroke="#c92a2a" stroke-width="2"/><text x="200" y="272" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Loaded: magazine in, round chambered</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="1s" dur="0.3s" fill="freeze"/><animate attributeName="opacity" values="1;0" begin="3s" dur="0.3s" fill="freeze"/><rect x="10" y="248" width="380" height="36" rx="8" fill="#e8590c" stroke="#e8590c" stroke-width="2"/><text x="200" y="272" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1. Magazine out</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="3s" dur="0.3s" fill="freeze"/><animate attributeName="opacity" values="1;0" begin="5s" dur="0.3s" fill="freeze"/><rect x="10" y="248" width="380" height="36" rx="8" fill="#e8590c" stroke="#e8590c" stroke-width="2"/><text x="200" y="272" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2. Chamber empty</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="5s" dur="0.4s" fill="freeze"/><rect x="10" y="248" width="380" height="36" rx="8" fill="#5c7a3a" stroke="#5c7a3a" stroke-width="2"/><text x="200" y="272" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3. Unloaded: now it may go in</text></g>
</svg>
