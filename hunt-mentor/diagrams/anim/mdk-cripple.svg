<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation. A shot duck falls to the water. It lands with its head up and starts to swim: a cripple. A second shot is taken at once and the bird lies still. The hunter marks it by lining it up with a tree on the far shore. End card: then fetch it straight away; retrieval is the law, 99 percent."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="22" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Bird down, head up: shoot again now</text><rect x="0" y="150" width="400" height="150" fill="#4a7fb0" opacity=".5"/><path d="M300 150 L300 90 M286 104 L314 104 M290 122 L310 122" stroke="#4f6b3a" stroke-width="6"/><text x="300" y="80" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Tree</text><g><animateMotion dur="1.6s" fill="freeze" path="M120 50 Q200 60 230 180"/><g><ellipse rx="12" ry="5" fill="#8b5a2b"/><circle cx="11" cy="-3" r="4" fill="#2f6e3b"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.95;1" dur="1.6s" fill="freeze"/></g></g><g opacity="0"><set attributeName="opacity" to="1" begin="1.6s"/><animateTransform attributeName="transform" type="translate" values="0 0;30 4" begin="1.6s" dur="2s" fill="freeze"/><g transform="translate(230 186) scale(0.8)"><path d="M-30 0 Q-34 -14 -18 -14 L10 -12 Q24 -10 24 0 Q20 10 -2 10 L-22 10 Q-32 8 -30 0Z" fill="#8b5a2b"/><path d="M10 -10 Q12 -18 16 -22 L22 -18 Q18 -12 18 -6 Z" fill="#8b5a2b"/><circle cx="18" cy="-22" r="8" fill="#8b5a2b"/><path d="M24 -24 L35 -20 L24 -18 Z" fill="#2f3a2b"/></g><animate attributeName="opacity" values="1;0" begin="4.4s" dur=".3s" fill="freeze"/></g><g opacity="0"><set attributeName="opacity" to="1" begin="4.4s"/><g transform="translate(260 190)"><ellipse rx="14" ry="5" fill="#8b5a2b"/><circle cx="-14" cy="0" r="4" fill="#2f6e3b"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.2s" dur="0.3s" fill="freeze"/><text x="120" y="130" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">Head up!</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="4s"/><animate attributeName="opacity" values="1;0" begin="4.4s" dur=".3s" fill="freeze"/><circle cx="246" cy="186" r="24" fill="#ffe08a" opacity=".7"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="5s" dur="0.5s" fill="freeze"/><line x1="260" y1="190" x2="300" y2="120" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 4" fill="none"/><text x="150" y="240" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Mark it: bird lines up with the tree</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="6.4s" dur="0.5s" fill="freeze"/><rect x="10" y="254" width="380" height="38" rx="8" fill="#2f3a2b"/><text x="200" y="279" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Then fetch it straight away (99% law)</text></g><path d="M10 290 L60 270" stroke="none"/></svg>
