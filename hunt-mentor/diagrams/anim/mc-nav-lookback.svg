<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a hunter walks up a trail to a fork, stops, turns around and looks back down the way he came. The view back is the view he will see on the way out. He flags the fork in his memory and on the map. Tip.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Look back at every turn</text><rect x="0" y="40" width="400" height="260" rx="0" fill="#dfe6d3"/><path d="M60 280 L140 200 L140 120 L260 80" fill="none" stroke="#c8b98f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 200 L330 170" fill="none" stroke="#c8b98f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(100 150) scale(0.9)"><polygon points="0,-36 -14,-4 14,-4" fill="#8a9a6b"/><polygon points="0,-24 -17,6 17,6" fill="#8a9a6b"/><rect x="-3" y="6" width="6" height="8" fill="#6b4f35"/></g><g transform="translate(200 230) scale(0.9)"><polygon points="0,-36 -14,-4 14,-4" fill="#8a9a6b"/><polygon points="0,-24 -17,6 17,6" fill="#8a9a6b"/><rect x="-3" y="6" width="6" height="8" fill="#6b4f35"/></g><g transform="translate(300 120) scale(0.8)"><polygon points="0,-36 -14,-4 14,-4" fill="#8a9a6b"/><polygon points="0,-24 -17,6 17,6" fill="#8a9a6b"/><rect x="-3" y="6" width="6" height="8" fill="#6b4f35"/></g><g transform="translate(330 240) scale(0.9)"><polygon points="0,-36 -14,-4 14,-4" fill="#8a9a6b"/><polygon points="0,-24 -17,6 17,6" fill="#8a9a6b"/><rect x="-3" y="6" width="6" height="8" fill="#6b4f35"/></g><path id="mc-nav-lookback-p" d="M60 280 L140 200 L140 150" fill="none" stroke="none"/><g><g transform="translate(0 18) scale(0.7)"><circle cx="0" cy="-30" r="7" fill="#2f3a2b"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" fill="none" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><animateMotion dur="3s" fill="freeze"><mpath href="#mc-nav-lookback-p"/></animateMotion></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="3s" dur="0.5s" fill="freeze"/><path d="M150 150 C190 175 200 215 160 240" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round"/><text x="250" y="270" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Turn around: this is</text><text x="250" y="290" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">the view on the way out</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.5s" dur="0.5s" fill="freeze"/><line x1="150" y1="205" x2="150" y2="171" stroke="#23261f" stroke-width="3" stroke-linecap="round"/><polygon points="150,171 170,178 150,185" fill="#e8590c"/><text x="210" y="210" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Fork: note it</text></g>
</svg>
