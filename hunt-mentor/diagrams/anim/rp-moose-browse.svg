<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation. A moose stands by a tall willow. It reaches up to about 2.5 m, then bends and breaks the stem down with its jaws to get the twig tips that were out of reach. Final label: breaks branches to reach the tips. Look for snapped stems in willow and aspen.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Moose ride down tall twigs</text><rect x="0" y="250" width="400" height="50" rx="0" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(150 252) scale(1.6)"><path d="M-20 -30 Q -18 -46 0 -46 Q 14 -50 16 -40 L 18 -30 Q 10 -22 -20 -24 Z" fill="#4a3322"/><path d="M14 -42 L28 -40 L30 -32 L24 -30 L16 -34 Z" fill="#4a3322"/><path d="M-16 -26 v26 M-10 -26 v26 M10 -28 v28 M15 -28 v28" stroke="#4a3322" stroke-width="3"/><path d="M20 -42 q-6 -10 4 -12 q2 6 -2 10 M22 -42 q8 -9 12 -6" stroke="#8b6b45" stroke-width="2.5" fill="none"/></g><g><path d="M260 252 Q 262 160 258 70" fill="none" stroke="#6b4f35" stroke-width="5"/><path d="M238.0 80 q 2.0 -22.0 12.0 -17.6 q 8.0 -11.0 16.0 -2.2 q 12.0 -4.4 12.0 19.8 Z" fill="#7da35a"/><animateTransform attributeName="transform" type="rotate" values="0 260 252;0 260 252;-38 260 252" keyTimes="0;0.4;1" dur="4s" begin="0.5s" fill="freeze"/></g><line x1="20" y1="70" x2="20" y2="250" stroke="#2f3a2b" stroke-width="1" stroke-dasharray="4 4"/><text x="26" y="80" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">2.5 m reach</text><g opacity="0"><rect x="230" y="50" width="160" height="50" rx="8" fill="#2f3a2b"/><text x="310" y="72" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Breaks branches</text><text x="310" y="90" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">to reach the tips</text><animate attributeName="opacity" values="0;1" begin="4.5s" dur="0.5s" fill="freeze"/></g><text x="200" y="280" font-size="14" fill="#6b4f35" text-anchor="middle">Look for snapped stems in willow and aspen</text>
</svg>
