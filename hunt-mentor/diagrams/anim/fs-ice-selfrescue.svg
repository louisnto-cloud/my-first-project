<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a person in a hole in the ice breathes, turns back toward solid ice, puts arms on it and kicks, slides out flat and rolls away. Lie flat until well clear of the hole.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fell through: get out</text><rect x="0" y="140" width="150" height="160" rx="0" fill="#bfe0f2"/><rect x="250" y="140" width="150" height="160" rx="0" fill="#bfe0f2"/><rect x="150" y="140" width="100" height="160" rx="0" fill="#2f5f88"/><g><animateMotion path="M200 152 L200 152 L170 140 L100 136 L60 136" keyTimes="0;0.25;0.5;0.8;1" calcMode="linear" dur="6s" fill="freeze"/><circle cx="0" cy="0" r="12.0" fill="#d9b48f"/><rect x="12" y="-8" width="50" height="16" rx="6" fill="#e8590c"/></g><g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.100;0.900;1" begin="0.2s" dur="1.4000000000000001s" fill="freeze"/><text x="200" y="100" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="middle">Breathe</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.100;0.900;1" begin="1.6s" dur="1.6s" fill="freeze"/><text x="200" y="100" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">Turn back, arms on, kick</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.100;0.900;1" begin="3.2s" dur="2.3999999999999995s" fill="freeze"/><text x="200" y="100" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">Slide out, roll away</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="6s" dur="0.4s" fill="freeze"/><rect x="41" y="250" width="317" height="30" rx="6" fill="#2f3a2b"/><text x="200" y="271" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Lie flat until you are well clear</text></g>
</svg>
