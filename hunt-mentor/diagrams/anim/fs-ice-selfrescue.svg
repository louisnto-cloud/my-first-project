<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a person in a hole in the ice breathes, turns back toward the solid ice they came from, puts arms on it and kicks, slides out flat and rolls away. Lie flat until you are well clear of the hole.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fell through: get out</text>
<rect x="0" y="140" width="150" height="160" fill="#bfe0f2"/><rect x="250" y="140" width="150" height="160" fill="#bfe0f2"/>
<path d="M20 170 l30 -8 M70 210 l40 -10 M290 190 l36 -9 M320 250 l40 -10 M30 260 l30 -7" stroke="#e8f4fb" stroke-width="3" stroke-linecap="round"/>
<rect x="150" y="140" width="100" height="160" fill="#2f5f88"/>
<path d="M160 160 q10 -6 20 0 t20 0 t20 0 t20 0" stroke="#5f8fb8" stroke-width="2" fill="none"/>
<g><animateMotion path="M200 152 L200 152 L170 140 L100 136 L60 136" keyTimes="0;0.25;0.5;0.8;1" calcMode="linear" dur="6s" fill="freeze"/><rect x="10" y="-9" width="56" height="18" rx="7" fill="#e8590c"/><path d="M62 -6 h10 M62 6 h10" stroke="#3b3a36" stroke-width="5" stroke-linecap="round"/><path d="M4 -8 L-14 -12 M4 8 L-14 12" stroke="#e8590c" stroke-width="6" stroke-linecap="round"/><circle cx="0" cy="0" r="12" fill="#d9b48f"/><path d="M-10 -5 C-10 -15 10 -15 10 -5z" fill="#2f3a2b"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="0.2s" dur="1.4s" fill="freeze"/><text x="200" y="66" font-size="18" font-weight="bold" fill="#c2410c" text-anchor="middle">Breathe</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="1.6s" dur="1.6s" fill="freeze"/><text x="200" y="66" font-size="18" font-weight="bold" fill="#c2410c" text-anchor="middle">Turn back, arms on, kick</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="3.2s" dur="2.4s" fill="freeze"/><text x="200" y="66" font-size="18" font-weight="bold" fill="#c2410c" text-anchor="middle">Slide out, roll away</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="6s" dur="0.4s" fill="freeze"/><rect x="41" y="86" width="318" height="34" rx="6" fill="#2f3a2b"/><text x="200" y="109" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Lie flat until you are well clear</text></g>
</svg>
