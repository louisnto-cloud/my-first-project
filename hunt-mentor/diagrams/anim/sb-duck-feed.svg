<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, side view of the water. Left: a puddle duck tips forward, head under and tail in the air, then comes back up and tips up again, staying in the shallows. Right: a diving duck goes right under the surface and swims deep and far before it would pop up somewhere else. Final labels: tips up, stays in the shallows; goes right under, pops up far away.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect x="0" y="150" width="400" height="150" fill="#4a7fb0" opacity=".18"/>
  <text x="100" y="30" font-size="17" font-weight="bold" fill="#8b5a2b" text-anchor="middle">Puddle duck</text>
  <text x="300" y="30" font-size="17" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Diver</text>
  <line x1="200" y1="40" x2="200" y2="290" stroke="#8a9a6b" stroke-width="2" stroke-dasharray="5 5"/>
  <g transform="translate(100 150)"><g><g transform="translate(0 0) scale(1.2)"><path d="M-30 0 Q-34 -14 -18 -14 L10 -12 Q24 -10 24 0 Q20 10 -2 10 L-22 10 Q-32 8 -30 0Z" fill="#8b5a2b"/><circle cx="18" cy="-20" r="9" fill="#8b5a2b"/><path d="M26 -21 L38 -18 L26 -15Z" fill="#2f3a2b"/></g><animateTransform attributeName="transform" type="rotate" values="0;0;75;75;0;0;75" keyTimes="0;.12;.28;.45;.58;.72;1" dur="8s" fill="freeze"/></g></g>
  <g><g transform="translate(0 0) scale(1.0)"><path d="M-30 0 Q-34 -14 -18 -14 L10 -12 Q24 -10 24 0 Q20 10 -2 10 L-22 10 Q-32 8 -30 0Z" fill="#4a7fb0"/><circle cx="18" cy="-20" r="9" fill="#4a7fb0"/><path d="M26 -21 L38 -18 L26 -15Z" fill="#2f3a2b"/></g><animateTransform attributeName="transform" type="translate" values="290 150;290 150;300 210;340 240;360 250" keyTimes="0;.2;.4;.7;1" dur="8s" fill="freeze"/></g>
  <rect x="0" y="150" width="400" height="150" fill="#4a7fb0" opacity=".35"/>
  <line x1="0" y1="150" x2="400" y2="150" stroke="#4a7fb0" stroke-width="3"/>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="7s" dur=".6s" fill="freeze"/><rect x="10" y="56" width="180" height="56" rx="8" fill="#2f3a2b"/><text x="100" y="80" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Tips up, stays</text><text x="100" y="100" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">in the shallows</text><rect x="210" y="56" width="180" height="56" rx="8" fill="#2f3a2b"/><text x="300" y="80" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Goes right under,</text><text x="300" y="100" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">pops up far away</text></g>
</svg>
