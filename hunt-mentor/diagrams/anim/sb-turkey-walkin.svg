<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, dawn. A tom gobbles on his roost tree at first light. He flies down to the ground. You call softly, then stop. He goes silent because he is walking in toward your hen decoy, so stay still. He arrives at the decoy: see the beard, then the head, before any shot. Tip.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect width="400" height="300" fill="#dfe6d3"/>
  <rect width="400" height="300" fill="#2f3a4b"><animate attributeName="opacity" values=".55;0" dur="3s" fill="freeze"/></rect>
  <g fill="#2f3a2b" transform="translate(70 150) scale(2.6)"><polygon points="-12,0 0,-34 12,0"/><rect x="-3" y="0" width="6" height="8"/></g>
  <text x="70" y="176" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Roost</text>
  <circle cx="320" cy="214" r="24" fill="#2f3a2b"/>
  <g transform="translate(320 250) scale(1.0)"><circle r="9" fill="#e8590c"/></g>
  <text x="320" y="284" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">You</text>
  <g transform="translate(250 230) scale(0.35)"><path d="M-24 -6 L-48 -2 L-24 6Z" fill="#8a6e4f"/><ellipse cx="0" cy="0" rx="28" ry="20" fill="#8a6e4f"/><path d="M18 -8 Q26 -30 30 -40" stroke="#8fa3b8" stroke-width="7" fill="none"/><circle cx="31" cy="-42" r="7" fill="#8fa3b8"/><path d="M37 -43 L44 -41 L37 -39Z" fill="#2f3a2b"/><path d="M-4 18 L-6 34 M8 18 L10 34" stroke="#b07a5a" stroke-width="3"/></g>
  <text x="250" y="262" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Decoy</text>
  <g><g transform="translate(0 0) scale(0.5)"><path d="M-10 -10 L-60.4 -22.8 L-56.8 -32.6Z" fill="#4a3b2c"/><circle cx="-56.0" cy="-26.8" r="4" fill="#efe6d6"/><path d="M-10 -10 L-54.2 -37.4 L-47.9 -45.6Z" fill="#4a3b2c"/><circle cx="-48.9" cy="-39.8" r="4" fill="#efe6d6"/><path d="M-10 -10 L-43.9 -49.4 L-35.4 -55.4Z" fill="#4a3b2c"/><circle cx="-38.1" cy="-50.1" r="4" fill="#efe6d6"/><path d="M-10 -10 L-30.5 -57.8 L-20.6 -60.9Z" fill="#4a3b2c"/><circle cx="-24.7" cy="-56.7" r="4" fill="#efe6d6"/><path d="M-10 -10 L-15.2 -61.7 L-4.8 -61.7Z" fill="#4a3b2c"/><circle cx="-10.0" cy="-59.0" r="4" fill="#efe6d6"/><path d="M-10 -10 L0.6 -60.9 L10.5 -57.8Z" fill="#4a3b2c"/><circle cx="4.7" cy="-56.7" r="4" fill="#efe6d6"/><path d="M-10 -10 L15.4 -55.4 L23.9 -49.4Z" fill="#4a3b2c"/><circle cx="18.1" cy="-50.1" r="4" fill="#efe6d6"/><path d="M-10 -10 L27.9 -45.6 L34.2 -37.4Z" fill="#4a3b2c"/><circle cx="28.9" cy="-39.8" r="4" fill="#efe6d6"/><path d="M-10 -10 L36.8 -32.6 L40.4 -22.8Z" fill="#4a3b2c"/><circle cx="36.0" cy="-26.8" r="4" fill="#efe6d6"/><ellipse cx="0" cy="0" rx="28" ry="20" fill="#4a3b2c"/><path d="M18 -8 Q26 -30 30 -40" stroke="#c0392b" stroke-width="7" fill="none"/><circle cx="31" cy="-42" r="7" fill="#7fb0d8"/><path d="M37 -43 L44 -41 L37 -39Z" fill="#2f3a2b"/><path d="M30 -36 q4 8 0 14" stroke="#c0392b" stroke-width="4" fill="none"/><path d="M22 -6 L24 20" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round"/><path d="M-4 18 L-6 34 M8 18 L10 34" stroke="#b07a5a" stroke-width="3"/></g><animateTransform attributeName="transform" type="translate" values="76 70;76 70;140 190;140 190;200 214" keyTimes="0;.25;.45;.6;1" dur="9s" fill="freeze"/></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="0.6s"/><set attributeName="opacity" to="0" begin="2.4s"/><text x="150" y="60" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">GOBBLE!</text></g>
  <rect x="10" y="10" width="380" height="36" rx="8" fill="#2f3a2b"/>
  <g><set attributeName="opacity" to="0" begin="2.4s"/><text x="200" y="34" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">First light: he gobbles on the roost</text></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="2.4s"/><set attributeName="opacity" to="0" begin="5.4s"/><text x="200" y="34" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">He flies down. Call soft, then stop</text></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="5.4s"/><set attributeName="opacity" to="0" begin="8.6s"/><text x="200" y="34" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Silent? He is walking in. Stay still</text></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="8.6s"/><text x="200" y="34" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">See the beard, then the head</text></g>
</svg>
