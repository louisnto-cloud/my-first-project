<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 314" font-family="sans-serif" role="img" aria-label="Animation, map view. Timber on the left where deer bed, grass on the right where they feed, and an orange dashed edge between them. As the light fades, two deer walk out of the timber across the edge into the grass to feed. A hunter sits along the edge. Caption: out to feed at dusk, back at dawn.">
