<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: the sun rises. Two hours before sunrise, nothing is legal. At 1 hour before sunrise, deer and grouse are legal, ducks and geese must wait. At 30 minutes before sunrise, ducks and geese are legal too. Then sunrise. In the evening deer end 1 hour after sunset and ducks end 30 minutes after sunset." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="190" fill="#1f2a3a"><animate attributeName="fill" values="#1f2a3a;#5a6f8f;#a9c4de" begin="0s" dur="8s" fill="freeze"/></rect>
<circle cx="200" cy="230" r="26" fill="#e8590c"><animate attributeName="cy" values="230;190;172" keyTimes="0;0.85;1" begin="0s" dur="8s" fill="freeze"/></circle>
<rect x="0" y="190" width="400" height="110" fill="#8a9a6b"/>
<path d="M0 190 Q 100 170 200 186 T 400 180 L400 196 L0 196 Z" fill="#2f3a2b"/>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0s" dur="0.3s" fill="freeze"/><animate attributeName="opacity" values="1;0" begin="2s" dur="0.3s" fill="freeze"/><text x="200" y="40" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">2 hours before sunrise</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="2s" dur="0.3s" fill="freeze"/><animate attributeName="opacity" values="1;0" begin="4.5s" dur="0.3s" fill="freeze"/><text x="200" y="40" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">1 hour before sunrise</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.5s" dur="0.3s" fill="freeze"/><animate attributeName="opacity" values="1;0" begin="7s" dur="0.3s" fill="freeze"/><text x="200" y="40" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">30 minutes before sunrise</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="7s" dur="0.4s" fill="freeze"/><text x="200" y="40" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">Sunrise</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0s" dur="0.3s" fill="freeze"/><animate attributeName="opacity" values="1;0" begin="2s" dur="0.3s" fill="freeze"/><rect x="30" y="70" width="340" height="34" rx="8" fill="#c92a2a" stroke="#c92a2a" stroke-width="2"/><text x="200" y="93" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Deer, grouse: wait</text><rect x="30" y="112" width="340" height="34" rx="8" fill="#c92a2a" stroke="#c92a2a" stroke-width="2"/><text x="200" y="135" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Ducks, geese: wait</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="2s" dur="0.3s" fill="freeze"/><animate attributeName="opacity" values="1;0" begin="4.5s" dur="0.3s" fill="freeze"/><rect x="30" y="70" width="340" height="34" rx="8" fill="#5c7a3a" stroke="#5c7a3a" stroke-width="2"/><text x="200" y="93" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Deer, grouse: GO</text><rect x="30" y="112" width="340" height="34" rx="8" fill="#c92a2a" stroke="#c92a2a" stroke-width="2"/><text x="200" y="135" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Ducks, geese: wait</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.5s" dur="0.4s" fill="freeze"/><rect x="30" y="70" width="340" height="34" rx="8" fill="#5c7a3a" stroke="#5c7a3a" stroke-width="2"/><text x="200" y="93" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Deer, grouse: GO</text><rect x="30" y="112" width="340" height="34" rx="8" fill="#5c7a3a" stroke="#5c7a3a" stroke-width="2"/><text x="200" y="135" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Ducks, geese: GO</text></g>
<text x="200" y="236" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Ducks start 30 minutes later.</text>
<text x="200" y="262" font-size="15" fill="#ffffff" text-anchor="middle">Evenings: deer 1 hour after sunset,</text>
<text x="200" y="282" font-size="15" fill="#ffffff" text-anchor="middle">ducks 30 minutes after.</text>
</svg>
