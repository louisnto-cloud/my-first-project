<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation of a deer breathing, three breaths. The dashed diaphragm behind the lungs moves back and the lungs swell as air flows in through the nose, then the diaphragm moves forward and the lungs shrink as air flows out. A caption says a hole in the chest wall makes the lungs collapse." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<g opacity="0.85" transform="translate(14 14)"><rect x="118" y="190" width="14" height="62" rx="6" fill="#d9c7a7" stroke="#6b4f35" stroke-width="2"/><rect x="140" y="190" width="14" height="62" rx="6" fill="#d9c7a7" stroke="#6b4f35" stroke-width="2"/><rect x="300" y="190" width="14" height="62" rx="6" fill="#d9c7a7" stroke="#6b4f35" stroke-width="2"/><rect x="322" y="190" width="14" height="62" rx="6" fill="#d9c7a7" stroke="#6b4f35" stroke-width="2"/><ellipse cx="220" cy="150" rx="130" ry="58" fill="#e9dcc2" stroke="#6b4f35" stroke-width="3"/><path d="M120 112 L66 52 L88 40 L150 100 Z" fill="#e9dcc2" stroke="#6b4f35" stroke-width="3" stroke-linejoin="round"/><ellipse cx="56" cy="46" rx="28" ry="15" fill="#e9dcc2" stroke="#6b4f35" stroke-width="3"/><path d="M72 34 L84 14 L88 36 Z" fill="#e9dcc2" stroke="#6b4f35" stroke-width="2"/><circle cx="46" cy="42" r="3" fill="#23261f"/><path d="M346 128 C 362 132 366 150 360 166" fill="none" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/></g><g transform="translate(14 14)"><ellipse cx="140" cy="142" rx="34" ry="38" fill="#f2b48e" stroke="#e8590c" stroke-width="2"><animate attributeName="rx" values="30;40;30" dur="3s" repeatCount="3" fill="freeze"/><animate attributeName="ry" values="34;42;34" dur="3s" repeatCount="3" fill="freeze"/></ellipse><path d="M176 104 C 196 130 194 176 172 204" fill="none" stroke="#23261f" stroke-width="4" stroke-dasharray="6 4"><animateTransform attributeName="transform" type="translate" values="0 0;14 0;0 0" dur="3s" repeatCount="3" fill="freeze"/></path><g><line x1="30" y1="70" x2="58" y2="56" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><polygon points="58.0,56.0 52.5,63.1 49.0,56.1" fill="#4a7fb0"/><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="3s" repeatCount="3" fill="freeze"/></g></g><text x="200" y="22" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">Breathing: the diaphragm does the work</text><g><text x="250" y="50" font-size="15" fill="#4a7fb0" text-anchor="middle" font-weight="bold">Diaphragm back: air in</text><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="3s" repeatCount="3" fill="freeze"/></g><g opacity="0"><text x="250" y="50" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Diaphragm forward: air out</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.45;.5;.95;1" dur="3s" repeatCount="3" fill="freeze"/></g><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Hole in the chest wall: lungs collapse.</text>
</svg>
