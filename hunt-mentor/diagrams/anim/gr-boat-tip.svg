<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 352" font-family="sans-serif" role="img" aria-label="Animation: a hunter stands in a small boat and fires. Recoil pushes him back, his high weight swings the boat over and it tips. Lesson: never stand to shoot. Sit square, feet flat. One person moves at a time.">
<rect width="400" height="352" fill="#fffaf0"/>
<text x="200" y="27" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Why you never stand to shoot</text>
<rect x="0" y="40" width="400" height="160" fill="#e6eef3"/>
<g>
<animateTransform attributeName="transform" type="rotate" values="0 200 200;0 200 200;-12 200 200;-60 200 200" keyTimes="0;0.35;0.55;1" dur="5s" fill="freeze"/>
<path d="M128 176 L272 176 L262 210 C258 218 250 222 240 222 L160 222 C150 222 142 218 138 210z" fill="#9aa3a6" stroke="#4f585b" stroke-width="2.4"/>
<path d="M126 174 H274" stroke="#4f585b" stroke-width="5" stroke-linecap="round"/><path d="M146 196 H254" stroke="#7d8689" stroke-width="2"/>
<path d="M190 212 L194 160 M210 212 L206 160" stroke="#4a4136" stroke-width="9" stroke-linecap="round"/>
<path d="M184 162 C182 140 186 118 200 112 C214 118 218 140 216 162z" fill="#e8590c"/>
<circle cx="202" cy="100" r="10" fill="#e0b48c"/>
<path d="M191 98 C191 86 213 86 213 98z" fill="#e8590c"/><path d="M211 96 h8" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/>
<path d="M196 126 L290 102" stroke="#3b2a1a" stroke-width="5" stroke-linecap="round"/><path d="M196 126 L184 132" stroke="#5a3d22" stroke-width="8" stroke-linecap="round"/>
<path d="M204 124 L236 116" stroke="#e0b48c" stroke-width="5" stroke-linecap="round"/>
<circle cx="300" cy="99" r="10" fill="#f5b041" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="1.6s" dur=".4s" fill="freeze"/></circle>
</g>
<rect x="0" y="200" width="400" height="96" fill="#4a7fb0" opacity=".55"/>
<path d="M20 214 q10 -5 20 0 q10 5 20 0" stroke="#d8e6f1" stroke-width="1.8" fill="none"/><path d="M300 218 q10 -5 20 0 q10 5 20 0" stroke="#d8e6f1" stroke-width="1.8" fill="none"/><path d="M80 236 q10 -5 20 0 q10 5 20 0" stroke="#d8e6f1" stroke-width="1.8" fill="none"/><path d="M330 238 q10 -5 20 0 q10 5 20 0" stroke="#d8e6f1" stroke-width="1.8" fill="none"/>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.6s" dur="0.3s" fill="freeze"/><text x="22" y="130" font-size="17" font-weight="bold" fill="#e8590c">Recoil</text><path d="M128 146 H40" stroke="#e8590c" stroke-width="3.4"/><path d="M32.0 146.0 L44.0 152.6 L44.0 139.4z" fill="#e8590c"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.6s" dur="0.4s" fill="freeze"/><rect x="0" y="296" width="400" height="56" fill="#2f3a2b"/><text x="200" y="319" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">Sit square, feet flat</text><text x="200" y="340" font-size="15" fill="#fffaf0" text-anchor="middle">One person moves at a time</text></g>
</svg>
