<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a hunter stands in a small boat and fires. Recoil pushes him back, his high weight swings the boat over and it tips. Lesson: never stand to shoot. Sit square, feet flat.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Why you never stand to shoot</text>
  <rect x="0" y="200" width="400" height="100" fill="#4a7fb0" opacity=".35"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 200 200;0 200 200;-12 200 200;-60 200 200" keyTimes="0;0.35;0.55;1" dur="5s" fill="freeze"/>
    <path d="M110 186 L290 186 L274 216 L126 216 Z" fill="#8a8f88" stroke="#2f3a2b" stroke-width="2"/>
    <circle cx="200" cy="96" r="13" fill="#2f3a2b"/>
    <line x1="200" y1="110" x2="200" y2="156" stroke="#2f3a2b" stroke-width="10" stroke-linecap="round"/>
    <line x1="200" y1="156" x2="190" y2="186" stroke="#2f3a2b" stroke-width="8"/><line x1="200" y1="156" x2="212" y2="186" stroke="#2f3a2b" stroke-width="8"/>
    <line x1="196" y1="118" x2="290" y2="90" stroke="#8b5a2b" stroke-width="7" stroke-linecap="round"/>
    <circle cx="300" cy="86" r="10" fill="#e8b10c" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="1.6s" dur=".4s" fill="freeze"/></circle>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.6s" dur=".3s" fill="freeze"/><text x="20" y="130" font-size="16" font-weight="bold" fill="#e8590c">Recoil</text><path d="M120 150 h-60 m10 -6 l-10 6 l10 6" stroke="#e8590c" stroke-width="3" fill="none"/></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.6s" dur=".4s" fill="freeze"/>
    <rect x="80" y="236" width="240" height="50" rx="8" fill="#2f3a2b"/><text x="200" y="258" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Sit square, feet flat</text><text x="200" y="278" font-size="14" fill="#fff" text-anchor="middle">One person moves at a time</text>
  </g>
</svg>
