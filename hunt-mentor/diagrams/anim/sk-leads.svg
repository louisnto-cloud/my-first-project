<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" font-family="sans-serif" role="img" aria-label="Animation, three rows, a mallard flying right to left and an orange muzzle mark. Swing through: the muzzle starts behind the duck, swings faster, passes it and fires. Sustained lead: the muzzle starts ahead and holds the gap. Pull away: the muzzle starts on the duck, then pulls ahead and fires. In every row the gun keeps moving, the shot lands ahead and the duck flies into it and drops. All three: gun still moving when it fires.">
