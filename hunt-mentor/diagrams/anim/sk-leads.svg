<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, three rows, a duck flying right to left and an orange muzzle mark. Swing through: the muzzle starts behind the duck, swings faster, passes it and fires. Sustained lead: the muzzle starts ahead and holds the gap. Pull away: the muzzle starts on the duck, then pulls ahead and fires. In every row the gun keeps moving, the shot lands ahead and the duck flies into it.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="20" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">Three ways to lead. Duck flies right to left.</text><line x1="10" y1="100" x2="390" y2="100" stroke="#dfe6d3" stroke-width="2"/><text x="12" y="52" font-size="15" font-weight="bold" fill="#23261f">Swing through</text><text x="150" y="52" font-size="13" fill="#2f3a2b">start behind, pass it</text><g><g transform="translate(0 0) scale(0.8)"><ellipse cx="0" cy="0" rx="20" ry="8" fill="#23261f"/><circle cx="-21" cy="-5" r="6" fill="#23261f"/><path d="M-27 -5 L-36 -3 L-27 -1 Z" fill="#e8590c"/><path d="M-4 -3 L6 -24 L14 -4 Z" fill="#2f3a2b"/></g><animateTransform attributeName="transform" type="translate" values="360 78;133 78;133 98;133 98" keyTimes="0;.81;.93;1" dur="6s" fill="freeze"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.667;.75;.85;1" dur="6s" fill="freeze"/><circle cx="133.9" cy="72.3" r="2.4" fill="#23261f"/><circle cx="110.0" cy="78.2" r="2.4" fill="#23261f"/><circle cx="120.8" cy="86.4" r="2.4" fill="#23261f"/><circle cx="123.0" cy="83.1" r="2.4" fill="#23261f"/><circle cx="127.6" cy="74.4" r="2.4" fill="#23261f"/><circle cx="109.8" cy="82.9" r="2.4" fill="#23261f"/><circle cx="126.4" cy="69.8" r="2.4" fill="#23261f"/><circle cx="132.7" cy="84.0" r="2.4" fill="#23261f"/><circle cx="116.1" cy="87.8" r="2.4" fill="#23261f"/><circle cx="127.3" cy="79.7" r="2.4" fill="#23261f"/><circle cx="118.6" cy="83.2" r="2.4" fill="#23261f"/><circle cx="133.4" cy="74.1" r="2.4" fill="#23261f"/><circle cx="114.7" cy="66.6" r="2.4" fill="#23261f"/><circle cx="127.8" cy="73.4" r="2.4" fill="#23261f"/></g><g><circle cx="0" cy="0" r="9" fill="none" stroke="#e8590c" stroke-width="3"/><line x1="-14" y1="0" x2="14" y2="0" stroke="#e8590c" stroke-width="2"/><animateTransform attributeName="transform" type="translate" values="400 78;133 78;0 78" keyTimes="0;.667;1" dur="6s" fill="freeze"/></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" begin="4s" dur=".4s" fill="freeze"/><text x="133" y="68" font-size="13" font-weight="bold" text-anchor="middle" fill="#e8590c">BANG</text></g><line x1="10" y1="182" x2="390" y2="182" stroke="#dfe6d3" stroke-width="2"/><text x="12" y="134" font-size="15" font-weight="bold" fill="#23261f">Sustained lead</text><text x="150" y="134" font-size="13" fill="#2f3a2b">start ahead, hold the gap</text><g><g transform="translate(0 0) scale(0.8)"><ellipse cx="0" cy="0" rx="20" ry="8" fill="#23261f"/><circle cx="-21" cy="-5" r="6" fill="#23261f"/><path d="M-27 -5 L-36 -3 L-27 -1 Z" fill="#e8590c"/><path d="M-4 -3 L6 -24 L14 -4 Z" fill="#2f3a2b"/></g><animateTransform attributeName="transform" type="translate" values="360 160;133 160;133 180;133 180" keyTimes="0;.81;.93;1" dur="6s" fill="freeze"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.667;.75;.85;1" dur="6s" fill="freeze"/><circle cx="119.2" cy="162.5" r="2.4" fill="#23261f"/><circle cx="122.6" cy="160.3" r="2.4" fill="#23261f"/><circle cx="121.5" cy="170.9" r="2.4" fill="#23261f"/><circle cx="115.9" cy="156.7" r="2.4" fill="#23261f"/><circle cx="127.2" cy="165.4" r="2.4" fill="#23261f"/><circle cx="111.2" cy="165.9" r="2.4" fill="#23261f"/><circle cx="108.9" cy="159.9" r="2.4" fill="#23261f"/><circle cx="131.4" cy="155.4" r="2.4" fill="#23261f"/><circle cx="118.3" cy="162.4" r="2.4" fill="#23261f"/><circle cx="112.0" cy="149.4" r="2.4" fill="#23261f"/><circle cx="117.4" cy="156.2" r="2.4" fill="#23261f"/><circle cx="115.3" cy="150.1" r="2.4" fill="#23261f"/><circle cx="123.8" cy="169.8" r="2.4" fill="#23261f"/><circle cx="134.9" cy="157.8" r="2.4" fill="#23261f"/></g><g><circle cx="0" cy="0" r="9" fill="none" stroke="#e8590c" stroke-width="3"/><line x1="-14" y1="0" x2="14" y2="0" stroke="#e8590c" stroke-width="2"/><animateTransform attributeName="transform" type="translate" values="320 160;133 160;40 160" keyTimes="0;.667;1" dur="6s" fill="freeze"/></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" begin="4s" dur=".4s" fill="freeze"/><text x="133" y="150" font-size="13" font-weight="bold" text-anchor="middle" fill="#e8590c">BANG</text></g><line x1="10" y1="264" x2="390" y2="264" stroke="#dfe6d3" stroke-width="2"/><text x="12" y="216" font-size="15" font-weight="bold" fill="#23261f">Pull away</text><text x="150" y="216" font-size="13" fill="#2f3a2b">start on it, pull ahead</text><g><g transform="translate(0 0) scale(0.8)"><ellipse cx="0" cy="0" rx="20" ry="8" fill="#23261f"/><circle cx="-21" cy="-5" r="6" fill="#23261f"/><path d="M-27 -5 L-36 -3 L-27 -1 Z" fill="#e8590c"/><path d="M-4 -3 L6 -24 L14 -4 Z" fill="#2f3a2b"/></g><animateTransform attributeName="transform" type="translate" values="360 242;133 242;133 262;133 262" keyTimes="0;.81;.93;1" dur="6s" fill="freeze"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.667;.75;.85;1" dur="6s" fill="freeze"/><circle cx="111.1" cy="237.0" r="2.4" fill="#23261f"/><circle cx="115.5" cy="247.2" r="2.4" fill="#23261f"/><circle cx="128.9" cy="236.1" r="2.4" fill="#23261f"/><circle cx="112.4" cy="247.8" r="2.4" fill="#23261f"/><circle cx="131.8" cy="238.6" r="2.4" fill="#23261f"/><circle cx="119.5" cy="249.8" r="2.4" fill="#23261f"/><circle cx="116.2" cy="240.8" r="2.4" fill="#23261f"/><circle cx="121.1" cy="232.2" r="2.4" fill="#23261f"/><circle cx="128.2" cy="244.9" r="2.4" fill="#23261f"/><circle cx="128.4" cy="251.9" r="2.4" fill="#23261f"/><circle cx="115.2" cy="230.8" r="2.4" fill="#23261f"/><circle cx="123.1" cy="236.7" r="2.4" fill="#23261f"/><circle cx="120.0" cy="245.5" r="2.4" fill="#23261f"/><circle cx="123.9" cy="241.1" r="2.4" fill="#23261f"/></g><g><circle cx="0" cy="0" r="9" fill="none" stroke="#e8590c" stroke-width="3"/><line x1="-14" y1="0" x2="14" y2="0" stroke="#e8590c" stroke-width="2"/><animateTransform attributeName="transform" type="translate" values="360 242;243 242;133 242;-13 242" keyTimes="0;.417;.667;1" dur="6s" fill="freeze"/></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" begin="4s" dur=".4s" fill="freeze"/><text x="133" y="232" font-size="13" font-weight="bold" text-anchor="middle" fill="#e8590c">BANG</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="5s" dur="0.5s" fill="freeze"/><text x="200" y="292" font-size="14" font-weight="bold" text-anchor="middle" fill="#2f3a2b">All three: gun still moving when it fires</text></g><text x="390" y="292" font-size="1" fill="#23261f"></text>
</svg>
