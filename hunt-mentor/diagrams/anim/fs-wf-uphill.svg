<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: flames move up a forested slope much faster than they spread on flat ground, because rising hot air pre heats the fuel above. Never try to outrun a fire uphill.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fire runs uphill</text><path d="M0 280 L400 80 L400 300 L0 300 Z" fill="#dfe6d3"/><rect x="57" y="250" width="6" height="8" rx="0" fill="#8b5a2b"/><polygon points="60,218 51,250 69,250" fill="#8a9a6b"/><rect x="97" y="230" width="6" height="8" rx="0" fill="#8b5a2b"/><polygon points="100,198 91,230 109,230" fill="#8a9a6b"/><rect x="137" y="210" width="6" height="8" rx="0" fill="#8b5a2b"/><polygon points="140,178 131,210 149,210" fill="#8a9a6b"/><rect x="177" y="190" width="6" height="8" rx="0" fill="#8b5a2b"/><polygon points="180,158 171,190 189,190" fill="#8a9a6b"/><rect x="217" y="170" width="6" height="8" rx="0" fill="#8b5a2b"/><polygon points="220,138 211,170 229,170" fill="#8a9a6b"/><rect x="257" y="150" width="6" height="8" rx="0" fill="#8b5a2b"/><polygon points="260,118 251,150 269,150" fill="#8a9a6b"/><rect x="297" y="130" width="6" height="8" rx="0" fill="#8b5a2b"/><polygon points="300,98 291,130 309,130" fill="#8a9a6b"/><rect x="337" y="110" width="6" height="8" rx="0" fill="#8b5a2b"/><polygon points="340,78 331,110 349,110" fill="#8a9a6b"/><g><animateMotion path="M40 270 L340 120" dur="4s" fill="freeze"/><path d="M-14 0 Q-19 -24 0 -45 Q19 -24 14 0 Z" fill="#e8590c"/><path d="M-7 0 Q-10 -13 0 -26 Q10 -13 7 0 Z" fill="#f6c344"/></g><g><animateMotion path="M10 286 L240 170" dur="4s" begin="0.4s" fill="freeze"/><path d="M-11 0 Q-14 -18 0 -34 Q14 -18 11 0 Z" fill="#e8590c"/><path d="M-5 0 Q-7 -10 0 -19 Q7 -10 5 0 Z" fill="#f6c344"/></g><g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.100;0.900;1" begin="0.2s" dur="3.3s" fill="freeze"/><text x="120" y="90" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Hot air pre heats</text><text x="120" y="110" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">the fuel above</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="4s" dur="0.4s" fill="freeze"/><rect x="59" y="50" width="282" height="30" rx="6" fill="#c0392b"/><text x="200" y="71" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Never try to outrun it uphill</text></g>
</svg>
