<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, a Tip. Two trailheads side by side. At the place named online, trucks keep arriving until the lot is full. At a candidate spot from your own map and scouting, one truck parks and a deer is still nearby. Final label: learn from the name, hunt past the lot.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Named spot vs your own spot (Tip)</text>
