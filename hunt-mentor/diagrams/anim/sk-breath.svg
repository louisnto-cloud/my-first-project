<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: the breath meter fills as you breathe in, then drops to half as you let half out. You hold. The crosshair wobble on the deer shrinks and settles on the lungs. The pad of the finger squeezes the trigger slowly, the shot breaks, and you hold still to call the shot.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Breathe, hold, squeeze, follow through</text>
<rect x="14" y="52" width="32" height="160" rx="6" fill="#fff" stroke="#2f3a2b" stroke-width="2"/>
<rect x="16" y="210" width="28" height="0" fill="#4a7fb0"><animate attributeName="y" values="210;54;132.0;132.0" keyTimes="0;.22;.38;1" dur="9s" fill="freeze"/><animate attributeName="height" values="0;156;78.0;78.0" keyTimes="0;.22;.38;1" dur="9s" fill="freeze"/></rect>
<line x1="10" y1="132.0" x2="50" y2="132.0" stroke="#e8590c" stroke-width="2.4" stroke-dasharray="4 3"/>
<text x="30" y="234" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Breath</text>
<text x="50" y="120" font-size="14" font-weight="bold" fill="#e8590c">half</text>
<clipPath id="sk-breath-c"><circle cx="160" cy="132" r="68"/></clipPath>
<g clip-path="url(#sk-breath-c)"><rect x="92" y="64" width="136" height="136" fill="#e6ecd9"/><rect x="92" y="166" width="136" height="34" fill="#c9d3a8"/>
<g transform="translate(174 194) scale(1.45 1.45)"><path d="M-18 -32 L-19 0 M-11 -32 L-10 0" stroke="#5a3e26" stroke-width="3.4" stroke-linecap="round"/><path d="M14 -34 L19 -16 L16 0 M21 -34 L26 -16 L23 0" stroke="#5a3e26" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M-24 -44 C-24 -52 -10 -55 6 -54 C20 -54 31 -51 31 -41 C31 -33 25 -29 15 -29 L-16 -29 C-22 -29 -24 -35 -24 -44z" fill="#9a7350"/><path d="M-22 -44 L-31 -66 L-21 -70 L-11 -50z" fill="#9a7350"/><path d="M-29 -65 C-36 -68 -44 -64 -47 -59 L-45 -56 C-39 -56 -32 -57 -25 -61z" fill="#9a7350"/><path d="M-47 -59 L-45 -56" stroke="#1d1a16" stroke-width="2.6" stroke-linecap="round"/><path d="M-25 -68 C-18 -78 -12 -80 -10 -78 C-13 -72 -18 -67 -23 -65z" fill="#9a7350" stroke="#5a3e26" stroke-width=".8"/><circle cx="-34" cy="-63" r="1.3" fill="#111"/><ellipse cx="28" cy="-42" rx="4.5" ry="8" fill="#f3ead8"/><path d="M30 -48 C34 -44 34 -40 31 -37 L29 -45z" fill="#1d1a16"/></g>
<circle cx="148" cy="133" r="15" fill="#e8590c" fill-opacity=".45" stroke="#e8590c" stroke-width="2"/>
<g><path d="M160 64 V200 M92 132 H228" stroke="#2f3a2b" stroke-width="1.4"/><path d="M160 64 V110 M160 154 V200 M92 132 H138 M182 132 H228" stroke="#2f3a2b" stroke-width="4"/><animateTransform attributeName="transform" type="translate" values="-28 6;-2 -10;-24 12;0 2;-26 -8;-10 4;-16 -2;-12 2;-14 0;-12 1;-12 1" keyTimes="0;.1;.2;.3;.38;.48;.56;.62;.68;.75;1" dur="9s" fill="freeze"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" begin="7s" dur=".6s" fill="freeze"/><text x="160" y="186" font-size="24" font-weight="bold" fill="#e8590c" text-anchor="middle" stroke="#fffaf0" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">BANG</text></g>
</g>
<circle cx="160" cy="132" r="68" fill="none" stroke="#3f443d" stroke-width="6"/>
<text x="160" y="228" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wobble shrinks</text>
<text x="160" y="246" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">when you hold</text>
<text x="238" y="66" font-size="16" font-weight="bold" fill="#8a9a6b">1 Breathe in<set attributeName="fill" to="#e8590c" begin="0s" fill="freeze"/></text>
<text x="238" y="92" font-size="16" font-weight="bold" fill="#8a9a6b">2 Let half out<set attributeName="fill" to="#e8590c" begin="2s" fill="freeze"/></text>
<text x="238" y="118" font-size="16" font-weight="bold" fill="#8a9a6b">3 Hold<set attributeName="fill" to="#e8590c" begin="3.4s" fill="freeze"/></text>
<text x="238" y="144" font-size="16" font-weight="bold" fill="#8a9a6b">4 Squeeze slowly<set attributeName="fill" to="#e8590c" begin="5.4s" fill="freeze"/></text>
<text x="238" y="170" font-size="16" font-weight="bold" fill="#8a9a6b">5 Hold still,<set attributeName="fill" to="#e8590c" begin="7.4s" fill="freeze"/></text>
<text x="238" y="190" font-size="16" font-weight="bold" fill="#8a9a6b">call the shot<set attributeName="fill" to="#e8590c" begin="7.4s" fill="freeze"/></text>
<path d="M250 214 H360" stroke="#3f443d" stroke-width="7" stroke-linecap="round"/>
<path d="M270 218 C270 266 340 266 340 218" stroke="#3f443d" stroke-width="4" fill="none"/>
<path d="M304 218 C302 232 306 242 314 246" stroke="#2f3a2b" stroke-width="5" fill="none" stroke-linecap="round"/>
<g><ellipse cx="294" cy="238" rx="13" ry="8" fill="#e8c4a0" stroke="#2f3a2b" stroke-width="2"/><path d="M281 238 H252" stroke="#e8c4a0" stroke-width="14" stroke-linecap="round"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;10 0;10 0" keyTimes="0;.6;.78;1" dur="9s" fill="freeze"/></g>
<text x="306" y="282" font-size="14" fill="#2f3a2b" text-anchor="middle">Finger pad, slow press</text>
</svg>
