<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: the breath meter fills as you breathe in, then drops to half as you let half out. You hold. The crosshair wobble shrinks and settles on the lungs. The finger pad squeezes the trigger slowly, the shot breaks, and you hold still to call the shot.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="16" font-weight="bold" text-anchor="middle" fill="#23261f">Breathe, hold, squeeze, follow through</text><rect x="30" y="50" width="40" height="160" rx="6" fill="#fff" stroke="#23261f" stroke-width="2"/><rect x="32" y="208" width="36" height="0" fill="#4a7fb0"><animate attributeName="y" values="208;52;130;130" keyTimes="0;.22;.38;1" dur="9s" fill="freeze"/><animate attributeName="height" values="0;156;78;78" keyTimes="0;.22;.38;1" dur="9s" fill="freeze"/></rect><line x1="26" y1="130" x2="74" y2="130" stroke="#e8590c" stroke-width="2" stroke-dasharray="4 3"/><text x="50" y="230" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">Breath</text><text x="80" y="134" font-size="13" fill="#e8590c">half</text><circle cx="150" cy="130" r="70" fill="#fff" stroke="#23261f" stroke-width="4"/><g transform="translate(150 130)"><ellipse cx="10" cy="0" rx="54" ry="22" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="-12" cy="0" rx="15" ry="14" fill="#e8590c" fill-opacity=".35" stroke="#e8590c" stroke-width="2"/></g><g><line x1="150" y1="62" x2="150" y2="198" stroke="#23261f" stroke-width="1.5"/><line x1="82" y1="130" x2="218" y2="130" stroke="#23261f" stroke-width="1.5"/><animateTransform attributeName="transform" type="translate" values="-28 6;-2 -10;-24 12;0 2;-26 -8;-10 4;-16 -2;-12 2;-14 0;-12 1;-12 1" keyTimes="0;.1;.2;.3;.38;.48;.56;.62;.68;.75;1" dur="9s" fill="freeze"/></g><path d="M330 230 q 0 26 18 30" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round"/><g><ellipse cx="318" cy="240" rx="12" ry="8" fill="#e8c4a0" stroke="#23261f" stroke-width="2"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;10 0;10 0" keyTimes="0;.6;.78;1" dur="9s" fill="freeze"/></g><text x="260" y="244" font-size="13" text-anchor="end" fill="#23261f">Finger</text><text x="260" y="260" font-size="13" text-anchor="end" fill="#23261f">pad</text><text x="150" y="240" font-size="14" text-anchor="middle" fill="#2f3a2b">Wobble shrinks</text><text x="150" y="258" font-size="14" text-anchor="middle" fill="#2f3a2b">when you hold</text><g opacity="0"><animate attributeName="opacity" values="0;1;0" begin="7s" dur=".6s" fill="freeze"/><text x="150" y="180" font-size="24" font-weight="bold" text-anchor="middle" fill="#e8590c">BANG</text></g><text x="236" y="72" font-size="15" font-weight="bold" fill="#8a9a6b">1 Breathe in<set attributeName="fill" to="#e8590c" begin="0s" fill="freeze"/></text><text x="236" y="100" font-size="15" font-weight="bold" fill="#8a9a6b">2 Let half out<set attributeName="fill" to="#e8590c" begin="2s" fill="freeze"/></text><text x="236" y="128" font-size="15" font-weight="bold" fill="#8a9a6b">3 Hold<set attributeName="fill" to="#e8590c" begin="3.4s" fill="freeze"/></text><text x="236" y="156" font-size="15" font-weight="bold" fill="#8a9a6b">4 Squeeze slowly<set attributeName="fill" to="#e8590c" begin="5.4s" fill="freeze"/></text><text x="236" y="184" font-size="15" font-weight="bold" fill="#8a9a6b">5 Hold still,<set attributeName="fill" to="#e8590c" begin="7.4s" fill="freeze"/></text><text x="236" y="204" font-size="15" font-weight="bold" fill="#8a9a6b">call the shot<set attributeName="fill" to="#e8590c" begin="7.4s" fill="freeze"/></text>
</svg>
