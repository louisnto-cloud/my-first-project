<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 384" font-family="sans-serif" role="img" aria-label="Animation on a made up drill area map: a timbered ridge, a grass bench, a draw with a creek, a private block, a road with a rec site. A hunter walks the six stops: 1 parks by the road, 2 walks in, 3 climbs to the glassing point by the draw, 4 reads sign on the bench, 5 sits a seat below the timber, and 6 walks back out. Final label: out, then the Journal.">
