<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: a hunter walks the six stops of the made up drill area: parks by the road, walks in, climbs to the glassing point by the draw, reads sign on the bench, sits a seat below the timber, and walks back out. Final label: out, then the Journal.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The drill walk</text>
<rect x="0" y="40" width="400" height="260" fill="#dfe6d3"/>
<path d="M0 40 L400 40 L400 90 Q 300 110 200 95 Q 100 80 0 100 Z" fill="#3d5a3a"/>
<text x="200" y="62" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Ridge with timber (made up)</text>
<path d="M60 150 Q 200 130 330 155 L330 175 Q 200 155 60 172 Z" fill="#cdd8b8"/>
<text x="110" y="166" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2f3a2b" text-anchor="middle">grass bench</text>
<path d="M340 95 Q 330 170 360 300" stroke="#4a7fb0" stroke-width="5" fill="none"/>
<text x="370" y="220" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4a7fb0" text-anchor="middle">draw</text>
<rect x="0" y="180" width="70" height="80" fill="#c0392b" opacity=".45"/><text x="35" y="225" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">private</text>
<rect x="0" y="272" width="400" height="10" fill="#23261f"/>
<circle cx="150" cy="255" r="26" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="4 3"/><text x="150" y="259" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e8590c" text-anchor="middle">rec site</text>
<g><polygon points="102.3,125 110,103 117.7,125" fill="#3d5a3a"/><rect x="108" y="125" width="4" height="4.4" fill="#6b4f35"/></g>
<g><polygon points="242.3,120 250,98 257.7,120" fill="#3d5a3a"/><rect x="248" y="120" width="4" height="4.4" fill="#6b4f35"/></g>
<g><polygon points="282.3,128 290,106 297.7,128" fill="#3d5a3a"/><rect x="288" y="128" width="4" height="4.4" fill="#6b4f35"/></g>
<path id="rq-dr-path" d="M230 268 L260 230 L300 200 L230 185 L180 140 L300 235" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4 4"/>
<circle cx="230" cy="268" r="9" fill="#e8590c" opacity=".7"/>
<circle cx="260" cy="230" r="9" fill="#e8590c" opacity=".7"/>
<circle cx="300" cy="200" r="9" fill="#e8590c" opacity=".7"/>
<circle cx="230" cy="185" r="9" fill="#e8590c" opacity=".7"/>
<circle cx="180" cy="140" r="9" fill="#e8590c" opacity=".7"/>
<circle cx="300" cy="235" r="9" fill="#e8590c" opacity=".7"/>
<g><g transform="translate(0 -8) scale(0.8)"><circle cy="-14" r="6" fill="#e8590c"/><rect x="-6" y="-8" width="12" height="16" rx="3" fill="#e8590c"/><rect x="-5" y="8" width="4" height="10" fill="#2f3a2b"/><rect x="1" y="8" width="4" height="10" fill="#2f3a2b"/></g><animateMotion dur="9s" fill="freeze" calcMode="linear"><mpath href="#rq-dr-path"/></animateMotion></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="8.5s" dur="0.5s" fill="freeze"/><rect x="110" y="196" width="180" height="30" rx="8" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="216" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Out, then the Journal</text></g>
</svg>
