<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, looping like breathing: inside the chest the lungs swell and shrink while the diaphragm, a curved muscle wall at the back of the chest, moves back and forward. The heart beats low in front. Breathing in, the diaphragm pulls back and the lungs fill. A hole in the chest lets the lungs collapse; lung blood is bright red and bubbly.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">How it breathes</text><rect x="60" y="50" width="280" height="170" rx="30" fill="#ead9c0" stroke="#23261f" stroke-width="2.5"/><text x="70" y="74" font-size="14" fill="#6b4f35" text-anchor="start">chest</text><ellipse cx="160" cy="135" rx="70" ry="55" fill="#f2b8b0" stroke="#23261f" stroke-width="1.5"><animate attributeName="rx" values="62;78;62" dur="3s" repeatCount="indefinite"/><animate attributeName="ry" values="48;60;48" dur="3s" repeatCount="indefinite"/></ellipse><ellipse cx="190" cy="165" rx="14" ry="17" fill="#b3261e"><animate attributeName="ry" values="17;15;17" dur="0.8s" repeatCount="indefinite"/></ellipse><path d="M250 60 Q 280 135 250 210" fill="none" stroke="#e8590c" stroke-width="5"><animateTransform attributeName="transform" type="translate" values="0 0;22 0;0 0" dur="3s" repeatCount="indefinite"/></path><text x="300" y="44" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">diaphragm</text><text x="160" y="140" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">lungs</text><text x="190" y="202" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">heart</text><text x="200" y="244" font-size="14" fill="#23261f" text-anchor="middle">Breathe in: diaphragm pulls back, lungs fill</text><text x="200" y="264" font-size="14" fill="#23261f" text-anchor="middle">Hole in the chest: lungs collapse (70%)</text><text x="200" y="284" font-size="14" fill="#6b4f35" text-anchor="middle">Lung blood: bright red, bubbly (70%)</text>
</svg>
