<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: blue wind dots stream fast over a ridge top. On the far, lee side, orange dots circle in an eddy just above the slope; near the ground the eddy blows back uphill toward the crest.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#e7f0f7" stroke="none" stroke-width="2"/><text x="14" y="26" font-family="sans-serif" font-size="18" fill="#2f3a2b" text-anchor="start" font-weight="bold">Wind over a ridge: eddy behind it</text><path d="M0 270 L180 110 L220 110 L400 270 Z" fill="#c9d3b8" stroke="#8b5a2b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path id="fn-wd-lee-p1" d="M8 149 C 100 140, 150 80, 200 80 C 260 80, 320 120, 392 129" fill="none" stroke="#4a7fb0" stroke-width="2" stroke-dasharray="6 6"/><path id="fn-wd-lee-p2" d="M240 116 C 290 100, 345 128, 335 160 C 326 186, 296 186, 288 160 C 282 142, 296 130, 312 136" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 5"/><circle r="5" fill="#4a7fb0"><animateMotion dur="3s" begin="0s" repeatCount="indefinite"><mpath href="#fn-wd-lee-p1"/></animateMotion></circle><circle r="5" fill="#e8590c"><animateMotion dur="3s" begin="0s" repeatCount="indefinite"><mpath href="#fn-wd-lee-p2"/></animateMotion></circle><circle r="5" fill="#4a7fb0"><animateMotion dur="3s" begin="1s" repeatCount="indefinite"><mpath href="#fn-wd-lee-p1"/></animateMotion></circle><circle r="5" fill="#e8590c"><animateMotion dur="3s" begin="1s" repeatCount="indefinite"><mpath href="#fn-wd-lee-p2"/></animateMotion></circle><circle r="5" fill="#4a7fb0"><animateMotion dur="3s" begin="2s" repeatCount="indefinite"><mpath href="#fn-wd-lee-p1"/></animateMotion></circle><circle r="5" fill="#e8590c"><animateMotion dur="3s" begin="2s" repeatCount="indefinite"><mpath href="#fn-wd-lee-p2"/></animateMotion></circle><text x="14" y="58" font-family="sans-serif" font-size="16" fill="#2c5d86" text-anchor="start" font-weight="bold">Fast over the top</text><line x1="330" y1="142" x2="352" y2="86" stroke="#c2410c" stroke-width="1.6"/><circle cx="330" cy="142" r="2.6" fill="#c2410c"/><text x="392" y="58" font-family="sans-serif" font-size="16" fill="#c2410c" text-anchor="end" font-weight="bold">Lee side: swirls,</text><text x="392" y="78" font-family="sans-serif" font-size="16" fill="#c2410c" text-anchor="end" font-weight="bold">can blow uphill</text><line x1="60" y1="180" x2="113.6" y2="144.3" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><polygon points="120.0,140.0 107.5,141.1 114.2,151.1" fill="#4a7fb0"/>
</svg>
