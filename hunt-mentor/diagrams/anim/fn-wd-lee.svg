<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: blue wind dots stream fast over a ridge top. On the far, lee side, orange dots circle in an eddy that can blow back uphill toward the crest.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#e7f0f7" stroke="none" stroke-width="2"/><text x="14" y="26" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Wind over a ridge: eddy behind it</text><path d="M0 270 L180 110 L220 110 L400 270 Z" fill="#c9d3b8" stroke="#8b5a2b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path id="fn-wd-lee-p1" d="M0 150 C 100 140, 150 80, 200 80 C 260 80, 320 120, 400 130" fill="none" stroke="#4a7fb0" stroke-width="2" stroke-dasharray="6 6"/><path id="fn-wd-lee-p2" d="M230 130 C 290 120, 320 170, 290 200 C 260 225, 230 180, 250 150" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 5"/><circle r="5" fill="#4a7fb0"><animateMotion dur="3s" begin="0s" repeatCount="indefinite"><mpath href="#fn-wd-lee-p1"/></animateMotion></circle><circle r="5" fill="#e8590c"><animateMotion dur="3s" begin="0s" repeatCount="indefinite"><mpath href="#fn-wd-lee-p2"/></animateMotion></circle><circle r="5" fill="#4a7fb0"><animateMotion dur="3s" begin="1s" repeatCount="indefinite"><mpath href="#fn-wd-lee-p1"/></animateMotion></circle><circle r="5" fill="#e8590c"><animateMotion dur="3s" begin="1s" repeatCount="indefinite"><mpath href="#fn-wd-lee-p2"/></animateMotion></circle><circle r="5" fill="#4a7fb0"><animateMotion dur="3s" begin="2s" repeatCount="indefinite"><mpath href="#fn-wd-lee-p1"/></animateMotion></circle><circle r="5" fill="#e8590c"><animateMotion dur="3s" begin="2s" repeatCount="indefinite"><mpath href="#fn-wd-lee-p2"/></animateMotion></circle><text x="14" y="60" font-family="sans-serif" font-size="14" fill="#4a7fb0" text-anchor="start" font-weight="bold">Fast over the top</text><text x="250" y="250" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">Lee side: swirls,</text><text x="250" y="268" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">can blow uphill</text><line x1="60" y1="180" x2="113.6" y2="144.3" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><polygon points="120.0,140.0 107.5,141.1 114.2,151.1" fill="#4a7fb0"/>
</svg>
