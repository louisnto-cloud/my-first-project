<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: a hunter climbs a steep rocky slope from below. Three chukar run up the slope ahead of him, out of range. Then a second hunter appears at the top, labelled better, start above. Final label: approach chukar from above.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Chukar run uphill. So start above.</text>
<path d="M0 300 L0 260 L400 70 L400 300 Z" fill="#d8c9a6" stroke="#6b4f35" stroke-width="2"/>
<g><g transform="translate(0 0) scale(0.9)"><circle cy="-14" r="6" fill="#4a7fb0"/><rect x="-6" y="-8" width="12" height="16" rx="3" fill="#4a7fb0"/><rect x="-5" y="8" width="4" height="10" fill="#2f3a2b"/><rect x="1" y="8" width="4" height="10" fill="#2f3a2b"/></g><animateTransform attributeName="transform" type="translate" values="40 255;120 218" dur="3s" fill="freeze"/></g>



<g><g transform="translate(0 0) scale(0.55)"><ellipse rx="13" ry="10" fill="#a08c6e"/><circle cx="11" cy="-9" r="6" fill="#a08c6e"/><path d="M16 -9 l5 1 l-5 2 Z" fill="#23261f"/><path d="M-12 -2 l-8 -4 l2 8 Z" fill="#a08c6e"/><rect x="-3" y="9" width="2" height="6" fill="#23261f"/><rect x="3" y="9" width="2" height="6" fill="#23261f"/></g><animateTransform attributeName="transform" type="translate" values="200 170;200 170;320 113;320 113" keyTimes="0;0.3;0.6;1" dur="8s" fill="freeze"/></g>
<g><g transform="translate(0 0) scale(0.55)"><ellipse rx="13" ry="10" fill="#a08c6e"/><circle cx="11" cy="-9" r="6" fill="#a08c6e"/><path d="M16 -9 l5 1 l-5 2 Z" fill="#23261f"/><path d="M-12 -2 l-8 -4 l2 8 Z" fill="#a08c6e"/><rect x="-3" y="9" width="2" height="6" fill="#23261f"/><rect x="3" y="9" width="2" height="6" fill="#23261f"/></g><animateTransform attributeName="transform" type="translate" values="220 161;220 161;335 106;335 106" keyTimes="0;0.3;0.6;1" dur="8s" fill="freeze"/></g>
<g><g transform="translate(0 0) scale(0.55)"><ellipse rx="13" ry="10" fill="#a08c6e"/><circle cx="11" cy="-9" r="6" fill="#a08c6e"/><path d="M16 -9 l5 1 l-5 2 Z" fill="#23261f"/><path d="M-12 -2 l-8 -4 l2 8 Z" fill="#a08c6e"/><rect x="-3" y="9" width="2" height="6" fill="#23261f"/><rect x="3" y="9" width="2" height="6" fill="#23261f"/></g><animateTransform attributeName="transform" type="translate" values="240 152;240 152;350 99;350 99" keyTimes="0;0.3;0.6;1" dur="8s" fill="freeze"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.4s" dur="0.4s" fill="freeze"/><text x="130" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="start">From below: they run up</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="5.2s" dur="0.4s" fill="freeze"/><g transform="translate(370 70) scale(0.9)"><circle cy="-14" r="6" fill="#e8590c"/><rect x="-6" y="-8" width="12" height="16" rx="3" fill="#e8590c"/><rect x="-5" y="8" width="4" height="10" fill="#2f3a2b"/><rect x="1" y="8" width="4" height="10" fill="#2f3a2b"/></g><text x="392" y="102" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="end">Better: start above</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="6.8s" dur="0.5s" fill="freeze"/><rect x="20" y="50" width="230" height="36" rx="8" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="2"/><text x="135" y="74" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Approach from above (70%)</text></g>
</svg>
