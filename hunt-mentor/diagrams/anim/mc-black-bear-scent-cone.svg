<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 342" font-family="sans-serif" role="img" aria-label="Animation: a black bear feeds, head down, in a berry patch on the slope above you. At first the wind blows from the bear toward you, so your scent cone trails behind you, downhill, away from the bear: good. Then the wind swings around and your scent cone swings and stretches up toward the bear. The bear lifts its head: it smells you. Your scent rides the wind; check the wind before every move.">
