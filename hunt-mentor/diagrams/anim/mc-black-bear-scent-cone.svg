<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a black bear feeds in a berry patch above you. At first the wind blows from the bear toward you, so your scent cone trails behind you, away from the bear. Then the wind swings around and your scent cone swings toward the bear. The bear lifts its head: it smells you. Check the wind before every move.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#dfe6d3" opacity=".6"/><text x="200" y="24" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Your scent rides the wind</text><g transform="translate(120 92) scale(1.2)"><ellipse cx="0" cy="0" rx="26" ry="16" fill="#8a9a6b"/><circle cx="-12" cy="-4" r="2.6" fill="#e8590c"/><circle cx="-2" cy="-9" r="2.6" fill="#e8590c"/><circle cx="8" cy="-2" r="2.6" fill="#e8590c"/><circle cx="14" cy="-8" r="2.6" fill="#e8590c"/><circle cx="-16" cy="4" r="2.6" fill="#e8590c"/><circle cx="4" cy="5" r="2.6" fill="#e8590c"/></g><g transform="translate(250 84) scale(1.1)"><ellipse cx="0" cy="0" rx="26" ry="16" fill="#8a9a6b"/><circle cx="-12" cy="-4" r="2.6" fill="#e8590c"/><circle cx="-2" cy="-9" r="2.6" fill="#e8590c"/><circle cx="8" cy="-2" r="2.6" fill="#e8590c"/><circle cx="14" cy="-8" r="2.6" fill="#e8590c"/><circle cx="-16" cy="4" r="2.6" fill="#e8590c"/><circle cx="4" cy="5" r="2.6" fill="#e8590c"/></g><g transform="translate(320 110) scale(1)"><ellipse cx="0" cy="0" rx="26" ry="16" fill="#8a9a6b"/><circle cx="-12" cy="-4" r="2.6" fill="#e8590c"/><circle cx="-2" cy="-9" r="2.6" fill="#e8590c"/><circle cx="8" cy="-2" r="2.6" fill="#e8590c"/><circle cx="14" cy="-8" r="2.6" fill="#e8590c"/><circle cx="-16" cy="4" r="2.6" fill="#e8590c"/><circle cx="4" cy="5" r="2.6" fill="#e8590c"/></g><g transform="translate(200 100)"><g><g transform="translate(0 0) scale(0.7 0.7)"><rect x="-38" y="8" width="11" height="28" rx="5.5" fill="#1d1d1b"/><rect x="-26" y="8" width="11" height="28" rx="5.5" fill="#1d1d1b"/><rect x="24" y="8" width="11" height="28" rx="5.5" fill="#1d1d1b"/><rect x="34" y="8" width="11" height="28" rx="5.5" fill="#1d1d1b"/><path d="M-46 6 Q-52 -28 -24 -30 Q0 -26 26 -22 Q46 -18 46 4 Q30 24 -30 22 Q-46 20 -46 6 Z" fill="#1d1d1b"/><path d="M40 -20 L62 -16 L78 -8 Q82 -2 76 0 L56 4 Q44 2 40 -20 Z" fill="#1d1d1b"/><path d="M48 -18 L50 -32 L56 -18 Z" fill="#1d1d1b"/><path d="M66 -10 L78 -8 Q82 -2 76 0 L64 -2 Z" fill="#8b6a4a"/><circle cx="60" cy="-12" r="1.8" fill="#eee"/></g><animateTransform attributeName="transform" type="rotate" values="0;0;-10" keyTimes="0;0.9;1" begin="0s" dur="6s" fill="freeze"/></g></g><g transform="translate(200 250)"><g><path d="M0 0 L-50 70 L50 70 Z" fill="#e8590c" opacity=".22"/><animateTransform attributeName="transform" type="rotate" values="0;0;180" keyTimes="0;0.55;0.8" dur="7s" fill="freeze"/></g><circle cx="0" cy="0" r="9" fill="#e8590c"/><text x="16" y="6" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">You</text></g><g stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"><g><path d="M40 60 v40 m-6 -10 l6 10 l6 -10 M360 60 v40 m-6 -10 l6 10 l6 -10" fill="none"/><animateTransform attributeName="transform" type="rotate" values="0 200 150;0 200 150;180 200 150" keyTimes="0;0.55;0.8" dur="7s" fill="freeze"/></g></g><g><text x="20" y="150" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="start">Wind: bear to you. Good.</text><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.5;0.6" dur="7s" fill="freeze"/></g><g opacity="0"><rect x="10" y="140" width="250" height="34" rx="8" fill="#e8590c"/><text x="20" y="163" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">Wind swung. Bear smells you.</text><animate attributeName="opacity" values="0;1" begin="6s" dur="0.5s" fill="freeze"/></g>
</svg>
