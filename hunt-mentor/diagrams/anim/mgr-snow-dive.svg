<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation. A grouse flies down and dives into soft snow, leaving an entry hole. It tunnels a short way and spends the night under the snow. In the morning it bursts out, leaving a second hole with wing marks on both sides, then flies off. A hole plus wing marks means the bird has left." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Snow roost: dive in, burst out</text>
<rect x="0" y="180" width="400" height="120" fill="#ffffff"/><line x1="0" y1="180" x2="400" y2="180" stroke="#b9c6d3" stroke-width="2"/>
<path id="mgr-snow-dive-p" d="M40 60 Q100 120 120 185" fill="none"/>
<g><g transform="translate(0 0) scale(0.6 0.6)"><polygon points="-20,-6 -38,-20 -48,-12 -52,0 -48,8 -20,8" fill="#6b4f35"/><path d="M-40 -18 Q-50 -10 -48 6" fill="none" stroke="#23261f" stroke-width="3"/><ellipse cx="0" cy="0" rx="26" ry="15" fill="#9a6b45"/><circle cx="21" cy="-14" r="8" fill="#9a6b45"/><polygon points="16,-20 20,-28 25,-20" fill="#9a6b45"/><polygon points="28,-16 35,-13 28,-10" fill="#6b4f35"/><circle cx="23" cy="-16" r="1.8" fill="#23261f"/><path d="M2 13 l-2 11 M10 13 l2 11" stroke="#6b4f35" stroke-width="2.5" fill="none"/></g><animateMotion dur="2s" fill="freeze"><mpath href="#mgr-snow-dive-p"/></animateMotion><set attributeName="opacity" to="0" begin="2s" fill="freeze"/></g>
<path d="M120 190 Q170 215 230 210" fill="none" stroke="#b9c6d3" stroke-width="10" stroke-dasharray="300" stroke-dashoffset="300"><animate attributeName="stroke-dashoffset" from="300" to="0" begin="2s" dur="1.5s" fill="freeze"/></path>
<circle cx="120" cy="182" r="10" fill="#b9c6d3" stroke="none" stroke-width="0"/>
<g opacity="0"><set attributeName="opacity" to="1" begin="3.5s" fill="freeze"/><text x="230" y="250" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Night under the snow</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="5s" fill="freeze"/><ellipse cx="240" cy="182" rx="12" ry="7" fill="#b9c6d3"/><path d="M200 180 q-20.0 -8 -40 -2" fill="none" stroke="#9fb0c2" stroke-width="3"/><path d="M212 180 q-14.0 -8 -28 -2" fill="none" stroke="#9fb0c2" stroke-width="3"/><path d="M268 180 q14.0 -8 28 -2" fill="none" stroke="#9fb0c2" stroke-width="3"/><path d="M280 180 q20.0 -8 40 -2" fill="none" stroke="#9fb0c2" stroke-width="3"/></g>
<path id="mgr-snow-dive-q" d="M240 180 Q300 120 380 70" fill="none"/>
<g opacity="0"><set attributeName="opacity" to="1" begin="5s"/><g transform="translate(0 0) scale(0.6 0.6)"><polygon points="-20,-6 -38,-20 -48,-12 -52,0 -48,8 -20,8" fill="#6b4f35"/><path d="M-40 -18 Q-50 -10 -48 6" fill="none" stroke="#23261f" stroke-width="3"/><ellipse cx="0" cy="0" rx="26" ry="15" fill="#9a6b45"/><circle cx="21" cy="-14" r="8" fill="#9a6b45"/><polygon points="16,-20 20,-28 25,-20" fill="#9a6b45"/><polygon points="28,-16 35,-13 28,-10" fill="#6b4f35"/><circle cx="23" cy="-16" r="1.8" fill="#23261f"/><path d="M2 13 l-2 11 M10 13 l2 11" stroke="#6b4f35" stroke-width="2.5" fill="none"/></g><animateMotion dur="1.5s" begin="5s" fill="freeze"><mpath href="#mgr-snow-dive-q"/></animateMotion></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="6.5s" fill="freeze"/><rect x="10" y="44" width="260" height="30" rx="8" fill="#2f3a2b" stroke="none" stroke-width="0"/><text x="140" y="65" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Hole plus wing marks = left</text></g>
</svg>
