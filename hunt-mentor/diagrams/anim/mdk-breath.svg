<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation of a bird breathing. A blue dot of fresh air comes down the windpipe. Step 1, breathe in: the fresh air goes past the lung into the rear air sacs. Step 2, breathe out: the rear sacs push it forward through the lung, where oxygen is taken up and the dot turns grey. Step 3, breathe in: the used air moves into the front sacs. Step 4, breathe out: it leaves by the windpipe. End card: fresh air crosses the lung on the in breath and the out breath, one way flow, 80 percent."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="22" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Two breaths move one gulp of air (80%)</text><rect x="150" y="120" width="100" height="60" rx="10" fill="#e7a3a3" stroke="#b5473a" stroke-width="3"/><text x="200" y="156" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Lung</text><rect x="20" y="110" width="100" height="80" rx="30" fill="#bcd8f0" stroke="#4a7fb0" stroke-width="3"/><text x="70" y="156" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Rear sacs</text><rect x="280" y="110" width="100" height="80" rx="30" fill="#bcd8f0" stroke="#4a7fb0" stroke-width="3"/><text x="330" y="156" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Front sacs</text><rect x="300" y="40" width="24" height="70" rx="6" fill="#e9e2d0" stroke="#2f3a2b" stroke-width="2"/><text x="294" y="60" font-size="14" fill="#2f3a2b" text-anchor="end" font-weight="bold">Windpipe</text><g opacity="0"><set attributeName="opacity" to="1" begin="0s"/><set attributeName="opacity" to="0" begin="2.5s"/><rect x="10" y="214" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="237" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">1. Breathe in: fresh air to rear sacs</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="2.5s"/><set attributeName="opacity" to="0" begin="5.0s"/><rect x="10" y="214" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="237" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">2. Breathe out: rear sacs push it through the lung</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="5s"/><set attributeName="opacity" to="0" begin="7.5s"/><rect x="10" y="214" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="237" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">3. Breathe in: used air to front sacs</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="7.5s"/><rect x="10" y="214" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="237" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">4. Breathe out: it leaves</text></g><path id="mdk-breath-p" d="M312 44 L312 100 L150 100 L70 120 L70 150 L120 150 L200 150 L280 150 L330 150 L330 110 L312 100 L312 40" fill="none" stroke="#4a7fb0" stroke-width="2" stroke-dasharray="4 6" opacity=".6"/><circle r="11" fill="#4a7fb0" stroke="#ffffff" stroke-width="2"><animateMotion dur="10s" fill="freeze" keyPoints="0;0.32;0.32;0.62;0.62;0.82;0.82;1" keyTimes="0;0.22;0.25;0.47;0.5;0.72;0.75;1" calcMode="linear" path="M312 44 L312 100 L150 100 L70 120 L70 150 L120 150 L200 150 L280 150 L330 150 L330 110 L312 100 L312 40"/><animate attributeName="fill" values="#4a7fb0;#4a7fb0;#8c939b;#8c939b" keyTimes="0;0.4;0.5;1" dur="10s" fill="freeze"/></circle><g opacity="0"><animate attributeName="opacity" values="0;1" begin="10.2s" dur="0.5s" fill="freeze"/><rect x="10" y="258" width="380" height="34" rx="8" fill="#e8590c"/><text x="200" y="281" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Fresh air crosses the lung on in AND out breaths</text></g></svg>
