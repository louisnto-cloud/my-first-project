<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 304" font-family="sans-serif" role="img" aria-label="Animation, side view of a ridge running east to west, looking west, south on the left. The sun climbs a low arc in the southern sky to 30 degrees above the horizon at noon in mid October. Its rays strike the south face almost head on and warm it. The steeper north face stays in shadow with no direct sun. Caption: south is the stove, north is the fridge.">
