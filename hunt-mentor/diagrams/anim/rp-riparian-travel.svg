<ellipse cx="24" cy="-42" rx="6" ry="3.5" fill="#8b5a2b"/><path d="M19 -45 l-3 -6 M22 -45 l2 -6" stroke="#8b5a2b" stroke-width="2"/><path d="M-10 -16 v16 M-5 -16 v16 M8 -16 v16 M12 -16 v16" stroke="#8b5a2b" stroke-width="2.5"/><path d="M-16 -24 l-3 4" stroke="#fffaf0" stroke-width="2"/></g><animateMotion dur="7s" fill="freeze"><mpath href="#rp-rt-path"/></animateMotion></g><text x="200" y="230" font-size="14" fill="#6b4f35" text-anchor="middle">open ground: deer avoid it</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Tip: sit where the strip meets the field</text>
