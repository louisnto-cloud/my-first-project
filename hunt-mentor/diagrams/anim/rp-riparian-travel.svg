<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, map view. A deer leaves its bed in timber at the top right and walks down along a creek lined with trees and shrubs, staying inside the strip of cover, then steps out into a hay field at the bottom left. It avoids the open dry ground beside the creek. Tip: sit where the strip meets the field.">
