<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation over 10 seconds. A hill under the sun: orange arrows show air and scent climbing both slopes, sun on the slope, air climbs. Then the sun is replaced by the moon and blue arrows show air sliding down both slopes into the valleys, shade and night, air slides down. It ends on the evening state.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Thermals: up by day, down at night</text><rect x="0" y="40" width="400" height="260" fill="#eef2f7"/><path d="M0 270 L140 120 L200 90 L260 120 L400 270 Z" fill="#dfe6d3" stroke="#23261f" stroke-width="2"/><circle cx="60" cy="70" r="16" fill="#f2c14e"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="10s" fill="freeze"/></circle><circle cx="340" cy="70" r="14" fill="#9fb0c0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.5;1" dur="10s" fill="freeze"/></circle><g opacity="1"><line x1="70" y1="250" x2="110" y2="206" stroke="#e8590c" stroke-width="3"/><polygon points="110.0,206.0 107.2,215.6 100.7,209.7" fill="#e8590c"/><line x1="330" y1="250" x2="290" y2="206" stroke="#e8590c" stroke-width="3"/><polygon points="290.0,206.0 299.3,209.7 292.8,215.6" fill="#e8590c"/><line x1="110" y1="200" x2="144" y2="160" stroke="#e8590c" stroke-width="3"/><polygon points="144.0,160.0 141.5,169.7 134.9,164.0" fill="#e8590c"/><line x1="290" y1="200" x2="256" y2="160" stroke="#e8590c" stroke-width="3"/><polygon points="256.0,160.0 265.1,164.0 258.5,169.7" fill="#e8590c"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="10s" fill="freeze"/></g><g opacity="0"><line x1="110" y1="156" x2="70" y2="200" stroke="#4a7fb0" stroke-width="3"/><polygon points="70.0,200.0 72.8,190.4 79.3,196.3" fill="#4a7fb0"/><line x1="290" y1="156" x2="330" y2="200" stroke="#4a7fb0" stroke-width="3"/><polygon points="330.0,200.0 320.7,196.3 327.2,190.4" fill="#4a7fb0"/><line x1="150" y1="116" x2="114" y2="156" stroke="#4a7fb0" stroke-width="3"/><polygon points="114.0,156.0 116.8,146.4 123.3,152.2" fill="#4a7fb0"/><line x1="250" y1="116" x2="286" y2="156" stroke="#4a7fb0" stroke-width="3"/><polygon points="286.0,156.0 276.7,152.2 283.2,146.4" fill="#4a7fb0"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.5;1" dur="10s" fill="freeze"/></g><g opacity="1"><text x="200" y="290" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Sun on the slope: air climbs (75%)</text><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="10s" fill="freeze"/></g><g opacity="0"><text x="200" y="290" font-size="15" fill="#4a7fb0" text-anchor="middle" font-weight="bold">Shade and night: air slides down (75%)</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.5;1" dur="10s" fill="freeze"/></g>
</svg>
