<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation from above, the hunter at the bottom and the bullet line running straight up through the lungs. The deer turns through four angles. Facing away: never, guts and hams are in the way. Quartering toward: wait, the near shoulder bone is in the way. Quartering away: good, the bullet enters behind the ribs and exits the far shoulder. Broadside: best, through both lungs.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="14" text-anchor="middle" fill="#2f3a2b">Seen from above. You are at the bottom.</text><line x1="200" y1="262" x2="200" y2="60" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="7 5"/><g transform="translate(200 140)"><g><g stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"><path d="M-25 -8 L-46 -6 L-46 6 L-25 8 Z" fill="#8a9a6b"/><ellipse cx="35" cy="0" rx="62" ry="24" fill="#8a9a6b"/><ellipse cx="-54" cy="0" rx="13" ry="8" fill="#8a9a6b"/><path d="M-50 -7 L-44 -15 L-42 -6 Z M-50 7 L-44 15 L-42 6 Z" fill="#8a9a6b"/></g><ellipse cx="0" cy="0" rx="17" ry="17" fill="#e8590c" fill-opacity=".4" stroke="#e8590c" stroke-width="2"/><ellipse cx="-12" cy="-20" rx="9" ry="4" fill="#6b4f35"/><ellipse cx="-12" cy="20" rx="9" ry="4" fill="#6b4f35"/><ellipse cx="50" cy="0" rx="22" ry="15" fill="#b8a77a" stroke="#23261f" stroke-width="1.5"/><animateTransform attributeName="transform" type="rotate" values="90;90;-40;-40;40;40;0;0" keyTimes="0;.2;.26;.46;.52;.72;.78;1" dur="10s" fill="freeze"/></g></g><circle cx="200" cy="272" r="10" fill="#e8590c"/><text x="222" y="278" font-size="14" font-weight="bold" fill="#e8590c">You</text><circle cx="200" cy="140" r="3" fill="#23261f"/><g opacity="0"><animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.001;0.229;0.230" dur="10s" fill="freeze" calcMode="discrete"/><text x="200" y="48" font-size="18" font-weight="bold" text-anchor="middle" fill="#b3261e">Facing away: NEVER</text><text x="200" y="296" font-size="14" text-anchor="middle" fill="#2f3a2b">Guts and hams in the way</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.231;0.489;0.490" dur="10s" fill="freeze" calcMode="discrete"/><text x="200" y="48" font-size="18" font-weight="bold" text-anchor="middle" fill="#b3261e">Quartering toward: WAIT</text><text x="200" y="296" font-size="14" text-anchor="middle" fill="#2f3a2b">Shoulder bone in the way</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.491;0.749;0.750" dur="10s" fill="freeze" calcMode="discrete"/><text x="200" y="48" font-size="18" font-weight="bold" text-anchor="middle" fill="#2e7d32">Quartering away: GOOD</text><text x="200" y="296" font-size="14" text-anchor="middle" fill="#2f3a2b">Aim to exit the far shoulder</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.751;0.999;1" dur="10s" fill="freeze" calcMode="discrete"/><text x="200" y="48" font-size="18" font-weight="bold" text-anchor="middle" fill="#2e7d32">Broadside: BEST</text><text x="200" y="296" font-size="14" text-anchor="middle" fill="#2f3a2b">Both lungs, biggest target</text></g><text x="20" y="120" font-size="14" font-weight="bold" fill="#e8590c">Lungs</text><text x="20" y="138" font-size="13" fill="#e8590c">(orange)</text><text x="380" y="120" font-size="13" font-weight="bold" text-anchor="end" fill="#6b4f35">Shoulders</text><text x="380" y="138" font-size="13" text-anchor="end" fill="#6b4f35">(brown)</text>
</svg>
