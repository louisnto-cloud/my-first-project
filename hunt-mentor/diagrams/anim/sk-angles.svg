<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation seen from above, the hunter at the bottom and the bullet line running straight up through the lungs. The deer turns through four angles. Facing away: never, guts and hams are in the way. Quartering toward: wait, the near shoulder bone is in the way. Quartering away: good, aim so the bullet exits the far shoulder. Broadside: best, through both lungs, the biggest target. Lungs are orange, shoulder bones brown.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="16" fill="#6b5b4b" text-anchor="middle">Seen from above</text>
<line x1="200" y1="258" x2="200" y2="62" stroke="#e8590c" stroke-width="2.6" stroke-dasharray="8 5"/>
<g transform="translate(200 142) scale(1.15)"><g><path d="M-46 -4 C-46 -16 -40 -24 -34 -22 C-34 -14 -38 -8 -42 -4z" fill="#a47c55" stroke="#5a3e26" stroke-width="2" stroke-linejoin="round"/><path d="M-46 4 C-46 16 -40 24 -34 22 C-34 14 -38 8 -42 4z" fill="#a47c55" stroke="#5a3e26" stroke-width="2" stroke-linejoin="round"/><path d="M86 -5 C94 -5 99 -3 99 0 C99 3 94 5 86 5z" fill="#2b2118"/><path d="M-64 0 C-64 -5 -58 -8 -50 -9 C-44 -9 -40 -8 -36 -8 L-24 -12 C-14 -24 6 -25 24 -21 C38 -18 46 -19 58 -22 C76 -24 90 -14 90 0 C90 14 76 24 58 22 C46 19 38 18 24 21 C6 25 -14 24 -24 12 L-36 8 C-40 8 -44 9 -50 9 C-58 8 -64 5 -64 0z" fill="#a47c55" stroke="#5a3e26" stroke-width="2" stroke-linejoin="round"/><path d="M-30 0 H84" stroke="#5a3e26" stroke-width="1.4" opacity=".55"/><circle cx="-62" cy="0" r="3" fill="#2b2118"/><ellipse cx="-12" cy="-15" rx="12" ry="5" fill="#6b4f35"/><ellipse cx="-12" cy="15" rx="12" ry="5" fill="#6b4f35"/><ellipse cx="6" cy="0" rx="19" ry="14" fill="#e8590c" fill-opacity=".5" stroke="#e8590c" stroke-width="2"/><animateTransform attributeName="transform" type="rotate" values="90;90;-40;-40;40;40;0;0" keyTimes="0;.2;.26;.46;.52;.72;.78;1" dur="10s" fill="freeze"/></g></g>
<circle cx="200" cy="142" r="3" fill="#2f3a2b"/>
<circle cx="200" cy="269" r="9" fill="#e8590c"/>
<text x="216" y="275" font-size="16" font-weight="bold" fill="#c2410c">You</text>
<ellipse cx="30" cy="236" rx="13" ry="10" fill="#e8590c" fill-opacity=".5" stroke="#e8590c" stroke-width="2"/>
<text x="50" y="242" font-size="16" font-weight="bold" fill="#c2410c">Lungs</text>
<ellipse cx="250" cy="236" rx="12" ry="5" fill="#6b4f35"/>
<text x="268" y="242" font-size="16" font-weight="bold" fill="#6b4f35">Shoulder bone</text>
<g opacity="0"><animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.001;0.229;0.230" dur="10s" fill="freeze" calcMode="discrete"/><text x="200" y="50" font-size="20" font-weight="bold" fill="#b3261e" text-anchor="middle">Facing away: NEVER</text><text x="200" y="293" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Guts and hams in the way</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.231;0.489;0.490" dur="10s" fill="freeze" calcMode="discrete"/><text x="200" y="50" font-size="20" font-weight="bold" fill="#b3261e" text-anchor="middle">Quartering toward: WAIT</text><text x="200" y="293" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Shoulder bone in the way</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.491;0.749;0.750" dur="10s" fill="freeze" calcMode="discrete"/><text x="200" y="50" font-size="20" font-weight="bold" fill="#2e7d32" text-anchor="middle">Quartering away: GOOD</text><text x="200" y="293" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Aim to exit the far shoulder</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.751;0.999;1" dur="10s" fill="freeze" calcMode="discrete"/><text x="200" y="50" font-size="20" font-weight="bold" fill="#2e7d32" text-anchor="middle">Broadside: BEST</text><text x="200" y="293" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Both lungs, biggest target</text></g>
</svg>
