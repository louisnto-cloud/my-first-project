<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, side view west to east. Wet air from the Pacific blows inland. Clouds rise over the Coast Mountains and drop their rain on the coast side. Past the mountains the clouds thin out and the Interior valleys stay dry. Final label: a weather station near Mission gets about 2,140 mm of rain and snow a year; Kamloops gets about 242 mm.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">The rain shadow</text><path d="M0 260 L60 250 L120 150 L150 120 L175 160 L200 230 L400 230 L400 300 L0 300 Z" fill="#cfd8c0"/><path d="M0 300 L0 262 L40 258" fill="#9cc0de"/><text x="10" y="284" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Coast</text><text x="270" y="262" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Interior valleys</text><text x="150" y="112" font-size="14" fill="#2f3a2b" text-anchor="middle">Coast Mountains</text><g opacity="0"><line x1="40" y1="160" x2="32" y2="200" stroke="#4a7fb0" stroke-width="2"/><line x1="50" y1="170" x2="42" y2="210" stroke="#4a7fb0" stroke-width="2"/><animate attributeName="opacity" values="0;1;1;0.3" keyTimes="0;0.2;0.7;1" dur="6s" begin="0.8s" fill="freeze"/></g><g opacity="0"><line x1="70" y1="160" x2="62" y2="200" stroke="#4a7fb0" stroke-width="2"/><line x1="80" y1="170" x2="72" y2="210" stroke="#4a7fb0" stroke-width="2"/><animate attributeName="opacity" values="0;1;1;0.3" keyTimes="0;0.2;0.7;1" dur="6s" begin="0.8s" fill="freeze"/></g><g opacity="0"><line x1="100" y1="160" x2="92" y2="200" stroke="#4a7fb0" stroke-width="2"/><line x1="110" y1="170" x2="102" y2="210" stroke="#4a7fb0" stroke-width="2"/><animate attributeName="opacity" values="0;1;1;0.3" keyTimes="0;0.2;0.7;1" dur="6s" begin="0.8s" fill="freeze"/></g><g><g transform="translate(30 120) scale(1.2)"><ellipse cx="0" cy="0" rx="26" ry="12" fill="#8ea6bb"/><ellipse cx="-14" cy="4" rx="14" ry="9" fill="#8ea6bb"/><ellipse cx="15" cy="4" rx="15" ry="9" fill="#8ea6bb"/></g><animateTransform attributeName="transform" type="translate" values="0 0;150 -20;330 -30" keyTimes="0;0.45;1" dur="6s" begin="0s" fill="freeze"/><animate attributeName="opacity" values="1;1;0.35" keyTimes="0;0.45;1" dur="6s" begin="0s" fill="freeze"/></g><g><g transform="translate(-30 120) scale(1.2)"><ellipse cx="0" cy="0" rx="26" ry="12" fill="#8ea6bb"/><ellipse cx="-14" cy="4" rx="14" ry="9" fill="#8ea6bb"/><ellipse cx="15" cy="4" rx="15" ry="9" fill="#8ea6bb"/></g><animateTransform attributeName="transform" type="translate" values="0 0;150 -20;330 -30" keyTimes="0;0.45;1" dur="6s" begin="0.7s" fill="freeze"/><animate attributeName="opacity" values="1;1;0.35" keyTimes="0;0.45;1" dur="6s" begin="0.7s" fill="freeze"/></g><line x1="20" y1="70" x2="90" y2="70" stroke="#4a7fb0" stroke-width="3"/><polygon points="90.0,70.0 81.0,74.3 81.0,65.7" fill="#4a7fb0"/><text x="20" y="60" font-size="14" fill="#4a7fb0" text-anchor="start" font-weight="bold">Wet air from the Pacific</text><g opacity="0"><rect x="206" y="150" width="186" height="56" rx="8" fill="#2f3a2b"/><text x="299" y="172" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Mission area: 2,140 mm</text><text x="299" y="194" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Kamloops: 242 mm</text><animate attributeName="opacity" values="0;1" begin="6s" dur="0.6s" fill="freeze"/></g><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Rain a year at two weather stations (85%)</text>
</svg>
