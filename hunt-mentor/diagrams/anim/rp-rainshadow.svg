<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, side view west to east. Wet air from the Pacific blows inland. Clouds rise over the Coast Mountains and drop their rain on the green coast side. Past the mountains the clouds thin out and the dry Interior valleys stay dry. Final bars on one scale: a weather station near Mission gets about 2,140 mm of rain and snow a year; Kamloops gets about 242 mm (85%).">
