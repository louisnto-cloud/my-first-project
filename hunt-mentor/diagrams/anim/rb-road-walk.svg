<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation, top view: you park on the road and walk away from it. Inside the road allowance, 15 metres from the middle of the road, there is no shooting. Past that line you are out of the road allowance, and the tip is to load only there. Along a listed highway, a bullet or slug is allowed only past the 400 metre line; shot is allowed in that band." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" fill="#dfe6d3"/>
<rect x="0" y="232" width="400" height="44" fill="#9a9a92"/><line x1="0" y1="254" x2="400" y2="254" stroke="#f2c94c" stroke-width="3" stroke-dasharray="14 10"/>
<rect x="0" y="180" width="400" height="52" fill="#e8590c" opacity=".28"/>
<line x1="0" y1="180" x2="400" y2="180" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="8 6"/>
<line x1="0" y1="70" x2="400" y2="70" stroke="#c92a2a" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="392" y="174" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">15 m line</text>
<text x="392" y="64" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">400 m line, listed highways</text>
<g transform="translate(70 250) scale(1.0)"><rect x="-34" y="-14" width="40" height="22" rx="3" fill="#4a7fb0"/><path d="M6 -14 L22 -14 L32 -2 L32 8 L6 8 Z" fill="#4a7fb0"/><path d="M10 -10 L20 -10 L27 -2 L10 -2 Z" fill="#ffffff"/><circle cx="-20" cy="10" r="7" fill="#2f3a2b"/><circle cx="20" cy="10" r="7" fill="#2f3a2b"/></g>
<g transform="translate(150 230)"><g><g transform="translate(0 0) scale(1.2)"><circle cx="0" cy="-16" r="7" fill="#e8590c"/><path d="M-8 -6 L8 -6 L6 14 L-6 14 Z" fill="#e8590c"/></g><animateTransform attributeName="transform" type="translate" values="0 0;0 -70;0 -70;0 -180;0 -180" keyTimes="0;0.3;0.45;0.85;1" begin="0s" dur="9s" fill="freeze"/></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0s" dur="0.3s" fill="freeze"/><animate attributeName="opacity" values="1;0" begin="2.7s" dur="0.3s" fill="freeze"/><rect x="10" y="6" width="380" height="36" rx="8" fill="#c92a2a" stroke="#c92a2a" stroke-width="2"/><text x="200" y="30" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">In the road allowance: no shooting</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.7s" dur="0.3s" fill="freeze"/><animate attributeName="opacity" values="1;0" begin="6.5s" dur="0.3s" fill="freeze"/><rect x="10" y="6" width="380" height="36" rx="8" fill="#e8590c" stroke="#e8590c" stroke-width="2"/><text x="200" y="30" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Past the road allowance (Tip: load here)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="7.4s" dur="0.4s" fill="freeze"/><rect x="10" y="6" width="380" height="36" rx="8" fill="#5c7a3a" stroke="#5c7a3a" stroke-width="2"/><text x="200" y="30" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Listed highway: bullets only past 400 m</text></g>
</svg>
