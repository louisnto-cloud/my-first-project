<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation of a male ruffed grouse drumming on a mossy log. He stands tall on the log with his tail braced and beats his cupped wings forward and back. The beats start slow, thump, thump, then speed up into a whirr of about 50 beats in 8 to 10 seconds. The sound comes from the wings beating the air, not from hitting the log." font-family="sans-serif">
