<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a crack shoots across a snow slope, a slab breaks free, slides down and piles up deep in the low ground at the bottom.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A slab lets go</text><path d="M0 80 L220 200 L400 220 L400 300 L0 300 Z" fill="#f4f7fb"/><path d="M0 80 L220 200 L400 220" fill="none" stroke="#c9d6e3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M220 200 Q300 230 400 220 L400 300 L220 300 Z" fill="#e8eef4"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;160 90" keyTimes="0;0.3;1" dur="4s" fill="freeze"/><polygon points="30,96 130,150 124,164 24,110" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/></g><line x1="30" y1="96" x2="130" y2="150" stroke="#c0392b" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.6s" dur="0.3s" fill="freeze"/></line><g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.100;0.900;1" begin="0.6s" dur="1.4s" fill="freeze"/><text x="260" y="90" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle">Crack!</text></g><path d="M180 240 Q260 260 330 250" fill="none" stroke="#c9d6e3" stroke-width="22" opacity="0"><animate attributeName="opacity" values="0;1" begin="3.5s" dur="0.5s" fill="freeze"/></path><g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.2s" dur="0.4s" fill="freeze"/><rect x="37" y="60" width="326" height="30" rx="6" fill="#c0392b"/><text x="200" y="81" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">It piles up deep in the low ground</text></g>
</svg>
