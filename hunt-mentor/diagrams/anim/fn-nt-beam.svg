<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: at night a hunter swings a bright white headlamp beam across the timber. The beam sweeps over a deer, which bolts. Tip: a moving light is pure motion to animals; keep it low and steady.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#1f2a3a" stroke="none" stroke-width="2"/><text x="14" y="26" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="start" font-weight="bold">A swinging beam is pure motion</text><g fill="#33415a"><polygon points="60,209.6 42.0,260 78.0,260"/><rect x="56.4" y="260" width="7.2" height="10.8"/></g><g fill="#33415a"><polygon points="120,209.6 102.0,260 138.0,260"/><rect x="116.4" y="260" width="7.2" height="10.8"/></g><g fill="#33415a"><polygon points="330,209.6 312.0,260 348.0,260"/><rect x="326.4" y="260" width="7.2" height="10.8"/></g><g fill="#33415a"><polygon points="360,209.6 342.0,260 378.0,260"/><rect x="356.4" y="260" width="7.2" height="10.8"/></g><g transform="translate(250 230) scale(0.9 0.9)"><ellipse rx="20" ry="9" fill="#7a5a3a"/><path d="M14 -5 L22 -18 L28 -17 L24 -6 Z" fill="#7a5a3a"/><circle cx="25" cy="-19" r="5" fill="#7a5a3a"/><path d="M-12 6 v14 M-6 6 v14 M10 6 v14 M15 6 v14" stroke="#7a5a3a" stroke-width="3"/></g><g transform="translate(110 250) scale(0.9)"><circle cx="0" cy="-30" r="7" fill="#d0d6dc"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" stroke="#d0d6dc" stroke-width="4" stroke-linecap="round" fill="none"/></g><g><path d="M118 220 L380 160 L380 240 Z" fill="#ffffff" opacity=".35"/><animateTransform attributeName="transform" type="rotate" values="-12 118 220;10 118 220;-12 118 220" dur="3s" repeatCount="2" fill="freeze"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="2s" dur=".4s" fill="freeze"/><text x="280" y="140" font-family="sans-serif" font-size="16" fill="#ff8787" text-anchor="middle" font-weight="bold">Deer: gone</text></g>
</svg>
