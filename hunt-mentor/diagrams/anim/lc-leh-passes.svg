<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 306" font-family="sans-serif" role="img" aria-label="Animation of pass 1 in a hunt with 3 tags. Five tickets sorted by random number. Ticket 1 gets a tag. Ticket 2 is flagged because that hunter won this species last year, so it is skipped. Tickets 3 and 4 get the last two tags. Ticket 5 finds the hunt full. Pass 2 only fills hunts that still have tags left.">
<rect x="0" y="0" width="400" height="306" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Pass 1: lowest number first</text><text x="200" y="50" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">3 tags in this hunt</text><g><g transform="translate(150 82) scale(0.8)"><path d="M-14 -18 H8 L16 -10 V18 H-14 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -6 H10 M-8 2 H10 M-8 10 H4" stroke="#8a9a6b" stroke-width="2.5"/></g><animate attributeName="opacity" values="1;0" begin="1.5s" dur=".3s" fill="freeze"/></g><g><g transform="translate(200 82) scale(0.8)"><path d="M-14 -18 H8 L16 -10 V18 H-14 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -6 H10 M-8 2 H10 M-8 10 H4" stroke="#8a9a6b" stroke-width="2.5"/></g><animate attributeName="opacity" values="1;0" begin="4.5s" dur=".3s" fill="freeze"/></g><g><g transform="translate(250 82) scale(0.8)"><path d="M-14 -18 H8 L16 -10 V18 H-14 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -6 H10 M-8 2 H10 M-8 10 H4" stroke="#8a9a6b" stroke-width="2.5"/></g><animate attributeName="opacity" values="1;0" begin="6.0s" dur=".3s" fill="freeze"/></g><path d="M30 130 h34 v19.0 a6 6 0 0 0 0 12 v19.0 h-34 v-19.0 a6 6 0 0 0 0 -12 z" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><text x="47.0" y="160.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">1</text><g opacity="0"><set attributeName="opacity" to="1" begin="1.0s" fill="freeze"/><g transform="translate(47 214) scale(0.8)"><circle r="18" fill="#8a9a6b"/><path d="M-8 0 l6 7 l11 -14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="47" y="250" font-size="14" font-weight="bold" fill="#8a9a6b" text-anchor="middle">tag</text></g><path d="M102 130 h34 v19.0 a6 6 0 0 0 0 12 v19.0 h-34 v-19.0 a6 6 0 0 0 0 -12 z" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><text x="119.0" y="160.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">2</text><g transform="translate(146 126) scale(0.6)"><path d="M-12 18 V-18" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12 -18 H14 L8 -10 L14 -2 H-12 Z" fill="#e8590c"/></g><g opacity="0"><set attributeName="opacity" to="1" begin="2.5s" fill="freeze"/><text x="119" y="208" font-size="14" font-weight="bold" fill="#6b4f35" text-anchor="middle">skipped</text><text x="119" y="226" font-size="13" fill="#6b4f35" text-anchor="middle">(won last</text><text x="119" y="242" font-size="13" fill="#6b4f35" text-anchor="middle">year)</text></g><path d="M174 130 h34 v19.0 a6 6 0 0 0 0 12 v19.0 h-34 v-19.0 a6 6 0 0 0 0 -12 z" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><text x="191.0" y="160.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">3</text><g opacity="0"><set attributeName="opacity" to="1" begin="4.0s" fill="freeze"/><g transform="translate(191 214) scale(0.8)"><circle r="18" fill="#8a9a6b"/><path d="M-8 0 l6 7 l11 -14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="191" y="250" font-size="14" font-weight="bold" fill="#8a9a6b" text-anchor="middle">tag</text></g><path d="M246 130 h34 v19.0 a6 6 0 0 0 0 12 v19.0 h-34 v-19.0 a6 6 0 0 0 0 -12 z" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><text x="263.0" y="160.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">4</text><g opacity="0"><set attributeName="opacity" to="1" begin="5.5s" fill="freeze"/><g transform="translate(263 214) scale(0.8)"><circle r="18" fill="#8a9a6b"/><path d="M-8 0 l6 7 l11 -14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="263" y="250" font-size="14" font-weight="bold" fill="#8a9a6b" text-anchor="middle">tag</text></g><path d="M318 130 h34 v19.0 a6 6 0 0 0 0 12 v19.0 h-34 v-19.0 a6 6 0 0 0 0 -12 z" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><text x="335.0" y="160.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">5</text><g opacity="0"><set attributeName="opacity" to="1" begin="7.0s" fill="freeze"/><g transform="translate(335 214) scale(0.8)"><circle r="18" fill="#e8590c"/><path d="M-7 -7 l14 14 M7 -7 l-14 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g><text x="335" y="250" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">full</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="8.5s" fill="freeze"/><rect x="20" y="262" width="360" height="34" rx="8" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="1"/><text x="200" y="284" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Pass 2 only fills hunts with tags left</text></g>
</svg>
