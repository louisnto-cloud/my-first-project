<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: wind blows left to right. A hunter stands upwind. An orange scent cone grows from the hunter and widens downwind until it reaches a deer, which bolts. Text: smelled you, gone. The cone widens with distance.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Your scent: a cone downwind</text><rect x="0" y="36" width="400" height="264" fill="#dfe6d3" opacity=".5"/><g><path d="M20 70 h50 m-9 -6 l9 6 l-9 6" fill="none" stroke="#4a7fb0" stroke-width="3"/><animateTransform attributeName="transform" type="translate" values="0 0;24 0;0 0" dur="2s" begin="0.0s" repeatCount="indefinite"/></g><g><path d="M20 150 h50 m-9 -6 l9 6 l-9 6" fill="none" stroke="#4a7fb0" stroke-width="3"/><animateTransform attributeName="transform" type="translate" values="0 0;24 0;0 0" dur="2s" begin="0.5s" repeatCount="indefinite"/></g><g><path d="M20 230 h50 m-9 -6 l9 6 l-9 6" fill="none" stroke="#4a7fb0" stroke-width="3"/><animateTransform attributeName="transform" type="translate" values="0 0;24 0;0 0" dur="2s" begin="1.0s" repeatCount="indefinite"/></g><text x="30" y="56" font-size="15" fill="#4a7fb0" text-anchor="start" font-weight="bold">wind</text><g transform="translate(90 170) scale(1.1)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#e8590c"/><rect x="-6" y="-15" width="5" height="15" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" fill="#2f3a2b"/></g><path d="M100 140 L380 70 L380 230 Z" fill="#e8590c" opacity="0.18"><animate attributeName="d" values="M100 140 L120 136 L120 144 Z;M100 140 L380 70 L380 230 Z" dur="5s" fill="freeze"/></path><g><g transform="translate(320 200) scale(0.750 0.750)"><rect x="-36" y="-40" width="6" height="40" rx="3" fill="#8b5a2b"/><rect x="10" y="-40" width="6" height="40" rx="3" fill="#8b5a2b"/><ellipse cx="-12" cy="-52" rx="34" ry="16" fill="#8b5a2b"/><rect x="-30" y="-44" width="6" height="44" rx="3" fill="#8b5a2b"/><rect x="16" y="-44" width="6" height="44" rx="3" fill="#8b5a2b"/><path d="M12 -60 L26 -84 L36 -80 L26 -52 Z" fill="#8b5a2b"/><ellipse cx="38" cy="-84" rx="13" ry="7" fill="#8b5a2b"/><path d="M28 -88 L18 -102 L32 -92 Z" fill="#8b5a2b"/><path d="M31 -89 L27 -104 L38 -92 Z" fill="#8b5a2b"/><circle cx="49" cy="-84" r="2" fill="#23261f"/><ellipse cx="-44" cy="-54" rx="5" ry="9" fill="#f4efe2"/><path d="M-46 -54 L-50 -40" stroke="#23261f" stroke-width="3" stroke-linecap="round"/></g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;60 -30" keyTimes="0;0.7;1" dur="7s" fill="freeze"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="5s" dur="0.5s" fill="freeze"/><rect x="170" y="244" width="210" height="34" rx="8" fill="#2f3a2b"/><text x="275" y="267" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Smelled you. Gone.</text></g><text x="160" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">The cone widens with distance (Tip)</text>
</svg>
