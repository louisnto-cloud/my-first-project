<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a hunter follows a dashed bearing line. Each tree on the line lights up in turn as the next target; he walks to it, takes the bearing again and picks the next tree. Sight, walk, sight again: eyes on the tree, not the needle, 95 percent.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Follow a bearing: tree to tree</text><rect x="0" y="40" width="400" height="260" rx="0" fill="#dfe6d3"/><line x1="60" y1="270" x2="345" y2="46" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><g><g transform="translate(130 220) scale(0.8)"><polygon points="0,-36 -14,-4 14,-4" fill="#8a9a6b"/><polygon points="0,-24 -17,6 17,6" fill="#8a9a6b"/><rect x="-3" y="6" width="6" height="8" fill="#6b4f35"/></g><animate attributeName="opacity" values="1;1" dur="1s"/></g><circle cx="130" cy="194" r="22" fill="none" stroke="#e8590c" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="0s" dur="2s" fill="freeze"/></circle><g><g transform="translate(200 160) scale(0.8)"><polygon points="0,-36 -14,-4 14,-4" fill="#8a9a6b"/><polygon points="0,-24 -17,6 17,6" fill="#8a9a6b"/><rect x="-3" y="6" width="6" height="8" fill="#6b4f35"/></g><animate attributeName="opacity" values="1;1" dur="1s"/></g><circle cx="200" cy="134" r="22" fill="none" stroke="#e8590c" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="2s" dur="2s" fill="freeze"/></circle><g><g transform="translate(270 100) scale(0.8)"><polygon points="0,-36 -14,-4 14,-4" fill="#8a9a6b"/><polygon points="0,-24 -17,6 17,6" fill="#8a9a6b"/><rect x="-3" y="6" width="6" height="8" fill="#6b4f35"/></g><animate attributeName="opacity" values="1;1" dur="1s"/></g><circle cx="270" cy="74" r="22" fill="none" stroke="#e8590c" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="4s" dur="2s" fill="freeze"/></circle><g><g transform="translate(340 60) scale(0.8)"><polygon points="0,-36 -14,-4 14,-4" fill="#8a9a6b"/><polygon points="0,-24 -17,6 17,6" fill="#8a9a6b"/><rect x="-3" y="6" width="6" height="8" fill="#6b4f35"/></g><animate attributeName="opacity" values="1;1" dur="1s"/></g><circle cx="340" cy="34" r="22" fill="none" stroke="#e8590c" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="6s" dur="2s" fill="freeze"/></circle><path id="mc-nav-leapfrog-p" d="M60 270 L130 225 L200 165 L270 105" fill="none" stroke="none"/><g><g transform="translate(0 18) scale(0.7)"><circle cx="0" cy="-30" r="7" fill="#2f3a2b"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" fill="none" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><animateMotion dur="6s" fill="freeze"><mpath href="#mc-nav-leapfrog-p"/></animateMotion></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="6s" dur="0.5s" fill="freeze"/><rect x="160" y="236" width="230" height="56" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="275" y="258" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Sight, walk, sight again.</text><text x="275" y="280" font-size="14" fill="#23261f" text-anchor="middle">Eyes on the tree, not the needle</text></g>
</svg>
