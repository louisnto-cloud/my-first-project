<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a bullet travels down a barrel with spiral rifling and spins as it goes. A 1 in 10 twist means one full turn every 10 inches. At 2,820 feet per second that is about 3,400 turns a second. Spin keeps the bullet flying point first, like a thrown football.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1 in 10: one full turn every 10 inches</text><rect x="20" y="120" width="360" height="50" rx="4" fill="#9a9e96" stroke="#2f3a2b" stroke-width="2"/><path d="M20 120 L60 170" fill="none" stroke="#6b4f35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 120 L100 170" fill="none" stroke="#6b4f35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 120 L140 170" fill="none" stroke="#6b4f35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 120 L180 170" fill="none" stroke="#6b4f35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 120 L220 170" fill="none" stroke="#6b4f35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M220 120 L260 170" fill="none" stroke="#6b4f35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M260 120 L300 170" fill="none" stroke="#6b4f35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 120 L340 170" fill="none" stroke="#6b4f35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340 120 L380 170" fill="none" stroke="#6b4f35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="96" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">10 in (254 mm) = one turn</text><line x1="40" y1="106" x2="360" y2="106" stroke="#e8590c" stroke-width="1.5" stroke-linecap="round"/><g><animateTransform attributeName="transform" type="translate" values="40 145;360 145" dur="4s" fill="freeze"/><ellipse cx="0" cy="0" rx="22" ry="11" fill="#b87333" stroke="#2f3a2b" stroke-width="2"/><line x1="-16" y1="0" x2="16" y2="0" stroke="#2f3a2b" stroke-width="3"><animateTransform attributeName="transform" type="rotate" values="0;360;720;1080;1440" dur="4s" fill="freeze"/></line></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="4s" dur="0.5s" fill="freeze"/><text x="200" y="210" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">At 2,820 fps the bullet turns</text><text x="200" y="230" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">about 3,400 times a second</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.5s" dur="0.5s" fill="freeze"/><text x="200.0" y="284" font-size="14" fill="#2f3a2b" text-anchor="middle">Spin keeps it point first, like a thrown football</text></g>
</svg>
