<rect x="86.4" y="86" width="63.2" height="16" rx="4" fill="#e8590c" opacity=".3"><set attributeName="opacity" to="1" begin="1.95s" dur="1.70s"/><set attributeName="opacity" to="1" begin="10.20s" fill="freeze"/></rect>
