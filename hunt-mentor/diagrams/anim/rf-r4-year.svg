<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 348" role="img" aria-label="Animation: a red line for today walks through the Region 4 licence year from July to June. Mule deer bucks: 1 to 9 September for youth or bow only, then 4 point bucks 10 September to 10 November. White tailed deer bucks: 1 to 9 September youth or bow, then 10 September to 30 November. Black bear: August on private land only, 1 to 9 September bow only, 10 September to 30 November, and 1 April to 30 June. Grouse: 1 September to 30 November. Ducks and geese: 8 September to 23 December. At the end every season shows." font-family="sans-serif">
<rect x="0" y="0" width="400" height="348" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Region 4 year at a glance</text>
