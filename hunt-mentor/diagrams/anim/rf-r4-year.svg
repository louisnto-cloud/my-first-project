<text x="217" y="60" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">J</text>
<text x="247" y="60" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">F</text>
<rect x="261.7" y="46" width="31.6" height="236" fill="#dfe6d3" opacity=".55"/>
<text x="277" y="60" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">M</text>
<text x="309" y="60" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A</text>
