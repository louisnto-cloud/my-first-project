<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: print A is made, then rain falls and leaves pits inside it and all around. Print B is made after the rain and has no pits. Rain pits inside a print mean it was made before the rain.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The rain clock</text>
<rect x="0" y="130" width="400" height="120" rx="0" fill="#c9b79c"/><g transform="translate(120 190) rotate(0) scale(1.8)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><circle cx="60" cy="160" r="0" fill="#6b4f35"><animate attributeName="r" from="0" to="4" begin="1.0s" dur="0.3s" fill="freeze"/></circle><line x1="60" y1="60" x2="60" y2="72" stroke="#4a7fb0" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="0.6s" dur="0.5s"/></line><circle cx="90" cy="220" r="0" fill="#6b4f35"><animate attributeName="r" from="0" to="4" begin="1.2s" dur="0.3s" fill="freeze"/></circle><line x1="90" y1="60" x2="90" y2="72" stroke="#4a7fb0" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="0.8s" dur="0.5s"/></line><circle cx="150" cy="170" r="0" fill="#6b4f35"><animate attributeName="r" from="0" to="4" begin="1.4s" dur="0.3s" fill="freeze"/></circle><line x1="150" y1="60" x2="150" y2="72" stroke="#4a7fb0" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="1.0s" dur="0.5s"/></line><circle cx="200" cy="210" r="0" fill="#6b4f35"><animate attributeName="r" from="0" to="4" begin="1.6s" dur="0.3s" fill="freeze"/></circle><line x1="200" y1="60" x2="200" y2="72" stroke="#4a7fb0" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="1.2s" dur="0.5s"/></line><circle cx="250" cy="160" r="0" fill="#6b4f35"><animate attributeName="r" from="0" to="4" begin="1.8s" dur="0.3s" fill="freeze"/></circle><line x1="250" y1="60" x2="250" y2="72" stroke="#4a7fb0" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="1.4s" dur="0.5s"/></line><circle cx="300" cy="230" r="0" fill="#6b4f35"><animate attributeName="r" from="0" to="4" begin="2.0s" dur="0.3s" fill="freeze"/></circle><line x1="300" y1="60" x2="300" y2="72" stroke="#4a7fb0" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="1.6s" dur="0.5s"/></line><circle cx="340" cy="180" r="0" fill="#6b4f35"><animate attributeName="r" from="0" to="4" begin="2.2s" dur="0.3s" fill="freeze"/></circle><line x1="340" y1="60" x2="340" y2="72" stroke="#4a7fb0" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="1.8s" dur="0.5s"/></line><circle cx="110" cy="175" r="0" fill="#6b4f35"><animate attributeName="r" from="0" to="4" begin="2.4s" dur="0.3s" fill="freeze"/></circle><line x1="110" y1="60" x2="110" y2="72" stroke="#4a7fb0" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="2.0s" dur="0.5s"/></line><circle cx="130" cy="205" r="0" fill="#6b4f35"><animate attributeName="r" from="0" to="4" begin="2.6s" dur="0.3s" fill="freeze"/></circle><line x1="130" y1="60" x2="130" y2="72" stroke="#4a7fb0" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="2.2s" dur="0.5s"/></line><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.4s" fill="freeze"/><text x="120" y="120" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Print A</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.4s" fill="freeze"/><g transform="translate(290 195) rotate(0) scale(1.8)" fill="#6b4f35"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><text x="290" y="120" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Print B</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.4s" fill="freeze"/><rect x="10" y="256" width="380" height="40" rx="8" fill="#2f3a2b"/><text x="200" y="282" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">A: pits inside, before rain. B: after.</text></g>
</svg>
