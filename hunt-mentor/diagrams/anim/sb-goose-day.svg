<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, map view. Evening: a flock of geese flies from the roost lake to a cut grain field and lands, and you mark the spot with a pin. Night: the flock flies back to the lake. Morning: you are already hidden at the pin, and the flock flies back to the same field. They usually come back to the field they fed in the afternoon before, 65 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect x="0" y="150" width="400" height="150" fill="#d9c27a"/>
  <ellipse cx="70" cy="200" rx="64" ry="34" fill="#4a7fb0"/>
  <text x="70" y="206" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Roost lake</text>
  <text x="300" y="286" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cut grain field</text>
  <g><g transform="translate(0 0) scale(0.55)"><ellipse rx="18" ry="5" fill="#7a6a58"/><circle cx="18" cy="-1" r="4.5" fill="#7a6a58"/><path d="M8 -3 Q2 -20.0 -10 -32.0 Q-8 -16.0 -8 -3Z" fill="#7a6a58"/><path d="M8 3 Q2 20.0 -10 32.0 Q-8 16.0 -8 3Z" fill="#7a6a58"/><path d="M-16 0 L-26 -5 L-26 5Z" fill="#7a6a58"/></g><g transform="translate(-22 -14) scale(0.55)"><ellipse rx="18" ry="5" fill="#7a6a58"/><circle cx="18" cy="-1" r="4.5" fill="#7a6a58"/><path d="M8 -3 Q2 -20.0 -10 -32.0 Q-8 -16.0 -8 -3Z" fill="#7a6a58"/><path d="M8 3 Q2 20.0 -10 32.0 Q-8 16.0 -8 3Z" fill="#7a6a58"/><path d="M-16 0 L-26 -5 L-26 5Z" fill="#7a6a58"/></g><g transform="translate(-22 14) scale(0.55)"><ellipse rx="18" ry="5" fill="#7a6a58"/><circle cx="18" cy="-1" r="4.5" fill="#7a6a58"/><path d="M8 -3 Q2 -20.0 -10 -32.0 Q-8 -16.0 -8 -3Z" fill="#7a6a58"/><path d="M8 3 Q2 20.0 -10 32.0 Q-8 16.0 -8 3Z" fill="#7a6a58"/><path d="M-16 0 L-26 -5 L-26 5Z" fill="#7a6a58"/></g><g transform="translate(-44 -26) scale(0.55)"><ellipse rx="18" ry="5" fill="#7a6a58"/><circle cx="18" cy="-1" r="4.5" fill="#7a6a58"/><path d="M8 -3 Q2 -20.0 -10 -32.0 Q-8 -16.0 -8 -3Z" fill="#7a6a58"/><path d="M8 3 Q2 20.0 -10 32.0 Q-8 16.0 -8 3Z" fill="#7a6a58"/><path d="M-16 0 L-26 -5 L-26 5Z" fill="#7a6a58"/></g><animateTransform attributeName="transform" type="translate" values="70 190;300 200;300 200;70 190;70 190;300 200" keyTimes="0;.25;.35;.5;.6;1" dur="9s" fill="freeze"/></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="2.2s"/><path d="M300 230 c-10 -14 -10 -24 0 -30 c10 6 10 16 0 30z" fill="#e8590c"/></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="5.6s"/><g transform="translate(334 236) scale(1.0)"><circle r="9" fill="#e8590c"/></g><rect x="318" y="244" width="32" height="10" rx="3" fill="#8a9a6b"/></g>
  <rect x="10" y="12" width="380" height="40" rx="8" fill="#2f3a2b"/>
  <g opacity="1"><set attributeName="opacity" to="0" begin="3.2s"/><text x="200" y="38" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Evening: watch where they land</text></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="3.2s"/><set attributeName="opacity" to="0" begin="5.4s"/><text x="200" y="38" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Night: back to the lake</text></g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="5.4s"/><text x="200" y="38" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Morning: same field. Be hidden first</text></g>
  <text x="200" y="80" font-size="13" fill="#2f3a2b" text-anchor="middle">They usually come back to that field (65%)</text>
</svg>
