<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, map view. Evening: a flock of geese flies from the roost lake to a cut grain field and lands, and you mark the spot with a pin. Night: the flock flies back to the lake. Morning: you are already hidden in a blind at the pin, and the flock flies back to the same field. They usually come back to the field they fed in the afternoon before, 65 percent.">
