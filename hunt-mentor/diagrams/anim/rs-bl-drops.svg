<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a wounded deer runs left to right. Each blood drop lands with a small tail or splash on the side toward the way it was moving. Tails point the way it went. Round drops mean it stood still; long tails mean it was moving fast.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Drops point the way</text>
<rect x="0" y="70" width="400" height="170" rx="0" fill="#e9e2cf"/><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.4s" fill="freeze"/><g transform="translate(60 160) rotate(-90) scale(1.6)"><path d="M-5 0 A5 5 0 1 1 5 0 Q3 4 0 12 Q-3 4 -5 0 Z" fill="#c62828"/></g></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.4s" fill="freeze"/><g transform="translate(120 150) rotate(-90) scale(1.6)"><path d="M-5 0 A5 5 0 1 1 5 0 Q3 4 0 12 Q-3 4 -5 0 Z" fill="#c62828"/></g></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.4s" fill="freeze"/><g transform="translate(180 165) rotate(-90) scale(1.6)"><path d="M-5 0 A5 5 0 1 1 5 0 Q3 4 0 12 Q-3 4 -5 0 Z" fill="#c62828"/></g></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.4s" fill="freeze"/><g transform="translate(240 150) rotate(-90) scale(1.6)"><path d="M-5 0 A5 5 0 1 1 5 0 Q3 4 0 12 Q-3 4 -5 0 Z" fill="#c62828"/></g></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.4s" fill="freeze"/><g transform="translate(300 160) rotate(-90) scale(1.6)"><path d="M-5 0 A5 5 0 1 1 5 0 Q3 4 0 12 Q-3 4 -5 0 Z" fill="#c62828"/></g></g><g><g transform="translate(0 0) scale(0.55)" fill="#8b5a2b"><path d="M-35 -40 Q-10 -48 20 -42 L28 -58 L34 -66 L44 -64 L42 -56 L48 -50 L36 -46 L32 -34 Q30 -26 26 -24 L28 0 L23 0 L20 -22 Q0 -20 -20 -24 L-22 0 L-27 0 L-29 -26 Q-38 -30 -35 -40 Z"/><path d="M34 -66 L30 -76 M38 -66 L42 -78" stroke="#6b4f35" stroke-width="2.5" fill="none"/></g><animateMotion dur="3.4s" fill="freeze" path="M20 120 L380 120"/></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.4s" fill="freeze"/><line x1="80" y1="210" x2="320" y2="210" stroke="#e8590c" stroke-width="3"/><path d="M320.0 210.0 L311.0 214.3 L311.0 205.7 Z" fill="#e8590c"/><text x="200" y="232" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">tails point the way it went</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.4s" dur="0.4s" fill="freeze"/><rect x="20" y="250" width="360" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="271.6666666666667" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Round drops: standing. Long tails: running fast</text></g>
</svg>
