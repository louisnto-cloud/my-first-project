<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a dot of food loops from the mouth into the rumen and reticulum and back up to the mouth as cud to chew again. Boxes show the four chambers: rumen, reticulum, omasum and abomasum, in order. Microbes in the rumen break down plants. The deer fills up fast, beds, and chews cud. A gut hit leaves green brown matter that smells.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Four chamber stomach: how it eats</text><rect x="20" y="60" width="100" height="44" rx="10" fill="#dfe6d3" stroke="#23261f" stroke-width="2"/><text x="70" y="88" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">mouth</text><rect x="150" y="60" width="100" height="44" rx="10" fill="#c9b46a" stroke="#23261f" stroke-width="2"/><text x="200" y="88" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">rumen</text><rect x="150" y="160" width="100" height="44" rx="10" fill="#c9b46a" stroke="#23261f" stroke-width="2"/><text x="200" y="188" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">reticulum</text><rect x="280" y="160" width="100" height="44" rx="10" fill="#dfe6d3" stroke="#23261f" stroke-width="2"/><text x="330" y="188" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">omasum</text><rect x="280" y="60" width="100" height="44" rx="10" fill="#dfe6d3" stroke="#23261f" stroke-width="2"/><text x="330" y="88" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">abomasum</text><line x1="120" y1="82" x2="148" y2="82" stroke="#e8590c" stroke-width="3"/><polygon points="148.0,82.0 139.0,86.3 139.0,77.7" fill="#e8590c"/><line x1="200" y1="104" x2="200" y2="158" stroke="#e8590c" stroke-width="3"/><polygon points="200.0,158.0 195.7,149.0 204.3,149.0" fill="#e8590c"/><line x1="250" y1="182" x2="278" y2="182" stroke="#e8590c" stroke-width="3"/><polygon points="278.0,182.0 269.0,186.3 269.0,177.7" fill="#e8590c"/><line x1="330" y1="158" x2="330" y2="106" stroke="#e8590c" stroke-width="3"/><polygon points="330.0,106.0 334.3,115.0 325.7,115.0" fill="#e8590c"/><path d="M150 182 Q 70 182 70 106" fill="none" stroke="#4a7fb0" stroke-width="3" stroke-dasharray="6 5"/><text x="60" y="210" font-size="14" fill="#4a7fb0" text-anchor="middle" font-weight="bold">cud back up</text><text x="60" y="226" font-size="14" fill="#4a7fb0" text-anchor="middle">to chew again</text><path d="M70 82 L200 82 L200 182 L100 182 Q 70 182 70 120 L70 82" fill="none" stroke="none" stroke-width="0" id="mmd-rf-loop"/><circle r="8" fill="#e8590c"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#mmd-rf-loop"/></animateMotion></circle><text x="200" y="252" font-size="14" fill="#23261f" text-anchor="middle">Microbes in the rumen break down plants</text><text x="200" y="270" font-size="14" fill="#23261f" text-anchor="middle">Fill up fast, bed, chew cud (85%)</text><text x="200" y="288" font-size="14" fill="#6b4f35" text-anchor="middle">Gut hit: green brown, smells (70%)</text>
</svg>
