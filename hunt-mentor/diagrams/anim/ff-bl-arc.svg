<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation of a bullet path against the straight line of sight. The bullet starts 3.8 cm below the line because the scope sits above the bore, rises to cross the line near 25 m, peaks about 1 cm high, crosses again at the 100 m zero, then falls: 13 cm low at 200 m, 48 cm at 300 m and 112 cm at 400 m for a 150 grain .308.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Line of sight is straight. The bullet arcs.</text><line x1="30" y1="150" x2="390" y2="150" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><text x="380" y="142" font-size="13" fill="#2f3a2b" text-anchor="end">line of sight</text><path id="ff-bl-arc-p" d="M50.0 153.8 L70.6 150.8 L91.2 149.1 L111.9 148.7 L132.5 150.0 L173.8 154.2 L215.0 163.2 L256.2 177.6 L297.5 198.3 L338.8 226.0 L380.0 262.0" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="1000" stroke-dashoffset="1000"><animate attributeName="stroke-dashoffset" values="1000;0" dur="4s" fill="freeze"/></path><g transform="translate(-60 140) scale(0.32)"><path d="M0 20 L100 12 L110 12 L120 40 L220 38 L220 50 L110 56 L92 68 L78 60 L0 76 Z" fill="#8b5a2b" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-8" y="18" width="10" height="60" rx="3" fill="#2f3a2b" stroke="none" stroke-width="2"/><rect x="100" y="2" width="84" height="20" rx="0" fill="#6b6f68" stroke="#2f3a2b" stroke-width="2"/><rect x="184" y="8" width="186" height="8" rx="0" fill="#6b6f68" stroke="#2f3a2b" stroke-width="1"/><path d="M118 22 l-8 18" fill="none" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="109" cy="42" r="6" fill="#2f3a2b" stroke="none" stroke-width="2"/><path d="M118 54 q 2 16 22 14 l2 -14" fill="none" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="142" y="54" width="26" height="18" rx="2" fill="#2f3a2b" stroke="none" stroke-width="2"/><rect x="118" y="-22" width="90" height="14" rx="6" fill="#4b4f48" stroke="#2f3a2b" stroke-width="1.5"/><path d="M118 -15 l-14 -6 l0 12 Z" fill="#4b4f48" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M208 -15 l18 -8 l0 16 Z" fill="#4b4f48" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="130" y="-8" width="6" height="10" rx="0" fill="#2f3a2b" stroke="none" stroke-width="2"/><rect x="190" y="-8" width="6" height="10" rx="0" fill="#2f3a2b" stroke="none" stroke-width="2"/></g><line x1="132.5" y1="155" x2="132.5" y2="162" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><text x="132.5" y="176" font-size="13" fill="#23261f" text-anchor="middle">100 m</text><line x1="215.0" y1="155" x2="215.0" y2="162" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><text x="215.0" y="176" font-size="13" fill="#23261f" text-anchor="middle">200 m</text><line x1="297.5" y1="155" x2="297.5" y2="162" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><text x="297.5" y="176" font-size="13" fill="#23261f" text-anchor="middle">300 m</text><line x1="380.0" y1="155" x2="380.0" y2="162" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><text x="380.0" y="176" font-size="13" fill="#23261f" text-anchor="middle">400 m</text><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.2s" dur="0.5s" fill="freeze"/><circle cx="132.5" cy="150" r="6" fill="#2f6e3b" stroke="none" stroke-width="2"/><text x="132.5" y="130" font-size="13" font-weight="bold" fill="#2f6e3b" text-anchor="middle">zero: crosses</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.0s" dur="0.5s" fill="freeze"/><text x="215.0" y="185.2" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">13 cm low</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.0s" dur="0.5s" fill="freeze"/><text x="287.5" y="220.3" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">48 cm low</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.8s" dur="0.5s" fill="freeze"/><text x="350.0" y="254.0" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">112 cm low</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.2s" dur="0.5s" fill="freeze"/><text x="200.0" y="288" font-size="13" fill="#2f3a2b" text-anchor="middle">150 gr, 100 m zero, scope 3.8 cm above the bore</text></g>
</svg>
