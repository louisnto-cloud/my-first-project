<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: the sun sinks across the sky. At 16:15 the hunter turns around at the bench and walks back to the truck, arriving just as dusk falls.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="14" y="26" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Turnaround time beats the sunset</text><line x1="20" y1="250" x2="380" y2="250" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><g transform="translate(40 240)"><rect x="-22" y="-14" width="30" height="14" fill="#2f3a2b"/><path d="M8 -14 h10 l6 7 v7 h-16 Z" fill="#2f3a2b"/><circle cx="-12" cy="2" r="5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/><circle cx="14" cy="2" r="5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/></g><circle cx="360" cy="240" r="8" fill="#e8590c" stroke="none" stroke-width="2"/><text x="360" y="225" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Bench</text><circle cx="60" cy="60" r="18" fill="#f2c70c"><animate attributeName="cy" values="60;270" dur="8s" fill="freeze"/><animate attributeName="cx" values="60;360" dur="8s" fill="freeze"/></circle><rect x="0" y="0" width="400" height="300" fill="#23261f" opacity="0"><animate attributeName="opacity" values="0;0;.55" keyTimes="0;.6;1" dur="8s" fill="freeze"/></rect><g><circle r="9" fill="#2f3a2b" stroke="#ffffff" stroke-width="2"/><animateMotion path="M360 240 L40 240" begin="2.5s" dur="4.5s" fill="freeze"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.2s" dur=".3s" fill="freeze"/><text x="260" y="200" font-family="sans-serif" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">16:15 turn around</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="7.2s" dur=".5s" fill="freeze"/><rect x="110" y="120" width="180" height="40" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="146" font-family="sans-serif" font-size="15" fill="#8a9a6b" text-anchor="middle" font-weight="bold">At the truck by dark</text></g>
</svg>
