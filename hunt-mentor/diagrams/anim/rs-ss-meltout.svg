<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: over five sunny days a deer print in snow melts out and grows bigger and rounder. A melted out fawn print can look like an elk print. Measure fresh prints only.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Melt out: prints grow</text>
<rect x="0" y="80" width="400" height="160" rx="0" fill="#eef2f6"/><ellipse cx="200" cy="160" rx="16" ry="22" fill="#b8c6d2"><animate attributeName="rx" values="16;24;32" keyTimes="0;0.5;1" begin="0.5s" dur="4s" fill="freeze"/><animate attributeName="ry" values="22;30;40" keyTimes="0;0.5;1" begin="0.5s" dur="4s" fill="freeze"/></ellipse><circle cx="330" cy="110" r="18" fill="#f2c94c"/><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.4s" fill="freeze"/><text x="80" y="120" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">day 1</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.4s" fill="freeze"/><text x="80" y="150" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">day 3</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.5s" dur="0.4s" fill="freeze"/><text x="80" y="180" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">day 5</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.8s" dur="0.4s" fill="freeze"/><rect x="20" y="250" width="360" height="34" rx="8" fill="#c62828"/><text x="200" y="271.6666666666667" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Sun grows prints: a fawn can look like an elk</text></g>
</svg>
