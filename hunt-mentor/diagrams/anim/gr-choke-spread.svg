<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: two shot clouds leave the muzzle and fly to a 76 centimetre circle at 37 metres. The Improved Cylinder cloud spreads wide and fills the circle loosely. The Modified cloud stays tighter and denser.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="22" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Shot spreads as it flies</text>
  <line x1="40" y1="160" x2="330" y2="160" stroke="#8a9a6b" stroke-width="2" stroke-dasharray="6 5"/>
  <g font-size="15" font-weight="bold" fill="#2f3a2b"><text x="10" y="58">IC</text><text x="10" y="210">M</text></g>
  <rect x="10" y="84" width="30" height="12" fill="#6b6f68"/><rect x="10" y="234" width="30" height="12" fill="#6b6f68"/>
  <circle cx="330" cy="90" r="46" fill="none" stroke="#2f3a2b" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="330" cy="240" r="46" fill="none" stroke="#2f3a2b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="200" y="42" font-size="14" fill="#2f3a2b" text-anchor="middle">Dashed ring: 76 cm (30 in) at 37 m (40 yd)</text>
  <g>
    <animateTransform attributeName="transform" type="translate" values="44 90;330 90" dur="4s" fill="freeze"/>
    <g fill="#e8590c">
      <animateTransform attributeName="transform" type="scale" values="0.12;1" dur="4s" fill="freeze"/>
      <circle cx="0" cy="0" r="3"/><circle cx="-30" cy="-20" r="3"/><circle cx="28" cy="-24" r="3"/><circle cx="-40" cy="10" r="3"/><circle cx="36" cy="14" r="3"/>
      <circle cx="-12" cy="34" r="3"/><circle cx="16" cy="38" r="3"/><circle cx="-8" cy="-40" r="3"/><circle cx="12" cy="-6" r="3"/><circle cx="-20" cy="-2" r="3"/>
      <circle cx="50" cy="-8" r="3"/><circle cx="-52" cy="-14" r="3"/><circle cx="44" cy="36" r="3"/><circle cx="-44" cy="38" r="3"/><circle cx="20" cy="18" r="3"/>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="44 240;330 240" dur="4s" fill="freeze"/>
    <g fill="#e8590c">
      <animateTransform attributeName="transform" type="scale" values="0.12;1" dur="4s" fill="freeze"/>
      <circle cx="0" cy="0" r="3"/><circle cx="-18" cy="-12" r="3"/><circle cx="17" cy="-14" r="3"/><circle cx="-24" cy="6" r="3"/><circle cx="22" cy="9" r="3"/>
      <circle cx="-7" cy="20" r="3"/><circle cx="10" cy="23" r="3"/><circle cx="-5" cy="-24" r="3"/><circle cx="8" cy="-4" r="3"/><circle cx="-12" cy="-1" r="3"/>
      <circle cx="30" cy="-5" r="3"/><circle cx="-31" cy="-8" r="3"/><circle cx="26" cy="22" r="3"/><circle cx="-26" cy="23" r="3"/><circle cx="12" cy="11" r="3"/>
    </g>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="4s" dur=".5s" fill="freeze"/>
    <text x="180" y="62" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wide: about 50%</text>
    <text x="180" y="212" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Tighter: about 60%</text>
  </g>
</svg>
