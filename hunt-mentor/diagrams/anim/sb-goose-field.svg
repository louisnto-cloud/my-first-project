  <rect x="140" y="226" width="56" height="14" rx="4" fill="#8a9a6b"/>
  <text x="168" y="256" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hide</text>
  <g><g transform="rotate(0)"><g transform="translate(0 0) scale(0.8)"><ellipse rx="18" ry="5" fill="#7a6a58"/><circle cx="18" cy="-1" r="4.5" fill="#7a6a58"/><path d="M8 -3 Q2 -20.0 -10 -32.0 Q-8 -16.0 -8 -3Z" fill="#7a6a58"/><path d="M8 3 Q2 20.0 -10 32.0 Q-8 16.0 -8 3Z" fill="#7a6a58"/><path d="M-16 0 L-26 -5 L-26 5Z" fill="#7a6a58"/></g></g><animateMotion dur="8s" fill="freeze" rotate="auto"><mpath href="#sb-goose-field-p"/></animateMotion></g>
