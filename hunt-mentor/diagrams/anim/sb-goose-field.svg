  <g transform="translate(270 210)"><ellipse rx="9" ry="5" fill="#7a6a58"/><path d="M7 1 L13 5" stroke="#2f3a2b" stroke-width="3"/></g>
  <g transform="translate(320 140)"><ellipse rx="9" ry="5" fill="#7a6a58"/><path d="M7 1 L13 5" stroke="#2f3a2b" stroke-width="3"/></g>
  <g transform="translate(330 220)"><ellipse rx="9" ry="5" fill="#7a6a58"/><path d="M7 1 L13 5" stroke="#2f3a2b" stroke-width="3"/></g>
  <g transform="translate(290 110)"><ellipse rx="9" ry="5" fill="#7a6a58"/><path d="M5 -2 L9 -14" stroke="#2f3a2b" stroke-width="3"/><circle cx="9" cy="-15" r="3" fill="#2f3a2b"/></g>
  <g transform="translate(240 220)"><ellipse rx="9" ry="5" fill="#7a6a58"/><path d="M5 -2 L9 -14" stroke="#2f3a2b" stroke-width="3"/><circle cx="9" cy="-15" r="3" fill="#2f3a2b"/></g>
