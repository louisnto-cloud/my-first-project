<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, top view of a field spread with the wind blowing right to left. A goose comes from downwind, flies past the decoys, swings around upwind, turns back and glides down against the wind into the open landing hole beside the hide. Final label: into the wind, into the hole.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect x="0" y="0" width="400" height="300" fill="#d9c27a" opacity=".6"/>
