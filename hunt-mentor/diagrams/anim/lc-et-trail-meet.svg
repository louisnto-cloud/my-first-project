<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a hiker walks toward a hunter on a trail. The hunter unloads, swings the muzzle down, says good morning, and says where they are headed.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" fill="#dfe6d3" opacity=".5"/><text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Meet a hiker on the trail</text><path d="M0 200 Q100 170 200 190 T400 180" stroke="#c9b79c" stroke-width="26" fill="none"/><g><g transform="translate(0 0) scale(1.4)"><circle cx="0" cy="-14" r="6" fill="#4a7fb0"/><path d="M0 -8 L-2 6 L-8 18 M-2 6 L6 18 M0 -4 L8 2" stroke="#4a7fb0" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M12 -6 L14 18" stroke="#6b4f35" stroke-width="2"/><rect x="-10" y="-8" width="7" height="12" rx="2" fill="#8a9a6b"/></g><animateTransform attributeName="transform" type="translate" from="380 160" to="270 168" dur="3s" fill="freeze"/></g><g transform="translate(120 162)"><g transform="translate(0 0) scale(1.4)"><circle cx="0" cy="-12" r="7" fill="#2f3a2b"/><path d="M-10 18 V2 Q0 -6 10 2 V18 Z" fill="#2f3a2b"/></g><g><path d="M8 -6 L40 -30" stroke="#8b5a2b" stroke-width="5" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" values="0 8 -6;0 8 -6;105 8 -6" keyTimes="0;.5;1" dur="4s" fill="freeze"/></g></g><g opacity="0"><set attributeName="opacity" to="1" begin="1.5s" fill="freeze"/><rect x="10" y="226" width="185" height="28" rx="14" fill="#8a9a6b"/><text x="102" y="245" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1. Unload</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="3.5s" fill="freeze"/><rect x="205" y="226" width="185" height="28" rx="14" fill="#8a9a6b"/><text x="297" y="245" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2. Muzzle down</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="5s" fill="freeze"/><rect x="10" y="260" width="185" height="28" rx="14" fill="#8a9a6b"/><text x="102" y="279" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3. Say good morning</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="6.5s" fill="freeze"/><rect x="205" y="260" width="185" height="28" rx="14" fill="#2f3a2b"/><text x="297" y="279" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4. Say where you are headed</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="5s" fill="freeze"/><g transform="translate(170 110) scale(1.1)"><path d="M-20 -14 H20 V8 H-2 L-12 18 V8 H-20 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12 -6 H12 M-12 1 H6" stroke="#8a9a6b" stroke-width="2.5"/></g></g>
</svg>
