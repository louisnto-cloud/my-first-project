<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation of one cutblock over 30 years. Year 0: bare stumps and soil. Around year 5 shrubs grow and a deer feeds. Around year 15 tall shrubs and young trees, and a moose browses. By year 30 the young trees have closed in as dark poles, the floor is bare, and the shrubs and animals are gone.">
