<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="sans-serif" role="img" aria-label="Animation of the Pitt River between Pitt Lake and the Fraser. First, on the ebb, blue arrows show water running out toward the Fraser and the sea. Then the flood tide comes in and orange arrows show the river running backward toward Pitt Lake. Pitt Lake is the largest tidal freshwater lake in the world and the Pitt River reverses on flood tides. Check flows and tides before you launch.">
<rect x="0" y="0" width="400" height="330" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Pitt River: the tide turns the river</text>
<rect x="0" y="90" width="400" height="120" fill="#4a7fb0" opacity=".35"/>
<rect x="0" y="40" width="400" height="50" fill="#dfe6d3"/><rect x="0" y="210" width="400" height="50" fill="#dfe6d3"/>
<text x="16" y="70" font-size="15" font-weight="bold" fill="#2f3a2b">Pitt Lake</text>
<text x="384" y="70" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">Fraser, sea</text>
<g><path d="M40 130 h50 m-12 -8 l12 8 l-12 8" stroke="#4a7fb0" stroke-width="4" fill="none"/><path d="M170 150 h50 m-12 -8 l12 8 l-12 8" stroke="#4a7fb0" stroke-width="4" fill="none"/><path d="M300 130 h50 m-12 -8 l12 8 l-12 8" stroke="#4a7fb0" stroke-width="4" fill="none"/><path d="M100 180 h50 m-12 -8 l12 8 l-12 8" stroke="#4a7fb0" stroke-width="4" fill="none"/><path d="M240 180 h50 m-12 -8 l12 8 l-12 8" stroke="#4a7fb0" stroke-width="4" fill="none"/><animateTransform attributeName="transform" type="translate" values="0 0;12 0;0 0" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.45;.5;1" dur="8s" fill="freeze"/></g>
<g opacity="0"><path d="M90 130 h-50 m12 -8 l-12 8 l12 8" stroke="#e8590c" stroke-width="4" fill="none"/><path d="M220 150 h-50 m12 -8 l-12 8 l12 8" stroke="#e8590c" stroke-width="4" fill="none"/><path d="M350 130 h-50 m12 -8 l-12 8 l12 8" stroke="#e8590c" stroke-width="4" fill="none"/><path d="M150 180 h-50 m12 -8 l-12 8 l12 8" stroke="#e8590c" stroke-width="4" fill="none"/><path d="M290 180 h-50 m12 -8 l-12 8 l12 8" stroke="#e8590c" stroke-width="4" fill="none"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.5;.55;1" dur="8s" fill="freeze"/></g>
<g><text x="200" y="290" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Ebb: water runs out to the Fraser</text><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.45;.5;1" dur="8s" fill="freeze"/></g>
<g opacity="0"><text x="200" y="290" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Flood tide: the river runs backward</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.5;.55;1" dur="8s" fill="freeze"/></g>
<text x="200" y="316" font-size="14" fill="#2f3a2b" text-anchor="middle">Check flows and tides before you launch (99%).</text>
</svg>
