<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a jar of muddy brown water sits still. The mud sinks to the bottom and the water above clears. The clear water is poured off into a clean pot. Then boil, filter or treat it.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cloudy water: settle, then pour</text><rect x="80" y="80" width="110" height="160" rx="8" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><rect x="84" y="100" width="102" height="136" fill="#a68a5b"><animate attributeName="fill" values="#a68a5b;#a68a5b;#9fc1dc" keyTimes="0;0.3;1" dur="5s" fill="freeze"/></rect><rect x="84" y="226" width="102" height="10" fill="#7a5a33" opacity="0"><animate attributeName="opacity" values="0;1" begin="2s" dur="2s" fill="freeze"/></rect><g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.100;0.900;1" begin="0.2s" dur="3.8s" fill="freeze"/><text x="290" y="100" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Let it sit</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.5s" dur="0.4s" fill="freeze"/><line x1="200" y1="120" x2="260" y2="154" stroke="#4a7fb0" stroke-width="5" stroke-linecap="round"/><polygon points="270,160 263,148 256,160" fill="#4a7fb0"/><rect x="250" y="160" width="90" height="80" rx="8" fill="#cfe0ef" stroke="#2f3a2b" stroke-width="2"/><text x="295" y="100" font-size="16" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Pour off the top</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="6s" dur="0.4s" fill="freeze"/><rect x="72" y="262" width="256" height="30" rx="6" fill="#2f3a2b"/><text x="200" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Then boil, filter or treat</text></g>
</svg>
