<path d="M150 176 C190 182 220 176 236 168" fill="none" stroke="#9a9ca2" stroke-width="6" stroke-linecap="round"/>
<path d="M172 150 C196 140 236 140 262 150 C266 160 256 170 236 170 C210 172 186 170 172 162z" fill="#e48d97" stroke="#b5606b" stroke-width="1.4"/>
<ellipse cx="150" cy="222" rx="30" ry="28" fill="#cfe0f0" stroke="#7fa6c8" stroke-width="1.4"/>
<ellipse cx="286" cy="222" rx="46" ry="38" fill="#cfe0f0" stroke="#7fa6c8" stroke-width="1.4"/>
