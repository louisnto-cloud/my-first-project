<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation of bird breathing, simplified. 1: a breath in sends fresh air past the lung into the rear air sacs. 2: the breath out pushes that air forward through the lung, where oxygen is taken up. 3: the next breath in moves the air from the lung into the front air sacs. 4: the next breath out sends the used air out of the windpipe. Fresh air crosses the lung on both the in and the out breath. No diaphragm: the ribs and breastbone pump the sacs. Poultry anatomy, 70 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">How a bird breathes: two breaths</text>
<g transform="translate(0 0)">
<ellipse cx="200" cy="170" rx="170" ry="80" fill="#e9e5dc"/>
<rect x="40" y="150" width="80" height="16" rx="8" fill="#9a9ca2"/>
<text x="80" y="144" font-size="14" fill="#2f3a2b" text-anchor="middle">windpipe</text>
<rect x="160" y="120" width="80" height="40" rx="8" fill="#e79aa0"/>
<text x="200" y="145" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">LUNG</text>
<ellipse cx="320" cy="190" rx="44" ry="34" fill="#cfe0f0"/>
<text x="320" y="238" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">rear sacs</text>
<ellipse cx="160" cy="210" rx="40" ry="26" fill="#cfe0f0"/>
<text x="110" y="250" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">front sacs</text>
</g>
<g opacity="0"><set attributeName="opacity" to="1" begin="0.3s"/><set attributeName="opacity" to="0" begin="2.6s"/><ellipse cx="320" cy="190" rx="44" ry="34" fill="#4a7fb0" opacity=".7"/><line x1="120" y1="158" x2="280" y2="180" stroke="#4a7fb0" stroke-width="4"/><polygon points="280,180 270.5,183.1 271.7,174.5" fill="#4a7fb0"/></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="2.6s"/><set attributeName="opacity" to="0" begin="5.0s"/><rect x="160" y="120" width="80" height="40" rx="8" fill="#e8590c" opacity=".6"/><line x1="290" y1="175" x2="240" y2="145" stroke="#4a7fb0" stroke-width="4"/><polygon points="240,145 250.0,145.9 245.5,153.4" fill="#4a7fb0"/></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="5.0s"/><set attributeName="opacity" to="0" begin="7.4s"/><ellipse cx="160" cy="210" rx="40" ry="26" fill="#4a7fb0" opacity=".7"/><line x1="190" y1="160" x2="170" y2="190" stroke="#4a7fb0" stroke-width="4"/><polygon points="170,190 171.4,180.1 178.6,184.9" fill="#4a7fb0"/></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="7.4s"/><line x1="140" y1="195" x2="60" y2="160" stroke="#777" stroke-width="4"/><polygon points="60,160 70.0,159.6 66.5,167.6" fill="#777"/></g>
<rect x="10" y="36" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="59" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">1. Breath in: fresh air goes to the rear sacs</text>
<g opacity="0"><set attributeName="opacity" to="1" begin="2.6s"/><rect x="10" y="36" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="59" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">2. Breath out: it is pushed through the lung</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="5.0s"/><rect x="10" y="36" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="59" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">3. Next breath in: lung air moves to front sacs</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="7.4s"/><rect x="10" y="36" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="59" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">4. Next breath out: used air leaves</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="8.6s"/><rect x="60" y="262" width="280" height="32" rx="8" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="284" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fresh air crosses the lung both ways (70%)</text></g>
</svg>
