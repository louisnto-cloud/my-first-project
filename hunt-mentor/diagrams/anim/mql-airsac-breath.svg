<g opacity="0"><set attributeName="opacity" to="1" begin="5.0s"/><set attributeName="opacity" to="0" begin="7.4s"/><ellipse cx="150" cy="222" rx="30" ry="28" fill="#7a7a7a" opacity=".5"/><path d="M184 160 C168 170 156 182 152 200" fill="none" stroke="#7a7a7a" stroke-width="4.5" marker-end="url(#mql-airsac-breath-au)"/></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="7.4s"/><path d="M134 206 C118 184 100 164 72 136 L58 124" fill="none" stroke="#7a7a7a" stroke-width="4.5" marker-end="url(#mql-airsac-breath-au)"/></g>
<g><set attributeName="display" to="none" begin="2.6s"/><rect x="8" y="8" width="384" height="38" rx="8" fill="#2f3a2b"/><circle cx="30.0" cy="27.0" r="12" fill="#e8590c" stroke="#fffaf0" stroke-width="1.5"/><text x="30" y="32" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">1</text><text x="50" y="33" font-size="16" font-weight="bold" fill="#ffffff">Breath in: fresh air to the rear sacs</text></g>
<g display="none"><set attributeName="display" to="inline" begin="2.6s"/><set attributeName="display" to="none" begin="5.0s"/><rect x="8" y="8" width="384" height="38" rx="8" fill="#2f3a2b"/><circle cx="30.0" cy="27.0" r="12" fill="#e8590c" stroke="#fffaf0" stroke-width="1.5"/><text x="30" y="32" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text><text x="50" y="33" font-size="16" font-weight="bold" fill="#ffffff">Breath out: pushed through the lung</text></g>
<g display="none"><set attributeName="display" to="inline" begin="5.0s"/><set attributeName="display" to="none" begin="7.4s"/><rect x="8" y="8" width="384" height="38" rx="8" fill="#2f3a2b"/><circle cx="30.0" cy="27.0" r="12" fill="#e8590c" stroke="#fffaf0" stroke-width="1.5"/><text x="30" y="32" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">3</text><text x="50" y="33" font-size="16" font-weight="bold" fill="#ffffff">Next breath in: lung air to front sacs</text></g>
<g display="none"><set attributeName="display" to="inline" begin="7.4s"/><rect x="8" y="8" width="384" height="38" rx="8" fill="#2f3a2b"/><circle cx="30.0" cy="27.0" r="12" fill="#e8590c" stroke="#fffaf0" stroke-width="1.5"/><text x="30" y="32" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">4</text><text x="50" y="33" font-size="16" font-weight="bold" fill="#ffffff">Next breath out: used air leaves</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="8.6s"/><rect x="8" y="336" width="384" height="36" rx="8" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="360" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fresh air crosses the lung both ways (70%)</text></g>
</svg>
