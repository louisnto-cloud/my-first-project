<text x="40" y="233" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">windpipe</text>
<line x1="108" y1="152" x2="60.063" y2="214" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="108" cy="152" r="2.6" fill="#2f3a2b"/>
<rect x="65.4" y="300.0" width="89.1" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="110" y="319" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">front sacs</text>
<line x1="140" y1="236" x2="110" y2="300" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="140" cy="236" r="2.6" fill="#2f3a2b"/>
<rect x="288.3" y="300.0" width="83.3" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="330" y="319" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">rear sacs</text>
<line x1="304" y1="246" x2="330" y2="300" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="304" cy="246" r="2.6" fill="#2f3a2b"/>
<g opacity="0"><set attributeName="opacity" to="1" begin="0.3s"/><set attributeName="opacity" to="0" begin="2.6s"/><ellipse cx="286" cy="222" rx="46" ry="38" fill="#2f6fb0" opacity=".55"/><path d="M70 132 C96 154 120 176 160 190 C200 204 228 214 262 218" fill="none" stroke="#2f6fb0" stroke-width="4.5" marker-end="url(#mql-airsac-breath-af)"/></g>
