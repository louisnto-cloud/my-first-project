<text x="216" y="89" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">lung</text>
<line x1="218" y1="152" x2="216" y2="97" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="218" cy="152" r="2.6" fill="#2f3a2b"/>
