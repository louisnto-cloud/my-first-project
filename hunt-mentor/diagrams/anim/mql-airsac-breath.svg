<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="sans-serif" role="img" aria-label="Animation of a quail breathing, simplified, side view. The lung sits high on the back; front air sacs lie in the chest, rear air sacs fill the back of the body. 1: a breath in sends fresh air down the windpipe, past the lung, into the rear air sacs. 2: the breath out pushes that air forward through the lung. 3: the next breath in moves the air from the lung into the front air sacs. 4: the next breath out sends the used air out of the windpipe. Fresh air crosses the lung on both the in and the out breath. No diaphragm: the ribs and breastbone pump the sacs. Poultry anatomy, 70 percent.">
<rect width="400" height="380" fill="#fffaf0"/>
<defs><marker id="mql-airsac-breath-af" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2f6fb0"/></marker><marker id="mql-airsac-breath-au" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#7a7a7a"/></marker></defs>
