<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a deer up a 30 degree slope at 250 m line of sight. The flat, horizontal distance is only 217 m. Gravity pulls over the flat distance, so hold for 217 m, not 250. Holding for 250 m puts the bullet about 10 cm high.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Up or down hill: gravity uses the flat distance</text><path d="M20 250 L380 70 L380 250 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="40" y1="240" x2="340" y2="90" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="40" y1="240" x2="340" y2="240" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><line x1="340" y1="240" x2="340" y2="90" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/><g transform="translate(318 50) scale(0.4)"><ellipse cx="62" cy="50" rx="44" ry="20" fill="#8b5a2b"/><path d="M28 42 L14 14 L24 10 L40 36 Z" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="12" cy="12" rx="13" ry="7" fill="#8b5a2b" transform="rotate(-20 12 12)"/><path d="M14 4 l6 -12 l4 10 Z" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="40" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="82" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="94" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><ellipse cx="104" cy="44" rx="5" ry="8" fill="#f4efe6"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.5s" fill="freeze"/><text x="170" y="150" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="end">line of sight: 250 m</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.5s" dur="0.5s" fill="freeze"/><text x="190" y="264" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">flat distance: 217 m</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.0s" dur="0.5s" fill="freeze"/><text x="100" y="230" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">30°</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.6s" dur="0.5s" fill="freeze"/><rect x="40" y="50" width="220" height="32" rx="16.0" fill="#2f3a2b" stroke="none" stroke-width="2"/><text x="150.0" y="70.9" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Hold for 217 m, not 250</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.4s" dur="0.5s" fill="freeze"/><text x="200.0" y="290" font-size="13" fill="#2f3a2b" text-anchor="middle">Hold for 250 and you shoot about 10 cm high</text></g>
</svg>
