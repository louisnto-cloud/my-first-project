<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 336" font-family="sans-serif" role="img" aria-label="Animation: a deer up a 30 degree slope at 250 m line of sight. The flat, horizontal distance is only 217 m. Gravity pulls over the flat distance, so hold for 217 m, not 250. Holding for 250 m puts the bullet about 10 cm high.">
<rect width="400" height="336" fill="#fffaf0"/>
<text x="200" y="25" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Up or down hill:</text>
<text x="200" y="46" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">gravity uses the flat distance</text>
<path d="M14 274 L364.0 73.8 L364.0 274 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<path d="M0 274 H400 V302 H0z" fill="#dfe6d3"/>
<g transform="translate(28 269) rotate(-14)"><path d="M-14 -3 L-4 -4" stroke="#4a4136" stroke-width="5" stroke-linecap="round"/><ellipse cx="4" cy="-6" rx="10" ry="5.5" fill="#e8590c"/><circle cx="18" cy="-10" r="5" fill="#e0b48c"/><path d="M15 -14 C15 -19 22 -19 22 -14z" fill="#e8590c"/><path d="M12 -9 L40 -12" stroke="#3b2a1a" stroke-width="3" stroke-linecap="round"/></g>
<g transform="translate(332 100.79491924311228) scale(0.5 0.5)"><path d="M-18 -32 L-19 0 M-11 -32 L-10 0" stroke="#5a3e26" stroke-width="3.4" stroke-linecap="round"/><path d="M14 -34 L19 -16 L16 0 M21 -34 L26 -16 L23 0" stroke="#5a3e26" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M-24 -44 C-24 -52 -10 -55 6 -54 C20 -54 31 -51 31 -41 C31 -33 25 -29 15 -29 L-16 -29 C-22 -29 -24 -35 -24 -44z" fill="#9a7350"/><path d="M-22 -44 L-31 -66 L-21 -70 L-11 -50z" fill="#9a7350"/><path d="M-29 -65 C-36 -68 -44 -64 -47 -59 L-45 -56 C-39 -56 -32 -57 -25 -61z" fill="#9a7350"/><path d="M-47 -59 L-45 -56" stroke="#1d1a16" stroke-width="2.6" stroke-linecap="round"/><path d="M-25 -68 C-18 -78 -12 -80 -10 -78 C-13 -72 -18 -67 -23 -65z" fill="#9a7350" stroke="#5a3e26" stroke-width=".8"/><circle cx="-34" cy="-63" r="1.3" fill="#111"/><ellipse cx="28" cy="-42" rx="4.5" ry="8" fill="#f3ead8"/><path d="M30 -48 C34 -44 34 -40 31 -37 L29 -45z" fill="#1d1a16"/><path d="M-28 -69 C-30 -80 -26 -90 -16 -95 M-26 -84 L-36 -94 M-16 -95 L-10 -104 M-16 -95 L-24 -105 M-34 -92 L-38 -100 M-34 -92 L-30 -101" stroke="#6b4f35" stroke-width="2.4" stroke-linecap="round" fill="none"/></g>
<line x1="58" y1="254" x2="314.0" y2="74.8" stroke="#e8590c" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/>
<line x1="58" y1="268" x2="320.0" y2="268" stroke="#4a7fb0" stroke-width="3.4" stroke-linecap="round"/>
<line x1="320.0" y1="268" x2="320.0" y2="90.8" stroke="#2f3a2b" stroke-width="1.5" stroke-dasharray="3 3"/>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.5s" fill="freeze"/><text x="160" y="170" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle" stroke="#fffaf0" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" transform="rotate(-30 160 170)">line of sight: 250 m</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.0s" dur="0.5s" fill="freeze"/><path d="M108 268 A60 60 0 0 0 101.3 243.0" fill="none" stroke="#2f3a2b" stroke-width="1.6"/><text x="120" y="260" font-size="16" font-weight="bold" fill="#2f3a2b">30°</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.5s" dur="0.5s" fill="freeze"/><text x="190" y="292" font-size="16" font-weight="bold" fill="#4a7fb0" text-anchor="middle">flat distance: 217 m</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.6s" dur="0.5s" fill="freeze"/><rect x="19.5" y="64" width="217.0" height="30" rx="15.0" fill="#2f3a2b"/><text x="128" y="84.8" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Hold for 217 m, not 250</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.4s" dur="0.5s" fill="freeze"/><rect x="0" y="302" width="400" height="34" fill="#e8590c"/><text x="200" y="325" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Hold for 250 and you shoot about 10 cm high</text></g>
</svg>
