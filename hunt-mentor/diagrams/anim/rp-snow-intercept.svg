<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation of a snowfall. On the left, big old cedar crowns catch most of the snow, so only a thin layer builds on the ground and a deer moves easily. On the right, in the open, snow piles up deep. Final label: thin snow under crowns, deer can still move.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Old crowns catch the snow</text><rect x="0" y="230" width="400" height="70" rx="0" fill="#dfe6d3"/><path d="M18.8 214.0 Q 39.4 127.0 60.0 82.0 Q 80.6 127.0 101.2 214.0 Z" fill="#2e4d3a"/><rect x="57.5" y="214.0" width="5" height="18.0" rx="0" fill="#6b4f35"/><path d="M78.8 214.0 Q 99.4 127.0 120.0 82.0 Q 140.6 127.0 161.2 214.0 Z" fill="#2e4d3a"/><rect x="117.5" y="214.0" width="5" height="18.0" rx="0" fill="#6b4f35"/><text x="90" y="276" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">under old trees</text><text x="300" y="276" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">in the open</text><circle cx="20" cy="40" r="3" fill="#ffffff" stroke="#9db3c8" stroke-width="1"><animate attributeName="cy" values="40;95" dur="1.6s" begin="0.0s" repeatCount="3" fill="freeze"/></circle><circle cx="47" cy="40" r="3" fill="#ffffff" stroke="#9db3c8" stroke-width="1"><animate attributeName="cy" values="40;95" dur="1.6s" begin="0.4s" repeatCount="3" fill="freeze"/></circle><circle cx="74" cy="40" r="3" fill="#ffffff" stroke="#9db3c8" stroke-width="1"><animate attributeName="cy" values="40;95" dur="1.6s" begin="0.8s" repeatCount="3" fill="freeze"/></circle><circle cx="101" cy="40" r="3" fill="#ffffff" stroke="#9db3c8" stroke-width="1"><animate attributeName="cy" values="40;95" dur="1.6s" begin="1.2000000000000002s" repeatCount="3" fill="freeze"/></circle><circle cx="128" cy="40" r="3" fill="#ffffff" stroke="#9db3c8" stroke-width="1"><animate attributeName="cy" values="40;95" dur="1.6s" begin="1.6s" repeatCount="3" fill="freeze"/></circle><circle cx="155" cy="40" r="3" fill="#ffffff" stroke="#9db3c8" stroke-width="1"><animate attributeName="cy" values="40;95" dur="1.6s" begin="0.0s" repeatCount="3" fill="freeze"/></circle><circle cx="182" cy="40" r="3" fill="#ffffff" stroke="#9db3c8" stroke-width="1"><animate attributeName="cy" values="40;225" dur=