<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation. A covey of quail feeds on open ground next to brush. A cock watches from the top of a fence post. You walk in from the left in the open. The sentinel sees you, gives the alarm, and the covey runs into the brush before you are close. Sentinel behaviour from bird guides, 70 percent. Lesson, a Tip: stay low, use cover and look for the bird on the post first.">
