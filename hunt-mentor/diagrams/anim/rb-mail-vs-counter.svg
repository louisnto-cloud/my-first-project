<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: a species licence bought online is mailed, and the envelope travels slowly, subject to Canada Post delivery times. A species licence bought in person is yours right away. Tip: buy in person, early." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#23261f" text-anchor="middle" font-weight="bold">Species licence: how fast?</text>
<rect x="10" y="44" width="380" height="100" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<text x="24" y="68" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Bought online</text>
<g transform="translate(40 104) scale(0.9)"><rect x="-11" y="-20" width="22" height="40" rx="4" fill="#2f3a2b"/><rect x="-8" y="-15" width="16" height="26" fill="#4a7fb0"/><circle cx="0" cy="15" r="2" fill="#ffffff"/></g>
<g transform="translate(350 108) scale(1.1)"><rect x="-18" y="-6" width="36" height="24" fill="#8b5a2b"/><path d="M-24 -4 L0 -24 L24 -4 Z" fill="#2f3a2b"/><rect x="-5" y="6" width="10" height="12" fill="#fffaf0"/></g>
<g transform="translate(70 104)"><g><rect x="-18" y="-12" width="36" height="24" rx="3" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><path d="M-18 -12 L0 2 L18 -12" fill="none" stroke="#2f3a2b" stroke-width="2"/><animateTransform attributeName="transform" type="translate" values="0 0;100 0;140 0;240 0" keyTimes="0;0.3;0.7;1" begin="0.5s" dur="7s" fill="freeze"/></g></g>
<text x="200" y="136" font-size="14" fill="#2f3a2b" text-anchor="middle">Mailed: Canada Post delivery times</text>
<rect x="10" y="156" width="380" height="92" rx="10" fill="#ffffff" stroke="#5c7a3a" stroke-width="2.5"/>
<text x="24" y="180" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Bought in person</text>
<g transform="translate(200 210) scale(1.2)"><rect x="-26" y="-18" width="52" height="36" rx="4" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><line x1="-18" y1="-8" x2="18" y2="-8" stroke="#2f3a2b" stroke-width="2.5"/><line x1="-18" y1="0" x2="10" y2="0" stroke="#2f3a2b" stroke-width="2"/><line x1="-18" y1="8" x2="14" y2="8" stroke="#2f3a2b" stroke-width="2"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.0s" dur="0.4s" fill="freeze"/><path d="M236 206 L245.8 215.8 L264 194.8" fill="none" stroke="#5c7a3a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="278" y="214" font-size="15" fill="#5c7a3a" text-anchor="start" font-weight="bold">Yours now</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="6s" dur="0.4s" fill="freeze"/><rect x="10" y="254" width="380" height="36" rx="8" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="278" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Tip: buy in person, early</text></g>
</svg>
