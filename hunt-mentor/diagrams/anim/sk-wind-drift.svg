<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation from above: wind blows across the shot. The bullet path bends with the wind: 4 cm off at 100 m, 17 cm at 200 m, 40 cm at 300 m. At 300 m it misses the 20 cm vital zone completely.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="16" font-weight="bold" text-anchor="middle" fill="#23261f">20 km/h crosswind, 150 gr bullet</text><g opacity=".8"><line x1="90" y1="40" x2="90.0" y2="80.0" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><path d="M86.1 71.9 L90.0 80.0 L93.9 71.9" fill="none" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><animateTransform attributeName="transform" type="translate" values="0 0;0 14;0 0" dur="1.6s" begin="0.0s" repeatCount="indefinite"/></g><g opacity=".8"><line x1="200" y1="40" x2="200.0" y2="80.0" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><path d="M196.1 71.9 L200.0 80.0 L203.9 71.9" fill="none" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><animateTransform attributeName="transform" type="translate" values="0 0;0 14;0 0" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></g><g opacity=".8"><line x1="310" y1="40" x2="310.0" y2="80.0" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><path d="M306.1 71.9 L310.0 80.0 L313.9 71.9" fill="none" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><animateTransform attributeName="transform" type="translate" values="0 0;0 14;0 0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></g><text x="200" y="104" font-size="14" font-weight="bold" text-anchor="middle" fill="#4a7fb0">wind</text><line x1="14" y1="150" x2="46" y2="150" stroke="#6b4f35" stroke-width="7" stroke-linecap="round"/><rect x="125" y="130" width="10" height="40" fill="#e8590c" fill-opacity=".3" stroke="#e8590c" stroke-width="1.5"/><text x="130" y="124" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">100 m</text><rect x="235" y="130" width="10" height="40" fill="#e8590c" fill-opacity=".3" stroke="#e8590c" stroke-width="1.5"/><text x="240" y="124" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">200 m</text><rect x="345" y="130" width="10" height="40" fill="#e8590c" fill-opacity=".3" stroke="#e8590c" stroke-width="1.5"/><text x="350" y="124" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">300 m</text><line x1="46" y1="150" x2="380" y2="150" stroke="#2f3a2b" stroke-width="1.5" stroke-dasharray="6 5"/><path id="sk-wind-drift-p" d="M46 150 C60.0 151.3, 97.7 152.3, 130.0 158.0 C162.3 163.7, 203.3 172.0, 240.0 184.0 C276.7 196.0, 331.7 222.3, 350.0 230.0" fill="none" stroke="#23261f" stroke-width="2.5" stroke-dasharray="3 5"/><circle r="6" fill="#23261f"><animateMotion dur="3s" begin=".5s" fill="freeze" calcMode="linear"><mpath href="#sk-wind-drift-p"/></animateMotion></circle><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.3s" dur="0.5s" fill="freeze"/><circle cx="130" cy="158" r="5" fill="#b3261e"/><text x="130" y="184" font-size="16" font-weight="bold" text-anchor="middle" fill="#b3261e">4 cm</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.4s" dur="0.5s" fill="freeze"/><circle cx="240" cy="184" r="5" fill="#b3261e"/><text x="240" y="210" font-size="16" font-weight="bold" text-anchor="middle" fill="#b3261e">17 cm</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.5s" dur="0.5s" fill="freeze"/><circle cx="350" cy="230" r="5" fill="#b3261e"/><text x="350" y="256" font-size="16" font-weight="bold" text-anchor="middle" fill="#b3261e">40 cm</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.2s" dur="0.5s" fill="freeze"/><text x="200" y="284" font-size="15" font-weight="bold" text-anchor="middle" fill="#2f3a2b">Past 200 m it blows out of the vitals</text></g>
</svg>
