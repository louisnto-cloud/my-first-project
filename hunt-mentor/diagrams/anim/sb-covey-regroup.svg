<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, top view. A covey of quail hides in a clump of brush. You walk up. The covey flushes and the birds scatter in every direction, landing alone in different patches of cover. After a while the scattered birds call and walk back together to regroup in one patch. Tip: mark where they land.">
