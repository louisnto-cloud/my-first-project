<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation. Three ducks glide in toward decoys in front of a hide. Halfway in, the hunter lifts a bare, shiny face to look. The ducks flare, climb and fly away. End card: freeze until the shot, a tip."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="22" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">One face lifts: the whole flock flares</text><rect x="0" y="190" width="400" height="110" fill="#4a7fb0" opacity=".45"/><rect x="30" y="178" width="80" height="40" rx="6" fill="#9a8a5a"/><circle cx="70" cy="186" r="11" fill="#6b6f4a"/><g opacity="0"><set attributeName="opacity" to="1" begin="3s"/><circle cx="70" cy="174" r="11" fill="#f6d7b0"/><circle cx="70" cy="174" r="15" fill="none" stroke="#ffe08a" stroke-width="3"/></g><g transform="translate(220 230)"><ellipse rx="12" ry="5" fill="#8b5a2b"/><circle cx="-11" cy="-3" r="4" fill="#2f6e3b"/></g><g transform="translate(264 231)"><ellipse rx="12" ry="5" fill="#8b5a2b"/><circle cx="-11" cy="-3" r="4" fill="#2f6e3b"/></g><g transform="translate(308 232)"><ellipse rx="12" ry="5" fill="#8b5a2b"/><circle cx="-11" cy="-3" r="4" fill="#2f6e3b"/></g><g><animateMotion dur="6s" begin="0.0s" fill="freeze" rotate="auto" keyPoints="0;0.5;1" keyTimes="0;0.55;1" calcMode="linear" path="M390 50 C 320 70, 260 110, 210 160 C 200 140, 230 70, 380 40"/><g transform="translate(0 0) scale(-1 1)"><ellipse rx="4" ry="13" fill="#5c3b1c"><animate attributeName="ry" values="13;4;13" dur=".4s" repeatCount="15"/></ellipse><ellipse rx="12" ry="5" fill="#8b5a2b"/><circle cx="-12" cy="0" r="4.5" fill="#2f6e3b"/></g></g><g><animateMotion dur="6s" begin="0.2s" fill="freeze" rotate="auto" keyPoints="0;0.5;1" keyTimes="0;0.55;1" calcMode="linear" path="M390 50 C 320 70, 260 110, 210 160 C 200 140, 230 70, 380 40"/><g transform="translate(-14 10) scale(-1 1)"><ellipse rx="4" ry="13" fill="#5c3b1c"><animate attributeName="ry" values="13;4;13" dur=".4s" repeatCount="15"/></ellipse><ellipse rx="12" ry="5" fill="#8b5a2b"/><circle cx="-12" cy="0" r="4.5" fill="#2f6e3b"/></g></g><g><animateMotion dur="6s" begin="0.4s" fill="freeze" rotate="auto" keyPoints="0;0.5;1" keyTimes="0;0.55;1" calcMode="linear" path="M390 50 C 320 70, 260 110, 210 160 C 200 140, 230 70, 380 40"/><g transform="translate(-28 20) scale(-1 1)"><ellipse rx="4" ry="13" fill="#5c3b1c"><animate attributeName="ry" values="13;4;13" dur=".4s" repeatCount="15"/></ellipse><ellipse rx="12" ry="5" fill="#8b5a2b"/><circle cx="-12" cy="0" r="4.5" fill="#2f6e3b"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.2s" dur="0.3s" fill="freeze"/><text x="110" y="150" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Face up!</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="6.3s" dur="0.5s" fill="freeze"/><rect x="40" y="252" width="320" height="36" rx="8" fill="#2f3a2b"/><text x="200" y="276" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Freeze until the shot (Tip)</text></g></svg>
