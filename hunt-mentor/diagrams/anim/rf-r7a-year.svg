<text x="155" y="60" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">N</text>
<text x="186" y="60" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">D</text>
<rect x="201.5" y="46" width="31.6" height="236" fill="#dfe6d3" opacity=".55"/>
<text x="217" y="60" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">J</text>
<text x="247" y="60" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">F</text>
<rect x="261.7" y="46" width="31.6" height="236" fill="#dfe6d3" opacity=".55"/>
<text x="277" y="60" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">M</text>
<text x="309" y="60" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A</text>
<rect x="323.8" y="46" width="31.6" height="236" fill="#dfe6d3" opacity=".55"/>
<text x="340" y="60" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">M</text>
<text x="371" y="60" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">J</text>
<text x="14" y="80" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">White tailed deer bucks</text>
<rect x="77.2" y="86" width="9.2" height="16" rx="4" fill="#e8590c" opacity=".3"><set attributeName="opacity" to="1" begin="1.70s" dur="0.25s"/><set attributeName="opacity" to="1" begin="10.20s" fill="freeze"/></rect>
<rect x="86.4" y="86" width="93.8" height="16" rx="4" fill="#e8590c" opacity=".3"><set attributeName="opacity" to="1" begin="1.95s" dur="2.52s"/><set attributeName="opacity" to="1" begin="10.20s" fill="freeze"/></rect>
