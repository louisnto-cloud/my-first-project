<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 348" role="img" aria-label="Animation: a red line for today walks through the Region 7A licence year from July to June. White tailed deer bucks: 1 to 9 September youth or bow only, then 10 September to 10 December. Black bear: 15 August to 15 November and 1 April to 30 June. Spruce and ruffed grouse: 1 September to 15 November. Ducks and geese: 1 September to 30 November. Coyote: 15 August to 31 March. At the end every season shows." font-family="sans-serif">
<rect x="0" y="0" width="400" height="348" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Region 7A year at a glance</text>
