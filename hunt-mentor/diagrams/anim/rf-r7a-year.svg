<text x="61" y="60" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A</text>
<rect x="77.2" y="46" width="30.6" height="236" fill="#dfe6d3" opacity=".55"/>
<text x="92" y="60" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">S</text>
<text x="124" y="60" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">O</text>
