<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a new hunter walks in front on a trail and the mentor follows behind. The mentor carries no rifle and can see the new hunter&#x27;s muzzle, held up, the mentor decides when the firearm is loaded, and both unload at every fence and creek crossing. Tip, plus the law on loaded firearms in vehicles.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" fill="#dfe6d3" opacity=".5"/><text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Walk single file, new hunter in front</text><path id="lc-mt-single-file-path" d="M30 240 C120 230 180 160 260 150 S 360 120 380 110" fill="none" stroke="#c9b79c" stroke-width="22" stroke-linecap="round"/><g><g transform="scale(1.1)"><circle cx="0" cy="-12" r="7" fill="#e8590c"/><path d="M-10 18 V2 Q0 -6 10 2 V18 Z" fill="#e8590c"/></g><path d="M8 -2 L12 -34" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round"/><text x="0" y="34" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="middle">New hunter</text><animateMotion dur="7s" fill="freeze" keyPoints="0.16;0.72" keyTimes="0;1" calcMode="linear"><mpath href="#lc-mt-single-file-path"/></animateMotion></g><g><g transform="scale(1.1)"><circle cx="0" cy="-12" r="7" fill="#2f3a2b"/><path d="M-10 18 V2 Q0 -6 10 2 V18 Z" fill="#2f3a2b"/></g><text x="0" y="34" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Mentor</text><animateMotion dur="7s" fill="freeze" keyPoints="0;0.54" keyTimes="0;1" calcMode="linear"><mpath href="#lc-mt-single-file-path"/></animateMotion></g><g opacity="0"><set attributeName="opacity" to="1" begin="3s" fill="freeze"/><rect x="16" y="52" width="220" height="30" rx="15" fill="#fff" stroke="#2f3a2b" stroke-width="1.5"/><text x="126" y="72" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Mentor sees the muzzle</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="5.5s" fill="freeze"/><rect x="16" y="88" width="260" height="30" rx="15" fill="#fff" stroke="#e8590c" stroke-width="1.5"/><text x="146" y="108" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Mentor says when to load</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="8s" fill="freeze"/><rect x="16" y="124" width="300" height="30" rx="15" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="1"/><text x="166" y="144" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Unload at every fence and creek</text></g>
</svg>
