<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation over 8 seconds. A deer lowers its head to feed; the label says head down, move, and the hunter walks forward. Then the deer lifts its head; the hunter stops dead and the label says head up, freeze. It ends frozen. Hold the freeze longer than the deer does.">
<rect width="400" height="300" fill="#fffaf0"/>
