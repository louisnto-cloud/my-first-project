"0;0.15;0.45;0.5;1" dur="8s" fill="freeze"/></g><g opacity="0"><rect x="110" y="56" width="180" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="79" font-size="16" fill="#fffaf0" text-anchor="middle" font-weight="bold">Head up: FREEZE</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.6;1" dur="8s" fill="freeze"/></g><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Hold the freeze longer than it does (Tip)</text>
