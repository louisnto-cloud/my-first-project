<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation. From far off, a hunter watches a roost lake at last light. A flock lifts off and flies along a line to a cut field, where they land. A flag marks the spot. End card: mark the spot and hunt it at dawn, a tip."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="22" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Scout: watch where they go at last light</text><ellipse cx="80" cy="150" rx="66" ry="40" fill="#4a7fb0" opacity=".7"/><text x="80" y="205" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Roost lake</text><rect x="268" y="100" width="124" height="90" rx="6" fill="#d9c27a"/><text x="330" y="205" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Cut field</text><path d="M190 250 L214 222 L238 250Z" fill="#8a9a6b"/><circle cx="214" cy="226" r="7" fill="#e8590c"/><text x="214" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">You, far off</text><g><animateMotion dur="5s" begin="0.0s" fill="freeze" path="M90 140 Q190 70 300 130"/><ellipse rx="9" ry="4" fill="#8b5a2b"/><ellipse rx="3" ry="9" fill="#5c3b1c"><animate attributeName="ry" values="9;3;9" dur=".4s" repeatCount="13"/></ellipse></g><g><animateMotion dur="5s" begin="0.5s" fill="freeze" path="M90 140 Q190 70 314 138"/><ellipse rx="9" ry="4" fill="#8b5a2b"/><ellipse rx="3" ry="9" fill="#5c3b1c"><animate attributeName="ry" values="9;3;9" dur=".4s" repeatCount="13"/></ellipse></g><g><animateMotion dur="5s" begin="1.0s" fill="freeze" path="M90 140 Q190 70 328 146"/><ellipse rx="9" ry="4" fill="#8b5a2b"/><ellipse rx="3" ry="9" fill="#5c3b1c"><animate attributeName="ry" values="9;3;9" dur=".4s" repeatCount="13"/></ellipse></g><g><animateMotion dur="5s" begin="1.5s" fill="freeze" path="M90 140 Q190 70 342 154"/><ellipse rx="9" ry="4" fill="#8b5a2b"/><ellipse rx="3" ry="9" fill="#5c3b1c"><animate attributeName="ry" values="9;3;9" dur=".4s" repeatCount="13"/></ellipse></g><g><animateMotion dur="5s" begin="2.0s" fill="freeze" path="M90 140 Q190 70 356 162"/><ellipse rx="9" ry="4" fill="#8b5a2b"/><ellipse rx="3" ry="9" fill="#5c3b1c"><animate attributeName="ry" values="9;3;9" dur=".4s" repeatCount="13"/></ellipse></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="5.6s" dur="0.5s" fill="freeze"/><path d="M330 120 l0 -26" stroke="#e8590c" stroke-width="3"/><path d="M330 94 l18 6 l-18 6Z" fill="#e8590c"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="6.2s" dur="0.5s" fill="freeze"/><rect x="10" y="34" width="380" height="32" rx="8" fill="#2f3a2b"/><text x="200" y="56" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Mark the spot. Hunt it at dawn (Tip)</text></g></svg>
