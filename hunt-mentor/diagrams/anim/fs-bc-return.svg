<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a hunter walks back toward hanging meat, stops at a distance, glasses it and calls out. A bear appears under the meat. Lesson: if a bear is on it, back out and report.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Going back for meat</text><rect x="0" y="220" width="400" height="80" rx="0" fill="#dfe6d3"/><rect x="320" y="140" width="34" height="50" rx="6" fill="#ffffff" stroke="#9a9a8f" stroke-width="2"/><line x1="337" y1="120" x2="337" y2="140" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><line x1="300" y1="120" x2="380" y2="120" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><g><animateMotion path="M40 220 L170 220" dur="3s" fill="freeze"/><line x1="-7" y1="0" x2="-4" y2="-26" stroke="#2f3a2b" stroke-width="6.3" stroke-linecap="round"/><line x1="7" y1="0" x2="4" y2="-26" stroke="#2f3a2b" stroke-width="6.3" stroke-linecap="round"/><rect x="-10" y="-52" width="20" height="28" rx="5.4" fill="#e8590c"/><line x1="-9" y1="-47" x2="-16" y2="-28" stroke="#2f3a2b" stroke-width="5.4" stroke-linecap="round"/><line x1="9" y1="-47" x2="16" y2="-28" stroke="#2f3a2b" stroke-width="5.4" stroke-linecap="round"/><circle cx="0" cy="-60" r="9.0" fill="#d9b48f"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="3s" dur="0.4s" fill="freeze"/><rect x="176" y="160" width="26" height="10" rx="3" fill="#2f3a2b"/><line x1="210" y1="160" x2="292" y2="160" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><polygon points="300,160 292,155 292,165" fill="#e8590c"/><text x="200" y="80" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Stop. Glass it. Call out</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.5s" dur="0.4s" fill="freeze"/><ellipse cx="300" cy="205" rx="22" ry="13" fill="#2f2a26"/><circle cx="278" cy="200" r="8.5" fill="#2f2a26"/><circle cx="280" cy="192" r="3.0" fill="#2f2a26"/><circle cx="270" cy="202" r="3.5" fill="#2f2a26"/><rect x="285" y="214" width="6" height="8" rx="0" fill="#2f2a26"/><rect x="310" y="214" width="6" height="8" rx="0" fill="#2f2a26"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="5.2s" dur="0.4s" fill="freeze"/><rect x="50" y="262" width="300" height="30" rx="6" fill="#c0392b"/><text x="200" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Bear on it? Back out and report</text></g>
</svg>
