<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: one milkweed tuft released on a slope. It drifts across, climbs uphill on the rising air, stalls, then curls back on itself in a swirl. Watch one tuft for 30 seconds.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <path d="M0 280 L400 140 L400 300 L0 300 Z" fill="#8a9a6b"/>
  <path id="hf-milkweed-path" d="M70 240 C 140 220, 200 170, 250 150 C 310 126, 330 90, 290 80 C 250 70, 240 110, 280 112" fill="none" stroke="#4a7fb0" stroke-width="2" stroke-dasharray="4 6" opacity=".7"/>
  <g>
    <g stroke="#8b5a2b" stroke-width="2"><line x1="0" y1="0" x2="-9" y2="-11"/><line x1="0" y1="0" x2="0" y2="-14"/><line x1="0" y1="0" x2="9" y2="-11"/><line x1="0" y1="0" x2="-13" y2="-4"/><line x1="0" y1="0" x2="13" y2="-4"/></g>
    <circle r="3" fill="#8b5a2b"/>
    <animateMotion dur="8s" fill="freeze" keyPoints="0;0.5;0.62;1" keyTimes="0;0.45;0.65;1" calcMode="linear"><mpath href="#hf-milkweed-path"/></animateMotion>
  </g>
  <text x="12" y="28" font-size="16" font-weight="bold" fill="#2f3a2b">Release one tuft</text>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.5s" dur=".4s" fill="freeze"/><text x="120" y="160" font-size="15" font-weight="bold" fill="#4a7fb0">climbs</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.5s" dur=".4s" fill="freeze"/><text x="300" y="60" font-size="15" font-weight="bold" fill="#4a7fb0">stalls</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="7.5s" dur=".5s" fill="freeze"/>
    <rect x="12" y="44" width="200" height="50" rx="8" fill="#2f3a2b"/>
    <text x="112" y="66" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Curls back = swirl.</text>
    <text x="112" y="84" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Scent goes everywhere</text></g>
</svg>
