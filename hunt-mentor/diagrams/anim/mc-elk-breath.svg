<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: the chest from the side. The diaphragm, a muscle wall behind the lungs, pulls back and the lungs swell as air comes in, then it relaxes and the lungs shrink. It repeats like breathing. A shot through both lungs stops this and the elk collapses fast.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Breathing: the diaphragm pulls</text><rect x="60" y="50" width="280" height="190" rx="40" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/><path d="M80 64 Q200 50 320 64" fill="none" stroke="#6b4f35" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="170" cy="140" rx="70" ry="55" fill="#e89a9a" stroke="#23261f" stroke-width="1.5"><animate attributeName="rx" values="62;82;62" dur="4s" repeatCount="indefinite"/><animate attributeName="ry" values="50;62;50" dur="4s" repeatCount="indefinite"/></ellipse><path d="M262 70 Q238 140 262 230" fill="none" stroke="#6b4f35" stroke-width="5"><animate attributeName="d" values="M248 70 Q222 140 248 230;M290 70 Q276 140 290 230;M248 70 Q222 140 248 230" dur="4s" repeatCount="indefinite"/></path><text x="200" y="268" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Diaphragm moves back: air in</text><text x="170" y="145" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Lungs</text><g><line x1="30" y1="100" x2="70" y2="120" stroke="#4a7fb0" stroke-width="3"/><path d="M70.0 120.0 L60.0 119.9 L63.9 112.1 Z" fill="#4a7fb0"/><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></g><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Hit the lungs: no air, fast collapse (85%)</text>
</svg>
