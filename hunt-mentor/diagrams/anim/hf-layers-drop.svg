<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: four map layers drop onto the same spot one at a time. First parcels, private or Crown. Then the Management Unit line. Then closures. Then parks and reserves. When all four are clear, the spot gets a green tick: good to plan.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="24" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Stack the layers on your spot</text>
  <path d="M40 250 L200 290 L360 250 L200 210 Z" fill="#fffaf0" stroke="#8a9a6b" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="200" cy="250" r="7" fill="#e8590c"/>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin=".3s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 -40;0 0" begin=".3s" dur=".6s" fill="freeze"/>
    <path d="M40 240 L200 280 L360 240 L200 200 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2" opacity=".95"/><text x="12" y="232" font-size="15" font-weight="bold" fill="#2f3a2b">1 Parcels</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.6s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 -40;0 0" begin="1.6s" dur=".6s" fill="freeze"/>
    <path d="M40 195 L200 235 L360 195 L200 155 Z" fill="#cfe0ea" stroke="#4a7fb0" stroke-width="2" opacity=".9"/><text x="12" y="184" font-size="15" font-weight="bold" fill="#2f3a2b">2 MU line</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.9s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 -40;0 0" begin="2.9s" dur=".6s" fill="freeze"/>
    <path d="M40 150 L200 190 L360 150 L200 110 Z" fill="#f6d5c0" stroke="#e8590c" stroke-width="2" opacity=".9"/><text x="12" y="136" font-size="15" font-weight="bold" fill="#2f3a2b">3 Closures</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.2s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 -40;0 0" begin="4.2s" dur=".6s" fill="freeze"/>
    <path d="M40 105 L200 145 L360 105 L200 65 Z" fill="#e7dccb" stroke="#8b5a2b" stroke-width="2" opacity=".9"/><text x="12" y="80" font-size="15" font-weight="bold" fill="#2f3a2b">4 Parks, reserves</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="5.6s" dur=".5s" fill="freeze"/>
    <rect x="250" y="40" width="140" height="50" rx="8" fill="#2f6e3b"/><path d="M262 64 l8 8 l16 -18" fill="none" stroke="#fff" stroke-width="4"/>
    <text x="340" y="60" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">All clear:</text><text x="340" y="78" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">plan it</text></g>
</svg>
