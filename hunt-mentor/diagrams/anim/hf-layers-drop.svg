<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 304" font-family="sans-serif" role="img" aria-label="Animation: four map layers drop onto the same spot one at a time. First parcels, private or Crown. Then the Management Unit line. Then closures. Then parks and reserves. When all four are clear, the spot gets a green tick: all clear, plan it.">
<rect width="400" height="304" fill="#fffaf0"/>
<text x="14" y="26" font-size="18" font-weight="bold" fill="#e8590c">Stack the layers on your spot</text>
<path d="M136 266 L262 296 L388 266 L262 236 Z" fill="#fffaf0" stroke="#8a9a6b" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="262" cy="266" r="7" fill="#e8590c"/>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.3s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 -40;0 0" begin="0.3s" dur=".6s" fill="freeze"/><clipPath id="hf-layers-drop-c1"><path d="M136 256 L262 286 L388 256 L262 226 Z"/></clipPath><path d="M136 256 L262 286 L388 256 L262 226 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2" opacity=".93"/><g clip-path="url(#hf-layers-drop-c1)" stroke="#8a9a6b" stroke-width="1.4"><path d="M178 196 l-50 120"/><path d="M220 196 l-50 120"/><path d="M262 196 l-50 120"/><path d="M304 196 l-50 120"/><path d="M346 196 l-50 120"/><path d="M388 196 l-50 120"/><path d="M430 196 l-50 120"/><path d="M136 260 H388"/></g><circle cx="262" cy="256" r="4" fill="#e8590c" opacity=".9"/><circle cx="22.0" cy="256.0" r="12" fill="#6b7a4e" stroke="#fffaf0" stroke-width="1.5"/><text x="22" y="261" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">1</text><text x="40" y="262" font-size="16" font-weight="bold" fill="#2f3a2b">Parcels</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.6s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 -40;0 0" begin="1.6s" dur=".6s" fill="freeze"/><clipPath id="hf-layers-drop-c2"><path d="M136 214 L262 244 L388 214 L262 184 Z"/></clipPath><path d="M136 214 L262 244 L388 214 L262 184 Z" fill="#cfe0ea" stroke="#4a7fb0" stroke-width="2" opacity=".93"/><g clip-path="url(#hf-layers-drop-c2)"><path d="M192 174 C232 208, 292 220, 342 254" stroke="#4a7fb0" stroke-width="3" stroke-dasharray="8 5" fill="none"/></g><circle cx="262" cy="214" r="4" fill="#e8590c" opacity=".9"/><circle cx="22.0" cy="214.0" r="12" fill="#4a7fb0" stroke="#fffaf0" stroke-width="1.5"/><text x="22" y="219" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text><text x="40" y="220" font-size="16" font-weight="bold" fill="#2f3a2b">MU line</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.9s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 -40;0 0" begin="2.9s" dur=".6s" fill="freeze"/><clipPath id="hf-layers-drop-c3"><path d="M136 172 L262 202 L388 172 L262 142 Z"/></clipPath><path d="M136 172 L262 202 L388 172 L262 142 Z" fill="#f6d5c0" stroke="#e8590c" stroke-width="2" opacity=".93"/><g clip-path="url(#hf-layers-drop-c3)"><path d="M292 142 L382 172 L302 202 L266 178z" fill="#e8590c" opacity=".35"/></g><circle cx="262" cy="172" r="4" fill="#e8590c" opacity=".9"/><circle cx="22.0" cy="172.0" r="12" fill="#e8590c" stroke="#fffaf0" stroke-width="1.5"/><text x="22" y="177" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">3</text><text x="40" y="178" font-size="16" font-weight="bold" fill="#2f3a2b">Closures</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.2s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 -40;0 0" begin="4.2s" dur=".6s" fill="freeze"/><clipPath id="hf-layers-drop-c4"><path d="M136 130 L262 160 L388 130 L262 100 Z"/></clipPath><path d="M136 130 L262 160 L388 130 L262 100 Z" fill="#e7dccb" stroke="#8b5a2b" stroke-width="2" opacity=".93"/><g clip-path="url(#hf-layers-drop-c4)"><ellipse cx="192" cy="130" rx="34" ry="14" fill="#9fb48a"/></g><path d="M192 118 l7 12 h-14z" fill="#2f6e3b"/><circle cx="262" cy="130" r="4" fill="#e8590c" opacity=".9"/><circle cx="22.0" cy="130.0" r="12" fill="#8b5a2b" stroke="#fffaf0" stroke-width="1.5"/><text x="22" y="135" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">4</text><text x="40" y="127" font-size="16" font-weight="bold" fill="#2f3a2b">Parks,</text><text x="40" y="146" font-size="16" font-weight="bold" fill="#2f3a2b">reserves</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="5.6s" dur="0.5s" fill="freeze"/><rect x="268" y="38" width="124" height="50" rx="8" fill="#2f6e3b"/><path d="M281.6 62.0 l6.0 6.0 l12.0 -13.2" fill="none" stroke="#fffaf0" stroke-width="4.1" stroke-linecap="round" stroke-linejoin="round"/><text x="352" y="58" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">All clear:</text><text x="352" y="77" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">plan it</text></g>
</svg>
