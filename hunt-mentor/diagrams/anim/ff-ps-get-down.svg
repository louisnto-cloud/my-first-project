<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation listing five steps that appear one by one: stop and find the deer; say the position out loud, sitting, sticks; sticks out and sit down; rifle in and check natural point of aim; safety off only when ready. Practise dry until it takes under 5 seconds.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">From walking to steady in 5 seconds</text><g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.0s" dur="0.5s" fill="freeze"/><rect x="40" y="50" width="320" height="36" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="56" y="74" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">1</text><text x="84" y="74" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Stop. Find the deer.</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.2s" dur="0.5s" fill="freeze"/><rect x="40" y="94" width="320" height="36" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="56" y="118" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">2</text><text x="84" y="118" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Say it: &quot;Sitting, sticks&quot;</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.4s" dur="0.5s" fill="freeze"/><rect x="40" y="138" width="320" height="36" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="56" y="162" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">3</text><text x="84" y="162" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Sticks out, sit down</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.6s" dur="0.5s" fill="freeze"/><rect x="40" y="182" width="320" height="36" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="56" y="206" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">4</text><text x="84" y="206" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Rifle in, NPOA check</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.8s" dur="0.5s" fill="freeze"/><rect x="40" y="226" width="320" height="36" rx="8" fill="#f8e3cf" stroke="none" stroke-width="2"/><text x="56" y="250" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">5</text><text x="84" y="250" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Safety off when ready</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="5.6s" dur="0.5s" fill="freeze"/><text x="200.0" y="286" font-size="14" fill="#2f3a2b" text-anchor="middle">Timer on your phone: beat 5 seconds dry</text></g>
</svg>
