<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 348" role="img" aria-label="Animation: a red line for today walks through the Region 1 licence year from July to June. Black tailed deer bucks light up for bow only 25 August to 9 September, then 10 September to 10 December. Black bear: 25 August to 9 September bow only, 10 September to 10 December, and 1 April to 15 June. Grouse: 20 to 31 August bow only, then 1 September to 31 December. Ducks: 10 October 2026 to 24 January 2027. Fallow deer in Management Units 1-1 to 1-7: no closed season. At the end every season shows." font-family="sans-serif">
