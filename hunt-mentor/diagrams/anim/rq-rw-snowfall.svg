<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: snow falls on bare ground and old tracks disappear under it. When it stops, a fresh line of tracks appears on top of the new snow, leading up the slope. Final label: a track on top of new snow was made since the snow stopped.">
