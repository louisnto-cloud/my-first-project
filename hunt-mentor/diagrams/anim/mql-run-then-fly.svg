<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, top view. A strip of brush with open ground past its end. You walk along the brush from the left. The covey runs ahead of you inside the cover. When the cover runs out, the birds burst into the air and fan out over the open ground. Quail run rather than fly, 70 percent. Tip: be ready at the end of the cover.">
