<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a frame pack on a hunter. The heaviest piece, a quarter, goes in first, high and close to the back. Lighter bags go below it. Straps cinch everything tight. Carry 20 to 30 kilograms per trip.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="16" font-weight="bold" text-anchor="middle" fill="#23261f">Pack it: heavy, high, tight to your back</text><circle cx="120" cy="70" r="14" fill="#fffaf0" stroke="#23261f" stroke-width="3.5"/><path d="M120 84 L116 190" fill="none" stroke="#23261f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M116 190 L104 280" fill="none" stroke="#23261f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M116 190 L136 280" fill="none" stroke="#23261f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="132" y="74" width="12" height="190" rx="4" fill="#6b4f35" stroke="#23261f" stroke-width="2"/><rect x="132" y="256" width="70" height="10" rx="3" fill="#6b4f35" stroke="#23261f" stroke-width="2"/><g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.4s" dur=".3s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="80 -60;0 0" begin="0.4s" dur=".8s" fill="freeze"/><rect x="146" y="90" width="70" height="70" rx="10" fill="#e6b9a0" stroke="#23261f" stroke-width="2"/><text x="181.0" y="130.0" font-size="12" font-weight="bold" text-anchor="middle" fill="#23261f">quarter</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.6s" dur=".3s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="80 -60;0 0" begin="1.6s" dur=".8s" fill="freeze"/><rect x="146" y="164" width="62" height="50" rx="10" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><text x="177.0" y="194.0" font-size="12" font-weight="bold" text-anchor="middle" fill="#23261f">bag</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.6s" dur=".3s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="80 -60;0 0" begin="2.6s" dur=".8s" fill="freeze"/><rect x="146" y="218" width="56" height="36" rx="10" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><text x="174.0" y="241.0" font-size="12" font-weight="bold" text-anchor="middle" fill="#23261f">bag</text></g><line x1="140" y1="112" x2="222" y2="112" stroke="#e8590c" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;1" begin="3.8s" dur="0.3s" fill="freeze"/></line><line x1="140" y1="176" x2="214" y2="176" stroke="#e8590c" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;1" begin="4.1s" dur="0.3s" fill="freeze"/></line><line x1="140" y1="232" x2="214" y2="232" stroke="#e8590c" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;1" begin="4.3999999999999995s" dur="0.3s" fill="freeze"/></line><g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.8s" dur="0.5s" fill="freeze"/><text x="240" y="120" font-size="15" font-weight="bold" fill="#23261f">Heaviest piece</text><text x="240" y="138" font-size="15" font-weight="bold" fill="#23261f">high and close</text><text x="240" y="180" font-size="15" font-weight="bold" fill="#e8590c">Straps tight</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="5.6s" dur="0.5s" fill="freeze"/><text x="240" y="230" font-size="15" font-weight="bold" fill="#2f3a2b">20 to 30 kg per</text><text x="240" y="248" font-size="15" font-weight="bold" fill="#2f3a2b">trip (Tip)</text></g>
</svg>
