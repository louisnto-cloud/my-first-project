<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation, valley cross section in the evening. Cool air slides down both slopes into the river bottom, shown as moving dots. Orange dots from a hunter on the left slope carry the hunter&#x27;s scent down to a deer bedded in the willows by the river." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">Evening: cold air drains to the river</text><path d="M0 70 L120 210 L160 240 L240 240 L280 210 L400 70 L400 300 L0 300 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><rect x="170" y="236" width="60" height="8" rx="4" fill="#4a7fb0"/><text x="200" y="266" font-size="15" fill="#4a7fb0" text-anchor="middle" font-weight="bold">River bottom</text><polygon points="140,194.8 129.6,222 150.4,222" fill="#8a9a6b"/><rect x="138.0" y="222" width="4.0" height="6.4" fill="#6b4f35"/><polygon points="258,194.8 247.6,222 268.4,222" fill="#8a9a6b"/><rect x="256.0" y="222" width="4.0" height="6.4" fill="#6b4f35"/><ellipse cx="196" cy="228" rx="12.8" ry="8.0" fill="#8a9a6b"/><ellipse cx="204.0" cy="223.2" rx="8.8" ry="6.4" fill="#8a9a6b"/><g transform="translate(232 226) rotate(0)"><ellipse rx="16" ry="8" fill="#8b5a2b"/><circle cx="17" cy="0" r="6" fill="#8b5a2b"/><path d="M19 -4 l6 -6 M19 4 l6 6" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/></g><circle cx="80" cy="114.0" r="7.0" fill="#e8590c"/><rect x="73.0" y="122.0" width="14.0" height="20.0" rx="4.0" fill="#e8590c"/><text x="80" y="162" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">You</text><path id="mwt-vd-p1" d="M90 120 L150 200 L200 226" fill="none"/><path id="mwt-vd-p2" d="M320 110 L262 196 L210 226" fill="none"/><circle r="5" fill="#e8590c" opacity=".8"><animateMotion dur="4s" begin="0s" repeatCount="indefinite"><mpath href="#mwt-vd-p1"/></animateMotion></circle><circle r="4" fill="#4a7fb0" opacity=".7"><animateMotion dur="4s" begin="0.5s" repeatCount="indefinite"><mpath href="#mwt-vd-p2"/></animateMotion></circle><circle r="5" fill="#e8590c" opacity=".8"><animateMotion dur="4s" begin="1s" repeatCount="indefinite"><mpath href="#mwt-vd-p1"/></animateMotion></circle><circle r="4" fill="#4a7fb0" opacity=".7"><animateMotion dur="4s" begin="1.5s" repeatCount="indefinite"><mpath href="#mwt-vd-p2"/></animateMotion></circle><circle r="5" fill="#e8590c" opacity=".8"><animateMotion dur="4s" begin="2s" repeatCount="indefinite"><mpath href="#mwt-vd-p1"/></animateMotion></circle><circle r="4" fill="#4a7fb0" opacity=".7"><animateMotion dur="4s" begin="2.5s" repeatCount="indefinite"><mpath href="#mwt-vd-p2"/></animateMotion></circle><circle r="5" fill="#e8590c" opacity=".8"><animateMotion dur="4s" begin="3s" repeatCount="indefinite"><mpath href="#mwt-vd-p1"/></animateMotion></circle><circle r="4" fill="#4a7fb0" opacity=".7"><animateMotion dur="4s" begin="3.5s" repeatCount="indefinite"><mpath href="#mwt-vd-p2"/></animateMotion></circle><text x="330" y="64" font-size="15" fill="#4a7fb0" text-anchor="middle" font-weight="bold">Cool air sinks</text><text x="200" y="292" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Your scent rides it down to the deer.</text>
</svg>
