<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a map lies turned at an angle. It rotates until its blue north lines run the same way as the compass needle. Now the map looks like the land. Little Book of Orienteering Techniques, 95 percent.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Turn the map, not yourself</text><rect x="0" y="40" width="400" height="260" rx="0" fill="#dfe6d3"/><g><animateTransform attributeName="transform" type="rotate" from="-70 200 170" to="0 200 170" dur="4s" fill="freeze"/><rect x="110" y="90" width="180" height="160" rx="2" fill="#f3efe0" stroke="#8b5a2b" stroke-width="2"/><line x1="150" y1="92" x2="150" y2="248" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="200" y1="92" x2="200" y2="248" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><line x1="250" y1="92" x2="250" y2="248" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/><text x="200" y="112" font-size="16" fill="#4a7fb0" text-anchor="middle" font-weight="bold">N</text><ellipse cx="200" cy="175" rx="42.0" ry="28" fill="none" stroke="#8b5a2b" stroke-width="1.6"/><ellipse cx="200" cy="175" rx="21.0" ry="14" fill="none" stroke="#8b5a2b" stroke-width="1.6"/></g><circle cx="330" cy="240" r="30" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/><circle cx="330" cy="240" r="23" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><polygon points="330.0,217.5 334.8,240.0 325.2,240.0" fill="#c92a2a"/><polygon points="330.0,262.5 334.8,240.0 325.2,240.0" fill="#868e96"/><circle cx="330" cy="240" r="3" fill="#23261f"/><text x="330" y="200" font-size="14" fill="#c92a2a" text-anchor="middle" font-weight="bold">Needle</text><g opacity="0"><animate attributeName="opacity" values="0;1" begin="4s" dur="0.5s" fill="freeze"/><text x="200" y="290" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Map north lines now run with the needle</text></g>
</svg>
