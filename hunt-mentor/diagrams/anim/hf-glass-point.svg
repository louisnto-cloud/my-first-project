<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, side view at dawn. A draw with a creek lies between two slopes. Deer are on a bench on the right slope. The hunter walks up the left slope to a knob across the draw, 300 to 800 metres from the bench. Morning thermals rise up each slope, so the hunter&#x27;s scent drifts up their own slope, not to the deer.">
