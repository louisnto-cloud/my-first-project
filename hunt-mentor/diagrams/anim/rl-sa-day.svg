<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, map view of a round knob, north up. A deer beds on the east face at dawn in the first sun, moves round to the shady north face at midday, then moves down the west and south side to feed in the evening. Labelled Tip: a common pattern on cold sunny days, not a rule.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">A cold sunny day (Tip)</text><text x="388" y="24" font-size="14" fill="#2f3a2b" text-anchor="end">map view, north up</text>
  <rect x="0" y="36" width="400" height="232" fill="#dfe6d3" opacity=".6"/>
  <g fill="none" stroke="#8b5a2b" stroke-width="2"><ellipse cx="200" cy="158" rx="150" ry="96"/><ellipse cx="200" cy="158" rx="100" ry="62"/><ellipse cx="200" cy="158" rx="40" ry="24"/></g>
  <text x="200" y="52" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">N</text><text x="378" y="162" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">E</text><text x="20" y="162" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">W</text><text x="200" y="266" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">S</text>
  <path id="rl-sa-day-p" d="M300 160 C 260 120, 220 108, 200 104 C 160 108, 140 150, 120 170 C 140 200, 170 210, 200 212" fill="none" stroke="#8b5a2b" stroke-width="2" stroke-dasharray="3 6"/>
  <g><g transform="translate(0 0) scale(0.9)"><ellipse rx="13" ry="6" fill="#8b5a2b"/><circle cx="11" cy="-7" r="5" fill="#8b5a2b"/><path d="M9 -11 l-3 -6 M13 -11 l4 -5" stroke="#5c3b1c" stroke-width="2"/></g><animateMotion dur="8s" fill="freeze" keyPoints="0;0;.45;.45;.8;.8;1" keyTimes="0;.15;.35;.5;.7;.85;1" calcMode="linear"><mpath href="#rl-sa-day-p"/></animateMotion></g>
  <g opacity="1"><animate attributeName="opacity" values="1;0" begin="2.4s" dur=".3s" fill="freeze"/><rect x="160" y="180" width="234" height="24" rx="6" fill="#e8590c"/><text x="277.0" y="197" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Dawn: east face, first sun</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.9;1" begin="2.6s" dur="3s" fill="freeze"/><rect x="140" y="70" width="217" height="24" rx="6" fill="#2f3a2b"/><text x="248.5" y="87" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Midday: north face shade</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="5.8s" dur=".4s" fill="freeze"/><rect x="10" y="220" width="192" height="24" rx="6" fill="#e8590c"/><text x="106.0" y="237" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Evening: down to feed</text></g>
</svg>
