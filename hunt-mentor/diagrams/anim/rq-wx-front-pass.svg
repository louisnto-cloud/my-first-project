<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: a rain cloud crosses the hill from right to left. The wind arrow swings from south to northwest. During the storm a deer beds in cover and the label says deer move less. After the front, colder and calm, the deer moves out to feed and the label says glass now, a tip.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A cold front passes the hill</text>
<path d="M0 260 Q 120 150 220 190 T 400 170 L400 300 L0 300 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<g><polygon points="70.2,200 80,172 89.8,200" fill="#2f3a2b"/><rect x="78" y="200" width="4" height="5.6000000000000005" fill="#6b4f35"/></g><g><polygon points="290.9,190 300,164 309.1,190" fill="#2f3a2b"/><rect x="298" y="190" width="4" height="5.2" fill="#6b4f35"/></g><g><polygon points="319.5,195 330,165 340.5,195" fill="#2f3a2b"/><rect x="328" y="195" width="4" height="6.0" fill="#6b4f35"/></g>
<g><g transform="translate(0 0) scale(1.6)" fill="#9aa6b2"><circle cx="-14" cy="4" r="11"/><circle cx="2" cy="-4" r="15"/><circle cx="18" cy="4" r="11"/><rect x="-14" y="4" width="32" height="11"/></g><line x1="-8" y1="28" x2="-12" y2="40" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/><line x1="1" y1="28" x2="-3" y2="40" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/><line x1="10" y1="28" x2="6" y2="40" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/><line x1="19" y1="28" x2="15" y2="40" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/><line x1="28" y1="28" x2="24" y2="40" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/><animateTransform attributeName="transform" type="translate" values="460 80;-80 80" dur="8s" fill="freeze"/></g>
<g transform="translate(60 70)"><circle r="26" fill="#fff" stroke="#4a7fb0" stroke-width="2"/><g><line x1="0" y1="18" x2="0" y2="-14" stroke="#4a7fb0" stroke-width="4"/><polygon points="0,-20 -7,-8 7,-8" fill="#4a7fb0"/><animateTransform attributeName="transform" type="rotate" values="0;0;135;135" keyTimes="0;0.5;0.7;1" dur="8s" fill="freeze"/></g></g>
<text x="60" y="116" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4a7fb0" text-anchor="middle">wind</text>
<g><g transform="translate(230 205) scale(0.9)"><ellipse rx="20" ry="9" fill="#8b5a2b"/><circle cx="19" cy="-10" r="6.5" fill="#8b5a2b"/><rect x="-15" y="5" width="3.5" height="14" fill="#8b5a2b"/><rect x="-6" y="5" width="3.5" height="14" fill="#8b5a2b"/><rect x="7" y="5" width="3.5" height="14" fill="#8b5a2b"/><rect x="13" y="5" width="3.5" height="14" fill="#8b5a2b"/><ellipse cx="-20" cy="-2" rx="4" ry="5" fill="#f3ead8"/><path d="M19 -15 l-5 -10 m3 5 l-6 -2 M23 -15 l5 -10 m-3 5 l6 -2" stroke="#5c3b1c" stroke-width="2" fill="none"/></g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;-20 10;-20 10;30 -10" keyTimes="0;0.35;0.5;0.8;1" dur="8s" fill="freeze"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.45;0.75;0.8" dur="8s" fill="freeze"/><rect x="110" y="120" width="180" height="34" rx="8" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="143" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Storm: deer move less</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="6.6s" dur="0.6s" fill="freeze"/><rect x="90" y="120" width="220" height="34" rx="8" fill="#e8590c" stroke="#e8590c" stroke-width="2"/><text x="200" y="143" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Calm and colder: glass (Tip)</text></g>
</svg>
