<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, bird's eye view. A deer starts bedded in timber at the top. At dusk it walks down the trail to the open feeding field and feeds through the night. At dawn it walks back up the same trail to bed. Final label: hunt the line between bed and feed, near the feed at dusk, near the bed at dawn.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect x="0" y="40" width="400" height="80" fill="#8a9a6b"/>
  <g fill="#2f3a2b"><polygon points="30,100 42,62 54,100"/><polygon points="80,95 92,57 104,95"/><polygon points="300,100 312,62 324,100"/><polygon points="350,95 362,57 374,95"/><polygon points="250,90 262,52 274,90"/></g>
  <rect x="0" y="200" width="400" height="100" fill="#e9dfa8"/>
  <text x="20" y="225" font-size="16" font-weight="bold" fill="#6b4f35">Feed: open field</text>
  <rect x="120" y="44" width="155" height="22" rx="4" fill="#fffaf0" opacity=".85"/>
  <text x="198" y="61" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bed: timber</text>
  <path id="sg-bed-feed-down" d="M200 95 C 240 130, 160 170, 210 250" fill="none" stroke="#6b4f35" stroke-width="3" stroke-dasharray="6 5"/>
  <path id="sg-bed-feed-loop" d="M200 95 C 240 130, 160 170, 210 250 C 160 170, 240 130, 200 95" fill="none" stroke="none"/>
  <rect x="0" y="0" width="400" height="38" fill="#2f3a2b"/>
  <g>
    <text x="200" y="25" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">Day: bedded, chewing cud
      <set attributeName="opacity" to="0" begin="1.5s" fill="freeze"/></text>
    <text x="200" y="25" font-size="17" font-weight="bold" fill="#f2a56b" text-anchor="middle" opacity="0">Dusk: down to feed
      <set attributeName="opacity" to="1" begin="1.5s"/><set attributeName="opacity" to="0" begin="4s" fill="freeze"/></text>
    <text x="200" y="25" font-size="17" font-weight="bold" fill="#cfd8e6" text-anchor="middle" opacity="0">Night: feeding in the open
      <set attributeName="opacity" to="1" begin="4s"/><set attributeName="opacity" to="0" begin="5.5s" fill="freeze"/></text>
    <text x="200" y="25" font-size="17" font-weight="bold" fill="#f3d36b" text-anchor="middle" opacity="0">Dawn: back up to bed
      <set attributeName="opacity" to="1" begin="5.5s" fill="freeze"/></text>
  </g>
  <g>
    <ellipse rx="13" ry="7" fill="#8b5a2b"/><circle cx="11" cy="-5" r="5" fill="#8b5a2b"/>
    <animateMotion dur="8s" fill="freeze" calcMode="linear" keyPoints="0;0;0.5;0.5;1" keyTimes="0;0.1875;0.5;0.6875;1"><mpath href="#sg-bed-feed-loop"/></animateMotion>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="8s" dur=".5s" fill="freeze"/>
    <circle cx="240" cy="215" r="9" fill="#e8590c"/><text x="254" y="220" font-size="14" font-weight="bold" fill="#e8590c">You at dusk</text>
    <circle cx="245" cy="130" r="9" fill="#e8590c"/><text x="259" y="135" font-size="14" font-weight="bold" fill="#e8590c">You at dawn</text>
    <rect x="40" y="258" width="320" height="34" rx="8" fill="#2f3a2b"/>
    <text x="200" y="281" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Hunt the line between</text>
  </g>
</svg>
