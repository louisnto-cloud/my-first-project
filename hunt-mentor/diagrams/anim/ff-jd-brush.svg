<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a rangefinder beam heads toward a deer but stops on a branch in front of it. The unit reads 64 m, far too short. Find a clear gap to the body and range again.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The beam can stop on brush</text><g transform="translate(280 110) scale(0.9)"><ellipse cx="62" cy="50" rx="44" ry="20" fill="#8b5a2b"/><path d="M28 42 L14 14 L24 10 L40 36 Z" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="12" cy="12" rx="13" ry="7" fill="#8b5a2b" transform="rotate(-20 12 12)"/><path d="M14 4 l6 -12 l4 10 Z" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="40" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="82" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="94" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><ellipse cx="104" cy="44" rx="5" ry="8" fill="#f4efe6"/></g><path d="M180 70 L186 260 M176 120 L150 96 M184 160 L212 130 M182 200 L156 180" fill="none" stroke="#6b4f35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="150" width="50" height="30" rx="6" fill="#2f3a2b" stroke="none" stroke-width="2"/><line x1="70" y1="160" x2="70" y2="160" stroke="#b3261e" stroke-width="3" stroke-dasharray="8 6"><animate attributeName="x2" values="70;176" dur="1.2s" fill="freeze"/></line><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.3s" dur="0.5s" fill="freeze"/><circle cx="178" cy="160" r="8" fill="none" stroke="#b3261e" stroke-width="3"/><rect x="40" y="54" width="180" height="32" rx="16.0" fill="#b3261e" stroke="none" stroke-width="2"/><text x="130.0" y="75.25" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Reads 64 m!</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.4s" dur="0.5s" fill="freeze"/><text x="200" y="280" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Find a clear gap to the body, range again</text></g>
</svg>
