<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a hunter follows a line of deer tracks. Instead of staring at the ground, the hunter glances down at the next track and then looks 40 to 100 metres ahead, where a deer appears beside the trees.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Read the track, hunt ahead</text>
<rect x="0" y="150" width="400" height="150" rx="0" fill="#e9efe0"/><g transform="translate(30 240) rotate(90) scale(0.5)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><g transform="translate(75 226) rotate(90) scale(0.5)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><g transform="translate(120 240) rotate(90) scale(0.5)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><g transform="translate(165 226) rotate(90) scale(0.5)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><g transform="translate(210 240) rotate(90) scale(0.5)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><g transform="translate(255 226) rotate(90) scale(0.5)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><g transform="translate(300 240) rotate(90) scale(0.5)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><g transform="translate(345 226) rotate(90) scale(0.5)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><g transform="translate(330 150) scale(1.0)"><rect x="-3" y="-10" width="6" height="12" fill="#6b4f35"/><path d="M0 -50 L16 -10 L-16 -10 Z" fill="#8a9a6b"/></g><g transform="translate(370 155) scale(0.8)"><rect x="-3" y="-10" width="6" height="12" fill="#6b4f35"/><path d="M0 -50 L16 -10 L-16 -10 Z" fill="#8a9a6b"/></g><g transform="translate(350 150) scale(0.45) scale(-1 1)" fill="#8b5a2b" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3s" dur=".5s" fill="freeze"/><path d="M-35 -40 Q-10 -48 20 -42 L28 -58 L34 -66 L44 -64 L42 -56 L48 -50 L36 -46 L32 -34 Q30 -26 26 -24 L28 0 L23 0 L20 -22 Q0 -20 -20 -24 L-22 0 L-27 0 L-29 -26 Q-38 -30 -35 -40 Z"/><path d="M34 -66 L30 -76 M38 -66 L42 -78" stroke="#6b4f35" stroke-width="2.5" fill="none"/></g><g><g transform="translate(0 0)"><circle cx="0" cy="-30" r="9" fill="#e8590c"/><rect x="-9" y="-21" width="18" height="30" rx="5" fill="#e8590c"/></g><animateMotion dur="3s" fill="freeze" path="M20 230 L150 230"/></g><path d="M150 200 L330 120 L330 170 Z" fill="#e8590c" opacity="0"><animate attributeName="opacity" from="0" to=".2" begin="1.5s" dur="1s" fill="freeze"/></path><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.4s" fill="freeze"/><text x="250" y="100" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">eyes ahead: 40 to 100 m</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.4s" fill="freeze"/><rect x="20" y="256" width="360" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="278.0" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Glance down, then look ahead again (Tip)</text></g>
</svg>
