<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, bird eye view of open grassland. A deer feeds near the top right. The wind blows from the deer toward the hunter. The hunter walks up inside a shallow draw, below the skyline and out of sight, with the wind in the face, and ends in range while still hidden.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Use the draw to close the distance</text><rect x="0" y="40" width="400" height="260" rx="0" fill="#e9dfa8"/><path d="M40 290 Q 90 220 150 190 Q 220 150 260 110" fill="none" stroke="#b7a86a" stroke-width="34"/><path d="M40 290 Q 90 220 150 190 Q 220 150 260 110" fill="none" stroke="#a69757" stroke-width="2" stroke-dasharray="5 5"/><g transform="translate(320 100) scale(1.0)"><ellipse cx="0" cy="-22" rx="16" ry="8" fill="#8b5a2b"/><path d="M12 -26 L18 -40 L24 -40 L20 -26 Z" fill="#8b5a2b"/><ellipse cx="24" cy="-42" rx="6" ry="3.5" fill="#8b5a2b"/><path d="M19 -45 l-3 -6 M22 -45 l2 -6" stroke="#8b5a2b" stroke-width="2"/><path d="M-10 -16 v16 M-5 -16 v16 M8 -16 v16 M12 -16 v16" stroke="#8b5a2b" stroke-width="2.5"/><path d="M-16 -24 l-3 4" stroke="#fffaf0" stroke-width="2"/></g><text x="330" y="120" font-size="14" fill="#2f3a2b" text-anchor="middle">feeding</text><line x1="390" y1="160" x2="330" y2="175" stroke="#4a7fb0" stroke-width="3"/><polygon points="330.0,175.0 337.7,168.6 339.8,177.0" fill="#4a7fb0"/><text x="365" y="150" font-size="14" fill="#4a7fb0" text-anchor="middle" font-weight="bold">wind</text><path id="rp-gd-path" d="M40 290 Q 90 220 150 190 Q 220 150 252 118" fill="none" stroke="none"/><g><circle cx="0" cy="0" r="8" fill="#e8590c"/><animateMotion dur="7s" fill="freeze"><mpath href="#rp-gd-path"/></animateMotion></g><text x="70" y="270" font-size="14" fill="#2f3a2b" text-anchor="start">out of sight</text><text x="70" y="286" font-size="14" fill="#2f3a2b" text-anchor="start">below the skyline</text><g opacity="0"><rect x="20" y="60" width="200" height="46" rx="8" fill="#2f3a2b"/><text x="120" y="88" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">In range, still hidden</text><animate attributeName="opacity" values="0;1" begin="6.8s" dur="0.5s" fill="freeze"/></g>
</svg>
