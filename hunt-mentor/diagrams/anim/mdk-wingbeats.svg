<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, four ducks fly left to right in lanes. The mallard beats its wings slowly and deeply. The teal beats fast and small. The bufflehead wings are a blur. The goldeneye beats fast and its wings whistle. End card: size, shape, beat, then the wing patch."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="22" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Wingbeat speed tells you who (80%)</text><line x1="10" y1="92" x2="390" y2="92" stroke="#dfe6d3" stroke-width="2" fill="none"/><text x="14" y="50" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Mallard</text><text x="130" y="50" font-size="14" fill="#2f3a2b" text-anchor="start">slow, deep</text><g><animateTransform attributeName="transform" type="translate" from="40 72" to="350 72" dur="7s" fill="freeze"/><g transform="scale(1.4)"><ellipse cx="0" cy="0" rx="5" ry="16" fill="#5c3b1c"><animate attributeName="ry" values="16;3;16" dur="0.5s" repeatCount="14"/></ellipse><ellipse rx="14" ry="6" fill="#8b5a2b"/><circle cx="14" cy="-2" r="5" fill="#8b5a2b"/><path d="M18 -4 L25 -2 L18 0Z" fill="#2f3a2b"/></g></g><line x1="10" y1="148" x2="390" y2="148" stroke="#dfe6d3" stroke-width="2" fill="none"/><text x="14" y="106" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Teal</text><text x="130" y="106" font-size="14" fill="#2f3a2b" text-anchor="start">fast, twisting</text><g><animateTransform attributeName="transform" type="translate" from="40 128" to="350 128" dur="7s" fill="freeze"/><g transform="scale(0.868)"><ellipse cx="0" cy="0" rx="5" ry="16" fill="#5c3b1c"><animate attributeName="ry" values="16;3;16" dur="0.28s" repeatCount="24"/></ellipse><ellipse rx="14" ry="6" fill="#8b5a2b"/><circle cx="14" cy="-2" r="5" fill="#8b5a2b"/><path d="M18 -4 L25 -2 L18 0Z" fill="#2f3a2b"/></g></g><line x1="10" y1="204" x2="390" y2="204" stroke="#dfe6d3" stroke-width="2" fill="none"/><text x="14" y="162" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Bufflehead</text><text x="130" y="162" font-size="14" fill="#2f3a2b" text-anchor="start">a blur</text><g><animateTransform attributeName="transform" type="translate" from="40 184" to="350 184" dur="7s" fill="freeze"/><g transform="scale(0.84)"><ellipse cx="0" cy="0" rx="5" ry="16" fill="#5c3b1c"><animate attributeName="ry" values="16;3;16" dur="0.16s" repeatCount="43"/></ellipse><ellipse rx="14" ry="6" fill="#2f3a2b"/><circle cx="14" cy="-2" r="5" fill="#2f3a2b"/><path d="M18 -4 L25 -2 L18 0Z" fill="#2f3a2b"/></g></g><line x1="10" y1="260" x2="390" y2="260" stroke="#dfe6d3" stroke-width="2" fill="none"/><text x="14" y="218" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Goldeneye</text><text x="130" y="218" font-size="14" fill="#2f3a2b" text-anchor="start">fast, whistles</text><g><animateTransform attributeName="transform" type="translate" from="40 240" to="350 240" dur="7s" fill="freeze"/><g transform="scale(1.3299999999999998)"><ellipse cx="0" cy="0" rx="5" ry="16" fill="#5c3b1c"><animate attributeName="ry" values="16;3;16" dur="0.24s" repeatCount="29"/></ellipse><ellipse rx="14" ry="6" fill="#2f3a2b"/><circle cx="14" cy="-2" r="5" fill="#2f3a2b"/><path d="M18 -4 L25 -2 L18 0Z" fill="#2f3a2b"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="7.2s" dur="0.5s" fill="freeze"/><rect x="60" y="266" width="280" height="28" rx="8" fill="#e8590c"/><text x="200" y="286" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Size, shape, beat, then the patch</text></g></svg>
