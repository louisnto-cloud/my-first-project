<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 316" font-family="sans-serif" role="img" aria-label="Animation, side view. Snow falls on open ground on the left and on a stand of tall Douglas firs with a closed canopy on the right, the stand over 10 m tall. In the open the snow piles up deep. Under the canopy most flakes are caught in the branches, snow builds up high on the crowns, and only a thin layer reaches the ground, where a deer stands. Snow interception works best in stands over 10 m tall with over 60 percent crown cover.">
<rect width="400" height="316" fill="#fffaf0"/>
