<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, side view. Snow falls on open ground on the left and on a stand of tall conifers with a closed canopy on the right. In the open the snow piles up deep. Under the canopy most flakes are caught in the branches and only a thin layer reaches the ground, where a deer stands. Snow interception works best in stands over 10 m tall with over 60 percent crown cover.">
