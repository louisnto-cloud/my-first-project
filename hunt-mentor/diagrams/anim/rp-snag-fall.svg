<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation. A tall burned snag stands beside a parked truck. A wind gust blows, and after a moment the snag tips over and crashes down toward the truck. Final label: burned roots let go. Never park or camp under snags.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Never park or camp under snags</text><rect x="0" y="240" width="400" height="60" rx="0" fill="#6b6a60"/><g><line x1="260" y1="242" x2="260" y2="92" stroke="#3b3b36" stroke-width="4"/><line x1="260" y1="152.0" x2="268" y2="129.5" stroke="#3b3b36" stroke-width="2"/><line x1="260" y1="182.0" x2="253" y2="164.0" stroke="#3b3b36" stroke-width="2"/><animateTransform attributeName="transform" type="rotate" values="0 260 242;0 260 242;-82 260 242" keyTimes="0;0.5;1" dur="5s" begin="1s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.6 0 1 1"/></g><rect x="80" y="210" width="70" height="32" rx="6" fill="#4a7fb0"/><circle cx="95" cy="244" r="8" fill="#222"/><circle cx="135" cy="244" r="8" fill="#222"/><path d="M330 100 q 20 -6 40 0" fill="none" stroke="#4a7fb0" stroke-width="2"><animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.0s" repeatCount="3"/></path><path d="M342 120 q 20 -6 40 0" fill="none" stroke="#4a7fb0" stroke-width="2"><animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.3s" repeatCount="3"/></path><path d="M354 140 q 20 -6 40 0" fill="none" stroke="#4a7fb0" stroke-width="2"><animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.6s" repeatCount="3"/></path><text x="360" y="80" font-size="14" fill="#4a7fb0" text-anchor="middle" font-weight="bold">gust</text><g opacity="0"><rect x="30" y="50" width="240" height="48" rx="8" fill="#2f3a2b"/><text x="150" y="80" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Burned roots let go</text><animate attributeName="opacity" values="0;1" begin="5.5s" dur="0.5s" fill="freeze"/></g>
</svg>
