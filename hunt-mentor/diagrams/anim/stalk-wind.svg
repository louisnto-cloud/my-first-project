<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: wind blows from the deer toward the hunter. The hunter walks a curved path upwind, keeping the wind in their face, and stops behind a tree in range. A scent cone trails behind the hunter, away from the deer.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect x="0" y="0" width="400" height="300" fill="#dfe6d3" opacity=".5"/>
  <g stroke="#4a7fb0" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8">
    <path d="M40 40 h60 m-10 -6 l10 6 l-10 6" transform="rotate(90 70 40)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 18;0 0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M330 40 h60 m-10 -6 l10 6 l-10 6" transform="rotate(90 360 40)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 18;0 0" dur="2s" begin=".6s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="200" y="22" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Wind blows deer → you</text>
  <g transform="translate(200 70)">
    <ellipse rx="22" ry="11" fill="#8b5a2b"/><circle cx="20" cy="-10" r="7" fill="#8b5a2b"/>
    <path d="M18 -16 l-4 -10 M24 -16 l4 -10" stroke="#5c3b1c" stroke-width="2"/>
    <text y="34" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Deer</text>
  </g>
  <g fill="#2f3a2b"><polygon points="250,200 262,165 274,200"/><rect x="259" y="200" width="6" height="10"/></g>
  <path id="sw-path" d="M120 285 C 100 230, 170 230, 160 190 S 230 190, 248 205" fill="none" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="7 6"/>
  <g>
    <path d="M0 0 L-40 70 L40 70 Z" fill="#e8590c" opacity=".15"/>
    <circle r="9" fill="#e8590c"/><text y="-14" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="middle">You</text>
    <animateMotion dur="7s" fill="freeze" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#sw-path"/></animateMotion>
  </g>
  <text x="300" y="262" font-family="sans-serif" font-size="13" fill="#2f3a2b">Your scent drifts</text>
  <text x="300" y="278" font-family="sans-serif" font-size="13" fill="#2f3a2b">behind you, away</text>
  <text x="300" y="294" font-family="sans-serif" font-size="13" fill="#2f3a2b">from the deer</text>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="6.5s" dur=".5s" fill="freeze"/>
    <rect x="20" y="120" width="130" height="40" rx="8" fill="#2f3a2b"/>
    <text x="85" y="145" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">In range, hidden</text>
  </g>
</svg>
