<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 252" role="img" aria-label="Animation: a cursor moves from September 2026 to March 2027 over the Region 2 duck and Canada goose seasons. Canada geese open 5 to 15 September. Ducks and geese open 10 October. Geese close 23 November to 18 December while ducks stay open. Geese reopen 19 December to 10 January. Ducks close after 24 January. Geese open again 10 February to 10 March." font-family="sans-serif">
