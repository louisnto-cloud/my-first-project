<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: a small puffy cumulus cloud grows taller and taller through the afternoon until its top spreads into an anvil: a cumulonimbus thunderstorm cloud.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#e7f0f7" stroke="none" stroke-width="2"/><text x="14" y="26" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Puffy cloud growing tall: storm coming</text><rect x="0" y="270" width="400" height="30" rx="0" fill="#8a9a6b" stroke="none" stroke-width="2"/><g transform="translate(200 250)"><path d="M-70 0 C -80 -20, -50 -35, -30 -30 C -20 -55, 20 -55, 30 -30 C 55 -35, 80 -20, 70 0 Z" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"><animateTransform attributeName="transform" type="scale" values="1 1;1.1 1.8;1.15 2.9" keyTimes="0;.5;1" dur="7s" fill="freeze"/></path></g><path d="M120 95 L300 85 L262 108 L150 108 Z" fill="#d0d6dc" opacity="0"><animate attributeName="opacity" values="0;1" begin="6s" dur="1s" fill="freeze"/></path><g opacity="0"><animate attributeName="opacity" values="0;1" begin="6.5s" dur=".5s" fill="freeze"/><rect x="100" y="40" width="200" height="36" rx="8" fill="#ffffff" stroke="#c92a2a" stroke-width="2"/><text x="200" y="64" font-family="sans-serif" font-size="15" fill="#c92a2a" text-anchor="middle" font-weight="bold">Anvil: thunderstorm</text></g>
</svg>
