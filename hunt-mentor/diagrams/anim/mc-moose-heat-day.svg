<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation. On a hot day the sun is high. A moose leaves the open willow flat and walks into thick conifer shade to bed. Text: on a warm day moose bed in shade or stand in water.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
