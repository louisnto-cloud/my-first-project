<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation for MUs 3-28, 3-29 and 3-30 from 1 September to 10 December. The ATV is crossed out and stays home. A truck drives along an open road to the end of the road and stops. The hunter gets out and walks up a dashed path to a glassing seat on the ridge. Final label: truck to the end, then boots.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">West bank, 1 Sept to 10 Dec</text>
<path d="M0 230 L0 150 Q 120 120 220 140 Q 300 90 400 70 L400 230 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<path d="M0 232 H260" stroke="#6b4f35" stroke-width="10"/>
<text x="10" y="256" font-size="14" font-weight="bold" fill="#6b4f35">Open road</text>
<line x1="262" y1="214" x2="262" y2="250" stroke="#2f3a2b" stroke-width="3"/><rect x="262" y="214" width="62" height="20" fill="#e8590c"/><text x="293" y="229" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">END</text>
<path id="ld-atv-walk-path" d="M240 220 Q 280 190 300 160 T 350 96" fill="none" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="7 6"/>
<g fill="#2f3a2b"><polygon points="340,96 350,72 360,96"/><polygon points="356,92 366,68 376,92"/></g>
<text x="392" y="120" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">Glassing seat</text>
<g transform="translate(46 70)"><g transform="translate(0 0) scale(1.0)"><circle cx="-18" cy="10" r="9" fill="#2f3a2b"/><circle cx="18" cy="10" r="9" fill="#2f3a2b"/><path d="M-24 2 h48 l-6 -10 h-30 z" fill="#6b4f35"/><path d="M8 -8 l4 -8 h6" stroke="#2f3a2b" stroke-width="3" fill="none"/></g><circle cx="26" cy="-16" r="11" fill="#e8590c"/><path d="M21.6 -20.4 L30.4 -11.6 M30.4 -20.4 L21.6 -11.6" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></g>
<text x="16" y="112" font-size="14" font-weight="bold" fill="#e8590c">ATV stays home</text>
<g><g transform="translate(0 0) scale(1.2)"><path d="M-30 8 v-12 h28 v-10 h18 l10 10 h4 v12 z" fill="#4a7fb0"/><circle cx="-18" cy="10" r="6" fill="#2f3a2b"/><circle cx="18" cy="10" r="6" fill="#2f3a2b"/><rect x="0" y="-11" width="11" height="7" fill="#fff"/></g><animateTransform attributeName="transform" type="translate" from="-40 218" to="220 218" dur="3.5s" fill="freeze"/></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="3.5s" fill="freeze"/><g transform="translate(0 -10) scale(0.7)"><circle cx="0" cy="-12" r="8" fill="#2f3a2b"/><path d="M-12 20 v-16 q0 -8 12 -8 q12 0 12 8 v16 z" fill="#e8590c"/></g><animateMotion dur="4s" begin="3.5s" fill="freeze"><mpath href="#ld-atv-walk-path"/></animateMotion></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="7.5s" dur=".5s" fill="freeze"/><rect x="60" y="272" width="280" height="24" rx="8" fill="#2f3a2b"/><text x="200" y="289" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Truck to the end, then boots</text></g>
</svg>
