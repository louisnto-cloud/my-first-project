<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation, a tip. A herd of bison stands together. One bison walks out and away from the herd until it stands alone, broadside. A dashed line of fire appears from the hunter to the lone bison, with nothing behind it but empty ground. Message: within 100 metres, broadside, and stay ready after the shot." font-family="sans-serif">
