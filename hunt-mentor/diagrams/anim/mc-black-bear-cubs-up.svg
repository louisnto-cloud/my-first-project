"24" y="8" width="11" height="28" rx="5.5" fill="#3a2a1c"/><rect x="34" y="8" width="11" height="28" rx="5.5" fill="#3a2a1c"/><path d="M-46 6 Q-52 -28 -24 -30 Q0 -26 26 -22 Q46 -18 46 4 Q30 24 -30 22 Q-46 20 -46 6 Z" fill="#3a2a1c"/><path d="M40 -20 L62 -16 L78 -8 Q82 -2 76 0 L56 4 Q44 2 40 -20 Z" fill="#3a2a1c"/><path d="M48 -18 L50 -32 L56 -18 Z" fill="#3a2a1c"/><path d="M66 -10 L78 -8 Q82 -2 76 0 L64 -2 Z" fill="#8b6a4a"/><circle cx="60" cy="-12" r="1.8" fill="#eee"/></g><animateMotion path="M255 236 L304 236 L306 150" dur="2.5s" begin="1.3s" fill="freeze"/></g><g opacity="0"><text x="150" y="165" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">woof!</text><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" begin="0.3s" dur="2s" fill="freeze"/></g><g opacity="0"><rect x="10" y="262" width="380" height="32" rx="8" fill="#e8590c"/><text x="200" y="284" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Cubs in a tree mean: never shoot the sow.</text><animate attributeName="opacity" values="0;1" begin="4.2s" dur="0.5s" fill="freeze"/></g>
