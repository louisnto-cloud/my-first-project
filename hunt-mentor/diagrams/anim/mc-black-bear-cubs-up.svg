<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a black bear sow stands in the open. She gives an alarm woof and her two cubs run to a tree and climb it while she stays near the base. Cubs in a tree mean a sow is close: a bear under 2 years old, and any bear with it, is never legal.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
