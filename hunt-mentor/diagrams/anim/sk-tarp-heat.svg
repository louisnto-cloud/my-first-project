<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: two carcasses. Heat rises off the open carcass in the shade and escapes. On the carcass under a tarp the heat rises but stays trapped, and the tarp turns red. Open air cools meat, plastic and tarps hold heat in.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
