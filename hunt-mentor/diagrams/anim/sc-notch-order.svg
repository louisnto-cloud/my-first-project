<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="sans-serif" role="img" aria-label="Animation of the order after the kill. Step 1 lights up: notch the species licence, and orange notches appear on the card. Step 2: confirm the animal is dead with the eye touch. Step 3: only then the knife. Final message: licence first, before you touch it.">
<rect width="400" height="290" fill="#fffaf0"/>
<text x="200" y="27" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The order never changes</text>
<g opacity="0.25"><animate attributeName="opacity" values="0.25;1" begin="0.5s" dur="0.4s" fill="freeze"/><rect x="10" y="50" width="120" height="164" rx="10" fill="#f3ead8" stroke="#2f3a2b" stroke-width="2"/><circle cx="30.0" cy="70.0" r="13" fill="#e8590c" stroke="#fffaf0" stroke-width="1.5"/><text x="30" y="75" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">1</text><rect x="28" y="100" width="84" height="56" rx="4" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><rect x="28" y="100" width="84" height="13" fill="#e3eedc" stroke="#2f3a2b" stroke-width="1"/><text x="70" y="134" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Deer</text><path d="M44 144 h52" stroke="#2f3a2b" stroke-width="2" stroke-dasharray="2 2"/><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.2s" dur="0.3s" fill="freeze"/><path d="M56 100 L62 109 L68 100z" fill="#fffaf0" stroke="#e8590c" stroke-width="2.5"/><path d="M112 122 L103 128 L112 134z" fill="#fffaf0" stroke="#e8590c" stroke-width="2.5"/></g><text x="70" y="200" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Notch</text></g>
<g opacity="0.25"><animate attributeName="opacity" values="0.25;1" begin="2.8s" dur="0.4s" fill="freeze"/><rect x="140" y="50" width="120" height="164" rx="10" fill="#f3ead8" stroke="#2f3a2b" stroke-width="2"/><circle cx="160.0" cy="70.0" r="13" fill="#e8590c" stroke="#fffaf0" stroke-width="1.5"/><text x="160" y="75" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text><g transform="translate(194 134) scale(1.5)"><path d="M-16 0 C-8 -10 8 -10 16 0 C8 10 -8 10 -16 0z" fill="#fff" stroke="#2f3a2b" stroke-width="2.2"/><circle r="5.5" fill="#2f3a2b"/><circle cx="-1.8" cy="-1.8" r="1.6" fill="#fff"/></g><path d="M244 92 L208 130" stroke="#7a5230" stroke-width="5" stroke-linecap="round"/><text x="200" y="200" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Confirm dead</text></g>
<g opacity="0.25"><animate attributeName="opacity" values="0.25;1" begin="5.0s" dur="0.4s" fill="freeze"/><rect x="270" y="50" width="120" height="164" rx="10" fill="#f3ead8" stroke="#2f3a2b" stroke-width="2"/><circle cx="290.0" cy="70.0" r="13" fill="#e8590c" stroke="#fffaf0" stroke-width="1.5"/><text x="290" y="75" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">3</text><g transform="translate(330 128) rotate(-35)"><path d="M-44 -2 C-20 -10 6 -8 14 -6 L14 6 C-8 6 -30 6 -44 -2z" fill="#c9ccc6" stroke="#2f3a2b" stroke-width="1.6"/><path d="M-40 -2 C-20 -6 0 -6 12 -4" stroke="#fff" stroke-width="1.5" fill="none"/><rect x="14" y="-7" width="5" height="14" rx="1" fill="#2f3a2b"/><rect x="19" y="-6" width="34" height="12" rx="5" fill="#6b4f35"/></g><text x="330" y="200" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Knife</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.4s" dur="0.3s" fill="freeze"/><path d="M140.0 132.0 L129.0 126.0 L129.0 138.1z" fill="#e8590c"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.6s" dur="0.3s" fill="freeze"/><path d="M270.0 132.0 L259.0 126.0 L259.0 138.1z" fill="#e8590c"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="6.2s" dur="0.5s" fill="freeze"/><rect x="8" y="232" width="384" height="37" rx="8" fill="#2f3a2b"/><text x="200" y="256.4" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">Licence first, before you touch it</text></g>
</svg>
