<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation of the order after the kill. Step 1 lights up: notch the species licence, and orange notches appear on the card. Step 2: confirm the animal is dead with the eye touch. Step 3: only then the knife. Final message: licence first, before you touch it." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">The order never changes</text>
<g opacity="0.25"><animate attributeName="opacity" values="0.25;1" begin="0.5s" dur="0.4s" fill="freeze"/><rect x="18" y="70" width="116" height="150" rx="10" fill="#f3ead8" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(76 140)"><g transform="translate(0 0) scale(1.0)"><rect x="-40" y="-26" width="80" height="52" rx="4" fill="#ffffff" stroke="#23261f" stroke-width="2"/><rect x="-40" y="-26" width="80" height="12" fill="#f1ead8" stroke="#23261f" stroke-width="1"/><text x="0" y="8" font-size="13" fill="#23261f" text-anchor="middle" font-weight="bold">Deer</text><path d="M-24 14 h48" stroke="#23261f" stroke-width="2" stroke-dasharray="2 2"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.2s" dur="0.3s" fill="freeze"/><path d="M-14 -26 L-8 -18 L-2 -26 Z" fill="#fffaf0" stroke="#e8590c" stroke-width="2.5"/><path d="M40 -6 L32 0 L40 6 Z" fill="#fffaf0" stroke="#e8590c" stroke-width="2.5"/></g></g><text x="76" y="206" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">1 Notch</text></g>
<g opacity="0.25"><animate attributeName="opacity" values="0.25;1" begin="2.8s" dur="0.4s" fill="freeze"/><rect x="142" y="70" width="116" height="150" rx="10" fill="#f3ead8" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(200 140)"><ellipse cx="0" cy="0" rx="26" ry="16" fill="#ffffff" stroke="#23261f" stroke-width="2"/><circle cx="0" cy="0" r="9" fill="#23261f"/><path d="M50,-40 L10,-6" stroke="#5c3b1c" stroke-width="5" stroke-linecap="round"/></g><text x="200" y="206" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">2 Confirm dead</text></g>
<g opacity="0.25"><animate attributeName="opacity" values="0.25;1" begin="5.0s" dur="0.4s" fill="freeze"/><rect x="266" y="70" width="116" height="150" rx="10" fill="#f3ead8" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(330 140)"><path d="M-30,10 L10,-20 L18,-14 L-22,16 Z" fill="#c0c0c0" stroke="#23261f"/><rect x="14" y="-22" width="22" height="10" rx="3" transform="rotate(-37 14 -22)" fill="#5c3b1c"/></g><text x="324" y="206" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">3 Knife</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.4s" dur="0.3s" fill="freeze"/><line x1="134" y1="145" x2="133.0" y2="145.0" stroke="#e8590c" stroke-width="3"/><polygon points="142,145 133.0,140.1 133.0,149.9" fill="#e8590c"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.6s" dur="0.3s" fill="freeze"/><line x1="258" y1="145" x2="257.0" y2="145.0" stroke="#e8590c" stroke-width="3"/><polygon points="266,145 257.0,140.1 257.0,149.9" fill="#e8590c"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="6.2s" dur="0.5s" fill="freeze"/><rect x="40" y="238" width="320" height="48" rx="10" fill="#2f3a2b"/><text x="200" y="268" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">Licence first, before you touch it</text></g>
</svg>
