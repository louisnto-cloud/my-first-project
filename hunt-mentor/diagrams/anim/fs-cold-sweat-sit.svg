<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a hunter climbs a ridge and sweats. At the top he sits still to glass in damp clothes. A thermometer falls. Lesson: vent on the climb and put the puffy on as soon as you stop.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The hunter cold trap</text><path d="M0 250 L160 120 L400 120" fill="#dfe6d3"/><rect x="0" y="250" width="400" height="50" rx="0" fill="#dfe6d3"/><path d="M0 250 L160 120 L400 120 L400 300 L0 300 Z" fill="#dfe6d3"/><g><animateMotion path="M30 250 L150 128 L260 120" dur="3s" fill="freeze"/><line x1="-6" y1="0" x2="-3" y2="-24" stroke="#2f3a2b" stroke-width="5.6000000000000005" stroke-linecap="round"/><line x1="6" y1="0" x2="3" y2="-24" stroke="#2f3a2b" stroke-width="5.6000000000000005" stroke-linecap="round"/><rect x="-9" y="-46" width="18" height="25" rx="4.800000000000001" fill="#e8590c"/><line x1="-8" y1="-42" x2="-14" y2="-25" stroke="#2f3a2b" stroke-width="4.800000000000001" stroke-linecap="round"/><line x1="8" y1="-42" x2="14" y2="-25" stroke="#2f3a2b" stroke-width="4.800000000000001" stroke-linecap="round"/><circle cx="0" cy="-53" r="8.0" fill="#d9b48f"/></g><rect x="340" y="50" width="24" height="140" rx="12" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><circle cx="352" cy="196" r="18.0" fill="#c0392b"/><rect x="346" y="70" width="12" height="120" fill="#c0392b"><animate attributeName="y" values="70;70;150" keyTimes="0;0.45;1" dur="7s" fill="freeze"/><animate attributeName="height" values="120;120;40" keyTimes="0;0.45;1" dur="7s" fill="freeze"/></rect><circle cx="120" cy="150" r="4" fill="#4a7fb0" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="0.5s" dur="1s"/></circle><circle cx="150" cy="150" r="4" fill="#4a7fb0" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="1.0s" dur="1s"/></circle><circle cx="180" cy="150" r="4" fill="#4a7fb0" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="1.5s" dur="1s"/></circle><circle cx="210" cy="150" r="4" fill="#4a7fb0" opacity="0"><animate attributeName="opacity" values="0;1;0" begin="2.0s" dur="1s"/></circle><g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.100;0.900;1" begin="0.2s" dur="2.8s" fill="freeze"/><text x="110" y="80" font-size="16" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Climb: sweat</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.2s" dur="0.4s" fill="freeze"/><text x="200" y="62" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Sit to glass: wet and still</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="6.2s" dur="0.4s" fill="freeze"/><rect x="7" y="262" width="387" height="30" rx="6" fill="#2f3a2b"/><text x="200" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Vent on the climb. Puffy on when you stop</text></g>
</svg>
