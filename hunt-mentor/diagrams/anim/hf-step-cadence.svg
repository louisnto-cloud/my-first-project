<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation of still hunting cadence, top view. The hunter takes 3 slow steps, then stops and scans left and right for 20 seconds or more. Then 3 more steps and another long stop. Look much more than you walk.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect width="400" height="300" fill="#dfe6d3" opacity=".5"/>
  <g fill="#2f3a2b" opacity=".8"><polygon points="60,90 72,58 84,90"/><polygon points="200,70 212,38 224,70"/><polygon points="330,100 342,68 354,100"/><polygon points="120,270 132,238 144,270"/><polygon points="280,262 292,230 304,262"/></g>
  <g fill="#8b5a2b">
    <ellipse cx="50" cy="160" rx="10" ry="6" opacity="0"><set attributeName="opacity" to="1" begin="0.3s" fill="freeze"/></ellipse>
    <ellipse cx="95" cy="180" rx="10" ry="6" opacity="0"><set attributeName="opacity" to="1" begin="0.9s" fill="freeze"/></ellipse>
    <ellipse cx="140" cy="160" rx="10" ry="6" opacity="0"><set attributeName="opacity" to="1" begin="1.5s" fill="freeze"/></ellipse>
    <ellipse cx="185" cy="180" rx="10" ry="6" opacity="0"><set attributeName="opacity" to="1" begin="5.0s" fill="freeze"/></ellipse>
    <ellipse cx="230" cy="160" rx="10" ry="6" opacity="0"><set attributeName="opacity" to="1" begin="5.6s" fill="freeze"/></ellipse>
    <ellipse cx="275" cy="180" rx="10" ry="6" opacity="0"><set attributeName="opacity" to="1" begin="6.2s" fill="freeze"/></ellipse>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="20 170;50 170;95 170;140 170;140 170;185 170;230 170;275 170;275 170" keyTimes="0;0.03;0.09;0.15;0.5;0.53;0.59;0.65;1" dur="10s" fill="freeze"/>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0;1;1" keyTimes="0;0.16;0.17;0.48;0.49;0.66;0.67;1" dur="10s" fill="freeze"/>
      <path d="M0 0 L90 -45 A 100 100 0 0 1 90 45 Z" fill="#e8590c" opacity=".2">
        <animateTransform attributeName="transform" type="rotate" values="-50;50;-50;50;0" dur="3s" begin="1.7s" fill="freeze"/><animateTransform attributeName="transform" type="rotate" values="0;-50;50;-50;0" dur="3s" begin="6.7s" fill="freeze"/>
      </path>
    </g>
    <circle r="11" fill="#e8590c"/>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0;1;1" keyTimes="0;0.16;0.17;0.48;0.49;0.66;0.67;1" dur="10s" fill="freeze"/>
    <rect x="110" y="16" width="180" height="34" rx="8" fill="#2f3a2b"/>
    <text x="200" y="39" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">STOP. Look 20 s +</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" values="1;1;0;0;1;1;0;0" keyTimes="0;0.16;0.17;0.48;0.49;0.66;0.67;1" dur="10s" fill="freeze"/>
    <text x="200" y="39" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">2 or 3 slow steps</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="9s" dur=".5s" fill="freeze"/>
    <rect x="60" y="230" width="280" height="34" rx="8" fill="#e8590c"/>
    <text x="200" y="253" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Look much more than you walk</text>
  </g>
</svg>
