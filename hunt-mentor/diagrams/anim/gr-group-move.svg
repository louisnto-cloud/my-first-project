<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: three shots land low and left at 100 metres. The group centre is marked. You turn 8 clicks up and 4 clicks right. The next 3 shot group lands on the bullseye. Zeroed.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect x="70" y="10" width="260" height="250" fill="#fff" stroke="#2f3a2b" stroke-width="2"/>
  <circle cx="200" cy="110" r="70" fill="none" stroke="#2f3a2b" stroke-width="2"/><circle cx="200" cy="110" r="40" fill="none" stroke="#2f3a2b" stroke-width="2"/><circle cx="200" cy="110" r="10" fill="#e8590c"/>
  <g fill="#2f3a2b">
    <circle cx="134" cy="226" r="6" opacity="0"><set attributeName="opacity" to="1" begin=".5s" fill="freeze"/></circle>
    <circle cx="146" cy="236" r="6" opacity="0"><set attributeName="opacity" to="1" begin="1s" fill="freeze"/></circle>
    <circle cx="140" cy="214" r="6" opacity="0"><set attributeName="opacity" to="1" begin="1.5s" fill="freeze"/></circle>
  </g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="2s" fill="freeze"/>
    <path d="M132 226 h16 M140 218 v16" stroke="#e8590c" stroke-width="3"/>
    <path d="M140 210 V116 M132 126 l8 -10 l8 10 M146 110 H186 M176 102 l10 8 l-10 8" stroke="#e8590c" stroke-width="3" fill="none" stroke-dasharray="6 4"/>
  </g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="2.6s" fill="freeze"/>
    <rect x="70" y="266" width="260" height="30" rx="6" fill="#e8590c"/><text x="200" y="287" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">8 clicks UP, 4 clicks R</text>
  </g>
  <g fill="#4a7fb0" opacity="0">
    <set attributeName="opacity" to="1" begin="4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="-60 116;0 0" begin="4s" dur="1.5s" fill="freeze"/>
    <circle cx="194" cy="110" r="6"/><circle cx="206" cy="120" r="6"/><circle cx="200" cy="98" r="6"/>
  </g>
  <g opacity="0"><set attributeName="opacity" to="1" begin="6s" fill="freeze"/>
    <rect x="250" y="20" width="76" height="30" rx="6" fill="#2f3a2b"/><text x="288" y="41" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Zeroed</text>
  </g>
  <text x="20" y="40" font-size="14" font-weight="bold" fill="#2f3a2b">100 m</text>
  <text x="20" y="60" font-size="14" fill="#2f3a2b">1st</text><circle cx="30" cy="74" r="6" fill="#2f3a2b"/>
  <text x="20" y="100" font-size="14" fill="#2f3a2b">2nd</text><circle cx="30" cy="114" r="6" fill="#4a7fb0"/>
</svg>
