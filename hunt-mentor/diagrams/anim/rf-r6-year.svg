<g><line x1="14" y1="44" x2="14" y2="286" stroke="#c92a2a" stroke-width="3"/><circle cx="14" cy="290" r="6" fill="#c92a2a"/><animateTransform attributeName="transform" type="translate" from="0 0" to="372 0" begin="0s" dur="10.0s" fill="freeze"/></g>
<text x="200" y="316" font-size="14" fill="#23261f" text-anchor="middle">Red line: today. A bar lights up when it is open.</text>
<text x="200" y="336" font-size="14" fill="#6b6f66" text-anchor="middle">At the end every season shows.</text>
</svg>
