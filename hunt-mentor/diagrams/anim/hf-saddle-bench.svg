<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation on a contour map. A deer comes over the ridge at the saddle, the low point between two peaks, walks down the slope and stops on a bench, a flat step with wide spaced lines. It beds there with a view of the slope below. Saddles are crossings, benches are beds.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect x="0" y="0" width="400" height="300" fill="#dfe6d3" opacity=".5"/>
  <path d="M0 150 C 120 144, 280 156, 400 150 L400 205 C 280 212, 120 200, 0 206 Z" fill="#e8590c" opacity=".15"/>
  <g fill="none" stroke="#8b5a2b" stroke-width="2">
    <ellipse cx="100" cy="60" rx="26" ry="18"/><ellipse cx="300" cy="60" rx="26" ry="18"/>
    <path d="M200 50 C 170 20, 50 12, 50 60 C 50 108, 170 100, 200 74 C 230 100, 350 108, 350 60 C 350 12, 230 20, 200 50 Z"/>
    <path d="M0 110 C 100 118, 300 118, 400 110"/><path d="M0 128 C 100 134, 300 134, 400 128"/><path d="M0 150 C 120 144, 280 156, 400 150"/>
    <path d="M0 206 C 120 200, 280 212, 400 205"/><path d="M0 222 C 120 216, 280 228, 400 221"/><path d="M0 238 C 120 232, 280 244, 400 237"/>
  </g>
  <path d="M0 278 C 120 270, 280 286, 400 276" fill="none" stroke="#4a7fb0" stroke-width="4"/>
  <text x="100" y="65" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Peak</text>
  <text x="300" y="65" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Peak</text>
  <text x="214" y="98" font-size="14" font-weight="bold" fill="#e8590c">Saddle</text>
  <text x="330" y="185" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Bench</text>
  <text x="300" y="296" font-size="14" fill="#4a7fb0">creek</text>
  <path id="hf-saddle-bench-path" d="M200 6 C 200 40, 196 60, 200 80 S 210 130, 180 160 S 140 176, 130 178" fill="none" stroke="#8b5a2b" stroke-width="2" stroke-dasharray="3 6"/>
  <g>
    <ellipse rx="14" ry="7" fill="#8b5a2b"/><circle cx="0" cy="-12" r="6" fill="#8b5a2b"/>
    <path d="M-3 -17 l-4 -7 M3 -17 l4 -7" stroke="#5c3b1c" stroke-width="2"/>
    <animateMotion dur="7s" fill="freeze" calcMode="linear"><mpath href="#hf-saddle-bench-path"/></animateMotion>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.6s" dur=".4s" fill="freeze"/>
    <rect x="8" y="4" width="170" height="26" rx="6" fill="#2f3a2b"/>
    <text x="93" y="22" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Crosses at the saddle</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="7s" dur=".5s" fill="freeze"/>
    <rect x="20" y="222" width="190" height="28" rx="6" fill="#2f3a2b"/>
    <text x="115" y="241" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Beds on the bench (Tip)</text>
  </g>
</svg>
