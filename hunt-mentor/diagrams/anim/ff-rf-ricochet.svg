<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 302" font-family="sans-serif" role="img" aria-label="Animation: a .22 bullet fired at a low angle hits water, skips and keeps flying up and away. A .22 can carry over 1 km. Shoot into earth, never at water, rock or flat hard ground.">
<rect width="400" height="302" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Rimfire bullets skip and travel far</text>
<rect x="8" y="40" width="384" height="206" rx="6" fill="#e6eef4"/>
<rect x="8" y="200" width="384" height="46" fill="#9cc0df"/><path d="M8 200 H392" stroke="#4a7fb0" stroke-width="2"/>
<path d="M8 160 C30 158 52 162 70 170 L82 200 V246 H8z" fill="#c9b79c"/>
<g transform="translate(36 162) scale(0.8 0.8)"><path d="M-5 -20 L-6 0 M4 -20 L6 0" stroke="#4a4136" stroke-width="5" stroke-linecap="round"/><path d="M-8 -40 C-8 -44 8 -44 8 -40 L7 -19 H-7z" fill="#e8590c"/><circle cx="0" cy="-47" r="5.5" fill="#e0b48c"/><path d="M-6 -49 C-6 -56 6 -56 6 -49z" fill="#e8590c"/><path d="M4 -36 L22 -42" stroke="#3b2a1a" stroke-width="2.6" stroke-linecap="round"/><path d="M4 -36 L10 -31" stroke="#e0b48c" stroke-width="3" stroke-linecap="round"/></g>
<path id="ff-rf-ricochet-p" d="M54 132 L180 200 L384 118" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 5"/>
<circle r="5" fill="#e8590c"><animateMotion dur="3s" fill="freeze"><mpath href="#ff-rf-ricochet-p"/></animateMotion></circle>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.2s" dur="0.5s" fill="freeze"/><path d="M168 200 q12 -10 24 0" stroke="#fffaf0" stroke-width="2" fill="none"/><text x="180" y="230" font-size="16" font-weight="bold" fill="#2c5d86" text-anchor="middle">skips off water</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.4s" dur="0.5s" fill="freeze"/><rect x="172" y="54" width="208" height="34" rx="17" fill="#b3261e"/><text x="276" y="77" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Can carry over 1 km</text></g>
<text x="200" y="272" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Shoot into earth.</text>
<text x="200" y="292" font-size="15" fill="#2f3a2b" text-anchor="middle">Never at water, rock or flat ground.</text>
</svg>
