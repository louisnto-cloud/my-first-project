<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a .22 bullet fired at a low angle hits water, skips and keeps flying up and away. A .22 can carry over 1 km. Shoot into earth, never at water, rock or flat hard ground.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Rimfire bullets skip and travel far</text><rect x="0" y="200" width="400" height="100" rx="0" fill="#cfe0ee" stroke="none" stroke-width="2"/><path id="ff-rf-ricochet-p" d="M20 150 L180 205 L400 120" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 5"/><circle r="5" fill="#e8590c"><animateMotion dur="3s" fill="freeze"><mpath href="#ff-rf-ricochet-p"/></animateMotion></circle><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.2s" dur="0.5s" fill="freeze"/><text x="180" y="236" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">skips off water</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.4s" dur="0.5s" fill="freeze"/><rect x="170" y="60" width="210" height="32" rx="16.0" fill="#b3261e" stroke="none" stroke-width="2"/><text x="275.0" y="80.9" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Can carry over 1 km</text></g><text x="200.0" y="288" font-size="13" fill="#2f3a2b" text-anchor="middle">Shoot into earth. Never at water, rock or flat ground.</text>
</svg>
