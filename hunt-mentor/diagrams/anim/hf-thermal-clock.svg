<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation of one day on a slope. The sun rises and crosses the sky. In the morning the sun warms the slope and blue arrows show air rising uphill. Near sunset the air swirls as the thermals switch. In the evening the slope cools and the arrows flow downhill. Morning: be above the deer. Evening: be below."><rect width="400" height="300" fill="#fdf1d6"><animate attributeName="fill" values="#fdf1d6;#fffaf0;#e9dfcf" dur="9s" fill="freeze"/></rect><g><circle r="16" fill="#e8590c"/><animateMotion dur="9s" fill="freeze" keyPoints="0;0.8;1" keyTimes="0;0.4;1" calcMode="linear" path="M40 150 Q 200 -40 380 150"/><animate attributeName="opacity" values="1;1;0.5" keyTimes="0;0.7;1" dur="9s" fill="freeze"/></g><path d="M0 270 L300 90 L400 90 L400 300 L0 300 Z" fill="#8a9a6b"/><g fill="#2f3a2b"><polygon points="320,90 330,60 340,90"/><polygon points="350,90 360,56 370,90"/></g><g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.31;0.33;1" dur="9s" fill="freeze"/><g><path d="M27.7 225.4 L68.8 200.7 M61.6 212.0 L68.8 200.7 L55.4 201.8" stroke="#4a7fb0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M117.7 171.4 L158.8 146.7 M151.6 158.0 L158.8 146.7 L145.4 147.8" stroke="#4a7fb0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M207.7 117.4 L248.8 92.7 M241.6 104.0 L248.8 92.7 L235.4 93.8" stroke="#4a7fb0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><animateTransform attributeName="transform" type="translate" values="0 0;22.3 -13.4" dur="1.5s" repeatCount="indefinite"/></g><text x="12" y="30" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Morning: sun warms the slope</text><text x="12" y="52" font-size="16" font-weight="bold" fill="#4a7fb0" text-anchor="start">Air rises UPHILL</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.33;0.65;0.67;1" dur="9s" fill="freeze"/><g stroke="#4a7fb0" stroke-width="4" fill="none" stroke-linecap="round"><path d="M90 200 c 20 -30, 50 -10, 30 10 c -15 15, -30 -5, -15 -15"/><path d="M200 140 c -20 -30, -50 -10, -30 10 c 15 15, 30 -5, 15 -15"/></g><text x="12" y="30" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Near sunset: the switch</text><text x="12" y="52" font-size="16" font-weight="bold" fill="#4a7fb0" text-anchor="start">Air swirls, mixed</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.65;0.67;1" dur="9s" fill="freeze"/><g><path d="M68.8 200.7 L27.7 225.4 M41.0 224.4 L27.7 225.4 L34.9 214.1" stroke="#4a7fb0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M158.8 146.7 L117.7 171.4 M131.0 170.4 L117.7 171.4 L124.9 160.1" stroke="#4a7fb0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M248.8 92.7 L207.7 117.4 M221.0 116.4 L207.7 117.4 L214.9 106.1" stroke="#4a7fb0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><animateTransform attributeName="transform" type="translate" values="0 0;-22.3 13.4" dur="1.5s" repeatCount="indefinite"/></g><text x="12" y="30" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Evening: slope cools</text><text x="12" y="52" font-size="16" font-weight="bold" fill="#4a7fb0" text-anchor="start">Air sinks DOWNHILL</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.65;0.67;1" dur="9s" fill="freeze"/><rect x="190" y="230" width="200" height="56" rx="8" fill="#2f3a2b"/><text x="290" y="254" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Morning: be above</text><text x="290" y="274" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Evening: be below</text></g></svg>
