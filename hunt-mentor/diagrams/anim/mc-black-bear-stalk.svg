<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation of a stalk on a feeding black bear in a berry patch, with the wind blowing from the bear toward the hunter. The bear lifts its head and lowers it to feed several times. The hunter moves only while the head is down, freezes when it comes up, and ends behind a rock in range. Tip from hunting educators.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#dfe6d3" opacity=".5"/><text x="200" y="24" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Move when the head is down</text><g transform="translate(250 104) scale(1.4)"><ellipse cx="0" cy="0" rx="26" ry="16" fill="#8a9a6b"/><circle cx="-12" cy="-4" r="2.6" fill="#e8590c"/><circle cx="-2" cy="-9" r="2.6" fill="#e8590c"/><circle cx="8" cy="-2" r="2.6" fill="#e8590c"/><circle cx="14" cy="-8" r="2.6" fill="#e8590c"/><circle cx="-16" cy="4" r="2.6" fill="#e8590c"/><circle cx="4" cy="5" r="2.6" fill="#e8590c"/></g><g transform="translate(320 96) scale(1.1)"><ellipse cx="0" cy="0" rx="26" ry="16" fill="#8a9a6b"/><circle cx="-12" cy="-4" r="2.6" fill="#e8590c"/><circle cx="-2" cy="-9" r="2.6" fill="#e8590c"/><circle cx="8" cy="-2" r="2.6" fill="#e8590c"/><circle cx="14" cy="-8" r="2.6" fill="#e8590c"/><circle cx="-16" cy="4" r="2.6" fill="#e8590c"/><circle cx="4" cy="5" r="2.6" fill="#e8590c"/></g><g transform="translate(190 96) scale(0.9)"><ellipse cx="0" cy="0" rx="26" ry="16" fill="#8a9a6b"/><circle cx="-12" cy="-4" r="2.6" fill="#e8590c"/><circle cx="-2" cy="-9" r="2.6" fill="#e8590c"/><circle cx="8" cy="-2" r="2.6" fill="#e8590c"/><circle cx="14" cy="-8" r="2.6" fill="#e8590c"/><circle cx="-16" cy="4" r="2.6" fill="#e8590c"/><circle cx="4" cy="5" r="2.6" fill="#e8590c"/></g><g stroke="#4a7fb0" stroke-width="3" fill="none"><path d="M100 40 h-40 m8 -6 l-8 6 l8 6 M100 60 h-40 m8 -6 l-8 6 l8 6"/></g><text x="60" y="84" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="start">Wind</text><g transform="translate(275 110)"><g><g transform="translate(0 0) scale(-0.75 0.75)"><rect x="-38" y="8" width="11" height="28" rx="5.5" fill="#1d1d1b"/><rect x="-26" y="8" width="11" height="28" rx="5.5" fill="#1d1d1b"/><rect x="24" y="8" width="11" height="28" rx="5.5" fill="#1d1d1b"/><rect x="34" y="8" width="11" height="28" rx="5.5" fill="#1d1d1b"/><path d="M-46 6 Q-52 -28 -24 -30 Q0 -26 26 -22 Q46 -18 46 4 Q30 24 -30 22 Q-46 20 -46 6 Z" fill="#1d1d1b"/><path d="M40 -20 L62 -16 L78 -8 Q82 -2 76 0 L56 4 Q44 2 40 -20 Z" fill="#1d1d1b"/><path d="M48 -18 L50 -32 L56 -18 Z" fill="#1d1d1b"/><path d="M66 -10 L78 -8 Q82 -2 76 0 L64 -2 Z" fill="#8b6a4a"/><circle cx="60" cy="-12" r="1.8" fill="#eee"/></g><animateTransform attributeName="transform" type="rotate" values="12;12;0;0;12;12;0;0;12;12" keyTimes="0;0.18;0.22;0.38;0.42;0.6;0.64;0.8;0.84;1" dur="10s" fill="freeze"/></g></g><g><rect x="105" y="196" width="54" height="34" rx="12" fill="#6b4f35"/></g><text x="132" y="250" font-size="14" font-weight="bold" fill="#6b4f35" text-anchor="middle">Rock</text><path id="mc-black-bear-stalk-path" d="M30 285 L70 260 L100 240 L130 222" fill="none" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="6 5"/><g><circle cx="0" cy="0" r="9" fill="#e8590c"/><animateMotion dur="10s" fill="freeze" keyPoints="0;0;0.33;0.33;0.66;0.66;1;1" keyTimes="0;0.2;0.38;0.6;0.62;0.82;0.84;1" calcMode="linear"><mpath href="#mc-black-bear-stalk-path"/></animateMotion></g><g opacity="0"><rect x="180" y="248" width="210" height="44" rx="8" fill="#2f3a2b"/><text x="285" y="267" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Head up: freeze.</text><text x="285" y="285" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Head down: move.</text><animate attributeName="opacity" values="0;1" begin="1.5s" dur="0.5s" fill="freeze"/></g>
</svg>
