<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-label="Animation. A grouse flushes and climbs away to the right. The gun bead starts behind the bird, mounts on it, swings through past the beak, and the shot goes off with the gun still moving. Only shoot with sky behind the bird and nobody in front." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="290" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Flush shot: swing through</text>
<rect x="0" y="220" width="400" height="80" fill="#dfe6d3"/>
<rect x="37" y="182" width="6" height="42" fill="#d8d2c4" stroke="#6b4f35" stroke-width="1"/><ellipse cx="40" cy="164" rx="27" ry="31" fill="#e9c46a"/>
<rect x="357" y="182" width="6" height="42" fill="#d8d2c4" stroke="#6b4f35" stroke-width="1"/><ellipse cx="360" cy="164" rx="27" ry="31" fill="#e9c46a"/>
<path id="mgr-flush-swing-p" d="M80 220 Q180 120 360 70" fill="none" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="4 6"/>
<g><g transform="translate(0 0) scale(0.5 0.5)"><polygon points="-20,-6 -38,-20 -48,-12 -52,0 -48,8 -20,8" fill="#6b4f35"/><path d="M-40 -18 Q-50 -10 -48 6" fill="none" stroke="#23261f" stroke-width="3"/><ellipse cx="0" cy="0" rx="26" ry="15" fill="#9a6b45"/><circle cx="21" cy="-14" r="8" fill="#9a6b45"/><polygon points="16,-20 20,-28 25,-20" fill="#9a6b45"/><polygon points="28,-16 35,-13 28,-10" fill="#6b4f35"/><circle cx="23" cy="-16" r="1.8" fill="#23261f"/><path d="M2 13 l-2 11 M10 13 l2 11" stroke="#6b4f35" stroke-width="2.5" fill="none"/></g><animateMotion dur="4s" fill="freeze" keyPoints="0;0.62" keyTimes="0;1" calcMode="linear"><mpath href="#mgr-flush-swing-p"/></animateMotion></g>
<g><circle r="7" fill="none" stroke="#23261f" stroke-width="3"/><line x1="-12" y1="0" x2="12" y2="0" stroke="#23261f" stroke-width="2"/><animateMotion dur="4s" fill="freeze" keyPoints="0;0.68" keyTimes="0;1" calcMode="linear" begin="0.4s"><mpath href="#mgr-flush-swing-p"/></animateMotion></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="0.2s"/><set attributeName="opacity" to="0" begin="2s"/><text x="200" y="60" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Mount on the bird, from behind</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="2s"/><set attributeName="opacity" to="0" begin="3.6s"/><text x="200" y="60" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Swing through, past the beak</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="4.4s" fill="freeze"/><rect x="60" y="42" width="280" height="30" rx="8" fill="#2f3a2b" stroke="none" stroke-width="0"/><text x="200" y="63" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Shoot, keep the gun moving</text></g>
<text x="200" y="270" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Sky behind the bird, nobody in front.</text>
</svg>
