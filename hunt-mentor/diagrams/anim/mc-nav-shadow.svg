<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a stick casts a shadow. Over about 15 minutes the shadow tip moves; the first mark is west and the second is east. Shadows move clockwise in the northern hemisphere. Rough check only, 60 percent.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">The shadow tip moves east</text><rect x="20" y="50" width="360" height="210" rx="6" fill="#dfe6d3"/><circle cx="60" cy="236" r="11" fill="#f4b400"/><line x1="75.0" y1="236.0" x2="81.0" y2="236.0" stroke="#f4b400" stroke-width="3" stroke-linecap="round"/><line x1="70.60660171779821" y1="246.6066017177982" x2="74.8492424049175" y2="250.8492424049175" stroke="#f4b400" stroke-width="3" stroke-linecap="round"/><line x1="60.0" y1="251.0" x2="60.0" y2="257.0" stroke="#f4b400" stroke-width="3" stroke-linecap="round"/><line x1="49.39339828220179" y1="246.6066017177982" x2="45.1507575950825" y2="250.8492424049175" stroke="#f4b400" stroke-width="3" stroke-linecap="round"/><line x1="45.0" y1="236.0" x2="39.0" y2="236.0" stroke="#f4b400" stroke-width="3" stroke-linecap="round"/><line x1="49.39339828220179" y1="225.3933982822018" x2="45.150757595082496" y2="221.1507575950825" stroke="#f4b400" stroke-width="3" stroke-linecap="round"/><line x1="60.0" y1="221.0" x2="59.99999999999999" y2="215.0" stroke="#f4b400" stroke-width="3" stroke-linecap="round"/><line x1="70.60660171779821" y1="225.3933982822018" x2="74.84924240491749" y2="221.1507575950825" stroke="#f4b400" stroke-width="3" stroke-linecap="round"/><line x1="200" y1="240" x2="200" y2="170" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/><line x1="200" y1="240" x2="150" y2="110" stroke="#868e96" stroke-width="6" stroke-linecap="round"><animate attributeName="x2" values="150;250" begin="1s" dur="4s" fill="freeze"/></line><circle cx="150" cy="110" r="7" fill="#e8590c"/><text x="150" y="92" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">W</text><g opacity="0"><animate attributeName="opacity" values="0;1" begin="5s" dur="0.5s" fill="freeze"/><circle cx="250" cy="110" r="7" fill="#2f3a2b"/><text x="250" y="92" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">E</text><line x1="150" y1="110" x2="250" y2="110" stroke="#23261f" stroke-width="3" stroke-linecap="round"/><text x="200" y="284" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Tip moves west to east. North is up the page.</text></g>
</svg>
