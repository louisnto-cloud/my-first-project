<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 372" font-family="sans-serif" role="img" aria-label="Animation, side view of a ponderosa pine stand. A low ground fire sweeps from left to right through the grass, flames under 1 m (a Tip, not measured). The small young fir trees die and disappear. The big old thick barked pines survive with only a scorched base. Final label: old thick bark pines live, small trees and brush die, so the forest stays open.">
