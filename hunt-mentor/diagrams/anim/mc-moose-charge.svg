<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation. A cow moose charges at a hunter. The hunter runs and puts a tree between them. The moose stops short at the tree. Text: run, put a tree between you; many charges are bluffs, and moose do not chase far, says Alaska Department of Fish and Game.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
