<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation of the firing chain in six steps, one after another: 1 the trigger is pressed, 2 the sear lets go, 3 the firing pin springs forward, 4 it hits the primer, 5 the primer lights the powder and the gas builds, 6 the bullet leaves the muzzle. The whole chain takes a few thousandths of a second.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">From finger to muzzle in a blink</text><g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.5s" fill="freeze"/><circle cx="40" cy="130" r="26" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2"/><text x="40" y="136" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">1</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.5s" fill="freeze"/><text x="40" y="182" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Trigger</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.1s" dur="0.5s" fill="freeze"/><circle cx="105" cy="130" r="26" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2"/><text x="105" y="136" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">2</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.1s" dur="0.5s" fill="freeze"/><text x="105" y="92" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Sear lets go</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.5s" fill="freeze"/><line x1="68" y1="130" x2="75" y2="130" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><path d="M67.8 133.5 L75 130 L67.8 126.5" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.9000000000000001s" dur="0.5s" fill="freeze"/><circle cx="175" cy="130" r="26" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2"/><text x="175" y="136" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">3</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.9000000000000001s" dur="0.5s" fill="freeze"/><text x="175" y="182" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Firing pin</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.7000000000000002s" dur="0.5s" fill="freeze"/><line x1="133" y1="130" x2="145" y2="130" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><path d="M137.8 133.5 L145 130 L137.8 126.5" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.7s" dur="0.5s" fill="freeze"/><circle cx="240" cy="130" r="26" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2"/><text x="240" y="136" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">4</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.7s" dur="0.5s" fill="freeze"/><text x="240" y="92" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Primer</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.5000000000000004s" dur="0.5s" fill="freeze"/><line x1="203" y1="130" x2="210" y2="130" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><path d="M202.8 133.5 L210 130 L202.8 126.5" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.5s" dur="0.5s" fill="freeze"/><circle cx="305" cy="130" r="26" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2"/><text x="305" y="136" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">5</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.5s" dur="0.5s" fill="freeze"/><text x="305" y="182" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Powder gas</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.3000000000000003s" dur="0.5s" fill="freeze"/><line x1="268" y1="130" x2="275" y2="130" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><path d="M267.8 133.5 L275 130 L267.8 126.5" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.3s" dur="0.5s" fill="freeze"/><circle cx="365" cy="130" r="26" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2"/><text x="365" y="136" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">6</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.3s" dur="0.5s" fill="freeze"/><text x="365" y="92" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bullet out</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.1s" dur="0.5s" fill="freeze"/><line x1="333" y1="130" x2="335" y2="130" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><path d="M327.8 133.5 L335 130 L327.8 126.5" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="5.4s" dur="0.5s" fill="freeze"/><rect x="60" y="220" width="280" height="34" rx="17.0" fill="#2f3a2b" stroke="none" stroke-width="2"/><text x="200.0" y="241.9" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">All of it: a few thousandths of a second</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="5.8s" dur="0.5s" fill="freeze"/><text x="200.0" y="284" font-size="14" fill="#2f3a2b" text-anchor="middle">Squeeze smooth. The rifle does the rest.</text></g>
</svg>
