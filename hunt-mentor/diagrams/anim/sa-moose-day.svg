<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation of a moose day in October, top view. At dawn the moose walks out of thick timber to a willow flat beside a wetland and feeds on willow and water plants. By midday it beds in shade or thick cover close to the food. At dusk it comes back out. Lesson: glass the willow flat at first and last light.">
