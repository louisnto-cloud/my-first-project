stroke="#e8590c" stroke-width="2" stroke-dasharray="5 6" opacity=".6"/><g><g transform="translate(0 -20)"><g><g transform="translate(0 0) scale(0.4 0.4)"><rect x="-36" y="4" width="8" height="52" rx="4.0" fill="#9c8a76" stroke="#23261f" stroke-width="1.5"/><rect x="-26" y="4" width="8" height="52" rx="4.0" fill="#9c8a76" stroke="#23261f" stroke-width="1.5"/><rect x="26" y="4" width="8" height="52" rx="4.0" fill="#9c8a76" stroke="#23261f" stroke-width="1.5"/><rect x="36" y="4" width="8" height="52" rx="4.0" fill="#9c8a76" stroke="#23261f" stroke-width="1.5"/><path d="M-46 0 Q-48 -26 -20 -26 Q10 -40 34 -34 Q48 -26 44 2 Q20 22 -30 18 Q-48 16 -46 0 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="2"/><path d="M30 -30 L56 -40 L66 -26 L40 0 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="2" stroke-linejoin="round"/><path d="M56 -44 L86 -30 Q92 -22 84 -18 L64 -20 Q54 -26 56 -44 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="2" stroke-linejoin="round"/><path d="M66 -22 Q66 -6 60 -4 Q58 -12 62 -22 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="2"/><ellipse cx="56" cy="-50" rx="8" ry="3.5" transform="rotate(-30 56 -50)" fill="#3b2a1c" stroke="#23261f" stroke-width="2"/><circle cx="70" cy="-34" r="1.8" fill="#eee"/><path d="M58 -46 Q50 -58 38 -60 Q30 -72 40 -74 L44 -66 L46 -78 L52 -68 L56 -80 L60 -68 Q64 -58 60 -48 Z" fill="#c9b79c" stroke="#23261f" stroke-width="1.5" stroke-linejoin="round"/></g><set attributeName="transform" to="scale(-1 1)" begin="5s"/></g></g><animateMotion dur="9s" fill="freeze" keyPoints="0;0.33;0.5;0.5;0.67;1;1" keyTimes="0;0.2;0.35;0.5;0.6;0.85;1" calcMode="linear"><mpath href="#sa-moose-day-p"/></animateMotion></g><g opacity="1"><set attributeName="opacity" to="1" begin="0s"/><set attributeName="opacity" to="0" begin="1.8s"/><rect x="140" y="8" width="254" height="54" rx="8" fill="#2f3a2b"/><text x="152" y="30" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">Dawn</text><text x="152" y="52" font-size="14" fill="#fff" text-anchor=