<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: a small boat with a motor moves toward ducks. While the motor pushes it: no shooting. The motor is cut but the boat keeps gliding: it still counts as moving, so no shot at ducks. The boat stops and is anchored: now shooting ducks is OK, 95 percent." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="120" width="400" height="180" fill="#4a7fb0" opacity=".35"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Ducks: is the boat still moving?</text>
<g transform="translate(330 150) scale(0.7)"><ellipse cx="0" cy="0" rx="18" ry="9" fill="#8b5a2b"/><circle cx="15" cy="-9" r="7" fill="#2e6b3a"/><path d="M21 -9 L29 -7 L21 -5 Z" fill="#e0a526"/><path d="M-18 -2 L-26 -6 L-22 2 Z" fill="#8b5a2b"/></g>
<g transform="translate(352 164) scale(0.7)"><ellipse cx="0" cy="0" rx="18" ry="9" fill="#8b5a2b"/><circle cx="15" cy="-9" r="7" fill="#2e6b3a"/><path d="M21 -9 L29 -7 L21 -5 Z" fill="#e0a526"/><path d="M-18 -2 L-26 -6 L-22 2 Z" fill="#8b5a2b"/></g>
<g transform="translate(374 150) scale(0.7)"><ellipse cx="0" cy="0" rx="18" ry="9" fill="#8b5a2b"/><circle cx="15" cy="-9" r="7" fill="#2e6b3a"/><path d="M21 -9 L29 -7 L21 -5 Z" fill="#e0a526"/><path d="M-18 -2 L-26 -6 L-22 2 Z" fill="#8b5a2b"/></g>
<g transform="translate(70 170)"><g><g transform="translate(0 0) scale(1.4)"><path d="M-34 -4 L30 -4 L22 10 L-28 10 Z" fill="#8b5a2b"/><rect x="-42" y="-14" width="10" height="12" rx="2" fill="#2f3a2b"/><rect x="-39" y="-2" width="4" height="16" fill="#2f3a2b"/><path d="M-46 16 q 8 -5 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0" fill="none" stroke="#4a7fb0" stroke-width="2.5"/></g><g><path d="M-58 0 l-24 -6 M-58 8 l-26 2 M-58 16 l-22 8" stroke="#ffffff" stroke-width="3"/><animate attributeName="opacity" values="1;0" begin="3s" dur="0.3s" fill="freeze"/></g><g transform="translate(-8 -16)"><g transform="translate(0 0) scale(0.9)"><circle cx="0" cy="-16" r="7" fill="#e8590c"/><path d="M-8 -6 L8 -6 L6 14 L-6 14 Z" fill="#e8590c"/></g></g><animateTransform attributeName="transform" type="translate" values="0 0;90 0;140 0;150 0" keyTimes="0;0.375;0.7;1" begin="0s" dur="8s" fill="freeze"/></g></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0s" dur="0.3s" fill="freeze"/><animate attributeName="opacity" values="1;0" begin="3s" dur="0.3s" fill="freeze"/><rect x="10" y="248" width="380" height="36" rx="8" fill="#c92a2a" stroke="#c92a2a" stroke-width="2"/><text x="200" y="272" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Motor pushing: no shot</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="3s" dur="0.3s" fill="freeze"/><animate attributeName="opacity" values="1;0" begin="6s" dur="0.3s" fill="freeze"/><rect x="10" y="248" width="380" height="36" rx="8" fill="#c92a2a" stroke="#c92a2a" stroke-width="2"/><text x="200" y="272" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Motor off, still gliding: NO shot</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="6s" dur="0.4s" fill="freeze"/><rect x="10" y="248" width="380" height="36" rx="8" fill="#5c7a3a" stroke="#5c7a3a" stroke-width="2"/><text x="200" y="272" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Stopped and anchored: OK (95%)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="6s" dur="0.4s" fill="freeze"/><path d="M240 186 l0 30 m-10 -8 q10 14 20 0" stroke="#2f3a2b" stroke-width="3" fill="none"/></g>
</svg>
