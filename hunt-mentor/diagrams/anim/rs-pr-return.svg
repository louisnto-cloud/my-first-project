<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: returning to a kill. Come in from upwind so your scent reaches the kill before you do, stop far back and glass the meat, then call out loudly. If the carcass was moved or buried, leave and report it.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Coming back to your kill</text>
<rect x="0" y="200" width="400" height="100" rx="0" fill="#cfdcb5"/><g transform="translate(300 202) scale(1.1)"><rect x="-3" y="-10" width="6" height="12" fill="#6b4f35"/><path d="M0 -50 L16 -10 L-16 -10 Z" fill="#8a9a6b"/></g><rect x="320" y="120" width="8" height="80" rx="2" fill="#6b4f35"/><rect x="312" y="140" width="24" height="30" rx="4" fill="#f4ecdc" stroke="#6b4f35" stroke-width="1.5"/><g opacity="0"><animate attributeName="opacity" values="0;1;0" begin="0s" dur="2s" repeatCount="indefinite"/><path d="M20 150 q100 6 260 0" fill="none" stroke="#4a7fb0" stroke-width="3" stroke-dasharray="6 6"/></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" begin="1s" dur="2s" repeatCount="indefinite"/><path d="M20 164 q100 6 260 0" fill="none" stroke="#4a7fb0" stroke-width="3" stroke-dasharray="6 6"/></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" begin="2s" dur="2s" repeatCount="indefinite"/><path d="M20 178 q100 6 260 0" fill="none" stroke="#4a7fb0" stroke-width="3" stroke-dasharray="6 6"/></g><g><circle cx="0" cy="-30" r="9" fill="#e8590c"/><rect x="-9" y="-21" width="18" height="30" rx="5" fill="#e8590c"/><animateMotion dur="3s" fill="freeze" path="M30 200 L140 200"/></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.4s" fill="freeze"/><text x="140" y="124" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">stop, glass</text><text x="140" y="144" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">from far back</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.0s" dur="0.4s" fill="freeze"/><text x="200" y="92" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">&quot;Hey bear!&quot; loud</text></g><text x="80" y="236" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="start">wind from you to the meat</text><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="5.0s" dur="0.4s" fill="freeze"/><rect x="20" y="250" width="360" height="34" rx="8" fill="#c62828"/><text x="200" y="272.0" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Moved or buried? Leave and report.</text></g>
</svg>
