<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a mule deer bounces in high arcs. All 4 feet land together, leaving tight groups of 4 prints with long gaps of about 2.4 to 4.6 m between groups. Final label: stot, this deer saw or smelled you.">
