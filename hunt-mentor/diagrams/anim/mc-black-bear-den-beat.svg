<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation of two hearts. In summer a black bear heart beats about 55 times a minute; in the den it slows to about 14 a minute, with long pauses. The summer heart pulses 8 times while the den heart pulses twice. Then a caption: slow heart, slow burn, metabolism near 25 percent of normal.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="28" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Heartbeats: summer vs den</text><rect x="10" y="48" width="180" height="200" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="100" y="76" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Summer</text><g transform="translate(100 150)"><g><path d="M0 24 C -44 -8 -28 -44 0 -24 C 28 -44 44 -8 0 24 Z" fill="#b02a2a"/><animateTransform attributeName="transform" type="scale" values="1;1.25;1" keyTimes="0;0.15;0.4" dur="1.1s" repeatCount="8" fill="freeze"/></g></g><text x="100" y="226" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">about 55 a minute</text><rect x="210" y="48" width="180" height="200" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="300" y="76" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">In the den</text><g transform="translate(300 150)"><g><path d="M0 24 C -44 -8 -28 -44 0 -24 C 28 -44 44 -8 0 24 Z" fill="#b02a2a"/><animateTransform attributeName="transform" type="scale" values="1;1.25;1" keyTimes="0;0.15;0.4" dur="4.3s" repeatCount="2" fill="freeze"/></g></g><text x="300" y="226" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">about 14 a minute</text><g opacity="0"><rect x="20" y="258" width="360" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="281" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Slow heart, slow burn: metabolism near 25%</text><animate attributeName="opacity" values="0;1" begin="8.6s" dur="0.5s" fill="freeze"/></g>
</svg>
