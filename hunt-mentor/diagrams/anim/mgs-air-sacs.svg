<circle r="7" fill="#2f6fb0" stroke="#fffaf0" stroke-width="1.5" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="3s" begin="0s" fill="freeze"><mpath href="#mgs-air-sacs-p1"/></animateMotion></circle>
<circle r="7" fill="#e8590c" stroke="#fffaf0" stroke-width="1.5" opacity="0"><set attributeName="opacity" to="1" begin="3s"/><animateMotion dur="3s" begin="3s" fill="freeze"><mpath href="#mgs-air-sacs-p2"/></animateMotion></circle>
<circle r="7" fill="#7a7a7a" stroke="#fffaf0" stroke-width="1.5" opacity="0"><set attributeName="opacity" to="1" begin="6s"/><animateMotion dur="3s" begin="6s" fill="freeze"><mpath href="#mgs-air-sacs-p3"/></animateMotion></circle>
<g opacity="0"><set attributeName="opacity" to="1" begin="0s"/><text x="12" y="290" font-size="15" font-weight="bold" fill="#2f6fb0">1. Breath in: fresh air to the rear sacs</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="3s"/><text x="12" y="312" font-size="15" font-weight="bold" fill="#c2410c">2. Breath out: rear sacs push it through the lungs</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="6s"/><text x="12" y="334" font-size="15" font-weight="bold" fill="#4d4d4d">3. Next breaths: front sacs, then out</text></g>
<text x="200" y="362" font-size="15" fill="#2f3a2b" text-anchor="middle">9 air sacs, fresh air in both phases (85%)</text>
</svg>
