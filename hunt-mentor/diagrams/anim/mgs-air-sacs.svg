<text x="349.733" y="116.5" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">windpipe</text>
<line x1="258" y1="172" x2="280" y2="240" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="258" cy="172" r="2.6" fill="#2f3a2b"/><rect x="242.9" y="240.0" width="94.1" height="29.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="290" y="260.5" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">front sacs</text>
<line x1="116" y1="184" x2="104" y2="240" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="116" cy="184" r="2.6" fill="#2f3a2b"/><rect x="52.0" y="240.0" width="88.0" height="29.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="96" y="260.5" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">rear sacs</text>
<path id="mgs-air-sacs-p1" d="M334 52 Q300 60 290 86 Q280 108 244 120 Q186 132 124 164" fill="none"/>
<path id="mgs-air-sacs-p2" d="M124 164 Q144 130 172 122 L236 122 Q250 138 252 156" fill="none"/>
