<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 372" font-family="sans-serif" role="img" aria-label="Animation of a goose breathing, a Canada goose in side view with the body shown as a cutaway. The lungs sit high on the back, the front air sacs in the chest, the rear air sacs at the back of the body. Step 1, breath in: fresh air goes down the windpipe past the lungs into the rear air sacs. Step 2, breath out: the rear sacs push that air forward through the lungs, where oxygen is taken up. Step 3, the next breaths move the used air into the front sacs and out of the windpipe. Birds have 9 air sacs and fresh air crosses the lungs in both phases, 85 percent.">
<rect width="400" height="372" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Air flows one way through the lungs</text>
