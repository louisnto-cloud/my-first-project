<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation of a goose breathing. Step 1, breath in: fresh air goes down the windpipe past the lungs into the rear air sacs. Step 2, breath out: the rear sacs push that air forward through the lungs, where oxygen is taken up. Step 3, the next breaths move the used air into the front sacs and out of the windpipe. Birds have 9 air sacs and fresh air crosses the lungs in both phases, 85 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Air flows one way through the lungs</text><path d="M60 170 Q40 150 70 125 Q110 100 190 105 L250 100 Q262 60 285 40 Q300 30 318 38 L340 44 L318 50 Q300 50 292 70 Q282 100 290 130 Q300 175 250 195 Q180 215 110 205 Q75 198 60 170Z" fill="#efe6d6" stroke="#2f3a2b" stroke-width="2"/><ellipse cx="205" cy="120" rx="34" ry="12" fill="#e57373"/><text x="205" y="125" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Lungs</text><ellipse cx="250" cy="150" rx="22" ry="18" fill="#bfe0f2" stroke="#4a7fb0"/><text x="250" y="155" font-size="13" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Front</text><ellipse cx="125" cy="160" rx="40" ry="26" fill="#bfe0f2" stroke="#4a7fb0"/><text x="125" y="160" font-size="13" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Rear</text><text x="125" y="175" font-size="13" font-weight="bold" fill="#4a7fb0" text-anchor="middle">air sacs</text><path d="M325 46 Q300 52 290 80 Q280 104 248 112" stroke="#2f3a2b" stroke-width="3" fill="none"/><path id="mgs-air-sacs-p1" d="M330 45 Q298 52 288 82 Q278 106 240 116 Q180 128 130 160" fill="none"/><path id="mgs-air-sacs-p2" d="M130 160 Q150 128 175 120 L235 120 Q248 135 250 150" fill="none"/><path id="mgs-air-sacs-p3" d="M250 150 Q260 120 282 100 Q292 70 330 45" fill="none"/><circle r="7" fill="#4a7fb0" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="3s" begin="0s" fill="freeze"><mpath href="#mgs-air-sacs-p1"/></animateMotion></circle><circle r="7" fill="#e8590c" opacity="0"><set attributeName="opacity" to="1" begin="3s"/><animateMotion dur="3s" begin="3s" fill="freeze"><mpath href="#mgs-air-sacs-p2"/></animateMotion></circle><circle r="7" fill="#888" opacity="0"><set attributeName="opacity" to="1" begin="6s"/><animateMotion dur="3s" begin="6s" fill="freeze"><mpath href="#mgs-air-sacs-p3"/></animateMotion></circle><g opacity="0"><set attributeName="opacity" to="1" begin="0s"/><text x="200" y="240" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1. Breath in: fresh air to the rear sacs</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="3s"/><text x="200" y="260" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">2. Breath out: rear sacs push it through the lungs</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="6s"/><text x="200" y="280" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3. Next breaths: front sacs, then out</text></g><text x="200" y="298" font-size="13" fill="#2f3a2b" text-anchor="middle">9 air sacs, fresh air in both phases (85%)</text>
</svg>
