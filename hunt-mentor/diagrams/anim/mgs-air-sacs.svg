<ellipse cx="122" cy="164" rx="44" ry="28" fill="#cfe0f0" stroke="#7fa6c8" stroke-width="1.4"/>
<line x1="196" y1="116" x2="166" y2="81" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="196" cy="116" r="2.6" fill="#2f3a2b"/><rect x="132.1" y="52.0" width="55.8" height="29.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="160" y="72.5" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">lungs</text>
