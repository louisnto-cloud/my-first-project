<text x="338" y="270" font-size="15" fill="#23261f" text-anchor="end">to the gut</text>
<text x="200" y="293" font-size="14" fill="#6b5b4b" text-anchor="middle">Elk: bigger rumen for body size than mule deer (80%)</text>
