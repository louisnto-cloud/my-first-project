<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a dot of food goes from the mouth into the big rumen, back up to the mouth as cud to be chewed again, then down through the reticulum, omasum and abomasum and on to the gut. Elk have a bigger rumen for their body size than mule deer, which helps on poor range.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Four stomachs: chew it twice</text><rect x="40" y="70" width="60" height="34" rx="10" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/><text x="70.0" y="92.0" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Mouth</text><rect x="120" y="120" width="120" height="90" rx="10" fill="#9bb07a" stroke="#23261f" stroke-width="1.5"/><text x="180.0" y="170.0" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Rumen</text><rect x="255" y="70" width="90" height="40" rx="10" fill="#c6d4a6" stroke="#23261f" stroke-width="1.5"/><text x="300.0" y="95.0" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Reticulum</text><rect x="270" y="140" width="80" height="40" rx="10" fill="#d9c27a" stroke="#23261f" stroke-width="1.5"/><text x="310.0" y="165.0" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Omasum</text><rect x="250" y="210" width="110" height="40" rx="10" fill="#e0b48a" stroke="#23261f" stroke-width="1.5"/><text x="305.0" y="235.0" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Abomasum</text><path d="M70 104 L120 150 L180 150 L240 150 L300 110 L70 87 L70 104 L180 190 L300 110 L310 160 L305 230 L380 270" fill="none" stroke="#8a9a6b" stroke-width="1" stroke-dasharray="3 4"/><circle r="8" fill="#e8590c"><animateMotion dur="9s" fill="freeze" path="M70 104 L120 150 L180 150 L240 150 L300 110 L70 87 L70 104 L180 190 L300 110 L310 160 L305 230 L380 270"/></circle><text x="110" y="268" font-size="14" fill="#6b4f35" text-anchor="middle">Cud comes back up to chew</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Elk: bigger rumen for body size than deer (80%)</text>
</svg>
