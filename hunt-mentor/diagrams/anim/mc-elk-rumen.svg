<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: four chamber stomach, 85 percent. A dot of food goes from the mouth into the big rumen, to the reticulum, back up to the mouth as cud to be chewed again, then down through the rumen and reticulum to the omasum and abomasum and on to the gut. Elk have a bigger rumen for their body size than mule deer, which helps on poor range, 80 percent.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Four chambers: chew it twice</text>
<rect x="16" y="62" width="96" height="36" rx="12" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/>
<rect x="16" y="124" width="176" height="108" rx="12" fill="#9bb07a" stroke="#23261f" stroke-width="1.5"/>
<rect x="232" y="62" width="132" height="36" rx="12" fill="#c6d4a6" stroke="#23261f" stroke-width="1.5"/>
<rect x="232" y="142" width="132" height="36" rx="12" fill="#d9c27a" stroke="#23261f" stroke-width="1.5"/>
<rect x="232" y="212" width="132" height="36" rx="12" fill="#e0b48a" stroke="#23261f" stroke-width="1.5"/>
<text x="64" y="86" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Mouth</text>
<text x="122" y="152" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Rumen</text><text x="122" y="172" font-size="15" fill="#23261f" text-anchor="middle">the big one</text>
<text x="290" y="86" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Reticulum</text><text x="290" y="166" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Omasum</text><text x="290" y="236" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Abomasum</text>
