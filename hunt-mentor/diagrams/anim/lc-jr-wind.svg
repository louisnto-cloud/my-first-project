<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 312" font-family="sans-serif" role="img" aria-label="Animation: a compass with arrows of wind flowing from the west side toward the east. A west wind blows from the west. Write the wind as where it comes from.">
<rect x="0" y="0" width="400" height="312" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">&quot;West wind&quot; blows FROM the west</text><circle cx="200" cy="170" r="90" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="72" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">N</text><text x="200" y="280" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">S</text><text x="92" y="176" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="middle">W</text><text x="308" y="176" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">E</text><g><path d="M0 0 h50 m-10 -7 l10 7 l-10 7" stroke="#4a7fb0" stroke-width="4" fill="none" stroke-linecap="round"/><animateTransform attributeName="transform" type="translate" values="110 130;240 130" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></g><g><path d="M0 0 h50 m-10 -7 l10 7 l-10 7" stroke="#4a7fb0" stroke-width="4" fill="none" stroke-linecap="round"/><animateTransform attributeName="transform" type="translate" values="110 170;240 170" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></g><g><path d="M0 0 h50 m-10 -7 l10 7 l-10 7" stroke="#4a7fb0" stroke-width="4" fill="none" stroke-linecap="round"/><animateTransform attributeName="transform" type="translate" values="110 210;240 210" dur="2.4s" begin="1.0s" repeatCount="indefinite"/></g><text x="200" y="300" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Write where it comes from.</text>
</svg>
