<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 295" font-family="sans-serif" role="img" aria-label="Animation. Inside the chest of a moose the lungs swell and shrink three times as the diaphragm pulls back and relaxes. When the diaphragm pulls back, air rushes in. End: hit both lungs and the moose goes down fast.">
<rect x="0" y="0" width="400" height="295" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">How a moose breathes</text><g transform="translate(170 160) scale(2.6)"><path d="M-46 0 Q-48 -26 -20 -26 Q10 -40 34 -34 Q48 -26 44 2 Q20 22 -30 18 Q-48 16 -46 0 Z" fill="#c9b49a" stroke="#23261f" stroke-width="1"/></g><ellipse cx="220" cy="140" rx="40" ry="30" fill="#f2a6a0" stroke="#23261f" stroke-width="1.5"><animate attributeName="rx" values="40;50;40" dur="2.4s" repeatCount="3" fill="freeze"/><animate attributeName="ry" values="30;38;30" dur="2.4s" repeatCount="3" fill="freeze"/></ellipse><path d="M178 104 Q170 160 188 206" stroke="#6b4f35" stroke-width="4" fill="none"><animateTransform attributeName="transform" type="translate" values="0 0;-12 0;0 0" dur="2.4s" repeatCount="3" fill="freeze"/></path><text x="220" y="146" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">lungs</text><text x="150" y="240" font-size="14" fill="#6b4f35" text-anchor="middle" font-weight="bold">diaphragm pulls back: air in</text><g opacity="0"><animate attributeName="opacity" values="0;1" begin="7s" dur="0.5s" fill="freeze"/><rect x="40" y="256" width="320" height="30" rx="8" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="277" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Hit both lungs: down fast</text></g>
</svg>
