<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation of thermals on a slope. Morning: the sun rises and warms the slope, warm air rises, and scent drifts uphill, so approach from above or the side. Evening: the sun sets, the slope cools, cool air sinks, and scent drifts downhill, so hunt from below or the side and leave before cold air drains your scent down to bedded deer.">
  <rect width="400" height="300" fill="#dbe7f3"/>
  <circle r="18" fill="#f3d36b" cx="40" cy="250">
    <animate attributeName="cy" values="250;70;70;250" keyTimes="0;0.3;0.6;1" dur="9s" fill="freeze"/>
    <animate attributeName="cx" values="40;80;330;370" keyTimes="0;0.3;0.6;1" dur="9s" fill="freeze"/>
    <animate attributeName="fill" values="#f3d36b;#f3d36b;#f2a56b;#e8590c" keyTimes="0;0.5;0.8;1" dur="9s" fill="freeze"/>
  </circle>
  <path d="M0 290 L0 260 Q150 240 260 120 Q300 80 400 60 L400 290 Z" fill="#8a9a6b"/>
  <g transform="translate(220 160)"><ellipse rx="16" ry="8" fill="#8b5a2b"/><circle cx="-14" cy="-7" r="5" fill="#8b5a2b"/></g>
  <g stroke="#4a7fb0" stroke-width="4" fill="none" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1;0.5;0.55;1" dur="9s" fill="freeze"/>
    <path d="M90 250 Q150 220 200 175 m-14 2 l14 -2 l-2 14"/>
    <path d="M150 260 Q220 210 270 140 m-14 2 l14 -2 l-2 14"/>
  </g>
  <g stroke="#2f3a2b" stroke-width="4" fill="none" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.65;1" dur="9s" fill="freeze"/>
    <path d="M270 120 Q220 190 160 235 m2 -14 l-2 14 l14 0"/>
    <path d="M330 100 Q280 170 230 215 m2 -14 l-2 14 l14 0"/>
  </g>
  <rect x="0" y="0" width="400" height="36" fill="#2f3a2b"/>
  <text x="200" y="24" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">Morning: warm air, scent goes UP
    <set attributeName="opacity" to="0" begin="4.9s" fill="freeze"/></text>
  <text x="200" y="24" font-size="17" font-weight="bold" fill="#f3d36b" text-anchor="middle" opacity="0">Evening: cool air, scent sinks DOWN
    <set attributeName="opacity" to="1" begin="4.9s" fill="freeze"/></text>
  <g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" begin="1.5s" dur="3.3s" fill="freeze"/>
    <circle cx="320" cy="96" r="9" fill="#e8590c"/><text x="320" y="128" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">You: above</text></g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="6s" dur=".4s" fill="freeze"/>
    <circle cx="80" cy="262" r="9" fill="#e8590c"/><text x="105" y="280" font-size="14" font-weight="bold" fill="#fff">You: below</text></g>
</svg>
