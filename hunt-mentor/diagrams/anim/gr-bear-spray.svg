<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a bear walks toward you. Aim the spray at the ground a few metres in front of the bear, then sweep up to its face. The orange cloud forms a wall the bear runs into. Never spray into the wind.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bear spray: low, then sweep up</text>
<rect y="40" width="400" height="176" fill="#eef3ea"/>
<rect y="216" width="400" height="84" fill="#cfd9b8"/><line x1="0" y1="216" x2="400" y2="216" stroke="#9aa77a" stroke-width="2"/>
<g transform="translate(52 216)"><path d="M-6 -46 L-12 0 M6 -46 L12 0" stroke="#5c4a32" stroke-width="8" stroke-linecap="round"/><path d="M-13 -92 C-14 -80 -12 -60 -10 -44 H12 C13 -60 14 -80 12 -92z" fill="#e8590c"/><circle cx="0" cy="-104" r="11" fill="#d9b48f"/><path d="M-12 -106 Q0 -122 12 -106z" fill="#e8590c"/><path d="M8 -108 h10 v3 h-10z" fill="#e8590c"/><path d="M4 -82 L40 -42 M2 -74 L40 -38" stroke="#d9b48f" stroke-width="6" stroke-linecap="round"/><rect x="38" y="-52" width="12" height="24" rx="3" fill="#e8590c" stroke="#9a3a0a" stroke-width="1.4" transform="rotate(-70 44 -40)"/></g>
<g><g transform="translate(296 176)"><path d="M-28 -2 L-32 40 L-22 40 L-16 8z M30 0 L36 40 L46 40 L46 4z" fill="#3a332e"/><path d="M-40 -8 C-38 -24 -16 -32 8 -30 C30 -30 50 -22 54 -6 C58 10 50 22 44 24 L46 40 L34 40 L30 24 C14 28 -4 28 -18 24 L-20 40 L-31 40 L-32 18 C-40 10 -42 2 -40 -8z" fill="#2a2522"/><circle cx="-48" cy="-14" r="15" fill="#2a2522"/><circle cx="-42" cy="-28" r="5.5" fill="#2a2522"/><circle cx="-54" cy="-27" r="5" fill="#2a2522"/><path d="M-58 -18 L-74 -11 C-77 -7 -73 -2 -66 -3 L-54 -4z" fill="#9a7a56"/><ellipse cx="-74" cy="-9" rx="3" ry="2.4" fill="#111"/><circle cx="-54" cy="-18" r="1.8" fill="#eee"/></g><animateTransform attributeName="transform" type="translate" values="40 0;0 0" dur="5s" fill="freeze"/></g>
<path d="M98 178 L194 220 Q214 212 204 194 Z" fill="#e8590c" opacity="0"><animate attributeName="opacity" values="0;.55;.55" keyTimes="0;0.2;1" begin="1s" dur="3s" fill="freeze"/><animate attributeName="d" values="M98 178 L194 220 Q214 212 204 194 Z;M98 178 L194 220 Q214 212 204 194 Z;M98 178 L230 190 Q262 162 242 134 Z" keyTimes="0;0.4;1" begin="1s" dur="3s" fill="freeze"/></path>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" begin="1s" dur="1.6s" fill="freeze"/><text x="200" y="250" font-size="18" font-weight="bold" fill="#c2410c" text-anchor="middle">1. Aim at the ground</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.6s" dur=".4s" fill="freeze"/><text x="200" y="250" font-size="18" font-weight="bold" fill="#c2410c" text-anchor="middle">2. Sweep up to the face</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.5s" dur=".4s" fill="freeze"/><rect x="60" y="262" width="280" height="30" rx="6" fill="#2f3a2b"/><text x="200" y="283" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Never spray into the wind</text></g>
</svg>
