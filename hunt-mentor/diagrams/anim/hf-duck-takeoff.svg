<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, side view. Left: a puddle duck, like a mallard, springs straight up off the water. Right: a diving duck, like a goldeneye, runs and patters along the water surface before it lifts off at a low angle.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect x="0" y="220" width="400" height="80" fill="#cfe0ea"/>
  <line x1="200" y1="40" x2="200" y2="300" stroke="#8a9a6b" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="100" y="28" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Puddle duck</text>
  <text x="300" y="28" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Diver</text>
  <g>
    <animateTransform attributeName="transform" type="translate" values="100 214;100 214;100 80;100 80" keyTimes="0;0.15;0.7;1" dur="5s" fill="freeze" additive="replace"/>
    <ellipse rx="22" ry="10" fill="#8b5a2b"/><circle cx="20" cy="-10" r="8" fill="#2f6e3b"/><path d="M27 -10 l10 2 l-10 3 Z" fill="#e3b23c"/>
    <path d="M-6 -4 L-20 -34 L8 -6 Z" fill="#5c3b1c"><animate attributeName="d" values="M-6 -4 L-20 -34 L8 -6 Z;M-6 -4 L-20 26 L8 -6 Z;M-6 -4 L-20 -34 L8 -6 Z" begin=".7s" dur=".35s" repeatCount="10"/></path>
  </g>
  <g>
    <animateMotion dur="5s" fill="freeze" path="M230 214 L330 214 Q 350 210 360 140" keyPoints="0;0.62;1" keyTimes="0;0.6;1" calcMode="linear"/>
    <ellipse rx="20" ry="9" fill="#2f3a2b"/><ellipse cx="-2" cy="0" rx="10" ry="6" fill="#fffaf0"/><circle cx="18" cy="-8" r="7" fill="#2f3a2b"/>
    <path d="M-8 -3 L-26 -24 L6 -5 Z" fill="#2f3a2b"><animate attributeName="d" values="M-8 -3 L-26 -24 L6 -5 Z;M-8 -3 L-26 14 L6 -5 Z;M-8 -3 L-26 -24 L6 -5 Z" dur=".3s" repeatCount="16"/></path>
  </g>
  <g fill="#fffaf0" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.6;0.7" dur="5s" fill="freeze"/>
    <circle cx="250" cy="222" r="4"/><circle cx="270" cy="220" r="3"/><circle cx="290" cy="223" r="4"/><circle cx="310" cy="221" r="3"/></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" begin="4s" dur=".5s" fill="freeze"/>
    <text x="100" y="260" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">straight up</text>
    <text x="300" y="260" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">runs, then lifts</text></g>
</svg>
