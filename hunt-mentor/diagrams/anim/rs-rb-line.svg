<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a buck walks from the bedding cover toward the feed and rubs four trees along the way. The rubbed side of each faces back toward the beds, so the rub line shows his route from bed to feed.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A rub line is a road</text>
<rect x="0" y="60" width="400" height="200" rx="0" fill="#e9efe0"/><path d="M0 60 H120 Q140 160 100 260 H0 Z" fill="#b9c99a"/><text x="50" y="90" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">beds</text><text x="350" y="90" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">feed</text><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.4s" fill="freeze"/><rect x="126" y="176" width="8" height="24" rx="2" fill="#6b4f35"/><rect x="126" y="182" width="4" height="12" rx="1" fill="#f4e3b5"/></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.7000000000000002s" dur="0.4s" fill="freeze"/><rect x="186" y="146" width="8" height="24" rx="2" fill="#6b4f35"/><rect x="186" y="152" width="4" height="12" rx="1" fill="#f4e3b5"/></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.4s" fill="freeze"/><rect x="246" y="126" width="8" height="24" rx="2" fill="#6b4f35"/><rect x="246" y="132" width="4" height="12" rx="1" fill="#f4e3b5"/></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.4s" fill="freeze"/><rect x="306" y="106" width="8" height="24" rx="2" fill="#6b4f35"/><rect x="306" y="112" width="4" height="12" rx="1" fill="#f4e3b5"/></g><g><g transform="translate(0 0) scale(0.5)" fill="#8b5a2b"><path d="M-35 -40 Q-10 -48 20 -42 L28 -58 L34 -66 L44 -64 L42 -56 L48 -50 L36 -46 L32 -34 Q30 -26 26 -24 L28 0 L23 0 L20 -22 Q0 -20 -20 -24 L-22 0 L-27 0 L-29 -26 Q-38 -30 -35 -40 Z"/><path d="M34 -66 L30 -76 M38 -66 L42 -78" stroke="#6b4f35" stroke-width="2.5" fill="none"/></g><animateMotion dur="4.4s" fill="freeze" path="M40 220 L130 205 L190 175 L250 155 L310 135 L370 120"/></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.4s" fill="freeze"/><rect x="20" y="268" width="360" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="289.6666666666667" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Rubbed sides face the beds: he walks bed to feed</text></g>
</svg>
