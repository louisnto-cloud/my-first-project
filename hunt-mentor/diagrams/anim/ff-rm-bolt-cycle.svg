<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 366" font-family="sans-serif" role="img" aria-label="Animation of a bolt action rifle seen from the right side. The bolt handle lifts, which unlocks the lugs and cocks the firing pin. The bolt slides back, pulls out the fired case and flips it out of the ejection port. It slides forward and pushes a new round from the magazine into the chamber. The handle turns down, which locks the bolt. The rifle is ready to fire, so put the safety on.">
<rect width="400" height="366" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bolt action: up, back, forward, down</text>
<g transform="translate(-50 -46) scale(1.4)">
<path d="M58 103 L132 100 L132 132 L112 134 C102 138 96 148 92 160 L76 160 C80 150 82 142 78 138 L58 141z" fill="#9a6b45" stroke="#5a3e26" stroke-width="1.5"/>
<path d="M250 132 L300 128 L300 136 L250 140z" fill="#9a6b45" stroke="#5a3e26" stroke-width="1.2"/>
<g><rect x="104" y="108" width="146" height="16" rx="5" fill="#c3c7bf" stroke="#4a4e48" stroke-width="1.5"/><rect x="96" y="106" width="14" height="20" rx="4" fill="#7d827a" stroke="#4a4e48" stroke-width="1.5"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 0;-50 0;-50 0;0 0;0 0" keyTimes="0;0.15;0.3;0.5;0.6;0.8;1" dur="6s" fill="freeze"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.49;0.5;1" dur="6s" fill="freeze"/><g><g transform="translate(200 116)"><rect x="0" y="-5" width="30" height="10" rx="1.5" fill="#c9a227" stroke="#7a611a" stroke-width="1"/><path d="M30 -4 H36 C40 -4 43 -2 44 0 C43 2 40 4 36 4 H30z" fill="#b87333" stroke="#7a4a20" stroke-width="1"/></g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;56 -1;56 -1" keyTimes="0;0.6;0.8;1" dur="6s" fill="freeze"/></g></g>
<path d="M126 102 H272 V134 H126z M192 104 H246 V121 H192z" fill="#7d827a" fill-rule="evenodd" stroke="#4a4e48" stroke-width="1.5"/>
<rect x="200" y="134" width="46" height="24" rx="2" fill="#4a4e48"/>
<rect x="272" y="108" width="28" height="14" rx="2" fill="#7d827a" stroke="#4a4e48" stroke-width="1.5"/>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.45;0.6;0.66;1" dur="6s" fill="freeze"/><g><rect x="200" y="107" width="30" height="10" rx="1.5" fill="#c9a227" stroke="#7a611a" stroke-width="1"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;70 -50;70 -50" keyTimes="0;0.45;0.62;1" dur="6s" fill="freeze"/></g></g>
<g><g><path d="M146 118 L134 148" stroke="#4a4e48" stroke-width="6" stroke-linecap="round"/><circle cx="133" cy="152" r="8" fill="#2f3a2b"/><circle cx="146" cy="117" r="5" fill="#4a4e48"/><animateTransform attributeName="transform" type="rotate" values="0 146 117;0 146 117;95 146 117;95 146 117;95 146 117;95 146 117;0 146 117" keyTimes="0;0.15;0.3;0.5;0.6;0.8;1" dur="6s" fill="freeze"/></g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 0;-50 0;-50 0;0 0;0 0" keyTimes="0;0.15;0.3;0.5;0.6;0.8;1" dur="6s" fill="freeze"/></g>
</g>
<line x1="235.6" y1="105.2" x2="150" y2="71" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="235.6" cy="105.2" r="2.6" fill="#2f3a2b"/>
<rect x="96.0" y="44.0" width="108.1" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="150" y="63" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">ejection port</text>
<line x1="246.8" y1="166.8" x2="175" y2="186" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="246.8" cy="166.8" r="2.6" fill="#2f3a2b"/>
<rect x="117.9" y="186.0" width="84.3" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="160" y="205" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">magazine</text>
<line x1="350.4" y1="116.4" x2="330" y2="186" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="350.4" cy="116.4" r="2.6" fill="#2f3a2b"/>
<rect x="291.5" y="186.0" width="76.9" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="330" y="205" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">chamber</text>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.5s" fill="freeze"/><text x="28" y="240" font-size="16" font-weight="bold" fill="#2f3a2b">1. Up: unlocks and cocks</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.0s" dur="0.5s" fill="freeze"/><text x="28" y="262" font-size="16" font-weight="bold" fill="#2f3a2b">2. Back: pulls out the case</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.4s" dur="0.5s" fill="freeze"/><text x="28" y="284" font-size="16" font-weight="bold" fill="#2f3a2b">3. Forward: pushes a round in</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.6s" dur="0.5s" fill="freeze"/><text x="28" y="306" font-size="16" font-weight="bold" fill="#2f3a2b">4. Down: locks the bolt</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" begin="5.6s" dur="0.5s" fill="freeze"/><rect x="70" y="326" width="260" height="30" rx="15" fill="#e8590c"/><text x="200" y="347" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Locked: ready, safety ON</text></g>
</svg>
