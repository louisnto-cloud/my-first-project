<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation of a bolt action. The bolt handle lifts, which unlocks the lugs. The bolt slides back and pulls out the case. It slides forward and pushes a new round from the magazine into the chamber. The handle turns down, which locks the bolt and cocks the firing pin. Then put the safety on.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bolt action: up, back, forward, down</text><rect x="60" y="130" width="200" height="40" rx="4" fill="#6b6f68" stroke="#2f3a2b" stroke-width="2"/><rect x="260" y="140" width="130" height="18" rx="0" fill="#6b6f68" stroke="#2f3a2b" stroke-width="1"/><rect x="150" y="133" width="60" height="12" rx="0" fill="#fffaf0" stroke="#2f3a2b" stroke-width="1"/><text x="180" y="125" font-size="13" fill="#23261f" text-anchor="middle">ejection port</text><g><animateTransform attributeName="transform" type="translate" values="80 145;80 145;80 145;10 145;10 145;80 145;80 145" keyTimes="0;0.15;0.3;0.5;0.6;0.8;1" dur="6s" fill="freeze"/><g><rect x="0" y="0" width="120" height="16" rx="6" fill="#9a9e96" stroke="#2f3a2b" stroke-width="2"/><line x1="14" y1="16" x2="4" y2="44" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><circle cx="3" cy="48" r="8" fill="#2f3a2b" stroke="none" stroke-width="2"/><animateTransform attributeName="transform" type="rotate" values="0 8 8;0 8 8;-60 8 8;-60 8 8;-60 8 8;-60 8 8;0 8 8" keyTimes="0;0.15;0.3;0.5;0.6;0.8;1" dur="6s" fill="freeze"/></g></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.52;1" dur="6s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" values="150 172;150 172;205 150" keyTimes="0;0.6;0.8" dur="6s" fill="freeze"/><g transform="translate(0 0) scale(0.42)"><path d="M0 -14 L86 -14 L100 -9 L104 -9 L104 9 L100 9 L86 14 L0 14 Z" fill="#c9a227" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-4" y="-16" width="6" height="32" rx="0" fill="#c9a227" stroke="#2f3a2b" stroke-width="1.5"/><rect x="4" y="-14" width="3" height="28" rx="0" fill="#a88520" stroke="none" stroke-width="2"/><path d="M104 -8 L120 -8 Q 140 -6 146 0 Q 140 6 120 8 L104 8 Z" fill="#b87333" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.5s" fill="freeze"/><text x="30" y="220" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">1. Lift: unlocks the lugs</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.0s" dur="0.5s" fill="freeze"/><text x="30" y="240" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">2. Back: pulls out the case</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.4s" dur="0.5s" fill="freeze"/><text x="30" y="260" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">3. Forward: pushes a round in</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="4.6s" dur="0.5s" fill="freeze"/><text x="30" y="280" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">4. Down: locks and cocks</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="5.6s" dur="0.5s" fill="freeze"/><rect x="70" y="66" width="260" height="30" rx="15.0" fill="#e8590c" stroke="none" stroke-width="2"/><text x="200.0" y="86.25" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Locked: ready, safety ON</text></g>
</svg>
