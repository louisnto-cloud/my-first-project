<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation: two phones start full. The one in a warm chest pocket drains slowly to 80 percent. The one in a cold pack lid drains fast and shuts off with 20 percent showing. Tip: cold makes the battery read low and shut off early.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="36" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Same phone, two pockets</text><text x="110" y="70" font-family="sans-serif" font-size="15" fill="#8a9a6b" text-anchor="middle" font-weight="bold">Chest pocket</text><text x="290" y="70" font-family="sans-serif" font-size="15" fill="#4a7fb0" text-anchor="middle" font-weight="bold">Pack lid, -10°C</text><g transform="translate(110 170) scale(1.6)"><rect x="-22" y="-40" width="44" height="80" rx="7" fill="#2f3a2b" stroke="none" stroke-width="0"/><rect x="-18" y="-33" width="36" height="62" rx="3" fill="#cfe3f3" stroke="none" stroke-width="0"/><rect x="-9" y="-20" width="18" height="36" rx="2" fill="#ffffff" stroke="#2f3a2b" stroke-width="1.5"/><rect x="-7" y="-18" width="14" height="34" fill="#8a9a6b"><animate attributeName="height" values="34;27.2" dur="6s" fill="freeze"/><animate attributeName="y" values="-18;-11.2" dur="6s" fill="freeze"/></rect></g><g transform="translate(290 170) scale(1.6)"><rect x="-22" y="-40" width="44" height="80" rx="7" fill="#2f3a2b" stroke="none" stroke-width="0"/><rect x="-18" y="-33" width="36" height="62" rx="3" fill="#cfe3f3" stroke="none" stroke-width="0"/><rect x="-9" y="-20" width="18" height="36" rx="2" fill="#ffffff" stroke="#2f3a2b" stroke-width="1.5"/><rect x="-7" y="-18" width="14" height="34" fill="#e8590c"><animate attributeName="height" values="34;6.8" dur="6s" fill="freeze"/><animate attributeName="y" values="-18;9.2" dur="6s" fill="freeze"/></rect></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="5.5s" dur=".5s" fill="freeze"/><text x="110" y="270" font-family="sans-serif" font-size="18" fill="#8a9a6b" text-anchor="middle" font-weight="bold">80%</text><text x="290" y="270" font-family="sans-serif" font-size="18" fill="#e8590c" text-anchor="middle" font-weight="bold">Dead at 20%</text></g>
</svg>
