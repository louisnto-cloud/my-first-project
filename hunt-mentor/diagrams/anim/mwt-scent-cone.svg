<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation, top view. Wind blows left to right. A hunter stands on the left and an orange scent cone spreads out downwind, getting wider with distance. A deer walks up from the bottom right into the cone and stops: it smells the hunter. Another deer upwind of the hunter, on the lower left, is safe." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" fill="#dfe6d3" opacity=".6"/><text x="200" y="22" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">Your scent cone grows downwind</text><g><line x1="20" y1="44" x2="70" y2="44" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><polygon points="70.0,44.0 61.9,47.9 61.9,40.1" fill="#4a7fb0"/><animateTransform attributeName="transform" type="translate" values="0 0;16 0;0 0" dur="2s" repeatCount="indefinite"/></g><g><line x1="20" y1="74" x2="70" y2="74" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><polygon points="70.0,74.0 61.9,77.9 61.9,70.1" fill="#4a7fb0"/><animateTransform attributeName="transform" type="translate" values="0 0;16 0;0 0" dur="2s" repeatCount="indefinite"/></g><text x="22" y="100" font-size="15" fill="#4a7fb0" text-anchor="start" font-weight="bold">Wind</text><path d="M110 150 L390 70 L390 230 Z" fill="#e8590c" opacity="0"><animate attributeName="opacity" values="0;.22" dur="2s" fill="freeze"/></path><path d="M110 150 L250 112 L250 188 Z" fill="#e8590c" opacity="0"><animate attributeName="opacity" values="0;.25" begin="1s" dur="1s" fill="freeze"/></path><circle cx="110" cy="140.0" r="7.0" fill="#e8590c"/><rect x="103.0" y="148.0" width="14.0" height="20.0" rx="4.0" fill="#e8590c"/><text x="110" y="196" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">You</text><path id="mwt-sc-p1" d="M330 290 L330 196" fill="none"/><g><g transform="translate(0 0) rotate(-90)"><ellipse rx="16" ry="8" fill="#8b5a2b"/><circle cx="17" cy="0" r="6" fill="#8b5a2b"/><path d="M19 -4 l6 -6 M19 4 l6 6" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/></g><animateMotion dur="5s" fill="freeze"><mpath href="#mwt-sc-p1"/></animateMotion></g><g opacity="0"><text x="330" y="256" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Smells you!</text><animate attributeName="opacity" values="0;1" begin="5s" dur=".4s" fill="freeze"/></g><g><g transform="translate(60 260) rotate(-60)"><ellipse rx="16" ry="8" fill="#8b5a2b"/><circle cx="17" cy="0" r="6" fill="#8b5a2b"/><path d="M19 -4 l6 -6 M19 4 l6 6" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/></g></g><text x="60" y="292" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Upwind: safe</text><text x="250" y="160" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Scent cone</text>
</svg>
