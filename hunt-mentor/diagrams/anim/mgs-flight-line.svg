<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, map view. Morning: three geese fly from the roost lake along a curved line to a stubble field. Evening: they fly the same line back to the roost. Tip: watch the line for 2 evenings before you hunt it.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Same roost, same line, same field</text><rect x="0" y="40" width="400" height="260" rx="0" fill="#dfe6d3"/><ellipse cx="70" cy="200" rx="60" ry="40" fill="#9fc3e0" stroke="#4a7fb0" stroke-width="2"/><text x="70" y="205" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Roost lake</text><rect x="260" y="70" width="120" height="100" rx="4" fill="#d9c48f" stroke="#6b4f35" stroke-width="2"/><text x="320" y="125" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Field</text><path id="mgs-flight-line-p" d="M90 185 C 150 150, 220 120, 315 110" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="7 6"/><path id="mgs-flight-line-q" d="M315 110 C 220 120, 150 150, 90 185" fill="none"/><g opacity="0"><set attributeName="opacity" to="1" begin="0s"/><set attributeName="opacity" to="0" begin="4s"/><g transform="translate(0 0) scale(0.5 0.5)"><ellipse cx="0" cy="0" rx="20" ry="7" fill="#2f3a2b"/><path d="M16 -2 L36 -4 L36 1 L16 3Z" fill="#2f3a2b"/><ellipse cx="40" cy="-2" rx="6" ry="4" fill="#2f3a2b"/><path d="M45 -3 L51 -1 L45 1Z" fill="#2f3a2b"/><path d="M-8 -3 L6 -30 L12 -3Z" fill="#2f3a2b"/><path d="M-20 0 L-28 -3 L-28 3Z" fill="#2f3a2b"/></g><animateMotion dur="3.5s" begin="0s" fill="freeze" rotate="auto"><mpath href="#mgs-flight-line-p"/></animateMotion></g><g opacity="0"><set attributeName="opacity" to="1" begin="5s"/><g transform="translate(0 0) scale(0.5 0.5)"><ellipse cx="0" cy="0" rx="20" ry="7" fill="#2f3a2b"/><path d="M16 -2 L36 -4 L36 1 L16 3Z" fill="#2f3a2b"/><ellipse cx="40" cy="-2" rx="6" ry="4" fill="#2f3a2b"/><path d="M45 -3 L51 -1 L45 1Z" fill="#2f3a2b"/><path d="M-8 -3 L6 -30 L12 -3Z" fill="#2f3a2b"/><path d="M-20 0 L-28 -3 L-28 3Z" fill="#2f3a2b"/></g><animateMotion dur="3.5s" begin="5s" fill="freeze" rotate="auto"><mpath href="#mgs-flight-line-q"/></animateMotion></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.3s"/><set attributeName="opacity" to="0" begin="4.3s"/><g transform="translate(0 0) scale(0.5 0.5)"><ellipse cx="0" cy="0" rx="20" ry="7" fill="#2f3a2b"/><path d="M16 -2 L36 -4 L36 1 L16 3Z" fill="#2f3a2b"/><ellipse cx="40" cy="-2" rx="6" ry="4" fill="#2f3a2b"/><path d="M45 -3 L51 -1 L45 1Z" fill="#2f3a2b"/><path d="M-8 -3 L6 -30 L12 -3Z" fill="#2f3a2b"/><path d="M-20 0 L-28 -3 L-28 3Z" fill="#2f3a2b"/></g><animateMotion dur="3.5s" begin="0.3s" fill="freeze" rotate="auto"><mpath href="#mgs-flight-line-p"/></animateMotion></g><g opacity="0"><set attributeName="opacity" to="1" begin="5.3s"/><g transform="translate(0 0) scale(0.5 0.5)"><ellipse cx="0" cy="0" rx="20" ry="7" fill="#2f3a2b"/><path d="M16 -2 L36 -4 L36 1 L16 3Z" fill="#2f3a2b"/><ellipse cx="40" cy="-2" rx="6" ry="4" fill="#2f3a2b"/><path d="M45 -3 L51 -1 L45 1Z" fill="#2f3a2b"/><path d="M-8 -3 L6 -30 L12 -3Z" fill="#2f3a2b"/><path d="M-20 0 L-28 -3 L-28 3Z" fill="#2f3a2b"/></g><animateMotion dur="3.5s" begin="5.3s" fill="freeze" rotate="auto"><mpath href="#mgs-flight-line-q"/></animateMotion></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.6s"/><set attributeName="opacity" to="0" begin="4.6s"/><g transform="translate(0 0) scale(0.5 0.5)"><ellipse cx="0" cy="0" rx="20" ry="7" fill="#2f3a2b"/><path d="M16 -2 L36 -4 L36 1 L16 3Z" fill="#2f3a2b"/><ellipse cx="40" cy="-2" rx="6" ry="4" fill="#2f3a2b"/><path d="M45 -3 L51 -1 L45 1Z" fill="#2f3a2b"/><path d="M-8 -3 L6 -30 L12 -3Z" fill="#2f3a2b"/><path d="M-20 0 L-28 -3 L-28 3Z" fill="#2f3a2b"/></g><animateMotion dur="3.5s" begin="0.6s" fill="freeze" rotate="auto"><mpath href="#mgs-flight-line-p"/></animateMotion></g><g opacity="0"><set attributeName="opacity" to="1" begin="5.6s"/><g transform="translate(0 0) scale(0.5 0.5)"><ellipse cx="0" cy="0" rx="20" ry="7" fill="#2f3a2b"/><path d="M16 -2 L36 -4 L36 1 L16 3Z" fill="#2f3a2b"/><ellipse cx="40" cy="-2" rx="6" ry="4" fill="#2f3a2b"/><path d="M45 -3 L51 -1 L45 1Z" fill="#2f3a2b"/><path d="M-8 -3 L6 -30 L12 -3Z" fill="#2f3a2b"/><path d="M-20 0 L-28 -3 L-28 3Z" fill="#2f3a2b"/></g><animateMotion dur="3.5s" begin="5.6s" fill="freeze" rotate="auto"><mpath href="#mgs-flight-line-q"/></animateMotion></g><g opacity="1"><text x="200" y="268" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Morning: roost to field</text><set attributeName="opacity" to="0" begin="4.6s"/></g><g opacity="0"><set attributeName="opacity" to="1" begin="4.6s"/><text x="200" y="268" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Evening: field to roost</text></g><text x="200" y="290" font-size="14" fill="#2f3a2b" text-anchor="middle">Watch it 2 evenings before you hunt (Tip)</text>
</svg>
