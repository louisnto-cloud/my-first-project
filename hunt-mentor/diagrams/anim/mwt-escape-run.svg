<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Animation, top view. A white tail feeding in an open hayfield sees a hunter, raises its white tail flag and gallops to the thick cover on the right. A note appears: it often stops just inside the cover to look back, labelled as a tip." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" fill="#f1ead0"/><text x="200" y="22" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">Spooked: flag up, run for cover</text><path d="M260 40 Q 300 120 270 300 L400 300 L400 40 Z" fill="#2f3a2b" opacity=".85"/><text x="340" y="64" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Thick cover</text><text x="110" y="280" font-size="15" fill="#6b4f35" text-anchor="middle" font-weight="bold">Open hayfield</text><path id="mwt-er-p" d="M110 170 C 170 160 230 150 300 170" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="6 6"/><g><g transform="translate(0 0) rotate(0)"><ellipse rx="16" ry="8" fill="#8b5a2b"/><circle cx="17" cy="0" r="6" fill="#8b5a2b"/><path d="M19 -4 l6 -6 M19 4 l6 6" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/></g><circle cx="-18" cy="0" r="6" fill="#ffffff"><animate attributeName="r" values="3;7" begin="1s" dur=".3s" fill="freeze"/></circle><animateMotion begin="1s" dur="2.5s" fill="freeze" rotate="auto"><mpath href="#mwt-er-p"/></animateMotion></g><circle cx="40" cy="98.0" r="7.0" fill="#e8590c"/><rect x="33.0" y="106.0" width="14.0" height="20.0" rx="4.0" fill="#e8590c"/><text x="40" y="146" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">You</text><g opacity="0"><rect x="170" y="196" width="220" height="58" rx="10" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="280" y="220" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Often stops just inside</text><text x="280" y="240" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">to look back (Tip)</text><animate attributeName="opacity" values="0;1" begin="3.6s" dur=".5s" fill="freeze"/></g>
</svg>
