<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation: a duck crosses from left to right. The shot is fired at a point ahead of it, and the duck and the shot arrive there together. At 30 m the lead is about 1 to 2 m. The gun keeps moving through the shot.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Shoot where the bird will be</text><g transform="translate(10 230) scale(0.35)"><path d="M0 20 L100 12 L112 12 L122 36 L210 34 L210 44 L112 50 L94 62 L80 56 L0 74 Z" fill="#8b5a2b" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-8" y="18" width="10" height="58" rx="3" fill="#2f3a2b" stroke="none" stroke-width="2"/><rect x="100" y="8" width="70" height="18" rx="0" fill="#6b6f68" stroke="#2f3a2b" stroke-width="2"/><rect x="170" y="10" width="200" height="8" rx="0" fill="#6b6f68" stroke="#2f3a2b" stroke-width="1"/><rect x="170" y="20" width="150" height="7" rx="0" fill="#6b6f68" stroke="#2f3a2b" stroke-width="1"/><path d="M120 48 q 2 14 20 12 l2 -12" fill="none" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="368" cy="9" r="2" fill="#c9a227" stroke="none" stroke-width="2"/></g><path id="ff-sg-lead-shot" d="M140 230 L300 90" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 5"/><g><animateTransform attributeName="transform" type="translate" values="150 90;300 90" dur="3s" fill="freeze"/><g transform="translate(0 0) scale(1.4)"><path d="M-16 0 Q -8 -10 0 0 Q 8 -10 16 0" fill="none" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="2" rx="5" ry="3" fill="#2f3a2b"/></g></g><g opacity="0"><set attributeName="opacity" to="1" begin="1.6s" fill="freeze"/><circle r="6" fill="#e8590c"><animateMotion dur="1.4s" begin="1.6s" fill="freeze"><mpath href="#ff-sg-lead-shot"/></animateMotion></circle></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.0s" dur="0.5s" fill="freeze"/><line x1="150" y1="70" x2="300" y2="70" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><text x="225" y="62" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">lead: about 1 to 2 m at 30 m</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.1s" dur="0.5s" fill="freeze"/><rect x="90" y="250" width="220" height="30" rx="15.0" fill="#2f3a2b" stroke="none" stroke-width="2"/><text x="200.0" y="269.9" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Gun keeps moving</text></g>
</svg>
