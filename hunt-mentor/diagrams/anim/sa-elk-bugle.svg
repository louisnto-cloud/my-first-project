<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 328" font-family="sans-serif" role="img" aria-label="Animation of an elk bugle drawn as a pitch line over time, beside a bull elk bugling. 1: a low start. 2: the line climbs to a high whistle scream and holds. 3: it drops and ends in a series of grunts, shown as dots. Final note: bulls are most vocal at dawn, dusk and through the night, 70 percent.">
<rect width="400" height="328" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hear a bugle: watch the pitch</text>
<line x1="40" y1="256" x2="390" y2="256" stroke="#2f3a2b" stroke-width="2"/><line x1="40" y1="56" x2="40" y2="256" stroke="#2f3a2b" stroke-width="2"/>
<path d="M396.0 256.0 L387.0 251.1 L387.0 260.9z" fill="#2f3a2b"/><path d="M40.0 50.0 L35.0 59.0 L45.0 59.0z" fill="#2f3a2b"/>
<text x="48" y="66" font-size="15" font-weight="bold" fill="#2f3a2b">high</text>
<text x="48" y="250" font-size="15" font-weight="bold" fill="#2f3a2b">low</text>
<text x="388" y="278" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">time</text>
<g transform="translate(330 150) rotate(-28)"><path d="M-8 30 C-10 14 -6 0 2 -8 L18 -14 C26 -16 34 -12 36 -6 C37 -2 34 0 30 0 L22 0 C24 2 25 6 22 8 L10 6 C8 16 8 24 10 30z" fill="#b98b5e" stroke="#4a3626" stroke-width="1.2"/><path d="M-8 30 C-10 14 -6 0 2 -8 C-6 -2 -12 10 -14 30z" fill="#5a3e26"/><path d="M22 0 L30 2 L24 6z" fill="#3a2a1c"/><circle cx="12" cy="-8" r="1.8" fill="#111"/><path d="M4 -10 C2 -24 -6 -36 -18 -44 M-2 -24 C4 -32 6 -40 4 -48 M-10 -36 C-6 -44 -6 -52 -10 -58 M-18 -44 C-24 -48 -30 -48 -34 -46 M2 -16 C10 -20 14 -26 14 -32" stroke="#d8c79e" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M38 -6 c6 -2 10 -6 12 -10 M38 0 c8 0 12 -2 16 -6" stroke="#e8590c" stroke-width="2" fill="none" stroke-linecap="round"/></g>
<path d="M50 222 Q90 216 120 192 Q150 112 180 96 L250 92 Q262 126 270 206" fill="none" stroke="#e8590c" stroke-width="6" stroke-linecap="round" stroke-dasharray="420" stroke-dashoffset="420"><animate attributeName="stroke-dashoffset" from="420" to="0" begin="0.3s" dur="3.5s" fill="freeze"/></path>
<circle cx="300" cy="230" r="8" fill="#8b5a2b" opacity="0"><set attributeName="opacity" to="1" begin="4.00s"/></circle>
<circle cx="325" cy="230" r="8" fill="#8b5a2b" opacity="0"><set attributeName="opacity" to="1" begin="4.45s"/></circle>
<circle cx="350" cy="230" r="8" fill="#8b5a2b" opacity="0"><set attributeName="opacity" to="1" begin="4.90s"/></circle>
<circle cx="375" cy="230" r="8" fill="#8b5a2b" opacity="0"><set attributeName="opacity" to="1" begin="5.35s"/></circle>
<g opacity="0"><set attributeName="opacity" to="1" begin="0.5s"/><text x="58" y="244" font-size="16" font-weight="bold" fill="#2f3a2b">1 low start</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="2.2s"/><text x="150" y="80" font-size="16" font-weight="bold" fill="#c2410c">2 high whistle scream</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="4s"/><text x="296" y="210" font-size="16" font-weight="bold" fill="#8b5a2b">3 grunts</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="6s"/><rect x="8" y="288" width="384" height="32" rx="8" fill="#2f3a2b"/><text x="200" y="310" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Most vocal at dawn, dusk and night (70%)</text></g>
