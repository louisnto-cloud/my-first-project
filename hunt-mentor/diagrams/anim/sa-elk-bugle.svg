<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 328" font-family="sans-serif" role="img" aria-label="Animation of an elk bugle drawn as a pitch line over time, beside a bull elk bugling. 1: a low start. 2: the line climbs to a high whistle scream and holds. 3: it drops and ends in a series of grunts, shown as dots. Final note: bulls are most vocal at dawn, dusk and through the night, 70 percent.">
