<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation of an elk bugle drawn as a pitch line over time. 1: a low start. 2: the line climbs to a high whistle scream and holds. 3: it drops and ends in a series of grunts, shown as dots. Final note: bulls are most vocal at dawn, dusk and through the night.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Hear a bugle: watch the pitch</text><line x1="40" y1="250" x2="390" y2="250" stroke="#2f3a2b" stroke-width="2"/><line x1="40" y1="60" x2="40" y2="250" stroke="#2f3a2b" stroke-width="2"/><text x="46" y="74" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">high</text><text x="46" y="244" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">low</text><text x="330" y="272" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">time</text><path d="M50 220 Q90 214 120 190 Q150 110 180 90 L250 86 Q262 120 270 200" fill="none" stroke="#e8590c" stroke-width="6" stroke-linecap="round" stroke-dasharray="420" stroke-dashoffset="420"><animate attributeName="stroke-dashoffset" from="420" to="0" begin="0.3s" dur="3.5s" fill="freeze"/></path><circle cx="300" cy="226" r="8" fill="#8b5a2b" opacity="0"><set attributeName="opacity" to="1" begin="4.00s"/></circle><circle cx="325" cy="226" r="8" fill="#8b5a2b" opacity="0"><set attributeName="opacity" to="1" begin="4.45s"/></circle><circle cx="350" cy="226" r="8" fill="#8b5a2b" opacity="0"><set attributeName="opacity" to="1" begin="4.90s"/></circle><circle cx="375" cy="226" r="8" fill="#8b5a2b" opacity="0"><set attributeName="opacity" to="1" begin="5.35s"/></circle><g opacity="0"><set attributeName="opacity" to="1" begin="0.5s"/><text x="60" y="200" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">1 low start</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="2.2s"/><text x="150" y="78" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">2 high whistle scream</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="4s"/><text x="282" y="206" font-size="15" font-weight="bold" fill="#8b5a2b" text-anchor="start">3 grunts</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="6s"/><rect x="60" y="112" width="250" height="34" rx="8" fill="#2f3a2b"/><text x="72" y="135" font-size="15" font-weight="bold" fill="#fff" text-anchor="start">Most vocal at dawn and dusk</text></g>
</svg>
