<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation, side view of a mountain. Ripe berries show first in the valley in July, then on the mid slopes in August, then high up in September. A black bear walks uphill following the ripe band. Final label: bears follow the ripe fruit.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Ripe fruit climbs the mountain</text><path d="M0 280 L120 230 L220 140 L300 80 L400 60 L400 300 L0 300 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><path d="M0 280 L120 230 L120 256 L0 300 Z" fill="#5b3a6b" opacity="0"><animate attributeName="opacity" values="0;0.75;0.75;0.25" keyTimes="0;0.25;0.7;1" dur="3s" begin="0s" fill="freeze"/></path><path d="M120 230 L220 140 L220 168 L120 256 Z" fill="#5b3a6b" opacity="0"><animate attributeName="opacity" values="0;0.75;0.75;0.25" keyTimes="0;0.25;0.7;1" dur="3s" begin="2.2s" fill="freeze"/></path><path d="M220 140 L300 80 L400 60 L400 86 L300 106 L220 168 Z" fill="#5b3a6b" opacity="0"><animate attributeName="opacity" values="0;0.75;0.75;0.75" keyTimes="0;0.25;0.7;1" dur="3s" begin="4.4s" fill="freeze"/></path><g opacity="0"><text x="60" y="292" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">July</text><animate attributeName="opacity" values="0;1" begin="0s" dur="0.5s" fill="freeze"/></g><g opacity="0"><text x="190" y="220" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">August</text><animate attributeName="opacity" values="0;1" begin="2.2s" dur="0.5s" fill="freeze"/></g><g opacity="0"><text x="330" y="130" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">September</text><animate attributeName="opacity" values="0;1" begin="4.4s" dur="0.5s" fill="freeze"/></g><path id="rp-ripe-wave-path" d="M40 262 L120 222 L200 160 L280 100" fill="none" stroke="none"/><g><g transform="translate(0 0) scale(0.7)"><ellipse cx="0" cy="-16" rx="20" ry="11" fill="#222"/><circle cx="20" cy="-20" r="7" fill="#222"/><circle cx="18" cy="-27" r="2.5" fill="#222"/><ellipse cx="27" cy="-19" rx="4" ry="3" fill="#6b5a4a"/><path d="M-13 -8 v8 M-6 -8 v8 M8 -8 v8 M14 -8 v8" stroke="#222" stroke-width="5"/></g><animateMotion dur="6.6s" fill="freeze"><mpath href="#rp-ripe-wave-path"/></animateMotion></g><g opacity="0"><rect x="10" y="50" width="220" height="46" rx="8" fill="#2f3a2b"/><text x="120" y="78" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Bears follow the ripe fruit</text><animate attributeName="opacity" values="0;1" begin="7s" dur="0.5s" fill="freeze"/></g>
</svg>
