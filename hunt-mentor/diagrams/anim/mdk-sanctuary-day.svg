<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Animation of a pressured mallard day. During shooting hours the ducks sit tight in a refuge. After legal light ends they fly to a field to feed, feed there at night, and fly back to the refuge before dawn. End card: hunting pressure pushes feeding into the dark, 75 percent."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="22" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A pressured mallard day</text><ellipse cx="90" cy="160" rx="72" ry="48" fill="#4a7fb0" opacity=".7"/><text x="90" y="230" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Refuge</text><rect x="260" y="112" width="130" height="96" rx="6" fill="#d9c27a"/><text x="325" y="230" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Field</text><g><animateTransform attributeName="transform" type="translate" values="70 150;70 150;300 140;300 140;70 150" keyTimes="0;0.3;0.5;0.75;1" dur="9s" fill="freeze"/><ellipse rx="12" ry="5" fill="#8b5a2b"/><circle cx="11" cy="-3" r="4" fill="#2f6e3b"/></g><g><animateTransform attributeName="transform" type="translate" values="100 168;100 168;330 158;330 158;100 168" keyTimes="0;0.3;0.5;0.75;1" dur="9s" fill="freeze"/><ellipse rx="12" ry="5" fill="#8b5a2b"/><circle cx="11" cy="-3" r="4" fill="#2f6e3b"/></g><g><animateTransform attributeName="transform" type="translate" values="120 150;120 150;350 140;350 140;120 150" keyTimes="0;0.3;0.5;0.75;1" dur="9s" fill="freeze"/><ellipse rx="12" ry="5" fill="#8b5a2b"/><circle cx="11" cy="-3" r="4" fill="#2f6e3b"/></g><g opacity="0"><set attributeName="opacity" to="1" begin="0s"/><set attributeName="opacity" to="0" begin="2.7s"/><rect x="10" y="44" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="67" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Shooting hours: sit tight in the refuge</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="2.7s"/><set attributeName="opacity" to="0" begin="4.5s"/><rect x="10" y="44" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="67" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">After legal light: fly to feed</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="4.5s"/><set attributeName="opacity" to="0" begin="6.75s"/><rect x="10" y="44" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="67" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Night: feed in the field</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="6.75s"/><rect x="10" y="44" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="67" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Before dawn: back to safety</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" begin="9.2s" dur="0.5s" fill="freeze"/><rect x="10" y="252" width="380" height="40" rx="8" fill="#e8590c"/><text x="200" y="278" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Pressure pushes feeding into the dark (75%)</text></g></svg>
