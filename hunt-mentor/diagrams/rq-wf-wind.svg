<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="View from above the water: the blind is on the near shore with the wind blowing from behind it out over the water. Decoys sit left and right with an open landing hole in front of the blind. A duck flies in facing the wind toward the blind and drops into the hole.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Ducks land into the wind</text>
<rect x="0" y="150" width="400" height="150" fill="#4a7fb0" opacity=".35"/>
<rect x="0" y="280" width="400" height="20" fill="#dfe6d3"/>
<g transform="translate(70 210) scale(0.7)"><path d="M-16 0 Q -14 -9 2 -8 L10 -8 Q 12 -16 18 -14 Q 22 -12 20 -8 L26 -7 L20 -5 Q 18 2 4 4 L-12 4 Z" fill="#2f3a2b"/></g>
<g transform="translate(90 230) scale(0.7)"><path d="M-16 0 Q -14 -9 2 -8 L10 -8 Q 12 -16 18 -14 Q 22 -12 20 -8 L26 -7 L20 -5 Q 18 2 4 4 L-12 4 Z" fill="#2f3a2b"/></g>
<g transform="translate(110 205) scale(0.7)"><path d="M-16 0 Q -14 -9 2 -8 L10 -8 Q 12 -16 18 -14 Q 22 -12 20 -8 L26 -7 L20 -5 Q 18 2 4 4 L-12 4 Z" fill="#2f3a2b"/></g>
<g transform="translate(60 245) scale(0.7)"><path d="M-16 0 Q -14 -9 2 -8 L10 -8 Q 12 -16 18 -14 Q 22 -12 20 -8 L26 -7 L20 -5 Q 18 2 4 4 L-12 4 Z" fill="#2f3a2b"/></g>
<g transform="translate(300 220) scale(0.7)"><path d="M-16 0 Q -14 -9 2 -8 L10 -8 Q 12 -16 18 -14 Q 22 -12 20 -8 L26 -7 L20 -5 Q 18 2 4 4 L-12 4 Z" fill="#2f3a2b"/></g>
<g transform="translate(320 245) scale(0.7)"><path d="M-16 0 Q -14 -9 2 -8 L10 -8 Q 12 -16 18 -14 Q 22 -12 20 -8 L26 -7 L20 -5 Q 18 2 4 4 L-12 4 Z" fill="#2f3a2b"/></g>
<g transform="translate(340 210) scale(0.7)"><path d="M-16 0 Q -14 -9 2 -8 L10 -8 Q 12 -16 18 -14 Q 22 -12 20 -8 L26 -7 L20 -5 Q 18 2 4 4 L-12 4 Z" fill="#2f3a2b"/></g>
<g transform="translate(300 250) scale(0.7)"><path d="M-16 0 Q -14 -9 2 -8 L10 -8 Q 12 -16 18 -14 Q 22 -12 20 -8 L26 -7 L20 -5 Q 18 2 4 4 L-12 4 Z" fill="#2f3a2b"/></g>
<ellipse cx="200" cy="225" rx="60" ry="30" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="6 5"/>
<text x="200" y="230" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">landing hole</text>
<rect x="170" y="268" width="60" height="22" rx="4" fill="#6b4f35"/><text x="200" y="284" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">blind</text>
<g><line x1="360" y1="140" x2="360" y2="70" stroke="#4a7fb0" stroke-width="5" stroke-linecap="round"/><polygon points="360.0,70.0 366.1,82.6 353.9,82.6" fill="#4a7fb0"/></g>
<text x="352" y="160" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4a7fb0" text-anchor="end">wind: from your back,</text>
<text x="352" y="176" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4a7fb0" text-anchor="end">out over the water</text>
<g transform="rotate(90 200 140)"><g transform="translate(200 140) scale(1.0)"><ellipse rx="13" ry="5" fill="#2f3a2b"/><circle cx="13" cy="-2" r="4" fill="#2f3a2b"/><path d="M16 -2 l6 1 l-6 2 Z" fill="#e8590c"/><path d="M-4 -2 L-14 -16 L6 -3 Z" fill="#2f3a2b"/><path d="M-4 2 L-12 15 L6 3 Z" fill="#2f3a2b"/></g></g>
<g><line x1="140" y1="120" x2="185" y2="150" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="185.0,150.0 177.1,148.9 180.9,143.1" fill="#2f3a2b"/></g>
<text x="10" y="60" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">Birds swing in from</text>
<text x="10" y="76" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">downwind, face the wind,</text>
<text x="10" y="92" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">and drop into the hole</text>
<text x="10" y="108" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">(70%).</text>
</svg>
