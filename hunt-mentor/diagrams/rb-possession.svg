<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 336" role="img" aria-label="Bar chart. Possession limit is 3 times the daily limit. Ducks: 8 a day, 24 in possession. Canada and cackling geese: 10 a day, 30 in possession. For ducks and geese this applies at all times, home freezer included. Upland birds: 3 times the daily limit while hunting or going home." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="336" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#23261f" text-anchor="middle" font-weight="bold">Possession = 3 x the daily limit</text>
<text x="12" y="64" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Ducks</text>
<rect x="12" y="74" width="88" height="24" rx="4" fill="#4a7fb0" stroke="#4a7fb0" stroke-width="2"/><text x="106" y="92" font-size="14" fill="#23261f" text-anchor="start">8 a day</text>
<rect x="12" y="104" width="264" height="24" rx="4" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="2"/><text x="18" y="122" font-size="14" fill="#ffffff" text-anchor="start" font-weight="bold">24 in possession</text>
<text x="12" y="164" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Canada and cackling geese</text>
<rect x="12" y="174" width="110" height="24" rx="4" fill="#4a7fb0" stroke="#4a7fb0" stroke-width="2"/><text x="128" y="192" font-size="14" fill="#23261f" text-anchor="start">10 a day</text>
<rect x="12" y="204" width="330" height="24" rx="4" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="2"/><text x="18" y="222" font-size="14" fill="#ffffff" text-anchor="start" font-weight="bold">30 in possession</text>
<text x="12" y="268" font-size="15" fill="#23261f" text-anchor="start">Ducks and geese: at all times,</text>
<text x="12" y="288" font-size="15" fill="#23261f" text-anchor="start">home freezer included.</text>
<text x="12" y="308" font-size="15" fill="#23261f" text-anchor="start">Upland birds: 3 x while hunting or going home.</text>
</svg>
