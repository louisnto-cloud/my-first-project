<text x="262" y="100" font-size="14" font-weight="bold" fill="#e8590c">Closed near Vernon:</text>
<text x="262" y="116" font-size="14" font-weight="bold" fill="#e8590c">Swan Lake,</text>
<text x="262" y="132" font-size="14" font-weight="bold" fill="#e8590c">Kalamalka Park,</text>
<text x="262" y="148" font-size="14" font-weight="bold" fill="#e8590c">Silver Star Park</text>
<text x="200" y="556" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Quail open in all these MUs: 1 Oct to 30 Nov (99%).</text>
</svg>
