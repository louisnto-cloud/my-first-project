<text x="164" y="488" font-size="14" fill="#6b4f35" text-anchor="end">MU 8-1</text>
<circle cx="196" cy="520" r="5" fill="#23261f"/>
<text x="204" y="522" font-size="15" font-weight="bold" fill="#23261f">Osoyoos</text>
<text x="204" y="538" font-size="14" fill="#6b4f35">MU 8-1</text>
