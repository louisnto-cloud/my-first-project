<circle cx="206" cy="540" r="5.5" fill="#2f3a2b" stroke="#fffaf0" stroke-width="1.6"/><text x="194" y="545" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="end" stroke="#eef1e2" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">Oliver</text><text x="194" y="563" font-size="14" fill="#6b5b4b" text-anchor="end" stroke="#eef1e2" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">MU 8-1</text>
<circle cx="220" cy="584" r="5.5" fill="#2f3a2b" stroke="#fffaf0" stroke-width="1.6"/><text x="232" y="589" font-size="16" font-weight="bold" fill="#2f3a2b" stroke="#eef1e2" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">Osoyoos</text><text x="232" y="607" font-size="14" fill="#6b5b4b" stroke="#eef1e2" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">MU 8-1</text>
