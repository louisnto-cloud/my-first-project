<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 670" font-family="sans-serif" role="img" aria-label="Sketch map, not to scale, of Okanagan towns from north to south with their MUs, along Okanagan, Skaha, Vaseux and Osoyoos lakes. MUs read from the map, 80 to 90 percent. Vernon at the top, MU 8-22, with Swan Lake, Kalamalka Lake Park and Silver Star Park closed. Kelowna east of Okanagan Lake, MU 8-10, west side 8-11. Peachland and Summerland on the west shore, MU 8-8. Naramata on the east shore, MU 8-9. Penticton between Okanagan and Skaha lakes, on the 8-8 and 8-9 line. Okanagan Falls and Kaleden where 8-1, 8-8 and 8-9 meet. Vaseux Lake, Oliver and Osoyoos in MU 8-1. Highway 97C, the Okanagan Connector from Peachland to Aspen Grove, has a 400 metre no hunting band. Quail are open in all these MUs from 1 October to 30 November, 99 percent.">
<rect width="400" height="670" fill="#fffaf0"/>
