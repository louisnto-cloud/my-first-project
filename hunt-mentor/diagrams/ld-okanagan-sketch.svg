<text x="204" y="448" font-size="15" font-weight="bold" fill="#23261f">Vaseux Lake</text>
<text x="204" y="464" font-size="14" fill="#6b4f35">MU 8-1</text>
<circle cx="172" cy="470" r="5" fill="#23261f"/>
