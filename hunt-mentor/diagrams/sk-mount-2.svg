<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Shooter standing, gun held low with the muzzle pushing toward the bird. Both eyes open, looking at the bird, not at the gun.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">2  Eyes on the bird, muzzle follows</text><circle cx="170" cy="92" r="10" fill="#fffaf0" stroke="#23261f" stroke-width="3.5"/><path d="M168 104 L160 180" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 180 L144 262" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 180 L188 262" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M166 112 L196 150 L232 138" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M164 114 L172 160 L186 152" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="176" y1="158" x2="300" y2="112" stroke="#6b4f35" stroke-width="6" stroke-linecap="round"/><line x1="144" y1="264" x2="300" y2="264" stroke="#8a9a6b" stroke-width="3"/><g transform="translate(350 66) scale(0.9)"><ellipse cx="0" cy="0" rx="20" ry="8" fill="#23261f"/><circle cx="-21" cy="-5" r="6" fill="#23261f"/><path d="M-27 -5 L-36 -3 L-27 -1 Z" fill="#e8590c"/><path d="M-4 -3 L6 -24 L14 -4 Z" fill="#2f3a2b"/></g><line x1="176" y1="90" x2="320" y2="64" stroke="#4a7fb0" stroke-width="2" stroke-dasharray="5 5"/><text x="240" y="58" font-size="14" font-weight="bold" text-anchor="middle" fill="#4a7fb0">eyes</text><text x="210" y="190" font-size="15" font-weight="bold" fill="#23261f">Gun low, muzzle</text><text x="210" y="208" font-size="15" fill="#23261f">pushes toward</text><text x="210" y="226" font-size="15" fill="#23261f">the bird</text><text x="20" y="60" font-size="15" font-weight="bold" fill="#23261f">Both eyes open</text><text x="20" y="78" font-size="15" fill="#23261f">on the head</text>
</svg>
