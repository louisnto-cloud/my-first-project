<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Naismith's rule: allow 1 hour for every 5 kilometres of distance plus 1 hour for every 600 metres of climb. Off trail use 4 kilometres an hour, and add time for packs, dark, brush and rests.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="40" font-family="sans-serif" font-size="18" fill="#2f3a2b" text-anchor="start" font-weight="bold">Naismith's rule (1892)</text><rect x="20" y="60" width="360" height="70" rx="10" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="92" font-family="sans-serif" font-size="20" fill="#2f3a2b" text-anchor="middle" font-weight="bold">1 hour per 5 km</text><text x="200" y="118" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="middle">flat walking distance</text><text x="200" y="150" font-family="sans-serif" font-size="24" fill="#e8590c" text-anchor="middle" font-weight="bold">+</text><rect x="20" y="165" width="360" height="70" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="200" y="197" font-family="sans-serif" font-size="20" fill="#2f3a2b" text-anchor="middle" font-weight="bold">1 hour per 600 m up</text><text x="200" y="223" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="middle">height climbed</text><text x="20" y="268" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Off trail: 4 km an hour. Add time for packs,</text><text x="20" y="286" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">dark, brush and rests (Tip).</text>
</svg>
