<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Skull step 2: simmer, never boil, for a few hours with a squirt of dish soap, about 70 degrees, 60 percent, verify. Keep the antler bases out of the water. Boiling cracks teeth and softens bone.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" fill="#dfe6d3" opacity=".35"/><circle cx="28" cy="30" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="2.5"/><text x="28" y="35" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">2</text><text x="54" y="37" font-size="19" font-weight="bold" fill="#23261f" text-anchor="start">Simmer, never boil</text><path d="M110 120 h180 v80 q0 20 -20 20 h-140 q-20 0 -20 -20 z" fill="#2f3a2b"/><rect x="114" y="132" width="172" height="70" fill="#4a7fb0" opacity=".7"/><g transform="translate(200 128) scale(2.0)"><path d="M-12 -12 Q0 -20 12 -12 L8 14 Q0 20 -8 14 Z" fill="#f5f0e0" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-5" cy="-4" r="3" fill="#2f3a2b"/><circle cx="5" cy="-4" r="3" fill="#2f3a2b"/><path d="M-10 -14 Q-20 -24 -14 -30 M-15 -22 l-6 -2 M10 -14 Q20 -24 14 -30 M15 -22 l6 -2" stroke="#6b4f35" stroke-width="3" fill="none" stroke-linecap="round"/></g><text x="330" y="100" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">about 70°C</text><text x="330" y="118" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="middle">(60%) VERIFY</text><text x="200" y="250" font-size="15" fill="#23261f" text-anchor="middle">A few hours, a squirt of dish soap. Antler</text><text x="200" y="269" font-size="15" fill="#23261f" text-anchor="middle">bases out of the water.</text>
</svg>
