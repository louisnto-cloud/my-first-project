<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 364" font-family="sans-serif" role="img" aria-label="Bullet path of a .22 LR, 40 grain at 1,235 feet per second, scope 4 cm over the bore. Zeroed at 50 m (solid orange) it stays within about 1.5 cm from 15 to 55 m, is 6 cm low at 75 m and 19 cm low at 100 m. Zeroed at 25 m (dashed) it is 1 cm low at 50 m and 21 cm low at 100 m. Hunt Mentor model, 75%."><rect x="0" y="0" width="400" height="364" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Zero at 25 m, then 50 m</text><rect x="50" y="60" width="330" height="210" fill="#FFFFFF" stroke="#1F3D2B"/><line x1="50" y1="130.0" x2="380" y2="130.0" stroke="#17201A" stroke-width="1.5"/><line x1="132.5" y1="60" x2="132.5" y2="270" stroke="#D9E0D5" stroke-width="1"/><text x="132.5" y="288" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">25 m</text><line x1="215.0" y1="60" x2="215.0" y2="270" stroke="#D9E0D5" stroke-width="1"/><text x="215.0" y="288" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">50 m</text><line x1="297.5" y1="60" x2="297.5" y2="270" stroke="#D9E0D5" stroke-width="1"/><text x="297.5" y="288" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">75 m</text><line x1="380.0" y1="60" x2="380.0" y2="270" stroke="#D9E0D5" stroke-width="1"/><text x="380.0" y="288" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">100 m</text><text x="44" y="135.0" font-size="14" font-weight="normal" text-anchor="end" fill="#17201A">0</text><text x="44" y="195.0" font-size="14" font-weight="normal" text-anchor="end" fill="#17201A">-10</text><text x="44" y="255.0" font-size="14" font-weight="normal" text-anchor="end" fill="#17201A">-20</text><text x="14" y="52" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">cm</text><path d="M50.0 154.0 L99.5 136.0 L132.5 130.0 L182.0 130.0 L215.0 136.0 L297.5 178.0 L380.0 256.0" fill="none" stroke="#1F3D2B" stroke-width="3" stroke-dasharray="7 5"/><path d="M50.0 154.0 L99.5 136.0 L132.5 127.0 L182.0 125.2 L215.0 130.0 L297.5 166.0 L380.0 244.0" fill="none" stroke="#FF6A13" stroke-width="3.5"/><line x1="60" y1="300" x2="90" y2="300" stroke="#FF6A13" stroke-width="3.5"/><text x="96" y="305" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">50 m zero: dead on 15 to 55 m</text><line x1="60" y1="324" x2="90" y2="324" stroke="#1F3D2B" stroke-width="3"/><text x="96" y="329" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">25 m zero: first step only</text><text x="200" y="352" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">Model: 40 gr at 1,235 fps (75%)</text></svg>
