<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 353" font-family="sans-serif" role="img" aria-label="Calendar bar, September to December. From 1 September to 10 December no ATV may be used for hunting in MUs 3-28, 3-29, 3-30 and the part of 3-17 shown on Map C3, synopsis page 33, 99 percent. The ATV stays home. The truck on open roads, then walk, 95 percent. Above 1,700 metres no motor vehicles except snowmobiles off existing roads and trails.">
