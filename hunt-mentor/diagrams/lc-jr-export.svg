<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 282" font-family="sans-serif" role="img" aria-label="The journal lives only on your phone. Tap Export CSV, get a .csv file, open it in any spreadsheet. Export after each trip and save it off the phone, because a lost phone loses your seasons.">
<rect x="0" y="0" width="400" height="282" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Back it up: Export CSV</text><g transform="translate(70 140) scale(2.6)"><rect x="-10" y="-18" width="20" height="36" rx="4" fill="#2f3a2b"/><rect x="-7" y="-13" width="14" height="24" fill="#dbe7f2"/><circle cx="0" cy="14" r="1.8" fill="#fff"/></g><rect x="44" y="190" width="54" height="20" rx="6" fill="#e8590c"/><text x="71" y="205" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Export</text><line x1="110" y1="140" x2="160.0" y2="140.0" stroke="#23261f" stroke-width="2.5" stroke-linecap="round"/><path d="M152.8 143.5 L160.0 140.0 L152.8 136.5" fill="none" stroke="#23261f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(200 140) scale(2.0)"><path d="M-14 -18 H8 L16 -10 V18 H-14 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -6 H10 M-8 2 H10 M-8 10 H4" stroke="#8a9a6b" stroke-width="2.5"/></g><text x="200" y="200" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">.csv file</text><line x1="240" y1="140" x2="290.0" y2="140.0" stroke="#23261f" stroke-width="2.5" stroke-linecap="round"/><path d="M282.8 143.5 L290.0 140.0 L282.8 136.5" fill="none" stroke="#23261f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="300" y="100" width="80" height="80" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><line x1="300" y1="120" x2="380" y2="120" stroke="#8a9a6b"/><line x1="320" y1="100" x2="320" y2="180" stroke="#8a9a6b"/><line x1="300" y1="140" x2="380" y2="140" stroke="#8a9a6b"/><line x1="340" y1="100" x2="340" y2="180" stroke="#8a9a6b"/><line x1="300" y1="160" x2="380" y2="160" stroke="#8a9a6b"/><line x1="360" y1="100" x2="360" y2="180" stroke="#8a9a6b"/><text x="340" y="200" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Spreadsheet</text><text x="200" y="244" font-size="14" fill="#23261f" text-anchor="middle">Lives only on your phone. Lost phone = lost seasons.</text><text x="200" y="266" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Export after each trip. Save it off the phone.</text>
</svg>
