<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 333" font-family="sans-serif" role="img" aria-label="The journal lives only on your phone. Tap Export CSV, get a .csv file, open it in any spreadsheet. Export after each trip and save it off the phone, because a lost phone loses your seasons.">
