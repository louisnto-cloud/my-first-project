<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two panels. Bird of prey: whole quills pulled clean, shafts cut or pinched, a ring of feathers on a stump, breastbone left. Mammal: shafts bitten off, feathers wet and clumped, holes from teeth, scattered or dragged. Scavengers can mix the sign, so read the whole site.">
