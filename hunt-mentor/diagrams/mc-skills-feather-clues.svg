<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" font-family="sans-serif" role="img" aria-label="Two drawings of feather sign (60%). Bird of prey: a ring of plucked feathers around a stump with the breastbone left on top; whole quills pulled clean, shafts cut or pinched. Mammal: wet, clumped feathers scattered along a drag line; shafts bitten off, holes from teeth. Scavengers can mix the sign, so read the whole site.">
