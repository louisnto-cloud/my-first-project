<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 364" font-family="sans-serif" role="img" aria-label="Your cleaning kit, 9 items: 1 one piece straight cleaning rod; 2, in orange, a bore guide that keeps the rod centred; 3 a .30 calibre bronze brush; 4 felt pellets or patches; 5 bore solvent, plus copper solvent for the yearly clean; 6 CLP gun oil that cleans, lubricates and protects; 7 a nylon chamber brush; 8 light gun grease for the lugs, cocking cam and cocking piece; 9 Torx drivers and a torque driver. Always unloaded and proved, bolt and magazine out.">
<rect x="0" y="0" width="400" height="364" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Your cleaning kit</text><g data-tip="One piece rod|straight, smooth, coated"><rect x="12" y="42" width="184" height="50" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="67" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="72" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="46" y="73" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">One piece rod</text></g><g data-tip="Bore guide|keeps the rod centred"><rect x="12" y="98" width="184" height="50" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="123" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="128" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="46" y="129" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Bore guide</text></g><g data-tip="Bronze brush|.30 calibre"><rect x="12" y="154" width="184" height="50" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="179" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="184" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="46" y="185" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Bronze brush</text></g><g data-tip="Pellets, patches|many"><rect x="12" y="210" width="184" height="50" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="235" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="240" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="46" y="241" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Pellets, patches</text></g><g data-tip="Bore solvent|and copper solvent, yearly"><rect x="12" y="266" width="184" height="50" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="291" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="296" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="46" y="297" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Bore solvent</text></g><g data-tip="CLP gun oil|cleans, lubes, protects"><rect x="204" y="42" width="184" height="50" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="222" cy="67" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="222" y="72" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text><text x="238" y="73" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">CLP gun oil</text></g><g data-tip="Chamber brush|nylon, bigger than the bore"><rect x="204" y="98" width="184" height="50" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="222" cy="123" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="222" y="128" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">7</text><text x="238" y="129" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Chamber brush</text></g><g data-tip="Light grease|lugs, cam, cocking piece"><rect x="204" y="154" width="184" height="50" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="222" cy="179" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="222" y="184" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">8</text><text x="238" y="185" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Light grease</text></g><g data-tip="Torque driver|Torx bits, right size"><rect x="204" y="210" width="184" height="50" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="222" cy="235" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="222" y="240" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">9</text><text x="238" y="241" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Torque driver</text></g><rect x="210" y="270" width="60" height="16" rx="4" fill="#FF6A13" stroke="#1F3D2B" stroke-width="1.2"/><line x1="226" y1="278" x2="384" y2="278" stroke="#1F3D2B" stroke-width="4"/><text x="296" y="304" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">rod in the guide</text><rect x="10" y="326" width="380" height="28" rx="6" fill="#1F3D2B"/><text x="200" y="345.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Unloaded and proved. Bolt and magazine out.</text>
</svg>
