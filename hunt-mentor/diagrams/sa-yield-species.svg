<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 362" font-family="sans-serif" role="img" aria-label="Bar chart of boneless meat, a rough guide, in kilograms. Average mule deer buck, Wyoming study: about 25 kilograms. Black bear of 90 kilograms: 30 to 40. Cow elk: 65 to 70. Spike fork bull moose: 100 to 120. Mature bull elk: 90 to 100. Deer figure from a study, 70 percent; the others are rough math, Tip. Rule of thumb: boneless meat is about a third of live weight.">
<rect width="400" height="362" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#23261f" text-anchor="middle">Boneless meat, rough guide</text>
<line x1="152.0" y1="44" x2="152.0" y2="282" stroke="#e2dccb" stroke-width="1.5"/>
<text x="152.0" y="300" font-size="14" fill="#5d6152" text-anchor="start">0</text>
<line x1="209.9" y1="44" x2="209.9" y2="282" stroke="#e2dccb" stroke-width="1.5"/>
<text x="209.9" y="300" font-size="14" fill="#5d6152" text-anchor="middle">30</text>
<line x1="267.8" y1="44" x2="267.8" y2="282" stroke="#e2dccb" stroke-width="1.5"/>
<text x="267.8" y="300" font-size="14" fill="#5d6152" text-anchor="middle">60</text>
<line x1="325.7" y1="44" x2="325.7" y2="282" stroke="#e2dccb" stroke-width="1.5"/>
<text x="325.7" y="300" font-size="14" fill="#5d6152" text-anchor="middle">90</text>
<line x1="383.6" y1="44" x2="383.6" y2="282" stroke="#e2dccb" stroke-width="1.5"/>
<text x="383.6" y="300" font-size="14" fill="#5d6152" text-anchor="end">120 kg</text>
<g data-tip="Mule deer buck|Average field dressed buck in a Wyoming study: about 52 kg (114 lb), giving about 25 kg (55 lb) of boneless meat (70%).">
<rect x="6" y="48" width="388" height="42" rx="6" fill="#f4eedf"/>
<text x="12" y="66" font-size="15" font-weight="bold" fill="#23261f">Mule deer buck</text>
<text x="12" y="84" font-size="15" font-weight="bold" fill="#c2410c">about 25 kg</text>
<rect x="152.0" y="58" width="46.3" height="22" rx="4" fill="#8b5a2b"/>
<rect x="198.3" y="58" width="3.8" height="22" rx="4" fill="#8b5a2b" opacity=".45"/>
</g>
<g data-tip="Black bear|A 90 kg bear gives roughly 30 to 40 kg of boneless meat once the fat is trimmed (assumption, Tip). Cook every cut to 71 °C (160 °F) (80%).">
<rect x="6" y="94" width="388" height="42" rx="6" fill="#fffaf0"/>
<text x="12" y="112" font-size="15" font-weight="bold" fill="#23261f">Black bear, 90 kg</text>
<text x="12" y="130" font-size="15" font-weight="bold" fill="#c2410c">30 to 40 kg</text>
<rect x="152.0" y="104" width="57.9" height="22" rx="4" fill="#2b2b2b"/>
<rect x="209.9" y="104" width="19.3" height="22" rx="4" fill="#2b2b2b" opacity=".45"/>
</g>
<g data-tip="Cow elk|Cows weigh up to about 225 kg (70%). Rough math from the bull figures gives about 65 to 70 kg boneless (assumption, Tip).">
<rect x="6" y="140" width="388" height="42" rx="6" fill="#f4eedf"/>
<text x="12" y="158" font-size="15" font-weight="bold" fill="#23261f">Cow elk</text>
<text x="12" y="176" font-size="15" font-weight="bold" fill="#c2410c">65 to 70 kg</text>
<rect x="152.0" y="150" width="125.5" height="22" rx="4" fill="#c7a26a"/>
<rect x="277.5" y="150" width="9.7" height="22" rx="4" fill="#c7a26a" opacity=".45"/>
</g>
<g data-tip="Spike fork moose|About 162 kg dressed in a BC Interior study (75%). The carcass is already skinned quarters; boning out keeps about 65 to 75% of it, so roughly 100 to 120 kg (Tip, 60%).">
<rect x="6" y="186" width="388" height="42" rx="6" fill="#fffaf0"/>
<text x="12" y="204" font-size="15" font-weight="bold" fill="#23261f">Spike fork moose</text>
<text x="12" y="222" font-size="15" font-weight="bold" fill="#c2410c">100 to 120 kg</text>
<rect x="152.0" y="196" width="193.0" height="22" rx="4" fill="#4a3426"/>
<rect x="345.0" y="196" width="38.6" height="22" rx="4" fill="#4a3426" opacity=".45"/>
</g>
<g data-tip="Mature bull elk|Bulls range up to about 320 to 340 kg (70%). About 30% of live weight is boneless meat: roughly 90 to 100 kg (assumption, Tip).">
<rect x="6" y="232" width="388" height="42" rx="6" fill="#f4eedf"/>
<text x="12" y="250" font-size="15" font-weight="bold" fill="#23261f">Mature bull elk</text>
<text x="12" y="268" font-size="15" font-weight="bold" fill="#c2410c">90 to 100 kg</text>
<rect x="152.0" y="242" width="173.7" height="22" rx="4" fill="#c7a26a"/>
<rect x="325.7" y="242" width="19.3" height="22" rx="4" fill="#c7a26a" opacity=".45"/>
</g>
<g data-tip="Rule of thumb|Boneless meat is about 48% of field dressed weight, or about a third of live weight (70%, deer studies).">
<rect x="8" y="312" width="384" height="42" rx="10" fill="#2f3a2b"/>
<text x="200" y="338" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Rough guide. Deer: <tspan fill="#f6b98f">study</tspan>. Rest: Tip.</text>
</g>
</svg>
