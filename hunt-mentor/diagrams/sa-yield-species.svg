<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of boneless meat, a rough guide. Average mule deer buck, Wyoming study: about 25 kilograms. A 90 kilogram black bear: about 30 to 40 kilograms once the fat is trimmed. Cow elk: about 65 to 70. Spike fork bull moose: about 75 to 90. Mature bull elk: about 90 to 100. All but the deer are assumptions worked out from rules of thumb.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Boneless meat, rough guide</text><text x="8" y="74.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Mule deer buck</text><rect x="140" y="56" width="38.2" height="26" rx="4" fill="#8b5a2b"/><text x="183.1818181818182" y="74.0" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">about 25 kg</text><text x="8" y="116.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Black bear 90 kg</text><rect x="140" y="98" width="45.8" height="26" rx="4" fill="#1d1d1b"/><rect x="185.8" y="98" width="15.3" height="26" rx="4" fill="#1d1d1b" opacity=".45"/><text x="206.0909090909091" y="116.0" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">30 to 40 kg</text><text x="8" y="158.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Cow elk</text><rect x="140" y="140" width="99.3" height="26" rx="4" fill="#c8a26b"/><rect x="239.3" y="140" width="7.6" height="26" rx="4" fill="#c8a26b" opacity=".45"/><text x="251.9090909090909" y="158.0" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">65 to 70 kg</text><text x="8" y="200.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Spike fork moose</text><rect x="140" y="182" width="114.5" height="26" rx="4" fill="#3b2a1c"/><rect x="254.5" y="182" width="22.9" height="26" rx="4" fill="#3b2a1c" opacity=".45"/><text x="282.4545454545455" y="200.0" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">75 to 90 kg</text><text x="8" y="242.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Mature bull elk</text><rect x="140" y="224" width="137.5" height="26" rx="4" fill="#c8a26b"/><rect x="277.5" y="224" width="15.3" height="26" rx="4" fill="#c8a26b" opacity=".45"/><text x="297.72727272727275" y="242.0" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">90 to 100 kg</text><text x="200" y="288" font-size="14" fill="#6b4f35" text-anchor="middle">Deer from a study (70%). Others: rough math (Tip).</text>
</svg>
