<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 352" font-family="sans-serif" role="img" aria-label="Cross section of a rocky canyon with a creek at the bottom. Chukar roost on cliffs and ledges at the top. In the morning they feed down onto grassy slopes; at midday they go to shade, draws, water and dust baths; late in the day they move back up toward the steep roosts. The hunter, labelled You, approaches from above on the rim.">
