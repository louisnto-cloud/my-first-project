<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Cross section of a rocky canyon. Chukar roost on cliffs and ledges at the top, feed on grassy slopes in the morning, go to shade, draws, water and dust baths at midday, and move back up toward steep roosts late in the day. The hunter approaches from above.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Chukar: steep, rocky, water below</text>
<path d="M0 60 L60 70 L120 140 L170 230 L200 270 L230 230 L280 140 L340 70 L400 60 L400 300 L0 300 Z" fill="#d8c9a6" stroke="#6b4f35" stroke-width="2"/>
<path d="M180 262 Q 200 280 220 262" stroke="#4a7fb0" stroke-width="8" fill="none"/>
<rect x="40" y="62" width="40" height="14" fill="#a7a39a"/><rect x="320" y="62" width="40" height="14" fill="#a7a39a"/>
<text x="8" y="52" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="start">Roost: cliffs, ledges</text>
<text x="290" y="150" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="start">Morning: feed</text>
<text x="290" y="166" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="start">on grassy</text>
<text x="290" y="182" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="start">slopes</text>
<text x="10" y="210" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4a7fb0" text-anchor="start">Midday: shade,</text>
<text x="10" y="226" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4a7fb0" text-anchor="start">draws, water,</text>
<text x="10" y="242" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4a7fb0" text-anchor="start">dusting</text>
<g transform="translate(300 100) scale(0.6)"><ellipse rx="13" ry="10" fill="#a08c6e"/><circle cx="11" cy="-9" r="6" fill="#a08c6e"/><path d="M16 -9 l5 1 l-5 2 Z" fill="#23261f"/><path d="M-12 -2 l-8 -4 l2 8 Z" fill="#a08c6e"/><rect x="-3" y="9" width="2" height="6" fill="#23261f"/><rect x="3" y="9" width="2" height="6" fill="#23261f"/></g><g transform="translate(280 120) scale(0.6)"><ellipse rx="13" ry="10" fill="#a08c6e"/><circle cx="11" cy="-9" r="6" fill="#a08c6e"/><path d="M16 -9 l5 1 l-5 2 Z" fill="#23261f"/><path d="M-12 -2 l-8 -4 l2 8 Z" fill="#a08c6e"/><rect x="-3" y="9" width="2" height="6" fill="#23261f"/><rect x="3" y="9" width="2" height="6" fill="#23261f"/></g><g transform="translate(205 250) scale(0.6)"><ellipse rx="13" ry="10" fill="#a08c6e"/><circle cx="11" cy="-9" r="6" fill="#a08c6e"/><path d="M16 -9 l5 1 l-5 2 Z" fill="#23261f"/><path d="M-12 -2 l-8 -4 l2 8 Z" fill="#a08c6e"/><rect x="-3" y="9" width="2" height="6" fill="#23261f"/><rect x="3" y="9" width="2" height="6" fill="#23261f"/></g>
<g><line x1="110" y1="150" x2="70" y2="90" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><polygon points="70.0,90.0 77.8,94.6 71.2,98.9" fill="#2f3a2b"/></g>
<text x="118" y="178" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="start">Late day: back up</text>
<g transform="translate(365 46) scale(0.9)"><circle cy="-14" r="6" fill="#e8590c"/><rect x="-6" y="-8" width="12" height="16" rx="3" fill="#e8590c"/><rect x="-5" y="8" width="4" height="10" fill="#2f3a2b"/><rect x="1" y="8" width="4" height="10" fill="#2f3a2b"/></g><text x="365" y="90" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="middle">You, above</text>
</svg>
