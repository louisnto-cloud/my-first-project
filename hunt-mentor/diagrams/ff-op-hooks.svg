<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Memory hooks: lens divided by power equals exit pupil. 8 for wood, 10 for open slopes. Binocular, spotter, scope: find, judge, aim. Sky, then set: reticle focus once. No IR: thermal optics are banned on the hunt.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Memory hooks</text><rect x="20" y="50" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="75" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Lens ÷ power</text><text x="190" y="75" font-size="15" fill="#23261f" text-anchor="start">= exit pupil</text><rect x="20" y="96" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="121" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">8 for wood</text><text x="190" y="121" font-size="15" fill="#23261f" text-anchor="start">10 for open slopes</text><rect x="20" y="142" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="167" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Bino, spot, scope</text><text x="190" y="167" font-size="15" fill="#23261f" text-anchor="start">find, judge, aim</text><rect x="20" y="188" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="213" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Sky, then set</text><text x="190" y="213" font-size="15" fill="#23261f" text-anchor="start">reticle focus once</text><rect x="20" y="234" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="259" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">No IR</text><text x="190" y="259" font-size="15" fill="#23261f" text-anchor="start">thermal optics banned</text>
</svg>
