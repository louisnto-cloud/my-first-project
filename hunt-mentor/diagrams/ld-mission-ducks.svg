<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 612" font-family="sans-serif" role="img" aria-label="Cards for duck water near Mission. Fraser River in bylaw Area B: shotgun with shot only while hunting, 99 percent. Pitt Addington Marsh: some areas on certain days, posted on site, 80 percent, special licence applies. Hatzic Lake and Harrison Bay: firearms using shot only. Parts of Hatzic Slough, Hatzic Prairie and Deroche: No Shooting areas. Matsqui Island is Indian Reserve 3, ask the band first. Lhá:lt Harrison Chehalis and Bert Brink Wildlife Management Areas: hunting status VERIFY. Boundary Bay: closed to snipe hunting.">
