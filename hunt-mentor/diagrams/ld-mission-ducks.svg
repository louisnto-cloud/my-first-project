<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 523" font-family="sans-serif" role="img" aria-label="Duck water near Mission. Read the legal text before you set up. Fraser River in bylaw Area B: shotgun with shot only while hunting, 99 percent. Hatzic Lake and Harrison Bay: firearms using shot only, 98 percent. Pitt Addington Marsh: some areas on certain days, posted on site, 80 percent, special licence applies. Matsqui Island is Indian Reserve 3, reserve land, ask the band first, 95 percent. Lhá:lt Harrison Chehalis and Bert Brink Wildlife Management Areas: hunting status VERIFY. Parts of Hatzic Slough, Hatzic Prairie and Deroche: No Shooting areas, 98 percent. Boundary Bay Wildlife Management Area: closed to snipe hunting, 99 percent.">
