<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Where to look for moose by season, local reading. Early fall: lake edges and subalpine basins. October: willow flats, wetlands, young cutblocks and burns. Deep snow: old conifer stands and willow bottoms. Wells Gray Park, MU 3-45, is closed to hunting and firearm discharge. Region 3 bans motor vehicles above 1,700 metres except snowmobiles and except on existing roads and trails.">
