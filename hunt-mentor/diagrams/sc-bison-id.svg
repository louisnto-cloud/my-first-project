<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Two bison side by side. Wood bison: taller hump, darker and slightly bigger, shorter hair on the front end. Plains bison: lower hump, shaggy front and legs. Bulls weigh about 550 to 900 kilograms, cows 320 to 545, 85 percent." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Wood bison or plains bison?</text>
<text x="100" y="56" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Wood bison</text>
<text x="300" y="56" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Plains bison</text>
<g transform="translate(110 130) scale(1.1)"><path d="M-50,26 L-52,58 M-36,28 L-36,58 M50,28 L52,58 M64,28 L66,58" stroke="#23261f" stroke-width="8" stroke-linecap="round"/><path d="M-60,-6 C-62,-40 -40,-66 -14,-62 C10,-58 30,-40 56,-30 C70,-26 76,-12 74,8 L72,30 L-56,30 Z" fill="#3a2616" stroke="#23261f" stroke-width="1.5"/><path d="M-58,-14 L-80,-6 L-86,18 L-74,30 L-56,22 Z" fill="#3a2616" stroke="#23261f" stroke-width="1.5"/><path d="M-66,-10 c-6 -8 2 -14 6 -10" fill="none" stroke="#111" stroke-width="3"/><circle cx="-72" cy="2" r="2" fill="#fff"/></g>
<g transform="translate(310 130) scale(1.0)"><path d="M-50,26 L-52,58 M-36,28 L-36,58 M50,28 L52,58 M64,28 L66,58" stroke="#23261f" stroke-width="8" stroke-linecap="round"/><path d="M-60,-6 C-62,-34 -34,-52 -6,-50 C20,-46 36,-36 56,-30 C70,-26 76,-12 74,8 L72,30 L-56,30 Z" fill="#6b4a2b" stroke="#23261f" stroke-width="1.5"/><path d="M-58,-14 L-80,-6 L-86,18 L-74,30 L-56,22 Z" fill="#6b4a2b" stroke="#23261f" stroke-width="1.5"/><path d="M-66,-10 c-6 -8 2 -14 6 -10" fill="none" stroke="#111" stroke-width="3"/><circle cx="-72" cy="2" r="2" fill="#fff"/><path d="M-56,22 L-62,48 L-44,34 L-40,52 L-28,30 Z" fill="#6b4a2b" stroke="#23261f"/><path d="M-78,26 L-80,42 L-70,30 Z" fill="#6b4a2b"/></g>
<line x1="200" y1="40" x2="200" y2="240" stroke="#8a9a6b" stroke-dasharray="6 6" stroke-width="2"/>
<text x="100" y="216" font-size="14" fill="#23261f" text-anchor="middle">Taller hump,</text>
<text x="100" y="234" font-size="14" fill="#23261f" text-anchor="middle">darker, bigger,</text>
<text x="100" y="252" font-size="14" fill="#23261f" text-anchor="middle">shorter front hair</text>
<text x="300" y="216" font-size="14" fill="#23261f" text-anchor="middle">Lower hump,</text>
<text x="300" y="234" font-size="14" fill="#23261f" text-anchor="middle">shaggy front</text>
<text x="300" y="252" font-size="14" fill="#23261f" text-anchor="middle">and legs</text>
<rect x="10" y="266" width="380" height="28" rx="6" fill="#f3ead8" stroke="#2f3a2b" stroke-width="2"/>
<text x="200.0" y="284.9" font-size="14" fill="#23261f" text-anchor="middle">Bulls 550 to 900 kg, cows 320 to 545 kg (85%)</text>
</svg>
