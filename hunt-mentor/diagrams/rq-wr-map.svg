<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 404" font-family="sans-serif" role="img" aria-label="Sketch map, not to scale, north up. Kamloops sits where the rivers meet, with Kamloops Lake to the west. A dashed box around Heffley Creek, up the North Thompson, is labelled no approved UWR, Ungulate Winter Range. The Dewdrop Rosseau Creek Wildlife Management Area sits on the north shore of Kamloops Lake, Map C16. Approved mule deer winter range order u-3-003 lies south toward Merritt and Logan Lake. Order u-8-001 lies on the North Okanagan side.">
