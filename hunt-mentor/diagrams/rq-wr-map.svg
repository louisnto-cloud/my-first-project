<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Sketch map, not to scale. A dashed box around Heffley Creek is labelled no approved ungulate winter range. The Dewdrop Rosseau Creek Wildlife Management Area sits on the north shore of Kamloops Lake, Map C16. Approved mule deer winter range order u-3-003 lies south toward Merritt and Logan Lake. Order u-8-001 lies on the North Okanagan side.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
