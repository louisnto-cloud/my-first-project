<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 304" role="img" aria-label="A document card for order u-3-003, Merritt Timber Supply Area, mule deer. Its authority is the Government Actions Regulation. It sets rules for timber harvest, silviculture and roads, requires keeping snow interception cover, and says nothing about hunting. Signed 21 January 2008.">
<rect x="0" y="0" width="400" height="304" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">What order u-3-003 says</text>
<rect x="30" y="44" width="340" height="236" rx="6" fill="#fff" stroke="#2f3a2b" stroke-width="2"/>
<text x="200" y="72" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">ORDER: UNGULATE WINTER RANGE</text>
<text x="200" y="92" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">u-3-003, Merritt TSA, mule deer</text>
<rect x="50" y="112" width="300" height="32" rx="6" fill="#2f3a2b"/>
<text x="200" y="133" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Authority: Government Actions Regulation</text>
<rect x="50" y="152" width="300" height="32" rx="6" fill="#2f3a2b"/>
<text x="200" y="173" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Rules for timber harvest, silviculture, roads</text>
<rect x="50" y="192" width="300" height="32" rx="6" fill="#e8590c"/>
<text x="200" y="213" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Keep snow interception cover</text>
<rect x="50" y="232" width="300" height="32" rx="6" fill="#4a7fb0"/>
<text x="200" y="253" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Nothing about hunting</text>
<text x="200" y="294" font-family="sans-serif" font-size="13" fill="#6b4f35" text-anchor="middle">Signed 21 January 2008 (99%, read directly)</text>
</svg>
