<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 342" font-family="sans-serif" role="img" aria-label="Match three stamps before you load: 1 the calibre stamped on the side of the barrel, .308 Win; 2 the headstamp on the base of each cartridge, .308 WIN; 3 the label on the box. All three must say .308 Winchester.">
<rect x="0" y="0" width="400" height="342" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Match 3 stamps before you load</text><rect x="12" y="42" width="376" height="64" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><rect x="30" y="62" width="250" height="24" fill="#C9D0C6" stroke="#1F3D2B" stroke-width="1.4"/><text x="155" y="80" font-size="15" fill="#1F3D2B" text-anchor="middle" font-weight="bold">.308 WIN</text><circle cx="330" cy="74" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="330" y="79" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="300" y="100" font-size="14" fill="#17201A" text-anchor="middle">barrel</text><rect x="12" y="114" width="376" height="104" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="110" cy="166" r="42" fill="#C9A54A" stroke="#1F3D2B" stroke-width="2"/><circle cx="110" cy="166" r="11" fill="#C9D0C6" stroke="#1F3D2B" stroke-width="1.4"/><text x="110" y="140" font-size="12" fill="#17201A" text-anchor="middle" font-weight="bold">MAKER</text><text x="110" y="202" font-size="12" fill="#17201A" text-anchor="middle" font-weight="bold">.308 WIN</text><circle cx="330" cy="166" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="330" y="171" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="240" y="172" font-size="14" fill="#17201A" text-anchor="middle">headstamp</text><rect x="12" y="226" width="376" height="64" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><rect x="30" y="240" width="180" height="38" rx="4" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.4"/><text x="120" y="264" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">308 Win 150 gr</text><circle cx="330" cy="258" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="330" y="263" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="250" y="264" font-size="14" fill="#17201A" text-anchor="middle">box</text><rect x="10" y="300" width="380" height="30" rx="6" fill="#FF6A13"/><text x="200" y="320.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">All 3 must say .308 Winchester.</text>
</svg>
