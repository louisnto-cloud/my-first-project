<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 4. After the flush, mark where single birds land in cover. Singles hold tighter than a covey. Follow them up one at a time."><rect width="400" height="300" fill="#fffaf0"/><rect width="400" height="300" fill="#efe6cf"/><circle cx="300" cy="80" r="22" fill="#8a9a6b"/><circle cx="340" cy="150" r="22" fill="#8a9a6b"/><circle cx="100" cy="90" r="22" fill="#8a9a6b"/><g transform="translate(300 80) scale(1)"><ellipse rx="8" ry="6" fill="#6b6f78"/><circle cx="7" cy="-4" r="4" fill="#2f3a2b"/><path d="M7 -8 q3 -6 -1 -8" stroke="#2f3a2b" stroke-width="2" fill="none"/></g><g transform="translate(340 150) scale(1)"><ellipse rx="8" ry="6" fill="#6b6f78"/><circle cx="7" cy="-4" r="4" fill="#2f3a2b"/><path d="M7 -8 q3 -6 -1 -8" stroke="#2f3a2b" stroke-width="2" fill="none"/></g><g transform="translate(100 90) scale(1)"><ellipse rx="8" ry="6" fill="#6b6f78"/><circle cx="7" cy="-4" r="4" fill="#2f3a2b"/><path d="M7 -8 q3 -6 -1 -8" stroke="#2f3a2b" stroke-width="2" fill="none"/></g><circle cx="200" cy="250" r="10" fill="#e8590c"/><g stroke="#e8590c" stroke-width="2" stroke-dasharray="5 5"><line x1="200" y1="250" x2="296" y2="96"/><line x1="200" y1="250" x2="334" y2="164"/><line x1="200" y1="250" x2="106" y2="106"/></g><text x="12" y="30" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Mark where singles land</text><text x="12" y="50" font-size="15" fill="#2f3a2b" text-anchor="start">They hold tighter now (Tip)</text><text x="200" y="284" font-size="15" fill="#2f3a2b" text-anchor="middle">Follow up one at a time</text></svg>
