<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif" role="img" aria-label="Pellets drawn to scale against a centimetre ruler. Deer: oval pellets about 1 to 1.5 cm long. Elk: rounder, 1 to 1.5 cm across, often dimpled on one end. Moose: big, 1.5 to 2 cm across and 2.5 to 4 cm long. Snowshoe hare: slightly flat round balls about 1.2 cm.">
  <rect width="400" height="320" fill="#fffaf0"/>
  <text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pellets drawn to scale</text>
  <g data-tip="Deer pellets|Oval pellets about 1 to 1.5 cm long, in piles. Summer on green feed: soft clumps. Fall and winter: firm separate pellets.">
    <rect x="14" y="46" width="96" height="184" rx="10" fill="#f3ece0"/>
    <g fill="#5c3b1c">
      <ellipse cx="46" cy="92" rx="8" ry="12.5"/><ellipse cx="74" cy="88" rx="8" ry="12.5" transform="rotate(20 74 88)"/><ellipse cx="54" cy="122" rx="8" ry="12.5" transform="rotate(-30 54 122)"/><ellipse cx="80" cy="120" rx="8" ry="12.5"/>
    </g>
    <text x="62" y="176" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Deer</text>
    <text x="62" y="198" font-size="15" fill="#b3470a" text-anchor="middle">oval</text>
    <text x="62" y="218" font-size="15" fill="#b3470a" text-anchor="middle">1 to 1.5 cm</text>
  </g>
  <g data-tip="Elk pellets|Rounder, about 1 to 1.5 cm across, often dimpled on one end, in bigger piles. Summer: soft patties like a small cow pie.">
    <rect x="114" y="46" width="96" height="184" rx="10" fill="#f3ece0"/>
    <g fill="#5c3b1c"><circle cx="146" cy="96" r="12.5"/><circle cx="176" cy="100" r="12.5"/><circle cx="160" cy="126" r="12.5"/></g>
    <path d="M141 88 q5 5 10 0 M171 92 q5 5 10 0" stroke="#e9d9bd" stroke-width="2.2" fill="none"/>
    <text x="162" y="176" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Elk</text>
    <text x="162" y="198" font-size="15" fill="#b3470a" text-anchor="middle">round, dimple</text>
    <text x="162" y="218" font-size="15" fill="#b3470a" text-anchor="middle">1 to 1.5 cm</text>
  </g>
  <g data-tip="Moose pellets|Big: about 1.5 to 2 cm across and 2.5 to 4 cm long. Winter pellets look like pressed sawdust. Summer: loose patties.">
    <rect x="214" y="46" width="96" height="184" rx="10" fill="#f3ece0"/>
    <g fill="#5c3b1c"><ellipse cx="246" cy="100" rx="17" ry="32"/><ellipse cx="282" cy="108" rx="17" ry="30" transform="rotate(18 282 108)"/></g>
    <text x="262" y="176" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Moose</text>
    <text x="262" y="198" font-size="15" fill="#b3470a" text-anchor="middle">big oval</text>
    <text x="262" y="218" font-size="15" fill="#b3470a" text-anchor="middle">2.5 to 4 cm</text>
  </g>
  <g data-tip="Snowshoe hare|Slightly flat balls about 1.2 cm, light brown, sawdust inside. Dropped singly; piles only where it fed a long time.">
    <rect x="314" y="46" width="76" height="184" rx="10" fill="#f3ece0"/>
    <g fill="#a0784a"><ellipse cx="340" cy="100" rx="12" ry="10"/><ellipse cx="364" cy="124" rx="12" ry="10"/></g>
    <text x="352" y="176" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hare</text>
    <text x="352" y="198" font-size="15" fill="#b3470a" text-anchor="middle">flat ball</text>
    <text x="352" y="218" font-size="15" fill="#b3470a" text-anchor="middle">1.2 cm</text>
  </g>
  <g data-tip="Ruler and tracks|Each tick is 1 cm. Sizes overlap, so check the tracks beside the pile. Piles are not a count of deer.">
    <rect x="20" y="244" width="360" height="34" fill="#f3d36b" stroke="#2f3a2b"/>
    <path d="M30 244 v14 M50 244 v8 M70 244 v8 M90 244 v8 M110 244 v8 M130 244 v14 M150 244 v8 M170 244 v8 M190 244 v8 M210 244 v8 M230 244 v14 M250 244 v8 M270 244 v8 M290 244 v8 M310 244 v8 M330 244 v14 M350 244 v8 M370 244 v8" stroke="#2f3a2b" stroke-width="1.5" fill="none"/>
    <g font-size="14" fill="#2f3a2b" text-anchor="middle"><text x="30" y="273">0</text><text x="130" y="273">5</text><text x="230" y="273">10</text><text x="330" y="273">15 cm</text></g>
  </g>
  <text x="200" y="306" font-size="15" fill="#6b4f35" text-anchor="middle">Summer on green feed: soft clumps or patties</text>
</svg>
