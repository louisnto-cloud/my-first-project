<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 305" font-family="sans-serif" role="img" aria-label="Two deer tracks drawn roughly to scale over a centimetre ruler. Small front track about 5.7 cm long; big track about 10 cm long with two dewclaw dots behind, which show in soft ground or when running. The pointed end shows the way the deer travelled. One track cannot tell a mule deer from a white tail.">
