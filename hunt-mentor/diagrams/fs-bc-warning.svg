<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A bear telling you to back off: jaw popping, woofing, moaning, stomping, a bluff charge that stops short, ears back and head low. It is stressed and defensive. Give it room.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A bear telling you: back off</text><rect x="20" y="48" width="112" height="80" rx="10" fill="#fff3d6" stroke="#e8590c" stroke-width="2"/><text x="76" y="82" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Jaw popping</text><text x="76" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">teeth clacking</text><rect x="145" y="48" width="112" height="80" rx="10" fill="#fff3d6" stroke="#e8590c" stroke-width="2"/><text x="201" y="82" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Woofing</text><text x="201" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">loud huffs</text><rect x="270" y="48" width="112" height="80" rx="10" fill="#fff3d6" stroke="#e8590c" stroke-width="2"/><text x="326" y="82" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Moaning</text><text x="326" y="104" font-size="14" fill="#2f3a2b" text-anchor="middle">low sound</text><rect x="20" y="144" width="112" height="80" rx="10" fill="#fff3d6" stroke="#e8590c" stroke-width="2"/><text x="76" y="178" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Stomping</text><text x="76" y="200" font-size="14" fill="#2f3a2b" text-anchor="middle">paws slap</text><rect x="145" y="144" width="112" height="80" rx="10" fill="#fff3d6" stroke="#e8590c" stroke-width="2"/><text x="201" y="178" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bluff charge</text><text x="201" y="200" font-size="14" fill="#2f3a2b" text-anchor="middle">runs, stops short</text><rect x="270" y="144" width="112" height="80" rx="10" fill="#fff3d6" stroke="#e8590c" stroke-width="2"/><text x="326" y="178" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Ears back</text><text x="326" y="200" font-size="14" fill="#2f3a2b" text-anchor="middle">head low</text><rect x="41" y="254" width="317" height="30" rx="6" fill="#e8590c"/><text x="200" y="275" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Stressed, defensive. Give it room</text>
</svg>
