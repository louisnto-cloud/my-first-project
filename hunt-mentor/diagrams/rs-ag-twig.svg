<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="sans-serif" role="img" aria-label="Fresh break: the wood is pale, moist and may show sap. Old break: grey, dry and dark. The same reading works for browse tips and buck rubs.">
<rect x="0" y="0" width="400" height="290" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Broken twigs age too</text>
<rect x="16" y="64" width="176" height="180" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="104" y="88" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Fresh break</text><path d="M40 200 L100 150" fill="none" stroke="#6b4f35" stroke-width="8"/><path d="M100 150 l10 -8 l-6 14 l14 -6" fill="#f6e7b5" stroke="#f6e7b5" stroke-width="3"/><text x="104" y="230" font-size="14" fill="#23261f" text-anchor="middle">pale, moist, sap</text><rect x="208" y="64" width="176" height="180" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="296" y="88" font-size="16" font-weight="bold" fill="#8a9a6b" text-anchor="middle">Old break</text><path d="M232 200 L292 150" fill="none" stroke="#6b4f35" stroke-width="8"/><path d="M292 150 l10 -8 l-6 14 l14 -6" fill="#9e9a8a" stroke="#9e9a8a" stroke-width="3"/><text x="296" y="230" font-size="14" fill="#23261f" text-anchor="middle">grey, dry, dark</text><text x="200" y="274" font-size="15" fill="#23261f" text-anchor="middle">Same for browse tips and rubs (Tip)</text>
</svg>
