<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Timeline January to December. Antlers are cast from January to March, grow in velvet from April to August, the velvet is rubbed off in early September, and the antlers stay hard from September to December. Day length drives the cycle through testosterone." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">Antler year</text><text x="44.0" y="270" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">J</text><text x="72.0" y="270" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">F</text><text x="100.0" y="270" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">M</text><text x="128.0" y="270" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">A</text><text x="156.0" y="270" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">M</text><text x="184.0" y="270" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">J</text><text x="212.0" y="270" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">J</text><text x="240.0" y="270" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">A</text><text x="268.0" y="270" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">S</text><text x="296.0" y="270" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">O</text><text x="324.0" y="270" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">N</text><text x="352.0" y="270" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">D</text><text x="30" y="50" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Cast (drop)</text><rect x="30" y="58" width="84" height="22" rx="5" fill="#c9b79c"/><text x="30" y="102" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Grow in velvet</text><rect x="114" y="110" width="140" height="22" rx="5" fill="#8a9a6b"/><text x="30" y="154" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Rub velvet off</text><rect x="254" y="162" width="17" height="22" rx="5" fill="#e8590c"/><text x="30" y="206" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Hard antler</text><rect x="268" y="214" width="98" height="22" rx="5" fill="#6b4f35"/><line x1="30" y1="254" x2="366" y2="254" stroke="#23261f" stroke-width="2"/><text x="200" y="294" font-size="14" fill="#6b4f35" text-anchor="middle">Day length drives it, through testosterone.</text>
</svg>
