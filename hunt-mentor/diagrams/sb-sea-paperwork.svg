<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 332" font-family="sans-serif" role="img" aria-label="Four cards you need to hunt the coast in MU 2-4 and in Mission, 98 percent. Your BC hunting licence. The federal Migratory Game Bird Hunting Permit with the habitat stamp, 17 dollars. The Fraser Valley Special Area licence, 10 dollars. And 1,000,000 dollars of public liability insurance. Missing one means no hunt in MU 2-4.">
<rect width="400" height="332" fill="#fffaf0"/>
<text x="200" y="28" font-size="17.5" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Coast paperwork: MU 2-4 and Mission (98%)</text>
<rect x="20" y="44" width="360" height="52" rx="10" fill="#4a7fb0"/>
<text x="36" y="77" font-size="18" font-weight="bold" fill="#ffffff">BC hunting licence</text>
<circle cx="350" cy="70" r="16" fill="#ffffff"/><path d="M343.6 71.0 l5.2 5.2 l10.5 -11.6" fill="none" stroke="#2f6e3b" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20" y="104" width="360" height="52" rx="10" fill="#4a7fb0"/>
<text x="36" y="127" font-size="18" font-weight="bold" fill="#ffffff">Federal bird permit</text>
<text x="36" y="147" font-size="16" fill="#ffffff">MGBHP + stamp: $17</text>
<circle cx="350" cy="130" r="16" fill="#ffffff"/><path d="M343.6 131.0 l5.2 5.2 l10.5 -11.6" fill="none" stroke="#2f6e3b" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20" y="164" width="360" height="52" rx="10" fill="#e8590c"/>
<text x="36" y="187" font-size="18" font-weight="bold" fill="#ffffff">Fraser Valley Special</text>
<text x="36" y="207" font-size="16" fill="#ffffff">Area licence: $10</text>
<circle cx="350" cy="190" r="16" fill="#ffffff"/><path d="M343.6 191.0 l5.2 5.2 l10.5 -11.6" fill="none" stroke="#2f6e3b" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20" y="224" width="360" height="52" rx="10" fill="#e8590c"/>
<text x="36" y="247" font-size="18" font-weight="bold" fill="#ffffff">Liability insurance</text>
<text x="36" y="267" font-size="16" fill="#ffffff">$1,000,000</text>
<circle cx="350" cy="250" r="16" fill="#ffffff"/><path d="M343.6 251.0 l5.2 5.2 l10.5 -11.6" fill="none" stroke="#2f6e3b" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20" y="286" width="360" height="36" rx="8" fill="#fbe3dc" stroke="#b3261e" stroke-width="1.6"/>
<text x="200" y="310" font-size="17" font-weight="bold" fill="#b3261e" text-anchor="middle">Missing one? No hunt in MU 2-4</text>
</svg>
