<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 627" font-family="sans-serif" role="img" aria-label="Region 8 bird limits, day and possession, synopsis page 68. 10 (30) means 10 a day, 30 in possession. Grouse, dusky, ruffed and spruce, all together: 5 (15). Chukar partridge: 5 (15). Gray partridge (Hungarian): 3 (9). Pheasant (cocks): 2 (6). Quail: 10 (30). Turkey: 1 each season, marked with a triangle, 2 a year. Dove, mourning and Eurasian collared: 5 (15). Ducks: 8 (24). Common snipe: 10 (30). Coots: 10 (30). Geese, Canada and cackling: 10 (30). Geese, snow and Ross&#x27;s: 5 (15). Geese, white fronted: 5 (15).">
