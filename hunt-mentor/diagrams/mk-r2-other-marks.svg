<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 355" font-family="sans-serif" role="img" aria-label="Footnotes: goat, bear, wolf, bobcat and cougar. Goat: Stay out of Maps B9, B18, B19. Inspection. Black bear: 2 per licence year, Apr 1 to Mar 31. Wolf, bobcat: Compulsory Reporting. Cougar: No kittens or cougars with them. Inspection.">
