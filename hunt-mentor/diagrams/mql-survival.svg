<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart from an early California banding study, 60 percent, search preview. Of 101 quail banded, 52 were known alive at 6 months, 15 at 1 year, 4 at 2 years and 1 at 3 years. Lesson: most quail in a fall covey are young of the year.">
