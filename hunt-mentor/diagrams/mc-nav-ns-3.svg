<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 3: in Go and Track, Back to start shows distance and heading, for example 1.9 kilometres at 214 degrees. With only a truck waypoint, measure from your dot to the pin.">
<rect width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c"/><text x="26" y="31" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">3</text><text x="52" y="32" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Back to start or the truck pin</text><g transform="translate(110 160) scale(1.6)"><rect x="-26" y="-48" width="52" height="96" rx="9" fill="#2f3a2b"/><rect x="-21" y="-40" width="42" height="76" rx="3" fill="#dfe6d3"/><circle cx="0" cy="42" r="3" fill="#fffaf0"/></g><text x="230" y="110" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Go &amp; Track:</text><text x="230" y="140" font-size="15" fill="#23261f" text-anchor="start">Back to start</text><text x="230" y="170" font-size="15" fill="#23261f" text-anchor="start">1.9 km, 214°</text><text x="230" y="200" font-size="15" fill="#23261f" text-anchor="start">Or Measure to pin</text><circle cx="110" cy="130" r="6" fill="#2f9e44"/><line x1="110" y1="130" x2="110" y2="175" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="110" cy="175" r="5" fill="#4a7fb0"/>
</svg>
