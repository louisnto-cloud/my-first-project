<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Four cards. Strong wind: birds seek calm sheltered water, a tip. Storm: geese fly through the day, 70 percent. Cold snap and ice: new birds arrive and ponds lock up, 75 percent. Bluebird calm days: short dawn flights then quiet, a tip.">
<rect x="0" y="0" width="400" height="320" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Weather and the daily flights</text>
<rect x="10" y="40" width="186" height="128" rx="10" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="1.5"/>
<g><line x1="22" y1="74" x2="58" y2="74" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="58.0,74.0 49.0,78.3 49.0,69.7" fill="#4a7fb0"/></g>
<text x="70" y="70" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Strong wind</text>
<text x="20" y="114" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Birds seek calm,</text>
<text x="20" y="131" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">sheltered water (Tip).</text>
<rect x="204" y="40" width="186" height="128" rx="10" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="1.5"/>
<g transform="translate(234 70) scale(0.8)" fill="#9aa6b2"><circle cx="-14" cy="4" r="11"/><circle cx="2" cy="-4" r="15"/><circle cx="18" cy="4" r="11"/><rect x="-14" y="4" width="32" height="11"/></g><line x1="222" y1="84" x2="218" y2="96" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/><line x1="231" y1="84" x2="227" y2="96" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/><line x1="240" y1="84" x2="236" y2="96" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/>
<text x="264" y="70" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Storm</text>
<text x="214" y="114" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Geese fly through the</text>
<text x="214" y="131" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">day (70%).</text>
<rect x="10" y="176" width="186" height="128" rx="10" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="1.5"/>
<text x="26" y="210" font-family="sans-serif" font-size="14" fill="#4a7fb0">*</text><text x="36" y="218" font-family="sans-serif" font-size="14" fill="#4a7fb0">*</text><text x="46" y="210" font-family="sans-serif" font-size="14" fill="#4a7fb0">*</text><text x="56" y="218" font-family="sans-serif" font-size="14" fill="#4a7fb0">*</text>
<text x="70" y="206" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Cold snap, ice</text>
<text x="20" y="250" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">New birds arrive, ponds</text>
<text x="20" y="267" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">lock (75%).</text>
<rect x="204" y="176" width="186" height="128" rx="10" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="1.5"/>
<g><circle cx="234" cy="210" r="12" fill="#e8590c"/><line x1="234" y1="194" x2="234" y2="187" stroke="#e8590c" stroke-width="3" transform="rotate(0 234 210)"/><line x1="234" y1="194" x2="234" y2="187" stroke="#e8590c" stroke-width="3" transform="rotate(45 234 210)"/><line x1="234" y1="194" x2="234" y2="187" stroke="#e8590c" stroke-width="3" transform="rotate(90 234 210)"/><line x1="234" y1="194" x2="234" y2="187" stroke="#e8590c" stroke-width="3" transform="rotate(135 234 210)"/><line x1="234" y1="194" x2="234" y2="187" stroke="#e8590c" stroke-width="3" transform="rotate(180 234 210)"/><line x1="234" y1="194" x2="234" y2="187" stroke="#e8590c" stroke-width="3" transform="rotate(225 234 210)"/><line x1="234" y1="194" x2="234" y2="187" stroke="#e8590c" stroke-width="3" transform="rotate(270 234 210)"/><line x1="234" y1="194" x2="234" y2="187" stroke="#e8590c" stroke-width="3" transform="rotate(315 234 210)"/></g>
<text x="264" y="206" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Bluebird calm</text>
<text x="214" y="250" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Short dawn flights, then</text>
<text x="214" y="267" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">quiet (Tip).</text>
</svg>
