<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Looking down a rifled bore from the muzzle. The cut spiral channels are the grooves. The raised ridges between them are the lands. Measured land to land is the calibre. The bullet is pressed into the lands and they twist it. A shotgun has no rifling and is called a smoothbore.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Lands and grooves</text><circle cx="130" cy="160" r="110" fill="#9a9e96" stroke="#2f3a2b" stroke-width="2"/><path d="M220.0 160.0 L218.9 174.1 L215.6 187.8 L210.2 200.9 L202.8 212.9 L193.6 223.6 L185.2 215.2 L175.8 223.1 L165.4 229.5 L154.1 234.2 L142.2 237.0 L130.0 238.0 L130.0 250.0 L115.9 248.9 L102.2 245.6 L89.1 240.2 L77.1 232.8 L66.4 223.6 L74.8 215.2 L66.9 205.8 L60.5 195.4 L55.8 184.1 L53.0 172.2 L52.0 160.0 L40.0 160.0 L41.1 145.9 L44.4 132.2 L49.8 119.1 L57.2 107.1 L66.4 96.4 L74.8 104.8 L84.2 96.9 L94.6 90.5 L105.9 85.8 L117.8 83.0 L130.0 82.0 L130.0 70.0 L144.1 71.1 L157.8 74.4 L170.9 79.8 L182.9 87.2 L193.6 96.4 L185.2 104.8 L193.1 114.2 L199.5 124.6 L204.2 135.9 L207.0 147.8 L208.0 160.0 Z" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="130" cy="160" r="6" fill="#2f3a2b" stroke="none" stroke-width="2"/><line x1="52" y1="160" x2="208" y2="160" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><text x="130" y="150" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="middle">land to land</text><text x="130" y="182" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="middle">= calibre</text><text x="300" y="80" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Groove</text><text x="300" y="98" font-size="14" fill="#23261f" text-anchor="middle">the cut channel</text><line x1="255" y1="92" x2="214.89548946025965" y2="124.95234919222145" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round"/><text x="300" y="150" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Land</text><text x="300" y="168" font-size="14" fill="#23261f" text-anchor="middle">the raised ridge</text><line x1="262" y1="162" x2="205.84275753222505" y2="190.37463070007473" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round"/><text x="300" y="214" font-size="14" fill="#23261f" text-anchor="middle">Bullet is pressed</text><text x="300" y="232" font-size="14" fill="#23261f" text-anchor="middle">into the lands.</text><text x="300" y="250" font-size="14" fill="#23261f" text-anchor="middle">They twist it.</text><text x="200.0" y="288" font-size="14" fill="#2f3a2b" text-anchor="middle">Shotguns have none: a smoothbore</text>
</svg>
