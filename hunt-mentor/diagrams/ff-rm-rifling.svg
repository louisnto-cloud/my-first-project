<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Looking down a rifled bore from the muzzle. The cut spiral channels are the grooves. The raised ridges between them are the lands. Measured land to land is the calibre. The bullet is pressed into the lands and they twist it. A shotgun has no rifling and is called a smoothbore.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Lands and grooves</text>
<circle cx="122" cy="150" r="100" fill="#8f949a" stroke="#4f5459" stroke-width="2.5"/>
<circle cx="122" cy="150" r="92" fill="none" stroke="#a9adb2" stroke-width="2"/>
<path d="M176.1 135.5 A56 56 0 0 1 176.1 164.5 L185.8 167.1 A66 66 0 0 1 168.7 196.7 L161.6 189.6 L161.6 189.6 A56 56 0 0 1 136.5 204.1 L139.1 213.8 A66 66 0 0 1 104.9 213.8 L107.5 204.1 L107.5 204.1 A56 56 0 0 1 82.4 189.6 L75.3 196.7 A66 66 0 0 1 58.2 167.1 L67.9 164.5 L67.9 164.5 A56 56 0 0 1 67.9 135.5 L58.2 132.9 A66 66 0 0 1 75.3 103.3 L82.4 110.4 L82.4 110.4 A56 56 0 0 1 107.5 95.9 L104.9 86.2 A66 66 0 0 1 139.1 86.2 L136.5 95.9 L136.5 95.9 A56 56 0 0 1 161.6 110.4 L168.7 103.3 A66 66 0 0 1 185.8 132.9 L176.1 135.5z" fill="#2b2d30" stroke="#c4c8cc" stroke-width="2"/>
<path d="M92 122 A41 41 0 0 1 156 126" stroke="#f5c542" stroke-width="3" fill="none"/><path d="M159.0 130.0 L156.8 118.8 L148.4 125.9z" fill="#f5c542"/>
<line x1="69" y1="150" x2="175" y2="150" stroke="#e8590c" stroke-width="3"/><path d="M67.0 150.0 L76.0 154.9 L76.0 145.1z" fill="#e8590c"/><path d="M177.0 150.0 L168.0 145.1 L168.0 154.9z" fill="#e8590c"/>
<text x="122" y="172" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">land to land</text><text x="122" y="190" font-size="15" font-weight="bold" fill="#ffb27f" text-anchor="middle">= calibre</text>
<line x1="175.694" y1="119" x2="236" y2="74" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="175.694" cy="119" r="2.6" fill="#2f3a2b"/><rect x="236.0" y="48.0" width="150.0" height="45.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="311" y="67" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Groove</text>
<text x="311" y="85" font-size="15" fill="#2f3a2b" text-anchor="middle">the cut channel</text>
<line x1="177.455" y1="142.206" x2="236" y2="136" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="177.455" cy="142.206" r="2.6" fill="#2f3a2b"/><rect x="236.0" y="112.0" width="150.0" height="45.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="311" y="131" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Land</text>
<text x="311" y="149" font-size="15" fill="#2f3a2b" text-anchor="middle">the raised ridge</text>
<text x="311" y="194" font-size="15.5" fill="#2f3a2b" text-anchor="middle">Bullet is pressed</text>
<text x="311" y="214" font-size="15.5" fill="#2f3a2b" text-anchor="middle">into the lands.</text>
<text x="311" y="234" font-size="15.5" fill="#2f3a2b" text-anchor="middle">They twist it.</text>
<rect x="8" y="264" width="384" height="30" rx="8" fill="#2f3a2b"/><text x="200" y="284" font-size="15.5" font-weight="bold" fill="#fffaf0" text-anchor="middle">Shotguns have none: a smoothbore</text>
</svg>
