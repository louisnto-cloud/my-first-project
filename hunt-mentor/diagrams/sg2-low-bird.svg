<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Low bird, no shot. A bird that flies low between or toward hunters, dogs or decoy setters is never shot. Swing only above the horizon line and inside your zone.">
