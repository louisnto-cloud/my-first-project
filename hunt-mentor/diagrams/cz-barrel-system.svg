<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 362" font-family="sans-serif" role="img" aria-label="How the CZ 457 barrel swap works, exploded side view: 1 two barrel screws under the front of the receiver hold the barrel, 2 the barrel shank slides into the receiver, 3 the receiver, which is the part the law treats as the firearm, 4 the barrel; CZ offers .22 LR, .22 WMR and .17 HMR. The stock comes off first. Have a gunsmith check headspace."><rect x="0" y="0" width="400" height="362" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">The barrel swap system</text><rect x="40" y="90" width="150" height="40" rx="5" fill="#4A5156"/><rect x="160" y="96" width="30" height="28" fill="#2B3034"/><rect x="230" y="98" width="40" height="24" rx="3" fill="#8C959B"/><path d="M268 100 L392 104 L392 116 L268 120 Z" fill="#4A5156"/><circle cx="166" cy="136" r="6" fill="#D8B23A" stroke="#2B3034"/><circle cx="184" cy="136" r="6" fill="#D8B23A" stroke="#2B3034"/><line x1="226" y1="110" x2="209.0" y2="110.0" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><path d="M198 110 L209.0 116.0 L209.0 104.0z" fill="#FF6A13"/><circle cx="175" cy="168" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="175" y="173" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><line x1="170" y1="158" x2="166" y2="142" stroke="#17201A" stroke-width="1.4"/><line x1="180" y1="158" x2="184" y2="142" stroke="#17201A" stroke-width="1.4"/><circle cx="250" cy="72" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="250" y="77" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text><line x1="250" y1="84" x2="250" y2="98" stroke="#17201A" stroke-width="1.4"/><circle cx="100" cy="72" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="100" y="77" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text><line x1="100" y1="84" x2="100" y2="90" stroke="#17201A" stroke-width="1.4"/><circle cx="330" cy="72" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="330" y="77" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4</text><line x1="330" y1="84" x2="330" y2="104" stroke="#17201A" stroke-width="1.4"/><circle cx="26" cy="209" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="214" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><text x="42" y="214" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Two barrel screws, under the front</text><circle cx="26" cy="233" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="238" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text><text x="42" y="238" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Barrel shank slides into the receiver</text><circle cx="26" cy="257" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="262" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text><text x="42" y="262" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Receiver: the part the law counts</text><circle cx="26" cy="281" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="286" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4</text><text x="42" y="286" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Barrel: .22 LR, .22 WMR, .17 HMR kits</text><rect x="8" y="316" width="384" height="34" rx="9" fill="#1F3D2B"/><text x="200" y="338.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Stock off first. Headspace: gunsmith check.</text></svg>
