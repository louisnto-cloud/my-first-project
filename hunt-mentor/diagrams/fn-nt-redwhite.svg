<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="At night, one hunter shines a bright white headlamp far ahead, which wipes out night vision. The other uses a dim red light pointed at the feet, which keeps it. Tip: red and low for map reading and walking near others.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#1f2a3a" stroke="none" stroke-width="2"/><g transform="translate(100 200) scale(1.1)"><circle cx="0" cy="-30" r="7" fill="#d0d6dc"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" stroke="#d0d6dc" stroke-width="4" stroke-linecap="round" fill="none"/></g><path d="M110 168 L200 230 L200 280 L110 180 Z" fill="#ffffff" opacity=".55"/><text x="110" y="60" font-family="sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">White</text><g transform="translate(290 200) scale(1.1)"><circle cx="0" cy="-30" r="7" fill="#d0d6dc"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" stroke="#d0d6dc" stroke-width="4" stroke-linecap="round" fill="none"/></g><path d="M300 168 L340 270 L300 275 Z" fill="#e03131" opacity=".55"/><text x="300" y="60" font-family="sans-serif" font-size="17" fill="#ff8787" text-anchor="middle" font-weight="bold">Red, low</text><text x="20" y="95" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="start">Far, bright</text><text x="20" y="113" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="start">kills night eyes</text><text x="225" y="95" font-family="sans-serif" font-size="14" fill="#ff8787" text-anchor="start">At your feet,</text><text x="225" y="113" font-family="sans-serif" font-size="14" fill="#ff8787" text-anchor="start">keeps night eyes</text>
</svg>
