<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 502" font-family="sans-serif" role="img" aria-label="Mission: October to December seasons, MUs 2-3, 2-4, 2-8, 2-19, page 28 (99%). Bars from September to March. Deer bucks: Sept 10 to Dec 15. Black bear: Sept 10 to Nov 30. Grouse: Sept 10 to Dec 15. Pheasant cocks: Oct 10 to Nov 30. Ducks: Oct 10 to Jan 24. Canada geese: Oct 10 to Nov 22, then Dec 19 to Jan 10. Snow geese: Oct 10 to Jan 5. Cougar: Sept 10 to Mar 31. Bobcat: Nov 15 to Feb 15. Coyote: Sept 10 to June 15. Raccoon and skunk: Sept 1 to Mar 31. Snowshoe hare: Aug 1 to Apr 30. Not open near Mission: antlerless deer, white tailed deer, wolf, moose and elk.">
