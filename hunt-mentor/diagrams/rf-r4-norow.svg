<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 328" role="img" aria-label="Chips of animals with no row in the Region 4 season table, so no general open season by this app&#x27;s reading: bighorn sheep, caribou, fallow deer, quail, chukar, gray partridge, sharp tailed grouse, band tailed pigeons and opossum. Grizzly bear: no open season in BC." font-family="sans-serif">
<rect x="0" y="0" width="400" height="328" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">No row in Region 4</text>
<rect x="8" y="40" width="14" height="14" rx="3" fill="#6b6f66"/>
<text x="28" y="52" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">No general open season (95%, my reading)</text>
<rect x="8" y="64" width="189" height="30" rx="6" fill="#6b6f66"/>
<text x="102" y="84" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Bighorn sheep</text>
<rect x="203" y="64" width="189" height="30" rx="6" fill="#6b6f66"/>
<text x="298" y="84" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Caribou</text>
<rect x="8" y="100" width="189" height="30" rx="6" fill="#6b6f66"/>
<text x="102" y="120" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Fallow deer</text>
<rect x="203" y="100" width="189" height="30" rx="6" fill="#6b6f66"/>
<text x="298" y="120" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Quail</text>
<rect x="8" y="136" width="189" height="30" rx="6" fill="#6b6f66"/>
<text x="102" y="156" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Chukar</text>
<rect x="203" y="136" width="189" height="30" rx="6" fill="#6b6f66"/>
<text x="298" y="156" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Gray partridge</text>
<rect x="8" y="172" width="189" height="30" rx="6" fill="#6b6f66"/>
<text x="102" y="192" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Sharp tailed grouse</text>
<rect x="203" y="172" width="189" height="30" rx="6" fill="#6b6f66"/>
<text x="298" y="192" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Band tailed pigeons</text>
<rect x="8" y="208" width="189" height="30" rx="6" fill="#6b6f66"/>
<text x="102" y="228" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Opossum</text>
<rect x="8" y="254" width="14" height="14" rx="3" fill="#c92a2a"/>
<text x="28" y="266" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">No open season in BC</text>
<rect x="8" y="278" width="189" height="30" rx="6" fill="#c92a2a"/>
<text x="102" y="298" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Grizzly bear</text>
</svg>
