<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="sans-serif" role="img" aria-label="Timeline September to December. The first heat in late September and early October, about two weeks, conceives more than 80 percent of calves. Cows that miss come into a second and third heat about 25 days apart. The MU 3-27 spike fork season, 1 to 15 November, comes after the main rut.">
<rect x="0" y="0" width="400" height="290" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Rut timing in BC</text><line x1="30" y1="150" x2="380" y2="150" stroke="#23261f" stroke-width="2"/><line x1="40" y1="142" x2="40" y2="158" stroke="#23261f" stroke-width="2"/><text x="40" y="176" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Sep 1</text><line x1="150" y1="142" x2="150" y2="158" stroke="#23261f" stroke-width="2"/><text x="150" y="176" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Oct 1</text><line x1="260" y1="142" x2="260" y2="158" stroke="#23261f" stroke-width="2"/><text x="260" y="176" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Nov 1</text><line x1="370" y1="142" x2="370" y2="158" stroke="#23261f" stroke-width="2"/><text x="370" y="176" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Dec 1</text><rect x="113" y="96" width="50" height="40" fill="#e8590c" rx="4"/><text x="138" y="70" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">1st heat</text><text x="138" y="121" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">80%</text><rect x="190" y="110" width="30" height="26" fill="#f0a070" rx="4"/><text x="205" y="100" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">2nd</text><rect x="246" y="118" width="26" height="18" fill="#f6c9a6" rx="4"/><text x="259" y="112" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">3rd</text><rect x="260" y="196" width="18" height="24" fill="#2f3a2b" rx="3"/><text x="252" y="214" font-size="14" fill="#2f3a2b" text-anchor="end" font-weight="bold">MU 3-27: Nov 1 to 15</text><text x="200" y="250" font-size="14" fill="#23261f" text-anchor="middle">80% of calves conceived in 2 weeks,</text><text x="200" y="267" font-size="14" fill="#23261f" text-anchor="middle">late Sep to early Oct. Then every 25 days.</text>
</svg>
