<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Side view of a white tail scrape. A low overhanging licking branch about 1.2 to 1.5 metres above the ground has chewed and broken tips. Below it is an oval of pawed bare dirt that smells of urine. Caption: the branch matters more than the dirt." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="20" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">A scrape, side view</text><rect x="0" y="240" width="400" height="60" fill="#dfe6d3"/><rect x="300" y="40" width="22" height="200" fill="#6b4f35"/><path d="M300 92 C 240 98 190 100 140 116" fill="none" stroke="#6b4f35" stroke-width="6" stroke-linecap="round"/><path d="M150 112 l-8 14 M168 108 l-4 16 M186 104 l2 14" stroke="#a08060" stroke-width="3" stroke-linecap="round"/><ellipse cx="170" cy="244" rx="70" ry="10" fill="#6b4f35"/><line x1="70" y1="114" x2="70" y2="240" stroke="#e8590c" stroke-width="2"/><line x1="70" y1="160" x2="70" y2="116" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><polygon points="70.0,116.0 73.0,122.3 67.0,122.3" fill="#e8590c"/><line x1="70" y1="200" x2="70" y2="238" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><polygon points="70.0,238.0 67.0,231.7 73.0,231.7" fill="#e8590c"/><text x="62" y="176" font-size="14" fill="#e8590c" text-anchor="end" font-weight="bold">1.2 to</text><text x="62" y="194" font-size="14" fill="#e8590c" text-anchor="end" font-weight="bold">1.5 m</text><text x="180" y="84" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Licking branch:</text><text x="180" y="140" font-size="14" fill="#23261f" text-anchor="middle">chewed, broken tips</text><text x="170" y="274" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Pawed bare dirt, urine smell</text><text x="200" y="296" font-size="14" fill="#6b4f35" text-anchor="middle">The branch matters more than the dirt.</text>
</svg>
