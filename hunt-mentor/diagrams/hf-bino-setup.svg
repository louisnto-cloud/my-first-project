<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Binocular setup at home. Twist the eye cups to fit your eyes. Set the right eye dial, the diopter, so both eyes are sharp. Mark the setting with a dab of paint or tape.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <g fill="#2f3a2b">
    <rect x="110" y="80" width="70" height="150" rx="20"/><rect x="220" y="80" width="70" height="150" rx="20"/>
    <rect x="178" y="110" width="44" height="40" rx="8"/>
  </g>
  <rect x="116" y="62" width="58" height="28" rx="6" fill="#8a9a6b"/><rect x="226" y="62" width="58" height="28" rx="6" fill="#8a9a6b"/>
  <circle cx="200" cy="130" r="14" fill="#8a9a6b"/>
  <rect x="226" y="96" width="58" height="12" fill="#e8590c"/>
  <circle cx="258" cy="102" r="4" fill="#ffd34d"/>
  <text x="200" y="30" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Set up once, at home</text>
  <path d="M110 70 L60 60" stroke="#2f3a2b" stroke-width="2"/><text x="12" y="56" font-size="15" font-weight="bold" fill="#2f3a2b">Eye cups</text>
  <path d="M290 102 L320 102" stroke="#e8590c" stroke-width="2"/><text x="324" y="98" font-size="15" font-weight="bold" fill="#e8590c">Right eye</text><text x="324" y="116" font-size="15" font-weight="bold" fill="#e8590c">dial</text>
  <path d="M186 130 L60 170" stroke="#2f3a2b" stroke-width="2"/><text x="12" y="190" font-size="15" font-weight="bold" fill="#2f3a2b">Focus wheel</text>
  <text x="200" y="268" font-size="15" fill="#2f3a2b" text-anchor="middle">Mark the dial setting with a paint dot</text>
</svg>
