<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Sheep and goat sign in a 2 by 2 grid. Tracks: a deer print is pointed, a sheep print is blocky with blunt tips, a goat print is squarer with toes that spread, sheep about 7 to 9 centimetres and goat about 7 to 8 centimetres, 60 percent. Beds: pawed dusty ovals on ledges with pellets, a tip. Hair: long white goat hair on rock edges and brush, a tip. Trails: a trail that contours a cliff band at one height, a tip." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="400" fill="#fffaf0"/>
<line x1="200" y1="10" x2="200" y2="390" stroke="#8a9a6b" stroke-dasharray="6 6" stroke-width="2"/>
<line x1="10" y1="200" x2="390" y2="200" stroke="#8a9a6b" stroke-dasharray="6 6" stroke-width="2"/>
<text x="100" y="26" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Tracks</text>
<g transform="translate(45 80)"><path d="M-2 -24 C-14 -10 -14 8 -12 20 L-2 20 Z" fill="#8b5a2b"/><path d="M2 -24 C14 -10 14 8 12 20 L2 20 Z" fill="#8b5a2b"/></g>
<g transform="translate(100 80)"><path d="M-14 -22 L-3 -22 L-2 20 L-15 20 Z" fill="#8b5a2b"/><path d="M3 -22 L14 -22 L15 20 L2 20 Z" fill="#8b5a2b"/></g>
<g transform="translate(155 80)"><path d="M-6 -20 L-20 -16 L-18 20 L-4 20 Z" fill="#8b5a2b"/><path d="M6 -20 L20 -16 L18 20 L4 20 Z" fill="#8b5a2b"/></g>
<text x="45" y="124" font-size="13" fill="#23261f" text-anchor="middle">Deer</text>
<text x="100" y="124" font-size="13" fill="#23261f" text-anchor="middle">Sheep</text>
<text x="155" y="124" font-size="13" fill="#23261f" text-anchor="middle">Goat</text>
<text x="100" y="148" font-size="13" fill="#23261f" text-anchor="middle">Sheep: blocky, 7 to 9 cm</text>
<text x="100" y="164" font-size="13" fill="#23261f" text-anchor="middle">Goat: toes spread, 7 to 8 cm</text>
<text x="100" y="180" font-size="13" fill="#23261f" text-anchor="middle">Sizes 60% sure</text>
<text x="300" y="26" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Beds (Tip)</text>
<path d="M220 120 L380 110 L380 180 L220 180 Z" fill="#9a9a90" stroke="#6b6b62"/>
<path d="M220 110 L380 100" stroke="#8a9a6b" stroke-width="6"/>
<ellipse cx="270" cy="96" rx="26" ry="9" fill="#c9b79c" stroke="#8b5a2b" stroke-dasharray="3 3"/>
<ellipse cx="330" cy="92" rx="24" ry="8" fill="#c9b79c" stroke="#8b5a2b" stroke-dasharray="3 3"/>
<g fill="#5c3b1c"><circle cx="262" cy="96" r="2"/><circle cx="268" cy="98" r="2"/><circle cx="276" cy="95" r="2"/><circle cx="326" cy="92" r="2"/><circle cx="334" cy="93" r="2"/></g>
<text x="300" y="150" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Pawed dusty ovals</text>
<text x="300" y="166" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">on ledges, with pellets</text>
<text x="100" y="226" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Hair (Tip)</text>
<path d="M30 330 L60 260 L120 250 L170 300 L170 360 L30 360 Z" fill="#9a9a90" stroke="#6b6b62"/>
<g stroke="#ffffff" stroke-width="2.5" fill="none"><path d="M62 262 c8 10 2 20 10 28"/><path d="M70 258 c6 12 0 20 8 30"/><path d="M118 252 c6 10 0 22 8 30"/></g>
<text x="100" y="380" font-size="13" fill="#23261f" text-anchor="middle">Long white goat hair</text>
<text x="100" y="396" font-size="13" fill="#23261f" text-anchor="middle">on rock edges and brush</text>
<text x="300" y="226" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Trails (Tip)</text>
<path d="M215 360 L240 240 L380 236 L385 360 Z" fill="#9a9a90" stroke="#6b6b62"/>
<path d="M226 300 C270 296 330 296 382 298" stroke="#c9b79c" stroke-width="7" fill="none"/>
<path d="M226 300 C270 296 330 296 382 298" stroke="#8b5a2b" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
<text x="300" y="380" font-size="13" fill="#23261f" text-anchor="middle">Trail contours a cliff</text>
<text x="300" y="396" font-size="13" fill="#23261f" text-anchor="middle">band at one height</text>
</svg>
