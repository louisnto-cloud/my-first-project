<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 444" font-family="sans-serif" role="img" aria-label="Sheep and goat sign in a 2 by 2 grid. Tracks: a deer print is pointed, a sheep print is blocky with blunt tips, a goat print is squarer with toes that spread, sheep about 7 to 9 centimetres and goat about 7 to 8 centimetres, 60 percent. Beds: pawed dusty ovals on ledges with pellets, a tip. Hair: long white goat hair on rock edges and brush, a tip. Trails: a trail that contours a cliff band at one height, a tip.">
<rect width="400" height="444" fill="#fffaf0"/>
<line x1="200" y1="10" x2="200" y2="436" stroke="#8a9a6b" stroke-dasharray="6 6" stroke-width="2"/>
<line x1="10" y1="228" x2="390" y2="228" stroke="#8a9a6b" stroke-dasharray="6 6" stroke-width="2"/>
<text x="100" y="28" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Tracks</text>
<g transform="translate(40 78)" fill="#8b5a2b"><path d="M-2 -24 C-14 -10 -14 8 -12 20 L-2 20 Z"/><path d="M2 -24 C14 -10 14 8 12 20 L2 20 Z"/></g>
<text x="40" y="124" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Deer</text>
<g transform="translate(100 78)" fill="#8b5a2b"><path d="M-14 -22 L-3 -22 L-2 20 L-15 20 Z"/><path d="M3 -22 L14 -22 L15 20 L2 20 Z"/></g>
<text x="100" y="124" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Sheep</text>
<g transform="translate(160 78)" fill="#8b5a2b"><path d="M-6 -20 L-20 -16 L-18 20 L-4 20 Z"/><path d="M6 -20 L20 -16 L18 20 L4 20 Z"/></g>
<text x="160" y="124" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Goat</text>
<text x="100" y="152" font-size="14" fill="#2f3a2b" text-anchor="middle">Sheep: blocky, 7 to 9 cm</text>
<text x="100" y="172" font-size="14" fill="#2f3a2b" text-anchor="middle">Goat: toes spread, 7 to 8 cm</text>
<text x="100" y="192" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Sizes 60% sure</text>
<text x="300" y="28" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Beds (Tip)</text>
<path d="M216 112 L384 102 L384 176 L216 176 Z" fill="#9a9a90" stroke="#6b6b62"/>
<path d="M216 104 L384 94" stroke="#8a9a6b" stroke-width="7"/>
<ellipse cx="264" cy="88" rx="28" ry="10" fill="#c9b79c" stroke="#8b5a2b" stroke-dasharray="3 3"/>
<ellipse cx="332" cy="82" rx="26" ry="9" fill="#c9b79c" stroke="#8b5a2b" stroke-dasharray="3 3"/>
<g fill="#5c3b1c"><circle cx="256" cy="88" r="2.2"/><circle cx="263" cy="91" r="2.2"/><circle cx="271" cy="87" r="2.2"/><circle cx="327" cy="82" r="2.2"/><circle cx="336" cy="84" r="2.2"/></g>
<text x="300" y="200" font-size="15" fill="#2f3a2b" text-anchor="middle">Pawed dusty ovals</text>
<text x="300" y="219" font-size="15" fill="#2f3a2b" text-anchor="middle">on ledges, with pellets</text>
<text x="100" y="256" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hair (Tip)</text>
<path d="M24 386 L56 300 L122 290 L178 344 L178 386 Z" fill="#9a9a90" stroke="#6b6b62"/>
<g stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"><path d="M58 302 c8 10 2 22 10 30"/><path d="M66 298 c6 12 0 22 8 32"/><path d="M120 292 c6 10 0 24 8 32"/><path d="M126 296 c4 10 0 20 6 26"/></g>
<text x="100" y="412" font-size="15" fill="#2f3a2b" text-anchor="middle">Long white goat hair</text>
<text x="100" y="431" font-size="15" fill="#2f3a2b" text-anchor="middle">on rock edges and brush</text>
<text x="300" y="256" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Trails (Tip)</text>
<path d="M212 386 L238 280 L384 274 L388 386 Z" fill="#9a9a90" stroke="#6b6b62"/>
<path d="M222 334 C266 330 330 330 384 332" stroke="#c9b79c" stroke-width="8" fill="none"/>
<path d="M222 334 C266 330 330 330 384 332" stroke="#8b5a2b" stroke-width="1.6" stroke-dasharray="4 4" fill="none"/>
<text x="300" y="412" font-size="15" fill="#2f3a2b" text-anchor="middle">Trail contours a cliff</text>
<text x="300" y="431" font-size="15" fill="#2f3a2b" text-anchor="middle">band at one height</text>
</svg>
