<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Step 5: the cancelled species licence travels with the meat in the cooler. Carry every species licence bought this licence year, cancelled and not." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="34" font-size="20" fill="#23261f" text-anchor="middle" font-weight="bold">5. Licence goes with the meat</text>
<g transform="translate(130 150) scale(2.0)"><rect x="-26" y="-14" width="52" height="30" rx="4" fill="#4a7fb0"/><rect x="-28" y="-20" width="56" height="8" rx="3" fill="#2f3a2b"/><rect x="-8" y="-26" width="16" height="6" rx="2" fill="none" stroke="#2f3a2b" stroke-width="3"/></g><g transform="translate(290 140) scale(2.2)"><rect x="-26" y="-18" width="52" height="36" rx="4" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><line x1="-18" y1="-8" x2="18" y2="-8" stroke="#2f3a2b" stroke-width="2.5"/><line x1="-18" y1="0" x2="10" y2="0" stroke="#2f3a2b" stroke-width="2"/><line x1="-18" y1="8" x2="14" y2="8" stroke="#2f3a2b" stroke-width="2"/><path d="M-26 -8 l6 3 l-6 3 Z M26 2 l-6 3 l6 3 Z" fill="#e8590c"/></g>
<text x="200" y="262" font-size="15" fill="#2f3a2b" text-anchor="middle">Carry every species licence this year,</text>
