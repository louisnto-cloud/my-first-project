<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Prone position: lying flat behind the rifle, both elbows on the ground, body straight behind the rifle. The steadiest position.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">1  Prone: steadiest</text><line x1="20" y1="232" x2="380" y2="232" stroke="#8a9a6b" stroke-width="3"/><circle cx="268" cy="196" r="10" fill="#fffaf0" stroke="#23261f" stroke-width="3.5"/><path d="M256 206 L160 222 L70 230" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 222 L80 224" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M254 208 L282 230 L304 204" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M250 210 L232 230 L262 204" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="246" y1="204" x2="360" y2="186" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/><circle cx="372" cy="184" r="12" fill="#fff" stroke="#23261f" stroke-width="2"/><circle cx="372" cy="184" r="4" fill="#e8590c"/><circle cx="282" cy="230" r="7" fill="none" stroke="#e8590c" stroke-width="3"/><circle cx="232" cy="230" r="7" fill="none" stroke="#e8590c" stroke-width="3"/><text x="40" y="70" font-size="15" font-weight="bold" fill="#23261f">Both elbows on the ground</text><line x1="246" y1="66" x2="234.0" y2="220.0" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><path d="M230.7 211.6 L234.0 220.0 L238.5 212.2" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="96" font-size="15" fill="#23261f">Body straight behind the rifle</text><text x="40" y="120" font-size="15" fill="#23261f">Needs flat, open ground</text><text x="200" y="280" font-size="14" text-anchor="middle" fill="#2f3a2b">Best for learning: easiest to hold still</text>
</svg>
