<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A balance drill: stand on one foot for 30 seconds, eyes up, then switch.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
