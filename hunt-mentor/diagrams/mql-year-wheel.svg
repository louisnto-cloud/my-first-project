<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Year wheel for California quail in BC. January and February: big winter coveys. March: coveys break up. April: pairs. May: nests. June: peak hatch. July: broods. August: families join together. September: coveys form. October and November: the Region 8 season, 1 October to 30 November, 99 percent. December: winter coveys. Biology 65 to 80 percent.">
