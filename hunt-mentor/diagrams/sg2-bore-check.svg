<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Check the bore for obstructions: snow, mud or a wad can block a barrel. Unload, open the action and look through from the breech, or run a rod through. Never shoot to clear a blocked barrel.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Barrel blocked? Never shoot it out</text>
<rect x="20" y="110" width="360" height="40" fill="#3b4045"/>
<rect x="20" y="116" width="360" height="28" fill="#cfd5d8"/>
<path d="M330 117 C340 112 350 122 360 117 L360 143 C350 148 340 138 330 143 Z" fill="#f4f8fb" stroke="#17201A"/>
<line x1="345.0" y1="98.0" x2="345.0" y2="117.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="345.0" cy="117.0" r="3" fill="#1F3D2B"/><rect x="276.8" y="75.0" width="106.5" height="23.0" rx="5" fill="#ffffff" stroke="#FF6A13" stroke-width="1.3"/><text x="330.0" y="92.0" font-size="14" font-weight="bold" fill="#FF6A13" text-anchor="middle">snow or mud</text>
<circle cx="30" cy="180" r="10" fill="#1F3D2B"/><text x="30" y="184.7" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="48.0" y="185.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Unload, action open</text>
<circle cx="30" cy="208" r="10" fill="#1F3D2B"/><text x="30" y="212.7" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="48.0" y="213.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Look through from the breech</text>
<circle cx="30" cy="236" r="10" fill="#1F3D2B"/><text x="30" y="240.7" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="48.0" y="241.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Push it out with a rod</text>
<circle cx="30" cy="264" r="10" fill="#FF6A13"/><text x="30" y="268.7" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="48.0" y="269.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Never fire to clear it</text>
</svg>
