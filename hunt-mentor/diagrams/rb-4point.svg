<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" font-family="sans-serif" role="img" aria-label="A mule deer buck head in side view with one antler drawn. The antler forks, then each fork forks again, giving 4 points numbered 1 to 4 on one antler. A small brow tine low on the beam is crossed out: it is not counted for a mule deer 4 point buck. Count one side. For elk and moose the brow tine does count.">
