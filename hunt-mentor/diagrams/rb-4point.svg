<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-label="One mule deer antler drawn from the side. It forks, then each fork forks again, giving 4 points numbered 1 to 4 on one antler. A brow tine low on the beam is crossed out: it is not counted for a mule deer 4 point buck. For elk and moose the brow tine does count." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="330" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#23261f" text-anchor="middle" font-weight="bold">Mule deer: is he a 4 point?</text>
<g transform="translate(0 26)">
<path d="M150 250 C 150 200, 160 170, 190 140 C 210 120, 220 100, 225 80" stroke="#5c3b1c" stroke-width="9" fill="none" stroke-linecap="round"/>
<path d="M190 140 C 170 120, 160 100, 150 70" stroke="#5c3b1c" stroke-width="7" fill="none" stroke-linecap="round"/>
<path d="M225 80 L250 44 M225 80 L215 40" stroke="#5c3b1c" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M150 70 L165 34 M150 70 L128 40" stroke="#5c3b1c" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M152 222 L120 200" stroke="#5c3b1c" stroke-width="6" fill="none" stroke-linecap="round"/>
<circle cx="128" cy="36" r="12" fill="#e8590c"/><text x="128" y="40.9" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<circle cx="165" cy="30" r="12" fill="#e8590c"/><text x="165" y="34.9" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<circle cx="215" cy="36" r="12" fill="#e8590c"/><text x="215" y="40.9" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<circle cx="250" cy="40" r="12" fill="#e8590c"/><text x="250" y="44.9" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<path d="M103 187 L121 205 M121 187 L103 205" stroke="#c92a2a" stroke-width="4" stroke-linecap="round"/><text x="14" y="170" font-size="15" fill="#c92a2a" text-anchor="start" font-weight="bold">Brow tine:</text>
<text x="14" y="189" font-size="15" fill="#c92a2a" text-anchor="start" font-weight="bold">not counted</text>
<text x="270" y="120" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Forks that</text>
<text x="270" y="140" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">fork again:</text>
<text x="270" y="160" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">4 points on</text>
<text x="270" y="180" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">ONE antler</text>
</g>
<text x="200" y="292" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Count one side. Brow tine excluded.</text>
<text x="200" y="314" font-size="15" fill="#2f3a2b" text-anchor="middle">Elk and moose: the brow tine counts.</text>
</svg>
