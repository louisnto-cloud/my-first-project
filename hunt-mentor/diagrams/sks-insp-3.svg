<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 3. Looking down the bore: a bright chrome lined bore with 4 rifling lands. Want bright, shiny, sharp lands. Stop if you see dark pits, rust, a bulge or a ring.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<circle cx="26.0" cy="22.0" r="13" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="26.0" y="27.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="46.0" y="28.0" font-size="17" font-weight="bold" fill="#1F3D2B" text-anchor="start">Look down the bore</text><circle cx="200.0" cy="140.0" r="70.0" fill="#DDE2DC" stroke="#17201A" stroke-width="2"/><line x1="227.6" y1="151.7" x2="260.8" y2="165.7" stroke="#3A403C" stroke-width="6" stroke-linecap="round"/><line x1="188.3" y1="167.6" x2="174.3" y2="200.8" stroke="#3A403C" stroke-width="6" stroke-linecap="round"/><line x1="172.4" y1="128.3" x2="139.2" y2="114.3" stroke="#3A403C" stroke-width="6" stroke-linecap="round"/><line x1="211.7" y1="112.4" x2="225.7" y2="79.2" stroke="#3A403C" stroke-width="6" stroke-linecap="round"/><circle cx="200.0" cy="140.0" r="28.0" fill="#F7F9F6" stroke="#17201A" stroke-width="1.5"/><text x="200.0" y="145.0" font-size="14" font-weight="bold" fill="#2E7D4F" text-anchor="middle">bright</text><text x="30.0" y="236.0" font-size="14" font-weight="bold" fill="#2E7D4F" text-anchor="start">Want: bright, shiny, sharp lands.</text><text x="30.0" y="258.0" font-size="14" font-weight="bold" fill="#B3261E" text-anchor="start">Stop: dark pits, rust, a bulge or ring.</text>
<text x="200.0" y="288.0" font-size="14" fill="#17201A" text-anchor="middle">Bolt out. Light at the breech. Look from the muzzle.</text>
</svg>
