<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side view of a seated hunter glassing: back against a pack or tree, knees up, elbows resting on the knees, binoculars at the eyes. Braced and still.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect x="0" y="250" width="400" height="50" fill="#c9b79c"/>
  <rect x="70" y="140" width="50" height="110" rx="10" fill="#8b5a2b"/>
  <text x="95" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle">pack</text>
  <path d="M130 250 L140 160" stroke="#2f3a2b" stroke-width="22" stroke-linecap="round"/>
  <circle cx="146" cy="128" r="20" fill="#2f3a2b"/>
  <path d="M140 230 L210 190 L250 250" stroke="#2f3a2b" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M146 168 L206 186 L172 132" stroke="#4a5a3c" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="164" y="118" width="30" height="16" rx="4" fill="#8a9a6b"/>
  <circle cx="206" cy="186" r="9" fill="none" stroke="#e8590c" stroke-width="3"/>
  <text x="250" y="160" font-size="16" font-weight="bold" fill="#e8590c">Elbows on knees</text>
  <text x="250" y="182" font-size="16" font-weight="bold" fill="#2f3a2b">Back on pack</text>
  <text x="250" y="204" font-size="16" font-weight="bold" fill="#2f3a2b">Sit still</text>
  <text x="200" y="30" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Brace: shaking glass hides deer</text>
</svg>
