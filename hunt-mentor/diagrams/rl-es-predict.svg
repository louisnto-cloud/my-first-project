<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Map view of a deer feeding on an open slope. Orange arrows show its likely escape routes: uphill into timber and over a saddle. A grey dashed arrow toward the hunter is the unlikely route. Caption, a tip: know the exits before you stalk.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Before you move: where will it run?</text>
  <rect x="0" y="36" width="400" height="196" fill="#dfe6d3" opacity=".7"/>
  <path d="M260 36 H400 V180 C 360 170, 320 150, 300 120 C 290 90, 270 60, 260 36 Z" fill="#a9b68e"/>
  <path d="M300 38.4 l8.1 16.2 h-4.5 l6.3 10.8 h-19.8 l6.3 -10.8 h-4.5 Z" fill="#7f8f62"/><rect x="298.65" y="65.4" width="2.7" height="4.5" fill="#6b4f35"/><path d="M340 58.4 l8.1 16.2 h-4.5 l6.3 10.8 h-19.8 l6.3 -10.8 h-4.5 Z" fill="#7f8f62"/><rect x="338.65" y="85.4" width="2.7" height="4.5" fill="#6b4f35"/><path d="M380 98.4 l8.1 16.2 h-4.5 l6.3 10.8 h-19.8 l6.3 -10.8 h-4.5 Z" fill="#7f8f62"/><rect x="378.65" y="125.4" width="2.7" height="4.5" fill="#6b4f35"/><path d="M330 108.4 l8.1 16.2 h-4.5 l6.3 10.8 h-19.8 l6.3 -10.8 h-4.5 Z" fill="#7f8f62"/><rect x="328.65" y="135.4" width="2.7" height="4.5" fill="#6b4f35"/>
  <g fill="none" stroke="#8b5a2b" stroke-width="1.8"><path d="M0 120 C 100 110, 160 130, 230 100"/><path d="M0 170 C 100 160, 170 180, 240 150"/></g>
  <g transform="translate(170 190) scale(1)"><ellipse rx="14" ry="7" fill="#8b5a2b"/><circle cx="12" cy="-10" r="5.5" fill="#8b5a2b"/><path d="M9 -14 l-3 -7 M14 -14 l4 -6" stroke="#5c3b1c" stroke-width="2"/><path d="M-9 5 v9 M-4 5 v9 M6 5 v9 M10 5 v9" stroke="#8b5a2b" stroke-width="2.5"/></g>
  <path d="M184 182 L286 120" stroke="#e8590c" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M286 120 L279.5 130.1 L274.1 121.2 Z" fill="#e8590c"/><path d="M176 176 L200 70" stroke="#e8590c" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M200 70 L202.7 81.7 L192.5 79.4 Z" fill="#e8590c"/><path d="M160 196 L92 222" stroke="#9a8f80" stroke-width="3.4" stroke-linecap="round" fill="none" stroke-dasharray="7 5"/><path d="M84 225 L95.5 216.4 L98 226 Z" fill="#9a8f80"/>
  <text x="332" y="168" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle" stroke="#a9b68e" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">Timber</text><text x="206" y="60" font-size="16" font-weight="bold" fill="#2f3a2b" stroke="#e7ecdf" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">Saddle</text>
  <g transform="translate(60 120) scale(0.9)"><circle cy="-22" r="6" fill="#e8590c"/><path d="M0 -16 v16 M0 0 l-6 12 M0 0 l6 12 M0 -12 l-8 6 M0 -12 l8 4" stroke="#e8590c" stroke-width="3.5" stroke-linecap="round"/></g>
  <rect x="8" y="240" width="18" height="6" rx="2" fill="#e8590c"/><text x="32" y="248" font-size="15" font-weight="bold" fill="#c2410c">Likely: uphill to cover</text><path d="M210 243 H228" stroke="#9a8f80" stroke-width="3.4" stroke-dasharray="7 5"/><text x="234" y="248" font-size="15" font-weight="bold" fill="#6b6157">Unlikely: toward you</text><text x="12" y="272" font-size="14" fill="#6b5b4b">Map view</text>
  <text x="200" y="294" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Know the exits before you stalk (Tip)</text>
</svg>
