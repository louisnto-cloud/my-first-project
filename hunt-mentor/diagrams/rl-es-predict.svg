<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Map view of a deer feeding on an open slope. Orange arrows show its likely escape routes: uphill into timber and over a saddle. A grey arrow toward the hunter is the unlikely route. Caption, a tip: know the exits before you stalk.">
  <rect width="400" height="300" fill="#fffaf0"/>
