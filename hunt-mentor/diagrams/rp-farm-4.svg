<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 4: ask permission and hunt only where they say.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">4. Ask, then follow their rules</text><rect x="0" y="150" width="400" height="150" rx="0" fill="#d6e3b0"/><rect x="0" y="60" width="400" height="90" rx="0" fill="#2c4a3a"/><rect x="100" y="170" width="200" height="90" rx="8" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="200" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Yes: north corner</text><text x="200" y="224" font-size="15" fill="#2f3a2b" text-anchor="middle">walk in, no truck</text><text x="200" y="248" font-size="15" fill="#2f3a2b" text-anchor="middle">shoot away from barn</text>
</svg>
