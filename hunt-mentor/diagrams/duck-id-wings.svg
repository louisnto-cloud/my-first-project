<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" role="img" aria-label="Six ducks seen from above in flight, showing the coloured wing patch (speculum) and body shape: mallard with a blue patch edged in white, gadwall with a white patch, wigeon with a white shoulder and green patch, green winged teal small with a green patch, pintail long and slim with a green patch and white trailing edge, goldeneye a diver with big white wing patches and wings set far back.">
  <rect x="0" y="0" width="400" height="700" fill="#fffaf0"/>
  <text x="200" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Wing patch and shape, seen from above</text>
  <line x1="200" y1="40" x2="200" y2="640" stroke="#8a9a6b" stroke-width="2" fill="none"/>
  <line x1="10" y1="240" x2="390" y2="240" stroke="#8a9a6b" stroke-width="2" fill="none"/>
  <line x1="10" y1="440" x2="390" y2="440" stroke="#8a9a6b" stroke-width="2" fill="none"/>

  <!-- Mallard: big body, blue speculum with white bars -->
  <g>
    <path d="M20 118 L100 92 L180 118 L100 108 Z" fill="#6b4f35"/>
    <ellipse cx="100" cy="122" rx="16" ry="42" fill="#6b4f35"/>
    <circle cx="100" cy="74" r="11" fill="#2f3a2b"/>
    <polygon points="56,106 84,99 84,109 56,114" fill="#fffaf0"/>
    <polygon points="58,109 84,103 84,109 58,113" fill="#3b63c8"/>
    <polygon points="144,106 116,99 116,109 144,114" fill="#fffaf0"/>
    <polygon points="142,109 116,103 116,109 142,113" fill="#3b63c8"/>
    <text x="100" y="186" font-family="sans-serif" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Mallard</text>
    <text x="100" y="206" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Blue patch, white bars.</text>
    <text x="100" y="224" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Big, slow wingbeat.</text>
  </g>

  <!-- Gadwall: medium, white speculum -->
  <g>
    <path d="M226 118 L300 94 L374 118 L300 110 Z" fill="#6b4f35"/>
    <ellipse cx="300" cy="122" rx="14" ry="38" fill="#6b4f35"/>
    <circle cx="300" cy="78" r="10" fill="#6b4f35"/>
    <polygon points="262,108 286,102 286,111 262,115" fill="#fffaf0" stroke="#23261f" stroke-width="1"/>
    <polygon points="338,108 314,102 314,111 338,115" fill="#fffaf0" stroke="#23261f" stroke-width="1"/>
    <text x="300" y="186" font-family="sans-serif" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Gadwall</text>
    <text x="300" y="206" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Only puddle duck with</text>
    <text x="300" y="224" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">a white patch. Plain grey.</text>
  </g>

  <!-- Wigeon: white shoulder patch, green speculum, pointed tail -->
  <g>
    <path d="M26 318 L100 294 L174 318 L100 310 Z" fill="#6b4f35"/>
    <ellipse cx="100" cy="322" rx="14" ry="36" fill="#6b4f35"/>
    <polygon points="94,356 106,356 100,372" fill="#6b4f35"/>
    <circle cx="100" cy="280" r="10" fill="#6b4f35"/>
    <rect x="95" y="272" width="10" height="6" fill="#fffaf0"/>
    <polygon points="40,306 74,297 74,305 40,311" fill="#fffaf0" stroke="#23261f" stroke-width="1"/>
    <polygon points="64,308 86,302 86,311 64,315" fill="#2f8f4e"/>
    <polygon points="160,306 126,297 126,305 160,311" fill="#fffaf0" stroke="#23261f" stroke-width="1"/>
    <polygon points="136,308 114,302 114,311 136,315" fill="#2f8f4e"/>
    <text x="100" y="386" font-family="sans-serif" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">American wigeon</text>
    <text x="100" y="406" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">White shoulder flash.</text>
    <text x="100" y="424" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Drake: white crown.</text>
  </g>

  <!-- Green winged teal: small, green speculum -->
  <g>
    <path d="M254 318 L300 302 L346 318 L300 313 Z" fill="#6b4f35"/>
    <ellipse cx="300" cy="322" rx="9" ry="24" fill="#6b4f35"/>
    <circle cx="300" cy="296" r="7" fill="#6b4f35"/>
    <polygon points="276,311 292,306 292,312 276,316" fill="#2f8f4e"/>
    <polygon points="324,311 308,306 308,312 324,316" fill="#2f8f4e"/>
    <text x="300" y="386" font-family="sans-serif" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Green winged teal</text>
    <text x="300" y="406" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Tiny. Green patch.</text>
    <text x="300" y="424" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Tight flock, twisting.</text>
  </g>

  <!-- Pintail: long neck and tail, green patch with white trailing edge -->
  <g>
    <path d="M22 520 L100 494 L178 520 L100 512 Z" fill="#6b4f35"/>
    <ellipse cx="100" cy="524" rx="12" ry="40" fill="#6b4f35"/>
    <polygon points="96,560 104,560 100,598" fill="#6b4f35"/>
    <rect x="96" y="466" width="8" height="24" fill="#6b4f35"/>
    <circle cx="100" cy="462" r="9" fill="#6b4f35"/>
    <polygon points="52,510 82,503 82,511 52,516" fill="#2f8f4e"/>
    <polygon points="52,516 82,511 82,514 52,519" fill="#fffaf0"/>
    <polygon points="148,510 118,503 118,511 148,516" fill="#2f8f4e"/>
    <polygon points="148,516 118,511 118,514 148,519" fill="#fffaf0"/>
    <text x="100" y="628" font-family="sans-serif" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Northern pintail</text>
    <text x="100" y="648" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Long neck, long tail.</text>
    <text x="100" y="666" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Limit 4 a day.</text>
  </g>

  <!-- Goldeneye: diver, wings set back, big white wing patches, short neck -->
  <g>
    <ellipse cx="300" cy="520" rx="16" ry="38" fill="#23261f"/>
    <path d="M232 540 L300 518 L368 540 L300 532 Z" fill="#23261f"/>
    <polygon points="250,534 288,526 288,536 250,540" fill="#fffaf0" stroke="#23261f" stroke-width="1"/>
    <polygon points="350,534 312,526 312,536 350,540" fill="#fffaf0" stroke="#23261f" stroke-width="1"/>
    <circle cx="300" cy="480" r="11" fill="#2f3a2b"/>
    <circle cx="306" cy="485" r="3" fill="#fffaf0"/>
    <text x="300" y="628" font-family="sans-serif" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Goldeneye (diver)</text>
    <text x="300" y="648" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Big white wing patches.</text>
    <text x="300" y="666" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Wings whistle. Limit 2.</text>
  </g>
  <text x="200" y="690" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="middle">Hand drawn. Colours are the wing patch, not the whole bird.</text>
</svg>
