<text x="100" y="424" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">American wigeon</text>
<text x="100" y="446" font-size="15" fill="#2f3a2b" text-anchor="middle">White shoulder flash.</text>
<text x="100" y="465" font-size="15" fill="#2f3a2b" text-anchor="middle">Drake: white crown.</text>
