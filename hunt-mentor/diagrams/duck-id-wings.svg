<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 702" font-family="sans-serif" role="img" aria-label="Six ducks seen from above in flight, showing the coloured wing patch on the back edge of the wing (speculum) and body shape. Mallard: blue patch with white bars, big, slow wingbeat. Gadwall: the only puddle duck with a white patch, plain grey. American wigeon: white shoulder flash and green patch, drake has a white crown. Green winged teal: tiny, green patch, tight twisting flocks. Northern pintail: long neck, long tail, green patch with a white trailing edge, limit 4 a day. Goldeneye, a diver: big white wing patches, wings set far back, wings whistle, limit 2. Hand drawn.">
<rect width="400" height="702" fill="#fffaf0"/>
<text x="200" y="28" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wing patch and shape, seen from above</text>
