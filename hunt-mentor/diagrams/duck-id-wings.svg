<text x="300" y="424" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Green winged teal</text>
<text x="300" y="446" font-size="15" fill="#2f3a2b" text-anchor="middle">Tiny. Green patch.</text>
<text x="300" y="465" font-size="15" fill="#2f3a2b" text-anchor="middle">Tight flock, twisting.</text>
