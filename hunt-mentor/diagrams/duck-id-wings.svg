<text x="100" y="226" font-size="15" fill="#2f3a2b" text-anchor="middle">Blue patch, white bars.</text>
<text x="100" y="245" font-size="15" fill="#2f3a2b" text-anchor="middle">Big, slow wingbeat.</text>
<g transform="translate(300 122) scale(1.0)"><path d="M-9.0 -13.0 L-36.0 -20.0 L-60.0 -13.0 L-80.0 6.0 L-49.6 11.0 L-36.8 14.0 L-9.0 12.0z" fill="#8b877f"/><path d="M-36.0 -20.0 L-60.0 -13.0 L-80.0 6.0 L-49.6 11.0 L-40.0 13.0z" fill="#5e5a54"/><path d="M-12.0 2.0 L-36.8 3.0 L-36.8 14.0 L-12.0 12.0z" fill="#ffffff"/><path d="M9.0 -13.0 L36.0 -20.0 L60.0 -13.0 L80.0 6.0 L49.6 11.0 L36.8 14.0 L9.0 12.0z" fill="#8b877f"/><path d="M36.0 -20.0 L60.0 -13.0 L80.0 6.0 L49.6 11.0 L40.0 13.0z" fill="#5e5a54"/><path d="M12.0 2.0 L36.8 3.0 L36.8 14.0 L12.0 12.0z" fill="#ffffff"/><path d="M-9 20 Q0 44 9 20z" fill="#5e5a54"/><ellipse cx="0" cy="4" rx="11" ry="25" fill="#8d8a80"/><ellipse cx="0" cy="-25" rx="7.5" ry="9" fill="#8a7d6c"/><path d="M-3.5 -33 Q0 -42 3.5 -33z" fill="#3a3a30"/></g>
<text x="300" y="204" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Gadwall</text>
<text x="300" y="226" font-size="15" fill="#2f3a2b" text-anchor="middle">Only puddle duck with</text>
<text x="300" y="245" font-size="15" fill="#2f3a2b" text-anchor="middle">a white patch. Plain grey.</text>
