<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Escape step 2: watch where the smoke column leans. It shows the wind and where the fire is heading. Falling ash means it is close.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">2. Read the smoke</text><rect x="0" y="230" width="400" height="70" rx="0" fill="#dfe6d3"/><path d="M120 230 C140 170 200 130 300 80" fill="none" stroke="#9a9a8f" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><path d="M106 230 Q101 206 120 185 Q139 206 134 230 Z" fill="#e8590c"/><path d="M113 230 Q110 217 120 204 Q130 217 127 230 Z" fill="#f6c344"/><line x1="200" y1="200" x2="309" y2="164" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="320,160 306,157 311,171" fill="#4a7fb0"/><text x="300" y="200" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">wind</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Smoke leans the way it spreads</text>
</svg>
