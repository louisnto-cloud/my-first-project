<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Food path in a duck, left to right. Bill: grabs and sieves. Gullet: stretches to hold food. Glandular stomach: acid and enzymes. Gizzard: muscle and grit grind the food like teeth. Gut with two caeca. A mallard gullet can hold up to 113 grams, a quarter pound, of grain, 75 percent. Ducks have no true crop like a grouse, 80 percent. Diving ducks have a bigger gizzard for clams and snails, 75 percent."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Food path: no teeth, a gizzard instead</text><rect x="6" y="50" width="72" height="92" rx="10" fill="#f6d7b0"/><text x="42" y="84" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Bill</text><text x="42" y="106" font-size="14" fill="#2f3a2b" text-anchor="middle">sieves</text><line x1="78" y1="96" x2="80.0" y2="96.0" stroke="#e8590c" stroke-width="3" fill="none"/><polygon points="86.0,96.0 75.0,90.0 75.0,102.0" fill="#e8590c"/><rect x="85" y="50" width="72" height="92" rx="10" fill="#e9d7b8"/><text x="121" y="84" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Gullet</text><text x="121" y="106" font-size="14" fill="#2f3a2b" text-anchor="middle">stretches</text><line x1="157" y1="96" x2="159.0" y2="96.0" stroke="#e8590c" stroke-width="3" fill="none"/><polygon points="165.0,96.0 154.0,90.0 154.0,102.0" fill="#e8590c"/><rect x="164" y="50" width="72" height="92" rx="10" fill="#e7c3b3"/><text x="200" y="84" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Stomach</text><text x="200" y="106" font-size="14" fill="#2f3a2b" text-anchor="middle">acid</text><line x1="236" y1="96" x2="238.0" y2="96.0" stroke="#e8590c" stroke-width="3" fill="none"/><polygon points="244.0,96.0 233.0,90.0 233.0,102.0" fill="#e8590c"/><rect x="243" y="50" width="72" height="92" rx="10" fill="#c9a07a"/><text x="279" y="84" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Gizzard</text><text x="279" y="106" font-size="14" fill="#2f3a2b" text-anchor="middle">grit grinds</text><line x1="315" y1="96" x2="317.0" y2="96.0" stroke="#e8590c" stroke-width="3" fill="none"/><polygon points="323.0,96.0 312.0,90.0 312.0,102.0" fill="#e8590c"/><rect x="322" y="50" width="72" height="92" rx="10" fill="#dfe6d3"/><text x="358" y="84" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Gut</text><text x="358" y="106" font-size="14" fill="#2f3a2b" text-anchor="middle">2 caeca</text><rect x="10" y="156" width="380" height="40" rx="8" fill="#dfe6d3"/><text x="200" y="182" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Mallard gullet: up to 113 g of grain (75%)</text><rect x="10" y="204" width="380" height="40" rx="8" fill="#dfe6d3"/><text x="200" y="230" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">No true crop like a grouse (80%)</text><rect x="10" y="252" width="380" height="40" rx="8" fill="#cfe0ef"/><text x="200" y="278" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Divers: bigger gizzard for clams (75%)</text></svg>
