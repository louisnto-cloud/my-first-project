rcle cx="14" cy="0" r="3" fill="#2f3a2b"/></g><g transform="translate(228 200) rotate(0) scale(1.0)"><ellipse rx="9" ry="5" fill="#7a6a58"/><line x1="7" y1="0" x2="13" y2="0" stroke="#2f3a2b" stroke-width="3"/><circle cx="14" cy="0" r="3" fill="#2f3a2b"/></g><g transform="translate(198 220) rotate(0) scale(1.0)"><ellipse rx="9" ry="5" fill="#7a6a58"/><line x1="7" y1="0" x2="19" y2="0" stroke="#2f3a2b" stroke-width="3"/><circle cx="20" cy="0" r="3" fill="#2f3a2b"/></g><g transform="translate(220 220) rotate(0) scale(1.0)"><ellipse rx="9" ry="5" fill="#7a6a58"/><line x1="7" y1="0" x2="13" y2="0" stroke="#2f3a2b" stroke-width="3"/><circle cx="14" cy="0" r="3" fill="#2f3a2b"/></g><g transform="translate(242 220) rotate(0) scale(1.0)"><ellipse rx="9" ry="5" fill="#7a6a58"/><line x1="7" y1="0" x2="13" y2="0" stroke="#2f3a2b" stroke-width="3"/><circle cx="14" cy="0" r="3" fill="#2f3a2b"/></g><ellipse cx="300" cy="200" rx="30" ry="22" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="6 4"/><text x="300" y="205" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Hole</text><rect x="80" y="96" width="50" height="26" rx="6" fill="#6d8b4a"/><text x="105" y="90" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hide</text><rect x="20" y="60" width="40" height="16" rx="6" fill="#9e9e9e"/><text x="40" y="56" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Boat</text><rect x="210" y="232" width="182" height="62" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="301" y="252" font-size="14" fill="#23261f" text-anchor="middle">No shooting from a</text><text x="301" y="268" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">moving motor boat (99%)</text><text x="301" y="286" font-size="14" fill="#23261f" text-anchor="middle">Plan the fetch (99%)</text>
