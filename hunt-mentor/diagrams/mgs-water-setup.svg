<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Top view of a river bar set up. A hide in bank cover beside a sand bar; the boat pulled up and hidden. Decoys float off the bar with an open landing hole downstream and downwind. No shooting from a moving motor boat, 99 percent. Plan how you will fetch birds, 99 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
