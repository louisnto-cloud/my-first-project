<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Daylight bar for an October afternoon. Turn back time is 1 hour before sunset. Pack a dry layer and a toque. Check fire rules on the BC Wildfire Service app. Report a wildfire at 1 800 663 5555, or star 5555 on a cell.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Leave an hour before dark</text>
  <rect x="20" y="60" width="360" height="40" rx="6" fill="#e8b10c" opacity=".5"/>
  <rect x="300" y="60" width="80" height="40" rx="6" fill="#2f3a2b"/>
  <rect x="220" y="60" width="80" height="40" fill="#e8590c"/>
  <circle cx="300" cy="100" r="16" fill="#e8b10c"/><rect x="280" y="100" width="40" height="20" fill="#fffaf0"/>
  <g font-size="15" font-weight="bold" text-anchor="middle"><text x="120" y="86" fill="#2f3a2b">Hunt</text><text x="260" y="86" fill="#fff">Walk out</text><text x="340" y="86" fill="#fff">Dark</text></g>
  <path d="M220 104 v20" stroke="#e8590c" stroke-width="3"/><text x="220" y="142" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Turn back</text>
  <text x="300" y="142" font-size="14" fill="#2f3a2b" text-anchor="middle">Sunset</text>
  <path d="M232 112 h56" stroke="#2f3a2b" stroke-width="2"/><text x="260" y="128" font-size="13" fill="#2f3a2b" text-anchor="middle">1 hour</text>
  <rect x="20" y="170" width="360" height="110" rx="10" fill="#c0392b" fill-opacity=".12" stroke="#c0392b" stroke-width="2"/>
  <path d="M50 250 q-18 -24 0 -56 q6 20 14 22 q10 16 -14 34 Z" fill="#e8590c"/>
  <g font-size="15" font-weight="bold" fill="#2f3a2b"><text x="90" y="200">Report a wildfire</text><text x="90" y="226" fill="#c0392b">1 800 663 5555</text><text x="90" y="250" fill="#c0392b">*5555 on a cell</text><text x="90" y="272" font-size="14" font-weight="normal">Check fire rules before any fire</text></g>
</svg>
