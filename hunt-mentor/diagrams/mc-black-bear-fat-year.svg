<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Line sketch of a black bear weight through the year. Weight falls through the winter in the den and keeps falling into late spring and early summer. It climbs fast from August to October during the fall feed, and peaks before the den. Bears can lose up to a quarter of their body weight while denned. The line shows the shape only, not exact kilograms.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Weight through the year (shape only)</text><line x1="40" y1="250" x2="390" y2="250" stroke="#2f3a2b" stroke-width="2"/><line x1="40" y1="250" x2="40" y2="60" stroke="#2f3a2b" stroke-width="2"/><text x="54" y="270" font-size="14" fill="#23261f" text-anchor="middle">J</text><text x="82" y="270" font-size="14" fill="#23261f" text-anchor="middle">F</text><text x="110" y="270" font-size="14" fill="#23261f" text-anchor="middle">M</text><text x="138" y="270" font-size="14" fill="#23261f" text-anchor="middle">A</text><text x="166" y="270" font-size="14" fill="#23261f" text-anchor="middle">M</text><text x="194" y="270" font-size="14" fill="#23261f" text-anchor="middle">J</text><text x="222" y="270" font-size="14" fill="#23261f" text-anchor="middle">J</text><text x="250" y="270" font-size="14" fill="#23261f" text-anchor="middle">A</text><text x="278" y="270" font-size="14" fill="#23261f" text-anchor="middle">S</text><text x="306" y="270" font-size="14" fill="#23261f" text-anchor="middle">O</text><text x="334" y="270" font-size="14" fill="#23261f" text-anchor="middle">N</text><text x="362" y="270" font-size="14" fill="#23261f" text-anchor="middle">D</text><polyline points="54,170 82,190 110,205 138,218 166,222 194,214 222,200 250,180 278,140 306,110 334,100 362,120" fill="none" stroke="#8b5a2b" stroke-width="4"/><rect x="40" y="60" width="96" height="190" rx="0" fill="#4a7fb0" opacity=".12"/><rect x="334" y="60" width="56" height="190" rx="0" fill="#4a7fb0" opacity=".12"/><text x="46" y="80" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="start">In den</text><text x="386" y="80" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="end">Den</text><text x="150" y="240" font-size="14" font-weight="bold" fill="#8b5a2b" text-anchor="start">Lowest: late spring</text><text x="250" y="96" font-size="14" font-weight="bold" fill="#8b5a2b" text-anchor="start">Fall peak</text><text x="16" y="292" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Den loss up to a quarter of body weight (90%)</text>
</svg>
