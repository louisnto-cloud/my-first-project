<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Cleaning step 4: dry everything (bore, bolt, carrier, piston, tube), then a light coat of oil. Water left inside rusts too. Run a patch again over the next days.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<circle cx="26.0" cy="22.0" r="13" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="26.0" y="27.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="46.0" y="28.0" font-size="17" font-weight="bold" fill="#1F3D2B" text-anchor="start">Dry everything. Oil lightly.</text><rect x="40.0" y="90.0" width="58.0" height="58.0" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><circle cx="69.0" cy="112.0" r="8.8" fill="#2E7D4F" stroke="#FFFFFF" stroke-width="2"/><path d="M65.0 112.0 l3.2 3.2 l5.6 -6.4" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/><text x="69.0" y="140.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Bore</text><rect x="110.0" y="90.0" width="58.0" height="58.0" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><circle cx="139.0" cy="112.0" r="8.8" fill="#2E7D4F" stroke="#FFFFFF" stroke-width="2"/><path d="M135.0 112.0 l3.2 3.2 l5.6 -6.4" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/><text x="139.0" y="140.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Bolt</text><rect x="180.0" y="90.0" width="58.0" height="58.0" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><circle cx="209.0" cy="112.0" r="8.8" fill="#2E7D4F" stroke="#FFFFFF" stroke-width="2"/><path d="M205.0 112.0 l3.2 3.2 l5.6 -6.4" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/><text x="209.0" y="140.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Carrier</text><rect x="250.0" y="90.0" width="58.0" height="58.0" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><circle cx="279.0" cy="112.0" r="8.8" fill="#2E7D4F" stroke="#FFFFFF" stroke-width="2"/><path d="M275.0 112.0 l3.2 3.2 l5.6 -6.4" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/><text x="279.0" y="140.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Piston</text><rect x="320.0" y="90.0" width="58.0" height="58.0" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><circle cx="349.0" cy="112.0" r="8.8" fill="#2E7D4F" stroke="#FFFFFF" stroke-width="2"/><path d="M345.0 112.0 l3.2 3.2 l5.6 -6.4" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/><text x="349.0" y="140.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Tube</text><text x="200.0" y="196.0" font-size="14" font-weight="bold" fill="#B3261E" text-anchor="middle">Water left inside rusts too.</text><text x="200.0" y="218.0" font-size="14" fill="#17201A" text-anchor="middle">Dry fully, then a light oil coat.</text><text x="200.0" y="240.0" font-size="14" fill="#17201A" text-anchor="middle">Run a patch again over the next days.</text>
</svg>
