<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Decision flow before shooting a bear. 1: Can you see the profile, the hump, face and ears? If not, no shot. 2: Do at least 3 clues say black bear? If not or unsure, no shot. 3: Is it alone after watching 5 minutes or more? Cubs or a small bear mean no shot. 4: Is it an adult, ideally a male? A young bear: let it grow. 5: Broadside, safe backstop, in range. Then, and only then.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Before the safety comes off</text><rect x="10" y="50" width="250" height="42" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><circle cx="30" cy="71" r="13" fill="#2f3a2b"/><text x="30" y="76" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="50" y="76" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Profile clear? Hump, face, ears</text><rect x="268" y="50" width="124" height="42" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="1.5"/><text x="330" y="76" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">No: wait</text><line x1="130" y1="92" x2="130" y2="99" stroke="#2f3a2b" stroke-width="2"/><polygon points="130,99 125.7,90.0 134.3,90.0" fill="#2f3a2b"/><rect x="10" y="99" width="250" height="42" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><circle cx="30" cy="120" r="13" fill="#2f3a2b"/><text x="30" y="125" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="50" y="125" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">3 clues say black bear?</text><rect x="268" y="99" width="124" height="42" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="1.5"/><text x="330" y="125" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Unsure: no</text><line x1="130" y1="141" x2="130" y2="148" stroke="#2f3a2b" stroke-width="2"/><polygon points="130,148 125.7,139.0 134.3,139.0" fill="#2f3a2b"/><rect x="10" y="148" width="250" height="42" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><circle cx="30" cy="169" r="13" fill="#2f3a2b"/><text x="30" y="174" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="50" y="174" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Alone after 5 minutes?</text><rect x="268" y="148" width="124" height="42" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="1.5"/><text x="330" y="174" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Cubs: no</text><line x1="130" y1="190" x2="130" y2="197" stroke="#2f3a2b" stroke-width="2"/><polygon points="130,197 125.7,188.0 134.3,188.0" fill="#2f3a2b"/><rect x="10" y="197" width="250" height="42" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><circle cx="30" cy="218" r="13" fill="#2f3a2b"/><text x="30" y="223" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="50" y="223" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Adult, ideally a boar?</text><rect x="268" y="197" width="124" height="42" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="1.5"/><text x="330" y="223" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Young: pass</text><line x1="130" y1="239" x2="130" y2="246" stroke="#2f3a2b" stroke-width="2"/><polygon points="130,246 125.7,237.0 134.3,237.0" fill="#2f3a2b"/><rect x="10" y="246" width="250" height="42" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><circle cx="30" cy="267" r="13" fill="#2f3a2b"/><text x="30" y="272" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="50" y="272" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Broadside, backstop, range</text><rect x="268" y="246" width="124" height="42" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="1.5"/><text x="330" y="272" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Then shoot</text>
</svg>
