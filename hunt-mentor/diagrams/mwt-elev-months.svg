<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Bar chart of white tailed deer elevation by month in southern BC. Every month sits roughly between 300 and 900 metres, reaching about 1,000 metres in September and October. October and November are orange. General pattern, 60 to 70 percent certain." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
