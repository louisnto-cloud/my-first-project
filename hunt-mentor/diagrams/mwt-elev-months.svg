t="133" rx="4" fill="#8b5a2b"/><text x="294.0" y="272" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">S</text><rect x="312" y="60" width="20" height="133" rx="4" fill="#e8590c"/><text x="321.5" y="272" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">O</text><rect x="339" y="79" width="20" height="114" rx="4" fill="#e8590c"/><text x="349.0" y="272" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">N</text><rect x="366" y="79" width="20" height="114" rx="4" fill="#8b5a2b"/><text x="376.5" y="272" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">D</text><text x="200" y="294" font-size="14" fill="#6b4f35" text-anchor="middle">Mostly 300 to 900 m. General pattern (60 to 70%).</text>
