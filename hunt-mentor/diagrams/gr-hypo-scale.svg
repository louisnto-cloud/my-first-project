<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Hypothermia getting worse. Mild: shivering and the umbles, fumbles, mumbles, stumbles, grumbles. Moderate: violent shivering, confusion, poor judgment. Severe: shivering stops, stiff muscles, glassy stare, slow breathing. Emergency.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hypothermia: know the signs</text>
  <rect x="20" y="40" width="26" height="230" rx="13" fill="#fff" stroke="#2f3a2b" stroke-width="2"/>
  <rect x="25" y="60" width="16" height="205" rx="8" fill="#4a7fb0"/>
  <circle cx="33" cy="268" r="16" fill="#4a7fb0" stroke="#2f3a2b" stroke-width="2"/>
  <g font-size="15" fill="#2f3a2b">
    <rect x="64" y="40" width="326" height="70" rx="8" fill="#e8b10c" fill-opacity=".3"/><text x="76" y="64" font-weight="bold">Mild</text><text x="76" y="84">Shivering. The "umbles":</text><text x="76" y="102" font-size="14">fumbles, mumbles, stumbles, grumbles</text>
    <rect x="64" y="118" width="326" height="64" rx="8" fill="#e8590c" fill-opacity=".3"/><text x="76" y="142" font-weight="bold">Moderate</text><text x="76" y="164">Violent shivering, confusion</text>
    <rect x="64" y="190" width="326" height="80" rx="8" fill="#c0392b"/><text x="76" y="214" font-weight="bold" fill="#fff">Severe: EMERGENCY</text><text x="76" y="236" fill="#fff">Shivering STOPS, stiff, glassy</text><text x="76" y="256" fill="#fff">stare, slow breathing</text>
  </g>
  <text x="200" y="292" font-size="14" fill="#2f3a2b" text-anchor="middle">Out of wind and wet, dry layers, rewarm gently</text>
</svg>
