<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A ground blind brushed in with local plants, dark inside, with one small shooting window. Tips: dark inside and dark clothes; brushed in with local cover; set early, about a week ahead. No fall risk and room for two.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A ground blind that hides you</text><rect x="0" y="230" width="400" height="70" fill="#dfe6d3"/><path d="M90 230 L120 90 L280 90 L310 230 Z" fill="#6f6a4a" stroke="#23261f" stroke-width="2"/><rect x="150" y="140" width="100" height="30" fill="#1e1e1a"/><text x="200" y="132" font-size="14" fill="#fffaf0" text-anchor="middle">small window</text><path d="M80 232 l -12 -50 l 12 18 l 10 -40 l 6 44 l 12 -22 l -6 50 Z" fill="#8a9a6b"/><path d="M110 232 l -12 -50 l 12 18 l 10 -40 l 6 44 l 12 -22 l -6 50 Z" fill="#8a9a6b"/><path d="M290 232 l -12 -50 l 12 18 l 10 -40 l 6 44 l 12 -22 l -6 50 Z" fill="#8a9a6b"/><path d="M320 232 l -12 -50 l 12 18 l 10 -40 l 6 44 l 12 -22 l -6 50 Z" fill="#8a9a6b"/><path d="M200 232 l -12 -50 l 12 18 l 10 -40 l 6 44 l 12 -22 l -6 50 Z" fill="#8a9a6b"/><text x="60" y="256" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Dark inside</text><text x="60" y="276" font-size="14" fill="#23261f" text-anchor="middle">dark clothes</text><text x="190" y="256" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Brushed in</text><text x="190" y="276" font-size="14" fill="#23261f" text-anchor="middle">with local cover</text><text x="330" y="256" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Set early</text><text x="330" y="276" font-size="14" fill="#23261f" text-anchor="middle">a week ahead</text><text x="200" y="296" font-size="14" fill="#6b4f35" text-anchor="middle">No fall risk. Room for two (Tip)</text>
</svg>
