<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" role="img" aria-label="Memory hook LISTEN before the shot: Legal, Identified, Safe backstop, Tested range, Easy and steady, No doubt. And: you cannot pull the bullet back.">
  <rect x="0" y="0" width="400" height="390" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Memory hook: LISTEN before you shoot</text>
<rect x="10" y="48" width="380" height="46" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="14" y="52" width="52" height="38" rx="8" fill="#e8590c"/>
<text x="40" y="80" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">L</text>
<text x="78" y="70" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="start">Legal</text>
<text x="78" y="88" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">here, now, this animal</text>
<rect x="10" y="100" width="380" height="46" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="14" y="104" width="52" height="38" rx="8" fill="#e8590c"/>
<text x="40" y="132" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">I</text>
<text x="78" y="122" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="start">Identified</text>
<text x="78" y="140" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">species, sex, points</text>
<rect x="10" y="152" width="380" height="46" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="14" y="156" width="52" height="38" rx="8" fill="#e8590c"/>
<text x="40" y="184" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
<text x="78" y="174" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="start">Safe backstop</text>
<text x="78" y="192" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">and nothing behind</text>
<rect x="10" y="204" width="380" height="46" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="14" y="208" width="52" height="38" rx="8" fill="#e8590c"/>
<text x="40" y="236" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">T</text>
<text x="78" y="226" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="start">Tested range</text>
<text x="78" y="244" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">inside your proven distance</text>
<rect x="10" y="256" width="380" height="46" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="14" y="260" width="52" height="38" rx="8" fill="#e8590c"/>
<text x="40" y="288" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">E</text>
<text x="78" y="278" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="start">Easy and steady</text>
<text x="78" y="296" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">calm, clear vitals</text>
<rect x="10" y="308" width="380" height="46" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="14" y="312" width="52" height="38" rx="8" fill="#e8590c"/>
<text x="40" y="340" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text>
<text x="78" y="330" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="start">No doubt</text>
<text x="78" y="348" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">any doubt: pass</text>
<text x="200" y="380" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">You cannot pull the bullet back</text>
</svg>
