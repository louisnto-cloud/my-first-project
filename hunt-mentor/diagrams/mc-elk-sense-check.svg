<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Flow chart. An elk sees a shape. It freezes and stares with ears on it. Then it checks with nose or ears. If they confirm danger, it barks and the herd runs to timber. If not, it goes back to feeding but stays wary.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">How an elk checks a threat</text><rect x="90" y="52" width="220" height="36" rx="8" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="75" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Sees a shape</text><line x1="200" y1="88" x2="200" y2="102" stroke="#2f3a2b" stroke-width="2"/><path d="M200.0 102.0 L195.7 93.0 L204.3 93.0 Z" fill="#2f3a2b"/><rect x="90" y="102" width="220" height="36" rx="8" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="125" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Freezes, stares, ears on it</text><line x1="200" y1="138" x2="200" y2="152" stroke="#2f3a2b" stroke-width="2"/><path d="M200.0 152.0 L195.7 143.0 L204.3 143.0 Z" fill="#2f3a2b"/><rect x="90" y="152" width="220" height="36" rx="8" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="175" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Nose or ears confirm?</text><line x1="150" y1="188" x2="90" y2="214" stroke="#e8590c" stroke-width="3"/><path d="M90.0 214.0 L96.5 206.4 L100.0 214.4 Z" fill="#e8590c"/><line x1="250" y1="188" x2="310" y2="214" stroke="#8a9a6b" stroke-width="3"/><path d="M310.0 214.0 L300.0 214.4 L303.5 206.4 Z" fill="#8a9a6b"/><rect x="10" y="214" width="170" height="50" rx="8" fill="#e8590c"/><text x="95" y="236" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Yes: bark, herd runs</text><text x="95" y="254" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">to timber</text><rect x="220" y="214" width="170" height="50" rx="8" fill="#8a9a6b"/><text x="305" y="236" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">No: back to</text><text x="305" y="254" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">feeding, still wary</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">CPW course (75%); bark as alarm (65%)</text>
</svg>
