<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 611" font-family="sans-serif" role="img" aria-label="Flowchart: keep tracking or stop? Question 1: is there legal light left? If no, mark the track, go home, come back at first light. Question 2: is the ground safe, with no avalanche slope, cliff, ice or private land without consent? If no, stop. Question 3: fresh grizzly or cougar tracks on top of yours? If yes, back out. Question 4: tired, wet or unsure of the way out? If yes, stop. Question 5: an unwounded deer walking straight with the day half gone? If yes, stop. If you pass every question, keep going slowly. A wounded animal: keep going while there is light and safe ground, and return at first light if you lose it.">
<rect width="400" height="611" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Keep tracking or stop?</text>
<rect x="8" y="40" width="212" height="54" rx="8" fill="#2f3a2b"/>
<text x="18" y="73" font-size="16" font-weight="bold" fill="#fffaf0">1. Legal light left?</text>
<line x1="220" y1="67.0" x2="249" y2="67.0" stroke="#c0392b" stroke-width="2.2"/><path d="M247 61.0 L247 73.0 L256 67.0z" fill="#c0392b"/><text x="237" y="60" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">No</text>
<rect x="256" y="40" width="136" height="54" rx="8" fill="#f8dcd3" stroke="#c0392b" stroke-width="1.4"/>
<text x="324" y="63" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Mark it.</text>
<text x="324" y="82" font-size="15" fill="#2f3a2b" text-anchor="middle">Back at first light</text>
<line x1="114" y1="94" x2="114" y2="109" stroke="#2f3a2b" stroke-width="2.2"/><path d="M108 107 L120 107 L114 116z" fill="#2f3a2b"/>
<rect x="8" y="116" width="212" height="76" rx="8" fill="#2f3a2b"/>
<text x="18" y="140" font-size="16" font-weight="bold" fill="#fffaf0">2. Safe ground? No</text>
<text x="18" y="160" font-size="16" font-weight="bold" fill="#fffaf0">avalanche, cliff, ice or</text>
<text x="18" y="180" font-size="16" font-weight="bold" fill="#fffaf0">private land</text>
<line x1="220" y1="154.0" x2="249" y2="154.0" stroke="#c0392b" stroke-width="2.2"/><path d="M247 148.0 L247 160.0 L256 154.0z" fill="#c0392b"/><text x="237" y="147" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">No</text>
<rect x="256" y="116" width="136" height="76" rx="8" fill="#f8dcd3" stroke="#c0392b" stroke-width="1.4"/>
<text x="324" y="150" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Stop.</text>
<text x="324" y="169" font-size="15" fill="#2f3a2b" text-anchor="middle">Do not follow</text>
<line x1="114" y1="192" x2="114" y2="207" stroke="#2f3a2b" stroke-width="2.2"/><path d="M108 205 L120 205 L114 214z" fill="#2f3a2b"/>
<rect x="8" y="214" width="212" height="76" rx="8" fill="#2f3a2b"/>
<text x="18" y="238" font-size="16" font-weight="bold" fill="#fffaf0">3. Fresh grizzly or</text>
<text x="18" y="258" font-size="16" font-weight="bold" fill="#fffaf0">cougar tracks on top of</text>
<text x="18" y="278" font-size="16" font-weight="bold" fill="#fffaf0">yours?</text>
<line x1="220" y1="252.0" x2="249" y2="252.0" stroke="#c0392b" stroke-width="2.2"/><path d="M247 246.0 L247 258.0 L256 252.0z" fill="#c0392b"/><text x="237" y="245" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Yes</text>
<rect x="256" y="214" width="136" height="76" rx="8" fill="#f8dcd3" stroke="#c0392b" stroke-width="1.4"/>
<text x="324" y="257.5" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Back out now</text>
<line x1="114" y1="290" x2="114" y2="305" stroke="#2f3a2b" stroke-width="2.2"/><path d="M108 303 L120 303 L114 312z" fill="#2f3a2b"/>
<rect x="8" y="312" width="212" height="56" rx="8" fill="#2f3a2b"/>
<text x="18" y="336" font-size="16" font-weight="bold" fill="#fffaf0">4. Tired, wet, unsure of</text>
<text x="18" y="356" font-size="16" font-weight="bold" fill="#fffaf0">the way out?</text>
<line x1="220" y1="340.0" x2="249" y2="340.0" stroke="#c0392b" stroke-width="2.2"/><path d="M247 334.0 L247 346.0 L256 340.0z" fill="#c0392b"/><text x="237" y="333" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Yes</text>
<rect x="256" y="312" width="136" height="56" rx="8" fill="#f8dcd3" stroke="#c0392b" stroke-width="1.4"/>
<text x="324" y="336" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Stop.</text>
<text x="324" y="355" font-size="15" fill="#2f3a2b" text-anchor="middle">Head out</text>
<line x1="114" y1="368" x2="114" y2="383" stroke="#2f3a2b" stroke-width="2.2"/><path d="M108 381 L120 381 L114 390z" fill="#2f3a2b"/>
<rect x="8" y="390" width="212" height="73" rx="8" fill="#2f3a2b"/>
<text x="18" y="422.5" font-size="16" font-weight="bold" fill="#fffaf0">5. Unwounded, walking</text>
<text x="18" y="442.5" font-size="16" font-weight="bold" fill="#fffaf0">straight, day half gone?</text>
<line x1="220" y1="426.5" x2="249" y2="426.5" stroke="#c0392b" stroke-width="2.2"/><path d="M247 420.5 L247 432.5 L256 426.5z" fill="#c0392b"/><text x="237" y="419.5" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Yes</text>
<rect x="256" y="390" width="136" height="73" rx="8" fill="#f8dcd3" stroke="#c0392b" stroke-width="1.4"/>
<text x="324" y="413" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Stop.</text>
<text x="324" y="432" font-size="15" fill="#2f3a2b" text-anchor="middle">You will not</text>
<text x="324" y="451" font-size="15" fill="#2f3a2b" text-anchor="middle">catch it</text>
<line x1="114" y1="463" x2="114" y2="478" stroke="#2f3a2b" stroke-width="2.2"/><path d="M108 476 L120 476 L114 485z" fill="#2f3a2b"/>
<rect x="8" y="485" width="212" height="44" rx="8" fill="#8a9a6b"/><text x="114" y="513" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">Keep going, slowly</text>
<rect x="8" y="541" width="384" height="62" rx="8" fill="#e8590c"/>
<text x="200" y="567" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Wounded animal: keep going while light</text>
<text x="200" y="588" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">and ground allow. Back at first light.</text>
</svg>
