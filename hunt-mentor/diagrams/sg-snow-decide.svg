<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 610" font-family="sans-serif" role="img" aria-label="Flowchart: keep tracking or stop? Question 1: is there legal light left? If no, mark the track, go home, come back at first light. Question 2: is the ground safe, with no avalanche slope, cliff, ice or private land without consent? If no, stop. Question 3: fresh grizzly or cougar tracks on top of yours? If yes, back out. Question 4: tired, wet or unsure of the way out? If yes, stop. Question 5: an unwounded deer walking straight with the day half gone? If yes, stop. If you pass every question, keep going slowly. A wounded animal: keep going while there is light and safe ground, and return at first light if you lose it.">
<rect width="400" height="610" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Keep tracking or stop?</text>
<rect x="8" y="40" width="222" height="73" rx="8" fill="#2f3a2b"/>
<text x="18" y="82.5" font-size="16" font-weight="bold" fill="#fffaf0">1. Legal light left?</text>
<line x1="230" y1="76.5" x2="261" y2="76.5" stroke="#c0392b" stroke-width="2.2"/><path d="M259 70.5 L259 82.5 L268 76.5z" fill="#c0392b"/><text x="248" y="69.5" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">No</text>
<rect x="268" y="40" width="124" height="73" rx="8" fill="#f8dcd3" stroke="#c0392b" stroke-width="1.4"/>
<text x="330" y="63" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Mark it.</text>
<text x="330" y="82" font-size="15" fill="#2f3a2b" text-anchor="middle">Back at first</text>
<text x="330" y="101" font-size="15" fill="#2f3a2b" text-anchor="middle">light</text>
<line x1="119" y1="113" x2="119" y2="128" stroke="#2f3a2b" stroke-width="2.2"/><path d="M113 126 L125 126 L119 135z" fill="#2f3a2b"/>
<rect x="8" y="135" width="222" height="76" rx="8" fill="#2f3a2b"/>
<text x="18" y="159" font-size="16" font-weight="bold" fill="#fffaf0">2. Safe ground? No</text>
<text x="18" y="179" font-size="16" font-weight="bold" fill="#fffaf0">avalanche, cliff, ice or</text>
<text x="18" y="199" font-size="16" font-weight="bold" fill="#fffaf0">private land</text>
<line x1="230" y1="173.0" x2="261" y2="173.0" stroke="#c0392b" stroke-width="2.2"/><path d="M259 167.0 L259 179.0 L268 173.0z" fill="#c0392b"/><text x="248" y="166" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">No</text>
<rect x="268" y="135" width="124" height="76" rx="8" fill="#f8dcd3" stroke="#c0392b" stroke-width="1.4"/>
<text x="330" y="169" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Stop.</text>
<text x="330" y="188" font-size="15" fill="#2f3a2b" text-anchor="middle">Do not follow</text>
<line x1="119" y1="211" x2="119" y2="226" stroke="#2f3a2b" stroke-width="2.2"/><path d="M113 224 L125 224 L119 233z" fill="#2f3a2b"/>
<rect x="8" y="233" width="222" height="56" rx="8" fill="#2f3a2b"/>
<text x="18" y="257" font-size="16" font-weight="bold" fill="#fffaf0">3. Fresh grizzly or cougar</text>
<text x="18" y="277" font-size="16" font-weight="bold" fill="#fffaf0">tracks on top of yours?</text>
<line x1="230" y1="261.0" x2="261" y2="261.0" stroke="#c0392b" stroke-width="2.2"/><path d="M259 255.0 L259 267.0 L268 261.0z" fill="#c0392b"/><text x="248" y="254" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Yes</text>
<rect x="268" y="233" width="124" height="56" rx="8" fill="#f8dcd3" stroke="#c0392b" stroke-width="1.4"/>
<text x="330" y="266.5" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Back out now</text>
<line x1="119" y1="289" x2="119" y2="304" stroke="#2f3a2b" stroke-width="2.2"/><path d="M113 302 L125 302 L119 311z" fill="#2f3a2b"/>
<rect x="8" y="311" width="222" height="56" rx="8" fill="#2f3a2b"/>
<text x="18" y="335" font-size="16" font-weight="bold" fill="#fffaf0">4. Tired, wet, unsure of</text>
<text x="18" y="355" font-size="16" font-weight="bold" fill="#fffaf0">the way out?</text>
<line x1="230" y1="339.0" x2="261" y2="339.0" stroke="#c0392b" stroke-width="2.2"/><path d="M259 333.0 L259 345.0 L268 339.0z" fill="#c0392b"/><text x="248" y="332" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Yes</text>
<rect x="268" y="311" width="124" height="56" rx="8" fill="#f8dcd3" stroke="#c0392b" stroke-width="1.4"/>
<text x="330" y="335" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Stop.</text>
<text x="330" y="354" font-size="15" fill="#2f3a2b" text-anchor="middle">Head out</text>
<line x1="119" y1="367" x2="119" y2="382" stroke="#2f3a2b" stroke-width="2.2"/><path d="M113 380 L125 380 L119 389z" fill="#2f3a2b"/>
<rect x="8" y="389" width="222" height="73" rx="8" fill="#2f3a2b"/>
<text x="18" y="421.5" font-size="16" font-weight="bold" fill="#fffaf0">5. Unwounded, walking</text>
<text x="18" y="441.5" font-size="16" font-weight="bold" fill="#fffaf0">straight, day half gone?</text>
<line x1="230" y1="425.5" x2="261" y2="425.5" stroke="#c0392b" stroke-width="2.2"/><path d="M259 419.5 L259 431.5 L268 425.5z" fill="#c0392b"/><text x="248" y="418.5" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Yes</text>
<rect x="268" y="389" width="124" height="73" rx="8" fill="#f8dcd3" stroke="#c0392b" stroke-width="1.4"/>
<text x="330" y="412" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Stop.</text>
<text x="330" y="431" font-size="15" fill="#2f3a2b" text-anchor="middle">You will not</text>
<text x="330" y="450" font-size="15" fill="#2f3a2b" text-anchor="middle">catch it</text>
<line x1="119" y1="462" x2="119" y2="477" stroke="#2f3a2b" stroke-width="2.2"/><path d="M113 475 L125 475 L119 484z" fill="#2f3a2b"/>
<rect x="8" y="484" width="222" height="44" rx="8" fill="#8a9a6b"/><text x="119" y="512" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">Keep going, slowly</text>
<rect x="8" y="540" width="384" height="62" rx="8" fill="#e8590c"/>
<text x="200" y="566" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Wounded animal: keep going while light</text>
<text x="200" y="587" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">and ground allow. Back at first light.</text>
</svg>
