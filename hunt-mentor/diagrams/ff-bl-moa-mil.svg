<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="An angle opening from your eye. At 100 m, one minute of angle covers 2.9 cm and one milliradian, a mil, covers 10 cm. Twice as far, twice as big.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Two ways to measure an angle</text><circle cx="30" cy="160" r="6" fill="#2f3a2b" stroke="none" stroke-width="2"/><path d="M30 160 L360 110 M30 160 L360 210" fill="none" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="360" y1="110" x2="360" y2="210" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><text x="200" y="80" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">At 100 m:</text><text x="280" y="250" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">1 MOA = 2.9 cm</text><text x="280" y="272" font-size="17" font-weight="bold" fill="#4a7fb0" text-anchor="middle">1 mil = 10 cm</text><text x="110" y="222" font-size="14" fill="#23261f" text-anchor="middle">Twice as far,</text><text x="110" y="240" font-size="14" fill="#23261f" text-anchor="middle">twice as big</text>
</svg>
