<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" font-family="sans-serif" role="img" aria-label="Before the knife. 1, Notch the licence, photo it, The law (95%). 2, Plan which quarter keeps tail and sex parts, Evidence of sex (95%). 3, Rifle unloaded, set aside, Safety (70%). 4, Deer on its back, head uphill, Easier, cleaner (Tip).">
<rect width="400" height="360" rx="12" fill="#EEF1EA"/>
<text x="16" y="30" font-size="18" font-weight="bold" fill="#1F3D2B">Before the knife</text>
<path d="M28 74 V304" stroke="#1F3D2B" stroke-width="3" fill="none"/>
<g><rect x="54" y="52" width="334" height="60" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="3"/><text x="66" y="77" font-size="16" font-weight="bold" fill="#17201A">Notch the licence, photo it</text><text x="66" y="99" font-size="14" fill="#1F3D2B">The law (95%)</text><circle cx="28" cy="74" r="14" fill="#FF6A13"/><text x="28" y="79" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text></g>
<g><rect x="54" y="122" width="334" height="80" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><text x="66" y="147" font-size="16" font-weight="bold" fill="#17201A">Plan which quarter keeps tail</text>
<text x="66" y="167" font-size="16" font-weight="bold" fill="#17201A">and sex parts</text><text x="66" y="189" font-size="14" fill="#1F3D2B">Evidence of sex (95%)</text><circle cx="28" cy="144" r="14" fill="#1F3D2B"/><text x="28" y="149" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text></g>
<g><rect x="54" y="212" width="334" height="60" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="3"/><text x="66" y="237" font-size="16" font-weight="bold" fill="#17201A">Rifle unloaded, set aside</text><text x="66" y="259" font-size="14" fill="#1F3D2B">Safety (70%)</text><circle cx="28" cy="234" r="14" fill="#FF6A13"/><text x="28" y="239" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text></g>
<g><rect x="54" y="282" width="334" height="60" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><text x="66" y="307" font-size="16" font-weight="bold" fill="#17201A">Deer on its back, head uphill</text><text x="66" y="329" font-size="14" fill="#1F3D2B">Easier, cleaner (Tip)</text><circle cx="28" cy="304" r="14" fill="#1F3D2B"/><text x="28" y="309" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text></g>
</svg>
