<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" font-family="sans-serif" role="img" aria-label="Where deer bed by weather. Hot sun: north slopes, shade and timber. Cold and clear: south slopes in the sun out of the wind. Windy: lee side and low draws. Rain or snow: under thick conifers. Deer pick beds for comfort.">
<rect x="0" y="0" width="400" height="310" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Weather picks the bed</text>
<rect x="16" y="62" width="180" height="100" rx="10" fill="#f6e3d8"/><text x="106" y="102" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hot sun</text><text x="106" y="132" font-size="14" fill="#23261f" text-anchor="middle">north slope, shade, timber</text><rect x="204" y="62" width="180" height="100" rx="10" fill="#eef2f6"/><text x="294" y="102" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cold, clear</text><text x="294" y="132" font-size="14" fill="#23261f" text-anchor="middle">south slope, sun, out of wind</text><rect x="16" y="174" width="180" height="100" rx="10" fill="#e3eed8"/><text x="106" y="214" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Windy</text><text x="106" y="244" font-size="14" fill="#23261f" text-anchor="middle">lee side, low draws</text><rect x="204" y="174" width="180" height="100" rx="10" fill="#ece8dc"/><text x="294" y="214" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Rain or snow</text><text x="294" y="244" font-size="14" fill="#23261f" text-anchor="middle">under thick conifers</text><text x="200" y="298" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Deer pick beds for comfort (75%)</text>
</svg>
