<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="The Big Dipper in the night sky. A dashed line runs from its two end stars, the pointers, up to Polaris, the North Star, about five times the gap between them. Polaris marks north.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#1f2a3a" stroke="none" stroke-width="2"/><text x="14" y="26" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="start" font-weight="bold">Find north by the stars</text><circle cx="60" cy="250" r="4.5" fill="#ffffff" stroke="none" stroke-width="2"/><circle cx="100" cy="240" r="4.5" fill="#ffffff" stroke="none" stroke-width="2"/><circle cx="135" cy="232" r="4.5" fill="#ffffff" stroke="none" stroke-width="2"/><circle cx="165" cy="222" r="4.5" fill="#ffffff" stroke="none" stroke-width="2"/><circle cx="170" cy="255" r="4.5" fill="#ffffff" stroke="none" stroke-width="2"/><circle cx="225" cy="262" r="4.5" fill="#ffffff" stroke="none" stroke-width="2"/><circle cx="230" cy="215" r="4.5" fill="#ffffff" stroke="none" stroke-width="2"/><path d="M60 250 L100 240 L135 232 L165 222 L230 215 L225 262 L170 255 Z" fill="none" stroke="#9aa5b1" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="230" y1="212" x2="252.9" y2="52.6" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><polygon points="254.0,45.0 246.4,55.0 258.4,56.7" fill="#e8590c"/><circle cx="255" cy="38" r="6" fill="#ffffff" stroke="none" stroke-width="2"/><text x="272" y="44" font-family="sans-serif" font-size="15" fill="#ffd8a8" text-anchor="start" font-weight="bold">Polaris: north</text><text x="240" y="245" font-family="sans-serif" font-size="13" fill="#ffd8a8" text-anchor="start">pointers</text><text x="20" y="265" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="start">Big Dipper: the two end stars point</text><text x="20" y="283" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="start">up to Polaris, about 5 times their gap.</text>
</svg>
