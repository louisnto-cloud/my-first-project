<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Three white tailed bucks drawn side by side. A yearling has a thin neck, a slim body and long looking legs. A 2 to 3 year old has a fuller chest and a swelling neck. A buck 4 years or older has a deep chest, a sagging belly, a thick neck and legs that look short. Caption: judge body first, antlers second, from the side. Labelled as a tip." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">Age a buck by body shape (Tip)</text><g><rect x="47" y="148" width="6" height="46" rx="3" fill="#8b5a2b"/><rect x="59" y="148" width="6" height="46" rx="3" fill="#8b5a2b"/><rect x="77" y="148" width="6" height="46" rx="3" fill="#8b5a2b"/><rect x="89" y="148" width="6" height="46" rx="3" fill="#8b5a2b"/><ellipse cx="70" cy="140" rx="34" ry="16" fill="#8b5a2b"/><path d="M52 134 L30 102 L42 96 L58 128 Z" fill="#8b5a2b"/><ellipse cx="26" cy="98" rx="11" ry="6" fill="#8b5a2b"/><path d="M32 92 c 0 -12 -6 -18 -16 -16 M28 86 l-1 -8 M22 80 l-2 -7" fill="none" stroke="#6b4f35" stroke-width="2.4" stroke-linecap="round"/><text x="70" y="210" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Yearling</text><text x="70" y="230" font-size="14" fill="#23261f" text-anchor="middle">thin neck,</text><text x="70" y="248" font-size="14" fill="#23261f" text-anchor="middle">long legs</text></g><g><rect x="171" y="148" width="6" height="42" rx="3" fill="#8b5a2b"/><rect x="183" y="148" width="6" height="42" rx="3" fill="#8b5a2b"/><rect x="213" y="148" width="6" height="42" rx="3" fill="#8b5a2b"/><rect x="225" y="148" width="6" height="42" rx="3" fill="#8b5a2b"/><ellipse cx="200" cy="136" rx="40" ry="20" fill="#8b5a2b"/><path d="M176 126 L154 94 L166 88 L188 120 Z" fill="#8b5a2b"/><ellipse cx="150" cy="90" rx="11" ry="6" fill="#8b5a2b"/><path d="M156 84 c 0 -12 -6 -18 -16 -16 M152 78 l-1 -8 M146 72 l-2 -7" fill="none" stroke="#6b4f35" stroke-width="2.4" stroke-linecap="round"/><text x="200" y="210" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">2 to 3 years</text><text x="200" y="230" font-size="14" fill="#23261f" text-anchor="middle">chest fills,</text><text x="200" y="248" font-size="14" fill="#23261f" text-anchor="middle">neck swells</text></g><g><rect x="297" y="148" width="6" height="36" rx="3" fill="#8b5a2b"/><rect x="309" y="148" width="6" height="36" rx="3" fill="#8b5a2b"/><rect x="347" y="148" width="6" height="36" rx="3" fill="#8b5a2b"/><rect x="359" y="148" width="6" height="36" rx="3" fill="#8b5a2b"/><ellipse cx="330" cy="132" rx="44" ry="24" fill="#8b5a2b"/><ellipse cx="334" cy="150" rx="30" ry="10" fill="#8b5a2b"/><path d="M302 118 L280 86 L292 80 L324 112 Z" fill="#8b5a2b"/><ellipse cx="276" cy="82" rx="11" ry="6" fill="#8b5a2b"/><path d="M282 76 c 0 -12 -6 -18 -16 -16 M278 70 l-1 -8 M272 64 l-2 -7" fill="none" stroke="#6b4f35" stroke-width="2.4" stroke-linecap="round"/><text x="330" y="210" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">4 years plus</text><text x="330" y="230" font-size="14" fill="#23261f" text-anchor="middle">deep belly, thick</text><text x="330" y="248" font-size="14" fill="#23261f" text-anchor="middle">neck, legs look short</text></g><text x="200" y="284" font-size="14" fill="#6b4f35" text-anchor="middle">Body first, antlers second. Judge from the side.</text>
</svg>
