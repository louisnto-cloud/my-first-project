<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Track stick step 3: swing the stick in a slow arc while looking near the band for the faint next track: a crushed leaf, a moved pebble, a bent grass blade.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3. Sweep the arc</text>
<rect x="0" y="100" width="400" height="140" rx="0" fill="#e9e2cf"/><g transform="translate(80 190) rotate(90) scale(0.8)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><g transform="translate(160 150) rotate(90) scale(0.8)" fill="#8b5a2b"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><path d="M250 190 A170 170 0 0 0 238 130" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="6 4"/><path d="M250 190 A170 170 0 0 1 238 250" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="6 4"/><line x1="80" y1="190" x2="250" y2="190" stroke="#6b4f35" stroke-width="6"/><text x="200" y="80" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Swing a slow arc, look at the band</text>
