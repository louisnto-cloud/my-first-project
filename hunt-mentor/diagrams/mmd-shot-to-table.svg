<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 305" font-family="sans-serif" role="img" aria-label="Eight steps from shot to table, left to right then down: 1 watch, listen and mark the spot. 2 wait 30 minutes for a lung hit. 3 track slowly. 4 notch the licence first. 5 gut or gutless, start cooling. 6 hang under 4 degrees C. 7 cut, wrap, freeze. 8 cook, do not overcook.">
<rect width="400" height="305" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Shot to table: the order</text><rect x="14" y="42" width="180" height="50" rx="10" fill="#e8590c"/><circle cx="36" cy="67" r="13" fill="#fffaf0"/><text x="36" y="72" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">1</text><text x="56" y="72" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">Watch, listen, mark</text><rect x="204" y="42" width="180" height="50" rx="10" fill="#e8590c"/><circle cx="226" cy="67" r="13" fill="#fffaf0"/><text x="226" y="72" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">2</text><text x="246" y="72" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">Wait 30 min</text><rect x="14" y="104" width="180" height="50" rx="10" fill="#8b5a2b"/><circle cx="36" cy="129" r="13" fill="#fffaf0"/><text x="36" y="134" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">3</text><text x="56" y="134" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">Track slowly</text><rect x="204" y="104" width="180" height="50" rx="10" fill="#2f3a2b"/><circle cx="226" cy="129" r="13" fill="#fffaf0"/><text x="226" y="134" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">4</text><text x="246" y="134" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">Notch licence first</text><rect x="14" y="166" width="180" height="50" rx="10" fill="#4a7fb0"/><circle cx="36" cy="191" r="13" fill="#fffaf0"/><text x="36" y="196" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">5</text><text x="56" y="196" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">Gut, start cooling</text><rect x="204" y="166" width="180" height="50" rx="10" fill="#4a7fb0"/><circle cx="226" cy="191" r="13" fill="#fffaf0"/><text x="226" y="196" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">6</text><text x="246" y="196" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">Hang under 4°C</text><rect x="14" y="228" width="180" height="50" rx="10" fill="#8a9a6b"/><circle cx="36" cy="253" r="13" fill="#fffaf0"/><text x="36" y="258" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">7</text><text x="56" y="258" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">Cut, wrap, freeze</text><rect x="204" y="228" width="180" height="50" rx="10" fill="#8a9a6b"/><circle cx="226" cy="253" r="13" fill="#fffaf0"/><text x="226" y="258" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">8</text><text x="246" y="258" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">Cook gently</text><text x="200" y="296" font-size="14" fill="#6b4f35" text-anchor="middle">Order left to right, then down</text>
</svg>
