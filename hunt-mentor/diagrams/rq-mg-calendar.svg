<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 502" font-family="sans-serif" role="img" aria-label="Month by month chart, October and November shaded. Mule deer: winter range January to March, up in April and May, high in summer, down in October and November. Interior elk: winter range January to April, up in May and June, high in summer, pushed down by autumn snow in October and November. Moose: valleys January to March, stay high longer, May to October, and drift down in November and December. Interior ducks move north March and April and south September to November until freeze up. Snow geese on the coast: Skagit in January and February, leave in April, on the Fraser delta from October. Dusky grouse: open breeding areas April to July, move uphill August to October, into conifers in November and December. General pattern from data/migration.json, 55 to 85 percent. Your hill varies.">
