<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 412" role="img" aria-label="Month by month chart. Mule deer: winter range January to March, up in April and May, high in summer, down in October and November. Interior elk: up in May and June, pushed down by autumn snow. Moose stay high longer and drift down in November and December. Interior ducks move north March and April and south September to November. Snow geese on the Fraser delta from October, shift to the Skagit late December, leave in April. Dusky grouse move uphill into conifers in fall.">
