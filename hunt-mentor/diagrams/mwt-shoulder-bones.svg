<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 302" font-family="sans-serif" role="img" aria-label="Side view of a white tailed deer facing left with the chest cut away. The shoulder blade runs from the withers down and forward to the shoulder joint, covering the front of the lungs. The upper leg bone runs from the shoulder joint back and down to the elbow. The lungs sit right behind the shoulder blade, with the heart low in the chest. An orange crosshair sits just behind the shoulder blade, on the lungs, one third up from the bottom of the chest: aim here, tight behind the shoulder, one third up.">
