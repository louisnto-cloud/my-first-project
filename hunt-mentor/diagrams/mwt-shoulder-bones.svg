<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Side view of a deer with the shoulder blade drawn over the front of the lungs and the upper leg bone running down to the elbow. An orange crosshair sits just behind the shoulder blade, on the lungs, one third up from the bottom of the chest." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<g opacity="0.9" transform="translate(14 14)"><rect x="118" y="190" width="14" height="62" rx="6" fill="#d9c7a7" stroke="#6b4f35" stroke-width="2"/><rect x="140" y="190" width="14" height="62" rx="6" fill="#d9c7a7" stroke="#6b4f35" stroke-width="2"/><rect x="300" y="190" width="14" height="62" rx="6" fill="#d9c7a7" stroke="#6b4f35" stroke-width="2"/><rect x="322" y="190" width="14" height="62" rx="6" fill="#d9c7a7" stroke="#6b4f35" stroke-width="2"/><ellipse cx="220" cy="150" rx="130" ry="58" fill="#e9dcc2" stroke="#6b4f35" stroke-width="3"/><path d="M120 112 L66 52 L88 40 L150 100 Z" fill="#e9dcc2" stroke="#6b4f35" stroke-width="3" stroke-linejoin="round"/><ellipse cx="56" cy="46" rx="28" ry="15" fill="#e9dcc2" stroke="#6b4f35" stroke-width="3"/><path d="M72 34 L84 14 L88 36 Z" fill="#e9dcc2" stroke="#6b4f35" stroke-width="2"/><circle cx="46" cy="42" r="3" fill="#23261f"/><path d="M346 128 C 362 132 366 150 360 166" fill="none" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/></g><g transform="translate(14 14)"><ellipse cx="140" cy="142" rx="34" ry="38" fill="#f2b48e" stroke="#e8590c" stroke-width="2"/><ellipse cx="136" cy="182" rx="14" ry="16" fill="#9b2c1c"/><path d="M150 96 L118 98 L104 160 L120 164 Z" fill="#f4efe4" stroke="#23261f" stroke-width="2.5" opacity=".9"/><path d="M112 162 L132 196" stroke="#f4efe4" stroke-width="9" stroke-linecap="round"/><path d="M112 162 L132 196" stroke="#23261f" stroke-width="1.5" fill="none"/><circle cx="152" cy="154" r="11" fill="none" stroke="#e8590c" stroke-width="3"/><line x1="141" y1="154" x2="163" y2="154" stroke="#e8590c" stroke-width="2"/><line x1="152" y1="143" x2="152" y2="165" stroke="#e8590c" stroke-width="2"/><text x="46" y="252" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Shoulder blade</text><line x1="80" y1="238" x2="108" y2="150" stroke="#23261f" stroke-width="2"/><text x="196" y="70" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Aim here: tight</text><text x="196" y="88" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">behind the shoulder</text><line x1="196" y1="92" x2="162" y2="146" stroke="#e8590c" stroke-width="2"/></g><text x="200" y="22" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">The shoulder blade guards the front</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Lungs sit right behind the shoulder blade.</text>
