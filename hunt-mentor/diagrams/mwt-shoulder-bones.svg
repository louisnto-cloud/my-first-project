<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 302" font-family="sans-serif" role="img" aria-label="Side view of a white tailed deer facing left with the shoulder blade drawn over the front of the lungs and the upper leg bone running from the shoulder joint down to the elbow. An orange crosshair sits just behind the shoulder blade, on the lungs, one third up from the bottom of the chest. Lungs sit right behind the shoulder blade.">
<rect width="400" height="302" fill="#fffaf0"/>
<text x="200" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The shoulder blade guards the front</text>
<g transform="translate(14 14)"><rect x="300" y="190" width="14" height="62" rx="6" fill="#d9c7a7" stroke="#6b4f35" stroke-width="2"/><rect x="322" y="190" width="14" height="62" rx="6" fill="#d9c7a7" stroke="#6b4f35" stroke-width="2"/><rect x="140" y="190" width="14" height="62" rx="6" fill="#d9c7a7" stroke="#6b4f35" stroke-width="2"/><ellipse cx="220" cy="150" rx="130" ry="58" fill="#e9dcc2" stroke="#6b4f35" stroke-width="3"/><rect x="118" y="190" width="14" height="62" rx="6" fill="#d9c7a7" stroke="#6b4f35" stroke-width="2"/><path d="M120 112 L66 52 L88 40 L150 100 Z" fill="#e9dcc2" stroke="#6b4f35" stroke-width="3" stroke-linejoin="round"/><ellipse cx="56" cy="46" rx="28" ry="15" fill="#e9dcc2" stroke="#6b4f35" stroke-width="3"/><path d="M72 34 L84 14 L88 36 Z" fill="#e9dcc2" stroke="#6b4f35" stroke-width="2"/><circle cx="46" cy="42" r="3" fill="#23261f"/><path d="M346 128 C 362 132 366 150 360 166" fill="none" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/><ellipse cx="172" cy="150" rx="40" ry="42" fill="#f2b48e" stroke="#e8590c" stroke-width="1.5"/><ellipse cx="150" cy="186" rx="11" ry="12" fill="#9b2c1c"/><path d="M146 107 L182 99 L132 158 L118 154z" fill="#f4ecd8" stroke="#6b4f35" stroke-width="2.4" stroke-linejoin="round"/><path d="M165 103 L125 156" stroke="#c9b79c" stroke-width="2.2"/><path d="M122 158 L142 196" stroke="#6b4f35" stroke-width="12" stroke-linecap="round"/><path d="M122 158 L142 196" stroke="#f4ecd8" stroke-width="7.5" stroke-linecap="round"/><circle cx="124" cy="160" r="6" fill="#f4ecd8" stroke="#6b4f35" stroke-width="2"/><path d="M142 196 L136 248" stroke="#c9b79c" stroke-width="5" stroke-linecap="round"/></g>
<circle cx="180" cy="180" r="12" fill="none" stroke="#e8590c" stroke-width="3"/><path d="M163 180 H197 M180 163 V197" stroke="#e8590c" stroke-width="2.4"/>
<line x1="189" y1="171" x2="290" y2="85" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="189" cy="171" r="2.6" fill="#2f3a2b"/><rect x="188.3" y="40.0" width="203.7" height="45.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="290.144" y="59" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">Aim here: tight behind</text>
<text x="290.144" y="77" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">the shoulder, one third up</text>
<line x1="166" y1="132" x2="86.521" y2="152" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="166" cy="132" r="2.6" fill="#2f3a2b"/><rect x="8.0" y="134.0" width="78.5" height="45.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="47.2605" y="153" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Shoulder</text>
<text x="47.2605" y="171" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">blade</text>
<line x1="148" y1="192" x2="84.274" y2="220" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="148" cy="192" r="2.6" fill="#2f3a2b"/><rect x="8.0" y="200.0" width="76.3" height="45.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="46.137" y="219" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Upper</text>
<text x="46.137" y="237" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">leg bone</text>
<text x="200" y="292" font-size="15" fill="#6b4f35" text-anchor="middle">Lungs sit right behind the shoulder blade.</text>
