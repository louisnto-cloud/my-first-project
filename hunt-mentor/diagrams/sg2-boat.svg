<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two hunters in a small boat, seen from above, sitting back to back: the bow hunter faces forward, the stern hunter faces back. Shoot sitting, only inside your own arc. Unload before anyone moves. Motor running: every gun unloaded.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">In a boat: back to back</text>
<g transform="translate(-80 0)">
<path d="M200 50 C260 90 262 230 240 262 L160 262 C138 230 140 90 200 50 Z" fill="#6b5a45" opacity="0.55" stroke="#1F3D2B" stroke-width="2"/>
<path d="M200 120 L138.7 68.6 A80 80 0 0 1 261.3 68.6 Z" fill="#1F3D2B" opacity="0.3"/>
<path d="M200 210 L261.3 261.4 A80 80 0 0 1 138.7 261.4 Z" fill="#4a7fb0" opacity="0.3"/>
<ellipse cx="200" cy="124" rx="13" ry="9" fill="#1F3D2B"/><circle cx="200" cy="120" r="7" fill="#FF6A13"/><line x1="200" y1="120" x2="200.0" y2="86.0" stroke="#3b4045" stroke-width="4" stroke-linecap="round"/>
<ellipse cx="200" cy="214" rx="13" ry="9" fill="#1F3D2B"/><circle cx="200" cy="210" r="7" fill="#FF6A13"/><line x1="200" y1="210" x2="200.0" y2="244.0" stroke="#3b4045" stroke-width="4" stroke-linecap="round"/>
</g>
<rect x="221.1" y="53.0" width="157.7" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="300.0" y="70.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">bow faces forward</text>
<rect x="229.7" y="253.0" width="140.5" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="300.0" y="270.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">stern faces back</text>
<circle cx="212" cy="124" r="11" fill="#1F3D2B"/><text x="212" y="129.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="229.0" y="129.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Sit to shoot</text>
<circle cx="212" cy="158" r="11" fill="#1F3D2B"/><text x="212" y="163.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="229.0" y="163.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">One moves at a time</text>
<circle cx="212" cy="192" r="11" fill="#FF6A13"/><text x="212" y="197.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="229.0" y="197.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Motor on: unloaded</text>
</svg>
