<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 4: measure the straddle, the width of the whole trail from outside edge to outside edge, at right angles to the line of travel. Wide straddles mean heavy bodies or a slow walk.">
