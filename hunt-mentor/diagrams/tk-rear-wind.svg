<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 374" font-family="sans-serif" role="img" aria-label="Windage on the Arctic is at the rear drum, seen from behind. To move the drum right: 1 loosen the windage screw on the right side; 2 snug the screw on the left side to take up the slack, without overtightening. Move the rear sight the way you want the shots to go. One click is about 7 millimetres at 100 metres.">
<rect x="0" y="0" width="400" height="374" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Left and right: the rear screws</text><rect x="129.6" y="175.2" width="140.8" height="28.8" fill="#8F9A8C" stroke="#1F3D2B" stroke-width="1.4"/><circle cx="142.4" cy="189.6" r="5.760000000000001" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.2"/><circle cx="171.2" cy="189.6" r="5.760000000000001" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.2"/><circle cx="228.8" cy="189.6" r="5.760000000000001" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.2"/><circle cx="257.6" cy="189.6" r="5.760000000000001" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.2"/><rect x="143.6" y="98.4" width="140.8" height="76.80000000000001" rx="9.600000000000001" fill="#C9D0C6" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="214" cy="136.8" r="14.4" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><circle cx="214" cy="136.8" r="6.4" fill="#EEF1EA" stroke="#1F3D2B" stroke-width="1"/><rect x="110.39999999999999" y="136.8" width="19.200000000000003" height="22.400000000000002" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.2"/><rect x="270.4" y="136.8" width="19.200000000000003" height="22.400000000000002" fill="#FF6A13" stroke="#1F3D2B" stroke-width="1.2"/><line x1="150" y1="90" x2="242.8" y2="90.0" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><path d="M250 90 L241.9 93.9 L241.9 86.1z" fill="#FF6A13"/><line x1="330" y1="74" x2="300" y2="148" stroke="#FF6A13" stroke-width="1.6"/><circle cx="300" cy="148" r="2.6" fill="#FF6A13"/><circle cx="330" cy="74" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="330" y="79" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><line x1="70" y1="74" x2="100" y2="148" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="100" cy="148" r="2.6" fill="#1F3D2B"/><circle cx="70" cy="74" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="70" y="79" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><rect x="12" y="214" width="376" height="54" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="24" y="236" font-size="14" fill="#17201A" text-anchor="start">Want shots to go right? Move the</text><text x="24" y="256" font-size="14" fill="#17201A" text-anchor="start">drum right: loosen right, snug left.</text><circle cx="24" cy="289" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="294" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="40" y="294" font-size="14" fill="#17201A" text-anchor="start">Loosen the screw on that side</text><circle cx="24" cy="311" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="316" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="40" y="316" font-size="14" fill="#17201A" text-anchor="start">Snug the other side. Do not overtighten</text><rect x="12" y="330" width="376" height="32" rx="6" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="200" y="351" font-size="15" fill="#1F3D2B" text-anchor="middle" font-weight="bold">1 click = about 7 mm at 100 m</text>
</svg>
