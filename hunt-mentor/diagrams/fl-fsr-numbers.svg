<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 236" role="img" aria-label="Numbers to save: 911 does not work everywhere in BC. Wildfire reporting 1 800 663 5555 or star 5555 on a cell. RAPP, Report All Poachers and Polluters, 1 877 952 7277.">
