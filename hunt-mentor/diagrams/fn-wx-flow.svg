<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A sky check. Halo, lowering grey cloud and falling pressure: rain or snow likely in about a day, plan B. Puffy clouds growing tall by noon: showers or thunder, get off ridges. Thunder heard: go to the truck and wait 30 minutes after the last thunder. Clear high pressure: cold frosty dawn, great glassing.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="30" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Sky check: go, watch or get off</text><rect x="20" y="48" width="360" height="34" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="200.0" y="70" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="middle">Halo, lowering grey, pressure falling?</text><text x="30" y="98" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">Rain or snow likely in about a day (70%). Plan B.</text><rect x="20" y="112" width="360" height="34" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="200.0" y="134" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="middle">Puffy clouds growing tall by noon?</text><text x="30" y="162" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">Showers or thunder. Off ridges early.</text><rect x="20" y="176" width="360" height="34" rx="8" fill="#ffffff" stroke="#c92a2a" stroke-width="2"/><text x="200.0" y="198" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="middle">Thunder heard?</text><text x="30" y="226" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">Truck, wait 30 min after last thunder.</text><rect x="20" y="240" width="360" height="34" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="200.0" y="262" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="middle">High pressure, clear, light wind</text><text x="30" y="290" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">Cold dawn, frost, great glassing (Tip).</text>
</svg>
