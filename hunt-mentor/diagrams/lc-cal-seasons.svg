<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 456" font-family="sans-serif" role="img" aria-label="Bar chart of the Region 3 year, January to December, from synopsis page 34. Mule deer: youth and bow bucks from 1 September, 4 point bucks 10 to 30 September, any buck 1 to 31 October, 4 point bucks 1 November to 10 December. White tailed deer bucks 10 September to 10 December, antlerless 10 to 31 October. Moose spike fork bulls from 20 September to 15 November in some MUs. Black bear 1 April to 30 June and 1 September to 30 November. Grouse 10 September to 30 November, youth from 1 September. Ducks 8 September to 23 December. Geese 1 to 10 March, 8 to 20 September and 1 October to 23 December. Cougar to 31 March and from 15 November in some MUs. Snowshoe hare 1 August to 30 April.">
