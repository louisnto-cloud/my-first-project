<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Lost scenario drill step 4: signal with three whistle blasts, put orange gear in the open and start a shelter. Pass when it is all done within 30 minutes. Pass mark is a Tip.">
<rect width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c"/><text x="26" y="31" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">4</text><text x="52" y="32" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Signal and set up camp</text><rect x="20" y="56" width="360" height="200" rx="8" fill="#dfe6d3"/><g transform="translate(90 160) scale(2.2) translate(-90 -160)"><rect x="72" y="152" width="30" height="16" rx="6" fill="#e8590c"/><circle cx="102" cy="160" r="9" fill="#e8590c"/><circle cx="102" cy="160" r="3" fill="#fffaf0"/></g><text x="170" y="100" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">3 whistle blasts</text><text x="170" y="130" font-size="15" fill="#23261f" text-anchor="start">Orange in the open</text><text x="170" y="160" font-size="15" fill="#23261f" text-anchor="start">Pass: all in 30 min</text>
</svg>
