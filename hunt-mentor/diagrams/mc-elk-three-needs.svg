<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="An edge scene. Dark timber on the left is cover that hides an elk. An open meadow of grass, sedge and forbs is food. A pond with a mud wallow is water. A bull elk stands where the timber meets the meadow: the edge, where elk live with food, cover and water close together. A BC habitat model defines security cover as vegetation that hides 90 percent of a standing elk at 61 m, 80 percent.">
