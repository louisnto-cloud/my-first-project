<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three overlapping circles: food (grass, sedges, forbs), cover (timber that hides an elk) and water with wallows. Elk live where they overlap, at the edge. A BC habitat model defines security cover as vegetation that hides 90 percent of a standing elk at 61 m.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Food, cover, water: the edge</text><circle cx="130" cy="130" r="70" fill="#9bb07a" opacity="0.7"/><circle cx="270" cy="130" r="70" fill="#2f3a2b" opacity="0.55"/><circle cx="200" cy="210" r="70" fill="#4a7fb0" opacity="0.5"/><text x="110" y="110" font-size="16" fill="#23261f" text-anchor="middle" font-weight="bold">Food</text><text x="110" y="130" font-size="14" fill="#23261f" text-anchor="middle">grass, sedge,</text><text x="110" y="148" font-size="14" fill="#23261f" text-anchor="middle">forbs</text><text x="290" y="110" font-size="16" fill="#fffaf0" text-anchor="middle" font-weight="bold">Cover</text><text x="290" y="130" font-size="14" fill="#fffaf0" text-anchor="middle">timber that</text><text x="290" y="148" font-size="14" fill="#fffaf0" text-anchor="middle">hides you</text><text x="200" y="238" font-size="16" fill="#23261f" text-anchor="middle" font-weight="bold">Water</text><text x="200" y="256" font-size="14" fill="#23261f" text-anchor="middle">and wallows</text><text x="200" y="160" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">Edge</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Cover hides 90% of an elk at 61 m (80%)</text>
</svg>
