<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="What changes for elk in October. Late rut: cows not bred in September come into heat again, so some bugling returns. Bulls are spent after eating little in the rut. Autumn snow pushes herds down toward winter range. Hunted elk move to timber and feed at night. The Region 8 rifle season for 6 point bulls closes 20 October.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">October: what changes</text><rect x="12" y="44" width="108" height="36" rx="8" fill="#2f3a2b"/><text x="66" y="67" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Late rut</text><text x="132" y="67" font-size="14" fill="#23261f" text-anchor="start">Second heat: some bugling again</text><rect x="12" y="90" width="108" height="36" rx="8" fill="#2f3a2b"/><text x="66" y="113" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Bulls spent</text><text x="132" y="113" font-size="14" fill="#23261f" text-anchor="start">Bulls ate little in the rut</text><rect x="12" y="136" width="108" height="36" rx="8" fill="#2f3a2b"/><text x="66" y="159" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Snow comes</text><text x="132" y="159" font-size="14" fill="#23261f" text-anchor="start">Autumn snow pushes herds down</text><rect x="12" y="182" width="108" height="36" rx="8" fill="#2f3a2b"/><text x="66" y="205" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Pressure</text><text x="132" y="205" font-size="14" fill="#23261f" text-anchor="start">Hunted elk: timber and night</text><rect x="12" y="228" width="108" height="36" rx="8" fill="#e8590c"/><text x="66" y="251" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">20 October</text><text x="132" y="251" font-size="14" fill="#23261f" text-anchor="start">Region 8 rifle season closes</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">BC elk account (90%); season page 68 (99%)</text>
</svg>
