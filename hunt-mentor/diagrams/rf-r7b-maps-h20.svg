<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 554" role="img" aria-label="Cards for Maps H20 to H32. H20 and H21: northern and southern parts of 7-42 for elk. H22 and H23: western and eastern parts of 7-43 for elk and mule deer. H24 Fontas: No Hunting Area. H25: bison draw only and general open season parts. H26: Muskwa Kechika Access Management Area and Klingzut Mountain Motor Vehicle Closed Area. H27 Terminus and H28 Hoole Creek: mountain goat closed. H29 Toad River: goat draw only and closed areas. H30 Deeh Ridge: mountain goat closed. H31 Muncho Lake Park: mountain sheep and goat closed. H32 Moose Lake: moose closed." font-family="sans-serif">
<rect x="0" y="0" width="400" height="554" fill="#fffaf0"/>
