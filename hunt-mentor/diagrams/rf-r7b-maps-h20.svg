<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 670" font-family="sans-serif" role="img" aria-label="List of Region 7B Maps H20 to H32. H20 and H21: northern and southern parts of MU 7-42 for elk. H22 and H23: western and eastern parts of MU 7-43 for elk and mule deer. H24 Fontas, MUs 7-47, 7-48 and 7-56: No Hunting Area. H25: bison Limited Entry Hunting (draw) only and general open season parts. H26: Muskwa Kechika Access Management Area and Klingzut Mountain Motor Vehicle Closed Area. H27 Terminus and H28 Hoole Creek, MU 7-51: mountain goat closed. H29 Toad River, MUs 7-51 and 7-54: goat draw only and closed areas. H30 Deeh Ridge, MU 7-52: mountain goat closed. H31 Muncho Lake Park, MUs 7-51 and 7-54: mountain sheep and goat closed. H32 Moose Lake, MU 7-51: moose closed.">
