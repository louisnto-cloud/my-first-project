<circle cx="349.3333333333333" cy="107.0" r="12" fill="#e8590c"/><path d="M344.5333333333333 102.2 L354.1333333333333 111.8 M354.1333333333333 102.2 L344.5333333333333 111.8" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
