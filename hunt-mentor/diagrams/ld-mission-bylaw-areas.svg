<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 387" font-family="sans-serif" role="img" aria-label="Grid of the Mission discharge bylaw areas, while hunting in an open season with a valid licence. Area A, most of the city including the town and the Hatzic side: no rifle, no slug, no shot. Area B, the Fraser west of Nelson Street and Matsqui Island: shotgun with shot only. Area C around Hoover Lake: shotgun with shot or slug, no rifle. Area D, west of Stave Lake between Kearsley and Rockwell roads, and east of Stave Lake north of Cannell Lake: rifle or shotgun.">
<rect x="0" y="0" width="400" height="387" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Mission bylaw: what each area allows</text>
<text x="200" y="46" font-size="14" fill="#6b4f35" text-anchor="middle">Bylaw 5433-2014, while hunting in season (99%)</text>
<text x="210.667" y="74" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Rifle</text>
<text x="280" y="74" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Slug</text>
<text x="349.333" y="74" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Shot</text>
<rect x="8" y="83" width="384" height="48" fill="#dfe6d3" rx="4"/>
