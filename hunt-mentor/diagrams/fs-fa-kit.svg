<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Trauma kit carried on your body, always in the same pocket: tourniquet, pressure bandage, gloves, packing gauze, marker and tape, and trauma shears. Carry it, know it, practise it.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Trauma kit: on your body, same pocket</text><rect x="30" y="50" width="340" height="190" rx="12" fill="#f3efe2" stroke="#2f3a2b" stroke-width="2"/><rect x="50" y="74" width="80" height="40" rx="6" fill="#e8590c" stroke="#2f3a2b" stroke-width="1"/><text x="90" y="134" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Tourniquet</text><rect x="170" y="74" width="80" height="40" rx="6" fill="#4a7fb0" stroke="#2f3a2b" stroke-width="1"/><text x="210" y="134" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pressure bandage</text><rect x="280" y="74" width="80" height="40" rx="6" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="1"/><text x="320" y="134" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Gloves</text><rect x="50" y="149" width="80" height="40" rx="6" fill="#ffffff" stroke="#2f3a2b" stroke-width="1"/><text x="90" y="209" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Packing gauze</text><rect x="170" y="149" width="80" height="40" rx="6" fill="#f6c344" stroke="#2f3a2b" stroke-width="1"/><text x="210" y="209" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Marker, tape</text><rect x="280" y="149" width="80" height="40" rx="6" fill="#9a9a8f" stroke="#2f3a2b" stroke-width="1"/><text x="320" y="209" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Shears</text><rect x="54" y="252" width="291" height="30" rx="6" fill="#2f3a2b"/><text x="200" y="273" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Carry it. Know it. Practise it</text>
</svg>
