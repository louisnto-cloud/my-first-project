<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 410" font-family="sans-serif" role="img" aria-label="Four enemies of meat: heat (cool it below 4 degrees Celsius fast), moisture (keep it dry, no washing), dirt and hair (use the hide or a tarp as a mat), and gut contents (do not cut the paunch). Clean, cool, dry. Every time.">
<rect width="400" height="410" fill="#fffaf0"/>
<text x="200" y="27" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Four enemies of meat</text>
<rect x="8" y="40" width="188" height="150" rx="10" fill="#f4eedf" stroke="#e8590c" stroke-width="2"/>
<g transform="translate(102.0 82)"><circle r="15" fill="#f2a516"/><line x1="20.0" y1="0.0" x2="27.0" y2="0.0" stroke="#f2a516" stroke-width="3" stroke-linecap="round"/><line x1="14.1" y1="14.1" x2="19.1" y2="19.1" stroke="#f2a516" stroke-width="3" stroke-linecap="round"/><line x1="0.0" y1="20.0" x2="0.0" y2="27.0" stroke="#f2a516" stroke-width="3" stroke-linecap="round"/><line x1="-14.1" y1="14.1" x2="-19.1" y2="19.1" stroke="#f2a516" stroke-width="3" stroke-linecap="round"/><line x1="-20.0" y1="0.0" x2="-27.0" y2="0.0" stroke="#f2a516" stroke-width="3" stroke-linecap="round"/><line x1="-14.1" y1="-14.1" x2="-19.1" y2="-19.1" stroke="#f2a516" stroke-width="3" stroke-linecap="round"/><line x1="-0.0" y1="-20.0" x2="-0.0" y2="-27.0" stroke="#f2a516" stroke-width="3" stroke-linecap="round"/><line x1="14.1" y1="-14.1" x2="19.1" y2="-19.1" stroke="#f2a516" stroke-width="3" stroke-linecap="round"/></g>
<text x="102" y="134" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Heat</text>
<text x="102" y="156" font-size="15" fill="#2f3a2b" text-anchor="middle">Cool below 4°C</text>
<text x="102" y="176" font-size="15" fill="#2f3a2b" text-anchor="middle">fast</text>
<rect x="204" y="40" width="188" height="150" rx="10" fill="#f4eedf" stroke="#4a7fb0" stroke-width="2"/>
<g transform="translate(298.0 82)" fill="#4a7fb0"><path d="M0 -24 Q14 -4 14 6 A14 14 0 0 1 -14 6 Q-14 -4 0 -24z"/><path d="M20 -10 Q27 0 27 5 A7 7 0 0 1 13 5 Q13 0 20 -10z" opacity=".7"/><path d="M-5 4 q1 7 8 8" stroke="#fff" stroke-width="2.4" fill="none"/></g>
<text x="298" y="134" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Moisture</text>
<text x="298" y="156" font-size="15" fill="#2f3a2b" text-anchor="middle">Keep it dry</text>
<text x="298" y="176" font-size="15" fill="#2f3a2b" text-anchor="middle">no washing</text>
<rect x="8" y="198" width="188" height="150" rx="10" fill="#f4eedf" stroke="#8b5a2b" stroke-width="2"/>
<g transform="translate(102.0 240)"><circle cx="-16" cy="8" r="3.5" fill="#6b4f35"/><circle cx="-4" cy="14" r="3" fill="#6b4f35"/><circle cx="10" cy="6" r="4" fill="#6b4f35"/><circle cx="18" cy="16" r="2.8" fill="#6b4f35"/><circle cx="-12" cy="-6" r="2.6" fill="#6b4f35"/><circle cx="4" cy="-2" r="3.2" fill="#6b4f35"/><path d="M-20 -14 q8 -6 16 -2" stroke="#3a2e22" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M2 -18 q8 4 14 -2" stroke="#3a2e22" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M12 -6 q6 -6 12 0" stroke="#3a2e22" stroke-width="2" fill="none" stroke-linecap="round"/></g>
<text x="102" y="292" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Dirt and hair</text>
<text x="102" y="314" font-size="15" fill="#2f3a2b" text-anchor="middle">Hide or tarp</text>
<text x="102" y="334" font-size="15" fill="#2f3a2b" text-anchor="middle">as a mat</text>
<rect x="204" y="198" width="188" height="150" rx="10" fill="#f4eedf" stroke="#6b7d3e" stroke-width="2"/>
<g transform="translate(298.0 240)"><ellipse rx="26" ry="16" fill="#8a7a3a"/><ellipse cx="-6" cy="-5" rx="10" ry="5" fill="#a39550"/><path d="M-14 4 q6 4 12 0 q6 -4 12 0" stroke="#6b5f2a" stroke-width="2" fill="none"/></g>
<text x="298" y="292" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Gut contents</text>
<text x="298" y="314" font-size="15" fill="#2f3a2b" text-anchor="middle">Do not cut</text>
<text x="298" y="334" font-size="15" fill="#2f3a2b" text-anchor="middle">the paunch</text>
<rect x="8" y="360" width="384" height="42" rx="10" fill="#2f3a2b"/>
<text x="200" y="387" font-size="18" font-weight="bold" fill="#fffaf0" text-anchor="middle">Clean, cool, dry. Every time.</text>
</svg>
