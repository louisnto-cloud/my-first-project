<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four enemies of meat: heat (cool it below 4 degrees fast), moisture (keep it dry, no washing), dirt and hair (use the hide or a tarp as a mat), and gut contents (do not cut the paunch).">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">Four enemies of meat</text><rect x="8" y="38" width="188" height="108" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><g transform="translate(48 94)"><circle cx="0" cy="-4" r="14" fill="#f5c542"/><line x1="18.0" y1="-4.0" x2="25.0" y2="-4.0" stroke="#f5c542" stroke-width="3" stroke-linecap="round"/><line x1="12.7" y1="8.7" x2="17.7" y2="13.7" stroke="#f5c542" stroke-width="3" stroke-linecap="round"/><line x1="0.0" y1="14.0" x2="0.0" y2="21.0" stroke="#f5c542" stroke-width="3" stroke-linecap="round"/><line x1="-12.7" y1="8.7" x2="-17.7" y2="13.7" stroke="#f5c542" stroke-width="3" stroke-linecap="round"/><line x1="-18.0" y1="-4.0" x2="-25.0" y2="-4.0" stroke="#f5c542" stroke-width="3" stroke-linecap="round"/><line x1="-12.7" y1="-16.7" x2="-17.7" y2="-21.7" stroke="#f5c542" stroke-width="3" stroke-linecap="round"/><line x1="-0.0" y1="-22.0" x2="-0.0" y2="-29.0" stroke="#f5c542" stroke-width="3" stroke-linecap="round"/><line x1="12.7" y1="-16.7" x2="17.7" y2="-21.7" stroke="#f5c542" stroke-width="3" stroke-linecap="round"/></g><text x="84" y="84" font-size="15" font-weight="bold" fill="#23261f">Heat</text><text x="84" y="106" font-size="13" fill="#2f3a2b">Cool below 4°C</text><text x="84" y="124" font-size="13" fill="#2f3a2b">fast</text><rect x="204" y="38" width="188" height="108" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><g transform="translate(244 94)"><path d="M0 -26 C 14 -6, 18 4, 0 18 C -18 4, -14 -6, 0 -26 Z" fill="#4a7fb0"/></g><text x="280" y="84" font-size="15" font-weight="bold" fill="#23261f">Moisture</text><text x="280" y="106" font-size="13" fill="#2f3a2b">Keep it dry</text><text x="280" y="124" font-size="13" fill="#2f3a2b">no washing</text><rect x="8" y="154" width="188" height="108" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><g transform="translate(48 210)"><circle cx="-14" cy="-10" r="3" fill="#6b4f35"/><circle cx="6" cy="-16" r="3" fill="#6b4f35"/><circle cx="14" cy="4" r="3" fill="#6b4f35"/><circle cx="-6" cy="8" r="3" fill="#6b4f35"/><circle cx="0" cy="-2" r="3" fill="#6b4f35"/><circle cx="-18" cy="12" r="3" fill="#6b4f35"/><path d="M-20 -20 q 10 6 20 -2 M4 14 q 8 -6 18 0" stroke="#23261f" stroke-width="2" fill="none"/></g><text x="84" y="200" font-size="15" font-weight="bold" fill="#23261f">Dirt and hair</text><text x="84" y="222" font-size="13" fill="#2f3a2b">Hide or tarp</text><text x="84" y="240" font-size="13" fill="#2f3a2b">as a mat</text><rect x="204" y="154" width="188" height="108" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><g transform="translate(244 210)"><ellipse cx="0" cy="0" rx="26" ry="16" fill="#7a6a2a"/></g><text x="280" y="200" font-size="15" font-weight="bold" fill="#23261f">Gut contents</text><text x="280" y="222" font-size="13" fill="#2f3a2b">Do not cut</text><text x="280" y="240" font-size="13" fill="#2f3a2b">the paunch</text><text x="200" y="292" font-size="14" text-anchor="middle" fill="#2f3a2b">Clean, cool, dry. Every time.</text>
</svg>
