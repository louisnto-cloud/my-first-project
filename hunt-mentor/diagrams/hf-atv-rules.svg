<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 306" font-family="sans-serif" role="img" aria-label="ATV rules. Left: on the ATV the rifle on the rack has an empty chamber and the magazine off or empty. Loaded means a round in the chamber or in an attached magazine. Never shoot from the machine. Right: a 2 lane public road drawn to scale from above: no hunting or shooting within 15 metres each side of the centre, and never across the road. Whether Forest Service Roads count: VERIFY.">
<rect width="400" height="306" fill="#fffaf0"/>
<rect x="8" y="8" width="186" height="290" rx="10" fill="#e3eedc"/><rect x="202" y="8" width="190" height="290" rx="10" fill="#f3e6d6"/>
<text x="101" y="34" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">On the ATV</text><text x="297" y="34" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Public road</text>
<g transform="translate(101 138)"><path d="M-62 -26 H58" stroke="#5a3a22" stroke-width="4" stroke-linecap="round"/><path d="M-50 -26 V-18 M46 -26 V-18" stroke="#5a3a22" stroke-width="3"/><path d="M-60 -6 L-50 -18 H-16 L-8 -28 H12 L20 -18 H52 L60 -6 L56 2 H-58z" fill="#2f6e3b" stroke="#1f4a28" stroke-width="1.4"/><path d="M-14 -28 L-10 -34 H8 L12 -28z" fill="#2b2b2b"/><path d="M16 -28 L24 -42 M18 -42 H32" stroke="#2b2b2b" stroke-width="3.4" stroke-linecap="round"/><circle cx="-40" cy="6" r="17" fill="#2b2b2b"/><circle cx="-40" cy="6" r="7" fill="#9a9a9a"/><circle cx="40" cy="6" r="17" fill="#2b2b2b"/><circle cx="40" cy="6" r="7" fill="#9a9a9a"/><g transform="translate(-6 -34)"><g transform="translate(0 0) rotate(0) scale(1.9)"><path d="M-26 -1 L-8 -3 L-6 -1 L26 -1 V1.5 L-4 1.5 L-10 6 L-24 6 L-26 3z" fill="#3b2a1a"/><rect x="-2" y="-5" width="12" height="3" rx="1" fill="#2b2b2b"/></g></g></g>
<text x="18" y="180" font-size="16" font-weight="bold" fill="#2f3a2b">Chamber:</text><text x="98.3008" y="180" font-size="16" font-weight="bold" fill="#2f6e3b">empty</text>
<text x="18" y="202" font-size="16" font-weight="bold" fill="#2f3a2b">Magazine:</text><text x="103.779" y="202" font-size="16" font-weight="bold" fill="#2f6e3b">off</text>
<text x="18" y="224" font-size="16" font-weight="bold" fill="#2f6e3b">or empty</text>
<rect x="16" y="238" width="170" height="34" rx="6" fill="#c92a2a"/><text x="101" y="261" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Never shoot from it</text>
<rect x="237.0" y="48" width="120.0" height="168" fill="#c92a2a" opacity=".16"/>
<path d="M237.0 48 V216 M357.0 48 V216" stroke="#c92a2a" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="282.6" y="48" width="28.8" height="168" fill="#8f8d86"/><path d="M297 50 V216" stroke="#f2c94c" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M282.6 48 V216 M311.4 48 V216" stroke="#f4f1e6" stroke-width="1.4"/>
