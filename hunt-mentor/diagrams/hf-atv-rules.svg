<line x1="297.0" y1="196.0" x2="350.6" y2="196.0" stroke="#c92a2a" stroke-width="2"/><path d="M357.0 196.0 L349.0 191.6 L349.0 200.4z" fill="#c92a2a"/>
<text x="267" y="190" font-size="15" font-weight="bold" fill="#c92a2a" text-anchor="middle" stroke="#f3e6d6" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">15 m</text><text x="327" y="190" font-size="15" font-weight="bold" fill="#c92a2a" text-anchor="middle" stroke="#f3e6d6" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">15 m</text>
<text x="297" y="240" font-size="16" font-weight="bold" fill="#c92a2a" text-anchor="middle">No shots in or across</text>
<text x="297" y="262" font-size="14" fill="#6b5b4b" text-anchor="middle">2 lane road, from the centre</text>
<text x="297" y="284" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">FSRs: VERIFY</text>
