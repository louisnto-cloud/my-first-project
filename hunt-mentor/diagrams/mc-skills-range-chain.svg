<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A chain of six links: range, hold, rest, breath, press, follow through. One weak link loses the animal. The fundamentals come from hunter education.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">The clean kill chain</text><ellipse cx="44" cy="130" rx="32" ry="22" fill="none" stroke="#2f3a2b" stroke-width="7"/><text x="44" y="180" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Range</text><ellipse cx="107" cy="130" rx="32" ry="22" fill="none" stroke="#2f3a2b" stroke-width="7"/><text x="107" y="180" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Hold</text><ellipse cx="170" cy="130" rx="32" ry="22" fill="none" stroke="#e8590c" stroke-width="7"/><text x="170" y="180" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Rest</text><ellipse cx="233" cy="130" rx="32" ry="22" fill="none" stroke="#2f3a2b" stroke-width="7"/><text x="233" y="180" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Breath</text><ellipse cx="296" cy="130" rx="32" ry="22" fill="none" stroke="#2f3a2b" stroke-width="7"/><text x="296" y="180" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Press</text><ellipse cx="359" cy="130" rx="32" ry="22" fill="none" stroke="#2f3a2b" stroke-width="7"/><text x="359" y="180" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Follow</text><text x="200" y="220" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">One weak link loses the animal</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Fundamentals: hunter education (85%)</text>
</svg>
