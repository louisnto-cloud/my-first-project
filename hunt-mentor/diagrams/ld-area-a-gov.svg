<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 628" font-family="sans-serif" role="img" aria-label="Cards for Area A, Kamloops and North Thompson, places named by government. Lac du Bois Grasslands Protected Area: park, bighorn, mule and white tailed deer, moose, waterfowl, sharp tailed grouse, no shooting inside Kamloops city limits, ATVs closed for hunting 1 September to 10 December. Dewdrop Rosseau Creek Wildlife Management Area, MU 3-29: mule deer and bighorn winter range, motor vehicle closed. Tranquille Wildlife Management Area: geese and swans, closed, No Shooting. Bonaparte Park: moose, mule deer, black bear, waterfowl, grouse, by logging roads up Jamieson Creek or float plane. Tunkwa Park, MU 3-18: moose, deer, Canada goose, mallard, snipe, vehicles on designated trails only. Dunn Peak Park: mule deer, mountain goat, black bear. Wells Gray Park, MU 3-45: closed, no hunting and no firearms.">
