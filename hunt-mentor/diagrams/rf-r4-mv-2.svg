<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 506" font-family="sans-serif" role="img" aria-label="Cards of vehicle closures in Management Units 4-9 to 4-21, page 38. A star means closed to all motor vehicles; the other symbols close vehicles for hunting use. 4-9: Malde, Goodeve, Morris and Shepard creeks and Cambridge Creek above 750 metres closed for hunting use in spring and fall; Tiger Creek spring and 1 September to 28 February. 4-14: Peter and Faith creeks 1 September to 30 November. 4-15: Rialto to Tulip Creek above 760 metres spring and fall; Deer Creek Road areas 1 September to 30 November. 4-18: Grohman Creek closed for hunting use year round; Marsden Face no vehicles 1 December to 15 April; Sproule Creek spring and 1 September to 28 February. 4-20: Wycliffe Conservation Properties, Baribeau Creek and Cherry Creek closed to all vehicles; six creek watersheds closed for hunting use in spring and 1 September to 28 February. 4-21: Premier Ridge and parts of Lewis Creek closed to all vehicles; Coyote Creek headwaters spring and winter; Island Pond 1 September to 30 June.">
<rect width="400" height="506" fill="#fffaf0"/>
<text x="12" y="25" font-size="14" font-weight="bold" fill="#6b5b4b">Vehicle closures, MUs 4-9 to 4-21</text>
