<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 412" role="img" aria-label="Cards of vehicle closures in Management Units 4-9 to 4-21. 4-9: Malde, Goodeve, Morris and Shepard creeks and Cambridge Creek above 750 metres closed for hunting use in spring and fall; Tiger Creek spring and 1 September to 28 February. 4-14: Peter and Faith creeks 1 September to 30 November. 4-15: Rialto to Tulip Creek above 760 metres spring and fall; Deer Creek Road areas 1 September to 30 November. 4-18: Grohman Creek closed for hunting use year round; Marsden Face no vehicles 1 December to 15 April; Sproule Creek spring and 1 September to 28 February. 4-20: Wycliffe Conservation Properties, Baribeau Creek and Cherry Creek closed to all vehicles; six creek watersheds closed for hunting use in spring and 1 September to 28 February. 4-21: Premier Ridge and parts of Lewis Creek closed to all vehicles; Coyote Creek headwaters spring and winter; Island Pond 1 September to 30 June." font-family="sans-serif">
