<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A 10 day sprint before the first hunts. Day 1: confirm zero at 100 m with 3 shots. Days 2 to 4: 10 minutes of dry fire, sticks and get downs. Day 5: range with a cold plate shot, then 150 and 200 m. Days 6 to 8: dry fire and pattern the shotgun once. Day 9: gear check and inspect rounds. Day 10: rest, pack, sleep.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">First hunts soon: a 10 day sprint</text><rect x="14" y="44" width="372" height="32" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><rect x="14" y="44" width="8" height="34" rx="3" fill="#e8590c" stroke="none" stroke-width="2"/><text x="32" y="66" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">Day 1</text><text x="140" y="66" font-size="14" fill="#23261f" text-anchor="start">Confirm zero, 100 m, 3 shots</text><rect x="14" y="82" width="372" height="32" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><rect x="14" y="82" width="8" height="34" rx="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="32" y="104" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="start">Days 2 to 4</text><text x="140" y="104" font-size="14" fill="#23261f" text-anchor="start">Dry fire 10 min, sticks, get downs</text><rect x="14" y="120" width="372" height="32" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><rect x="14" y="120" width="8" height="34" rx="3" fill="#e8590c" stroke="none" stroke-width="2"/><text x="32" y="142" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">Day 5</text><text x="140" y="142" font-size="14" fill="#23261f" text-anchor="start">Range: cold plate, 150 and 200 m</text><rect x="14" y="158" width="372" height="32" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><rect x="14" y="158" width="8" height="34" rx="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="32" y="180" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="start">Days 6 to 8</text><text x="140" y="180" font-size="14" fill="#23261f" text-anchor="start">Dry fire, pattern shotgun once</text><rect x="14" y="196" width="372" height="32" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><rect x="14" y="196" width="8" height="34" rx="3" fill="#8a9a6b" stroke="none" stroke-width="2"/><text x="32" y="218" font-size="15" font-weight="bold" fill="#8a9a6b" text-anchor="start">Day 9</text><text x="140" y="218" font-size="14" fill="#23261f" text-anchor="start">Gear check, rounds inspected</text><rect x="14" y="234" width="372" height="32" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><rect x="14" y="234" width="8" height="34" rx="3" fill="#2f3a2b" stroke="none" stroke-width="2"/><text x="32" y="256" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Day 10</text><text x="140" y="256" font-size="14" fill="#23261f" text-anchor="start">Rest. Pack. Sleep.</text><text x="200.0" y="290" font-size="13" fill="#2f3a2b" text-anchor="middle">Opinion: a plan, not a rule</text>
</svg>
