<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Cut safely: wear gloves, eyewear and an apron. Wash and sanitise tools after each animal; a 40 percent bleach solution works on metal, 95 percent. Cooking does not destroy prions. Do not eat a CWD positive animal, 95 percent." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Cut safely, clean the tools</text>
<g transform="translate(70 110)"><path d="M-22,30 L-22,-10 C-22,-20 -14,-20 -14,-10 L-14,-26 C-14,-34 -6,-34 -6,-26 L-6,-30 C-6,-38 2,-38 2,-30 L2,-26 C2,-34 10,-34 10,-26 L10,0 L18,-10 C24,-16 30,-10 26,-4 L10,30 Z" fill="#4a7fb0" stroke="#23261f" stroke-width="2"/></g>
<text x="70" y="166" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Gloves</text>
<g transform="translate(200 104)"><circle cx="-20" cy="0" r="16" fill="#e7eef5" stroke="#23261f" stroke-width="3"/><circle cx="20" cy="0" r="16" fill="#e7eef5" stroke="#23261f" stroke-width="3"/><path d="M-4,0 h8 M-36,0 l-10,-4 M36,0 l10,-4" stroke="#23261f" stroke-width="3"/></g>
<text x="200" y="166" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Eyewear</text>
<g transform="translate(330 104)"><path d="M-20,-34 h40 v16 l10,6 v50 h-60 v-50 l10,-6 Z" fill="#f3ead8" stroke="#23261f" stroke-width="2"/></g>
<text x="330" y="166" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Apron</text>
<rect x="10" y="184" width="380" height="50" rx="8" fill="#f3ead8" stroke="#2f3a2b" stroke-width="2"/>
<text x="200.0" y="204.9" font-size="14" fill="#23261f" text-anchor="middle">Wash and sanitise tools after each animal.</text>
<text x="200.0" y="222.9" font-size="14" fill="#23261f" text-anchor="middle">40% bleach solution works on metal (95%).</text>
<rect x="10" y="242" width="380" height="50" rx="8" fill="#fde8d8" stroke="#e8590c" stroke-width="2"/>
<text x="200.0" y="262.8" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Cooking does NOT destroy prions.</text>
<text x="200.0" y="281.8" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Do not eat a CWD positive animal (95%).</text>
</svg>
