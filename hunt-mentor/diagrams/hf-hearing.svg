<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Hearing range chart in kilohertz. People hear up to about 20. White tailed deer in one study heard about 0.25 to 30, best at 4 to 8. A second study found deer hear past 50. Deer hear higher pitch than we do: zippers, Velcro and metal clinks are the giveaway.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Who hears what (kilohertz)</text>
  <line x1="90" y1="200" x2="390" y2="200" stroke="#2f3a2b" stroke-width="2"/>
  <g font-size="14" fill="#2f3a2b" text-anchor="middle"><text x="90" y="220">0</text><text x="150" y="220">10</text><text x="210" y="220">20</text><text x="270" y="220">30</text><text x="330" y="220">40</text><text x="390" y="220">50</text></g>
  <g stroke="#2f3a2b" stroke-width="1" opacity=".3"><line x1="150" y1="50" x2="150" y2="200"/><line x1="210" y1="50" x2="210" y2="200"/><line x1="270" y1="50" x2="270" y2="200"/><line x1="330" y1="50" x2="330" y2="200"/></g>
  <text x="8" y="72" font-size="15" font-weight="bold" fill="#2f3a2b">People</text>
  <rect x="90" y="56" width="120" height="24" rx="4" fill="#8a9a6b"/>
  <text x="8" y="118" font-size="15" font-weight="bold" fill="#2f3a2b">Deer</text><text x="8" y="134" font-size="14" fill="#2f3a2b">study 1</text>
  <rect x="92" y="104" width="178" height="24" rx="4" fill="#8b5a2b"/>
  <rect x="114" y="104" width="24" height="24" fill="#e8590c"/>
  <text x="126" y="98" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">best 4 to 8</text>
  <text x="8" y="168" font-size="15" font-weight="bold" fill="#2f3a2b">Deer</text><text x="8" y="184" font-size="14" fill="#2f3a2b">study 2</text>
  <rect x="92" y="154" width="298" height="24" rx="4" fill="#8b5a2b" opacity=".6"/>
  <text x="380" y="171" font-size="14" font-weight="bold" fill="#fff" text-anchor="end">past 50</text>
  <rect x="12" y="236" width="376" height="54" rx="8" fill="#2f3a2b"/>
  <text x="200" y="258" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Sharp high sounds give you away:</text>
  <text x="200" y="278" font-size="14" font-weight="bold" fill="#ffd34d" text-anchor="middle">zippers, Velcro, nylon, metal on metal</text>
</svg>
