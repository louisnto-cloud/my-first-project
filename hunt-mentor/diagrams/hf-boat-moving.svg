<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 482" font-family="sans-serif" role="img" aria-label="When can you shoot from a boat? Moving, no: motor running, or motor off but still gliding from the motor&#x27;s push, which still counts as moving. Stopped, yes: beached on shore, anchored, or tied to a fixed blind, motor off. Habit, a Tip: motor off, then shoot.">
