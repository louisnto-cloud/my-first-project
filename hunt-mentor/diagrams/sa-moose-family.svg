f" stroke-width="2" stroke-linejoin="round"/><path d="M56 -44 L86 -30 Q92 -22 84 -18 L64 -20 Q54 -26 56 -44 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="2" stroke-linejoin="round"/><path d="M66 -22 Q66 -6 60 -4 Q58 -12 62 -22 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="2"/><ellipse cx="56" cy="-50" rx="8" ry="3.5" transform="rotate(-30 56 -50)" fill="#3b2a1c" stroke="#23261f" stroke-width="2"/><circle cx="70" cy="-34" r="1.8" fill="#eee"/></g><g transform="translate(340 226) scale(0.44 0.44)"><rect x="-36" y="4" width="8" height="52" rx="4.0" fill="#9c8a76" stroke="#23261f" stroke-width="1.5"/><rect x="-26" y="4" width="8" height="52" rx="4.0" fill="#9c8a76" stroke="#23261f" stroke-width="1.5"/><rect x="26" y="4" width="8" height="52" rx="4.0" fill="#9c8a76" stroke="#23261f" stroke-width="1.5"/><rect x="36" y="4" width="8" height="52" rx="4.0" fill="#9c8a76" stroke="#23261f" stroke-width="1.5"/><path d="M-46 0 Q-48 -26 -20 -26 Q10 -40 34 -34 Q48 -26 44 2 Q20 22 -30 18 Q-48 16 -46 0 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="2"/><path d="M30 -30 L56 -40 L66 -26 L40 0 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="2" stroke-linejoin="round"/><path d="M56 -44 L86 -30 Q92 -22 84 -18 L64 -20 Q54 -26 56 -44 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="2" stroke-linejoin="round"/><path d="M66 -22 Q66 -6 60 -4 Q58 -12 62 -22 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="2"/><ellipse cx="56" cy="-50" rx="8" ry="3.5" transform="rotate(-30 56 -50)" fill="#3b2a1c" stroke="#23261f" stroke-width="2"/><circle cx="70" cy="-34" r="1.8" fill="#eee"/></g><line x1="20" y1="160" x2="20" y2="250" stroke="#e8590c" stroke-width="3"/><line x1="12" y1="160" x2="28" y2="160" stroke="#e8590c" stroke-width="3"/><text x="26" y="148" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="start">about 1.8 m</text><text x="100" y="274" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Cow</text><text x="100" y="292" font-size="14" fill="#23261f" text-anchor="middle">340 to 420 kg</text><text x="240" y="274" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Not always a calf</text><text x="240" y="292" font-size="14" fill="#e8590c" text-anchor="middle">could be a yearling</text><text x="350" y="274" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Calf</text><text x="350" y="292" font-size="14" fill="#23261f" text-anchor="middle">stubby face</text><text x="200" y="64" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">No antlers? Closed without</text><text x="200" y="84" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">an LEH draw in Region 3.</text>
</svg>
