<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three antlerless moose drawn to scale. A cow stands about 1.8 metres at the shoulder and weighs 340 to 420 kilograms. A calf, under 12 months, is much smaller with a distinctly stubby face. A middle sized moose with a cow is not always a calf. No antlers means closed without a Limited Entry Hunting draw in Region 3.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
