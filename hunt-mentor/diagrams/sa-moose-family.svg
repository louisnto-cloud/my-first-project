<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three antlerless moose. A cow stands about 1.8 metres at the shoulder and weighs 340 to 420 kilograms. A calf, under 12 months, is much smaller with a distinctly stubby face. A middle sized moose with a cow is not always a calf. Both sexes have a bell. No antlers means closed without a Limited Entry Hunting draw in Region 3. Sizes other than the cow are an illustration.">
<defs><g id="sa-moose-family-body">
<path d="M214 214 L226 216 L228 262 L230 316 L220 318 L216 264 L210 232z" fill="#6f6252"/>
<path d="M300 208 L318 210 L322 252 L326 316 L316 318 L310 256 L300 228z" fill="#6f6252"/>
<path d="M120 132 C150 100 180 92 206 96 C240 102 300 110 330 118 C346 122 352 140 350 160 C348 180 342 196 336 206 L334 238 L338 316 L326 318 L320 242 C316 228 310 216 300 212 C270 216 232 218 208 216 L204 242 L208 316 L196 318 L190 244 C186 230 182 222 172 218 C156 216 146 208 140 198 C132 184 124 172 114 162 C102 164 90 172 78 180 L56 190 C42 194 30 186 32 174 C34 162 48 152 62 146 C80 138 96 130 110 126 C114 126 118 128 120 132z" fill="#4e3626" stroke="#2c1d12" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M196 318 L204 244 L208 316z M326 318 L334 240 L338 316z" fill="#9a8c78"/>
<path d="M190 250 L196 318 L208 316 L204 244z M320 246 L326 318 L338 316 L334 240z" fill="#9a8c78"/>
<path d="M98 166 C102 176 102 190 96 198 C92 190 92 176 98 166z" fill="#3a271b" stroke="#2c1d12" stroke-width="1"/>
<path d="M108 126 C112 112 120 104 128 100 C128 112 122 122 114 128z" fill="#4e3626" stroke="#2c1d12" stroke-width="1.4"/>
<circle cx="76" cy="150" r="2.6" fill="#120b06"/><ellipse cx="38" cy="176" rx="3.2" ry="2.4" fill="#120b06"/>
</g></defs>
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<g data-tip="Never between a cow and her calf|Give a cow with a calf a wide berth, and back away if she faces you. In Alaska, moose injure more people each year than bears (65%).">
<text x="200" y="26" font-size="19" font-weight="bold" fill="#23261f" text-anchor="middle">Cow, calf, or not a calf?</text>
</g>
<g data-tip="No antlers, no shot|An antlerless moose in Region 3 is closed to you without an LEH (Limited Entry Hunting) draw. Cow or calf, it does not matter.">
<rect x="10" y="38" width="380" height="50" rx="8" fill="#fbe3dc" stroke="#c0392b" stroke-width="1.5"/>
<text x="200" y="58" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">No antlers? Closed in Region 3 without</text>
<text x="200" y="78" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">an LEH (Limited Entry Hunting) draw</text>
</g>
<line x1="0" y1="246" x2="400" y2="246" stroke="#8a9a6b" stroke-width="3"/>
<g data-tip="Cow|No antlers, about 1.8 m at the shoulder, 340 to 420 kg (98%, synopsis definition).">
<use href="#sa-moose-family-body" transform="translate(-3 87.0) scale(0.5)"/>
<line x1="100.0" y1="135.0" x2="100.0" y2="246" stroke="#e8590c" stroke-width="2.4" stroke-dasharray="5 4"/>
<line x1="92.0" y1="135.0" x2="108.0" y2="135.0" stroke="#e8590c" stroke-width="3"/>
<text x="100.0" y="127.0" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">about 1.8 m</text>
<text x="92" y="268" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Cow</text>
<text x="92" y="288" font-size="14" fill="#23261f" text-anchor="middle">340 to 420 kg</text>
</g>
<g data-tip="The bell|The flap of skin under the throat. Both sexes have one, so it does not prove a bull (65%).">
<line x1="45" y1="186" x2="28" y2="214" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="45" cy="186" r="2.4" fill="#2f3a2b"/>
<text x="28" y="230" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">bell</text>
</g>
<g data-tip="Not always a calf|Synopsis warning: not all moose in the company of a larger moose are calves. Be sure of your target (98%).">
<use href="#sa-moose-family-body" transform="translate(174.9 128.3) scale(0.37)"/>
<text x="246" y="268" font-size="16" font-weight="bold" fill="#c2410c" text-anchor="middle">Not always</text>
<text x="246" y="288" font-size="16" font-weight="bold" fill="#c2410c" text-anchor="middle">a calf</text>
</g>
<g data-tip="Calf|Under 12 months old. Much smaller, with a distinctly stubby face (98%).">
<g transform="translate(358 246)">
<rect x="-20" y="-34" width="5" height="34" fill="#9a8c78"/><rect x="-13" y="-34" width="5" height="34" fill="#8a7c68"/><rect x="18" y="-34" width="5" height="34" fill="#9a8c78"/><rect x="25" y="-34" width="5" height="34" fill="#8a7c68"/>
<path d="M-26 -52 C-14 -64 20 -64 32 -56 C40 -50 40 -38 32 -32 C14 -28 -12 -28 -26 -34 C-32 -38 -32 -48 -26 -52z" fill="#7a5236" stroke="#2c1d12" stroke-width="1.4"/>
<path d="M-22 -50 C-28 -60 -34 -64 -40 -62 L-50 -56 C-54 -52 -52 -46 -46 -46 L-38 -46 C-32 -46 -26 -42 -22 -38z" fill="#7a5236" stroke="#2c1d12" stroke-width="1.4"/>
<ellipse cx="-32" cy="-67" rx="3" ry="7" transform="rotate(25 -32 -67)" fill="#7a5236" stroke="#2c1d12" stroke-width="1"/>
<circle cx="-41" cy="-57" r="1.6" fill="#120b06"/><circle cx="-50" cy="-51" r="1.5" fill="#120b06"/>
</g>
<text x="358" y="268" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Calf</text>
<text x="358" y="288" font-size="14" fill="#23261f" text-anchor="middle">stubby face</text>
</g>
</svg>
