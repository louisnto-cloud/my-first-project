<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Pressure trend table. Falling fast: a storm or front is coming. Falling slowly: clouds thickening. Steady: no big change. Rising: clearing and often colder.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="32" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Pressure trend: what it usually means</text><rect x="20" y="55" width="360" height="42" rx="8" fill="#ffffff" stroke="#c92a2a" stroke-width="2"/><text x="48" y="84" font-family="sans-serif" font-size="20" fill="#c92a2a" text-anchor="middle" font-weight="bold">↓↓</text><text x="80" y="82" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Falling fast</text><text x="220" y="82" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Storm or front coming</text><rect x="20" y="107" width="360" height="42" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="48" y="136" font-family="sans-serif" font-size="20" fill="#e8590c" text-anchor="middle" font-weight="bold">↓</text><text x="80" y="134" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Falling slowly</text><text x="220" y="134" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Clouds thickening</text><rect x="20" y="159" width="360" height="42" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="48" y="188" font-family="sans-serif" font-size="20" fill="#8a9a6b" text-anchor="middle" font-weight="bold">→</text><text x="80" y="186" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Steady</text><text x="220" y="186" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">No big change</text><rect x="20" y="211" width="360" height="42" rx="8" fill="#ffffff" stroke="#4a7fb0" stroke-width="2"/><text x="48" y="240" font-family="sans-serif" font-size="20" fill="#4a7fb0" text-anchor="middle" font-weight="bold">↑</text><text x="80" y="238" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Rising</text><text x="220" y="238" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Clearing, often colder</text><text x="20" y="290" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="start">General rule (75%). The Hunt Map Weather shows the trend.</text>
</svg>
