<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="On a slope. Shooting downhill: sit facing down the slope with heels dug in; it feels like a bench. Shooting uphill: go prone or kneel with the pack under the forend.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">On a slope: face downhill, sit</text><path d="M20 90 L380 260 L20 260 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="130" cy="100" r="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3.5"/><path d="M130 110 L120 150" fill="none" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 150 L170 150 L190 176" fill="none" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="130" y1="112" x2="250" y2="146" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/><g transform="translate(300 180) scale(0.4)"><ellipse cx="62" cy="50" rx="44" ry="20" fill="#8b5a2b"/><path d="M28 42 L14 14 L24 10 L40 36 Z" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="12" cy="12" rx="13" ry="7" fill="#8b5a2b" transform="rotate(-20 12 12)"/><path d="M14 4 l6 -12 l4 10 Z" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="40" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="82" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="94" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><ellipse cx="104" cy="44" rx="5" ry="8" fill="#f4efe6"/></g><text x="260" y="80" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Downhill: sit, heels dug in,</text><text x="260" y="98" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">it feels like a bench</text><text x="80" y="240" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Uphill: prone or kneel,</text><text x="80" y="258" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">pack under the forend</text>
</svg>
