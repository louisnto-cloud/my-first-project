<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Six steps to follow an elk herd trail, all Tip. 1 Find the freshest tracks. 2 Count sizes: a herd or a lone bull. 3 Check the wind before each move. 4 Look ahead, not down, and glass the edges. 5 When the trail climbs to timber, slow way down. 6 At fresh beds or droppings, stop and glass.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Follow a herd trail (Tip)</text><circle cx="30" cy="59" r="13" fill="#2f3a2b"/><text x="30" y="64" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">1</text><text x="52" y="64" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Find the freshest tracks</text><circle cx="30" cy="97" r="13" fill="#2f3a2b"/><text x="30" y="102" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">2</text><text x="52" y="102" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Count sizes: herd or lone bull?</text><circle cx="30" cy="135" r="13" fill="#2f3a2b"/><text x="30" y="140" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">3</text><text x="52" y="140" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Check the wind before each move</text><circle cx="30" cy="173" r="13" fill="#2f3a2b"/><text x="30" y="178" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">4</text><text x="52" y="178" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Look ahead, not down: glass edges</text><circle cx="30" cy="211" r="13" fill="#2f3a2b"/><text x="30" y="216" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">5</text><text x="52" y="216" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Trail climbs to timber: slow way down</text><circle cx="30" cy="249" r="13" fill="#e8590c"/><text x="30" y="254" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">6</text><text x="52" y="254" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Fresh beds or droppings: stop, glass</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Hunter craft, opinion: Tip</text>
</svg>
