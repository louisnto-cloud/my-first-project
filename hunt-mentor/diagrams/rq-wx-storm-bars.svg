<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 316" font-family="sans-serif" role="img" aria-label="Bar chart, pattern only. Penn State collared does showed no real change in movement the day before 30 winter storms, 80 percent, and moved less during them. Glassing the calm after the storm is a tip, not a finding.">
<rect width="400" height="316" fill="#fffaf0"/>
<g data-tip="Log it yourself|It may still happen on your hill. Log temperature, pressure and wind in the Journal each sit. Your own valley data beats any article (Tip).">
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Collared deer around a storm</text>
</g>
<g data-tip="1. Before the storm|Collared does through 30 winter storms: no real change before the storm (80%). So the feed before the front rule is not supported by the best collar study found.">
<rect x="4" y="44" width="392" height="66" fill="#000" fill-opacity="0"/>
<circle cx="24" cy="60" r="12" fill="#2f3a2b"/><text x="24" y="65" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">1</text>
<circle cx="52" cy="60" r="7" fill="#f2b33d"/><path d="M52 48 v-4 M52 72 v4 M40 60 h-4 M64 60 h4 M44 52 l-3 -3 M60 52 l3 -3 M44 68 l-3 3 M60 68 l3 3" stroke="#f2b33d" stroke-width="2" stroke-linecap="round"/>
<text x="76" y="66" font-size="17" font-weight="bold" fill="#2f3a2b">Before the storm</text>
<rect x="14" y="76" width="372" height="30" rx="6" fill="#8a9a6b"/>
<text x="376" y="97" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="end">no real change</text>
</g>
<g data-tip="2. During the storm|The deer slowed during the storms, not before them (80%). Penn State notes: bucks moved less in rain than does (65%, preliminary).">
<rect x="4" y="116" width="392" height="66" fill="#000" fill-opacity="0"/>
<circle cx="24" cy="132" r="12" fill="#2f3a2b"/><text x="24" y="137" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text>
<path d="M42 138 C40 131 48 127 52 130 C56 125 64 128 63 134 C67 135 66 140 62 140H44C41 140 41 139 42 138z" fill="#6b7a8a"/><path d="M48 143 l-2 5 M53 143 l-2 5 M58 143 l-2 5" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round"/>
<text x="76" y="138" font-size="17" font-weight="bold" fill="#2f3a2b">During the storm</text>
<rect x="14" y="148" width="372" height="30" rx="6" fill="#efe8d6"/>
<rect x="14" y="148" width="156" height="30" rx="6" fill="#e8590c"/>
<text x="180" y="169" font-size="16" font-weight="bold" fill="#c2410c">moved less</text>
</g>
<g data-tip="3. Calm after the storm (Tip)|Hunter consensus: the day after a cold front clears, with rising pressure and cold calm air, is a great morning to sit (Tip, widely repeated, weak evidence).">
<rect x="4" y="188" width="392" height="66" fill="#000" fill-opacity="0"/>
<circle cx="24" cy="204" r="12" fill="#2f3a2b"/><text x="24" y="209" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">3</text>
<path d="M42 210 C40 203 48 199 52 202 C56 197 64 200 63 206 C67 207 66 212 62 212H44C41 212 41 211 42 210z" fill="#cfd8e0" stroke="#9aa6b2" stroke-width="1"/>
<text x="76" y="210" font-size="17" font-weight="bold" fill="#2f3a2b">Calm after the storm</text>
<rect x="15" y="221" width="370" height="28" rx="6" fill="#fffaf0" stroke="#8a9a6b" stroke-width="2.4" stroke-dasharray="7 5"/>
<text x="200" y="241" font-size="16" font-weight="bold" fill="#5b6b3e" text-anchor="middle">glass it (Tip, not a finding)</text>
</g>
<g data-tip="The study|Penn State Deer Forest Study: collared does through 30 winter storms, 2015 to 2017 (80%). Limits: bucks, mule deer, fall fronts and the BC Interior were not tested.">
<rect x="10" y="262" width="380" height="48" rx="8" fill="#f4eedf"/>
<text x="200" y="282" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Penn State: 30 storms, collared does (80%)</text>
<text x="200" y="300" font-size="14" fill="#6b5b4b" text-anchor="middle">Bars show the pattern, not exact values</text>
</g>
</svg>
