<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two panels. Dry fall: one water source with trails from every side leading to it. Wet fall: puddles and pools everywhere, so sit food and cover instead. Caption: water stands work best in a dry spell, a tip.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Dry fall vs wet fall</text>
  <rect x="6" y="40" width="190" height="220" rx="8" fill="#e6d8b3"/><rect x="204" y="40" width="190" height="220" rx="8" fill="#dfe6d3"/>
  <circle cx="101" cy="170" r="18" fill="#4a7fb0"/>
  <path d="M30 70 L92 160 M170 70 L112 160 M30 250 L90 182 M172 250 L112 182" stroke="#8b5a2b" stroke-width="2.5" stroke-dasharray="3 5"/>
  <text x="101" y="62" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Dry: few sources</text><text x="101" y="236" font-size="13" fill="#2f3a2b" text-anchor="middle">trails lead to it</text>
  <circle cx="240" cy="90" r="8" fill="#4a7fb0"/><circle cx="350" cy="110" r="10" fill="#4a7fb0"/><circle cx="300" cy="180" r="9" fill="#4a7fb0"/><circle cx="250" cy="220" r="7" fill="#4a7fb0"/><circle cx="360" cy="230" r="8" fill="#4a7fb0"/>
  <text x="299" y="62" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wet: water everywhere</text><text x="299" y="252" font-size="13" fill="#2f3a2b" text-anchor="middle">sit food and cover instead</text>
  <text x="200" y="292" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Water stands work best in a dry spell (Tip)</text>
</svg>
