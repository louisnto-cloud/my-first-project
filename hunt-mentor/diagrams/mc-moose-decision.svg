<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Decision chain before a moose shot. 1, antlers? No: no shot unless you hold an LEH draw. 2, one antler with 2 tines or less? Not sure: no shot. 3, swimming? Yes: no shot. 4, clear backstop? No: no shot. 5, can the two of you get it out? No plan: no shot. 6, broadside and in your range? Yes: shoot.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Shoot or not: 6 checks</text><rect x="10" y="38" width="228" height="36" rx="6" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="1"/><text x="124" y="61" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Antlers?</text><text x="248" y="61" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">no: no shot</text><rect x="10" y="81" width="228" height="36" rx="6" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="1"/><text x="124" y="104" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">One antler: 2 tines or less?</text><text x="248" y="104" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">unsure: no shot</text><rect x="10" y="124" width="228" height="36" rx="6" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="1"/><text x="124" y="147" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Swimming?</text><text x="248" y="147" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">yes: no shot</text><rect x="10" y="167" width="228" height="36" rx="6" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="1"/><text x="124" y="190" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Clear backstop?</text><text x="248" y="190" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">no: no shot</text><rect x="10" y="210" width="228" height="36" rx="6" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="1"/><text x="124" y="233" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Can 2 of you get it out?</text><text x="248" y="233" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">no plan: no shot</text><rect x="10" y="253" width="228" height="36" rx="6" fill="#2f3a2b" stroke="#8a9a6b" stroke-width="1"/><text x="124" y="276" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Broadside, in range?</text><text x="248" y="276" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">yes: shoot</text>
</svg>
