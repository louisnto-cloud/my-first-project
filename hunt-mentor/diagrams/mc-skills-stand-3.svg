<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 3: a lifeline rope runs from above the stand to the ground. The hunter, still standing on the ground, clips the harness tether to the lifeline before the feet leave the ground and stays connected all the way up and down.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3. Clip in before feet leave ground</text>
<rect x="0" y="250" width="400" height="50" fill="#dfe6d3"/><rect x="180" y="40" width="30" height="210" fill="#6b4f35"/>
<rect x="210" y="120" width="60" height="8" fill="#23261f"/><line x1="210" y1="128" x2="196" y2="150" stroke="#23261f" stroke-width="3"/>
<line x1="195" y1="60" x2="195" y2="246" stroke="#e8590c" stroke-width="3.5"/><rect x="189" y="244" width="12" height="6" rx="2" fill="#23261f"/>
<g transform="translate(232 250)"><rect x="-6" y="-26" width="5" height="26" fill="#2f3a2b"/><rect x="2" y="-26" width="5" height="26" fill="#2f3a2b"/><rect x="-8" y="-52" width="16" height="28" rx="4" fill="#e8590c"/><circle cx="0" cy="-60" r="8" fill="#2f3a2b"/><path d="M-7 -50 L7 -28 M7 -50 L-7 -28" stroke="#23261f" stroke-width="3"/></g>
<path d="M226 206 C 214 200, 206 194, 199 192" fill="none" stroke="#23261f" stroke-width="2.6"/>
<rect x="191" y="186" width="8" height="12" rx="3" fill="#23261f"/>
<line x1="199" y1="172" x2="229" y2="172" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="199" cy="172" r="2.6" fill="#2f3a2b"/>
<rect x="229.0" y="150.0" width="166.0" height="49.0" rx="5" fill="#fffaf0" stroke="#e8590c" stroke-width="1.2"/>
<text x="312" y="170.5" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Lifeline: connected</text>
<text x="312" y="190.5" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">ground to ground</text>
</svg>
