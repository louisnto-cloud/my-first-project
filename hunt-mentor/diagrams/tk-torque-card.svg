ke-width="1.5"/><circle cx="30" cy="192" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="197" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="46" y="189" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">Leupold BackCountry</text><text x="46" y="206" font-size="14" fill="#17201A" text-anchor="start">Ring top screws</text><text x="380" y="198" font-size="14" fill="#1F3D2B" text-anchor="end" font-weight="bold">28 in lb</text><rect x="12" y="216" width="376" height="40" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="236" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="241" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="46" y="233" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">Leupold BackCountry</text><text x="46" y="250" font-size="14" fill="#17201A" text-anchor="start">Keeper clamp</text><text x="380" y="242" font-size="14" fill="#1F3D2B" text-anchor="end" font-weight="bold">45 in lb</text><rect x="12" y="260" width="376" height="40" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="280" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="285" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text><text x="46" y="277" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">Vortex Pro</text><text x="46" y="294" font-size="14" fill="#17201A" text-anchor="start">Ring screws</text><text x="380" y="286" font-size="14" fill="#1F3D2B" text-anchor="end" font-weight="bold">18 in lb</text><rect x="12" y="304" width="376" height="40" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="324" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="329" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">7</text><text x="46" y="3