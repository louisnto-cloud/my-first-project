<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 418" font-family="sans-serif" role="img" aria-label="Torque card. From the Tikka manual: 1 receiver screws with a metal trigger guard 7 newton metres, 62 inch pounds; 2 rear sight set screws 0.8 Nm; 3 front sight screw 5 Nm. From ring makers: 4 Leupold BackCountry ring top screws 28 inch pounds, 5 keeper clamp 45 inch pounds; 6 Vortex Pro ring screws 18 inch pounds, 7 base clamp 30 inch pounds. Always use the number on your own ring maker&#x27;s sheet. 1 Nm is 8.85 inch pounds.">
