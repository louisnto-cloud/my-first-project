<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif" role="img" aria-label="Parts of a pump or semi auto shotgun, side view. From the back: recoil pad, stock, grip, trigger and trigger guard with the safety button, receiver with the ejection port, fore end, magazine tube under the barrel, barrel with the rib on top, bead sight and choke tube at the muzzle.">
  <rect width="400" height="320" fill="#fffaf0"/>
  <text x="200" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Parts of your shotgun</text>
  <!-- stock -->
  <path d="M26 138 L120 146 L124 168 L104 170 L26 196 Z" fill="#8b5a2b" stroke="#2f3a2b" stroke-width="2"/>
  <rect x="16" y="136" width="12" height="62" rx="3" fill="#2f3a2b"/>
  <!-- receiver -->
  <rect x="120" y="136" width="60" height="32" rx="3" fill="#6b6f68" stroke="#2f3a2b" stroke-width="2"/>
  <rect x="140" y="144" width="26" height="10" rx="2" fill="#2f3a2b"/>
  <!-- trigger guard -->
  <path d="M128 168 Q 132 192 160 188 L164 168" fill="none" stroke="#2f3a2b" stroke-width="3"/>
  <path d="M146 168 q -2 10 4 14" fill="none" stroke="#e8590c" stroke-width="3"/>
  <circle cx="160" cy="172" r="3" fill="#e8590c"/>
  <!-- barrel, rib, mag tube, fore end -->
  <rect x="180" y="138" width="200" height="10" fill="#6b6f68" stroke="#2f3a2b" stroke-width="1.5"/>
  <rect x="180" y="134" width="196" height="4" fill="#2f3a2b"/>
  <rect x="370" y="137" width="14" height="12" fill="#e8590c" stroke="#2f3a2b" stroke-width="1"/>
  <circle cx="372" cy="132" r="3" fill="#e8590c"/>
  <rect x="180" y="150" width="150" height="10" fill="#6b6f68" stroke="#2f3a2b" stroke-width="1.5"/>
  <rect x="330" y="149" width="10" height="12" rx="2" fill="#2f3a2b"/>
  <rect x="196" y="148" width="86" height="20" rx="6" fill="#8b5a2b" stroke="#2f3a2b" stroke-width="2"/>
  <!-- leaders top -->
  <g stroke="#2f3a2b" stroke-width="1.2">
    <line x1="70" y1="150" x2="70" y2="66"/><line x1="150" y1="140" x2="150" y2="96"/><line x1="152" y1="146" x2="230" y2="66"/>
    <line x1="290" y1="134" x2="290" y2="96"/><line x1="372" y1="129" x2="372" y2="66"/>
    <line x1="22" y1="196" x2="22" y2="236"/><line x1="148" y1="182" x2="110" y2="276"/><line x1="160" y1="175" x2="180" y2="236"/>
    <line x1="240" y1="168" x2="240" y2="276"/><line x1="320" y1="160" x2="300" y2="236"/><line x1="380" y1="149" x2="380" y2="276"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">
    <text x="70" y="60">Stock</text><text x="150" y="90">Receiver</text><text x="230" y="60">Ejection port</text>
    <text x="290" y="90">Rib</text><text x="364" y="60" fill="#e8590c">Bead</text>
    <text x="4" y="252" text-anchor="start">Recoil pad</text><text x="110" y="292" fill="#e8590c">Trigger</text><text x="186" y="252" fill="#e8590c">Safety</text>
    <text x="240" y="292">Fore end</text><text x="300" y="252">Magazine tube</text><text x="364" y="292" fill="#e8590c">Choke</text>
  </g>
  <text x="200" y="314" font-size="14" fill="#2f3a2b" text-anchor="middle">Pump: you slide the fore end. Semi auto: the gun cycles.</text>
</svg>
