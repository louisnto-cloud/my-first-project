<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Line chart, shape only, of body fat across the months January to December. The buck line climbs through summer to a peak in September and October, then drops sharply in November during the rut and stays low into March. The doe line is lowest in late winter, dips again while nursing in summer, and peaks in late fall. Both are leanest in late winter." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
