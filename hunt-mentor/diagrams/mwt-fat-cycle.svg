t-anchor="start" font-weight="bold">Fat</text><text x="40" y="236" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Lean</text><line x1="100" y1="44" x2="130" y2="44" stroke="#e8590c" stroke-width="4"/><text x="136" y="49" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Buck</text><line x1="190" y1="44" x2="220" y2="44" stroke="#2f3a2b" stroke-width="4" stroke-dasharray="8 5"/><text x="226" y="49" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Doe</text><text x="372" y="214" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">rut</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Both lowest in late winter. Bucks crash in the rut.</text>
