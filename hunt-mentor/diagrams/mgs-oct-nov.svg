<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two panels. October: migrant flocks join the local geese, a Tip; cackling geese reach wintering areas October to November, 75 percent; snow geese peak on the Fraser delta, 80 percent. November: high lakes freeze first, 60 percent; birds crowd onto open valley water, 75 percent; after weeks of shooting the birds are warier, a Tip. Season dates differ by district: check the Rule Book before every trip, 99 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">What changes in October and November</text><rect x="15" y="40" width="180" height="200" rx="10" fill="#fff" stroke="#e8590c" stroke-width="2"/><rect x="205" y="40" width="180" height="200" rx="10" fill="#fff" stroke="#4a7fb0" stroke-width="2"/><rect x="15" y="40" width="180" height="30" rx="10" fill="#e8590c"/><text x="105" y="61" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">October</text><rect x="205" y="40" width="180" height="30" rx="10" fill="#4a7fb0"/><text x="295" y="61" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">November</text><text x="105" y="94" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Migrant flocks join</text><text x="105" y="118" font-size="14" fill="#23261f" text-anchor="middle">the locals (Tip)</text><text x="105" y="142" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Cacklers reach winter</text><text x="105" y="166" font-size="14" fill="#23261f" text-anchor="middle">areas Oct to Nov (75%)</text><text x="105" y="190" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Snow geese peak on</text><text x="105" y="214" font-size="14" fill="#23261f" text-anchor="middle">the Fraser delta (80%)</text><text x="295" y="94" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">High lakes freeze first</text><text x="295" y="118" font-size="14" fill="#23261f" text-anchor="middle">(60%)</text><text x="295" y="142" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Birds crowd open</text><text x="295" y="166" font-size="14" fill="#23261f" text-anchor="middle">valley water (75%)</text><text x="295" y="190" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Weeks of shooting:</text><text x="295" y="214" font-size="14" fill="#23261f" text-anchor="middle">warier birds (Tip)</text><rect x="15" y="250" width="370" height="42" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="270" font-size="14" fill="#23261f" text-anchor="middle">Rule: dates differ by district. Check the</text><text x="200" y="287" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Rule Book before every trip (99%)</text>
</svg>
