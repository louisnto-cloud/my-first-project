<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 533" font-family="sans-serif" role="img" aria-label="Town bylaws, which are not in the synopsis. Plain rule: hunt outside every town boundary, iMapBC shows the boundaries, 95 percent. Vernon Bylaw 5399: no discharge of a firearm in the city, 99 percent. Kelowna Bylaw 9779: no discharge, 70 percent, VERIFY. Penticton: a bylaw with permit exceptions exists, wording VERIFY. Oliver, Osoyoos, Summerland, Peachland, Lake Country and West Kelowna: VERIFY each. Regional districts: VERIFY, and most regional district parks ban firearms, 99 percent.">
<rect width="400" height="533" fill="#fffaf0"/>
<text x="14" y="22" font-size="15" font-weight="bold" fill="#6b5b4b">Bylaws are not in the synopsis</text>
