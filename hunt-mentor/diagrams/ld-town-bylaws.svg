<rect x="10" y="363" width="380" height="76" rx="8" fill="#eaf0f6" stroke="#2c5d86" stroke-width="1.4"/>
<circle cx="34" cy="401.0" r="14" fill="#2c5d86"/><text x="34" y="407" font-size="18" font-weight="bold" fill="#fffaf0" text-anchor="middle">?</text>
<text x="60" y="385" font-size="16" font-weight="bold" fill="#2f3a2b">Oliver, Osoyoos and the rest</text>
<text x="60" y="405" font-size="15" fill="#2f3a2b">Summerland, Peachland, Lake Country, West</text>
<text x="60" y="424" font-size="15" fill="#2f3a2b">Kelowna: VERIFY.</text>
<rect x="10" y="446" width="380" height="76" rx="8" fill="#eaf0f6" stroke="#2c5d86" stroke-width="1.4"/>
<circle cx="34" cy="484.0" r="14" fill="#2c5d86"/><text x="34" y="490" font-size="18" font-weight="bold" fill="#fffaf0" text-anchor="middle">?</text>
<text x="60" y="468" font-size="16" font-weight="bold" fill="#2f3a2b">Regional districts</text>
<text x="60" y="488" font-size="15" fill="#2f3a2b">VERIFY. Most regional district parks ban</text>
<text x="60" y="507" font-size="15" fill="#2f3a2b">firearms (99%).</text>
