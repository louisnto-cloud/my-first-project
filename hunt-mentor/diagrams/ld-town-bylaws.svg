<text x="60" y="194" font-size="15" fill="#2f3a2b">No firearm discharge in the city (99%).</text>
<rect x="10" y="216" width="380" height="57" rx="8" fill="#f8e9e5" stroke="#c0392b" stroke-width="1.4"/>
<circle cx="34" cy="244.5" r="14" fill="#c0392b"/><path d="M28.9 239.4 l10.2 10.2 M39.1 239.4 l-10.2 10.2" stroke="#fffaf0" stroke-width="2.7" stroke-linecap="round"/>
<text x="60" y="238" font-size="16" font-weight="bold" fill="#2f3a2b">Kelowna, Bylaw 9779</text>
<text x="60" y="258" font-size="15" fill="#2f3a2b">No discharge (70%). VERIFY.</text>
<rect x="10" y="280" width="380" height="76" rx="8" fill="#eaf0f6" stroke="#2c5d86" stroke-width="1.4"/>
<circle cx="34" cy="318.0" r="14" fill="#2c5d86"/><text x="34" y="324" font-size="18" font-weight="bold" fill="#fffaf0" text-anchor="middle">?</text>
