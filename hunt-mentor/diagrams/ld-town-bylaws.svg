<ellipse cx="92" cy="88" rx="70" ry="44" fill="#ece6d6" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="8 5"/>
<g transform="translate(78 90) scale(1.3)" fill="#6b6e73" stroke="none"><rect x="-15" y="-4" width="10" height="17"/><rect x="-4" y="-14" width="11" height="27"/><rect x="8" y="0" width="8" height="13"/><path d="M-1 -10 h2 v2 h-2z M3 -10 h2 v2 h-2z M-1 -4 h2 v2 h-2z M3 -4 h2 v2 h-2z M-1 2 h2 v2 h-2z M3 2 h2 v2 h-2z" fill="#fffaf0"/></g>
<circle cx="126" cy="82" r="13" fill="#fffaf0" stroke="#c0392b" stroke-width="3.5"/><line x1="116.9" y1="91.1" x2="135.1" y2="72.9" stroke="#c0392b" stroke-width="3.5"/>
<text x="92" y="124" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle" stroke="#ece6d6" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">town line</text>
<g transform="translate(184 128) scale(1.15 1.15)"><path d="M-5 -20 L-6 0 M4 -20 L6 0" stroke="#4a4136" stroke-width="5" stroke-linecap="round"/><path d="M-8 -40 C-8 -44 8 -44 8 -40 L7 -19 H-7z" fill="#e8590c"/><circle cx="0" cy="-47" r="5.5" fill="#e0b48c"/><path d="M-6 -49 C-6 -56 6 -56 6 -49z" fill="#e8590c"/><path d="M4 -36 L22 -42" stroke="#3b2a1a" stroke-width="2.6" stroke-linecap="round"/><path d="M4 -36 L10 -31" stroke="#e0b48c" stroke-width="3" stroke-linecap="round"/></g>
<path d="M177.0 52.0 l5.0 5.0 l10.0 -11.0" fill="none" stroke="#2f6e3b" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="216" y="66" font-size="16" font-weight="bold" fill="#2f3a2b">Hunt outside</text>
<text x="216" y="86" font-size="16" font-weight="bold" fill="#2f3a2b">every town</text>
<text x="216" y="112" font-size="15" fill="#2f3a2b">iMapBC shows</text>
<text x="216" y="131" font-size="15" fill="#2f3a2b">the lines (95%)</text>
<rect x="10" y="152" width="380" height="57" rx="8" fill="#f8e9e5" stroke="#c0392b" stroke-width="1.4"/>
<circle cx="34" cy="180.5" r="14" fill="#c0392b"/><path d="M28.9 175.4 l10.2 10.2 M39.1 175.4 l-10.2 10.2" stroke="#fffaf0" stroke-width="2.7" stroke-linecap="round"/>
