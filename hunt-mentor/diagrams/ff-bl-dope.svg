<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="An example dope card for a .308 150 grain with a 100 m zero: at 150 m, 4 cm drop, hold centre, 9 cm of drift in a 20 km/h wind. At 200 m, 13 cm drop, hold the top third, 17 cm drift. At 250 m, 28 cm, hold 4 MOA, 27 cm drift. At 300 m, 48 cm and no shot this season. Fill it from your own group.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Your dope card, taped in the scope cap</text><rect x="40" y="46" width="320" height="214" rx="8" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="70" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">.308 150 gr, 100 m zero</text><text x="80" y="100" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">m</text><text x="160" y="100" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">drop</text><text x="240" y="100" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">hold</text><text x="320" y="100" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">wind 20</text><text x="80" y="132" font-size="15" fill="#23261f" text-anchor="middle">150</text><text x="160" y="132" font-size="15" fill="#23261f" text-anchor="middle">4 cm</text><text x="240" y="132" font-size="15" fill="#23261f" text-anchor="middle">centre</text><text x="320" y="132" font-size="15" fill="#23261f" text-anchor="middle">9 cm</text><line x1="50" y1="110" x2="350" y2="110" stroke="#d9d4c7" stroke-width="1" stroke-linecap="round"/><text x="80" y="164" font-size="15" fill="#23261f" text-anchor="middle">200</text><text x="160" y="164" font-size="15" fill="#23261f" text-anchor="middle">13 cm</text><text x="240" y="164" font-size="15" fill="#23261f" text-anchor="middle">top 1/3</text><text x="320" y="164" font-size="15" fill="#23261f" text-anchor="middle">17 cm</text><line x1="50" y1="142" x2="350" y2="142" stroke="#d9d4c7" stroke-width="1" stroke-linecap="round"/><text x="80" y="196" font-size="15" fill="#23261f" text-anchor="middle">250</text><text x="160" y="196" font-size="15" fill="#23261f" text-anchor="middle">28 cm</text><text x="240" y="196" font-size="15" fill="#23261f" text-anchor="middle">4 MOA</text><text x="320" y="196" font-size="15" fill="#23261f" text-anchor="middle">27 cm</text><line x1="50" y1="174" x2="350" y2="174" stroke="#d9d4c7" stroke-width="1" stroke-linecap="round"/><text x="80" y="228" font-size="15" fill="#23261f" text-anchor="middle">300</text><text x="160" y="228" font-size="15" fill="#23261f" text-anchor="middle">48 cm</text><text x="240" y="228" font-size="15" fill="#23261f" text-anchor="middle">no shot</text><text x="320" y="228" font-size="15" fill="#23261f" text-anchor="middle">40 cm</text><line x1="50" y1="206" x2="350" y2="206" stroke="#d9d4c7" stroke-width="1" stroke-linecap="round"/><text x="200.0" y="286" font-size="14" fill="#2f3a2b" text-anchor="middle">Fill it from YOUR 200 m group, not the box</text>
</svg>
