<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two panels. Still hunting: thick timber, you find the animal as you go, two or three steps then look, best on wet quiet days, a few hundred metres an hour. Spot and stalk: open country, glass first then go, fast in dead ground, slow where it can see, use landmarks and wind. Both are mostly standing still.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Still hunting or spot and stalk?</text><rect x="14" y="42" width="182" height="210" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><rect x="14" y="42" width="182" height="26" rx="8" fill="#2f3a2b"/><rect x="14" y="56" width="182" height="12" fill="#2f3a2b"/><text x="105.0" y="61" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Still hunting</text><text x="24" y="88" font-size="14" fill="#23261f" text-anchor="start">Thick timber</text><text x="24" y="107" font-size="14" fill="#23261f" text-anchor="start">You find it as you go</text><text x="24" y="126" font-size="14" fill="#23261f" text-anchor="start">2 or 3 steps, look</text><text x="24" y="145" font-size="14" fill="#23261f" text-anchor="start">Wet, quiet days</text><text x="24" y="164" font-size="14" fill="#23261f" text-anchor="start">Few hundred m an hour</text><rect x="204" y="42" width="182" height="210" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><rect x="204" y="42" width="182" height="26" rx="8" fill="#6b4f35"/><rect x="204" y="56" width="182" height="12" fill="#6b4f35"/><text x="295.0" y="61" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Spot and stalk</text><text x="214" y="88" font-size="14" fill="#23261f" text-anchor="start">Open country</text><text x="214" y="107" font-size="14" fill="#23261f" text-anchor="start">Glass first, then go</text><text x="214" y="126" font-size="14" fill="#23261f" text-anchor="start">Fast in dead ground</text><text x="214" y="145" font-size="14" fill="#23261f" text-anchor="start">Slow in its sight</text><text x="214" y="164" font-size="14" fill="#23261f" text-anchor="start">Landmarks, wind</text><text x="200" y="280" font-size="14" fill="#e8590c" text-anchor="middle">Both: mostly standing still (Tip)</text>
</svg>
