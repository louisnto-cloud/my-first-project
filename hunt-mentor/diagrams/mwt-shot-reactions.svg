<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 512" font-family="sans-serif" role="img" aria-label="Four drawings of a white tailed deer after the shot, labelled as a tip. Heart or lungs: the deer kicks its hind legs or bolts hard and often falls in sight; wait at least 30 minutes. Liver: hunched, runs a bit, then walks; wait 4 to 6 hours. Gut: tail clamped down, back hunched, slow walk; wait 6 to 8 hours, or overnight if cool. Clean miss: tail flagged up, normal bounds, but still check and search for sign. Reactions are clues only; blood and hair tell more.">
