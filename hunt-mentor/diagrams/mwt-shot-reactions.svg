<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Four boxes, labelled as a tip. Heart or lungs: the deer kicks or bolts hard and often falls in sight; wait at least 30 minutes. Liver: hunched, runs a bit then walks; wait 4 to 6 hours. Gut: tail clamped down, hunched, slow walk; wait 6 to 8 hours, or overnight if cool. Clean miss: tail flagged, normal bounds, but still search for sign. Caption: reactions are clues only." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="20" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">Read the reaction, then wait (Tip)</text><rect x="8" y="34" width="188" height="124" rx="10" fill="#fffaf0" stroke="#e8590c" stroke-width="2.5"/><text x="102" y="58" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">Heart, lungs</text><text x="102" y="84" font-size="14" fill="#23261f" text-anchor="middle">Kicks or bolts hard,</text><text x="102" y="102" font-size="14" fill="#23261f" text-anchor="middle">often falls in sight</text><rect x="32" y="116" width="140" height="30" rx="15.0" fill="#e8590c"/><text x="102.0" y="135.9" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Wait 30 min+</text><rect x="204" y="34" width="188" height="124" rx="10" fill="#fffaf0" stroke="#6b4f35" stroke-width="2.5"/><text x="298" y="58" font-size="16" fill="#6b4f35" text-anchor="middle" font-weight="bold">Liver</text><text x="298" y="84" font-size="14" fill="#23261f" text-anchor="middle">Hunched, runs a bit,</text><text x="298" y="102" font-size="14" fill="#23261f" text-anchor="middle">then walks</text><rect x="228" y="116" width="140" height="30" rx="15.0" fill="#6b4f35"/><text x="298.0" y="135.9" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Wait 4 to 6 h</text><rect x="8" y="164" width="188" height="124" rx="10" fill="#fffaf0" stroke="#9b2c1c" stroke-width="2.5"/><text x="102" y="188" font-size="16" fill="#9b2c1c" text-anchor="middle" font-weight="bold">Gut</text><text x="102" y="214" font-size="14" fill="#23261f" text-anchor="middle">Tail clamped down,</text><text x="102" y="232" font-size="14" fill="#23261f" text-anchor="middle">hunched, slow walk</text><rect x="32" y="246" width="140" height="30" rx="15.0" fill="#9b2c1c"/><text x="102.0" y="265.9" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Wait 6 to 8 h</text><rect x="204" y="164" width="188" height="124" rx="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2.5"/><text x="298" y="188" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Clean miss?</text><text x="298" y="214" font-size="14" fill="#23261f" text-anchor="middle">Flag up, normal</text><text x="298" y="232" font-size="14" fill="#23261f" text-anchor="middle">bounds. Still check!</text><rect x="228" y="246" width="140" height="30" rx="15.0" fill="#2f3a2b"/><text x="298.0" y="265.9" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Search for sign</text><text x="200" y="298" font-size="14" fill="#6b4f35" text-anchor="middle">Clues only. Blood and hair tell more.</text>
</svg>
