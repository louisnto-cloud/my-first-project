<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" role="img" aria-label="Pattern bars from about 6:30 to 19:00. California quail feed in the morning and late afternoon, sit in cover near water midday and roost at dusk. Chukar feed on slopes in the morning, go to shade and water midday, and move up to steep roosts late afternoon. Ruffed grouse feed and pick grit early and late and sit in cover midday. Pheasants pick grit at first light, feed, loaf in thick cover midday, feed again and roost.">
<rect x="0" y="0" width="400" height="350" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">An upland bird day (pattern)</text>
<line x1="43" y1="50" x2="43" y2="280" stroke="#d6d0bf" stroke-width="1"/>
<text x="42.61538461538461" y="46" font-family="sans-serif" font-size="13" fill="#6b4f35" text-anchor="middle">7:00</text>
<line x1="128" y1="50" x2="128" y2="280" stroke="#d6d0bf" stroke-width="1"/>
<text x="128.46153846153845" y="46" font-family="sans-serif" font-size="13" fill="#6b4f35" text-anchor="middle">10:00</text>
<line x1="214" y1="50" x2="214" y2="280" stroke="#d6d0bf" stroke-width="1"/>
<text x="214.30769230769232" y="46" font-family="sans-serif" font-size="13" fill="#6b4f35" text-anchor="middle">13:00</text>
<line x1="300" y1="50" x2="300" y2="280" stroke="#d6d0bf" stroke-width="1"/>
<text x="300.15384615384613" y="46" font-family="sans-serif" font-size="13" fill="#6b4f35" text-anchor="middle">16:00</text>
<line x1="386" y1="50" x2="386" y2="280" stroke="#d6d0bf" stroke-width="1"/>
<text x="386.0" y="46" font-family="sans-serif" font-size="13" fill="#6b4f35" text-anchor="middle">19:00</text>
<text x="14" y="80" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">California quail</text>
<rect x="28" y="86" width="100" height="22" rx="4" fill="#e8590c"/>
<text x="78.38461538461539" y="102" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">feed</text>
<rect x="128" y="86" width="143" height="22" rx="4" fill="#8a9a6b"/>
<text x="200.0" y="102" font-family="sans-serif" font-size="13" font-weight="bold" fill="#23261f" text-anchor="middle">cover, water</text>
<rect x="272" y="86" width="72" height="22" rx="4" fill="#e8590c"/>
<text x="307.3076923076923" y="102" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">feed</text>
<rect x="343" y="86" width="43" height="22" rx="4" fill="#2f3a2b"/>
<text x="364.53846153846155" y="102" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">roost</text>
<text x="14" y="134" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Chukar</text>
<rect x="28" y="140" width="129" height="22" rx="4" fill="#e8590c"/>
<text x="92.69230769230768" y="156" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">feed on slope</text>
<rect x="157" y="140" width="114" height="22" rx="4" fill="#4a7fb0"/>
<text x="214.30769230769232" y="156" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">shade, water</text>
<rect x="272" y="140" width="86" height="22" rx="4" fill="#2f3a2b"/>
<text x="314.46153846153845" y="156" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">up to roost</text>
<text x="14" y="188" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Ruffed grouse</text>
<rect x="28" y="194" width="86" height="22" rx="4" fill="#e8590c"/>
<text x="71.23076923076923" y="210" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">feed, grit</text>
<rect x="114" y="194" width="157" height="22" rx="4" fill="#8a9a6b"/>
<text x="192.84615384615387" y="210" font-family="sans-serif" font-size="13" font-weight="bold" fill="#23261f" text-anchor="middle">in cover</text>
<rect x="272" y="194" width="86" height="22" rx="4" fill="#e8590c"/>
<text x="314.46153846153845" y="210" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">feed, grit</text>
<text x="14" y="242" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Pheasant</text>
<rect x="28" y="248" width="43" height="22" rx="4" fill="#8b5a2b"/>
<text x="49.76923076923077" y="264" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">grit</text>
<rect x="71" y="248" width="57" height="22" rx="4" fill="#e8590c"/>
<text x="99.84615384615384" y="264" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">feed</text>
<rect x="128" y="248" width="157" height="22" rx="4" fill="#8a9a6b"/>
<text x="207.15384615384616" y="264" font-family="sans-serif" font-size="13" font-weight="bold" fill="#23261f" text-anchor="middle">thick cover</text>
<rect x="286" y="248" width="57" height="22" rx="4" fill="#e8590c"/>
<text x="314.46153846153845" y="264" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">feed</text>
<rect x="343" y="248" width="43" height="22" rx="4" fill="#2f3a2b"/>
<text x="364.53846153846155" y="264" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">roost</text>
<text x="14" y="324" font-family="sans-serif" font-size="13" fill="#6b4f35" text-anchor="start">Pattern only (65 to 75%). Weather and season shift</text>
<text x="14" y="340" font-family="sans-serif" font-size="13" fill="#6b4f35" text-anchor="start">it.</text>
</svg>
