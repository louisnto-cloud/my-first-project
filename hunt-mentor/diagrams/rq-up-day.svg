<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 336" font-family="sans-serif" role="img" aria-label="Pattern bars for an upland bird day from about 6:30 to 19:00. California quail feed in the morning and late afternoon, sit in cover near water midday and roost at dusk. Chukar feed on slopes in the morning, go to shade and water midday, and move up to roost late afternoon. Ruffed grouse feed and pick grit early and late and sit in cover midday. Pheasants pick grit at first light, feed, sit in thick cover midday, feed again and roost. Pattern only, 65 to 75 percent; weather and season shift it.">
<rect width="400" height="336" fill="#fffaf0"/>
<text x="28.9" y="24" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">7:00</text>
<line x1="28.9" y1="29" x2="28.9" y2="35" stroke="#6b5b4b" stroke-width="1.4"/>
<text x="118.2" y="24" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">10:00</text>
<line x1="118.2" y1="29" x2="118.2" y2="35" stroke="#6b5b4b" stroke-width="1.4"/>
<text x="207.4" y="24" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">13:00</text>
<line x1="207.4" y1="29" x2="207.4" y2="35" stroke="#6b5b4b" stroke-width="1.4"/>
<text x="296.7" y="24" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">16:00</text>
<line x1="296.7" y1="29" x2="296.7" y2="35" stroke="#6b5b4b" stroke-width="1.4"/>
<text x="386" y="24" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="end">19:00</text>
<line x1="386.0" y1="29" x2="386.0" y2="35" stroke="#6b5b4b" stroke-width="1.4"/>
<text x="14" y="55" font-size="16" font-weight="bold" fill="#2f3a2b">California quail</text>
<rect x="15.0" y="62" width="102.2" height="28" rx="5" fill="#e8590c"/>
<text x="66.1" y="81" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">feed</text>
<rect x="119.2" y="62" width="146.8" height="28" rx="5" fill="#8a9a6b"/>
<text x="192.6" y="81" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">cover, water</text>
<rect x="268.0" y="62" width="72.4" height="28" rx="5" fill="#e8590c"/>
<text x="304.2" y="81" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">feed</text>
<rect x="342.4" y="62" width="42.6" height="28" rx="5" fill="#2f3a2b"/>
<text x="363.7" y="81" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">roost</text>
<text x="14" y="119" font-size="16" font-weight="bold" fill="#2f3a2b">Chukar</text>
<rect x="15.0" y="126" width="131.9" height="28" rx="5" fill="#e8590c"/>
<text x="81" y="145" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">feed on slope</text>
<rect x="148.9" y="126" width="117.0" height="28" rx="5" fill="#4a7fb0"/>
<text x="207.4" y="145" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">shade, water</text>
<rect x="268.0" y="126" width="87.3" height="28" rx="5" fill="#2f3a2b"/>
<text x="311.6" y="145" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">up to roost</text>
<text x="14" y="183" font-size="16" font-weight="bold" fill="#2f3a2b">Ruffed grouse</text>
<rect x="15.0" y="190" width="87.3" height="28" rx="5" fill="#e8590c"/>
<text x="58.6" y="209" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">feed, grit</text>
<rect x="104.3" y="190" width="161.7" height="28" rx="5" fill="#8a9a6b"/>
<text x="185.1" y="209" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">in cover</text>
<rect x="268.0" y="190" width="87.3" height="28" rx="5" fill="#e8590c"/>
<text x="311.6" y="209" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">feed, grit</text>
<text x="14" y="247" font-size="16" font-weight="bold" fill="#2f3a2b">Pheasant</text>
<rect x="15.0" y="254" width="42.6" height="28" rx="5" fill="#8b5a2b"/>
<text x="36.3" y="273" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">grit</text>
<rect x="59.6" y="254" width="57.5" height="28" rx="5" fill="#e8590c"/>
<text x="88.4" y="273" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">feed</text>
<rect x="119.2" y="254" width="161.7" height="28" rx="5" fill="#8a9a6b"/>
<text x="200" y="273" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">thick cover</text>
<rect x="282.8" y="254" width="57.5" height="28" rx="5" fill="#e8590c"/>
<text x="311.6" y="273" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">feed</text>
<rect x="342.4" y="254" width="42.6" height="28" rx="5" fill="#2f3a2b"/>
<text x="363.7" y="273" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">roost</text>
<text x="14" y="304" font-size="15" font-weight="bold" fill="#8b5a2b">Pattern only (65 to 75%).</text>
<text x="14" y="324" font-size="15" fill="#8b5a2b">Weather and season shift it.</text>
</svg>
