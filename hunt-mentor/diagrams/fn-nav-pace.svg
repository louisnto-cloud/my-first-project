<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A measured 100 metre line with footprints along it. Count every time your left foot lands. Measure your count on flat ground, uphill and in brush. A string of beads tracks each 100 metres.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="40" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Know your 100 m</text><line x1="30" y1="140" x2="370" y2="140" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><line x1="30" y1="128" x2="30" y2="152" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><line x1="370" y1="128" x2="370" y2="152" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><text x="200" y="128" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="middle">100 m measured</text><ellipse cx="50" cy="165" rx="7" ry="4" fill="#2f3a2b"/><ellipse cx="77" cy="179" rx="7" ry="4" fill="#2f3a2b"/><ellipse cx="104" cy="165" rx="7" ry="4" fill="#2f3a2b"/><ellipse cx="131" cy="179" rx="7" ry="4" fill="#2f3a2b"/><ellipse cx="158" cy="165" rx="7" ry="4" fill="#2f3a2b"/><ellipse cx="185" cy="179" rx="7" ry="4" fill="#2f3a2b"/><ellipse cx="212" cy="165" rx="7" ry="4" fill="#2f3a2b"/><ellipse cx="239" cy="179" rx="7" ry="4" fill="#2f3a2b"/><ellipse cx="266" cy="165" rx="7" ry="4" fill="#2f3a2b"/><ellipse cx="293" cy="179" rx="7" ry="4" fill="#2f3a2b"/><ellipse cx="320" cy="165" rx="7" ry="4" fill="#2f3a2b"/><ellipse cx="347" cy="179" rx="7" ry="4" fill="#2f3a2b"/><text x="30" y="215" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">Count every time the left foot lands</text><text x="30" y="240" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">Flat, uphill, brush: count each one</text><circle cx="330" cy="60" r="4" fill="#e8590c" stroke="none" stroke-width="2"/><circle cx="330" cy="69" r="4" fill="#e8590c" stroke="none" stroke-width="2"/><circle cx="330" cy="78" r="4" fill="#e8590c" stroke="none" stroke-width="2"/><circle cx="330" cy="87" r="4" fill="#868e96" stroke="none" stroke-width="2"/><circle cx="330" cy="96" r="4" fill="#868e96" stroke="none" stroke-width="2"/><circle cx="330" cy="105" r="4" fill="#868e96" stroke="none" stroke-width="2"/><circle cx="330" cy="114" r="4" fill="#868e96" stroke="none" stroke-width="2"/><circle cx="330" cy="123" r="4" fill="#868e96" stroke="none" stroke-width="2"/><circle cx="330" cy="132" r="4" fill="#868e96" stroke="none" stroke-width="2"/><text x="250" y="170" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start"></text><text x="20" y="280" font-family="sans-serif" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Slide a bead per 100 m</text>
</svg>
