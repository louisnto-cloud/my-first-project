<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="sans-serif" role="img" aria-label="Year chart of a BC duck, general pattern 60 to 80 percent. Wintering on open water: mid November to mid March. Courtship and pairing: October to February. Spring migration: March and April. Nesting and broods: April to July. Drake wing moult, flightless 3 to 4 weeks: June to August. Fall migration: August to late November, peaking in October. Your BC duck seasons fall between September and January; see the Rule Book."><rect width="400" height="290" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">The duck year in BC</text><text x="139.0" y="50" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">J</text><text x="161.0" y="50" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">F</text><text x="183.0" y="50" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">M</text><text x="205.0" y="50" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A</text><text x="227.0" y="50" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">M</text><text x="249.0" y="50" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">J</text><text x="271.0" y="50" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">J</text><text x="293.0" y="50" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A</text><text x="315.0" y="50" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">S</text><text x="337.0" y="50" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">O</text><text x="359.0" y="50" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">N</text><text x="381.0" y="50" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">D</text><rect x="4" y="60" width="392" height="26" rx="4" fill="#dfe6d3"/><text x="10" y="78" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Winter water</text><rect x="359.0" y="64" width="33.0" height="18" rx="4" fill="#4a7fb0"/><rect x="128" y="64" width="55.0" height="18" rx="4" fill="#4a7fb0"/><rect x="4" y="90" width="392" height="26" rx="4" fill="#eef2e6"/><text x="10" y="108" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Court and pair</text><rect x="326" y="94" width="66" height="18" rx="4" fill="#8b5a2b"/><rect x="128" y="94" width="44" height="18" rx="4" fill="#8b5a2b"/><rect x="4" y="120" width="392" height="26" rx="4" fill="#dfe6d3"/><text x="10" y="138" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Spring move</text><rect x="172" y="124" width="44" height="18" rx="4" fill="#8a9a6b"/><rect x="4" y="150" width="392" height="26" rx="4" fill="#eef2e6"/><text x="10" y="168" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Nest, broods</text><rect x="194" y="154" width="88" height="18" rx="4" fill="#d9a23a"/><rect x="4" y="180" width="392" height="26" rx="4" fill="#dfe6d3"/><text x="10" y="198" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Wing moult</text><rect x="238" y="184" width="66" height="18" rx="4" fill="#b9c2cf"/><rect x="4" y="210" width="392" height="26" rx="4" fill="#eef2e6"/><text x="10" y="228" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Fall move</text><rect x="282" y="214" width="88" height="18" rx="4" fill="#e8590c"/><rect x="4" y="240" width="392" height="26" rx="4" fill="#dfe6d3"/><text x="10" y="258" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Duck seasons</text><rect x="304" y="244" width="88" height="18" rx="4" fill="#2f3a2b"/><rect x="128" y="244" width="22" height="18" rx="4" fill="#2f3a2b"/><text x="200" y="280" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">October: peak passage. Late November: freeze up.</text></svg>
