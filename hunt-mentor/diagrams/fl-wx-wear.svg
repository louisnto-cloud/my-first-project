<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" role="img" aria-label="What to wear by month near Kamloops. October: light base, fleece, shell, light gloves, toque for dawn. November: warm base, puffy, insulated boots, warm gloves, toque, hand warmers.">
  <rect x="0" y="0" width="400" height="270" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">What to pack by month (Tip)</text>
<rect x="10.0" y="46" width="186.0" height="214" rx="10" fill="#dfe6d3" stroke="#e8590c" stroke-width="2"/>
<rect x="10.0" y="46" width="186.0" height="36" rx="10" fill="#e8590c"/>
<text x="103.0" y="70" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">October</text>
<text x="103.0" y="106" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Light base layer</text>
<text x="103.0" y="128" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Fleece</text>
<text x="103.0" y="150" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Rain shell</text>
<text x="103.0" y="172" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Light gloves</text>
<text x="103.0" y="194" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Toque at dawn</text>
<text x="103.0" y="216" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Orange vest</text>
<rect x="204.0" y="46" width="186.0" height="214" rx="10" fill="#dfe6d3" stroke="#8b5a2b" stroke-width="2"/>
<rect x="204.0" y="46" width="186.0" height="36" rx="10" fill="#8b5a2b"/>
<text x="297.0" y="70" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">November</text>
<text x="297.0" y="106" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Warm base layer</text>
<text x="297.0" y="128" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Puffy jacket</text>
<text x="297.0" y="150" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Insulated boots</text>
<text x="297.0" y="172" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Warm gloves</text>
<text x="297.0" y="194" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Toque always</text>
<text x="297.0" y="216" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Hand warmers</text>
</svg>
