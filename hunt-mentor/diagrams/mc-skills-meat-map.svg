<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A simple deer body showing where the meat is: hind quarters, front quarters, backstraps along the top of the spine, rib meat, the neck, and the tenderloins inside under the spine. The edible portions of the neck, ribs, four quarters and loins must come home. Study aid only.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Where the meat is</text><rect x="60" y="90" width="280" height="110" rx="40" fill="#8b5a2b"/><path d="M320 110 L360 70 L380 80 L350 130 Z" fill="#8b5a2b"/><rect x="100" y="130" width="70" height="60" rx="6" fill="#b5651d" stroke="#23261f" stroke-width="1.5"/><text x="135.0" y="165.0" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">hind</text><rect x="250" y="130" width="70" height="60" rx="6" fill="#b5651d" stroke="#23261f" stroke-width="1.5"/><text x="285.0" y="165.0" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">front</text><rect x="130" y="94" width="150" height="22" rx="6" fill="#d98c4a" stroke="#23261f" stroke-width="1.5"/><text x="205.0" y="110.0" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">backstrap</text><rect x="172" y="140" width="70" height="40" rx="6" fill="#c97a3a" stroke="#23261f" stroke-width="1.5"/><text x="207.0" y="165.0" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">ribs</text><rect x="322" y="92" width="30" height="24" rx="6" fill="#c97a3a" stroke="#23261f" stroke-width="1.5"/><text x="337" y="84" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">neck</text><rect x="60" y="216" width="280" height="30" rx="6" fill="#fffaf0" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="236" font-size="14" fill="#23261f" text-anchor="middle">Tenderloins: inside, under the spine</text><text x="200" y="274" font-size="14" fill="#6b4f35" text-anchor="middle">Neck, ribs, four quarters, loins come home (95%)</text><text x="200" y="294" font-size="14" fill="#e8590c" text-anchor="middle">Study aid only. The regulations are the law</text>
</svg>
