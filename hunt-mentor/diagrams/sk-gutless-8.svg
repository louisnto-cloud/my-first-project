<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Seven cloth game bags hang apart from a pole: two front quarters, two hind quarters, loins, neck and ribs. Flip the deer onto the clean hide and repeat on the other side.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">8  Flip onto the hide, do the other side</text><path d="M30 110 q 20 -10 40 0 l -4 80 q -16 8 -32 0 Z" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><line x1="50" y1="96" x2="50" y2="106" stroke="#23261f" stroke-width="2"/><text x="50" y="160" font-size="12" font-weight="bold" text-anchor="middle" fill="#23261f">Front</text><path d="M80 110 q 20 -10 40 0 l -4 80 q -16 8 -32 0 Z" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><line x1="100" y1="96" x2="100" y2="106" stroke="#23261f" stroke-width="2"/><text x="100" y="160" font-size="12" font-weight="bold" text-anchor="middle" fill="#23261f">Front</text><path d="M130 110 q 20 -10 40 0 l -4 80 q -16 8 -32 0 Z" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><line x1="150" y1="96" x2="150" y2="106" stroke="#23261f" stroke-width="2"/><text x="150" y="160" font-size="12" font-weight="bold" text-anchor="middle" fill="#23261f">Hind</text><path d="M180 110 q 20 -10 40 0 l -4 80 q -16 8 -32 0 Z" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><line x1="200" y1="96" x2="200" y2="106" stroke="#23261f" stroke-width="2"/><text x="200" y="160" font-size="12" font-weight="bold" text-anchor="middle" fill="#23261f">Hind</text><path d="M230 110 q 20 -10 40 0 l -4 80 q -16 8 -32 0 Z" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><line x1="250" y1="96" x2="250" y2="106" stroke="#23261f" stroke-width="2"/><text x="250" y="160" font-size="12" font-weight="bold" text-anchor="middle" fill="#23261f">Loins</text><path d="M280 110 q 20 -10 40 0 l -4 80 q -16 8 -32 0 Z" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><line x1="300" y1="96" x2="300" y2="106" stroke="#23261f" stroke-width="2"/><text x="300" y="160" font-size="12" font-weight="bold" text-anchor="middle" fill="#23261f">Neck</text><path d="M330 110 q 20 -10 40 0 l -4 80 q -16 8 -32 0 Z" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><line x1="350" y1="96" x2="350" y2="106" stroke="#23261f" stroke-width="2"/><text x="350" y="160" font-size="12" font-weight="bold" text-anchor="middle" fill="#23261f">Ribs</text><line x1="20" y1="94" x2="380" y2="94" stroke="#6b4f35" stroke-width="4"/><text x="200" y="230" font-size="15" font-weight="bold" text-anchor="middle" fill="#23261f">Every piece in its own game bag.</text><text x="200" y="252" font-size="15" text-anchor="middle" fill="#23261f">Hang them apart, never stacked.</text><text x="200" y="284" font-size="13" text-anchor="middle" fill="#2f3a2b">Head: skull plate, or whole for a disease test</text>
</svg>
