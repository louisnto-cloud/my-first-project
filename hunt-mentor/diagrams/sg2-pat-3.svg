<line x1="110.0" y1="200.0" x2="110.0" y2="172.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="110.0" cy="172.0" r="3" fill="#1F3D2B"/><rect x="59.1" y="199.0" width="101.9" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="110.0" y="216.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">padded rest</text>
