<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A flowchart of six questions in order: is it legal, are you 100 percent sure, is there a backstop, is it in your range, are you steady, is it a good angle and standing still. Any no means pass. All yes: shoot.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Shoot or no shoot?</text><rect x="90" y="40" width="180" height="30" rx="6" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="180" y="61" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Legal?</text><line x1="270" y1="55" x2="310" y2="55" stroke="#e8590c" stroke-width="2"/><polygon points="310.0,55.0 301.0,59.3 301.0,50.7" fill="#e8590c"/><text x="316" y="60" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">No: pass</text><line x1="180" y1="70" x2="180" y2="78" stroke="#2f3a2b" stroke-width="2"/><polygon points="180.0,78.0 175.7,69.0 184.3,69.0" fill="#2f3a2b"/><rect x="90" y="78" width="180" height="30" rx="6" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="180" y="99" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">100% sure?</text><line x1="270" y1="93" x2="310" y2="93" stroke="#e8590c" stroke-width="2"/><polygon points="310.0,93.0 301.0,97.3 301.0,88.7" fill="#e8590c"/><text x="316" y="98" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">No: pass</text><line x1="180" y1="108" x2="180" y2="116" stroke="#2f3a2b" stroke-width="2"/><polygon points="180.0,116.0 175.7,107.0 184.3,107.0" fill="#2f3a2b"/><rect x="90" y="116" width="180" height="30" rx="6" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="180" y="137" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Backstop?</text><line x1="270" y1="131" x2="310" y2="131" stroke="#e8590c" stroke-width="2"/><polygon points="310.0,131.0 301.0,135.3 301.0,126.7" fill="#e8590c"/><text x="316" y="136" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">No: pass</text><line x1="180" y1="146" x2="180" y2="154" stroke="#2f3a2b" stroke-width="2"/><polygon points="180.0,154.0 175.7,145.0 184.3,145.0" fill="#2f3a2b"/><rect x="90" y="154" width="180" height="30" rx="6" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="180" y="175" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">In range?</text><line x1="270" y1="169" x2="310" y2="169" stroke="#e8590c" stroke-width="2"/><polygon points="310.0,169.0 301.0,173.3 301.0,164.7" fill="#e8590c"/><text x="316" y="174" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">No: pass</text><line x1="180" y1="184" x2="180" y2="192" stroke="#2f3a2b" stroke-width="2"/><polygon points="180.0,192.0 175.7,183.0 184.3,183.0" fill="#2f3a2b"/><rect x="90" y="192" width="180" height="30" rx="6" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="180" y="213" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Steady?</text><line x1="270" y1="207" x2="310" y2="207" stroke="#e8590c" stroke-width="2"/><polygon points="310.0,207.0 301.0,211.3 301.0,202.7" fill="#e8590c"/><text x="316" y="212" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">No: pass</text><line x1="180" y1="222" x2="180" y2="230" stroke="#2f3a2b" stroke-width="2"/><polygon points="180.0,230.0 175.7,221.0 184.3,221.0" fill="#2f3a2b"/><rect x="90" y="230" width="180" height="30" rx="6" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="180" y="251" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Good angle, still?</text><line x1="270" y1="245" x2="310" y2="245" stroke="#e8590c" stroke-width="2"/><polygon points="310.0,245.0 301.0,249.3 301.0,240.7" fill="#e8590c"/><text x="316" y="250" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">No: pass</text><rect x="110" y="270" width="140" height="26" rx="6" fill="#2f3a2b"/><text x="180" y="289" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">All yes: shoot</text><line x1="180" y1="260" x2="180" y2="270" stroke="#2f3a2b" stroke-width="2"/><polygon points="180.0,270.0 175.7,261.0 184.3,261.0" fill="#2f3a2b"/>
</svg>
