<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" font-family="sans-serif" role="img" aria-label="Why blood trails dry up: clotting at the wound, fat or hair plugging the hole, a high hit with no exit so blood pools inside, or a gut or muscle hit with little outside bleeding. No blood does not mean no hit.">
<rect x="0" y="0" width="400" height="296" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Why the blood stops</text>
<rect x="16" y="62" width="180" height="88" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="106" y="100" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Clotting</text><text x="106" y="126" font-size="14" fill="#23261f" text-anchor="middle">blood stops at the hole</text><rect x="204" y="62" width="180" height="88" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="294" y="100" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fat or hair plug</text><text x="294" y="126" font-size="14" fill="#23261f" text-anchor="middle">fat slides over the hole</text><rect x="16" y="162" width="180" height="88" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="106" y="200" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">High hit, no exit</text><text x="106" y="226" font-size="14" fill="#23261f" text-anchor="middle">blood pools inside</text><rect x="204" y="162" width="180" height="88" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="294" y="200" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Gut or muscle</text><text x="294" y="226" font-size="14" fill="#23261f" text-anchor="middle">little bleeding outside</text><text x="200" y="284" font-size="15" font-weight="bold" fill="#c62828" text-anchor="middle">No blood does not mean no hit (70%)</text>
</svg>
