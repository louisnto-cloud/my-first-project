<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Flow chart. A white tail hears an odd sound, lifts its head and stares. If it sees motion it stamps or head bobs. If it is still not sure it often circles downwind to smell, which is a hunter tip. When the nose confirms danger it snorts, flags and leaves." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">How a white tail checks a threat</text><rect x="30" y="40" width="200" height="44" rx="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2.5"/><text x="130" y="68" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Ears: odd sound</text><rect x="30" y="100" width="200" height="44" rx="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2.5"/><text x="130" y="128" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Head up, eyes lock on</text><rect x="30" y="160" width="200" height="44" rx="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2.5"/><text x="130" y="188" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Motion? Stamp, bob</text><rect x="30" y="220" width="200" height="44" rx="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2.5"/><text x="130" y="248" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Not sure? Circles</text><line x1="130" y1="84" x2="130" y2="98" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="130.0,98.0 126.1,89.9 133.9,89.9" fill="#e8590c"/><line x1="130" y1="144" x2="130" y2="158" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="130.0,158.0 126.1,149.9 133.9,149.9" fill="#e8590c"/><line x1="130" y1="204" x2="130" y2="218" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="130.0,218.0 126.1,209.9 133.9,209.9" fill="#e8590c"/><rect x="250" y="210" width="140" height="60" rx="10" fill="#fbe3d4" stroke="#e8590c" stroke-width="2.5"/><text x="320" y="236" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Nose confirms:</text><text x="320" y="256" font-size="14" fill="#23261f" text-anchor="middle">snort, flag, gone</text><line x1="232" y1="242" x2="248" y2="242" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="248.0,242.0 239.9,245.9 239.9,238.1" fill="#e8590c"/><text x="320" y="70" font-size="14" fill="#23261f" text-anchor="middle">downwind to</text><text x="320" y="88" font-size="14" fill="#23261f" text-anchor="middle">smell you (Tip)</text><path d="M232 236 C 300 230 330 160 320 98" fill="none" stroke="#8a9a6b" stroke-width="2" stroke-dasharray="5 4"/><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Ears and eyes raise doubt. The nose decides.</text>
</svg>
