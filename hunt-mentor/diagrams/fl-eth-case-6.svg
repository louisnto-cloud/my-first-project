<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Hard call 6: you shot a deer that turns out to be illegal, wrong sex or wrong points. Lean: stop, do not hide it, report it promptly to an officer.">
