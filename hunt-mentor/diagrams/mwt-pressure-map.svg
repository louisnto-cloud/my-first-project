<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Map sketch of one deer home range, drawn as a dashed loop. Hunters, orange dots, cluster near the road and the field. The deer moves from the field to a steep, thick refuge patch that is still inside its home range. Caption: Penn State GPS collared deer hid inside their home range rather than leaving." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" fill="#dfe6d3" opacity=".7"/><text x="200" y="22" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">Opening day: they hide, they do not leave</text><ellipse cx="210" cy="160" rx="170" ry="110" fill="none" stroke="#8b5a2b" stroke-width="3" stroke-dasharray="10 6"/><text x="330" y="270" font-size="15" fill="#8b5a2b" text-anchor="middle" font-weight="bold">Home range</text><path d="M0 230 L400 200" stroke="#9e9e9e" stroke-width="10"/><text x="60" y="250" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Road</text><rect x="110" y="120" width="110" height="60" rx="6" fill="#f1ead0" stroke="#8a9a6b" stroke-width="2"/><text x="165" y="156" font-size="15" fill="#6b4f35" text-anchor="middle" font-weight="bold">Field</text><path d="M270 60 Q 340 70 350 130 Q 320 170 280 140 Q 250 100 270 60 Z" fill="#2f3a2b"/><text x="310" y="112" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Steep,</text><text x="310" y="130" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">thick</text><circle cx="120" cy="210" r="7" fill="#e8590c"/><circle cx="190" cy="200" r="7" fill="#e8590c"/><circle cx="240" cy="196" r="7" fill="#e8590c"/><circle cx="100" cy="110" r="7" fill="#e8590c"/><text x="150" y="104" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Hunters near roads</text><circle cx="190" cy="150" r="8" fill="#8b5a2b" opacity=".5"/><line x1="198" y1="146" x2="272" y2="116" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/><polygon points="272.0,116.0 266.0,122.7 263.0,115.4" fill="#8b5a2b"/><circle cx="300" cy="96" r="8" fill="#8b5a2b"/><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Penn State GPS deer: refuge inside the home range.</text>
</svg>
