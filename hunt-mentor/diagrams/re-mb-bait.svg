<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 449" role="img" aria-label="Cards: Bait, decoys, calls, vehicles. Bait: No hunting within 400 m until the bait has been gone 7 days. Not bait: Standing crops, flooded harvested fields, sheaves, grain spilled by normal farming. Calls: No live birds, no electronic calls. Mouth calls fine (95%, my reading). Vehicles, aircraft: No hunting from or with them. Exception: stationary, authorized mobility impaired hunter. Decoys: No limit on plastic decoys for permit hunters (90%, my reading)." font-family="sans-serif">
<rect x="0" y="0" width="400" height="449" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Bait, decoys, calls, vehicles</text>
<text x="200" y="47" font-size="14" fill="#8b5a2b" text-anchor="middle">s. 1, 6, 36, 39, 40, 69</text>
<rect x="6.0" y="69" width="190.0" height="112" rx="9" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M6.0 97 V78 Q6.0 69 15.0 69 H187.0 Q196.0 69 196.0 78 V97 Z" fill="#c92a2a"/>
<text x="14.0" y="89" font-size="14" font-weight="bold" fill="#ffffff">Bait</text>
<text x="14.0" y="117" font-size="14" fill="#23261f">No hunting within 400 m</text>
<text x="14.0" y="135" font-size="14" fill="#23261f">until the bait has been</text>
<text x="14.0" y="153" font-size="14" fill="#23261f">gone 7 days</text>
<rect x="204.0" y="69" width="190.0" height="112" rx="9" fill="#ffffff" stroke="#8a9a6b" stroke-width="2.5"/>
<path d="M204.0 97 V78 Q204.0 69 213.0 69 H385.0 Q394.0 69 394.0 78 V97 Z" fill="#8a9a6b"/>
<text x="212.0" y="89" font-size="14" font-weight="bold" fill="#ffffff">Not bait</text>
<text x="212.0" y="117" font-size="14" fill="#23261f">Standing crops, flooded</text>
<text x="212.0" y="135" font-size="14" fill="#23261f">harvested fields,</text>
<text x="212.0" y="153" font-size="14" fill="#23261f">sheaves, grain spilled</text>
<text x="212.0" y="171" font-size="14" fill="#23261f">by normal farming</text>
<rect x="6.0" y="189" width="190.0" height="130" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<path d="M6.0 217 V198 Q6.0 189 15.0 189 H187.0 Q196.0 189 196.0 198 V217 Z" fill="#e8590c"/>
<text x="14.0" y="209" font-size="14" font-weight="bold" fill="#ffffff">Calls</text>
<text x="14.0" y="237" font-size="14" fill="#23261f">No live birds, no</text>
<text x="14.0" y="255" font-size="14" fill="#23261f">electronic calls. Mouth</text>
<text x="14.0" y="273" font-size="14" fill="#23261f">calls fine (95%, my</text>
<text x="14.0" y="291" font-size="14" fill="#23261f">reading)</text>
<rect x="204.0" y="189" width="190.0" height="130" rx="9" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M204.0 217 V198 Q204.0 189 213.0 189 H385.0 Q394.0 189 394.0 198 V217 Z" fill="#c92a2a"/>
<text x="212.0" y="209" font-size="14" font-weight="bold" fill="#ffffff">Vehicles, aircraft</text>
<text x="212.0" y="237" font-size="14" fill="#23261f">No hunting from or with</text>
<text x="212.0" y="255" font-size="14" fill="#23261f">them. Exception:</text>
<text x="212.0" y="273" font-size="14" fill="#23261f">stationary, authorized</text>
<text x="212.0" y="291" font-size="14" fill="#23261f">mobility impaired</text>
<text x="212.0" y="309" font-size="14" fill="#23261f">hunter</text>
