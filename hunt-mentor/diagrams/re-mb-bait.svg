<text x="14.0" y="347" font-size="14" font-weight="bold" fill="#ffffff">Decoys</text>
<text x="14.0" y="375" font-size="14" fill="#23261f">No limit on plastic</text>
<text x="14.0" y="393" font-size="14" fill="#23261f">decoys for permit</text>
<text x="14.0" y="411" font-size="14" fill="#23261f">hunters (90%, my</text>
