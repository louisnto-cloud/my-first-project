<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 507" font-family="sans-serif" role="img" aria-label="Migratory bird methods, federal rules sections 1, 6, 36, 39, 40 and 69, as icon cards. Bait: no hunting within 400 metres until the bait has been gone 7 days. Not bait: standing crops, flooded harvested fields, sheaves, and grain spilled by normal farming. Calls: no live birds and no electronic calls; mouth calls are fine (95%, my reading). Decoys: no limit on plastic decoys for permit hunters (90%, my reading). Vehicles and aircraft: no hunting from or with them, except a stationary, authorized mobility impaired hunter.">
