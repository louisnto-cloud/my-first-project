<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="sans-serif" role="img" aria-label="The positions game: four cards, 1 prone, 2 sitting with shooting sticks, 3 kneeling, 4 standing with sticks. Each has a par time to get into position and fire one aimed shot: 60, 45, 30 and 20 seconds. Par times are a Tip; start slow and cut them."><rect x="0" y="0" width="400" height="330" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Game 2: four positions</text><rect x="12" y="44" width="184" height="120" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="106" cy="108" r="7" fill="#1F3D2B"/><path d="M42 116 L100 114" stroke="#1F3D2B" stroke-width="8" stroke-linecap="round"/><line x1="92" y1="110" x2="142" y2="106" stroke="#2B3034" stroke-width="3.5"/><circle cx="30" cy="62" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="67" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><text x="46" y="67" font-size="15" font-weight="bold" text-anchor="start" fill="#1F3D2B">Prone</text><text x="180" y="154" font-size="15" font-weight="bold" text-anchor="end" fill="#FF6A13">60 s</text><rect x="204" y="44" width="184" height="120" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="274" cy="86" r="7" fill="#1F3D2B"/><path d="M268 94 L264 118 L290 118 L294 130" stroke="#1F3D2B" stroke-width="7" fill="none" stroke-linecap="round"/><line x1="264" y1="94" x2="330" y2="88" stroke="#2B3034" stroke-width="3.5"/><line x1="304" y1="90" x2="310" y2="132" stroke="#6E4A2A" stroke-width="3"/><line x1="310" y1="90" x2="304" y2="132" stroke="#6E4A2A" stroke-width="3"/><circle cx="222" cy="62" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="222" y="67" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text><text x="238" y="67" font-size="15" font-weight="bold" text-anchor="start" fill="#1F3D2B">Sitting, sticks</text><text x="372" y="154" font-size="15" font-weight="bold" text-anchor="end" fill="#FF6A13">45 s</text><rect x="12" y="172" width="184" height="120" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="82" cy="206" r="7" fill="#1F3D2B"/><path d="M80 214 L78 240 L68 260 M78 240 L98 242 L100 260" stroke="#1F3D2B" stroke-width="7" fill="none" stroke-linecap="round"/><line x1="72" y1="214" x2="138" y2="208" stroke="#2B3034" stroke-width="3.5"/><circle cx="30" cy="190" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="195" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text><text x="46" y="195" font-size="15" font-weight="bold" text-anchor="start" fill="#1F3D2B">Kneeling</text><text x="180" y="282" font-size="15" font-weight="bold" text-anchor="end" fill="#FF6A13">30 s</text><rect x="204" y="172" width="184" height="120" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="274" cy="204" r="7" fill="#1F3D2B"/><path d="M274 212 L274 244 L266 272 M274 244 L282 272" stroke="#1F3D2B" stroke-width="7" fill="none" stroke-linecap="round"/><line x1="264" y1="210" x2="330" y2="206" stroke="#2B3034" stroke-width="3.5"/><line x1="308" y1="208" x2="300" y2="272" stroke="#6E4A2A" stroke-width="3"/><line x1="312" y1="208" x2="320" y2="272" stroke="#6E4A2A" stroke-width="3"/><circle cx="222" cy="190" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="222" y="195" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4</text><text x="238" y="195" font-size="15" font-weight="bold" text-anchor="start" fill="#1F3D2B">Standing, sticks</text><text x="372" y="282" font-size="15" font-weight="bold" text-anchor="end" fill="#FF6A13">20 s</text><text x="200" y="318" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">Par times are a Tip: start slow, then cut them.</text></svg>
