<text x="14" y="315" font-size="15" fill="#2f3a2b"><tspan fill="#2f3a2b" font-weight="bold">Paper: </tspan><tspan fill="#b3261e" font-weight="bold">red</tspan><tspan fill="#2f3a2b"> = Mar 31 expire, </tspan><tspan fill="#2f3a2b" font-weight="bold">dark</tspan><tspan fill="#2f3a2b"> = Apr 1 new</tspan></text>
<text x="14" y="336" font-size="15" fill="#2f3a2b"><tspan fill="#2f3a2b" font-weight="bold">Range: </tspan><tspan fill="#2f3a2b">zero Jun, confirm Aug</tspan></text>
<text x="14" y="357" font-size="15" fill="#2f3a2b"><tspan fill="#2f3a2b" font-weight="bold">Review: </tspan><tspan fill="#2f3a2b">Dec, Jan</tspan></text>
<text x="14" y="382" font-size="15" font-weight="bold" fill="#6b5b4b">Deadlines: 99%. Timing of tasks: Tip</text>
</svg>
