<text x="326.7" y="54" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">O</text>
<text x="352" y="54" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">N</text>
<text x="377.3" y="54" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">D</text>
<rect x="86" y="64" width="304" height="30" rx="5" fill="#ece5d3"/>
<text x="14" y="84" font-size="16" font-weight="bold" fill="#2f3a2b">Paper</text>
