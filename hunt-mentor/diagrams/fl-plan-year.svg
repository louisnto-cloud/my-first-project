<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 398" font-family="sans-serif" role="img" aria-label="A year planner, January to December. Paperwork: licences expire 31 March (red), new licences from 1 April (dark), LEH (Limited Entry Hunting) applications in May and June. Training: a 12 week block from July to September. Range: zero in June, confirm in August. Scouting: maps in January and February, sheds in March and April, glassing June to August. Hunt: seasons September to December. Review: January and December. Deadlines are 99 percent; the timing of tasks is a Tip.">
<rect width="400" height="398" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A year on one page</text>
