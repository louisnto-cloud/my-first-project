<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Duck social year, 75 percent. October to November: courtship peaks and drakes display. Early December: over 8 in 10 mallard hens are paired in a wintering study. Spring: the pair flies north and the hen picks the nest. Incubation: the drake leaves within days. Summer: the hen raises the brood alone. Ducks you shoot in fall are often pairs, a tip."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Duck social year (75%)</text><rect x="10" y="38" width="380" height="42" rx="8" fill="#dfe6d3"/><rect x="10" y="38" width="118" height="42" rx="8" fill="#8b5a2b"/><text x="69" y="65" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Oct to Nov</text><text x="260" y="65" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Courtship peaks, drakes display</text><rect x="10" y="86" width="380" height="42" rx="8" fill="#eef2e6"/><rect x="10" y="86" width="118" height="42" rx="8" fill="#8b5a2b"/><text x="69" y="113" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Early Dec</text><text x="260" y="113" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Over 8 in 10 mallard hens paired</text><rect x="10" y="134" width="380" height="42" rx="8" fill="#dfe6d3"/><rect x="10" y="134" width="118" height="42" rx="8" fill="#8a9a6b"/><text x="69" y="161" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Spring</text><text x="260" y="161" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Pair flies north; hen picks the nest</text><rect x="10" y="182" width="380" height="42" rx="8" fill="#eef2e6"/><rect x="10" y="182" width="118" height="42" rx="8" fill="#8a9a6b"/><text x="69" y="209" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Incubation</text><text x="260" y="209" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Drake leaves within days</text><rect x="10" y="230" width="380" height="42" rx="8" fill="#dfe6d3"/><rect x="10" y="230" width="118" height="42" rx="8" fill="#8a9a6b"/><text x="69" y="257" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Summer</text><text x="260" y="257" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Hen raises the brood alone</text><text x="200" y="292" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Ducks you shoot in fall are often pairs (Tip)</text></svg>
