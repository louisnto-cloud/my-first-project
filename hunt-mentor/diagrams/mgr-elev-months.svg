<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Line chart of elevation by month, a general pattern drawn from BC atlas ranges, not tracking data. Dusky grouse: low on breeding ground in April to July around 1,100 metres, then uphill through fall to dense conifers near 1,900 metres all winter. Ruffed grouse: stay at about the same height all year, around 1,000 metres. White tailed ptarmigan: high all year, dropping a little toward treeline in winter." font-family="sans-serif">
