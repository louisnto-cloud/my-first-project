<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Topo sketch of a spur. A main ridge runs across the top. Below it the contour lines push down in a tongue of U shapes pointing downhill, with an orange dashed line along the spine of the spur. Draws sit on each side.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Spur</text><text x="388" y="24" font-size="15" fill="#2f3a2b" text-anchor="end">Topo map</text><rect x="0" y="36" width="400" height="232" fill="#dfe6d3" opacity=".6"/>
  <g fill="none" stroke="#8b5a2b" stroke-width="2.3">
    <path d="M0 70 C 120 64, 280 64, 400 70"/>
    <path d="M0 100 C 100 96, 160 100, 185 130 C 195 150, 205 150, 215 130 C 240 100, 300 96, 400 100"/>
    <path d="M0 140 C 100 136, 150 140, 178 180 C 192 206, 208 206, 222 180 C 250 140, 300 136, 400 140"/>
    <path d="M0 180 C 100 178, 140 184, 170 226 C 188 252, 212 252, 230 226 C 260 184, 300 178, 400 180"/>
  </g>
  <path d="M200 70 C 200 130, 200 190, 200 246" stroke="#e8590c" stroke-width="3" stroke-dasharray="6 5" fill="none"/>
  <text x="16" y="60" font-size="15" font-weight="bold" fill="#2f3a2b" stroke="#ecefe4" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">main ridge</text><text x="30" y="130" font-size="16" font-weight="bold" fill="#2c5d86" stroke="#ecefe4" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">draw</text><text x="330" y="130" font-size="16" font-weight="bold" fill="#2c5d86" stroke="#ecefe4" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">draw</text>
  <rect x="252.0" y="230.0" width="47.9" height="29.0" rx="5" fill="#fffaf0" stroke="#e8590c" stroke-width="1.2"/>
<text x="275.949" y="250.5" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">spur</text>
  <text x="200" y="292" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Tongue of Us pointing downhill, off the ridge</text>
<line x1="206" y1="252" x2="252" y2="244" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="206" cy="252" r="2.6" fill="#2f3a2b"/>
</svg>
