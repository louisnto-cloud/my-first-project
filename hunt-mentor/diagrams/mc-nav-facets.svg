<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="The six FACETS heuristic traps found in avalanche accidents, with a hunter example each: Familiarity, I know this hill; Acceptance, do not look weak; Consistency, came this far; Expert halo, he knows best; Scarcity, last day; Social facilitation, others went. Source McCammon via avalanche.org, 80 percent. Hunter examples are Tip.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Six traps in your head</text><rect x="20.0" y="42.0" width="175.0" height="72.0" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="107.5" y="75.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">F Familiarity</text><text x="107.5" y="94.0" font-size="14" fill="#23261f" text-anchor="middle">&quot;I know this hill&quot;</text><rect x="205.0" y="42.0" width="175.0" height="72.0" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="292.5" y="75.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A Acceptance</text><text x="292.5" y="94.0" font-size="14" fill="#23261f" text-anchor="middle">&quot;Don&#x27;t look weak&quot;</text><rect x="20.0" y="122.0" width="175.0" height="72.0" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="107.5" y="155.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">C Consistency</text><text x="107.5" y="174.0" font-size="14" fill="#23261f" text-anchor="middle">&quot;Came this far&quot;</text><rect x="205.0" y="122.0" width="175.0" height="72.0" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="292.5" y="155.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">E Expert halo</text><text x="292.5" y="174.0" font-size="14" fill="#23261f" text-anchor="middle">&quot;He knows best&quot;</text><rect x="20.0" y="202.0" width="175.0" height="72.0" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="107.5" y="235.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">T Scarcity</text><text x="107.5" y="254.0" font-size="14" fill="#23261f" text-anchor="middle">&quot;Last day!&quot;</text><rect x="205.0" y="202.0" width="175.0" height="72.0" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="292.5" y="235.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">S Social</text><text x="292.5" y="254.0" font-size="14" fill="#23261f" text-anchor="middle">&quot;Others went&quot;</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">FACETS, McCammon via avalanche.org (80%)</text>
</svg>
