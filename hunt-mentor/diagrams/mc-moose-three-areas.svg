<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three cards. Heffley Creek, Region 3: moose live on the plateaus, not the dry valley; MUs 3-27 and 3-28 have a spike fork bull season 1 to 15 November; about 8 percent of hunters succeed. Fraser Valley, Region 2: 70 to 100 moose in the whole region, no general open season. South Okanagan, Region 8: 4,000 to 5,000 moose in the region, spike fork bulls 1 to 15 November.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Your three areas</text><rect x="12" y="38" width="376" height="100" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="24" y="58" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Heffley Creek, Region 3</text><text x="24" y="78" font-size="14" fill="#23261f" text-anchor="start">Plateaus, not the dry valley</text><text x="24" y="96" font-size="14" fill="#23261f" text-anchor="start">MU 3-27 and 3-28: spike fork</text><text x="24" y="114" font-size="14" fill="#23261f" text-anchor="start">bulls, 1 to 15 Nov</text><text x="24" y="132" font-size="14" fill="#23261f" text-anchor="start">About 8% of hunters succeed</text><rect x="12" y="146" width="376" height="64" rx="8" fill="#e3e8ef" stroke="#8a9a6b" stroke-width="2"/><text x="24" y="166" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Fraser Valley, Region 2</text><text x="24" y="186" font-size="14" fill="#23261f" text-anchor="start">70 to 100 moose in the region</text><text x="24" y="204" font-size="14" fill="#23261f" text-anchor="start">No general open season</text><rect x="12" y="218" width="376" height="64" rx="8" fill="#f3e3d3" stroke="#8a9a6b" stroke-width="2"/><text x="24" y="238" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">South Okanagan, Region 8</text><text x="24" y="258" font-size="14" fill="#23261f" text-anchor="start">4,000 to 5,000 in the region</text><text x="24" y="276" font-size="14" fill="#23261f" text-anchor="start">Spike fork bulls, 1 to 15 Nov</text>
</svg>
