<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 364" font-family="sans-serif" role="img" aria-label="Four spring displays. Ruffed grouse: drums on a log at dawn from March to May, and a little again in fall. Spruce grouse: struts with red combs up and tail fanned, makes a short flight and two loud wing claps. Dusky and sooty grouse: deep hoots with neck air sacs showing; the sooty hoots from high in a conifer. Sharp tailed grouse: dances on a lek at dawn, stamping its feet, rattling its tail and showing pink neck sacs.">
<rect width="400" height="364" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Spring shows: 4 grouse, 4 acts</text>
<rect x="8" y="40" width="188" height="152" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
<text x="18" y="64" font-size="16" font-weight="bold" fill="#c2410c">Ruffed: drums</text>
<g transform="translate(148 96) scale(0.82)"><polygon points="-20,-6 -38,-20 -48,-12 -52,0 -48,8 -20,8" fill="#6b4f35"/><path d="M-40 -18 Q-50 -10 -48 6" fill="none" stroke="#23261f" stroke-width="3"/><ellipse cx="0" cy="0" rx="26" ry="15" fill="#9a6b45"/><circle cx="21" cy="-14" r="8" fill="#9a6b45"/><polygon points="16,-20 20,-28 25,-20" fill="#9a6b45"/><polygon points="28,-16 35,-13 28,-10" fill="#6b4f35"/><circle cx="23" cy="-16" r="1.8" fill="#23261f"/><path d="M2 13 l-2 11 M10 13 l2 11" stroke="#6b4f35" stroke-width="2.5" fill="none"/></g>
<text x="18" y="132" font-size="15" fill="#2f3a2b">On a log at dawn,</text>
<text x="18" y="152" font-size="15" fill="#2f3a2b">March to May.</text>
<text x="18" y="172" font-size="15" fill="#2f3a2b">A little in fall.</text>
<rect x="204" y="40" width="188" height="152" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
<text x="214" y="64" font-size="16" font-weight="bold" fill="#c2410c">Spruce: struts</text>
<g transform="translate(344 96) scale(0.82)"><polygon points="-22,-4 -36,-8 -36,4 -22,6" fill="#23261f"/><ellipse cx="0" cy="0" rx="26" ry="15" fill="#3d3a35"/><circle cx="21" cy="-14" r="8" fill="#3d3a35"/><path d="M18 -20 q5 -5 10 0" fill="none" stroke="#c23b22" stroke-width="3"/><polygon points="28,-16 35,-13 28,-10" fill="#6b4f35"/><circle cx="23" cy="-16" r="1.8" fill="#23261f"/><path d="M2 13 l-2 11 M10 13 l2 11" stroke="#6b4f35" stroke-width="2.5" fill="none"/></g>
<text x="214" y="132" font-size="15" fill="#2f3a2b">Red combs up,</text>
<text x="214" y="152" font-size="15" fill="#2f3a2b">tail fanned, short</text>
<text x="214" y="172" font-size="15" fill="#2f3a2b">flight, 2 wing claps.</text>
<rect x="8" y="200" width="188" height="152" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
<text x="18" y="224" font-size="16" font-weight="bold" fill="#c2410c">Dusky, sooty: hoots</text>
<g transform="translate(148 256) scale(0.82)"><polygon points="-22,-4 -50,-10 -50,4 -22,7" fill="#23261f"/><ellipse cx="0" cy="0" rx="26" ry="15" fill="#5d6670"/><circle cx="21" cy="-14" r="8" fill="#5d6670"/><path d="M18 -20 q5 -5 10 0" fill="none" stroke="#e3a21a" stroke-width="3"/><polygon points="28,-16 35,-13 28,-10" fill="#6b4f35"/><circle cx="23" cy="-16" r="1.8" fill="#23261f"/><path d="M2 13 l-2 11 M10 13 l2 11" stroke="#6b4f35" stroke-width="2.5" fill="none"/></g>
<text x="18" y="292" font-size="15" fill="#2f3a2b">Deep hoots, neck</text>
<text x="18" y="312" font-size="15" fill="#2f3a2b">sacs show. Sooty:</text>
<text x="18" y="332" font-size="15" fill="#2f3a2b">high in a conifer.</text>
<rect x="204" y="200" width="188" height="152" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
<text x="214" y="224" font-size="16" font-weight="bold" fill="#c2410c">Sharp tail: dances</text>
<g transform="translate(344 256) scale(0.82)"><polygon points="-22,-3 -48,-2 -22,6" fill="#6b4f35"/><ellipse cx="0" cy="0" rx="26" ry="15" fill="#b89a74"/><circle cx="21" cy="-14" r="8" fill="#b89a74"/><polygon points="28,-16 35,-13 28,-10" fill="#6b4f35"/><circle cx="23" cy="-16" r="1.8" fill="#23261f"/><path d="M2 13 l-2 11 M10 13 l2 11" stroke="#6b4f35" stroke-width="2.5" fill="none"/></g>
<text x="214" y="292" font-size="15" fill="#2f3a2b">On a lek at dawn.</text>
<text x="214" y="312" font-size="15" fill="#2f3a2b">Stamp, rattle tail,</text>
<text x="214" y="332" font-size="15" fill="#2f3a2b">pink neck sacs.</text>
</svg>
