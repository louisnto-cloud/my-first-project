<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two deer with rings around them. A park deer has small rings: it watches you, then runs only when you are close. A hunted deer has much bigger rings: it notices and runs from farther away. Pattern from a 2008 review of hoofed animals.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Hunted deer run sooner (pattern)</text><circle cx="105" cy="150" r="52" fill="#8a9a6b" opacity=".3"/><circle cx="105" cy="150" r="30" fill="#e8590c" opacity=".35"/><g transform="translate(107 160) scale(0.300 0.300)"><rect x="-36" y="-40" width="6" height="40" rx="3" fill="#8b5a2b"/><rect x="10" y="-40" width="6" height="40" rx="3" fill="#8b5a2b"/><ellipse cx="-12" cy="-52" rx="34" ry="16" fill="#8b5a2b"/><rect x="-30" y="-44" width="6" height="44" rx="3" fill="#8b5a2b"/><rect x="16" y="-44" width="6" height="44" rx="3" fill="#8b5a2b"/><path d="M12 -60 L26 -84 L36 -80 L26 -52 Z" fill="#8b5a2b"/><ellipse cx="38" cy="-84" rx="13" ry="7" fill="#8b5a2b"/><path d="M28 -88 L18 -102 L32 -92 Z" fill="#8b5a2b"/><path d="M31 -89 L27 -104 L38 -92 Z" fill="#8b5a2b"/><circle cx="49" cy="-84" r="2" fill="#23261f"/><ellipse cx="-44" cy="-54" rx="5" ry="9" fill="#f4efe2"/><path d="M-46 -54 L-50 -40" stroke="#23261f" stroke-width="3" stroke-linecap="round"/></g><text x="105" y="272" font-size="16" fill="#23261f" text-anchor="middle" font-weight="bold">Park deer</text><circle cx="295" cy="150" r="92" fill="#8a9a6b" opacity=".3"/><circle cx="295" cy="150" r="52" fill="#e8590c" opacity=".35"/><g transform="translate(297 160) scale(0.300 0.300)"><rect x="-36" y="-40" width="6" height="40" rx="3" fill="#8b5a2b"/><rect x="10" y="-40" width="6" height="40" rx="3" fill="#8b5a2b"/><ellipse cx="-12" cy="-52" rx="34" ry="16" fill="#8b5a2b"/><rect x="-30" y="-44" width="6" height="44" rx="3" fill="#8b5a2b"/><rect x="16" y="-44" width="6" height="44" rx="3" fill="#8b5a2b"/><path d="M12 -60 L26 -84 L36 -80 L26 -52 Z" fill="#8b5a2b"/><ellipse cx="38" cy="-84" rx="13" ry="7" fill="#8b5a2b"/><path d="M28 -88 L18 -102 L32 -92 Z" fill="#8b5a2b"/><path d="M31 -89 L27 -104 L38 -92 Z" fill="#8b5a2b"/><circle cx="49" cy="-84" r="2" fill="#23261f"/><ellipse cx="-44" cy="-54" rx="5" ry="9" fill="#f4efe2"/><path d="M-46 -54 L-50 -40" stroke="#23261f" stroke-width="3" stroke-linecap="round"/></g><text x="295" y="272" font-size="16" fill="#23261f" text-anchor="middle" font-weight="bold">Hunted deer</text><rect x="20" y="40" width="14" height="14" fill="#8a9a6b"/><text x="40" y="52" font-size="14" fill="#23261f" text-anchor="start">watches you</text><rect x="170" y="40" width="14" height="14" fill="#e8590c" opacity=".6"/><text x="190" y="52" font-size="14" fill="#23261f" text-anchor="start">runs</text><text x="200" y="294" font-size="14" fill="#6b4f35" text-anchor="middle">Stankowich 2008 review (65%)</text>
</svg>
