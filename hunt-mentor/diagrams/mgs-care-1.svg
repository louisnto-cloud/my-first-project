<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Field care step 1: wear gloves and clean the bird outdoors, 80 percent, for bird flu safety. A fully feathered wing or the head stays on until the bird is preserved, 99 percent.">
