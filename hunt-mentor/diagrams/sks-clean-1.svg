<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Cleaning step 1: the bore. A rod with a brush runs back and forth through the barrel. Wet patches first with a water based cleaner, brush several passes, then dry patches until they come out clean.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<circle cx="26.0" cy="22.0" r="13" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="26.0" y="27.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="46.0" y="28.0" font-size="17" font-weight="bold" fill="#1F3D2B" text-anchor="start">Bore: wet, brush, dry</text><rect x="40.0" y="110.0" width="320.0" height="18.0" rx="0" fill="#3A403C" stroke="#17201A" stroke-width="1.5"/><line x1="10.0" y1="119.0" x2="300.0" y2="119.0" stroke="#8E9690" stroke-width="4" stroke-linecap="round"/><rect x="290.0" y="112.0" width="30.0" height="14.0" rx="0" fill="#C9A227" stroke="#17201A" stroke-width="1"/><line x1="120.0" y1="90.0" x2="254.0" y2="90.0" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><polygon points="260.0,90.0 249.2,95.2 249.2,84.8" fill="#FF6A13" stroke="#FF6A13" stroke-width="1" stroke-linejoin="round"/><line x1="260.0" y1="150.0" x2="126.0" y2="150.0" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><polygon points="120.0,150.0 130.8,144.8 130.8,155.2" fill="#FF6A13" stroke="#FF6A13" stroke-width="1" stroke-linejoin="round"/><text x="200.0" y="196.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Wet patches first: water based cleaner.</text><text x="200.0" y="218.0" font-size="14" fill="#17201A" text-anchor="middle">Brush several passes. Dry patches</text><text x="200.0" y="238.0" font-size="14" fill="#17201A" text-anchor="middle">until they come out clean.</text>
</svg>
