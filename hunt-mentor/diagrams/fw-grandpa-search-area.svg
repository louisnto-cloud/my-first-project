<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Why a trip plan matters. If nobody knows your route, searchers must cover a circle. 3 kilometres off your planned route means about 28 square kilometres to search. 10 kilometres means about 314 square kilometres. Leave a plan and the circle shrinks.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
  <circle cx="150" cy="160" r="128" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
  <circle cx="150" cy="160" r="38" fill="#e8590c" opacity="0.85"/>
  <circle cx="150" cy="160" r="5" fill="#2f3a2b"/>
  <line x1="150" y1="160" x2="188" y2="160" stroke="#2f3a2b" stroke-width="2"/>
  <line x1="150" y1="160" x2="150" y2="32" stroke="#2f3a2b" stroke-width="2" stroke-dasharray="5 4"/>
  <g font-family="sans-serif" font-size="14" fill="#23261f">
    <text x="156" y="100">10 km</text>
    <text x="156" y="154" fill="#ffffff" font-weight="bold">3 km</text>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#23261f">
    <text x="290" y="120" font-weight="bold" fill="#e8590c">3 km off:</text>
    <text x="290" y="140">28 km2</text>
    <text x="290" y="190" font-weight="bold" fill="#2f3a2b">10 km off:</text>
    <text x="290" y="210">314 km2</text>
  </g>
  <text x="200" y="20" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">No trip plan: searchers cover a circle</text>
</svg>
