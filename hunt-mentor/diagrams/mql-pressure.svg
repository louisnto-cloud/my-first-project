<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pressure teaches them:</text>
<text x="200" y="48" font-size="18" font-weight="bold" fill="#c2410c" text-anchor="middle">each flush is farther</text>
