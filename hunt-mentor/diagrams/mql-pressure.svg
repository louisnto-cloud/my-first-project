<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 392" font-family="sans-serif" role="img" aria-label="Top view of a field with rings around a hunter. The first flush is close, the second flush is farther, the third farther still. Washington Fish and Wildlife says gray partridge, Huns, flush farther on the 2nd and 3rd approach, and pressured quail near trees may fly up and perch, 75 percent. So: make the first chance count, 75 percent.">
