<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Track notebook card with 8 lines: date, time and weather; place pin; ground type; length and width of the front print; step or stride and which one you measured; straddle; pattern and gait; animal and how sure you are.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">One line per fact</text>
<rect x="30" y="60" width="340" height="228" rx="8" fill="#fff" stroke="#23261f" stroke-width="1.5"/><text x="46" y="86" font-size="15" fill="#23261f" text-anchor="start">Date, time, weather</text><line x1="46" y1="92" x2="354" y2="92" stroke="#dfe6d3" stroke-width="1.5"/><text x="46" y="112" font-size="15" fill="#23261f" text-anchor="start">Place (pin)</text><line x1="46" y1="118" x2="354" y2="118" stroke="#dfe6d3" stroke-width="1.5"/><text x="46" y="138" font-size="15" fill="#23261f" text-anchor="start">Ground: mud, snow, dust</text><line x1="46" y1="144" x2="354" y2="144" stroke="#dfe6d3" stroke-width="1.5"/><text x="46" y="164" font-size="15" fill="#23261f" text-anchor="start">Length x width (front)</text><line x1="46" y1="170" x2="354" y2="170" stroke="#dfe6d3" stroke-width="1.5"/><text x="46" y="190" font-size="15" fill="#23261f" text-anchor="start">Step or stride (which?)</text><line x1="46" y1="196" x2="354" y2="196" stroke="#dfe6d3" stroke-width="1.5"/><text x="46" y="216" font-size="15" fill="#23261f" text-anchor="start">Straddle</text><line x1="46" y1="222" x2="354" y2="222" stroke="#dfe6d3" stroke-width="1.5"/><text x="46" y="242" font-size="15" fill="#23261f" text-anchor="start">Pattern and gait</text><line x1="46" y1="248" x2="354" y2="248" stroke="#dfe6d3" stroke-width="1.5"/><text x="46" y="268" font-size="15" fill="#23261f" text-anchor="start">Animal and confidence %</text><line x1="46" y1="274" x2="354" y2="274" stroke="#dfe6d3" stroke-width="1.5"/>
</svg>
