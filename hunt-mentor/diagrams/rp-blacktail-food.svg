<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="What coast black tailed deer eat. Winter and early spring: Douglas fir, western redcedar, red huckleberry, salal, deer fern and lichens that grow on trees. Late spring to fall: grasses and other herbs, trailing blackberry, fireweed, pearly everlasting, and the leaves of willow, maple, salmonberry and salal.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">What coast black tails eat</text><rect x="10" y="40" width="185" height="230" rx="8" fill="#e8eef3" stroke="#4a7fb0" stroke-width="2"/><rect x="205" y="40" width="185" height="230" rx="8" fill="#eef2e4" stroke="#8a9a6b" stroke-width="2"/><text x="102" y="62" font-size="15" fill="#4a7fb0" text-anchor="middle" font-weight="bold">Winter, early spring</text><text x="297" y="62" font-size="15" fill="#4f6b3a" text-anchor="middle" font-weight="bold">Late spring to fall</text><text x="102" y="92" font-size="14" fill="#2f3a2b" text-anchor="middle">Douglas fir</text><text x="102" y="118" font-size="14" fill="#2f3a2b" text-anchor="middle">western redcedar</text><text x="102" y="144" font-size="14" fill="#2f3a2b" text-anchor="middle">red huckleberry</text><text x="102" y="170" font-size="14" fill="#2f3a2b" text-anchor="middle">salal</text><text x="102" y="196" font-size="14" fill="#2f3a2b" text-anchor="middle">deer fern</text><text x="102" y="222" font-size="14" fill="#2f3a2b" text-anchor="middle">tree lichens</text><text x="297" y="92" font-size="14" fill="#2f3a2b" text-anchor="middle">grasses, forbs</text><text x="297" y="118" font-size="14" fill="#2f3a2b" text-anchor="middle">trailing blackberry</text><text x="297" y="144" font-size="14" fill="#2f3a2b" text-anchor="middle">fireweed</text><text x="297" y="170" font-size="14" fill="#2f3a2b" text-anchor="middle">pearly everlasting</text><text x="297" y="196" font-size="14" fill="#2f3a2b" text-anchor="middle">willow, maple leaves</text><text x="297" y="222" font-size="14" fill="#2f3a2b" text-anchor="middle">salmonberry, salal</text><text x="200.0" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">BC Ministry of Environment (85%)</text>
</svg>
