<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Map view of an inside corner where timber meets grass, marked orange. A hunter sits in the open about 100 to 200 m from the corner, with a clear view of it. The wind blows from the corner toward the hunter, and the low evening sun is at the hunter's back. Three checks: view of the corner, wind from the corner to you, sun at your back.">
