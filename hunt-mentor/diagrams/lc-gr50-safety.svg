<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 624" font-family="sans-serif" role="img" aria-label="Safety: rules 1 to 10. Rule 1: Loaded until you prove it. Rule 2: Muzzle at dirt or sky. Rule 3: Finger out until sights on hair. Rule 4: Unload before truck, boat, fence. Also law. Rule 5: Know your backstop. Rule 6: 100 m from houses, 15 m off road. Also law. Rule 7: Wear bright in and out. Rule 8: Leave a trip plan. Rule 9: Cold, wet, tired: turn around. Rule 10: No drink until guns are cased. Rules without the law badge are wisdom, not law.">
<rect width="400" height="624" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Safety: rules 1 to 10</text>
<rect x="8" y="42" width="384" height="50" rx="7" fill="#f4eedf"/>
<circle cx="30" cy="67.0" r="15" fill="#6b4f35"/><text x="30" y="72" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">1</text>
<g transform="translate(72 67.0) scale(0.8)"><path d="M-22 4 L-6 0 L20 -2 L20 2 L-4 6 L-10 12 L-22 12 Z" fill="#8b5a2b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -2 h12" stroke="#2f3a2b" stroke-width="4"/></g>
<text x="104" y="73" font-size="16" font-weight="bold" fill="#2f3a2b">Loaded until you prove it</text>
<circle cx="30" cy="121.0" r="15" fill="#6b4f35"/><text x="30" y="126" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text>
<g transform="translate(72 121.0) scale(0.8)"><path d="M-22 16 L-6 -12 L2 2 L8 -6 L22 16 Z" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-10 -5 L-6 -12 L-2 -5 Z" fill="#fff"/></g>
<text x="104" y="127" font-size="16" font-weight="bold" fill="#2f3a2b">Muzzle at dirt or sky</text>
<rect x="8" y="150" width="384" height="50" rx="7" fill="#f4eedf"/>
<circle cx="30" cy="175.0" r="15" fill="#6b4f35"/><text x="30" y="180" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">3</text>
<g transform="translate(72 175.0) scale(0.8)"><path d="M-10 18 V-2 M-10 -2 V-14 Q-6 -18 -3 -14 V-4 V-18 Q0 -22 3 -18 V-4 V-16 Q6 -20 9 -16 V2 L14 -6 Q19 -6 16 2 L6 18 Z" fill="#f2d6c0" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="104" y="181" font-size="16" font-weight="bold" fill="#2f3a2b">Finger out until sights on hair</text>
<rect x="8" y="204" width="384" height="50" rx="7" fill="#eef3f8" stroke="#4a7fb0" stroke-width="1.6"/>
<circle cx="30" cy="229.0" r="15" fill="#6b4f35"/><text x="30" y="234" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">4</text>
<g transform="translate(72 229.0) scale(0.8)"><rect x="-22" y="-6" width="26" height="16" rx="2" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 -2 h10 l6 6 v6 h-16 z" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-12" cy="12" r="5" fill="#2f3a2b"/><circle cx="12" cy="12" r="5" fill="#2f3a2b"/></g>
<text x="104" y="225" font-size="16" font-weight="bold" fill="#2f3a2b">Unload before truck, boat,</text>
<text x="104" y="245" font-size="16" font-weight="bold" fill="#2f3a2b">fence</text>
<rect x="334" y="217.0" width="50" height="24" rx="12" fill="#4a7fb0"/><text x="359" y="234" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">LAW</text>
<rect x="8" y="258" width="384" height="50" rx="7" fill="#f4eedf"/>
<circle cx="30" cy="283.0" r="15" fill="#6b4f35"/><text x="30" y="288" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">5</text>
<g transform="translate(72 283.0) scale(0.8)"><circle r="16" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -20 V-6 M0 6 V20 M-20 0 H-6 M6 0 H20" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="104" y="289" font-size="16" font-weight="bold" fill="#2f3a2b">Know your backstop</text>
