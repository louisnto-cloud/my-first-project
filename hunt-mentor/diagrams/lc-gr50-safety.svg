<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 536" font-family="sans-serif" role="img" aria-label="Safety: rules 1 to 10. Rule 1: Loaded until you prove it. Rule 2: Muzzle at dirt or sky. Rule 3: Finger out until sights on hair. Rule 4: Unload before truck, boat, fence. Also law. Rule 5: Know your backstop. Rule 6: 100 m from houses, 15 m off road. Also law. Rule 7: Wear bright in and out. Rule 8: Leave a trip plan. Rule 9: Cold, wet, tired: turn around. Rule 10: No drink until guns are cased. Rules without the law badge are wisdom, not law.">
