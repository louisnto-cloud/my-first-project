<circle cx="30" cy="337.0" r="15" fill="#6b4f35"/><text x="30" y="342" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">6</text>
<g transform="translate(72 337.0) scale(0.8)"><path d="M-18 -2 L0 -18 L18 -2" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-14" y="-4" width="28" height="22" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-4" y="6" width="8" height="12" fill="#8b5a2b"/></g>
<text x="104" y="333" font-size="16" font-weight="bold" fill="#2f3a2b">100 m from houses, 15 m</text>
<text x="104" y="353" font-size="16" font-weight="bold" fill="#2f3a2b">off road</text>
<rect x="334" y="325.0" width="50" height="24" rx="12" fill="#4a7fb0"/><text x="359" y="342" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">LAW</text>
<rect x="8" y="366" width="384" height="50" rx="7" fill="#f4eedf"/>
<circle cx="30" cy="391.0" r="15" fill="#6b4f35"/><text x="30" y="396" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">7</text>
<g transform="translate(72 391.0) scale(0.8)"><circle cx="0" cy="-12" r="7" fill="#2f3a2b"/><path d="M-10 18 V2 Q0 -6 10 2 V18 Z" fill="#e8590c"/></g>
<text x="104" y="397" font-size="16" font-weight="bold" fill="#2f3a2b">Wear bright in and out</text>
<circle cx="30" cy="445.0" r="15" fill="#6b4f35"/><text x="30" y="450" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">8</text>
<g transform="translate(72 445.0) scale(0.8)"><path d="M-14 -18 H8 L16 -10 V18 H-14 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -6 H10 M-8 2 H10 M-8 10 H4" stroke="#8a9a6b" stroke-width="2.5"/></g>
<text x="104" y="451" font-size="16" font-weight="bold" fill="#2f3a2b">Leave a trip plan</text>
<rect x="8" y="474" width="384" height="50" rx="7" fill="#f4eedf"/>
<circle cx="30" cy="499.0" r="15" fill="#6b4f35"/><text x="30" y="504" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">9</text>
<g transform="translate(72 499.0) scale(0.8)"><line x1="0" y1="0" x2="18.0" y2="0.0" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="0" x2="9.0" y2="15.6" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="0" x2="-9.0" y2="15.6" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="0" x2="-18.0" y2="0.0" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="0" x2="-9.0" y2="-15.6" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="0" x2="9.0" y2="-15.6" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/></g>
<text x="104" y="505" font-size="16" font-weight="bold" fill="#2f3a2b">Cold, wet, tired: turn around</text>
<circle cx="30" cy="553.0" r="15" fill="#6b4f35"/><text x="30" y="558" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">10</text>
<g transform="translate(72 553.0) scale(0.8)"><rect x="-22" y="-8" width="44" height="16" rx="6" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6 -8 v-4 h12 v4" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="104" y="559" font-size="16" font-weight="bold" fill="#2f3a2b">No drink until guns are cased</text>
<rect x="12" y="588" width="50" height="24" rx="12" fill="#4a7fb0"/><text x="37" y="605" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">LAW</text>
<text x="70" y="605" font-size="15" fill="#2f3a2b">also law. The rest is wisdom (Tip).</text>
</svg>
