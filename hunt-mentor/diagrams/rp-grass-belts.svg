<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side view of a valley wall with three grassland belts. Lower grassland on the valley floor up to about 700 m: big sagebrush and widely spaced bunchgrass. Middle grassland from about 700 to 1,000 m: no sagebrush, bunchgrass closer together. Upper grassland above about 900 to 1,000 m sits inside the Interior Douglas fir zone, with rough fescue and fir patches above it.">
