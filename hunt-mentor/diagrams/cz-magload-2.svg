<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Loading a CZ 457 magazine, step 2 of 3: Press down and back. Slide it back to touch the rear wall."><rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/><circle cx="26" cy="26" r="14" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="31" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text><text x="48" y="32" font-size="17" font-weight="bold" text-anchor="start" fill="#1F3D2B">Press down and back</text><text x="110" y="80" font-size="14" font-weight="bold" text-anchor="middle" fill="#17201A">Rear</text><text x="300" y="80" font-size="14" font-weight="bold" text-anchor="middle" fill="#17201A">Front</text><rect x="140" y="110" width="120" height="110" rx="6" fill="#2B3034"/><rect x="147" y="114" width="106" height="99" rx="3" fill="#D9E0D5"/><rect x="147" y="180" width="106" height="9" rx="2" fill="#8C959B"/><path d="M140 102 L180 102 L180 112 L160 116 L140 116 Z" fill="#2B3034"/><g transform="translate(152 172) rotate(0) scale(2.4)"><rect x="0" y="-5" width="24" height="10" rx="1" fill="#D8B23A" stroke="#8A6D12" stroke-width=".8"/><rect x="-2" y="-6" width="3" height="12" rx="1" fill="#B8931F"/><path d="M24 -4.5 L33 -4 Q40 0 33 4 L24 4.5 Z" fill="#B0703A"/></g><line x1="250" y1="150" x2="216.0" y2="150.0" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><path d="M205 150 L216.0 156.0 L216.0 144.0z" fill="#FF6A13"/><text x="200" y="250" font-size="14" font-weight="normal" text-anchor="middle" fill="#17201A">Open end up, rear on the left.</text><text x="200" y="280" font-size="15" font-weight="bold" text-anchor="middle" fill="#17201A">Slide it back to touch the rear wall.</text></svg>
