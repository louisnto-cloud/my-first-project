<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Shift your whole body around a pivot, like your front elbow, until the crosshair settles back on target.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4. Move your body, not the rifle</text><circle cx="200" cy="150" r="80" fill="#f7f4ec" stroke="#2f3a2b" stroke-width="2"/><line x1="120" y1="150" x2="280" y2="150" stroke="#23261f" stroke-width="1.5" stroke-linecap="round"/><line x1="200" y1="70" x2="200" y2="230" stroke="#23261f" stroke-width="1.5" stroke-linecap="round"/><circle cx="200" cy="150" r="26.0" fill="#ffffff" stroke="#23261f" stroke-width="1.5"/><circle cx="200" cy="150" r="17.333333333333332" fill="#f3e9da" stroke="#23261f" stroke-width="1.5"/><circle cx="200" cy="150" r="8.666666666666666" fill="#ffffff" stroke="#23261f" stroke-width="1.5"/><circle cx="200" cy="150" r="2.6" fill="#e8590c" stroke="none" stroke-width="2"/><text x="200" y="258" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">shift the body, check again</text><line x1="60" y1="150" x2="100" y2="150" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><path d="M91.9 153.9 L100 150 L91.9 146.1" fill="none" stroke="#e8590c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="130" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">pivot</text>
