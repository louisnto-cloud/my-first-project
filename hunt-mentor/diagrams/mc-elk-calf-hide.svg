<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Timeline of an elk calf. Born late May or June, hidden in cover for about 2 to 3 weeks while the cow feeds nearby and returns to nurse, then the pair rejoin the cow group. The calf is spotted, nearly scentless and lies still. Bear risk is highest in the first weeks: in some areas black bears kill up to half the calves.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Mother and calf: the hiding weeks</text><line x1="30" y1="120" x2="370" y2="120" stroke="#23261f" stroke-width="3"/><circle cx="50" cy="120" r="9" fill="#e8590c"/><text x="70" y="100" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Birth</text><text x="70" y="150" font-size="14" fill="#23261f" text-anchor="middle">late May, June</text><circle cx="180" cy="120" r="9" fill="#e8590c"/><text x="200" y="100" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Hidden</text><text x="200" y="150" font-size="14" fill="#23261f" text-anchor="middle">2 to 3 weeks</text><circle cx="330" cy="120" r="9" fill="#e8590c"/><text x="350" y="100" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Rejoins</text><text x="350" y="150" font-size="14" fill="#23261f" text-anchor="middle">cow group</text><rect x="40" y="168" width="170" height="30" rx="6" fill="#b03a2e" opacity="0.8"/><text x="125" y="188" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Bear risk highest</text><g transform="translate(300 214) scale(0.45 0.45)"><rect x="-34" y="6" width="7" height="44" rx="3.5" fill="#6b4f35" stroke="#23261f" stroke-width="1.2"/><rect x="-24" y="6" width="7" height="44" rx="3.5" fill="#6b4f35" stroke="#23261f" stroke-width="1.2"/><rect x="24" y="6" width="7" height="44" rx="3.5" fill="#6b4f35" stroke="#23261f" stroke-width="1.2"/><rect x="33" y="6" width="7" height="44" rx="3.5" fill="#6b4f35" stroke="#23261f" stroke-width="1.2"/><ellipse cx="0" cy="0" rx="46" ry="19" fill="#c8a26b" stroke="#23261f" stroke-width="2"/><ellipse cx="-40" cy="-2" rx="9" ry="13" fill="#f1e3c0" stroke="#23261f" stroke-width="1"/><path d="M-46 -6 L-52 4" fill="none" stroke="#5c3b1c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 -12 L44 -44 L58 -40 L42 8 Z" fill="#5c3b1c" stroke="#23261f" stroke-width="2" stroke-linejoin="round"/><ellipse cx="62" cy="-42" rx="16" ry="7" transform="rotate(20 62 -42)" fill="#5c3b1c" stroke="#23261f" stroke-width="2"/><ellipse cx="46" cy="-53" rx="8" ry="3.5" transform="rotate(-35 46 -53)" fill="#5c3b1c" stroke="#23261f" stroke-width="1.5"/><circle cx="60" cy="-46" r="1.8" fill="#23261f"/><circle cx="-20" cy="-8" r="2.5" fill="#f1e3c0"/><circle cx="-8" cy="-12" r="2.5" fill="#f1e3c0"/><circle cx="6" cy="-9" r="2.5" fill="#f1e3c0"/><circle cx="-14" cy="4" r="2.5" fill="#f1e3c0"/><circle cx="2" cy="3" r="2.5" fill="#f1e3c0"/><circle cx="16" cy="-2" r="2.5" fill="#f1e3c0"/></g><text x="200" y="256" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Spotted, nearly scentless, lies still (85%)</text><text x="200" y="276" font-size="14" fill="#6b4f35" text-anchor="middle">Black bears kill up to half the calves</text><text x="200" y="294" font-size="14" fill="#6b4f35" text-anchor="middle">in some areas, mostly early (80%)</text>
</svg>
