<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" font-family="sans-serif" role="img" aria-label="Interior BC zones stacked by elevation, from the valley floor up. BG, Bunchgrass, valley floor to about 1,000 m: grass and sage. PP, Ponderosa pine, 335 to 900 m: open pine parks. IDF, Interior Douglas fir, about 350 to 1,450 m: fir with some grass. MS, Montane spruce, 1,100 to 1,700 m: lodgepole pine and spruce. ESSF, Engelmann spruce and subalpine fir, 1,200 to 2,300 m: deep snow. AT, Alpine tundra, above about 2,100 m: no trees. Real bands overlap by place.">
<rect width="400" height="310" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Interior zones stack up the hill</text><rect x="14" y="44" width="372" height="34" rx="6" fill="#e6e6e0"/><text x="24" y="68" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">AT</text><text x="84" y="60" font-size="14" fill="#2f3a2b" text-anchor="start">Alpine tundra</text><text x="84" y="75" font-size="14" fill="#6b4f35" text-anchor="start">above about 2,100 m</text><text x="376" y="68" font-size="14" fill="#2f3a2b" text-anchor="end">no trees, heather</text><rect x="14" y="82" width="372" height="34" rx="6" fill="#9fb3a8"/><text x="24" y="106" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">ESSF</text><text x="84" y="98" font-size="14" fill="#2f3a2b" text-anchor="start">Spruce and subalpine fir</text><text x="84" y="113" font-size="14" fill="#6b4f35" text-anchor="start">1,200 to 2,300 m</text><text x="376" y="106" font-size="14" fill="#2f3a2b" text-anchor="end">deep snow</text><rect x="14" y="120" width="372" height="34" rx="6" fill="#b5c49a"/><text x="24" y="144" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">MS</text><text x="84" y="136" font-size="14" fill="#2f3a2b" text-anchor="start">Montane spruce</text><text x="84" y="151" font-size="14" fill="#6b4f35" text-anchor="start">1,100 to 1,700 m</text><text x="376" y="144" font-size="14" fill="#2f3a2b" text-anchor="end">lodgepole, spruce</text><rect x="14" y="158" width="372" height="34" rx="6" fill="#cdd8a6"/><text x="24" y="182" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">IDF</text><text x="84" y="174" font-size="14" fill="#2f3a2b" text-anchor="start">Interior Douglas fir</text><text x="84" y="189" font-size="14" fill="#6b4f35" text-anchor="start">350 to 1,450 m</text><text x="376" y="182" font-size="14" fill="#2f3a2b" text-anchor="end">fir, some grass</text><rect x="14" y="196" width="372" height="34" rx="6" fill="#e2dca0"/><text x="24" y="220" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">PP</text><text x="84" y="212" font-size="14" fill="#2f3a2b" text-anchor="start">Ponderosa pine</text><text x="84" y="227" font-size="14" fill="#6b4f35" text-anchor="start">335 to 900 m</text><text x="376" y="220" font-size="14" fill="#2f3a2b" text-anchor="end">open pine parks</text><rect x="14" y="234" width="372" height="34" rx="6" fill="#e9dfa8"/><text x="24" y="258" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">BG</text><text x="84" y="250" font-size="14" fill="#2f3a2b" text-anchor="start">Bunchgrass</text><text x="84" y="265" font-size="14" fill="#6b4f35" text-anchor="start">valley floor to 1,000 m</text><text x="376" y="258" font-size="14" fill="#2f3a2b" text-anchor="end">grass, sage</text><line x1="396" y1="270" x2="396" y2="50" stroke="#e8590c" stroke-width="3"/><polygon points="396.0,50.0 400.3,59.0 391.7,59.0" fill="#e8590c"/><text x="200.0" y="300" font-size="14" fill="#6b4f35" text-anchor="middle">Simplified. Real bands overlap by place (85%).</text>
</svg>
