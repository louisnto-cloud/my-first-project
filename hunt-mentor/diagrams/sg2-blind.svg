<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two hunters in a blind, seen from above. Agree before first light: left hunter takes birds on the left, right hunter takes birds on the right. Never swing across your partner. Guns rest muzzle up or out the front.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">In a blind: left and right</text>
<rect x="110" y="190" width="180" height="50" rx="6" fill="#6b5a45" opacity="0.6"/>
<path d="M160 215 L15.1 176.2 A150 150 0 0 1 160.0 65.0 Z" fill="#1F3D2B" opacity="0.3"/>
<path d="M240 215 L240.0 65.0 A150 150 0 0 1 384.9 176.2 Z" fill="#4a7fb0" opacity="0.3"/>
<ellipse cx="160" cy="219" rx="13" ry="9" fill="#1F3D2B"/><circle cx="160" cy="215" r="7" fill="#FF6A13"/><line x1="160" y1="215" x2="140.5" y2="187.1" stroke="#3b4045" stroke-width="4" stroke-linecap="round"/>
<ellipse cx="240" cy="219" rx="13" ry="9" fill="#1F3D2B"/><circle cx="240" cy="215" r="7" fill="#FF6A13"/><line x1="240" y1="215" x2="259.5" y2="187.1" stroke="#3b4045" stroke-width="4" stroke-linecap="round"/>
<line x1="200" y1="215" x2="200" y2="60" stroke="#FF6A13" stroke-width="3" stroke-dasharray="7 5"/>
<rect x="30.5" y="62.0" width="99.0" height="24.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="80.0" y="80.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">left: yours</text>
<rect x="263.7" y="62.0" width="112.7" height="24.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="320.0" y="80.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">right: theirs</text>
<rect x="97.6" y="254.0" width="204.8" height="24.0" rx="5" fill="#ffffff" stroke="#FF6A13" stroke-width="1.3"/><text x="200.0" y="272.0" font-size="15" font-weight="bold" fill="#FF6A13" text-anchor="middle">never across the middle</text>
</svg>
