<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 326" font-family="sans-serif" role="img" aria-label="Calling setup seen from above, all tips. 1, the wind blows from the calling bull toward you. 2, the shooter sits ahead and downwind of the caller, with an open shooting lane on the downwind side. 3, the caller sits behind. 4, bulls often circle downwind to smell the call before they show, so watch that side.">
<rect width="400" height="326" fill="#fffaf0"/>
<defs><clipPath id="sa-call-setup-c"><rect x="8" y="42" width="384" height="276" rx="10"/></clipPath><marker id="sa-call-setup-ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#8b5a2b"/></marker><marker id="sa-call-setup-wh" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14z" fill="#4a7fb0"/></marker></defs>
<text x="200" y="28" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Calling setup, seen from above (Tip)</text>
<g clip-path="url(#sa-call-setup-c)"><rect x="8" y="42" width="384" height="276" fill="#d7e0c4"/>
<g stroke="#2f4f26" stroke-width="1"><circle cx="372" cy="58" r="16" fill="#4f7a3a"/><circle cx="352" cy="50" r="13" fill="#5b8744"/><circle cx="386" cy="84" r="13" fill="#3f6a33"/><circle cx="24" cy="300" r="14" fill="#4f7a3a"/><circle cx="44" cy="310" r="12" fill="#5b8744"/><circle cx="16" cy="276" r="11" fill="#3f6a33"/></g>
<path d="M166 196 L30 140 L40 262z" fill="#f4f6ea" opacity=".9"/>
</g>
<rect x="8" y="42" width="384" height="276" rx="10" fill="none" stroke="#b8c2a0"/>
<text x="60" y="210" font-size="15" font-weight="bold" fill="#2f3a2b">Shooting</text>
<text x="74" y="228" font-size="15" font-weight="bold" fill="#2f3a2b">lane</text>
<g data-tip="1. Wind from the bull to you|Set up downwind of a bugling bull at dawn, cow call, and stay still (Tip). Check the wind every few minutes (Tip).">
<line x1="384" y1="176" x2="316" y2="182" stroke="#4a7fb0" stroke-width="4" marker-end="url(#sa-call-setup-wh)"/>
<line x1="384" y1="222" x2="316" y2="228" stroke="#4a7fb0" stroke-width="4" marker-end="url(#sa-call-setup-wh)"/>
<circle cx="318" cy="154" r="11" fill="#4a7fb0"/><text x="318" y="159" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">1</text>
<text x="336" y="160" font-size="17" font-weight="bold" fill="#2c5d86">Wind</text>
</g>
<g data-tip="Calling in the rut|Cow call and bull grunt at dawn near a wetland, then wait and glass. The rut window is late September to early October; a bull coming in is dangerous (Tip).">
<g transform="translate(300 84) rotate(60)"><ellipse cx="0" cy="0" rx="11" ry="20" fill="#8b5a2b"/><circle cx="-2" cy="18" r="6" fill="#6b4422"/><path d="M-10 10 q-14 -4 -16 -14 M-12 8 q-10 6 -18 2 M-2 12 q10 -2 12 -14 M0 10 q12 6 18 0" stroke="#5a3e26" stroke-width="2.4" fill="none"/></g>
<rect x="252" y="110" width="96" height="24" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="300" y="127" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Calling bull</text>
</g>
<g data-tip="4. Watch the downwind side|A bull coming to a call often swings downwind to smell the cow before he shows (65%, Tip). If he cannot see a moose he may clam up and circle downwind (60%, Tip).">
<path d="M272 74 C200 50 90 52 56 96 C40 118 40 140 48 160" fill="none" stroke="#8b5a2b" stroke-width="2.8" stroke-dasharray="7 6" marker-end="url(#sa-call-setup-ah)"/>
<rect x="92" y="78" width="150" height="46" rx="5" fill="#fffaf0" stroke="#8b5a2b" stroke-width="1.2"/>
<circle cx="106" cy="101" r="10" fill="#8b5a2b"/><text x="106" y="106" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">4</text>
<text x="176" y="97" font-size="15" font-weight="bold" fill="#8b5a2b" text-anchor="middle">Bull circles</text>
<text x="176" y="115" font-size="15" font-weight="bold" fill="#8b5a2b" text-anchor="middle">downwind</text>
</g>
<g data-tip="2. Shooter downwind of the caller|Keep the shooter downwind of the caller (Tip). The bull swings to that side to smell the call, so the shooter sees him first.">
<circle cx="166" cy="196" r="14" fill="#e8590c" opacity=".35"/><circle cx="166" cy="196" r="10" fill="#e8590c" stroke="#fffaf0" stroke-width="2"/>
<circle cx="196" cy="180" r="11" fill="#e8590c"/><text x="196" y="185" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text>
<text x="212" y="186" font-size="17" font-weight="bold" fill="#c2410c">Shooter</text>
<text x="186" y="206" font-size="14" fill="#2f3a2b">downwind of caller</text>
</g>
<g data-tip="3. Caller behind|Few sounds, moose like rhythm, no metal (Tip). Over calling when a bull is close lets him pinpoint you (60%, Tip).">
<circle cx="336" cy="290" r="14" fill="#6b4f35" opacity=".35"/><circle cx="336" cy="290" r="10" fill="#6b4f35" stroke="#fffaf0" stroke-width="2"/>
<circle cx="184" cy="292" r="11" fill="#6b4f35"/><text x="184" y="297" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">3</text>
<text x="200" y="298" font-size="16" font-weight="bold" fill="#6b4f35">Caller behind</text>
</g>
</svg>
