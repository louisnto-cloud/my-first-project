<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Calling setup seen from above, all tips. The wind blows from the calling bull toward you. The shooter sits in front with an open shooting lane on the downwind side, and the caller sits behind. Bulls often circle downwind to smell the call before they show, so watch that side.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Calling setup, seen from above (Tip)</text><rect x="0" y="40" width="400" height="260" fill="#dfe6d3" opacity=".6"/><polygon points="31.0,80 40,53.0 49.0,80" fill="#2f3a2b"/><rect x="38.2" y="80" width="3.6" height="5.4" fill="#2f3a2b"/><polygon points="61.0,70 70,43.0 79.0,70" fill="#2f3a2b"/><rect x="68.2" y="70" width="3.6" height="5.4" fill="#2f3a2b"/><polygon points="51.0,110 60,83.0 69.0,110" fill="#2f3a2b"/><rect x="58.2" y="110" width="3.6" height="5.4" fill="#2f3a2b"/><polygon points="361.0,200 370,173.0 379.0,200" fill="#2f3a2b"/><rect x="368.2" y="200" width="3.6" height="5.4" fill="#2f3a2b"/><polygon points="341.0,222 350,195.0 359.0,222" fill="#2f3a2b"/><rect x="348.2" y="222" width="3.6" height="5.4" fill="#2f3a2b"/><g transform="translate(300 92) scale(0.45 0.45)"><rect x="-32" y="6" width="7" height="44" rx="3.5" fill="#6b4f35" stroke="#23261f" stroke-width="1.5"/><rect x="-22" y="6" width="7" height="44" rx="3.5" fill="#6b4f35" stroke="#23261f" stroke-width="1.5"/><rect x="24" y="6" width="7" height="44" rx="3.5" fill="#6b4f35" stroke="#23261f" stroke-width="1.5"/><rect x="33" y="6" width="7" height="44" rx="3.5" fill="#6b4f35" stroke="#23261f" stroke-width="1.5"/><ellipse cx="0" cy="0" rx="44" ry="18" fill="#c8a26b" stroke="#23261f" stroke-width="2"/><ellipse cx="-38" cy="-2" rx="9" ry="13" fill="#f1e3c0" stroke="#23261f" stroke-width="1"/><path d="M26 -12 L44 -44 L58 -40 L42 8 Z" fill="#5c3b1c" stroke="#23261f" stroke-width="2" stroke-linejoin="round"/><ellipse cx="60" cy="-44" rx="15" ry="7" transform="rotate(20 60 -44)" fill="#5c3b1c" stroke="#23261f" stroke-width="2"/><ellipse cx="46" cy="-54" rx="7" ry="3.5" transform="rotate(-35 46 -54)" fill="#5c3b1c" stroke="#23261f" stroke-width="2"/><path d="M50 -50 Q36 -80 6 -100 M48 -56 L60 -66 M46 -62 L58 -74 M38 -76 L44 -92 M28 -86 L30 -102 M18 -93 L18 -106" stroke="#6b4f35" stroke-width="3.5" fill="none" stroke-linecap="round"/></g><text x="300" y="140" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Calling bull</text><path d="M300 110 Q240 170 150 200 Q120 210 110 240" fill="none" stroke="#8b5a2b" stroke-width="3" stroke-dasharray="8 6"/><text x="236" y="196" font-size="14" font-weight="bold" fill="#8b5a2b" text-anchor="start">Bulls often circle</text><text x="236" y="214" font-size="14" font-weight="bold" fill="#8b5a2b" text-anchor="start">downwind (Tip)</text><circle cx="200" cy="232" r="6" fill="#e8590c"/><rect x="194" y="238" width="12" height="16" rx="4" fill="#e8590c"/><text x="200" y="266" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="middle">Shooter</text><circle cx="260" cy="265.8" r="5.4" fill="#8b5a2b"/><rect x="254.6" y="271.2" width="10.8" height="14.4" rx="3.6" fill="#8b5a2b"/><text x="280" y="286" font-size="13" font-weight="bold" fill="#8b5a2b" text-anchor="start">Caller behind</text><path d="M170 56 L134 112" stroke="#4a7fb0" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M135.1 103.1 L134.0 112.0 L141.7 107.3" stroke="#4a7fb0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 84 L74 140" stroke="#4a7fb0" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M75.1 131.1 L74.0 140.0 L81.7 135.3" stroke="#4a7fb0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="58" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="start">Wind</text><path d="M200 230 L160 200" stroke="#e8590c" stroke-width="2" stroke-dasharray="4 4"/><text x="120" y="226" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="start">lane</text>
