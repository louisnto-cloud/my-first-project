<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Cut 1: the diaphragm, the thin wall along the ribs between chest and belly. Cut 2: the windpipe and gullet, as high up the neck as you can reach. Then pull the heart and lungs down and out.">
