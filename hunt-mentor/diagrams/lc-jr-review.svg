<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 326" font-family="sans-serif" role="img" aria-label="Timeline of journal reviews. After every trip: read the last entry before planning the next. End of November: deer seen per hour for each spot. January: pick the three best and three dead spots, and answer the Hunter Sample Questionnaire. By 31 March: the Mandatory Hunter Report if you bought an elk, moose or caribou licence. August: turn last year&#x27;s lessons into checklist items.">
<rect x="0" y="0" width="400" height="326" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Read it back through the year</text><line x1="120" y1="50" x2="120" y2="300" stroke="#8a9a6b" stroke-width="4"/><circle cx="120" cy="64" r="8" fill="#8a9a6b"/><text x="106" y="69" font-size="14" font-weight="bold" fill="#55663f" text-anchor="end">After a trip</text><text x="136" y="69" font-size="14" fill="#23261f" text-anchor="start">Read the last entry first</text><circle cx="120" cy="110" r="8" fill="#8a9a6b"/><text x="106" y="115" font-size="14" font-weight="bold" fill="#55663f" text-anchor="end">End of Nov</text><text x="136" y="115" font-size="14" fill="#23261f" text-anchor="start">Deer seen per hour, per spot</text><circle cx="120" cy="156" r="8" fill="#8a9a6b"/><text x="106" y="161" font-size="14" font-weight="bold" fill="#55663f" text-anchor="end">January</text><text x="136" y="161" font-size="14" fill="#23261f" text-anchor="start">Best 3 and dead 3 spots</text><circle cx="120" cy="202" r="8" fill="#2f3a2b"/><text x="106" y="207" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">January</text><text x="136" y="207" font-size="14" fill="#23261f" text-anchor="start">Questionnaire comes</text><circle cx="120" cy="248" r="8" fill="#e8590c"/><text x="106" y="253" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">By 31 Mar</text><text x="136" y="253" font-size="14" fill="#23261f" text-anchor="start">Hunter Report: elk, moose,</text><text x="136" y="269" font-size="14" fill="#23261f" text-anchor="start">caribou</text><circle cx="120" cy="294" r="8" fill="#8a9a6b"/><text x="106" y="299" font-size="14" font-weight="bold" fill="#55663f" text-anchor="end">August</text><text x="136" y="299" font-size="14" fill="#23261f" text-anchor="start">Last year&#x27;s lessons become</text><text x="136" y="315" font-size="14" fill="#23261f" text-anchor="start">checklists</text>
</svg>
