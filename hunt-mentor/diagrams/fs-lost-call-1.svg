<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Call step 1: call 911 as soon as you know you are lost or hurt. It can work on any carrier tower in range.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1. Call 911 early</text><rect x="0" y="230" width="400" height="70" rx="0" fill="#dfe6d3"/><line x1="132" y1="230" x2="136" y2="201" stroke="#2f3a2b" stroke-width="7.0" stroke-linecap="round"/><line x1="148" y1="230" x2="144" y2="201" stroke="#2f3a2b" stroke-width="7.0" stroke-linecap="round"/><rect x="129" y="173" width="22" height="31" rx="6.0" fill="#e8590c"/><line x1="130" y1="178" x2="122" y2="198" stroke="#2f3a2b" stroke-width="6.0" stroke-linecap="round"/><line x1="150" y1="178" x2="158" y2="198" stroke="#2f3a2b" stroke-width="6.0" stroke-linecap="round"/><circle cx="140" cy="164" r="10.0" fill="#d9b48f"/><rect x="152" y="150" width="16" height="26" rx="3" fill="#2f3a2b"/><rect x="220" y="70" width="170" height="70" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="305" y="100" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">911 first</text><text x="305" y="121" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">any tower</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Early beats late</text>
</svg>
