<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 298" font-family="sans-serif" role="img" aria-label="Five predictable moose habits a hunter can use. 1, it often stands and stares, which can give a shot. 2, in the rut it may walk in to a call. 3, it feeds in the open at first and last light. 4, it comes back to the same willow patch. 5, it crosses roads at dusk and at night.">
<rect x="0" y="0" width="400" height="298" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">5 predictable moose habits</text><circle cx="34" cy="62" r="15" fill="#e8590c"/><text x="34" y="67" font-size="14" fill="#fffaf0" text-anchor="True">1</text><text x="60" y="60" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Stands and stares</text><text x="60" y="78" font-size="14" fill="#6b4f35" text-anchor="start">often gives a shot</text><circle cx="34" cy="110" r="15" fill="#e8590c"/><text x="34" y="115" font-size="14" fill="#fffaf0" text-anchor="True">2</text><text x="60" y="108" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Answers a call</text><text x="60" y="126" font-size="14" fill="#6b4f35" text-anchor="start">in the rut, may walk in</text><circle cx="34" cy="158" r="15" fill="#e8590c"/><text x="34" y="163" font-size="14" fill="#fffaf0" text-anchor="True">3</text><text x="60" y="156" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Feeds in the open</text><text x="60" y="174" font-size="14" fill="#6b4f35" text-anchor="start">at first and last light</text><circle cx="34" cy="206" r="15" fill="#e8590c"/><text x="34" y="211" font-size="14" fill="#fffaf0" text-anchor="True">4</text><text x="60" y="204" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Comes back</text><text x="60" y="222" font-size="14" fill="#6b4f35" text-anchor="start">to the same willow patch</text><circle cx="34" cy="254" r="15" fill="#e8590c"/><text x="34" y="259" font-size="14" fill="#fffaf0" text-anchor="True">5</text><text x="60" y="252" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Crosses roads</text><text x="60" y="270" font-size="14" fill="#6b4f35" text-anchor="start">at dusk and at night</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Hunter wisdom and BC sources, labelled in text</text>
</svg>
