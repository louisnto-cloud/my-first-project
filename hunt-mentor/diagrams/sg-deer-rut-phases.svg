<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 372" font-family="sans-serif" role="img" aria-label="The deer rut in 4 phases. Pre rut, mid October to early November: bucks rub and check does at dawn and dusk. Seeking and chasing, first half of November: bucks cruise funnels in daylight. Peak, mid November: a buck tends one doe, hunt the does. Post rut, December: bucks thin and back in cover, a small second rut about 28 days later.">
  <rect width="400" height="372" fill="#fffaf0"/>
  <text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Deer rut, 4 phases</text>
  <g data-tip="Buck activity|Bucks are most active from early to mid November. Mule deer bucks rut on winter range, so the rut and the snow bring them to the same open slopes.">
    <path d="M20 168 Q80 164 110 132 Q150 58 178 56 Q206 58 232 132 Q252 166 282 168 L380 170" fill="none" stroke="#e8590c" stroke-width="5" stroke-linecap="round"/>
    <text x="260" y="76" font-size="15" font-weight="bold" fill="#b3470a">buck activity</text>
  </g>
  <g data-tip="Second rut|Does not bred cycle again about 28 days later, so a smaller second rut comes in December.">
    <path d="M276 168 Q296 140 316 168" fill="none" stroke="#e8590c" stroke-width="3.5" stroke-dasharray="5 4"/>
    <text x="296" y="132" font-size="15" fill="#6b4f35" text-anchor="middle">2nd rut</text>
  </g>
  <g font-size="14" fill="#2f3a2b" text-anchor="middle">
    <path d="M100 202 v8 M165 202 v8 M240 202 v8 M305 202 v8" stroke="#2f3a2b" stroke-width="2" fill="none"/>
    <text x="22" y="226" text-anchor="start">15 Oct</text><text x="100" y="226">1 Nov</text><text x="165" y="226">15 Nov</text><text x="240" y="226">1 Dec</text><text x="305" y="226">15 Dec</text>
  </g>
  <g data-tip="1. Pre rut|Mid October to early November. Bucks leave bachelor groups, rub, scrape (white tails) and check doe groups at dusk and dawn.">
    <rect x="20" y="178" width="88" height="24" fill="#8a9a6b"/><text x="64" y="196" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="8" y="238" width="188" height="58" rx="9" fill="#2f3a2b"/>
    <circle cx="30" cy="260" r="13" fill="#8a9a6b"/><text x="30" y="266" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="50" y="265" font-size="17" font-weight="bold" fill="#ffffff">Pre rut</text>
    <text x="50" y="286" font-size="15" fill="#f3d36b">rubs, dusk checks</text>
  </g>
  <g data-tip="2. Seeking and chasing|First half of November. Bucks travel, cruise funnels between doe groups and show up in daylight. Sit funnels and saddles all morning (Tip).">
    <rect x="108" y="178" width="52" height="24" fill="#e9a36f"/><text x="134" y="196" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">2</text>
    <rect x="204" y="238" width="188" height="58" rx="9" fill="#2f3a2b"/>
    <circle cx="226" cy="260" r="13" fill="#e9a36f"/><text x="226" y="266" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">2</text>
    <text x="246" y="265" font-size="17" font-weight="bold" fill="#ffffff">Seeking</text>
    <text x="246" y="286" font-size="15" fill="#f3d36b">cruising funnels</text>
  </g>
  <g data-tip="3. Peak|Mid November. A buck tends one doe at a time, follows her for a day or two and fights rivals. Does lead, bucks follow: hunt the does (Tip).">
    <rect x="160" y="178" width="70" height="24" fill="#e8590c"/><text x="195" y="196" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <rect x="8" y="304" width="188" height="58" rx="9" fill="#2f3a2b"/>
    <circle cx="30" cy="326" r="13" fill="#e8590c"/><text x="30" y="332" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="50" y="331" font-size="17" font-weight="bold" fill="#ffffff">Peak</text>
    <text x="50" y="352" font-size="15" fill="#f3d36b">hunt the does</text>
  </g>
  <g data-tip="4. Post rut|December. Bucks are thin, tired and back in cover. Snow pushes deer to winter range.">
    <rect x="240" y="178" width="140" height="24" fill="#6b7a55"/><text x="310" y="196" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <rect x="204" y="304" width="188" height="58" rx="9" fill="#2f3a2b"/>
    <circle cx="226" cy="326" r="13" fill="#6b7a55"/><text x="226" y="332" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="246" y="331" font-size="17" font-weight="bold" fill="#ffffff">Post rut</text>
    <text x="246" y="352" font-size="15" fill="#f3d36b">thin, in cover</text>
  </g>
</svg>
