<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif" role="img" aria-label="The deer rut in 4 phases. Pre rut, mid October to early November: bucks rub and check does at dawn and dusk. Seeking and chasing, first half of November: bucks cruise funnels in daylight. Peak, mid November: a buck tends one doe, hunt the does. Post rut, December: bucks thin and back in cover, a small second rut about 28 days later.">
  <rect width="400" height="320" fill="#fffaf0"/>
  <text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Deer rut, 4 phases</text>
  <path d="M20 200 Q90 190 130 150 Q190 70 230 60 Q270 70 300 150 Q330 200 380 205" fill="none" stroke="#e8590c" stroke-width="5"/>
  <path d="M330 200 Q345 175 360 200" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="200" y="110" font-size="14" fill="#6b4f35" text-anchor="middle">buck activity</text>
  <path d="M20 215 H380" stroke="#2f3a2b" stroke-width="2"/>
  <g font-size="14" fill="#2f3a2b" text-anchor="middle"><text x="55" y="234">mid Oct</text><text x="160" y="234">early Nov</text><text x="240" y="234">mid Nov</text><text x="345" y="234">Dec</text></g>
  <g fill="#2f3a2b"><rect x="12" y="246" width="88" height="62" rx="8"/><rect x="104" y="246" width="96" height="62" rx="8"/><rect x="204" y="246" width="84" height="62" rx="8"/><rect x="292" y="246" width="96" height="62" rx="8"/></g>
  <g font-size="15" font-weight="bold" fill="#fff" text-anchor="middle"><text x="56" y="268">Pre rut</text><text x="152" y="268">Seeking</text><text x="246" y="268">Peak</text><text x="340" y="268">Post rut</text></g>
  <g font-size="14" fill="#f3d36b" text-anchor="middle"><text x="56" y="292">rubs</text><text x="152" y="292">cruising</text><text x="246" y="292">hunt does</text><text x="340" y="292">in cover</text></g>
  <text x="345" y="165" font-size="14" fill="#6b4f35" text-anchor="middle">2nd rut</text>
</svg>
