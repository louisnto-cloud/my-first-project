<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Decision chart for the morning of a hunt. 1, is the wind right for plan A stand? If no, go to plan B or still hunt. 2, is there fresh sign on that trail this week? If no, move to fresh sign. 3, can you walk in without crossing the deer path? If no, sit later or go around. All yes: go sit. Write it in the Journal." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="20" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">At the truck: the 3 checks</text><rect x="10" y="40" width="220" height="56" rx="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2.5"/><text x="120.0" y="65.0" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">1. Wind right for</text><text x="120.0" y="83.0" font-size="14" fill="#23261f" text-anchor="middle">plan A stand?</text><rect x="250" y="40" width="140" height="56" rx="10" fill="#fbe3d4" stroke="#e8590c" stroke-width="2.5"/><text x="320.0" y="65.0" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">No: plan B</text><text x="320.0" y="83.0" font-size="14" fill="#23261f" text-anchor="middle">or still hunt</text><rect x="10" y="120" width="220" height="56" rx="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2.5"/><text x="120.0" y="145.0" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">2. Fresh sign on</text><text x="120.0" y="163.0" font-size="14" fill="#23261f" text-anchor="middle">that trail this week?</text><rect x="250" y="120" width="140" height="56" rx="10" fill="#fbe3d4" stroke="#e8590c" stroke-width="2.5"/><text x="320.0" y="145.0" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">No: move to</text><text x="320.0" y="163.0" font-size="14" fill="#23261f" text-anchor="middle">fresh sign</text><rect x="10" y="200" width="220" height="56" rx="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2.5"/><text x="120.0" y="225.0" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">3. Walk in without</text><text x="120.0" y="243.0" font-size="14" fill="#23261f" text-anchor="middle">crossing their path?</text><rect x="250" y="200" width="140" height="56" rx="10" fill="#fbe3d4" stroke="#e8590c" stroke-width="2.5"/><text x="320.0" y="225.0" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">No: sit later</text><text x="320.0" y="243.0" font-size="14" fill="#23261f" text-anchor="middle">or go around</text><line x1="230" y1="68" x2="246" y2="68" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="246.0,68.0 237.9,71.9 237.9,64.1" fill="#e8590c"/><line x1="230" y1="148" x2="246" y2="148" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="246.0,148.0 237.9,151.9 237.9,144.1" fill="#e8590c"/><line x1="230" y1="228" x2="246" y2="228" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="246.0,228.0 237.9,231.9 237.9,224.1" fill="#e8590c"/><line x1="120" y1="96" x2="120" y2="116" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round"/><polygon points="120.0,116.0 116.1,107.9 123.9,107.9" fill="#8a9a6b"/><line x1="120" y1="176" x2="120" y2="196" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round"/><polygon points="120.0,196.0 116.1,187.9 123.9,187.9" fill="#8a9a6b"/><text x="130" y="112" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">yes</text><text x="130" y="192" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">yes</text><text x="120" y="282" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">All yes: go sit.</text><text x="320" y="282" font-size="14" fill="#6b4f35" text-anchor="middle">Write it in the Journal.</text>
</svg>
