<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" font-family="sans-serif" role="img" aria-label="The sight picture with the Arctic peep sight: 1 the rear peep ring, look through it; 2 keep your focus sharp on the front post; 3 put the top of the post on the spot you want to hit, here the centre of a target; 4 the two protective ears frame the post.">
<rect x="0" y="0" width="400" height="350" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">The sight picture</text><circle cx="200" cy="160" r="110" fill="#3A463C" opacity="0.18"/><circle cx="200" cy="160" r="86" fill="#FFFFFF" stroke="#8F9A8C" stroke-width="6"/><circle cx="200" cy="140" r="34" fill="none" stroke="#1F3D2B" stroke-width="2" stroke-dasharray="4 3"/><circle cx="200" cy="140" r="16" fill="none" stroke="#1F3D2B" stroke-width="2" stroke-dasharray="4 3"/><path d="M150 246 L162 150 L172 150 L176 246Z" fill="#8F9A8C"/><path d="M224 246 L228 150 L238 150 L250 246Z" fill="#8F9A8C"/><rect x="194" y="140" width="12" height="106" fill="#1F3D2B"/><g data-tip="Peep ring|Your eye centres the front post in the ring by itself. Look through it."><line x1="60" y1="80" x2="120" y2="110" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="120" cy="110" r="2.6" fill="#1F3D2B"/><circle cx="60" cy="80" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="60" y="85" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text></g><g data-tip="Front post|Sharp focus goes on the post, not the target."><line x1="60" y1="230" x2="194" y2="200" stroke="#FF6A13" stroke-width="1.6"/><circle cx="194" cy="200" r="2.6" fill="#FF6A13"/><circle cx="60" cy="230" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="60" y="235" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text></g><g data-tip="Top of the post|The top of the post sits on the spot you want to hit."><line x1="340" y1="80" x2="206" y2="141" stroke="#FF6A13" stroke-width="1.6"/><circle cx="206" cy="141" r="2.6" fill="#FF6A13"/><circle cx="340" cy="80" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="340" y="85" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text></g><g data-tip="Ears|Protective ears frame the post."><line x1="340" y1="230" x2="244" y2="200" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="244" cy="200" r="2.6" fill="#1F3D2B"/><circle cx="340" cy="230" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="340" y="235" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text></g><circle cx="24" cy="295" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="300" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="40" y="300" font-size="14" fill="#17201A" text-anchor="start">Peep: look through it</text><circle cx="24" cy="317" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="322" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="40" y="322" font-size="14" fill="#17201A" text-anchor="start">Focus on the post</text><circle cx="216" cy="295" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="216" y="300" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="232" y="300" font-size="14" fill="#17201A" text-anchor="start">Post top on the aim</text><circle cx="216" cy="317" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="216" y="322" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="232" y="322" font-size="14" fill="#17201A" text-anchor="start">Ears frame the post</text>
</svg>
