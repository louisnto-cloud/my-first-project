<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 322" font-family="sans-serif" role="img" aria-label="Level 2, Apprentice, on the five step ladder Rookie, Apprentice, Hunter, Guide, Old Timer. Goal: first animals, clean shots, all the meat home. Key skills: licence notched on the spot; edible portions packed out and kept cool; passed on at least one shot that was too far or risky. Opinion, not a BC rank.">
