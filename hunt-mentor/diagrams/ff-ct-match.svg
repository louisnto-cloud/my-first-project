<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three panels: the calibre stamped on the barrel reads .308 Win, the box reads .308 Win, and the headstamp on the base of each cartridge reads 308 Win. All three must match before you load.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Three stamps must match</text><rect x="16" y="60" width="116" height="150" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><rect x="142" y="60" width="116" height="150" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><rect x="268" y="60" width="116" height="150" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="74" y="84" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Barrel</text><rect x="30" y="110" width="88" height="18" rx="3" fill="#6b6f68" stroke="none" stroke-width="2"/><text x="74" y="124" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">.308 WIN</text><text x="200" y="84" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Box</text><rect x="160" y="100" width="80" height="60" rx="4" fill="#f8e3cf" stroke="#2f3a2b" stroke-width="1.5"/><text x="200" y="126" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">.308</text><text x="200" y="144" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">WIN</text><text x="326" y="84" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Headstamp</text><circle cx="326" cy="132" r="34" fill="#c9a227" stroke="#2f3a2b" stroke-width="2"/><circle cx="326" cy="132" r="9" fill="#c0c0c0" stroke="#2f3a2b" stroke-width="1.5"/><text x="326" y="112" font-size="12" font-weight="bold" fill="#2f3a2b" text-anchor="middle">308</text><text x="326" y="160" font-size="12" font-weight="bold" fill="#2f3a2b" text-anchor="middle">WIN</text><path d="M64 186 l7 8 l14 -16" fill="none" stroke="#2f6e3b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M190 186 l7 8 l14 -16" fill="none" stroke="#2f6e3b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M316 186 l7 8 l14 -16" fill="none" stroke="#2f6e3b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="232" width="300" height="34" rx="17.0" fill="#2f3a2b" stroke="none" stroke-width="2"/><text x="200.0" y="254.25" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">All three say the same? Load.</text>
</svg>
