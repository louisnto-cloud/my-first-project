<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three panels: the calibre stamped on the barrel reads .308 Win, the box reads .308 Win, and the headstamp on the base of each cartridge reads 308 Win. All three must match before you load.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="27" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Three stamps must match</text>
<rect x="10" y="44" width="124" height="182" rx="8" fill="#dfe6d3"/>
<text x="72" y="70" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Barrel</text>
<rect x="138" y="44" width="124" height="182" rx="8" fill="#dfe6d3"/>
<text x="200" y="70" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Box</text>
<rect x="266" y="44" width="124" height="182" rx="8" fill="#dfe6d3"/>
<text x="328" y="70" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Headstamp</text>
<rect x="10" y="104" width="124" height="44" fill="#4f5550"/><rect x="10" y="104" width="124" height="10" fill="#6f7670"/><rect x="10" y="140" width="124" height="8" fill="#3c413d"/>
<text x="72" y="132" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">.308 WIN</text>
<rect x="156" y="90" width="92" height="72" rx="4" fill="#f8e3cf" stroke="#2f3a2b" stroke-width="1.6"/><rect x="156" y="90" width="92" height="14" rx="3" fill="#e8590c"/>
<text x="202" y="130" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">.308</text>
<text x="202" y="152" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">WIN</text>
<circle cx="330" cy="130" r="46" fill="#c9a227" stroke="#2f3a2b" stroke-width="2"/><circle cx="330" cy="130" r="40" fill="none" stroke="#9c7c16" stroke-width="2"/>
<circle cx="330" cy="130" r="10" fill="#c0c0c0" stroke="#2f3a2b" stroke-width="1.5"/>
<text x="330" y="112" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">308</text>
<text x="330" y="162" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">WIN</text>
<circle cx="72" cy="198" r="15" fill="#2f6e3b"/><path d="M65 198 l5 6 l10 -12" fill="none" stroke="#fffaf0" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="202" cy="198" r="15" fill="#2f6e3b"/><path d="M195 198 l5 6 l10 -12" fill="none" stroke="#fffaf0" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="330" cy="198" r="15" fill="#2f6e3b"/><path d="M323 198 l5 6 l10 -12" fill="none" stroke="#fffaf0" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="242" width="320" height="40" rx="20" fill="#2f3a2b"/>
<text x="200" y="268" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">All three say the same? Load.</text>
</svg>
