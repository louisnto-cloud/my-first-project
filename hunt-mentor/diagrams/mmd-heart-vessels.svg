<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Schematic of the deer chest. The heart sits low, just behind the front leg. The aorta, the biggest artery, arches up from the heart and runs back just under the spine. The vena cava brings blood back to the heart. High chest hits can cut the aorta; low hits reach the heart.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Heart and the big pipes</text><rect x="40" y="60" width="320" height="160" rx="30" fill="#ead9c0" stroke="#23261f" stroke-width="2.5"/><line x1="40" y1="72" x2="360" y2="72" stroke="#6b4f35" stroke-width="7"/><text x="60" y="54" font-size="14" fill="#6b4f35" text-anchor="start">spine</text><path d="M250 170 Q 250 100 220 90 L60 90" fill="none" stroke="#b3261e" stroke-width="8"/><path d="M240 182 Q 200 150 60 150" fill="none" stroke="#5b6fa8" stroke-width="7"/><ellipse cx="258" cy="182" rx="22" ry="26" fill="#b3261e"/><path d="M262 160 L300 110 L330 112" fill="none" stroke="#b3261e" stroke-width="6"/><text x="70" y="112" font-size="14" fill="#b3261e" text-anchor="start" font-weight="bold">aorta: under the spine</text><text x="70" y="172" font-size="14" fill="#5b6fa8" text-anchor="start" font-weight="bold">vena cava</text><text x="258" y="240" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">heart: low, behind the leg</text><text x="310" y="100" font-size="14" fill="#b3261e" text-anchor="middle">to neck</text><text x="200" y="268" font-size="14" fill="#23261f" text-anchor="middle">High chest hits can cut the aorta (65%)</text><text x="200" y="286" font-size="14" fill="#23261f" text-anchor="middle">Low hits reach the heart (85%)</text>
</svg>
