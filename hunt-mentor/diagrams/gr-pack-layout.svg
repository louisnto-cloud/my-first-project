<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif" role="img" aria-label="Day pack layout, what goes where. Lid: headlamp, map, compass, licences in a zip bag. Top of main bag: rain shell, extra layer, toque. Middle: food, water, first aid kit. Bottom: game bags, rope, emergency blanket. Side pocket: water bottle. Hip belt: tourniquet on one side, whistle and bear spray on the other. Shoulder strap: satellite messenger.">
  <rect width="400" height="320" fill="#fffaf0"/>
  <text x="200" y="22" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Day pack: what goes where (Tip)</text>
  <!-- pack -->
  <path d="M120 40 Q 200 26 280 40 L284 80 L116 80 Z" fill="#6b6f48" stroke="#2f3a2b" stroke-width="2"/>
  <rect x="116" y="80" width="168" height="200" rx="16" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2"/>
  <line x1="122" y1="146" x2="278" y2="146" stroke="#2f3a2b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="122" y1="214" x2="278" y2="214" stroke="#2f3a2b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="96" y="150" width="22" height="70" rx="6" fill="#6b6f48" stroke="#2f3a2b" stroke-width="2"/><rect x="100" y="140" width="14" height="40" rx="4" fill="#4a7fb0"/>
  <rect x="60" y="272" width="280" height="22" rx="8" fill="#5c5a4a" stroke="#2f3a2b" stroke-width="2"/>
  <rect x="70" y="276" width="34" height="14" rx="3" fill="#e8590c"/><rect x="296" y="276" width="34" height="14" rx="3" fill="#c9a227"/>
  <rect x="268" y="56" width="10" height="70" fill="#5c5a4a"/><rect x="264" y="92" width="18" height="24" rx="3" fill="#e8590c"/>
  <g font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">
    <text x="200" y="64">Lid</text>
    <text x="200" y="108">Rain shell</text><text x="200" y="126">extra layer, toque</text>
    <text x="200" y="176">Food, water</text><text x="200" y="194">first aid kit</text>
    <text x="200" y="240">Game bags, rope</text><text x="200" y="258">emergency blanket</text>
  </g>
  <g stroke="#2f3a2b" stroke-width="1.2"><line x1="150" y1="50" x2="96" y2="50"/><line x1="102" y1="160" x2="70" y2="140"/><line x1="86" y1="290" x2="70" y2="304"/><line x1="314" y1="290" x2="330" y2="304"/><line x1="282" y1="104" x2="306" y2="90"/></g>
  <g font-size="14" font-weight="bold" fill="#2f3a2b">
    <text x="4" y="46">Headlamp,</text><text x="4" y="62" font-weight="normal">map, compass,</text><text x="4" y="78" font-weight="normal">licences</text>
    <text x="4" y="126">Water</text><text x="4" y="142" font-weight="normal">bottle</text>
    <text x="10" y="316" fill="#e8590c">Tourniquet</text>
    <text x="310" y="84" fill="#e8590c">Satellite</text><text x="310" y="100" fill="#e8590c">messenger</text>
  </g>
  <text x="390" y="316" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">Whistle, spray</text>
</svg>
