<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="sans-serif" role="img" aria-label="Stripping the magazine for cleaning: 1 press the rear of the follower down with a screwdriver so its front end releases; 2 pull the follower and spring out of the box; 3 do not detach the floorplate; 4 wash in warm soapy water or solvent, dry, lightly oil and refit with the spring the right way round.">
<rect x="0" y="0" width="400" height="380" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Strip the magazine</text><rect x="40" y="120" width="144.0" height="112.0" rx="6.4" fill="#C9D0C6" stroke="#1F3D2B" stroke-width="1.6"/><path d="M46.4 120 L46.4 110.4 L120.0 110.4 L129.60000000000002 120" fill="#8F9A8C" stroke="#1F3D2B" stroke-width="1.4"/><rect x="49.6" y="126.4" width="124.8" height="96.0" fill="#FFFFFF" stroke="#8F9A8C" stroke-width="1"/><rect x="56" y="110" width="118" height="10" fill="#FF6A13" stroke="#1F3D2B" stroke-width="1.2"/><rect x="61" y="52" width="6" height="60" fill="#8F9A8C" stroke="#1F3D2B" stroke-width="1"/><rect x="55" y="8" width="18" height="46" rx="4" fill="#FF6A13" stroke="#1F3D2B" stroke-width="1.4"/><rect x="230" y="96" width="140" height="12" fill="#FF6A13" stroke="#1F3D2B" stroke-width="1.2"/><polyline points="240,140 252,120 264,140 276,120 288,140 300,120 312,140 324,120 336,140 348,120 360,140" fill="none" stroke="#1F3D2B" stroke-width="2.5"/><line x1="180" y1="116" x2="215.1" y2="106.0" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><path d="M222 104 L215.3 110.0 L213.1 102.5z" fill="#FF6A13"/><circle cx="100" cy="92" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="100" y="97" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><circle cx="300" cy="80" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="300" y="85" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><circle cx="120" cy="248" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="120" y="253" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><circle cx="24" cy="281" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="286" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="40" y="286" font-size="14" fill="#17201A" text-anchor="start">Press the rear of the follower down</text><circle cx="24" cy="303" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="308" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="40" y="308" font-size="14" fill="#17201A" text-anchor="start">Lift out follower and spring</text><circle cx="24" cy="325" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="330" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="40" y="330" font-size="14" fill="#17201A" text-anchor="start">Floorplate stays on the box</text><circle cx="24" cy="347" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="24" y="352" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="40" y="352" font-size="14" fill="#17201A" text-anchor="start">Wash, dry, light oil, refit</text>
</svg>
