<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 292" font-family="sans-serif" role="img" aria-label="October. 1 October: any mule deer buck all month in Region 3; chukar, gray partridge and pheasant cocks; Canada geese again; Region 8 quail at 10 a day. 10 October: antlerless white tailed deer to 31 October, and Region 2 ducks open. 15 October: spike fork moose in more MUs.">
<rect x="0" y="0" width="400" height="292" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">October opens</text><rect x="10" y="46" width="74" height="40" rx="8" fill="#e8590c"/><text x="47" y="72" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">1 Oct</text><text x="94" y="62" font-size="14" fill="#23261f" text-anchor="start">Any mule deer buck, all month</text><rect x="10" y="94" width="74" height="40" rx="8" fill="#8a9a6b"/><text x="47" y="120" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">1 Oct</text><text x="94" y="110" font-size="14" fill="#23261f" text-anchor="start">Chukar, partridge, pheasant cocks.</text><text x="94" y="127" font-size="14" fill="#23261f" text-anchor="start">Geese again</text><rect x="10" y="142" width="74" height="40" rx="8" fill="#8a9a6b"/><text x="47" y="168" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">1 Oct</text><text x="94" y="158" font-size="14" fill="#23261f" text-anchor="start">Region 8 quail, 10 a day</text><rect x="10" y="190" width="74" height="40" rx="8" fill="#e8590c"/><text x="47" y="216" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">10 Oct</text><text x="94" y="206" font-size="14" fill="#23261f" text-anchor="start">Antlerless white tails to 31 Oct.</text><text x="94" y="223" font-size="14" fill="#23261f" text-anchor="start">Region 2 ducks</text><rect x="10" y="238" width="74" height="40" rx="8" fill="#8b5a2b"/><text x="47" y="264" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">15 Oct</text><text x="94" y="254" font-size="14" fill="#23261f" text-anchor="start">Spike fork moose in more MUs</text>
</svg>
