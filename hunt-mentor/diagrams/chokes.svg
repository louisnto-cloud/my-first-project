<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 634" font-family="sans-serif" role="img" aria-label="Shotgun chokes and their spread at 37 metres, 40 yards. Each dashed ring is a 76 centimetre, 30 inch, circle, with 100 pellets drawn. Cylinder: 0 squeeze, about 40 percent in the ring, steel OK. IC, Improved Cylinder: about 0.25 millimetres, about 50 percent in the ring, steel OK. M, Modified: about 0.5 millimetres, about 60 percent in the ring, steel OK with most makers. Full: about 0.8 to 1 millimetre, about 70 percent in the ring, no steel unless the choke is marked for it. General guide only; your manual wins.">
