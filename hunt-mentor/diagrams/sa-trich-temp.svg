<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bear meat and trichinosis. Tick: cook every cut to an internal 71 degrees Celsius, 160 Fahrenheit, checked with a meat thermometer. Cross: freezing does not work, the northern parasite survives freezing for months or years. Cross: meat colour is not a sign of doneness.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Bear meat: only heat makes it safe</text><rect x="8" y="40" width="188" height="254" rx="8" fill="#fffaf0" stroke="#2b8a3e" stroke-width="2.5"/><rect x="88" y="70" width="28" height="160" rx="14" fill="#fff" stroke="#23261f" stroke-width="2"/><rect x="94" y="110" width="16" height="114" rx="8" fill="#c92a2a"/><circle cx="102" cy="236" r="22" fill="#c92a2a" stroke="#23261f" stroke-width="2"/><line x1="118" y1="110" x2="140" y2="110" stroke="#23261f" stroke-width="2"/><text x="144" y="115" font-size="16" font-weight="bold" fill="#c92a2a" text-anchor="start">71 C</text><text x="144" y="135" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">160 F</text><path d="M30.4 90 l7.199999999999999 8.4 l13.2 -16.8" fill="none" stroke="#2b8a3e" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="278" font-size="15" font-weight="bold" fill="#2b8a3e" text-anchor="middle">Cook to 71 C inside</text><rect x="204" y="40" width="188" height="124" rx="8" fill="#fffaf0" stroke="#c92a2a" stroke-width="2.5"/><path d="M362 54 L378 70 M378 54 L362 70" stroke="#c92a2a" stroke-width="4" stroke-linecap="round"/><rect x="222" y="60" width="50" height="60" rx="6" fill="#dbe7f3" stroke="#4a7fb0" stroke-width="3"/><line x1="222" y1="84" x2="272" y2="84" stroke="#4a7fb0" stroke-width="3"/><text x="286" y="92" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Freezing</text><text x="216" y="144" font-size="14" font-weight="bold" fill="#c92a2a" text-anchor="start">parasite survives</text><rect x="204" y="170" width="188" height="124" rx="8" fill="#fffaf0" stroke="#c92a2a" stroke-width="2.5"/><path d="M362 184 L378 200 M378 184 L362 200" stroke="#c92a2a" stroke-width="4" stroke-linecap="round"/><ellipse cx="248" cy="220" rx="30" ry="20" fill="#b36a5e"/><ellipse cx="248" cy="220" rx="16" ry="10" fill="#d9a3a0"/><text x="286" y="222" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Colour</text><text x="216" y="274" font-size="14" font-weight="bold" fill="#c92a2a" text-anchor="start">not a sign of done</text>
</svg>
