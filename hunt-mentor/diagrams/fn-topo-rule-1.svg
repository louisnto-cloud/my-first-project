<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Three contour lines. Two of them touch at one spot, marking a cliff, but they never cross.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c" stroke="none" stroke-width="2"/><text x="26" y="32" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="52" y="32" font-family="sans-serif" font-size="18" fill="#2f3a2b" text-anchor="start" font-weight="bold">Never cross</text><path d="M40 80 C 150 80, 180 147, 200 147 C 220 147, 250 80, 370 80" fill="none" stroke="#8b5a2b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M40 215 C 150 215, 180 153, 200 153 C 220 153, 250 215, 370 215" fill="none" stroke="#8b5a2b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M40 245 C 140 248, 260 248, 370 250" fill="none" stroke="#8b5a2b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="240" y="152" font-family="sans-serif" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">touch at a cliff</text><text x="40" y="152" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="start" font-weight="bold">never cross</text><text x="40" y="285" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">Lines never cross. They only touch at a cliff.</text>
</svg>
