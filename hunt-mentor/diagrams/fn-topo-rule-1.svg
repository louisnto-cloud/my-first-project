<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Three contour lines. Two of them touch at one spot, marking a cliff, but they never cross.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c" stroke="none" stroke-width="2"/><text x="26" y="32" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="52" y="32" font-family="sans-serif" font-size="18" fill="#2f3a2b" text-anchor="start" font-weight="bold">Never cross</text><path d="M40 90 C 120 100, 160 150, 200 150 C 240 150, 300 110, 370 100" fill="none" stroke="#8b5a2b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M40 160 C 120 170, 160 152, 200 152 C 240 152, 300 180, 370 190" fill="none" stroke="#8b5a2b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M40 230 C 140 240, 260 240, 370 250" fill="none" stroke="#8b5a2b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="130" font-family="sans-serif" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">touch at a cliff</text><text x="40" y="285" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">Lines never cross. They only touch at a cliff.</text>
</svg>
