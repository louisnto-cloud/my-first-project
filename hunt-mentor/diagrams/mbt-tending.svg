<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 265" font-family="sans-serif" role="img" aria-label="Tending bond timeline: the buck follows a doe for 2 to 3 days before her heat, the heat lasts about a day, then he stays 3 to 4 days. If not bred she cycles again in 22 to 29 days. One buck is unlikely to breed more than 3 or 4 does in 28 days.">
<rect width="400" height="265" fill="#EEF1EA"/>
<text x="200" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1F3D2B">How a buck tends a doe</text>
<rect x="20" y="90" width="140" height="40" rx="4" fill="#8a9a6b" stroke="none" stroke-width="0"/><text x="90.0" y="116" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">Follows her</text><text x="90.0" y="156" font-size="15" text-anchor="middle" font-weight="bold" fill="#17201A">2 to 3 days</text><rect x="160" y="90" width="70" height="40" rx="4" fill="#FF6A13" stroke="none" stroke-width="0"/><text x="195.0" y="116" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">Heat</text><text x="195.0" y="156" font-size="15" text-anchor="middle" font-weight="bold" fill="#17201A">about 1 day</text><rect x="230" y="90" width="150" height="40" rx="4" fill="#1F3D2B" stroke="none" stroke-width="0"/><text x="305.0" y="116" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">Stays with her</text><text x="305.0" y="156" font-size="15" text-anchor="middle" font-weight="bold" fill="#17201A">3 to 4 days</text><text x="200" y="72" font-size="15" text-anchor="middle" font-weight="normal" fill="#17201A">One buck, one doe</text><text x="200" y="196" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Not bred? She cycles again</text><text x="200" y="216" font-size="15" text-anchor="middle" font-weight="bold" fill="#1F3D2B">in 22 to 29 days (90%)</text><text x="200" y="250" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">One buck: 3 or 4 does in 28 days</text>
</svg>
