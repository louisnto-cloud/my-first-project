<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="J hook step 1, top view of a pond with your hide on shore. Check the wind first. Here it blows left to right, across you, at your side. Ducks land into the wind."><rect width="400" height="300" fill="#fffaf0"/><rect x="0" y="40" width="400" height="200" fill="#cfe0ea"/><rect x="0" y="240" width="400" height="60" fill="#c9b79c"/><rect x="150" y="236" width="70" height="26" rx="6" fill="#2f3a2b"/><text x="185" y="254" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">You</text><path d="M20 22 L110 22" stroke="#4a7fb0" stroke-width="5"/><polygon points="106,13 106,31 124,22" fill="#4a7fb0"/><text x="132" y="28" font-size="16" font-weight="bold" fill="#4a7fb0" text-anchor="start">WIND</text><text x="388" y="28" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">Check it first</text><path d="M240 250 L320 250" stroke="#4a7fb0" stroke-width="3" stroke-dasharray="6 5"/><text x="300" y="286" font-size="14" fill="#2f3a2b" text-anchor="middle">wind at your side or back</text><text x="200" y="140" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Ducks land into the wind (75%)</text></svg>
