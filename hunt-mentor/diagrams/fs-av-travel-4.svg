<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Travel step 4: do not stop or camp in gullies, below cliffs or at the bottom of a slope. Regroup in safe spots.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4. Avoid traps below</text><path d="M0 80 L170 240 L230 240 L400 80 L400 300 L0 300 Z" fill="#f4f7fb"/><rect x="170" y="230" width="60" height="14" rx="0" fill="#c9d6e3"/><line x1="187" y1="187" x2="213" y2="213" stroke="#c0392b" stroke-width="7.0" stroke-linecap="round"/><line x1="213" y1="187" x2="187" y2="213" stroke="#c0392b" stroke-width="7.0" stroke-linecap="round"/><text x="200" y="150" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Not in the gully bottom</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Regroup on high, safe ground</text>
</svg>
