<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 404" font-family="sans-serif" role="img" aria-label="Hunt Mentor mastery ladder, five levels from the bottom up. 1, Rookie: licensed, safe, first trips with a partner. 2, Apprentice: first animals, clean shots, meat home. 3, Hunter: finds game alone, fills tags most years. 4, Guide: puts others on game, supervises. 5, Old Timer: teaches and gives back. Each step is seasons, not sessions. Opinion, not a rank BC gives.">
<rect width="400" height="404" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Five levels, many seasons</text>
<rect x="12" y="300" width="376" height="56" rx="8" fill="#8a9a6b"/>
<text x="24" y="323" font-size="17" font-weight="bold" fill="#fffaf0">1. Rookie</text>
<text x="24" y="344" font-size="15" fill="#fffaf0">Licensed, safe, first trips with a partner</text>
<rect x="38" y="236" width="350" height="56" rx="8" fill="#6b9a6b"/>
<text x="50" y="259" font-size="17" font-weight="bold" fill="#fffaf0">2. Apprentice</text>
<text x="50" y="280" font-size="15" fill="#fffaf0">First animals, clean shots, meat home</text>
<rect x="64" y="172" width="324" height="56" rx="8" fill="#2f3a2b"/>
<text x="76" y="195" font-size="17" font-weight="bold" fill="#fffaf0">3. Hunter</text>
<text x="76" y="216" font-size="15" fill="#fffaf0">Finds game alone, fills tags most years</text>
<rect x="90" y="108" width="298" height="56" rx="8" fill="#6b4f35"/>
<text x="102" y="131" font-size="17" font-weight="bold" fill="#fffaf0">4. Guide</text>
<text x="102" y="152" font-size="15" fill="#fffaf0">Puts others on game, supervises</text>
<rect x="116" y="44" width="272" height="56" rx="8" fill="#e8590c"/>
<text x="128" y="67" font-size="17" font-weight="bold" fill="#fffaf0">5. Old Timer</text>
<text x="128" y="88" font-size="15" fill="#fffaf0">Teaches and gives back</text>
<text x="200" y="374" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Each step is seasons, not sessions.</text>
<text x="200" y="394" font-size="15" fill="#6b5b4b" text-anchor="middle">Opinion, not a rank BC gives.</text>
</svg>
