<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="sans-serif">
  <rect x="0" y="0" width="400" height="380" fill="#fffaf0"/>
  <text x="200" y="26" font-size="19" font-weight="bold" fill="#23261f" text-anchor="middle">Five levels, many seasons</text>
  <g font-size="14" fill="#fffaf0">
    <rect x="20" y="300" width="360" height="54" rx="8" fill="#8a9a6b"/>
    <text x="40" y="323" font-weight="bold">1. Rookie</text>
    <text x="40" y="343">Licensed, safe, first trips with a partner</text>
    <rect x="60" y="238" width="320" height="54" rx="8" fill="#6b9a6b"/>
    <text x="80" y="261" font-weight="bold">2. Apprentice</text>
    <text x="80" y="281">First animals, clean shots, meat home</text>
    <rect x="100" y="176" width="280" height="54" rx="8" fill="#2f3a2b"/>
    <text x="120" y="199" font-weight="bold">3. Hunter</text>
    <text x="120" y="219">Finds game alone, fills tags most years</text>
    <rect x="140" y="114" width="240" height="54" rx="8" fill="#6b4f35"/>
    <text x="160" y="137" font-weight="bold">4. Guide</text>
    <text x="160" y="157">Puts others on game, supervises</text>
    <rect x="180" y="52" width="200" height="54" rx="8" fill="#e8590c"/>
    <text x="200" y="75" font-weight="bold">5. Old Timer</text>
    <text x="200" y="95">Teaches, gives back, knows when not to shoot</text>
  </g>
  <text x="20" y="372" font-size="12" fill="#23261f">Each step is seasons, not sessions. Opinion, not a rank BC gives.</text>
</svg>
