<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 358" font-family="sans-serif" role="img" aria-label="Rough fruit and seed calendar for southern BC, June to December. Salmonberry: June into July on the coast. Saskatoon and soopolallie: July into August. Huckleberry, Himalayan blackberry and chokecherry: August and September. Hawthorn: September and October. Apples: September into November. Rose hips, snowberry and kinnikinnick: from fall and hanging on into winter. Conifer seed: late summer into fall. Higher and shadier sites ripen later.">
<rect width="400" height="358" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Fruit and seed calendar, southern BC</text><text x="158.0" y="50" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Jun</text><text x="194.0" y="50" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Jul</text><text x="230.0" y="50" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Aug</text><text x="266.0" y="50" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Sep</text><text x="302.0" y="50" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Oct</text><text x="338.0" y="50" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Nov</text><text x="374.0" y="50" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Dec+</text><line x1="140.0" y1="56" x2="140.0" y2="330" stroke="#dfe6d3" stroke-width="1"/><line x1="176.0" y1="56" x2="176.0" y2="330" stroke="#dfe6d3" stroke-width="1"/><line x1="212.0" y1="56" x2="212.0" y2="330" stroke="#dfe6d3" stroke-width="1"/><line x1="248.0" y1="56" x2="248.0" y2="330" stroke="#dfe6d3" stroke-width="1"/><line x1="284.0" y1="56" x2="284.0" y2="330" stroke="#dfe6d3" stroke-width="1"/><line x1="320.0" y1="56" x2="320.0" y2="330" stroke="#dfe6d3" stroke-width="1"/><line x1="356.0" y1="56" x2="356.0" y2="330" stroke="#dfe6d3" stroke-width="1"/><line x1="392.0" y1="56" x2="392.0" y2="330" stroke="#dfe6d3" stroke-width="1"/><text x="132" y="75.0" font-size="14" fill="#2f3a2b" text-anchor="end">Salmonberry</text><rect x="140.0" y="62.0" width="54.0" height="17" rx="5" fill="#e07a3a"/><text x="132" y="97.5" font-size="14" fill="#2f3a2b" text-anchor="end">Saskatoon</text><rect x="176.0" y="84.5" width="54.0" height="17" rx="5" fill="#5b3a6b"/><text x="132" y="120.0" font-size="14" fill="#2f3a2b" text-anchor="end">Soopolallie</text><rect x="176.0" y="107.0" width="54.0" height="17" rx="5" fill="#c0392b"/><text x="132" y="142.5" font-size="14" fill="#2f3a2b" text-anchor="end">Huckleberry</text><rect x="212.0" y="129.5" width="72.0" height="17" rx="5" fill="#2c3e6b"/><text x="132" y="165.0" font-size="14" fill="#2f3a2b" text-anchor="end">Blackberry</text><rect x="212.0" y="152.0" width="72.0" height="17" rx="5" fill="#3d2a4a"/><text x="132" y="187.5" font-size="14" fill="#2f3a2b" text-anchor="end">Chokecherry</text><rect x="212.0" y="174.5" width="72.0" height="17" rx="5" fill="#6b1f2a"/><text x="132" y="210.0" font-size="14" fill="#2f3a2b" text-anchor="end">Hawthorn</text><rect x="248.0" y="197.0" width="72.0" height="17" rx="5" fill="#4a2a3a"/><text x="132" y="232.5" font-size="14" fill="#2f3a2b" text-anchor="end">Apples</text><rect x="248.0" y="219.5" width="90.0" height="17" rx="5" fill="#b33a1f"/><text x="132" y="255.0" font-size="14" fill="#2f3a2b" text-anchor="end">Rose hips</text><rect x="266.0" y="242.0" width="126.0" height="17" rx="5" fill="#e8590c"/><text x="132" y="277.5" font-size="14" fill="#2f3a2b" text-anchor="end">Snowberry</text><rect x="248.0" y="264.5" width="144.0" height="17" rx="5" fill="#9a9a9a"/><text x="132" y="300.0" font-size="14" fill="#2f3a2b" text-anchor="end">Kinnikinnick</text><rect x="248.0" y="287.0" width="144.0" height="17" rx="5" fill="#c0392b"/><text x="132" y="322.5" font-size="14" fill="#2f3a2b" text-anchor="end">Conifer seed</text><rect x="230.0" y="309.5" width="90.0" height="17" rx="5" fill="#6b4f35"/><text x="200.0" y="350" font-size="14" fill="#6b4f35" text-anchor="middle">Rough shape: higher and shadier ripens later (65%)</text>
</svg>
