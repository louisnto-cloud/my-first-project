<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Self rescue step 4: slide out on your belly, then roll away from the hole. Do not stand up near it.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4. Slide out, roll away</text><rect x="0" y="130" width="400" height="30" rx="0" fill="#bfe0f2"/><rect x="300" y="130" width="90" height="170" rx="0" fill="#2f5f88"/><rect x="120" y="120" width="80" height="16" rx="6" fill="#e8590c"/><circle cx="110" cy="126" r="12.0" fill="#d9b48f"/><line x1="220" y1="110" x2="152" y2="110" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><polygon points="140,110 152,117 152,103" fill="#e8590c"/><text x="200" y="90" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Roll, do not stand</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Roll several body lengths</text>
</svg>
