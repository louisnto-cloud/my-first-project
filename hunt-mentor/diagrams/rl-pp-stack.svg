<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Map sketch where three funnels stack in one place: a saddle in the ridge, a strip of timber running up to it, and a creek crossing just below. The spot where all three meet is marked with a big orange star.">
