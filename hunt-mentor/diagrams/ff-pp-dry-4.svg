<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 4 of safe dry fire: 10 minutes of slow presses on a stopwatch, then say &quot;Finished.&quot; out loud, take the snap cap out, and lock the rifle away first, before any ammunition comes back.">
