<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4. 10 minutes, then say finished</text><text x="200" y="130" font-size="48" font-weight="bold" fill="#2f3a2b" text-anchor="middle">10:00</text><text x="200" y="200" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">&quot;Finished.&quot; Snap cap out.</text><text x="200" y="230" font-size="15" fill="#2f3a2b" text-anchor="middle">rifle locked away first</text>
</svg>
