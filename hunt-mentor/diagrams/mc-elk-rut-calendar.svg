<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Rut calendar, August to November. Bulls start wallowing and bugling in late August. Most cows come into heat and are bred mid to late September. Cows not bred come into heat again about a month later, and possibly a third time in November. Region 8 seasons below: bow only 1 to 9 September, rifle for 6 point bulls 10 September to 20 October.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">The rut, August to November</text><line x1="188" y1="44" x2="188" y2="250" stroke="#8a9a6b" stroke-width="1"/><text x="218" y="52" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Sept</text><line x1="255" y1="44" x2="255" y2="250" stroke="#8a9a6b" stroke-width="1"/><text x="285" y="52" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Oct</text><line x1="325" y1="44" x2="325" y2="250" stroke="#8a9a6b" stroke-width="1"/><text x="355" y="52" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Nov</text><text x="170" y="52" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Aug</text><text x="140" y="81" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">Wallows, bugles</text><rect x="163" y="64" width="114" height="22" rx="4" fill="#8a9a6b"/><text x="140" y="111" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">1st heat</text><rect x="220" y="94" width="34" height="22" rx="4" fill="#e8590c"/><text x="140" y="141" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">2nd heat</text><rect x="285" y="124" width="38" height="22" rx="4" fill="#8b5a2b"/><text x="140" y="171" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">3rd, maybe</text><rect x="325" y="154" width="54" height="22" rx="4" fill="#9e9e9e"/><text x="140" y="213" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">R8 bow only</text><rect x="188" y="196" width="18" height="22" rx="4" fill="#2f3a2b"/><text x="140" y="243" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">R8 rifle</text><rect x="208" y="226" width="90" height="22" rx="4" fill="#b03a2e"/><text x="200" y="274" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Most cows bred mid to late Sept (90%)</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Seasons: Region 8 only (99%). Wallows: 70%</text>
</svg>
