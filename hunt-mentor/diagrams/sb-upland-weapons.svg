  <text x="200" y="296" font-size="13" fill="#2f3a2b" text-anchor="middle">Rifle: centrefire. Bow: classes B, C and D</text>
  <text x="200" y="316" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Handguns: never. Ducks, geese: no rifle</text>
