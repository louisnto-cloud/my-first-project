  <text x="222.0" y="56" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">.22</text>
  <text x="270.0" y="56" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Rifle</text>
  <text x="318.0" y="56" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Air gun</text>
  <text x="366.0" y="56" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bow</text>
  <rect x="4" y="68" width="392" height="64" rx="6" fill="#dfe6d3"/>
  <text x="10" y="98" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Grouse,</text>
  <text x="10" y="116" font-size="12" fill="#2f3a2b" text-anchor="start">ptarmigan</text>
