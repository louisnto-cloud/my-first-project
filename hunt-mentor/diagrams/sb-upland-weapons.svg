  <path d="M354.0 174 l8 8 l16 -20" fill="none" stroke="#2f6e3b" stroke-width="5"/>
  <rect x="4" y="212" width="392" height="64" rx="6" fill="#dfe6d3"/>
  <text x="10" y="242" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Quail, chukar,</text>
