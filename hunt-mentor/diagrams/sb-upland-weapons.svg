<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 326" font-family="sans-serif" role="img" aria-label="Grid of which firearm is legal for which upland bird, BC synopsis page 13, 97 to 99 percent. Grouse and ptarmigan: shotgun, .22 rimfire, centrefire rifle, air gun and bow all legal. Turkey: shotgun, .22 rimfire, air gun and bow legal, centrefire rifle not legal. Quail, chukar, partridge and pheasant: shotgun, air gun and bow only, no .22 and no centrefire rifle. Bows are classes B, C and D. Handguns are never legal for hunting. Ducks and geese: no rifle.">
  <rect width="400" height="326" fill="#fffaf0"/>
  <text x="200" y="24" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Which gun for which bird (97 to 99%)</text>
