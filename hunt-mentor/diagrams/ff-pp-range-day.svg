<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 328" font-family="sans-serif" role="img" aria-label="A 90 minute range day timeline. First 10 minutes: one cold shot. Then a zero check, then positions, then distance shots, then the shotgun or the .22 for the last 20 minutes. Blocks: cold shot 10 minutes, zero check 15, positions 25, distance 20, shotgun or .22 20. About 20 rifle rounds and 25 shotgun shells. Write results before you leave.">
<rect width="400" height="328" fill="#fffaf0"/>
<text x="200" y="27" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">One range day, 90 minutes</text>
<rect x="16.0" y="42" width="40.9" height="16" fill="#b3261e" stroke="#fffaf0" stroke-width="1.5"/>
<rect x="56.9" y="42" width="61.3" height="16" fill="#e8590c" stroke="#fffaf0" stroke-width="1.5"/>
<rect x="118.2" y="42" width="102.2" height="16" fill="#4a7fb0" stroke="#fffaf0" stroke-width="1.5"/>
<rect x="220.4" y="42" width="81.8" height="16" fill="#2f6e3b" stroke="#fffaf0" stroke-width="1.5"/>
<rect x="302.2" y="42" width="81.8" height="16" fill="#6f7f52" stroke="#fffaf0" stroke-width="1.5"/>
<text x="16" y="76" font-size="14" fill="#6b5b4b">0 min</text>
<text x="138.7" y="76" font-size="14" fill="#6b5b4b" text-anchor="middle">30 min</text>
<text x="261.3" y="76" font-size="14" fill="#6b5b4b" text-anchor="middle">60 min</text>
<text x="384" y="76" font-size="14" fill="#6b5b4b" text-anchor="end">90 min</text>
<rect x="8" y="86" width="384" height="34" rx="6" fill="#f4eedf"/>
<rect x="8" y="86" width="112" height="34" rx="6" fill="#b3261e"/>
<text x="64" y="109" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">10 min</text>
<text x="134" y="109" font-size="16" font-weight="bold" fill="#2f3a2b">Cold shot</text>
<rect x="8" y="124" width="384" height="34" rx="6" fill="#f4eedf"/>
<rect x="8" y="124" width="112" height="34" rx="6" fill="#e8590c"/>
<text x="64" y="147" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">15 min</text>
<text x="134" y="147" font-size="16" font-weight="bold" fill="#2f3a2b">Zero check</text>
<rect x="8" y="162" width="384" height="34" rx="6" fill="#f4eedf"/>
<rect x="8" y="162" width="112" height="34" rx="6" fill="#4a7fb0"/>
<text x="64" y="185" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">25 min</text>
<text x="134" y="185" font-size="16" font-weight="bold" fill="#2f3a2b">Positions</text>
<rect x="8" y="200" width="384" height="34" rx="6" fill="#f4eedf"/>
<rect x="8" y="200" width="112" height="34" rx="6" fill="#2f6e3b"/>
<text x="64" y="223" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">20 min</text>
<text x="134" y="223" font-size="16" font-weight="bold" fill="#2f3a2b">Distance</text>
<rect x="8" y="238" width="384" height="34" rx="6" fill="#f4eedf"/>
<rect x="8" y="238" width="112" height="34" rx="6" fill="#6f7f52"/>
<text x="64" y="261" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">20 min</text>
<text x="134" y="261" font-size="16" font-weight="bold" fill="#2f3a2b">Shotgun or .22</text>
<text x="200" y="294" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">About 20 rifle rounds, 25 shotgun shells</text>
<text x="200" y="316" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Write results before you leave</text>
</svg>
