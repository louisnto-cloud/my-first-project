<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A 90 minute range day timeline. First 10 minutes: one cold shot. Then a zero check, then positions, then distance shots, then the shotgun or the .22 for the last 20 minutes. About 20 rifle rounds and 25 shotgun shells. Write results before you leave.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">One range day, 90 minutes</text><rect x="20" y="110" width="40" height="50" rx="4" fill="#b3261e" stroke="#fffaf0" stroke-width="2"/><text x="40.0" y="100" font-size="13" font-weight="bold" fill="#b3261e" text-anchor="middle">Cold shot</text><rect x="60" y="110" width="60" height="50" rx="4" fill="#e8590c" stroke="#fffaf0" stroke-width="2"/><text x="90.0" y="186" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="middle">Zero check</text><rect x="120" y="110" width="100" height="50" rx="4" fill="#4a7fb0" stroke="#fffaf0" stroke-width="2"/><text x="170.0" y="100" font-size="13" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Positions</text><rect x="220" y="110" width="80" height="50" rx="4" fill="#2f6e3b" stroke="#fffaf0" stroke-width="2"/><text x="260.0" y="186" font-size="13" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Distance</text><rect x="300" y="110" width="80" height="50" rx="4" fill="#8a9a6b" stroke="#fffaf0" stroke-width="2"/><text x="340.0" y="100" font-size="13" font-weight="bold" fill="#8a9a6b" text-anchor="middle">Shotgun or .22</text><text x="20" y="210" font-size="13" fill="#23261f" text-anchor="middle">0 min</text><text x="140" y="210" font-size="13" fill="#23261f" text-anchor="middle">30 min</text><text x="260" y="210" font-size="13" fill="#23261f" text-anchor="middle">60 min</text><text x="380" y="210" font-size="13" fill="#23261f" text-anchor="middle">90 min</text><text x="200" y="240" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">About 20 rifle rounds, 25 shotgun shells</text><text x="200" y="258" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Write results before you leave</text>
</svg>
