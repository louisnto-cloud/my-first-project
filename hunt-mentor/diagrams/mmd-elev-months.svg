<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A band chart of rough elevation by month. Low January to March, climbing in April and May, high June to September, coming down in October and November, low in December. Snow decides the timing each year and some deer stay low all year. Exact elevations need a map check.">
<rect width="400" height="300" fill="#fffaf0"/>
