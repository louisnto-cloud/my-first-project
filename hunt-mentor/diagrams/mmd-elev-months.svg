in="round"/><rect x="330" y="50" width="60" height="140" fill="#e8590c" opacity=".12"/><text x="200" y="244" font-size="14" fill="#23261f" text-anchor="middle">Snow decides the timing each year (85%)</text><text x="200" y="264" font-size="14" fill="#23261f" text-anchor="middle">Some deer stay low all year (90%)</text><text x="200" y="288" font-size="14" fill="#6b4f35" text-anchor="middle">Exact elevations: check the map (VERIFY)</text>
