<line x1="99.75" y1="147.25" x2="246.39" y2="85" stroke="#2f3a2b" stroke-width="1.5"/><circle cx="99.75" cy="147.25" r="2.6" fill="#2f3a2b"/><rect x="246.4" y="52.0" width="145.6" height="45.0" rx="5" fill="#fffaf0" stroke="#b23a12" stroke-width="1.2"/>
<text x="319.195" y="71" font-size="15" font-weight="bold" fill="#b23a12" text-anchor="middle">Support arm goes</text>
<text x="319.195" y="89" font-size="15" font-weight="bold" fill="#b23a12" text-anchor="middle">through the sling</text>
<line x1="151" y1="136" x2="221.994" y2="154" stroke="#2f3a2b" stroke-width="1.5"/><circle cx="151" cy="136" r="2.6" fill="#2f3a2b"/><rect x="222.0" y="132.0" width="170.0" height="63.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
