<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Hasty sling, a tip: the support arm goes through the sling, which wraps around the upper arm and pulls the rifle tight to the shoulder for a steadier hold. Practise it dry before you trust it.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hasty sling (Tip)</text><g transform="translate(150 250) scale(1.0)"><circle cx="0" cy="-78" r="9" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3.5"/><line x1="0" y1="-68" x2="0" y2="-30" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-30" x2="-10" y2="0" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-30" x2="10" y2="0" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-60" x2="14" y2="-44" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-60" x2="-12" y2="-44" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/></g><line x1="150" y1="176" x2="330" y2="166" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/><path d="M178 175 Q 168 200 150 205 Q 140 190 152 178" fill="none" stroke="#e8590c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="210" font-size="14" fill="#2f3a2b" text-anchor="middle">Support arm goes</text><text x="280" y="228" font-size="14" fill="#2f3a2b" text-anchor="middle">through the sling,</text><text x="280" y="246" font-size="14" fill="#2f3a2b" text-anchor="middle">sling wraps the arm,</text><text x="280" y="264" font-size="14" fill="#2f3a2b" text-anchor="middle">pull tight to the shoulder</text><text x="200.0" y="288" font-size="13" fill="#2f3a2b" text-anchor="middle">Practise it dry before trusting it</text>
</svg>
