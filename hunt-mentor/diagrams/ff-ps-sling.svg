<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 298" font-family="sans-serif" role="img" aria-label="Hasty sling, a tip, shown on a seated shooter: the support arm goes through the sling, which wraps around the upper arm and pulls the rifle tight to the shoulder for a steadier hold. Practise it dry before you trust it.">
