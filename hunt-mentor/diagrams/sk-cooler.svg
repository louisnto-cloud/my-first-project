<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif" role="img" aria-label="Cooler cross section: frozen water jugs or bagged ice on the bottom, meat in game bags on top, a thermometer reading under 4 degrees, and a drain for melt water emptied daily. Lid shut, cooler in the shade, never in the cab. Tip: a 70 litre cooler holds a boned deer with ice.">
<rect width="400" height="320" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cooler: ice under, meat on top</text>
<g data-tip="Lid shut, in the shade|Keep the lid closed and the cooler in the shade of the truck, not the cab.">
<rect x="20" y="64" width="238" height="148" rx="12" fill="#f2f2ee" stroke="#2f3a2b" stroke-width="2.4"/>
<rect x="29" y="74" width="220" height="128" rx="6" fill="#dfe9f2" stroke="#9fb3c6" stroke-width="1.4"/>
<rect x="16" y="50" width="246" height="20" rx="7" fill="#4a7fb0" stroke="#2c5d86" stroke-width="2"/>
<rect x="117" y="44" width="44" height="8" rx="3" fill="#2c5d86"/>
<rect x="10" y="120" width="10" height="24" rx="3" fill="#2c5d86"/>
</g>
<g data-tip="Ice on the bottom|Frozen water jugs or bagged ice go on the bottom, meat on top. A warm October afternoon in the Thompson can stay above 10°C: bring ice (Tip).">
<path d="M40 168 H84 V200 H40z" fill="#e8f4fb" stroke="#4a7fb0" stroke-width="2"/><rect x="68" y="160" width="10" height="9" rx="2" fill="#4a7fb0"/><path d="M46 168 C46 158 62 158 62 168" stroke="#4a7fb0" stroke-width="2.4" fill="none"/><path d="M46 180 H78" stroke="#b6d3ea" stroke-width="2" fill="none"/>
<path d="M150 168 H194 V200 H150z" fill="#e8f4fb" stroke="#4a7fb0" stroke-width="2"/><rect x="178" y="160" width="10" height="9" rx="2" fill="#4a7fb0"/><path d="M156 168 C156 158 172 158 172 168" stroke="#4a7fb0" stroke-width="2.4" fill="none"/><path d="M156 180 H188" stroke="#b6d3ea" stroke-width="2" fill="none"/>
<path d="M92 200 C88 182 94 170 114 170 C134 170 140 182 136 200z" fill="#f4fbff" stroke="#4a7fb0" stroke-width="1.8"/><rect x="100" y="182" width="9" height="8" rx="2" fill="#cfe5f3" stroke="#9fc3e0" stroke-width="1"/><rect x="112" y="178" width="9" height="8" rx="2" fill="#cfe5f3" stroke="#9fc3e0" stroke-width="1"/><rect x="120" y="188" width="9" height="8" rx="2" fill="#cfe5f3" stroke="#9fc3e0" stroke-width="1"/><rect x="106" y="190" width="9" height="8" rx="2" fill="#cfe5f3" stroke="#9fc3e0" stroke-width="1"/>
<path d="M200 200 C196 182 202 170 222 170 C242 170 248 182 244 200z" fill="#f4fbff" stroke="#4a7fb0" stroke-width="1.8"/><rect x="208" y="182" width="9" height="8" rx="2" fill="#cfe5f3" stroke="#9fc3e0" stroke-width="1"/><rect x="220" y="178" width="9" height="8" rx="2" fill="#cfe5f3" stroke="#9fc3e0" stroke-width="1"/><rect x="228" y="188" width="9" height="8" rx="2" fill="#cfe5f3" stroke="#9fc3e0" stroke-width="1"/><rect x="214" y="190" width="9" height="8" rx="2" fill="#cfe5f3" stroke="#9fc3e0" stroke-width="1"/>
<rect x="280" y="148" width="112" height="46" rx="6" fill="#fffaf0" stroke="#4a7fb0" stroke-width="1.6"/>
<text x="336" y="168" font-size="16" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Ice under</text>
<text x="336" y="186" font-size="15" fill="#4a7fb0" text-anchor="middle">jugs or bags</text>
<line x1="244" y1="186" x2="280" y2="172" stroke="#4a7fb0" stroke-width="1.6"/><circle cx="244" cy="186" r="3" fill="#4a7fb0"/>
</g>
<g data-tip="Meat in game bags|Game bags, not plastic or tarps: tarps trap heat. Meat never sits in water.">
<path d="M34 94 C44 86 84 86 94 94 L98 158 H30z" fill="#f6f0e2" stroke="#b9ab8a" stroke-width="1.6"/><path d="M48 91 C56 96 72 96 80 91" stroke="#8b7a5a" stroke-width="2" fill="none"/><ellipse cx="64" cy="130" rx="20" ry="13" fill="#c0392b" opacity=".55"/>
<path d="M106 94 C116 86 156 86 166 94 L170 158 H102z" fill="#f6f0e2" stroke="#b9ab8a" stroke-width="1.6"/><path d="M120 91 C128 96 144 96 152 91" stroke="#8b7a5a" stroke-width="2" fill="none"/><ellipse cx="136" cy="130" rx="20" ry="13" fill="#c0392b" opacity=".55"/>
<path d="M178 94 C186 87 214 87 222 94 L226 158 H174z" fill="#f6f0e2" stroke="#b9ab8a" stroke-width="1.6"/><path d="M190 91 C196 96 206 96 212 91" stroke="#8b7a5a" stroke-width="2" fill="none"/><ellipse cx="200" cy="130" rx="18" ry="13" fill="#c0392b" opacity=".55"/>
<rect x="280" y="94" width="112" height="46" rx="6" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.6"/>
<text x="336" y="114" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Meat on top</text>
<text x="336" y="132" font-size="15" fill="#2f3a2b" text-anchor="middle">in game bags</text>
<line x1="200" y1="130" x2="280" y2="118" stroke="#2f3a2b" stroke-width="1.6"/><circle cx="200" cy="130" r="3" fill="#2f3a2b"/>
</g>
<g data-tip="Under 4°C (40°F)|A cheap thermometer inside. Above 4°C, add ice. 4 to 60°C is the danger zone: bacteria can double every 20 minutes.">
<rect x="234" y="80" width="10" height="62" rx="5" fill="#ffffff" stroke="#2f3a2b" stroke-width="1.6"/><rect x="237.5" y="114" width="3" height="26" fill="#c0392b"/><circle cx="239" cy="146" r="7" fill="#c0392b" stroke="#2f3a2b" stroke-width="1.6"/>
<rect x="280" y="40" width="112" height="46" rx="6" fill="#fffaf0" stroke="#2f6e3b" stroke-width="1.6"/>
<text x="336" y="60" font-size="16" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Under 4°C</text>
<text x="336" y="78" font-size="15" fill="#2f6e3b" text-anchor="middle">(40°F)</text>
<line x1="244" y1="92" x2="280" y2="66" stroke="#2f6e3b" stroke-width="1.6"/><circle cx="244" cy="92" r="3" fill="#2f6e3b"/>
</g>
<g data-tip="Drain melt daily|Drain the melt water every day. Meat never sits in water.">
<rect x="258" y="184" width="14" height="10" rx="2" fill="#2f3a2b"/>
<path d="M268 200 C264 208 272 208 268 200z" fill="#4a7fb0"/>
<path d="M268 212 C264 220 272 220 268 212z" fill="#4a7fb0"/>
<rect x="280" y="202" width="112" height="46" rx="6" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.6"/>
<text x="336" y="222" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Drain melt</text>
<text x="336" y="240" font-size="15" fill="#2f3a2b" text-anchor="middle">every day</text>
</g>
<text x="200" y="278" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Lid shut, in the shade, never in the cab</text>
<g data-tip="Two coolers (Tip)|One for quarters, one for loins, neck and trim. A 70 litre cooler holds a boned deer with ice.">
<text x="200" y="304" font-size="15" fill="#6b5b4b" text-anchor="middle">Tip: a 70 L cooler holds a boned deer with ice</text>
</g>
</svg>
