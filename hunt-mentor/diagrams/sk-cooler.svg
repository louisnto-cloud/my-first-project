<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Cooler cross section: frozen water jugs or bagged ice on the bottom, meat in game bags on top, a thermometer reading under 4 degrees, and a drain for melt water emptied daily. Lid shut, cooler in the shade.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
