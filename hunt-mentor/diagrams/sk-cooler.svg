"100" width="12" height="60" rx="6" fill="#fff" stroke="#23261f" stroke-width="2"/><rect x="321" y="132" width="6" height="26" fill="#b3261e"/><text x="336" y="118" font-size="14" font-weight="bold" fill="#2e7d32">Under</text><text x="336" y="134" font-size="14" font-weight="bold" fill="#2e7d32">4°C</text><text x="200" y="272" font-size="14" text-anchor="middle" fill="#2f3a2b">Lid shut, in the shade, never in the cab</text><text x="200" y="292" font-size="14" text-anchor="middle" fill="#2f3a2b">Tip: a 70 L cooler holds a boned deer with ice</text>
</svg>
