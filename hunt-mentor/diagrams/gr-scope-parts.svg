<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Parts of a rifle scope, side view. Eyepiece at the back with the focus ring, then the power ring that zooms 3 to 9 times, the tube held by the rings, the elevation turret on top for up and down, the windage turret on the side for left and right, and the objective bell at the front with a 40 mm lens.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Parts of a scope: 3 to 9x40</text>
  <!-- scope body -->
  <path d="M20 128 L70 134 L70 166 L20 172 Z" fill="#2f3a2b"/>
  <rect x="70" y="134" width="44" height="32" fill="#4a4f48"/>
  <g stroke="#fffaf0" stroke-width="1.5"><line x1="80" y1="134" x2="80" y2="166"/><line x1="90" y1="134" x2="90" y2="166"/><line x1="100" y1="134" x2="100" y2="166"/></g>
  <rect x="114" y="138" width="170" height="24" fill="#2f3a2b"/>
  <path d="M284 138 L320 118 L380 118 L380 182 L320 182 L284 162 Z" fill="#2f3a2b"/>
  <rect x="376" y="122" width="6" height="56" fill="#4a7fb0"/>
  <rect x="186" y="108" width="28" height="30" rx="3" fill="#4a4f48" stroke="#2f3a2b" stroke-width="2"/>
  <circle cx="200" cy="150" r="13" fill="#4a4f48" stroke="#fffaf0" stroke-width="2"/>
  <!-- rings -->
  <g fill="#8a9a6b"><rect x="128" y="134" width="16" height="44"/><rect x="250" y="134" width="16" height="44"/></g>
  <rect x="110" y="178" width="180" height="8" fill="#6b6f68"/>
  <!-- leaders -->
  <g stroke="#2f3a2b" stroke-width="1.2">
    <line x1="40" y1="128" x2="40" y2="70"/><line x1="92" y1="134" x2="110" y2="94"/><line x1="200" y1="108" x2="200" y2="62"/>
    <line x1="350" y1="118" x2="350" y2="70"/><line x1="200" y1="163" x2="200" y2="236"/><line x1="136" y1="178" x2="100" y2="236"/>
    <line x1="379" y1="182" x2="350" y2="236"/><line x1="160" y1="186" x2="160" y2="276"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">
    <text x="44" y="64">Eyepiece</text><text x="116" y="88">Power ring 3 to 9</text>
    <text x="200" y="56" fill="#e8590c">Elevation: up, down</text>
    <text x="340" y="64">Objective bell</text>
    <text x="220" y="252" fill="#e8590c">Windage: left, right</text><text x="70" y="252">Ring</text>
    <text x="340" y="252" fill="#4a7fb0">40 mm lens</text><text x="160" y="292">Rail on the rifle</text>
  </g>
</svg>
