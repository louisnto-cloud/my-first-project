<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Cold water 1, 10, 1. About 1 minute to get your breathing under control. About 10 minutes of useful movement to get out or to safety. Up to about 1 hour before you pass out from cold. Wear the PFD zipped so you float through all three.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="28" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fall in cold water: 1, 10, 1</text>
  <g font-weight="bold" text-anchor="middle">
    <circle cx="70" cy="110" r="50" fill="#4a7fb0"/><text x="70" y="108" font-size="30" fill="#fff">1</text><text x="70" y="130" font-size="14" fill="#fff">minute</text>
    <circle cx="200" cy="110" r="50" fill="#e8590c"/><text x="200" y="108" font-size="30" fill="#fff">10</text><text x="200" y="130" font-size="14" fill="#fff">minutes</text>
    <circle cx="330" cy="110" r="50" fill="#2f3a2b"/><text x="330" y="108" font-size="30" fill="#fff">1</text><text x="330" y="130" font-size="14" fill="#fff">hour</text>
  </g>
  <g font-size="14" fill="#2f3a2b" text-anchor="middle">
    <text x="70" y="186">control</text><text x="70" y="204">breathing</text>
    <text x="200" y="186">useful</text><text x="200" y="204">movement</text>
    <text x="330" y="186">before you</text><text x="330" y="204">pass out</text>
  </g>
  <rect x="12" y="232" width="376" height="56" rx="8" fill="#e8590c"/>
  <text x="200" y="256" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">PFD worn and zipped, every minute</text>
  <text x="200" y="276" font-size="14" fill="#fff" text-anchor="middle">Times are rough guides (75%)</text>
</svg>
