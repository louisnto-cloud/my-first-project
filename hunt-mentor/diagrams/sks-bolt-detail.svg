<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="The SKS bolt side on: 1 the firing pin, in orange, floating free with no spring; 2 the extractor at the front right; 3 the bolt face.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Inside the bolt</text>
<polygon points="40.0,120.8 54.0,100.0 360.0,100.0 360.0,183.2 40.0,183.2" fill="#D9DCD7" stroke="#17201A" stroke-width="1.5" stroke-linejoin="round"/><line x1="44.0" y1="145.8" x2="356.0" y2="145.8" stroke="#FF6A13" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 4"/><rect x="338.0" y="177.2" width="20.0" height="7.0" rx="0" fill="#59625C" stroke="#17201A" stroke-width="1"/><g data-tip="Firing pin|Floats free inside the bolt with no spring. Must rattle when you shake the bolt."><line x1="220.0" y1="140.0" x2="220.0" y2="210.0" stroke="#17201A" stroke-width="1.5"/><circle cx="220.0" cy="140.0" r="3" fill="#17201A"/><circle cx="220.0" cy="210.0" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="2"/><text x="220.0" y="215.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text></g><g data-tip="Extractor|Claw at the front right. Pulls the case out."><line x1="345.0" y1="182.0" x2="340.0" y2="210.0" stroke="#17201A" stroke-width="1.5"/><circle cx="345.0" cy="182.0" r="3" fill="#17201A"/><circle cx="340.0" cy="210.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="340.0" y="215.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text></g><g data-tip="Bolt face|Clean it after every corrosive shoot."><line x1="365.0" y1="140.0" x2="380.0" y2="90.0" stroke="#17201A" stroke-width="1.5"/><circle cx="365.0" cy="140.0" r="3" fill="#17201A"/><circle cx="380.0" cy="90.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="380.0" y="95.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text></g><circle cx="25.0" cy="236.0" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="2"/><text x="25.0" y="241.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="41.0" y="241.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Firing pin: free, no spring</text><circle cx="25.0" cy="258.0" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="25.0" y="263.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="41.0" y="263.0" font-size="14" fill="#17201A" text-anchor="start">Extractor</text><circle cx="25.0" cy="280.0" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="25.0" y="285.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="41.0" y="285.0" font-size="14" fill="#17201A" text-anchor="start">Bolt face</text>
</svg>
