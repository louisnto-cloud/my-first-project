<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 334" font-family="sans-serif" role="img" aria-label="Working the CZ 457 bolt in 4 moves: 1 lift the handle 60 degrees, 2 pull it back to the stop, 3 push it forward, 4 turn it down to lock. Closing the bolt feeds a round from the magazine and cocks the striker."><rect x="0" y="0" width="400" height="334" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Work the bolt: 4 moves</text><rect x="10" y="42" width="184" height="112" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><rect x="60" y="96" width="120" height="22" rx="3" fill="#4A5156"/><rect x="100" y="102" width="44" height="10" fill="#2B3034"/><rect x="64" y="103" width="80" height="8" fill="#C9CFD3"/><rect x="48" y="99" width="16" height="16" rx="3" fill="#2B3034"/><path d="M76 107 L84 83" stroke="#2B3034" stroke-width="5" stroke-linecap="round"/><circle cx="86" cy="78" r="6" fill="#2B3034"/><circle cx="28" cy="60" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="28" y="65" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><text x="44" y="66" font-size="15" font-weight="bold" text-anchor="start" fill="#1F3D2B">Lift 60 degrees</text><line x1="102" y1="111" x2="102.0" y2="92.0" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><path d="M102 81 L96.0 92.0 L108.0 92.0z" fill="#FF6A13"/><rect x="206" y="42" width="184" height="112" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><rect x="256" y="96" width="120" height="22" rx="3" fill="#4A5156"/><rect x="296" y="102" width="44" height="10" fill="#2B3034"/><rect x="226" y="103" width="80" height="8" fill="#C9CFD3"/><rect x="210" y="99" width="16" height="16" rx="3" fill="#2B3034"/><path d="M238 107 L246 83" stroke="#2B3034" stroke-width="5" stroke-linecap="round"/><circle cx="248" cy="78" r="6" fill="#2B3034"/><circle cx="224" cy="60" r="11" fill="#FF6A13" stroke="#FFFFFF" strok