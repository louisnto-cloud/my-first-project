<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Write down how much you drink during the hike.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="30" cy="32" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="30" y="39" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">2</text>
<text x="56" y="39" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="start">Count what you drink</text>
<rect x="160" y="80" width="40" height="110" rx="8" fill="#4a7fb0"/><rect x="166" y="66" width="28" height="16" rx="3" fill="#23261f"/><text x="270" y="130" font-family="sans-serif" font-size="22" font-weight="bold" fill="#4a7fb0" text-anchor="middle">+ 1.0 L</text>
<rect x="10" y="262" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="285.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Note every bottle.</text>
