<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 2 of a map bearing: the compass base plate still lies from You to the Saddle, and the ring is turned until its red north lines run parallel to the blue north lines on the map, N toward the top. The needle is ignored.">
<rect width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c"/><text x="26" y="32" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<text x="52" y="32" font-size="18" font-weight="bold" fill="#2f3a2b">Turn ring: N lines to map north</text>
<rect x="40" y="60" width="320" height="200" fill="#dfe6d3" stroke="#8b5a2b" stroke-width="2"/>
<line x1="100" y1="60" x2="100" y2="260" stroke="#4a7fb0" stroke-width="1.2"/>
<line x1="180" y1="60" x2="180" y2="260" stroke="#4a7fb0" stroke-width="1.2"/>
<line x1="260" y1="60" x2="260" y2="260" stroke="#4a7fb0" stroke-width="1.2"/>
<line x1="340" y1="60" x2="340" y2="260" stroke="#4a7fb0" stroke-width="1.2"/>
<line x1="374" y1="96" x2="374" y2="71.6" stroke="#4a7fb0" stroke-width="2.4" stroke-linecap="round"/><polygon points="374,64 369,74 379,74" fill="#4a7fb0"/>
<text x="374" y="114" font-size="16" font-weight="bold" fill="#4a7fb0" text-anchor="middle">N</text>
<circle cx="110" cy="220" r="7" fill="#2f3a2b"/><text x="110" y="250" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">You</text>
<circle cx="290" cy="100" r="7" fill="#e8590c"/><text x="290" y="88" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle" stroke="#dfe6d3" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">Saddle</text>
<g transform="translate(200 160)">
<g transform="rotate(56)">
<rect x="-34" y="-82" width="68" height="134" rx="7" fill="#e7f0f7" stroke="#2f3a2b" stroke-width="2"/>
<line x1="0" y1="-48" x2="0" y2="-68" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><polygon points="0,-77 -6.6,-65 6.6,-65" fill="#e8590c"/>
</g>
<circle r="31" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<line x1="-10" y1="-8" x2="-10" y2="24" stroke="#c92a2a" stroke-width="1.6"/><line x1="10" y1="-8" x2="10" y2="24" stroke="#c92a2a" stroke-width="1.6"/>
<path d="M0 -12 L6 -3 L-6 -3 Z" fill="none" stroke="#c92a2a" stroke-width="2"/>
<text y="-15" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">N</text>
<path d="M0 -22 L4 1 L-4 1 Z" fill="#c92a2a" opacity=".35"/><path d="M0 22 L4 1 L-4 1 Z" fill="#ffffff" stroke="#2f3a2b" stroke-width="1" opacity=".5"/>
</g>
<text x="50" y="286" font-size="15" fill="#2f3a2b">Ignore the needle. Lines match north lines.</text>
</svg>
