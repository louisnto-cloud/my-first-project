<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 782" font-family="sans-serif" role="img" aria-label="Region 2 bird limits. Grouse: sooty, ruffed, spruce together: 10 (30). Ptarmigan. Not in MU 2-4: 5 (15). Pheasant, cocks. MUs 2-4, 2-8 only: 2 (6). Band tailed pigeon: 5 (15). Ducks: 8 (24). Coots, snipe: 10 (30) each. Canada and cackling geese: 10 (30). White fronted geese: 5 (15). Snow and Ross's geese, MUs 2-4 and 2-5: 15 (45), Ross's 5 (15) at most. Snow and Ross's geese, other MUs (includes Mission, 2-8): 10 (30), at most 5 Ross's a day (Note H; federal table agrees (90%)). Brant. MU 2-4 only, March: 3 (9).">
