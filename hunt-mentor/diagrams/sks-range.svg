<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="sans-serif" role="img" aria-label="Range rings around the hunter: 50 m, 100 m, and 150 m marked as your limit with the SKS. Most coastal deer shots are close (a Tip).">
<rect x="0" y="0" width="400" height="290" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">SKS deer range</text>
<circle cx="200.0" cy="260.0" r="210.0" fill="#DCE5D3" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="200.0" cy="260.0" r="150.0" fill="#C9D8BE" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="200.0" cy="260.0" r="80.0" fill="#B2C7A4" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="200.0" cy="255.0" r="8.0" fill="#FF6A13" stroke="#17201A" stroke-width="1.5"/><text x="200.0" y="196.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">50 m</text><text x="200.0" y="124.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">100 m</text><text x="200.0" y="44.0" font-size="14" font-weight="bold" fill="#B3261E" text-anchor="middle">150 m: your limit</text><text x="330.0" y="230.0" font-size="14" fill="#17201A" text-anchor="middle">Most coastal</text><text x="330.0" y="250.0" font-size="14" fill="#17201A" text-anchor="middle">deer shots</text><text x="330.0" y="270.0" font-size="14" fill="#17201A" text-anchor="middle">are close (Tip)</text>
</svg>
