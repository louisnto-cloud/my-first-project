<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif" role="img" aria-label="What to look for: deer parts, not whole deer. In a timber edge scene: 1 a horizontal back line among vertical trunks, 2 four thin vertical legs under a bush, 3 an ear flicking above grass, 4 a white rump patch, 5 an antler tip catching light.">
  <rect width="400" height="320" fill="#fffaf0"/>
  <rect x="0" y="30" width="400" height="250" fill="#dfe6d3"/>
  <g fill="#6b4f35"><rect x="30" y="40" width="10" height="150"/><rect x="70" y="40" width="10" height="150"/><rect x="110" y="40" width="10" height="150"/><rect x="150" y="40" width="10" height="150"/></g>
  <g fill="#2f3a2b" opacity=".75"><polygon points="20,80 35,30 50,80"/><polygon points="60,90 75,34 90,90"/><polygon points="100,84 115,32 130,84"/><polygon points="140,88 155,36 170,88"/></g>
  <rect x="40" y="150" width="90" height="16" rx="8" fill="#8b5a2b"/>
  <ellipse cx="260" cy="150" rx="46" ry="26" fill="#8a9a6b"/>
  <g stroke="#8b5a2b" stroke-width="4"><line x1="240" y1="170" x2="240" y2="200"/><line x1="250" y1="170" x2="250" y2="200"/><line x1="270" y1="170" x2="270" y2="200"/><line x1="280" y1="170" x2="280" y2="200"/></g>
  <rect x="190" y="230" width="140" height="30" fill="#c9b79c"/>
  <path d="M300 230 l-6 -14 l10 6 Z" fill="#8b5a2b"/>
  <ellipse cx="80" cy="238" rx="18" ry="12" fill="#ffffff" stroke="#c9b79c" stroke-width="2"/>
  <path d="M340 110 l6 -18 m-6 18 l-12 -12" stroke="#8b5a2b" stroke-width="3" fill="none"/>
  <circle cx="346" cy="92" r="5" fill="#ffd34d"/>
  <g font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">
    <circle cx="85" cy="134" r="12" fill="#e8590c"/><text x="85" y="140">1</text>
    <circle cx="222" cy="190" r="12" fill="#e8590c"/><text x="222" y="196">2</text>
    <circle cx="322" cy="212" r="12" fill="#e8590c"/><text x="322" y="218">3</text>
    <circle cx="112" cy="238" r="12" fill="#e8590c"/><text x="112" y="244">4</text>
    <circle cx="370" cy="96" r="12" fill="#e8590c"/><text x="370" y="102">5</text>
  </g>
  <text x="200" y="22" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Look for parts, not a whole deer</text>
  <g font-size="14" fill="#2f3a2b"><text x="10" y="300">1 flat back  2 legs  3 ear flick</text><text x="10" y="316">4 white rump  5 antler glint</text></g>
</svg>
