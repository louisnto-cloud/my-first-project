<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-label="A sample legend. Red: no go, closed, no shooting or private. Tan: pressure within about 1 kilometre of open roads. Green: habitat such as winter range, burns and wetlands. Binoculars: glassing point with its best wind. Pin: sign such as tracks, rubs, beds and pellets. Truck: parking, gate or road end. Dashed brown line: trail, route in and route out.">
<rect x="0" y="0" width="400" height="330" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">My map legend (Tip: make yours)</text>
<rect x="22" y="54" width="28" height="20" fill="#c0392b" opacity=".6"/><text x="66" y="69" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">No go: closed, no shooting, private</text>
<rect x="22" y="92" width="28" height="20" fill="#c08a3e" opacity=".5"/><text x="66" y="107" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Pressure: about 1 km from open roads</text>
<rect x="22" y="130" width="28" height="20" fill="#8a9a6b"/><text x="66" y="145" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Habitat: winter range, burns, wetlands</text>
<g transform="translate(36 178) scale(0.8)"><rect x="-14" y="-8" width="11" height="18" rx="3" fill="#2f3a2b"/><rect x="3" y="-8" width="11" height="18" rx="3" fill="#2f3a2b"/><rect x="-4" y="-4" width="8" height="6" fill="#2f3a2b"/><circle cx="-8.5" cy="10" r="4" fill="#4a7fb0"/><circle cx="8.5" cy="10" r="4" fill="#4a7fb0"/></g><text x="66" y="183" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Glassing point, with best wind</text>
<g><path d="M36 226 l-7 -12 a8 8 0 1 1 14 0 Z" fill="#e8590c"/><circle cx="36" cy="211" r="3" fill="#fff"/></g><text x="66" y="221" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Sign: tracks, rubs, beds, pellets</text>
<g transform="translate(36 260) scale(0.7)"><rect x="-22" y="-14" width="28" height="14" fill="#2f3a2b"/><path d="M6 -14 h10 l8 8 v6 h-18 Z" fill="#2f3a2b"/><circle cx="-12" cy="2" r="5" fill="#23261f"/><circle cx="14" cy="2" r="5" fill="#23261f"/></g><text x="66" y="259" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Parking, gate, road end</text>
<path d="M20 292 q 16 -14 32 0" stroke="#8b5a2b" stroke-width="4" fill="none" stroke-dasharray="6 4"/><text x="66" y="297" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Trail, route in, route out</text>
</svg>
