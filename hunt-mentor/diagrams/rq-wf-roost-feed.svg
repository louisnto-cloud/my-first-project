<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Map sketch. A roost lake where ducks rest and loaf safely in the day, and a field or marsh where they feed. A dashed flight line goes out at dusk and back at dawn. Mallards in Louisiana moved 3 to 15 kilometres between day and night sites.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Roost to feed: the daily commute</text>
<rect x="0" y="40" width="400" height="260" fill="#dfe6d3"/>
<ellipse cx="90" cy="200" rx="70" ry="40" fill="#4a7fb0"/>
<text x="90" y="205" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Roost water</text>
<text x="90" y="258" font-family="sans-serif" font-size="13" fill="#2f3a2b" text-anchor="middle">safe, calm, day loafing</text>
<rect x="250" y="70" width="130" height="80" fill="#e8d9a8" stroke="#8a9a6b"/>
<line x1="258" y1="78" x2="258" y2="142" stroke="#c9b37a" stroke-width="3"/>
<line x1="280" y1="78" x2="280" y2="142" stroke="#c9b37a" stroke-width="3"/>
<line x1="302" y1="78" x2="302" y2="142" stroke="#c9b37a" stroke-width="3"/>
<line x1="324" y1="78" x2="324" y2="142" stroke="#c9b37a" stroke-width="3"/>
<line x1="346" y1="78" x2="346" y2="142" stroke="#c9b37a" stroke-width="3"/>
<line x1="368" y1="78" x2="368" y2="142" stroke="#c9b37a" stroke-width="3"/>
<text x="315" y="168" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Field or marsh</text>
<text x="315" y="186" font-family="sans-serif" font-size="13" fill="#2f3a2b" text-anchor="middle">feeding</text>
<path d="M140 180 Q 220 90 250 100" stroke="#e8590c" stroke-width="3" fill="none" stroke-dasharray="8 6"/>
<path d="M250 130 Q 210 200 150 205" stroke="#2f3a2b" stroke-width="3" fill="none" stroke-dasharray="8 6"/>
<text x="190" y="100" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">dusk out</text><text x="215" y="220" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">dawn back</text>
<g transform="translate(200 125) scale(0.8)"><ellipse rx="13" ry="5" fill="#2f3a2b"/><circle cx="13" cy="-2" r="4" fill="#2f3a2b"/><path d="M16 -2 l6 1 l-6 2 Z" fill="#e8590c"/><path d="M-4 -2 L-14 -16 L6 -3 Z" fill="#2f3a2b"/><path d="M-4 2 L-12 15 L6 3 Z" fill="#2f3a2b"/></g><g transform="translate(220 175) scale(0.8)"><ellipse rx="13" ry="5" fill="#2f3a2b"/><circle cx="13" cy="-2" r="4" fill="#2f3a2b"/><path d="M16 -2 l6 1 l-6 2 Z" fill="#e8590c"/><path d="M-4 -2 L-14 -16 L6 -3 Z" fill="#2f3a2b"/><path d="M-4 2 L-12 15 L6 3 Z" fill="#2f3a2b"/></g>
<rect x="200" y="236" width="190" height="50" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/>
<text x="295" y="256" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Mallards: 3 to 15 km</text><text x="295" y="275" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">apart (85%, Louisiana)</text>
</svg>
