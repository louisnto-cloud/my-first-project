<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 396" font-family="sans-serif" role="img" aria-label="Where to look for quail, map view. A creek with brushy edges runs down the left. Blackberry and rose thickets sit beside an orchard and a grain field, and a small covey of quail is near one. A dirt road along the bottom shows tyre tracks and dusting spots near the brush. Orange stars mark the best spots: thick brush right beside food (Tip).">
<rect width="400" height="396" fill="#fffaf0"/>
<defs><pattern id="hf-quail-cover-rows" width="16" height="12" patternUnits="userSpaceOnUse"><rect width="16" height="12" fill="#d6dcb4"/><circle cx="10" cy="7.5" r="5.2" fill="#3e6230"/><circle cx="8" cy="6" r="5.2" fill="#5b8a43"/><circle cx="6.6" cy="4.8" r="2.3" fill="#7fae5b"/></pattern><pattern id="hf-quail-cover-grain" width="8" height="6" patternUnits="userSpaceOnUse"><rect width="8" height="6" fill="#e3c97a"/><path d="M0 3 H8" stroke="#c9a94f" stroke-width="1.4"/></pattern><clipPath id="hf-quail-cover-map"><rect x="8" y="8" width="384" height="292" rx="8"/></clipPath></defs>
<rect x="8" y="8" width="384" height="292" rx="8" fill="#ece6cc"/>
<g data-tip="Orchard|Food beside cover. Feeding quail seldom go more than 15 to 30 m out from cover.">
<rect x="262" y="8" width="130" height="136" fill="url(#hf-quail-cover-rows)" clip-path="url(#hf-quail-cover-map)"/>
<text x="327" y="136" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle" stroke="#f1edda" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">orchard</text>
</g>
<g data-tip="Grain field|Food. Quail feed mornings and evenings, then loaf in shrubs at midday.">
