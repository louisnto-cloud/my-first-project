<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Where to look for quail, map view. A creek with brushy edges, blackberry and rose thickets beside an orchard and a grain field, and a dirt road with tracks and dusting spots near the brush. Stars mark the best spots: thick brush right beside food.">
  <rect width="400" height="300" fill="#efe6cf"/>
  <rect x="250" y="20" width="140" height="120" fill="#dfe6d3"/>
  <g fill="#2f6e3b">
    <circle cx="270" cy="40" r="6"/><circle cx="300" cy="40" r="6"/><circle cx="330" cy="40" r="6"/><circle cx="360" cy="40" r="6"/>
    <circle cx="270" cy="70" r="6"/><circle cx="300" cy="70" r="6"/><circle cx="330" cy="70" r="6"/><circle cx="360" cy="70" r="6"/>
    <circle cx="270" cy="100" r="6"/><circle cx="300" cy="100" r="6"/><circle cx="330" cy="100" r="6"/><circle cx="360" cy="100" r="6"/>
  </g>
  <text x="320" y="132" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">orchard</text>
  <rect x="250" y="170" width="140" height="110" fill="#e3c97a"/>
  <text x="320" y="230" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">grain</text>
  <path d="M120 0 C 140 80, 100 160, 140 300" fill="none" stroke="#8a9a6b" stroke-width="50"/>
  <path d="M120 0 C 140 80, 100 160, 140 300" fill="none" stroke="#4a7fb0" stroke-width="6"/>
  <g fill="#6b7a50"><circle cx="200" cy="150" r="18"/><circle cx="222" cy="160" r="16"/><circle cx="210" cy="60" r="16"/></g>
  <text x="210" y="196" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">thickets</text>
  <path d="M0 260 L250 250" stroke="#c9b79c" stroke-width="16"/>
  <text x="20" y="290" font-size="14" fill="#2f3a2b">dirt road: tracks, dust spots</text>
  <g fill="#e8590c"><polygon points="232,124 236,134 246,134 238,140 241,150 232,144 223,150 226,140 218,134 228,134"/><polygon points="232,204 236,214 246,214 238,220 241,230 232,224 223,230 226,220 218,214 228,214"/></g>
  <text x="12" y="24" font-size="15" font-weight="bold" fill="#2f3a2b">Brushy creek</text>
  <text x="12" y="42" font-size="14" fill="#2f3a2b">Stars: brush beside food (Tip)</text>
</svg>
