<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 391" font-family="sans-serif" role="img" aria-label="Table of California quail calls, from bird guides, 70 percent. Assembly call, &quot;chi CA go&quot;: a bird lost from the covey, or the covey moving. Contact calls, soft clucks and pips, while feeding together. Alarm, a sharp &quot;pit pit&quot;, when danger is close. Advertising call, one loud &quot;cow&quot;, by unpaired males in spring. Fighting call, &quot;squill&quot;, by males sorting rank in spring.">
<rect width="400" height="391" fill="#fffaf0"/>
<g transform="translate(370 40) scale(2.2)"><path d="M-2 -2 v2 M2 -2 v2" stroke="#6b5b4b" stroke-width="1"/><ellipse cx="0" cy="-7" rx="8" ry="5.5" fill="#7d8590"/><path d="M-2 -5 C2 -3 6 -4 8 -7" stroke="#c9a46a" stroke-width="1.4" fill="none"/><circle cx="-6" cy="-12" r="3.6" fill="#5a5f66"/><path d="M-6 -15 C-8 -20 -4 -21 -3 -19" stroke="#1d1a16" stroke-width="1.6" fill="none"/><path d="M-9.5 -12 l-2 .8 l2 .6z" fill="#1d1a16"/><path d="M6 -9 L11 -10 L10 -6z" fill="#5a5f66"/></g>
<text x="12" y="26" font-size="17" font-weight="bold" fill="#2f3a2b">Quail calls and what they mean</text>
<rect x="8" y="52" width="384" height="56" rx="9" fill="#f4eedf"/>
<rect x="8" y="52" width="124" height="56" rx="9" fill="#e8590c"/>
<text x="70" y="86" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Assembly</text>
<path d="M146 70 q4 6 0 12 M152 66 q7 10 0 20" stroke="#e8590c" stroke-width="2.2" fill="none" stroke-linecap="round"/>
<text x="164" y="77" font-size="17" font-weight="bold" fill="#2f3a2b">&quot;chi CA go&quot;</text>
<text x="164" y="98" font-size="15" fill="#6b5b4b">Lost, or covey moving</text>
<rect x="8" y="115" width="384" height="56" rx="9" fill="#f4eedf"/>
<rect x="8" y="115" width="124" height="56" rx="9" fill="#6f7f4f"/>
<text x="70" y="149" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Contact</text>
<path d="M146 133 q4 6 0 12 M152 129 q7 10 0 20" stroke="#6f7f4f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
<text x="164" y="140" font-size="17" font-weight="bold" fill="#2f3a2b">soft clucks, pips</text>
<text x="164" y="161" font-size="15" fill="#6b5b4b">Feeding together</text>
<rect x="8" y="178" width="384" height="56" rx="9" fill="#f4eedf"/>
<rect x="8" y="178" width="124" height="56" rx="9" fill="#a33b2b"/>
<text x="70" y="212" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Alarm</text>
<path d="M146 196 q4 6 0 12 M152 192 q7 10 0 20" stroke="#a33b2b" stroke-width="2.2" fill="none" stroke-linecap="round"/>
<text x="164" y="203" font-size="17" font-weight="bold" fill="#2f3a2b">sharp &quot;pit pit&quot;</text>
<text x="164" y="224" font-size="15" fill="#6b5b4b">Danger close</text>
<rect x="8" y="241" width="384" height="56" rx="9" fill="#f4eedf"/>
<rect x="8" y="241" width="124" height="56" rx="9" fill="#4a7fb0"/>
<text x="70" y="275" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Advertising</text>
<path d="M146 259 q4 6 0 12 M152 255 q7 10 0 20" stroke="#4a7fb0" stroke-width="2.2" fill="none" stroke-linecap="round"/>
<text x="164" y="266" font-size="17" font-weight="bold" fill="#2f3a2b">one loud &quot;cow&quot;</text>
<text x="164" y="287" font-size="15" fill="#6b5b4b">Spring, unpaired male</text>
<rect x="8" y="304" width="384" height="56" rx="9" fill="#f4eedf"/>
<rect x="8" y="304" width="124" height="56" rx="9" fill="#8b5a2b"/>
<text x="70" y="338" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Fighting</text>
<path d="M146 322 q4 6 0 12 M152 318 q7 10 0 20" stroke="#8b5a2b" stroke-width="2.2" fill="none" stroke-linecap="round"/>
<text x="164" y="329" font-size="17" font-weight="bold" fill="#2f3a2b">&quot;squill&quot;</text>
<text x="164" y="350" font-size="15" fill="#6b5b4b">Spring, males sort rank</text>
<text x="12" y="381" font-size="14" fill="#6b5b4b">From bird guides (70%)</text>
</svg>
