<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Rough sketch, not exact: colour swatches as a person sees them beside a guess at how a deer sees them. Blaze orange, green and red turn dull yellow or grey brown. Blue jeans and white stay bright and bluish. Deer have no red cone; blue and ultraviolet stand out.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Colour: you vs a deer (rough sketch)</text><text x="130" y="56" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">you see</text><text x="290" y="56" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">deer (Tip)</text><rect x="90" y="68" width="80" height="30" rx="4" fill="#ff6a00" stroke="#23261f" stroke-width="1"/><rect x="250" y="68" width="80" height="30" rx="4" fill="#b8a35c" stroke="#23261f" stroke-width="1"/><text x="80" y="89" font-size="14" fill="#23261f" text-anchor="end">blaze orange</text><rect x="90" y="108" width="80" height="30" rx="4" fill="#3c8d2f" stroke="#23261f" stroke-width="1"/><rect x="250" y="108" width="80" height="30" rx="4" fill="#a8a060" stroke="#23261f" stroke-width="1"/><text x="80" y="129" font-size="14" fill="#23261f" text-anchor="end">green</text><rect x="90" y="148" width="80" height="30" rx="4" fill="#2f5fa8" stroke="#23261f" stroke-width="1"/><rect x="250" y="148" width="80" height="30" rx="4" fill="#3f63b8" stroke="#23261f" stroke-width="1"/><text x="80" y="169" font-size="14" fill="#23261f" text-anchor="end">blue jeans</text><rect x="90" y="188" width="80" height="30" rx="4" fill="#c62828" stroke="#23261f" stroke-width="1"/><rect x="250" y="188" width="80" height="30" rx="4" fill="#7c7458" stroke="#23261f" stroke-width="1"/><text x="80" y="209" font-size="14" fill="#23261f" text-anchor="end">red</text><rect x="90" y="228" width="80" height="30" rx="4" fill="#ffffff" stroke="#23261f" stroke-width="1"/><rect x="250" y="228" width="80" height="30" rx="4" fill="#e9f0ff" stroke="#23261f" stroke-width="1"/><text x="80" y="249" font-size="14" fill="#23261f" text-anchor="end">white</text><text x="200" y="284" font-size="14" fill="#6b4f35" text-anchor="middle">No red cone. Blue and UV stand out (75 to 85%)</text>
</svg>
