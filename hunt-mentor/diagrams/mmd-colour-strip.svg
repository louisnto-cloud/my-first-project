<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 332" font-family="sans-serif" role="img" aria-label="Rough sketch, not exact: colour swatches as a person sees them beside a guess at how a deer sees them, a tip. Blaze orange, green and red turn dull yellow or grey brown. Blue jeans and white stay bright and bluish. Deer have no red cone; blue and UV, ultraviolet, stand out, 75 to 85 percent.">
