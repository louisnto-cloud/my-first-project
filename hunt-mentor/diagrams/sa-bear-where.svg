<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Where black bears feed. Spring, from hunting sources: south facing grassy slopes, logging road edges and cutblocks that green up first, and avalanche chutes higher up. Fall near Heffley Creek, a tip: berry slopes, old orchards and fruit trees, cutblock edges, and creek bottoms with hawthorn and rose hips.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Where bears feed, spring and fall</text><rect x="8" y="40" width="188" height="254" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="2"/><text x="20" y="66" font-size="17" font-weight="bold" fill="#8a9a6b" text-anchor="start">Spring</text><circle cx="26" cy="100" r="5" fill="#8a9a6b"/><text x="38" y="105" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">South grassy slopes</text><circle cx="26" cy="144" r="5" fill="#8a9a6b"/><text x="38" y="149" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Green road edges</text><circle cx="26" cy="188" r="5" fill="#8a9a6b"/><text x="38" y="193" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Green cutblocks</text><circle cx="26" cy="232" r="5" fill="#8a9a6b"/><text x="38" y="237" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Avalanche chutes</text><rect x="204" y="40" width="188" height="254" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><text x="216" y="66" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">Fall</text><circle cx="222" cy="100" r="5" fill="#e8590c"/><text x="234" y="105" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Berry slopes</text><circle cx="222" cy="144" r="5" fill="#e8590c"/><text x="234" y="149" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Old orchards, fruit</text><circle cx="222" cy="188" r="5" fill="#e8590c"/><text x="234" y="193" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Cutblock edges</text><circle cx="222" cy="232" r="5" fill="#e8590c"/><text x="234" y="237" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Creeks: hawthorn, rose</text>
</svg>
