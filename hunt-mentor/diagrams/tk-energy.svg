<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 362" font-family="sans-serif" role="img" aria-label="Energy of a 150 grain .308 load: 3,590 joules at the muzzle, 2,840 at 100 m, 2,210 at 200 m, 1,700 at 300 m. An orange dashed line marks the 1,356 joule, 1,000 foot pound, rule of thumb. All bars stay above it to 300 m. A black tailed buck weighs 48 to 90 kg. Your limit is your skill, not energy.">
<rect x="0" y="0" width="400" height="362" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">150 gr .308 energy vs distance</text><line x1="60" y1="250" x2="370" y2="250" stroke="#1F3D2B" stroke-width="1.6"/><line x1="60" y1="250" x2="60" y2="60" stroke="#1F3D2B" stroke-width="1.6"/><rect x="74" y="70" width="54" height="180" fill="#1F3D2B"/><text x="101" y="64.5" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">3,590 J</text><text x="101" y="268" font-size="14" fill="#17201A" text-anchor="middle">0 m</text><rect x="150" y="108" width="54" height="142" fill="#1F3D2B"/><text x="177" y="102.0" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">2,840 J</text><text x="177" y="268" font-size="14" fill="#17201A" text-anchor="middle">100 m</text><rect x="226" y="140" width="54" height="110" fill="#1F3D2B"/><text x="253" y="133.5" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">2,210 J</text><text x="253" y="268" font-size="14" fill="#17201A" text-anchor="middle">200 m</text><rect x="302" y="165" width="54" height="85" fill="#1F3D2B"/><text x="329" y="159.0" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">1,700 J</text><text x="329" y="268" font-size="14" fill="#17201A" text-anchor="middle">300 m</text><line x1="60" y1="182" x2="370" y2="182" stroke="#FF6A13" stroke-width="2.5" stroke-dasharray="7 4"/><text x="16" y="70" font-size="14" fill="#1F3D2B" text-anchor="start" font-weight="bold">J</text><rect x="12" y="280" width="376" height="70" rx="8" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="24" y="302" font-size="14" fill="#17201A" text-anchor="start">Orange line: 1,356 J (1,000 ft lb) rule.</text><text x="24" y="322" font-size="14" fill="#17201A" text-anchor="start">Black tail buck: 48 to 90 kg.</text><text x="24" y="342" font-size="14" fill="#17201A" text-anchor="start">Your limit is your skill, not energy.</text>
</svg>
