<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 398" font-family="sans-serif" role="img" aria-label="The yearly service from the Tikka manual: 1 routine clean; 2 copper solvent in the bore; 3 a light oil film on all metal; 4 oil and check the sling studs; 5 strip, clean and grease the bolt; 6 check the extractor and ejector; 7 check sights and scope mounts; 8 check all screws; 9 rebuild and function check, in orange. Also before long storage. Original Tikka spare parts only.">
<rect x="0" y="0" width="400" height="398" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Once a year: the full service</text><rect x="12" y="40" width="376" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="55" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="60" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="48" y="60" font-size="14" fill="#17201A" text-anchor="start">Routine clean</text><rect x="12" y="74" width="376" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="89" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="94" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="48" y="94" font-size="14" fill="#17201A" text-anchor="start">Copper solvent in the bore</text><rect x="12" y="108" width="376" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="123" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="128" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="48" y="128" font-size="14" fill="#17201A" text-anchor="start">Light oil film on all metal</text><rect x="12" y="142" width="376" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="157" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="162" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="48" y="162" font-size="14" fill="#17201A" text-anchor="start">Sling studs: oil, check</text><rect x="12" y="176" width="376" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="191" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="196" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="48" y="196" font-size="14" fill="#17201A" text-anchor="start">Bolt strip, clean, grease</text><rect x="12" y="210" width="376" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="225" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="230" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text><text x="48" y="230" font-size="14" fill="#17201A" text-anchor="start">Extractor and ejector check</text><rect x="12" y="244" width="376" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="259" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="264" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">7</text><text x="48" y="264" font-size="14" fill="#17201A" text-anchor="start">Sights and scope mounts</text><rect x="12" y="278" width="376" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="293" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="298" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">8</text><text x="48" y="298" font-size="14" fill="#17201A" text-anchor="start">All screws checked</text><rect x="12" y="312" width="376" height="30" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="30" cy="327" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="30" y="332" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">9</text><text x="48" y="332" font-size="14" fill="#17201A" text-anchor="start">Rebuild and function check</text><rect x="12" y="352" width="376" height="34" rx="6" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="200" y="374" font-size="14" fill="#17201A" text-anchor="middle">Also before storage. Tikka spare parts only.</text>
</svg>
