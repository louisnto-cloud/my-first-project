<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Timeline from 1 October to mid December. Rubs and sparring through October. Scrapes from about mid October to mid November. Seeking from late October into early November. Chasing in early to mid November. Peak breeding in mid November. Post rut and a smaller second rut from late November to mid December. Timing is from hunter guides, not exact dates." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">October to December: the rut builds</text><line x1="20" y1="40" x2="20" y2="250" stroke="#c9b79c" stroke-width="2"/><text x="24.0" y="266" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">1 Oct</text><line x1="167" y1="40" x2="167" y2="250" stroke="#c9b79c" stroke-width="2"/><text x="170.8421052631579" y="266" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">1 Nov</text><line x1="309" y1="40" x2="309" y2="250" stroke="#c9b79c" stroke-width="2"/><text x="312.94736842105266" y="266" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">1 Dec</text><rect x="20" y="44" width="147" height="24" rx="5" fill="#8a9a6b"/><text x="26.0" y="61" font-size="14" fill="#ffffff" text-anchor="start" font-weight="bold">Rubs, sparring</text><rect x="105" y="78" width="128" height="24" rx="5" fill="#6b4f35"/><text x="111.26315789473684" y="95" font-size="14" fill="#ffffff" text-anchor="start" font-weight="bold">Scrapes</text><rect x="124" y="112" width="76" height="24" rx="5" fill="#f2b48e"/><text x="206.0" y="129" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Seeking</text><rect x="172" y="146" width="66" height="24" rx="5" fill="#e8590c"/><text x="243.89473684210526" y="163" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Chasing</text><rect x="219" y="180" width="24" height="24" rx="5" fill="#9b2c1c"/><text x="248.6315789473684" y="197" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Peak breeding</text><rect x="257" y="214" width="123" height="24" rx="5" fill="#c9b79c"/><text x="262.8421052631579" y="231" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Post rut, 2nd rut</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Hunter guide timing, not exact dates. See More.</text>
</svg>
