<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 386" font-family="sans-serif" role="img" aria-label="The app planner flow: 1 pick the animal, 2 pick the place, 3 pick the dates, 4 get your plan. The plan has four parts: legal and open, odds for big game, day by day, and a checklist. Open it at #/plan in this app.">
<rect width="400" height="386" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The app planner: Plan a hunt</text>
<rect x="40" y="44" width="320" height="42" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<circle cx="66" cy="65" r="15" fill="#e8590c"/>
<text x="66" y="71" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">1</text>
<text x="92" y="71" font-size="18" font-weight="bold" fill="#2f3a2b">Pick the animal</text>
<line x1="200" y1="86" x2="200" y2="91" stroke="#8a9a6b" stroke-width="2.5"/><path d="M200.0 98.0 L204.9 89.0 L195.1 89.0z" fill="#8a9a6b"/>
<rect x="40" y="98" width="320" height="42" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<circle cx="66" cy="119" r="15" fill="#e8590c"/>
<text x="66" y="125" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text>
<text x="92" y="125" font-size="18" font-weight="bold" fill="#2f3a2b">Pick the place</text>
<line x1="200" y1="140" x2="200" y2="145" stroke="#8a9a6b" stroke-width="2.5"/><path d="M200.0 152.0 L204.9 143.0 L195.1 143.0z" fill="#8a9a6b"/>
<rect x="40" y="152" width="320" height="42" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<circle cx="66" cy="173" r="15" fill="#e8590c"/>
<text x="66" y="179" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">3</text>
<text x="92" y="179" font-size="18" font-weight="bold" fill="#2f3a2b">Pick the dates</text>
<line x1="200" y1="194" x2="200" y2="199" stroke="#8a9a6b" stroke-width="2.5"/><path d="M200.0 206.0 L204.9 197.0 L195.1 197.0z" fill="#8a9a6b"/>
<rect x="40" y="206" width="320" height="42" rx="10" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="2"/>
<circle cx="66" cy="227" r="15" fill="#fffaf0"/>
<text x="66" y="233" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">4</text>
<text x="92" y="233" font-size="18" font-weight="bold" fill="#fffaf0">Get your plan</text>
<line x1="200" y1="248" x2="200" y2="259" stroke="#2f3a2b" stroke-width="2.5"/><path d="M200.0 266.0 L204.9 257.0 L195.1 257.0z" fill="#2f3a2b"/>
<rect x="12" y="268" width="184" height="36" rx="8" fill="#e8590c"/>
<text x="104" y="292" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Legal and open</text>
<rect x="204" y="268" width="184" height="36" rx="8" fill="#8a9a6b"/>
<text x="296" y="292" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Odds (big game)</text>
<rect x="12" y="312" width="184" height="36" rx="8" fill="#8a9a6b"/>
<text x="104" y="336" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Day by day</text>
<rect x="204" y="312" width="184" height="36" rx="8" fill="#8a9a6b"/>
<text x="296" y="336" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Checklist</text>
<text x="200" y="374" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Open it: #/plan in this app</text>
</svg>
