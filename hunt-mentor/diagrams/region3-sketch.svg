<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 452" font-family="sans-serif" role="img" aria-label="Schematic sketch of the Kamloops area, not to scale, not a legal map; MU numbers are approximate. The North Thompson River runs from Barriere at the top, past Heffley Creek, your base, south to Kamloops, with Highway 5 beside it. The South Thompson River runs from Kamloops east toward Chase. Kamloops Lake lies west of the city. Sun Peaks is northeast of Heffley Creek. Paul Lake is east of the North Thompson, north of the South Thompson. Lac du Bois grasslands are northwest of the city. Approximate MU numbers: 3-38 at the top; North Thompson River: 3-28 west bank, 3-27 east bank; South Thompson River: 3-27 north, 3-20 south; Kamloops Lake: 3-29 north shore, 3-19 south shore; 3-26 to the east. An orange band along the South Thompson east of the city marks the Kamloops no shooting band, Map C7. Check the official MU map.">
