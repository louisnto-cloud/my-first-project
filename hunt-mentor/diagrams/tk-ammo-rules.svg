<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 344" font-family="sans-serif" role="img" aria-label="The Tikka manual&#x27;s ammunition rules: 1 factory new ammunition made to CIP or SAAMI standards; 2 the right calibre, .308 Winchester; 3 inspect every round for splits, dents and defects; 4 nothing over 10 years old; 5, in orange, never shoot steel jacketed bullets; 6 test that the rifle runs reliably with it before buying a large batch. Reloaded ammunition voids the warranty.">
<rect x="0" y="0" width="400" height="344" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Tikka&#x27;s ammunition rules</text><rect x="12" y="42" width="376" height="36" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="60" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="65" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="52" y="65" font-size="14" fill="#17201A" text-anchor="start">Factory new, made to CIP or SAAMI</text><rect x="12" y="84" width="376" height="36" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="102" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="107" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="52" y="107" font-size="14" fill="#17201A" text-anchor="start">Right calibre: .308 Win</text><rect x="12" y="126" width="376" height="36" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="144" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="149" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="52" y="149" font-size="14" fill="#17201A" text-anchor="start">Inspect every round</text><rect x="12" y="168" width="376" height="36" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="186" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="191" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="52" y="191" font-size="14" fill="#17201A" text-anchor="start">Nothing over 10 years old</text><rect x="12" y="210" width="376" height="36" rx="8" fill="#FFE6D6" stroke="#FF6A13" stroke-width="1.5"/><circle cx="32" cy="228" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="233" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="52" y="233" font-size="14" fill="#17201A" text-anchor="start">Never steel jacketed bullets</text><rect x="12" y="252" width="376" height="36" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="32" cy="270" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="32" y="275" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text><text x="52" y="275" font-size="14" fill="#17201A" text-anchor="start">Test it in your rifle before a big buy</text><rect x="12" y="298" width="376" height="34" rx="6" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="200" y="320" font-size="14" fill="#17201A" text-anchor="middle">Reloads void the Tikka warranty.</text>
</svg>
