4a7fb0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="130" font-size="14" font-weight="bold" fill="#4a7fb0">air</text><text x="200" y="80" font-size="15" font-weight="bold" text-anchor="middle" fill="#23261f">shade</text><text x="200" y="292" font-size="14" text-anchor="middle" fill="#2f3a2b">Logs or hang it. Never a tarp on top.</text>
