<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 304" font-family="sans-serif" role="img" aria-label="Four bullets cut in half. 1 soft point, cup and core: a copper jacket over a lead core. 2 bonded: the lead core is bonded to the jacket so it holds together. 3 all copper, lead free, with a hollow nose. 4 full metal jacket, crossed out in orange: it does not expand and it is unlawful to hunt with. 1 to 3 expand and are legal for deer.">
<rect x="0" y="0" width="400" height="304" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Hunting bullets, cut in half</text><rect x="10" y="42" width="92" height="170" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><path d="M43 146 L43 100 Q45 82 50 78 L62 78 Q67 82 69 100 L69 146Z" fill="#B8733A" stroke="#1F3D2B" stroke-width="1.6"/><path d="M47 142 L47 96 Q56 70 65 96 L65 142Z" fill="#8F9A8C"/><path d="M50 78 Q56 68 62 78Z" fill="#8F9A8C" stroke="#1F3D2B" stroke-width="1"/><circle cx="26" cy="60" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="65" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="56" y="176" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Soft point</text><text x="56" y="196" font-size="14" fill="#17201A" text-anchor="middle">cup, core</text><rect x="106" y="42" width="92" height="170" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><path d="M139 146 L139 100 Q141 82 146 78 L158 78 Q163 82 165 100 L165 146Z" fill="#B8733A" stroke="#1F3D2B" stroke-width="1.6"/><path d="M143 142 L143 96 Q152 70 161 96 L161 142Z" fill="#8F9A8C"/><path d="M146 78 Q152 68 158 78Z" fill="#8F9A8C" stroke="#1F3D2B" stroke-width="1"/><path d="M143 142 L143 96 Q152 70 161 96 L161 142" fill="none" stroke="#1F3D2B" stroke-width="2.4"/><circle cx="122" cy="60" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="122" y="65" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="152" y="176" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Bonded</text><text x="152" y="196" font-size="14" fill="#17201A" text-anchor="middle">glued core</text><rect x="202" y="42" width="92" height="170" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><path d="M235 146 L235 100 Q236 76 248 70 Q260 76 261 100 L261 146Z" fill="#B8733A" stroke="#1F3D2B" stroke-width="1.6"/><path d="M245 74 L248 102 L251 74Z" fill="#EEF1EA"/><circle cx="218" cy="60" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="218" y="65" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="248" y="176" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">All copper</text><text x="248" y="196" font-size="14" fill="#17201A" text-anchor="middle">lead free</text><rect x="298" y="42" width="92" height="170" rx="8" fill="#FFE6D6" stroke="#FF6A13" stroke-width="1.5"/><path d="M331 146 L331 100 Q332 76 344 70 Q356 76 357 100 L357 146Z" fill="#B8733A" stroke="#1F3D2B" stroke-width="1.6"/><path d="M336 142 L336 102 Q344 80 352 102 L352 142Z" fill="#8F9A8C"/><circle cx="314" cy="60" r="10" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="314" y="65" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="344" y="176" font-size="14" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Full metal</text><text x="344" y="196" font-size="14" fill="#17201A" text-anchor="middle">jacket</text><line x1="314" y1="70" x2="374" y2="150" stroke="#FF6A13" stroke-width="5"/><line x1="374" y1="70" x2="314" y2="150" stroke="#FF6A13" stroke-width="5"/><rect x="12" y="222" width="376" height="70" rx="8" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="24" y="244" font-size="14" fill="#17201A" text-anchor="start">1 to 3 expand: legal for deer.</text><text x="24" y="264" font-size="14" fill="#17201A" text-anchor="start">4 does not expand: unlawful to hunt with.</text><text x="24" y="284" font-size="14" fill="#17201A" text-anchor="start">Grey = lead core. Copper = jacket.</text>
</svg>
