<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Bar chart, labelled Tip: the biggest battery drains are a bright screen, recording a track with the screen awake, searching for cell signal, and cold below zero. An occasional GPS fix costs little.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="36" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">What eats a phone battery (Tip)</text><text x="20" y="74" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">Screen on, bright</text><rect x="20" y="80" width="300" height="14" rx="3" fill="#e8590c" stroke="none" stroke-width="0"/><text x="20" y="118" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">Track recording, screen awake</text><rect x="20" y="124" width="260" height="14" rx="3" fill="#e8590c" stroke="none" stroke-width="0"/><text x="20" y="162" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">Searching for cell signal</text><rect x="20" y="168" width="190" height="14" rx="3" fill="#8a9a6b" stroke="none" stroke-width="0"/><text x="20" y="206" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">Cold below 0°C</text><rect x="20" y="212" width="170" height="14" rx="3" fill="#4a7fb0" stroke="none" stroke-width="0"/><text x="20" y="250" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">GPS fix now and then</text><rect x="20" y="256" width="80" height="14" rx="3" fill="#8a9a6b" stroke="none" stroke-width="0"/><text x="20" y="292" font-family="sans-serif" font-size="13" fill="#868e96" text-anchor="start">Order is a field rule of thumb, not a lab test.</text>
</svg>
