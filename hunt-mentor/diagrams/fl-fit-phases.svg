<text x="335" y="139" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">11</text>
<rect x="351" y="112" width="28" height="40" rx="4" fill="#e8590c"/>
<text x="365" y="139" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">12</text>
