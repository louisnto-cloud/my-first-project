<text x="215" y="139" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">7</text>
<rect x="231" y="112" width="28" height="40" rx="4" fill="#8a9a6b"/>
<text x="245" y="139" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">8</text>
<text x="200" y="176" font-size="16" font-weight="bold" fill="#8b5a2b" text-anchor="middle">Hills,</text>
