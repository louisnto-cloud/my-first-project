<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 244" font-family="sans-serif" role="img" aria-label="Twelve weeks in three blocks of four. Weeks 1 to 4 build the base, weeks 5 to 8 add hills and strength, weeks 9 to 12 add pack load and long days, with a test at week 12. Week 4 and week 8 are easy weeks.">
