<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Contour lines bend into Vs around a creek that flows down the page. One thick line carries the number 900 with its top facing uphill. Three clues show uphill: number tops face uphill, water runs in the bottom of the Vs, and the Vs point upstream.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<path d="M30 80 L150 80 L180 40 L210 80 L250 80" fill="none" stroke="#8b5a2b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 130 L150 130 L180 90 L210 130 L250 130" fill="none" stroke="#8b5a2b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 180 L150 180 L180 140 L210 180 L250 180" fill="none" stroke="#8b5a2b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 230 L150 230 L180 190 L210 230 L250 230" fill="none" stroke="#8b5a2b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M180 30 L180 270" fill="none" stroke="#4a7fb0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="180" y1="240" x2="180.0" y2="277.3" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><polygon points="180.0,285.0 186.1,274.0 173.9,274.0" fill="#4a7fb0"/><rect x="70" y="118" width="50" height="24" rx="0" fill="#fffaf0" stroke="none" stroke-width="2"/><text x="95" y="136" font-family="sans-serif" font-size="16" fill="#8b5a2b" text-anchor="middle" font-weight="bold">900</text><text x="20" y="30" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Three uphill clues</text><rect x="258" y="95" width="138" height="120" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="266" y="120" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">1 Number tops</text><text x="282" y="137" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">face uphill</text><text x="266" y="160" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">2 Water in the</text><text x="282" y="177" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">V bottom</text><text x="266" y="200" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">3 Vs point up</text><text x="330" y="250" font-family="sans-serif" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Uphill: top</text>
</svg>
