  <text x="200" y="212" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Spring: toms gobble on the roost from mid April</text>
  <text x="200" y="252" font-size="13" fill="#2f3a2b" text-anchor="middle">Roost trees: big pines on ridges, used year after year</text>
  <text x="200" y="272" font-size="13" fill="#2f3a2b" text-anchor="middle">Hours: 1 hour before sunrise to 1 hour after sunset (98%)</text>
