<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="sans-serif" role="img" aria-label="A turkey&#x27;s day in six panels, 75 percent. Roost in a tall pine at night. Fly down at first light. Feed and travel through the morning. Loaf at midday. Feed again late in the day. Back to the roost at dusk. In spring toms gobble on the roost from mid April. Roost trees are big pines on ridges, used year after year. Hunting hours: 1 hour before sunrise to 1 hour after sunset, 98 percent.">
  <rect width="400" height="290" fill="#fffaf0"/>
  <text x="200" y="24" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A turkey&#x27;s day (75%)</text>
