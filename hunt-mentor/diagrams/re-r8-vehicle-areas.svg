<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 741" font-family="sans-serif" role="img" aria-label="List of Region 8 vehicle closures, synopsis page 67. Star means no driving, triangle means no vehicle for hunting, cross means no All Terrain Vehicle, e bike or snowmobile. Star, Oliver Mountain, 8-1: no motor vehicles. Star, Osoyoos Oxbows, 8-1: established roadways only. Star, Crater Mountain, 8-3: no motor vehicles. Star, Placer Mountain to Border Lake, 8-3 and 8-4: no motor vehicles. Star, Garnet Valley, 8-8: no motor vehicles, trapper exempt. Triangle, Tulameen Forest Service Road, 8-5: south of Vuich Creek, no vehicle for hunting. Star, Skaha Lake Eastside, 8-9: the lots named, no motor vehicles. Star, Granby, 8-14 and 8-15: snowmobiles allowed 1 November to 31 May. Cross, Galloping Hills, 8-15: no ATVs, e bikes or snowmobiles 1 June to 31 October. Star, Joss, Tsuius and Mabel, 8-23 and 8-24: permitted Forest Service Roads only 1 May to 30 November, snowmobiles allowed.">
