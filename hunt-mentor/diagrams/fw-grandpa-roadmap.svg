<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Grandpa's rules roadmap: 10 lessons with 10 rules each. 1 safety, 2 wind and weather, 3 finding animals, 4 moving and waiting, 5 deer, 6 moose, elk and bear, 7 birds, 8 the shot and after, 9 meat, camp and gear, 10 ethics and passing it on.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="28" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">10 lessons, 10 rules each</text>
  <g font-family="sans-serif" font-size="14" fill="#23261f">
    <g fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2">
      <rect x="12" y="44" width="182" height="42" rx="8"/><rect x="206" y="44" width="182" height="42" rx="8"/>
      <rect x="12" y="94" width="182" height="42" rx="8"/><rect x="206" y="94" width="182" height="42" rx="8"/>
      <rect x="12" y="144" width="182" height="42" rx="8"/><rect x="206" y="144" width="182" height="42" rx="8"/>
      <rect x="12" y="194" width="182" height="42" rx="8"/><rect x="206" y="194" width="182" height="42" rx="8"/>
      <rect x="12" y="244" width="182" height="42" rx="8"/><rect x="206" y="244" width="182" height="42" rx="8"/>
    </g>
    <g fill="#e8590c" font-weight="bold" font-size="18">
      <text x="24" y="71">1</text><text x="218" y="71">2</text><text x="24" y="121">3</text><text x="218" y="121">4</text>
      <text x="24" y="171">5</text><text x="218" y="171">6</text><text x="24" y="221">7</text><text x="218" y="221">8</text>
      <text x="24" y="271">9</text><text x="214" y="271">10</text>
    </g>
    <text x="44" y="70">Safety</text><text x="238" y="70">Wind, weather</text>
    <text x="44" y="120">Finding game</text><text x="238" y="120">Moving, waiting</text>
    <text x="44" y="170">Deer</text><text x="238" y="170">Moose, elk, bear</text>
    <text x="44" y="220">Birds</text><text x="238" y="220">Shot and after</text>
    <text x="44" y="270">Meat, camp, gear</text><text x="238" y="270">Ethics, passing on</text>
  </g>
</svg>
