<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 4: from the platform, clipped in, the hunter pulls up the unloaded rifle on a haul line, muzzle down.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">4. Haul line for the unloaded rifle</text><rect x="0" y="250" width="400" height="50" fill="#dfe6d3"/><rect x="180" y="40" width="30" height="210" fill="#6b4f35"/><rect x="210" y="120" width="60" height="8" fill="#23261f"/><line x1="210" y1="128" x2="196" y2="150" stroke="#23261f" stroke-width="3"/><g transform="translate(240 120) scale(0.9)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#e8590c"/><rect x="-6" y="-15" width="5" height="15" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" fill="#2f3a2b"/></g><line x1="250" y1="104" x2="260" y2="240" stroke="#6b4f35" stroke-width="2"/><rect x="250" y="232" width="40" height="8" rx="2" fill="#23261f"/><text x="110" y="160" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">UNLOADED</text><text x="110" y="182" font-size="15" fill="#23261f" text-anchor="middle">muzzle down</text><text x="110" y="202" font-size="15" fill="#23261f" text-anchor="middle">pull it up after</text><text x="110" y="222" font-size="15" fill="#23261f" text-anchor="middle">you are clipped in</text>
</svg>
