<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" font-family="sans-serif" role="img" aria-label="Cross section of one mountain slope from valley to peak, with the trees of each band drawn on it. Grass and sage at the bottom: sharp tailed grouse, open only in MUs 3-30 and 3-31. Aspen and creek draws: ruffed grouse, most common at 750 to 1,250 metres. Douglas fir and pine: dusky grouse in summer, and spruce grouse. Spruce and subalpine fir: spruce grouse, and dusky grouse in winter. Alpine above the trees at the top: white tailed ptarmigan.">
