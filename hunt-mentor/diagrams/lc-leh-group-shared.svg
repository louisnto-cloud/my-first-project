<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 334" font-family="sans-serif" role="img" aria-label="Two panels. Group hunt: 2 to 4 hunters share one ticket; if drawn, every member gets an authorization. Not allowed for moose, bison, black bear, or elk in Regions 1 and 2. Shared hunt: moose or bison only; each member is entered with their own ticket and one hit draws the whole group. A group of 2 may take 1 animal, a group of 3 or 4 may take 2.">
<rect x="0" y="0" width="400" height="334" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Group hunt vs shared hunt</text><rect x="8" y="44" width="188" height="282" rx="10" fill="#fff" stroke="#8a9a6b" stroke-width="2.5"/><rect x="204" y="44" width="188" height="282" rx="10" fill="#fff" stroke="#e8590c" stroke-width="2.5"/><text x="102" y="70" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Group hunt</text><text x="298" y="70" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">Shared hunt</text><g transform="translate(70 104) scale(1)"><circle cx="-9" cy="-10" r="6" fill="#2f3a2b"/><path d="M-18 16 V2 Q-9 -5 0 2 V16 Z" fill="#2f3a2b"/><circle cx="10" cy="-8" r="6" fill="#8a9a6b"/><path d="M1 18 V4 Q10 -3 19 4 V18 Z" fill="#8a9a6b"/></g><g transform="translate(130 104) scale(1)"><circle cx="-9" cy="-10" r="6" fill="#2f3a2b"/><path d="M-18 16 V2 Q-9 -5 0 2 V16 Z" fill="#2f3a2b"/><circle cx="10" cy="-8" r="6" fill="#8a9a6b"/><path d="M1 18 V4 Q10 -3 19 4 V18 Z" fill="#8a9a6b"/></g><path d="M85 132 h34 v19.0 a6 6 0 0 0 0 12 v19.0 h-34 v-19.0 a6 6 0 0 0 0 -12 z" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><text x="102.0" y="162.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">1</text><text x="102" y="206" font-size="14" fill="#23261f" text-anchor="middle">2 to 4 hunters</text><text x="102" y="226" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">One ticket</text><text x="102" y="246" font-size="14" fill="#23261f" text-anchor="middle">Drawn: everyone</text><text x="102" y="264" font-size="14" fill="#23261f" text-anchor="middle">gets a tag</text><text x="102" y="286" font-size="13" fill="#6b4f35" text-anchor="middle">Not for moose, bison,</text><text x="102" y="302" font-size="13" fill="#6b4f35" text-anchor="middle">black bear, or elk in</text><text x="102" y="318" font-size="13" fill="#6b4f35" text-anchor="middle">Regions 1 and 2</text><g transform="translate(266 104) scale(1)"><circle cx="-9" cy="-10" r="6" fill="#2f3a2b"/><path d="M-18 16 V2 Q-9 -5 0 2 V16 Z" fill="#2f3a2b"/><circle cx="10" cy="-8" r="6" fill="#8a9a6b"/><path d="M1 18 V4 Q10 -3 19 4 V18 Z" fill="#8a9a6b"/></g><g transform="translate(326 104) scale(1)"><circle cx="-9" cy="-10" r="6" fill="#2f3a2b"/><path d="M-18 16 V2 Q-9 -5 0 2 V16 Z" fill="#2f3a2b"/><circle cx="10" cy="-8" r="6" fill="#8a9a6b"/><path d="M1 18 V4 Q10 -3 19 4 V18 Z" fill="#8a9a6b"/></g><path d="M222 132 h34 v19.0 a6 6 0 0 0 0 12 v19.0 h-34 v-19.0 a6 6 0 0 0 0 -12 z" fill="#fde8d8" stroke="#e8590c" stroke-width="2"/><text x="239.0" y="162.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">1</text><path d="M262 132 h34 v19.0 a6 6 0 0 0 0 12 v19.0 h-34 v-19.0 a6 6 0 0 0 0 -12 z" fill="#fde8d8" stroke="#e8590c" stroke-width="2"/><text x="279.0" y="162.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">2</text><path d="M302 132 h34 v19.0 a6 6 0 0 0 0 12 v19.0 h-34 v-19.0 a6 6 0 0 0 0 -12 z" fill="#fde8d8" stroke="#e8590c" stroke-width="2"/><text x="319.0" y="162.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">3</text><path d="M342 132 h34 v19.0 a6 6 0 0 0 0 12 v19.0 h-34 v-19.0 a6 6 0 0 0 0 -12 z" fill="#fde8d8" stroke="#e8590c" stroke-width="2"/><text x="359.0" y="162.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">4</text><text x="298" y="206" font-size="14" fill="#23261f" text-anchor="middle">Moose or bison only</text><text x="298" y="226" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">One ticket each</text><text x="298" y="246" font-size="14" fill="#23261f" text-anchor="middle">One hit draws all</text><text x="298" y="272" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="middle">Group of 2: 1 animal</text><text x="298" y="292" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="middle">Group of 3 or 4:</text><text x="298" y="308" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="middle">2 animals</text>
</svg>
