"middle">in WILD</text><text x="199.99999999999997" y="180" font-size="14" fill="#55663f" text-anchor="middle">Hike fall</text><text x="199.99999999999997" y="197" font-size="14" fill="#55663f" text-anchor="middle">spots</text><rect x="268.66666666666663" y="42" width="121.33333333333333" height="210" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><rect x="268.66666666666663" y="42" width="121.33333333333333" height="30" rx="10" fill="#2f3a2b"/><text x="329.3333333333333" y="63" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Jun</text><g transform="translate(329.3333333333333 100) scale(1.0)"><circle r="16" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -20 V-6 M0 6 V20 M-20 0 H-6 M6 0 H20" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="329.3333333333333" y="140" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">LEH deadline</text><text x="329.3333333333333" y="157" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">23 Jun</text><text x="329.3333333333333" y="180" font-size="14" fill="#23261f" text-anchor="middle">Bear closes 30</text><text x="329.3333333333333" y="197" font-size="14" fill="#23261f" text-anchor="middle">Jun</text><text x="329.3333333333333" y="220" font-size="14" fill="#55663f" text-anchor="middle">Sight in,</text><text x="329.3333333333333" y="237" font-size="14" fill="#55663f" text-anchor="middle">pattern</text>
