<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 264" font-family="sans-serif" role="img" aria-label="April to June cards. April: new licence year on 1 April, black bear season opens, walk the winter range. May: apply for LEH in WILD, hike your fall spots. June: main LEH deadline 23 June 2026, bear closes 30 June, sight in the rifle and pattern the shotgun.">
<rect x="0" y="0" width="400" height="264" fill="#fffaf0"/>
