<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" font-family="sans-serif">
  <rect x="0" y="0" width="400" height="460" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Pattern check at 37 m (40 yd)</text>
  <!-- paper -->
  <rect x="40" y="44" width="320" height="320" fill="#ffffff" stroke="#23261f" stroke-width="2"/>
  <!-- 76 cm circle -->
  <circle cx="206" cy="198" r="120" fill="#8a9a6b" fill-opacity="0.15" stroke="#2f3a2b" stroke-width="3" stroke-dasharray="10 6"/>
  <!-- aim dot -->
  <circle cx="200" cy="204" r="9" fill="#e8590c" stroke="#23261f" stroke-width="2"/>
  <!-- pellets -->
  <g fill="#23261f">
    <circle cx="150" cy="150" r="3"/><circle cx="180" cy="130" r="3"/><circle cx="210" cy="120" r="3"/><circle cx="240" cy="140" r="3"/>
    <circle cx="260" cy="170" r="3"/><circle cx="270" cy="210" r="3"/><circle cx="250" cy="250" r="3"/><circle cx="220" cy="270" r="3"/>
    <circle cx="180" cy="260" r="3"/><circle cx="150" cy="240" r="3"/><circle cx="135" cy="200" r="3"/><circle cx="170" cy="190" r="3"/>
    <circle cx="200" cy="170" r="3"/><circle cx="230" cy="190" r="3"/><circle cx="215" cy="225" r="3"/><circle cx="185" cy="225" r="3"/>
    <circle cx="165" cy="165" r="3"/><circle cx="245" cy="215" r="3"/><circle cx="195" cy="145" r="3"/><circle cx="225" cy="160" r="3"/>
    <circle cx="160" cy="215" r="3"/><circle cx="250" cy="190" r="3"/><circle cx="205" cy="245" r="3"/><circle cx="125" cy="170" r="3"/>
    <circle cx="290" cy="150" r="3"/><circle cx="110" cy="250" r="3"/><circle cx="300" cy="270" r="3"/><circle cx="100" cy="110" r="3"/>
    <circle cx="320" cy="200" r="3"/><circle cx="90" cy="300" r="3"/><circle cx="230" cy="330" r="3"/><circle cx="330" cy="90" r="3"/>
    <circle cx="140" cy="300" r="3"/><circle cx="275" cy="100" r="3"/>
  </g>
  <!-- gap -->
  <circle cx="235" cy="295" r="16" fill="none" stroke="#e8590c" stroke-width="2"/>
  <text x="256" y="320" font-size="14" fill="#e8590c" font-weight="bold">gap?</text>
  <!-- labels -->
  <text x="48" y="64" font-size="14" fill="#23261f">Paper about 1 m square</text>
  <text x="200" y="384" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Dashed ring: 76 cm (30 in) circle</text>
  <text x="200" y="404" font-size="15" fill="#23261f" text-anchor="middle">Orange dot: where you aimed</text>
  <text x="200" y="428" font-size="15" fill="#23261f" text-anchor="middle">% = holes in ring ÷ pellets in shell × 100</text>
  <text x="200" y="450" font-size="14" fill="#23261f" text-anchor="middle">Schematic. Not a real pattern.</text>
</svg>
