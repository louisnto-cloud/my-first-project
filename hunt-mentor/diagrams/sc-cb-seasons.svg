<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Season bars from August to January. Caribou, draw only in the north: August 15 to October 15. Bison general open season in parts of MUs 7-42, 7-57 and 7-58: September 1 to January 31. Bison draw in the Liard: two week windows from October 1 to January 31." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Caribou and bison seasons</text>
<text x="200.0" y="46" font-size="14" fill="#8b5a2b" text-anchor="middle">Blue: draw only. Green: general season.</text>
<rect x="104.0" y="74" width="47.0" height="132" fill="#dfe6d3"/>
<text x="127.5" y="68" font-size="14" fill="#2f3a2b" text-anchor="middle">Aug</text>
<rect x="151.0" y="74" width="47.0" height="132" fill="#fffaf0"/>
<text x="174.5" y="68" font-size="14" fill="#2f3a2b" text-anchor="middle">Sep</text>
<rect x="198.0" y="74" width="47.0" height="132" fill="#dfe6d3"/>
<text x="221.5" y="68" font-size="14" fill="#2f3a2b" text-anchor="middle">Oct</text>
<rect x="245.0" y="74" width="47.0" height="132" fill="#fffaf0"/>
<text x="268.5" y="68" font-size="14" fill="#2f3a2b" text-anchor="middle">Nov</text>
<rect x="292.0" y="74" width="47.0" height="132" fill="#dfe6d3"/>
<text x="315.5" y="68" font-size="14" fill="#2f3a2b" text-anchor="middle">Dec</text>
<rect x="339.0" y="74" width="47.0" height="132" fill="#fffaf0"/>
<text x="362.5" y="68" font-size="14" fill="#2f3a2b" text-anchor="middle">Jan</text>
<text x="98" y="94.0" font-size="13" fill="#23261f" text-anchor="end">Caribou</text>
<text x="98" y="108.0" font-size="13" fill="#23261f" text-anchor="end">north, draw</text>
<rect x="125.2" y="80" width="95.5" height="32" rx="5" fill="#4a7fb0"/>
<line x1="104" y1="118" x2="386" y2="118" stroke="#8a9a6b" stroke-width="1"/>
<text x="98" y="138.0" font-size="13" fill="#23261f" text-anchor="end">Bison</text>
<text x="98" y="152.0" font-size="13" fill="#23261f" text-anchor="end">general</text>
<rect x="151.0" y="124" width="235.0" height="32" rx="5" fill="#5f7a3a"/>
<text x="268.5" y="145.0" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Sep 1 to Jan 31</text>
<line x1="104" y1="162" x2="386" y2="162" stroke="#8a9a6b" stroke-width="1"/>
<text x="98" y="182.0" font-size="13" fill="#23261f" text-anchor="end">Bison</text>
<text x="98" y="196.0" font-size="13" fill="#23261f" text-anchor="end">Liard draw</text>
<rect x="198.0" y="168" width="21.2" height="32" rx="5" fill="#4a7fb0"/>
<rect x="229.8" y="168" width="21.4" height="32" rx="5" fill="#4a7fb0"/>
<rect x="262.2" y="168" width="21.9" height="32" rx="5" fill="#4a7fb0"/>
<rect x="295.0" y="168" width="21.2" height="32" rx="5" fill="#4a7fb0"/>
<rect x="342.0" y="168" width="21.2" height="32" rx="5" fill="#4a7fb0"/>
<line x1="104" y1="206" x2="386" y2="206" stroke="#8a9a6b" stroke-width="1"/>
<text x="200.0" y="230" font-size="14" fill="#23261f" text-anchor="middle">Caribou: Aug 15 to Oct 15 in the north (98%).</text>
<text x="200.0" y="248" font-size="14" fill="#23261f" text-anchor="middle">Bison draw: 2 week windows, Oct 1 to Jan 31.</text>
<text x="200.0" y="266" font-size="14" fill="#23261f" text-anchor="middle">Window bars are a sketch, not exact dates.</text>
<text x="200.0" y="284" font-size="14" fill="#23261f" text-anchor="middle">Bison draws are under review (98%).</text>

</svg>
