<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 312" font-family="sans-serif" role="img" aria-label="Season bars for caribou and bison, August to January. Blue is draw only, green is general season. Caribou, draw only, in the north: 15 August to 15 October, 98 percent. Bison general open season in parts of MUs 7-42, 7-57 and 7-58: 1 September to 31 January. Bison draw in the Liard: 2 week windows between 1 October and 31 January. Bison draws are under review, 98 percent.">
