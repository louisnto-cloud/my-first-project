<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Cover the right lens. Focus the centre wheel for your left eye on something about 20 m away.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3. Right eye shut, focus wheel</text><g transform="translate(200 120) scale(1.4)"><rect x="-34" y="-20" width="28" height="60" rx="8" fill="#2f3a2b" stroke="none" stroke-width="2"/><rect x="6" y="-20" width="28" height="60" rx="8" fill="#2f3a2b" stroke="none" stroke-width="2"/><rect x="-6" y="-6" width="12" height="20" rx="0" fill="#6b6f68" stroke="none" stroke-width="2"/><circle cx="-20" cy="44" r="12" fill="#7aa3c8" stroke="#2f3a2b" stroke-width="2"/><circle cx="20" cy="44" r="12" fill="#7aa3c8" stroke="#2f3a2b" stroke-width="2"/></g><circle cx="200" cy="115" r="12" fill="#e8590c" stroke="none" stroke-width="2"/><text x="200" y="250" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">left eye sharp on a 20 m target</text>
