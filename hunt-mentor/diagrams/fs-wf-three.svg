<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three summer and fall hazards: wildfire, which brings closures and the need to escape; smoke, which hurts lungs and visibility; and heat, which causes heat stroke and spoils meat. Check all three before you go.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Three summer and fall hazards</text><rect x="14" y="50" width="118" height="160" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/><text x="73" y="136" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wildfire</text><text x="73" y="162" font-size="14" fill="#2f3a2b" text-anchor="middle">Closures,</text><text x="73" y="180" font-size="14" fill="#2f3a2b" text-anchor="middle">escape</text><rect x="141" y="50" width="118" height="160" rx="10" fill="#eeeeea" stroke="#9a9a8f" stroke-width="2"/><text x="200" y="136" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Smoke</text><text x="200" y="162" font-size="14" fill="#2f3a2b" text-anchor="middle">Lungs,</text><text x="200" y="180" font-size="14" fill="#2f3a2b" text-anchor="middle">visibility</text><rect x="268" y="50" width="118" height="160" rx="10" fill="#fff3d6" stroke="#e8590c" stroke-width="2"/><text x="327" y="136" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Heat</text><text x="327" y="162" font-size="14" fill="#2f3a2b" text-anchor="middle">Heat stroke,</text><text x="327" y="180" font-size="14" fill="#2f3a2b" text-anchor="middle">meat spoils</text><path d="M60 110 Q56 89 73 71 Q90 89 86 110 Z" fill="#e8590c"/><path d="M67 110 Q65 99 73 88 Q81 99 79 110 Z" fill="#f6c344"/><path d="M200 110 C190 95 215 85 205 64" fill="none" stroke="#9a9a8f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="327" cy="88" r="18.0" fill="#f6c344"/><rect x="59" y="226" width="282" height="30" rx="6" fill="#2f3a2b"/><text x="200" y="247" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Check all three before you go</text>
</svg>
