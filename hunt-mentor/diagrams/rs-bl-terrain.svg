<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" font-family="sans-serif" role="img" aria-label="Map: a deer hit on an open ridge runs downhill, into thick cover, and toward the creek. Wounded deer often head downhill, to thick cover and to water.">
<rect x="0" y="0" width="400" height="310" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Where wounded deer go</text>
<rect x="0" y="60" width="400" height="220" rx="0" fill="#e9efe0"/><path d="M0 60 L170 60 Q120 160 150 280 L0 280 Z" fill="#cfdcb5"/><text x="70" y="84" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">ridge, open</text><path d="M330 60 Q300 170 340 280" fill="none" stroke="#4a7fb0" stroke-width="10"/><text x="360" y="84" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">creek</text><path d="M220 140 Q280 160 300 220 Q260 250 220 230 Q190 190 220 140 Z" fill="#8a9a6b"/><text x="255" y="196" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">thick</text><circle cx="90" cy="150" r="8" fill="#e8590c"/><text x="90" y="175" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">hit</text><path d="M90 150 Q170 170 240 190 Q290 210 320 230" fill="none" stroke="#c62828" stroke-width="3" stroke-dasharray="6 5"/><line x1="310" y1="226" x2="326" y2="236" stroke="#c62828" stroke-width="3"/><path d="M326.0 236.0 L316.1 234.9 L320.7 227.5 Z" fill="#c62828"/><text x="200" y="300" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Downhill, to thick cover and water (70%)</text>
</svg>
