<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Mule deer year in dry forest country, September to March. September into early October: often high in Montane spruce and subalpine zones. October to mid November: moving down through the Interior Douglas fir slopes. Rut from late October to mid November. December to March: low Ponderosa pine and Douglas fir south slope winter range. Timing varies with snow.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Mule deer year, dry forest country</text><text x="120.71428571428572" y="54" font-size="14" fill="#2f3a2b" text-anchor="middle">Sep</text><text x="162.14285714285717" y="54" font-size="14" fill="#2f3a2b" text-anchor="middle">Oct</text><text x="203.57142857142858" y="54" font-size="14" fill="#2f3a2b" text-anchor="middle">Nov</text><text x="245.0" y="54" font-size="14" fill="#2f3a2b" text-anchor="middle">Dec</text><text x="286.42857142857144" y="54" font-size="14" fill="#2f3a2b" text-anchor="middle">Jan</text><text x="327.8571428571429" y="54" font-size="14" fill="#2f3a2b" text-anchor="middle">Feb</text><text x="369.2857142857143" y="54" font-size="14" fill="#2f3a2b" text-anchor="middle">Mar</text><text x="92" y="90" font-size="15" fill="#2f3a2b" text-anchor="end" font-weight="bold">MS, ESSF</text><rect x="100.0" y="70" width="66.28571428571429" height="28" rx="6" fill="#9fb3a8"/><text x="92" y="134" font-size="15" fill="#2f3a2b" text-anchor="end" font-weight="bold">IDF slopes</text><rect x="141.42857142857144" y="114" width="91.14285714285715" height="28" rx="6" fill="#cdd8a6"/><text x="92" y="178" font-size="15" fill="#2f3a2b" text-anchor="end" font-weight="bold">PP, IDF</text><rect x="224.28571428571428" y="158" width="165.71428571428572" height="28" rx="6" fill="#e2dca0"/><text x="92" y="222" font-size="15" fill="#2f3a2b" text-anchor="end" font-weight="bold">Rut</text><rect x="170.42857142857144" y="202" width="62.14285714285715" height="28" rx="6" fill="#e8590c"/><text x="307.14285714285717" y="178" font-size="14" fill="#2f3a2b" text-anchor="middle">south slope winter range</text><text x="200.0" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Shape from BC sources; timing varies by snow (75%)</text>
</svg>
