<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Buys Ballot's law: stand with your back to the wind in the northern hemisphere and low pressure is on your left, high pressure on your right.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="14" y="26" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Back to the wind: low on your left</text><g transform="translate(200 200) scale(1.3)"><circle cx="0" cy="-30" r="7" fill="#2f3a2b"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" fill="none"/></g><line x1="200" y1="280" x2="200.0" y2="232.7" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="200.0,225.0 193.9,236.0 206.1,236.0" fill="#4a7fb0"/><line x1="150" y1="285" x2="150.0" y2="247.7" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><polygon points="150.0,240.0 143.9,251.0 156.1,251.0" fill="#4a7fb0"/><line x1="250" y1="285" x2="250.0" y2="247.7" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><polygon points="250.0,240.0 243.9,251.0 256.1,251.0" fill="#4a7fb0"/><text x="260" y="275" font-family="sans-serif" font-size="13" fill="#4a7fb0" text-anchor="start" font-weight="bold">wind at your back</text><circle cx="70" cy="140" r="34" fill="#f4d9c4" stroke="#c92a2a" stroke-width="3"/><text x="70" y="150" font-family="sans-serif" font-size="30" fill="#c92a2a" text-anchor="middle" font-weight="bold">L</text><text x="30" y="200" font-family="sans-serif" font-size="13" fill="#c92a2a" text-anchor="start">Low pressure,</text><text x="30" y="216" font-family="sans-serif" font-size="13" fill="#c92a2a" text-anchor="start">bad weather side</text><circle cx="330" cy="140" r="34" fill="#e8f2e0" stroke="#8a9a6b" stroke-width="3"/><text x="330" y="150" font-family="sans-serif" font-size="30" fill="#8a9a6b" text-anchor="middle" font-weight="bold">H</text><text x="300" y="200" font-family="sans-serif" font-size="13" fill="#8a9a6b" text-anchor="start">High</text>
</svg>
