x1="10" y1="556" x2="390" y2="556" stroke="#cfe0ee" stroke-width="1"/><line x1="10" y1="576" x2="390" y2="576" stroke="#cfe0ee" stroke-width="1"/><text x="200" y="34" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Example 1: a blank morning</text><text x="200" y="56" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Example only, not a real hunt</text><text x="30" y="86" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="start">Date</text><text x="30" y="106" font-size="15" fill="#1d3557" text-anchor="start" font-style="italic">a mid October Saturday</text><text x="30" y="136" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="start">Place</text><text x="30" y="156" font-size="15" fill="#1d3557" text-anchor="start" font-style="italic">MU 3-27, bench A1, glassed from</text><text x="30" y="176" font-size="15" fill="#1d3557" text-anchor="start" font-style="italic">knob A1G</text><text x="30" y="206" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="start">Species</text><text x="30" y="226" font-size="15" fill="#1d3557" text-anchor="start" font-style="italic">mule deer</text><text x="30" y="256" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="start">Weather and wind</text><text x="30" y="276" font-size="15" fill="#1d3557" text-anchor="start" font-style="italic">2 C at 6:30 am, clear, light wind</text><text x="30" y="296" font-size="15" fill="#1d3557" text-anchor="start" font-style="italic">from the north, swung to the south</text><text x="30" y="316" font-size="15" fill="#1d3557" text-anchor="start" font-style="italic">by 9 am</text><text x="30" y="346" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="start">What you saw</text><text x="30" y="366" font-size="15" fill="#1d3557" text-anchor="start" font-style="italic">6:58 am, 2 does and a fawn feeding</text><text x="30" y="386" font-size="15" fill="#1d3557" text-anchor="start" font-style="italic">on the bench edge. 7:25 am, they</text><text x="30" y="406" font-size="15" fill="#1d3557" text-anchor="start" font-style="italic">walked into timber. No bucks. One</text><text x="30" y="426" font-size="15" fill="#1d3557" text-anchor="start" font-style="italic">truck at the gate.</text><text x="30" y="456" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="start">Shots and result</text><text x="30" y="476" font-size="15" fill="#1d3557" text-anchor="start" font-style="italic">no shots</text><text x="30" y="506" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="start">One lesson</text><text x="30" y="526" font-size="15" fill="#1d3557" text-anchor="start" font-style="italic">the wind swung by 9. Leave the</text><text x="30" y="546" font-size="15" fill="#1d3557" text-anchor="start" font-style="italic">knob by 8:45 next time or use spot</text><text x="30" y="566" font-size="15" fill="#1d3557" text-anchor="start" font-style="italic">B.</text>
