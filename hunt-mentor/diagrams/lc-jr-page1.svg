<text x="200" y="34" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Example 1: a blank morning</text>
<text x="200" y="58" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">Example only, not a real hunt</text>
<text x="36" y="98" font-size="15" font-weight="bold" fill="#c2410c">Date</text>
<text x="36" y="122" font-size="16" fill="#1d3557" font-style="italic">a mid October Saturday</text>
<text x="36" y="170" font-size="15" font-weight="bold" fill="#c2410c">Place</text>
<text x="36" y="194" font-size="16" fill="#1d3557" font-style="italic">MU 3-27, bench A1, glassed from knob A1G</text>
<text x="36" y="242" font-size="15" font-weight="bold" fill="#c2410c">Species</text>
<text x="36" y="266" font-size="16" fill="#1d3557" font-style="italic">mule deer</text>
<text x="36" y="314" font-size="15" font-weight="bold" fill="#c2410c">Weather and wind</text>
<text x="36" y="338" font-size="16" fill="#1d3557" font-style="italic">2 C at 6:30 am, clear, light wind from the</text>
<text x="36" y="362" font-size="16" fill="#1d3557" font-style="italic">north, swung to the south by 9 am</text>
<text x="36" y="410" font-size="15" font-weight="bold" fill="#c2410c">What you saw</text>
<text x="36" y="434" font-size="16" fill="#1d3557" font-style="italic">6:58 am, 2 does and a fawn feeding on the</text>
<text x="36" y="458" font-size="16" fill="#1d3557" font-style="italic">bench edge. 7:25 am, they walked into</text>
<text x="36" y="482" font-size="16" fill="#1d3557" font-style="italic">timber. No bucks. One truck at the gate.</text>
<text x="36" y="530" font-size="15" font-weight="bold" fill="#c2410c">Shots and result</text>
<text x="36" y="554" font-size="16" fill="#1d3557" font-style="italic">no shots</text>
<text x="36" y="602" font-size="15" font-weight="bold" fill="#c2410c">One lesson</text>
<text x="36" y="626" font-size="16" fill="#1d3557" font-style="italic">the wind swung by 9. Leave the knob by</text>
<text x="36" y="650" font-size="16" fill="#1d3557" font-style="italic">8:45 next time or use spot B.</text>
</svg>
