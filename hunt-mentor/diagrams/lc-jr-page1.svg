<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 682" font-family="sans-serif" role="img" aria-label="A journal page, example only, not a real hunt. Date: a mid October Saturday. Place: MU 3-27, bench A1, glassed from knob A1G. Species: mule deer. Weather and wind: 2 C at 6:30 am, clear, light wind from the north, swung to the south by 9 am. What you saw: 6:58 am, 2 does and a fawn feeding on the bench edge. 7:25 am, they walked into timber. No bucks. One truck at the gate. Shots and result: no shots. One lesson: the wind swung by 9. Leave the knob by 8:45 next time or use spot B.">
