<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Mild hypothermia step 3: warm the trunk: heat packs or warm bottles on the armpits, chest and back, wrapped so they do not burn.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3. Heat to the trunk</text><rect x="150" y="70" width="100" height="140" rx="20" fill="#7c5a99"/><circle cx="200" cy="52" r="22.0" fill="#d9b48f"/><rect x="140" y="90" width="26" height="30" rx="5" fill="#e8590c"/><rect x="234" y="90" width="26" height="30" rx="5" fill="#e8590c"/><rect x="186" y="130" width="28" height="36" rx="5" fill="#e8590c"/><text x="320" y="110" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Armpits</text><text x="320" y="150" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Chest, back</text><text x="80" y="150" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wrap packs</text><text x="80" y="170" font-size="15" fill="#2f3a2b" text-anchor="middle">check skin</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Armpits, chest, back. Not hands first</text>
</svg>
