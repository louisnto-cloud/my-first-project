<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Shape of mule deer diet near Kamloops, September to April, from a stomach study. Grass stays low until spring, under 10 percent, and rises in April. Forbs are higher in fall. Shrubs matter most in early fall and late winter. Douglas fir needles peak in December and January. Bar heights show the shape only, not exact percentages.">
