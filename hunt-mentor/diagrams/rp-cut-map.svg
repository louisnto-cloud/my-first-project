<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 305" font-family="sans-serif" role="img" aria-label="Map view of a logged landscape: dark green old timber with cutblocks of different ages, new, 6, 8, 18 and 20 years old, a road crossing the middle and a creek with a strip of trees left standing. Stars mark edges where young feed blocks touch timber and the creek strip.">
<rect width="400" height="305" fill="#fffaf0"/>
