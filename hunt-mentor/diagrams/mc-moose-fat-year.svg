<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 286" font-family="sans-serif" role="img" aria-label="Line sketch of body fat through the year. Bulls build fat over summer and burn it in the late September and October rut, then feed to recover. Cows are leanest after winter, from about April to June. A shape, not measured values.">
<rect x="0" y="0" width="400" height="286" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Fat through the year</text><line x1="40" y1="80" x2="40" y2="230" stroke="#23261f" stroke-width="2"/><line x1="40" y1="230" x2="380" y2="230" stroke="#23261f" stroke-width="2"/><text x="54" y="250" font-size="14" fill="#23261f" text-anchor="middle">J</text><text x="82" y="250" font-size="14" fill="#23261f" text-anchor="middle">F</text><text x="110" y="250" font-size="14" fill="#23261f" text-anchor="middle">M</text><text x="138" y="250" font-size="14" fill="#23261f" text-anchor="middle">A</text><text x="166" y="250" font-size="14" fill="#23261f" text-anchor="middle">M</text><text x="194" y="250" font-size="14" fill="#23261f" text-anchor="middle">J</text><text x="222" y="250" font-size="14" fill="#23261f" text-anchor="middle">J</text><text x="250" y="250" font-size="14" fill="#23261f" text-anchor="middle">A</text><text x="278" y="250" font-size="14" fill="#23261f" text-anchor="middle">S</text><text x="306" y="250" font-size="14" fill="#23261f" text-anchor="middle">O</text><text x="334" y="250" font-size="14" fill="#23261f" text-anchor="middle">N</text><text x="362" y="250" font-size="14" fill="#23261f" text-anchor="middle">D</text><polyline points="54,170 110,200 166,190 222,120 250,80 278,70 306,150 334,185 362,175" fill="none" stroke="#e8590c" stroke-width="4"/><polyline points="54,150 110,175 138,200 166,205 194,195 222,160 250,130 278,110 306,105 334,115 362,135" fill="none" stroke="#4a7fb0" stroke-width="4" stroke-dasharray="8 5"/><text x="36" y="90" font-size="14" fill="#6b4f35" text-anchor="end">fat</text><text x="36" y="220" font-size="14" fill="#6b4f35" text-anchor="end">lean</text><line x1="110" y1="46" x2="140" y2="46" stroke="#e8590c" stroke-width="4"/><text x="146" y="51" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">Bull: fat late summer, rut burns it</text><line x1="110" y1="66" x2="140" y2="66" stroke="#4a7fb0" stroke-width="4" stroke-dasharray="8 5"/><text x="146" y="71" font-size="14" fill="#4a7fb0" text-anchor="start" font-weight="bold">Cow: leanest in spring</text><text x="200" y="276" font-size="14" fill="#6b4f35" text-anchor="middle">Shape only, not measured values (Tip)</text>
</svg>
