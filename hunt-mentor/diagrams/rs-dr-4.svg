<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 4: place. Scat in the middle of a trail is often a canid marking. Pellet piles beside a bed mean the deer lay there. Piles under a roost, or in a scrape, have their own meaning.">
