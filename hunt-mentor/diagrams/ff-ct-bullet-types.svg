<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Five hunting bullet designs cut open. Cup and core: a lead core in a copper jacket, cheap and opens fast. Bonded: the core is fused to the jacket so they stay together. Partition: a copper wall splits a front core from a back core. Copper: all copper with no lead. Polymer tip: a plastic tip drives expansion.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Five hunting bullet designs</text><path d="M20 48 L100 48 Q 140 51 156 64 Q 140 77 100 80 L20 80 Z" fill="#b87333" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 54 L100 54 Q 128 57 140 64 Q 128 71 100 74 L26 74 Z" fill="#7d7d86" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><text x="178" y="62" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Cup and core</text><text x="178" y="79" font-size="14" fill="#23261f" text-anchor="start">cheap, opens fast</text><path d="M20 96 L100 96 Q 140 99 156 112 Q 140 125 100 128 L20 128 Z" fill="#b87333" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 102 L100 102 Q 128 105 140 112 Q 128 119 100 122 L26 122 Z" fill="#7d7d86" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 102 L100 102 M26 122 L100 122" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="178" y="110" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Bonded</text><text x="178" y="127" font-size="14" fill="#23261f" text-anchor="start">core glued to jacket</text><path d="M20 144 L100 144 Q 140 147 156 160 Q 140 173 100 176 L20 176 Z" fill="#b87333" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 150 L100 150 Q 128 153 140 160 Q 128 167 100 170 L26 170 Z" fill="#7d7d86" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><rect x="76" y="146" width="8" height="28" rx="0" fill="#b87333" stroke="none" stroke-width="2"/><text x="178" y="158" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Partition</text><text x="178" y="175" font-size="14" fill="#23261f" text-anchor="start">wall splits front, back</text><path d="M20 192 L100 192 Q 140 195 156 208 Q 140 221 100 224 L20 224 Z" fill="#b87333" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 208 L156 208" fill="none" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="178" y="206" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Copper</text><text x="178" y="223" font-size="14" fill="#23261f" text-anchor="start">all copper, no lead</text><path d="M20 240 L100 240 Q 140 243 156 256 Q 140 269 100 272 L20 272 Z" fill="#b87333" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 246 L100 246 Q 128 249 140 256 Q 128 263 100 266 L26 266 Z" fill="#7d7d86" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M154 252 L168 256 L154 260 Z" fill="#b3261e" stroke="#2f3a2b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="178" y="254" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Polymer tip</text><text x="178" y="271" font-size="14" fill="#23261f" text-anchor="start">tip drives expansion</text>
</svg>
