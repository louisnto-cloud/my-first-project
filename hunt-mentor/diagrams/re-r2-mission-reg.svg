<text x="78" y="111" font-size="16" font-weight="bold" fill="#2f3a2b">400 m road bands, 2-8</text>
<text x="78" y="130" font-size="15" fill="#2f3a2b">Florence Lake FSR, Map 5.1-1/17 roads,</text>
<text x="78" y="149" font-size="15" fill="#2f3a2b">Lost Creek, Terepocki, Lease, Murdo,</text>
<text x="78" y="168" font-size="15" fill="#2f3a2b">Mount Kettley, Salsbury FSRs, Norrish</text>
<text x="78" y="187" font-size="15" fill="#2f3a2b">Creek roads</text>
<rect x="8" y="210" width="384" height="30" rx="6" fill="#5b6b3e"/>
<text x="18" y="231" font-size="15" font-weight="bold" fill="#fffaf0" letter-spacing="1">SHOT ONLY</text>
<rect x="8" y="246" width="384" height="55" rx="6" fill="#f4eedf"/>
<circle cx="41.0" cy="273.5" r="20" fill="#fffaf0" stroke="#5b6b3e" stroke-width="2"/>
