<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 477" font-family="sans-serif" role="img" aria-label="Mission: in the Closed Areas Regulation, not printed in the synopsis. 400 m road bands in 2-8: Florence Lake FSR (Forest Service Road), the Map 5.1-1/17 roads, and the Lost Creek, Terepocki, Lease, Murdo, Mount Kettley and Salsbury FSRs and the Norrish Creek roads; hunting allowed in the road bands (95%). Highway 7 east of Mission: shot only within 150 m, to Highway 1. Nicomen: shot only on the lowland (Schedule 9 s. 9), and five No Shooting pieces (Schedule 5 s. 63).">
<rect width="400" height="477" fill="#fffaf0"/>
<text x="14" y="23" font-size="14" font-weight="bold" fill="#6b5b4b">Closed Areas Regulation, not printed</text>
<text x="14" y="43" font-size="14" fill="#6b5b4b">FSR: Forest Service Road</text>
<rect x="8" y="52" width="384" height="30" rx="6" fill="#2c5d86"/>
<text x="18" y="73" font-size="15" font-weight="bold" fill="#fffaf0" letter-spacing="1">ROAD BANDS: HUNTING ALLOWED (95%)</text>
<rect x="8" y="88" width="384" height="112" rx="6" fill="#f4eedf"/>
<circle cx="41.0" cy="144.0" r="20" fill="#fffaf0" stroke="#2c5d86" stroke-width="2"/>
