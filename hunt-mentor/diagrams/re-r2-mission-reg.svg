<text x="78" y="269" font-size="16" font-weight="bold" fill="#2f3a2b">Hwy 7, east of Mission</text>
<text x="78" y="288" font-size="15" fill="#2f3a2b">Within 150 m, to Highway 1</text>
<circle cx="41.0" cy="330.5" r="20" fill="#fffaf0" stroke="#5b6b3e" stroke-width="2"/>
<g transform="translate(41.0 330.5) scale(0.8)" fill="#5b6b3e" stroke="none"><path d="M-15 -4 C-10 -9 -5 1 0 -4 C5 -9 10 1 15 -4 M-15 4 C-10 -1 -5 9 0 4 C5 -1 10 9 15 4" stroke="#5b6b3e" stroke-width="3" fill="none"/></g>
<text x="78" y="326" font-size="16" font-weight="bold" fill="#2f3a2b">Nicomen</text>
<text x="78" y="345" font-size="15" fill="#2f3a2b">Lowland (Schedule 9 s. 9)</text>
<rect x="8" y="368" width="384" height="30" rx="6" fill="#d9480f"/>
<g transform="translate(31 383) scale(0.62)" fill="#fffaf0" stroke="none"><circle r="13" fill="none" stroke="#fffaf0" stroke-width="3.5"/><path d="M-9 -9 L9 9" stroke="#fffaf0" stroke-width="3.5"/></g>
<text x="50" y="389" font-size="15" font-weight="bold" fill="#fffaf0" letter-spacing="1">NO SHOOTING</text>
