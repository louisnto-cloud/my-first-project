<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Step 2: take out the species licence for that animal. A deer needs your deer species licence." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="34" font-size="20" fill="#23261f" text-anchor="middle" font-weight="bold">2. Find the licence for it</text>
<g transform="translate(200 145) scale(3.2)"><rect x="-26" y="-18" width="52" height="36" rx="4" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><line x1="-18" y1="-8" x2="18" y2="-8" stroke="#2f3a2b" stroke-width="2.5"/><line x1="-18" y1="0" x2="10" y2="0" stroke="#2f3a2b" stroke-width="2"/><line x1="-18" y1="8" x2="14" y2="8" stroke="#2f3a2b" stroke-width="2"/></g><text x="200" y="220" font-size="16" fill="#23261f" text-anchor="middle" font-weight="bold">Deer down? Your deer licence.</text>
<text x="200" y="262" font-size="15" fill="#2f3a2b" text-anchor="middle">Species licence, from your pocket.</text>
</svg>
