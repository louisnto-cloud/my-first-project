<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="One hill seen from the east. The south face gets the sun: it is hot and dry, with grass and scattered open pine. The north face is cool and shady, with thick Douglas fir and snow that lasts longer. Tip: hunt the edge where the two meet.">
