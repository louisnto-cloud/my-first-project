<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Partner setup for calling. The caller sits back and calls. The shooter sits 50 to 100 m in front, toward the elk and on the downwind side. A bull coming to the call often circles downwind, which brings him past the shooter. From calling champions and guides; the spacing is a Tip.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Caller and shooter</text><path d="M20 80 h60 m-9 -6 l9 6 l-9 6" fill="none" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="70" font-size="15" fill="#4a7fb0" text-anchor="start" font-weight="bold">wind</text><g transform="translate(90 230) scale(0.8)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#8b5a2b"/><rect x="-6" y="-15" width="5" height="15" rx="1" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" rx="1" fill="#2f3a2b"/></g><text x="90" y="262" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Caller</text><g transform="translate(250 250) scale(0.8)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#e8590c"/><rect x="-6" y="-15" width="5" height="15" rx="1" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" rx="1" fill="#2f3a2b"/></g><text x="250" y="280" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Shooter</text><path d="M98 200 L242 220" fill="none" stroke="#8a9a6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="170" y="196" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">50 to 100 m</text><g transform="translate(330 140) scale(0.45 0.45)"><rect x="-34" y="6" width="7" height="44" rx="3.5" fill="#6b4f35" stroke="#23261f" stroke-width="1.2"/><rect x="-24" y="6" width="7" height="44" rx="3.5" fill="#6b4f35" stroke="#23261f" stroke-width="1.2"/><rect x="24" y="6" width="7" height="44" rx="3.5" fill="#6b4f35" stroke="#23261f" stroke-width="1.2"/><rect x="33" y="6" width="7" height="44" rx="3.5" fill="#6b4f35" stroke="#23261f" stroke-width="1.2"/><ellipse cx="0" cy="0" rx="46" ry="19" fill="#c8a26b" stroke="#23261f" stroke-width="2"/><ellipse cx="-40" cy="-2" rx="9" ry="13" fill="#f1e3c0" stroke="#23261f" stroke-width="1"/><path d="M-46 -6 L-52 4" fill="none" stroke="#5c3b1c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 -12 L44 -44 L58 -40 L42 8 Z" fill="#5c3b1c" stroke="#23261f" stroke-width="2" stroke-linejoin="round"/><ellipse cx="62" cy="-42" rx="16" ry="7" transform="rotate(20 62 -42)" fill="#5c3b1c" stroke="#23261f" stroke-width="2"/><ellipse cx="46" cy="-53" rx="8" ry="3.5" transform="rotate(-35 46 -53)" fill="#5c3b1c" stroke="#23261f" stroke-width="1.5"/><circle cx="60" cy="-46" r="1.8" fill="#23261f"/><path d="M52 -50 Q40 -82 6 -104" fill="none" stroke="#6b4f35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M51 -54 L64 -60" fill="none" stroke="#6b4f35" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M49 -60 L62 -70" fill="none" stroke="#6b4f35" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 -76 L52 -92" fill="none" stroke="#6b4f35" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 -86 L36 -104" fill="none" stroke="#6b4f35" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 -95 L20 -112" fill="none" stroke="#6b4f35" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M310 160 Q330 200 270 228" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><text x="230" y="54" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Bull comes to the call,</text><text x="230" y="72" font-size="14" fill="#23261f" text-anchor="middle">often circles downwind</text><text x="200" y="296" font-size="14" fill="#6b4f35" text-anchor="middle">Calling champions, guides (65%); spacing: Tip</text>
</svg>
