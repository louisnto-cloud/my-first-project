<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" font-family="sans-serif" role="img" aria-label="A quail day as a timeline chart. Morning: feed at the edges of cover. Midday: rest inside shrubs. Evening: feed again. Night: roost in trees. Best hunting, my opinion: first 2 hours after legal light and last 2 hours before sunset.">
<rect width="400" height="360" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A quail day</text>
<g data-tip="Legal hours|Hunting hours run from 1 hour before sunrise to 1 hour after sunset.">
<rect x="8" y="34" width="384" height="78" fill="#fffaf0"/>
<text x="56" y="48" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Sunrise</text>
<text x="344" y="48" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Sunset</text>
<rect x="10" y="56" width="46" height="32" rx="6" fill="#2f3a2b"/>
<rect x="56" y="56" width="80" height="32" fill="#e8590c"/>
<rect x="136" y="56" width="128" height="32" fill="#8a9a6b"/>
<rect x="264" y="56" width="80" height="32" fill="#e8590c"/>
<rect x="344" y="56" width="46" height="32" rx="6" fill="#2f3a2b"/>
<path d="M56 54 V90 M344 54 V90" stroke="#2f3a2b" stroke-width="2"/>
<g font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">
<text x="96" y="78">Feed</text><text x="200" y="78">Rest</text><text x="304" y="78">Feed</text>
</g>
<path d="M33 66 a8 8 0 1 0 8 10 a6 6 0 1 1 -8 -10z M367 66 a8 8 0 1 0 8 10 a6 6 0 1 1 -8 -10z" fill="#fffaf0"/>
<path d="M30 92 v5 h80 v-5 M264 92 v5 h80 v-5" stroke="#c0392b" stroke-width="2.4" fill="none"/>
<text x="70" y="113" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">best 2 h</text>
<text x="304" y="113" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">best 2 h</text>
</g>
<g data-tip="1. Morning feed|They feed at first light at the edges of cover. Quail and chukar call at dawn: stand still and listen.">
<rect x="8" y="120" width="188" height="62" rx="9" fill="#fdeee4" stroke="#e8590c" stroke-width="2"/>
<circle cx="28" cy="140" r="12" fill="#e8590c"/><text x="28" y="145.5" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="48" y="146" font-size="16" font-weight="bold" fill="#2f3a2b">Morning</text>
<text x="20" y="170" font-size="15" fill="#2f3a2b">feed at cover edges</text>
</g>
<g data-tip="2. Midday rest|They loaf in cover. Dust bowls on dirt roads and under fence lines mark loafing spots (Tip).">
<rect x="204" y="120" width="188" height="62" rx="9" fill="#eef2e6" stroke="#8a9a6b" stroke-width="2"/>
<circle cx="224" cy="140" r="12" fill="#6f7d55"/><text x="224" y="145.5" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="244" y="146" font-size="16" font-weight="bold" fill="#2f3a2b">Midday</text>
<text x="216" y="170" font-size="15" fill="#2f3a2b">rest inside shrubs</text>
</g>
<g data-tip="3. Evening feed|They feed again the last 2 hours before dark. Stop a little early so coveys can regroup before dark (Tip).">
<rect x="8" y="190" width="188" height="62" rx="9" fill="#fdeee4" stroke="#e8590c" stroke-width="2"/>
<circle cx="28" cy="210" r="12" fill="#e8590c"/><text x="28" y="215.5" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="48" y="216" font-size="16" font-weight="bold" fill="#2f3a2b">Evening</text>
<text x="20" y="240" font-size="15" fill="#2f3a2b">feed again</text>
</g>
<g data-tip="4. Night roost|The covey roosts together at night, up in trees.">
<rect x="204" y="190" width="188" height="62" rx="9" fill="#e6e8e3" stroke="#2f3a2b" stroke-width="2"/>
<circle cx="224" cy="210" r="12" fill="#2f3a2b"/><text x="224" y="215.5" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<text x="244" y="216" font-size="16" font-weight="bold" fill="#2f3a2b">Night</text>
<text x="216" y="240" font-size="15" fill="#2f3a2b">roost in trees</text>
</g>
<g data-tip="Best hours, my lean|The first 2 hours after legal light you can see in, and the last 2 hours before sunset. Calm, cool days are easier. Tip.">
<rect x="8" y="262" width="384" height="56" rx="9" fill="#dfe6d3"/>
<text x="200" y="285" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hunt: first 2 hours after legal light,</text>
<text x="200" y="306" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">last 2 hours before sunset (Tip)</text>
</g>
<g data-tip="Lookout bird|One bird watches while the others feed. Pattern from bird guides.">
<rect x="8" y="326" width="384" height="28" fill="#fffaf0"/>
<text x="200" y="345" font-size="15" fill="#2f3a2b" text-anchor="middle">A lookout bird watches the feed (75%)</text>
</g>
</svg>
