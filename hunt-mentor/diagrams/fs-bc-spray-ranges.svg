<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bear spray by distance, from Alberta bear safety guidance: 9 to 15 metres, a half to 1 second warning blast aimed slightly down. 6 to 9 metres, 1 to 2 second bursts aimed low in front of the head. 0 to 6 metres, bursts at the head. Keep some in reserve, then back away while watching the bear.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bear spray by distance</text><rect x="0" y="200" width="400" height="100" rx="0" fill="#dfe6d3"/><line x1="33" y1="200" x2="36" y2="174" stroke="#2f3a2b" stroke-width="6.3" stroke-linecap="round"/><line x1="47" y1="200" x2="44" y2="174" stroke="#2f3a2b" stroke-width="6.3" stroke-linecap="round"/><rect x="30" y="148" width="20" height="28" rx="5.4" fill="#e8590c"/><line x1="31" y1="153" x2="24" y2="172" stroke="#2f3a2b" stroke-width="5.4" stroke-linecap="round"/><line x1="49" y1="153" x2="56" y2="172" stroke="#2f3a2b" stroke-width="5.4" stroke-linecap="round"/><circle cx="40" cy="140" r="9.0" fill="#d9b48f"/><rect x="60" y="206" width="100" height="16" rx="0" fill="#c0392b"/><text x="110" y="246" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">0 to 6 m</text><text x="110" y="266" font-size="14" fill="#2f3a2b" text-anchor="middle">At the head</text><rect x="160" y="206" width="100" height="16" rx="0" fill="#e8590c"/><text x="210" y="246" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">6 to 9 m</text><text x="210" y="286" font-size="14" fill="#2f3a2b" text-anchor="middle">Bursts, aim low</text><rect x="260" y="206" width="80" height="16" rx="0" fill="#f6c344"/><text x="300" y="246" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">9 to 15 m</text><text x="300" y="266" font-size="14" fill="#2f3a2b" text-anchor="middle">Warning blast</text><ellipse cx="360" cy="180" rx="26" ry="16" fill="#2f2a26"/><circle cx="334" cy="174" r="10.2" fill="#2f2a26"/><circle cx="336" cy="164" r="3.6" fill="#2f2a26"/><circle cx="324" cy="176" r="4.2" fill="#2f2a26"/><rect x="342" y="190" width="7" height="10" rx="0" fill="#2f2a26"/><rect x="372" y="190" width="7" height="10" rx="0" fill="#2f2a26"/><text x="200" y="80" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1 to 2 second bursts</text><text x="200" y="102" font-size="15" fill="#2f3a2b" text-anchor="middle">keep some in reserve</text><text x="200" y="128" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Then back away, watching it</text>
</svg>
