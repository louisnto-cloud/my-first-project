<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Turnaround time equals the time you want to be at the truck, minus the walk out, minus a 30 minute buffer. Set a phone alarm. Tip, from the Planning a route lesson.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Turnaround time</text><rect x="30" y="60" width="340" height="60" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="98" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">At truck time</text><text x="200" y="146" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">minus the walk out</text><text x="200" y="178" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">minus a 30 minute buffer</text><rect x="30" y="196" width="340" height="56" rx="8" fill="#f6d7c3" stroke="#e8590c" stroke-width="2"/><text x="200" y="232" font-size="18" fill="#e8590c" text-anchor="middle" font-weight="bold">= turnaround. Set an alarm.</text><text x="200" y="288" font-size="14" fill="#6b4f35" text-anchor="middle">Tip, from Planning a route</text>
</svg>
