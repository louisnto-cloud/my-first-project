<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Top view of a truck camp. Wind blows from the tent side toward the kitchen and the meat hang. Food is locked in the truck. Fire in between. Firearms cased and unloaded. Distances not to scale.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A truck camp, from above</text>
<rect x="0" y="40" width="400" height="260" rx="0" fill="#dfe6d3"/>
<rect x="0" y="250" width="400" height="40" rx="0" fill="#c9b79c"/><text x="200" y="276" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6b4f35" text-anchor="middle">Road</text>
<rect x="170" y="190" width="70" height="40" rx="6" fill="#2f3a2b"/><text x="205" y="215" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Truck</text>
<text x="205" y="244" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">food locked in</text>
<polygon points="60,76.0 30.0,110 90.0,110" fill="#e8590c"/><polygon points="60,76.0 52.0,110 68.0,110" fill="#2f3a2b"/><text x="60" y="134" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Tent</text>
<rect x="300" y="100" width="50" height="30" rx="4" fill="#6b4f35"/><text x="325" y="146" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Kitchen</text>
<circle cx="150" cy="120" r="16" fill="none" stroke="#e8590c" stroke-width="3"/><path d="M150 126 q-7.2 -7.2 0 -16.0 q7.2 8.8 0 16.0 z" fill="#e8590c" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 126 q-3.2 -4.0 0 -8.0 q3.2 4.0 0 8.0 z" fill="#f6c343" stroke="#f6c343" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="156" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fire</text>
<line x1="320" y1="60" x2="380" y2="60" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/><rect x="336" y="60" width="12" height="18" rx="3" fill="#f2e6c9" stroke="#8b5a2b" stroke-width="2"/><rect x="356" y="60" width="12" height="18" rx="3" fill="#f2e6c9" stroke="#8b5a2b" stroke-width="2"/><text x="350" y="96" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Meat</text>
<line x1="20" y1="60" x2="70" y2="60" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="70.0,60.0 61.0,64.3 61.0,55.7" fill="#4a7fb0"/><text x="20" y="52" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4a7fb0" text-anchor="start">Wind</text>
<line x1="60" y1="160" x2="60" y2="186" stroke="#23261f" stroke-width="2" stroke-linecap="round"/><text x="60" y="200" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">Guns cased,</text><text x="60" y="216" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">unloaded</text>
</svg>
