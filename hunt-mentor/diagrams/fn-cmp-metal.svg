<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A rifle barrel lies next to a compass and pulls the red needle off north. Tip: keep steel, phones and vehicles away from the compass while you take a bearing.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<g transform="translate(120 170) scale(1.4)"><g transform="rotate(0)"><rect x="-28" y="-70" width="56" height="120" rx="6" fill="#e7f0f7" stroke="#2f3a2b" stroke-width="2"/><line x1="0" y1="-40" x2="-0.0" y2="-59.6" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><polygon points="0.0,-68.0 -6.6,-56.0 6.6,-56.0" fill="#e8590c"/></g><g transform="rotate(0)"><circle r="24" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><line x1="-8" y1="-18" x2="-8" y2="18" stroke="#c92a2a" stroke-width="1.5" stroke-linecap="round"/><line x1="8" y1="-18" x2="8" y2="18" stroke="#c92a2a" stroke-width="1.5" stroke-linecap="round"/><path d="M0 -21 L6 -12 L-6 -12 Z" fill="none" stroke="#c92a2a" stroke-width="2"/><text x="0" y="-26" font-family="sans-serif" font-size="10" fill="#2f3a2b" text-anchor="middle" font-weight="bold">N</text></g><g transform="rotate(25)"><path d="M0 -19 L4 0 L-4 0 Z" fill="#c92a2a"/><path d="M0 19 L4 0 L-4 0 Z" fill="#ffffff" stroke="#2f3a2b" stroke-width="1"/></g></g><text x="60" y="60" font-family="sans-serif" font-size="15" fill="#c92a2a" text-anchor="start" font-weight="bold">Needle pulled</text><rect x="200" y="150" width="180" height="14" rx="3" fill="#555555" stroke="#2f3a2b" stroke-width="1"/><text x="210" y="140" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Rifle barrel</text><line x1="190" y1="180" x2="157.6" y2="176.0" stroke="#c92a2a" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><polygon points="150.0,175.0 160.2,182.4 161.7,170.4" fill="#c92a2a"/><text x="20" y="285" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">Tip: keep steel, phones and trucks away.</text>
</svg>
