<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 366" font-family="sans-serif" role="img" aria-label="Bar chart of the lead needed for a crossing bird with steel number 2 shot, from a Hunt Mentor physics model. Bird at 48 km/h: 0.8 m of lead at 20 m, 1.4 m at 30 m, 2.0 m at 40 m. Bird at 80 km/h: 2.3 m at 30 m and 3.3 m at 40 m. Physics only; your swing adds its own timing.">
