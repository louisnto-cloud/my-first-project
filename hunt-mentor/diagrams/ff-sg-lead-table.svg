<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of the lead needed for a crossing bird with steel number 2 shot, from a Hunt Mentor physics model: at 48 km/h, 0.8 m at 20 m, 1.4 m at 30 m, 2.0 m at 40 m. At 80 km/h, 2.3 m at 30 m and 3.3 m at 40 m. Physics only; your swing adds timing.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Lead at a crossing bird, steel #2 (model)</text><text x="134" y="72.2" font-size="14" fill="#23261f" text-anchor="end">20 m, 48 km/h</text><rect x="140" y="54" width="38.857142857142854" height="26" rx="3" fill="#e8590c" stroke="none" stroke-width="2"/><text x="184.85714285714286" y="72.2" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">0.8 m</text><text x="134" y="110.2" font-size="14" fill="#23261f" text-anchor="end">30 m, 48 km/h</text><rect x="140" y="92" width="65.57142857142858" height="26" rx="3" fill="#e8590c" stroke="none" stroke-width="2"/><text x="211.57142857142858" y="110.2" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">1.4 m</text><text x="134" y="148.2" font-size="14" fill="#23261f" text-anchor="end">40 m, 48 km/h</text><rect x="140" y="130" width="96.65714285714286" height="26" rx="3" fill="#e8590c" stroke="none" stroke-width="2"/><text x="242.65714285714284" y="148.2" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">2.0 m</text><text x="134" y="186.2" font-size="14" fill="#23261f" text-anchor="end">30 m, 80 km/h</text><rect x="140" y="168" width="109.28571428571429" height="26" rx="3" fill="#b3261e" stroke="none" stroke-width="2"/><text x="255.28571428571428" y="186.2" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">2.3 m</text><text x="134" y="224.2" font-size="14" fill="#23261f" text-anchor="end">40 m, 80 km/h</text><rect x="140" y="206" width="161.74285714285716" height="26" rx="3" fill="#b3261e" stroke="none" stroke-width="2"/><text x="307.74285714285713" y="224.2" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">3.3 m</text><text x="200.0" y="280" font-size="13" fill="#2f3a2b" text-anchor="middle">Physics only. Your swing adds its own timing.</text>
</svg>
