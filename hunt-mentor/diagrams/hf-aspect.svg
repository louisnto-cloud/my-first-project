<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Top view of a hill with north at the top. The north face is dark with timber: shade, cool, bedding. The south and west faces are open and sunny: October feed, warmth and winter range. The sun sits low in the south.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <path d="M60 150 A 140 110 0 0 1 340 150 Z" fill="#8a9a6b"/>
  <path d="M60 150 A 140 110 0 0 0 340 150 Z" fill="#f2e3b3"/>
  <g fill="#2f3a2b">
    <polygon points="130,110 140,82 150,110"/><polygon points="170,95 180,66 190,95"/><polygon points="215,92 225,64 235,92"/><polygon points="255,108 265,80 275,108"/><polygon points="195,128 205,100 215,128"/>
  </g>
  <circle cx="200" cy="150" r="5" fill="#2f3a2b"/>
  <text x="200" y="22" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">N</text>
  <polygon points="192,40 208,40 200,28" fill="#2f3a2b"/>
  <text x="90" y="62" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">North face</text>
  <text x="330" y="40" font-size="14" fill="#2f3a2b" text-anchor="middle">shade, timber,</text>
  <text x="330" y="56" font-size="14" fill="#2f3a2b" text-anchor="middle">bedding (Tip)</text>
  <text x="200" y="196" font-size="15" font-weight="bold" fill="#8b5a2b" text-anchor="middle">South face (and west)</text>
  <text x="200" y="214" font-size="14" fill="#2f3a2b" text-anchor="middle">sun, feed, winter range</text>
  <circle cx="200" cy="278" r="14" fill="#e8590c"/>
  <g stroke="#e8590c" stroke-width="3"><line x1="200" y1="258" x2="200" y2="250"/><line x1="178" y1="270" x2="170" y2="266"/><line x1="222" y1="270" x2="230" y2="266"/></g>
  <text x="240" y="284" font-size="14" fill="#2f3a2b">low October sun, south</text>
</svg>
