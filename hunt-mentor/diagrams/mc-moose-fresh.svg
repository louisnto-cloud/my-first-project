<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Freshness ladder for moose sign. Hours old: pellets wet and shiny, browsed twig ends white and wet. One to two days: pellets dull, ends drying. Days to weeks: pellets dry, ends grey. Old: pellets pale and crumbly. Weather changes everything; a guide, not a clock.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">How fresh is it?</text><rect x="14" y="44" width="14" height="46" fill="#e8590c"/><text x="40" y="64" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Hours</text><text x="40" y="84" font-size="14" fill="#23261f" text-anchor="start">pellets wet, shiny; browse ends white, wet</text><rect x="14" y="100" width="14" height="46" fill="#f0a070"/><text x="40" y="120" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">1 to 2 days</text><text x="40" y="140" font-size="14" fill="#23261f" text-anchor="start">pellets dull; ends drying</text><rect x="14" y="156" width="14" height="46" fill="#8a9a6b"/><text x="40" y="176" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Days to weeks</text><text x="40" y="196" font-size="14" fill="#23261f" text-anchor="start">pellets dry; ends grey</text><rect x="14" y="212" width="14" height="46" fill="#bbbbbb"/><text x="40" y="232" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Old</text><text x="40" y="252" font-size="14" fill="#23261f" text-anchor="start">pellets pale, crumbly</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Weather changes everything: a guide, not a clock</text>
</svg>
