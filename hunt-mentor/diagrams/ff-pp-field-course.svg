<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A field course with four stations: prone at 100 m, sticks at 150 m, sitting at 200 m, and an uphill shot. Walk between stations. Only where a range allows this.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A field course on a lawful range</text><path d="M10 250 L390 250 L390 150 Q 300 120 200 160 Q 100 200 10 170 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="200" r="14" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="70" y="205" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">1</text><text x="70" y="178" font-size="12" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1 prone 100 m</text><circle cx="170" cy="180" r="14" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="170" y="185" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">2</text><text x="170" y="158" font-size="12" font-weight="bold" fill="#2f3a2b" text-anchor="middle">2 sticks 150 m</text><circle cx="260" cy="150" r="14" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="260" y="155" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">3</text><text x="260" y="128" font-size="12" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3 sitting 200 m</text><circle cx="340" cy="140" r="14" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="340" y="145" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">4</text><text x="340" y="118" font-size="12" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4 uphill</text><path d="M70 214 Q 120 230 170 194 Q 220 200 260 164 Q 300 170 340 154" fill="none" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="200.0" y="284" font-size="13" fill="#2f3a2b" text-anchor="middle">Only where the range allows it. Walk between stations.</text>
</svg>
