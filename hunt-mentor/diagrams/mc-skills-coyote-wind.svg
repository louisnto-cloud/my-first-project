<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two panels, your call. Left: wind in your face, with the calling area upwind; a coyote circles toward the downwind side; taught by Kevin Wilson, Outdoor Canada. Right: crosswind, with the caller off to one side; the coyote loops downwind of the caller and crosses in front of the hunter; taught by Geoff Nemnich and Heath Wood. Both say watch the downwind side.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Your call: coyote wind</text><rect x="14" y="42" width="180" height="210" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="104" y="64" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Wind in your face</text><g transform="translate(104 236) scale(0.6)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#e8590c"/><rect x="-6" y="-15" width="5" height="15" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" fill="#2f3a2b"/></g><line x1="104" y1="82" x2="104" y2="120" stroke="#4a7fb0" stroke-width="3"/><polygon points="104.0,120.0 99.7,111.0 108.3,111.0" fill="#4a7fb0"/><text x="118" y="104" font-size="14" fill="#4a7fb0" text-anchor="start">wind</text><path d="M164 110 Q 184 200 124 214" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 4"/><text x="104" y="160" font-size="14" fill="#23261f" text-anchor="middle">calling area</text><text x="104" y="270" font-size="14" fill="#6b4f35" text-anchor="middle">Wilson, Outdoor Canada</text><rect x="206" y="42" width="180" height="210" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="296" y="64" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Crosswind</text><g transform="translate(296 236) scale(0.6)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#e8590c"/><rect x="-6" y="-15" width="5" height="15" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" fill="#2f3a2b"/></g><line x1="222" y1="100" x2="272" y2="100" stroke="#4a7fb0" stroke-width="3"/><polygon points="272.0,100.0 263.0,104.3 263.0,95.7" fill="#4a7fb0"/><text x="222" y="90" font-size="14" fill="#4a7fb0" text-anchor="start">wind</text><rect x="276" y="150" width="14" height="10" fill="#23261f"/><text x="283" y="178" font-size="14" fill="#23261f" text-anchor="middle">caller</text><path d="M296 150 Q 374 130 362 180 Q 352 210 318 214" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 4"/><text x="296" y="270" font-size="14" fill="#6b4f35" text-anchor="middle">Nemnich, Wood</text><text x="200" y="292" font-size="14" fill="#e8590c" text-anchor="middle">Both: watch the downwind side (65%)</text>
</svg>
