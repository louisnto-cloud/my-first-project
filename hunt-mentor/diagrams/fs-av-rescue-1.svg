<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Rescue step 1: watch your partner and mark the last point you saw them. That is where the search starts.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1. Watch the last seen point</text><path d="M0 80 L400 240 L400 300 L0 300 Z" fill="#f4f7fb"/><circle cx="160" cy="150" r="10.0" fill="#c0392b"/><text x="160" y="130" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">last seen</text><line x1="160" y1="160" x2="215" y2="234" stroke="#9a9a8f" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/><polygon points="220,240 219,231 211,236" fill="#9a9a8f"/><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Mark where you last saw them</text>
</svg>
