<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Four cards. Rain: tracks made after it stops are clean and it dates the ones before. Wind: shows sheltered slopes, swirls and where your scent goes. Snow: shows every track, bed and trail made since it fell. Fog: close range only, wait for it to lift.">
<rect x="0" y="0" width="400" height="320" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">What each weather shows you</text>
<rect x="10" y="40" width="186" height="128" rx="10" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="1.5"/>
<g transform="translate(40 68) scale(0.7)" fill="#9aa6b2"><circle cx="-14" cy="4" r="11"/><circle cx="2" cy="-4" r="15"/><circle cx="18" cy="4" r="11"/><rect x="-14" y="4" width="32" height="11"/></g><line x1="28" y1="82" x2="24" y2="94" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/><line x1="37" y1="82" x2="33" y2="94" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/><line x1="46" y1="82" x2="42" y2="94" stroke="#4a7fb0" stroke-width="2.5" stroke-linecap="round"/>
<text x="70" y="70" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Rain</text>
<text x="20" y="114" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Clean tracks after it</text>
<text x="20" y="131" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">stops; it dates them</text>
<text x="20" y="148" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">(70%).</text>
<rect x="204" y="40" width="186" height="128" rx="10" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="1.5"/>
<g><line x1="216" y1="74" x2="252" y2="74" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round"/><polygon points="252.0,74.0 243.0,78.3 243.0,69.7" fill="#4a7fb0"/></g>
<text x="264" y="70" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Wind</text>
<text x="214" y="114" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Sheltered slopes,</text>
<text x="214" y="131" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">swirls, your scent</text>
<text x="214" y="148" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">(Tip).</text>
<rect x="10" y="176" width="186" height="128" rx="10" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="1.5"/>
<text x="26" y="214" font-family="sans-serif" font-size="14" fill="#4a7fb0">*</text><text x="36" y="222" font-family="sans-serif" font-size="14" fill="#4a7fb0">*</text><text x="46" y="214" font-family="sans-serif" font-size="14" fill="#4a7fb0">*</text><text x="56" y="222" font-family="sans-serif" font-size="14" fill="#4a7fb0">*</text>
<text x="70" y="206" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Snow</text>
<text x="20" y="250" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Every track, bed and</text>
<text x="20" y="267" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">trail since it fell</text>
<text x="20" y="284" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">(Tip).</text>
<rect x="204" y="176" width="186" height="128" rx="10" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="1.5"/>
<g transform="translate(234 210) scale(0.7)" fill="#dfe3e6"><circle cx="-14" cy="4" r="11"/><circle cx="2" cy="-4" r="15"/><circle cx="18" cy="4" r="11"/><rect x="-14" y="4" width="32" height="11"/></g>
<text x="264" y="206" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Fog</text>
<text x="214" y="250" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Close range only; wait</text>
<text x="214" y="267" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">for it to lift (Tip).</text>
</svg>
