<path d="M16.0 160.0 L109.0 160.0 L124.5 154.0 L146.2 140.0 L167.9 70.0 L180.3 62.0 L295.0 62.0 L313.6 92.0 L344.6 146.0 L372.5 160.0 L388.0 160.0" fill="none" stroke="#fffaf0" stroke-width="9" stroke-linejoin="round"/>
