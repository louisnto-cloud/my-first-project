<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 318" font-family="sans-serif" role="img" aria-label="A mule deer year. December to March: low winter range. April: green up on low south slopes. April and May: most migrants move up. June to September: high country, fawns born late May to June. October to December: back down to winter range. Rut in November and early December. Snow and cold move them, not the rut, 85 percent.">
