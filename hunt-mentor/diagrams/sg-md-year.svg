<g transform="translate(59.4 158) scale(0.75 0.75)"><path d="M-8 -18 L-10 0 M-4 -18 L-3 0 M12 -18 L13 0 M16 -18 L18 0" stroke="#5a3e26" stroke-width="2.4" stroke-linecap="round"/><path d="M-12 -28 C-12 -34 -4 -34 6 -34 C14 -34 20 -32 20 -26 C20 -20 16 -17 8 -17 L-6 -17 C-10 -17 -12 -21 -12 -28z" fill="#9a7350"/><path d="M-10 -30 L-16 -42 L-12 -44 L-6 -32z" fill="#9a7350"/><path d="M-16 -42 C-20 -43 -24 -40 -24 -38 L-20 -37 C-17 -37 -14 -39 -13 -41z" fill="#9a7350"/><path d="M-14 -44 L-18 -50 L-12 -45z M-12 -44 L-9 -50 L-10 -44z" fill="#9a7350"/><ellipse cx="18" cy="-27" rx="3" ry="4" fill="#f3ead8"/><circle cx="-18" cy="-41" r=".9" fill="#111"/></g>
<text x="229.9" y="92" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle" stroke="#fffaf0" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">summer high</text>
<text x="59.4" y="186" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle" stroke="#c9d3b4" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">winter range</text>
<g data-tip="1. Winter range|December to March: steep south and west facing slopes with shrubs and old Douglas fir, below deep snow. Near Kamloops, below about 760 m."><circle cx="96" cy="140" r="16" fill="#fffaf0" opacity="0.01"/><circle cx="96" cy="140" r="12" fill="#2f3a2b" stroke="#fffaf0" stroke-width="2"/><text x="96" y="145.5" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">1</text></g>
<g data-tip="2. Green up|April: green up on low south facing grass. The best month to see big groups."><circle cx="124" cy="128" r="16" fill="#fffaf0" opacity="0.01"/><circle cx="124" cy="128" r="12" fill="#4f6b2f" stroke="#fffaf0" stroke-width="2"/><text x="124" y="133.5" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">2</text></g>
<g data-tip="3. Move up|April to May: most migrants head for summer range. Some deer stay low all year."><circle cx="140" cy="92" r="16" fill="#fffaf0" opacity="0.01"/><circle cx="140" cy="92" r="12" fill="#8b5a2b" stroke="#fffaf0" stroke-width="2"/><text x="140" y="97.5" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">3</text></g>
<g data-tip="4. Summer high|June to September: moister high country. Check openings, cutblocks and burns for feed (Tip)."><circle cx="290" cy="40" r="16" fill="#fffaf0" opacity="0.01"/><circle cx="290" cy="40" r="12" fill="#2f3a2b" stroke="#fffaf0" stroke-width="2"/><text x="290" y="45.5" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">4</text></g>
<g data-tip="5. Move down|October to December, earlier in a snowy fall. Snow and cold move them, not the rut."><circle cx="354" cy="104" r="16" fill="#fffaf0" opacity="0.01"/><circle cx="354" cy="104" r="12" fill="#8b5a2b" stroke="#fffaf0" stroke-width="2"/><text x="354" y="109.5" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">5</text></g>
<g data-tip="Fawns|Fawns are born late May to June."><rect x="163.2" y="206" width="38.8" height="18" rx="5" fill="#4a7fb0"/><text x="155.7" y="221" font-size="16" font-weight="bold" fill="#4a7fb0" text-anchor="end">fawns</text></g>
<g data-tip="Rut|November and early December, peak mid November. In late October bucks spar, rub small trees and check does."><rect x="326.0" y="206" width="41.8" height="18" rx="5" fill="#e8590c"/><text x="320" y="221" font-size="16" font-weight="bold" fill="#c2410c" text-anchor="end">rut</text></g>
<circle cx="22" cy="248" r="10" fill="#2f3a2b"/><text x="22" y="253" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="36" y="253" font-size="15" fill="#2f3a2b">Winter</text>
<circle cx="98" cy="248" r="10" fill="#4f6b2f"/><text x="98" y="253" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="112" y="253" font-size="15" fill="#2f3a2b">Green up</text>
<circle cx="190" cy="248" r="10" fill="#8b5a2b"/><text x="190" y="253" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="204" y="253" font-size="15" fill="#2f3a2b">Up</text>
<circle cx="236" cy="248" r="10" fill="#2f3a2b"/><text x="236" y="253" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="250" y="253" font-size="15" fill="#2f3a2b">Summer</text>
<circle cx="324" cy="248" r="10" fill="#8b5a2b"/><text x="324" y="253" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="338" y="253" font-size="15" fill="#2f3a2b">Down</text>
<text x="200" y="284" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Snow and cold move them,</text>
<text x="200" y="304" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">not the rut (85%)</text>
</svg>
