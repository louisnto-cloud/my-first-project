<text x="341.5" y="22" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">N</text>
<line x1="357.0" y1="28" x2="357.0" y2="40" stroke="#d9cfb8" stroke-width="1"/>
<text x="372.5" y="22" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">D</text>
