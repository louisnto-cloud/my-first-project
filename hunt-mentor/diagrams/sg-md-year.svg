<text x="186.5" y="22" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">J</text>
<line x1="202.0" y1="28" x2="202.0" y2="40" stroke="#d9cfb8" stroke-width="1"/>
<text x="217.5" y="22" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">J</text>
<line x1="233.0" y1="28" x2="233.0" y2="40" stroke="#d9cfb8" stroke-width="1"/>
<text x="248.5" y="22" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="middle">A</text>
