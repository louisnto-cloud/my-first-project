<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Paper topo map colours: brown for contours and landforms, blue for water and grid lines, green for trees and vegetation, black for roads, buildings and names, red for main roads and boundaries, white for open or unmapped ground. USGS symbols, 95 percent. Canadian NTS maps are similar but read the legend on each sheet.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Map colours (paper topo)</text><rect x="20.0" y="42.0" width="175.0" height="72.0" rx="8" fill="#f6d7c3" stroke="#8a9a6b" stroke-width="2"/><text x="107.5" y="75.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Brown</text><text x="107.5" y="94.0" font-size="14" fill="#23261f" text-anchor="middle">contours, landforms</text><rect x="205.0" y="42.0" width="175.0" height="72.0" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="292.5" y="75.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Blue</text><text x="292.5" y="94.0" font-size="14" fill="#23261f" text-anchor="middle">water, grid lines</text><rect x="20.0" y="122.0" width="175.0" height="72.0" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="107.5" y="155.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Green</text><text x="107.5" y="174.0" font-size="14" fill="#23261f" text-anchor="middle">trees, vegetation</text><rect x="205.0" y="122.0" width="175.0" height="72.0" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="292.5" y="155.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Black</text><text x="292.5" y="174.0" font-size="14" fill="#23261f" text-anchor="middle">roads, buildings, names</text><rect x="20.0" y="202.0" width="175.0" height="72.0" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="107.5" y="235.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Red</text><text x="107.5" y="254.0" font-size="14" fill="#23261f" text-anchor="middle">main roads, boundaries</text><rect x="205.0" y="202.0" width="175.0" height="72.0" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="292.5" y="235.0" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">White</text><text x="292.5" y="254.0" font-size="14" fill="#23261f" text-anchor="middle">open or unmapped</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">USGS symbols (95%). NTS similar: read the legend</text>
</svg>
