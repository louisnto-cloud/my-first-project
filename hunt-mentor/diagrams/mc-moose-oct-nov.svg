<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" font-family="sans-serif" role="img" aria-label="Two columns. October: the rut winds down, bulls are tired and lean, moose are still high near lakes and swamps, leaves drop and twigs take over the menu. November: bulls feed hard, old bulls start dropping antlers from mid November, snow drifts moose down slowly, and the MU 3-27 season runs 1 to 15 November. Moose come down last, after deer and elk.">
<rect x="0" y="0" width="400" height="296" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">October and November</text><rect x="14" y="40" width="182" height="220" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><rect x="204" y="40" width="182" height="220" rx="8" fill="#e3e8ef" stroke="#4a7fb0" stroke-width="2"/><text x="105" y="66" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">October</text><text x="295" y="66" font-size="16" fill="#4a7fb0" text-anchor="middle" font-weight="bold">November</text><text x="24" y="96" font-size="14" fill="#23261f" text-anchor="start">Rut winds down</text><text x="24" y="122" font-size="14" fill="#23261f" text-anchor="start">Bulls tired, lean</text><text x="24" y="148" font-size="14" fill="#23261f" text-anchor="start">Still high, near</text><text x="24" y="174" font-size="14" fill="#23261f" text-anchor="start">lakes and swamps</text><text x="24" y="200" font-size="14" fill="#23261f" text-anchor="start">Leaves drop:</text><text x="24" y="226" font-size="14" fill="#23261f" text-anchor="start">twigs on the menu</text><text x="214" y="96" font-size="14" fill="#23261f" text-anchor="start">Bulls feed hard</text><text x="214" y="122" font-size="14" fill="#23261f" text-anchor="start">Old bulls start</text><text x="214" y="148" font-size="14" fill="#23261f" text-anchor="start">dropping antlers</text><text x="214" y="174" font-size="14" fill="#23261f" text-anchor="start">Snow drifts them</text><text x="214" y="200" font-size="14" fill="#23261f" text-anchor="start">down, slowly</text><text x="214" y="226" font-size="14" fill="#23261f" text-anchor="start">Your 1 to 15 Nov</text><text x="200" y="286" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Moose come down last, after deer and elk</text>
</svg>
