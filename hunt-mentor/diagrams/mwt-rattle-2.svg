<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="The caller starts with a few soft grunts, then waits a minute or two in case a buck is close." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="16" fill="#23261f" text-anchor="middle" font-weight="bold">2. Start soft: a few grunts</text><rect x="0" y="34" width="400" height="266" fill="#eef0e2"/><path d="M0 34 L140 34 Q 170 160 140 300 L0 300 Z" fill="#2f3a2b" opacity=".85"/><polygon points="60,79.2 44.4,120 75.6,120" fill="#1f2a1c"/><rect x="57.0" y="120" width="6.0" height="9.6" fill="#6b4f35"/><polygon points="100,162.6 85.7,200 114.3,200" fill="#1f2a1c"/><rect x="97.25" y="200" width="5.5" height="8.8" fill="#6b4f35"/><line x1="330" y1="60" x2="380" y2="60" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><polygon points="380.0,60.0 371.9,63.9 371.9,56.1" fill="#4a7fb0"/><text x="330" y="82" font-size="14" fill="#4a7fb0" text-anchor="start" font-weight="bold">Wind</text><circle cx="160" cy="118.0" r="7.0" fill="#4a7fb0"/><rect x="153.0" y="126.0" width="14.0" height="20.0" rx="4.0" fill="#4a7fb0"/><path d="M176 120 q 8 10 0 20" fill="none" stroke="#e8590c" stroke-width="3"/><path d="M190 116 q 8 10 0 20" fill="none" stroke="#e8590c" stroke-width="3"/><path d="M204 112 q 8 10 0 20" fill="none" stroke="#e8590c" stroke-width="3"/><text x="260" y="130" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Grunt, grunt...</text><text x="260" y="150" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">wait 1 to 2 min</text><rect x="0" y="272" width="400" height="28" fill="#fffaf0"/><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle" font-weight="bold">A close buck may come to soft calls alone.</text>
</svg>
