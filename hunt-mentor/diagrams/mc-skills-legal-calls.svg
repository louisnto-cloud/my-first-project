<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A table of calls and decoys in BC. Mouth or hand calls, grunt tubes and rattling: yes, 95 percent, my reading. Electronic or recorded calls: only for wolf, coyote, cougar, lynx, bobcat and Schedule C birds, 99 percent. Fake decoys: yes. Live bird decoys: no. Page 12 items 41 and 42. Study aid only.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Calls and decoys: what is legal</text><rect x="14" y="46" width="372" height="42" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="24" y="72" font-size="14" fill="#23261f" text-anchor="start">Mouth or hand call, grunt, rattle</text><rect x="272" y="54" width="60" height="26" rx="6" fill="#8a9a6b"/><text x="302" y="72" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Yes</text><text x="380" y="72" font-size="14" fill="#6b4f35" text-anchor="end">95%</text><rect x="14" y="96" width="372" height="42" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="24" y="122" font-size="14" fill="#23261f" text-anchor="start">Electronic or recorded call</text><rect x="272" y="104" width="60" height="26" rx="6" fill="#c9b46a"/><text x="302" y="122" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Only *</text><text x="380" y="122" font-size="14" fill="#6b4f35" text-anchor="end">99%</text><rect x="14" y="146" width="372" height="42" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="24" y="172" font-size="14" fill="#23261f" text-anchor="start">Fake decoy</text><rect x="272" y="154" width="60" height="26" rx="6" fill="#8a9a6b"/><text x="302" y="172" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Yes</text><text x="380" y="172" font-size="14" fill="#6b4f35" text-anchor="end">99%</text><rect x="14" y="196" width="372" height="42" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="24" y="222" font-size="14" fill="#23261f" text-anchor="start">Live bird decoy</text><rect x="272" y="204" width="60" height="26" rx="6" fill="#e8590c"/><text x="302" y="222" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">No</text><text x="380" y="222" font-size="14" fill="#6b4f35" text-anchor="end">99%</text><text x="200" y="262" font-size="14" fill="#23261f" text-anchor="middle">* wolf, coyote, cougar, lynx, bobcat, Schedule C birds</text><text x="200" y="288" font-size="14" fill="#e8590c" text-anchor="middle">Page 12 items 41, 42. Study aid only</text>
</svg>
