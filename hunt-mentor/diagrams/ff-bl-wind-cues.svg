<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 334" font-family="sans-serif" role="img" aria-label="Four wind speeds and their signs, based on the Beaufort scale, 65 percent. Calm, under 2 km/h: smoke rises straight. 10 km/h: you feel it on your face and leaves rustle; 13 cm drift at 250 m. 20 km/h: small branches move and dust lifts; the lean is no shot past 200 m. 30 km/h: small trees sway; get closer or pass. Wind at the deer matters too: watch the grass there.">
<rect width="400" height="334" fill="#fffaf0"/>
<text x="200" y="27" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Read wind speed from the land</text>
<rect x="8" y="42" width="384" height="60" rx="6" fill="#f4eedf"/>
<rect x="8" y="42" width="8" height="60" rx="3" fill="#6b6f66"/>
<circle cx="52" cy="72.0" r="25" fill="#fffaf0"/><path d="M40 90.0 h24" stroke="#5a3d22" stroke-width="4" stroke-linecap="round"/><path d="M46 87.0 l6 -9 l6 9z" fill="#e8590c"/><path d="M52 76.0 C47 68.0 57 62.0 52 52.0" stroke="#9aa0a6" stroke-width="5" fill="none" stroke-linecap="round"/>
<text x="88" y="66" font-size="17" font-weight="bold" fill="#6b6f66">Calm</text>
<text x="140.928" y="66" font-size="15" fill="#6b5b4b">under 2 km/h</text>
<text x="88" y="89" font-size="16" fill="#2f3a2b">smoke rises straight</text>
<rect x="8" y="108" width="384" height="60" rx="6" fill="#f4eedf"/>
<rect x="8" y="108" width="8" height="60" rx="3" fill="#4a7fb0"/>
<circle cx="52" cy="138.0" r="25" fill="#fffaf0"/><ellipse cx="42" cy="132.0" rx="8" ry="4.5" transform="rotate(-30 42 132.0)" fill="#6f8f3a"/><ellipse cx="58" cy="126.0" rx="8" ry="4.5" transform="rotate(20 58 126.0)" fill="#6f8f3a"/><ellipse cx="54" cy="144.0" rx="8" ry="4.5" transform="rotate(-10 54 144.0)" fill="#6f8f3a"/><ellipse cx="40" cy="150.0" rx="8" ry="4.5" transform="rotate(40 40 150.0)" fill="#6f8f3a"/><path d="M66 134.0 q6 4 0 8 M71 130.0 q8 8 0 16" stroke="#4a7fb0" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="88" y="132" font-size="17" font-weight="bold" fill="#2c5d86">10 km/h</text>
<text x="88" y="155" font-size="16" fill="#2f3a2b">felt on face, leaves rustle</text>
<text x="386" y="132" font-size="15" font-weight="bold" fill="#2c5d86" text-anchor="end">13 cm drift at 250 m</text>
<rect x="8" y="174" width="384" height="60" rx="6" fill="#f4eedf"/>
<rect x="8" y="174" width="8" height="60" rx="3" fill="#e8590c"/>
<circle cx="52" cy="204.0" r="25" fill="#fffaf0"/><path d="M32 208.0 Q52 202.0 70 192.0" stroke="#6b4a2a" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="50.2" cy="196.6" rx="6" ry="3.5" transform="rotate(-35 50.2 196.6)" fill="#6f8f3a"/><ellipse cx="61.6" cy="191.8" rx="6" ry="3.5" transform="rotate(-35 61.6 191.8)" fill="#6f8f3a"/><ellipse cx="73.0" cy="187.0" rx="6" ry="3.5" transform="rotate(-35 73.0 187.0)" fill="#6f8f3a"/><path d="M30 222.0 q8 -6 16 -2 q8 4 18 -3" stroke="#c9a46a" stroke-width="3" fill="none" stroke-linecap="round" opacity=".9"/>
<text x="88" y="198" font-size="17" font-weight="bold" fill="#c2410c">20 km/h</text>
<text x="88" y="221" font-size="16" fill="#2f3a2b">small branches move, dust lifts</text>
<text x="386" y="198" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="end">no shot past 200 m (lean)</text>
<rect x="8" y="240" width="384" height="60" rx="6" fill="#f4eedf"/>
<rect x="8" y="240" width="8" height="60" rx="3" fill="#b3261e"/>
<circle cx="52" cy="270.0" r="25" fill="#fffaf0"/><path d="M48 290.0 Q50 270.0 60 256.0" stroke="#5a3d22" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M62 246.0 L74 272.0 L46 276.0z" fill="#3a5a31"/><path d="M30 258.0 q6 3 0 6 M26 268.0 q6 3 0 6" stroke="#4a7fb0" stroke-width="2" fill="none"/>
<text x="88" y="264" font-size="17" font-weight="bold" fill="#b3261e">30 km/h</text>
<text x="88" y="287" font-size="16" fill="#2f3a2b">small trees sway</text>
<text x="386" y="264" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="end">get closer or pass</text>
<text x="200" y="322" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Watch the grass at the deer too</text>
</svg>
