<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four wind speeds and their signs. Calm: smoke rises straight. 10 km/h: you feel it on your face and leaves rustle. 20 km/h: small branches move and dust lifts; the lean is no shot past 200 m. 30 km/h: small trees sway; get closer or pass. Watch grass near the deer too.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Read wind speed from the land</text><rect x="14" y="44" width="372" height="48" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><rect x="14" y="44" width="10" height="48" rx="3" fill="#6b6f68" stroke="none" stroke-width="2"/><text x="34" y="66" font-size="16" font-weight="bold" fill="#6b6f68" text-anchor="start">Calm</text><text x="130" y="65" font-size="14" fill="#23261f" text-anchor="start">smoke rises straight</text><text x="130" y="84" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="start">under 2 km/h</text><rect x="14" y="98" width="372" height="48" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><rect x="14" y="98" width="10" height="48" rx="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="34" y="120" font-size="16" font-weight="bold" fill="#4a7fb0" text-anchor="start">10 km/h</text><text x="130" y="119" font-size="14" fill="#23261f" text-anchor="start">felt on face, leaves rustle</text><text x="130" y="138" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="start">13 cm drift at 250 m</text><rect x="14" y="152" width="372" height="48" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><rect x="14" y="152" width="10" height="48" rx="3" fill="#e8590c" stroke="none" stroke-width="2"/><text x="34" y="174" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">20 km/h</text><text x="130" y="173" font-size="14" fill="#23261f" text-anchor="start">small branches move, dust lifts</text><text x="130" y="192" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="start">no shot past 200 m (lean)</text><rect x="14" y="206" width="372" height="48" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><rect x="14" y="206" width="10" height="48" rx="3" fill="#b3261e" stroke="none" stroke-width="2"/><text x="34" y="228" font-size="16" font-weight="bold" fill="#b3261e" text-anchor="start">30 km/h</text><text x="130" y="227" font-size="14" fill="#23261f" text-anchor="start">small trees sway</text><text x="130" y="246" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="start">get closer or pass</text><text x="200.0" y="286" font-size="14" fill="#2f3a2b" text-anchor="middle">Wind at the deer matters too: watch grass there</text>
</svg>
