<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Scout elk country in five steps, Tip. Map: burns, cutblocks and benches near timber. Drive: check access and closures. Listen: at dawn and dusk in September. Walk: find wallows, rubs and fresh trails. Plan: a glassing seat and a route that keeps the wind right.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Scout elk country in 5 steps (Tip)</text><rect x="12" y="44" width="86" height="36" rx="8" fill="#2f3a2b"/><text x="55" y="67" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Map</text><text x="110" y="67" font-size="14" fill="#23261f" text-anchor="start">Burns, cutblocks, benches near timber</text><rect x="12" y="90" width="86" height="36" rx="8" fill="#2f3a2b"/><text x="55" y="113" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Drive</text><text x="110" y="113" font-size="14" fill="#23261f" text-anchor="start">Check access and closures</text><rect x="12" y="136" width="86" height="36" rx="8" fill="#2f3a2b"/><text x="55" y="159" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Listen</text><text x="110" y="159" font-size="14" fill="#23261f" text-anchor="start">Dawn and dusk in September</text><rect x="12" y="182" width="86" height="36" rx="8" fill="#2f3a2b"/><text x="55" y="205" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Walk</text><text x="110" y="205" font-size="14" fill="#23261f" text-anchor="start">Wallows, rubs, fresh trails</text><rect x="12" y="228" width="86" height="36" rx="8" fill="#2f3a2b"/><text x="55" y="251" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Plan</text><text x="110" y="251" font-size="14" fill="#23261f" text-anchor="start">Glass seat and wind route</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Hunter craft: Tip</text>
</svg>
