<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 435" font-family="sans-serif" role="img" aria-label="Flowchart of how to apply in Alberta. One: get a WIN card online at mywildalberta.ca or from an issuer, 10 dollars, it never expires. Two: buy the Wildlife Certificate, then the Game Bird Licence. Three: for deer your Alberta friend buys the Hunter Host Licence first, then you buy the deer licence. Four: draws open in late spring, dates VERIFY. Five: read the Alberta Guide to Hunting Regulations, updated every July.">
<rect x="0" y="0" width="400" height="435" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Alberta: how to apply</text>
<rect x="16" y="42" width="368" height="54" rx="8" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/>
<text x="28" y="66" font-size="15" fill="#2f3a2b">1. WIN card online at mywildalberta.ca: $10,</text>
<text x="28" y="85" font-size="15" fill="#2f3a2b">never expires</text>
<line x1="200.0" y1="96" x2="200.0" y2="118" stroke="#2f3a2b" stroke-width="3"/><polygon points="193.0,116 207.0,116 200.0,126" fill="#2f3a2b"/>
<rect x="16" y="126" width="368" height="54" rx="8" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/>
<text x="28" y="150" font-size="15" fill="#2f3a2b">2. Wildlife Certificate, then Game Bird</text>
<text x="28" y="169" font-size="15" fill="#2f3a2b">Licence</text>
<line x1="200.0" y1="180" x2="200.0" y2="202" stroke="#2f3a2b" stroke-width="3"/><polygon points="193.0,200 207.0,200 200.0,210" fill="#2f3a2b"/>
<rect x="16" y="210" width="368" height="54" rx="8" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/>
<text x="28" y="234" font-size="15" fill="#2f3a2b">3. Deer: host licence first, then your deer</text>
<text x="28" y="253" font-size="15" fill="#2f3a2b">licence</text>
<line x1="200.0" y1="264" x2="200.0" y2="286" stroke="#2f3a2b" stroke-width="3"/><polygon points="193.0,284 207.0,284 200.0,294" fill="#2f3a2b"/>
<rect x="16" y="294" width="368" height="35" rx="18" fill="#f3ead6" stroke="#6b4f35" stroke-width="2.5"/>
<text x="28" y="318" font-size="15" font-weight="bold" fill="#2f3a2b">4. Draws: late spring. Dates: VERIFY</text>
<line x1="200.0" y1="329" x2="200.0" y2="351" stroke="#2f3a2b" stroke-width="3"/><polygon points="193.0,349 207.0,349 200.0,359" fill="#2f3a2b"/>
<rect x="16" y="359" width="368" height="54" rx="8" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2.5"/>
<text x="28" y="383" font-size="15" font-weight="bold" fill="#2f3a2b">5. Read the Guide to Hunting Regulations,</text>
<text x="28" y="402" font-size="15" font-weight="bold" fill="#2f3a2b">July edition</text>
</svg>
