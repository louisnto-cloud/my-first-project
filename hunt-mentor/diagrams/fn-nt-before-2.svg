<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Write the back bearing to the truck or road on your hand.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c" stroke="none" stroke-width="2"/><text x="26" y="32" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="52" y="32" font-family="sans-serif" font-size="18" fill="#2f3a2b" text-anchor="start" font-weight="bold">Note the back bearing</text><rect x="130" y="80" width="140" height="120" rx="40" fill="#f4d9c4" stroke="#6b4f35" stroke-width="2"/><text x="200" y="148" font-family="sans-serif" font-size="22" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Back 220°</text><text x="20" y="270" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Write it on your hand</text>
</svg>
