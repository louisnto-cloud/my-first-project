<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 454" font-family="sans-serif" role="img" aria-label="Decision chart before each trip: is the map still true? If the season or class changed, for example on 1 November, update the layer 1 legal notes. If there is a new closure, fire ban or road notice, update layers 2 and 3, closures and access. If new snow or a hard freeze, shift layer 4, habitat, down. If the wind does not fit your seat, pick the other seat. If no to all, go, log what you see and update layer 6, your sign layer, that night.">
<rect width="400" height="454" fill="#fffaf0"/>
<defs><marker id="rq-map-gonogo-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2f3a2b"/></marker><marker id="rq-map-gonogo-o" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#e8590c"/></marker></defs>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Before each trip: is the map still true?</text>
<rect x="10" y="40" width="232" height="58" rx="8" fill="#f6f1e3" stroke="#2f3a2b" stroke-width="1.6"/>
<circle cx="38" cy="69.0" r="20" fill="#fffaf0" stroke="#d8cfb8" stroke-width="1.2"/>
<rect x="24" y="57.0" width="28" height="26" rx="3" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/><rect x="24" y="57.0" width="28" height="8" rx="2" fill="#c0392b"/><line x1="31" y1="53.0" x2="31" y2="60.0" stroke="#2f3a2b" stroke-width="2.4"/><line x1="45" y1="53.0" x2="45" y2="60.0" stroke="#2f3a2b" stroke-width="2.4"/><text x="38" y="79" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1</text>
<text x="66" y="65" font-size="16" font-weight="bold" fill="#2f3a2b">Season or class</text>
<text x="66" y="84" font-size="16" font-weight="bold" fill="#2f3a2b">changed (1 Nov)?</text>
<rect x="282" y="40" width="108" height="58" rx="8" fill="#e8590c"/>
<text x="336" y="65" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Update the</text>
<text x="336" y="84" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">layer 1 notes</text>
<line x1="242" y1="77.0" x2="278" y2="77.0" stroke="#e8590c" stroke-width="2.6" marker-end="url(#rq-map-gonogo-o)"/>
<text x="262" y="68" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">yes</text>
<line x1="126" y1="98" x2="126" y2="125" stroke="#2f3a2b" stroke-width="2.4" marker-end="url(#rq-map-gonogo-a)"/>
<text x="136" y="118" font-size="14" font-weight="bold" fill="#2f3a2b">no</text>
<rect x="10" y="128" width="232" height="58" rx="8" fill="#f6f1e3" stroke="#2f3a2b" stroke-width="1.6"/>
<circle cx="38" cy="157.0" r="20" fill="#fffaf0" stroke="#d8cfb8" stroke-width="1.2"/>
<rect x="22" y="149.0" width="32" height="11" rx="2" fill="#fffaf0" stroke="#c0392b" stroke-width="2"/><path d="M26 149.0 l6 11 M36 149.0 l6 11 M46 149.0 l6 11" stroke="#c0392b" stroke-width="3"/><line x1="27" y1="160.0" x2="27" y2="172.0" stroke="#2f3a2b" stroke-width="2.4"/><line x1="49" y1="160.0" x2="49" y2="172.0" stroke="#2f3a2b" stroke-width="2.4"/>
<text x="66" y="153" font-size="16" font-weight="bold" fill="#2f3a2b">New closure, fire ban</text>
<text x="66" y="172" font-size="16" font-weight="bold" fill="#2f3a2b">or road notice?</text>
<rect x="282" y="128" width="108" height="58" rx="8" fill="#e8590c"/>
<text x="336" y="153" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Update layer</text>
<text x="336" y="172" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">2 and 3</text>
<line x1="242" y1="165.0" x2="278" y2="165.0" stroke="#e8590c" stroke-width="2.6" marker-end="url(#rq-map-gonogo-o)"/>
<text x="262" y="156" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">yes</text>
<line x1="126" y1="186" x2="126" y2="213" stroke="#2f3a2b" stroke-width="2.4" marker-end="url(#rq-map-gonogo-a)"/>
<text x="136" y="206" font-size="14" font-weight="bold" fill="#2f3a2b">no</text>
<rect x="10" y="216" width="232" height="58" rx="8" fill="#f6f1e3" stroke="#2f3a2b" stroke-width="1.6"/>
<circle cx="38" cy="245.0" r="20" fill="#fffaf0" stroke="#d8cfb8" stroke-width="1.2"/>
<g transform="rotate(0 38 245.0)"><line x1="38" y1="230.0" x2="38" y2="260.0" stroke="#4a7fb0" stroke-width="2.6" stroke-linecap="round"/><path d="M33 230.0 L38 235.0 L43 230.0 M33 260.0 L38 255.0 L43 260.0" fill="none" stroke="#4a7fb0" stroke-width="2.2" stroke-linecap="round"/></g><g transform="rotate(60 38 245.0)"><line x1="38" y1="230.0" x2="38" y2="260.0" stroke="#4a7fb0" stroke-width="2.6" stroke-linecap="round"/><path d="M33 230.0 L38 235.0 L43 230.0 M33 260.0 L38 255.0 L43 260.0" fill="none" stroke="#4a7fb0" stroke-width="2.2" stroke-linecap="round"/></g><g transform="rotate(120 38 245.0)"><line x1="38" y1="230.0" x2="38" y2="260.0" stroke="#4a7fb0" stroke-width="2.6" stroke-linecap="round"/><path d="M33 230.0 L38 235.0 L43 230.0 M33 260.0 L38 255.0 L43 260.0" fill="none" stroke="#4a7fb0" stroke-width="2.2" stroke-linecap="round"/></g>
<text x="66" y="241" font-size="16" font-weight="bold" fill="#2f3a2b">New snow or a</text>
<text x="66" y="260" font-size="16" font-weight="bold" fill="#2f3a2b">hard freeze?</text>
<rect x="282" y="216" width="108" height="58" rx="8" fill="#e8590c"/>
<text x="336" y="241" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Shift layer 4</text>
<text x="336" y="260" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">down</text>
<line x1="242" y1="253.0" x2="278" y2="253.0" stroke="#e8590c" stroke-width="2.6" marker-end="url(#rq-map-gonogo-o)"/>
<text x="262" y="244" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">yes</text>
<line x1="126" y1="274" x2="126" y2="301" stroke="#2f3a2b" stroke-width="2.4" marker-end="url(#rq-map-gonogo-a)"/>
<text x="136" y="294" font-size="14" font-weight="bold" fill="#2f3a2b">no</text>
<rect x="10" y="304" width="232" height="58" rx="8" fill="#f6f1e3" stroke="#2f3a2b" stroke-width="1.6"/>
<circle cx="38" cy="333.0" r="20" fill="#fffaf0" stroke="#d8cfb8" stroke-width="1.2"/>
<path d="M22 326.0 H44 a5 5 0 1 0 -5 -5 M22 334.0 H50 a5 5 0 1 1 -5 5 M26 342.0 H40" fill="none" stroke="#4a7fb0" stroke-width="2.6" stroke-linecap="round"/>
<text x="66" y="329" font-size="16" font-weight="bold" fill="#2f3a2b">Wind does not fit</text>
<text x="66" y="348" font-size="16" font-weight="bold" fill="#2f3a2b">your seat?</text>
<rect x="282" y="304" width="108" height="58" rx="8" fill="#e8590c"/>
<text x="336" y="329" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Pick the other</text>
<text x="336" y="348" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">seat</text>
<line x1="242" y1="341.0" x2="278" y2="341.0" stroke="#e8590c" stroke-width="2.6" marker-end="url(#rq-map-gonogo-o)"/>
<text x="262" y="332" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">yes</text>
<line x1="126" y1="362" x2="126" y2="389" stroke="#2f3a2b" stroke-width="2.4" marker-end="url(#rq-map-gonogo-a)"/>
<text x="136" y="382" font-size="14" font-weight="bold" fill="#2f3a2b">no</text>
<rect x="10" y="392" width="380" height="54" rx="8" fill="#2f3a2b"/>
<text x="200" y="414" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Go. Log what you see,</text>
<text x="200" y="434" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">update layer 6 tonight</text>
</svg>
