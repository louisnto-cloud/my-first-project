<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 448" role="img" aria-label="Decision chart before each trip. If the season or class changed, for example on 1 November, update the legal notes. If a new closure, fire ban or road notice, update closures and access. If new snow or a hard freeze, shift habitat lower. If the wind does not fit your seat, pick the other seat. Then go, log what you see and update your sign layer that night.">
<rect x="0" y="0" width="400" height="448" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Before each trip: is the map still true?</text>
<rect x="10" y="42" width="230" height="62" rx="10" fill="#f5f1e4" stroke="#2f3a2b" stroke-width="2"/>
<text x="22" y="64" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Season or class changed (1</text>
<text x="22" y="80" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Nov)?</text>
<g><line x1="242" y1="73.0" x2="268" y2="73.0" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="268.0,73.0 260.8,76.5 260.8,69.5" fill="#e8590c"/></g>
<rect x="272" y="46" width="118" height="54" rx="10" fill="#e8590c" stroke="#e8590c" stroke-width="2"/>
<text x="331" y="66" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Update the</text>
<text x="331" y="81" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">layer 1 notes</text>
<text x="255" y="67.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e8590c" text-anchor="middle">yes</text>
<g><line x1="125" y1="104" x2="125" y2="124" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><polygon points="125.0,124.0 121.5,116.8 128.5,116.8" fill="#2f3a2b"/></g>
<text x="134" y="119" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2f3a2b" text-anchor="start">no</text>
<rect x="10" y="126" width="230" height="62" rx="10" fill="#f5f1e4" stroke="#2f3a2b" stroke-width="2"/>
<text x="22" y="148" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">New closure, fire ban or</text>
<text x="22" y="164" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">road notice?</text>
<g><line x1="242" y1="157.0" x2="268" y2="157.0" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="268.0,157.0 260.8,160.5 260.8,153.5" fill="#e8590c"/></g>
<rect x="272" y="130" width="118" height="54" rx="10" fill="#e8590c" stroke="#e8590c" stroke-width="2"/>
<text x="331" y="150" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Update layer 2</text>
<text x="331" y="165" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">and 3</text>
<text x="255" y="151.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e8590c" text-anchor="middle">yes</text>
<g><line x1="125" y1="188" x2="125" y2="208" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><polygon points="125.0,208.0 121.5,200.8 128.5,200.8" fill="#2f3a2b"/></g>
<text x="134" y="203" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2f3a2b" text-anchor="start">no</text>
<rect x="10" y="210" width="230" height="62" rx="10" fill="#f5f1e4" stroke="#2f3a2b" stroke-width="2"/>
<text x="22" y="232" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">New snow or a hard freeze?</text>
<g><line x1="242" y1="241.0" x2="268" y2="241.0" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="268.0,241.0 260.8,244.5 260.8,237.5" fill="#e8590c"/></g>
<rect x="272" y="214" width="118" height="54" rx="10" fill="#e8590c" stroke="#e8590c" stroke-width="2"/>
<text x="331" y="234" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Shift layer 4</text>
<text x="331" y="249" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">down</text>
<text x="255" y="235.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e8590c" text-anchor="middle">yes</text>
<g><line x1="125" y1="272" x2="125" y2="292" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><polygon points="125.0,292.0 121.5,284.8 128.5,284.8" fill="#2f3a2b"/></g>
<text x="134" y="287" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2f3a2b" text-anchor="start">no</text>
<rect x="10" y="294" width="230" height="62" rx="10" fill="#f5f1e4" stroke="#2f3a2b" stroke-width="2"/>
<text x="22" y="316" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Wind does not fit your</text>
<text x="22" y="332" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">seat?</text>
<g><line x1="242" y1="325.0" x2="268" y2="325.0" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="268.0,325.0 260.8,328.5 260.8,321.5" fill="#e8590c"/></g>
<rect x="272" y="298" width="118" height="54" rx="10" fill="#e8590c" stroke="#e8590c" stroke-width="2"/>
<text x="331" y="318" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Pick the other</text>
<text x="331" y="333" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">seat</text>
<text x="255" y="319.0" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e8590c" text-anchor="middle">yes</text>
<g><line x1="125" y1="356" x2="125" y2="376" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><polygon points="125.0,376.0 121.5,368.8 128.5,368.8" fill="#2f3a2b"/></g>
<text x="134" y="371" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2f3a2b" text-anchor="start">no</text>
<rect x="10" y="378" width="380" height="54" rx="10" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="2"/>
<text x="200" y="400" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Go. Log what you see, update layer 6 tonight</text>
</svg>
