<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" role="img" aria-label="A conifer with a dark spruce grouse sitting on a branch close to the trunk, circled. It looks like a dark blob near the trunk with the tail hanging down. Tip: look up slowly; midday is the time." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="310" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Spot a grouse sitting in a tree</text>
<rect x="0" y="260" width="400" height="40" fill="#dfe6d3"/>
<rect x="190" y="40" width="16" height="225" fill="#6b4f35"/>
<path d="M198 70 L138 100 M198 70 L258 100" stroke="#2f3a2b" stroke-width="10" stroke-linecap="round"/>
<path d="M198 110 L108 140 M198 110 L288 140" stroke="#2f3a2b" stroke-width="10" stroke-linecap="round"/>
<path d="M198 150 L78 180 M198 150 L318 180" stroke="#2f3a2b" stroke-width="10" stroke-linecap="round"/>
<path d="M198 190 L48 220 M198 190 L348 220" stroke="#2f3a2b" stroke-width="10" stroke-linecap="round"/>
<path d="M198 230 L28 260 M198 230 L368 260" stroke="#2f3a2b" stroke-width="10" stroke-linecap="round"/>
<g transform="translate(232 132) scale(0.8 0.8)"><polygon points="-22,-4 -36,-8 -36,4 -22,6" fill="#23261f"/><ellipse cx="0" cy="0" rx="26" ry="15" fill="#3d3a35"/><circle cx="21" cy="-14" r="8" fill="#3d3a35"/><path d="M18 -20 q5 -5 10 0" fill="none" stroke="#c23b22" stroke-width="3"/><polygon points="28,-16 35,-13 28,-10" fill="#6b4f35"/><circle cx="23" cy="-16" r="1.8" fill="#23261f"/><path d="M2 13 l-2 11 M10 13 l2 11" stroke="#6b4f35" stroke-width="2.5" fill="none"/></g>
<path d="M216 140 l-6 20" stroke="#23261f" stroke-width="5"/>
<circle cx="232" cy="132" r="40" fill="none" stroke="#e8590c" stroke-width="3"/>
<text x="280" y="70" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">A dark blob</text>
<text x="280" y="89" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">near the trunk</text>
<text x="10" y="282" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Tail hangs down. Look up, slowly.</text>
<text x="10" y="301" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Midday is the time (Tip).</text>
</svg>
