<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Common pump problems: 1 short stroke, the fore end not pulled fully back, so the next shell jams or fails to feed. 2 shell slid back over the carrier during loading. 3 wrong length or gauge shell. 4 no click: the shell did not catch the latch.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Pump: what goes wrong</text>
<rect x="12" y="50" width="376" height="50" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.6"/>
<circle cx="36" cy="75" r="13" fill="#FF6A13"/><text x="36" y="80.4" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="58.0" y="71.0" font-size="16" font-weight="bold" fill="#1F3D2B" text-anchor="start">Short stroke</text>
<text x="58.0" y="91.0" font-size="14" fill="#17201A" text-anchor="start">Fore end not pulled all the way. Rack it hard.</text>
<rect x="12" y="108" width="376" height="50" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.6"/>
<circle cx="36" cy="133" r="13" fill="#1F3D2B"/><text x="36" y="138.4" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="58.0" y="129.0" font-size="16" font-weight="bold" fill="#1F3D2B" text-anchor="start">Shell over the carrier</text>
<text x="58.0" y="149.0" font-size="14" fill="#17201A" text-anchor="start">Safety on, muzzle safe, open hard (manual).</text>
<rect x="12" y="166" width="376" height="50" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.6"/>
<circle cx="36" cy="191" r="13" fill="#1F3D2B"/><text x="36" y="196.4" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="58.0" y="187.0" font-size="16" font-weight="bold" fill="#1F3D2B" text-anchor="start">Wrong shell</text>
<text x="58.0" y="207.0" font-size="14" fill="#17201A" text-anchor="start">Check gauge and length against the barrel.</text>
<rect x="12" y="224" width="376" height="50" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.6"/>
<circle cx="36" cy="249" r="13" fill="#1F3D2B"/><text x="36" y="254.4" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="58.0" y="245.0" font-size="16" font-weight="bold" fill="#1F3D2B" text-anchor="start">Rim not past the latch</text>
<text x="58.0" y="265.0" font-size="14" fill="#17201A" text-anchor="start">Push each shell until it clicks.</text>
<text x="200.0" y="290.0" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Short stroking is the number one pump mistake.</text>
</svg>
