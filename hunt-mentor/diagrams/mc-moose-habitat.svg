<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Cross section of moose country from left to right. Lake with water plants used in summer. Willow, the main food all year. A cutblock 10 to 30 years old with browse. A burn 3 to 15 years old with browse. Old conifer for shade and shelter in deep snow. Food in the open, cover close by.">
