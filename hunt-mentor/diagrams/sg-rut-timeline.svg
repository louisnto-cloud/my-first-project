<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" font-family="sans-serif" role="img" aria-label="Rut timeline by species, September to December. Elk: early September to mid October, peak about the third week of September. Moose: late September to mid October, peak last week of September to first week of October. White tailed deer: late October to early December, peak mid November. Mule deer: mid November to mid December, peak mid November. Black tailed deer: November to early December, peak mid November. Your mid to late October hunts land in the deer pre rut and the end of the moose rut.">
<rect width="400" height="340" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Who ruts when</text>
<rect x="212" y="44" width="37" height="232" fill="#f3d36b" opacity=".45"/>
<line x1="110" y1="44" x2="110" y2="276" stroke="#dfe6d3" stroke-width="2"/>
<text x="142" y="296" font-size="15" fill="#2f3a2b" text-anchor="middle">Sep</text>
<line x1="179" y1="44" x2="179" y2="276" stroke="#dfe6d3" stroke-width="2"/>
<text x="212" y="296" font-size="15" fill="#2f3a2b" text-anchor="middle">Oct</text>
<line x1="251" y1="44" x2="251" y2="276" stroke="#dfe6d3" stroke-width="2"/>
<text x="284" y="296" font-size="15" fill="#2f3a2b" text-anchor="middle">Nov</text>
<line x1="321" y1="44" x2="321" y2="276" stroke="#dfe6d3" stroke-width="2"/>
<text x="353" y="296" font-size="15" fill="#2f3a2b" text-anchor="middle">Dec</text>
<text x="102" y="76" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">Elk</text>
<rect x="115" y="59" width="97" height="22" rx="8" fill="#8b5a2b" opacity=".75"/>
<path d="M156 55 l8 15 l-8 15 l-8 -15 Z" fill="#2f3a2b"/>
<text x="102" y="121" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">Moose</text>
<rect x="163" y="104" width="49" height="22" rx="8" fill="#6b4f35" opacity=".75"/>
<path d="M179 100 l8 15 l-8 15 l-8 -15 Z" fill="#2f3a2b"/>
<text x="102" y="166" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">White tail</text>
<rect x="235" y="149" width="95" height="22" rx="8" fill="#e8590c" opacity=".75"/>
<path d="M284 145 l8 15 l-8 15 l-8 -15 Z" fill="#2f3a2b"/>
<text x="102" y="211" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">Mule deer</text>
<rect x="284" y="194" width="69" height="22" rx="8" fill="#c0581a" opacity=".75"/>
<path d="M290 190 l8 15 l-8 15 l-8 -15 Z" fill="#2f3a2b"/>
<text x="102" y="256" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">Black tail</text>
<rect x="251" y="239" width="79" height="22" rx="8" fill="#8a9a6b" opacity=".75"/>
<path d="M284 235 l8 15 l-8 15 l-8 -15 Z" fill="#2f3a2b"/>
<path d="M30 316 l7 -8 l7 8 l-7 8 Z" fill="#2f3a2b"/><text x="50" y="321" font-size="14" fill="#2f3a2b">peak</text>
<rect x="110" y="309" width="18" height="14" fill="#f3d36b"/><text x="134" y="321" font-size="14" fill="#2f3a2b">your mid to late October hunts</text>
</svg>