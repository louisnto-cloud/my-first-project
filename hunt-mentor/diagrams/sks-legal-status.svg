<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Status card for a standard Chinese Type 56 SKS: class non restricted; licence PAL, Possession and Acquisition Licence; magazine limited to 5 rounds by law; not on the 2020, 2024 or 2025 prohibition lists; under federal review. Source line: RCMP Firearms Reference Table valid 19 October 2026.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Your SKS today: legal status</text>
<rect x="14.0" y="44.0" width="372.0" height="222.0" rx="12" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="30.0" y="74.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Class</text><text x="130.0" y="74.0" font-size="15" font-weight="bold" fill="#2E7D4F" text-anchor="start">Non restricted</text><text x="30.0" y="106.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Licence</text><text x="130.0" y="106.0" font-size="15" font-weight="bold" fill="#1F3D2B" text-anchor="start">PAL (Possession and</text><text x="130.0" y="138.0" font-size="15" font-weight="bold" fill="#1F3D2B" text-anchor="start">Acquisition Licence)</text><text x="30.0" y="170.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Magazine</text><text x="130.0" y="170.0" font-size="15" font-weight="bold" fill="#FF6A13" text-anchor="start">5 rounds, by law</text><text x="30.0" y="202.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Ban lists</text><text x="130.0" y="202.0" font-size="15" font-weight="bold" fill="#2E7D4F" text-anchor="start">Not on 2020, 2024, 2025</text><text x="30.0" y="234.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Review</text><text x="130.0" y="234.0" font-size="15" font-weight="bold" fill="#FF6A13" text-anchor="start">Under federal review</text><text x="200.0" y="286.0" font-size="14" fill="#17201A" text-anchor="middle">RCMP reference table, valid 19 Oct 2026</text>
</svg>
