<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Five panels, the goose alarm ladder. 1: feeding, heads down. 2: alert, a few heads up. 3: tall necks, walking off and honking. 4: head tossing, the signal they are about to fly, 80 percent. 5: flush, gone. Tip: at 2 freeze, at 3 do not move at all, at 4 they are leaving: shoot now if in range or let them go.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The alarm ladder: read it from the hide</text><rect x="9" y="50" width="72" height="160" rx="8" fill="#e8f3e0" stroke="#8a9a6b" stroke-width="2"/><circle cx="45" cy="70" r="13" fill="#e8590c"/><text x="45" y="75" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1</text><g transform="translate(41 150) scale(0.55 0.55)"><path d="M-34 0 Q-38 -16 -18 -16 L12 -14 Q26 -10 24 2 Q18 12 -4 12 L-24 12 Q-36 8 -34 0Z" fill="#7a6a58"/><path d="M14 -10 Q30 -6 34 14 L28 16 Q24 0 12 -2Z" fill="#2f3a2b"/><ellipse cx="33" cy="18" rx="6" ry="4" fill="#2f3a2b"/><path d="M30 16 Q34 22 36 19" stroke="#fff" stroke-width="2.5" fill="none"/><path d="M-6 12 L-8 24 M2 12 L4 24" stroke="#2f3a2b" stroke-width="3"/></g><text x="45" y="188" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Feeding</text><rect x="87" y="50" width="72" height="160" rx="8" fill="#f5f5dc" stroke="#8a9a6b" stroke-width="2"/><circle cx="123" cy="70" r="13" fill="#e8590c"/><text x="123" y="75" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2</text><g transform="translate(119 150) scale(0.55 0.55)"><path d="M-34 0 Q-38 -16 -18 -16 L12 -14 Q26 -10 24 2 Q18 12 -4 12 L-24 12 Q-36 8 -34 0Z" fill="#7a6a58"/><path d="M-36 2 Q-40 -2 -30 -8 L-28 6Z" fill="#fff"/><path d="M14 -12 Q18 -40 24 -46 L30 -44 Q24 -36 22 -10Z" fill="#2f3a2b"/><ellipse cx="28" cy="-48" rx="7" ry="5" fill="#2f3a2b"/><path d="M34 -49 L44 -46 L34 -44Z" fill="#2f3a2b"/><path d="M24 -50 Q28 -44 30 -46" stroke="#fff" stroke-width="3" fill="none"/><path d="M-6 12 L-8 26 M2 12 L4 26" stroke="#2f3a2b" stroke-width="3"/></g><text x="123" y="188" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Alert</text><rect x="165" y="50" width="72" height="160" rx="8" fill="#fff4e5" stroke="#8a9a6b" stroke-width="2"/><circle cx="201" cy="70" r="13" fill="#e8590c"/><text x="201" y="75" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3</text><g transform="translate(197 146) scale(0.62 0.62)"><path d="M-34 0 Q-38 -16 -18 -16 L12 -14 Q26 -10 24 2 Q18 12 -4 12 L-24 12 Q-36 8 -34 0Z" fill="#7a6a58"/><path d="M-36 2 Q-40 -2 -30 -8 L-28 6Z" fill="#fff"/><path d="M14 -12 Q18 -40 24 -46 L30 -44 Q24 -36 22 -10Z" fill="#2f3a2b"/><ellipse cx="28" cy="-48" rx="7" ry="5" fill="#2f3a2b"/><path d="M34 -49 L44 -46 L34 -44Z" fill="#2f3a2b"/><path d="M24 -50 Q28 -44 30 -46" stroke="#fff" stroke-width="3" fill="none"/><path d="M-6 12 L-8 26 M2 12 L4 26" stroke="#2f3a2b" stroke-width="3"/></g><text x="201" y="188" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Tall necks</text><rect x="243" y="50" width="72" height="160" rx="8" fill="#fde3cf" stroke="#8a9a6b" stroke-width="2"/><circle cx="279" cy="70" r="13" fill="#e8590c"/><text x="279" y="75" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4</text><g transform="translate(275 150) scale(0.55 0.55)"><path d="M-34 0 Q-38 -16 -18 -16 L12 -14 Q26 -10 24 2 Q18 12 -4 12 L-24 12 Q-36 8 -34 0Z" fill="#7a6a58"/><path d="M-36 2 Q-40 -2 -30 -8 L-28 6Z" fill="#fff"/><path d="M14 -12 Q18 -40 24 -46 L30 -44 Q24 -36 22 -10Z" fill="#2f3a2b"/><ellipse cx="28" cy="-48" rx="7" ry="5" fill="#2f3a2b"/><path d="M34 -49 L44 -46 L34 -44Z" fill="#2f3a2b"/><path d="M24 -50 Q28 -44 30 -46" stroke="#fff" stroke-width="3" fill="none"/><path d="M-6 12 L-8 26 M2 12 L4 26" stroke="#2f3a2b" stroke-width="3"/></g><path d="M285 112 q8 -8 14 0" stroke="#e8590c" stroke-width="2.5" fill="none"/><path d="M285 120 q8 8 14 0" stroke="#e8590c" stroke-width="2.5" fill="none"/><text x="279" y="188" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Head toss</text><rect x="321" y="50" width="72" height="160" rx="8" fill="#fdecea" stroke="#8a9a6b" stroke-width="2"/><circle cx="357" cy="70" r="13" fill="#e8590c"/><text x="357" y="75" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">5</text><g transform="translate(353 130) scale(0.55 0.55)"><ellipse cx="0" cy="0" rx="20" ry="7" fill="#2f3a2b"/><path d="M16 -2 L36 -4 L36 1 L16 3Z" fill="#2f3a2b"/><ellipse cx="40" cy="-2" rx="6" ry="4" fill="#2f3a2b"/><path d="M45 -3 L51 -1 L45 1Z" fill="#2f3a2b"/><path d="M-8 -3 L6 -30 L12 -3Z" fill="#2f3a2b"/><path d="M-20 0 L-28 -3 L-28 3Z" fill="#2f3a2b"/></g><text x="357" y="188" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Flush</text><text x="45" y="204" font-size="12.5" fill="#23261f" text-anchor="middle">heads down</text><text x="123" y="204" font-size="12.5" fill="#23261f" text-anchor="middle">heads up</text><text x="201" y="204" font-size="12.5" fill="#23261f" text-anchor="middle">walk, honk</text><text x="279" y="204" font-size="12.5" fill="#23261f" text-anchor="middle">about to fly</text><text x="357" y="204" font-size="12.5" fill="#23261f" text-anchor="middle">gone</text><rect x="20" y="224" width="360" height="66" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="200" y="246" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">At 2: freeze. At 3: do not move at all.</text><text x="200" y="266" font-size="14" fill="#23261f" text-anchor="middle">At 4 they are leaving: shoot now if in range,</text><text x="200" y="284" font-size="14" fill="#23261f" text-anchor="middle">or let them go (Tip)</text>
