<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Overall length bars: the standard SKS is about 1020 mm. A folding or telescoping stock that lets it fire when shorter than 660 mm makes it restricted. A bullpup stock is a prohibited device.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Stocks: the 660 mm line</text>
<line x1="20.0" y1="120.0" x2="380.0" y2="120.0" stroke="#17201A" stroke-width="1.5" stroke-linecap="round"/><rect x="20.0" y="100.0" width="357.0" height="40.0" rx="4" fill="#D9DCD7" stroke="#17201A" stroke-width="1.5"/><text x="200.0" y="125.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Standard: about 1020 mm</text><rect x="20.0" y="170.0" width="210.0" height="40.0" rx="4" fill="#F3D1C4" stroke="#B3261E" stroke-width="2"/><text x="125.0" y="195.0" font-size="14" font-weight="bold" fill="#B3261E" text-anchor="middle">Folded under 660</text><line x1="251.0" y1="86.0" x2="251.0" y2="222.0" stroke="#FF6A13" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><text x="257.0" y="82.0" font-size="14" font-weight="bold" fill="#FF6A13" text-anchor="start">660 mm</text><text x="30.0" y="252.0" font-size="14" font-weight="bold" fill="#B3261E" text-anchor="start">Fires when folded under 660 mm: restricted.</text><text x="30.0" y="274.0" font-size="14" font-weight="bold" fill="#B3261E" text-anchor="start">Bullpup stock: prohibited device.</text>
</svg>
