<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A frequency bar from 0 to 10 kilohertz. Birds hear best from 1 to 4 kilohertz and little above 10, 80 percent. Truck doors, shell clinks and talking fall in the range they hear best: shut doors softly, whisper, keep shells quiet, a Tip.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Goose ears: tuned to your voice range</text><rect x="30" y="120" width="340" height="40" rx="6" fill="#eee" stroke="#2f3a2b" stroke-width="2"/><rect x="64.0" y="120" width="102.0" height="40" rx="0" fill="#e8590c"/><text x="115.0" y="146" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Best 1 to 4 kHz</text><text x="30.0" y="180" font-size="14" fill="#23261f" text-anchor="middle">0</text><text x="98.0" y="180" font-size="14" fill="#23261f" text-anchor="middle">2</text><text x="166.0" y="180" font-size="14" fill="#23261f" text-anchor="middle">4</text><text x="234.0" y="180" font-size="14" fill="#23261f" text-anchor="middle">6</text><text x="302.0" y="180" font-size="14" fill="#23261f" text-anchor="middle">8</text><text x="370.0" y="180" font-size="14" fill="#23261f" text-anchor="middle">10</text><text x="200" y="200" font-size="14" fill="#23261f" text-anchor="middle">kilohertz (kHz)</text><text x="200" y="80" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Most birds hear little above 10 kHz (80%)</text><rect x="30" y="216" width="340" height="76" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="200.0" y="236" font-size="14" fill="#23261f" text-anchor="middle">Truck doors, shell clinks, talking: all inside</text><text x="200.0" y="255" font-size="14" fill="#23261f" text-anchor="middle">the range they hear best. Shut doors softly,</text><text x="200.0" y="274" font-size="14" fill="#23261f" text-anchor="middle">whisper, keep shells quiet (Tip)</text>
</svg>
