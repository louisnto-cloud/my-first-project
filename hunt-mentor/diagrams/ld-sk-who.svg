<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 409" font-family="sans-serif" role="img" aria-label="Grid for Saskatchewan, you are a Canadian resident. White tailed deer: no guide, enter the draw first, licence 180 dollars. Black bear: no guide, 120 dollars non guided. Ducks, geese, grouse and partridge: no guide, game bird licence 100 dollars. Coyote: likely yes, VERIFY. Mule deer, moose, elk and pronghorn: Saskatchewan resident draw, VERIFY, assume no.">
<rect x="0" y="0" width="400" height="409" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Saskatchewan: who may hunt what</text>
<text x="200" y="46" font-size="14" fill="#6b4f35" text-anchor="middle">You are a Canadian resident (85%)</text>
<text x="280" y="74" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">BC resident</text>
<rect x="8" y="83" width="384" height="56" fill="#dfe6d3" rx="4"/>
<text x="14" y="107" font-size="14" font-weight="bold" fill="#2f3a2b">White tailed</text>
<text x="14" y="125" font-size="14" font-weight="bold" fill="#2f3a2b">deer</text>
<circle cx="280.0" cy="103" r="12" fill="#8a9a6b"/><path d="M274.6 103 l3.5999999999999996 4.199999999999999 l7.199999999999999 -8.399999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="280" y="131" font-size="14" fill="#2f3a2b" text-anchor="middle">No guide. Draw first, $180</text>
<text x="14" y="172" font-size="14" font-weight="bold" fill="#2f3a2b">Black bear</text>
<circle cx="280.0" cy="159" r="12" fill="#8a9a6b"/><path d="M274.6 159 l3.5999999999999996 4.199999999999999 l7.199999999999999 -8.399999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="280" y="187" font-size="14" fill="#2f3a2b" text-anchor="middle">No guide. $120</text>
<rect x="8" y="195" width="384" height="66" fill="#dfe6d3" rx="4"/>
<text x="14" y="215" font-size="14" font-weight="bold" fill="#2f3a2b">Ducks, geese,</text>
<text x="14" y="233" font-size="14" font-weight="bold" fill="#2f3a2b">grouse,</text>
<text x="14" y="251" font-size="14" font-weight="bold" fill="#2f3a2b">partridge</text>
<circle cx="280.0" cy="215" r="12" fill="#8a9a6b"/><path d="M274.6 215 l3.5999999999999996 4.199999999999999 l7.199999999999999 -8.399999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="280" y="243" font-size="14" fill="#2f3a2b" text-anchor="middle">No guide. $100</text>
<text x="14" y="294" font-size="14" font-weight="bold" fill="#2f3a2b">Coyote</text>
<circle cx="280.0" cy="281" r="12" fill="#4a7fb0"/><text x="280" y="286.04" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
<text x="280" y="309" font-size="14" fill="#2f3a2b" text-anchor="middle">Likely yes. VERIFY</text>
<rect x="8" y="317" width="384" height="72" fill="#dfe6d3" rx="4"/>
<text x="14" y="340" font-size="14" font-weight="bold" fill="#2f3a2b">Mule deer,</text>
<text x="14" y="358" font-size="14" font-weight="bold" fill="#2f3a2b">moose, elk,</text>
<text x="14" y="376" font-size="14" font-weight="bold" fill="#2f3a2b">pronghorn</text>
<circle cx="280.0" cy="337" r="12" fill="#e8590c"/><path d="M275.2 332.2 L284.8 341.8 M284.8 332.2 L275.2 341.8" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
<text x="280" y="365" font-size="14" fill="#2f3a2b" text-anchor="middle">Resident draw. VERIFY,</text>
<text x="280" y="381" font-size="14" fill="#2f3a2b" text-anchor="middle">assume no</text>
</svg>
