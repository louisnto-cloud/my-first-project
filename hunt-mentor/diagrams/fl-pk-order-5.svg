<rect x="110" y="150" width="180" height="40" rx="12" fill="#2f3a2b"/><rect x="116" y="156" width="50" height="28" rx="6" fill="#e8590c"/><rect x="234" y="156" width="50" height="28" rx="6" fill="#e8590c"/><text x="141" y="210" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Tourniquet</text><text x="259" y="210" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Licences</text>
