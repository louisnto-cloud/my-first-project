<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three blue GPS dots with accuracy circles: small in open sky, about 5 metres; bigger in timber; biggest near canyons and cliffs. Source gps.gov, 90 percent. The Hunt Map track skips points worse than 30 metres, 99 percent, app code.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">GPS accuracy: the blue circle</text><rect x="22" y="50" width="116" height="170" rx="6" fill="#dfe6d3"/><circle cx="80" cy="135" r="12" fill="#cfe0f0" stroke="#4a7fb0" stroke-width="2"/><circle cx="80" cy="135" r="6" fill="#4a7fb0"/><text x="80" y="245" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Open sky</text><text x="80" y="265" font-size="15" fill="#23261f" text-anchor="middle">about 5 m</text><rect x="142" y="50" width="116" height="170" rx="6" fill="#dfe6d3"/><circle cx="200" cy="135" r="26" fill="#cfe0f0" stroke="#4a7fb0" stroke-width="2"/><circle cx="200" cy="135" r="6" fill="#4a7fb0"/><text x="200" y="245" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Timber</text><text x="200" y="265" font-size="15" fill="#23261f" text-anchor="middle">bigger</text><rect x="262" y="50" width="116" height="170" rx="6" fill="#dfe6d3"/><circle cx="320" cy="135" r="42" fill="#cfe0f0" stroke="#4a7fb0" stroke-width="2"/><circle cx="320" cy="135" r="6" fill="#4a7fb0"/><text x="320" y="245" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Canyon, cliff</text><text x="320" y="265" font-size="15" fill="#23261f" text-anchor="middle">worse</text><g transform="translate(176 112) scale(0.6)"><polygon points="0,-36 -14,-4 14,-4" fill="#8a9a6b"/><polygon points="0,-24 -17,6 17,6" fill="#8a9a6b"/><rect x="-3" y="6" width="6" height="8" fill="#6b4f35"/></g><g transform="translate(228 168) scale(0.6)"><polygon points="0,-36 -14,-4 14,-4" fill="#8a9a6b"/><polygon points="0,-24 -17,6 17,6" fill="#8a9a6b"/><rect x="-3" y="6" width="6" height="8" fill="#6b4f35"/></g><text x="200" y="293" font-size="14" fill="#6b4f35" text-anchor="middle">gps.gov (90%). App skips points over 30 m (99%)</text>
</svg>
