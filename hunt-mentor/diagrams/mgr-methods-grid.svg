<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" role="img" aria-label="Six ways to hunt grouse. 1: walk the edges with a shotgun, slow, stop often. 2: still hunt sitting birds with a .22 head shot and a backstop. 3: follow the flush, mark the tree and go now. 4: hunt with a flushing or pointing dog. 5: partner push, a walker plus a blocker. 6: alpine and grassland hunts for ptarmigan and sharp tailed grouse." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="360" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Six ways to hunt grouse</text>
<rect x="10" y="42" width="185" height="96" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
<circle cx="32" cy="68" r="14" fill="#e8590c" stroke="none" stroke-width="0"/>
<text x="32" y="74" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="52" y="74" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Walk the edges</text>
<text x="22" y="112" font-size="14" fill="#23261f" text-anchor="start">Shotgun. Slow, stop often.</text>
<rect x="205" y="42" width="185" height="96" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
<circle cx="227" cy="68" r="14" fill="#e8590c" stroke="none" stroke-width="0"/>
<text x="227" y="74" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="247" y="74" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Still hunt sitters</text>
<text x="217" y="112" font-size="14" fill="#23261f" text-anchor="start">.22 head shot, backstop.</text>
<rect x="10" y="146" width="185" height="96" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
<circle cx="32" cy="172" r="14" fill="#2f3a2b" stroke="none" stroke-width="0"/>
<text x="32" y="178" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="52" y="178" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Follow the flush</text>
<text x="22" y="216" font-size="14" fill="#23261f" text-anchor="start">Mark the tree, go now.</text>
<rect x="205" y="146" width="185" height="96" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
<circle cx="227" cy="172" r="14" fill="#2f3a2b" stroke="none" stroke-width="0"/>
<text x="227" y="178" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="247" y="178" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Dog</text>
<text x="217" y="216" font-size="14" fill="#23261f" text-anchor="start">Flushing or pointing breed.</text>
<rect x="10" y="250" width="185" height="96" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
<circle cx="32" cy="276" r="14" fill="#2f3a2b" stroke="none" stroke-width="0"/>
<text x="32" y="282" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="52" y="282" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Partner push</text>
<text x="22" y="320" font-size="14" fill="#23261f" text-anchor="start">Walker plus a blocker.</text>
<rect x="205" y="250" width="185" height="96" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
<circle cx="227" cy="276" r="14" fill="#2f3a2b" stroke="none" stroke-width="0"/>
<text x="227" y="282" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
<text x="247" y="282" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Alpine, grassland</text>
<text x="217" y="320" font-size="14" fill="#23261f" text-anchor="start">Ptarmigan, sharp tails.</text>
</svg>
