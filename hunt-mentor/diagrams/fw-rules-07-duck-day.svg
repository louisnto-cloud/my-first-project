<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 376" role="img" aria-label="Six duck day checks. Non toxic shot only, none other in the pocket or boat. Plug in: 3 shells total. Stop at 8 ducks for the day. One feathered wing or the head stays on until the bird is preserved. Unpreserved birds in the fridge count toward the possession limit of 24. No shooting from a motor or sail boat while it still moves, even gliding." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="376" fill="#fffaf0"/>
  <text x="200" y="26" font-size="19" fill="#23261f" text-anchor="middle" font-weight="bold">Duck day: six checks</text>
  <rect x="6" y="40" width="191" height="104" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
  <rect x="6" y="40" width="191" height="30" rx="10" fill="#4a7fb0"/><rect x="6" y="58" width="191" height="12" fill="#4a7fb0"/>
  <text x="101.5" y="61" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Shot</text>
  <text x="101.5" y="92" font-size="14" fill="#23261f" text-anchor="middle">Non toxic only.</text>
  <text x="101.5" y="110" font-size="14" fill="#23261f" text-anchor="middle">No lead in the bag</text>
  <rect x="203" y="40" width="191" height="104" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
  <rect x="203" y="40" width="191" height="30" rx="10" fill="#4a7fb0"/><rect x="203" y="58" width="191" height="12" fill="#4a7fb0"/>
  <text x="298.5" y="61" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Plug</text>
  <text x="298.5" y="92" font-size="14" fill="#23261f" text-anchor="middle">3 shells total,</text>
  <text x="298.5" y="110" font-size="14" fill="#23261f" text-anchor="middle">chamber included</text>
  <rect x="6" y="150" width="191" height="104" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
  <rect x="6" y="150" width="191" height="30" rx="10" fill="#4a7fb0"/><rect x="6" y="168" width="191" height="12" fill="#4a7fb0"/>
  <text x="101.5" y="171" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Limit</text>
  <text x="101.5" y="202" font-size="14" fill="#23261f" text-anchor="middle">8 ducks a day,</text>
  <text x="101.5" y="220" font-size="14" fill="#23261f" text-anchor="middle">then stop</text>
  <rect x="203" y="150" width="191" height="104" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
  <rect x="203" y="150" width="191" height="30" rx="10" fill="#4a7fb0"/><rect x="203" y="168" width="191" height="12" fill="#4a7fb0"/>
  <text x="298.5" y="171" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Wing on</text>
  <text x="298.5" y="202" font-size="14" fill="#23261f" text-anchor="middle">One feathered wing</text>
  <text x="298.5" y="220" font-size="14" fill="#23261f" text-anchor="middle">or the head</text>
  <rect x="6" y="260" width="191" height="104" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
  <rect x="6" y="260" width="191" height="30" rx="10" fill="#4a7fb0"/><rect x="6" y="278" width="191" height="12" fill="#4a7fb0"/>
  <text x="101.5" y="281" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Fridge counts</text>
  <text x="101.5" y="312" font-size="14" fill="#23261f" text-anchor="middle">24 in possession</text>
  <text x="101.5" y="330" font-size="14" fill="#23261f" text-anchor="middle">until preserved</text>
  <rect x="203" y="260" width="191" height="104" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
  <rect x="203" y="260" width="191" height="30" rx="10" fill="#4a7fb0"/><rect x="203" y="278" width="191" height="12" fill="#4a7fb0"/>
  <text x="298.5" y="281" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Boat</text>
  <text x="298.5" y="312" font-size="14" fill="#23261f" text-anchor="middle">Dead still before</text>
  <text x="298.5" y="330" font-size="14" fill="#23261f" text-anchor="middle">you shoot</text>
</svg>
