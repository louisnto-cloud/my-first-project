<circle cx="26" cy="26" r="17" fill="#e8590c"/><text x="26" y="31" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">1</text><text x="52" y="32" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">At home: save, then test</text><rect x="20" y="56" width="360" height="200" rx="8" fill="#dfe6d3"/><g transform="translate(90 160) scale(1.2)"><rect x="-26" y="-48" width="52" height="96" rx="9" fill="#2f3a2b"/><rect x="-21" y="-40" width="42" height="76" rx="3" fill="#dfe6d3"/><circle cx="0" cy="42" r="3" fill="#fffaf0"/></g><text x="170" y="100" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Offline area saved</text><text x="170" y="130" font-size="15" fill="#23261f" text-anchor="start">Airplane mode on</text><text x="170" y="160" font-size="15" fill="#23261f" text-anchor="start">Map still loads?</text>
