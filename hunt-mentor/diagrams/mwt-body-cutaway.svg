<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Cutaway side view of a white tailed deer facing left. Behind the front leg the chest holds the lungs, with the heart low between the front legs. A dashed curved diaphragm separates the chest from the belly. Behind it sit the dark liver, then the large rumen in the middle of the belly, then the guts toward the hind legs. The spine runs along the top." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<g opacity="1" transform="translate(14 14)"><rect x="118" y="190" width="14" height="62" rx="6" fill="#d9c7a7" stroke="#6b4f35" stroke-width="2"/><rect x="140" y="190" width="14" height="62" rx="6" fill="#d9c7a7" stroke="#6b4f35" stroke-width="2"/><rect x="300" y="190" width="14" height="62" rx="6" fill="#d9c7a7" stroke="#6b4f35" stroke-width="2"/><rect x="322" y="190" width="14" height="62" rx="6" fill="#d9c7a7" stroke="#6b4f35" stroke-width="2"/><ellipse cx="220" cy="150" rx="130" ry="58" fill="#e9dcc2" stroke="#6b4f35" stroke-width="3"/><path d="M120 112 L66 52 L88 40 L150 100 Z" fill="#e9dcc2" stroke="#6b4f35" stroke-width="3" stroke-linejoin="round"/><ellipse cx="56" cy="46" rx="28" ry="15" fill="#e9dcc2" stroke="#6b4f35" stroke-width="3"/><path d="M72 34 L84 14 L88 36 Z" fill="#e9dcc2" stroke="#6b4f35" stroke-width="2"/><circle cx="46" cy="42" r="3" fill="#23261f"/><path d="M346 128 C 362 132 366 150 360 166" fill="none" stroke="#6b4f35" stroke-width="5" stroke-linecap="round"/></g><g transform="translate(14 14)"><path d="M110 102 Q 220 86 340 112" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 6"/><ellipse cx="236" cy="150" rx="52" ry="44" fill="#8a9a6b"/><path d="M290 136 c 14 -8 28 4 18 16 c -10 12 14 22 24 10 c 8 -10 0 30 -16 30 c -20 2 -36 -10 -30 -26 Z" fill="#c9b79c" stroke="#6b4f35" stroke-width="1.5"/><path d="M184 118 C 200 130 204 170 190 196 L 178 196 C 190 170 186 136 176 122 Z" fill="#5c3b1c"/><path d="M176 104 C 196 130 194 176 172 204" fill="none" stroke="#23261f" stroke-width="3" stroke-dasharray="6 4"/><ellipse cx="140" cy="142" rx="34" ry="38" fill="#f2b48e" stroke="#e8590c" stroke-width="2"/><ellipse cx="136" cy="182" rx="14" ry="16" fill="#9b2c1c"/></g><text x="200" y="22" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">Inside a white tail (left side)</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Lungs fill the chest from the shoulder to the diaphragm.</text><g transform="translate(14 14)"><text x="140" y="146" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Lungs</text><text x="84" y="214" font-size="15" fill="#9b2c1c" text-anchor="end" font-weight="bold">Heart</text><line x1="86" y1="210" x2="124" y2="190" stroke="#9b2c1c" stroke-width="2"/><text x="236" y="154" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Rumen</text><text x="176" y="78" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Diaphragm</text><line x1="178" y1="82" x2="180" y2="104" stroke="#23261f" stroke-width="2"/><text x="196" y="232" font-size="14" fill="#5c3b1c" text-anchor="middle" font-weight="bold">Liver</text><line x1="194" y1="218" x2="188" y2="200" stroke="#5c3b1c" stroke-width="2"/><text x="340" y="232" font-size="14" fill="#6b4f35" text-anchor="middle" font-weight="bold">Guts</text><line x1="336" y1="218" x2="318" y2="182" stroke="#6b4f35" stroke-width="2"/><text x="260" y="84" font-size="14" fill="#23261f" text-anchor="middle">Spine</text></g>
</svg>
