<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" role="img" aria-label="Two birds. Grouse and quail, and other non migratory game birds: one feathered wing stays attached. Ducks and geese, and other migratory game birds: one feathered wing or the feathered head stays attached. A turkey from a bearded turkey only season also keeps the beard." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="296" fill="#fffaf0"/>
<text x="200" y="26" font-size="20" fill="#23261f" text-anchor="middle" font-weight="bold">Birds: what stays attached</text>
<rect x="8" y="42" width="188" height="210" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<g transform="translate(100 110) scale(2.2)"><ellipse cx="0" cy="0" rx="16" ry="11" fill="#8b5a2b"/><circle cx="14" cy="-10" r="6" fill="#8b5a2b"/><path d="M19 -10 L24 -9 L19 -7 Z" fill="#2f3a2b"/><path d="M-14 -4 L-28 -12 L-28 4 Z" fill="#8b5a2b"/><path d="M-2 10 L-2 18 M4 10 L4 18" stroke="#2f3a2b" stroke-width="2"/></g>
<circle cx="92" cy="104" r="24" fill="none" stroke="#e8590c" stroke-width="3"/>
<text x="102" y="186" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Grouse, quail:</text>
<text x="102" y="206" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">one feathered</text>
<text x="102" y="226" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">wing</text>
<rect x="204" y="42" width="188" height="210" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
<g transform="translate(296 110) scale(2.2)"><ellipse cx="0" cy="0" rx="18" ry="9" fill="#8b5a2b"/><circle cx="15" cy="-9" r="7" fill="#2e6b3a"/><path d="M21 -9 L29 -7 L21 -5 Z" fill="#e0a526"/><path d="M-18 -2 L-26 -6 L-22 2 Z" fill="#8b5a2b"/></g>
<circle cx="330" cy="90" r="20" fill="none" stroke="#e8590c" stroke-width="3"/>
<circle cx="280" cy="108" r="22" fill="none" stroke="#e8590c" stroke-width="3"/>
<text x="298" y="186" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Ducks, geese:</text>
<text x="298" y="206" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">one feathered wing</text>
<text x="298" y="226" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">OR the feathered head</text>
<text x="200" y="280" font-size="15" fill="#2f3a2b" text-anchor="middle">Turkey, bearded only season: the beard too.</text>
</svg>
