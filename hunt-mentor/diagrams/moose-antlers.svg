<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 664" font-family="sans-serif" role="img" aria-label="Moose antler classes, counted on ONE antler. Spike fork bull: 2 tines or fewer, shown as a simple fork. Tripalm bull: 3 or more tines on the brow palm, the small front palm split from the main palm by the deepest bay, marked with a red dot. 10 point bull: 10 or more tines on one antler, brow palm included, shown with 3 brow palm and 7 main palm tines numbered 1 to 10. A tine is at least 2.5 centimetres long and longer than it is wide; rounded bumps on the palm may not count. Cow and calf have no antlers: a cow stands about 1.8 metres at the shoulder, a calf is much smaller with a short stubby face. No open season on cows or calves in Regions 3 and 8 without an LEH, Limited Entry Hunting, authorization.">
