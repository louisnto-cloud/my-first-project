<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" font-family="sans-serif">
  <rect x="0" y="0" width="400" height="640" fill="#fffaf0"/>
  <text x="200" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bull moose antler classes</text>
  <text x="200" y="42" font-size="13" fill="#6b4f35" text-anchor="middle">Count tines on ONE antler, side view.</text>
  <text x="200" y="58" font-size="13" fill="#6b4f35" text-anchor="middle">A tine: at least 2.5 cm, longer than it is wide.</text>

  <!-- Panel 1: spike fork -->
  <rect x="12" y="68" width="180" height="170" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
  <text x="102" y="90" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Spike fork bull</text>
  <g stroke="#6b4f35" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M102 212 L102 168"/>
    <path d="M102 168 L72 120"/>
    <path d="M102 168 L134 116"/>
  </g>
  <circle cx="72" cy="120" r="9" fill="#e8590c" stroke="#23261f" stroke-width="1.5"/>
  <text x="72" y="125" font-size="12" font-weight="bold" fill="#fffaf0" text-anchor="middle">1</text>
  <circle cx="134" cy="116" r="9" fill="#e8590c" stroke="#23261f" stroke-width="1.5"/>
  <text x="134" y="121" font-size="12" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text>
  <text x="102" y="230" font-size="13" fill="#23261f" text-anchor="middle">2 tines or fewer</text>

  <!-- Panel 2: tripalm -->
  <rect x="208" y="68" width="180" height="170" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
  <text x="298" y="90" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Tripalm bull</text>
  <path d="M300 213 L300 186 L318 174 L334 148 L342 116 L352 124 L346 150 L362 128 L372 138 L354 160 L366 158 L368 168 L342 180 L322 192 L300 186" fill="#f3ead8" stroke="#6b4f35" stroke-width="4" stroke-linejoin="round"/>
  <path d="M300 186 L282 178 L262 158 L256 136 L266 138 L270 154 L274 126 L284 128 L284 154 L294 130 L302 136 L298 160 L300 186" fill="#f3ead8" stroke="#6b4f35" stroke-width="4" stroke-linejoin="round"/>
  <line x1="300" y1="186" x2="300" y2="160" stroke="#e8590c" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
  <circle cx="256" cy="136" r="8" fill="#e8590c" stroke="#23261f" stroke-width="1.5"/>
  <text x="256" y="140" font-size="11" font-weight="bold" fill="#fffaf0" text-anchor="middle">1</text>
  <circle cx="274" cy="126" r="8" fill="#e8590c" stroke="#23261f" stroke-width="1.5"/>
  <text x="274" y="130" font-size="11" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text>
  <circle cx="294" cy="130" r="8" fill="#e8590c" stroke="#23261f" stroke-width="1.5"/>
  <text x="294" y="134" font-size="11" font-weight="bold" fill="#fffaf0" text-anchor="middle">3</text>
  <text x="252" y="204" font-size="11" fill="#6b4f35" text-anchor="middle">brow palm</text>
  <text x="352" y="204" font-size="11" fill="#6b4f35" text-anchor="middle">main palm</text>
  <text x="300" y="218" font-size="10" fill="#e8590c" text-anchor="middle">dashed line: deepest bay</text>
  <text x="298" y="232" font-size="13" fill="#23261f" text-anchor="middle">3 or more on the brow palm</text>

  <!-- Panel 3: 10 point -->
  <rect x="12" y="252" width="376" height="176" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
  <text x="200" y="274" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">10 point bull</text>
  <g transform="translate(-40,10)">
    <path d="M200 392 L200 362 L222 350 L240 320 L246 292 L256 300 L252 326 L266 300 L276 308 L266 334 L286 316 L294 326 L276 348 L300 340 L304 350 L280 362 L250 372 L224 376 L200 362" fill="#f3ead8" stroke="#6b4f35" stroke-width="4" stroke-linejoin="round"/>
    <path d="M200 362 L178 356 L160 338 L150 312 L160 314 L166 334 L170 306 L180 308 L180 334 L190 312 L198 316 L194 342 L200 362" fill="#f3ead8" stroke="#6b4f35" stroke-width="4" stroke-linejoin="round"/>
    <g font-size="11" font-weight="bold" fill="#fffaf0" text-anchor="middle">
      <circle cx="150" cy="312" r="8" fill="#e8590c" stroke="#23261f" stroke-width="1.5"/><text x="150" y="316">1</text>
      <circle cx="170" cy="306" r="8" fill="#e8590c" stroke="#23261f" stroke-width="1.5"/><text x="170" y="310">2</text>
      <circle cx="190" cy="312" r="8" fill="#e8590c" stroke="#23261f" stroke-width="1.5"/><text x="190" y="316">3</text>
      <circle cx="246" cy="292" r="8" fill="#e8590c" stroke="#23261f" stroke-width="1.5"/><text x="246" y="296">4</text>
      <circle cx="266" cy="300" r="8" fill="#e8590c" stroke="#23261f" stroke-width="1.5"/><text x="266" y="304">5</text>
      <circle cx="286" cy="316" r="8" fill="#e8590c" stroke="#23261f" stroke-width="1.5"/><text x="286" y="320">6</text>
      <circle cx="300" cy="340" r="8" fill="#e8590c" stroke="#23261f" stroke-width="1.5"/><text x="300" y="344">7</text>
    </g>
  </g>
  <text x="282" y="304" font-size="12" fill="#23261f">Add every tine on</text>
  <text x="282" y="320" font-size="12" fill="#23261f">this ONE antler,</text>
  <text x="282" y="336" font-size="12" fill="#23261f">brow palm included.</text>
  <text x="282" y="356" font-size="12" fill="#e8590c" font-weight="bold">Shown: 7. Not legal.</text>
  <text x="282" y="372" font-size="12" fill="#23261f">Need 10 or more.</text>
  <text x="200" y="418" font-size="12" fill="#23261f" text-anchor="middle">Rounded bumps on top of the palm may not count as tines</text>

  <!-- Panel 4: calf vs cow -->
  <rect x="12" y="442" width="376" height="188" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
  <text x="200" y="464" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Calf or cow? Neither has antlers</text>
  <text x="200" y="482" font-size="12" fill="#e8590c" font-weight="bold" text-anchor="middle">No open season on calves or cows in Regions 3 and 8</text>
  <text x="200" y="496" font-size="11" fill="#e8590c" text-anchor="middle">unless you hold an LEH authorization</text>
  <g fill="#6b4f35" stroke="#23261f" stroke-width="1.5">
    <rect x="50" y="516" width="96" height="44" rx="14"/>
    <path d="M140 520 L168 500 L194 512 L196 526 L176 534 L150 538 Z"/>
    <rect x="60" y="556" width="10" height="36"/>
    <rect x="86" y="556" width="10" height="36"/>
    <rect x="114" y="556" width="10" height="36"/>
    <rect x="134" y="556" width="10" height="36"/>
    <path d="M166 512 L162 498 L172 504 Z"/>
    <path d="M174 534 L172 548 L180 546 Z"/>
  </g>
  <text x="120" y="608" font-size="12" fill="#23261f" text-anchor="middle">Cow: tall, long face,</text>
  <text x="120" y="622" font-size="12" fill="#23261f" text-anchor="middle">about 1.8 m at the shoulder</text>
  <g fill="#b08a5e" stroke="#23261f" stroke-width="1.5">
    <rect x="258" y="540" width="54" height="28" rx="10"/>
    <path d="M308 544 L326 534 L338 544 L336 556 L320 560 L308 560 Z"/>
    <rect x="264" y="566" width="7" height="26"/>
    <rect x="280" y="566" width="7" height="26"/>
    <rect x="294" y="566" width="7" height="26"/>
    <rect x="304" y="566" width="7" height="26"/>
    <path d="M324 536 L322 526 L330 532 Z"/>
  </g>
  <text x="300" y="608" font-size="12" fill="#23261f" text-anchor="middle">Calf: much smaller,</text>
  <text x="300" y="622" font-size="12" fill="#23261f" text-anchor="middle">short stubby face</text>
</svg>
