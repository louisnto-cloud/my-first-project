<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Black bear tracks drawn to scale. Front track about 11 by 10 centimetres, a wide pad with five toes in a curved arc and short claw marks close to the toes. Hind track about 18 by 9 centimetres, like a wide human foot. Track test: lay a straight edge across the top of the front pad; on a black bear it crosses the toes because they form an arc. On a grizzly the toes sit in a straighter line above the edge and the claw marks are far ahead.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Black bear tracks (drawn to scale)</text><path d="M66.5 108.5 Q105 98.5 143.5 108.5 L137.5 140 Q105 146 72.5 140 Z" fill="#6b4f35"/><ellipse cx="71.0" cy="108.6" rx="8" ry="10" fill="#6b4f35"/><line x1="71.043" y1="96.6" x2="71.043" y2="88.6" stroke="#23261f" stroke-width="2.5"/><ellipse cx="88.0" cy="94.3" rx="8" ry="10" fill="#6b4f35"/><line x1="88.0215" y1="82.3" x2="88.0215" y2="74.3" stroke="#23261f" stroke-width="2.5"/><ellipse cx="105.0" cy="88.0" rx="8" ry="10" fill="#6b4f35"/><line x1="105.0" y1="76" x2="105.0" y2="68" stroke="#23261f" stroke-width="2.5"/><ellipse cx="122.0" cy="94.3" rx="8" ry="10" fill="#6b4f35"/><line x1="121.9785" y1="82.3" x2="121.9785" y2="74.3" stroke="#23261f" stroke-width="2.5"/><ellipse cx="139.0" cy="100.6" rx="8" ry="10" fill="#6b4f35"/><line x1="138.957" y1="88.6" x2="138.957" y2="80.6" stroke="#23261f" stroke-width="2.5"/><path d="M253.5 83.72 Q285 73.72 316.5 83.72 L310.5 182 Q285 188 259.5 182 Z" fill="#6b4f35"/><ellipse cx="257.2" cy="94.6" rx="8" ry="10" fill="#6b4f35"/><line x1="257.217" y1="82.6" x2="257.217" y2="74.6" stroke="#23261f" stroke-width="2.5"/><ellipse cx="271.1" cy="80.3" rx="8" ry="10" fill="#6b4f35"/><line x1="271.1085" y1="68.3" x2="271.1085" y2="60.3" stroke="#23261f" stroke-width="2.5"/><ellipse cx="285.0" cy="74.0" rx="8" ry="10" fill="#6b4f35"/><line x1="285.0" y1="62" x2="285.0" y2="54" stroke="#23261f" stroke-width="2.5"/><ellipse cx="298.9" cy="80.3" rx="8" ry="10" fill="#6b4f35"/><line x1="298.8915" y1="68.3" x2="298.8915" y2="60.3" stroke="#23261f" stroke-width="2.5"/><ellipse cx="312.8" cy="86.6" rx="8" ry="10" fill="#6b4f35"/><line x1="312.783" y1="74.6" x2="312.783" y2="66.6" stroke="#23261f" stroke-width="2.5"/><text x="105" y="190" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Front</text><text x="105" y="210" font-size="14" fill="#23261f" text-anchor="middle">about 11 x 10 cm</text><text x="285" y="200" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">Hind</text><text x="285" y="220" font-size="14" fill="#23261f" text-anchor="middle">about 18 x 9 cm</text><line x1="48" y1="113" x2="162" y2="113" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 4"/><text x="105" y="240" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Straight edge under toes</text><text x="105" y="258" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">cuts the toes: black bear</text><text x="200" y="288" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Claw marks close to toes. Like a wide human foot.</text>
</svg>
