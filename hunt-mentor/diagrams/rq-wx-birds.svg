<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Four cards. Geese fly all day in storms. Ducks: freeze up ends most interior migration by late November. Pheasants go deeper into cover in worse weather. Chukar move lower onto south slopes in heavy snow.">
<rect x="0" y="0" width="400" height="320" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Birds and bad weather</text>
<rect x="10" y="40" width="186" height="128" rx="10" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="1.5"/>
<g transform="translate(40 74) scale(0.9)"><ellipse rx="16" ry="6" fill="#2f3a2b"/><path d="M14 -2 L26 -10 L30 -9 L18 1 Z" fill="#111"/><rect x="24" y="-12" width="5" height="3" fill="#fff"/><path d="M-4 -3 L-16 -20 L8 -4 Z" fill="#2f3a2b"/><path d="M-4 3 L-14 19 L8 4 Z" fill="#2f3a2b"/></g>
<text x="70" y="70" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Geese</text>
<text x="20" y="114" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Stormy days: flights all</text>
<text x="20" y="131" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">day, not just dawn and</text>
<text x="20" y="148" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">dusk (70%).</text>
<rect x="204" y="40" width="186" height="128" rx="10" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="1.5"/>
<g transform="translate(234 74) scale(1.0)"><ellipse rx="13" ry="5" fill="#2f3a2b"/><circle cx="13" cy="-2" r="4" fill="#2f3a2b"/><path d="M16 -2 l6 1 l-6 2 Z" fill="#e8590c"/><path d="M-4 -2 L-14 -16 L6 -3 Z" fill="#2f3a2b"/><path d="M-4 2 L-12 15 L6 3 Z" fill="#2f3a2b"/></g>
<text x="264" y="70" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Ducks</text>
<text x="214" y="114" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Freeze up ends most</text>
<text x="214" y="131" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">interior migration by</text>
<text x="214" y="148" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">late Nov (75%).</text>
<rect x="10" y="176" width="186" height="128" rx="10" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="1.5"/>
<g transform="translate(40 210) scale(1.0)"><ellipse rx="13" ry="10" fill="#6b4f35"/><circle cx="11" cy="-9" r="6" fill="#6b4f35"/><path d="M16 -9 l5 1 l-5 2 Z" fill="#23261f"/><path d="M-12 -2 l-8 -4 l2 8 Z" fill="#6b4f35"/><rect x="-3" y="9" width="2" height="6" fill="#23261f"/><rect x="3" y="9" width="2" height="6" fill="#23261f"/><path d="M10 -14 q 2 -9 6 -10" stroke="#23261f" stroke-width="2.5" fill="none"/></g>
<text x="70" y="206" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Pheasant</text>
<text x="20" y="250" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Worse weather pushes</text>
<text x="20" y="267" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">birds deeper into cover</text>
<text x="20" y="284" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">(70%).</text>
<rect x="204" y="176" width="186" height="128" rx="10" fill="#f5f1e4" stroke="#8a9a6b" stroke-width="1.5"/>
<g transform="translate(234 210) scale(1.0)"><ellipse rx="13" ry="10" fill="#a08c6e"/><circle cx="11" cy="-9" r="6" fill="#a08c6e"/><path d="M16 -9 l5 1 l-5 2 Z" fill="#23261f"/><path d="M-12 -2 l-8 -4 l2 8 Z" fill="#a08c6e"/><rect x="-3" y="9" width="2" height="6" fill="#23261f"/><rect x="3" y="9" width="2" height="6" fill="#23261f"/></g>
<text x="264" y="206" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Chukar</text>
<text x="214" y="250" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Heavy snow pushes them</text>
<text x="214" y="267" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">lower, onto south slopes</text>
<text x="214" y="284" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">(75%).</text>
</svg>
