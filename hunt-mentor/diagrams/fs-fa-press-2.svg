<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 2: put gauze or cloth on the wound and press straight down hard with both hands. Lock your arms and lean in.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">2. Press hard</text><rect x="30" y="148" width="300" height="44" rx="22" fill="#d9b48f" stroke="#b08a66" stroke-width="2"/><circle cx="344" cy="170" r="24.0" fill="#d9b48f" stroke="#b08a66" stroke-width="2"/><ellipse cx="250" cy="170" rx="16" ry="7" fill="#c0392b"/><rect x="220" y="132" width="60" height="36" rx="4" fill="#ffffff" stroke="#9a9a8f" stroke-width="2"/><line x1="226" y1="144" x2="274" y2="144" stroke="#9a9a8f" stroke-width="1" stroke-linecap="round"/><line x1="226" y1="156" x2="274" y2="156" stroke="#9a9a8f" stroke-width="1" stroke-linecap="round"/><ellipse cx="250" cy="132" rx="26" ry="15" fill="#d9b48f" stroke="#2f3a2b" stroke-width="2"/><ellipse cx="250" cy="114" rx="23" ry="14" fill="#d9b48f" stroke="#2f3a2b" stroke-width="2"/><line x1="250" y1="100" x2="250" y2="60" stroke="#2f3a2b" stroke-width="8" stroke-linecap="round"/><text x="320" y="80" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Lean in</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Both hands, arms locked, lean in</text>
