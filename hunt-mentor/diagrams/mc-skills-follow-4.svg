<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 4: from the flag at the last sure print, walk a slow circle at 10 metres, then 20 metres, looking for the next sign. Never walk on the trail itself.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">4. Lost it? Circle 10 m, then 20 m</text><rect x="0" y="40" width="400" height="260" fill="#dfe6d3"/><line x1="200" y1="175" x2="200" y2="145" stroke="#6b4f35" stroke-width="3"/><path d="M200 145 L218 151 L200 157 Z" fill="#e8590c"/><circle cx="200" cy="165" r="50" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="6 5"/><circle cx="200" cy="165" r="100" fill="none" stroke="#4a7fb0" stroke-width="2" stroke-dasharray="6 5"/><text x="256" y="130" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">10 m</text><text x="306" y="82" font-size="15" fill="#4a7fb0" text-anchor="start" font-weight="bold">20 m</text><text x="200" y="288" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Never walk on the trail</text>
</svg>
