<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 305" font-family="sans-serif" role="img" aria-label="Grid of weather effects with evidence. Heat: moose bed in shade or water, strong evidence. Snow: pushes moose down slowly, strong. Wind and rain: calls carry less, a tip. Cold calm dawns: calls carry far, a tip. Moon and air pressure: no moose study found, verify.">
<rect x="0" y="0" width="400" height="305" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Weather and moose: how sure?</text><rect x="10" y="42" width="380" height="34" rx="4" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1"/><text x="20" y="64" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Heat</text><text x="150" y="64" font-size="14" fill="#23261f" text-anchor="start">beds in shade, water</text><text x="382" y="64" font-size="14" fill="#2f3a2b" text-anchor="end" font-weight="bold">strong</text><rect x="10" y="82" width="380" height="34" rx="4" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="1"/><text x="20" y="104" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Snow</text><text x="150" y="104" font-size="14" fill="#23261f" text-anchor="start">pushes down, slowly</text><text x="382" y="104" font-size="14" fill="#2f3a2b" text-anchor="end" font-weight="bold">strong</text><rect x="10" y="122" width="380" height="34" rx="4" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1"/><text x="20" y="144" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Wind, rain</text><text x="150" y="144" font-size="14" fill="#23261f" text-anchor="start">calls carry less</text><text x="382" y="144" font-size="14" fill="#e8590c" text-anchor="end" font-weight="bold">Tip</text><rect x="10" y="162" width="380" height="34" rx="4" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="1"/><text x="20" y="184" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Cold calm dawn</text><text x="150" y="184" font-size="14" fill="#23261f" text-anchor="start">calls carry far</text><text x="382" y="184" font-size="14" fill="#e8590c" text-anchor="end" font-weight="bold">Tip</text><rect x="10" y="202" width="380" height="34" rx="4" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1"/><text x="20" y="224" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Moon</text><text x="150" y="224" font-size="14" fill="#23261f" text-anchor="start">no moose study found</text><text x="382" y="224" font-size="14" fill="#999999" text-anchor="end" font-weight="bold">VERIFY</text><rect x="10" y="242" width="380" height="34" rx="4" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="1"/><text x="20" y="264" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Air pressure</text><text x="150" y="264" font-size="14" fill="#23261f" text-anchor="start">no moose study found</text><text x="382" y="264" font-size="14" fill="#999999" text-anchor="end" font-weight="bold">VERIFY</text><text x="200" y="298" font-size="14" fill="#6b4f35" text-anchor="middle">Evidence level for each line</text>
</svg>
