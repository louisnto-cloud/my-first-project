<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Avalanche rescue gear, all three for every person: a transceiver worn and switched on, a probe and a shovel in the pack on your back. One or two of the three is not enough.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Rescue gear: all three, every person</text><rect x="25" y="70" width="90" height="110" rx="10" fill="#e8590c" stroke="#2f3a2b" stroke-width="2"/><text x="70" y="206" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Transceiver</text><text x="70" y="226" font-size="14" fill="#2f3a2b" text-anchor="middle">worn, on</text><rect x="155" y="70" width="90" height="110" rx="10" fill="#9a9a8f" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="206" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Probe</text><text x="200" y="226" font-size="14" fill="#2f3a2b" text-anchor="middle">in the pack</text><rect x="285" y="70" width="90" height="110" rx="10" fill="#4a7fb0" stroke="#2f3a2b" stroke-width="2"/><text x="330" y="206" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Shovel</text><text x="330" y="226" font-size="14" fill="#2f3a2b" text-anchor="middle">in the pack</text><rect x="41" y="252" width="317" height="30" rx="6" fill="#2f3a2b"/><text x="200" y="273" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">One or two of three is not enough</text>
</svg>
