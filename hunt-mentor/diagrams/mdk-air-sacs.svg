<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Map of the 9 air sacs in a duck facing right, 80 percent: 2 neck sacs, 1 collar sac at the base of the neck, 2 front chest sacs, 2 rear chest sacs and 2 big belly sacs at the back. The lung is small and stiff, high against the spine. Air from the sacs reaches into the hollow wing bones."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">9 air sacs, 2 small stiff lungs</text><path d="M50 150 Q48 105 110 92 L250 86 Q300 84 318 100 Q332 70 350 62 Q376 56 382 76 L396 82 L382 88 Q372 96 352 104 Q340 130 330 160 Q318 214 240 222 L120 222 Q60 214 50 150 Z" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="3"/><ellipse cx="330" cy="96" rx="12" ry="9" fill="#bcd8f0" stroke="#4a7fb0" stroke-width="2"/><ellipse cx="306" cy="128" rx="16" ry="14" fill="#bcd8f0" stroke="#4a7fb0" stroke-width="2"/><ellipse cx="262" cy="146" rx="20" ry="16" fill="#bcd8f0" stroke="#4a7fb0" stroke-width="2"/><ellipse cx="214" cy="152" rx="20" ry="18" fill="#bcd8f0" stroke="#4a7fb0" stroke-width="2"/><ellipse cx="130" cy="150" rx="58" ry="30" fill="#bcd8f0" stroke="#4a7fb0" stroke-width="2"/><ellipse cx="240" cy="112" rx="28" ry="9" fill="#e7a3a3" stroke="#b5473a" stroke-width="2"/><text x="130" y="156" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Belly 2</text><line x1="214" y1="152" x2="200" y2="254" stroke="#2f3a2b" stroke-width="2" fill="none"/><text x="196" y="268" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Rear chest 2</text><line x1="262" y1="150" x2="300" y2="238" stroke="#2f3a2b" stroke-width="2" fill="none"/><text x="300" y="252" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Front chest 2</text><line x1="306" y1="128" x2="360" y2="140" stroke="#2f3a2b" stroke-width="2" fill="none"/><text x="360" y="156" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Collar 1</text><line x1="330" y1="92" x2="330" y2="44" stroke="#2f3a2b" stroke-width="2" fill="none"/><text x="330" y="40" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Neck 2</text><line x1="240" y1="108" x2="214" y2="52" stroke="#2f3a2b" stroke-width="2" fill="none"/><text x="200" y="48" font-size="15" fill="#b5473a" text-anchor="middle" font-weight="bold">Lung</text><text x="200" y="292" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Air reaches into the hollow wing bones (80%)</text></svg>
