<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bars of how strong the evidence is that each thing changes deer movement. Strong: dawn and dusk light, snow and cold. Good: hunting pressure, the November rut. Weak: wind and rain, barometer. Moon phase: GPS studies found no effect.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">What moves deer? Evidence strength</text><text x="150" y="64" font-size="14" fill="#23261f" text-anchor="end">Dawn and dusk light</text><rect x="158" y="50" width="200" height="20" rx="4" fill="#ece6da"/><rect x="158" y="50" width="170" height="20" rx="4" fill="#e8590c"/><text x="150" y="98" font-size="14" fill="#23261f" text-anchor="end">Snow and cold</text><rect x="158" y="84" width="200" height="20" rx="4" fill="#ece6da"/><rect x="158" y="84" width="170" height="20" rx="4" fill="#e8590c"/><text x="150" y="132" font-size="14" fill="#23261f" text-anchor="end">Hunting pressure</text><rect x="158" y="118" width="200" height="20" rx="4" fill="#ece6da"/><rect x="158" y="118" width="140" height="20" rx="4" fill="#8b5a2b"/><text x="150" y="166" font-size="14" fill="#23261f" text-anchor="end">Rut (Nov)</text><rect x="158" y="152" width="200" height="20" rx="4" fill="#ece6da"/><rect x="158" y="152" width="150" height="20" rx="4" fill="#8b5a2b"/><text x="150" y="200" font-size="14" fill="#23261f" text-anchor="end">Wind, rain</text><rect x="158" y="186" width="200" height="20" rx="4" fill="#ece6da"/><rect x="158" y="186" width="100" height="20" rx="4" fill="#8a9a6b"/><text x="150" y="234" font-size="14" fill="#23261f" text-anchor="end">Barometer</text><rect x="158" y="220" width="200" height="20" rx="4" fill="#ece6da"/><rect x="158" y="220" width="80" height="20" rx="4" fill="#8a9a6b"/><text x="150" y="268" font-size="14" fill="#23261f" text-anchor="end">Moon phase</text><rect x="158" y="254" width="200" height="20" rx="4" fill="#ece6da"/><rect x="158" y="254" width="50" height="20" rx="4" fill="#b9b0a0"/><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Moon: GPS studies found no effect (70%)</text>
</svg>
