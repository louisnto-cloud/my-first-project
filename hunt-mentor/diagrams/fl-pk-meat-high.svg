<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-label="A pack frame with a meat bag strapped high and close, between the frame and the pack bag, with straps cinched tight.">
  <rect x="0" y="0" width="400" height="290" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Meat: high and tight</text>
<rect x="150" y="60" width="16" height="210" rx="4" fill="#23261f"/><rect x="234" y="60" width="16" height="210" rx="4" fill="#23261f"/><rect x="150" y="250" width="100" height="12" rx="3" fill="#23261f"/>
<rect x="160" y="76" width="80" height="90" rx="14" fill="#f2e6c9" stroke="#8b5a2b" stroke-width="3"/><text x="200" y="126" font-family="sans-serif" font-size="18" font-weight="bold" fill="#8b5a2b" text-anchor="middle">Meat</text>
<rect x="164" y="172" width="72" height="74" rx="12" fill="#2f3a2b"/><text x="200" y="214" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Bag</text>
<line x1="146" y1="84" x2="254" y2="84" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/>
<line x1="146" y1="150" x2="254" y2="150" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/>
<text x="318" y="100" font-family="sans-serif" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">High</text><text x="318" y="124" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">and close</text>
<text x="318" y="170" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Straps</text><text x="318" y="190" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">cinched</text>
<text x="80" y="120" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Frame</text><line x1="104" y1="116" x2="146" y2="116" stroke="#23261f" stroke-width="3" stroke-linecap="round"/><polygon points="146.0,116.0 138.8,119.5 138.8,112.5" fill="#23261f"/>
</svg>
