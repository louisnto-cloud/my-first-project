<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A shotgun shell cut in half: brass head with primer, powder, wad that seals the gas and cups the shot, the shot pellets, and the folded crimp that holds it all in.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Inside a shotgun shell</text>
