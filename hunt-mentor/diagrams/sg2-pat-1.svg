<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Patterning step 1: hang a sheet about 1.2 m (4 ft) square on a safe backstop and mark an aim point in the centre.">
<rect width="400" height="300" fill="#EEF1EA"/>
<circle cx="24" cy="22" r="15" fill="#1F3D2B"/><text x="24" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="46" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Big sheet, aim mark</text>
<rect x="120" y="56" width="170" height="170" fill="#ffffff" stroke="#1F3D2B" stroke-width="2"/>
<circle cx="205.0" cy="141.0" r="7" fill="#FF6A13"/>
<rect x="102.2" y="235.0" width="205.6" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="205.0" y="252.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">about 1.2 m (4 ft) square</text>
<line x1="100.3" y1="146.0" x2="198.0" y2="141.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="198.0" cy="141.0" r="3" fill="#1F3D2B"/><rect x="19.7" y="123.0" width="80.6" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="60.0" y="140.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">aim mark</text>
<text x="200.0" y="290.0" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Safe backstop behind it.</text>
</svg>
