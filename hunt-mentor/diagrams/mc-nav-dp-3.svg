<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Phone drill step 3: walk about 1 kilometre out in airplane mode, screen dim, phone in a warm pocket, checking every 15 minutes.">
