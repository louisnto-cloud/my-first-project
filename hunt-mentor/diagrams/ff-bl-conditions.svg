<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of drop at 300 m with a 100 m zero: sea level at 15 C, 48 cm; at 1,200 m elevation, about 45 cm; at minus 10 C with slower powder, about 52 cm; from a 20 inch barrel, about 52 cm. Inside 250 m the changes are only 1 to 3 cm. Your own group beats any table.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cold, altitude, barrel: change at 300 m</text><text x="134" y="75.6" font-size="14" fill="#23261f" text-anchor="end">Sea level, 15 C</text><rect x="140" y="56" width="152.0" height="28" rx="3" fill="#e8590c" stroke="none" stroke-width="2"/><text x="298.0" y="75.6" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">48 cm</text><text x="134" y="117.6" font-size="14" fill="#23261f" text-anchor="end">1,200 m up</text><rect x="140" y="98" width="143.76666666666668" height="28" rx="3" fill="#2f6e3b" stroke="none" stroke-width="2"/><text x="289.76666666666665" y="117.6" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">45 cm</text><text x="134" y="159.6" font-size="14" fill="#23261f" text-anchor="end">Minus 10 C</text><rect x="140" y="140" width="164.66666666666666" height="28" rx="3" fill="#4a7fb0" stroke="none" stroke-width="2"/><text x="310.66666666666663" y="159.6" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">52 cm</text><text x="134" y="201.6" font-size="14" fill="#23261f" text-anchor="end">20 inch barrel</text><rect x="140" y="182" width="165.61666666666667" height="28" rx="3" fill="#b3261e" stroke="none" stroke-width="2"/><text x="311.6166666666667" y="201.6" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">52 cm</text><text x="200" y="236" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Inside 250 m: about 1 to 3 cm.</text><text x="200.0" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle">Your own 200 m group beats any table</text>
</svg>
