<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four panels of goose food. Spring: new grass shoots and sedges. Summer: grass, sedges and water plants. Fall: waste grain in stubble, pasture and berries. Winter: grass and winter cereal crops; snow geese dig roots in marshes. Almost all plants, eaten in flocks, 80 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">What geese eat, by season</text><rect x="15" y="40" width="180" height="108" rx="10" fill="#a5d6a7"/><text x="105" y="68" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Spring</text><text x="105" y="98" font-size="14" fill="#23261f" text-anchor="middle">New grass shoots,</text><text x="105" y="118" font-size="14" fill="#23261f" text-anchor="middle">sedges (80%)</text><rect x="205" y="40" width="180" height="108" rx="10" fill="#81c784"/><text x="295" y="68" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Summer</text><text x="295" y="98" font-size="14" fill="#23261f" text-anchor="middle">Grass, sedges,</text><text x="295" y="118" font-size="14" fill="#23261f" text-anchor="middle">water plants (80%)</text><rect x="15" y="158" width="180" height="108" rx="10" fill="#d9c48f"/><text x="105" y="186" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fall</text><text x="105" y="216" font-size="14" fill="#23261f" text-anchor="middle">Waste grain, stubble,</text><text x="105" y="236" font-size="14" fill="#23261f" text-anchor="middle">pasture, berries (80%)</text><rect x="205" y="158" width="180" height="108" rx="10" fill="#cfd8dc"/><text x="295" y="186" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Winter</text><text x="295" y="216" font-size="14" fill="#23261f" text-anchor="middle">Grass, winter cereal;</text><text x="295" y="236" font-size="14" fill="#23261f" text-anchor="middle">snow geese dig roots (80%)</text><text x="200" y="288" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Almost all plants; feed in flocks (80%)</text>
</svg>
