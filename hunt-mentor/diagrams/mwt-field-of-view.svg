<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Top view of a deer with its field of view. Green covers about 310 degrees around it: it sees to the sides and almost behind without turning its head. A narrow orange wedge in front is where both eyes overlap and judge depth. A small brown wedge straight behind is the blind spot." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">What a deer sees from one spot</text><path d="M200 160 L249.9 266.9 A 118 118 0 1 0 150.1 266.9 Z" fill="#8a9a6b" opacity=".45"/><path d="M200 160 L150.1 53.1 A 118 118 0 0 1 249.9 53.1 Z" fill="#e8590c" opacity=".35"/><path d="M200 160 L249.9 266.9 A 118 118 0 0 1 150.1 266.9 Z" fill="#c9b79c"/><g transform="translate(200 160)"><ellipse rx="10" ry="24" fill="#8b5a2b"/><ellipse cy="-26" rx="8" ry="12" fill="#8b5a2b"/><circle cx="-7" cy="-26" r="2.5" fill="#23261f"/><circle cx="7" cy="-26" r="2.5" fill="#23261f"/></g><text x="200" y="64" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Both eyes: depth</text><text x="70" y="150" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Side vision</text><text x="330" y="150" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Side vision</text><text x="200" y="268" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Blind behind</text><text x="200" y="294" font-size="14" fill="#6b4f35" text-anchor="middle">About 310 degrees without moving the head.</text>
</svg>
