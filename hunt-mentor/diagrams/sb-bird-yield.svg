<rect x="8" y="342" width="384" height="52" rx="8" fill="#f4eedf"/>
<text x="20" y="363" font-size="16" fill="#2f3a2b">Dusky grouse: about twice a ruffed grouse</text>
<text x="20" y="384" font-size="16" fill="#2f3a2b">Teal: one serving</text>
</svg>
