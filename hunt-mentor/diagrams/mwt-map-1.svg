<text x="200" y="22" font-size="16" fill="#23261f" text-anchor="middle" font-weight="bold">1. Turn on: white tails by month</text><rect x="0" y="34" width="400" height="266" fill="#eef0e2"/><path d="M0 220 C 80 200 140 240 210 210 S 330 170 400 190" fill="none" stroke="#4a7fb0" stroke-width="8"/><path d="M0 120 L400 100" stroke="#9e9e9e" stroke-width="5"/><rect x="60" y="160" width="70" height="40" fill="#e6d48a" stroke="#6b4f35" stroke-width="1"/><rect x="230" y="130" width="80" height="40" fill="#e6d48a" stroke="#6b4f35" stroke-width="1"/><rect x="150" y="240" width="60" height="30" fill="#e6d48a" stroke="#6b4f35" stroke-width="1"/><path d="M0 60 Q 100 40 200 70 T 400 50" fill="none" stroke="#b5a98a" stroke-width="1.5"/><path d="M0 80 Q 100 60 200 90 T 400 70" fill="none" stroke="#b5a98a" stroke-width="1.5"/><path d="M0 150 C 80 140 160 190 230 170 S 340 140 400 150 L400 260 C 300 250 200 290 100 270 L0 260 Z" fill="#8b5a2b" opacity=".3"/><rect x="20" y="44" width="220" height="30" rx="15.0" fill="#8b5a2b"/><text x="130.0" y="63.9" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Pick the month: October</text><text x="200" y="294" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Shaded: valley bottoms where they tend to be.</text>
