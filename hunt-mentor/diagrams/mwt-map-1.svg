<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Map sketch with the Hunt Map layer White tailed deer by month turned on for October: a brown band shades the valley bottom along the river and fields." font-family="sans-serif">
