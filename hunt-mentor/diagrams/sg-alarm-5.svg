<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 5, escape. A mule deer stots: it bounces on all 4 feet at once, good for steep broken ground, and often stops to look back from about 150 to 300 m. A white tail flags its tail up and gallops to cover.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="30" font-size="20" font-weight="bold" fill="#2f3a2b" text-anchor="middle">5. Escape</text>
<rect x="0" y="210" width="400" height="90" fill="#dfe6d3"/>
<g><g transform="translate(10 40) scale(0.55)"><rect x="150" y="190" width="9" height="62" fill="#8b5a2b"/><rect x="168" y="190" width="9" height="60" fill="#8b5a2b"/><rect x="240" y="190" width="9" height="62" fill="#8b5a2b"/><rect x="226" y="190" width="9" height="62" fill="#8b5a2b"/><ellipse cx="200" cy="175" rx="62" ry="28" fill="#8b5a2b"/><path d="M140 165 q-12 -2 -14 10 q8 2 14 -2 Z" fill="#fff"/><polygon points="238,160 268,95 288,100 262,178" fill="#8b5a2b"/><ellipse cx="290" cy="96" rx="22" ry="11" transform="rotate(20 290 96)" fill="#8b5a2b"/><ellipse cx="270" cy="74" rx="6" ry="15" transform="rotate(-20 270 74)" fill="#8b5a2b"/><ellipse cx="284" cy="72" rx="6" ry="15" transform="rotate(15 284 72)" fill="#8b5a2b"/><circle cx="288" cy="92" r="2.5" fill="#2f3a2b"/><circle cx="309" cy="104" r="3" fill="#2f3a2b"/></g><animateTransform attributeName="transform" type="translate" values="0 0;0 -30;0 0" dur="0.8s" repeatCount="indefinite"/></g>
<path d="M60 205 q30 -50 60 0 q30 -50 60 0" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
<g transform="translate(200 60) scale(0.55)"><rect x="150" y="190" width="9" height="62" fill="#8b5a2b"/><rect x="168" y="190" width="9" height="60" fill="#8b5a2b"/><rect x="240" y="190" width="9" height="62" fill="#8b5a2b"/><rect x="226" y="190" width="9" height="62" fill="#8b5a2b"/><ellipse cx="200" cy="175" rx="62" ry="28" fill="#8b5a2b"/><path d="M140 165 q-12 -2 -14 10 q8 2 14 -2 Z" fill="#fff"/><polygon points="238,160 268,95 288,100 262,178" fill="#8b5a2b"/><ellipse cx="290" cy="96" rx="22" ry="11" transform="rotate(20 290 96)" fill="#8b5a2b"/><ellipse cx="270" cy="74" rx="6" ry="15" transform="rotate(-20 270 74)" fill="#8b5a2b"/><ellipse cx="284" cy="72" rx="6" ry="15" transform="rotate(15 284 72)" fill="#8b5a2b"/><circle cx="288" cy="92" r="2.5" fill="#2f3a2b"/><circle cx="309" cy="104" r="3" fill="#2f3a2b"/></g>
<path d="M280 150 q-18 -26 -8 -40 q12 10 14 38 Z" fill="#fff" stroke="#8b5a2b" stroke-width="2"/>
<text x="100" y="240" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Mule deer: stot</text>
<text x="100" y="262" font-size="14" fill="#2f3a2b" text-anchor="middle">all 4 feet bounce</text>
<text x="100" y="280" font-size="14" fill="#2f3a2b" text-anchor="middle">may stop, look back</text>
<text x="300" y="240" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">White tail: flag</text>
<text x="300" y="262" font-size="14" fill="#2f3a2b" text-anchor="middle">tail up, gallops</text>
<text x="300" y="280" font-size="14" fill="#2f3a2b" text-anchor="middle">to cover</text>
</svg>
