<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" font-family="sans-serif" role="img" aria-label="Top view of a moose head with eyes set on the sides, giving a wide view all around and a small blind spot straight behind. Moose pick up motion but see still shapes poorly.">
<rect x="0" y="0" width="400" height="310" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Eyes on the side of the head</text><circle cx="200" cy="170" r="110" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><path d="M200 170 L200 60 A110 110 0 1 1 199 60 Z" fill="#c9d6b0"/><path d="M200 170 L186 282 A110 110 0 0 0 214 282 Z" fill="#fffaf0" stroke="#23261f" stroke-width="1.5"/><ellipse cx="200" cy="170" rx="18" ry="30" fill="#3b2a1c"/><circle cx="184" cy="160" r="4" fill="#eee"/><circle cx="216" cy="160" r="4" fill="#eee"/><path d="M190 140 L200 120 L210 140 Z" fill="#3b2a1c"/><text x="300" y="120" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">wide side view</text><text x="200" y="300" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">small blind spot behind</text><text x="8" y="46" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Motion: yes</text><text x="392" y="46" font-size="15" fill="#e8590c" text-anchor="end" font-weight="bold">Still shapes: poor</text>
</svg>
