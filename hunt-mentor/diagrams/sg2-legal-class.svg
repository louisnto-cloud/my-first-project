<rect x="98.7" y="140.0" width="202.6" height="24.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="200.0" y="158.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">Under 457 mm barrel or</text>
<rect x="108.8" y="168.0" width="182.4" height="24.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="200.0" y="186.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">under 660 mm overall</text>
<rect x="106.0" y="201.0" width="188.0" height="25.0" rx="5" fill="#ffffff" stroke="#FF6A13" stroke-width="1.3"/><text x="200.0" y="220.0" font-size="16" font-weight="bold" fill="#FF6A13" text-anchor="middle">= prohibited firearm</text>
<text x="200.0" y="252.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Semi auto, barrel under 470 mm: restricted</text>
