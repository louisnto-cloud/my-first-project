<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Do not cut or change a shotgun. A rifle or shotgun cut to under 660 millimetres overall, or with a barrel under 457 millimetres, becomes a prohibited firearm. A semi auto with a barrel under 470 millimetres is restricted. Criminal Code section 84.">
