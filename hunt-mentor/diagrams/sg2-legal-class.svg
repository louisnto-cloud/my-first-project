"300" y="27" width="10" height="9" rx="1.5" fill="#a7aeb3" stroke="#17201A" stroke-width="0.7"/><rect x="112" y="41" width="4" height="6" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/></g>
