<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 206" font-family="sans-serif" role="img" aria-label="Elk numbers from the 2022 provincial estimates. Region 3 Thompson: about 300 to 500, increasing. Region 8 Okanagan: about 2,500 to 3,500, stable to increasing. Near Heffley Creek elk are rare.">
<rect x="0" y="0" width="400" height="206" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">How many elk? 2022 estimates</text><text x="8" y="78.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Region 3 Thompson</text><rect x="150" y="56" width="15.1" height="34" rx="4" fill="#e8590c"/><rect x="165.1" y="56" width="10.1" height="34" rx="4" fill="#e8590c" opacity=".45"/><text x="180.20833333333334" y="78.0" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">300 to 500, rising</text><text x="8" y="136.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Region 8 Okanagan</text><rect x="150" y="114" width="126.0" height="34" rx="4" fill="#8b5a2b"/><rect x="276.0" y="114" width="50.4" height="34" rx="4" fill="#8b5a2b" opacity=".45"/><text x="321.45833333333337" y="136.0" font-size="14" font-weight="bold" fill="#fff" text-anchor="end">2,500 to 3,500</text><text x="200" y="194" font-size="14" fill="#6b4f35" text-anchor="middle">Near Heffley Creek: rare. Okanagan: common.</text>
</svg>
