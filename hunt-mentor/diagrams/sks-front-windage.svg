<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Windage on the SKS: the front sight drum, in orange, drifts sideways in its base. Moving the front sight left makes the rifle hit right. It needs a sight tool; a gunsmith job if you have none.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Zero left and right</text>
<rect x="110.0" y="150.0" width="180.0" height="50.0" rx="4" fill="#59625C" stroke="#17201A" stroke-width="2"/><rect x="170.0" y="110.0" width="60.0" height="40.0" rx="3" fill="#FF6A13" stroke="#17201A" stroke-width="2"/><rect x="194.0" y="70.0" width="12.0" height="42.0" rx="0" fill="#3A403C" stroke="#17201A" stroke-width="1.5"/><line x1="160.0" y1="128.0" x2="116.0" y2="128.0" stroke="#1F3D2B" stroke-width="4" stroke-linecap="round"/><polygon points="110.0,128.0 120.8,122.8 120.8,133.2" fill="#1F3D2B" stroke="#1F3D2B" stroke-width="1" stroke-linejoin="round"/><text x="70.0" y="70.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Sight LEFT</text><text x="70.0" y="90.0" font-size="14" font-weight="bold" fill="#2E7D4F" text-anchor="middle">= hits RIGHT</text><text x="200.0" y="232.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">The front sight drum drifts sideways.</text><text x="200.0" y="252.0" font-size="14" fill="#17201A" text-anchor="middle">Needs a sight tool. A gunsmith job</text><text x="200.0" y="272.0" font-size="14" fill="#17201A" text-anchor="middle">if you have no tool.</text>
</svg>
