<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four packs, four trips. Start near 20 to 30 kilograms a trip, a tip; a load that blocks your view or balance is too heavy. A deer yields about 48 percent of its field dressed weight as boneless meat.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Many trips, light loads</text><rect x="30" y="90" width="70" height="100" rx="10" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><rect x="40" y="70" width="50" height="24" rx="6" fill="#6b4f35"/><text x="65" y="146" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">trip 1</text><rect x="120" y="90" width="70" height="100" rx="10" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><rect x="130" y="70" width="50" height="24" rx="6" fill="#6b4f35"/><text x="155" y="146" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">trip 2</text><rect x="210" y="90" width="70" height="100" rx="10" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><rect x="220" y="70" width="50" height="24" rx="6" fill="#6b4f35"/><text x="245" y="146" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">trip 3</text><rect x="300" y="90" width="70" height="100" rx="10" fill="#f4efe2" stroke="#23261f" stroke-width="2"/><rect x="310" y="70" width="50" height="24" rx="6" fill="#6b4f35"/><text x="335" y="146" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">trip 4</text><text x="200" y="222" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Start near 20 to 30 kg a trip (Tip)</text><text x="200" y="246" font-size="14" fill="#23261f" text-anchor="middle">Blocks your view or balance? Too heavy (70%)</text><text x="200" y="284" font-size="14" fill="#6b4f35" text-anchor="middle">Deer: about 48% of field dressed weight is meat (70 to 80%)</text>
</svg>
