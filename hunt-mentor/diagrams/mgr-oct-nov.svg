<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Two panels. Early October: young birds on edges eating clover, berries and grit; leaves are still up, so shots are short and fast. Late November: snow lets you read tracks, birds sit in conifers eating buds and needles, and with the leaves down you can see far." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">October vs late November</text>
<rect x="10" y="40" width="185" height="250" rx="8" fill="#fbf1dc" stroke="#8a9a6b" stroke-width="2"/>
<rect x="205" y="40" width="185" height="250" rx="8" fill="#eef3f7" stroke="#4a7fb0" stroke-width="2"/>
<text x="102" y="64" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">Early October</text>
<text x="298" y="64" font-size="16" fill="#4a7fb0" text-anchor="middle" font-weight="bold">Late November</text>
<rect x="57" y="128" width="6" height="34" fill="#d8d2c4" stroke="#6b4f35" stroke-width="1"/><ellipse cx="60" cy="114" rx="21" ry="24" fill="#e9c46a"/>
<rect x="137" y="133" width="6" height="29" fill="#d8d2c4" stroke="#6b4f35" stroke-width="1"/><ellipse cx="140" cy="121" rx="18" ry="21" fill="#e9a03a"/>
<rect x="10" y="160" width="185" height="10" fill="#c9b79c"/>
<g transform="translate(100 150) scale(0.5 0.5)"><polygon points="-20,-6 -38,-20 -48,-12 -52,0 -48,8 -20,8" fill="#6b4f35"/><path d="M-40 -18 Q-50 -10 -48 6" fill="none" stroke="#23261f" stroke-width="3"/><ellipse cx="0" cy="0" rx="26" ry="15" fill="#9a6b45"/><circle cx="21" cy="-14" r="8" fill="#9a6b45"/><polygon points="16,-20 20,-28 25,-20" fill="#9a6b45"/><polygon points="28,-16 35,-13 28,-10" fill="#6b4f35"/><circle cx="23" cy="-16" r="1.8" fill="#23261f"/><path d="M2 13 l-2 11 M10 13 l2 11" stroke="#6b4f35" stroke-width="2.5" fill="none"/></g>
<text x="20" y="196" font-size="14" fill="#23261f" text-anchor="start">Young birds on edges</text>
<text x="20" y="214" font-size="14" fill="#23261f" text-anchor="start">Clover, berries, grit</text>
<text x="20" y="232" font-size="14" fill="#23261f" text-anchor="start">Leaves still up:</text>
<text x="20" y="250" font-size="14" fill="#23261f" text-anchor="start">short, fast shots</text>
<polygon points="250,80 214.0,160 286.0,160" fill="#2f3a2b"/><rect x="247" y="160" width="6" height="12" fill="#6b4f35"/>
<polygon points="330,70 289.5,160 370.5,160" fill="#2f3a2b"/><rect x="327" y="160" width="6" height="14" fill="#6b4f35"/>
<rect x="205" y="160" width="185" height="10" fill="#ffffff" stroke="#b9c6d3"/>
<g transform="translate(300 108) scale(0.45 0.45)"><polygon points="-22,-4 -50,-10 -50,4 -22,7" fill="#23261f"/><ellipse cx="0" cy="0" rx="26" ry="15" fill="#5d6670"/><circle cx="21" cy="-14" r="8" fill="#5d6670"/><polygon points="28,-16 35,-13 28,-10" fill="#6b4f35"/><circle cx="23" cy="-16" r="1.8" fill="#23261f"/><path d="M2 13 l-2 11 M10 13 l2 11" stroke="#6b4f35" stroke-width="2.5" fill="none"/></g>
<text x="215" y="196" font-size="14" fill="#23261f" text-anchor="start">Snow: read tracks</text>
<text x="215" y="214" font-size="14" fill="#23261f" text-anchor="start">Birds in conifers</text>
<text x="215" y="232" font-size="14" fill="#23261f" text-anchor="start">Buds and needles</text>
<text x="215" y="250" font-size="14" fill="#23261f" text-anchor="start">Leaves down: see far</text>
</svg>
