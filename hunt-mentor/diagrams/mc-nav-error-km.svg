<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of how far off you are after walking 1 kilometre with a compass error: 1 degree 17 metres, 5 degrees 87, 10 degrees 176, 15 degrees 268, 30 degrees 577. 15 degrees is forgetting declination; 30 is setting it west instead of east. Maths, 98 percent.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Miss distance after 1 km</text><text x="130" y="71.6" font-size="15" fill="#23261f" text-anchor="end">1° off</text><rect x="140" y="52.136" width="5.59792027729636" height="28.928" rx="3" fill="#8a9a6b"/><text x="151.59792027729637" y="71.6" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">17 m</text><text x="130" y="116.80000000000001" font-size="15" fill="#23261f" text-anchor="end">5° off</text><rect x="140" y="97.336" width="28.648180242634314" height="28.928" rx="3" fill="#8a9a6b"/><text x="174.6481802426343" y="116.80000000000001" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">87 m</text><text x="130" y="162.0" font-size="15" fill="#23261f" text-anchor="end">10° off</text><rect x="140" y="142.536" width="57.954939341421145" height="28.928" rx="3" fill="#8a9a6b"/><text x="203.95493934142115" y="162.0" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">176 m</text><text x="130" y="207.20000000000002" font-size="15" fill="#23261f" text-anchor="end">15° off</text><rect x="140" y="187.73600000000002" width="88.24956672443675" height="28.928" rx="3" fill="#e8590c"/><text x="234.24956672443676" y="207.20000000000002" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">268 m</text><text x="130" y="252.4" font-size="15" fill="#23261f" text-anchor="end">30° off</text><rect x="140" y="232.936" width="190.0" height="28.928" rx="3" fill="#e8590c"/><text x="336.0" y="252.4" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">577 m</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">15°: forgot declination. 30°: set it west (98%)</text>
</svg>
