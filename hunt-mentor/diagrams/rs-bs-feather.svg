<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Feather ends. Plucked by a bird of prey: the quill is whole, pulled out clean. Bitten by a mammal: the shaft is cut or blunt, the vanes may be wet or stuck together. A field rule, not proof, because scavengers mix the sign.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Plucked or bitten?</text>
<rect x="16" y="62" width="180" height="200" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="106" y="88" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Plucked</text><g transform="translate(106 150) rotate(-20)"><path d="M0 -50 Q18 -20 10 30 L-10 30 Q-18 -20 0 -50 Z" fill="#9aa3ad"/><line x1="0" y1="-50" x2="0" y2="52" stroke="#5a5a5a" stroke-width="2"/><circle cx="0" cy="52" r="3" fill="#5a5a5a"/></g><text x="106" y="232" font-size="14" fill="#23261f" text-anchor="middle">whole quill</text><text x="106" y="252" font-size="13" fill="#6b4f35" text-anchor="middle">bird of prey (60%)</text><rect x="204" y="62" width="180" height="200" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="294" y="88" font-size="17" font-weight="bold" fill="#c62828" text-anchor="middle">Bitten</text><g transform="translate(294 150) rotate(-20)"><path d="M0 -50 Q18 -20 10 30 L-10 30 Q-18 -20 0 -50 Z" fill="#9aa3ad"/><line x1="0" y1="-50" x2="0" y2="52" stroke="#5a5a5a" stroke-width="2"/><path d="M-10 30 l4 -6 l4 6 l4 -6 l4 6 l4 -6" stroke="#5a5a5a" stroke-width="2" fill="#9aa3ad"/></g><text x="294" y="232" font-size="14" fill="#23261f" text-anchor="middle">cut, blunt, wet</text><text x="294" y="252" font-size="13" fill="#6b4f35" text-anchor="middle">mammal (60%)</text><text x="200" y="290" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Field rule, not proof: scavengers mix the sign</text>
</svg>
