<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart from a Georgia trail camera study of scrapes: 85 percent of buck visits and 75 percent of doe visits were at night. About 31 visits per scrape per season, only about 5 in daylight.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Who visits scrapes, and when</text>
<text x="200" y="50" font-size="14" fill="#6b4f35" text-anchor="middle">University of Georgia camera study (65%)</text>
<text x="20" y="80" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Buck visits at night</text><rect x="20" y="90" width="360" height="26" rx="6" fill="#dfe6d3"/><rect x="20" y="90" width="306.0" height="26" rx="6" fill="#2f3a2b"/><text x="318.0" y="109" font-size="15" font-weight="bold" fill="#fff" text-anchor="end">85%</text><text x="20" y="146" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Doe visits at night</text><rect x="20" y="156" width="360" height="26" rx="6" fill="#dfe6d3"/><rect x="20" y="156" width="270.0" height="26" rx="6" fill="#2f3a2b"/><text x="282.0" y="175" font-size="15" font-weight="bold" fill="#fff" text-anchor="end">75%</text><rect x="20" y="214" width="360" height="76" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="200" y="240" font-size="14" fill="#23261f" text-anchor="middle">About 31 visits per scrape per season,</text><text x="200" y="260" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">only about 5 in daylight (65%)</text><text x="200" y="280" font-size="14" fill="#6b4f35" text-anchor="middle">Georgia camera study</text>
</svg>
