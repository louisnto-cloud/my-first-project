<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Memory hooks. L W S S G: length, width, stride, straddle, group. Floor, not the rim. Faster equals longer and narrower: stride grows, straddle shrinks.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Memory hooks</text>
<rect x="20" y="60" width="360" height="70" rx="10" fill="#dfe6d3"/><text x="200" y="90" font-size="24" font-weight="bold" fill="#e8590c" text-anchor="middle">L W S S G</text><text x="200" y="116" font-size="14" fill="#23261f" text-anchor="middle">Length, Width, Stride, Straddle, Group</text><rect x="20" y="142" width="360" height="66" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="200" y="168" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Floor, not the rim</text><text x="200" y="192" font-size="14" fill="#23261f" text-anchor="middle">Mud and snow lie about size</text><rect x="20" y="220" width="360" height="66" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="200" y="246" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Faster = longer and narrower</text><text x="200" y="270" font-size="14" fill="#23261f" text-anchor="middle">Stride grows, straddle shrinks</text>
</svg>
