<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 368" font-family="sans-serif" role="img" aria-label="A ladder of five steps: days at or below 0 C add up, snow covers fields, shallow water ices over, food is locked away, dabbling ducks move south or to open water. Missouri study 1995 to 2005: a cumulative weather severity index best explained duck numbers, 75 percent.">
