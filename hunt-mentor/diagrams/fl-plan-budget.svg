<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Budget in three buckets. Once: rifle, scope, boots, pack, optics. Each season: licences, ammo, range fees, gear wear. Each trip: fuel, food, camp, meat processing.">
