<g transform="translate(100 186)"><rect x="-30" y="-10" width="60" height="20" rx="10" fill="#9a958a" stroke="#23261f"/><path d="M14,-10 h6 a10 10 0 0 1 0 20 h-6 Z" fill="#111"/></g>
<g transform="translate(300 186)"><rect x="-30" y="-10" width="60" height="20" rx="10" fill="#ffffff" stroke="#23261f"/><path d="M-30,0 a10 10 0 0 1 10,-10 h40 a10 10 0 0 1 10,10 Z" fill="#c8a070"/><path d="M14,-10 h6 a10 10 0 0 1 10,10 h-16 Z" fill="#111"/></g>
<text x="100" y="214" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Tail tip black all round</text>
<text x="300" y="214" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Black on top, white under</text>
<text x="100" y="236" font-size="14" fill="#23261f" text-anchor="middle">Long ear tufts, huge</text>
<text x="100" y="254" font-size="14" fill="#23261f" text-anchor="middle">paws, grey, few marks</text>
<text x="300" y="236" font-size="14" fill="#23261f" text-anchor="middle">Spots, bars on legs,</text>
<text x="300" y="254" font-size="14" fill="#23261f" text-anchor="middle">short ear tufts</text>
<text x="200" y="292" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Different rules and licences. Know which one (70%).</text>
</svg>
