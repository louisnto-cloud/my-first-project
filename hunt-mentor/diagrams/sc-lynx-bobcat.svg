<g transform="translate(310 124) scale(1.0)"><path d="M-24,4 L-24,24 M-12,6 L-12,24 M18,6 L18,24 M28,4 L28,24" stroke="#c8a070" stroke-width="8" stroke-linecap="round"/><ellipse cx="-24" cy="26" rx="4" ry="4" fill="#c8a070" stroke="#23261f"/><ellipse cx="-12" cy="26" rx="4" ry="4" fill="#c8a070" stroke="#23261f"/><ellipse cx="18" cy="26" rx="4" ry="4" fill="#c8a070" stroke="#23261f"/><ellipse cx="28" cy="26" rx="4" ry="4" fill="#c8a070" stroke="#23261f"/><ellipse cx="0" cy="-6" rx="36" ry="15" fill="#c8a070" stroke="#23261f" stroke-width="1.2"/><path d="M34,-14 C42,-18 46,-20 48,-24" fill="none" stroke="#c8a070" stroke-width="8" stroke-linecap="round"/><circle cx="-40" cy="-16" r="13" fill="#c8a070" stroke="#23261f" stroke-width="1.2"/><path d="M-48,-26 L-48,-36 L-40,-28 Z M-36,-28 L-32,-38 L-28,-26 Z" fill="#c8a070" stroke="#23261f"/><path d="M-48,-36 L-48,-42 M-32,-38 L-31,-44" stroke="#23261f" stroke-width="2.5"/><circle cx="-46" cy="-18" r="2" fill="#23261f"/><circle cx="-14" cy="-12" r="2.2" fill="#5c3b1c"/><circle cx="-2" cy="-4" r="2.2" fill="#5c3b1c"/><circle cx="10" cy="-12" r="2.2" fill="#5c3b1c"/><circle cx="20" cy="-2" r="2.2" fill="#5c3b1c"/><circle cx="-20" cy="0" r="2.2" fill="#5c3b1c"/><circle cx="4" cy="-16" r="2.2" fill="#5c3b1c"/><circle cx="24" cy="-12" r="2.2" fill="#5c3b1c"/><path d="M-28,12 h8 M-28,18 h8 M-16,14 h8 M-16,20 h8" stroke="#23261f" stroke-width="2"/></g>
