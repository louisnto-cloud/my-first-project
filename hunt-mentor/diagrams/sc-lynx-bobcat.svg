<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Lynx or bobcat. Lynx: long ear tufts, huge furry paws, long legs, grey coat with few markings, short tail with a fully black tip. Bobcat: smaller, spotted tan coat, black bars on the front legs, short ear tufts, tail black on top only with a white underside. 70 percent. They have different rules and licences." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Lynx or bobcat?</text>
<text x="100" y="56" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Lynx</text>
<text x="300" y="56" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Bobcat</text>
