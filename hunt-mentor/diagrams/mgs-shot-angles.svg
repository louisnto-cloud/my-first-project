bold" fill="#23261f" text-anchor="middle">Crossing</text><text x="200" y="246" font-size="14" fill="#23261f" text-anchor="middle">Swing, lead it</text><rect x="268" y="40" width="120" height="215" rx="10" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(338 90) scale(0.4 0.4)"><ellipse cx="0" cy="0" rx="20" ry="7" fill="#2f3a2b"/><path d="M16 -2 L36 -4 L36 1 L16 3Z" fill="#2f3a2b"/><ellipse cx="40" cy="-2" rx="6" ry="4" fill="#2f3a2b"/><path d="M45 -3 L51 -1 L45 1Z" fill="#2f3a2b"/><path d="M-8 -3 L6 -30 L12 -3Z" fill="#2f3a2b"/><path d="M-20 0 L-28 -3 L-28 3Z" fill="#2f3a2b"/></g><text x="328" y="140" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">over 35 m</text><path fill="none" d="M317.0 185.0 l22 22 M339.0 185.0 l-22 22" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/><text x="328" y="226" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Going away</text><text x="328" y="246" font-size="14" fill="#23261f" text-anchor="middle">Let it go</text><text x="200" y="268" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">All three: Tip, from goose guides</text><text x="200" y="290" font-size="14" fill="#2f3a2b" text-anchor="middle">Pattern: 60 pellets in a 76 cm circle (65%)</text>
