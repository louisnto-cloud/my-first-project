<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three panels. Decoying goose with feet down, facing you: aim at the head and neck, a Tip. Crossing goose: swing through it and lead it, a Tip. Going away high, over 35 metres: let it go, a Tip. Your pattern should still put 60 pellets in a 76 centimetre circle, 65 percent.">
