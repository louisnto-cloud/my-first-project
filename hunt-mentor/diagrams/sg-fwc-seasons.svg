<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 529" font-family="sans-serif" role="img" aria-label="Region 3 deer through the fall, on a sketch of a hill with a timbered north slope and an open south slope. 1, September to mid October: still high. Food: green forbs, shrub leaves, last berries. Water: seeps, springs and ponds matter now. Cover: shade in north slope timber. 2, mid October to November: food is shrub twigs, rose hips, hay and new grass, and Douglas fir needles start. Cover: thermal cover in mature Douglas fir. 3, December and snow: food is Douglas fir, shrubs and blown clear grass. Snow pushes deer down to south and west facing winter range, often below about 760 m north of Kamloops.">
