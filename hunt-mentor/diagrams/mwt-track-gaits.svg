otate(90) scale(0.75)"><path d="M-1.5 -13 C -7 -8 -7 6 -5 9 L -1.5 9 Z" fill="#23261f"/><path d="M1.5 -13 C 7 -8 7 6 5 9 L 1.5 9 Z" fill="#23261f"/></g><g transform="translate(120 146) rotate(90) scale(0.75)"><path d="M-1.5 -13 C -7 -8 -7 6 -5 9 L -1.5 9 Z" fill="#23261f"/><path d="M1.5 -13 C 7 -8 7 6 5 9 L 1.5 9 Z" fill="#23261f"/></g><g transform="translate(200 132) rotate(90) scale(0.75)"><path d="M-1.5 -13 C -7 -8 -7 6 -5 9 L -1.5 9 Z" fill="#23261f"/><path d="M1.5 -13 C 7 -8 7 6 5 9 L 1.5 9 Z" fill="#23261f"/></g><g transform="translate(280 146) rotate(90) scale(0.75)"><path d="M-1.5 -13 C -7 -8 -7 6 -5 9 L -1.5 9 Z" fill="#23261f"/><path d="M1.5 -13 C 7 -8 7 6 5 9 L 1.5 9 Z" fill="#23261f"/></g><g transform="translate(360 132) rotate(90) scale(0.75)"><path d="M-1.5 -13 C -7 -8 -7 6 -5 9 L -1.5 9 Z" fill="#23261f"/><path d="M1.5 -13 C 7 -8 7 6 5 9 L 1.5 9 Z" fill="#23261f"/></g><text x="16" y="178" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Gallop</text><text x="384" y="178" font-size="14" fill="#23261f" text-anchor="end">groups of 4, hinds ahead</text><rect x="10" y="184" width="380" height="40" rx="6" fill="#dfe6d3"/><g transform="translate(40 196) rotate(90) scale(0.75)"><path d="M-1.5 -13 C -7 -8 -7 6 -5 9 L -1.5 9 Z" fill="#23261f"/><path d="M1.5 -13 C 7 -8 7 6 5 9 L 1.5 9 Z" fill="#23261f"/></g><g transform="translate(54 208) rotate(90) scale(0.75)"><path d="M-1.5 -13 C -7 -8 -7 6 -5 9 L -1.5 9 Z" fill="#23261f"/><path d="M1.5 -13 C 7 -8 7 6 5 9 L 1.5 9 Z" fill="#23261f"/></g><g transform="translate(74 198) rotate(90) scale(0.75)"><path d="M-1.5 -13 C -7 -8 -7 6 -5 9 L -1.5 9 Z" fill="#23261f"/><path d="M1.5 -13 C 7 -8 7 6 5 9 L 1.5 9 Z" fill="#23261f"/></g><g transform="translate(86 210) rotate(90) scale(0.75)"><path d="M-1.5 -13 C -7 -8 -7 6 -5 9 L -1.5 9 Z" fill="#23261f"/><path d="M1.5 -13 C 7 -8 7 6 5 9 L 1.5 9 Z" fill="#23261f"/></g><g transform="translate(240 196) rotate(90) scale(0.75)"><path d="M-1.5 -13 C -7 -8 -7 6 -5 