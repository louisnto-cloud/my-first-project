<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Four track patterns read left to right. Walk: prints alternate in a line and the hind foot lands in the front print. Trot: the same line with longer spacing. Gallop: groups of 4 prints with the hind feet landing ahead of the front feet, groups far apart. Mule deer stot: tight groups of 4 with all feet together." font-family="sans-serif">
