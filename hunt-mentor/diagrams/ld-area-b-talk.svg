<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 562" font-family="sans-serif" role="img" aria-label="Cards for Area B hunter talk, leads not facts. MU means Management Unit. Roberts Bank, the Ladner Marsh: early season and snow goose spot, busy at the start and on weekends, tidal, 65 percent. Pitt Marsh: some of the best duck hunting and the hardest public marsh, boat and blinds, 65 percent. Chilliwack River valley: forum, 50 percent, land status and road limits VERIFY. Harrison Lake west side: deer in cutblocks, forum 50 percent. Stave Lake area, MU 2-8: occasional blue grouse 50 percent, elk released in the watershed 65 percent. Scuzzy Creek rec site near Boston Bar: closed until further notice, 90 percent.">
