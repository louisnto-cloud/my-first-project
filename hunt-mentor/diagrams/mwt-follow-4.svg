<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="From the last marked sign, the tracker searches in growing circles." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="16" fill="#23261f" text-anchor="middle" font-weight="bold">4. Lost it? Small loops from last sign</text><rect x="0" y="34" width="400" height="266" fill="#eef0e2"/><circle cx="200" cy="170" r="6" fill="#9b2c1c"/><rect x="196" y="150" width="8" height="18" fill="#e8590c"/><circle cx="200" cy="170" r="30" fill="none" stroke="#2f3a2b" stroke-width="2" stroke-dasharray="6 5"/><circle cx="200" cy="170" r="60" fill="none" stroke="#2f3a2b" stroke-width="2" stroke-dasharray="6 5"/><circle cx="200" cy="170" r="90" fill="none" stroke="#2f3a2b" stroke-width="2" stroke-dasharray="6 5"/><text x="330" y="70" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Then call a</text><text x="330" y="88" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">partner or dog</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle" font-weight="bold">Grow the circles slowly. Check thick cover and water.</text>
</svg>
