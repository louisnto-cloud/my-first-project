<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="sans-serif" role="img" aria-label="Mandatory Hunter Report in three steps. One: you bought an elk, moose or caribou licence. Two: report by 31 March, hunted or not, success or not. Three: file in WILD online, at a FrontCounter BC office in person, or by mail on the official form. Miss it: an offence, and no licence or LEH (Limited Entry Hunting) application next season until you file.">
  <rect width="400" height="420" fill="#fffaf0"/>
  <text x="200" y="28" font-size="20" fill="#23261f" text-anchor="middle" font-weight="bold">Mandatory Hunter Report</text>
  <path d="M30 70 V292" stroke="#8a9a6b" stroke-width="3" stroke-dasharray="5 5"/>
  <g data-tip="Who must report|Everyone who buys an elk, moose or caribou species licence (99%, synopsis page 16). Elk is new in this edition (99%).">
    <rect x="10" y="44" width="380" height="72" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
    <circle cx="30" cy="70" r="14" fill="#2f3a2b"/><text x="30" y="76" font-size="16" fill="#fffaf0" text-anchor="middle" font-weight="bold">1</text>
    <rect x="58" y="58" width="56" height="40" rx="5" fill="#f2ecdd" stroke="#2f3a2b" stroke-width="2"/>
    <path d="M66 70 H92 M66 80 H106 M66 90 H100" stroke="#2f3a2b" stroke-width="2"/>
    <text x="128" y="74" font-size="16" fill="#23261f" font-weight="bold">Bought an elk, moose</text>
    <text x="128" y="96" font-size="16" fill="#23261f" font-weight="bold">or caribou licence?</text>
  </g>
  <g data-tip="By 31 March|Hunt or no hunt, success or not (99%). It does not replace compulsory inspection or compulsory reporting (99%).">
    <rect x="10" y="126" width="380" height="72" rx="10" fill="#fff4ec" stroke="#e8590c" stroke-width="2.5"/>
    <circle cx="30" cy="152" r="14" fill="#e8590c"/><text x="30" y="158" font-size="16" fill="#fffaf0" text-anchor="middle" font-weight="bold">2</text>
    <rect x="58" y="138" width="56" height="50" rx="6" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/>
    <rect x="58" y="138" width="56" height="16" rx="6" fill="#c92a2a"/><rect x="58" y="148" width="56" height="6" fill="#c92a2a"/>
    <text x="86" y="151" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">MAR</text>
    <text x="86" y="181" font-size="20" fill="#23261f" text-anchor="middle" font-weight="bold">31</text>
    <text x="128" y="156" font-size="17" fill="#c2410c" font-weight="bold">Report by 31 March</text>
    <text x="128" y="180" font-size="15" fill="#23261f">hunted or not, success or not</text>
  </g>
  <circle cx="30" cy="226" r="14" fill="#5c7a3a"/><text x="30" y="232" font-size="16" fill="#fffaf0" text-anchor="middle" font-weight="bold">3</text>
  <text x="54" y="232" font-size="16" fill="#23261f" font-weight="bold">Pick one way:</text>
  <g data-tip="WILD|Electronically in WILD, from the licence on your FWID (Fish and Wildlife ID) profile (99%).">
    <rect x="10" y="246" width="120" height="62" rx="10" fill="#5c7a3a"/>
    <text x="70" y="272" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">WILD</text>
    <text x="70" y="294" font-size="14" fill="#ffffff" text-anchor="middle">online</text>
  </g>
  <g data-tip="FrontCounter BC|In person at any FrontCounter BC office (99%).">
    <rect x="140" y="246" width="120" height="62" rx="10" fill="#5c7a3a"/>
    <text x="200" y="272" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">FrontCounter</text>
    <text x="200" y="294" font-size="14" fill="#ffffff" text-anchor="middle">in person</text>
  </g>
  <g data-tip="Mail|By mail on the official form to Mandatory Hunter Reporting, PO Box 9374 Stn Prov Gov, Victoria BC V8W 9M4 (99%).">
    <rect x="270" y="246" width="120" height="62" rx="10" fill="#5c7a3a"/>
    <text x="330" y="272" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">Mail</text>
    <text x="330" y="294" font-size="14" fill="#ffffff" text-anchor="middle">official form</text>
  </g>
  <g data-tip="Miss it|You commit an offence, and you cannot buy a licence or apply for LEH (Limited Entry Hunting) next season until you file (99%).">
    <rect x="10" y="322" width="380" height="88" rx="10" fill="#fdecea" stroke="#c92a2a" stroke-width="2"/>
    <path d="M36 344 L54 376 H18z" fill="#c92a2a"/><text x="36" y="371" font-size="16" fill="#fffaf0" text-anchor="middle" font-weight="bold">!</text>
    <text x="70" y="350" font-size="16" fill="#c92a2a" font-weight="bold">Miss it: an offence.</text>
    <text x="70" y="372" font-size="15" fill="#c92a2a">No licence or LEH application</text>
    <text x="70" y="394" font-size="15" fill="#c92a2a">next season until you file.</text>
  </g>
</svg>
