146" r="8" fill="#1d1d1b"/><path d="M314 140 q -4 -26.0 -2.0 -52" stroke="#d8d0c0" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="331" cy="152" r="8" fill="#1d1d1b"/><path d="M331 146 q -4 -26.0 -2.0 -52" stroke="#d8d0c0" stroke-width="4" fill="none" stroke-linecap="round"/><text x="103" y="222" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Short, curved</text><text x="103" y="242" font-size="14" fill="#23261f" text-anchor="middle">rarely over 3.8 cm</text><text x="297" y="222" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Long, straighter</text><text x="297" y="242" font-size="14" fill="#e8590c" text-anchor="middle">for digging</text><text x="200" y="288" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Curved claws climb trees. Straight claws dig.</text>
