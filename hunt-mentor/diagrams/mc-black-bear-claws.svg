<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Front paws compared. Black bear: short, strongly curved claws, rarely over about 3.8 cm (1.5 inches), built for climbing trees. Grizzly: long, straighter claws built for digging. Claws are visible only up close or in tracks.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
