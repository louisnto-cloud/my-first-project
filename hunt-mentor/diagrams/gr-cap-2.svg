  <rect x="0" y="150" width="400" height="150" fill="#4a7fb0" opacity=".35"/>
  <path d="M0 150 q 25 -8 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0" fill="none" stroke="#4a7fb0" stroke-width="3"/>
