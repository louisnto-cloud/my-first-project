<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Two ways to place a foot. Heel first: quiet trails and normal still hunting pace. Outside edge of the ball first: crunchy ground and the last 100 metres of a stalk. In both, weight stays back until the foot is quiet.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="32" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Two ways to place a foot</text><rect x="20" y="50" width="175" height="190" rx="10" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><rect x="205" y="50" width="175" height="190" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><g transform="translate(110 150) rotate(10) scale(0.8)"><path d="M-40 0 C -40 -14, -20 -22, 0 -22 L 30 -18 C 46 -16, 50 -4, 46 0 Z" fill="#2f3a2b"/><rect x="-36" y="-60" width="20" height="44" rx="6" fill="#2f3a2b"/></g><circle cx="80" cy="150" r="8" fill="#e8590c" stroke="none" stroke-width="2"/><text x="108" y="80" font-family="sans-serif" font-size="16" fill="#8a9a6b" text-anchor="middle" font-weight="bold">Heel first</text><text x="30" y="200" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">Quiet trail, normal</text><text x="30" y="218" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">still hunting pace</text><g transform="translate(295 150) rotate(-10) scale(0.8)"><path d="M-40 0 C -40 -14, -20 -22, 0 -22 L 30 -18 C 46 -16, 50 -4, 46 0 Z" fill="#2f3a2b"/><rect x="-36" y="-60" width="20" height="44" rx="6" fill="#2f3a2b"/></g><circle cx="325" cy="150" r="8" fill="#e8590c" stroke="none" stroke-width="2"/><text x="293" y="80" font-family="sans-serif" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">Edge first</text><text x="215" y="200" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">Crunchy ground, the</text><text x="215" y="218" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">last 100 m of a stalk</text><text x="20" y="275" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Both: weight stays back until the foot is quiet (Tip).</text>
</svg>
