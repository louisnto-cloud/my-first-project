<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 446" font-family="sans-serif" role="img" aria-label="Decision chart: can I hunt near this winter range? 1, if the season is closed for this animal, class and MU today, do not hunt. 2, if inside a No Shooting or closed area, do not shoot. 3, if private, reserve or Wildlife Management Area land, get permission or call the regional office first. 4, if a motor vehicle closure applies, park and walk in. Otherwise hunt it on foot, quietly, then leave.">
