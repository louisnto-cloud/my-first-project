<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Legend of the Hunt Map land colours: private land orange, park green, First Nations reserve yellow, WMA teal, town limits red dashed edge, no hunting red stripes, vehicle closure purple dashed, MU line thin black, LEH zone dark brown dashed. Crown land is left almost clear.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="30" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Land colours (Hunt Map)</text><rect x="20" y="50" width="44" height="32" rx="4" fill="#ff8f00" fill-opacity="0.45" stroke="#d84315" stroke-width="3"/><text x="72" y="71" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Private land</text><rect x="20" y="98" width="44" height="32" rx="4" fill="#2e7d32" fill-opacity="0.45" stroke="#1b5e20" stroke-width="3"/><text x="72" y="119" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Park</text><rect x="20" y="146" width="44" height="32" rx="4" fill="#ffeb3b" fill-opacity="0.45" stroke="#d4a000" stroke-width="3"/><text x="72" y="167" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">First Nations reserve</text><rect x="20" y="194" width="44" height="32" rx="4" fill="#26a69a" fill-opacity="0.45" stroke="#00695c" stroke-width="3"/><text x="72" y="215" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">WMA</text><rect x="20" y="242" width="44" height="32" rx="4" fill="#e53935" fill-opacity="0.45" stroke="#c62828" stroke-width="3" stroke-dasharray="3 2"/><text x="72" y="263" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Town limits</text><rect x="215" y="50" width="44" height="32" rx="4" fill="#d32f2f" fill-opacity="0.45" stroke="#b71c1c" stroke-width="3"/><line x1="215" y1="82" x2="227" y2="50" stroke="#d32f2f" stroke-width="2" stroke-linecap="round"/><line x1="223" y1="82" x2="235" y2="50" stroke="#d32f2f" stroke-width="2" stroke-linecap="round"/><line x1="231" y1="82" x2="243" y2="50" stroke="#d32f2f" stroke-width="2" stroke-linecap="round"/><line x1="239" y1="82" x2="251" y2="50" stroke="#d32f2f" stroke-width="2" stroke-linecap="round"/><line x1="247" y1="82" x2="259" y2="50" stroke="#d32f2f" stroke-width="2" stroke-linecap="round"/><line x1="255" y1="82" x2="259" y2="50" stroke="#d32f2f" stroke-width="2" stroke-linecap="round"/><text x="267" y="71" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">No hunting</text><rect x="215" y="98" width="44" height="32" rx="4" fill="#7b1fa2" fill-opacity="0.45" stroke="#6a1b9a" stroke-width="3" stroke-dasharray="5 3"/><text x="267" y="119" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Vehicle closure</text><rect x="215" y="146" width="44" height="32" rx="4" fill="#ffffff" fill-opacity="0" stroke="#1b1b1b" stroke-width="3"/><text x="267" y="167" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">MU line</text><rect x="215" y="194" width="44" height="32" rx="4" fill="#ffffff" fill-opacity="0" stroke="#3e2723" stroke-width="3" stroke-dasharray="6 3"/><text x="267" y="215" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">LEH zone</text><text x="20" y="295" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="start">Crown land has no colour: map shows through.</text>
</svg>
