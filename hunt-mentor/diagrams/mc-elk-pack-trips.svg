<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Pack out planning, Tip. A bull gives about 75 to 99 kg of boneless meat. At about 25 kg a trip that is 4 loads alone, more with the bones in, or 2 each for two hunters plus gear. 20 to 30 kg a trip is sustainable for a fit adult.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">How many trips? (Tip)</text><text x="200" y="64" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Boneless bull: about 75 to 99 kg</text><rect x="40" y="90" width="70" height="100" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="1.5"/><rect x="55" y="110" width="40" height="50" rx="6" fill="#8b5a2b"/><text x="75" y="178" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">25 kg</text><rect x="124" y="90" width="70" height="100" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="1.5"/><rect x="139" y="110" width="40" height="50" rx="6" fill="#8b5a2b"/><text x="159" y="178" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">25 kg</text><rect x="208" y="90" width="70" height="100" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="1.5"/><rect x="223" y="110" width="40" height="50" rx="6" fill="#8b5a2b"/><text x="243" y="178" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">25 kg</text><rect x="292" y="90" width="70" height="100" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="1.5"/><rect x="307" y="110" width="40" height="50" rx="6" fill="#8b5a2b"/><text x="327" y="178" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">25 kg</text><text x="200" y="222" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Alone: 4 loads boned, more bone in</text><text x="200" y="244" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">With your brother: 2 each, plus gear</text><text x="200" y="270" font-size="14" fill="#6b4f35" text-anchor="middle">20 to 30 kg a trip is sustainable (Tip)</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Packing out session; Wyoming yields (85%)</text>
</svg>
