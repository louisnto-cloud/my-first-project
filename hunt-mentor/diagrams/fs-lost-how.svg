<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="How hunters get lost: chasing a wounded animal, darkness falling fast, fog or snow hiding landmarks, head down following a track, a shortcut back to the truck, never looking back so the trail looks new on the way out. Most start small: stop early.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">How hunters get lost</text><rect x="20" y="50" width="112" height="80" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="76" y="84" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Chasing</text><text x="76" y="106" font-size="14" fill="#2f3a2b" text-anchor="middle">wounded game</text><rect x="145" y="50" width="112" height="80" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="201" y="84" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Dark</text><text x="201" y="106" font-size="14" fill="#2f3a2b" text-anchor="middle">falls fast</text><rect x="270" y="50" width="112" height="80" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="326" y="84" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fog or snow</text><text x="326" y="106" font-size="14" fill="#2f3a2b" text-anchor="middle">hides landmarks</text><rect x="20" y="145" width="112" height="80" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="76" y="179" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Head down</text><text x="76" y="201" font-size="14" fill="#2f3a2b" text-anchor="middle">on a track</text><rect x="145" y="145" width="112" height="80" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="201" y="179" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Shortcut</text><text x="201" y="201" font-size="14" fill="#2f3a2b" text-anchor="middle">back to truck</text><rect x="270" y="145" width="112" height="80" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="326" y="179" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">No look back</text><text x="326" y="201" font-size="14" fill="#2f3a2b" text-anchor="middle">trail looks new</text><rect x="63" y="256" width="274" height="30" rx="6" fill="#2f3a2b"/><text x="200" y="277" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Most start small. Stop early</text>
</svg>
