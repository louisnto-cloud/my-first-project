<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A hunter in the open holds up a phone with a clear line to a satellite low in the sky, between two hills. Satellite SOS needs a clear view of the sky and horizon.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="36" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Satellite SOS needs open sky</text><circle cx="330" cy="70" r="10" fill="#4a7fb0" stroke="none" stroke-width="2"/><line x1="320" y1="70" x2="340" y2="70" stroke="#4a7fb0" stroke-width="6" stroke-linecap="round"/><text x="250" y="100" font-family="sans-serif" font-size="14" fill="#4a7fb0" text-anchor="start">satellite</text><g transform="translate(140 240) scale(0.9)"><circle cx="0" cy="-30" r="7" fill="#2f3a2b"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" fill="none"/></g><g transform="translate(168 205) scale(0.5)"><rect x="-22" y="-40" width="44" height="80" rx="7" fill="#2f3a2b" stroke="none" stroke-width="0"/><rect x="-18" y="-33" width="36" height="62" rx="3" fill="#cfe3f3" stroke="none" stroke-width="0"/></g><line x1="170" y1="190" x2="325" y2="80" stroke="#4a7fb0" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M0 270 L80 210 L120 270 Z" fill="#c9d3b8" stroke="#8a9a6b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M260 270 L330 200 L400 270 Z" fill="#c9d3b8" stroke="#8a9a6b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="20" y="295" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Clear view of sky and horizon (95%)</text>
</svg>
