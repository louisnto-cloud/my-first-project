<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" font-family="sans-serif" role="img" aria-label="Hunting with a dog. Left, a dog walking on a leash: on a leash for deer, elk, moose, mountain sheep, mountain goat and caribou. Right, a dog running free after a flushed grouse: off leash is fine for small game and game birds, lynx, bobcat, black bear and cougar. Training on game birds under supervision runs 1 August to 30 April.">
