<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of bullet drop below the crosshair for a .308 with 150 grain bullets and a 100 metre zero, from the Hunt Mentor model of Federal data: 4 centimetres at 150 metres, 13 at 200, 28 at 250, 48 at 300. A dashed line at 11 centimetres marks half of a 20 to 25 centimetre deer vital zone: aim at the centre and any drop past it leaves the vitals unless you hold over.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Your .308 drop, 100 m zero (75%)</text><line x1="40" y1="70" x2="380" y2="70" stroke="#23261f" stroke-width="2"/><text x="40" y="62" font-size="14" fill="#23261f" text-anchor="start">crosshair</text><rect x="70" y="70" width="50" height="14.4" rx="4" fill="#8a9a6b"/><text x="95" y="102.4" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">4 cm</text><text x="95" y="286" font-size="14" fill="#23261f" text-anchor="middle">150 m</text><rect x="154" y="70" width="50" height="46.800000000000004" rx="4" fill="#8a9a6b"/><text x="179" y="134.8" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">13 cm</text><text x="179" y="286" font-size="14" fill="#23261f" text-anchor="middle">200 m</text><rect x="238" y="70" width="50" height="100.8" rx="4" fill="#e8590c"/><text x="263" y="188.8" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">28 cm</text><text x="263" y="286" font-size="14" fill="#23261f" text-anchor="middle">250 m</text><rect x="322" y="70" width="50" height="172.8" rx="4" fill="#e8590c"/><text x="347" y="260.8" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">48 cm</text><text x="347" y="286" font-size="14" fill="#23261f" text-anchor="middle">300 m</text><line x1="40" y1="109.6" x2="390" y2="109.6" stroke="#4a7fb0" stroke-width="2" stroke-dasharray="6 5"/><text x="390" y="60" font-size="14" fill="#4a7fb0" text-anchor="end" font-weight="bold">dashed: 11 cm, half the vitals</text>
</svg>
