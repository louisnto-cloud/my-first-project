<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Method picker by date for Region 8 elk. 1 to 9 September, bow only: calling, wallows and water. 10 September to early October, rifle in the rut: listen, call and glass. Mid October to 20 October, late rut: glass and still hunt the timber. Any day with high pressure: go far from roads. Dates from the Rule Book page 68; methods are Tips.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Pick a method by the calendar</text><rect x="10" y="44" width="140" height="46" rx="8" fill="#2f3a2b"/><text x="80" y="64" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Sept 1 to 9</text><text x="80" y="82" font-size="14" fill="#fffaf0" text-anchor="middle">Bow only (R8)</text><rect x="156" y="44" width="234" height="46" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="273" y="73" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Calling, wallows, water</text><rect x="10" y="100" width="140" height="46" rx="8" fill="#2f3a2b"/><text x="80" y="120" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Sept 10 to early Oct</text><text x="80" y="138" font-size="14" fill="#fffaf0" text-anchor="middle">Rifle, rut</text><rect x="156" y="100" width="234" height="46" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="273" y="129" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Listen, call, glass</text><rect x="10" y="156" width="140" height="46" rx="8" fill="#2f3a2b"/><text x="80" y="176" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Mid Oct to 20 Oct</text><text x="80" y="194" font-size="14" fill="#fffaf0" text-anchor="middle">Rifle, late rut</text><rect x="156" y="156" width="234" height="46" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="273" y="185" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Glass, still hunt timber</text><rect x="10" y="212" width="140" height="46" rx="8" fill="#8b5a2b"/><text x="80" y="232" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Any day</text><text x="80" y="250" font-size="14" fill="#fffaf0" text-anchor="middle">Pressure high</text><rect x="156" y="212" width="234" height="46" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="273" y="241" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Go far from roads</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Region 8 dates: page 68 (99%). Methods: Tip</text>
</svg>
