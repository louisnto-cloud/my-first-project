<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A curve of night vision rising over 30 minutes in the dark, most of it by 20 to 30 minutes. A bright white light drops it back to zero in seconds.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="32" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Eyes need 20 to 30 min in the dark</text><line x1="50" y1="250" x2="370" y2="250" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><line x1="50" y1="250" x2="50" y2="60" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><path d="M50 240 C 90 200, 110 190, 140 185 C 180 180, 200 120, 250 90 C 290 72, 330 68, 370 66" fill="none" stroke="#8a9a6b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="50" y="272" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">0</text><text x="150" y="272" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">10</text><text x="250" y="272" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">20</text><text x="350" y="272" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">30 min</text><text x="58" y="80" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Night</text><text x="58" y="96" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">vision</text><line x1="300" y1="150" x2="266.4" y2="102.3" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="262.0,96.0 263.4,108.5 273.3,101.5" fill="#e8590c"/><text x="270" y="170" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">White light: back</text><text x="270" y="188" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">to zero in seconds</text>
</svg>
