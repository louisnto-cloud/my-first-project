<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Memory hooks: 50 m zero, flat from 15 to 55 m. Grouse yes; quail no, deer no. Head only, or upper neck. Earth behind, never water or rock. A .22 can carry over 1 km.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Memory hooks</text><rect x="20" y="50" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="75" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">50 m zero</text><text x="170" y="75" font-size="15" fill="#23261f" text-anchor="start">flat from 15 to 55 m</text><rect x="20" y="96" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="121" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Grouse yes</text><text x="170" y="121" font-size="15" fill="#23261f" text-anchor="start">quail no, deer no</text><rect x="20" y="142" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="167" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Head only</text><text x="170" y="167" font-size="15" fill="#23261f" text-anchor="start">or upper neck</text><rect x="20" y="188" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="213" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Earth behind</text><text x="170" y="213" font-size="15" fill="#23261f" text-anchor="start">never water or rock</text><rect x="20" y="234" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="259" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="start">Over 1 km</text><text x="170" y="259" font-size="15" fill="#23261f" text-anchor="start">a .22 can carry</text>
</svg>
