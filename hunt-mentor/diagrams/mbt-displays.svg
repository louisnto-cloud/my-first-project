<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 342" font-family="sans-serif" role="img" aria-label="Buck behaviour before and in the rut. 1 circles a rival with deliberate, stiff steps. 2 back arched, head low, tail flicking. 3 thrashes bushes with the antlers. 4 young bucks spar: bonding, not fighting. 5 in the rut, equal bucks fight head to head.">
<rect width="400" height="342" fill="#EEF1EA"/>
<text x="200" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Read a buck before the rut</text>
<rect x="14" y="46" width="372" height="46" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="2"/><circle cx="38" cy="69" r="13" fill="#1F3D2B" stroke="none"/><text x="38" y="74" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text><text x="62" y="66" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Circles a rival</text><text x="62" y="85" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">deliberate, stiff steps</text><rect x="14" y="100" width="372" height="46" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="2"/><circle cx="38" cy="123" r="13" fill="#1F3D2B" stroke="none"/><text x="38" y="128" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text><text x="62" y="120" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Back arched, head low</text><text x="62" y="139" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">tail flicking</text><rect x="14" y="154" width="372" height="46" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="2"/><circle cx="38" cy="177" r="13" fill="#1F3D2B" stroke="none"/><text x="38" y="182" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text><text x="62" y="174" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Thrashes bushes</text><text x="62" y="193" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">with the antlers</text><rect x="14" y="208" width="372" height="46" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><circle cx="38" cy="231" r="13" fill="#8a9a6b" stroke="none"/><text x="38" y="236" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text><text x="62" y="228" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Young bucks spar</text><text x="62" y="247" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">bonding, not fighting</text><rect x="14" y="262" width="372" height="46" rx="8" fill="#ffffff" stroke="#FF6A13" stroke-width="2"/><circle cx="38" cy="285" r="13" fill="#FF6A13" stroke="none"/><text x="38" y="290" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">5</text><text x="62" y="282" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Rut: equal bucks fight</text><text x="62" y="301" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">head to head</text><text x="200" y="330" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">BC deer account (90%)</text>
</svg>
