<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Memory hooks: 24 hours, clean before rust starts. Breech in, never from the muzzle. Dry, then oil, a thin film only. Cold equals dry: less oil in deep cold. Look through the bore after any fall.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Memory hooks</text><rect x="20" y="50" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="75" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">24 h</text><text x="170" y="75" font-size="15" fill="#23261f" text-anchor="start">clean before rust starts</text><rect x="20" y="96" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="121" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">Breech in</text><text x="170" y="121" font-size="15" fill="#23261f" text-anchor="start">never from the muzzle</text><rect x="20" y="142" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="167" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">Dry, then oil</text><text x="170" y="167" font-size="15" fill="#23261f" text-anchor="start">thin film only</text><rect x="20" y="188" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="213" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">Cold = dry</text><text x="170" y="213" font-size="15" fill="#23261f" text-anchor="start">less oil in deep cold</text><rect x="20" y="234" width="360" height="38" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="34" y="259" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">Look through</text><text x="170" y="259" font-size="15" fill="#23261f" text-anchor="start">after any fall</text>
</svg>
