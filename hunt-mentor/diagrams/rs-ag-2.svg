<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 2: compare edges, colour and moisture. Your print is minutes old. If theirs looks the same, theirs is fresh.">
