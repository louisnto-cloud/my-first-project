<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Labelled mule deer buck. Antlers that fork and fork again. Huge ears. A thick neck in October means a buck. A big white rump patch. A thin white rope tail with a black tip. A long leg gland on the outside of the hind leg, 10 to 15 centimetres.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Mule deer: what to look for</text><g transform="translate(200 200) scale(1.5 1.5)"><rect x="-30" y="6" width="7" height="38" rx="3.5" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><rect x="-21" y="6" width="7" height="38" rx="3.5" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><rect x="22" y="6" width="7" height="38" rx="3.5" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><rect x="31" y="6" width="7" height="38" rx="3.5" fill="#8b5a2b" stroke="#23261f" stroke-width="1.5"/><ellipse cx="0" cy="0" rx="42" ry="17" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="-37" cy="-2" rx="8" ry="11" fill="#fff" stroke="#23261f" stroke-width="1"/><path d="M-42 -6 Q-47 4 -45 14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M-45 10 L-45 16" stroke="#111" stroke-width="5" stroke-linecap="round"/><path d="M26 -10 L42 -40 L56 -36 L40 6 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="2" stroke-linejoin="round"/><ellipse cx="56" cy="-40" rx="14" ry="7" transform="rotate(18 56 -40)" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="42" cy="-50" rx="11" ry="4.5" transform="rotate(-35 42 -50)" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><circle cx="58" cy="-42" r="1.8" fill="#23261f"/><path d="M48 -46 L50 -62 M50 -62 L42 -76 M50 -62 L60 -72 M42 -76 L36 -88 M42 -76 L48 -90 M60 -72 L58 -86 M60 -72 L70 -82" stroke="#6b4f35" stroke-width="3.5" fill="none" stroke-linecap="round"/></g><line x1="282" y1="95" x2="300" y2="64" stroke="#e8590c" stroke-width="2"/><circle cx="282" cy="95" r="4" fill="#e8590c"/><text x="304" y="69" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Forks that</text><text x="304" y="87" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">fork again</text><line x1="263" y1="125" x2="300" y2="128" stroke="#e8590c" stroke-width="2"/><circle cx="263" cy="125" r="4" fill="#e8590c"/><text x="304" y="133" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Huge ears</text><line x1="254" y1="173" x2="300" y2="180" stroke="#e8590c" stroke-width="2"/><circle cx="254" cy="173" r="4" fill="#e8590c"/><text x="304" y="185" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Thick neck:</text><text x="304" y="203" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">buck</text><line x1="144" y1="197" x2="110" y2="160" stroke="#e8590c" stroke-width="2"/><circle cx="144" cy="197" r="4" fill="#e8590c"/><text x="106" y="165" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">White rump</text><line x1="132" y1="218" x2="110" y2="232" stroke="#e8590c" stroke-width="2"/><circle cx="132" cy="218" r="4" fill="#e8590c"/><text x="106" y="237" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">Thin tail,</text><text x="106" y="255" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">black tip</text><line x1="161" y1="236" x2="190" y2="284" stroke="#e8590c" stroke-width="2"/><circle cx="161" cy="236" r="4" fill="#e8590c"/><text x="194" y="289" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Leg gland 10 to 15 cm</text>
</svg>
