<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 298" font-family="sans-serif" role="img" aria-label="Snow layers beside a moose and a deer. Moose move easily in snow up to 40 centimetres, with only slight difficulty at 40 to 70 centimetres, and often winter where snow is 50 centimetres or more. Deer have trouble past about 30 centimetres.">
<rect x="0" y="0" width="400" height="298" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Long legs, deep snow</text><rect x="20" y="210" width="360" height="40" fill="#eef3f8"/><rect x="20" y="160" width="360" height="50" fill="#dde8f2"/><rect x="20" y="110" width="360" height="50" fill="#c9daea"/><g transform="translate(105 192) scale(0.95)"><rect x="-36" y="4" width="8" height="52" rx="4" fill="#9c8a76" stroke="#23261f" stroke-width="1.5"/><rect x="-26" y="4" width="8" height="52" rx="4" fill="#9c8a76" stroke="#23261f" stroke-width="1.5"/><rect x="26" y="4" width="8" height="52" rx="4" fill="#9c8a76" stroke="#23261f" stroke-width="1.5"/><rect x="36" y="4" width="8" height="52" rx="4" fill="#9c8a76" stroke="#23261f" stroke-width="1.5"/><path d="M-46 0 Q-48 -26 -20 -26 Q10 -40 34 -34 Q48 -26 44 2 Q20 22 -30 18 Q-48 16 -46 0 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="2"/><path d="M30 -30 L56 -40 L66 -26 L40 0 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="2" stroke-linejoin="round"/><path d="M56 -44 L86 -30 Q92 -22 84 -18 L64 -20 Q54 -26 56 -44 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="2" stroke-linejoin="round"/><path d="M66 -22 Q66 -6 60 -4 Q58 -12 62 -22 Z" fill="#3b2a1c" stroke="#23261f" stroke-width="2"/><ellipse cx="54" cy="-50" rx="8" ry="3.5" transform="rotate(-30 54 -50)" fill="#3b2a1c" stroke="#23261f" stroke-width="2"/><circle cx="70" cy="-34" r="1.8" fill="#eeeeee"/></g><text x="390" y="246" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">to 40 cm: easy</text><text x="390" y="196" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">40 to 70 cm: slight trouble</text><text x="390" y="146" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">often winters in 50 cm plus</text><text x="200" y="272" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Long legs: moose own deep snow</text><text x="200" y="290" font-size="14" fill="#8b5a2b" text-anchor="middle" font-weight="bold">Deer: trouble past about 30 cm</text>
</svg>
