<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A goose with no flight feathers and five long feathers lying below it: all flight feathers drop at once. Flightless for 4 to 6 weeks, June into August, 70 percent. Non breeding geese fly north to moult, late May to June, 80 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Summer moult: grounded for weeks</text><g transform="translate(150 150) scale(2)"><ellipse rx="22" ry="9" fill="#7a6a58"/><path d="M16 -2 L36 -6 L36 0 L16 3Z" fill="#2f3a2b"/><ellipse cx="40" cy="-4" rx="6" ry="4" fill="#2f3a2b"/><path d="M45 -5 L51 -3 L45 -1Z" fill="#2f3a2b"/><path d="M-8 -6 L0 -16 L8 -6Z" fill="#7a6a58"/></g><path d="M110 210 l6 40 l4 -40Z" fill="#2f3a2b" transform="rotate(-20 113 230)"/><path d="M126 210 l6 40 l4 -40Z" fill="#2f3a2b" transform="rotate(-10 129 230)"/><path d="M142 210 l6 40 l4 -40Z" fill="#2f3a2b" transform="rotate(0 145 230)"/><path d="M158 210 l6 40 l4 -40Z" fill="#2f3a2b" transform="rotate(10 161 230)"/><path d="M174 210 l6 40 l4 -40Z" fill="#2f3a2b" transform="rotate(20 177 230)"/><text x="130" y="272" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">All flight feathers drop at once</text><rect x="250" y="50" width="140" height="110" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="320.0" y="70" font-size="14" fill="#23261f" text-anchor="middle">Flightless</text><text x="320.0" y="89" font-size="14" fill="#23261f" text-anchor="middle">4 to 6 weeks</text><text x="320.0" y="108" font-size="14" fill="#23261f" text-anchor="middle">June into August</text><text x="320.0" y="127" font-size="14" fill="#23261f" text-anchor="middle">(70%)</text><rect x="250" y="170" width="140" height="110" rx="8" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><text x="320.0" y="190" font-size="14" fill="#23261f" text-anchor="middle">Non breeders</text><text x="320.0" y="209" font-size="14" fill="#23261f" text-anchor="middle">fly north to</text><text x="320.0" y="228" font-size="14" fill="#23261f" text-anchor="middle">moult: late May</text><text x="320.0" y="247" font-size="14" fill="#23261f" text-anchor="middle">to June (80%)</text>
</svg>
