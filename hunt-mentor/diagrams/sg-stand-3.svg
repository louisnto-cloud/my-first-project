<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 3: pick a spot 100 to 200 m off the line with a long view, a solid rest for the rifle, and earth behind every shooting lane, not sky.">
<rect width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="40" width="400" height="70" fill="#8a9a6b"/>
<g fill="#2f3a2b"><polygon points="30,100 42,62 54,100"/><polygon points="90,95 102,57 114,95"/><polygon points="300,100 312,62 324,100"/><polygon points="355,95 367,57 379,95"/></g>
<rect x="0" y="215" width="400" height="85" fill="#e9dfa8"/>
<text x="20" y="290" font-size="15" font-weight="bold" fill="#6b4f35">Feed</text>
<text x="160" y="62" font-size="15" font-weight="bold" fill="#fff">Bed, uphill</text>
<path d="M180 105 C 220 140, 150 180, 200 225" fill="none" stroke="#8b5a2b" stroke-width="3" stroke-dasharray="7 5"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3. Sit 100 to 200 m off it</text>
<circle cx="320" cy="150" r="11" fill="#e8590c"/><path d="M309 150 H215" stroke="#e8590c" stroke-width="3" stroke-dasharray="4 4"/><text x="265" y="140" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">100 to 200 m</text><text x="320" y="185" font-size="14" fill="#2f3a2b" text-anchor="middle">rest, view,</text><text x="320" y="202" font-size="14" fill="#2f3a2b" text-anchor="middle">earth backstop</text>
</svg>
