<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A folded map with a dashed route from the truck to a bench. A thumb rests on the route where you are now. Move it as you walk so you always know your place on the map. Orienteering habit, Tip.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Thumb the map</text><rect x="40" y="44" width="320" height="200" rx="2" fill="#f3efe0" stroke="#8b5a2b" stroke-width="2"/><path d="M70 220 C120 180 160 200 210 140 C250 100 300 110 330 70" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="220" r="6" fill="#2f3a2b"/><text x="86" y="236" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Truck</text><circle cx="330" cy="70" r="6" fill="#2f3a2b"/><text x="320" y="96" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">Bench</text><path d="M200 156 q-14 -2 -18 14 q-2 20 14 26 l26 8 q12 2 14 -10 l2 -26 q0 -14 -14 -14 Z" fill="#e9c9a8" stroke="#6b4f35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="268" font-size="15" fill="#23261f" text-anchor="middle">Thumb sits where you are. Move it as you go.</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Orienteering habit (Tip)</text>
</svg>
