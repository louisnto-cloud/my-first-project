<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="Five cards of Region 7B vehicle closures. Above 1,400 metres in 7-19, parts of 7-21 and 7-22, 7-31, 7-35, 7-36, 7-43, 7-57 and 7-58: no motor vehicles, but snowmobiles under 450 kilograms allowed 1 November to 30 April, Map H7. Onion Lake Trail in 7-21 and West Bullmoose Road are open year round. Northern Rockies snowmobile closed areas, new, maps online. Dickebush Creek and Trapper Mainline Road in 7-21: Motor Vehicle Closed Area, Map H6. 7-36 east of Aylard Creek: no all terrain vehicles for hunting 15 August to 31 October." font-family="sans-serif">
