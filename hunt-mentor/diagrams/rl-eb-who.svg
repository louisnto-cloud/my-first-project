<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 378" font-family="sans-serif" role="img" aria-label="Bar chart of elevation ranges from 0 to 2,400 metres above sea level, from BC sources. California quail mostly 250 to 750 m. Chukar 195 to 610 m in a 1962 study. Bighorn sheep winter and spring ranges 300 to 1,825 m. Mule deer winter range below about 1,500 m in shallow and moderate snow zones. Ruffed grouse most common 750 to 1,250 m. Dusky grouse often 1,500 to 2,250 m.">
