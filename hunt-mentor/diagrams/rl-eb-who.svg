<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of elevation ranges from 0 to 2,400 m. California quail mostly 250 to 750 m. Chukar 195 to 610 m in a 1962 study. Bighorn sheep winter and spring ranges 300 to 1,825 m. Mule deer winter range below about 1,500 m in shallow and moderate snow zones. Ruffed grouse most common 750 to 1,250 m. Dusky grouse often 1,500 to 2,250 m.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Who lives how high</text><text x="388" y="24" font-size="14" fill="#2f3a2b" text-anchor="end">metres above sea level</text><path d="M140 44 V250" stroke="#8a9a6b" stroke-width="1" opacity=".6"/><text x="140.0" y="266" font-size="12" fill="#2f3a2b" text-anchor="middle">0</text><path d="M223 44 V250" stroke="#8a9a6b" stroke-width="1" opacity=".6"/><text x="223.33333333333331" y="266" font-size="12" fill="#2f3a2b" text-anchor="middle">800</text><path d="M307 44 V250" stroke="#8a9a6b" stroke-width="1" opacity=".6"/><text x="306.66666666666663" y="266" font-size="12" fill="#2f3a2b" text-anchor="middle">1,600</text><path d="M390 44 V250" stroke="#8a9a6b" stroke-width="1" opacity=".6"/><text x="390.0" y="266" font-size="12" fill="#2f3a2b" text-anchor="middle">2,400</text><text x="132" y="74" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="end">California quail</text><rect x="166" y="60" width="52" height="20" rx="5" fill="#a8c83a"/><text x="132" y="106" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="end">Chukar (1962)</text><rect x="160" y="92" width="43" height="20" rx="5" fill="#f2c70c"/><text x="132" y="138" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="end">Bighorn winter</text><rect x="171" y="124" width="159" height="20" rx="5" fill="#e8590c"/><text x="132" y="170" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="end">Mule deer winter</text><rect x="171" y="156" width="125" height="20" rx="5" fill="#8b5a2b"/><text x="132" y="202" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="end">Ruffed grouse</text><rect x="218" y="188" width="52" height="20" rx="5" fill="#8a9a6b"/><text x="132" y="234" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="end">Dusky grouse</text><rect x="296" y="220" width="78" height="20" rx="5" fill="#2f6fd6"/><text x="200" y="292" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Ranges from BC sources; see More</text>
</svg>
