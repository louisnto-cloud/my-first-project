<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A side view of a slope with a 15 metre cliff. Blue dashed lines mark contour heights 1000, 1020 and 1040 metres. The cliff fits between two lines, which cross the slope far apart, so the map shows only a gentle slope.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<line x1="10" y1="240" x2="390" y2="240" stroke="#4a7fb0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><text x="12" y="235" font-family="sans-serif" font-size="13" fill="#4a7fb0" text-anchor="start">1000 m</text><line x1="10" y1="180" x2="390" y2="180" stroke="#4a7fb0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><text x="12" y="175" font-family="sans-serif" font-size="13" fill="#4a7fb0" text-anchor="start">1020 m</text><line x1="10" y1="120" x2="390" y2="120" stroke="#4a7fb0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><text x="12" y="115" font-family="sans-serif" font-size="13" fill="#4a7fb0" text-anchor="start">1040 m</text><path d="M20 215 L150 178 L156 132 L380 110" fill="none" stroke="#2f3a2b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="143" cy="180" r="6" fill="#e8590c" stroke="none" stroke-width="2"/><circle cx="278" cy="120" r="6" fill="#e8590c" stroke="none" stroke-width="2"/><text x="166" y="160" font-family="sans-serif" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">15 m cliff</text><text x="20" y="40" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">A 20 m interval can hide a cliff</text><text x="20" y="272" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Lines cross far apart (dots),</text><text x="20" y="290" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">so the map shows a gentle slope.</text>
</svg>
