<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 618" role="img" aria-label="Tiles of bag limits from the Region 7A season table. Moose 1, elk 1, bighorn sheep 1, thinhorn sheep 1, mountain goat 1, black bear 2. Wolf no bag limit. Cougar 2 in 7-2 to 7-8, 7-16 to 7-18 and 7-23, and 1 in 7-9 to 7-15, 7-24 and 7-25. Coyote no bag limit. Wolverine 1, lynx 1. Raccoon and Columbian ground squirrel no bag limit. Snowshoe hare 10 a day. Grouse and ptarmigan 10 (30). Ducks 8 (24). Canada and cackling geese, snipe and coots 10 (30). Snow, Ross&#x27;s and white fronted geese 5 (15)." font-family="sans-serif">
