<text x="200" y="46" font-size="14" fill="#6b6f66" text-anchor="middle">NBL: No Bag Limit. 10 (30): 10 a day, 30 in</text>
<text x="200" y="64" font-size="14" fill="#6b6f66" text-anchor="middle">possession.</text>
<rect x="6" y="80" width="124" height="66" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
