<circle cx="34" cy="34" r="20" fill="#e8590c"/>
<text x="34" y="41" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<text x="64" y="32" font-size="19" font-weight="bold" fill="#23261f">Ask about an export permit</text>
<circle cx="200" cy="124" r="52" fill="#dfe6d3"/>
<g transform="translate(200.0 124) scale(1.6)"><rect x="-13" y="-22" width="26" height="44" rx="5" fill="#2f3a2b"/><rect x="-9" y="-16" width="18" height="28" fill="#4a7fb0"/><circle cx="0" cy="17" r="2.5" fill="#fff"/></g>
<circle cx="252.0" cy="84" r="18" fill="#4a7fb0"/><text x="252" y="91.56" font-size="23" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
