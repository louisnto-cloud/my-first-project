<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 4: call Global Affairs Canada, 343 203 4331, and ask whether an export permit applies to a hunter taking their own rifle out temporarily. It may be required, VERIFY.">
