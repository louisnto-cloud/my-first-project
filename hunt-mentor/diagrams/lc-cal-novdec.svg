<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 292" font-family="sans-serif" role="img" aria-label="November and December. 1 November: 4 point mule deer bucks again, youth either sex white tails, LEH antlerless mule deer hunts. 15 November: cougar, bobcat and lynx open. 30 November: grouse, pheasant, partridge, black bear and Region 8 quail close. 10 December: deer buck seasons close; bow only white tails 11 to 20 December. 23 December: ducks and geese close in Region 3.">
<rect x="0" y="0" width="400" height="292" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">November and December</text><rect x="10" y="46" width="74" height="40" rx="8" fill="#8a9a6b"/><text x="47" y="72" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">1 Nov</text><text x="94" y="62" font-size="14" fill="#23261f" text-anchor="start">4 point bucks again. Youth white tails.</text><text x="94" y="79" font-size="14" fill="#23261f" text-anchor="start">LEH antlerless deer</text><rect x="10" y="94" width="74" height="40" rx="8" fill="#6b4f35"/><text x="47" y="120" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">15 Nov</text><text x="94" y="110" font-size="14" fill="#23261f" text-anchor="start">Cougar, bobcat, lynx open</text><rect x="10" y="142" width="74" height="40" rx="8" fill="#2f3a2b"/><text x="47" y="168" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">30 Nov</text><text x="94" y="158" font-size="14" fill="#23261f" text-anchor="start">Grouse, pheasant, partridge, bear,</text><text x="94" y="175" font-size="14" fill="#23261f" text-anchor="start">quail close</text><rect x="10" y="190" width="74" height="40" rx="8" fill="#e8590c"/><text x="47" y="216" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">10 Dec</text><text x="94" y="206" font-size="14" fill="#23261f" text-anchor="start">Buck seasons close. Bow white tails 11</text><text x="94" y="223" font-size="14" fill="#23261f" text-anchor="start">to 20 Dec</text><rect x="10" y="238" width="74" height="40" rx="8" fill="#4a7fb0"/><text x="47" y="264" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">23 Dec</text><text x="94" y="254" font-size="14" fill="#23261f" text-anchor="start">Ducks and geese close in Region 3</text>
</svg>
