<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Flowchart, lost: do STOP first. Are you sure of a route out before dark? Yes: move, marking your trail, back to the last point you knew. No: stay, call 911, make shelter and fire, and signal. Doubt means stay.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Lost: stay or move?</text><rect x="100" y="40" width="200" height="40" rx="8" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="66" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Do STOP first</text><line x1="200" y1="80" x2="200" y2="88" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><polygon points="200,96 205,88 195,88" fill="#2f3a2b"/><rect x="30" y="98" width="340" height="44" rx="8" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><text x="200" y="125" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Sure of a route out before dark?</text><line x1="130" y1="142" x2="100" y2="161" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/><polygon points="90,168 104,167 96,155" fill="#2e7d32"/><text x="96" y="160" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="end">yes</text><line x1="270" y1="142" x2="300" y2="161" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><polygon points="310,168 304,155 296,167" fill="#c0392b"/><text x="304" y="160" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="start">no</text><rect x="10" y="170" width="170" height="76" rx="8" fill="#eef5e6" stroke="#2e7d32" stroke-width="2"/><text x="95" y="195" font-size="14" fill="#2f3a2b" text-anchor="middle">Move, marking</text><text x="95" y="213" font-size="14" fill="#2f3a2b" text-anchor="middle">your trail. Back</text><text x="95" y="231" font-size="14" fill="#2f3a2b" text-anchor="middle">to last known point</text><rect x="220" y="170" width="170" height="76" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/><text x="305" y="195" font-size="14" fill="#2f3a2b" text-anchor="middle">STAY. Call 911.</text><text x="305" y="213" font-size="14" fill="#2f3a2b" text-anchor="middle">Shelter, fire,</text><text x="305" y="231" font-size="14" fill="#2f3a2b" text-anchor="middle">signal</text><text x="200" y="284" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Doubt means stay</text>
</svg>
