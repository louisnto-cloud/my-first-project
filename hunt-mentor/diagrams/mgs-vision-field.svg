<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Top view of a goose head and its field of view. A wide orange area covers almost all the way around: wide side views on both sides. A narrow grey blind spot sits behind the head. A darker wedge in front is seen with both eyes, wide enough to see its own bill tip. The goose sees ground and sky at once. All 90 percent, from studies of Canada goose eyes, which give no degree values in the summary.">
  <rect width="400" height="300" fill="#fffaf0"/>
<path d="M200 170 L90 250 A140 140 0 1 1 310 250 Z" fill="#fde3cf"/><path d="M200 170 L90 250 L310 250 Z" fill="#cfcfcf"/><path d="M200 170 L165 65 L235 65 Z" fill="#e8590c" opacity=".55"/><g transform="translate(200 170)"><ellipse rx="16" ry="22" fill="#2f3a2b"/><path d="M-6 -20 L0 -40 L6 -20Z" fill="#2f3a2b"/><circle cx="-14" cy="-6" r="4" fill="#fff"/><circle cx="14" cy="-6" r="4" fill="#fff"/></g><text x="200" y="52" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Both eyes: sees its bill tip (90%)</text><text x="50" y="110" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Wide side</text><text x="50" y="126" font-size="14" fill="#23261f" text-anchor="middle">view (90%)</text><text x="350" y="110" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Wide side</text><text x="350" y="126" font-size="14" fill="#23261f" text-anchor="middle">view (90%)</text><text x="200" y="272" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Narrow blind spot behind (90%)</text><text x="200" y="292" font-size="14" fill="#2f3a2b" text-anchor="middle">Sees ground and sky at once (90%)</text><rect x="0" y="0" width="400" height="30" rx="0" fill="#fffaf0"/><text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">What a goose sees (head from above)</text>
</svg>
