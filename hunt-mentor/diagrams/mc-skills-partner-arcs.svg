<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two hunters walk side by side, in sight of each other. Each has a 45 degree zone of fire straight ahead, shaded orange. The gap between them and everything behind is a no shot zone.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Two hunters: zones of fire (75%)</text><rect x="0" y="40" width="400" height="260" fill="#dfe6d3"/><path d="M120 260 L54.9 102.9 A 170 170 0 0 1 185.1 102.9 Z" fill="#f6d7c3" stroke="#e8590c" stroke-width="2"/><g transform="translate(120 284) scale(0.7)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#e8590c"/><rect x="-6" y="-15" width="5" height="15" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" fill="#2f3a2b"/></g><path d="M280 260 L214.9 102.9 A 170 170 0 0 1 345.1 102.9 Z" fill="#f6d7c3" stroke="#e8590c" stroke-width="2"/><g transform="translate(280 284) scale(0.7)"><circle cx="0" cy="-44" r="7" fill="#2f3a2b"/><rect x="-7" y="-36" width="14" height="22" rx="4" fill="#e8590c"/><rect x="-6" y="-15" width="5" height="15" fill="#2f3a2b"/><rect x="1" y="-15" width="5" height="15" fill="#2f3a2b"/></g><text x="120" y="140" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">45°</text><text x="280" y="140" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">45°</text><text x="200" y="210" font-size="16" fill="#23261f" text-anchor="middle" font-weight="bold">NO</text><text x="200" y="228" font-size="16" fill="#23261f" text-anchor="middle" font-weight="bold">SHOT</text><text x="200" y="64" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">side by side, in sight</text>
</svg>
