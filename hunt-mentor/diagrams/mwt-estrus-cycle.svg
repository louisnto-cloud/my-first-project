<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Timeline of one doe. A buck tends her for 1 to 3 days before her heat, she is in heat for about 24 hours, and he stays 2 to 3 days after. If she is not bred, she comes into heat again about 28 days later, which is why a second rut shows in December." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">One doe, one heat</text><line x1="20" y1="150" x2="380" y2="150" stroke="#23261f" stroke-width="2"/><rect x="60" y="120" width="90" height="30" rx="5" fill="#f2b48e"/><text x="105" y="112" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Buck tends</text><text x="100" y="172" font-size="14" fill="#23261f" text-anchor="middle">1 to 3 days</text><rect x="150" y="100" width="34" height="50" rx="5" fill="#e8590c"/><text x="167" y="92" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Heat 24 h</text><rect x="184" y="120" width="70" height="30" rx="5" fill="#f2b48e"/><text x="219" y="112" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Tends</text><text x="226" y="172" font-size="14" fill="#23261f" text-anchor="middle">2 to 3 days</text><path d="M184 196 C 230 250 320 250 350 196" fill="none" stroke="#2f3a2b" stroke-width="3" stroke-dasharray="6 5"/><line x1="345" y1="205" x2="352" y2="194" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/><polygon points="352.0,194.0 351.0,202.9 344.3,198.7" fill="#2f3a2b"/><text x="200" y="266" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Not bred? Heat again in about 28 days</text><rect x="340" y="110" width="30" height="40" rx="5" fill="#e8590c" opacity=".6"/><text x="200" y="294" font-size="14" fill="#6b4f35" text-anchor="middle">This is why a 2nd rut shows in December.</text>
</svg>
