<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 339" font-family="sans-serif" role="img" aria-label="A mountain goat year from May to December. Kids are born late May or early June. General open seasons run somewhere from 1 August to 30 November, depending on the region, so read your row. Region 3 draw hunts run 1 September to 30 November. The rut runs early November to early December, peaking about 15 to 20 November, 85 percent. Groups mix in the rut, so kids no longer mean nannies only.">
<rect width="400" height="339" fill="#fffaf0"/>
<text x="14" y="24" font-size="14" font-weight="bold" fill="#6b5b4b">A goat year</text>
