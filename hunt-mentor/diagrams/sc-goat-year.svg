<text x="130.2" y="46" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Jul</text>
<text x="177.2" y="46" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Aug</text>
<text x="223.5" y="46" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Sep</text>
<text x="269.8" y="46" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Oct</text>
<text x="316.2" y="46" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Nov</text>
<text x="362.5" y="46" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">Dec</text>
<text x="14" y="72" font-size="16" font-weight="bold" fill="#2f3a2b">Kids born</text>
<text x="386" y="72" font-size="15" font-weight="bold" fill="#8b5a2b" text-anchor="end">late May, early June</text>
<rect x="14.0" y="80" width="47.1" height="16" fill="#efe8d6"/>
<rect x="61.1" y="80" width="45.6" height="16" fill="#f8f3e6"/>
<rect x="106.6" y="80" width="47.1" height="16" fill="#efe8d6"/>
<rect x="153.7" y="80" width="47.1" height="16" fill="#f8f3e6"/>
<rect x="200.8" y="80" width="45.6" height="16" fill="#efe8d6"/>
<rect x="246.3" y="80" width="47.1" height="16" fill="#f8f3e6"/>
<rect x="293.4" y="80" width="45.6" height="16" fill="#efe8d6"/>
<rect x="338.9" y="80" width="47.1" height="16" fill="#f8f3e6"/>
<rect x="45.9" y="81" width="30.4" height="14" rx="3" fill="#8b5a2b"/>
