<text x="386" y="126" font-size="15" font-weight="bold" fill="#5b6b3e" text-anchor="end">Aug 1 to Nov 30</text>
<text x="14" y="146" font-size="14" fill="#6b5b4b">Varies by region. Read your row.</text>
<rect x="14.0" y="153" width="47.1" height="16" fill="#efe8d6"/>
<rect x="61.1" y="153" width="45.6" height="16" fill="#f8f3e6"/>
