<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 312" font-family="sans-serif" role="img" aria-label="BC structural stages after a cut or fire. Stages 1 and 2, sparse and herb: usually under 20 years. 3a, low shrub under 2 m: under 20 years. 3b, tall shrub 2 to 10 m: under 40 years. 4, pole and sapling: usually under 40 years. 5, young forest: 40 to 80 years. 6, mature forest: 80 to 140 or up to 250 years. 7, old forest: over 140 to 250 years depending on the zone.">
<rect width="400" height="312" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">BC forest stages after a cut or fire</text><rect x="12" y="40" width="48" height="30" rx="6" fill="#d9c78f"/><text x="36" y="61" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">1-2</text><text x="70" y="61" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Sparse, herb</text><text x="388" y="61" font-size="14" fill="#6b4f35" text-anchor="end">under 20 yrs</text><rect x="12" y="76" width="48" height="30" rx="6" fill="#b9cf8f"/><text x="36" y="97" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">3a</text><text x="70" y="97" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Low shrub, under 2 m</text><text x="388" y="97" font-size="14" fill="#6b4f35" text-anchor="end">under 20 yrs</text><rect x="12" y="112" width="48" height="30" rx="6" fill="#9fbf76"/><text x="36" y="133" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">3b</text><text x="70" y="133" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Tall shrub, 2 to 10 m</text><text x="388" y="133" font-size="14" fill="#6b4f35" text-anchor="end">under 40 yrs</text><rect x="12" y="148" width="48" height="30" rx="6" fill="#5d7a45"/><text x="36" y="169" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="70" y="169" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Pole, sapling</text><text x="388" y="169" font-size="14" fill="#6b4f35" text-anchor="end">usually under 40</text><rect x="12" y="184" width="48" height="30" rx="6" fill="#3c5a3a"/><text x="36" y="205" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><text x="70" y="205" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Young forest</text><text x="388" y="205" font-size="14" fill="#6b4f35" text-anchor="end">40 to 80 yrs</text><rect x="12" y="220" width="48" height="30" rx="6" fill="#2c4a3a"/><text x="36" y="241" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text><text x="70" y="241" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Mature forest</text><text x="388" y="241" font-size="14" fill="#6b4f35" text-anchor="end">80 to 250 yrs</text><rect x="12" y="256" width="48" height="30" rx="6" fill="#1e3328"/><text x="36" y="277" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">7</text><text x="70" y="277" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Old forest</text><text x="388" y="277" font-size="14" fill="#6b4f35" text-anchor="end">over 140 to 250</text><text x="200.0" y="304" font-size="14" fill="#6b4f35" text-anchor="middle">Typical times since disturbance (90%)</text>
</svg>
