<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 534" role="img" aria-label="Chart of Region 4 vehicle closure symbols on a July to June year. Star: Motor Vehicle Closed Area, no motor vehicle at all, year round unless dates are given. The other symbols are Motor Vehicles for Hunting Closed Areas. Snowflake: closed year round. Diamond: closed 1 April to 30 June and 1 September to 28 February. Cross: closed 1 September to 30 June. Triangle: closed 1 April to 30 June and 1 September to 30 November. Four point cross: closed 1 September to 30 November. Snowmobiles for hunting are closed in the entire Kootenay Region 1 April to 30 November." font-family="sans-serif">
