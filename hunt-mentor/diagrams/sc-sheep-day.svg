<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A ram&#x27;s day on an alpine slope, as a tip. 1: at dawn and dusk the rams feed on open grass slopes. 2: through midday they bed on a ledge or bench with a view, close to cliffs they can escape into." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A ram&#x27;s day (Tip)</text>
<path d="M0 300 L0 220 C80 200 140 140 200 120 C260 100 300 60 340 50 L400 46 L400 300 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<g fill="#9a9a90" stroke="#6b6b62"><path d="M300 64 L340 56 L346 110 L306 116 Z"/></g>
<path d="M284 118 L330 114" stroke="#8a9a6b" stroke-width="5"/>
<g fill="#8b5a2b"><ellipse cx="300" cy="111" rx="8" ry="4.5"/><ellipse cx="318" cy="109" rx="8" ry="4.5"/></g>
<g fill="#8b5a2b"><ellipse cx="120" cy="178" rx="9" ry="5"/><ellipse cx="146" cy="168" rx="9" ry="5"/><ellipse cx="170" cy="156" rx="9" ry="5"/></g>
<circle cx="60" cy="70" r="18" fill="#f2b33d"/>
<circle cx="120" cy="140" r="15" fill="#fffaf0" stroke="#e8590c" stroke-width="2.5"/><text x="120" y="146" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">1</text>
<circle cx="300" cy="140" r="15" fill="#fffaf0" stroke="#e8590c" stroke-width="2.5"/><text x="300" y="146" font-size="16" fill="#e8590c" text-anchor="middle" font-weight="bold">2</text>
<rect x="10" y="216" width="185" height="76" rx="8" fill="#f3ead8" stroke="#2f3a2b" stroke-width="2"/>
<text x="102.5" y="240.9" font-size="14" fill="#23261f" text-anchor="middle">1 Dawn and dusk:</text>
<text x="102.5" y="258.9" font-size="14" fill="#23261f" text-anchor="middle">feed on open</text>
<text x="102.5" y="276.9" font-size="14" fill="#23261f" text-anchor="middle">grass slopes</text>
<rect x="205" y="216" width="185" height="76" rx="8" fill="#f3ead8" stroke="#2f3a2b" stroke-width="2"/>
<text x="297.5" y="240.9" font-size="14" fill="#23261f" text-anchor="middle">2 Midday: bed on</text>
<text x="297.5" y="258.9" font-size="14" fill="#23261f" text-anchor="middle">a ledge with a view,</text>
<text x="297.5" y="276.9" font-size="14" fill="#23261f" text-anchor="middle">cliffs close by</text>
</svg>
