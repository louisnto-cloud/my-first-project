<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="The trigger group with the safety lever in orange in the safe position. Put the safety on first, press the catch behind the trigger guard and swing the group out. Only when needed: the hammer is under spring force; no further disassembly.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Trigger group: only if needed</text>
<rect x="100.0" y="140.0" width="195.0" height="31.2" rx="3" fill="#59625C" stroke="#17201A" stroke-width="1.5"/><path d="M139.0 171.2 L144.2 220.6 L243.0 220.6 L250.8 171.2" fill="none" stroke="#3A403C" stroke-width="7.8" stroke-linejoin="round"/><path d="M204.0 171.2 Q193.6 192.0 201.4 207.6" fill="none" stroke="#3A403C" stroke-width="6.5" stroke-linecap="round"/><line x1="162.4" y1="176.4" x2="185.8" y2="192.0" stroke="#FF6A13" stroke-width="7.800000000000001" stroke-linecap="round"/><rect x="230.0" y="106.2" width="20.8" height="36.4" rx="2" fill="#8E9690" stroke="#17201A" stroke-width="1.2"/><text x="200.0" y="64.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Safety ON first. Press the catch</text><text x="200.0" y="84.0" font-size="14" fill="#17201A" text-anchor="middle">behind the guard. Swing it out.</text><text x="200.0" y="254.0" font-size="14" font-weight="bold" fill="#B3261E" text-anchor="middle">Only when needed. Hammer under</text><text x="200.0" y="274.0" font-size="14" fill="#B3261E" text-anchor="middle">spring force. No further strip.</text>
</svg>
