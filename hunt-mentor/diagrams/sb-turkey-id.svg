<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 481" font-family="sans-serif" role="img" aria-label="Three wild turkeys, 65 to 75 percent. Tom: big and dark with a full round tail fan, a long beard on the chest, spurs, and a red, white and blue head. Hen: smaller and browner with a blue grey head and usually no beard. Jake, a 1 year old tom: short beard of 5 to 10 centimetres and a fan with longer centre feathers. Merriam&#x27;s turkeys have white tips on the fan. In spring any bird with a visible beard is legal, 98 percent.">
