<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Hunt Map terrain tool frame: Slope direction shows which way each slope faces. North facing slopes stay cold and keep snow. South facing slopes warm first and melt first. Cold morning: chukar on south slopes. Snow: birds on the bare patches. Washington Fish and Wildlife says chukar may roost on warmer south facing slopes on cold early season nights and gather where snow is thin, 75 percent.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Terrain tools: Slope direction</text>
<rect x="20" y="38" width="360" height="196" rx="8" fill="#dfe6d3"/>
<circle cx="200" cy="136" r="92" fill="#fff"/>
<path d="M200 136 L134.9 201.1 A92 92 0 0 0 265.1 201.1 Z" fill="#e8590c"/>
<path d="M200 136 L134.9 70.9 A92 92 0 0 1 265.1 70.9 Z" fill="#4a7fb0"/>
<text x="200" y="72" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">N: cold,</text><text x="200" y="90" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">snow stays</text>
<text x="200" y="194" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">S: warm,</text><text x="200" y="212" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">melts first</text>
<text x="132" y="142" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">W</text><text x="268" y="142" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">E</text>
<rect x="10" y="240" width="380" height="54" rx="8" fill="#2f3a2b"/>
<text x="200" y="262" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Cold morning: chukar on south slopes</text>
<text x="200" y="283" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Snow: birds on the bare patches (75%)</text>
</svg>
