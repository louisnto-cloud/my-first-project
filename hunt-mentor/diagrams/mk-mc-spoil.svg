<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 264" font-family="sans-serif" role="img" aria-label="What spoils meat. Heat: Cavity, hide, sun, truck. Moisture: Rain, washing, plastic. Dirt, hair: Meat on the ground. Gut contents: Cut paunch or bladder. Delay: Slow gutting, slow cooling. Stress: Animal run hard.">
<rect width="400" height="264" rx="12" fill="#EEF1EA"/>
<text x="16" y="30" font-size="18" font-weight="bold" fill="#1F3D2B">What spoils meat</text>
<text x="16" y="52" font-size="14" fill="#17201A">Every cause: 80%</text>
<g><rect x="12" y="70" width="118.66666666666667" height="83" rx="10" fill="#FFFFFF" stroke="#FF6A13" stroke-width="3.5"/><text x="71.33333333333334" y="95" font-size="17" font-weight="bold" fill="#FF6A13" text-anchor="middle">Heat</text><text x="71.33333333333334" y="117" font-size="14" fill="#17201A" text-anchor="middle">Cavity, hide,</text>
<text x="71.33333333333334" y="135" font-size="14" fill="#17201A" text-anchor="middle">sun, truck</text></g>
<g><rect x="140.66666666666669" y="70" width="118.66666666666667" height="83" rx="10" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="200.00000000000003" y="95" font-size="17" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Moisture</text><text x="200.00000000000003" y="117" font-size="14" fill="#17201A" text-anchor="middle">Rain, washing,</text>
<text x="200.00000000000003" y="135" font-size="14" fill="#17201A" text-anchor="middle">plastic</text></g>
<g><rect x="269.33333333333337" y="70" width="118.66666666666667" height="83" rx="10" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="328.6666666666667" y="95" font-size="17" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Dirt, hair</text><text x="328.6666666666667" y="117" font-size="14" fill="#17201A" text-anchor="middle">Meat on the</text>
<text x="328.6666666666667" y="135" font-size="14" fill="#17201A" text-anchor="middle">ground</text></g>
<g><rect x="12" y="163" width="118.66666666666667" height="83" rx="10" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="71.33333333333334" y="188" font-size="17" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Gut contents</text><text x="71.33333333333334" y="210" font-size="14" fill="#17201A" text-anchor="middle">Cut paunch or</text>
