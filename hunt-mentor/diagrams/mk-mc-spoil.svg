<text x="200.00000000000003" y="228" font-size="14" fill="#17201A" text-anchor="middle">slow cooling</text></g>
<g><rect x="269.33333333333337" y="163" width="118.66666666666667" height="83" rx="10" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="328.6666666666667" y="188" font-size="17" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Stress</text><text x="328.6666666666667" y="210" font-size="14" fill="#17201A" text-anchor="middle">Animal run</text>
