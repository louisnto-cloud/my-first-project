<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="You walk toward a bench. Just past it runs a road. If you reach the road, you know you overshot the bench and turn back.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#dfe6d3" stroke="none" stroke-width="2"/><line x1="0" y1="80" x2="400" y2="80" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><text x="200" y="70" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Road: catching feature</text><circle cx="200" cy="180" r="10" fill="#e8590c" stroke="none" stroke-width="2"/><text x="260" y="200" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Bench (target)</text><g transform="translate(200 290) scale(0.6)"><circle cx="0" cy="-30" r="7" fill="#2f3a2b"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" fill="none"/></g><line x1="200" y1="265" x2="200.0" y2="202.7" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><polygon points="200.0,195.0 193.9,206.0 206.1,206.0" fill="#e8590c"/><line x1="220" y1="175" x2="220.0" y2="102.7" stroke="#c92a2a" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><polygon points="220.0,95.0 213.9,106.0 226.1,106.0" fill="#c92a2a"/><text x="228" y="130" font-family="sans-serif" font-size="14" fill="#c92a2a" text-anchor="start">Hit the road?</text><text x="228" y="148" font-family="sans-serif" font-size="14" fill="#c92a2a" text-anchor="start">You went past.</text><text x="20" y="40" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">A big feature just past your target</text>
</svg>
