<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side by side: on the left the map shows a round hill and a creek below it; on the right the real view shows the same hill with the creek at its foot. Match big shapes first. Terrain association, Tip.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Match the map to the land</text><rect x="20" y="44" width="170" height="190" rx="2" fill="#f3efe0" stroke="#8b5a2b" stroke-width="2"/><ellipse cx="100" cy="120" rx="54.0" ry="36" fill="none" stroke="#8b5a2b" stroke-width="1.6"/><ellipse cx="100" cy="120" rx="36.0" ry="24" fill="none" stroke="#8b5a2b" stroke-width="1.6"/><ellipse cx="100" cy="120" rx="18.0" ry="12" fill="none" stroke="#8b5a2b" stroke-width="1.6"/><path d="M30 200 C80 180 130 205 180 190" fill="none" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="210" r="5" fill="#e8590c"/><text x="105" y="254" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Map: hill, creek</text><rect x="210" y="44" width="170" height="190" rx="4" fill="#e7eef5"/><polygon points="220,180 295.0,80 370,180" fill="#8a9a6b"/><rect x="210" y="180" width="170" height="54" rx="0" fill="#dfe6d3"/><path d="M210 210 C260 200 320 220 380 205" fill="none" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="295" y="254" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Land: same hill, creek</text><line x1="170" y1="120" x2="220.0" y2="120.0" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="230.0,120.0 220.0,115.0 220.0,125.0" fill="#e8590c"/><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Terrain association: big shapes first (Tip)</text>
</svg>
