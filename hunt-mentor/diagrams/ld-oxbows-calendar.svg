<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 284" font-family="sans-serif" role="img" aria-label="Calendar strip for the Osoyoos Oxbows, Map J1, synopsis page 69. No shooting or hunting from 1 March to 30 September. October and November are open for the quail season. Vehicles stay on the established roads all year, so hunt on foot from those roads.">
