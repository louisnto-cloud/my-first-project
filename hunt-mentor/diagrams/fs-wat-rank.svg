<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Pick the best source: best, a spring at its source; good, a fast clear creek; okay, a lake away from the shore; last, a pond, slough or cattle water. Then treat it anyway.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pick the best source</text><rect x="30" y="48" width="340" height="44" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/><text x="80" y="76" font-size="16" font-weight="bold" fill="#2e7d32" text-anchor="middle">Best</text><text x="140" y="76" font-size="15" fill="#2f3a2b" text-anchor="start">Spring at its source</text><rect x="30" y="100" width="340" height="44" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/><text x="80" y="128" font-size="16" font-weight="bold" fill="#2e7d32" text-anchor="middle">Good</text><text x="140" y="128" font-size="15" fill="#2f3a2b" text-anchor="start">Fast, clear creek</text><rect x="30" y="152" width="340" height="44" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="80" y="180" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">OK</text><text x="140" y="180" font-size="15" fill="#2f3a2b" text-anchor="start">Lake, away from shore</text><rect x="30" y="204" width="340" height="44" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="80" y="232" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Last</text><text x="140" y="232" font-size="15" fill="#2f3a2b" text-anchor="start">Pond, slough, cattle water</text><text x="200" y="285" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Then treat it anyway</text>
</svg>
