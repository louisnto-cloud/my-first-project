<path d="M22 262 L224.6 145.0" stroke="#2f3a2b" stroke-width="1.6"/>
<text x="235.3" y="146" font-size="16" font-weight="bold" fill="#2f3a2b" stroke="#fffaf0" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">30°</text>
<path d="M22 262 L187.5 96.5" stroke="#2f3a2b" stroke-width="1.6"/>
<text x="196.5" y="95.5" font-size="16" font-weight="bold" fill="#2f3a2b" stroke="#fffaf0" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">45°</text>
<line x1="213.7" y1="221.2" x2="265.35" y2="228.5" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="213.7" cy="221.2" r="2.6" fill="#2f3a2b"/>
<rect x="265.4" y="214.0" width="126.6" height="29.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="328.675" y="234.5" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Under 25: rare</text>
<line x1="195.9" y1="171.5" x2="272.883" y2="180.5" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="195.9" cy="171.5" r="2.6" fill="#2f3a2b"/>
<rect x="272.9" y="156.0" width="119.1" height="49.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="332.442" y="176.5" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">25 to 30:</text>
<text x="332.442" y="196.5" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">less common</text>
<line x1="177.5" y1="142.7" x2="261.584" y2="116.5" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="177.5" cy="142.7" r="2.6" fill="#2f3a2b"/>
