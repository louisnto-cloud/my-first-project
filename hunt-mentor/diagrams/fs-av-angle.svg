<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 306" font-family="sans-serif" role="img" aria-label="Fan chart of slope angles from flat to steep. Under 25 degrees: avalanches are rare. 25 to 30 degrees: less common. 30 to 45 degrees, in orange: where most avalanches start, 80 percent. Over 45 degrees: snow sluffs off often, so slabs form less. Slides can run out onto flat ground.">
<rect width="400" height="306" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Slope angle: where avalanches start</text>
