<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Slope angle chart from Avalanche Canada: most avalanches start on slopes between 30 and 45 degrees. 25 to 30 degrees, less common. Over 45 degrees, snow usually sluffs off often so slabs form less. Avalanches can run out onto flat ground below.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Slope angle: where avalanches start</text><path d="M60 250 L290 250 A230 230 0 0 0 268 153 Z" fill="#e3eef8"/><path d="M60 250 L268 153 A230 230 0 0 0 259 135 Z" fill="#ffe3a3"/><path d="M60 250 L259 135 A230 230 0 0 0 223 87 Z" fill="#f3a58a"/><path d="M60 250 L223 87 A230 230 0 0 0 175 51 Z" fill="#d7dde3"/><text x="278" y="154" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">25°</text><text x="268" y="136" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">30°</text><text x="231" y="87" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">45°</text><text x="215" y="240" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Under 25: rare</text><text x="300" y="200" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">25 to 30: less common</text><text x="190" y="130" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">30 to 45: most</text><text x="120" y="66" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Over 45: sluffs</text><text x="200" y="290" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Slides can run out onto flat ground</text>
</svg>
