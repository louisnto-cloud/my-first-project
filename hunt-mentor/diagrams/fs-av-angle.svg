<line x1="121.9" y1="124.5" x2="84.4256" y2="93" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="121.9" cy="124.5" r="2.6" fill="#2f3a2b"/>
<rect x="10.0" y="44.0" width="80.4" height="49.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="50.2128" y="64.5" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Over 45:</text>
