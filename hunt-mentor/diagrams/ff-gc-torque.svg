<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Screw torques from the manuals: Tikka action screws 7 newton metres, 62 inch pounds, with a metal trigger guard and at most 5 newton metres with a plastic guard; CZ 457 stock screws 3.5 newton metres; scope rings use the ring maker number. Mark each screw with a paint pen line.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Screw torques from the manuals</text><rect x="14" y="52" width="372" height="44" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="28" y="80" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Tikka action, metal guard</text><text x="376" y="80" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="end">7 Nm (62 in lb)</text><rect x="14" y="104" width="372" height="44" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="28" y="132" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Tikka action, plastic guard</text><text x="376" y="132" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="end">max 5 Nm (44 in lb)</text><rect x="14" y="156" width="372" height="44" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="28" y="184" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">CZ 457 stock screws</text><text x="376" y="184" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="end">3.5 Nm</text><rect x="14" y="208" width="372" height="44" rx="8" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="28" y="236" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Scope rings</text><text x="376" y="236" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="end">ring maker&#x27;s number</text><text x="200.0" y="280" font-size="14" fill="#2f3a2b" text-anchor="middle">Paint pen line across each screw head</text>
</svg>
