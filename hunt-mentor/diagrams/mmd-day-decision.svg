<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Decision chain, opinion. Wind right for this slope? If not, change slope. Deer seen? If not, glass until about 10 then scout sign. Bedded? Stalk it or wait for evening. Legal, sure and in range? If not, no shot; watch and learn. Yes to all: rest, breathe, squeeze.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">On the day: decide fast (Tip)</text><rect x="10" y="40" width="200" height="44" rx="8" fill="#2f3a2b"/><text x="110" y="67" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Wind right for this slope?</text><line x1="210" y1="62" x2="228" y2="62" stroke="#23261f" stroke-width="2"/><polygon points="228.0,62.0 219.0,66.3 219.0,57.7" fill="#23261f"/><rect x="230" y="40" width="160" height="44" rx="8" fill="#f6d7c3" stroke="#e8590c" stroke-width="2"/><text x="310" y="59" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">No:</text><text x="310" y="77" font-size="14" fill="#23261f" text-anchor="middle">change slope</text><line x1="110" y1="84" x2="110" y2="98" stroke="#23261f" stroke-width="2"/><polygon points="110.0,98.0 105.7,89.0 114.3,89.0" fill="#23261f"/><rect x="10" y="100" width="200" height="44" rx="8" fill="#2f3a2b"/><text x="110" y="127" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Deer seen?</text><line x1="210" y1="122" x2="228" y2="122" stroke="#23261f" stroke-width="2"/><polygon points="228.0,122.0 219.0,126.3 219.0,117.7" fill="#23261f"/><rect x="230" y="100" width="160" height="44" rx="8" fill="#f6d7c3" stroke="#e8590c" stroke-width="2"/><text x="310" y="119" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">No:</text><text x="310" y="137" font-size="14" fill="#23261f" text-anchor="middle">glass, then scout</text><line x1="110" y1="144" x2="110" y2="158" stroke="#23261f" stroke-width="2"/><polygon points="110.0,158.0 105.7,149.0 114.3,149.0" fill="#23261f"/><rect x="10" y="160" width="200" height="44" rx="8" fill="#2f3a2b"/><text x="110" y="187" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Bedded?</text><line x1="210" y1="182" x2="228" y2="182" stroke="#23261f" stroke-width="2"/><polygon points="228.0,182.0 219.0,186.3 219.0,177.7" fill="#23261f"/><rect x="230" y="160" width="160" height="44" rx="8" fill="#f6d7c3" stroke="#e8590c" stroke-width="2"/><text x="310" y="179" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Yes:</text><text x="310" y="197" font-size="14" fill="#23261f" text-anchor="middle">stalk or wait</text><line x1="110" y1="204" x2="110" y2="218" stroke="#23261f" stroke-width="2"/><polygon points="110.0,218.0 105.7,209.0 114.3,209.0" fill="#23261f"/><rect x="10" y="220" width="200" height="44" rx="8" fill="#2f3a2b"/><text x="110" y="247" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Legal, sure, in range?</text><line x1="210" y1="242" x2="228" y2="242" stroke="#23261f" stroke-width="2"/><polygon points="228.0,242.0 219.0,246.3 219.0,237.7" fill="#23261f"/><rect x="230" y="220" width="160" height="44" rx="8" fill="#f6d7c3" stroke="#e8590c" stroke-width="2"/><text x="310" y="239" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">No:</text><text x="310" y="257" font-size="14" fill="#23261f" text-anchor="middle">no shot, learn</text><text x="200" y="292" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Yes to all: rest, breathe, squeeze</text>
</svg>
