<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 332" font-family="sans-serif" role="img" aria-label="How fast each ground ages a track. Mud is slowest and looks fresh for days. Clay in shade is slow. Forest duff is medium and hard to read. Sand and dust are fast, edges dry and slump. Snow in sun is fast and melts prints out bigger.">
<rect x="0" y="0" width="400" height="332" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Ground sets the clock</text>
<text x="16" y="82" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Mud</text><rect x="130" y="68" width="240" height="18" rx="4" fill="#8a9a6b"/><text x="130" y="102" font-size="14" fill="#6b4f35" text-anchor="start">slowest: looks fresh for days</text><text x="16" y="128" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Clay, shade</text><rect x="130" y="114" width="192.0" height="18" rx="4" fill="#8a9a6b"/><text x="130" y="148" font-size="14" fill="#6b4f35" text-anchor="start">slow</text><text x="16" y="174" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Forest duff</text><rect x="130" y="160" width="144.0" height="18" rx="4" fill="#8a9a6b"/><text x="130" y="194" font-size="14" fill="#6b4f35" text-anchor="start">medium, hard to read</text><text x="16" y="220" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Sand, dust</text><rect x="130" y="206" width="84.0" height="18" rx="4" fill="#8a9a6b"/><text x="130" y="240" font-size="14" fill="#6b4f35" text-anchor="start">fast: edges dry and slump</text><text x="16" y="266" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Snow in sun</text><rect x="130" y="252" width="72.0" height="18" rx="4" fill="#8a9a6b"/><text x="130" y="286" font-size="14" fill="#6b4f35" text-anchor="start">fast: melts out bigger</text><text x="200" y="320" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Long bar: keeps a fresh look longer</text>
</svg>
