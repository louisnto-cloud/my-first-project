<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Map sketch of a long cliff band across a slope with one break in it. Trails above and below the cliff all funnel to the single gap, marked orange.">
