<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Gap in a cliff band</text><text x="388" y="24" font-size="14" fill="#2f3a2b" text-anchor="end">map view</text><rect x="0" y="36" width="400" height="232" fill="#dfe6d3" opacity=".6"/><text x="388" y="24" font-size="13" fill="#2f3a2b" text-anchor="end"></text><path d="M0 140 L160 150 M220 150 L400 140" stroke="#6b5e4a" stroke-width="16"/><path d="M60 268 C 120 220, 180 180, 190 150 C 200 120, 160 80, 120 36 M330 268 C 280 220, 210 180, 190 150 C 196 120, 260 80, 300 36" stroke="#8b5a2b" stroke-width="3" stroke-dasharray="3 6" fill="none"/><circle cx="190" cy="150" r="14" fill="none" stroke="#e8590c" stroke-width="4"/><text x="40" y="126" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">cliff band</text><rect x="210" y="166" width="184" height="24" rx="6" fill="#e8590c"/><text x="302.0" y="183" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">The only way through</text><text x="200" y="292" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Many trails, one gap</text>
