<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 476" role="img" aria-label="Grid: Region 3 bag limits: big game and furbearers. Moose: 1. Bighorn mountain sheep: 1. Black bear: 2. Wolf, MUs 3-12 to 3-16, 3-18 to 3-20: 3. Wolf, MUs 3-17, 3-26 to 3-44: NBL. Coyote: NBL. Cougar: 2. Bobcat: 1. Lynx: 1. Raccoon: NBL. Snowshoe hare (daily): 10. Columbian ground squirrel: NBL." font-family="sans-serif">
