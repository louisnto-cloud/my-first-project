<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif" role="img" aria-label="Paw tracks side by side. Cougar: round, about 7.5 to 10 cm wide, 4 uneven toes, no claws, big heel pad with 3 lobes. Wolf: oval, about 9 to 11.5 cm long, claws show, small triangle heel pad. Coyote: the same shape at about half the size, 6 to 7 cm long.">
  <rect width="400" height="320" fill="#fffaf0"/>
  <text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cat or dog? Same scale</text>
  <g transform="translate(70 140) scale(1.9)" fill="#8b5a2b">
    <path d="M-16 10 Q-16 -2 0 -2 Q16 -2 16 10 Q16 20 10 20 Q5 16 0 21 Q-5 16 -10 20 Q-16 20 -16 10 Z"/>
    <ellipse cx="-18" cy="-10" rx="5" ry="6"/><ellipse cx="-7" cy="-20" rx="5" ry="6.5"/><ellipse cx="7" cy="-18" rx="5" ry="6.5"/><ellipse cx="18" cy="-7" rx="5" ry="6"/>
  </g>
  <g transform="translate(205 135) scale(1.9,2.1)">
    <g fill="#8b5a2b"><path d="M-12 8 Q0 -4 12 8 Q14 20 0 22 Q-14 20 -12 8 Z"/>
    <ellipse cx="-14" cy="-6" rx="5" ry="7"/><ellipse cx="14" cy="-6" rx="5" ry="7"/>
    <ellipse cx="-5" cy="-19" rx="5" ry="7"/><ellipse cx="5" cy="-19" rx="5" ry="7"/></g>
    <g fill="#e8590c"><circle cx="-16" cy="-16" r="1.8"/><circle cx="16" cy="-16" r="1.8"/><circle cx="-6" cy="-30" r="1.8"/><circle cx="6" cy="-30" r="1.8"/></g>
  </g>
  <g transform="translate(330 150) scale(1.15,1.25)">
    <g fill="#8b5a2b"><path d="M-12 8 Q0 -4 12 8 Q14 20 0 22 Q-14 20 -12 8 Z"/>
    <ellipse cx="-14" cy="-6" rx="5" ry="7"/><ellipse cx="14" cy="-6" rx="5" ry="7"/>
    <ellipse cx="-5" cy="-19" rx="5" ry="7"/><ellipse cx="5" cy="-19" rx="5" ry="7"/></g>
    <g fill="#e8590c"><circle cx="-16" cy="-16" r="2.4"/><circle cx="16" cy="-16" r="2.4"/><circle cx="-6" cy="-30" r="2.4"/><circle cx="6" cy="-30" r="2.4"/></g>
  </g>
  <g text-anchor="middle">
    <text x="70" y="222" font-size="17" font-weight="bold" fill="#2f3a2b">Cougar</text>
    <text x="205" y="222" font-size="17" font-weight="bold" fill="#2f3a2b">Wolf</text>
    <text x="330" y="222" font-size="17" font-weight="bold" fill="#2f3a2b">Coyote</text>
    <text x="70" y="244" font-size="15" fill="#e8590c">7.5 to 10 cm</text>
    <text x="70" y="262" font-size="14" fill="#e8590c">wide</text>
    <text x="205" y="244" font-size="15" fill="#e8590c">9 to 11.5 cm</text>
    <text x="205" y="262" font-size="14" fill="#e8590c">long</text>
    <text x="330" y="244" font-size="15" fill="#e8590c">6 to 7 cm</text>
    <text x="330" y="262" font-size="14" fill="#e8590c">long</text>
    <text x="70" y="286" font-size="14" fill="#2f3a2b">no claws</text>
    <text x="70" y="304" font-size="14" fill="#2f3a2b">3 lobe heel</text>
    <text x="205" y="286" font-size="14" fill="#2f3a2b">claws show</text>
    <text x="205" y="304" font-size="14" fill="#2f3a2b">small heel</text>
    <text x="330" y="286" font-size="14" fill="#2f3a2b">half a wolf</text>
    <text x="330" y="304" font-size="14" fill="#2f3a2b">claws show</text>
  </g>
</svg>
