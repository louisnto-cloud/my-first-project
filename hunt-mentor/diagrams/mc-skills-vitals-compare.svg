<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four simple body outlines with an orange aim ring behind the front leg. Deer: one third up the chest. Elk: one third to one half up, aim for the lungs, not the shoulder blade. Moose: one third up, lower than the hump suggests. Black bear: halfway up, tight behind the leg.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Same rule, different heights</text><rect x="14" y="40" width="182" height="112" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><rect x="36" y="70" width="104" height="44" rx="16" fill="#8b5a2b"/><path d="M130 78 L160 58 L176 64 L146 94 Z" fill="#8b5a2b"/><rect x="110" y="110" width="8" height="18" fill="#8b5a2b"/><rect x="50" y="110" width="8" height="18" fill="#8b5a2b"/><circle cx="120" cy="99.48" r="8" fill="none" stroke="#e8590c" stroke-width="3"/><text x="26" y="60" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Deer</text><text x="184" y="60" font-size="14" fill="#e8590c" text-anchor="end" font-weight="bold">1/3 up</text><text x="105" y="144" font-size="14" fill="#23261f" text-anchor="middle">behind the leg</text><rect x="204" y="40" width="182" height="112" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><rect x="226" y="70" width="104" height="44" rx="16" fill="#8b5a2b"/><path d="M320 78 L350 58 L366 64 L336 94 Z" fill="#8b5a2b"/><rect x="300" y="110" width="8" height="18" fill="#8b5a2b"/><rect x="240" y="110" width="8" height="18" fill="#8b5a2b"/><circle cx="310" cy="95.52" r="8" fill="none" stroke="#e8590c" stroke-width="3"/><text x="216" y="60" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Elk</text><text x="374" y="60" font-size="14" fill="#e8590c" text-anchor="end" font-weight="bold">1/3 to 1/2 up</text><text x="295" y="144" font-size="14" fill="#23261f" text-anchor="middle">lungs, not blade</text><rect x="14" y="158" width="182" height="112" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><path d="M100 190 Q 120 176 140 190 Z" fill="#8b5a2b"/><rect x="36" y="188" width="104" height="44" rx="16" fill="#8b5a2b"/><path d="M130 196 L160 176 L176 182 L146 212 Z" fill="#8b5a2b"/><rect x="110" y="228" width="8" height="18" fill="#8b5a2b"/><rect x="50" y="228" width="8" height="18" fill="#8b5a2b"/><circle cx="120" cy="217.48" r="8" fill="none" stroke="#e8590c" stroke-width="3"/><text x="26" y="178" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Moose</text><text x="184" y="178" font-size="14" fill="#e8590c" text-anchor="end" font-weight="bold">1/3 up</text><text x="105" y="262" font-size="14" fill="#23261f" text-anchor="middle">lower than the hump</text><rect x="204" y="158" width="182" height="112" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><rect x="226" y="188" width="104" height="44" rx="16" fill="#8b5a2b"/><path d="M320 196 L350 176 L366 182 L336 212 Z" fill="#8b5a2b"/><rect x="300" y="228" width="8" height="18" fill="#8b5a2b"/><rect x="240" y="228" width="8" height="18" fill="#8b5a2b"/><circle cx="310" cy="210.0" r="8" fill="none" stroke="#e8590c" stroke-width="3"/><text x="216" y="178" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Black bear</text><text x="374" y="178" font-size="14" fill="#e8590c" text-anchor="end" font-weight="bold">1/2 up</text><text x="295" y="262" font-size="14" fill="#23261f" text-anchor="middle">tight behind leg</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">65 to 85%. Up the back of the front leg</text>
</svg>
