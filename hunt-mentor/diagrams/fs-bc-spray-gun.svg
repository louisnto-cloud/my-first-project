<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart: bear spray stopped aggressive bear behaviour in about 92 percent of cases; firearms in about 67 percent, as reported in coverage of the Smith and Herrero studies. Carry spray and know how to use it.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bear spray vs firearms (studies)</text><text x="70" y="108" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="end">Spray</text><rect x="80" y="80" width="258" height="40" rx="4" fill="#2e7d32"/><text x="348" y="108" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">92%</text><text x="70" y="178" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="end">Guns</text><rect x="80" y="150" width="188" height="40" rx="4" fill="#9a9a8f"/><text x="278" y="178" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">67%</text><text x="200" y="240" font-size="14" fill="#2f3a2b" text-anchor="middle">Stopped the bear, as reported in</text><text x="200" y="258" font-size="14" fill="#2f3a2b" text-anchor="middle">coverage of Smith and Herrero studies</text><text x="200" y="290" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Carry spray. Know how to use it</text>
</svg>
