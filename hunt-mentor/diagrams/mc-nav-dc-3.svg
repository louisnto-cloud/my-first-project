<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Compass drill step 3: walk a triangle of three bearings, 0, 120 and 240 degrees, 100 paces each. You should finish close to where you started.">
<rect width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c"/><text x="26" y="31" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">3</text><text x="52" y="32" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Walk a triangle: 3 legs</text><rect x="20" y="56" width="360" height="200" rx="8" fill="#dfe6d3"/><path d="M90 100 L140 200 L40 200 Z" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="90" cy="100" r="6" fill="#2f3a2b"/><text x="170" y="100" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">0°, 120°, 240°</text><text x="170" y="130" font-size="15" fill="#23261f" text-anchor="start">100 paces each</text><text x="170" y="160" font-size="15" fill="#23261f" text-anchor="start">Finish on the start?</text>
</svg>
