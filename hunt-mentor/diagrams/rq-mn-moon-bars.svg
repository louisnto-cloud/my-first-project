<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 408" font-family="sans-serif" role="img" aria-label="Bar chart on one scale of metres an hour. Penn State October does moved 120 to 140 metres an hour at dawn and dusk, about 60 at night and under 50 in the middle of the day. The new moon versus full moon difference was about 6 metres an hour. Mississippi State bucks showed a moon effect of about 4 metres an hour, inside GPS error. Sources: Penn State Deer Forest blog 2017 (75%); Mississippi State Deer Lab via MeatEater (75%).">
<rect width="400" height="408" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Deer movement: moon versus time of day</text>
<path d="M18 60 H42" stroke="#2f3a2b" stroke-width="2"/><path d="M22 60 A8 8 0 0 1 38 60z" fill="#f0a020"/><line x1="20.5" y1="54.5" x2="17.0" y2="52.5" stroke="#f0a020" stroke-width="2"/><line x1="24.5" y1="50.5" x2="22.5" y2="47.0" stroke="#f0a020" stroke-width="2"/><line x1="30.0" y1="49.0" x2="30.0" y2="45.0" stroke="#f0a020" stroke-width="2"/><line x1="35.5" y1="50.5" x2="37.5" y2="47.0" stroke="#f0a020" stroke-width="2"/><line x1="39.5" y1="54.5" x2="43.0" y2="52.5" stroke="#f0a020" stroke-width="2"/>
<text x="50" y="59" font-size="15" font-weight="bold" fill="#2f3a2b">Dawn and dusk (October does)</text>
<rect x="16" y="70" width="368" height="18" rx="4" fill="#efe8d6"/>
<rect x="310.4" y="70" width="49.1" height="18" rx="4" fill="#e8590c"/>
<text x="302.4" y="84" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">120 to 140 m an hour</text>
<circle cx="30" cy="114" r="12" fill="#2b3a55"/><circle cx="29" cy="114" r="7" fill="#f3e7b3"/><circle cx="32.1" cy="112.2" r="6.0" fill="#2b3a55"/>
<text x="50" y="119" font-size="15" font-weight="bold" fill="#2f3a2b">Night</text>
<rect x="16" y="130" width="368" height="18" rx="4" fill="#efe8d6"/>
<rect x="16" y="130" width="147.2" height="18" rx="4" fill="#2b3a55" opacity="1"/>
<text x="171.2" y="144" font-size="15" font-weight="bold" fill="#2f3a2b">about 60 m an hour</text>
<circle cx="30" cy="174" r="8" fill="#f0a020"/><line x1="41.0" y1="174.0" x2="44.0" y2="174.0" stroke="#f0a020" stroke-width="2"/><line x1="37.8" y1="181.8" x2="39.9" y2="183.9" stroke="#f0a020" stroke-width="2"/><line x1="30.0" y1="185.0" x2="30.0" y2="188.0" stroke="#f0a020" stroke-width="2"/><line x1="22.2" y1="181.8" x2="20.1" y2="183.9" stroke="#f0a020" stroke-width="2"/><line x1="19.0" y1="174.0" x2="16.0" y2="174.0" stroke="#f0a020" stroke-width="2"/><line x1="22.2" y1="166.2" x2="20.1" y2="164.1" stroke="#f0a020" stroke-width="2"/><line x1="30.0" y1="163.0" x2="30.0" y2="160.0" stroke="#f0a020" stroke-width="2"/><line x1="37.8" y1="166.2" x2="39.9" y2="164.1" stroke="#f0a020" stroke-width="2"/>
<text x="50" y="179" font-size="15" font-weight="bold" fill="#2f3a2b">Middle of the day</text>
<rect x="16" y="190" width="368" height="18" rx="4" fill="#efe8d6"/>
<rect x="16" y="190" width="122.7" height="18" rx="4" fill="#8a9a6b" opacity="1"/>
<text x="146.7" y="204" font-size="15" font-weight="bold" fill="#2f3a2b">under 50 m an hour</text>
<circle cx="22" cy="234" r="7" fill="#2b3a55" stroke="#2f3a2b" stroke-width="1"/><circle cx="39" cy="234" r="7" fill="#f3e7b3" stroke="#2f3a2b" stroke-width="1"/>
<text x="50" y="239" font-size="15" font-weight="bold" fill="#2f3a2b">New moon minus full moon</text>
<rect x="16" y="250" width="368" height="18" rx="4" fill="#efe8d6"/>
<rect x="16" y="250" width="14.7" height="18" rx="4" fill="#4a7fb0" opacity="1"/>
<text x="38.7" y="264" font-size="15" font-weight="bold" fill="#2f3a2b">about 6 m an hour</text>
<circle cx="22" cy="294" r="7" fill="#2b3a55" stroke="#2f3a2b" stroke-width="1"/><circle cx="39" cy="294" r="7" fill="#f3e7b3" stroke="#2f3a2b" stroke-width="1"/>
<text x="50" y="299" font-size="15" font-weight="bold" fill="#2f3a2b">Moon effect on bucks (Mississippi)</text>
<rect x="16" y="310" width="368" height="18" rx="4" fill="#efe8d6"/>
<rect x="16" y="310" width="9.8" height="18" rx="4" fill="#4a7fb0" opacity="1"/>
<text x="33.8" y="324" font-size="15" font-weight="bold" fill="#2f3a2b">about 4 m an hour</text>
<line x1="16.0" y1="334" x2="16.0" y2="340" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="16" y="355" font-size="14" fill="#6b5b4b">0</text>
<line x1="138.7" y1="334" x2="138.7" y2="340" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="138.7" y="355" font-size="14" fill="#6b5b4b" text-anchor="middle">50</text>
<line x1="261.3" y1="334" x2="261.3" y2="340" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="261.3" y="355" font-size="14" fill="#6b5b4b" text-anchor="middle">100</text>
<text x="318.7" y="355" font-size="14" fill="#6b5b4b" text-anchor="middle">m an hour</text>
<text x="200" y="378" font-size="14" fill="#6b5b4b" text-anchor="middle">Penn State Deer Forest blog 2017 (75%);</text>
<text x="200" y="397" font-size="14" fill="#6b5b4b" text-anchor="middle">Mississippi State Deer Lab via MeatEater (75%).</text>
</svg>
