<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Killed here or scavenged? Killed here: blood on the ground, broken brush, trampled plants, bites with bruising under the hide. Scavenged: little blood, no struggle, bites with no bruising, an older carcass. Many predators also scavenge.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Killed or scavenged?</text>
<rect x="16" y="62" width="176" height="200" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><rect x="208" y="62" width="176" height="200" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="104" y="88" font-size="16" font-weight="bold" fill="#c62828" text-anchor="middle">Killed here</text><text x="296" y="88" font-size="16" font-weight="bold" fill="#8a9a6b" text-anchor="middle">Scavenged</text><text x="104" y="118" font-size="14" fill="#23261f" text-anchor="middle">blood on ground</text><text x="104" y="140" font-size="14" fill="#23261f" text-anchor="middle">broken brush</text><text x="104" y="162" font-size="14" fill="#23261f" text-anchor="middle">trampled plants</text><text x="104" y="184" font-size="14" fill="#23261f" text-anchor="middle">bites with bruising</text><text x="296" y="118" font-size="14" fill="#23261f" text-anchor="middle">little blood</text><text x="296" y="140" font-size="14" fill="#23261f" text-anchor="middle">no struggle</text><text x="296" y="162" font-size="14" fill="#23261f" text-anchor="middle">bites, no bruising</text><text x="296" y="184" font-size="14" fill="#23261f" text-anchor="middle">old carcass</text><text x="200" y="290" font-size="14" font-weight="bold" fill="#6b4f35" text-anchor="middle">Many predators also scavenge (85%)</text>
</svg>
