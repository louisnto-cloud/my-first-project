<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 771" font-family="sans-serif" role="img" aria-label="Side views of five grouse family birds with their key marks. Ruffed grouse: small crest on the head, fan tail with a dark band near the tip, barred flanks; lives in aspen and brush, drums. Spruce or Franklin&#x27;s grouse: dark; the male has a black breast edged in white, a red comb over the eye and white spots above a dark tail; very tame. Dusky (blue) grouse: the biggest, plain grey, with a yellow to orange comb and a dark tail with a pale grey band at the tip; the hen is mottled; walks uphill into conifers in fall. Sharp tailed grouse: pale with a spotted belly and a short pointed tail with white outer feathers that show in flight; open only in MU 3-30 and 3-31. Ptarmigan, alpine: mottled in summer and white by late fall, with feathered feet; the white tailed ptarmigan has a white tail, willow and rock ptarmigan a black tail.">
<rect width="400" height="771" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Grouse of BC: the marks that matter</text>
<rect x="8" y="40" width="384" height="135" rx="8" fill="#f6f1e3" stroke="#d8cfb8" stroke-width="1.2"/>
<g transform="translate(110 116) scale(0.92)"><path d="M-44 -16 L-94 -34 C-104 -16 -104 8 -94 22 L-44 10z" fill="#5a3e26"/><path d="M-84 -30 C-92 -14 -92 6 -84 19" stroke="#1d1a16" stroke-width="6" fill="none"/><path d="M-94 -34 C-104 -16 -104 8 -94 22 L-90 20 C-98 6 -98 -14 -90 -31z" fill="#a07a52"/><path d="M-4 34 V50 M-10 52 L-4 50 L2 52 M12 34 V50 M6 52 L12 50 L18 52" stroke="#6b5b4b" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M26 -26 C34 -40 40 -50 50 -55 C62 -56 68 -44 62 -32 C58 -24 48 -16 40 -10z" fill="#a07a52"/><path d="M-50 0 C-50 -26 -18 -38 16 -32 C34 -29 46 -16 46 2 C46 24 22 36 -6 36 C-34 36 -50 22 -50 0z" fill="#a07a52"/><path d="M-30 14 q5 4 10 0" stroke="#3e2a18" stroke-width="2.2" fill="none"/><path d="M-26 24 q5 4 10 0" stroke="#3e2a18" stroke-width="2.2" fill="none"/><path d="M-20 16 q5 4 10 0" stroke="#3e2a18" stroke-width="2.2" fill="none"/><path d="M-16 26 q5 4 10 0" stroke="#3e2a18" stroke-width="2.2" fill="none"/><path d="M-10 14 q5 4 10 0" stroke="#3e2a18" stroke-width="2.2" fill="none"/><path d="M-6 24 q5 4 10 0" stroke="#3e2a18" stroke-width="2.2" fill="none"/><path d="M0 16 q5 4 10 0" stroke="#3e2a18" stroke-width="2.2" fill="none"/><path d="M4 26 q5 4 10 0" stroke="#3e2a18" stroke-width="2.2" fill="none"/><path d="M10 14 q5 4 10 0" stroke="#3e2a18" stroke-width="2.2" fill="none"/><path d="M14 24 q5 4 10 0" stroke="#3e2a18" stroke-width="2.2" fill="none"/><path d="M-34 -10 C-14 -26 18 -24 32 -10 C14 4 -18 6 -34 -10z" fill="#8c6844"/><path d="M-24 -8 C-8 -16 12 -14 24 -8" stroke="#5a3e26" stroke-width="1.6" fill="none" opacity=".6"/><path d="M44 -52 L40 -66 L50 -58 L52 -70 L58 -56z" fill="#5a3e26"/><path d="M63 -44 L73 -41 L63 -37z" fill="#2a241c"/><circle cx="56" cy="-43" r="2.6" fill="#111"/></g>
<text x="194" y="64" font-size="17" font-weight="bold" fill="#2f3a2b">Ruffed grouse</text>
<text x="194" y="86" font-size="15" fill="#2f3a2b">Small crest on the head.</text>
<text x="194" y="105" font-size="15" fill="#2f3a2b">Fan tail with a dark band</text>
<text x="194" y="124" font-size="15" fill="#2f3a2b">near the tip.</text>
<text x="194" y="143" font-size="15" fill="#2f3a2b">Barred flanks.</text>
<text x="194" y="162" font-size="15" fill="#6b5b4b">Aspen and brush. Drums.</text>
<rect x="8" y="183" width="384" height="135" rx="8" fill="#f6f1e3" stroke="#d8cfb8" stroke-width="1.2"/>
<g transform="translate(110 258) scale(0.92)"><path d="M-44 -12 L-80 -16 C-84 -6 -84 4 -80 12 L-44 8z" fill="#1d1a16"/><path d="M-4 34 V50 M-10 52 L-4 50 L2 52 M12 34 V50 M6 52 L12 50 L18 52" stroke="#6b5b4b" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M26 -26 C34 -40 40 -50 50 -55 C62 -56 68 -44 62 -32 C58 -24 48 -16 40 -10z" fill="#55514b"/><path d="M-50 0 C-50 -26 -18 -38 16 -32 C34 -29 46 -16 46 2 C46 24 22 36 -6 36 C-34 36 -50 22 -50 0z" fill="#55514b"/><path d="M40 -10 C48 -2 48 14 38 26 C30 18 26 2 30 -12z" fill="#141414"/><path d="M38 26 C30 18 26 2 30 -12" stroke="#f4efe4" stroke-width="2.6" fill="none" stroke-dasharray="4 3"/><path d="M-34 -10 C-14 -26 18 -24 32 -10 C14 4 -18 6 -34 -10z" fill="#4a4640"/><path d="M-24 -8 C-8 -16 12 -14 24 -8" stroke="#26231f" stroke-width="1.6" fill="none" opacity=".6"/><circle cx="-46" cy="-14" r="3" fill="#f4efe4"/><circle cx="-52" cy="-8" r="3" fill="#f4efe4"/><circle cx="-46" cy="-2" r="3" fill="#f4efe4"/><circle cx="-54" cy="2" r="3" fill="#f4efe4"/><circle cx="-48" cy="8" r="3" fill="#f4efe4"/><path d="M63 -44 L73 -41 L63 -37z" fill="#2a241c"/><path d="M48 -48 C50 -54 58 -54 60 -48 C56 -46 52 -46 48 -48z" fill="#d23b2a"/><circle cx="56" cy="-43" r="2.6" fill="#111"/></g>
<text x="194" y="207" font-size="17" font-weight="bold" fill="#2f3a2b">Spruce (Franklin&#x27;s)</text>
<text x="194" y="229" font-size="15" fill="#2f3a2b">Dark. Male: black breast</text>
<text x="194" y="248" font-size="15" fill="#2f3a2b">edged white, red comb over</text>
<text x="194" y="267" font-size="15" fill="#2f3a2b">the eye, white spots above</text>
<text x="194" y="286" font-size="15" fill="#2f3a2b">a dark tail.</text>
<text x="194" y="305" font-size="15" fill="#6b5b4b">Very tame.</text>
<rect x="8" y="326" width="384" height="154" rx="8" fill="#f6f1e3" stroke="#d8cfb8" stroke-width="1.2"/>
<g transform="translate(112 411) scale(1.0)"><path d="M-44 -14 L-92 -26 C-98 -10 -98 6 -92 18 L-44 10z" fill="#2b2f33"/><path d="M-92 -26 C-98 -10 -98 6 -92 18 L-84 16 C-89 4 -89 -10 -84 -24z" fill="#b9c0c6"/><path d="M-4 34 V50 M-10 52 L-4 50 L2 52 M12 34 V50 M6 52 L12 50 L18 52" stroke="#6b5b4b" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M26 -26 C34 -40 40 -50 50 -55 C62 -56 68 -44 62 -32 C58 -24 48 -16 40 -10z" fill="#7d8a95"/><path d="M-50 0 C-50 -26 -18 -38 16 -32 C34 -29 46 -16 46 2 C46 24 22 36 -6 36 C-34 36 -50 22 -50 0z" fill="#7d8a95"/><path d="M-34 -10 C-14 -26 18 -24 32 -10 C14 4 -18 6 -34 -10z" fill="#6c7884"/><path d="M-24 -8 C-8 -16 12 -14 24 -8" stroke="#3e4852" stroke-width="1.6" fill="none" opacity=".6"/><path d="M63 -44 L73 -41 L63 -37z" fill="#2a241c"/><path d="M48 -48 C50 -54 58 -54 60 -48 C56 -46 52 -46 48 -48z" fill="#f0a020"/><circle cx="56" cy="-43" r="2.6" fill="#111"/></g>
<text x="194" y="350" font-size="17" font-weight="bold" fill="#2f3a2b">Dusky (blue) grouse</text>
<text x="194" y="372" font-size="15" fill="#2f3a2b">Biggest. Plain grey.</text>
<text x="194" y="391" font-size="15" fill="#2f3a2b">Yellow to orange comb.</text>
<text x="194" y="410" font-size="15" fill="#2f3a2b">Dark tail, pale grey band at</text>
<text x="194" y="429" font-size="15" fill="#2f3a2b">the tip. Hen mottled.</text>
<text x="194" y="448" font-size="15" fill="#6b5b4b">Walks uphill into conifers in</text>
<text x="194" y="467" font-size="15" fill="#6b5b4b">fall.</text>
<rect x="8" y="488" width="384" height="135" rx="8" fill="#f6f1e3" stroke="#d8cfb8" stroke-width="1.2"/>
<g transform="translate(112 564) scale(0.92)"><path d="M-44 -10 L-96 -2 L-44 10z" fill="#8a6e4a"/><path d="M-44 -10 L-96 -2 L-44 -4z M-44 10 L-96 -2 L-44 4z" fill="#f4efe4"/><path d="M-4 34 V50 M-10 52 L-4 50 L2 52 M12 34 V50 M6 52 L12 50 L18 52" stroke="#6b5b4b" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M26 -26 C34 -40 40 -50 50 -55 C62 -56 68 -44 62 -32 C58 -24 48 -16 40 -10z" fill="#c9ae86"/><path d="M-50 0 C-50 -26 -18 -38 16 -32 C34 -29 46 -16 46 2 C46 24 22 36 -6 36 C-34 36 -50 22 -50 0z" fill="#c9ae86"/><path d="M-30 22 C-10 34 20 34 40 12 C42 22 26 36 -6 36 C-22 36 -32 30 -30 22z" fill="#f1e9dc"/><path d="M-23 20 L-20 24 L-17 20" stroke="#5c4a32" stroke-width="2" fill="none"/><path d="M-11 24 L-8 28 L-5 24" stroke="#5c4a32" stroke-width="2" fill="none"/><path d="M1 26 L4 30 L7 26" stroke="#5c4a32" stroke-width="2" fill="none"/><path d="M13 22 L16 26 L19 22" stroke="#5c4a32" stroke-width="2" fill="none"/><path d="M23 16 L26 20 L29 16" stroke="#5c4a32" stroke-width="2" fill="none"/><path d="M-5 16 L-2 20 L1 16" stroke="#5c4a32" stroke-width="2" fill="none"/><path d="M7 14 L10 18 L13 14" stroke="#5c4a32" stroke-width="2" fill="none"/><path d="M-17 12 L-14 16 L-11 12" stroke="#5c4a32" stroke-width="2" fill="none"/><path d="M-34 -10 C-14 -26 18 -24 32 -10 C14 4 -18 6 -34 -10z" fill="#b0936a"/><path d="M-24 -8 C-8 -16 12 -14 24 -8" stroke="#8a6e4a" stroke-width="1.6" fill="none" opacity=".6"/><path d="M63 -44 L73 -41 L63 -37z" fill="#2a241c"/><circle cx="56" cy="-43" r="2.6" fill="#111"/></g>
<text x="194" y="512" font-size="17" font-weight="bold" fill="#2f3a2b">Sharp tailed grouse</text>
<text x="194" y="534" font-size="15" fill="#2f3a2b">Pale, spotted belly.</text>
<text x="194" y="553" font-size="15" fill="#2f3a2b">Short pointed tail, white</text>
<text x="194" y="572" font-size="15" fill="#2f3a2b">outer feathers in flight.</text>
<text x="194" y="591" font-size="15" fill="#c2410c">Open only in MU 3-30 and</text>
<text x="194" y="610" font-size="15" fill="#c2410c">3-31.</text>
<rect x="8" y="631" width="384" height="132" rx="8" fill="#f6f1e3" stroke="#d8cfb8" stroke-width="1.2"/>
<g transform="translate(108 705) scale(0.9)"><path d="M-44 -12 L-78 -12 C-82 -4 -82 4 -78 10 L-44 8z" fill="#1d1a16"/><ellipse cx="-4" cy="44" rx="9" ry="8" fill="#f4efe4" stroke="#b9b2a0" stroke-width="1"/><ellipse cx="14" cy="44" rx="9" ry="8" fill="#f4efe4" stroke="#b9b2a0" stroke-width="1"/><path d="M26 -26 C34 -40 40 -50 50 -55 C62 -56 68 -44 62 -32 C58 -24 48 -16 40 -10z" fill="#f7f3ea" stroke="#a59d8a" stroke-width="1.4"/><path d="M-50 0 C-50 -26 -18 -38 16 -32 C34 -29 46 -16 46 2 C46 24 22 36 -6 36 C-34 36 -50 22 -50 0z" fill="#f7f3ea" stroke="#a59d8a" stroke-width="1.4"/><path d="M-34 -10 C-14 -26 18 -24 32 -10 C14 4 -18 6 -34 -10z" fill="#ece6d8"/><path d="M-24 -8 C-8 -16 12 -14 24 -8" stroke="#c9c2b0" stroke-width="1.6" fill="none" opacity=".6"/><path d="M63 -44 L73 -41 L63 -37z" fill="#2a241c"/><circle cx="56" cy="-43" r="2.6" fill="#111"/></g>
<text x="194" y="655" font-size="17" font-weight="bold" fill="#2f3a2b">Ptarmigan (alpine)</text>
<text x="194" y="677" font-size="15" fill="#2f3a2b">Mottled in summer, white</text>
<text x="194" y="696" font-size="15" fill="#2f3a2b">by late fall. Feathered feet.</text>
<text x="194" y="715" font-size="15" fill="#2f3a2b">White tailed: white tail.</text>
<text x="194" y="734" font-size="15" fill="#2f3a2b">Willow and rock: black tail.</text>
</svg>
