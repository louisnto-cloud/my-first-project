<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" role="img" aria-label="Side views of five grouse family birds with their key marks: ruffed grouse with a crest and a fan tail with a dark band near the tip, spruce or Franklin's grouse dark with a black breast edged in white, a red comb over the eye and white spots above the tail, dusky grouse large and grey with a yellow orange comb and a grey band on the tail tip, sharp tailed grouse with a short pointed tail and spotted belly, and a ptarmigan white in winter with feathered feet.">
  <rect x="0" y="0" width="400" height="820" fill="#fffaf0"/>
  <text x="192" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Grouse of BC: the marks that matter</text>

  <!-- Ruffed grouse -->
  <g>
    <line x1="10" y1="178" x2="390" y2="178" stroke="#8a9a6b" stroke-width="2" fill="none"/>
    <path d="M62 112 L40 88 L46 126 Z" fill="#6b4f35"/>
    <path d="M44 100 L36 96 L48 118 Z" fill="#23261f"/>
    <ellipse cx="100" cy="116" rx="44" ry="26" fill="#6b4f35"/>
    <circle cx="146" cy="96" r="13" fill="#6b4f35"/>
    <polygon points="140,84 148,72 154,84" fill="#6b4f35"/>
    <circle cx="150" cy="94" r="2.5" fill="#23261f"/>
    <polygon points="158,98 170,100 158,103" fill="#23261f"/>
    <path d="M74 128 L82 128 M90 132 L98 132 M106 134 L114 134 M122 130 L130 130" stroke="#23261f" stroke-width="3" fill="none"/>
    <line x1="92" y1="142" x2="90" y2="156" stroke="#23261f" stroke-width="2" fill="none"/>
    <line x1="108" y1="142" x2="110" y2="156" stroke="#23261f" stroke-width="2" fill="none"/>
    <text x="192" y="66" font-family="sans-serif" font-size="16" font-weight="bold" fill="#23261f" text-anchor="start">Ruffed grouse</text>
    <text x="192" y="88" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Small crest on the head.</text>
    <text x="192" y="108" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Fan tail with a dark band</text>
    <text x="192" y="128" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">near the tip. Barred flanks.</text>
    <text x="192" y="152" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start">Aspen and brush. Drums.</text>
  </g>

  <!-- Spruce (Franklin's) grouse -->
  <g>
    <line x1="10" y1="334" x2="390" y2="334" stroke="#8a9a6b" stroke-width="2" fill="none"/>
    <path d="M62 266 L42 250 L50 282 Z" fill="#23261f"/>
    <circle cx="52" cy="258" r="2.5" fill="#fffaf0"/>
    <circle cx="58" cy="266" r="2.5" fill="#fffaf0"/>
    <ellipse cx="100" cy="272" rx="42" ry="25" fill="#2f3a2b"/>
    <path d="M118 256 A 30 30 0 0 1 134 282 L112 290 A 22 22 0 0 0 108 258 Z" fill="#23261f"/>
    <path d="M122 262 L128 262 M126 272 L132 272 M122 282 L128 282" stroke="#fffaf0" stroke-width="2" fill="none"/>
    <circle cx="144" cy="252" r="12" fill="#23261f"/>
    <path d="M136 242 L150 240" stroke="#e8590c" stroke-width="5" fill="none"/>
    <circle cx="148" cy="250" r="2.5" fill="#fffaf0"/>
    <polygon points="155,254 166,256 155,259" fill="#23261f"/>
    <line x1="92" y1="296" x2="90" y2="310" stroke="#23261f" stroke-width="2" fill="none"/>
    <line x1="108" y1="296" x2="110" y2="310" stroke="#23261f" stroke-width="2" fill="none"/>
    <text x="192" y="222" font-family="sans-serif" font-size="16" font-weight="bold" fill="#23261f" text-anchor="start">Spruce (Franklin's)</text>
    <text x="192" y="244" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Dark. Male: black breast</text>
    <text x="192" y="264" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">edged white, red comb over</text>
    <text x="192" y="284" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">the eye, white spots above</text>
    <text x="192" y="304" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">a dark tail. Very tame.</text>
  </g>

  <!-- Dusky (blue) grouse -->
  <g>
    <line x1="10" y1="500" x2="390" y2="500" stroke="#8a9a6b" stroke-width="2" fill="none"/>
    <path d="M56 434 L30 412 L40 456 Z" fill="#23261f"/>
    <path d="M38 420 L30 412 L34 426 Z" fill="#8a9a6b"/>
    <ellipse cx="102" cy="436" rx="50" ry="30" fill="#4b5560"/>
    <circle cx="156" cy="412" r="14" fill="#4b5560"/>
    <path d="M146 400 L162 398" stroke="#e8b00c" stroke-width="5" fill="none"/>
    <circle cx="160" cy="410" r="2.5" fill="#23261f"/>
    <polygon points="168,414 180,416 168,419" fill="#23261f"/>
    <line x1="92" y1="464" x2="90" y2="478" stroke="#23261f" stroke-width="2" fill="none"/>
    <line x1="112" y1="464" x2="114" y2="478" stroke="#23261f" stroke-width="2" fill="none"/>
    <text x="192" y="378" font-family="sans-serif" font-size="16" font-weight="bold" fill="#23261f" text-anchor="start">Dusky (blue) grouse</text>
    <text x="192" y="400" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Biggest. Plain grey.</text>
    <text x="192" y="420" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Yellow to orange comb.</text>
    <text x="192" y="440" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Dark tail, pale grey band</text>
    <text x="192" y="460" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">at the tip. Hen mottled.</text>
    <text x="192" y="484" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start">Walks uphill into conifers in fall.</text>
  </g>

  <!-- Sharp tailed grouse -->
  <g>
    <line x1="10" y1="660" x2="390" y2="660" stroke="#8a9a6b" stroke-width="2" fill="none"/>
    <polygon points="60,598 30,590 58,612" fill="#6b4f35"/>
    <polygon points="34,591 30,590 36,594" fill="#fffaf0"/>
    <ellipse cx="100" cy="602" rx="42" ry="25" fill="#c9b48a"/>
    <path d="M60 590 A 42 25 0 0 0 60 614 L100 627 A 42 25 0 0 0 142 602 L140 596 Z" fill="#c9b48a"/>
    <g fill="#6b4f35">
      <circle cx="78" cy="604" r="2.5"/><circle cx="88" cy="612" r="2.5"/><circle cx="98" cy="606" r="2.5"/><circle cx="108" cy="614" r="2.5"/><circle cx="118" cy="606" r="2.5"/><circle cx="92" cy="620" r="2.5"/><circle cx="110" cy="622" r="2.5"/>
    </g>
    <circle cx="144" cy="582" r="12" fill="#c9b48a"/>
    <circle cx="148" cy="580" r="2.5" fill="#23261f"/>
    <polygon points="155,584 166,586 155,589" fill="#23261f"/>
    <line x1="92" y1="626" x2="90" y2="640" stroke="#23261f" stroke-width="2" fill="none"/>
    <line x1="108" y1="626" x2="110" y2="640" stroke="#23261f" stroke-width="2" fill="none"/>
    <text x="192" y="548" font-family="sans-serif" font-size="16" font-weight="bold" fill="#23261f" text-anchor="start">Sharp tailed grouse</text>
    <text x="192" y="570" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Pale, spotted belly.</text>
    <text x="192" y="590" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Short pointed tail, white</text>
    <text x="192" y="610" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">outer feathers in flight.</text>
    <text x="192" y="634" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start">Open only in MU 3-30 and 3-31.</text>
  </g>

  <!-- Ptarmigan, winter -->
  <g>
    <polygon points="62,758 34,748 58,770" fill="#23261f"/>
    <ellipse cx="100" cy="762" rx="40" ry="24" fill="#fffaf0" stroke="#23261f" stroke-width="2"/>
    <circle cx="142" cy="744" r="12" fill="#fffaf0" stroke="#23261f" stroke-width="2"/>
    <circle cx="146" cy="742" r="2.5" fill="#23261f"/>
    <polygon points="153,746 164,748 153,751" fill="#23261f"/>
    <path d="M86 784 L84 798 L72 800 M112 784 L114 798 L126 800" stroke="#23261f" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text x="192" y="710" font-family="sans-serif" font-size="16" font-weight="bold" fill="#23261f" text-anchor="start">Ptarmigan (alpine)</text>
    <text x="192" y="732" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Mottled in summer, white by</text>
    <text x="192" y="752" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">late fall. Feathered feet.</text>
    <text x="192" y="772" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">White tailed: white tail.</text>
    <text x="192" y="792" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Willow and rock: black tail.</text>
  </g>
</svg>
