<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 372" font-family="sans-serif" role="img" aria-label="Comparison of grounds. Wet snow: great detail, ages medium, beware melt out. Powder: blurry prints, depth only. Mud: great detail, ages slowest, looks fresh for days. Wet sand: good detail, edges dry fast. Dry sand: shapeless bowls, read the pattern. Dust: fine detail, wind erases it fast. Leaf litter: no prints, read disturbance.">
<rect x="0" y="0" width="400" height="372" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Every ground, one table</text>
<text x="20" y="60" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Ground</text><text x="150" y="60" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Detail</text><text x="260" y="60" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Ages</text><rect x="8" y="70" width="384" height="34" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="92.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Wet snow</text><text x="150" y="92.0" font-size="14" fill="#23261f" text-anchor="start">great</text><text x="260" y="85" font-size="14" fill="#23261f" text-anchor="start">medium,</text><text x="260" y="101" font-size="14" fill="#23261f" text-anchor="start">melts out</text><rect x="8" y="108" width="384" height="34" rx="6" fill="#f3f1e6" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="130.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Powder</text><text x="150" y="130.0" font-size="14" fill="#23261f" text-anchor="start">blurry</text><text x="260" y="130.0" font-size="14" fill="#23261f" text-anchor="start">covered fast</text><rect x="8" y="146" width="384" height="34" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="168.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Mud</text><text x="150" y="168.0" font-size="14" fill="#23261f" text-anchor="start">great</text><text x="260" y="161" font-size="14" fill="#23261f" text-anchor="start">slowest,</text><text x="260" y="177" font-size="14" fill="#23261f" text-anchor="start">looks fresh</text><rect x="8" y="184" width="384" height="34" rx="6" fill="#f3f1e6" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="206.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Wet sand</text><text x="150" y="206.0" font-size="14" fill="#23261f" text-anchor="start">good</text><text x="260" y="206.0" font-size="14" fill="#23261f" text-anchor="start">edges dry fast</text><rect x="8" y="222" width="384" height="34" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="244.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Dry sand</text><text x="150" y="244.0" font-size="14" fill="#23261f" text-anchor="start">bowls only</text><text x="260" y="244.0" font-size="14" fill="#23261f" text-anchor="start">fast</text><rect x="8" y="260" width="384" height="34" rx="6" fill="#f3f1e6" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="282.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Dust</text><text x="150" y="282.0" font-size="14" fill="#23261f" text-anchor="start">fine</text><text x="260" y="282.0" font-size="14" fill="#23261f" text-anchor="start">wind erases</text><rect x="8" y="298" width="384" height="34" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="20" y="320.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Leaves, duff</text><text x="150" y="320.0" font-size="14" fill="#23261f" text-anchor="start">none</text><text x="260" y="320.0" font-size="14" fill="#23261f" text-anchor="start">read disturbance</text><text x="200" y="354" font-size="14" fill="#6b4f35" text-anchor="middle">Certainty 60 to 70%, see More</text>
</svg>
