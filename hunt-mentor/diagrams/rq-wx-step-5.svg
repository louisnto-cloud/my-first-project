<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Step 5 of reading a forecast for hunting: Match a spot to the weather. Spot A for this wind, spot B for the other.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="30" cy="30" r="20" fill="#e8590c"/>
<text x="30" y="37" font-family="sans-serif" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
<text x="60" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Match a spot to the weather</text>
<g transform="translate(150 180) scale(2.2)"><g><path d="M0 0 l-7 -12 a8 8 0 1 1 14 0 Z" fill="#e8590c"/><circle cx="0" cy="-15" r="3" fill="#fff"/></g></g><g transform="translate(250 180) scale(2.2)"><g><path d="M0 0 l-7 -12 a8 8 0 1 1 14 0 Z" fill="#4a7fb0"/><circle cx="0" cy="-15" r="3" fill="#fff"/></g></g><text x="150" y="110" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Plan A</text><text x="250" y="110" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Plan B</text><text x="200" y="225" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pick the spot that fits</text>
<text x="200" y="288" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Spot A for this wind, spot B for the other.</text>
</svg>
