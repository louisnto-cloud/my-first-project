<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" font-family="sans-serif" role="img" aria-label="Bird&#x27;s eye view of a funnel. At the top, bedding timber on the cool north slope. Below it, two high points with a saddle between them. Deer lines come out of the timber and through the saddle, cross a bench, and every line meets at a creek crossing, the pinch point, then goes on down to the feeding area: grassland, a cut block or a hayfield. You sit beside the crossing, 100 to 150 m off and downwind, a tip. Bed above, feed below. Sit beside it, not on it.">
