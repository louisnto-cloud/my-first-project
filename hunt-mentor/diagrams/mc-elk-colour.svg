<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Colour strip. Top row, what you see: blue, green, yellow, orange, red. Bottom row, what an elk likely sees as a dichromat: blue stays clear, while green, yellow, orange and red turn into dull yellowish greys. Motion and outline give a hunter away more than colour. This is a simulation, not a photo.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Colour: what an elk likely sees</text><rect x="112" y="50" width="50" height="56" rx="6" fill="#2f5fb3"/><rect x="112" y="140" width="50" height="56" rx="6" fill="#2f5fb3"/><text x="137" y="126" font-size="14" fill="#23261f" text-anchor="middle">Blue</text><rect x="168" y="50" width="50" height="56" rx="6" fill="#3a9a4a"/><rect x="168" y="140" width="50" height="56" rx="6" fill="#9a9a6a"/><text x="193" y="126" font-size="14" fill="#23261f" text-anchor="middle">Green</text><rect x="224" y="50" width="50" height="56" rx="6" fill="#e8d23a"/><rect x="224" y="140" width="50" height="56" rx="6" fill="#c9c06a"/><text x="249" y="126" font-size="14" fill="#23261f" text-anchor="middle">Yellow</text><rect x="280" y="50" width="50" height="56" rx="6" fill="#e8590c"/><rect x="280" y="140" width="50" height="56" rx="6" fill="#9a9470"/><text x="305" y="126" font-size="14" fill="#23261f" text-anchor="middle">Orange</text><rect x="336" y="50" width="50" height="56" rx="6" fill="#c0392b"/><rect x="336" y="140" width="50" height="56" rx="6" fill="#7a7666"/><text x="361" y="126" font-size="14" fill="#23261f" text-anchor="middle">Red</text><text x="14" y="84" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">You</text><text x="14" y="166" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Elk</text><text x="14" y="184" font-size="14" fill="#2f3a2b" text-anchor="start">(likely)</text><text x="200" y="230" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Two colour types of cone: blue is clear,</text><text x="200" y="250" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">red and orange look dull (80%)</text><text x="200" y="276" font-size="14" fill="#6b4f35" text-anchor="middle">Motion and outline give you away (Tip)</text><text x="200" y="294" font-size="14" fill="#6b4f35" text-anchor="middle">Simulation, not a photo (Tip)</text>
</svg>
