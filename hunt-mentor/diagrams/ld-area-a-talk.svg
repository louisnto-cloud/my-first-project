<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 548" font-family="sans-serif" role="img" aria-label="Cards for Area A hunter talk, leads not facts. Check land status before you go. MU means Management Unit. Jamieson Creek, MU 3-28: deer winter range in a 1976 study, 80 percent, forum mule deer 50 percent. Barriere Lakes and the Chu Chua road ridges, MU 3-38: blog 2011, moose, mule deer and black bear, 55 percent. Deadman River, Red Lake, Criss Creek, MU 3-29: blog 2011, mule deer and some moose, 55 percent. Little Fort to Clearwater: heavily hunted, blog 2011, 55 percent. Paul Lake, Pinantan, Heffley, MU 3-27: forum mule deer, 50 percent. Bonaparte Plateau: a provincial moose research area, 85 percent, research not a tip.">
