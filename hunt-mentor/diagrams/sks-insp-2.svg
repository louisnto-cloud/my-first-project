<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 2. A bolt drawn side on with the firing pin inside shown as an orange dashed line and arrows showing it should slide. A green tick: it rattles, the pin moves freely. A red cross: silent or stuck, do not load.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<circle cx="26.0" cy="22.0" r="13" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="26.0" y="27.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="46.0" y="28.0" font-size="17" font-weight="bold" fill="#1F3D2B" text-anchor="start">Shake the bolt: hear the pin</text><polygon points="90.0,134.3 104.0,120.0 310.0,120.0 310.0,177.2 90.0,177.2" fill="#D9DCD7" stroke="#17201A" stroke-width="1.5" stroke-linejoin="round"/><line x1="94.0" y1="151.5" x2="306.0" y2="151.5" stroke="#FF6A13" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 4"/><rect x="288.0" y="171.2" width="20.0" height="7.0" rx="0" fill="#59625C" stroke="#17201A" stroke-width="1"/><line x1="150.0" y1="100.0" x2="116.0" y2="100.0" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><polygon points="110.0,100.0 120.8,94.8 120.8,105.2" fill="#FF6A13" stroke="#FF6A13" stroke-width="1" stroke-linejoin="round"/><line x1="250.0" y1="100.0" x2="284.0" y2="100.0" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><polygon points="290.0,100.0 279.2,105.2 279.2,94.8" fill="#FF6A13" stroke="#FF6A13" stroke-width="1" stroke-linejoin="round"/><text x="200.0" y="92.0" font-size="14" font-weight="bold" fill="#FF6A13" text-anchor="middle">pin slides free</text><circle cx="60.0" cy="214.0" r="11.0" fill="#2E7D4F" stroke="#FFFFFF" stroke-width="2"/><path d="M55.0 214.0 l4.0 4.0 l7.0 -8.0" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/><text x="80.0" y="219.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Rattles: the pin moves freely</text><circle cx="60.0" cy="248.0" r="11.0" fill="#B3261E" stroke="#FFFFFF" stroke-width="2"/><line x1="55.5" y1="243.5" x2="64.5" y2="252.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/><line x1="64.5" y1="243.5" x2="55.5" y2="252.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/><text x="80.0" y="253.0" font-size="14" font-weight="bold" fill="#B3261E" text-anchor="start">Silent or stuck: do not load</text>
<text x="200.0" y="288.0" font-size="14" fill="#17201A" text-anchor="middle">A stuck pin can fire when the bolt closes.</text>
</svg>
