<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 298" font-family="sans-serif" role="img" aria-label="Slope steepness colours in the Hunt Map: no colour under 15 degrees, easy walking; yellow 15 to 25, steady climb; orange 25 to 30, steep; red 30 to 45, very steep, avalanche terrain in snow; purple over 45, cliffy, scrambling.">
<rect width="400" height="298" fill="#fffaf0"/>
<text x="14" y="28" font-size="18" font-weight="bold" fill="#2f3a2b">Slope steepness colours</text>
<rect x="8" y="44" width="384" height="44" rx="6" fill="#f4eedf"/>
<rect x="16" y="51.0" width="44" height="30" rx="4" fill="#ffffff" stroke="#2f3a2b" stroke-width="1.5"/>
<text x="72" y="72" font-size="16" font-weight="bold" fill="#2f3a2b">Under 15°</text>
<text x="176" y="72" font-size="16" fill="#2f3a2b">no colour, easy walking</text>
<rect x="16" y="99.0" width="44" height="30" rx="4" fill="#f2c70c" stroke="#2f3a2b" stroke-width="1.5"/>
<text x="72" y="120" font-size="16" font-weight="bold" fill="#2f3a2b">15 to 25°</text>
<text x="176" y="120" font-size="16" fill="#2f3a2b">steady climb</text>
<rect x="8" y="140" width="384" height="44" rx="6" fill="#f4eedf"/>
<rect x="16" y="147.0" width="44" height="30" rx="4" fill="#f08c00" stroke="#2f3a2b" stroke-width="1.5"/>
<text x="72" y="168" font-size="16" font-weight="bold" fill="#2f3a2b">25 to 30°</text>
<text x="176" y="168" font-size="16" fill="#2f3a2b">steep</text>
<rect x="16" y="199.0" width="44" height="30" rx="4" fill="#e03131" stroke="#2f3a2b" stroke-width="1.5"/>
<text x="72" y="220" font-size="16" font-weight="bold" fill="#2f3a2b">30 to 45°</text>
<text x="176" y="210" font-size="16" fill="#2f3a2b">very steep, avalanche</text>
<text x="176" y="230" font-size="16" fill="#2f3a2b">terrain in snow</text>
<rect x="8" y="244" width="384" height="44" rx="6" fill="#f4eedf"/>
<rect x="16" y="251.0" width="44" height="30" rx="4" fill="#8e44d6" stroke="#2f3a2b" stroke-width="1.5"/>
<text x="72" y="272" font-size="16" font-weight="bold" fill="#2f3a2b">Over 45°</text>
<text x="176" y="272" font-size="16" fill="#2f3a2b">cliffy, scrambling</text>
</svg>
