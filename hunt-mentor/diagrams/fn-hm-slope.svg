<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Slope steepness colours in the Hunt Map: no colour under 15 degrees, yellow 15 to 25, orange 25 to 30, red 30 to 45, avalanche terrain in snow, purple over 45, cliffy.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="36" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Slope steepness colours</text><rect x="20" y="60" width="40" height="32" rx="4" fill="#ffffff" stroke="#2f3a2b" stroke-width="1.5"/><text x="72" y="81" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Under 15°</text><text x="170" y="81" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">no colour, easy walking</text><rect x="20" y="106" width="40" height="32" rx="4" fill="#f2c70c" stroke="#2f3a2b" stroke-width="1.5"/><text x="72" y="127" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">15 to 25°</text><text x="170" y="127" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">steady climb</text><rect x="20" y="152" width="40" height="32" rx="4" fill="#f08c00" stroke="#2f3a2b" stroke-width="1.5"/><text x="72" y="173" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">25 to 30°</text><text x="170" y="173" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">steep</text><rect x="20" y="198" width="40" height="32" rx="4" fill="#e03131" stroke="#2f3a2b" stroke-width="1.5"/><text x="72" y="219" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">30 to 45°</text><text x="170" y="219" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">very steep, avalanche terrain in snow</text><rect x="20" y="244" width="40" height="32" rx="4" fill="#8e44d6" stroke="#2f3a2b" stroke-width="1.5"/><text x="72" y="265" font-family="sans-serif" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Over 45°</text><text x="170" y="265" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">cliffy, scrambling</text>
</svg>
