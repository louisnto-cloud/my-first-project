<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two hides seen from the side with a duck circling above. Left, crossed: the hunter looks up with a shiny face in an open topped hide; the duck sees straight in. Right, ticked: the hunter keeps the head down under a brim and a cover roof; the duck sees only grass. Watch with your eyes, not your head, a tip."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">They look DOWN into your hide</text><rect x="10" y="200" width="180" height="40" fill="#4a7fb0" opacity=".5"/><rect x="40" y="150" width="120" height="60" rx="6" fill="#9a8a5a"/><rect x="84" y="160" width="32" height="44" rx="8" fill="#6b6f4a"/><circle cx="100" cy="148" r="12" fill="#f6d7b0"/><circle cx="100" cy="148" r="16" fill="none" stroke="#ffe08a" stroke-width="3"/><g transform="translate(140 62) scale(0.6) rotate(150)"><path d="M8 5.3999999999999995 L3 26.4 L-14 44.0 L-12 26.4 L-15 5.3999999999999995 Z" fill="#8b5a2b"/><path d="M8 -5.3999999999999995 L3 -26.4 L-14 -44.0 L-12 -26.4 L-15 -5.3999999999999995 Z" fill="#8b5a2b"/><ellipse cx="0" cy="0" rx="22.0" ry="9" fill="#8b5a2b"/><path d="M-19.0 -4.5 L-30.0 0 L-19.0 4.5 Z" fill="#8b5a2b"/><rect x="18.0" y="-3.15" width="14" height="6.3" fill="#8b5a2b"/><circle cx="32.0" cy="0" r="7" fill="#8b5a2b"/><path d="M38.0 -2.5 L46.0 -2.0 L46.0 2.0 L38.0 2.5 Z" fill="#2f3a2b"/></g><line x1="132" y1="70" x2="104" y2="140" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 4" fill="none"/><path d="M32 252 l16 16 M48 252 l-16 16" stroke="#e8590c" stroke-width="4" fill="none"/><text x="110" y="266" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Face up, open top</text><rect x="210" y="200" width="180" height="40" fill="#4a7fb0" opacity=".5"/><rect x="240" y="150" width="120" height="60" rx="6" fill="#9a8a5a"/><path d="M238 150 Q300 120 362 150" stroke=