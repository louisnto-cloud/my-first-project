<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 444" font-family="sans-serif" role="img" aria-label="Elevation chart in metres, 85 percent, BC Breeding Bird Atlas. Ruffed grouse are most abundant from 750 to 1,250 metres. Dusky grouse breed from about 500 to 2,250 metres. Spruce grouse live up to 2,500 metres, drawn as a dashed bar because no lower limit is given. White tailed ptarmigan breed from 1,830 to 2,650 metres in the Interior. Ruffed grouse like aspen near water; spruce grouse like pine and spruce.">
