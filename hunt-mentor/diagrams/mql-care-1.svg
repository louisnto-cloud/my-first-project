<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bird care step 1: cool it fast. Put the bird in a game vest with a mesh back, not a plastic bag, and keep it out of the October sun. Tip.">
