<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" font-family="sans-serif" role="img" aria-label="A 24 hour clock of a grouse day, hunter lore, 75 percent. About 6 to 9 am: feed and pick grit on edges and roads. About 9 am to 3 pm: rest and dust bathe. About 3 pm to dusk: feed again. Night: roost in trees or snow. Legal hunting hours: 1 hour before sunrise to 1 hour after sunset. Tip: at midday spruce and dusky grouse often sit in trees, which is your .22 time.">
<rect width="400" height="430" fill="#fffaf0"/>
<text x="200" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A grouse day (hunter lore, 75%)</text>
