<path d="M304.0 168.0 A104 104 0 0 1 273.5 241.5 L233.9 201.9 A48 48 0 0 0 248.0 168.0z" fill="#e9c46a" stroke="#fffaf0" stroke-width="2.5"/>
<path d="M273.5 241.5 A104 104 0 0 1 126.5 241.5 L166.1 201.9 A48 48 0 0 0 233.9 201.9z" fill="#8a9a6b" stroke="#fffaf0" stroke-width="2.5"/>
<path d="M126.5 241.5 A104 104 0 0 1 96.0 168.0 L152.0 168.0 A48 48 0 0 0 166.1 201.9z" fill="#e9c46a" stroke="#fffaf0" stroke-width="2.5"/>
<text x="200" y="97" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Roost</text>
<text x="270.2" y="202.1" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Feed</text>
<text x="200" y="249" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">Rest, dust</text>
<text x="129.8" y="202.1" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Feed</text>
<circle cx="153.7" cy="107.7" r="8" fill="#f3e7b3"/><circle cx="157.3" cy="105.7" r="6.8" fill="#3d4f6b"/>
<circle cx="246.3" cy="107.7" r="1.6" fill="#e9e4cf"/><circle cx="232.3" cy="115.7" r="1.3" fill="#e9e4cf"/>
<circle cx="200" cy="168" r="46" fill="#fffaf0"/>
<text x="200" y="174" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">24 hours</text>
<text x="200" y="48" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Midnight</text>
<text x="320" y="173" font-size="15" font-weight="bold" fill="#2f3a2b">6 am</text>
<text x="200" y="300" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Noon</text>
<text x="80" y="173" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="end">6 pm</text>
<rect x="8" y="316" width="384" height="34" rx="6" fill="#f4eedf"/>
<circle cx="20" cy="336" r="3" fill="#8f8d86"/><circle cx="27" cy="330" r="2.6" fill="#8f8d86"/><circle cx="32" cy="337" r="2.2" fill="#8f8d86"/><circle cx="25" cy="339" r="1.8" fill="#8f8d86"/>
<text x="46" y="338" font-size="15" fill="#2f3a2b">Morning feed includes grit on road edges.</text>
