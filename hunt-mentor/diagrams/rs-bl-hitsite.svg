g in hoofs</text><rect x="330" y="180" width="8" height="6" rx="8" fill="#f2efe6"/><rect x="344" y="190" width="6" height="5" rx="8" fill="#f2efe6"/><text x="345" y="220" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">bone chips</text><text x="200" y="286" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Flag it. Search a 3 m circle before you follow (Tip)</text>
