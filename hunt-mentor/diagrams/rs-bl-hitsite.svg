<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" font-family="sans-serif" role="img" aria-label="Hit site map: the dug in hoof prints where it stood and launched, cut hair, a spray of blood beyond, and small white bone chips. Flag it and search a 3 metre circle before you follow.">
