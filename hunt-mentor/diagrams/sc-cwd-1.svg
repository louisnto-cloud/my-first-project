<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Step 1 of submitting a head for CWD testing: cut the head off with at least three inches, about 8 centimetres, of neck still attached. That keeps the tissue at the back of the throat that the lab tests, 95 percent." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Step 1: head off, 8 cm of neck</text>
<g transform="translate(190 150) scale(1.4)"><path d="M10,10 L60,20 L60,70 L0,50 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="2"/><path d="M10,10 C0,-10 -30,-14 -60,0 L-80,14 L-76,26 L-50,28 L-10,40 L14,40 Z" fill="#a0703a" stroke="#23261f" stroke-width="2"/><circle cx="-30" cy="6" r="4" fill="#23261f"/><path d="M-6,-6 L4,-24 L16,-10 Z" fill="#a0703a" stroke="#23261f" stroke-width="2"/><circle cx="-78" cy="18" r="3" fill="#23261f"/><path d="M-14,-8 C-10,-40 10,-56 30,-60 M-6,-34 L-24,-50 M10,-50 L6,-70 M24,-58 L40,-72" fill="none" stroke="#c9a06a" stroke-width="5" stroke-linecap="round"/></g>
<path d="M275 150 L285 260" stroke="#e8590c" stroke-width="3" stroke-dasharray="8 5"/>
<path d="M215 230 L280 238" stroke="#4a7fb0" stroke-width="3"/><path d="M215 222 v16 M280 230 v16" stroke="#4a7fb0" stroke-width="3"/>
<text x="248" y="262" font-size="14" fill="#4a7fb0" text-anchor="middle" font-weight="bold">at least 8 cm (3 in)</text>
<text x="330" y="140" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Cut here</text>
<rect x="10" y="268" width="380" height="28" rx="6" fill="#f3ead8" stroke="#2f3a2b" stroke-width="2"/>
<text x="200.0" y="286.9" font-size="14" fill="#23261f" text-anchor="middle">Keeps the throat tissue the lab tests (95%)</text>
</svg>
