<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Function check in 6 steps: 1 unloaded, muzzle safe. 2 operating handle back and hold it. 3 press the magazine follower down. 4 let the bolt go forward. 5 safety on, press the trigger: the hammer must not fall. 6 safety off, press the trigger: the hammer falls.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Function check after every rebuild</text>
<circle cx="36.0" cy="52.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="36.0" y="57.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="56.0" y="57.0" font-size="14" fill="#17201A" text-anchor="start">Unloaded. Muzzle safe.</text><circle cx="36.0" cy="80.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="36.0" y="85.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="56.0" y="85.0" font-size="14" fill="#17201A" text-anchor="start">Handle back and hold it.</text><circle cx="36.0" cy="108.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="36.0" y="113.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="56.0" y="113.0" font-size="14" fill="#17201A" text-anchor="start">Press the follower down.</text><circle cx="36.0" cy="136.0" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="36.0" y="141.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="56.0" y="141.0" font-size="14" fill="#17201A" text-anchor="start">Let the bolt go forward.</text><circle cx="36.0" cy="164.0" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="2"/><text x="36.0" y="169.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text><text x="56.0" y="169.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Safety ON. Press trigger:</text><text x="56.0" y="197.0" font-size="14" font-weight="bold" fill="#FF6A13" text-anchor="start">hammer must NOT fall.</text><circle cx="36.0" cy="220.0" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="2"/><text x="36.0" y="225.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text><text x="56.0" y="225.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="start">Safety OFF. Press trigger:</text><text x="56.0" y="253.0" font-size="14" font-weight="bold" fill="#FF6A13" text-anchor="start">hammer falls.</text>
<text x="200.0" y="288.0" font-size="14" fill="#17201A" text-anchor="middle">Hammer falls on SAFE? Gunsmith.</text>
</svg>
