<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Stay dry step 4: put the warm jacket on the moment you stop, and sit on a foam pad.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4. Puffy on when you stop</text><rect x="0" y="230" width="400" height="70" rx="0" fill="#dfe6d3"/><rect x="110" y="214" width="70" height="12" rx="4" fill="#8a9a6b"/><line x1="140" y1="214" x2="169" y2="214" stroke="#2f3a2b" stroke-width="8.4" stroke-linecap="round"/><line x1="169" y1="214" x2="171" y2="236" stroke="#2f3a2b" stroke-width="8.4" stroke-linecap="round"/><rect x="128" y="173" width="24" height="41" rx="7.199999999999999" fill="#7c5a99"/><circle cx="140" cy="161" r="12.0" fill="#d9b48f"/><text x="290" y="120" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Before you</text><text x="290" y="142" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">feel cold</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Puffy on, pad under, right away</text>
</svg>
