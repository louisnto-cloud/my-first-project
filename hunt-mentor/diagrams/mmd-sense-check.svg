<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Flow of how a deer checks a threat, opinion based on alarm behaviour. Ears: it hears a click. Eyes: it stares and head bobs. Nose: it circles to get downwind of you. Go: it stots away to cover. Freeze at the ear and eye steps; once the nose confirms, the hunt is over.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">How it checks a threat (Tip)</text><rect x="40" y="44" width="320" height="46" rx="10" fill="#8a9a6b" opacity=".9"/><text x="60" y="74" font-size="17" fill="#fffaf0" text-anchor="start" font-weight="bold">Ears</text><text x="150" y="74" font-size="16" fill="#fffaf0" text-anchor="start">hears a click</text><line x1="200" y1="90" x2="200" y2="102" stroke="#23261f" stroke-width="2"/><polygon points="200.0,102.0 195.7,93.0 204.3,93.0" fill="#23261f"/><rect x="40" y="102" width="320" height="46" rx="10" fill="#4a7fb0" opacity=".9"/><text x="60" y="132" font-size="17" fill="#fffaf0" text-anchor="start" font-weight="bold">Eyes</text><text x="150" y="132" font-size="16" fill="#fffaf0" text-anchor="start">stares, head bob</text><line x1="200" y1="148" x2="200" y2="160" stroke="#23261f" stroke-width="2"/><polygon points="200.0,160.0 195.7,151.0 204.3,151.0" fill="#23261f"/><rect x="40" y="160" width="320" height="46" rx="10" fill="#e8590c" opacity=".9"/><text x="60" y="190" font-size="17" fill="#fffaf0" text-anchor="start" font-weight="bold">Nose</text><text x="150" y="190" font-size="16" fill="#fffaf0" text-anchor="start">circles to wind you</text><line x1="200" y1="206" x2="200" y2="218" stroke="#23261f" stroke-width="2"/><polygon points="200.0,218.0 195.7,209.0 204.3,209.0" fill="#23261f"/><rect x="40" y="218" width="320" height="46" rx="10" fill="#8b5a2b" opacity=".9"/><text x="60" y="248" font-size="17" fill="#fffaf0" text-anchor="start" font-weight="bold">Go</text><text x="150" y="248" font-size="16" fill="#fffaf0" text-anchor="start">stot to cover</text><text x="200" y="290" font-size="14" fill="#23261f" text-anchor="middle">Freeze at steps 1 and 2. Nose: game over</text>
</svg>
