<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 324" font-family="sans-serif" role="img" aria-label="A height scale from 0 to 1.5 metres, drawn to scale. A deer bed: a flattened oval 0.9 to 1.2 metres long on the ground, with hair and pellets. A rub: bark scraped on a sapling from about 30 to 105 centimetres up. A scrape: a pawed patch of soil under an overhanging licking branch about 1.2 to 1.5 metres up. 60 to 70 percent. Rub height says more about the buck than tree size, 60 percent.">
