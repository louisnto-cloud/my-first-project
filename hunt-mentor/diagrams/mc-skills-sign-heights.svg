<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A height scale from 0 to 1.5 metres. A deer bed: a flattened oval 0.9 to 1.2 metres long on the ground. A rub: bark scraped on a sapling from about 30 to 105 centimetres up. A scrape: a pawed patch of soil under an overhanging licking branch about 1.2 to 1.5 metres up. Rub height says more about the buck than tree size.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">How high? Beds, rubs, scrapes</text><rect x="0" y="250" width="400" height="50" fill="#dfe6d3"/><line x1="24" y1="250.0" x2="34" y2="250.0" stroke="#23261f" stroke-width="2"/><text x="38" y="255.0" font-size="14" fill="#23261f" text-anchor="start">0</text><line x1="24" y1="187.5" x2="34" y2="187.5" stroke="#23261f" stroke-width="2"/><text x="38" y="192.5" font-size="14" fill="#23261f" text-anchor="start">0.5 m</text><line x1="24" y1="125.0" x2="34" y2="125.0" stroke="#23261f" stroke-width="2"/><text x="38" y="130.0" font-size="14" fill="#23261f" text-anchor="start">1 m</text><line x1="24" y1="62.5" x2="34" y2="62.5" stroke="#23261f" stroke-width="2"/><text x="38" y="67.5" font-size="14" fill="#23261f" text-anchor="start">1.5 m</text><line x1="29" y1="250" x2="29" y2="62" stroke="#23261f" stroke-width="2"/><ellipse cx="110" cy="246" rx="50" ry="10" fill="#c9b46a" stroke="#6b4f35" stroke-width="2"/><text x="110" y="274" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Bed 0.9 to 1.2 m</text><rect x="236" y="90" width="10" height="160" fill="#6b4f35"/><rect x="234" y="118.75" width="14" height="93.75" fill="#f1e3c4"/><text x="241" y="274" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Rub 30 to 105 cm</text><path d="M290 60 Q 330 66 350 100" fill="none" stroke="#6b4f35" stroke-width="4"/><ellipse cx="350" cy="248" rx="28" ry="6" fill="#7a5a3a"/><text x="352" y="274" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Scrape</text><text x="390" y="128" font-size="14" fill="#23261f" text-anchor="end">licking branch</text><text x="390" y="146" font-size="14" fill="#e8590c" text-anchor="end" font-weight="bold">1.2 to 1.5 m</text><text x="200" y="294" font-size="14" fill="#6b4f35" text-anchor="middle">60 to 70%. Rub height beats tree size (60%)</text>
</svg>
