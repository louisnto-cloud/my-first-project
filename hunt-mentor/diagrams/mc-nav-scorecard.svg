<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Drill score card. Drill, Pass mark (Tip), Date | Compass triangle, within 10 m,  | Map vs land, 3 of 5 in 200 m,  | Phone, no signal, at the truck,  | Lost scenario, all in 30 min, . Do each twice. Write the date in the journal">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Drill score card</text><rect x="20" y="42.0" width="360" height="43.4" rx="4" fill="#2f3a2b"/><text x="28" y="69.2" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">Drill</text><text x="178" y="69.2" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">Pass mark (Tip)</text><text x="328" y="69.2" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">Date</text><rect x="20" y="88.4" width="360" height="43.4" rx="4" fill="#dfe6d3"/><text x="28" y="115.60000000000001" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Compass triangle</text><text x="178" y="115.60000000000001" font-size="15" fill="#23261f" text-anchor="start">within 10 m</text><text x="328" y="115.60000000000001" font-size="15" fill="#23261f" text-anchor="start"></text><rect x="20" y="134.8" width="360" height="43.4" rx="4" fill="#eef2e6"/><text x="28" y="162.0" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Map vs land</text><text x="178" y="162.0" font-size="15" fill="#23261f" text-anchor="start">3 of 5 in 200 m</text><text x="328" y="162.0" font-size="15" fill="#23261f" text-anchor="start"></text><rect x="20" y="181.2" width="360" height="43.4" rx="4" fill="#dfe6d3"/><text x="28" y="208.39999999999998" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Phone, no signal</text><text x="178" y="208.39999999999998" font-size="15" fill="#23261f" text-anchor="start">at the truck</text><text x="328" y="208.39999999999998" font-size="15" fill="#23261f" text-anchor="start"></text><rect x="20" y="227.6" width="360" height="43.4" rx="4" fill="#eef2e6"/><text x="28" y="254.79999999999998" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Lost scenario</text><text x="178" y="254.79999999999998" font-size="15" fill="#23261f" text-anchor="start">all in 30 min</text><text x="328" y="254.79999999999998" font-size="15" fill="#23261f" text-anchor="start"></text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Do each twice. Write the date in the journal</text>
