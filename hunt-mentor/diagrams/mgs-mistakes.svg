<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Six cards, habits geese cannot help. 1: they go back to yesterday&#x27;s field, 65 percent. 2: they land into the wind, 80 percent. 3: they fly late on cold or cloudy mornings, 80 percent. 4: they avoid edges near cover that can hide predators, a Tip. 5: they trust their own kind, a Tip. 6: same roost and same flight line, a Tip. Every habit is a place to wait for them.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">6 habits a goose cannot help</text><rect x="20" y="40" width="110" height="115" rx="10" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><circle cx="75" cy="64" r="14" fill="#e8590c"/><text x="75" y="69" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="75" y="100" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Back to</text><text x="75" y="118" font-size="13.5" fill="#23261f" text-anchor="middle">yesterday&#x27;s field</text><text x="75" y="140" font-size="14" fill="#2f3a2b" text-anchor="middle">(65%)</text><rect x="145" y="40" width="110" height="115" rx="10" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><circle cx="200" cy="64" r="14" fill="#e8590c"/><text x="200" y="69" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="200" y="100" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Lands into</text><text x="200" y="118" font-size="13.5" fill="#23261f" text-anchor="middle">the wind</text><text x="200" y="140" font-size="14" fill="#2f3a2b" text-anchor="middle">(80%)</text><rect x="270" y="40" width="110" height="115" rx="10" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><circle cx="325" cy="64" r="14" fill="#e8590c"/><text x="325" y="69" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="325" y="100" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Late on cold or</text><text x="325" y="118" font-size="13.5" fill="#23261f" text-anchor="middle">cloudy mornings</text><text x="325" y="140" font-size="14" fill="#2f3a2b" text-anchor="middle">(80%)</text><rect x="20" y="165" width="110" height="115" rx="10" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><circle cx="75" cy="189" r="14" fill="#e8590c"/><text x="75" y="194" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="75" y="225" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Avoids edges</text><text x="75" y="243" font-size="13.5" fill="#23261f" text-anchor="middle">near cover</text><text x="75" y="265" font-size="14" fill="#2f3a2b" text-anchor="middle">(Tip)</text><rect x="145" y="165" width="110" height="115" rx="10" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><circle cx="200" cy="189" r="14" fill="#e8590c"/><text x="200" y="194" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="200" y="225" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Trusts its</text><text x="200" y="243" font-size="13.5" fill="#23261f" text-anchor="middle">own kind</text><text x="200" y="265" font-size="14" fill="#2f3a2b" text-anchor="middle">(Tip)</text><rect x="270" y="165" width="110" height="115" rx="10" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><circle cx="325" cy="189" r="14" fill="#e8590c"/><text x="325" y="194" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">6</text><text x="325" y="225" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Same roost,</text><text x="325" y="243" font-size="13.5" fill="#23261f" text-anchor="middle">same flight line</text><text x="325" y="265" font-size="14" fill="#2f3a2b" text-anchor="middle">(Tip)</text><text x="200" y="294" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Every habit is a place to wait for them</text>
</svg>
