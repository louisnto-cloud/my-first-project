<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Gun mounted: the stock comes up to the cheek first, then back into the shoulder. Head stays up and still, eyes on the bird.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">3  Stock to cheek, then shoulder</text><circle cx="170" cy="92" r="10" fill="#fffaf0" stroke="#23261f" stroke-width="3.5"/><path d="M168 104 L160 180" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 180 L144 262" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 180 L188 262" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M166 112 L190 130 L222 110" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M164 114 L160 120 L172 104" fill="none" stroke="#23261f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="166" y1="104" x2="330" y2="80" stroke="#6b4f35" stroke-width="6" stroke-linecap="round"/><line x1="144" y1="264" x2="300" y2="264" stroke="#8a9a6b" stroke-width="3"/><g transform="translate(360 60) scale(0.9)"><ellipse cx="0" cy="0" rx="20" ry="8" fill="#23261f"/><circle cx="-21" cy="-5" r="6" fill="#23261f"/><path d="M-27 -5 L-36 -3 L-27 -1 Z" fill="#e8590c"/><path d="M-4 -3 L6 -24 L14 -4 Z" fill="#2f3a2b"/></g><circle cx="176" cy="102" r="12" fill="none" stroke="#e8590c" stroke-width="3"/><text x="20" y="150" font-size="15" font-weight="bold" fill="#e8590c">Bring the stock</text><text x="20" y="168" font-size="15" font-weight="bold" fill="#e8590c">up to your face.</text><text x="20" y="196" font-size="15" fill="#23261f">Do not drop your</text><text x="20" y="214" font-size="15" fill="#23261f">head to the gun.</text><text x="220" y="150" font-size="15" font-weight="bold" fill="#23261f">Head stays</text><text x="220" y="168" font-size="15" fill="#23261f">up and still</text><text x="200" y="292" font-size="14" text-anchor="middle" fill="#2f3a2b">Butt lands on the same spot every time</text>
</svg>
