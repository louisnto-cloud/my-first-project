<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 329" font-family="sans-serif" role="img" aria-label="Carry every species licence while hunting, cancelled and not, all licence year, 95 percent. Three licences: deer, cancelled; moose, not used; black bear, not used. Timeline: from the kill until the meat is eaten, keep the papers. A mounted head or tanned hide: keep the licence forever. Lost one? Replace it at FrontCounter BC or Service BC for 10 dollars, and declare the harvest from the cancelled original, 95 percent.">
<rect width="400" height="329" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Carry every licence</text>
<text x="200" y="50" font-size="15" fill="#6b5b4b" text-anchor="middle">Cancelled and not, all licence year (95%)</text>
<rect x="14.0" y="64" width="116" height="62" rx="5" fill="#fff" stroke="#2f3a2b" stroke-width="1.8"/>
<rect x="14.0" y="64" width="116" height="14" rx="5" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="1.8"/>
<text x="72" y="104" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Deer</text>
<path d="M32 114 H112" stroke="#2f3a2b" stroke-width="1.6" stroke-dasharray="2 3"/>
<path d="M60 64 L72 76 L84 64z" fill="#fffaf0" stroke="#e8590c" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M130.0 90 L119.0 97 L130.0 104z" fill="#fffaf0" stroke="#e8590c" stroke-width="2.2" stroke-linejoin="round"/>
<text x="72" y="148" font-size="16" font-weight="bold" fill="#c2410c" text-anchor="middle">cancelled</text>
<rect x="142.0" y="64" width="116" height="62" rx="5" fill="#fff" stroke="#2f3a2b" stroke-width="1.8"/>
<rect x="142.0" y="64" width="116" height="14" rx="5" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="1.8"/>
<text x="200" y="104" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Moose</text>
<path d="M160 114 H240" stroke="#2f3a2b" stroke-width="1.6" stroke-dasharray="2 3"/>
<text x="200" y="148" font-size="16" font-weight="bold" fill="#6b5b4b" text-anchor="middle">not used</text>
<rect x="270.0" y="64" width="116" height="62" rx="5" fill="#fff" stroke="#2f3a2b" stroke-width="1.8"/>
<rect x="270.0" y="64" width="116" height="14" rx="5" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="1.8"/>
<text x="328" y="104" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Black bear</text>
<path d="M288 114 H368" stroke="#2f3a2b" stroke-width="1.6" stroke-dasharray="2 3"/>
<text x="328" y="148" font-size="16" font-weight="bold" fill="#6b5b4b" text-anchor="middle">not used</text>
<path d="M30 196 H370" stroke="#2f3a2b" stroke-width="3"/>
<path d="M38 180 H190" stroke="#e8590c" stroke-width="2.4"/><path d="M198.0 180.0 L189.0 175.1 L189.0 184.9z" fill="#e8590c"/>
<text x="118" y="172" font-size="15" font-weight="bold" fill="#c2410c" text-anchor="middle">keep the papers</text>
<text x="316" y="172" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">keep forever</text>
<circle cx="30" cy="196" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="2"/>
<text x="22" y="222" font-size="16" font-weight="bold" fill="#2f3a2b">Kill</text>
<circle cx="206" cy="196" r="8" fill="#4a7fb0" stroke="#fffaf0" stroke-width="2"/>
<text x="206" y="222" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Meat eaten</text>
<circle cx="370" cy="196" r="8" fill="#2f6e3b" stroke="#fffaf0" stroke-width="2"/>
<text x="378" y="222" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="end">Mount or hide</text>
<rect x="12" y="240" width="376" height="79" rx="8" fill="#f2e9d6" stroke="#2f3a2b" stroke-width="1.4"/>
<text x="200" y="266" font-size="16" fill="#2f3a2b" text-anchor="middle">Lost one? Replace it at FrontCounter BC</text>
<text x="200" y="287" font-size="16" fill="#2f3a2b" text-anchor="middle">or Service BC for $10. Declare the</text>
<text x="200" y="308" font-size="16" fill="#2f3a2b" text-anchor="middle">harvest from the original (95%).</text>
</svg>
