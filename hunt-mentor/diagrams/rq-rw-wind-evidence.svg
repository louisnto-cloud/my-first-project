<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" font-family="sans-serif" role="img" aria-label="Bar chart of three studies on wind and deer movement. An Oklahoma GPS study over 7 years found little change with wind speed, 60 percent. A South Carolina GPS thesis found small effects in some seasons and hours, 65 percent. An older South Texas radio collar study from the 1980s found a drop at 24 to 31 kilometres an hour and a rebound above 32, 55 percent. The results are mixed. Sources are hunting magazine and thesis summaries and search previews: treat as Tip level.">
<rect width="400" height="360" fill="#fffaf0"/>
<text x="14" y="28" font-size="18" font-weight="bold" fill="#2f3a2b">Wind and deer movement: mixed</text>
<text x="386" y="54" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="end">effect on movement</text>
<text x="14" y="77" font-size="16" font-weight="bold" fill="#2f3a2b">Oklahoma GPS, 7 years</text>
<rect x="345.1" y="61" width="40.9" height="24" rx="12.0" fill="#6b5b4b"/><text x="365.6" y="78.04" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">60%</text>
<text x="14" y="99" font-size="15" fill="#2f3a2b">little change</text>
<rect x="14" y="106" width="372" height="22" rx="5" fill="#efe8d6"/><rect x="14" y="106" width="89.3" height="22" rx="5" fill="#8a9a6b"/>
<text x="111.28" y="122" font-size="15" font-weight="bold" fill="#2f3a2b">little change</text>
<text x="14" y="161" font-size="16" font-weight="bold" fill="#2f3a2b">South Carolina GPS</text>
<rect x="345.1" y="145" width="40.9" height="24" rx="12.0" fill="#6b5b4b"/><text x="365.6" y="162.04" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">65%</text>
<text x="14" y="183" font-size="15" fill="#2f3a2b">some seasons and hours</text>
<rect x="14" y="190" width="372" height="22" rx="5" fill="#efe8d6"/><rect x="14" y="190" width="156.2" height="22" rx="5" fill="#8a9a6b"/>
<text x="178.24" y="206" font-size="15" font-weight="bold" fill="#2f3a2b">small effects</text>
<text x="14" y="245" font-size="16" font-weight="bold" fill="#2f3a2b">South Texas, 1980s</text>
<rect x="345.1" y="229" width="40.9" height="24" rx="12.0" fill="#6b5b4b"/><text x="365.6" y="246.04" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">55%</text>
<text x="14" y="267" font-size="15" fill="#2f3a2b">drop at 24 to 31 km/h</text>
<rect x="14" y="274" width="372" height="22" rx="5" fill="#efe8d6"/><rect x="14" y="274" width="275.3" height="22" rx="5" fill="#e8590c"/>
<text x="297.28" y="290" font-size="15" font-weight="bold" fill="#c2410c">drop, then rebound</text>
<text x="14" y="326" font-size="14" fill="#6b5b4b">Hunting magazine and thesis summaries, search</text>
<text x="14" y="346" font-size="14" fill="#6b5b4b">previews. Treat as Tip level.</text>
</svg>
