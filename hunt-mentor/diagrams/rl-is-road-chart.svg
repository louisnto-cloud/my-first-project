<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart from one Pennsylvania public forest study. 56 percent of the ground was within 0.5 km of a road, but 73 percent of hunters hunted there. On average, the farthest hunters got from a road was 0.84 km, while they reported going about 2.5 times farther. Hunter density near roads was over 2 times higher.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Where hunters were</text><text x="388" y="24" font-size="14" fill="#2f3a2b" text-anchor="end">one Pennsylvania forest</text><text x="20" y="70" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Ground within 0.5 km of a road</text><rect x="20" y="78" width="300" height="26" rx="5" fill="#eee"/><rect x="20" y="78" width="168" height="26" rx="5" fill="#8a9a6b"/><text x="330" y="98" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">56%</text><text x="20" y="140" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">Hunters within 0.5 km of a road</text><rect x="20" y="148" width="300" height="26" rx="5" fill="#eee"/><rect x="20" y="148" width="219" height="26" rx="5" fill="#e8590c"/><text x="330" y="168" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">73%</text><text x="20" y="220" font-size="14" fill="#2f3a2b" text-anchor="start">Farthest point from a road: 0.84 km on average</text><text x="20" y="242" font-size="14" fill="#2f3a2b" text-anchor="start">Hunters said they went 2.5 times farther</text><text x="200" y="292" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hunter density near roads was over 2 times higher</text>
</svg>
