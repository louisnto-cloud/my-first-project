<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" role="img" aria-label="Sound chart on a frequency scale from 10 hertz to 10 kilohertz. Most birds hear best between 1 and 4 kilohertz. The grouse inner ear is tuned to low sounds below 1 kilohertz. The ruffed grouse drum is under 100 hertz. Tip: low thumps carry, like boots on rock, truck doors and voices, so talk softly and shut doors gently." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="310" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">What grouse hear</text>
<line x1="30" y1="226" x2="370" y2="226" stroke="#23261f" stroke-width="2"/>
<line x1="30.0" y1="220" x2="30.0" y2="232" stroke="#23261f" stroke-width="2"/>
<text x="30.0" y="250" font-size="14" fill="#23261f" text-anchor="middle">10 Hz</text>
<line x1="143.33333333333331" y1="220" x2="143.33333333333331" y2="232" stroke="#23261f" stroke-width="2"/>
<text x="143.33333333333331" y="250" font-size="14" fill="#23261f" text-anchor="middle">100 Hz</text>
<line x1="256.66666666666663" y1="220" x2="256.66666666666663" y2="232" stroke="#23261f" stroke-width="2"/>
<text x="256.66666666666663" y="250" font-size="14" fill="#23261f" text-anchor="middle">1 kHz</text>
<line x1="370.0" y1="220" x2="370.0" y2="232" stroke="#23261f" stroke-width="2"/>
<text x="370.0" y="250" font-size="14" fill="#23261f" text-anchor="middle">10 kHz</text>
<text x="84.07374220156174" y="70" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">Ruffed drum: under 100 Hz</text>
<rect x="84.07374220156174" y="78" width="54.07374220156174" height="22" rx="4" fill="#fbe3d3" stroke="#e8590c" stroke-width="2"/>
<text x="143.33333333333331" y="124" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Grouse inner ear: tuned below 1 kHz</text>
<rect x="143.33333333333331" y="132" width="113.33333333333331" height="22" rx="4" fill="#e8ecd9" stroke="#8a9a6b" stroke-width="2"/>
<text x="324.9001323505024" y="176" font-size="14" fill="#4a7fb0" text-anchor="end" font-weight="bold">Most birds hear best: 1 to 4 kHz</text>
<rect x="256.66666666666663" y="184" width="68.23346568383579" height="22" rx="4" fill="#cfe0ef" stroke="#4a7fb0" stroke-width="2"/>
<text x="20" y="280" font-size="14" fill="#23261f" text-anchor="start">Low thumps carry: boots on rock, truck doors,</text>
<text x="20" y="298" font-size="14" fill="#23261f" text-anchor="start">voices. Talk soft, shut doors gently (Tip).</text>
</svg>
