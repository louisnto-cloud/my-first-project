<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Field care step 3: take the breast out and keep the legs. A big Canada goose gives about 1 kilogram of boned breast, 60 percent, hunter estimates. Slow cook the legs, a Tip.">
