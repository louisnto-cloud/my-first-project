<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Chart of elevation by month. California quail stay in a band from about 250 to 750 metres all year with no migration, BC atlas and the app migration data, 60 to 85 percent. A dashed chukar line drops lower in midwinter: chukar move down to lower ground in heavy snow, US Forest Service FEIS, 80 percent. The chukar line is a sketch; there are no BC numbers.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Elevation by month (general pattern)</text>
<line x1="70" y1="50" x2="70" y2="240" stroke="#2f3a2b" stroke-width="2"/>
<line x1="70" y1="240" x2="386" y2="240" stroke="#2f3a2b" stroke-width="2"/>
<line x1="66" y1="220.0" x2="386" y2="220.0" stroke="#d8d2c4" stroke-width="1"/>
<text x="62" y="225.0" font-size="14" fill="#2f3a2b" text-anchor="end">250 m</text>
<line x1="66" y1="170.0" x2="386" y2="170.0" stroke="#d8d2c4" stroke-width="1"/>
<text x="62" y="175.0" font-size="14" fill="#2f3a2b" text-anchor="end">500 m</text>
<line x1="66" y1="120.0" x2="386" y2="120.0" stroke="#d8d2c4" stroke-width="1"/>
<text x="62" y="125.0" font-size="14" fill="#2f3a2b" text-anchor="end">750 m</text>
<line x1="66" y1="70.0" x2="386" y2="70.0" stroke="#d8d2c4" stroke-width="1"/>
<text x="62" y="75.0" font-size="14" fill="#2f3a2b" text-anchor="end">1000 m</text>
<text x="84.0" y="258" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">J</text>
<text x="109.5" y="258" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">F</text>
<text x="135.0" y="258" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">M</text>
<text x="160.5" y="258" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A</text>
<text x="186.0" y="258" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">M</text>
<text x="211.5" y="258" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">J</text>
<text x="237.0" y="258" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">J</text>
<text x="262.5" y="258" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A</text>
<text x="288.0" y="258" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">S</text>
<text x="313.5" y="258" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">O</text>
<text x="339.0" y="258" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">N</text>
<text x="364.5" y="258" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">D</text>
<rect x="72" y="120.0" width="312" height="100.0" fill="#e8590c" opacity=".35"/>
<text x="228" y="170" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">California quail: 250 to 750 m all year</text>
<text x="228" y="188" font-size="14" fill="#2f3a2b" text-anchor="middle">(no migration, 60 to 85%)</text>
<path d="M72 130 L150 128 L220 100 L300 110 L384 135" fill="none" stroke="#a33b2a" stroke-width="4" stroke-dasharray="9 6"/>
<text x="384" y="82" font-size="14" font-weight="bold" fill="#a33b2a" text-anchor="end">chukar: lower in deep snow</text>
<text x="200" y="288" font-size="14" fill="#2f3a2b" text-anchor="middle">Chukar line: a sketch, no BC data (FEIS 80%)</text>
</svg>
