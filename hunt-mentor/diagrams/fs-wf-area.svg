<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="An area restriction order around a wildfire: a dashed boundary on the map. No one may enter or stay without written permission, and that includes hunting. Tickets have been $1,150. Orders can stay in place after evacuation orders end.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Area restriction: no entry</text><rect x="20" y="44" width="360" height="196" rx="8" fill="#dfe6d3"/><path d="M80 70 L300 60 L340 210 L60 220 Z" fill="#fbe9e7" stroke="#c0392b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><path d="M186 150 Q181 126 200 105 Q219 126 214 150 Z" fill="#e8590c"/><path d="M193 150 Q190 137 200 124 Q210 137 207 150 Z" fill="#f6c344"/><line x1="20" y1="120" x2="380" y2="110" stroke="#c8c8c8" stroke-width="6" stroke-linecap="round"/><text x="360" y="100" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">road</text><line x1="25" y1="230" x2="28" y2="212" stroke="#2f3a2b" stroke-width="4.2" stroke-linecap="round"/><line x1="35" y1="230" x2="32" y2="212" stroke="#2f3a2b" stroke-width="4.2" stroke-linecap="round"/><rect x="23" y="196" width="13" height="18" rx="3.5999999999999996" fill="#e8590c"/><line x1="24" y1="198" x2="19" y2="211" stroke="#2f3a2b" stroke-width="3.5999999999999996" stroke-linecap="round"/><line x1="36" y1="198" x2="41" y2="211" stroke="#2f3a2b" stroke-width="3.5999999999999996" stroke-linecap="round"/><circle cx="30" cy="190" r="6.0" fill="#d9b48f"/><text x="200" y="200" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Ticket: $1,150</text><text x="200" y="285" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Even after evacuations end</text>
</svg>
