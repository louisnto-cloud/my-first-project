<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two lists from Canadian Army fieldcraft. Looks nearer: bright light, sun behind you, snow or water, clear mountain air, a hidden dip between you and it, something big compared with its surroundings. Looks farther: poor light or fog, sun in your eyes, only part of it showing, a dip you can fully see, looking down a tree lined road. Range it to be sure.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">What fools your eye (80%)</text><rect x="14" y="42" width="182" height="220" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><rect x="14" y="42" width="182" height="26" rx="8" fill="#e8590c"/><rect x="14" y="56" width="182" height="12" fill="#e8590c"/><text x="105.0" y="61" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Looks NEARER</text><text x="24" y="88" font-size="14" fill="#23261f" text-anchor="start">Bright light</text><text x="24" y="107" font-size="14" fill="#23261f" text-anchor="start">Sun behind you</text><text x="24" y="126" font-size="14" fill="#23261f" text-anchor="start">Snow, water</text><text x="24" y="145" font-size="14" fill="#23261f" text-anchor="start">Clear mountain air</text><text x="24" y="164" font-size="14" fill="#23261f" text-anchor="start">Hidden dip between</text><text x="24" y="183" font-size="14" fill="#23261f" text-anchor="start">Big vs surroundings</text><rect x="204" y="42" width="182" height="220" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><rect x="204" y="42" width="182" height="26" rx="8" fill="#4a7fb0"/><rect x="204" y="56" width="182" height="12" fill="#4a7fb0"/><text x="295.0" y="61" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Looks FARTHER</text><text x="214" y="88" font-size="14" fill="#23261f" text-anchor="start">Poor light, fog</text><text x="214" y="107" font-size="14" fill="#23261f" text-anchor="start">Sun in your eyes</text><text x="214" y="126" font-size="14" fill="#23261f" text-anchor="start">Only part shows</text><text x="214" y="145" font-size="14" fill="#23261f" text-anchor="start">Dip you can see</text><text x="214" y="164" font-size="14" fill="#23261f" text-anchor="start">Tree lined road</text><text x="214" y="183" font-size="14" fill="#23261f" text-anchor="start"></text><text x="200" y="288" font-size="14" fill="#6b4f35" text-anchor="middle">Canadian Army fieldcraft. Range it to be sure</text>
</svg>
