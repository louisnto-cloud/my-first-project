<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three panels of goose droppings by age, all a Tip. Fresh, today: green, wet and shiny. A day or two: dull, darker, with a firm skin. Old: dry, pale and crumbly. Droppings are 5 to 10 centimetres long and finger thin, green on grass and browner on grain, 65 percent. Rain and frost change the look, so compare spots.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">How fresh? Read the droppings (Tip)</text><rect x="10" y="44" width="120" height="190" rx="10" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(70 100) rotate(0) scale(1.6)"><rect x="-18" y="-5" width="36" height="10" rx="5" fill="#4caf50"/><rect x="12" y="-5" width="6" height="10" rx="3" fill="#f5f5f5"/><path fill="none" d="M-12 -2 L4 -2" stroke="#fff" stroke-width="2" opacity=".7"/></g><g transform="translate(60 140) rotate(25) scale(1.3)"><rect x="-18" y="-5" width="36" height="10" rx="5" fill="#4caf50"/><rect x="12" y="-5" width="6" height="10" rx="3" fill="#f5f5f5"/><path fill="none" d="M-12 -2 L4 -2" stroke="#fff" stroke-width="2" opacity=".7"/></g><text x="70" y="180" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Fresh</text><text x="70" y="200" font-size="14" fill="#23261f" text-anchor="middle">today: green,</text><text x="70" y="218" font-size="14" fill="#23261f" text-anchor="middle">wet, shiny</text><rect x="140" y="44" width="120" height="190" rx="10" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(200 100) rotate(0) scale(1.6)"><rect x="-18" y="-5" width="36" height="10" rx="5" fill="#556b2f"/><rect x="12" y="-5" width="6" height="10" rx="3" fill="#f5f5f5"/></g><g transform="translate(190 140) rotate(25) scale(1.3)"><rect x="-18" y="-5" width="36" height="10" rx="5" fill="#556b2f"/><rect x="12" y="-5" width="6" height="10" rx="3" fill="#f5f5f5"/></g><text x="200" y="180" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A day or two</text><text x="200" y="200" font-size="14" fill="#23261f" text-anchor="middle">dull, darker,</text><text x="200" y="218" font-size="14" fill="#23261f" text-anchor="middle">firm skin</text><rect x="270" y="44" width="120" height="190" rx="10" fill="#fff" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(330 100) rotate(0) scale(1.6)"><rect x="-18" y="-5" width="36" height="10" rx="5" fill="#bcaaa4"/><rect x="12" y="-5" width="6" height="10" rx="3" fill="#f5f5f5"/></g><g transform="translate(320 140) rotate(25) scale(1.3)"><rect x="-18" y="-5" width="36" height="10" rx="5" fill="#bcaaa4"/><rect x="12" y="-5" width="6" height="10" rx="3" fill="#f5f5f5"/></g><text x="330" y="180" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Old</text><text x="330" y="200" font-size="14" fill="#23261f" text-anchor="middle">dry, pale,</text><text x="330" y="218" font-size="14" fill="#23261f" text-anchor="middle">crumbles</text><text x="200" y="256" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Size: 5 to 10 cm, finger thin (65%)</text><text x="200" y="276" font-size="14" fill="#23261f" text-anchor="middle">Green on grass, browner on grain (65%)</text><text x="200" y="294" font-size="14" fill="#2f3a2b" text-anchor="middle">Rain and frost change the look: compare spots</text>
</svg>
