<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Target at 100 metres on a 1 centimetre grid. The centre of a 3 shot group sits 6 centimetres low and 3 centimetres left of the bullseye. With a quarter MOA scope, 1 click is about 0.73 centimetres. So turn 8 clicks UP and 4 clicks RIGHT.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect x="10" y="10" width="250" height="280" fill="#fff" stroke="#2f3a2b" stroke-width="2"/>
  <g stroke="#dfe6d3" stroke-width="1">
    <path d="M30 10 V290 M50 10 V290 M70 10 V290 M90 10 V290 M110 10 V290 M130 10 V290 M150 10 V290 M170 10 V290 M190 10 V290 M210 10 V290 M230 10 V290 M250 10 V290"/>
    <path d="M10 30 H260 M10 50 H260 M10 70 H260 M10 90 H260 M10 110 H260 M10 130 H260 M10 150 H260 M10 170 H260 M10 190 H260 M10 210 H260 M10 230 H260 M10 250 H260 M10 270 H260"/>
  </g>
  <circle cx="150" cy="90" r="40" fill="none" stroke="#2f3a2b" stroke-width="2"/><circle cx="150" cy="90" r="8" fill="#e8590c"/>
  <g fill="#2f3a2b"><circle cx="84" cy="206" r="5"/><circle cx="96" cy="216" r="5"/><circle cx="90" cy="194" r="5"/></g>
  <path d="M84 210 l12 0 M90 204 l0 12" stroke="#e8590c" stroke-width="2"/>
  <g stroke="#e8590c" stroke-width="3" fill="none">
    <path d="M90 196 V96"/><path d="M82 106 l8 -10 l8 10"/>
    <path d="M94 90 H140"/><path d="M130 82 l10 8 l-10 8"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#e8590c"><text x="22" y="160">6 cm</text><text x="100" y="112">3 cm</text></g>
  <text x="135" y="282" font-size="14" fill="#2f3a2b" text-anchor="middle">1 square = 1 cm at 100 m</text>
  <g font-size="15" font-weight="bold" fill="#2f3a2b">
    <text x="272" y="36">1 click</text><text x="272" y="56" fill="#e8590c">= 0.73 cm</text>
    <text x="272" y="100">6 ÷ 0.73</text><rect x="270" y="108" width="120" height="30" rx="6" fill="#e8590c"/><text x="330" y="129" fill="#fff" text-anchor="middle">8 clicks UP</text>
    <text x="272" y="176">3 ÷ 0.73</text><rect x="270" y="184" width="120" height="30" rx="6" fill="#e8590c"/><text x="330" y="205" fill="#fff" text-anchor="middle">4 clicks R</text>
    <text x="272" y="250" font-size="14" font-weight="normal">Move the bullet</text><text x="272" y="268" font-size="14" font-weight="normal">the way the</text><text x="272" y="286" font-size="14" font-weight="normal">arrow says</text>
  </g>
</svg>
