<circle cx="66" cy="378.0" r="11" fill="#c92a2a"/><path d="M61.2 373.2 l9.6 9.6 M70.8 373.2 l-9.6 9.6" stroke="#fffaf0" stroke-width="2.6" stroke-linecap="round"/>
<text x="92" y="382" font-size="17" font-weight="bold" fill="#2f3a2b">Alaska</text>
<rect x="283.5" y="365" width="100.5" height="24" rx="12.0" fill="#c92a2a"/><text x="333.8" y="382.04" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">Not required</text>
<text x="92" y="406" font-size="15" fill="#2f3a2b">Some youth hunts need it (85%).</text>
<rect x="8" y="440" width="384" height="36" rx="9" fill="#2f3a2b"/>
<text x="200" y="464" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">My lean: wear orange for big game anyway.</text>
