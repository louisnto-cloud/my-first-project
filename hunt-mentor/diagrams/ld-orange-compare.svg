<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" font-family="sans-serif" role="img" aria-label="Cards comparing blaze orange rules on the five trips, with BC for reference. BC: no blaze orange rule, 95 percent. Manitoba: required, an all orange head covering plus 2,580 square centimetres of hunter orange above the waist, for big game and coyote, 85 percent. Saskatchewan: required, a vest for big game with a rifle, 85 percent. Yukon: recommended, a legal rule was not found, VERIFY, 80 percent. Alberta: not required, the rule was repealed, bright colours recommended, 80 percent. Alaska: not required, some youth hunts need it, 85 percent. My lean: wear orange for big game anyway.">
<rect width="400" height="600" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Blaze orange: must you wear it?</text>
<g data-tip="BC|BC has no blaze orange rule. My lean (Tip): orange hat and vest when you are two or more.">
<rect x="8" y="44" width="384" height="70" rx="10" fill="#ffffff" stroke="#5f6b52" stroke-width="2.2"/>
<g transform="translate(46 85) scale(1.1)"><path d="M-9 -20 L-3 -20 L0 -10 L3 -20 L9 -20 C10 -14 13 -11 17 -10 L16 20 L-16 20 L-17 -10 C-13 -11 -10 -14 -9 -20z" fill="#e6dccb"/><path d="M0 -10 V20" stroke="#00000033" stroke-width="1.4" fill="none"/></g>
<circle cx="64" cy="62" r="11" fill="#5f6b52"/><path d="M59 57 l10 10 M69 57 l-10 10" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none"/>
<text x="90" y="72" font-size="18" font-weight="bold" fill="#2f3a2b">BC (home)</text>
<rect x="306" y="53" width="78" height="26" rx="13" fill="#5f6b52"/><text x="345" y="71" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">No rule</text>
<text x="90" y="98" font-size="15" fill="#2f3a2b">No blaze orange rule (95%)</text>
</g>
<g data-tip="Manitoba|Big game and coyote: a head covering completely hunter orange, plus 2,580 cm² (400 in²) above the waist, seen from all sides. Anyone with you needs it too.">
<rect x="8" y="122" width="384" height="90" rx="10" fill="#ffffff" stroke="#2f6e3b" stroke-width="2.2"/>
<g transform="translate(46 173) scale(1.1)"><path d="M-9 -20 L-3 -20 L0 -10 L3 -20 L9 -20 C10 -14 13 -11 17 -10 L16 20 L-16 20 L-17 -10 C-13 -11 -10 -14 -9 -20z" fill="#e8590c"/><path d="M0 -10 V20" stroke="#00000033" stroke-width="1.4" fill="none"/></g>
<g transform="translate(44 141) scale(1.0)"><path d="M-11 2 C-11 -12 11 -12 11 2z" fill="#e8590c"/><path d="M-11 2 H17 C17 5 14 6 10 6 H-11z" fill="#e8590c"/></g>
<text x="90" y="150" font-size="18" font-weight="bold" fill="#2f3a2b">Manitoba</text>
<rect x="296" y="131" width="88" height="26" rx="13" fill="#2f6e3b"/><text x="340" y="149" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Required</text>
<text x="90" y="176" font-size="15" fill="#2f3a2b">All orange hat, plus 2,580 cm²</text>
<text x="90" y="196" font-size="15" fill="#2f3a2b">(400 in²) above the waist (85%)</text>
</g>
<g data-tip="Saskatchewan|Big game with a rifle: wear a vest of scarlet, bright yellow, blaze orange or white. My lean (Tip): orange vest and toque for deer.">
<rect x="8" y="220" width="384" height="70" rx="10" fill="#ffffff" stroke="#2f6e3b" stroke-width="2.2"/>
<g transform="translate(46 261) scale(1.1)"><path d="M-9 -20 L-3 -20 L0 -10 L3 -20 L9 -20 C10 -14 13 -11 17 -10 L16 20 L-16 20 L-17 -10 C-13 -11 -10 -14 -9 -20z" fill="#e8590c"/><path d="M0 -10 V20" stroke="#00000033" stroke-width="1.4" fill="none"/></g>
<text x="90" y="248" font-size="18" font-weight="bold" fill="#2f3a2b">Saskatchewan</text>
<rect x="296" y="229" width="88" height="26" rx="13" fill="#2f6e3b"/><text x="340" y="247" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Required</text>
<text x="90" y="274" font-size="15" fill="#2f3a2b">Vest: big game with a rifle (85%)</text>
</g>
<g data-tip="Yukon|Yukon checklists list hunter orange as recommended gear. A legal rule to wear it was not found: VERIFY in the current summary.">
<rect x="8" y="298" width="384" height="70" rx="10" fill="#ffffff" stroke="#9a6412" stroke-width="2.2"/>
<g transform="translate(46 339) scale(1.1)"><path d="M-9 -20 L-3 -20 L0 -10 L3 -20 L9 -20 C10 -14 13 -11 17 -10 L16 20 L-16 20 L-17 -10 C-13 -11 -10 -14 -9 -20z" fill="#f3c9a8"/><path d="M0 -10 V20" stroke="#00000033" stroke-width="1.4" fill="none"/></g>
<circle cx="64" cy="316" r="11" fill="#9a6412"/><text x="64" y="322" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">?</text>
<text x="90" y="326" font-size="18" font-weight="bold" fill="#2f3a2b">Yukon</text>
<rect x="306" y="307" width="78" height="26" rx="13" fill="#9a6412"/><text x="345" y="325" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Advised</text>
<text x="90" y="352" font-size="15" fill="#2f3a2b">Legal rule not found: VERIFY (80%)</text>
</g>
<g data-tip="Alberta|The high visibility clothing rule has been formally repealed. Bright colours are recommended, not required.">
<rect x="8" y="376" width="384" height="90" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.2"/>
<g transform="translate(46 427) scale(1.1)"><path d="M-9 -20 L-3 -20 L0 -10 L3 -20 L9 -20 C10 -14 13 -11 17 -10 L16 20 L-16 20 L-17 -10 C-13 -11 -10 -14 -9 -20z" fill="#e6dccb"/><path d="M0 -10 V20" stroke="#00000033" stroke-width="1.4" fill="none"/></g>
<circle cx="64" cy="394" r="11" fill="#c92a2a"/><path d="M59 389 l10 10 M69 389 l-10 10" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none"/>
<text x="90" y="404" font-size="18" font-weight="bold" fill="#2f3a2b">Alberta</text>
<rect x="260" y="385" width="124" height="26" rx="13" fill="#c92a2a"/><text x="322" y="403" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Not required</text>
<text x="90" y="430" font-size="15" fill="#2f3a2b">Rule repealed. Bright colours</text>
<text x="90" y="450" font-size="15" fill="#2f3a2b">recommended (80%)</text>
</g>
<g data-tip="Alaska|Alaska does not require hunter orange, but investigators found it reduces hunting accidents. Some youth hunts require orange vests or jackets.">
<rect x="8" y="474" width="384" height="70" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.2"/>
<g transform="translate(46 515) scale(1.1)"><path d="M-9 -20 L-3 -20 L0 -10 L3 -20 L9 -20 C10 -14 13 -11 17 -10 L16 20 L-16 20 L-17 -10 C-13 -11 -10 -14 -9 -20z" fill="#e6dccb"/><path d="M0 -10 V20" stroke="#00000033" stroke-width="1.4" fill="none"/></g>
<circle cx="64" cy="492" r="11" fill="#c92a2a"/><path d="M59 487 l10 10 M69 487 l-10 10" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none"/>
<text x="90" y="502" font-size="18" font-weight="bold" fill="#2f3a2b">Alaska</text>
<rect x="260" y="483" width="124" height="26" rx="13" fill="#c92a2a"/><text x="322" y="501" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Not required</text>
<text x="90" y="528" font-size="15" fill="#2f3a2b">Some youth hunts need it (85%)</text>
</g>
<g data-tip="My lean (Tip)|Wear an orange hat and vest for big game anyway. It costs nothing, and camouflage is fine for birds."><rect x="8" y="552" width="384" height="40" rx="10" fill="#2f3a2b"/><text x="200" y="578" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">My lean: orange for big game anyway</text></g>
</svg>
