<text x="92" y="146" font-size="15" fill="#2f3a2b">Vest for big game with a rifle (85%).</text>
<rect x="8" y="180" width="384" height="80" rx="9" fill="#fffaf0" stroke="#b7791f" stroke-width="1.8"/>
<g transform="translate(48 224.0) scale(1.05)"><path d="M-9 -20 L-3 -20 L0 -10 L3 -20 L9 -20 C10 -14 13 -11 17 -10 L16 20 L-16 20 L-17 -10 C-13 -11 -10 -14 -9 -20z" fill="#f3c9a8"/><path d="M0 -10 V20" stroke="#00000033" stroke-width="1.4"/><path d="M-16 6 H16" stroke="#fff3" stroke-width="3"/></g>
<circle cx="66" cy="204.0" r="11" fill="#b7791f"/><text x="66" y="210" font-size="17" font-weight="bold" fill="#fffaf0" text-anchor="middle">?</text>
<text x="92" y="206" font-size="17" font-weight="bold" fill="#2f3a2b">Yukon</text>
<rect x="267.3" y="189" width="116.7" height="24" rx="12.0" fill="#b7791f"/><text x="325.7" y="206.04" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">Recommended</text>
<text x="92" y="230" font-size="15" fill="#2f3a2b">A legal rule was not found. VERIFY</text>
<text x="92" y="249" font-size="15" fill="#2f3a2b">(80%).</text>
<rect x="8" y="268" width="384" height="80" rx="9" fill="#fffaf0" stroke="#c92a2a" stroke-width="1.8"/>
<g transform="translate(48 312.0) scale(1.05)"><path d="M-9 -20 L-3 -20 L0 -10 L3 -20 L9 -20 C10 -14 13 -11 17 -10 L16 20 L-16 20 L-17 -10 C-13 -11 -10 -14 -9 -20z" fill="#e6dccb"/><path d="M0 -10 V20" stroke="#00000033" stroke-width="1.4"/><path d="M-16 6 H16" stroke="#fff3" stroke-width="3"/></g>
