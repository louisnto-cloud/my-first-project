<text x="92" y="58" font-size="15" fill="#2f3a2b">All orange hat plus 2,580 cm² above the</text>
<text x="92" y="77" font-size="15" fill="#2f3a2b">waist. Big game and coyote (85%).</text>
<rect x="8" y="96" width="384" height="76" rx="9" fill="#fffaf0" stroke="#2f6e3b" stroke-width="1.8"/>
<g transform="translate(48 138.0) scale(1.05)"><path d="M-9 -20 L-3 -20 L0 -10 L3 -20 L9 -20 C10 -14 13 -11 17 -10 L16 20 L-16 20 L-17 -10 C-13 -11 -10 -14 -9 -20z" fill="#e8590c"/><path d="M0 -10 V20" stroke="#00000033" stroke-width="1.4"/><path d="M-16 6 H16" stroke="#fff3" stroke-width="3"/></g>
