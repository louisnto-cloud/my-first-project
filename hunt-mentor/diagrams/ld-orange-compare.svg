<g transform="translate(46 32.0) scale(0.9)"><path d="M-11 2 C-11 -12 11 -12 11 2z" fill="#e8590c"/><path d="M-11 2 H17 C17 5 14 6 10 6 H-11z" fill="#e8590c"/><path d="M-11 2 H11" stroke="#00000033" stroke-width="1.2"/></g>
<text x="92" y="34" font-size="17" font-weight="bold" fill="#2f3a2b">Manitoba</text>
