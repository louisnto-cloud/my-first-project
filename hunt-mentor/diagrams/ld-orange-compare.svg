<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 484" font-family="sans-serif" role="img" aria-label="Cards comparing blaze orange rules on the five trips. Manitoba: required, an all orange head covering plus 2,580 square centimetres of hunter orange above the waist, for big game and coyote, 85 percent. Saskatchewan: required, a vest for big game with a rifle, 85 percent. Yukon: recommended, a legal rule was not found, VERIFY, 80 percent. Alberta: not required, the rule was repealed, bright colours recommended, 80 percent. Alaska: not required, some youth hunts need it, 85 percent. My lean: wear orange for big game anyway.">
<rect width="400" height="484" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="80" rx="9" fill="#fffaf0" stroke="#2f6e3b" stroke-width="1.8"/>
