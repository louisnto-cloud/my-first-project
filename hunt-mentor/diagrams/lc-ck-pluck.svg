<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" font-family="sans-serif" role="img" aria-label="Plucking or breasting birds. Pluck: the skin keeps flavour and moisture, roast whole ducks plucked, 80 percent. Breast out: fast and fine for grouse and quail in a pan, a tip. Law: both breasts are the legal minimum you must keep from any game bird. Cook bird meat to 74 degrees Celsius, 80 percent.">
<rect x="0" y="0" width="400" height="350" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Birds: pluck or breast?</text><rect x="10" y="44" width="185" height="142" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(40 78) scale(0.9)"><path d="M-14 18 Q-8 -8 14 -18 Q8 4 -14 18 Z" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 18 L6 -8" stroke="#2f3a2b" stroke-width="1.5"/></g><text x="68" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Pluck</text><text x="68" y="86" font-size="14" fill="#23261f" text-anchor="start">Skin keeps</text><text x="68" y="103" font-size="14" fill="#23261f" text-anchor="start">flavour and</text><text x="68" y="120" font-size="14" fill="#23261f" text-anchor="start">moisture. Roast</text><text x="68" y="137" font-size="14" fill="#23261f" text-anchor="start">whole ducks</text><text x="68" y="154" font-size="14" fill="#23261f" text-anchor="start">(80%)</text><rect x="205" y="44" width="185" height="142" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(235 78) scale(0.9)"><path d="M-20 6 L6 -4 Q16 -8 20 -12 Q18 2 6 6 Z" fill="#cfd6bf" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-24" y="2" width="14" height="9" rx="3" fill="#8b5a2b" transform="rotate(-20 -17 6)"/></g><text x="263" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Breast out</text><text x="263" y="86" font-size="14" fill="#23261f" text-anchor="start">Fast. Fine for</text><text x="263" y="103" font-size="14" fill="#23261f" text-anchor="start">grouse and quail</text><text x="263" y="120" font-size="14" fill="#23261f" text-anchor="start">in a pan (Tip)</text><rect x="10" y="196" width="185" height="142" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(40 230) scale(0.9)"><ellipse cx="0" cy="4" rx="14" ry="9" fill="#8b5a2b"/><circle cx="12" cy="-6" r="6" fill="#8b5a2b"/><path d="M17 -6 l6 1 l-6 2" fill="#e8590c"/><path d="M-4 2 Q-14 -14 4 -6" fill="#6b4f35"/></g><rect x="141" y="314" width="48" height="20" rx="10" fill="#4a7fb0"/><text x="165" y="329" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">LAW</text><text x="68" y="220" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Keep both</text><text x="68" y="238" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">breasts</text><text x="68" y="256" font-size="14" fill="#23261f" text-anchor="start">The legal</text><text x="68" y="273" font-size="14" fill="#23261f" text-anchor="start">minimum from any</text><text x="68" y="290" font-size="14" fill="#23261f" text-anchor="start">game bird (95%)</text><rect x="205" y="196" width="185" height="142" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(235 230) scale(0.9)"><rect x="-5" y="-20" width="10" height="30" rx="5" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="14" r="8" fill="#b3261e" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-2" y="-6" width="4" height="18" fill="#b3261e"/></g><text x="263" y="220" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Bird meat 74°C</text><text x="263" y="238" font-size="14" fill="#23261f" text-anchor="start">North Dakota</text><text x="263" y="255" font-size="14" fill="#23261f" text-anchor="start">State University</text><text x="263" y="272" font-size="14" fill="#23261f" text-anchor="start">(80%)</text>
</svg>
