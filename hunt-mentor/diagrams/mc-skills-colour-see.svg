<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four colour swatches, what you see and what a deer likely sees. Blue stays bright blue. Orange, red and green all turn into similar dull browns and greys. Deer have two colour cones and no red cone. Illustration only.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">What a deer likely sees (75%)</text><text x="110" y="62" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">You see</text><text x="290" y="62" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A deer likely sees</text><rect x="50" y="74" width="120" height="40" rx="6" fill="#3a6fd8"/><rect x="230" y="74" width="120" height="40" rx="6" fill="#3a6fd8"/><text x="110" y="100" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Blue</text><line x1="176" y1="94" x2="224" y2="94" stroke="#23261f" stroke-width="2"/><polygon points="224.0,94.0 215.0,98.3 215.0,89.7" fill="#23261f"/><rect x="50" y="124" width="120" height="40" rx="6" fill="#e8590c"/><rect x="230" y="124" width="120" height="40" rx="6" fill="#9a9278"/><text x="110" y="150" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Orange</text><line x1="176" y1="144" x2="224" y2="144" stroke="#23261f" stroke-width="2"/><polygon points="224.0,144.0 215.0,148.3 215.0,139.7" fill="#23261f"/><rect x="50" y="174" width="120" height="40" rx="6" fill="#c0392b"/><rect x="230" y="174" width="120" height="40" rx="6" fill="#7c7564"/><text x="110" y="200" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Red</text><line x1="176" y1="194" x2="224" y2="194" stroke="#23261f" stroke-width="2"/><polygon points="224.0,194.0 215.0,198.3 215.0,189.7" fill="#23261f"/><rect x="50" y="224" width="120" height="40" rx="6" fill="#4f8a3a"/><rect x="230" y="224" width="120" height="40" rx="6" fill="#8e8a72"/><text x="110" y="250" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Green</text><line x1="176" y1="244" x2="224" y2="244" stroke="#23261f" stroke-width="2"/><polygon points="224.0,244.0 215.0,248.3 215.0,239.7" fill="#23261f"/><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Illustration only. Blue pops; orange is dull (Tip)</text>
</svg>
