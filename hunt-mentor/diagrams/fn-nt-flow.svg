<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Flowchart for night: 1 stop and turn the lamp off for a minute. 2 phone Back to start heading. 3 compass to the handrail. 4 still lost: stay put, shelter and call. Do not just walk downhill in the dark.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="30" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Not sure where you are at night?</text><rect x="100" y="45" width="200" height="34" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="200.0" y="67" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="middle">1 STOP. Lamp off a minute.</text><line x1="200" y1="80" x2="200.0" y2="88.3" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><polygon points="200.0,96.0 206.1,85.0 193.9,85.0" fill="#2f3a2b"/><rect x="70" y="98" width="260" height="34" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="200.0" y="120" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="middle">2 Phone: Back to start heading</text><line x1="200" y1="133" x2="200.0" y2="141.3" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><polygon points="200.0,149.0 206.1,138.0 193.9,138.0" fill="#2f3a2b"/><rect x="70" y="151" width="260" height="34" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="200.0" y="173" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="middle">3 Compass to the handrail</text><line x1="200" y1="186" x2="200.0" y2="194.3" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><polygon points="200.0,202.0 206.1,191.0 193.9,191.0" fill="#2f3a2b"/><rect x="50" y="204" width="300" height="34" rx="8" fill="#ffffff" stroke="#c92a2a" stroke-width="2"/><text x="200.0" y="226" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="middle">4 Still lost? Stay. Shelter, call.</text><text x="20" y="270" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Do not walk downhill in the dark to get out.</text><text x="20" y="288" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Draws end in cliffs and creeks (Tip).</text>
</svg>
