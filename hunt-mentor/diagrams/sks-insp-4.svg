<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 4. The gas tube with its wooden handguard and the gas piston drawn apart. 1: the tube should be clean with no rust. 2: the piston should slide freely.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
