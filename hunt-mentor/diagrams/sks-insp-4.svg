10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="2"/><text x="25.0" y="263.0" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="41.0" y="263.0" font-size="14" fill="#17201A" text-anchor="start">Piston: slides free</text>
