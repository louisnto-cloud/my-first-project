<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Trucks and hunters crowd the road at the bottom of a hill. A deer moves away from them along a trail toward thick timber on the ridge. You sit beside that trail, between the crowd and the timber, before first light. A tip, not a study result.">
