<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="From A to B across a hill. Straight over climbs 300 metres and drops 300 metres. The route around the bottom on one contour is longer but flat and quiet.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0" stroke="none" stroke-width="2"/><ellipse cx="200" cy="150" rx="150" ry="95" fill="none" stroke="#8b5a2b" stroke-width="2"/><ellipse cx="200" cy="150" rx="110" ry="70" fill="none" stroke="#8b5a2b" stroke-width="2"/><ellipse cx="200" cy="150" rx="70" ry="45" fill="none" stroke="#8b5a2b" stroke-width="2"/><ellipse cx="200" cy="150" rx="30" ry="20" fill="none" stroke="#8b5a2b" stroke-width="2"/><circle cx="30" cy="150" r="8" fill="#2f3a2b" stroke="none" stroke-width="2"/><circle cx="370" cy="150" r="8" fill="#e8590c" stroke="none" stroke-width="2"/><text x="30" y="180" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">A</text><text x="370" y="180" font-family="sans-serif" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">B</text><line x1="38" y1="150" x2="362" y2="150" stroke="#c92a2a" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><text x="200" y="48" font-family="sans-serif" font-size="14" fill="#c92a2a" text-anchor="middle" font-weight="bold">Over: 300 m up, 300 m down</text><path d="M38 150 C 60 250, 340 250, 362 150" fill="none" stroke="#8a9a6b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="268" font-family="sans-serif" font-size="14" fill="#8a9a6b" text-anchor="middle" font-weight="bold">Around: longer, flat, quiet</text><text x="14" y="26" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Over the top or around?</text>
</svg>
