<g transform="translate(305 348) scale(0.95 0.95)"><polygon points="-22,-4 -36,-8 -36,4 -22,6" fill="#9aa0a6"/><ellipse cx="0" cy="0" rx="26" ry="15" fill="#e9e6df"/><circle cx="21" cy="-14" r="8" fill="#e9e6df"/><polygon points="28,-16 35,-13 28,-10" fill="#6b4f35"/><circle cx="23" cy="-16" r="1.8" fill="#23261f"/><path d="M2 13 l-2 11 M10 13 l2 11" stroke="#6b4f35" stroke-width="2.5" fill="none"/></g>
<text x="213" y="390" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Ptarmigan (3 kinds)</text>
