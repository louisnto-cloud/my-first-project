<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-label="Six cards of the BC grouse you can hunt, each with a simple bird shape, its home habitat and its weight. Ruffed grouse: aspen and creek edges, 450 to 750 grams. Spruce grouse: pine and spruce, 450 to 750 grams. Dusky grouse: interior fir ridges, 0.9 to 1.6 kilograms. Sooty grouse: coast conifers, the coast twin of the dusky. Sharp tailed grouse: grass and aspen, 0.6 to 1 kilogram. Ptarmigan, three kinds: above the treeline, 350 to 800 grams." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="440" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">BC&#x27;s huntable grouse</text>
