<g transform="translate(110 216) scale(0.95 0.95)"><polygon points="-22,-4 -50,-10 -50,4 -22,7" fill="#23261f"/><ellipse cx="0" cy="0" rx="26" ry="15" fill="#5d6670"/><circle cx="21" cy="-14" r="8" fill="#5d6670"/><path d="M18 -20 q5 -5 10 0" fill="none" stroke="#e3a21a" stroke-width="3"/><polygon points="28,-16 35,-13 28,-10" fill="#6b4f35"/><circle cx="23" cy="-16" r="1.8" fill="#23261f"/><path d="M2 13 l-2 11 M10 13 l2 11" stroke="#6b4f35" stroke-width="2.5" fill="none"/></g>
