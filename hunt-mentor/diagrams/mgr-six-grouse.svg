<text x="18" y="160" font-size="14" fill="#6b4f35" text-anchor="start">450 to 750 g</text>
<rect x="205" y="42" width="185" height="124" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/>
<g transform="translate(305 84) scale(0.95 0.95)"><polygon points="-22,-4 -36,-8 -36,4 -22,6" fill="#23261f"/><ellipse cx="0" cy="0" rx="26" ry="15" fill="#3d3a35"/><circle cx="21" cy="-14" r="8" fill="#3d3a35"/><path d="M18 -20 q5 -5 10 0" fill="none" stroke="#c23b22" stroke-width="3"/><polygon points="28,-16 35,-13 28,-10" fill="#6b4f35"/><circle cx="23" cy="-16" r="1.8" fill="#23261f"/><path d="M2 13 l-2 11 M10 13 l2 11" stroke="#6b4f35" stroke-width="2.5" fill="none"/></g>
