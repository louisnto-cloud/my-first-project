<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 615" font-family="sans-serif" role="img" aria-label="Rifle and no shooting lines in Region 1, synopsis page 20. Management Unit 1-1: no rifles except on Valdes, Sidney and James islands, or by permit. Nanoose Bay, 1-5: no shooting on the shore and 400 metres (437 yards) out on the water. Westcan Terminals, 1-4: no firearms within 25 metres (27 yards) of the road midline or seaward of the port. Cowichan River, 1-4: no firearms within 100 metres (109 yards) of the high water mark, Holt Creek Trailhead upstream to Lake Cowichan. Qualicum National Wildlife Areas, 1-6: no hunting, trapping, fishing or firearm, under federal law.">
<rect width="400" height="615" fill="#fffaf0"/>
<text x="14" y="23" font-size="14" font-weight="bold" fill="#6b5b4b">Page 20. MU: Management Unit</text>
<rect x="8" y="32" width="384" height="30" rx="6" fill="#5b6b3e"/>
<g transform="translate(31 47) scale(0.62)" fill="#fffaf0" stroke="none"><path d="M-16 -2 H8 V-5 H12 V-2 H16 V1 H-2 L-4 3 H-8 L-11 8 H-16 L-13 1 H-16z"/></g>
<text x="50" y="53" font-size="15" font-weight="bold" fill="#fffaf0" letter-spacing="1">NO RIFLES</text>
<rect x="8" y="68" width="384" height="74" rx="6" fill="#f4eedf"/>
<rect x="14" y="90.0" width="58" height="30" rx="6" fill="#5b6b3e"/>
<text x="43" y="110.8" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">1-1</text>
<text x="82" y="91" font-size="16" font-weight="bold" fill="#2f3a2b">All of MU 1-1</text>
<text x="82" y="110" font-size="15" fill="#2f3a2b">Except Valdes, Sidney and James islands,</text>
<text x="82" y="129" font-size="15" fill="#2f3a2b">or by permit</text>
<rect x="8" y="152" width="384" height="30" rx="6" fill="#d9480f"/>
<g transform="translate(31 167) scale(0.62)" fill="#fffaf0" stroke="none"><circle r="13" fill="none" stroke="#fffaf0" stroke-width="3.5"/><path d="M-9 -9 L9 9" stroke="#fffaf0" stroke-width="3.5"/></g>
<text x="50" y="173" font-size="15" font-weight="bold" fill="#fffaf0" letter-spacing="1">NO SHOOTING</text>
<rect x="8" y="188" width="384" height="74" rx="6" fill="#f4eedf"/>
<rect x="14" y="210.0" width="58" height="30" rx="6" fill="#d9480f"/>
<text x="43" y="230.8" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">400 m</text>
<text x="82" y="211" font-size="16" font-weight="bold" fill="#2f3a2b">Nanoose Bay, MU 1-5</text>
<text x="82" y="230" font-size="15" fill="#2f3a2b">The shore and 400 m (437 yd) out on the</text>
<text x="82" y="249" font-size="15" fill="#2f3a2b">water</text>
<rect x="8" y="272" width="384" height="30" rx="6" fill="#d9480f"/>
<g transform="translate(31 287) scale(0.62)" fill="#fffaf0" stroke="none"><circle r="13" fill="none" stroke="#fffaf0" stroke-width="3.5"/><path d="M-9 -9 L9 9" stroke="#fffaf0" stroke-width="3.5"/></g>
<text x="50" y="293" font-size="15" font-weight="bold" fill="#fffaf0" letter-spacing="1">NO FIREARMS</text>
<rect x="8" y="308" width="384" height="74" rx="6" fill="#f4eedf"/>
<rect x="14" y="330.0" width="58" height="30" rx="6" fill="#d9480f"/>
<text x="43" y="350.8" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">25 m</text>
<text x="82" y="331" font-size="16" font-weight="bold" fill="#2f3a2b">Westcan Terminals, MU 1-4</text>
<text x="82" y="350" font-size="15" fill="#2f3a2b">Within 25 m (27 yd) of the road midline, or</text>
<text x="82" y="369" font-size="15" fill="#2f3a2b">seaward of the port</text>
<rect x="14" y="415.5" width="58" height="30" rx="6" fill="#d9480f"/>
<text x="43" y="436.3" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">100 m</text>
<text x="82" y="407" font-size="16" font-weight="bold" fill="#2f3a2b">Cowichan River, MU 1-4</text>
<text x="82" y="426" font-size="15" fill="#2f3a2b">Within 100 m (109 yd) of the high water</text>
<text x="82" y="445" font-size="15" fill="#2f3a2b">mark, Holt Creek Trailhead up to Lake</text>
<text x="82" y="464" font-size="15" fill="#2f3a2b">Cowichan</text>
<rect x="8" y="487" width="384" height="30" rx="6" fill="#c0392b"/>
<g transform="translate(31 502) scale(0.62)" fill="#fffaf0" stroke="none"><circle r="13" fill="none" stroke="#fffaf0" stroke-width="3.5"/><path d="M-9 -9 L9 9" stroke="#fffaf0" stroke-width="3.5"/></g>
<text x="50" y="508" font-size="15" font-weight="bold" fill="#fffaf0" letter-spacing="1">NO HUNTING OR FIREARMS</text>
<rect x="8" y="523" width="384" height="74" rx="6" fill="#f4eedf"/>
<rect x="14" y="545.0" width="58" height="30" rx="6" fill="#c0392b"/>
<text x="43" y="565.8" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">1-6</text>
<text x="82" y="546" font-size="16" font-weight="bold" fill="#2f3a2b">Qualicum National Wildlife Areas</text>
<text x="82" y="565" font-size="15" fill="#2f3a2b">No trapping or fishing either. MU 1-6.</text>
<text x="82" y="584" font-size="15" fill="#2f3a2b">Federal law</text>
</svg>
