<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" role="img" aria-label="Five cards. Management Unit 1-1: no rifles except on Valdes, Sidney and James islands, or by permit. Nanoose Bay, 1-5: no shooting on the shore and 400 metres out on the water. Qualicum National Wildlife Areas, 1-6: no hunting, trapping, fishing or firearm. Westcan Terminals, 1-4: no firearms within 25 metres of the road midline or seaward of the port. Cowichan River, 1-4: no firearms within 100 metres of the high water mark, Holt Creek Trailhead upstream to Lake Cowichan." font-family="sans-serif">
<rect x="0" y="0" width="400" height="450" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Rifle and no shooting lines</text>
<rect x="6" y="40" width="190" height="114" rx="10" fill="#ffffff" stroke="#8a9a6b" stroke-width="2.5"/>
<path d="M6 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#8a9a6b"/>
<text x="101" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">MU 1-1</text>
<path d="M14.0 100 l6 -6 h22 v3 h-16 l-4 6 z" fill="#8b5a2b"/><line x1="28.0" y1="93" x2="46.0" y2="93" stroke="#2f3a2b" stroke-width="2.5"/>
<circle cx="30.0" cy="96" r="18" fill="none" stroke="#c92a2a" stroke-width="3"/><line x1="17.0" y1="109" x2="43.0" y2="83" stroke="#c92a2a" stroke-width="3"/>
<text x="52" y="88" font-size="14" fill="#23261f" text-anchor="start">No rifles, except</text>
<text x="52" y="106" font-size="14" fill="#23261f" text-anchor="start">Valdes, Sidney and</text>
<text x="52" y="124" font-size="14" fill="#23261f" text-anchor="start">James islands, or</text>
<text x="52" y="142" font-size="14" fill="#23261f" text-anchor="start">by permit</text>
<rect x="204" y="40" width="190" height="114" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<path d="M204 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v18 h-190 z" fill="#e8590c"/>
<text x="299" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Nanoose Bay, MU 1-5</text>
<text x="212" y="88" font-size="14" fill="#23261f" text-anchor="start">No shooting on the</text>
<text x="212" y="106" font-size="14" fill="#23261f" text-anchor="start">shore and 400 m out on</text>
<text x="212" y="124" font-size="14" fill="#23261f" text-anchor="start">the water</text>
<rect x="6" y="162" width="190" height="132" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M6 172 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v54 h-190 z" fill="#c92a2a"/>
<text x="101" y="180" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Qualicum National</text>
<text x="101" y="198" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Wildlife Areas,</text>
<text x="101" y="216" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">MU 1-6</text>
<text x="14" y="246" font-size="14" fill="#23261f" text-anchor="start">No hunting, trapping,</text>
<text x="14" y="264" font-size="14" fill="#23261f" text-anchor="start">fishing or firearm</text>
<rect x="204" y="162" width="190" height="132" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<path d="M204 172 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v54 h-190 z" fill="#e8590c"/>
<text x="299" y="180" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Westcan Terminals,</text>
<text x="299" y="198" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">MU 1-4</text>
<text x="212" y="246" font-size="14" fill="#23261f" text-anchor="start">No firearms within 25 m</text>
<text x="212" y="264" font-size="14" fill="#23261f" text-anchor="start">of the road midline or</text>
<text x="212" y="282" font-size="14" fill="#23261f" text-anchor="start">seaward of the port</text>
<rect x="6" y="302" width="190" height="114" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<path d="M6 312 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#e8590c"/>
<text x="101" y="320" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Cowichan River,</text>
<text x="101" y="338" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">MU 1-4</text>
<text x="14" y="368" font-size="14" fill="#23261f" text-anchor="start">No firearms within 100</text>
<text x="14" y="386" font-size="14" fill="#23261f" text-anchor="start">m of the high water</text>
<text x="14" y="404" font-size="14" fill="#23261f" text-anchor="start">mark</text>
<rect x="6" y="422" width="14" height="14" rx="3" fill="#8a9a6b"/>
<text x="24" y="434" font-size="14" fill="#23261f" text-anchor="start">Shot only or bow</text>
<rect x="156.4" y="422" width="14" height="14" rx="3" fill="#e8590c"/>
<text x="174" y="434" font-size="14" fill="#23261f" text-anchor="start">No shooting</text>
<rect x="269.8" y="422" width="14" height="14" rx="3" fill="#c92a2a"/>
<text x="288" y="434" font-size="14" fill="#23261f" text-anchor="start">No hunting</text>
</svg>
