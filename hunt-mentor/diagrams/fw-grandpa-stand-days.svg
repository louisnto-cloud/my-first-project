<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Five day strip. Day 1: you sit the stand. Days 2, 3 and 4: GPS collared bucks in one South Carolina study kept out of that stand's zone. Day 5: back to normal. One sit can cost you about three days at that stand. Secondary report, treat as a guide.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="34" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">One sit, three quiet days</text>
  <g font-family="sans-serif" font-size="15" text-anchor="middle">
    <rect x="12" y="70" width="70" height="110" rx="8" fill="#e8590c"/><text x="47" y="96" fill="#ffffff" font-weight="bold">Day 1</text><text x="47" y="140" fill="#ffffff">You sit</text>
    <rect x="90" y="70" width="70" height="110" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="125" y="96" fill="#2f3a2b" font-weight="bold">Day 2</text><text x="125" y="140" fill="#23261f">Bucks</text><text x="125" y="158" fill="#23261f">avoid</text>
    <rect x="168" y="70" width="70" height="110" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="203" y="96" fill="#2f3a2b" font-weight="bold">Day 3</text><text x="203" y="140" fill="#23261f">Bucks</text><text x="203" y="158" fill="#23261f">avoid</text>
    <rect x="246" y="70" width="70" height="110" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="281" y="96" fill="#2f3a2b" font-weight="bold">Day 4</text><text x="281" y="140" fill="#23261f">Bucks</text><text x="281" y="158" fill="#23261f">avoid</text>
    <rect x="324" y="70" width="66" height="110" rx="8" fill="#8a9a6b"/><text x="357" y="96" fill="#ffffff" font-weight="bold">Day 5</text><text x="357" y="140" fill="#ffffff">Back</text>
  </g>
  <text x="200" y="230" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="middle">Rotate stands. Save the best one</text>
  <text x="200" y="252" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="middle">for the right wind and the best days.</text>
  <text x="200" y="284" font-family="sans-serif" font-size="14" fill="#6b4f35" text-anchor="middle">One study, secondary report (Tip)</text>
</svg>
