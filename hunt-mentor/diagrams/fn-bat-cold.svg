<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A thermometer. Between 0 and 35 degrees Celsius the iPhone works normally. Below 0 it may shut off and charging may stop. When it warms up, the battery comes back. Keep it in an inside pocket.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="36" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">iPhone made for 0 to 35°C</text><rect x="170" y="60" width="30" height="200" rx="15" fill="#ffffff" stroke="#2f3a2b" stroke-width="2"/><circle cx="185" cy="260" r="22" fill="#4a7fb0" stroke="none" stroke-width="2"/><rect x="175" y="180" width="20" height="80" rx="0" fill="#4a7fb0" stroke="none" stroke-width="2"/><line x1="200" y1="70" x2="215" y2="70" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><text x="222" y="75" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">35°C</text><line x1="200" y1="180" x2="215" y2="180" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><text x="222" y="185" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">0°C</text><line x1="200" y1="215" x2="215" y2="215" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><text x="222" y="220" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">-10°C</text><line x1="200" y1="250" x2="215" y2="250" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><text x="222" y="255" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">-20°C</text><text x="275" y="125" font-family="sans-serif" font-size="14" fill="#8a9a6b" text-anchor="start" font-weight="bold">Works normally</text><text x="275" y="232" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">May shut off</text><text x="275" y="250" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">Charge may stop</text><text x="20" y="120" font-family="sans-serif" font-size="15" fill="#8a9a6b" text-anchor="start" font-weight="bold">Inside pocket</text><text x="20" y="138" font-family="sans-serif" font-size="15" fill="#8a9a6b" text-anchor="start">stays warm</text><text x="20" y="240" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Warms up:</text><text x="20" y="256" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">battery comes back</text>
</svg>
