<circle cx="30" cy="237.5" r="11" fill="none" stroke="#c92a2a" stroke-width="2.4"/><path d="M22 229.5 L38 245.5" stroke="#c92a2a" stroke-width="2.4"/><path d="M25 237.5 l6 -3 v6z" fill="#f2b134"/>
