<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Day timeline: legal hours run from one hour before sunrise to one hour after sunset. Outside that, no hunting, and following a trail with a rifle counts as hunting. Never use a light with a rifle. Tracking with no rifle is not settled: verify with a conservation officer.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">Legal hours to hunt or track with a rifle</text><rect x="20" y="80" width="360" height="60" rx="6" fill="#2f3a2b"/><rect x="80" y="80" width="240" height="60" fill="#f5d77a"/><text x="200" y="116" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">Legal hours</text><text x="50" y="106" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">No</text><text x="50" y="124" font-size="13" text-anchor="middle" fill="#fff">hunting</text><text x="350" y="106" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">No</text><text x="350" y="124" font-size="13" text-anchor="middle" fill="#fff">hunting</text><line x1="80" y1="70" x2="80" y2="150" stroke="#e8590c" stroke-width="3"/><text x="80" y="168" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">1 h before</text><text x="80" y="186" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">sunrise</text><line x1="320" y1="70" x2="320" y2="150" stroke="#e8590c" stroke-width="3"/><text x="320" y="168" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">1 h after</text><text x="320" y="186" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">sunset</text><circle cx="120" cy="64" r="10" fill="#e8590c"/><text x="136" y="60" font-size="12" fill="#2f3a2b">sunrise</text><circle cx="280" cy="64" r="10" fill="#e8590c"/><text x="264" y="60" font-size="12" text-anchor="end" fill="#2f3a2b">sunset</text><text x="20" y="222" font-size="14" font-weight="bold" fill="#23261f">Following a trail with a rifle is hunting.</text><text x="20" y="244" font-size="14" font-weight="bold" fill="#b3261e">Never with a light or headlamp and a rifle.</text><text x="20" y="266" font-size="14" fill="#2f3a2b">No rifle, just finding a dead deer: VERIFY</text><text x="20" y="288" font-size="14" fill="#2f3a2b">with a conservation officer.</text>
</svg>
