<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif" role="img" aria-label="Day timeline: legal hours run from one hour before sunrise to one hour after sunset. Outside that, no hunting. Following a trail with a rifle counts as hunting. Never use a light or headlamp with a rifle. Tracking with no rifle, just finding a dead deer, is not settled: verify with a conservation officer.">
<rect width="400" height="320" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Legal hours to hunt or track with a rifle</text>
