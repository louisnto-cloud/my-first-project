<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Wind chill examples from the US National Weather Service chart: minus 18 degrees Celsius with a 32 kilometre per hour wind, skin can freeze in about 30 minutes. Minus 23 with an 8 kilometre per hour wind, about 30 minutes. Minus 23 with a 48 kilometre per hour wind, about 10 minutes.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wind makes cold skin freeze faster</text><rect x="10" y="50" width="130" height="54" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="75" y="82" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Air</text><rect x="140" y="50" width="120" height="54" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="200" y="82" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Wind</text><rect x="260" y="50" width="130" height="54" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="325" y="82" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Skin can freeze</text><rect x="10" y="104" width="130" height="54" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="75" y="136" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">-18 °C (0 °F)</text><rect x="140" y="104" width="120" height="54" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="200" y="136" font-size="14" fill="#2f3a2b" text-anchor="middle">32 km/h</text><rect x="260" y="104" width="130" height="54" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="325" y="128" font-size="14" fill="#2f3a2b" text-anchor="middle">about</text><text x="325" y="144" font-size="14" fill="#2f3a2b" text-anchor="middle">30 minutes</text><rect x="10" y="158" width="130" height="54" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="75" y="190" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">-23 °C (-10 °F)</text><rect x="140" y="158" width="120" height="54" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="200" y="190" font-size="14" fill="#2f3a2b" text-anchor="middle">8 km/h</text><rect x="260" y="158" width="130" height="54" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="325" y="182" font-size="14" fill="#2f3a2b" text-anchor="middle">about</text><text x="325" y="198" font-size="14" fill="#2f3a2b" text-anchor="middle">30 minutes</text><rect x="10" y="212" width="130" height="54" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="75" y="244" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">-23 °C (-10 °F)</text><rect x="140" y="212" width="120" height="54" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="200" y="244" font-size="14" fill="#2f3a2b" text-anchor="middle">48 km/h</text><rect x="260" y="212" width="130" height="54" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="325" y="236" font-size="14" fill="#2f3a2b" text-anchor="middle">about</text><text x="325" y="252" font-size="14" fill="#2f3a2b" text-anchor="middle">10 minutes</text><text x="200" y="285" font-size="14" fill="#2f3a2b" text-anchor="middle">US National Weather Service chart</text>
</svg>
