<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 239" font-family="sans-serif" role="img" aria-label="Season bars for Region 7B moose, spike fork, tripalm or 10 point bulls only. In the farm and foothill MUs, 7-19 to 7-22, part of 7-31, 7-33, 7-35, 7-46 to 7-49 and 7-55: only 25 and 26 October, then 10 and 11 November. In the north MUs, 7-36, 7-42, part of 7-43, 7-50, part of 7-51, part of 7-52, 7-53, 7-54 and 7-57: 1 September to 31 October.">
