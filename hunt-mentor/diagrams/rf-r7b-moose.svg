<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 256" role="img" aria-label="Bar chart of Region 7B moose seasons for spike fork, tripalm or 10 point bulls. In 7-19 to 7-22, part of 7-31, 7-33, 7-35, 7-46 to 7-49 and 7-55: only 25 and 26 October, then 10 and 11 November. In 7-36, 7-42, part of 7-43, 7-50, part of 7-51, part of 7-52, 7-53, 7-54 and 7-57: 1 September to 31 October." font-family="sans-serif">
<rect x="0" y="0" width="400" height="256" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Moose seasons</text>
<text x="200" y="46" font-size="14" fill="#6b6f66" text-anchor="middle">Spike fork, tripalm or 10 point bulls only</text>
<rect x="14.0" y="60" width="31.6" height="160" fill="#dfe6d3" opacity=".55"/>
<text x="30" y="74" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">J</text>
<text x="61" y="74" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A</text>
<rect x="77.2" y="60" width="30.6" height="160" fill="#dfe6d3" opacity=".55"/>
<text x="92" y="74" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">S</text>
<text x="124" y="74" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">O</text>
<rect x="139.4" y="60" width="30.6" height="160" fill="#dfe6d3" opacity=".55"/>
<text x="155" y="74" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">N</text>
<text x="186" y="74" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">D</text>
<rect x="201.5" y="60" width="31.6" height="160" fill="#dfe6d3" opacity=".55"/>
<text x="217" y="74" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">J</text>
<text x="247" y="74" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">F</text>
<rect x="261.7" y="60" width="31.6" height="160" fill="#dfe6d3" opacity=".55"/>
<text x="277" y="74" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">M</text>
<text x="309" y="74" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A</text>
<rect x="323.8" y="60" width="31.6" height="160" fill="#dfe6d3" opacity=".55"/>
<text x="340" y="74" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">M</text>
<text x="371" y="74" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">J</text>
<text x="14" y="96" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Farm and foothill MUs (More)</text>
<rect x="132.2" y="102" width="3.0" height="20" rx="4" fill="#e8590c"/>
<text x="138" y="117" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Oct 25 to Oct 26</text>
<text x="14" y="142" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Same MUs</text>
<rect x="148.5" y="148" width="3.0" height="20" rx="4" fill="#e8590c"/>
<text x="155" y="163" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Nov 10 to Nov 11</text>
<text x="14" y="188" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">North MUs (More)</text>
<rect x="77.2" y="194" width="62.2" height="20" rx="4" fill="#e8590c"/>
