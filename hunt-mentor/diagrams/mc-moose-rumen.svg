<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 285" font-family="sans-serif" role="img" aria-label="Flow of food through a moose. Mouth bites and chews. The rumen ferments twigs and the moose brings cud back up to chew again. The omasum is very small in moose. The abomasum is the true stomach. Moose are browsers of twigs and leaves, with wide openings and fast passage, eating up to 20 kilograms a day in winter. A gut shot spills the rumen, so aim forward.">
<rect x="0" y="0" width="400" height="285" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Four part stomach</text><rect x="20" y="70" width="84" height="70" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="62" y="98" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Mouth</text><text x="62" y="120" font-size="14" fill="#6b4f35" text-anchor="middle">chews</text><rect x="116" y="70" width="84" height="70" rx="8" fill="#c9d6b0" stroke="#8a9a6b" stroke-width="2"/><text x="158" y="98" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Rumen</text><text x="158" y="120" font-size="14" fill="#6b4f35" text-anchor="middle">ferments</text><rect x="212" y="70" width="84" height="70" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="254" y="98" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Omasum</text><text x="254" y="120" font-size="14" fill="#6b4f35" text-anchor="middle">tiny</text><rect x="308" y="70" width="84" height="70" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><text x="350" y="98" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Abomasum</text><text x="350" y="120" font-size="14" fill="#6b4f35" text-anchor="middle">digests</text><line x1="106" y1="105" x2="116.0" y2="105.0" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><path d="M116.0 105.0 L107.0 109.3 L107.0 100.7 Z" fill="#e8590c"/><line x1="202" y1="105" x2="212.0" y2="105.0" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><path d="M212.0 105.0 L203.0 109.3 L203.0 100.7 Z" fill="#e8590c"/><line x1="298" y1="105" x2="308.0" y2="105.0" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><path d="M308.0 105.0 L299.0 109.3 L299.0 100.7 Z" fill="#e8590c"/><path d="M158 70 Q120 30 62 66" stroke="#4a7fb0" stroke-width="3" fill="none"/><text x="110" y="46" font-size="14" fill="#4a7fb0" text-anchor="middle" font-weight="bold">cud back up to chew</text><text x="200" y="176" font-size="14" fill="#23261f" text-anchor="middle">Browser: twigs and leaves, not grass</text><text x="200" y="193" font-size="14" fill="#23261f" text-anchor="middle">Wide openings, fast passage</text><text x="200" y="210" font-size="14" fill="#23261f" text-anchor="middle">Up to 20 kg of food a day in winter</text><rect x="30" y="236" width="340" height="34" rx="8" fill="#f3e3d3" stroke="#e8590c" stroke-width="2"/><text x="200" y="258" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Gut shot: rumen spills. Aim forward.</text>
</svg>
