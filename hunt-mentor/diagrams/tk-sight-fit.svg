<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif" role="img" aria-label="Fitting the Arctic sights, the numbers from the Tikka manual: 1 rear sight set screws, four of them, 0.8 newton metres, 7 inch pounds; 2 front sight attachment screw, 5 newton metres, 44 inch pounds; 3 the front sight guiding screw sits against the left wall of the slot; 4 the screw in the drum centre: never open it. The rear sight slides on from the back of the 17 millimetre rail with the screws loosened.">
<rect x="0" y="0" width="400" height="320" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Fitting the sights: the numbers</text><rect x="12" y="42" width="376" height="44" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="34" cy="64" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="69" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="56" y="69" font-size="14" fill="#17201A" text-anchor="start">Rear set screws (4)</text><text x="380" y="69" font-size="14" fill="#1F3D2B" text-anchor="end" font-weight="bold">0.8 Nm (7 in lb)</text><rect x="12" y="94" width="376" height="44" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="34" cy="116" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="121" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="56" y="121" font-size="14" fill="#17201A" text-anchor="start">Front attachment screw</text><text x="380" y="121" font-size="14" fill="#1F3D2B" text-anchor="end" font-weight="bold">5 Nm (44 in lb)</text><rect x="12" y="146" width="376" height="44" rx="8" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="34" cy="168" r="11" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="173" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="56" y="173" font-size="14" fill="#17201A" text-anchor="start">Front guiding screw</text><text x="380" y="173" font-size="14" fill="#1F3D2B" text-anchor="end" font-weight="bold">left wall</text><rect x="12" y="198" width="376" height="44" rx="8" fill="#FFE6D6" stroke="#FF6A13" stroke-width="1.5"/><circle cx="34" cy="220" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="34" y="225" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="56" y="225" font-size="14" fill="#17201A" text-anchor="start">Drum centre screw</text><text x="380" y="225" font-size="14" fill="#FF6A13" text-anchor="end" font-weight="bold">never open</text><rect x="12" y="256" width="376" height="52" rx="8" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="24" y="278" font-size="14" fill="#17201A" text-anchor="start">Rear: slides on from the back of the</text><text x="24" y="298" font-size="14" fill="#17201A" text-anchor="start">17 mm rail. Loosen screws first.</text>
</svg>
