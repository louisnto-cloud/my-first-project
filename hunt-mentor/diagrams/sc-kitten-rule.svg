<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Who is off limits. Top: an adult cougar with a spotted kitten. A kitten is any cougar with spots or under 1 year old. You may not hunt the kitten or any cougar in its company, 98 percent. Bottom: two lynx together. You may not hunt a lynx or bobcat that is with another lynx or bobcat, 98 percent." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Off limits: kittens and their company</text>
<g transform="translate(110 100) scale(1.3)"><path d="M-22,4 L-22,26 M-10,6 L-10,26 M16,6 L16,26 M26,4 L26,26" stroke="#c09060" stroke-width="7" stroke-linecap="round"/><ellipse cx="0" cy="-4" rx="34" ry="12" fill="#c09060" stroke="#23261f" stroke-width="1.2"/><path d="M32,-6 C54,0 60,20 70,22" fill="none" stroke="#c09060" stroke-width="7" stroke-linecap="round"/><path d="M66,20 L74,24" stroke="#23261f" stroke-width="7" stroke-linecap="round"/><circle cx="-38" cy="-10" r="10" fill="#c09060" stroke="#23261f" stroke-width="1.2"/><path d="M-44,-18 L-42,-24 L-38,-19 Z M-34,-19 L-31,-24 L-29,-17 Z" fill="#c09060" stroke="#23261f"/><circle cx="-42" cy="-12" r="1.6" fill="#23261f"/></g>
<g transform="translate(170 130) scale(0.6)"><path d="M-22,4 L-22,26 M-10,6 L-10,26 M16,6 L16,26 M26,4 L26,26" stroke="#c09060" stroke-width="7" stroke-linecap="round"/><ellipse cx="0" cy="-4" rx="34" ry="12" fill="#c09060" stroke="#23261f" stroke-width="1.2"/><path d="M32,-6 C54,0 60,20 70,22" fill="none" stroke="#c09060" stroke-width="7" stroke-linecap="round"/><path d="M66,20 L74,24" stroke="#23261f" stroke-width="7" stroke-linecap="round"/><circle cx="-38" cy="-10" r="10" fill="#c09060" stroke="#23261f" stroke-width="1.2"/><path d="M-44,-18 L-42,-24 L-38,-19 Z M-34,-19 L-31,-24 L-29,-17 Z" fill="#c09060" stroke="#23261f"/><circle cx="-42" cy="-12" r="1.6" fill="#23261f"/><circle cx="-14" cy="-8" r="3" fill="#5c3b1c"/><circle cx="-2" cy="-2" r="3" fill="#5c3b1c"/><circle cx="10" cy="-10" r="3" fill="#5c3b1c"/><circle cx="20" cy="0" r="3" fill="#5c3b1c"/><circle cx="-22" cy="0" r="3" fill="#5c3b1c"/><circle cx="4" cy="-12" r="3" fill="#5c3b1c"/></g>
<rect x="250" y="70" width="140" height="70" rx="8" fill="#f3ead8" stroke="#2f3a2b" stroke-width="2"/>
<text x="320.0" y="100.9" font-size="14" fill="#23261f" text-anchor="middle">Spots, or under</text>
<text x="320.0" y="118.9" font-size="14" fill="#23261f" text-anchor="middle">1 year = kitten</text>
<circle cx="60" cy="150" r="14" fill="#e8590c"/><path d="M55 145 l10 10 m0 -10 l-10 10" stroke="#fff" stroke-width="3" fill="none"/>
<text x="80" y="182" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">Kitten and the adult with it:</text>
<text x="80" y="200" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">both off limits (98%)</text>
<line x1="10" y1="214" x2="390" y2="214" stroke="#8a9a6b" stroke-dasharray="6 6" stroke-width="2"/>
<g transform="translate(70 248) scale(0.6)"><path d="M-24,4 L-24,34 M-12,6 L-12,34 M18,6 L18,34 M28,4 L28,34" stroke="#9a958a" stroke-width="8" stroke-linecap="round"/><ellipse cx="-24" cy="36" rx="7" ry="4" fill="#9a958a" stroke="#23261f"/><ellipse cx="-12" cy="36" rx="7" ry="4" fill="#9a958a" stroke="#23261f"/><ellipse cx="18" cy="36" rx="7" ry="4" fill="#9a958a" stroke="#23261f"/><ellipse cx="28" cy="36" rx="7" ry="4" fill="#9a958a" stroke="#23261f"/><ellipse cx="0" cy="-6" rx="36" ry="15" fill="#9a958a" stroke="#23261f" stroke-width="1.2"/><path d="M34,-14 C42,-18 46,-20 48,-24" fill="none" stroke="#9a958a" stroke-width="8" stroke-linecap="round"/><circle cx="-40" cy="-16" r="13" fill="#9a958a" stroke="#23261f" stroke-width="1.2"/><path d="M-48,-26 L-48,-36 L-40,-28 Z M-36,-28 L-32,-38 L-28,-26 Z" fill="#9a958a" stroke="#23261f"/><path d="M-48,-36 L-48,-50 M-32,-38 L-31,-52" stroke="#23261f" stroke-width="2.5"/><circle cx="-46" cy="-18" r="2" fill="#23261f"/></g>
<g transform="translate(140 252) scale(0.6)"><path d="M-24,4 L-24,34 M-12,6 L-12,34 M18,6 L18,34 M28,4 L28,34" stroke="#9a958a" stroke-width="8" stroke-linecap="round"/><ellipse cx="-24" cy="36" rx="7" ry="4" fill="#9a958a" stroke="#23261f"/><ellipse cx="-12" cy="36" rx="7" ry="4" fill="#9a958a" stroke="#23261f"/><ellipse cx="18" cy="36" rx="7" ry="4" fill="#9a958a" stroke="#23261f"/><ellipse cx="28" cy="36" rx="7" ry="4" fill="#9a958a" stroke="#23261f"/><ellipse cx="0" cy="-6" rx="36" ry="15" fill="#9a958a" stroke="#23261f" stroke-width="1.2"/><path d="M34,-14 C42,-18 46,-20 48,-24" fill="none" stroke="#9a958a" stroke-width="8" stroke-linecap="round"/><circle cx="-40" cy="-16" r="13" fill="#9a958a" stroke="#23261f" stroke-width="1.2"/><path d="M-48,-26 L-48,-36 L-40,-28 Z M-36,-28 L-32,-38 L-28,-26 Z" fill="#9a958a" stroke="#23261f"/><path d="M-48,-36 L-48,-50 M-32,-38 L-31,-52" stroke="#23261f" stroke-width="2.5"/><circle cx="-46" cy="-18" r="2" fill="#23261f"/></g>
<circle cx="200" cy="252" r="13" fill="#e8590c"/><path d="M195 247 l10 10 m0 -10 l-10 10" stroke="#fff" stroke-width="3" fill="none"/>
<text x="300" y="244" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Lynx or bobcat with</text>
<text x="300" y="262" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">another one: no (98%)</text>
</svg>
