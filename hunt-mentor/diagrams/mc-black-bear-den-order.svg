<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Den dates in a study in the northeast Washington Cascades, next to the Okanagan (Gaines 2003). Into the den: females 15 October to 19 November, males 22 October to 19 November. Out of the den: females 4 April to 22 May, males 4 April to 7 May. Females, especially pregnant ones, den longer; males come out first.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">Who dens first, who comes out last</text><text x="12" y="64" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Into the den (fall)</text><line x1="110.0" y1="72" x2="110.0" y2="140" stroke="#c9c2b0" stroke-width="1"/><text x="110.0" y="156" font-size="14" fill="#23261f" text-anchor="middle">Oct 15</text><line x1="211.6304347826087" y1="72" x2="211.6304347826087" y2="140" stroke="#c9c2b0" stroke-width="1"/><text x="211.6304347826087" y="156" font-size="14" fill="#23261f" text-anchor="middle">Nov 1</text><line x1="301.304347826087" y1="72" x2="301.304347826087" y2="140" stroke="#c9c2b0" stroke-width="1"/><text x="301.304347826087" y="156" font-size="14" fill="#23261f" text-anchor="end">Nov 15</text><text x="12" y="93" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Females</text><rect x="110.0" y="76" width="209.23913043478262" height="22" rx="4" fill="#8a9a6b"/><text x="12" y="123" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Males</text><rect x="151.84782608695653" y="106" width="167.3913043478261" height="22" rx="4" fill="#8b5a2b"/><text x="12" y="184" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Out of the den (spring)</text><line x1="110.0" y1="192" x2="110.0" y2="260" stroke="#c9c2b0" stroke-width="1"/><text x="110.0" y="276" font-size="14" fill="#23261f" text-anchor="middle">Apr 4</text><line x1="261.53061224489795" y1="192" x2="261.53061224489795" y2="260" stroke="#c9c2b0" stroke-width="1"/><text x="261.53061224489795" y="276" font-size="14" fill="#23261f" text-anchor="middle">May 1</text><line x1="379.38775510204084" y1="192" x2="379.38775510204084" y2="260" stroke="#c9c2b0" stroke-width="1"/><text x="379.38775510204084" y="276" font-size="14" fill="#23261f" text-anchor="end">May 22</text><text x="12" y="213" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Females</text><rect x="110.0" y="196" width="269.38775510204084" height="22" rx="4" fill="#8a9a6b"/><text x="12" y="243" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Males</text><rect x="110.0" y="226" width="185.20408163265307" height="22" rx="4" fill="#8b5a2b"/>
