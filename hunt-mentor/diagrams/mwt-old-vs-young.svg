<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Comparison table. A yearling buck often moves in daylight, wanders, uses edges and open ground, chases carelessly in the rut and is slow to learn from pressure. A buck 4 years or older rarely moves in daylight, has a smaller tight home range, uses the thickest spot, moves mainly on the rut search days and reacts fast to pressure." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">Young buck vs old buck</text><text x="140" y="52" font-size="15" fill="#e8590c" text-anchor="middle" font-weight="bold">Yearling</text><text x="300" y="52" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">4 years plus</text><rect x="8" y="64" width="384" height="40" rx="6" fill="#dfe6d3"/><text x="16" y="89" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Moves in daylight</text><text x="170" y="89" font-size="14" fill="#e8590c" text-anchor="middle">often</text><text x="320" y="89" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">rarely</text><rect x="8" y="108" width="384" height="40" rx="6" fill="#fffaf0"/><text x="16" y="133" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Home range</text><text x="170" y="133" font-size="14" fill="#e8590c" text-anchor="middle">wandering</text><text x="320" y="133" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">smaller, tight</text><rect x="8" y="152" width="384" height="40" rx="6" fill="#dfe6d3"/><text x="16" y="177" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Cover</text><text x="170" y="177" font-size="14" fill="#e8590c" text-anchor="middle">edges, open</text><text x="320" y="177" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">thickest spot</text><rect x="8" y="196" width="384" height="40" rx="6" fill="#fffaf0"/><text x="16" y="221" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Rut</text><text x="170" y="221" font-size="14" fill="#e8590c" text-anchor="middle">chases, careless</text><text x="320" y="221" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">search days only</text><rect x="8" y="240" width="384" height="40" rx="6" fill="#dfe6d3"/><text x="16" y="265" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Pressure</text><text x="170" y="265" font-size="14" fill="#e8590c" text-anchor="middle">slow to learn</text><text x="320" y="265" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">reacts fast</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">GPS studies plus hunter experience. See More.</text>
</svg>
