<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="How to read a shell box: 1 gauge, 2 shell length, 3 shot material, 4 shot size, 5 shot weight in ounces, 6 speed in feet per second.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Read the box</text>
<rect x="30" y="50" width="340" height="150" rx="10" fill="#ffffff" stroke="#1F3D2B" stroke-width="2.5"/>
<text x="92.0" y="106.0" font-size="19" font-weight="bold" fill="#17201A" text-anchor="middle">12 GA</text>
<circle cx="92" cy="74" r="11" fill="#1F3D2B"/><text x="92" y="79.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="200.0" y="106.0" font-size="19" font-weight="bold" fill="#17201A" text-anchor="middle">3 in</text>
<circle cx="200" cy="74" r="11" fill="#1F3D2B"/><text x="200" y="79.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="308.0" y="106.0" font-size="19" font-weight="bold" fill="#17201A" text-anchor="middle">STEEL</text>
<circle cx="308" cy="74" r="11" fill="#FF6A13"/><text x="308" y="79.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="92.0" y="180.0" font-size="19" font-weight="bold" fill="#17201A" text-anchor="middle">No. 2</text>
<circle cx="92" cy="148" r="11" fill="#1F3D2B"/><text x="92" y="153.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="200.0" y="180.0" font-size="19" font-weight="bold" fill="#17201A" text-anchor="middle">1 1/4 oz</text>
<circle cx="200" cy="148" r="11" fill="#1F3D2B"/><text x="200" y="153.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="308.0" y="180.0" font-size="19" font-weight="bold" fill="#17201A" text-anchor="middle">1450 fps</text>
<circle cx="308" cy="148" r="11" fill="#1F3D2B"/><text x="308" y="153.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<text x="40.0" y="228.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="start">1 gauge</text>
<text x="160.0" y="228.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="start">2 length</text>
<text x="280.0" y="228.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="start">3 material</text>
<text x="40.0" y="254.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="start">4 size</text>
<text x="160.0" y="254.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="start">5 weight</text>
<text x="280.0" y="254.0" font-size="15" font-weight="bold" fill="#17201A" text-anchor="start">6 speed</text>
<text x="200.0" y="290.0" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Example box. Check every line.</text>
</svg>
