<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 376" font-family="sans-serif" role="img" aria-label="Average daily high and low temperatures, normals 1991 to 2020, 95 percent. Each bar runs from the low to the high. Kamloops: October 13.6 and 3.5, November 5.8 and minus 1.1. Abbotsford: October 15.0 and 6.4, November 9.5 and 2.7. Osoyoos: October 16.2 and 4.1, November 7.3 and minus 0.3.">
