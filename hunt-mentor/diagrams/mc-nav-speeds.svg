<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of walking speeds: road or trail 5 kilometres an hour, off trail 4, off path by Tobler about 3, still hunting a few hundred metres an hour. Sources Aitken and Tobler, 75 percent; still hunting is a Tip.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">How fast you really move</text><text x="130" y="77.25" font-size="15" fill="#23261f" text-anchor="end">Road, trail</text><rect x="140" y="54.17" width="190.0" height="36.160000000000004" rx="3" fill="#8a9a6b"/><text x="336.0" y="77.25" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">5 km/h</text><text x="130" y="133.75" font-size="15" fill="#23261f" text-anchor="end">Off trail</text><rect x="140" y="110.67" width="152.0" height="36.160000000000004" rx="3" fill="#e8590c"/><text x="298.0" y="133.75" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">4 km/h</text><text x="130" y="190.25" font-size="15" fill="#23261f" text-anchor="end">Off path, Tobler</text><rect x="140" y="167.17" width="114.0" height="36.160000000000004" rx="3" fill="#8a9a6b"/><text x="260.0" y="190.25" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">about 3 km/h</text><text x="130" y="246.75" font-size="15" fill="#23261f" text-anchor="end">Still hunting</text><rect x="140" y="223.67" width="15.2" height="36.160000000000004" rx="3" fill="#8a9a6b"/><text x="161.2" y="246.75" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">a few 100 m/h</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Aitken, Tobler (75%). Still hunting: Tip</text>
</svg>
