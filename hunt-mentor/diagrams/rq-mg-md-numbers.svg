<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Bar chart from the Southern Interior Mule Deer Project. 74 percent of collared deer that could migrate did, 78 percent in the 2020 update. Average 47.2 kilometres a year, 55 in the 2020 update. Longest move 102 kilometres in a straight line.">
<rect x="0" y="0" width="400" height="250" fill="#fffaf0"/>
<text x="200.0" y="26" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Southern Interior mule deer collars</text>
<text x="14" y="64" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Collared deer that migrated</text>
<rect x="14" y="70" width="250" height="20" rx="4" fill="#2f3a2b"/>
<text x="270.25454545454545" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">74% (78% in 2020)</text>
<text x="14" y="116" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Average migration per year</text>
<rect x="14" y="122" width="160" height="20" rx="4" fill="#8a9a6b"/>
<text x="179.62181818181818" y="137" font-family="sans-serif" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">47.2 km (55 km in 2020)</text>
<text x="14" y="168" font-family="sans-serif" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Longest straight line move</text>
<rect x="14" y="174" width="345" height="20" rx="4" fill="#e8590c"/>
<text x="352.94545454545454" y="189" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="end">102 km</text>
<text x="14" y="226" font-family="sans-serif" font-size="13" fill="#6b4f35" text-anchor="start">BC Wildlife Federation project pages, 2019 to</text>
<text x="14" y="242" font-family="sans-serif" font-size="13" fill="#6b4f35" text-anchor="start">current (85%).</text>
</svg>
