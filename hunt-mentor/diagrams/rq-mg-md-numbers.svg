<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 348" font-family="sans-serif" role="img" aria-label="Three numbers from the Southern Interior Mule Deer Project collars. 74 percent of collared deer that could migrate did, 78 percent in the 2020 update. Average 47.2 kilometres a year, 55 in the 2020 update. Longest move 102 kilometres in a straight line. BC Wildlife Federation project pages, 2019 to current, 85 percent.">
<rect width="400" height="348" fill="#fffaf0"/>
<text x="14" y="28" font-size="18" font-weight="bold" fill="#2f3a2b">Southern Interior mule deer collars</text>
<rect x="8" y="42" width="384" height="76" rx="8" fill="#f4eedf"/>
<circle cx="44" cy="80.0" r="24" fill="#efe8d6" stroke="#d8cfb8"/>
<path d="M44 80.0 L44 56.0 A24 24 0 1 1 20.0 81.5z" fill="#e8590c"/>
<text x="84" y="76" font-size="28" font-weight="bold" fill="#c2410c">74%</text>
<text x="143.734" y="74" font-size="16" fill="#2f3a2b">of collared deer migrated</text>
<text x="84" y="100" font-size="15" font-weight="bold" fill="#6b5b4b">78% in the 2020 update</text>
<rect x="8" y="126" width="384" height="76" rx="8" fill="#f4eedf"/>
<path d="M22 180.0 C34 168.0 30 154.0 44 156.0 C56 158.0 52 146.0 66 146.0" stroke="#8b5a2b" stroke-width="3" fill="none" stroke-dasharray="5 4"/><circle cx="22" cy="180.0" r="4" fill="#2f3a2b"/><circle cx="66" cy="146.0" r="4" fill="#e8590c"/>
<text x="84" y="160" font-size="28" font-weight="bold" fill="#c2410c">47.2 km</text>
<text x="205.451" y="158" font-size="16" fill="#2f3a2b"></text>
<text x="84" y="182" font-size="16" fill="#2f3a2b">average migration a year</text>
<text x="84" y="200" font-size="14" font-weight="bold" fill="#6b5b4b">55 km in the 2020 update</text>
<rect x="8" y="216" width="384" height="76" rx="8" fill="#f4eedf"/>
<path d="M22 268.0 L64 240.0" stroke="#2f3a2b" stroke-width="3"/><circle cx="22" cy="268.0" r="4" fill="#2f3a2b"/><path d="M66 238.0 l-11 2 l6 6z" fill="#2f3a2b"/>
<text x="84" y="250" font-size="28" font-weight="bold" fill="#c2410c">102 km</text>
<text x="197.062" y="248" font-size="16" fill="#2f3a2b"></text>
<text x="84" y="272" font-size="16" fill="#2f3a2b">longest straight line move</text>
<text x="14" y="314" font-size="14" fill="#6b5b4b">BC Wildlife Federation project pages, 2019 to current</text>
<text x="14" y="334" font-size="14" fill="#6b5b4b">(85%).</text>
</svg>
