<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 304" font-family="sans-serif" role="img" aria-label="Young bear or adult boar, from the synopsis Notice to Black Bear Hunters, page 80. Young bear: lines from the ears to the nose form a skinny triangle; all legs, long thin neck, ears look big and close together, looks over its shoulder often. Large adult male: the lines form an equal sided triangle; a big round head like a basketball, small looking ears, thick neck, belly near the ground.">
<rect x="0" y="0" width="400" height="304" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Young bear or big boar? (page 80)</text><rect x="8" y="40" width="188" height="256" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><rect x="204" y="40" width="188" height="256" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="2"/><path d="M76 100 Q102 86 128 100 L112 160 Q102 168 92 160 Z" fill="#1d1d1b"/><path d="M84 96 L88 70 L100 92 Z M120 96 L116 70 L104 92 Z" fill="#1d1d1b"/><path d="M88 80 L116 80 L102 164 Z" fill="none" stroke="#e8590c" stroke-width="3"/><circle cx="92" cy="120" r="3" fill="#eee"/><circle cx="112" cy="120" r="3" fill="#eee"/><circle cx="298" cy="124" r="44" fill="#1d1d1b"/><circle cx="264" cy="86" r="9" fill="#1d1d1b"/><circle cx="332" cy="86" r="9" fill="#1d1d1b"/><ellipse cx="298" cy="148" rx="14" ry="11" fill="#8b6a4a"/><path d="M264 86 L332 86 L298 150 Z" fill="none" stroke="#e8590c" stroke-width="3"/><circle cx="288" cy="120" r="3" fill="#eee"/><circle cx="308" cy="120" r="3" fill="#eee"/><text x="102" y="196" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Young: skinny triangle</text><text x="102" y="222" font-size="14" fill="#23261f" text-anchor="middle">All legs, long thin neck</text><text x="102" y="244" font-size="14" fill="#23261f" text-anchor="middle">Big ears close together</text><text x="102" y="266" font-size="14" fill="#23261f" text-anchor="middle">Looks over its shoulder</text><text x="298" y="196" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Adult male: even triangle</text><text x="298" y="222" font-size="14" fill="#23261f" text-anchor="middle">Head like a basketball</text><text x="298" y="244" font-size="14" fill="#23261f" text-anchor="middle">Small ears, thick neck</text><text x="298" y="266" font-size="14" fill="#23261f" text-anchor="middle">Belly near the ground</text>
</svg>
