<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Track measuring kit: a soft tape in centimetres, a track stick with two movable rubber bands, a notebook, and a phone with your knife beside the print for scale.">
