<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A clock showing one hour: get the guts out or the meat off within the hour, because the body cavity is the hottest part and stays hot.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">Guts out or meat off within the hour</text><circle cx="110" cy="150" r="70" fill="#fff" stroke="#23261f" stroke-width="4"/><path d="M110 150 L110 80 A70 70 0 1 1 109.9 80 Z" fill="#e8590c" fill-opacity=".2"/><line x1="110" y1="150" x2="110" y2="96" stroke="#23261f" stroke-width="5" stroke-linecap="round"/><line x1="110" y1="150" x2="150" y2="150" stroke="#23261f" stroke-width="4" stroke-linecap="round"/><text x="110" y="246" font-size="18" font-weight="bold" text-anchor="middle" fill="#e8590c">1 hour</text><text x="220" y="110" font-size="15" font-weight="bold" fill="#23261f">The body cavity</text><text x="220" y="130" font-size="15" fill="#23261f">is the hottest part</text><text x="220" y="150" font-size="15" fill="#23261f">and stays hot.</text><text x="220" y="190" font-size="15" font-weight="bold" fill="#23261f">Open it or take</text><text x="220" y="210" font-size="15" font-weight="bold" fill="#23261f">the meat off now.</text><text x="200" y="292" font-size="14" text-anchor="middle" fill="#2f3a2b">Spoilage starts when the heart stops</text>
</svg>
