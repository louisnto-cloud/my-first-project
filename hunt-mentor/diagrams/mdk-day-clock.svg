<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A 24 hour clock of a mallard&#x27;s day, 80 percent, midnight at the top. Night: roost. Dawn: a flight out to feed. Morning: feed in fields or shallows. Midday: rest on open water. Late afternoon: feed again. Dusk: a flight back to roost. An outer green ring marks legal hours, from half an hour before sunrise to half an hour after sunset. Hunting pressure moves feeding into the night, 75 percent."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="22" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A mallard&#x27;s day clock (80%)</text><path d="M30.8 154.5 A88 88 0 0 1 206.0 166.0 L158.0 166.0 A40 40 0 0 0 78.3 160.8 Z" fill="#3d4a63"/><path d="M206.0 166.0 A88 88 0 0 1 199.3 199.7 L155.0 181.3 A40 40 0 0 0 158.0 166.0 Z" fill="#e8590c"/><path d="M199.3 199.7 A88 88 0 0 1 151.7 247.3 L133.3 203.0 A40 40 0 0 0 155.0 181.3 Z" fill="#d9c27a"/><path d="M151.7 247.3 A88 88 0 0 1 48.2 219.6 L86.3 190.4 A40 40 0 0 0 133.3 203.0 Z" fill="#4a7fb0"/><path d="M48.2 219.6 A88 88 0 0 1 30.8 177.5 L78.3 171.2 A40 40 0 0 0 86.3 190.4 Z" fill="#d9c27a"/><path d="M30.8 177.5 A88 88 0 0 1 30.8 154.5 L78.3 160.8 A40 40 0 0 0 78.3 171.2 Z" fill="#e8590c"/><path d="M215.2 153.2 A98 98 0 1 1 20.8 153.2 L28.8 154.3 A90 90 0 1 0 207.2 154.3 Z" fill="#8a9a6b"/><circle cx="118" cy="166" r="38" fill="#fffaf0"/><text x="118" y="172" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">24 h</text><text x="118.0" y="67.0" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">0</text><text x="222.0" y="171.0" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">6</text><text x="118.00000000000001" y="275.0" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">12</text><text x="14.0" y="171.00000000000003" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">18</text><rect x="236" y="70" width="20" height="20" rx="4" fill="#3d4a63"/><text x="262" y="85" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Night:</text><text x="262" y="101" font-size="14" fill="#2f3a2b" text-anchor="start">roost</text><rect x="236" y="104" width="20" height="20" rx="4" fill="#e8590c"/><text x="262" y="119" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Flights:</text><text x="262" y="135" font-size="14" fill="#2f3a2b" text-anchor="start">dawn and dusk</text><rect x="236" y="138" width="20" height="20" rx="4" fill="#d9c27a"/><text x="262" y="153" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Feed:</text><text x="262" y="169" font-size="14" fill="#2f3a2b" text-anchor="start">fields, shallows</text><rect x="236" y="172" width="20" height="20" rx="4" fill="#4a7fb0"/><text x="262" y="187" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Midday:</text><text x="262" y="203" font-size="14" fill="#2f3a2b" text-anchor="start">rest on water</text><rect x="236" y="206" width="20" height="20" rx="4" fill="#8a9a6b"/><text x="262" y="221" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Outer ring:</text><text x="262" y="237" font-size="14" fill="#2f3a2b" text-anchor="start">legal hours</text><text x="200" y="296" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Pressure moves feeding into the night (75%)</text></svg>
