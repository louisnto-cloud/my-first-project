<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A moose with pale grey patches where it has rubbed off its hair on the neck, shoulders, withers and hind quarters. This is winter tick hair loss, seen January to April. Winter ticks are no health risk to people.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
