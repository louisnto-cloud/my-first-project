" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 -12 L44 -44 L58 -40 L42 8 Z" fill="#5c3b1c" stroke="#23261f" stroke-width="2" stroke-linejoin="round"/><ellipse cx="62" cy="-42" rx="16" ry="7" transform="rotate(20 62 -42)" fill="#5c3b1c" stroke="#23261f" stroke-width="2"/><ellipse cx="46" cy="-53" rx="8" ry="3.5" transform="rotate(-35 46 -53)" fill="#5c3b1c" stroke="#23261f" stroke-width="1.5"/><circle cx="60" cy="-46" r="1.8" fill="#23261f"/></g><text x="110" y="230" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Summer</text><text x="110" y="250" font-size="14" fill="#23261f" text-anchor="middle">Sleek, reddish brown</text><text x="110" y="268" font-size="14" fill="#23261f" text-anchor="middle">Little undercoat</text><text x="300" y="230" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Winter</text><text x="300" y="250" font-size="14" fill="#23261f" text-anchor="middle">Grey brown body</text><text x="300" y="268" font-size="14" fill="#23261f" text-anchor="middle">Dark head, neck, legs</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Moult May and June: ragged look (90%)</text>
