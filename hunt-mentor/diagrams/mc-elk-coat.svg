<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two elk side by side. Summer coat: sleek reddish brown with little undercoat. Winter coat: grey brown body with dark brown head, neck and legs. In the May and June moult the coat looks ragged. Source BC elk account.">
<rect width="400" height="300" fill="#fffaf0"/>
