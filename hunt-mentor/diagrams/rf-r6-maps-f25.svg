<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 608" role="img" aria-label="Cards for Maps F25 to F33. F25 Spatsizi, Stikine and Klappan: moose Limited Entry Hunting only areas. F26 Spatsizi: mountain sheep draw only areas. F27 Todagin Mountain: no shooting, archery only, and mountain goat closed. F28 Spatsizi, Gladys Lake, Ecological Reserve: no hunting, and no firearms within 1 kilometre of Cold Fish Lake Camp. F29 Spatsizi: goat draw only, the Dawson area is general open season. F30 Mt. Edziza Park: sheep and goat draw only. F31 Stikine and Tuya: goat draw only. F32 Midway Mine Access Trail: the seasonal vehicle route. F33 Atlin: mountain goat closed area and No Hunting Area." font-family="sans-serif">
