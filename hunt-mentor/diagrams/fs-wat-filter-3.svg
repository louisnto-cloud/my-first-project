<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Filter step 3: many hollow fibre filters are damaged if they freeze. Sleep with it and keep it in an inside pocket on cold days.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3. Keep it from freezing</text><rect x="170" y="80" width="60" height="120" rx="8" fill="#2f3a2b"/><text x="200" y="230" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Inside pocket</text><text x="310" y="120" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Frozen once?</text><text x="310" y="140" font-size="15" fill="#2f3a2b" text-anchor="middle">check the maker</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Warm pocket, warm sleeping bag</text>
</svg>
