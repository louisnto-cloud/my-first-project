<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 346" font-family="sans-serif" role="img" aria-label="How to be a good guest. Do: learn the name of the nation and say it right. Do: respect Indigenous hunters and do not disturb them. Do not: report a First Nations hunter for hunting out of season, it is probably lawful; report only what is clearly unsafe. Do not: touch, photograph or disturb cultural sites. Do: go to the band office in person, off season. Do: buy from the nations when you can.">
<rect x="0" y="0" width="400" height="346" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Be a good guest</text><rect x="10" y="44" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(40 78) scale(0.9)"><path d="M-20 -14 H20 V8 H-2 L-12 18 V8 H-20 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12 -6 H12 M-12 1 H6" stroke="#8a9a6b" stroke-width="2.5"/></g><circle cx="179" cy="60" r="11" fill="#8a9a6b"/><path d="M173 60 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Learn the</text><text x="68" y="86" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">nation&#x27;s</text><text x="68" y="104" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">name, say it</text><text x="68" y="122" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">right</text><rect x="203" y="44" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(233 78) scale(0.9)"><path d="M-20 0 Q0 -16 20 0 Q0 16 -20 0 Z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle r="6" fill="#2f3a2b"/></g><circle cx="372" cy="60" r="11" fill="#8a9a6b"/><path d="M366 60 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="261" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Respect</text><text x="261" y="86" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Indigenous</text><text x="261" y="104" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">hunters, do</text><text x="261" y="122" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">not disturb</text><rect x="10" y="144" width="185" height="92" rx="10" fill="#fdf0e6" stroke="#e8590c" stroke-width="2"/><g transform="translate(40 178) scale(0.9)"><rect x="-10" y="-18" width="20" height="36" rx="4" fill="#2f3a2b"/><rect x="-7" y="-13" width="14" height="24" fill="#dbe7f2"/><circle cx="0" cy="14" r="1.8" fill="#fff"/></g><circle cx="179" cy="160" r="11" fill="#e8590c"/><path d="M174 155 l10 10 M184 155 l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="68" y="168" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Report a</text><text x="68" y="186" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">lawful</text><text x="68" y="204" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">harvest as</text><text x="68" y="222" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">poaching</text><rect x="203" y="144" width="185" height="92" rx="10" fill="#fdf0e6" stroke="#e8590c" stroke-width="2"/><g transform="translate(233 178) scale(0.9)"><rect x="-18" y="-8" width="36" height="24" rx="4" fill="#2f3a2b"/><rect x="-8" y="-13" width="16" height="6" rx="2" fill="#2f3a2b"/><circle cx="0" cy="4" r="8" fill="#dbe7f2" stroke="#fff" stroke-width="2"/></g><circle cx="372" cy="160" r="11" fill="#e8590c"/><path d="M367 155 l10 10 M377 155 l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="261" y="168" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Touch or</text><text x="261" y="186" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">disturb</text><text x="261" y="204" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">cultural</text><text x="261" y="222" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">sites</text><rect x="10" y="244" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(40 278) scale(0.9)"><rect x="-13" y="-20" width="26" height="40" rx="2" fill="#8b5a2b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="2" r="2.5" fill="#f5f0e0"/></g><circle cx="179" cy="260" r="11" fill="#8a9a6b"/><path d="M173 260 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="268" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Band office,</text><text x="68" y="286" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">in person,</text><text x="68" y="304" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">off season</text><rect x="203" y="244" width="185" height="92" rx="10" fill="#f3f6ec" stroke="#8a9a6b" stroke-width="2"/><g transform="translate(233 278) scale(0.9)"><path d="M-12 -10 h20 l-2 26 h-16 z" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 -4 q10 0 8 10 q-2 6 -9 5" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6 -16 q3 -4 0 -8 M2 -16 q3 -4 0 -8" stroke="#8a9a6b" stroke-width="2" fill="none"/></g><circle cx="372" cy="260" r="11" fill="#8a9a6b"/><path d="M366 260 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="261" y="268" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Buy from the</text><text x="261" y="286" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">nations when</text><text x="261" y="304" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">you can</text>
</svg>
