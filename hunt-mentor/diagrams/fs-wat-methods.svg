<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Table from the US Centers for Disease Control: boiling kills Giardia, bacteria and viruses. A 1 micron filter removes Giardia, not all bacteria, no viruses. A 0.3 micron filter removes Giardia and bacteria, not viruses. Bleach or iodine: Giardia not well, bacteria and viruses yes. A UV pen: all three, in clear water only.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">What kills what</text><rect x="6" y="46" width="130" height="38" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="71" y="70" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Method</text><rect x="136" y="46" width="88" height="38" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="180" y="70" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Giardia</text><rect x="224" y="46" width="88" height="38" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="268" y="70" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Bacteria</text><rect x="312" y="46" width="82" height="38" rx="0" fill="#2f3a2b" stroke="#c9c2ad" stroke-width="1"/><text x="353" y="70" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Viruses</text><rect x="6" y="84" width="130" height="38" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="71" y="108" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Boil</text><rect x="136" y="84" width="88" height="38" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="180" y="108" font-size="14" fill="#2f3a2b" text-anchor="middle">Yes</text><rect x="224" y="84" width="88" height="38" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="268" y="108" font-size="14" fill="#2f3a2b" text-anchor="middle">Yes</text><rect x="312" y="84" width="82" height="38" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="353" y="108" font-size="14" fill="#2f3a2b" text-anchor="middle">Yes</text><rect x="6" y="122" width="130" height="38" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="71" y="146" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Filter 1 micron</text><rect x="136" y="122" width="88" height="38" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="180" y="146" font-size="14" fill="#2f3a2b" text-anchor="middle">Yes</text><rect x="224" y="122" width="88" height="38" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="268" y="146" font-size="14" fill="#2f3a2b" text-anchor="middle">Not all</text><rect x="312" y="122" width="82" height="38" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="353" y="146" font-size="14" fill="#2f3a2b" text-anchor="middle">No</text><rect x="6" y="160" width="130" height="38" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="71" y="184" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Filter 0.3</text><rect x="136" y="160" width="88" height="38" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="180" y="184" font-size="14" fill="#2f3a2b" text-anchor="middle">Yes</text><rect x="224" y="160" width="88" height="38" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="268" y="184" font-size="14" fill="#2f3a2b" text-anchor="middle">Yes</text><rect x="312" y="160" width="82" height="38" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="353" y="184" font-size="14" fill="#2f3a2b" text-anchor="middle">No</text><rect x="6" y="198" width="130" height="38" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="71" y="222" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bleach, iodine</text><rect x="136" y="198" width="88" height="38" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="180" y="222" font-size="14" fill="#2f3a2b" text-anchor="middle">Not well</text><rect x="224" y="198" width="88" height="38" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="268" y="222" font-size="14" fill="#2f3a2b" text-anchor="middle">Yes</text><rect x="312" y="198" width="82" height="38" rx="0" fill="#f3efe2" stroke="#c9c2ad" stroke-width="1"/><text x="353" y="222" font-size="14" fill="#2f3a2b" text-anchor="middle">Yes</text><rect x="6" y="236" width="130" height="38" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="71" y="260" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">UV pen</text><rect x="136" y="236" width="88" height="38" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="180" y="260" font-size="14" fill="#2f3a2b" text-anchor="middle">Yes</text><rect x="224" y="236" width="88" height="38" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="268" y="260" font-size="14" fill="#2f3a2b" text-anchor="middle">Yes</text><rect x="312" y="236" width="82" height="38" rx="0" fill="#ffffff" stroke="#c9c2ad" stroke-width="1"/><text x="353" y="260" font-size="14" fill="#2f3a2b" text-anchor="middle">Yes</text><text x="200" y="296" font-size="14" fill="#2f3a2b" text-anchor="middle">CDC backcountry water table</text>
</svg>
