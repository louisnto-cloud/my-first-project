<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 218" font-family="sans-serif" role="img" aria-label="Age bar. Under 10: no hunting, and letting a child under 10 hunt is an offence. Age 10 to 17: youth licence. 18 and up: an initiation licence once in a lifetime, or CORE and a basic licence.">
<rect x="0" y="0" width="400" height="218" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Age and the licence</text><rect x="20" y="60" width="120" height="50" fill="#9aa3ad"/><text x="80.0" y="132" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Under 10</text><text x="80.0" y="152" font-size="14" fill="#23261f" text-anchor="middle">No hunting</text><rect x="140" y="60" width="96" height="50" fill="#4a7fb0"/><text x="188.0" y="132" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="middle">10 to 17</text><text x="188.0" y="152" font-size="14" fill="#23261f" text-anchor="middle">Youth</text><text x="188.0" y="169" font-size="14" fill="#23261f" text-anchor="middle">licence</text><rect x="236" y="60" width="144" height="50" fill="#e8590c"/><text x="308.0" y="132" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">18 and up</text><text x="308.0" y="152" font-size="14" fill="#23261f" text-anchor="middle">Initiation or CORE</text><text x="140" y="52" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">10</text><text x="236" y="52" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">18</text><text x="200" y="204" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Letting a child under 10 hunt is an offence (99%).</text>
</svg>
