<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 314" font-family="sans-serif" role="img" aria-label="Range ruler for steel shot: 20 to 30 metres for upland birds, ducks out to 35 metres, 40 yards is the edge, past that is for looking only. A decoy set at 35 metres marks the line.">
<rect width="400" height="314" fill="#fffaf0"/>
<text x="200" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">How far with steel shot</text>
