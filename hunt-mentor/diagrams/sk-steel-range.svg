<text x="259" y="196" font-size="14" fill="#2f3a2b" text-anchor="end">30 m</text>
<line x1="299.0" y1="172" x2="299.0" y2="180" stroke="#2f3a2b" stroke-width="2"/>
<text x="303" y="196" font-size="14" font-weight="bold" fill="#2f3a2b">35 m</text>
