<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Range ruler for steel shot: 20 to 30 metres for upland birds, ducks out to 35 metres, 40 yards is the edge, past that is for looking only. A decoy set at 35 metres marks the line.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">How far with steel shot</text><rect x="30.0" y="120" width="225.0" height="40" fill="#2e7d32" fill-opacity=".25"/><rect x="255.0" y="120" width="37.5" height="40" fill="#2e7d32" fill-opacity=".45"/><rect x="292.5" y="120" width="15.0" height="40" fill="#e8590c" fill-opacity=".5"/><rect x="307.5" y="120" width="67.5" height="40" fill="#b3261e" fill-opacity=".25"/><line x1="30.0" y1="160" x2="30.0" y2="170" stroke="#23261f" stroke-width="2"/><text x="30.0" y="186" font-size="13" text-anchor="middle" fill="#23261f">0 m</text><line x1="105.0" y1="160" x2="105.0" y2="170" stroke="#23261f" stroke-width="2"/><text x="105.0" y="186" font-size="13" text-anchor="middle" fill="#23261f">10 m</text><line x1="180.0" y1="160" x2="180.0" y2="170" stroke="#23261f" stroke-width="2"/><text x="180.0" y="186" font-size="13" text-anchor="middle" fill="#23261f">20 m</text><line x1="255.0" y1="160" x2="255.0" y2="170" stroke="#23261f" stroke-width="2"/><text x="255.0" y="186" font-size="13" text-anchor="middle" fill="#23261f">30 m</text><line x1="292.5" y1="160" x2="292.5" y2="170" stroke="#23261f" stroke-width="2"/><text x="292.5" y="186" font-size="13" text-anchor="middle" fill="#23261f">35 m</text><rect x="10" y="118" width="24" height="44" fill="#c9b79c" stroke="#23261f" stroke-width="2"/><text x="22" y="108" font-size="13" font-weight="bold" text-anchor="middle" fill="#23261f">You</text><text x="142.5" y="145" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">Upland 20 to 30 m</text><text x="273.75" y="214" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">Ducks</text><text x="273.75" y="230" font-size="14" font-weight="bold" text-anchor="middle" fill="#23261f">to 35 m</text><line x1="273.75" y1="198" x2="273.75" y2="162" stroke="#23261f" stroke-width="1.5"/><text x="300.0" y="100" font-size="13" font-weight="bold" text-anchor="middle" fill="#e8590c">40 yd</text><text x="300.0" y="84" font-size="13" font-weight="bold" text-anchor="middle" fill="#e8590c">edge</text><text x="341.25" y="145" font-size="14" font-weight="bold" text-anchor="middle" fill="#b3261e">Look only</text><g transform="translate(292.5 160)"><ellipse cx="0" cy="-6" rx="12" ry="6" fill="#6b4f35"/><circle cx="-10" cy="-12" r="4" fill="#6b4f35"/></g><text x="296.5" y="252" font-size="14" text-anchor="middle" fill="#2f3a2b">Tip: a decoy set at 35 m</text><text x="296.5" y="270" font-size="14" text-anchor="middle" fill="#2f3a2b">is your line</text><g transform="translate(180.0 64) scale(0.8)"><ellipse cx="0" cy="0" rx="20" ry="8" fill="#23261f"/><circle cx="-21" cy="-5" r="6" fill="#23261f"/><path d="M-27 -5 L-36 -3 L-27 -1 Z" fill="#e8590c"/><path d="M-4 -3 L6 -24 L14 -4 Z" fill="#2f3a2b"/></g><g transform="translate(345.0 64) scale(0.8)"><ellipse cx="0" cy="0" rx="20" ry="8" fill="#9a9a8a"/><circle cx="-21" cy="-5" r="6" fill="#9a9a8a"/><path d="M-27 -5 L-36 -3 L-27 -1 Z" fill="#e8590c"/><path d="M-4 -3 L6 -24 L14 -4 Z" fill="#2f3a2b"/></g>
</svg>
