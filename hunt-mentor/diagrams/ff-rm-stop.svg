<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Six warning signs from the Tikka manual that mean stop shooting at once: the trigger feels different, a misfire, the safety does not work, gas spits or a primer is pierced, a case is bulged or split, or the shot sounds different. Unload and take it to a gunsmith or the maker.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Stop shooting if you see...</text><rect x="20" y="50" width="174" height="56" rx="8" fill="#f3d5d2" stroke="#b3261e" stroke-width="1.5"/><text x="107" y="84" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Trigger feels different</text><rect x="206" y="50" width="174" height="56" rx="8" fill="#f3d5d2" stroke="#b3261e" stroke-width="1.5"/><text x="293" y="84" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Click, no bang (misfire)</text><rect x="20" y="120" width="174" height="56" rx="8" fill="#f3d5d2" stroke="#b3261e" stroke-width="1.5"/><text x="107" y="154" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Safety does not work</text><rect x="206" y="120" width="174" height="56" rx="8" fill="#f3d5d2" stroke="#b3261e" stroke-width="1.5"/><text x="293" y="154" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Gas spits, primer pierced</text><rect x="20" y="190" width="174" height="56" rx="8" fill="#f3d5d2" stroke="#b3261e" stroke-width="1.5"/><text x="107" y="224" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Case bulged or split</text><rect x="206" y="190" width="174" height="56" rx="8" fill="#f3d5d2" stroke="#b3261e" stroke-width="1.5"/><text x="293" y="224" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Shot sounds different</text><rect x="60" y="258" width="280" height="30" rx="15.0" fill="#2f3a2b" stroke="none" stroke-width="2"/><text x="200.0" y="278.25" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Unload. Gunsmith or maker.</text>
</svg>
