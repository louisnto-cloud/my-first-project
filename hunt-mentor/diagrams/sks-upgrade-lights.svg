<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three columns. GO, green: sling, recoil pad, fixed stock, soft point ammunition. ASK a gunsmith, orange: scope mount, a stock swap, trigger work, removing the bayonet. NO, red: cutting the barrel, unpinning the magazine, a bullpup stock, a suppressor.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Upgrades: go, ask, no</text>
<rect x="10.0" y="46.0" width="124.0" height="216.0" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="3"/><rect x="10.0" y="46.0" width="124.0" height="34.0" rx="10" fill="#2E7D4F" stroke="#2E7D4F" stroke-width="1"/><text x="72.0" y="70.0" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GO</text><text x="72.0" y="110.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Sling</text><text x="72.0" y="148.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Recoil pad</text><text x="72.0" y="186.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Fixed stock</text><text x="72.0" y="224.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Soft points</text><rect x="138.0" y="46.0" width="124.0" height="216.0" rx="10" fill="#FFFFFF" stroke="#FF6A13" stroke-width="3"/><rect x="138.0" y="46.0" width="124.0" height="34.0" rx="10" fill="#FF6A13" stroke="#FF6A13" stroke-width="1"/><text x="200.0" y="70.0" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ASK</text><text x="200.0" y="110.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Scope mount</text><text x="200.0" y="148.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Stock swap</text><text x="200.0" y="186.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Trigger work</text><text x="200.0" y="224.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Bayonet off</text><rect x="266.0" y="46.0" width="124.0" height="216.0" rx="10" fill="#FFFFFF" stroke="#B3261E" stroke-width="3"/><rect x="266.0" y="46.0" width="124.0" height="34.0" rx="10" fill="#B3261E" stroke="#B3261E" stroke-width="1"/><text x="328.0" y="70.0" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">NO</text><text x="328.0" y="110.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Cut barrel</text><text x="328.0" y="148.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Unpin mag</text><text x="328.0" y="186.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Bullpup</text><text x="328.0" y="224.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Suppressor</text>
<text x="200.0" y="288.0" font-size="14" fill="#17201A" text-anchor="middle">ASK means a qualified gunsmith.</text>
</svg>
