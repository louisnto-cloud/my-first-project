<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 3: leaving Canada with a non restricted firearm you do not have to stop at a CBSA office. Recommended: CBSA Form BSF407 listing the serial numbers.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="34" cy="34" r="20" fill="#e8590c"/>
<text x="34" y="41" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="64" y="32" font-size="19" font-weight="bold" fill="#23261f">Leaving Canada</text>
<circle cx="133" cy="124" r="52" fill="#dfe6d3"/>
<g transform="translate(133.33333333333334 124) scale(1.6)"><rect x="-30" y="-20" width="8" height="40" fill="#2f3a2b"/><rect x="-22" y="-8" width="52" height="7" fill="#e8590c"/><path d="M-12 -8 v7 M2 -8 v7 M16 -8 v7" stroke="#fff" stroke-width="5"/></g>
<circle cx="267" cy="124" r="52" fill="#dfe6d3"/>
<g transform="translate(266.6666666666667 124) scale(1.6)"><rect x="-32" y="-12" width="64" height="24" rx="10" fill="#2f3a2b"/><rect x="-26" y="-6" width="52" height="12" rx="6" fill="#6b4f35"/><rect x="-4" y="9" width="8" height="8" rx="2" fill="#e8590c"/></g>
<text x="200" y="204" font-size="15" fill="#2f3a2b" text-anchor="middle">No CBSA stop needed (85%).</text>
<text x="200" y="224" font-size="15" fill="#2f3a2b" text-anchor="middle">BSF407 card with serial numbers:</text>
<text x="200" y="244" font-size="15" fill="#2f3a2b" text-anchor="middle">recommended.</text>
</svg>
