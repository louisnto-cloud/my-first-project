<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 512" font-family="sans-serif" role="img" aria-label="Three cards for the elk near the owner bases, each with a bar on the same 0 to 3,500 elk scale. Heffley Creek, Region 3: 300 to 500 elk, increasing (90%); no general open season (99%). Mission, Region 2: Roosevelt elk, 2,200 to 2,800; no general open season, Limited Entry Hunting draws only. South Okanagan, Region 8: 2,500 to 3,500 elk; 6 point bulls 10 September to 20 October; about 4 percent success. Region 2 hunters took 407 elk from 2020 to 2024 by draw (85%, my reading). Estimates from the BC 2022 table (90%). Rules from Rule Book pages 28, 34 and 68 (99%).">
