<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three cards for the owner bases. Heffley Creek, Region 3: 300 to 500 elk, increasing; no general open season. Mission, Region 2: Roosevelt elk, 2,200 to 2,800; no general open season; limited entry draws only. South Okanagan, Region 8: 2,500 to 3,500 elk; 6 point bulls 10 September to 20 October; about 4 percent resident success. Region 2 hunters took 407 elk from 2020 to 2024 by draw.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Elk near your three bases</text><rect x="8" y="44" width="124" height="150" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><rect x="8" y="44" width="124" height="26" rx="8" fill="#2f3a2b"/><rect x="8" y="58" width="124" height="12" rx="0" fill="#2f3a2b"/><text x="70.0" y="62" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Heffley Creek</text><text x="70.0" y="92" font-size="14" fill="#23261f" text-anchor="middle">R3</text><text x="70.0" y="114" font-size="14" fill="#23261f" text-anchor="middle">300 to 500 elk</text><text x="70.0" y="136" font-size="14" fill="#23261f" text-anchor="middle">increasing (90%)</text><text x="70.0" y="158" font-size="14" fill="#23261f" text-anchor="middle">No general season</text><text x="70.0" y="180" font-size="14" fill="#23261f" text-anchor="middle">(99%)</text><rect x="138" y="44" width="124" height="150" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><rect x="138" y="44" width="124" height="26" rx="8" fill="#4a7fb0"/><rect x="138" y="58" width="124" height="12" rx="0" fill="#4a7fb0"/><text x="200.0" y="62" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">Mission, R2</text><text x="200.0" y="92" font-size="14" fill="#23261f" text-anchor="middle">R2</text><text x="200.0" y="114" font-size="14" fill="#23261f" text-anchor="middle">Roosevelt elk</text><text x="200.0" y="136" font-size="14" fill="#23261f" text-anchor="middle">2,200 to 2,800</text><text x="200.0" y="158" font-size="14" fill="#23261f" text-anchor="middle">No general season</text><text x="200.0" y="180" font-size="14" fill="#23261f" text-anchor="middle">LEH draws only</text><rect x="268" y="44" width="124" height="150" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><rect x="268" y="44" width="124" height="26" rx="8" fill="#e8590c"/><rect x="268" y="58" width="124" height="12" rx="0" fill="#e8590c"/><text x="330.0" y="62" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">South Okanagan</text><text x="330.0" y="92" font-size="14" fill="#23261f" text-anchor="middle">R8</text><text x="330.0" y="114" font-size="14" fill="#23261f" text-anchor="middle">2,500 to 3,500</text><text x="330.0" y="136" font-size="14" fill="#23261f" text-anchor="middle">6 point bulls</text><text x="330.0" y="158" font-size="14" fill="#23261f" text-anchor="middle">10 Sept to 20 Oct</text><text x="330.0" y="180" font-size="14" fill="#23261f" text-anchor="middle">About 4% success</text><text x="200" y="226" font-size="14" fill="#6b4f35" text-anchor="middle">Estimates: BC 2022 table (90%)</text><text x="200" y="248" font-size="14" fill="#6b4f35" text-anchor="middle">Rules: Rule Book pages 28, 34, 68 (99%)</text><text x="200" y="274" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Region 2 harvest: 407 elk, 2020 to 2024,</text><text x="200" y="292" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">by draw (85%, my reading)</text>
</svg>
