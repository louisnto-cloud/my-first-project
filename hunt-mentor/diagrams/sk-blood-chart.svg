<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 342" font-family="sans-serif" role="img" aria-label="Blood sign chart. Pink, frothy blood with bubbles: lungs, wait 30 minutes. Bright red, lots of it: heart or a big artery, wait 30 minutes. Dark red with no bubbles: liver, wait 4 to 6 hours. Thin greenish brown with food bits and a smell: gut, wait 6 to 8 hours. Thin, patchy blood while the deer keeps running: muscle or leg, wait 30 to 60 minutes.">
<rect x="0" y="0" width="400" height="342" fill="#fffaf0"/>
<text x="200" y="24" font-size="16" font-weight="bold" text-anchor="middle" fill="#23261f">Blood sign: what it means, how long to wait</text><text x="20" y="50" font-size="13" font-weight="bold" fill="#2f3a2b">Looks like</text><text x="204" y="50" font-size="13" font-weight="bold" fill="#2f3a2b">Hit</text><text x="390" y="50" font-size="13" font-weight="bold" text-anchor="end" fill="#2f3a2b">Wait</text><rect x="8" y="60" width="384" height="46" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><path d="M18 88 q 6 -16 18 -12 q 14 -4 16 8 q 2 12 -14 14 q -18 4 -20 -10 Z" fill="#ef8a8a"/><circle cx="30" cy="81" r="4" fill="#fff" fill-opacity=".85" stroke="#fff"/><circle cx="42" cy="85" r="3" fill="#fff" fill-opacity=".85" stroke="#fff"/><circle cx="46" cy="77" r="2.5" fill="#fff" fill-opacity=".85" stroke="#fff"/><circle cx="34" cy="89" r="2.5" fill="#fff" fill-opacity=".85" stroke="#fff"/><circle cx="38" cy="75" r="2" fill="#fff" fill-opacity=".85" stroke="#fff"/><text x="66" y="80" font-size="13" font-weight="bold" fill="#23261f">Pink, frothy,</text><text x="66" y="98" font-size="13" fill="#23261f">bubbles</text><text x="204" y="89" font-size="15" font-weight="bold" fill="#23261f">Lungs</text><text x="388" y="89" font-size="14" font-weight="bold" text-anchor="end" fill="#2e7d32">30 min</text><rect x="8" y="112" width="384" height="46" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><path d="M18 140 q 6 -16 18 -12 q 14 -4 16 8 q 2 12 -14 14 q -18 4 -20 -10 Z" fill="#c62828"/><text x="66" y="132" font-size="13" font-weight="bold" fill="#23261f">Bright red,</text><text x="66" y="150" font-size="13" fill="#23261f">lots of it</text><text x="204" y="141" font-size="15" font-weight="bold" fill="#23261f">Heart, artery</text><text x="388" y="141" font-size="14" font-weight="bold" text-anchor="end" fill="#2e7d32">30 min</text><rect x="8" y="164" width="384" height="46" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><path d="M18 192 q 6 -16 18 -12 q 14 -4 16 8 q 2 12 -14 14 q -18 4 -20 -10 Z" fill="#5d1414"/><text x="66" y="184" font-size="13" font-weight="bold" fill="#23261f">Dark red,</text><text x="66" y="202" font-size="13" fill="#23261f">no bubbles</text><text x="204" y="193" font-size="15" font-weight="bold" fill="#23261f">Liver</text><text x="388" y="193" font-size="14" font-weight="bold" text-anchor="end" fill="#e8590c">4 to 6 h</text><rect x="8" y="216" width="384" height="46" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><path d="M18 244 q 6 -16 18 -12 q 14 -4 16 8 q 2 12 -14 14 q -18 4 -20 -10 Z" fill="#7a6a2a"/><rect x="28" y="234" width="5" height="4" fill="#c9b79c"/><rect x="40" y="242" width="5" height="4" fill="#c9b79c"/><text x="66" y="236" font-size="13" font-weight="bold" fill="#23261f">Thin, green brown,</text><text x="66" y="254" font-size="13" fill="#23261f">food bits, smells</text><text x="204" y="245" font-size="15" font-weight="bold" fill="#23261f">Gut</text><text x="388" y="245" font-size="14" font-weight="bold" text-anchor="end" fill="#b3261e">6 to 8 h</text><rect x="8" y="268" width="384" height="46" rx="6" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><circle cx="24" cy="285" r="3" fill="#c62828"/><circle cx="40" cy="295" r="2.5" fill="#c62828"/><circle cx="50" cy="283" r="2" fill="#c62828"/><circle cx="34" cy="301" r="2" fill="#c62828"/><text x="66" y="288" font-size="13" font-weight="bold" fill="#23261f">Thin, patchy,</text><text x="66" y="306" font-size="13" fill="#23261f">deer runs on</text><text x="204" y="297" font-size="15" font-weight="bold" fill="#23261f">Muscle, leg</text><text x="388" y="297" font-size="14" font-weight="bold" text-anchor="end" fill="#2e7d32">30 to 60 min</text><text x="200" y="334" font-size="13" text-anchor="middle" fill="#2f3a2b">Opinion from hunter education, not law (70%)</text>
</svg>
