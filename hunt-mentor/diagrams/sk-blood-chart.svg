<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 366" font-family="sans-serif" role="img" aria-label="Blood sign chart: what the blood looks like, what was hit, and how long to wait before you follow. Pink, frothy blood with bubbles: lungs, wait 30 minutes. Bright red, lots of it: heart or a big artery, wait 30 minutes. Dark red with no bubbles: liver, wait 4 to 6 hours. Thin, green brown with food bits and a smell: gut, wait 6 to 8 hours. Thin, patchy blood while the deer keeps running: muscle or leg, wait 30 to 60 minutes. Opinion from hunter education, not law (70%).">
<rect width="400" height="366" fill="#fffaf0"/>
<text x="390" y="20" font-size="15" font-weight="bold" fill="#6b5b4b" text-anchor="end">wait</text>
<rect x="8" y="30" width="384" height="56" rx="8" fill="#f4eedf"/>
<circle cx="38" cy="58" r="23" fill="#e7dcc4" stroke="#cdbf9f" stroke-width="1"/>
<g transform="translate(38 58)"><path d="M-14 2 C-14 -10 -4 -14 3 -13 C14 -11 15 0 11 7 C7 14 -6 15 -11 10z" fill="#ef8f8f"/><circle cx="-5" cy="-3" r="3.4" fill="#fff" fill-opacity=".9"/><circle cx="4" cy="2" r="2.8" fill="#fff" fill-opacity=".9"/><circle cx="6" cy="-6" r="2.2" fill="#fff" fill-opacity=".9"/><circle cx="-2" cy="6" r="2.2" fill="#fff" fill-opacity=".9"/><circle cx="-8" cy="4" r="1.6" fill="#fff" fill-opacity=".9"/></g>
<text x="72" y="54" font-size="17" font-weight="bold" fill="#2f3a2b">Lungs</text>
<text x="72" y="75" font-size="15" fill="#6b5b4b">pink, frothy, bubbles</text>
<rect x="313.9008" y="44" width="72.1" height="28" rx="14" fill="#2f6e3b"/>
<text x="350" y="63" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">30 min</text>
<rect x="8" y="92" width="384" height="56" rx="8" fill="#fffaf0"/>
<circle cx="38" cy="120" r="23" fill="#e7dcc4" stroke="#cdbf9f" stroke-width="1"/>
<g transform="translate(38 120)"><path d="M-17 2 C-17 -12 -5 -17 3 -15 C17 -14 19 0 14 8 C8 17 -7 18 -14 12z" fill="#c62828"/><circle cx="18" cy="-12" r="3" fill="#c62828"/><circle cx="-16" cy="13" r="2.4" fill="#c62828"/></g>
<text x="72" y="116" font-size="17" font-weight="bold" fill="#2f3a2b">Heart, artery</text>
<text x="72" y="137" font-size="15" fill="#6b5b4b">bright red, lots of it</text>
<rect x="313.9008" y="106" width="72.1" height="28" rx="14" fill="#2f6e3b"/>
<text x="350" y="125" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">30 min</text>
<rect x="8" y="154" width="384" height="56" rx="8" fill="#f4eedf"/>
<circle cx="38" cy="182" r="23" fill="#e7dcc4" stroke="#cdbf9f" stroke-width="1"/>
<g transform="translate(38 182)"><path d="M-13 2 C-13 -9 -4 -13 3 -12 C13 -10 14 0 10 6 C6 13 -5 14 -10 9z" fill="#5d1414"/></g>
<text x="72" y="178" font-size="17" font-weight="bold" fill="#2f3a2b">Liver</text>
<text x="72" y="199" font-size="15" fill="#6b5b4b">dark red, no bubbles</text>
<rect x="305.6832" y="168" width="80.3" height="28" rx="14" fill="#e8590c"/>
<text x="345.8" y="187" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">4 to 6 h</text>
<rect x="8" y="216" width="384" height="56" rx="8" fill="#fffaf0"/>
<circle cx="38" cy="244" r="23" fill="#e7dcc4" stroke="#cdbf9f" stroke-width="1"/>
<g transform="translate(38 244)"><path d="M-17 4 C-12 -6 2 -9 14 -4 C20 0 14 8 4 8 C-6 9 -14 10 -17 4z" fill="#7a6a2a"/><rect x="-6" y="-3" width="5" height="4" fill="#c9b79c"/><rect x="5" y="1" width="4" height="3" fill="#a9c27a"/><path d="M-4 -12 c-3 -4 3 -6 0 -10 M5 -11 c-3 -4 3 -6 0 -10" stroke="#9a8c6a" stroke-width="1.3" fill="none"/></g>
<text x="72" y="240" font-size="17" font-weight="bold" fill="#2f3a2b">Gut</text>
<text x="72" y="261" font-size="15" fill="#6b5b4b">thin, green brown, food bits, smells</text>
<rect x="305.6832" y="230" width="80.3" height="28" rx="14" fill="#c0392b"/>
<text x="345.8" y="249" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">6 to 8 h</text>
<rect x="8" y="278" width="384" height="56" rx="8" fill="#f4eedf"/>
<circle cx="38" cy="306" r="23" fill="#e7dcc4" stroke="#cdbf9f" stroke-width="1"/>
<g transform="translate(38 306)"><circle cx="-12" cy="-8" r="3" fill="#c62828"/><circle cx="2" cy="-2" r="2.4" fill="#c62828"/><circle cx="12" cy="8" r="2" fill="#c62828"/><circle cx="-4" cy="10" r="1.8" fill="#c62828"/><circle cx="10" cy="-12" r="1.6" fill="#c62828"/></g>
<text x="72" y="302" font-size="17" font-weight="bold" fill="#2f3a2b">Muscle, leg</text>
<text x="72" y="323" font-size="15" fill="#6b5b4b">thin, patchy, deer runs on</text>
<rect x="266.99199999999996" y="292" width="119.0" height="28" rx="14" fill="#2f6e3b"/>
<text x="326.5" y="311" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">30 to 60 min</text>
<text x="200" y="354" font-size="14" fill="#6b5b4b" text-anchor="middle">Opinion from hunter education, not law (70%)</text>
</svg>
