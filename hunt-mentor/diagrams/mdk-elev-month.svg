<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of where ducks are by elevation each month, general pattern, 60 percent. January and February: 0 to 700 metres. March: up to 1,000. April: up to 1,500. May to August: 300 to 1,500 metres on breeding wetlands. September and October: 0 to 1,500. November: 0 to 1,000. December: 0 to 700. Freeze up pushes them low, below about 700 metres."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Duck elevations by month (60%)</text><rect x="46" y="156.0" width="22" height="84.0" rx="4" fill="#4a7fb0"/><text x="57" y="258" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">J</text><rect x="75" y="156.0" width="22" height="84.0" rx="4" fill="#4a7fb0"/><text x="86" y="258" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">F</text><rect x="104" y="120.0" width="22" height="120.0" rx="4" fill="#4a7fb0"/><text x="115" y="258" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">M</text><rect x="133" y="60.0" width="22" height="180.0" rx="4" fill="#4a7fb0"/><text x="144" y="258" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A</text><rect x="162" y="60.0" width="22" height="144.0" rx="4" fill="#4a7fb0"/><text x="173" y="258" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">M</text><rect x="191" y="60.0" width="22" height="144.0" rx="4" fill="#4a7fb0"/><text x="202" y="258" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">J</text><rect x="220" y="60.0" width="22" height="144.0" rx="4" fill="#4a7fb0"/><text x="231" y="258" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">J</text><rect x="249" y="60.0" width="22" height="144.0" rx="4" fill="#4a7fb0"/><text x="260" y="258" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A</text><rect x="278" y="60.0" width="22" height="180.0" rx="4" fill="#4a7fb0"/><text x="289" y="258" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">S</text><rect x="307" y="60.0" width="22" height="180.0" rx="4" fill="#e8590c"/><text x="318" y="258" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">O</text><rect x="336" y="120.0" width="22" height="120.0" rx="4" fill="#e8590c"/><text x="347" y="258" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">N</text><rect x="365" y="156.0" width="22" height="84.0" rx="4" fill="#4a7fb0"/><text x="376" y="258" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">D</text><line x1="40" y1="240.0" x2="394" y2="240.0" stroke="#c9c9b9" stroke-width="1" fill="none"/><text x="36" y="245.0" font-size="14" fill="#2f3a2b" text-anchor="end">0</text><line x1="40" y1="180.0" x2="394" y2="180.0" stroke="#c9c9b9" stroke-width="1" fill="none"/><text x="36" y="185.0" font-size="14" fill="#2f3a2b" text-anchor="end">500</text><line x1="40" y1="120.0" x2="394" y2="120.0" stroke="#c9c9b9" stroke-width="1" fill="none"/><text x="36" y="125.0" font-size="14" fill="#2f3a2b" text-anchor="end">1000</text><line x1="40" y1="60.0" x2="394" y2="60.0" stroke="#c9c9b9" stroke-width="1" fill="none"/><text x="36" y="65.0" font-size="14" fill="#2f3a2b" text-anchor="end">1500</text><text x="200" y="286" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Freeze up pushes them low: below 700 m</text></svg>
