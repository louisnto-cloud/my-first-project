<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 446" font-family="sans-serif" role="img" aria-label="The seven journal fields: date, one entry per day; place or MU, with your own pin name; species hunted; weather and wind, written as where the wind comes from; what you saw, with species, sex, number and time; shots and result, where no shots is an answer; and one lesson.">
<rect x="0" y="0" width="400" height="446" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Seven fields, every trip</text><rect x="10" y="44" width="185" height="92" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(40 78) scale(0.9)"><rect x="-18" y="-14" width="36" height="32" rx="3" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-18" y="-14" width="36" height="9" fill="#e8590c"/><path d="M-10 -18 v6 M10 -18 v6" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-10 2 h4 M-2 2 h4 M6 2 h4 M-10 10 h4 M-2 10 h4" stroke="#2f3a2b" stroke-width="3"/></g><text x="68" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Date</text><text x="68" y="86" font-size="14" fill="#23261f" text-anchor="start">One entry per</text><text x="68" y="103" font-size="14" fill="#23261f" text-anchor="start">day</text><rect x="203" y="44" width="185" height="92" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(233 78) scale(0.9)"><path d="M0 20 C-14 2 -14 -18 0 -18 C14 -18 14 2 0 20 Z" fill="#e8590c"/><circle cy="-6" r="5" fill="#fff"/></g><text x="261" y="68" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Place or MU</text><text x="261" y="86" font-size="14" fill="#23261f" text-anchor="start">MU plus your pin</text><text x="261" y="103" font-size="14" fill="#23261f" text-anchor="start">name</text><rect x="10" y="144" width="185" height="92" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(40 178) scale(0.9)"><ellipse cx="2" cy="2" rx="15" ry="8" fill="#8b5a2b"/><path d="M-10 8 v12 M-4 8 v12 M8 8 v12 M14 8 v12" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/><path d="M-12 -2 L-18 -12" stroke="#8b5a2b" stroke-width="6" stroke-linecap="round"/><ellipse cx="-20" cy="-14" rx="6" ry="4" fill="#8b5a2b"/><path d="M-19 -18 l-2 -8 m2 4 l4 -5 M-17 -18 l3 -6" stroke="#6b4f35" stroke-width="2" fill="none" stroke-linecap="round"/></g><text x="68" y="168" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Species hunted</text><text x="68" y="186" font-size="14" fill="#23261f" text-anchor="start">What you held a</text><text x="68" y="203" font-size="14" fill="#23261f" text-anchor="start">licence for</text><rect x="203" y="144" width="185" height="92" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(233 178) scale(0.9)"><path d="M-20 -8 H8 Q16 -8 16 -14 Q16 -20 9 -19 M-20 2 H14 Q22 2 22 9 Q22 16 14 15 M-20 12 H0" fill="none" stroke="#4a7fb0" stroke-width="3.5" stroke-linecap="round"/></g><text x="261" y="168" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Weather and</text><text x="261" y="186" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">wind</text><text x="261" y="204" font-size="14" fill="#23261f" text-anchor="start">Wind FROM,</text><text x="261" y="221" font-size="14" fill="#23261f" text-anchor="start">morning and</text><text x="261" y="238" font-size="14" fill="#23261f" text-anchor="start">evening</text><rect x="10" y="244" width="185" height="92" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(40 278) scale(0.9)"><rect x="-18" y="-10" width="14" height="22" rx="6" fill="#2f3a2b"/><rect x="4" y="-10" width="14" height="22" rx="6" fill="#2f3a2b"/><rect x="-6" y="-4" width="12" height="8" fill="#2f3a2b"/><circle cx="-11" cy="10" r="4" fill="#dbe7f2"/><circle cx="11" cy="10" r="4" fill="#dbe7f2"/></g><text x="68" y="268" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">What you saw</text><text x="68" y="286" font-size="14" fill="#23261f" text-anchor="start">Species, sex,</text><text x="68" y="303" font-size="14" fill="#23261f" text-anchor="start">number, time</text><rect x="203" y="244" width="185" height="92" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(233 278) scale(0.9)"><circle r="16" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -20 V-6 M0 6 V20 M-20 0 H-6 M6 0 H20" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="261" y="268" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Shots and</text><text x="261" y="286" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">result</text><text x="261" y="304" font-size="14" fill="#23261f" text-anchor="start">&quot;No shots&quot; is an</text><text x="261" y="321" font-size="14" fill="#23261f" text-anchor="start">answer</text><rect x="10" y="344" width="185" height="92" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><g transform="translate(40 378) scale(0.9)"><path d="M0 -18 L5 -6 L18 -6 L8 2 L12 15 L0 7 L-12 15 L-8 2 L-18 -6 L-5 -6 Z" fill="#e8590c"/></g><text x="68" y="368" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">One lesson</text><text x="68" y="386" font-size="14" fill="#23261f" text-anchor="start">One. Not five</text>
</svg>
