<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 454" font-family="sans-serif" role="img" aria-label="The seven journal fields: date, one entry per day; place or MU, Management Unit, with your own pin name; species hunted, what you held a licence for; weather and wind, written as where the wind comes FROM, morning and evening; what you saw, with species, sex, number and time; shots and result, where no shots is an answer; and one lesson, one, not five.">
