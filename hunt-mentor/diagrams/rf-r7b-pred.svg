<text x="14" y="398" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Lynx, all MUs (Nov 1 new)</text>
<rect x="139.4" y="404" width="109.1" height="20" rx="4" fill="#e8590c"/>
