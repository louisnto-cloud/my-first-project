<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 512" role="img" aria-label="Bar chart of Region 7B bear, wolf and furbearer seasons. Black bear: 15 August to 15 November and 1 April to 30 June. Wolf: 1 August to 31 March and 1 April to 15 June, and no closed season below 1,100 metres. Cougar: 10 September to 31 March. Coyote: 1 September to 31 March, and no closed season below 1,100 metres. Wolverine in the listed units: 15 October to 15 January. Lynx: 1 November to 15 February, the 1 November date new. Snowshoe hare: 1 August to 30 April." font-family="sans-serif">
<rect x="0" y="0" width="400" height="512" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Bear, wolf and furbearers</text>
