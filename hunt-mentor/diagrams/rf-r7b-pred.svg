<text x="289" y="235" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">Apr 1 to June 15</text>
<text x="14" y="260" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Cougar, all MUs</text>
<rect x="86.4" y="266" width="206.9" height="20" rx="4" fill="#e8590c"/>
