<text x="14" y="76" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Black bear, all MUs</text>
<rect x="59.9" y="82" width="94.8" height="20" rx="4" fill="#e8590c"/>
<text x="159" y="97" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Aug 15 to Nov 15</text>
<text x="14" y="122" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Black bear, spring</text>
<rect x="293.3" y="128" width="92.7" height="20" rx="4" fill="#e8590c"/>
<text x="289" y="143" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">Apr 1 to June 30</text>
<text x="14" y="168" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Wolf (open all year below 1,100 m)</text>
