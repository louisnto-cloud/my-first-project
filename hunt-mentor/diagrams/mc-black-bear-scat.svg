<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="What black bear scat shows by season, a tip. Spring: green, grassy and fibrous from grass, sedge and horsetail. Summer: ant bits, seeds and hair from insects and early berries. Fall: loose and full of berries such as saskatoon, chokecherry or apple. Coast in fall: fish bones and scales from salmon. The scat tells you what bears are eating now.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="8" y="8" width="384" height="34" rx="8" fill="#2f3a2b"/><text x="20" y="31" font-size="16" font-weight="bold" fill="#fff" text-anchor="start">What is in the scat?</text><rect x="10" y="50" width="380" height="52" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="72" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Spring</text><text x="130" y="72" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Green, grassy, fibrous</text><text x="130" y="93" font-size="14" fill="#23261f" text-anchor="start">grass, sedge, horsetail</text><rect x="10" y="108" width="380" height="52" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="130" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Summer</text><text x="130" y="130" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Ant bits, seeds, hair</text><text x="130" y="151" font-size="14" fill="#23261f" text-anchor="start">insects, early berries</text><rect x="10" y="166" width="380" height="52" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="188" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">Fall</text><text x="130" y="188" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Loose, full of berries</text><text x="130" y="209" font-size="14" fill="#23261f" text-anchor="start">saskatoon, chokecherry, apples</text><rect x="10" y="224" width="380" height="52" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="18" y="246" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="start">Coast fall</text><text x="130" y="246" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Fish bones, scales</text><text x="130" y="267" font-size="14" fill="#23261f" text-anchor="start">salmon</text><text x="200" y="290" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Scat tells you what bears eat now (Tip)</text>
</svg>
