<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side view of one slope. Water at the bottom, an open feeding slope in the middle, and a bed on a bench below timber near the top with a view down. In the morning deer drift up to bed; in the evening they come down to feed and water. A pattern, not a law.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Bed, feed, water: one slope</text><path d="M0 280 L80 260 L170 200 L230 150 L250 140 L300 132 L340 90 L400 60 L400 300 L0 300 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><path d="M0 290 Q 60 284 120 290 L120 300 L0 300 Z" fill="#4a7fb0"/><text x="20" y="284" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">water</text><polygon points="300,128 308,102 316,128" fill="#2f3a2b"/><polygon points="318,112 326,86 334,112" fill="#2f3a2b"/><polygon points="282,132 290,106 298,132" fill="#2f3a2b"/><ellipse cx="262" cy="136" rx="16" ry="6" fill="#8b5a2b"/><text x="190" y="96" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">bed: bench below cover,</text><text x="190" y="114" font-size="14" fill="#23261f" text-anchor="middle">view down the slope</text><text x="130" y="228" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">feed: open slope</text><path d="M120 250 Q 180 200 250 142" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="6 5"/><line x1="200" y1="186" x2="214" y2="174" stroke="#e8590c" stroke-width="3"/><polygon points="214.0,174.0 210.0,183.2 204.3,176.6" fill="#e8590c"/><text x="176" y="168" font-size="14" fill="#e8590c" text-anchor="end" font-weight="bold">morning: up</text><path d="M240 160 Q 170 230 100 268" fill="none" stroke="#4a7fb0" stroke-width="3" stroke-dasharray="6 5"/><line x1="130" y1="252" x2="116" y2="260" stroke="#4a7fb0" stroke-width="3"/><polygon points="116.0,260.0 121.7,251.8 126.0,259.3" fill="#4a7fb0"/><text x="214" y="236" font-size="14" fill="#4a7fb0" text-anchor="start" font-weight="bold">evening: down</text><text x="200" y="60" font-size="14" fill="#6b4f35" text-anchor="middle">Pattern, not a law (Tip)</text>
</svg>
