<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="sans-serif" role="img" aria-label="What to carry while hunting, drawn as the items. Photo ID: show it when an officer asks. Your FWID number: know it or produce it. Every species licence from this licence year, used or not. For ducks and geese, the federal migratory bird permit. The hunting licence itself is electronic, no paper needed. Tip: carry your PAL with any firearm, a habit, not a hunting rule.">
<rect width="400" height="500" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pocket check at the truck</text>
<g data-tip="Photo ID|You must know or produce your FWID (Fish and Wildlife ID) number and photo ID when an officer asks. Keep the photo ID in your wallet.">
<rect x="8" y="44" width="188" height="142" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<circle cx="30" cy="66" r="14" fill="#e8590c"/><text x="30" y="72" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<g transform="translate(110 94) scale(1.15)"><rect x="-34" y="-22" width="68" height="44" rx="5" fill="#dfe8f0" stroke="#5b6f84" stroke-width="1.6"/><rect x="-28" y="-15" width="22" height="28" rx="3" fill="#b9c7d6"/><circle cx="-17" cy="-6" r="5" fill="#5b6f84"/><path d="M-26 12 C-26 2 -8 2 -8 12z" fill="#5b6f84"/><path d="M0 -10 H26 M0 -2 H22 M0 6 H26" stroke="#5b6f84" stroke-width="2.4" stroke-linecap="round" fill="none"/></g>
<text x="102" y="152" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="middle">Photo ID</text>
<text x="102" y="174" font-size="15" fill="#2f3a2b" text-anchor="middle">show when asked</text>
</g>
<g data-tip="FWID number|FWID means Fish and Wildlife ID. Know it or produce it on request. Officers can open your profile in the field, but the duty to know it is still yours.">
<rect x="204" y="44" width="188" height="142" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<circle cx="226" cy="66" r="14" fill="#e8590c"/><text x="226" y="72" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<g transform="translate(306 94) scale(1.15)"><rect x="-34" y="-22" width="68" height="44" rx="5" fill="#fdf1e6" stroke="#b3470a" stroke-width="1.6"/><text x="0" y="-2" font-size="14" font-weight="bold" fill="#b3470a" text-anchor="middle">FWID</text><path d="M-24 11 h48" stroke="#b3470a" stroke-width="3" stroke-dasharray="5 3" fill="none"/></g>
<text x="298" y="152" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="middle">FWID number</text>
<text x="298" y="174" font-size="15" fill="#2f3a2b" text-anchor="middle">Fish and Wildlife ID</text>
</g>
<g data-tip="Species licences|Every species licence bought this licence year rides with you while you hunt, cancelled or not. Lost one? Replace it before you hunt on.">
<rect x="8" y="194" width="188" height="142" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<circle cx="30" cy="216" r="14" fill="#e8590c"/><text x="30" y="222" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<g transform="translate(108 244) scale(1.1)"><g transform="translate(-14 4) rotate(-10)"><path d="M-16 -24 H12 L16 -20 V24 H-16z" fill="#fffdf6" stroke="#8a7f6a" stroke-width="1.4"/><path d="M-10 -14 H10 M-10 -6 H10 M-10 2 H6" stroke="#b9ae96" stroke-width="2" fill="none"/><circle cx="0" cy="-19" r="2.2" fill="#8a7f6a"/></g><g><path d="M-16 -24 H12 L16 -20 V24 H-16z" fill="#fffdf6" stroke="#8a7f6a" stroke-width="1.4"/><path d="M-10 -14 H10 M-10 -6 H10 M-10 2 H6" stroke="#b9ae96" stroke-width="2" fill="none"/><circle cx="0" cy="-19" r="2.2" fill="#8a7f6a"/></g><g transform="translate(14 4) rotate(10)"><path d="M-16 -24 H12 L16 -20 V24 H-16z" fill="#fffdf6" stroke="#8a7f6a" stroke-width="1.4"/><path d="M-10 -14 H10 M-10 -6 H10 M-10 2 H6" stroke="#b9ae96" stroke-width="2" fill="none"/><circle cx="0" cy="-19" r="2.2" fill="#8a7f6a"/></g><path d="M20 2 l4 -4 l4 4 l-4 4z" fill="#fffaf0" stroke="#c0392b" stroke-width="1.6"/></g>
<text x="102" y="302" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="middle">Species licences</text>
<text x="102" y="324" font-size="15" fill="#2f3a2b" text-anchor="middle">all this year, used too</text>
</g>
<g data-tip="Duck permit|For ducks and geese, carry the federal MGBHP (Migratory Game Bird Hunting Permit) with its habitat conservation stamp, plus your BC licence.">
<rect x="204" y="194" width="188" height="142" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<circle cx="226" cy="216" r="14" fill="#4a7fb0"/><text x="226" y="222" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<g transform="translate(306 244) scale(1.15)"><rect x="-30" y="-24" width="60" height="48" rx="4" fill="#fffdf6" stroke="#2f63a6" stroke-width="1.6"/><rect x="-22" y="-16" width="26" height="22" fill="#2f63a6"/><path d="M-19 0 C-15 -6 -6 -6 -3 -2 L1 -4 L0 0 C-4 3 -15 3 -19 0z" fill="#fffaf0"/><path d="M8 -12 H24 M8 -4 H24 M-22 14 H24" stroke="#9fb2c8" stroke-width="2.2" fill="none"/></g>
<text x="298" y="302" font-size="18" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Duck permit</text>
<text x="298" y="324" font-size="15" fill="#2f3a2b" text-anchor="middle">ducks and geese</text>
</g>
<g data-tip="Hunting licence|The BC hunting licence is electronic only, on your FWID (Fish and Wildlife ID) profile. No paper copy is needed while hunting.">
<rect x="8" y="344" width="188" height="142" rx="10" fill="#ffffff" stroke="#2f6e3b" stroke-width="2.5"/>
<circle cx="30" cy="366" r="14" fill="#2f6e3b"/><text x="30" y="372" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<g transform="translate(102 394) scale(1.1)"><rect x="-17" y="-28" width="34" height="56" rx="6" fill="#2f3a2b"/><rect x="-13" y="-22" width="26" height="42" rx="2" fill="#e8f2e0"/><circle cx="0" cy="-4" r="9" fill="#2f6e3b"/><path d="M-4 -4 l3 3 l6 -7" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M-8 10 H8 M-8 15 H5" stroke="#9fb08a" stroke-width="2" fill="none"/></g>
<text x="102" y="452" font-size="18" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Hunting licence</text>
<text x="102" y="474" font-size="15" fill="#2f3a2b" text-anchor="middle">electronic, no paper</text>
</g>
<g data-tip="PAL (Tip)|A hunting licence gives no authority to carry a firearm. Hold the PAL (Possession and Acquisition Licence) too. Carrying it is a habit, not a hunting rule.">
<rect x="204" y="344" width="188" height="142" rx="10" fill="#ffffff" stroke="#6b5b4b" stroke-width="2.5"/>
<circle cx="226" cy="366" r="14" fill="#6b5b4b"/><text x="226" y="372" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<g transform="translate(306 394) scale(1.15)"><rect x="-34" y="-22" width="68" height="44" rx="5" fill="#eef0e6" stroke="#6b7a55" stroke-width="1.6"/><path d="M-28 -2 C-24 -4 -18 -4 -12 -3 L-4 -4 H28 V-1 H0 L-4 2 L-6 3 L-8 8 L-12 8 L-11 2 L-16 1 C-20 4 -24 6 -28 6z" fill="#5a3d22"/><rect x="-6" y="-9" width="18" height="4" rx="2" fill="#2f3a2b"/><path d="M-24 14 H24" stroke="#9aa588" stroke-width="2.2" fill="none"/></g>
<text x="298" y="452" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">PAL (Tip)</text>
<text x="298" y="474" font-size="15" fill="#2f3a2b" text-anchor="middle">with any firearm</text>
</g>
</svg>
