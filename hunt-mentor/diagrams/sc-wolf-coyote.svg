<g transform="translate(315 125) scale(0.8)"><path d="M-24,4 L-40,26 M-14,6 L-4,28 M20,4 L8,26 M28,2 L44,22" stroke="#b08a5a" stroke-width="7" stroke-linecap="round"/><ellipse cx="0" cy="-6" rx="38" ry="14" fill="#b08a5a" stroke="#23261f" stroke-width="1.2"/><path d="M34,-6 C42,6 46,18 46,30 C40,24 36,12 32,2" fill="#b08a5a" stroke="#23261f" stroke-width="1.2"/><path d="M-30,-14 L-44,-26 L-50,-26 L-46,-4 Z" fill="#b08a5a"/><ellipse cx="-46" cy="-16" rx="12" ry="10" fill="#b08a5a" stroke="#23261f" stroke-width="1.2"/><path d="M-44,-18 L-70,-12 L-70,-8 L-44,-4 Z" fill="#b08a5a" stroke="#23261f" stroke-width="1.2"/><path d="M-40,-28 L-36,-48 L-28,-28 Z" fill="#b08a5a" stroke="#23261f" stroke-width="1.2"/><circle cx="-50" cy="-18" r="1.8" fill="#23261f"/><circle cx="-67" cy="-10" r="2.2" fill="#23261f"/></g>
<line x1="200" y1="40" x2="200" y2="260" stroke="#8a9a6b" stroke-dasharray="6 6" stroke-width="2"/>
<text x="100" y="190" font-size="15" fill="#23261f" text-anchor="middle">Tail straight out</text>
<text x="100" y="209" font-size="15" fill="#23261f" text-anchor="middle">Broad muzzle</text>
<text x="100" y="228" font-size="15" fill="#23261f" text-anchor="middle">Big feet</text>
