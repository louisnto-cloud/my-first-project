<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Wolf or coyote, both running. Wolf: 30 to 50 kilograms, tail held straight out behind, broad muzzle, big feet. Coyote: 9 to 23 kilograms, tail carried down, thin pointed muzzle, tall ears, small feet. 85 percent. Warning: a big dog at 200 metres looks like a wolf, a tip." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Wolf or coyote?</text>
<text x="110" y="56" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Wolf, 30 to 50 kg</text>
<text x="310" y="56" font-size="16" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Coyote, 9 to 23 kg</text>
