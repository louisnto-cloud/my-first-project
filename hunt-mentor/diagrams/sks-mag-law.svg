<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A magazine box holding 5 rounds with a pin or rivet, in orange, that blocks more. Text: 5 rounds maximum for a semi automatic centrefire rifle magazine. Removing the pin makes it a prohibited device, a crime.">
