<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Self rescue step 1: expect the cold shock gasp. Keep your head up and get your breathing under control, about 1 minute. Keep your winter clothes on.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1. Gasp, then breathe</text><rect x="0" y="130" width="400" height="30" rx="0" fill="#bfe0f2"/><rect x="150" y="130" width="100" height="170" rx="0" fill="#2f5f88"/><circle cx="200" cy="142" r="14.0" fill="#d9b48f"/><path d="M218 134 q6 -4 12 0 M224 124 q7 -5 14 0 M230 113 q8 -6 16 0" fill="none" stroke="#4a7fb0" stroke-width="2.4" stroke-linecap="round"/><text x="310" y="96" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">1 minute</text><text x="310" y="118" font-size="16" fill="#2f3a2b" text-anchor="middle">breathe</text><rect x="12" y="214" width="136" height="54" rx="6" fill="#2f3a2b"/><text x="80" y="237" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Head up.</text><text x="80" y="258" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Breathe</text>
</svg>
