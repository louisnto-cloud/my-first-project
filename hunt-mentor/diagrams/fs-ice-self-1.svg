<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Self rescue step 1: expect the cold shock gasp. Keep your head up and get your breathing under control, about 1 minute.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1. Gasp, then breathe</text><rect x="0" y="130" width="400" height="30" rx="0" fill="#bfe0f2"/><rect x="150" y="130" width="100" height="170" rx="0" fill="#2f5f88"/><circle cx="200" cy="142" r="14.0" fill="#d9b48f"/><text x="300" y="100" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="middle">1 minute</text><text x="300" y="122" font-size="15" fill="#2f3a2b" text-anchor="middle">breathe</text><rect x="115" y="262" width="169" height="30" rx="6" fill="#2f3a2b"/><text x="200" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Head up. Breathe</text>
</svg>
