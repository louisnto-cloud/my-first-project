<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="The same hunter in a blaze orange toque and vest seen two ways: to another hunter the orange is bright; to a deer it likely looks dull, close to brown or grey.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="32" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Same hunter, two viewers</text><rect x="20" y="50" width="170" height="200" rx="10" fill="#dfe6d3" stroke="none" stroke-width="0"/><rect x="210" y="50" width="170" height="200" rx="10" fill="#c9c6b8" stroke="none" stroke-width="0"/><g transform="translate(105 200)"><circle cy="-62" r="12" fill="#ff6d00"/><rect x="-16" y="-50" width="32" height="46" rx="6" fill="#ff6d00"/><path d="M-8 -4 L-12 34 M8 -4 L12 34" stroke="#4a4030" stroke-width="7"/></g><g transform="translate(295 200)"><circle cy="-62" r="12" fill="#9c9784"/><rect x="-16" y="-50" width="32" height="46" rx="6" fill="#9c9784"/><path d="M-8 -4 L-12 34 M8 -4 L12 34" stroke="#4a4030" stroke-width="7"/></g><text x="105" y="280" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Another hunter: bright</text><text x="295" y="280" font-family="sans-serif" font-size="14" fill="#868e96" text-anchor="middle" font-weight="bold">A deer: dull (75%)</text>
</svg>
