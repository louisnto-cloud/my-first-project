<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 372" font-family="sans-serif" role="img" aria-label="Cut chart of a moose seen from the side, with the same primal cuts as a deer: neck, shoulder with shank, backstrap along the top, tenderloin inside, ribs and flank, hind quarter with shank. A boned out moose is about 200 kilograms of knife work.">
<rect x="0" y="0" width="400" height="372" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Moose: same cuts, much bigger</text><g transform="translate(0 30)"><polygon points="170,196 190,196 186,284 176,284" fill="#e8e2d4" fill-opacity="1" stroke="#b9b09d" stroke-width="1.5" stroke-linejoin="round"/><polygon points="272,200 292,200 286,284 278,284" fill="#e8e2d4" fill-opacity="1" stroke="#b9b09d" stroke-width="1.5" stroke-linejoin="round"/><polygon points="78,64 100,56 152,84 150,152 126,160 100,104" fill="#c9b27a" fill-opacity="1" stroke="#2f3a2b" stroke-width="1.8" stroke-linejoin="round"/><polygon points="152,84 172,90 172,126 205,128 205,160 180,198 150,200 126,160 150,152" fill="#c47a4a" fill-opacity="1" stroke="#2f3a2b" stroke-width="1.8" stroke-linejoin="round"/><polygon points="172,90 230,104 300,106 300,126 205,128 172,126" fill="#e8590c" fill-opacity="1" stroke="#2f3a2b" stroke-width="1.8" stroke-linejoin="round"/><polygon points="205,128 268,127 262,193 180,198 205,160" fill="#e0c09a" fill-opacity="1" stroke="#2f3a2b" stroke-width="1.8" stroke-linejoin="round"/><polygon points="268,127 300,126 300,106 320,110 336,140 330,180 316,206 290,206 262,193" fill="#8b5a2b" fill-opacity="1" stroke="#2f3a2b" stroke-width="1.8" stroke-linejoin="round"/><polygon points="138,199 164,199 160,236 142,236" fill="#a58d74" fill-opacity="1" stroke="#2f3a2b" stroke-width="1.8" stroke-linejoin="round"/><polygon points="142,236 160,236 156,284 146,284" fill="#d8d2c4" fill-opacity="1" stroke="#2f3a2b" stroke-width="1.8" stroke-linejoin="round"/><polygon points="290,206 316,206 312,240 294,240" fill="#a58d74" fill-opacity="1" stroke="#2f3a2b" stroke-width="1.8" stroke-linejoin="round"/><polygon points="294,240 312,240 310,284 300,284" fill="#d8d2c4" fill-opacity="1" stroke="#2f3a2b" stroke-width="1.8" stroke-linejoin="round"/><path d="M100 62 Q84 58 64 66 Q42 76 38 92 Q42 102 56 100 Q76 96 92 86 Z" fill="#d8d2c4" stroke="#2f3a2b" stroke-width="1.8"/><path d="M66 98 Q70 116 64 126 Q56 114 60 100 Z" fill="#d8d2c4" stroke="#2f3a2b" stroke-width="1.5"/><path d="M98 58 Q108 40 128 36 L138 22 L140 34 L150 26 L146 42 Q130 50 108 64 Z" fill="#c9b79c" stroke="#2f3a2b" stroke-width="1.5"/><circle cx="62" cy="76" r="2.2" fill="#2f3a2b"/><ellipse cx="276" cy="136" rx="22" ry="5" fill="#b3261e" fill-opacity=".85" stroke="#b3261e" stroke-width="2" stroke-dasharray="4 3"/><line x1="116" y1="116" x2="43" y2="140" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="116" cy="116" r="3" fill="#2f3a2b"/><text x="8" y="145" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Neck</text><line x1="165" y1="170" x2="75" y2="182" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="165" cy="170" r="3" fill="#2f3a2b"/><text x="8" y="187" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Shoulder</text><line x1="150" y1="220" x2="51" y2="222" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="150" cy="220" r="3" fill="#2f3a2b"/><text x="8" y="227" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Shank</text><line x1="236" y1="117" x2="259" y2="65" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="236" cy="117" r="3" fill="#2f3a2b"/><text x="196" y="61" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="start">Backstrap (loin)</text><line x1="292" y1="136" x2="318" y2="101" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="292" cy="136" r="3" fill="#2f3a2b"/><text x="392" y="97" font-size="14" font-weight="bold" fill="#b3261e" text-anchor="end">Tenderloin (inside)</text><line x1="232" y1="170" x2="218" y2="288" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="232" cy="170" r="3" fill="#2f3a2b"/><text x="218" y="307" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Ribs and flank</text><line x1="312" y1="160" x2="330" y2="288" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="312" cy="160" r="3" fill="#2f3a2b"/><text x="330" y="307" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Hind quarter</text><line x1="304" y1="224" x2="348" y2="252" stroke="#2f3a2b" stroke-width="1.3"/><circle cx="304" cy="224" r="3" fill="#2f3a2b"/><text x="352" y="257" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Shank</text></g><text x="200" y="360" font-size="13" fill="#6b4f35" text-anchor="middle">Same map as a deer. About 200 kg boned out (lean).</text>
</svg>
