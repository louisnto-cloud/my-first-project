<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" font-family="sans-serif" role="img" aria-label="Bird care in 4 steps. 1, Gut, remove the crop, 80%. 2, Cool apart, 2 to 4°C, 80%. 3, Leave a wing or head on until home, 95%, synopsis p. 15. 4, Cook to 74°C, 80%.">
<rect width="400" height="360" rx="12" fill="#EEF1EA"/>
<text x="16" y="30" font-size="18" font-weight="bold" fill="#1F3D2B">Bird care in 4 steps</text>
<path d="M28 74 V304" stroke="#1F3D2B" stroke-width="3" fill="none"/>
<g><rect x="54" y="52" width="334" height="60" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><text x="66" y="77" font-size="16" font-weight="bold" fill="#17201A">Gut, remove the crop</text><text x="66" y="99" font-size="14" fill="#1F3D2B">80%</text><circle cx="28" cy="74" r="14" fill="#1F3D2B"/><text x="28" y="79" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text></g>
<g><rect x="54" y="122" width="334" height="60" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><text x="66" y="147" font-size="16" font-weight="bold" fill="#17201A">Cool apart, 2 to 4°C</text><text x="66" y="169" font-size="14" fill="#1F3D2B">80%</text><circle cx="28" cy="144" r="14" fill="#1F3D2B"/><text x="28" y="149" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text></g>
<g><rect x="54" y="192" width="334" height="80" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="3"/><text x="66" y="217" font-size="16" font-weight="bold" fill="#17201A">Leave a wing or head on until</text>
<text x="66" y="237" font-size="16" font-weight="bold" fill="#17201A">home</text><text x="66" y="259" font-size="14" fill="#1F3D2B">95%, synopsis p. 15</text><circle cx="28" cy="214" r="14" fill="#FF6A13"/><text x="28" y="219" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text></g>
<g><rect x="54" y="282" width="334" height="60" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><text x="66" y="307" font-size="16" font-weight="bold" fill="#17201A">Cook to 74°C</text><text x="66" y="329" font-size="14" fill="#1F3D2B">80%</text><circle cx="28" cy="304" r="14" fill="#1F3D2B"/><text x="28" y="309" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text></g>
</svg>
