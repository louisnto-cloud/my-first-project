<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 344" font-family="sans-serif" role="img" aria-label="Enhanced odds. Won moose anywhere, or elk in Regions 1 and 2: your odds for that species are cut 66 percent for 3 years. Won any other species: cut 50 percent for 1 year. Deer, black bear and turkey: no cut, apply every year.">
<rect x="0" y="0" width="400" height="344" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Won last year? Your odds drop</text><rect x="10" y="52" width="380" height="84" rx="10" fill="#fff" stroke="#e8590c" stroke-width="2.5"/><text x="22" y="76" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Moose anywhere, elk in Regions 1 and 2</text><rect x="22" y="96" width="40" height="28" rx="4" fill="#e8590c" stroke="#e8590c" stroke-width="2"/><text x="42" y="115" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Yr 1</text><rect x="68" y="96" width="40" height="28" rx="4" fill="#e8590c" stroke="#e8590c" stroke-width="2"/><text x="88" y="115" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Yr 2</text><rect x="114" y="96" width="40" height="28" rx="4" fill="#e8590c" stroke="#e8590c" stroke-width="2"/><text x="134" y="115" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Yr 3</text><text x="170" y="116" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">Cut 66% for 3 years</text><rect x="10" y="148" width="380" height="84" rx="10" fill="#fff" stroke="#8b5a2b" stroke-width="2.5"/><text x="22" y="172" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Any other species</text><rect x="22" y="192" width="40" height="28" rx="4" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="2"/><text x="42" y="211" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Yr 1</text><rect x="68" y="192" width="40" height="28" rx="4" fill="#fff" stroke="#8b5a2b" stroke-width="2"/><text x="88" y="211" font-size="13" font-weight="bold" fill="#23261f" text-anchor="middle">Yr 2</text><rect x="114" y="192" width="40" height="28" rx="4" fill="#fff" stroke="#8b5a2b" stroke-width="2"/><text x="134" y="211" font-size="13" font-weight="bold" fill="#23261f" text-anchor="middle">Yr 3</text><text x="170" y="212" font-size="15" font-weight="bold" fill="#8b5a2b" text-anchor="start">Cut 50% for 1 year</text><rect x="10" y="244" width="380" height="84" rx="10" fill="#fff" stroke="#55663f" stroke-width="2.5"/><text x="22" y="268" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Deer, black bear, turkey</text><rect x="22" y="288" width="40" height="28" rx="4" fill="#fff" stroke="#55663f" stroke-width="2"/><text x="42" y="307" font-size="13" font-weight="bold" fill="#23261f" text-anchor="middle">Yr 1</text><rect x="68" y="288" width="40" height="28" rx="4" fill="#fff" stroke="#55663f" stroke-width="2"/><text x="88" y="307" font-size="13" font-weight="bold" fill="#23261f" text-anchor="middle">Yr 2</text><rect x="114" y="288" width="40" height="28" rx="4" fill="#fff" stroke="#55663f" stroke-width="2"/><text x="134" y="307" font-size="13" font-weight="bold" fill="#23261f" text-anchor="middle">Yr 3</text><text x="170" y="308" font-size="15" font-weight="bold" fill="#55663f" text-anchor="start">No cut. Apply every year</text>
</svg>
