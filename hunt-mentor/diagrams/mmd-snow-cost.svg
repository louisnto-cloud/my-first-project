<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A deer standing with snow depth lines up its legs. At 25 cm walking costs about 50% more energy. Around 30 cm movement is hard. At 41 cm walking costs about 150% more. Snow over about 50 cm and deer leave the area.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Snow depth and the cost of walking</text><g transform="translate(120 270) scale(2.200 2.200)"><rect x="-36" y="-40" width="6" height="40" rx="3" fill="#8b5a2b"/><rect x="10" y="-40" width="6" height="40" rx="3" fill="#8b5a2b"/><ellipse cx="-12" cy="-52" rx="34" ry="16" fill="#8b5a2b"/><rect x="-30" y="-44" width="6" height="44" rx="3" fill="#8b5a2b"/><rect x="16" y="-44" width="6" height="44" rx="3" fill="#8b5a2b"/><path d="M12 -60 L26 -84 L36 -80 L26 -52 Z" fill="#8b5a2b"/><ellipse cx="38" cy="-84" rx="13" ry="7" fill="#8b5a2b"/><path d="M28 -88 L18 -102 L32 -92 Z" fill="#8b5a2b"/><path d="M31 -89 L27 -104 L38 -92 Z" fill="#8b5a2b"/><circle cx="49" cy="-84" r="2" fill="#23261f"/><ellipse cx="-44" cy="-54" rx="5" ry="9" fill="#f4efe2"/><path d="M-46 -54 L-50 -40" stroke="#23261f" stroke-width="3" stroke-linecap="round"/></g><line x1="20" y1="205.0" x2="240" y2="205.0" stroke="#8a9a6b" stroke-width="3" stroke-dasharray="7 4"/><text x="250" y="221.0" font-size="14" fill="#8a9a6b" text-anchor="start" font-weight="bold">25 cm: +50% energy</text><line x1="20" y1="192.0" x2="240" y2="192.0" stroke="#4a7fb0" stroke-width="3" stroke-dasharray="7 4"/><text x="250" y="187.0" font-size="14" fill="#4a7fb0" text-anchor="start" font-weight="bold">30 cm: hard to move</text><line x1="20" y1="163.39999999999998" x2="240" y2="163.39999999999998" stroke="#e8590c" stroke-width="3" stroke-dasharray="7 4"/><text x="244" y="168.39999999999998" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">41 cm: +150% energy</text><line x1="20" y1="140.0" x2="240" y2="140.0" stroke="#b3261e" stroke-width="3" stroke-dasharray="7 4"/><text x="244" y="145.0" font-size="14" fill="#b3261e" text-anchor="start" font-weight="bold">50 cm: deer leave</text><rect x="0" y="270" width="400" height="30" fill="#ffffff" stroke="#8a9a6b" stroke-width="1"/><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">BC habitat model, Parker 1984 (85%)</text>
</svg>
