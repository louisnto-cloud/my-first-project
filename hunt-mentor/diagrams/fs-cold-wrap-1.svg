<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Moderate or severe hypothermia step 1: handle gently, keep the person lying flat. No walking, no rough moves.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1. Handle gently, lay flat</text><rect x="0" y="240" width="400" height="60" rx="0" fill="#dfe6d3"/><rect x="160" y="226" width="50" height="14" rx="5.0" fill="#e8590c"/><line x1="210" y1="234" x2="246" y2="235" stroke="#2f3a2b" stroke-width="8.0" stroke-linecap="round"/><circle cx="150" cy="231" r="9.0" fill="#d9b48f"/><text x="200" y="110" font-size="20" font-weight="bold" fill="#c0392b" text-anchor="middle">Gentle. Flat.</text><text x="200" y="140" font-size="16" fill="#2f3a2b" text-anchor="middle">No walking</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Flat and gentle</text>
</svg>
