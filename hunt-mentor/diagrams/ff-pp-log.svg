<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A practice log with columns for date, position, distance, wind and result. Example rows: sticks at 150 m, hit; sitting at 200 m, 4 cm low; prone at 200 m, hit. After about 20 entries patterns show: low misses often mean trigger, sideways misses often mean wind or natural point of aim. These are tips.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Log every shot that counts</text><text x="60" y="72" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Date</text><text x="132" y="72" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Pos</text><text x="204" y="72" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Dist</text><text x="276" y="72" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Wind</text><text x="348" y="72" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Hit?</text><text x="60" y="108" font-size="14" fill="#23261f" text-anchor="middle">10 Oct</text><text x="132" y="108" font-size="14" fill="#23261f" text-anchor="middle">sticks</text><text x="204" y="108" font-size="14" fill="#23261f" text-anchor="middle">150</text><text x="276" y="108" font-size="14" fill="#23261f" text-anchor="middle">10 L</text><text x="348" y="108" font-size="14" fill="#23261f" text-anchor="middle">yes</text><line x1="24" y1="116" x2="376" y2="116" stroke="#d9d4c7" stroke-width="1" stroke-linecap="round"/><text x="60" y="142" font-size="14" fill="#23261f" text-anchor="middle">10 Oct</text><text x="132" y="142" font-size="14" fill="#23261f" text-anchor="middle">sit</text><text x="204" y="142" font-size="14" fill="#23261f" text-anchor="middle">200</text><text x="276" y="142" font-size="14" fill="#23261f" text-anchor="middle">10 L</text><text x="348" y="142" font-size="14" fill="#23261f" text-anchor="middle">4 low</text><line x1="24" y1="150" x2="376" y2="150" stroke="#d9d4c7" stroke-width="1" stroke-linecap="round"/><text x="60" y="176" font-size="14" fill="#23261f" text-anchor="middle">12 Oct</text><text x="132" y="176" font-size="14" fill="#23261f" text-anchor="middle">prone</text><text x="204" y="176" font-size="14" fill="#23261f" text-anchor="middle">200</text><text x="276" y="176" font-size="14" fill="#23261f" text-anchor="middle">calm</text><text x="348" y="176" font-size="14" fill="#23261f" text-anchor="middle">yes</text><line x1="24" y1="184" x2="376" y2="184" stroke="#d9d4c7" stroke-width="1" stroke-linecap="round"/><text x="200" y="236" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Patterns show up after 20 entries:</text><text x="200" y="254" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">low misses = trigger, sideways = wind or NPOA</text>
</svg>
