<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="sans-serif" role="img" aria-label="Timeline from April to March. Antlers start growing in late April or May and grow in velvet through August, reaching full size by early September. They are hard through the fall rut and are shed between mid November and March, old bulls first and yearlings last. Antlers keep growing until about age 10, with a spread up to 1.8 metres on a prime bull.">
<rect x="0" y="0" width="400" height="290" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">The antler year</text><line x1="30" y1="200" x2="380" y2="200" stroke="#23261f" stroke-width="2"/><text x="44.0" y="220" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">A</text><text x="73.5" y="220" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">M</text><text x="103.0" y="220" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">J</text><text x="132.5" y="220" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">J</text><text x="162.0" y="220" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">A</text><text x="191.5" y="220" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">S</text><text x="221.0" y="220" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">O</text><text x="250.5" y="220" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">N</text><text x="280.0" y="220" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">D</text><text x="309.5" y="220" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">J</text><text x="339.0" y="220" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">F</text><text x="368.5" y="220" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">M</text><rect x="44" y="120" width="140" height="30" fill="#7a5a3a" rx="4"/><text x="114" y="140" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">grow in velvet</text><rect x="184" y="120" width="60" height="30" fill="#e9dcc0" stroke="#23261f" rx="4"/><text x="214" y="140" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">hard</text><rect x="244" y="160" width="120" height="30" fill="#6b4f35" rx="4"/><text x="304" y="180" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">shed</text><text x="200" y="70" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Full size by early September</text><text x="200" y="87" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Old bulls shed first; yearlings last</text><text x="200" y="248" font-size="14" fill="#23261f" text-anchor="middle">Antlers keep growing to about age 10</text><text x="200" y="265" font-size="14" fill="#23261f" text-anchor="middle">Spread up to 1.8 m on a prime bull</text>
</svg>
