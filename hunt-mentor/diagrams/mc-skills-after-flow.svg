<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Seven steps after the shot: 1 watch, 2 mark, 3 wait, 4 the hit site, 5 trail, 6 grid search, 7 get help. The law requires all reasonable effort to find it.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">After the shot, in order</text><rect x="14" y="60" width="86" height="70" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="57" cy="82" r="13" fill="#e8590c"/><text x="57" y="87" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">1</text><text x="57" y="116" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Watch</text><line x1="100" y1="95" x2="110" y2="95" stroke="#e8590c" stroke-width="2"/><polygon points="110.0,95.0 101.0,99.3 101.0,90.7" fill="#e8590c"/><rect x="110" y="60" width="86" height="70" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="153" cy="82" r="13" fill="#e8590c"/><text x="153" y="87" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">2</text><text x="153" y="116" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Mark</text><line x1="196" y1="95" x2="206" y2="95" stroke="#e8590c" stroke-width="2"/><polygon points="206.0,95.0 197.0,99.3 197.0,90.7" fill="#e8590c"/><rect x="206" y="60" width="86" height="70" rx="8" fill="#f6d7c3" stroke="#8a9a6b" stroke-width="2"/><circle cx="249" cy="82" r="13" fill="#e8590c"/><text x="249" y="87" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">3</text><text x="249" y="116" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Wait</text><line x1="292" y1="95" x2="302" y2="95" stroke="#e8590c" stroke-width="2"/><polygon points="302.0,95.0 293.0,99.3 293.0,90.7" fill="#e8590c"/><rect x="302" y="60" width="86" height="70" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="345" cy="82" r="13" fill="#e8590c"/><text x="345" y="87" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">4</text><text x="345" y="116" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Hit site</text><rect x="14" y="160" width="86" height="70" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="57" cy="182" r="13" fill="#e8590c"/><text x="57" y="187" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">5</text><text x="57" y="216" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Trail</text><line x1="100" y1="195" x2="110" y2="195" stroke="#e8590c" stroke-width="2"/><polygon points="110.0,195.0 101.0,199.3 101.0,190.7" fill="#e8590c"/><rect x="110" y="160" width="86" height="70" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="153" cy="182" r="13" fill="#e8590c"/><text x="153" y="187" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">6</text><text x="153" y="216" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Grid</text><line x1="196" y1="195" x2="206" y2="195" stroke="#e8590c" stroke-width="2"/><polygon points="206.0,195.0 197.0,199.3 197.0,190.7" fill="#e8590c"/><rect x="206" y="160" width="86" height="70" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><circle cx="249" cy="182" r="13" fill="#e8590c"/><text x="249" y="187" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">7</text><text x="249" y="216" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Help</text><rect x="302" y="160" width="86" height="70" rx="8" fill="#2f3a2b"/><text x="345" y="192" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">All</text><text x="345" y="212" font-size="14" fill="#fffaf0" text-anchor="middle">reasonable</text><text x="345" y="228" font-size="14" fill="#fffaf0" text-anchor="middle">effort</text><text x="200" y="286" font-size="14" fill="#6b4f35" text-anchor="middle">The law: all reasonable effort to find it (95%)</text>
</svg>
