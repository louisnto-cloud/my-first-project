<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 322" font-family="sans-serif" role="img" aria-label="A rain day plan. 1 wet ground is quiet, good for still hunting. 2 rain can erase blood: shoot only good shots and track soon. 3 wool or synthetics, a rain shell and a spare dry layer. 4 shivering: stop, get dry, warm and fed, and head out.">
<rect width="400" height="322" fill="#EEF1EA"/>
<text x="200" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#1F3D2B">Rain day plan</text>
<rect x="14" y="48" width="372" height="52" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="2"/><circle cx="38" cy="74" r="13" fill="#1F3D2B" stroke="none"/><text x="38" y="79" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text><text x="62" y="70" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Wet ground is quiet</text><text x="62" y="91" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">good for still hunting</text><rect x="14" y="110" width="372" height="52" rx="8" fill="#ffffff" stroke="#FF6A13" stroke-width="2"/><circle cx="38" cy="136" r="13" fill="#FF6A13" stroke="none"/><text x="38" y="141" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text><text x="62" y="132" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Rain can erase blood</text><text x="62" y="153" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">shoot only good shots; track soon</text><rect x="14" y="172" width="372" height="52" rx="8" fill="#ffffff" stroke="#1F3D2B" stroke-width="2"/><circle cx="38" cy="198" r="13" fill="#1F3D2B" stroke="none"/><text x="38" y="203" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text><text x="62" y="194" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Wool or synthetics</text><text x="62" y="215" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">rain shell, spare dry layer</text><rect x="14" y="234" width="372" height="52" rx="8" fill="#ffffff" stroke="#FF6A13" stroke-width="2"/><circle cx="38" cy="260" r="13" fill="#FF6A13" stroke="none"/><text x="38" y="265" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text><text x="62" y="256" font-size="16" text-anchor="start" font-weight="bold" fill="#1F3D2B">Shivering? Stop</text><text x="62" y="277" font-size="14" text-anchor="start" font-weight="normal" fill="#17201A">get dry, warm, fed; head out</text><text x="200" y="310" font-size="14" text-anchor="middle" font-weight="normal" fill="#17201A">Tips, with the safety lessons</text>
</svg>
