<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 505" font-family="sans-serif" role="img" aria-label="Timeline of the 2 day quail trip, all Tips except the wing rule. Best window: late October to mid November. Day 1 morning: drive down, stop at the Penticton office or a club, buy shells, check the MU (Management Unit) map and town boundaries. Day 1 afternoon: knock on 5 doors between Oliver and Osoyoos. Day 1 dusk: walk one Crown edge and listen for coveys. Day 2 first light: the best permission spot, walking side by side, into the sun side. Day 2 midday: rest, clean and ice the birds. Last 2 hours: a second spot or the Osoyoos Oxbows on foot. Drive home with birds in a cooler and one wing on each, 99 percent.">
<rect width="400" height="505" fill="#fffaf0"/>
<text x="12" y="24" font-size="15" fill="#6b5b4b">Tips. Best window: <tspan font-weight="bold" fill="#c2410c">late Oct to mid Nov</tspan></text>
<line x1="34" y1="62" x2="34" y2="468" stroke="#8a9a6b" stroke-width="4"/>
<circle cx="34" cy="62" r="21" fill="#fffaf0" stroke="#e8590c" stroke-width="2.4"/><g transform="translate(34 71) scale(0.42 0.42)"><path d="M-40 -8 V-22 H2 V-34 C2 -36 4 -37 6 -37 H22 C25 -37 27 -36 28 -33 L33 -22 H38 C40 -22 41 -21 41 -19 V-8z" fill="#3d5a80"/><path d="M8 -33 H21 C22 -33 23 -32 24 -31 L28 -23 H8z" fill="#c9d6e0"/><rect x="-40" y="-24" width="40" height="3" fill="#00000030"/><rect x="38" y="-17" width="4" height="4" rx="1" fill="#f3e7b3"/><circle cx="-26" cy="-6" r="8.5" fill="#2b2b2b"/><circle cx="-26" cy="-6" r="3.6" fill="#a8a8a8"/><circle cx="25" cy="-6" r="8.5" fill="#2b2b2b"/><circle cx="25" cy="-6" r="3.6" fill="#a8a8a8"/></g>
<text x="68" y="58" font-size="16" font-weight="bold" fill="#c2410c">Day 1 morning</text>
<text x="68" y="78" font-size="15" fill="#2f3a2b">Drive down. Penticton office or a club,</text>
<text x="68" y="97" font-size="15" fill="#2f3a2b">shells, MU (Management Unit) map, town</text>
<text x="68" y="116" font-size="15" fill="#2f3a2b">lines.</text>
<circle cx="34" cy="155" r="21" fill="#fffaf0" stroke="#e8590c" stroke-width="2.4"/><path d="M22 154 L34 143 L46 154z" fill="#8b5a2b"/><rect x="25" y="154" width="18" height="12" fill="#8b5a2b"/><rect x="31" y="158" width="6" height="8" fill="#fffaf0"/>
<text x="68" y="151" font-size="16" font-weight="bold" fill="#c2410c">Day 1 afternoon</text>
<text x="68" y="171" font-size="15" fill="#2f3a2b">Knock on 5 doors, Oliver to Osoyoos.</text>
<circle cx="34" cy="210" r="21" fill="#fffaf0" stroke="#e8590c" stroke-width="2.4"/><circle cx="42" cy="202" r="6" fill="#e0b84a"/><circle cx="44.7" cy="200.5" r="5.1" fill="#fffaf0"/><g transform="translate(32 222) scale(1.3)"><path d="M-2 -2 v2 M2 -2 v2" stroke="#6b5b4b" stroke-width="1"/><ellipse cx="0" cy="-7" rx="8" ry="5.5" fill="#7d8590"/><path d="M-2 -5 C2 -3 6 -4 8 -7" stroke="#c9a46a" stroke-width="1.4" fill="none"/><circle cx="-6" cy="-12" r="3.6" fill="#5a5f66"/><path d="M-6 -15 C-8 -20 -4 -21 -3 -19" stroke="#1d1a16" stroke-width="1.6" fill="none"/><path d="M-9.5 -12 l-2 .8 l2 .6z" fill="#1d1a16"/><path d="M6 -9 L11 -10 L10 -6z" fill="#5a5f66"/></g>
<text x="68" y="206" font-size="16" font-weight="bold" fill="#c2410c">Day 1 dusk</text>
<text x="68" y="226" font-size="15" fill="#2f3a2b">Walk a Crown edge. Listen for coveys.</text>
<circle cx="34" cy="265" r="21" fill="#fffaf0" stroke="#e8590c" stroke-width="2.4"/><circle cx="34" cy="271" r="8" fill="#e8590c"/><rect x="20" y="271" width="28" height="9" fill="#fffaf0"/><path d="M19 271 H49" stroke="#2f3a2b" stroke-width="2"/><path d="M34 255 V260 M23 260 L26 263 M45 260 L42 263" stroke="#e8590c" stroke-width="2.2" stroke-linecap="round"/>
<text x="68" y="261" font-size="16" font-weight="bold" fill="#c2410c">Day 2 first light</text>
<text x="68" y="281" font-size="15" fill="#2f3a2b">Best permission spot. Side by side, into the</text>
<text x="68" y="300" font-size="15" fill="#2f3a2b">sun side.</text>
<circle cx="34" cy="339" r="21" fill="#fffaf0" stroke="#e8590c" stroke-width="2.4"/><rect x="21" y="333" width="26" height="16" rx="3" fill="#4a7fb0"/><rect x="20" y="329" width="28" height="6" rx="2" fill="#2c5d86"/><path d="M28 340 h4 v4 h-4z M36 339 h4 v4 h-4z" fill="#dbe8f1"/>
<text x="68" y="335" font-size="16" font-weight="bold" fill="#c2410c">Day 2 midday</text>
<text x="68" y="355" font-size="15" fill="#2f3a2b">Rest. Clean and ice the birds.</text>
<circle cx="34" cy="394" r="21" fill="#fffaf0" stroke="#e8590c" stroke-width="2.4"/><path d="M21 385 L30 382 L38 385 L47 382 V404 L38 407 L30 404 L21 407z" fill="#e8e0c8" stroke="#2f3a2b" stroke-width="1.4"/><path d="M24 398 C30 388 36 402 44 390" stroke="#4a7fb0" stroke-width="2.2" fill="none"/>
<text x="68" y="390" font-size="16" font-weight="bold" fill="#c2410c">Last 2 hours</text>
<text x="68" y="410" font-size="15" fill="#2f3a2b">Second spot, or the Osoyoos Oxbows on</text>
<text x="68" y="429" font-size="15" fill="#2f3a2b">foot.</text>
<circle cx="34" cy="468" r="21" fill="#fffaf0" stroke="#e8590c" stroke-width="2.4"/><rect x="22" y="464" width="24" height="15" rx="3" fill="#4a7fb0"/><rect x="21" y="460" width="26" height="6" rx="2" fill="#2c5d86"/><path d="M30 460 C24 450 36 448 40 458" fill="#7d8590"/>
<text x="68" y="464" font-size="16" font-weight="bold" fill="#c2410c">Drive home</text>
<text x="68" y="484" font-size="15" fill="#2f3a2b">Cooler, one wing on each bird (99%).</text>
</svg>
