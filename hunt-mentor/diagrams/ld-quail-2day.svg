<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 690" font-family="sans-serif" role="img" aria-label="Timeline of the 2 day quail trip, all Tips except the wing rule. Day 1 morning: drive down, stop at the Penticton office or a club, buy shells, check the MU map and town boundaries. Day 1 afternoon: knock on 5 doors between Oliver and Osoyoos. Day 1 dusk: walk one Crown edge and listen for coveys. Day 2 first light: the best permission spot, walking side by side. Day 2 midday: rest, clean and ice the birds. Last 2 hours: a second spot or the Osoyoos Oxbows on foot. Drive home with birds in a cooler and one wing on each, 99 percent.">
<rect x="0" y="0" width="400" height="690" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">The 2 day quail trip</text>
<text x="200" y="46" font-size="14" fill="#6b4f35" text-anchor="middle">Tips. Best window: late Oct to mid Nov</text>
<line x1="122" y1="68" x2="122" y2="660" stroke="#8a9a6b" stroke-width="5"/>
<text x="108" y="82" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">Day 1 morning</text>
<circle cx="122" cy="78" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="3"/>
<g transform="translate(360 86) scale(0.8)"><path d="M-30 8 v-12 h28 v-10 h18 l10 10 h4 v12 z" fill="#4a7fb0"/><circle cx="-18" cy="10" r="6" fill="#2f3a2b"/><circle cx="18" cy="10" r="6" fill="#2f3a2b"/><rect x="0" y="-11" width="11" height="7" fill="#fff"/></g>
<text x="140" y="84" font-size="15" fill="#2f3a2b">Drive down. Penticton</text>
<text x="140" y="103" font-size="15" fill="#2f3a2b">office or a club, shells,</text>
<text x="140" y="122" font-size="15" fill="#2f3a2b">MU map, town lines.</text>
<text x="108" y="183" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">Day 1</text>
<text x="108" y="200" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">afternoon</text>
<circle cx="122" cy="179" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="3"/>
<g transform="translate(360 187) scale(0.8)"><path d="M-20 18 v-18 l20 -16 l20 16 v18 z" fill="#c9b79c" stroke="#2f3a2b" stroke-width="2"/><rect x="-5" y="4" width="10" height="14" fill="#2f3a2b"/></g>
<text x="140" y="185" font-size="15" fill="#2f3a2b">Knock on 5 doors, Oliver</text>
<text x="140" y="204" font-size="15" fill="#2f3a2b">to Osoyoos.</text>
<text x="108" y="265" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">Day 1 dusk</text>
<circle cx="122" cy="261" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="3"/>
<g transform="translate(360 269) scale(0.8)"><ellipse cx="0" cy="5" rx="15" ry="10" fill="#7b7f86"/><circle cx="11" cy="-7" r="7" fill="#2f3a2b"/><path d="M10 -14 q4 -10 10 -7" stroke="#2f3a2b" stroke-width="3" fill="none"/><circle cx="10" cy="-21" r="3" fill="#2f3a2b"/><path d="M-3 14 v7 M4 14 v7" stroke="#2f3a2b" stroke-width="2.5"/></g>
<text x="140" y="267" font-size="15" fill="#2f3a2b">Walk a Crown edge. Listen</text>
<text x="140" y="286" font-size="15" fill="#2f3a2b">for coveys.</text>
<text x="108" y="347" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">Day 2 first</text>
<text x="108" y="364" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">light</text>
<circle cx="122" cy="343" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="3"/>
<g transform="translate(360 351) scale(0.8)"><circle cx="-12" cy="-12" r="7" fill="#2f3a2b"/><path d="M-23 20 v-14 q0 -8 11 -8 q11 0 11 8 v14 z" fill="#e8590c"/><circle cx="12" cy="-12" r="7" fill="#2f3a2b"/><path d="M1 20 v-14 q0 -8 11 -8 q11 0 11 8 v14 z" fill="#8a9a6b"/></g>
<text x="140" y="349" font-size="15" fill="#2f3a2b">Best permission spot. Side</text>
<text x="140" y="368" font-size="15" fill="#2f3a2b">by side, into the sun</text>
<text x="140" y="387" font-size="15" fill="#2f3a2b">side.</text>
<text x="108" y="448" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">Day 2 midday</text>
<circle cx="122" cy="444" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="3"/>
<g transform="translate(360 452) scale(0.8)"><rect x="-26" y="-14" width="52" height="32" rx="4" fill="#fff" stroke="#4a7fb0" stroke-width="3"/><rect x="-28" y="-20" width="56" height="9" rx="3" fill="#4a7fb0"/><text x="0" y="9" font-size="13" font-weight="bold" fill="#4a7fb0" text-anchor="middle">MEAT</text></g>
<text x="140" y="450" font-size="15" fill="#2f3a2b">Rest. Clean and ice the</text>
<text x="140" y="469" font-size="15" fill="#2f3a2b">birds.</text>
<text x="108" y="530" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">Last 2 hours</text>
<circle cx="122" cy="526" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="3"/>
<g transform="translate(360 534) scale(0.8)"><path d="M-28 -16 l18 -5 l20 5 l18 -5 v36 l-18 5 l-20 -5 l-18 5 z" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="2.5"/><path d="M-10 -21 v36 M10 -16 v36" stroke="#2f3a2b" stroke-width="1.5"/><path d="M-22 6 q10 -14 22 -4 t20 -6" stroke="#4a7fb0" stroke-width="3" fill="none"/><circle cx="4" cy="-6" r="4" fill="#e8590c"/></g>
<text x="140" y="532" font-size="15" fill="#2f3a2b">Second spot, or the</text>
<text x="140" y="551" font-size="15" fill="#2f3a2b">Osoyoos Oxbows on foot.</text>
<text x="108" y="612" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="end">Drive home</text>
<circle cx="122" cy="608" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="3"/>
<g transform="translate(360 616) scale(0.8)"><path d="M-30 8 v-12 h28 v-10 h18 l10 10 h4 v12 z" fill="#4a7fb0"/><circle cx="-18" cy="10" r="6" fill="#2f3a2b"/><circle cx="18" cy="10" r="6" fill="#2f3a2b"/><rect x="0" y="-11" width="11" height="7" fill="#fff"/></g>
<text x="140" y="614" font-size="15" fill="#2f3a2b">Cooler, one wing on each</text>
<text x="140" y="633" font-size="15" fill="#2f3a2b">bird (99%).</text>
</svg>
