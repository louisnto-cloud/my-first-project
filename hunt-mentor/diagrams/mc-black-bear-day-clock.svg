<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="24 hour clock of a typical fall black bear day. Feeding peaks at dawn and dusk, shown in orange, about 6 to 8:30 in the morning and 4:30 to 7:30 in the evening. Through the day it feeds and beds in shade, shown in sage. Night is mostly rest, but near people bears feed more at night. Times are typical, not exact.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
