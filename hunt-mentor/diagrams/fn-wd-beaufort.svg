<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Beaufort wind force on land: 0 under 1 km/h, smoke rises straight; 1, 1 to 5, smoke drifts; 2, 6 to 11, felt on face and leaves rustle; 3, 12 to 19, twigs in constant motion; 4, 20 to 28, dust and small branches move; 5, 29 to 38, small trees sway.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="32" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Read the wind on the land (95%)</text><rect x="20" y="52" width="36" height="30" rx="6" fill="#8a9a6b" stroke="none" stroke-width="0"/><text x="38" y="73" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">0</text><text x="66" y="73" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">under 1 km/h</text><text x="170" y="73" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">smoke rises straight up</text><rect x="20" y="90" width="36" height="30" rx="6" fill="#8a9a6b" stroke="none" stroke-width="0"/><text x="38" y="111" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><text x="66" y="111" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">1 to 5</text><text x="170" y="111" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">smoke drifts</text><rect x="20" y="128" width="36" height="30" rx="6" fill="#8a9a6b" stroke="none" stroke-width="0"/><text x="38" y="149" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><text x="66" y="149" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">6 to 11</text><text x="170" y="149" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">felt on face, leaves rustle</text><rect x="20" y="166" width="36" height="30" rx="6" fill="#8a9a6b" stroke="none" stroke-width="0"/><text x="38" y="187" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><text x="66" y="187" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">12 to 19</text><text x="170" y="187" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">twigs in constant motion</text><rect x="20" y="204" width="36" height="30" rx="6" fill="#e8590c" stroke="none" stroke-width="0"/><text x="38" y="225" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><text x="66" y="225" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">20 to 28</text><text x="170" y="225" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">dust, small branches move</text><rect x="20" y="242" width="36" height="30" rx="6" fill="#e8590c" stroke="none" stroke-width="0"/><text x="38" y="263" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><text x="66" y="263" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">29 to 38</text><text x="170" y="263" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">small trees sway</text>
</svg>
