<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A ruler from 0 to 50 metres from your hide. A green band marks the shooting zone, inside 35 metres. A Canada goose landing at about 33 metres, wings cupped and feet down, is ticked. A goose at 50 metres is crossed out: it looks close because it is big, but it is too far. Wait for feet down inside 35 metres, 38 yards, and aim at the head. Tip.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Geese look close. Count the metres (Tip)</text>
<rect x="0" y="214" width="400" height="86" fill="#e7ecdc"/>
<rect x="34" y="188" width="224" height="22" rx="4" fill="#2f6e3b" opacity=".22"/>
<text x="156" y="204" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Shoot: inside 35 m</text>
<line x1="34" y1="214" x2="390" y2="214" stroke="#2f3a2b" stroke-width="2"/>
<line x1="34.0" y1="208" x2="34.0" y2="220" stroke="#2f3a2b" stroke-width="2"/>
<text x="34" y="238" font-size="15" fill="#2f3a2b" text-anchor="middle">0 m</text>
<line x1="98.0" y1="208" x2="98.0" y2="220" stroke="#2f3a2b" stroke-width="2"/>
<text x="98" y="238" font-size="15" fill="#2f3a2b" text-anchor="middle">10 m</text>
<line x1="162.0" y1="208" x2="162.0" y2="220" stroke="#2f3a2b" stroke-width="2"/>
<text x="162" y="238" font-size="15" fill="#2f3a2b" text-anchor="middle">20 m</text>
<line x1="226.0" y1="208" x2="226.0" y2="220" stroke="#2f3a2b" stroke-width="2"/>
<text x="226" y="238" font-size="15" fill="#2f3a2b" text-anchor="middle">30 m</text>
<line x1="290.0" y1="208" x2="290.0" y2="220" stroke="#2f3a2b" stroke-width="2"/>
<text x="290" y="238" font-size="15" fill="#2f3a2b" text-anchor="middle">40 m</text>
<line x1="354.0" y1="208" x2="354.0" y2="220" stroke="#2f3a2b" stroke-width="2"/>
<text x="350" y="238" font-size="15" fill="#2f3a2b" text-anchor="middle">50 m</text>
<path d="M12 214 L16 180 L22 194 L26 174 L32 192 L38 176 L44 194 L50 184 L54 214 Z" fill="#8a9a6b" stroke="#5b6b3e" stroke-width="1.2"/>
<text x="34" y="260" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">You</text>
