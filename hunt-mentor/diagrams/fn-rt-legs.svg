<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A route split into legs: truck, creek fork, saddle, knob, bench. Each checkpoint is a feature you can recognise. Note the time at each one; if you are 30 minutes behind, rethink the plan.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#dfe6d3" stroke="none" stroke-width="2"/><text x="14" y="26" font-family="sans-serif" font-size="16" fill="#2f3a2b" text-anchor="start" font-weight="bold">Break it into legs</text><line x1="40" y1="260" x2="110" y2="215" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><line x1="110" y1="215" x2="180" y2="150" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><line x1="180" y1="150" x2="250" y2="110" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><line x1="250" y1="110" x2="300" y2="60" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><circle cx="40" cy="260" r="12" fill="#ffffff" stroke="#e8590c" stroke-width="3"/><text x="40" y="265" font-family="sans-serif" font-size="13" fill="#e8590c" text-anchor="middle" font-weight="bold">0</text><text x="56" y="265" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Truck</text><circle cx="110" cy="215" r="12" fill="#ffffff" stroke="#e8590c" stroke-width="3"/><text x="110" y="220" font-family="sans-serif" font-size="13" fill="#e8590c" text-anchor="middle" font-weight="bold">1</text><text x="126" y="220" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Creek fork</text><circle cx="180" cy="150" r="12" fill="#ffffff" stroke="#e8590c" stroke-width="3"/><text x="180" y="155" font-family="sans-serif" font-size="13" fill="#e8590c" text-anchor="middle" font-weight="bold">2</text><text x="196" y="155" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Saddle</text><circle cx="250" cy="110" r="12" fill="#ffffff" stroke="#e8590c" stroke-width="3"/><text x="250" y="115" font-family="sans-serif" font-size="13" fill="#e8590c" text-anchor="middle" font-weight="bold">3</text><text x="266" y="115" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Knob</text><circle cx="300" cy="60" r="12" fill="#ffffff" stroke="#e8590c" stroke-width="3"/><text x="300" y="65" font-family="sans-serif" font-size="13" fill="#e8590c" text-anchor="middle" font-weight="bold">4</text><text x="316" y="65" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Bench</text><text x="14" y="290" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Note the time at each. Behind by 30 min? Rethink.</text>
</svg>
