<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 514" font-family="sans-serif" role="img" aria-label="Bar chart of Region 3 mule deer resident harvest, average per year 2020 to 2024, official survey estimates, with hunter success. MU 3-30, Cache Creek and Clinton: 502 deer, 24 percent of hunters successful. MU 3-27, Heffley Creek and Sun Peaks: 327 deer, 30 percent. MU 3-19, Logan Lake and Knutsford: 327 deer, 21 percent. MU 3-29, Dewdrop, north of Kamloops Lake: 299 deer, 31 percent. MU 3-26, Chase and Salmon Arm: 258 deer, 21 percent. MU 3-31, Clinton Creek side: 248 deer, 27 percent. MU 3-20, Kamloops south: 240 deer, 22 percent. MU 3-18, Savona and Ashcroft: 226 deer, 25 percent. Source: BC Big Game Harvest Statistics 1976 to 2024, BC Data Catalogue. Area labels approximate.">
