<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Top view of a goose flock made of five family groups, each circled: two dark birds, the pair, with 1 to 4 brown young. The young stay with their parents a full year, 80 percent. Geese find a mate in their second year and usually pair for life, 80 percent. Most first nest at 2 or 3 years old, 80 percent.">
