<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Chamber length and shell length. A 3 inch chamber takes 2 3/4 inch (70 mm) and 3 inch (76 mm) shells. A 3 1/2 inch (89 mm) shell is too long for it and must never be loaded. The length on the box is the fired length.">
<rect width="400" height="300" fill="#EEF1EA"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Chamber: shell must fit</text>
<rect x="40" y="70" width="300" height="56" fill="#3b4045"/>
<rect x="40" y="80" width="236" height="36" fill="#cfd5d8"/>
<path d="M276 80 L300 86 L300 110 L276 116 Z" fill="#cfd5d8"/>
<rect x="300" y="86" width="40" height="24" fill="#cfd5d8"/>
<line x1="158.0" y1="70.0" x2="158.0" y2="80.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="158.0" cy="80.0" r="3" fill="#1F3D2B"/><rect x="72.2" y="47.0" width="175.7" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="160.0" y="64.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">3 in chamber (76 mm)</text>
<rect x="40" y="158" width="217" height="24" rx="2" fill="#3b6e8f" stroke="#17201A" stroke-width="1"/>
<rect x="40" y="157" width="14" height="26" fill="#c9a227"/>
<text x="60.0" y="176.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="start">2 3/4 in (70 mm)</text>
<path d="M354 170 L361.3 177.7 L376 161.2" fill="none" stroke="#1F3D2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="198" width="236" height="24" rx="2" fill="#3b6e8f" stroke="#17201A" stroke-width="1"/>
<rect x="40" y="197" width="14" height="26" fill="#c9a227"/>
<text x="60.0" y="216.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="start">3 in (76 mm)</text>
<path d="M354 210 L361.3 217.7 L376 201.2" fill="none" stroke="#1F3D2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="238" width="276" height="24" rx="2" fill="#3b6e8f" stroke="#FF6A13" stroke-width="3"/>
<rect x="40" y="237" width="14" height="26" fill="#c9a227"/>
<text x="60.0" y="256.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="start">3 1/2 in (89 mm)</text>
<line x1="355" y1="240" x2="375" y2="260" stroke="#FF6A13" stroke-width="4" stroke-linecap="round"/><line x1="355" y1="260" x2="375" y2="240" stroke="#FF6A13" stroke-width="4" stroke-linecap="round"/>
<line x1="276" y1="140" x2="276" y2="272" stroke="#1F3D2B" stroke-width="2" stroke-dasharray="5 4"/>
<text x="200.0" y="292.0" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Never longer than the barrel stamp.</text>
</svg>
