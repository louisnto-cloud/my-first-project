<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Driving home, what is in the truck, all 95 percent. The notched species licence, with the meat. Evidence of sex, still attached. Antlers on the skull plate in an antler restricted season. All edible portions: neck, ribs, four quarters and loins. Photo ID and your Fish and Wildlife ID number. At a check station, stop and report, with or without game." font-family="sans-serif">
