<text x="50" y="159" font-size="14" fill="#2f3a2b" text-anchor="start" font-weight="bold">Antlers + skull plate</text>
<text x="102" y="186" font-size="13" fill="#8b5a2b" text-anchor="middle">restricted season</text>
<rect x="205" y="128" width="185" height="74" rx="10" fill="#f3ead8" stroke="#8a9a6b"/>
