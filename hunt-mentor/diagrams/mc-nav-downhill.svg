<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side view: the road and truck are up on a bench, and a lost hunter drifts down a draw toward a creek and cliffs. Lost hunters tend to go downhill and off trail, Koester via Popular Science, 65 percent. North Shore Rescue warns ravines are steep and hard to climb out of, 75 percent.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Lost hunters drift downhill</text><path d="M20 120 L120 128 L200 180 L260 262 L300 270 L380 150 L380 300 L20 300 Z" fill="#dfe6d3" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 120 L120 128 L200 180 L260 262 L300 270 L380 150" fill="none" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(70 118) scale(0.8)"><rect x="-22" y="-14" width="30" height="14" fill="#2f3a2b"/><path d="M8 -14 h10 l6 7 v7 h-16 Z" fill="#2f3a2b"/><circle cx="-12" cy="2" r="5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/><circle cx="14" cy="2" r="5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/></g><text x="70" y="98" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Road</text><path d="M260 262 L300 270" fill="none" stroke="#4a7fb0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="282" y="294" font-size="15" fill="#4a7fb0" text-anchor="middle" font-weight="bold">Creek, cliffs</text><line x1="130" y1="140" x2="232.76644455856427" y2="238.095242533175" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/><polygon points="240.0,245.0 236.2,234.5 229.3,241.7" fill="#e8590c"/><text x="206" y="178" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">Down a draw</text><text x="200" y="52" font-size="14" fill="#23261f" text-anchor="middle">Up to the road may be the way out (Tip)</text><text x="200" y="72" font-size="14" fill="#6b4f35" text-anchor="middle">Koester (65%). Ravines: NSR (75%)</text>
