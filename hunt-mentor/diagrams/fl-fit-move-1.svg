<text x="56" y="39" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="start">Step up</text>
<rect x="10" y="228" width="380" height="8" rx="2" fill="#c9b79c"/><rect x="200" y="168" width="110" height="60" rx="4" fill="#6b4f35"/><circle cx="240" cy="64" r="11" fill="#2f3a2b"/><line x1="240" y1="75" x2="240" y2="130" stroke="#2f3a2b" stroke-width="7" stroke-linecap="round"/><line x1="240" y1="130" x2="232" y2="168" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="240" y1="130" x2="196" y2="160" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="196" y1="160" x2="186" y2="228" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="240" y1="90" x2="222" y2="120" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><line x1="240" y1="90" x2="258" y2="120" stroke="#2f3a2b" stroke-width="5" stroke-linecap="round"/><line x1="320" y1="200" x2="320" y2="120" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><polygon points="320.0,120.0 324.3,129.0 315.7,129.0" fill="#e8590c"/><text x="330" y="110" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">Drive up</text>
<rect x="10" y="262" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="285.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Whole foot on the box. Push through the heel.</text>
