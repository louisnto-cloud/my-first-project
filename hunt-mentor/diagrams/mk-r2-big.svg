<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" font-family="sans-serif" role="img" aria-label="Region 2 big game limits. Black tailed deer, Region 2: 2 a licence year, at most 1 antlerless (99%, page 27). Deer in MU 2-8: Bucks only. No antlerless season. Deer, MUs 2-5 and 2-12: 1 buck, Sept 10 to Nov 30. Deer, Bowen and Texada (MU 2-16): 3. White tailed deer: 0. No season in Region 2 (99%, pages 14, 27). All deer, all of BC: 3 a licence year (99%, page 14). Black bear: 2 a licence year (Apr 1 to Mar 31). Cougar: 2. Mountain goat: 1. Wolf: 3. Not open in MU 2-8. Bobcat: 1. Coyote, raccoon, skunk: No limit. Snowshoe hare: 10 a day.">
<rect width="400" height="860" rx="12" fill="#EEF1EA"/>
<text x="16" y="30" font-size="18" font-weight="bold" fill="#1F3D2B">Region 2 big game limits</text>
<text x="16" y="52" font-size="14" fill="#17201A">Every row: 99%, page 28 unless shown</text>
<g><rect x="12" y="68" width="376" height="78" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="3"/><rect x="12" y="68" width="158" height="78" rx="8" fill="#FF6A13"/><rect x="162" y="68" width="8" height="78" fill="#FF6A13"/><text x="22" y="90" font-size="15" font-weight="bold" fill="#17201A">Black tailed</text>
<text x="22" y="109" font-size="15" font-weight="bold" fill="#17201A">deer, Region 2</text><text x="180" y="90" font-size="15" fill="#17201A">2 a licence year, at most</text>
<text x="180" y="109" font-size="15" fill="#17201A">1 antlerless</text><text x="180" y="130" font-size="14" fill="#1F3D2B">99%, page 27</text></g>
<g><rect x="12" y="154" width="376" height="56" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="3"/><rect x="12" y="154" width="158" height="56" rx="8" fill="#FF6A13"/><rect x="162" y="154" width="8" height="56" fill="#FF6A13"/><text x="22" y="176" font-size="15" font-weight="bold" fill="#17201A">Deer in MU 2-8</text><text x="180" y="176" font-size="15" fill="#17201A">Bucks only. No antlerless</text>
<text x="180" y="195" font-size="15" fill="#17201A">season</text></g>
<g><rect x="12" y="218" width="376" height="56" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><rect x="12" y="218" width="158" height="56" rx="8" fill="#1F3D2B"/><rect x="162" y="218" width="8" height="56" fill="#1F3D2B"/><text x="22" y="240" font-size="15" font-weight="bold" fill="#FFFFFF">Deer, MUs 2-5</text>
<text x="22" y="259" font-size="15" font-weight="bold" fill="#FFFFFF">and 2-12</text><text x="180" y="240" font-size="15" fill="#17201A">1 buck, Sept 10 to Nov 30</text></g>
<g><rect x="12" y="282" width="376" height="75" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><rect x="12" y="282" width="158" height="75" rx="8" fill="#1F3D2B"/><rect x="162" y="282" width="8" height="75" fill="#1F3D2B"/><text x="22" y="304" font-size="15" font-weight="bold" fill="#FFFFFF">Deer, Bowen and</text>
<text x="22" y="323" font-size="15" font-weight="bold" fill="#FFFFFF">Texada (MU</text>
<text x="22" y="342" font-size="15" font-weight="bold" fill="#FFFFFF">2-16)</text><text x="180" y="304" font-size="15" fill="#17201A">3</text></g>
<g><rect x="12" y="365" width="376" height="59" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><rect x="12" y="365" width="158" height="59" rx="8" fill="#1F3D2B"/><rect x="162" y="365" width="8" height="59" fill="#1F3D2B"/><text x="22" y="387" font-size="15" font-weight="bold" fill="#FFFFFF">White tailed</text>
<text x="22" y="406" font-size="15" font-weight="bold" fill="#FFFFFF">deer</text><text x="180" y="387" font-size="15" fill="#17201A">0. No season in Region 2</text><text x="180" y="408" font-size="14" fill="#1F3D2B">99%, pages 14, 27</text></g>
<g><rect x="12" y="432" width="376" height="59" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><rect x="12" y="432" width="158" height="59" rx="8" fill="#1F3D2B"/><rect x="162" y="432" width="8" height="59" fill="#1F3D2B"/><text x="22" y="454" font-size="15" font-weight="bold" fill="#FFFFFF">All deer, all</text>
<text x="22" y="473" font-size="15" font-weight="bold" fill="#FFFFFF">of BC</text><text x="180" y="454" font-size="15" fill="#17201A">3 a licence year</text><text x="180" y="475" font-size="14" fill="#1F3D2B">99%, page 14</text></g>
<g><rect x="12" y="499" width="376" height="56" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><rect x="12" y="499" width="158" height="56" rx="8" fill="#1F3D2B"/><rect x="162" y="499" width="8" height="56" fill="#1F3D2B"/><text x="22" y="521" font-size="15" font-weight="bold" fill="#FFFFFF">Black bear</text><text x="180" y="521" font-size="15" fill="#17201A">2 a licence year (Apr 1</text>
<text x="180" y="540" font-size="15" fill="#17201A">to Mar 31)</text></g>
<g><rect x="12" y="563" width="376" height="37" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><rect x="12" y="563" width="158" height="37" rx="8" fill="#1F3D2B"/><rect x="162" y="563" width="8" height="37" fill="#1F3D2B"/><text x="22" y="585" font-size="15" font-weight="bold" fill="#FFFFFF">Cougar</text><text x="180" y="585" font-size="15" fill="#17201A">2</text></g>
<g><rect x="12" y="608" width="376" height="37" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><rect x="12" y="608" width="158" height="37" rx="8" fill="#1F3D2B"/><rect x="162" y="608" width="8" height="37" fill="#1F3D2B"/><text x="22" y="630" font-size="15" font-weight="bold" fill="#FFFFFF">Mountain goat</text><text x="180" y="630" font-size="15" fill="#17201A">1</text></g>
<g><rect x="12" y="653" width="376" height="37" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><rect x="12" y="653" width="158" height="37" rx="8" fill="#1F3D2B"/><rect x="162" y="653" width="8" height="37" fill="#1F3D2B"/><text x="22" y="675" font-size="15" font-weight="bold" fill="#FFFFFF">Wolf</text><text x="180" y="675" font-size="15" fill="#17201A">3. Not open in MU 2-8</text></g>
<g><rect x="12" y="698" width="376" height="37" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><rect x="12" y="698" width="158" height="37" rx="8" fill="#1F3D2B"/><rect x="162" y="698" width="8" height="37" fill="#1F3D2B"/><text x="22" y="720" font-size="15" font-weight="bold" fill="#FFFFFF">Bobcat</text><text x="180" y="720" font-size="15" fill="#17201A">1</text></g>
<g><rect x="12" y="743" width="376" height="56" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><rect x="12" y="743" width="158" height="56" rx="8" fill="#1F3D2B"/><rect x="162" y="743" width="8" height="56" fill="#1F3D2B"/><text x="22" y="765" font-size="15" font-weight="bold" fill="#FFFFFF">Coyote,</text>
<text x="22" y="784" font-size="15" font-weight="bold" fill="#FFFFFF">raccoon, skunk</text><text x="180" y="765" font-size="15" fill="#17201A">No limit</text></g>
<g><rect x="12" y="807" width="376" height="37" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><rect x="12" y="807" width="158" height="37" rx="8" fill="#1F3D2B"/><rect x="162" y="807" width="8" height="37" fill="#1F3D2B"/><text x="22" y="829" font-size="15" font-weight="bold" fill="#FFFFFF">Snowshoe hare</text><text x="180" y="829" font-size="15" fill="#17201A">10 a day</text></g>

</svg>
