<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 328" font-family="sans-serif" role="img" aria-label="Click math at 100 metres with the Arctic iron sights. A 3 shot group, number 1, is centred 4.2 cm low and 2.8 cm left of the bull. Each click moves about 0.7 cm, so: up 4.2 divided by 0.7 is 6 clicks; right 2.8 divided by 0.7 is 4 clicks. At 50 metres, double the clicks.">
<rect x="0" y="0" width="400" height="328" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Click math at 100 m</text><rect x="20" y="44" width="200" height="200" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="120" cy="144" r="90" fill="none" stroke="#8F9A8C" stroke-width="1.5"/><circle cx="120" cy="144" r="60" fill="none" stroke="#8F9A8C" stroke-width="1.5"/><circle cx="120" cy="144" r="30" fill="none" stroke="#8F9A8C" stroke-width="1.5"/><line x1="20" y1="144" x2="220" y2="144" stroke="#8F9A8C"/><line x1="120" y1="44" x2="120" y2="244" stroke="#8F9A8C"/><circle cx="82" cy="182" r="4" fill="#1F3D2B"/><circle cx="93" cy="189" r="4" fill="#1F3D2B"/><circle cx="88" cy="193" r="4" fill="#1F3D2B"/><circle cx="88" cy="188" r="12" fill="none" stroke="#FF6A13" stroke-width="2"/><line x1="88" y1="174" x2="88.0" y2="157.2" stroke="#FF6A13" stroke-width="2.5" stroke-linecap="round"/><path d="M88 150 L91.9 158.1 L84.1 158.1z" fill="#FF6A13"/><line x1="100" y1="188" x2="108.8" y2="188.0" stroke="#FF6A13" stroke-width="2.5" stroke-linecap="round"/><path d="M116 188 L107.9 191.9 L107.9 184.1z" fill="#FF6A13"/><circle cx="60" cy="216" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="60" y="221" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="232" y="70" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Group centre:</text><text x="232" y="90" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">4.2 cm low</text><text x="232" y="110" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">2.8 cm left</text><text x="232" y="140" font-size="14" fill="#17201A" text-anchor="start">Up: 4.2 / 0.7</text><text x="232" y="160" font-size="14" fill="#17201A" text-anchor="start">= 6 clicks</text><text x="232" y="180" font-size="14" fill="#17201A" text-anchor="start">Right: 2.8 / 0.7</text><text x="232" y="200" font-size="14" fill="#17201A" text-anchor="start">= 4 clicks</text><rect x="12" y="256" width="376" height="60" rx="8" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="24" y="280" font-size="14" fill="#17201A" text-anchor="start">Clicks = cm off / 0.7 (iron sights).</text><text x="24" y="300" font-size="14" fill="#17201A" text-anchor="start">At 50 m, double the clicks.</text>
</svg>
