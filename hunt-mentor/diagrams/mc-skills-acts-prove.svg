<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two boxes. ACTS: assume every firearm is loaded, control the muzzle, trigger finger off, see that it is unloaded. PROVE: point it safe, remove all cartridges, observe the chamber, verify the feeding path, examine the bore. Do them every time you pick up, put down or hand over a firearm.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">ACTS and PROVE (85%)</text><rect x="14" y="42" width="182" height="214" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><rect x="14" y="42" width="182" height="26" rx="8" fill="#2f3a2b"/><rect x="14" y="56" width="182" height="12" fill="#2f3a2b"/><text x="105.0" y="61" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">ACTS</text><text x="24" y="88" font-size="14" fill="#23261f" text-anchor="start">Assume it is loaded</text><text x="24" y="107" font-size="14" fill="#23261f" text-anchor="start">Control the muzzle</text><text x="24" y="126" font-size="14" fill="#23261f" text-anchor="start">Trigger finger off</text><text x="24" y="145" font-size="14" fill="#23261f" text-anchor="start">See it is unloaded</text><rect x="204" y="42" width="182" height="214" rx="8" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><rect x="204" y="42" width="182" height="26" rx="8" fill="#e8590c"/><rect x="204" y="56" width="182" height="12" fill="#e8590c"/><text x="295.0" y="61" font-size="15" fill="#fffaf0" text-anchor="middle" font-weight="bold">PROVE</text><text x="214" y="88" font-size="14" fill="#23261f" text-anchor="start">Point it safe</text><text x="214" y="107" font-size="14" fill="#23261f" text-anchor="start">Remove cartridges</text><text x="214" y="126" font-size="14" fill="#23261f" text-anchor="start">Observe chamber</text><text x="214" y="145" font-size="14" fill="#23261f" text-anchor="start">Verify feed path</text><text x="214" y="164" font-size="14" fill="#23261f" text-anchor="start">Examine the bore</text><text x="200" y="282" font-size="14" fill="#6b4f35" text-anchor="middle">Every time you pick up, put down, hand over</text>
</svg>
