<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="The SKS safety lever, in orange, behind the trigger. Left, SAFE: lever turned forward and up, it blocks the trigger. Right, FIRE: lever turned rearward and down against the rear of the trigger guard.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">The safety: two positions</text>
<text x="100.0" y="56.0" font-size="17" font-weight="bold" fill="#2E7D4F" text-anchor="middle">SAFE</text><text x="300.0" y="56.0" font-size="17" font-weight="bold" fill="#B3261E" text-anchor="middle">FIRE</text><rect x="28.0" y="120.0" width="150.0" height="24.0" rx="3" fill="#59625C" stroke="#17201A" stroke-width="1.5"/><path d="M58.0 144.0 L62.0 182.0 L138.0 182.0 L144.0 144.0" fill="none" stroke="#3A403C" stroke-width="6.0" stroke-linejoin="round"/><path d="M108.0 144.0 Q100.0 160.0 106.0 172.0" fill="none" stroke="#3A403C" stroke-width="5.0" stroke-linecap="round"/><line x1="76.0" y1="148.0" x2="94.0" y2="160.0" stroke="#FF6A13" stroke-width="6.0" stroke-linecap="round"/><rect x="128.0" y="94.0" width="16.0" height="28.0" rx="2" fill="#8E9690" stroke="#17201A" stroke-width="1.2"/><rect x="228.0" y="120.0" width="150.0" height="24.0" rx="3" fill="#59625C" stroke="#17201A" stroke-width="1.5"/><path d="M258.0 144.0 L262.0 182.0 L338.0 182.0 L344.0 144.0" fill="none" stroke="#3A403C" stroke-width="6.0" stroke-linejoin="round"/><path d="M308.0 144.0 Q300.0 160.0 306.0 172.0" fill="none" stroke="#3A403C" stroke-width="5.0" stroke-linecap="round"/><line x1="276.0" y1="148.0" x2="266.0" y2="174.0" stroke="#FF6A13" stroke-width="6.0" stroke-linecap="round"/><rect x="328.0" y="94.0" width="16.0" height="28.0" rx="2" fill="#8E9690" stroke="#17201A" stroke-width="1.2"/><path d="M79.0 172.5 A26 26 0 0 0 114.5 163.0" fill="none" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/><polygon points="116.5,159.5 114.3,174.0 105.1,168.7" fill="#FF6A13" stroke="#FF6A13" stroke-width="1" stroke-linejoin="round"/><text x="100.0" y="228.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Forward and up.</text><text x="100.0" y="248.0" font-size="14" fill="#17201A" text-anchor="middle">Blocks the trigger.</text><text x="300.0" y="228.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Rearward and down,</text><text x="300.0" y="248.0" font-size="14" fill="#17201A" text-anchor="middle">against the guard.</text>
<text x="200.0" y="288.0" font-size="14" fill="#17201A" text-anchor="middle">The safety is a part. Safe is a habit.</text>
</svg>
