<text x="18" y="263" font-size="15" fill="#2f3a2b">Birds dive into soft</text>
<text x="18" y="282" font-size="15" fill="#2f3a2b">snow 20 cm+</text>
<rect x="18.0" y="300" width="40.9" height="24" rx="12.0" fill="#2f6e3b"/><text x="38.4" y="317.04" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">75%</text>
<rect x="204" y="174" width="188" height="158" rx="8" fill="#f4eedf" stroke="#d8cfb8" stroke-width="1.2"/>
<circle cx="232" cy="202" r="20" fill="#fffaf0"/><g transform="translate(232 202)"><rect x="-4" y="-16" width="8" height="24" rx="4" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2"/><circle cy="10" r="7" fill="#4a7fb0" stroke="#2f3a2b" stroke-width="2"/><rect x="-1.5" y="-2" width="3" height="10" fill="#4a7fb0"/></g>
