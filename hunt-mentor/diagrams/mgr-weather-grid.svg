<circle cx="36" cy="368" r="20" fill="#fffaf0"/><g transform="translate(36 368)"><path d="M-15 6 A15 15 0 1 1 15 6" stroke="#2f3a2b" stroke-width="2.6" fill="none"/><path d="M0 -15 V-11" stroke="#2f3a2b" stroke-width="2" transform="rotate(-80)"/><path d="M0 -15 V-11" stroke="#2f3a2b" stroke-width="2" transform="rotate(-40)"/><path d="M0 -15 V-11" stroke="#2f3a2b" stroke-width="2" transform="rotate(0)"/><path d="M0 -15 V-11" stroke="#2f3a2b" stroke-width="2" transform="rotate(40)"/><path d="M0 -15 V-11" stroke="#2f3a2b" stroke-width="2" transform="rotate(80)"/><path d="M0 2 L-9 -8" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><circle cy="2" r="3.4" fill="#2f3a2b"/></g>
<text x="64" y="374" font-size="17" font-weight="bold" fill="#2f3a2b">Pressure front</text>
<text x="18" y="410" font-size="15" fill="#2f3a2b">No grouse study found.</text>
<text x="18" y="429" font-size="15" fill="#2f3a2b">Watch and log it</text>
<text x="18" y="448" font-size="15" fill="#2f3a2b">(Journal).</text>
