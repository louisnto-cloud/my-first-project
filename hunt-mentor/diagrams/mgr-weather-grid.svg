<text x="214" y="97" font-size="15" fill="#2f3a2b">Birds stay dry there.</text>
<rect x="214.0" y="134" width="122.4" height="24" rx="12.0" fill="#8a9a6b"/><text x="275.2" y="151.04" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">Tip: hunter lore</text>
<rect x="8" y="174" width="188" height="158" rx="8" fill="#f4eedf" stroke="#d8cfb8" stroke-width="1.2"/>
<circle cx="36" cy="202" r="20" fill="#fffaf0"/><g transform="translate(36 202)"><path d="M0 -15 V15" stroke="#4a7fb0" stroke-width="2.6" stroke-linecap="round" transform="rotate(0)"/><path d="M0 -15 V15" stroke="#4a7fb0" stroke-width="2.6" stroke-linecap="round" transform="rotate(60)"/><path d="M0 -15 V15" stroke="#4a7fb0" stroke-width="2.6" stroke-linecap="round" transform="rotate(120)"/><circle r="3.5" fill="#4a7fb0"/></g>
