<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 506" font-family="sans-serif" role="img" aria-label="Weather: where to look for grouse, six tiles. Strong wind: birds are wild and flush far, hunt sheltered draws, hunter lore (Tip). Rain: birds sit under thick conifers to stay dry, hunter lore (Tip). Fresh snow: read tracks and roosts; birds dive into soft snow 20 centimetres or deeper, 75 percent. Bitter cold: feeding may shift to midday, hunter lore (Tip). Pressure front: no grouse study found, watch and log it in the Journal. Moon: no grouse study found, do not plan around it.">
<rect width="400" height="506" fill="#fffaf0"/>
<rect x="8" y="8" width="188" height="158" rx="8" fill="#f4eedf" stroke="#d8cfb8" stroke-width="1.2"/>
