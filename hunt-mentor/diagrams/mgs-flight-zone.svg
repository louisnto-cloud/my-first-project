<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two panels. In a park or quiet farm the flush ring around a flock is small: you get close. In a hunted or wild area the ring is large: they flush far. Flight distance changes from place to place, 70 percent. On hunting days tracked geese moved less and flew sooner when a threat came close, 80 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">How close before they fly? It depends</text><rect x="20" y="44" width="170" height="200" rx="10" fill="#e8f3e0" stroke="#8a9a6b" stroke-width="2"/><rect x="210" y="44" width="170" height="200" rx="10" fill="#fdecea" stroke="#8a9a6b" stroke-width="2"/><text x="105" y="66" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Park or quiet farm</text><text x="295" y="66" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Hunted or wild area</text><circle cx="105" cy="150" r="30" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="6 4"/><circle cx="295" cy="140" r="60" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="6 4"/><g transform="translate(99 146) rotate(0) scale(0.9)"><ellipse rx="9" ry="5" fill="#7a6a58"/><line x1="7" y1="0" x2="13" y2="0" stroke="#2f3a2b" stroke-width="3"/><circle cx="14" cy="0" r="3" fill="#2f3a2b"/></g><g transform="translate(289 136) rotate(0) scale(0.9)"><ellipse rx="9" ry="5" fill="#7a6a58"/><line x1="7" y1="0" x2="13" y2="0" stroke="#2f3a2b" stroke-width="3"/><circle cx="14" cy="0" r="3" fill="#2f3a2b"/></g><g transform="translate(113 156) rotate(0) scale(0.9)"><ellipse rx="9" ry="5" fill="#7a6a58"/><line x1="7" y1="0" x2="13" y2="0" stroke="#2f3a2b" stroke-width="3"/><circle cx="14" cy="0" r="3" fill="#2f3a2b"/></g><g transform="translate(303 146) rotate(0) scale(0.9)"><ellipse rx="9" ry="5" fill="#7a6a58"/><line x1="7" y1="0" x2="13" y2="0" stroke="#2f3a2b" stroke-width="3"/><circle cx="14" cy="0" r="3" fill="#2f3a2b"/></g><g transform="translate(105 160) rotate(0) scale(0.9)"><ellipse rx="9" ry="5" fill="#7a6a58"/><line x1="7" y1="0" x2="13" y2="0" stroke="#2f3a2b" stroke-width="3"/><circle cx="14" cy="0" r="3" fill="#2f3a2b"/></g><g transform="translate(295 150) rotate(0) scale(0.9)"><ellipse rx="9" ry="5" fill="#7a6a58"/><line x1="7" y1="0" x2="13" y2="0" stroke="#2f3a2b" stroke-width="3"/><circle cx="14" cy="0" r="3" fill="#2f3a2b"/></g><text x="105" y="226" font-size="14" fill="#23261f" text-anchor="middle">You get close</text><text x="295" y="232" font-size="14" fill="#23261f" text-anchor="middle">They flush far</text><text x="200" y="266" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Flight distance changes place to place (70%)</text><text x="200" y="286" font-size="14" fill="#23261f" text-anchor="middle">On hunt days they move less and fly sooner (80%)</text>
</svg>
