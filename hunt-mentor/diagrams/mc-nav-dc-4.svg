<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Compass drill step 4: measure how far from the start flag you finished. Pass within about 10 metres; if not, find out why: metal nearby, pacing or reading. Pass mark is a Tip.">
<rect width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c"/><text x="26" y="31" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">4</text><text x="52" y="32" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Measure the miss</text><rect x="20" y="56" width="360" height="200" rx="8" fill="#dfe6d3"/><g transform="translate(90 200) scale(1.8) translate(-90 -200)"><line x1="90" y1="200" x2="90" y2="166" stroke="#23261f" stroke-width="3" stroke-linecap="round"/><polygon points="90,166 110,173 90,180" fill="#e8590c"/><circle cx="116" cy="194" r="5" fill="#e8590c"/></g><text x="170" y="100" font-size="15" fill="#23261f" text-anchor="start" font-weight="bold">Pass: within 10 m</text><text x="170" y="130" font-size="15" fill="#23261f" text-anchor="start">of the start flag</text><text x="170" y="160" font-size="15" fill="#23261f" text-anchor="start">Fail: why? Metal? Pace?</text>
</svg>
