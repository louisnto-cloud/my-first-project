<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Glassing plan for a day. Deer activity, a curve, peaks at dawn and dusk and dips at midday. Legal hunting hours for deer run from 1 hour before sunrise to 1 hour after sunset. Glass open slopes at first light and the last hour, and glass shade, timber edges and benches at midday.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect x="40" y="40" width="320" height="170" fill="#dfe6d3" opacity=".6"/>
  <rect x="40" y="40" width="40" height="170" fill="#2f3a2b" opacity=".15"/><rect x="320" y="40" width="40" height="170" fill="#2f3a2b" opacity=".15"/>
  <path d="M40 120 C 60 60, 80 50, 100 60 C 140 90, 160 190, 200 190 C 240 190, 260 90, 300 60 C 320 50, 340 60, 360 120" fill="none" stroke="#e8590c" stroke-width="4"/>
  <line x1="40" y1="210" x2="360" y2="210" stroke="#2f3a2b" stroke-width="2"/>
  <g stroke="#2f3a2b" stroke-width="2" stroke-dasharray="4 4"><line x1="80" y1="40" x2="80" y2="210"/><line x1="320" y1="40" x2="320" y2="210"/></g>
  <g font-size="14" fill="#2f3a2b" text-anchor="middle"><text x="80" y="228">sunrise</text><text x="320" y="228">sunset</text><text x="200" y="228">midday</text></g>
  <text x="60" y="200" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1 h</text><text x="340" y="200" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1 h</text>
  <text x="200" y="26" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Legal hours: 1 h before sunrise to 1 h after sunset</text>
  <text x="100" y="80" font-size="14" font-weight="bold" fill="#e8590c">peak</text><text x="268" y="80" font-size="14" font-weight="bold" fill="#e8590c">peak</text>
  <rect x="12" y="242" width="180" height="50" rx="8" fill="#e8590c"/>
  <text x="102" y="263" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Dawn, last hour:</text><text x="102" y="282" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">open slopes, edges</text>
  <rect x="208" y="242" width="180" height="50" rx="8" fill="#2f3a2b"/>
  <text x="298" y="263" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Midday: shade,</text><text x="298" y="282" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">timber, benches</text>
</svg>
