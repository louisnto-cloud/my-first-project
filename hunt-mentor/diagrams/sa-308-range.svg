<text x="84" y="332" font-size="16" font-weight="bold" fill="#fffaf0">Your real limit: a 15 cm (6 in)</text>
<text x="84" y="354" font-size="16" fill="#fffaf0">plate, 9 of 10 from a field rest</text>
<text x="84" y="376" font-size="16" font-weight="bold" fill="#f6b98f">Most beginners: 200 m</text>
