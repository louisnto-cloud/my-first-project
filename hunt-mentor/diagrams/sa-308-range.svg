<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 398" font-family="sans-serif" role="img" aria-label="Chart for the .308 Winchester, bullet weight in grains and shot limit in metres. Mule deer and white tail: 150 to 165 grain bullets, shot limit 200 metres. Black bear: 150 to 180 grain, 150 metres, keep shots inside 150 metres until you have done it once. Moose and elk: 165 to 180 grain premium bullets, about 200 metres. All are tips or hunter consensus. Your real limit is the distance where you hit a 15 centimetre (6 inch) plate 9 times out of 10 from a field rest, for most beginners 200 metres.">
<rect width="400" height="398" fill="#fffaf0"/>
<text x="12" y="26" font-size="15" font-weight="bold" fill="#6b5b4b">.308: bullet in grains (gr), shot limit</text>
<text x="60" y="58" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">0</text>
<text x="164" y="58" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">100 m</text>
<text x="268" y="58" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">200 m</text>
<text x="372" y="58" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">300 m</text>

<text x="60" y="90" font-size="17" font-weight="bold" fill="#2f3a2b">Deer (mule, white tail)</text>
<text x="392" y="90" font-size="15" font-weight="bold" fill="#8b5a2b" text-anchor="end">150 to 165 gr</text>
