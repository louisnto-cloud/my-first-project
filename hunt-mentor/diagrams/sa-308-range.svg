<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 404" font-family="sans-serif" role="img" aria-label="Chart for the .308 Winchester. Mule deer and white tail: 150 to 165 grain bullets, shot limit 200 metres. Black bear: 150 to 180 grain, keep shots inside 150 metres until you have done it once. Moose and elk: 165 to 180 grain premium bullets, about 200 metres. All are tips or hunter consensus. Your real limit is the distance where you hit a 15 centimetre plate 9 times out of 10 from a field rest, for most beginners 200 metres.">
<rect x="0" y="0" width="400" height="404" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Your .308: load and max range</text><text x="200" y="48" font-size="13" fill="#6b4f35" text-anchor="middle">Bullet weight in grains (gr). Bar = your shot limit.</text><line x1="120.0" y1="62" x2="120.0" y2="312" stroke="#8a9a6b" stroke-width="1" stroke-dasharray="3 4"/><text x="120.0" y="62" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">0 m</text><line x1="203.33333333333331" y1="62" x2="203.33333333333331" y2="312" stroke="#8a9a6b" stroke-width="1" stroke-dasharray="3 4"/><text x="203.33333333333331" y="62" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">100 m</text><line x1="286.66666666666663" y1="62" x2="286.66666666666663" y2="312" stroke="#8a9a6b" stroke-width="1" stroke-dasharray="3 4"/><text x="286.66666666666663" y="62" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">200 m</text><line x1="370.0" y1="62" x2="370.0" y2="312" stroke="#8a9a6b" stroke-width="1" stroke-dasharray="3 4"/><text x="370.0" y="62" font-size="13" font-weight="bold" fill="#2f3a2b" text-anchor="middle">300 m</text><text x="8" y="94" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Mule deer</text><text x="8" y="114" font-size="13" fill="#6b4f35" text-anchor="start">150 to 165 gr</text><rect x="120" y="82" width="167" height="22" rx="4" fill="#8a9a6b"/><text x="292.66666666666663" y="99" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">200 m</text><text x="8" y="144" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">White tail</text><text x="8" y="164" font-size="13" fill="#6b4f35" text-anchor="start">150 to 165 gr</text><rect x="120" y="132" width="167" height="22" rx="4" fill="#8a9a6b"/><text x="292.66666666666663" y="149" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">200 m</text><text x="8" y="194" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Black bear</text><text x="8" y="214" font-size="13" fill="#6b4f35" text-anchor="start">150 to 180 gr</text><rect x="120" y="182" width="125" height="22" rx="4" fill="#e8590c"/><text x="251.0" y="199" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">150 m</text><text x="8" y="244" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Moose</text><text x="8" y="264" font-size="13" fill="#6b4f35" text-anchor="start">165 to 180 gr premium</text><rect x="120" y="232" width="167" height="22" rx="4" fill="#8a9a6b"/><text x="292.66666666666663" y="249" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">about 200 m</text><text x="8" y="294" font-size="15" font-weight="bold" fill="#23261f" text-anchor="start">Elk</text><text x="8" y="314" font-size="13" fill="#6b4f35" text-anchor="start">165 to 180 gr premium</text><rect x="120" y="282" width="167" height="22" rx="4" fill="#8a9a6b"/><text x="292.66666666666663" y="299" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">about 200 m</text><rect x="8" y="336" width="384" height="58" rx="8" fill="#fffaf0" stroke="#e8590c" stroke-width="1.5"/><text x="18" y="358" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Your real limit: hit a 15 cm (6 in) plate</text><text x="18" y="380" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">9 of 10 from a field rest. Most beginners: 200 m.</text>
</svg>
