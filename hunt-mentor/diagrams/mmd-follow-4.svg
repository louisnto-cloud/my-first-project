<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Frame 4: lost the trail? Go back to the last flag and circle out in bigger loops.">
<rect width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="36" width="400" height="264" fill="#eef0e6"/><rect x="84" y="220" width="10" height="30" fill="#e8590c"/><circle cx="90" cy="235" r="40" fill="none" stroke="#8b5a2b" stroke-width="2"/><circle cx="90" cy="235" r="75" fill="none" stroke="#8b5a2b" stroke-width="2"/><circle cx="90" cy="235" r="110" fill="none" stroke="#8b5a2b" stroke-width="2"/><text x="250" y="290" font-size="15" fill="#23261f" text-anchor="middle">Small loops first, then bigger</text><text x="200" y="26" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Lost it? Circle from the flag</text><circle cx="30" cy="60" r="18" fill="#e8590c"/><text x="30" y="66" font-size="16" fill="#fffaf0" text-anchor="middle" font-weight="bold">4</text>
