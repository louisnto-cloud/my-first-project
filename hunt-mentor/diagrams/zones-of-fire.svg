<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 604" font-family="sans-serif" role="img" aria-label="Zones of fire, seen from above. Walking side by side: hunters A and B walk in sight of each other and in line. Each shoots only in an arc of about 45 degrees straight ahead of them; the wedge between them is NO SHOT. Small boat: two hunters sit back to back, the bow shooter covers the arc off the bow and the stern shooter the arc off the stern; never shoot toward your partner. Sit to shoot, never swing past your partner, motor off and anchored.">
<rect width="400" height="604" fill="#fffaf0"/>
<text x="14" y="28" font-size="18" font-weight="bold" fill="#2f3a2b">Walking side by side</text>
<rect x="0" y="40" width="400" height="236" fill="#e9eddf"/>
<path d="M13 236 l2 -6 M17 236 l0 -7 M21 236 l-2 -6" stroke="#b9c29a" stroke-width="1.3" fill="none"/><path d="M390 159 l2 -6 M394 159 l0 -7 M398 159 l-2 -6" stroke="#b9c29a" stroke-width="1.3" fill="none"/>
<g data-tip="Your zone of fire|The only slice of ground where you may shoot: about 45 degrees straight ahead. Every shot also needs a safe backstop. Sky is never one."><path d="M128 232 L63.7 76.8 A168 168 0 0 1 192.3 76.8z" fill="#a9b98a" stroke="#6f7f52" stroke-width="2"/></g>
<g data-tip="Partner zone|B shoots only in their own slice. Never swing the muzzle outside your zone, even tracking a running deer."><path d="M272 232 L207.7 76.8 A168 168 0 0 1 336.3 76.8z" fill="#a9b98a" stroke="#6f7f52" stroke-width="2"/></g>
<g data-tip="No shot zone|The middle and behind are no shot zones. A deer runs into the gap: hold fire."><path d="M128.0 232.0 L192.3 76.8 L207.7 76.8 L272.0 232.0z" fill="#f6cfc0" stroke="#e8590c" stroke-width="2" stroke-dasharray="6 4"/>
<text x="200" y="170" font-size="18" font-weight="bold" fill="#c92a2a" text-anchor="middle">NO SHOT</text></g>
<text x="128" y="112" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A shoots</text>
<text x="128" y="130" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">here only</text>
<text x="272" y="112" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">B shoots</text>
<text x="272" y="130" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">here only</text>
<path d="M107.3 182.1 A54 54 0 0 1 148.7 182.1" stroke="#2f3a2b" stroke-width="1.6" fill="none"/>
<text x="128" y="172" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">45°</text>
<g data-tip="In sight, in line|Walk side by side, always in sight. Lose sight of each other: muzzles up or down, no shooting, call out."><line x1="144" y1="232" x2="256" y2="232" stroke="#2f3a2b" stroke-width="2" stroke-dasharray="5 4"/>
<g transform="translate(128 232) rotate(0) scale(1.05)"><path d="M3 -6 L4 -30" stroke="#3b2a1a" stroke-width="3.4" stroke-linecap="round"/><ellipse cx="0" cy="2" rx="15" ry="8" fill="#e8590c" stroke="#7a2f06" stroke-width="1.2"/><circle cx="0" cy="0" r="7" fill="#e8590c" stroke="#7a2f06" stroke-width="1.2"/><path d="M-5 -4 Q0 -11 5 -4z" fill="#c2410c"/></g><g transform="translate(272 232) rotate(0) scale(1.05)"><path d="M3 -6 L4 -30" stroke="#3b2a1a" stroke-width="3.4" stroke-linecap="round"/><ellipse cx="0" cy="2" rx="15" ry="8" fill="#e8590c" stroke="#7a2f06" stroke-width="1.2"/><circle cx="0" cy="0" r="7" fill="#e8590c" stroke="#7a2f06" stroke-width="1.2"/><path d="M-5 -4 Q0 -11 5 -4z" fill="#c2410c"/></g>
<text x="102" y="238" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A</text>
<text x="298" y="238" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">B</text>
<text x="200" y="260" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">in sight, in line</text></g>
<text x="14" y="300" font-size="15" fill="#2f3a2b">Each arc about 45 degrees, straight ahead</text>
<line x1="14" y1="318" x2="386" y2="318" stroke="#8a9a6b" stroke-width="2"/>
<text x="14" y="346" font-size="18" font-weight="bold" fill="#2f3a2b">Small boat, back to back</text>
<rect x="0" y="358" width="400" height="190" fill="#dbe7ef"/>
<path d="M20 378 q8 -4 16 0 t16 0" stroke="#b6cddd" stroke-width="1.6" fill="none"/><path d="M330 382 q8 -4 16 0 t16 0" stroke="#b6cddd" stroke-width="1.6" fill="none"/><path d="M10 532 q8 -4 16 0 t16 0" stroke="#b6cddd" stroke-width="1.6" fill="none"/><path d="M350 536 q8 -4 16 0 t16 0" stroke="#b6cddd" stroke-width="1.6" fill="none"/><path d="M100 374 q8 -4 16 0 t16 0" stroke="#b6cddd" stroke-width="1.6" fill="none"/><path d="M186 538 q8 -4 16 0 t16 0" stroke="#b6cddd" stroke-width="1.6" fill="none"/>
<g data-tip="Back to back|Two hunters sit back to back: the bow shooter faces forward, the stern shooter faces back. Shoot sitting, never stand."><path d="M168 446 L29.4 503.4 A150 150 0 0 1 29.4 388.6z" fill="#a9b98a" stroke="#6f7f52" stroke-width="2"/>
<path d="M236 446 L374.6 388.6 A150 150 0 0 1 374.6 503.4z" fill="#a9b98a" stroke="#6f7f52" stroke-width="2"/>
<path d="M112 424 H282 C312 424 334 438 344 446 C334 454 312 468 282 468 H112 C104 468 100 462 100 446 C100 430 104 424 112 424z" fill="#c9b48a" stroke="#6b4f35" stroke-width="2"/></g>
<rect x="106" y="437" width="10" height="18" rx="2" fill="#55524c"/>
<g transform="translate(168 446) rotate(270) scale(1.0)"><path d="M3 -6 L4 -30" stroke="#3b2a1a" stroke-width="3.4" stroke-linecap="round"/><ellipse cx="0" cy="2" rx="15" ry="8" fill="#e8590c" stroke="#7a2f06" stroke-width="1.2"/><circle cx="0" cy="0" r="7" fill="#e8590c" stroke="#7a2f06" stroke-width="1.2"/><path d="M-5 -4 Q0 -11 5 -4z" fill="#c2410c"/></g><g transform="translate(236 446) rotate(90) scale(1.0)"><path d="M3 -6 L4 -30" stroke="#3b2a1a" stroke-width="3.4" stroke-linecap="round"/><ellipse cx="0" cy="2" rx="15" ry="8" fill="#e8590c" stroke="#7a2f06" stroke-width="1.2"/><circle cx="0" cy="0" r="7" fill="#e8590c" stroke="#7a2f06" stroke-width="1.2"/><path d="M-5 -4 Q0 -11 5 -4z" fill="#c2410c"/></g>
<text x="46" y="372" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">stern arc</text>
<text x="354" y="372" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">bow arc</text>
<rect x="37.8" y="508.0" width="112.2" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="93.887" y="527" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">stern shooter</text>
<line x1="164" y1="456" x2="130" y2="508" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="164" cy="456" r="2.6" fill="#2f3a2b"/>
<rect x="252.0" y="508.0" width="105.8" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="304.903" y="527" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">bow shooter</text>
<line x1="240" y1="456" x2="272" y2="508" stroke="#2f3a2b" stroke-width="1.4"/><circle cx="240" cy="456" r="2.6" fill="#2f3a2b"/>
<g data-tip="Never toward your partner|Never shoot toward your partner. Only one person moves at a time. Unload before anyone changes seats."><rect x="157.4" y="362.0" width="85.3" height="27.0" rx="5" fill="#fffaf0" stroke="#6b5b4b" stroke-width="1.2"/>
<text x="200" y="381" font-size="15" font-weight="bold" fill="#c92a2a" text-anchor="middle">NO SHOT</text>
<line x1="202" y1="438" x2="200" y2="389" stroke="#c92a2a" stroke-width="1.4"/><circle cx="202" cy="438" r="2.6" fill="#c92a2a"/></g>
<g data-tip="Loaded in a boat|From 1 October 2026, a BC hunting exemption allows a loaded firearm in a boat with no motor, or while the motor is not moving the boat."><text x="200" y="570" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Sit to shoot. Never swing past</text>
<text x="200" y="591" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">your partner. Motor off, anchored.</text></g>
</svg>
