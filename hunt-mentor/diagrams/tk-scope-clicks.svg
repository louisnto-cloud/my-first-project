<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 328" font-family="sans-serif" role="img" aria-label="Scope click math at 100 metres. The 3 shot group, number 1, is 3.7 cm high and 2.9 cm right. With quarter minute of angle clicks, about 0.73 cm each: down 3.7 divided by 0.73 is 5 clicks, left 2.9 divided by 0.73 is 4 clicks. Read your own turret cap: some scopes use 0.1 milliradian clicks.">
<rect x="0" y="0" width="400" height="328" fill="#EEF1EA"/>
<text x="200" y="26" font-size="18" fill="#1F3D2B" text-anchor="middle" font-weight="bold">Scope clicks: 1/4 MOA</text><rect x="20" y="44" width="200" height="200" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><circle cx="120" cy="144" r="90" fill="none" stroke="#8F9A8C" stroke-width="1.5"/><circle cx="120" cy="144" r="60" fill="none" stroke="#8F9A8C" stroke-width="1.5"/><circle cx="120" cy="144" r="30" fill="none" stroke="#8F9A8C" stroke-width="1.5"/><line x1="20" y1="144" x2="220" y2="144" stroke="#8F9A8C"/><line x1="120" y1="44" x2="120" y2="244" stroke="#8F9A8C"/><circle cx="156" cy="101" r="4" fill="#1F3D2B"/><circle cx="164" cy="106" r="4" fill="#1F3D2B"/><circle cx="160" cy="110" r="4" fill="#1F3D2B"/><line x1="160" y1="116" x2="160.0" y2="134.8" stroke="#FF6A13" stroke-width="2.5" stroke-linecap="round"/><path d="M160 142 L156.1 133.9 L163.9 133.9z" fill="#FF6A13"/><line x1="152" y1="104" x2="131.2" y2="104.0" stroke="#FF6A13" stroke-width="2.5" stroke-linecap="round"/><path d="M124 104 L132.1 100.1 L132.1 107.9z" fill="#FF6A13"/><circle cx="186" cy="84" r="11" fill="#FF6A13" stroke="#FFFFFF" stroke-width="1.5"/><text x="186" y="89" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="232" y="70" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">Group centre:</text><text x="232" y="90" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">3.7 cm high</text><text x="232" y="110" font-size="15" fill="#1F3D2B" text-anchor="start" font-weight="bold">2.9 cm right</text><text x="232" y="140" font-size="14" fill="#17201A" text-anchor="start">Down: 3.7 / 0.73</text><text x="232" y="160" font-size="14" fill="#17201A" text-anchor="start">= 5 clicks</text><text x="232" y="180" font-size="14" fill="#17201A" text-anchor="start">Left: 2.9 / 0.73</text><text x="232" y="200" font-size="14" fill="#17201A" text-anchor="start">= 4 clicks</text><rect x="12" y="256" width="376" height="60" rx="8" fill="#DCE3D6" stroke="#1F3D2B" stroke-width="1.5"/><text x="24" y="280" font-size="14" fill="#17201A" text-anchor="start">1/4 MOA click = about 0.73 cm at 100 m.</text><text x="24" y="300" font-size="14" fill="#17201A" text-anchor="start">Read YOUR turret cap: some are 0.1 mil.</text>
</svg>
