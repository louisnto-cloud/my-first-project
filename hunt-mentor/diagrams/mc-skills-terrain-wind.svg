<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four tiles of how terrain bends wind. Lee of a crest: wind tumbles back uphill just behind a ridge top. Saddle: wind squeezes through the low gap and speeds up. Junction: where draws meet, wind swirls. Shaded timber: two layers, warm air rising above the canopy while a thin cool layer still slides downhill on the forest floor.">
<rect width="400" height="300" fill="#fffaf0"/>
