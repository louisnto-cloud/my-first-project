="248.2" width="4.199999999999999" height="9.799999999999999" fill="#6b4f35"/><path d="M228 217.4 L216.8 249.6 L239.2 249.6 Z" fill="#8a9a6b"/><rect x="255.9" y="248.2" width="4.199999999999999" height="9.799999999999999" fill="#6b4f35"/><path d="M258 217.4 L246.8 249.6 L269.2 249.6 Z" fill="#8a9a6b"/><rect x="285.9" y="248.2" width="4.199999999999999" height="9.799999999999999" fill="#6b4f35"/><path d="M288 217.4 L276.8 249.6 L299.2 249.6 Z" fill="#8a9a6b"/><rect x="315.9" y="248.2" width="4.199999999999999" height="9.799999999999999" fill="#6b4f35"/><path d="M318 217.4 L306.8 249.6 L329.2 249.6 Z" fill="#8a9a6b"/><rect x="345.9" y="248.2" width="4.199999999999999" height="9.799999999999999" fill="#6b4f35"/><path d="M348 217.4 L336.8 249.6 L359.2 249.6 Z" fill="#8a9a6b"/><line x1="234" y1="206" x2="354" y2="198" stroke="#e8590c" stroke-width="2"/><polygon points="354.0,198.0 345.3,202.9 344.7,194.3" fill="#e8590c"/><line x1="354" y1="254" x2="234" y2="260" stroke="#4a7fb0" stroke-width="2"/><polygon points="234.0,260.0 242.8,255.2 243.2,263.9" fill="#4a7fb0"/><text x="295" y="186" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Shaded timber</text><text x="295" y="276" font-size="14" fill="#23261f" text-anchor="middle">two layers</text>
