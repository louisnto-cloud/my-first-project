<text x="80" y="214" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">certified to remove pathogens (95%)</text>
<rect x="10" y="232" width="380" height="56" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<text x="42.0" y="264" font-family="sans-serif" font-size="22" font-weight="bold" fill="#2f3a2b" text-anchor="middle">→</text>
<text x="80" y="254" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Full lesson</text>
<text x="80" y="276" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Water: finding it and making it safe</text>
