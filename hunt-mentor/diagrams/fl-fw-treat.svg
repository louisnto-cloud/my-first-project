<text x="80" y="68" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Boil 1 minute</text>
<text x="80" y="90" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">2 minutes above 2,000 m (95%)</text>
<rect x="10" y="108" width="380" height="56" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<path d="M42.0 129.6 q9.6 12.0 8.4 18.0 a8.4 8.4 0 0 1 -16.8 0 q-1.2 -6.0 8.4 -18.0 z" fill="#cfe0ef" stroke="#cfe0ef" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Bleach: 2 drops per litre</text>
<text x="80" y="152" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">wait 30 min; cold or cloudy: double (95%)</text>
<rect x="10" y="170" width="380" height="56" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
