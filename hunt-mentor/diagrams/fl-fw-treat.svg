<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 298" role="img" aria-label="Treat all stream water: boil at least 1 minute, 2 minutes above 2,000 m; or 2 drops of household bleach per litre and wait 30 minutes, double for cloudy or cold water; or a filter certified to remove pathogens.">
  <rect x="0" y="0" width="400" height="298" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Treat every stream (HealthLink BC)</text>
