<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="How to read a goose after the shot. Folds and falls hard: dead or down, mark it and fetch it. Legs drop and head comes up: hit, watch it down. Sails and glides off: hit, mark where it lands. Flies on strong: probably a miss, watch anyway. Wounded birds must be killed and retrieved as soon as you can, 99 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">After the shot: read the bird</text><rect x="12" y="42" width="376" height="46" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="2"/><rect x="12" y="42" width="10" height="46" rx="4" fill="#2e7d32"/><text x="32" y="62" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="start">Folds, falls hard</text><text x="32" y="80" font-size="14" fill="#23261f" text-anchor="start">Dead or down. Mark it, fetch it</text><rect x="12" y="96" width="376" height="46" rx="8" fill="#fff" stroke="#e8590c" stroke-width="2"/><rect x="12" y="96" width="10" height="46" rx="4" fill="#e8590c"/><text x="32" y="116" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="start">Legs drop, head up</text><text x="32" y="134" font-size="14" fill="#23261f" text-anchor="start">Hit. Watch it down</text><rect x="12" y="150" width="376" height="46" rx="8" fill="#fff" stroke="#e8590c" stroke-width="2"/><rect x="12" y="150" width="10" height="46" rx="4" fill="#e8590c"/><text x="32" y="170" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="start">Sails, glides off</text><text x="32" y="188" font-size="14" fill="#23261f" text-anchor="start">Hit. Mark where it lands</text><rect x="12" y="204" width="376" height="46" rx="8" fill="#fff" stroke="#4a7fb0" stroke-width="2"/><rect x="12" y="204" width="10" height="46" rx="4" fill="#4a7fb0"/><text x="32" y="224" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="start">Flies on strong</text><text x="32" y="242" font-size="14" fill="#23261f" text-anchor="start">Probably a miss. Watch anyway</text><rect x="12" y="262" width="376" height="32" rx="8" fill="#2f3a2b"/><text x="200" y="283" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Kill and fetch wounded birds as soon as you can (99%)</text>
</svg>
