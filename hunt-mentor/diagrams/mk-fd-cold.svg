<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 363" font-family="sans-serif" role="img" aria-label="Cold weather. Carcass freezes outside first: Open it, prop it, get heat out (Tip). Long drag: Hide on (80%). Snow around: Bagged snow in the cavity (80%). Overnight: Hang high or take it home (Tip).">
<rect width="400" height="363" rx="12" fill="#EEF1EA"/>
<text x="16" y="30" font-size="18" font-weight="bold" fill="#1F3D2B">Cold weather</text>
<text x="22" y="58" font-size="14" font-weight="bold" fill="#1F3D2B">Below freezing</text><text x="180" y="58" font-size="14" font-weight="bold" fill="#1F3D2B">Do this</text>
<g><rect x="12" y="68" width="376" height="78" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="3"/><rect x="12" y="68" width="158" height="78" rx="8" fill="#FF6A13"/><rect x="162" y="68" width="8" height="78" fill="#FF6A13"/><text x="22" y="90" font-size="15" font-weight="bold" fill="#17201A">Carcass freezes</text>
<text x="22" y="109" font-size="15" font-weight="bold" fill="#17201A">outside first</text><text x="180" y="90" font-size="15" fill="#17201A">Open it, prop it, get</text>
<text x="180" y="109" font-size="15" fill="#17201A">heat out</text><text x="180" y="130" font-size="14" fill="#1F3D2B">Tip</text></g>
<g><rect x="12" y="154" width="376" height="59" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><rect x="12" y="154" width="158" height="59" rx="8" fill="#1F3D2B"/><rect x="162" y="154" width="8" height="59" fill="#1F3D2B"/><text x="22" y="176" font-size="15" font-weight="bold" fill="#FFFFFF">Long drag</text><text x="180" y="176" font-size="15" fill="#17201A">Hide on</text><text x="180" y="197" font-size="14" fill="#1F3D2B">80%</text></g>
<g><rect x="12" y="221" width="376" height="59" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><rect x="12" y="221" width="158" height="59" rx="8" fill="#1F3D2B"/><rect x="162" y="221" width="8" height="59" fill="#1F3D2B"/><text x="22" y="243" font-size="15" font-weight="bold" fill="#FFFFFF">Snow around</text><text x="180" y="243" font-size="15" fill="#17201A">Bagged snow in the cavity</text><text x="180" y="264" font-size="14" fill="#1F3D2B">80%</text></g>
<g><rect x="12" y="288" width="376" height="59" rx="8" fill="#FFFFFF" stroke="#C9D3C4" stroke-width="1"/><rect x="12" y="288" width="158" height="59" rx="8" fill="#1F3D2B"/><rect x="162" y="288" width="8" height="59" fill="#1F3D2B"/><text x="22" y="310" font-size="15" font-weight="bold" fill="#FFFFFF">Overnight</text><text x="180" y="310" font-size="15" fill="#17201A">Hang high or take it home</text><text x="180" y="331" font-size="14" fill="#1F3D2B">Tip</text></g>

</svg>
