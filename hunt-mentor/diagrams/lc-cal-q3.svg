<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 264" font-family="sans-serif" role="img" aria-label="July and August cards. July: LEH results are posted in WILD, nothing is mailed; practise shooting from field positions. August: buy species licences in person, carry the federal bird permit for ducks and geese, build the pack.">
<rect x="0" y="0" width="400" height="264" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">July and August</text><rect x="10.0" y="42" width="186.0" height="210" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><rect x="10.0" y="42" width="186.0" height="30" rx="10" fill="#2f3a2b"/><text x="103.0" y="63" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Jul</text><g transform="translate(103.0 100) scale(1.0)"><rect x="-10" y="-18" width="20" height="36" rx="4" fill="#2f3a2b"/><rect x="-7" y="-13" width="14" height="24" fill="#dbe7f2"/><circle cx="0" cy="14" r="1.8" fill="#fff"/></g><text x="103.0" y="140" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">LEH results in WILD,</text><text x="103.0" y="157" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">not mailed</text><text x="103.0" y="180" font-size="14" fill="#55663f" text-anchor="middle">Shoot field positions</text><rect x="204.0" y="42" width="186.0" height="210" rx="10" fill="#fff" stroke="#2f3a2b" stroke-width="2"/><rect x="204.0" y="42" width="186.0" height="30" rx="10" fill="#2f3a2b"/><text x="297.0" y="63" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Aug</text><g transform="translate(297.0 100) scale(1.0)"><rect x="-14" y="-16" width="28" height="34" rx="6" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-9" y="2" width="18" height="10" rx="3" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="297.0" y="140" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">Buy species licences in</text><text x="297.0" y="157" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">person</text><text x="297.0" y="180" font-size="14" fill="#23261f" text-anchor="middle">Bird permit for ducks</text><text x="297.0" y="203" font-size="14" fill="#55663f" text-anchor="middle">Build the pack</text>
</svg>
