<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Calendar bars, October to December. White tailed deer rut peaks in November. Mule deer rut runs mid November to mid December. Opening day pressure pushes deer to thick cover within about 48 hours.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <g fill="#dfe6d3"><rect x="100" y="40" width="96" height="190"/><rect x="292" y="40" width="96" height="190"/></g>
  <g font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle"><text x="148" y="32">Oct</text><text x="244" y="32">Nov</text><text x="340" y="32">Dec</text></g>
  <g font-size="14" fill="#2f3a2b"><text x="8" y="80" font-weight="bold">Whitetail</text><text x="8" y="96">rut peak</text><text x="8" y="146" font-weight="bold">Mule deer</text><text x="8" y="162">rut</text><text x="8" y="206" font-weight="bold">Hunters</text><text x="8" y="222">push</text></g>
  <rect x="196" y="72" width="96" height="26" rx="4" fill="#8a9a6b"/>
  <text x="244" y="90" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">November</text>
  <rect x="244" y="138" width="96" height="26" rx="4" fill="#e8590c"/>
  <text x="292" y="156" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">mid to mid</text>
  <polygon points="104,214 104,190 120,202" fill="#c0392b"/>
  <text x="126" y="208" font-size="14" font-weight="bold" fill="#c0392b">opener: thick cover, night,</text>
  <text x="126" y="224" font-size="14" font-weight="bold" fill="#c0392b">within about 48 h (65%)</text>
  <text x="200" y="262" font-size="14" fill="#2f3a2b" text-anchor="middle">Rut timing 80%. In the rut, bucks move</text>
  <text x="200" y="280" font-size="14" fill="#2f3a2b" text-anchor="middle">more and in daylight (75%)</text>
</svg>
