<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side view of pass shooting, drawn to scale for height. Geese fly a line from the roost water to the feeding field. You hide in cover under the flight line between the roost and the field. Geese at about 50 metres are too high: let them pass, a Tip. A goose at about 25 metres is in range: under 30 metres, a Tip.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="27" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pass shooting: only the low birds</text>
