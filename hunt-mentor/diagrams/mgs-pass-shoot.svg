<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side view of pass shooting. You hide in cover under the flight line between the roost and the field. Geese at about 50 metres are too high: let them pass, a Tip. A goose at about 25 metres is in range: under 30 metres, a Tip.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pass shooting: only the low birds</text><rect x="0" y="240" width="400" height="60" rx="0" fill="#dfe6d3"/><ellipse cx="40" cy="250" rx="50" ry="14" fill="#9fc3e0"/><text x="40" y="280" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Roost</text><rect x="320" y="236" width="80" height="14" rx="0" fill="#d9c48f"/><text x="360" y="280" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Field</text><g transform="translate(150 70) scale(0.6 0.6)"><ellipse cx="0" cy="0" rx="20" ry="7" fill="#2f3a2b"/><path d="M16 -2 L36 -4 L36 1 L16 3Z" fill="#2f3a2b"/><ellipse cx="40" cy="-2" rx="6" ry="4" fill="#2f3a2b"/><path d="M45 -3 L51 -1 L45 1Z" fill="#2f3a2b"/><path d="M-8 -3 L6 -30 L12 -3Z" fill="#2f3a2b"/><path d="M-20 0 L-28 -3 L-28 3Z" fill="#2f3a2b"/></g><g transform="translate(180 64) scale(0.55 0.55)"><ellipse cx="0" cy="0" rx="20" ry="7" fill="#2f3a2b"/><path d="M16 -2 L36 -4 L36 1 L16 3Z" fill="#2f3a2b"/><ellipse cx="40" cy="-2" rx="6" ry="4" fill="#2f3a2b"/><path d="M45 -3 L51 -1 L45 1Z" fill="#2f3a2b"/><path d="M-8 -3 L6 -30 L12 -3Z" fill="#2f3a2b"/><path d="M-20 0 L-28 -3 L-28 3Z" fill="#2f3a2b"/></g><path fill="none" d="M229.0 59.0 l22 22 M251.0 59.0 l-22 22" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/><g transform="translate(170 170) scale(0.7 0.7)"><ellipse cx="0" cy="0" rx="20" ry="7" fill="#2f3a2b"/><path d="M16 -2 L36 -4 L36 1 L16 3Z" fill="#2f3a2b"/><ellipse cx="40" cy="-2" rx="6" ry="4" fill="#2f3a2b"/><path d="M45 -3 L51 -1 L45 1Z" fill="#2f3a2b"/><path d="M-8 -3 L6 -30 L12 -3Z" fill="#2f3a2b"/><path d="M-20 0 L-28 -3 L-28 3Z" fill="#2f3a2b"/></g><path d="M229.0 170 l7.333333333333333 7.333333333333333 l13.2 -15.399999999999999" stroke="#2e7d32" stroke-width="4" fill="none" stroke-linecap="round"/><line x1="200" y1="60" x2="200" y2="240" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="4 4"/><text x="208" y="120" font-size="14" fill="#23261f" text-anchor="start">50 m</text><text x="208" y="205" font-size="14" fill="#23261f" text-anchor="start">25 m</text><rect x="180" y="232" width="40" height="14" rx="4" fill="#6d8b4a"/><circle cx="200" cy="236" r="6" fill="#e8590c"/><text x="200" y="264" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">You, in cover</text><text x="300" y="110" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Too high: let</text><text x="300" y="128" font-size="14" fill="#c0392b" text-anchor="middle">them pass (Tip)</text><text x="300" y="190" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">Low: in range</text><text x="300" y="208" font-size="14" fill="#2e7d32" text-anchor="middle">under 30 m (Tip)</text>
</svg>
