<text x="327" y="163.5" font-size="16" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Low: in range</text>
<text x="327" y="181" font-size="15" fill="#2f6e3b" text-anchor="middle">under 30 m (Tip)</text>
