<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Side view cutaway of a grouse facing right. The crop sits at the base of the neck. The heart sits low and forward in the chest. The lungs sit high against the back. Air sacs fill much of the body behind the lungs. The gizzard sits in the middle of the belly, and the two long ceca run toward the tail. The big breast muscle sits along the keel bone underneath." font-family="sans-serif">
