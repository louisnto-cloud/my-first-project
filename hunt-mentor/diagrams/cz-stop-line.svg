<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 334" font-family="sans-serif" role="img" aria-label="The stop line for the CZ 457. You: magazine out, bolt out, clean, check the stock screws at 3.5 newton metres, set the trigger screws as the manual shows. A gunsmith: stripping the bolt, striker and spring, trigger repair, taking the barrel off, bolt cleaning after many rounds, and any rifle that was dropped or rusted. CZ: do not strip your firearm any further."><rect x="0" y="0" width="400" height="334" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Where you stop</text><rect x="14" y="44" width="372" height="110" rx="10" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="30" y="72" font-size="17" font-weight="bold" text-anchor="start" fill="#1F3D2B">You do this</text><text x="30" y="98" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Magazine out. Bolt out. Clean.</text><text x="30" y="120" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Check stock screws, 3.5 Nm.</text><text x="30" y="142" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Trigger set screws, per manual.</text><rect x="14" y="166" width="372" height="132" rx="10" fill="#FFFFFF" stroke="#FF6A13" stroke-width="2"/><text x="30" y="194" font-size="17" font-weight="bold" text-anchor="start" fill="#FF6A13">Gunsmith does this</text><text x="30" y="220" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Strip the bolt: striker, spring.</text><text x="30" y="242" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Trigger group repair. Barrel off.</text><text x="30" y="264" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Bolt cleaning after many rounds.</text><text x="30" y="286" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Anything dropped or rusted.</text><text x="16" y="322" font-size="14" font-weight="normal" text-anchor="start" fill="#17201A">CZ: &quot;Do not strip your firearm any further.&quot;</text></svg>
