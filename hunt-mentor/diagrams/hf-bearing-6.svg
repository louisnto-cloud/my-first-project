<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 6, the back bearing. Walking out from the truck to the saddle on a bearing of 40, the way home is the opposite direction, 220. Under 180 add 180. Over 180 subtract 180.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="40" font-size="16" font-weight="bold" fill="#e8590c">Step 6: back bearing home</text>
<path d="M226 98 L262 52 L286 80 L304 70 L336 98z" fill="#8a9a6b"/><path d="M254 62 L262 52 L270 62z" fill="#fffaf0"/>
<text x="296" y="118" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Saddle</text>
<g transform="translate(66 236) scale(.9)"><path d="M-40 -8 V-22 H2 V-34 C2 -36 4 -37 6 -37 H22 C25 -37 27 -36 28 -33 L33 -22 H38 C40 -22 41 -21 41 -19 V-8z" fill="#3d5a80"/><path d="M8 -33 H21 C22 -33 23 -32 24 -31 L28 -23 H8z" fill="#c9d6e0"/><circle cx="-26" cy="-6" r="8.5" fill="#2b2b2b"/><circle cx="-26" cy="-6" r="3.6" fill="#a8a8a8"/><circle cx="25" cy="-6" r="8.5" fill="#2b2b2b"/><circle cx="25" cy="-6" r="3.6" fill="#a8a8a8"/></g>
<text x="66" y="262" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Truck</text>
<path d="M98 208 L244 104" stroke="#e8590c" stroke-width="4"/><path d="M252.0 98.0 L236.1 99.7 L244.9 112.3z" fill="#e8590c"/>
<path d="M236 132 L118 218" stroke="#4a7fb0" stroke-width="4" stroke-dasharray="9 6"/><path d="M110.0 224.0 L125.9 222.0 L116.8 209.5z" fill="#4a7fb0"/>
<text x="104" y="142" font-size="20" font-weight="bold" fill="#c2410c">Out: 40</text>
<text x="196" y="196" font-size="20" font-weight="bold" fill="#2c5d86">Home: 220</text>
<rect x="196" y="222" width="196" height="66" rx="8" fill="#2f3a2b"/>
<text x="294" y="249" font-size="16" fill="#ffffff" text-anchor="middle">Under 180: add 180</text>
<text x="294" y="274" font-size="16" fill="#ffffff" text-anchor="middle">Over 180: take off 180</text>
</svg>
