<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three deer reactions to a hit. A mule kick with the hind legs, then a hard low run: often heart or lungs. A hunched back, a short run, then a walk: often a gut hit. A hard run with a limp: often a leg hit.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">How it reacts to the hit (Tip)</text><g transform="translate(70 76) scale(.42)"><g><g stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"><path d="M-60 -14 L-92 -60 L-74 -70 L-40 -24 Z" fill="#8a9a6b"/><ellipse cx="0" cy="0" rx="80" ry="32" fill="#8a9a6b"/><ellipse cx="-98" cy="-62" rx="19" ry="10" fill="#8a9a6b"/><path d="M-84 -70 L-74 -86 L-76 -66 Z" fill="#8a9a6b"/><path d="M78 -12 L92 -18 L88 -2 Z" fill="#fff"/></g><circle cx="-106" cy="-64" r="2" fill="#23261f"/></g><g stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"><rect x="-58" y="18" width="11" height="62" rx="4" fill="#8a9a6b"/><rect x="-48" y="18" width="11" height="62" rx="4" fill="#8a9a6b"/><rect x="50" y="10" width="11" height="64" rx="4" fill="#8a9a6b" transform="rotate(60 55 14)"/><rect x="60" y="10" width="11" height="64" rx="4" fill="#8a9a6b" transform="rotate(48 65 14)"/></g></g><text x="140" y="72" font-size="15" font-weight="bold" fill="#23261f">Mule kick, hard low run</text><text x="140" y="92" font-size="15" fill="#e8590c">Often heart or lungs</text><g transform="translate(70 156) scale(.42)"><g stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"><rect x="-58" y="18" width="11" height="62" rx="4" fill="#8a9a6b"/><rect x="-48" y="18" width="11" height="62" rx="4" fill="#8a9a6b"/><rect x="46" y="16" width="11" height="64" rx="4" fill="#8a9a6b"/><rect x="58" y="16" width="11" height="64" rx="4" fill="#8a9a6b"/><path d="M-60 -14 L-92 -60 L-74 -70 L-40 -24 Z" fill="#8a9a6b"/><ellipse cx="0" cy="0" rx="80" ry="32" fill="#8a9a6b"/><ellipse cx="-98" cy="-62" rx="19" ry="10" fill="#8a9a6b"/><path d="M-84 -70 L-74 -86 L-76 -66 Z" fill="#8a9a6b"/><path d="M78 -12 L92 -18 L88 -2 Z" fill="#fff"/></g><circle cx="-106" cy="-64" r="2" fill="#23261f"/><path d="M-50 -22 Q 0 -66 52 -22 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/></g><text x="140" y="152" font-size="15" font-weight="bold" fill="#23261f">Hunched back, short run, walks</text><text x="140" y="172" font-size="15" fill="#e8590c">Often gut</text><g transform="translate(70 236) scale(.42)"><g stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"><path d="M-60 -14 L-92 -60 L-74 -70 L-40 -24 Z" fill="#8a9a6b"/><ellipse cx="0" cy="0" rx="80" ry="32" fill="#8a9a6b"/><ellipse cx="-98" cy="-62" rx="19" ry="10" fill="#8a9a6b"/><path d="M-84 -70 L-74 -86 L-76 -66 Z" fill="#8a9a6b"/><path d="M78 -12 L92 -18 L88 -2 Z" fill="#fff"/></g><circle cx="-106" cy="-64" r="2" fill="#23261f"/><g stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"><rect x="-58" y="18" width="11" height="62" rx="4" fill="#8a9a6b"/><rect x="-48" y="18" width="11" height="34" rx="4" fill="#8a9a6b" transform="rotate(-40 -42 20)"/><rect x="46" y="16" width="11" height="64" rx="4" fill="#8a9a6b"/><rect x="58" y="16" width="11" height="64" rx="4" fill="#8a9a6b"/></g></g><text x="140" y="232" font-size="15" font-weight="bold" fill="#23261f">Runs hard with a limp</text><text x="140" y="252" font-size="15" fill="#e8590c">Often a leg</text>
</svg>
