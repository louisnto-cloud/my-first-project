<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="sans-serif" role="img" aria-label="How a deer often reacts to the hit, Tip. Mule kick and a hard low run: often heart or lungs. Hunched back, short run, then a walk: often gut. Hard run with a limp: often a leg. Drops on the spot: spine or brain, it may get up, be ready. Some animals show little or no reaction. Then mark where it stood and note the time.">
<rect width="400" height="470" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#23261f" text-anchor="middle">How it reacts to the hit (70%)</text>
<g data-tip="Mule kick, hard low run|Often heart or lungs (70%, National Deer Association and hunter education).">
<rect x="8" y="44" width="384" height="74" rx="10" fill="#f4eedf" stroke="#d8cfbc"/>
<circle cx="26" cy="64" r="11" fill="#2f3a2b"/><text x="26" y="69" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">1</text>
<line x1="40" y1="108" x2="150" y2="108" stroke="#cdbf9f" stroke-width="2"/>
<g transform="translate(94 72) scale(0.9)"><g transform="rotate(8)"><path d="M-22 8 L-24 24 L-22 36" fill="none" stroke="#8b6a48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 8 L-12 24 L-14 36" fill="none" stroke="#8b6a48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 6 L44 0 L62 -6" fill="none" stroke="#8b6a48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 4 L50 8 L66 4" fill="none" stroke="#8b6a48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-30 -10 C-20 -16 10 -17 28 -12 C38 -9 40 0 36 8 C30 14 -20 14 -30 8 C-36 4 -36 -6 -30 -10z" fill="#8b6a48" stroke="#5a3e26" stroke-width="1.5"/><path d="M36 -8 C42 -6 42 2 38 4z" fill="#f3ead8"/><path d="M-28 -6 L-34 -16 L-40 -20 C-48 -20 -54 -16 -54 -12 L-40 -8 L-34 0z" fill="#8b6a48" stroke="#5a3e26" stroke-width="1.5"/><path d="M-38 -20 L-34 -30 L-32 -19z" fill="#8b6a48" stroke="#5a3e26" stroke-width="1.2"/><circle cx="-44" cy="-16" r="1.6" fill="#111"/></g></g>
<text x="166" y="76" font-size="16" font-weight="bold" fill="#23261f">Mule kick, hard low run</text>
<text x="166" y="100" font-size="16" fill="#c2410c" font-weight="bold">often heart or lungs</text>
</g>
<g data-tip="Hunched back, short run, then a walk|Often a gut hit (70%). Expect the longest wait before you follow.">
<rect x="8" y="126" width="384" height="74" rx="10" fill="#fffaf0" stroke="#d8cfbc"/>
<circle cx="26" cy="146" r="11" fill="#2f3a2b"/><text x="26" y="151" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">2</text>
<line x1="40" y1="190" x2="150" y2="190" stroke="#cdbf9f" stroke-width="2"/>
<g transform="translate(94 154) scale(0.9)"><path d="M-20 8 L-16 24 L-14 36" fill="none" stroke="#8b6a48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12 8 L-8 24 L-6 36" fill="none" stroke="#8b6a48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 8 L14 24 L12 36" fill="none" stroke="#8b6a48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 8 L22 24 L20 36" fill="none" stroke="#8b6a48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-30 -10 C-20 -26 10 -27 28 -12 C38 -9 40 0 36 8 C30 14 -20 14 -30 8 C-36 4 -36 -6 -30 -10z" fill="#8b6a48" stroke="#5a3e26" stroke-width="1.5"/><path d="M36 -8 C42 -6 42 2 38 4z" fill="#f3ead8"/><path d="M-28 -6 L-32 -8 L-38 -12 C-46 -12 -52 -8 -52 -4 L-38 0 L-34 0z" fill="#8b6a48" stroke="#5a3e26" stroke-width="1.5"/><path d="M-36 -12 L-32 -22 L-30 -11z" fill="#8b6a48" stroke="#5a3e26" stroke-width="1.2"/><circle cx="-42" cy="-8" r="1.6" fill="#111"/></g>
<text x="166" y="152" font-size="16" font-weight="bold" fill="#23261f">Hunched back, short run,</text>
<text x="166" y="170" font-size="16" font-weight="bold" fill="#23261f">then a walk</text>
<text x="166" y="190" font-size="16" fill="#c2410c" font-weight="bold">often gut</text>
</g>
<g data-tip="Hard run with a limp|Often a leg hit (70%).">
<rect x="8" y="208" width="384" height="74" rx="10" fill="#f4eedf" stroke="#d8cfbc"/>
<circle cx="26" cy="228" r="11" fill="#2f3a2b"/><text x="26" y="233" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">3</text>
<line x1="40" y1="272" x2="150" y2="272" stroke="#cdbf9f" stroke-width="2"/>
<g transform="translate(94 236) scale(0.9)"><path d="M-22 8 L-36 20 L-46 26" fill="none" stroke="#8b6a48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 8 L-14 22 L-8 30" fill="none" stroke="#8b6a48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 8 L36 20 L48 30" fill="none" stroke="#8b6a48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 6 L40 16 L54 20" fill="none" stroke="#8b6a48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-30 -10 C-20 -16 10 -17 28 -12 C38 -9 40 0 36 8 C30 14 -20 14 -30 8 C-36 4 -36 -6 -30 -10z" fill="#8b6a48" stroke="#5a3e26" stroke-width="1.5"/><path d="M36 -8 C42 -6 42 2 38 4z" fill="#f3ead8"/><path d="M-28 -6 L-40 -28 L-46 -32 C-54 -32 -60 -28 -60 -24 L-46 -20 L-34 0z" fill="#8b6a48" stroke="#5a3e26" stroke-width="1.5"/><path d="M-44 -32 L-40 -42 L-38 -31z" fill="#8b6a48" stroke="#5a3e26" stroke-width="1.2"/><circle cx="-50" cy="-28" r="1.6" fill="#111"/></g>
<text x="166" y="240" font-size="16" font-weight="bold" fill="#23261f">Hard run with a limp</text>
<text x="166" y="264" font-size="16" fill="#c2410c" font-weight="bold">often a leg</text>
</g>
<g data-tip="Drops on the spot|Spine or brain; it may get up. Be ready (Tip).">
<rect x="8" y="290" width="384" height="74" rx="10" fill="#fffaf0" stroke="#d8cfbc"/>
<circle cx="26" cy="310" r="11" fill="#2f3a2b"/><text x="26" y="315" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">4</text>
<line x1="40" y1="354" x2="150" y2="354" stroke="#cdbf9f" stroke-width="2"/>
<g transform="translate(98 340) scale(0.95)"><path d="M-30 -10 C-20 -16 10 -17 28 -12 C38 -9 40 0 36 8 C30 14 -20 14 -30 8 C-36 4 -36 -6 -30 -10z" fill="#8b6a48" stroke="#5a3e26" stroke-width="1.5"/><path d="M36 -8 C42 -6 42 2 38 4z" fill="#f3ead8"/><path d="M-28 -6 L-38 -20 L-44 -24 C-52 -24 -58 -20 -58 -16 L-44 -12 L-34 0z" fill="#8b6a48" stroke="#5a3e26" stroke-width="1.5"/><path d="M-42 -24 L-38 -34 L-36 -23z" fill="#8b6a48" stroke="#5a3e26" stroke-width="1.2"/><circle cx="-48" cy="-20" r="1.6" fill="#111"/><path d="M-26 12 L-6 14 M10 14 L32 12" stroke="#5a3e26" stroke-width="5" stroke-linecap="round"/></g>
<text x="166" y="322" font-size="16" font-weight="bold" fill="#23261f">Drops on the spot</text>
<text x="166" y="346" font-size="16" fill="#c2410c" font-weight="bold">may get up. Be ready</text>
</g>
<g data-tip="Little or no reaction|Some animals show little or no reaction to a well placed shot (70%, hunter education). A moose often walks a few steps and stands: stay on it and be ready (Tip).">
<rect x="8" y="374" width="384" height="40" rx="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="1.5"/>
<text x="200" y="400" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Some show little or no reaction</text>
</g>
<g data-tip="Then mark it|Drop a phone pin where you shot from and where it stood, and note the time (Tip). Flag where it stood before you move (85%).">
<rect x="8" y="422" width="384" height="40" rx="10" fill="#2f3a2b"/>
<text x="200" y="448" font-size="16" font-weight="bold" fill="#fffaf0" text-anchor="middle">Then: mark the spot, note the time</text>
</g>
</svg>
