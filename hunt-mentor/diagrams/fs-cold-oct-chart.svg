<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of Kamloops Airport averages, 1991 to 2020: October high 13.6 degrees Celsius, October low 3.5, November high 5.8, November low minus 1.1. Up the hill it is colder.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Kamloops: October to November</text><line x1="40" y1="200" x2="380" y2="200" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><rect x="60" y="118" width="56" height="82" rx="3" fill="#e8590c"/><text x="88" y="110" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">13.6 °C</text><text x="88" y="238" font-size="14" fill="#2f3a2b" text-anchor="middle">Oct high</text><rect x="142" y="179" width="56" height="21" rx="3" fill="#4a7fb0"/><text x="170" y="171" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3.5 °C</text><text x="170" y="238" font-size="14" fill="#2f3a2b" text-anchor="middle">Oct low</text><rect x="224" y="165" width="56" height="35" rx="3" fill="#e8590c"/><text x="252" y="157" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">5.8 °C</text><text x="252" y="238" font-size="14" fill="#2f3a2b" text-anchor="middle">Nov high</text><rect x="306" y="200" width="56" height="7" rx="3" fill="#4a7fb0"/><text x="334" y="192" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">-1.1 °C</text><text x="334" y="238" font-size="14" fill="#2f3a2b" text-anchor="middle">Nov low</text><text x="200" y="270" font-size="14" fill="#2f3a2b" text-anchor="middle">Averages, Kamloops Airport, 1991 to 2020</text><text x="200" y="290" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Up the hill it is colder</text>
</svg>
