<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" font-family="sans-serif" role="img" aria-label="Age ladder. Minutes: warm bed, wet scat, mud still oozing. Hours: crisp walls, dew knocked off. Today: edges sharp, scat dull but soft. Days: walls rounded, browse ends grey. A week or more: debris, spider web and mould inside. Give a range, never a minute.">
<rect x="0" y="0" width="400" height="310" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The age ladder</text>
<rect x="16" y="62" width="110" height="38" rx="8" fill="#b3261e"/><text x="71" y="87" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Minutes</text><text x="140" y="87" font-size="14" fill="#23261f" text-anchor="start">warm bed, wet scat, mud still oozing</text><rect x="16" y="108" width="110" height="38" rx="8" fill="#e8590c"/><text x="71" y="133" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Hours</text><text x="140" y="133" font-size="14" fill="#23261f" text-anchor="start">crisp walls, dew knocked off</text><rect x="16" y="154" width="110" height="38" rx="8" fill="#c98a1b"/><text x="71" y="179" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Today</text><text x="140" y="179" font-size="14" fill="#23261f" text-anchor="start">edges sharp, scat dull but soft</text><rect x="16" y="200" width="110" height="38" rx="8" fill="#8a9a6b"/><text x="71" y="225" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Days</text><text x="140" y="225" font-size="14" fill="#23261f" text-anchor="start">walls rounded, browse ends grey</text><rect x="16" y="246" width="110" height="38" rx="8" fill="#7d8b74"/><text x="71" y="271" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">A week +</text><text x="140" y="271" font-size="14" fill="#23261f" text-anchor="start">debris, web, mould inside</text><text x="200" y="298" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Give a range, never a minute (Tip)</text>
</svg>
