<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" font-family="sans-serif" role="img" aria-label="Map: scrapes on a field edge are visited mostly at night. Scrapes inside or near bedding cover are more likely to get daylight visits. Tip: hunt scrapes close to bedding cover.">
<rect x="0" y="0" width="400" height="296" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Edge scrapes or cover scrapes?</text>
<rect x="10" y="60" width="380" height="200" rx="10" fill="#e9efe0"/><path d="M10 60 H150 Q170 160 140 260 H10 Z" fill="#b9c99a"/><rect x="260" y="60" width="130" height="200" rx="10" fill="#f2e9c9"/><text x="70" y="84" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">bed cover</text><text x="325" y="84" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">field edge</text><ellipse cx="160" cy="120" rx="12" ry="6" fill="#5c4532"/><ellipse cx="200" cy="170" rx="12" ry="6" fill="#5c4532"/><ellipse cx="150" cy="210" rx="12" ry="6" fill="#5c4532"/><ellipse cx="270" cy="110" rx="12" ry="6" fill="#5c4532" opacity=".6"/><ellipse cx="268" cy="180" rx="12" ry="6" fill="#5c4532" opacity=".6"/><ellipse cx="272" cy="240" rx="12" ry="6" fill="#5c4532" opacity=".6"/><circle cx="200" cy="170" r="18" fill="none" stroke="#e8590c" stroke-width="3"/><text x="205" y="140" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">inside cover:</text><text x="205" y="200" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">more daylight</text><text x="320" y="160" font-size="14" font-weight="bold" fill="#6b4f35" text-anchor="middle">edges:</text><text x="320" y="178" font-size="14" fill="#6b4f35" text-anchor="middle">mostly night</text><text x="200" y="286" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Tip: hunt scrapes close to bedding cover</text>
</svg>
