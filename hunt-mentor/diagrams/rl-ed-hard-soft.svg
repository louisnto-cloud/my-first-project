<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Two panels. A hard edge: tall timber stops in a straight line at a cutblock or field. A soft edge, also called an ecotone: timber thins into a band of shrubs and young trees before the open ground. Caption: soft edges give cover right next to the feed.">
