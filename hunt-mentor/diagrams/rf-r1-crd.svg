<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 276" role="img" aria-label="Four cards. Capital Regional District water supply and regional park lands: no hunting, and no firing a firearm, bow or crossbow. In Regions 1 and 2: no hunting or firearm discharge within 100 metres of any regional district park. Questions: Integrated Water Services, 250 474 9600; Regional Parks, 250 478 3344." font-family="sans-serif">
<rect x="0" y="0" width="400" height="276" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Capital Regional District lands</text>
<rect x="6" y="40" width="190" height="114" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M6 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#c92a2a"/>
<text x="101" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Water supply and</text>
<text x="101" y="76" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">regional park lands</text>
<text x="14" y="106" font-size="14" fill="#23261f" text-anchor="start">No hunting. No firing a</text>
<text x="14" y="124" font-size="14" fill="#23261f" text-anchor="start">firearm, bow or</text>
<text x="14" y="142" font-size="14" fill="#23261f" text-anchor="start">crossbow</text>
<rect x="204" y="40" width="190" height="114" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<path d="M204 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#c92a2a"/>
<text x="299" y="58" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Near any regional</text>
<text x="299" y="76" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">district park</text>
<text x="212" y="106" font-size="14" fill="#23261f" text-anchor="start">Regions 1 and 2: no</text>
<text x="212" y="124" font-size="14" fill="#23261f" text-anchor="start">hunting or shooting</text>
<text x="212" y="142" font-size="14" fill="#23261f" text-anchor="start">within 100 m</text>
<rect x="6" y="162" width="190" height="100" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
<path d="M6 172 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#2f3a2b"/>
<text x="101" y="180" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Integrated Water</text>
<text x="101" y="198" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Services</text>
<rect x="22.0" y="221" width="16" height="30" rx="3" fill="#2f3a2b"/><rect x="25.0" y="225" width="10" height="18" fill="#ffffff"/>
<text x="52" y="228" font-size="14" fill="#23261f" text-anchor="start">250 474 9600</text>
<rect x="204" y="162" width="190" height="100" rx="10" fill="#ffffff" stroke="#2f3a2b" stroke-width="2.5"/>
<path d="M204 172 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v36 h-190 z" fill="#2f3a2b"/>
<text x="299" y="180" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Regional Parks</text>
<rect x="220.0" y="221" width="16" height="30" rx="3" fill="#2f3a2b"/><rect x="223.0" y="225" width="10" height="18" fill="#ffffff"/>
<text x="250" y="228" font-size="14" fill="#23261f" text-anchor="start">250 478 3344</text>
</svg>
