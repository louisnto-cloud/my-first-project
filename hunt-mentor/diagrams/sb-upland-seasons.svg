<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 324" font-family="sans-serif" role="img" aria-label="Grid of upland bird seasons by region, 99 percent. Quail: Region 3 no season; Region 8 1 October to 30 November, 10 a day; Region 2 no season. Chukar: Regions 3 and 8, 1 October to 30 November, 5 a day; Region 2 no season. Grey partridge: Regions 3 and 8, 1 October to 30 November, 3 a day; Region 2 no season. Pheasant cocks: Regions 3 and 8, 1 October to 30 November, 2 a day; Region 2, MUs 2-4 and 2-8 only, 10 October to 30 November, 2 a day. Possession is 3 times the daily limit.">
