<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" font-family="sans-serif" role="img" aria-label="Grid of upland bird seasons by region, 99 percent. Region 3, Kamloops, 1 October to 30 November: quail no season; chukar 5 a day; grey partridge 3 a day; pheasant cocks 2 a day. Region 8, Okanagan, 1 October to 30 November: quail 10 a day; chukar 5 a day; grey partridge 3 a day; pheasant cocks 2 a day. Region 2, Mission: quail, chukar and grey partridge no season; pheasant cocks in MUs 2-4 and 2-8 only, 10 October to 30 November, 2 a day. Possession is 3 times the daily limit.">
<rect width="400" height="450" fill="#fffaf0"/>
