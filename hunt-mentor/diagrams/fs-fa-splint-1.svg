<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Splint step 1: before you splint, check the skin below the injury is warm and pink and the person can feel your touch.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1. Check below the injury</text><rect x="30" y="138" width="300" height="44" rx="22" fill="#d9b48f" stroke="#b08a66" stroke-width="2"/><circle cx="344" cy="160" r="24.0" fill="#d9b48f" stroke="#b08a66" stroke-width="2"/><ellipse cx="250" cy="160" rx="16" ry="7" fill="#c0392b"/><ellipse cx="200" cy="160" rx="20" ry="20" fill="#c0392b" opacity=".35"/><ellipse cx="355" cy="120" rx="16" ry="9" fill="#d9b48f" stroke="#2f3a2b" stroke-width="2"/><text x="320" y="80" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Warm? Feel this?</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Check warmth and feeling first</text>
</svg>
