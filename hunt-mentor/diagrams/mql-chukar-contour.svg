<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Contour lines on a slope. A chukar covey flushed at one height. Washington Fish and Wildlife says most birds will be at about the same elevation at a given time of day, so move uphill a little and follow that line to be just above the next covey, 75 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Chukar: follow the same contour</text>
<rect x="0" y="40" width="400" height="200" rx="8" fill="#dfe6d3"/>
<path d="M10 90 Q200 50 390 90" fill="none" stroke="#8a9a6b" stroke-width="2"/>
<path d="M10 118 Q200 78 390 118" fill="none" stroke="#8a9a6b" stroke-width="2"/>
<path d="M10 146 Q200 106 390 146" fill="none" stroke="#8a9a6b" stroke-width="2"/>
<path d="M10 174 Q200 134 390 174" fill="none" stroke="#8a9a6b" stroke-width="2"/>
<path d="M10 202 Q200 162 390 202" fill="none" stroke="#8a9a6b" stroke-width="2"/>
<path d="M10 230 Q200 190 390 230" fill="none" stroke="#8a9a6b" stroke-width="2"/>
<path d="M10 154 Q200 114 390 154" fill="none" stroke="#e8590c" stroke-width="4" stroke-dasharray="10 6"/>
<g transform="translate(80 136) scale(0.5 0.5)"><ellipse cx="0" cy="0" rx="22" ry="14" fill="#b9a88a"/><path d="M-20 -2 L-30 -4 L-28 5 Z" fill="#8b6f4a"/><path d="M-8 -6 v12 M-3 -7 v13 M2 -7 v13 M7 -6 v12" stroke="#2f2f2f" stroke-width="2"/><circle cx="18" cy="-13" r="9" fill="#9fa4a8"/><path d="M12 -15 q6 -2 13 2 q-4 10 -11 10" stroke="#111" stroke-width="2.5" fill="#f3ead8"/><circle cx="20" cy="-15" r="1.6" fill="#111"/><path d="M26 -14 l5 1 l-5 3 Z" fill="#d23b2a"/><path d="M2 13 l-2 8 M9 13 l2 8" stroke="#d23b2a" stroke-width="2.5"/></g>
<text x="80" y="112" font-size="14" font-weight="bold" fill="#a33b2a" text-anchor="middle">flushed here</text>
<line x1="110" y1="146" x2="150" y2="120" stroke="#2f3a2b" stroke-width="3"/><polygon points="150,120 144.8,128.6 140.1,121.3" fill="#2f3a2b"/>
<g transform="translate(170 110)"><circle r="10" fill="#e8590c"/><text x="0" y="-16" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">You</text></g>
<line x1="190" y1="104" x2="330" y2="110" stroke="#e8590c" stroke-width="3"/><polygon points="330,110 320.8,114.0 321.2,105.3" fill="#e8590c"/>
<g transform="translate(340 128) scale(0.5 0.5)"><ellipse cx="0" cy="0" rx="22" ry="14" fill="#b9a88a"/><path d="M-20 -2 L-30 -4 L-28 5 Z" fill="#8b6f4a"/><path d="M-8 -6 v12 M-3 -7 v13 M2 -7 v13 M7 -6 v12" stroke="#2f2f2f" stroke-width="2"/><circle cx="18" cy="-13" r="9" fill="#9fa4a8"/><path d="M12 -15 q6 -2 13 2 q-4 10 -11 10" stroke="#111" stroke-width="2.5" fill="#f3ead8"/><circle cx="20" cy="-15" r="1.6" fill="#111"/><path d="M26 -14 l5 1 l-5 3 Z" fill="#d23b2a"/><path d="M2 13 l-2 8 M9 13 l2 8" stroke="#d23b2a" stroke-width="2.5"/></g>
<text x="330" y="92" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">next covey?</text>
<text x="30" y="60" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">uphill</text>
<text x="30" y="232" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="start">downhill</text>
<rect x="10" y="246" width="380" height="46" rx="8" fill="#2f3a2b"/>
<text x="200" y="266" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Coveys often sit at the same height: move up</text>
<text x="200" y="286" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">a little, then follow that line (75%)</text>
</svg>
