<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 314" font-family="sans-serif" role="img" aria-label="Contour lines on a slope, uphill at the top, downhill at the bottom. A chukar covey flushed at one height. Washington Fish and Wildlife says most birds will be at about the same elevation at a given time of day, so move uphill a little and follow that line to be just above the next covey, 75 percent.">
