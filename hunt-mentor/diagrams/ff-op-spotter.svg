<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A spotting scope, 20 to 60 power with an 85 mm lens, on a tripod. Angled eyepieces sit lower and are easy to share; straight ones are fast to find targets. More power means a dimmer image.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Spotting scope: always on a tripod</text><g transform="translate(60 90) scale(1.2)"><rect x="0" y="0" width="120" height="34" rx="10" fill="#2f3a2b" stroke="none" stroke-width="2"/><path d="M120 2 L150 -4 L150 38 L120 32 Z" fill="#2f3a2b" stroke="#2f3a2b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 8 L-26 -12 L-18 -20 L6 2 Z" fill="#6b6f68" stroke="#2f3a2b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><line x1="60" y1="34" x2="40" y2="110" stroke="#23261f" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="34" x2="80" y2="110" stroke="#23261f" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="34" x2="60" y2="112" stroke="#23261f" stroke-width="3" stroke-linecap="round"/></g><text x="200" y="64" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="middle">20 to 60x85</text><text x="330" y="140" font-size="14" fill="#2f3a2b" text-anchor="middle">Angled: lower,</text><text x="330" y="158" font-size="14" fill="#2f3a2b" text-anchor="middle">easy to share</text><text x="330" y="200" font-size="14" fill="#2f3a2b" text-anchor="middle">Straight: fast</text><text x="330" y="218" font-size="14" fill="#2f3a2b" text-anchor="middle">to find targets</text><text x="200.0" y="284" font-size="13" fill="#2f3a2b" text-anchor="middle">More power = dimmer image (Vortex)</text>
</svg>
