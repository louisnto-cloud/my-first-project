<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="At night the hunter walks a short leg to a creek, follows the creek as a handrail, and reaches the road, which is the catching feature. Longer than a straight line, but hard to get lost.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#1f2a3a" stroke="none" stroke-width="2"/><text x="14" y="26" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="start" font-weight="bold">Night route: big, simple, short legs</text><line x1="0" y1="70" x2="400" y2="70" stroke="#9aa5b1" stroke-width="6" stroke-linecap="round"/><text x="10" y="60" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="start">Road: catching feature</text><path d="M300 290 C 280 230, 320 180, 300 120 C 290 100, 250 80, 220 72" fill="none" stroke="#4a7fb0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="170" y="215" font-family="sans-serif" font-size="14" fill="#9ec5ea" text-anchor="start">Creek: handrail</text><path d="M80 280 C 140 250, 230 260, 290 250" fill="none" stroke="#e8590c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/><circle cx="80" cy="280" r="7" fill="#e8590c" stroke="none" stroke-width="2"/><text x="40" y="270" font-family="sans-serif" font-size="14" fill="#ffb38a" text-anchor="start">You</text><path d="M290 250 C 280 200, 300 150, 280 110 C 270 90, 240 80, 225 76" fill="none" stroke="#e8590c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/><text x="14" y="110" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="start">Night: walk to the creek,</text><text x="14" y="128" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="start">follow it to the road.</text><text x="14" y="146" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="start">Longer, but you cannot</text><text x="14" y="164" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="start">get lost.</text>
</svg>
