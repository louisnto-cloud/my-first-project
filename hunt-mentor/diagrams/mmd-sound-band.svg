<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Log scale chart of hearing. People hear about 20 hertz to 20 kilohertz. Deer hear about 115 hertz to 54 kilohertz and hear best at 4 to 8 kilohertz, shaded orange: the band of zippers, Velcro, nylon swish and metal clicks.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">What a deer hears (log scale)</text><line x1="30.0" y1="210" x2="30.0" y2="218" stroke="#23261f" stroke-width="1"/><text x="30.0" y="236" font-size="14" fill="#23261f" text-anchor="middle">10 Hz</text><line x1="115.0" y1="210" x2="115.0" y2="218" stroke="#23261f" stroke-width="1"/><text x="115.0" y="236" font-size="14" fill="#23261f" text-anchor="middle">100</text><line x1="200.0" y1="210" x2="200.0" y2="218" stroke="#23261f" stroke-width="1"/><text x="200.0" y="236" font-size="14" fill="#23261f" text-anchor="middle">1 k</text><line x1="285.0" y1="210" x2="285.0" y2="218" stroke="#23261f" stroke-width="1"/><text x="285.0" y="236" font-size="14" fill="#23261f" text-anchor="middle">10 k</text><line x1="370.0" y1="210" x2="370.0" y2="218" stroke="#23261f" stroke-width="1"/><text x="370.0" y="236" font-size="14" fill="#23261f" text-anchor="middle">100 kHz</text><line x1="30" y1="210" x2="370" y2="210" stroke="#23261f" stroke-width="1"/><rect x="55.58754963143841" y="80" width="254.99999999999997" height="30" rx="4" fill="#8a9a6b"/><text x="61.58754963143841" y="101" font-size="14" fill="#23261f" text-anchor="start">you: 20 Hz to 20 kHz</text><rect x="120.159316430057" y="130" width="227.0941531548953" height="30" rx="4" fill="#8b5a2b"/><text x="126.159316430057" y="151" font-size="14" fill="#fffaf0" text-anchor="start" font-weight="bold">deer: 115 Hz to 54 kHz</text><rect x="251.1750992628768" y="60" width="25.587549631438435" height="140" fill="#e8590c" opacity=".3"/><text x="263.59598229552705" y="54" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">best 4 to 8 kHz</text><text x="200" y="186" font-size="14" fill="#e8590c" text-anchor="middle">zips, Velcro, nylon, metal clicks</text><text x="200" y="268" font-size="14" fill="#6b4f35" text-anchor="middle">D&#x27;Angelo and others 2007 (85%)</text>
</svg>
