<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 2: look, listen and smell. Is a bear or cougar in sight? Are ravens close? Is there a strong smell of rot?">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">2. Look, listen, smell</text>
<rect x="0" y="200" width="400" height="100" rx="0" fill="#cfdcb5"/><g transform="translate(300 230) scale(1)"><ellipse cx="0" cy="0" rx="34" ry="12" fill="#a0785a"/><path d="M30 -4 l16 -8 l4 6 l-14 8 Z" fill="#a0785a"/><path d="M-20 8 l-10 14 M-10 8 l-4 16 M14 8 l4 16 M22 6 l10 14" stroke="#a0785a" stroke-width="4"/></g><g transform="translate(90 200)"><circle cx="0" cy="-70" r="12" fill="#e8590c"/><rect x="-12" y="-58" width="24" height="44" rx="6" fill="#e8590c"/><rect x="-10" y="-14" width="8" height="14" fill="#2f3a2b"/><rect x="2" y="-14" width="8" height="14" fill="#2f3a2b"/></g><text x="240" y="80" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Look, listen, smell</text><text x="240" y="104" font-size="15" fill="#23261f" text-anchor="middle">Bear or cat in sight? Ravens?</text><text x="240" y="126" font-size="15" fill="#23261f" text-anchor="middle">Growl, crunching, rot smell?</text>
</svg>
