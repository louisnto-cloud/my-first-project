<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Debris hut step 1: rest one end of a long pole on a stump or low branch, the other end on the ground, a little longer than you.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1. Ridgepole on a stump</text><rect x="0" y="230" width="400" height="70" rx="0" fill="#dfe6d3"/><rect x="60" y="180" width="30" height="50" rx="4" fill="#8b5a2b"/><line x1="75" y1="182" x2="340" y2="228" stroke="#8b5a2b" stroke-width="9" stroke-linecap="round"/><text x="220" y="160" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">A bit longer than you</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Pole from stump to ground</text>
</svg>
