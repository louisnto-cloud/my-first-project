<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three stages of a flock, a tip. Relaxed: heads down, feeding, tipping up, preening. Alert: necks up and stretched long, holding still, bunching together. Leaving: swimming away, calling, then the flush. If they are alert, freeze; do not take one more step."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Read the flock before it leaves (Tip)</text><rect x="10" y="40" width="380" height="74" rx="8" fill="#dfe6d3"/><rect x="10" y="40" width="112" height="74" rx="8" fill="#8a9a6b"/><text x="66" y="83" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Relaxed</text><g transform="translate(160 92) scale(0.9)"><path d="M-30 0 Q-34 -14 -18 -14 L10 -12 Q24 -10 24 0 Q20 10 -2 10 L-22 10 Q-32 8 -30 0Z" fill="#8b5a2b"/><circle cx="28" cy="2" r="8" fill="#8b5a2b"/><path d="M34 4 L44 8 L34 9Z" fill="#2f3a2b"/></g><text x="286" y="72" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Heads down, feeding,</text><text x="286" y="92" font-size="14" fill="#2f3a2b" text-anchor="middle">tipping up, preening</text><rect x="10" y="122" width="380" height="74" rx="8" fill="#dfe6d3"/><rect x="10" y="122" width="112" height="74" rx="8" fill="#d9a23a"/><text x="66" y="165" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Alert</text><g transform="translate(160 174) scale(0.9)"><path d="M-30 0 Q-34 -14 -18 -14 L10 -12 Q24 -10 24 0 Q20 10 -2 10 L-22 10 Q-32 8 -30 0Z" fill="#8b5a2b"/><rect x="12" y="-44" width="7" height="36" fill="#8b5a2b"/><circle cx="16" cy="-46" r="8" fill="#8b5a2b"/><path d="M22 -48 L33 -45 L22 -42Z" fill="#2f3a2b"/></g><text x="286" y="154" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Necks up and long,</text><text x="286" y="174" font-size="14" fill="#2f3a2b" text-anchor="middle">still, bunching up</text><rect x="10" y="204" width="380" height="74" rx="8" fill="#dfe6d3"/><rect x="10" y="204" width="112" height="74" rx="8" fill="#e8590c"/><text x="66" y="247" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Leaving</text><g transform="translate(160 256) scale(0.9)"><path d="M-30 0 Q-34 -14 -18 -14 L10 -12 Q24 -10 24 0 Q20 10 -2 10 L-22 10 Q-32 8 -30 0Z" fill="#8b5a2b"/><rect x="12" y="-44" width="7" height="36" fill="#8b5a2b"/><circle cx="16" cy="-46" r="8" fill="#8b5a2b"/><path d="M22 -48 L33 -45 L22 -42Z" fill="#2f3a2b"/></g><text x="286" y="236" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Swim away, calls,</text><text x="286" y="256" font-size="14" fill="#2f3a2b" text-anchor="middle">then the flush</text><text x="200" y="292" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Alert? Freeze. Do not take one more step.</text></svg>
