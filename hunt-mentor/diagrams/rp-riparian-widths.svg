h="18" height="14" rx="0" fill="#9fbf86"/><text x="224" y="252" font-size="14" fill="#2f3a2b" text-anchor="start">management zone</text><text x="200.0" y="286" font-size="14" fill="#6b4f35" text-anchor="middle">Fish streams, BC forestry law, section 47 (95%)</text>
