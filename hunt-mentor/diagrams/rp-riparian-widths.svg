<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of the minimum tree strips BC forestry law sets on each side of fish streams. S1B, streams over 20 m wide: 50 m reserve with no logging plus 20 m management zone. S2, 5 to 20 m wide: 30 m reserve plus 20 m. S3, 1.5 to 5 m: 20 m reserve plus 20 m. S4, under 1.5 m: no reserve, 30 m management zone.">
<rect width="400" height="300" fill="#fffaf0"/>
