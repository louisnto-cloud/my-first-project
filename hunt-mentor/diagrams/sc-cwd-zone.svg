<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Sketch of southern BC, not to scale. The Chronic Wasting Disease Management Zone is an orange patch in Region 4, the Kootenay, around Cranbrook, near the Alberta and US borders. Kamloops and Mission are marked in blue, well outside the zone." font-family="sans-serif">
