<path d="M275.1 162.2 C314.3 133 350.3 176.8 366.6 235.2 L360.1 279 L294.7 279 C268.5 235.2 262.0 191.4 275.1 162.2 Z" fill="#e8590c" opacity="0.55" stroke="#e8590c" stroke-width="2"/>
