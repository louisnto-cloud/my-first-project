<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Mountain cross section of elk country. Summer: subalpine and alpine basins and avalanche tracks. Fall and rut: timber with openings on the mid slopes. Winter: low benches, grassy slopes, open forest and floodplain marshes where snow stays shallow. Source BC elk account.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Elk country, top to bottom</text><path d="M0 280 L90 230 L170 150 L250 70 L310 50 L400 80 L400 300 L0 300 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/><path d="M250 70 L310 50 L360 64 L330 90 L280 92 Z" fill="#e8efe0" stroke="#8a9a6b"/><g transform="translate(200 132) scale(0.7)"><rect x="-3" y="-10" width="6" height="12" rx="1" fill="#6b4f35"/><path d="M0 -50 L16 -10 L-16 -10 Z" fill="#2f3a2b"/></g><g transform="translate(215 118) scale(0.7)"><rect x="-3" y="-10" width="6" height="12" rx="1" fill="#6b4f35"/><path d="M0 -50 L16 -10 L-16 -10 Z" fill="#2f3a2b"/></g><g transform="translate(230 104) scale(0.7)"><rect x="-3" y="-10" width="6" height="12" rx="1" fill="#6b4f35"/><path d="M0 -50 L16 -10 L-16 -10 Z" fill="#2f3a2b"/></g><g transform="translate(185 146) scale(0.7)"><rect x="-3" y="-10" width="6" height="12" rx="1" fill="#6b4f35"/><path d="M0 -50 L16 -10 L-16 -10 Z" fill="#2f3a2b"/></g><ellipse cx="60" cy="262" rx="30" ry="6" fill="#4a7fb0"/><text x="330" y="116" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Summer:</text><text x="330" y="134" font-size="14" fill="#23261f" text-anchor="middle">subalpine basins,</text><text x="330" y="152" font-size="14" fill="#23261f" text-anchor="middle">avalanche tracks</text><text x="240" y="190" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Fall and rut:</text><text x="240" y="208" font-size="14" fill="#23261f" text-anchor="middle">timber and openings</text><text x="80" y="112" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Winter:</text><text x="80" y="130" font-size="14" fill="#23261f" text-anchor="middle">low benches, grass,</text><text x="80" y="148" font-size="14" fill="#23261f" text-anchor="middle">open forest, marsh</text><line x1="80" y1="155" x2="70" y2="238" stroke="#e8590c" stroke-width="1.5"/><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">BC elk account (90%)</text>
</svg>
