<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Hunter lore: before bedding, an animal may loop back so it can watch or smell its own back trail. When the trail starts to hook, leave it and swing wide instead of walking straight up the tracks.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The trail hooks: leave it</text>
<rect x="0" y="60" width="400" height="230" rx="0" fill="#e9efe0"/><path d="M30 260 Q120 200 200 160 Q260 130 300 140 Q340 170 300 200 Q250 220 230 190" fill="none" stroke="#8b5a2b" stroke-width="3" stroke-dasharray="3 6"/><ellipse cx="232" cy="186" rx="16" ry="7" fill="#8b5a2b"/><text x="232" y="214" font-size="13" font-weight="bold" fill="#6b4f35" text-anchor="middle">bed</text><line x1="30" y1="90" x2="140" y2="100" stroke="#4a7fb0" stroke-width="2"/><path d="M140 100 l-8 -6 l1 9 Z" fill="#4a7fb0" stroke="#4a7fb0" stroke-width="1"/><line x1="30" y1="104" x2="140" y2="114" stroke="#4a7fb0" stroke-width="2"/><path d="M140 114 l-8 -6 l1 9 Z" fill="#4a7fb0" stroke="#4a7fb0" stroke-width="1"/><line x1="30" y1="118" x2="140" y2="128" stroke="#4a7fb0" stroke-width="2"/><path d="M140 128 l-8 -6 l1 9 Z" fill="#4a7fb0" stroke="#4a7fb0" stroke-width="1"/><text x="85" y="80" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">wind</text><path d="M120 200 Q170 260 260 260" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="8 5"/><text x="260" y="282" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="middle">you: leave the trail, swing wide (Tip)</text><text x="320" y="100" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">hunter lore:</text><text x="320" y="118" font-size="14" fill="#23261f" text-anchor="middle">loops back to</text><text x="320" y="136" font-size="14" fill="#23261f" text-anchor="middle">watch its trail</text>
</svg>
