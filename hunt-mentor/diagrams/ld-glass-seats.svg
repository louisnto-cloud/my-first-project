<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 346" font-family="sans-serif" role="img" aria-label="Side view sketch of four glassing seats, all Tips. Seat 1: watch a grassland bench with timber above it from across a draw at first light. Seat 2: watch a south facing burn or cutblock with 5 to 15 years of regrowth. Seat 3: watch broken rock and fir benches above a lake or river from the far shore. Seat 4: watch a hayfield edge at dusk for white tails from a fence corner 200 metres back.">
<rect x="0" y="0" width="400" height="346" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">4 seats to glass from (Tip)</text>
<text x="200" y="46" font-size="14" fill="#6b4f35" text-anchor="middle">Use a tripod. Numbers are seats, deer are what you watch.</text>
<path d="M0 250 L0 120 Q 60 80 110 110 L150 120 Q 200 70 250 60 Q 320 50 400 90 L400 250 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<path d="M0 250 h400 v20 h-400 z" fill="#4a7fb0" opacity=".6"/>
<text x="200" y="288" font-size="14" fill="#2f3a2b" text-anchor="middle">River or lake</text>
<g fill="#2f3a2b"><polygon points="30,108 38,84 46,108"/><polygon points="48,102 56,78 64,102"/><polygon points="66,100 74,76 82,100"/></g>
<rect x="20" y="118" width="80" height="14" fill="#c9b79c"/>
<g transform="translate(60 150) scale(0.6)"><ellipse cx="0" cy="4" rx="17" ry="8" fill="#8b5a2b"/><path d="M12 0 L18 -10" stroke="#8b5a2b" stroke-width="5"/><ellipse cx="21" cy="-12" rx="6" ry="4" fill="#8b5a2b"/><path d="M19 -15 l-3 -9 m3 9 l3 -10 m-4.5 -4 l-4 -2" stroke="#6b4f35" stroke-width="2" fill="none"/><path d="M-12 10 v10 M-6 10 v10 M8 10 v10 M13 10 v10" stroke="#8b5a2b" stroke-width="3"/></g>
<text x="10" y="196" font-size="14" font-weight="bold" fill="#2f3a2b">Grassland bench,</text>
<text x="10" y="212" font-size="14" fill="#2f3a2b">timber above</text>
<g stroke="#6b4f35" stroke-width="2"><line x1="190" y1="96" x2="190" y2="78"/><line x1="205" y1="90" x2="205" y2="72"/><line x1="220" y1="84" x2="220" y2="66"/><line x1="235" y1="80" x2="235" y2="62"/></g>
<text x="160" y="128" font-size="14" font-weight="bold" fill="#2f3a2b">South facing burn</text>
<text x="160" y="144" font-size="14" fill="#2f3a2b">5 to 15 yr regrowth</text>
<path d="M300 170 l14 -10 l12 6 l14 -8 l12 8 v10 z" fill="#9b9b8f"/>
<g fill="#2f3a2b"><polygon points="330,160 336,142 342,160"/><polygon points="346,156 352,138 358,156"/></g>
<text x="392" y="196" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="end">Rock and fir bench</text>
<text x="392" y="212" font-size="14" fill="#2f3a2b" text-anchor="end">above the water</text>
<rect x="120" y="232" width="110" height="14" fill="#d9c27a"/>
<text x="120" y="226" font-size="14" font-weight="bold" fill="#2f3a2b">Hayfield edge</text>
<circle cx="150" cy="186" r="13" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="150" y="192" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">1</text>
<circle cx="285" cy="112" r="13" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="285" y="118" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">2</text>
<circle cx="380" cy="240" r="13" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="380" y="246" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">3</text>
<circle cx="250" cy="236" r="13" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="250" y="242" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">4</text>
<path d="M140 180 Q 100 160 80 150" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
<path d="M272 108 Q 250 96 236 88" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
<path d="M372 232 Q 350 200 335 175" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
<path d="M238 238 Q 215 236 205 238" stroke="#e8590c" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
<text x="10" y="316" font-size="14" fill="#2f3a2b">1 across a draw at first light. 2 a burn or cutblock.</text>
<text x="10" y="334" font-size="14" fill="#2f3a2b">3 from the far shore. 4 at dusk, 200 m back.</text>
</svg>
