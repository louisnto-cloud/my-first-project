<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 408" font-family="sans-serif" role="img" aria-label="Four small drawings of glassing seats, all tips. Use a tripod. Seat 1: watch a grassland bench with timber above it from across a draw at first light. Seat 2: watch a south facing burn or cutblock with 5 to 15 years of regrowth. Seat 3: watch broken rock and fir benches above a lake or river from the far shore. Seat 4: watch a hayfield edge at dusk for white tails from a fence corner 200 metres back.">
