<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 346" font-family="sans-serif" role="img" aria-label="What the taxidermist needs: the whole cape with the head inside, cold; antlers on the skull plate; by law your FWID, species licence number, species, sex and date of kill; a Record of Receipt if someone else drops it off; photos of the animal. Evidence of sex stays with the carcass, not the cape.">
<rect x="0" y="0" width="400" height="346" fill="#fffaf0"/>
