<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 306" font-family="sans-serif" role="img" aria-label="Cougar scat: a segmented tube with blunt ends, often left in a scrape of scratched up needles or dirt and sometimes covered. Deer hair and bone chips inside.">
<rect x="0" y="0" width="400" height="306" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Cougar: blunt and buried</text>
<rect x="16" y="150" width="368" height="70" rx="10" fill="#c9b79c"/><path d="M60 150 Q120 120 180 150" fill="#a8936f" stroke="none" stroke-width="2"/><g transform="translate(200 170) rotate(0)"><path d="M0 -11.0 H99.0 Q110 0 99.0 11.0 H11.0 Q0 11.0 0 0 Q0 -11.0 11.0 -11.0 Z" fill="#6b4f35"/><line x1="27.5" y1="-11.0" x2="27.5" y2="11.0" stroke="#fffaf0" stroke-width="2"/><line x1="55.0" y1="-11.0" x2="55.0" y2="11.0" stroke="#fffaf0" stroke-width="2"/><line x1="82.5" y1="-11.0" x2="82.5" y2="11.0" stroke="#fffaf0" stroke-width="2"/></g><line x1="110" y1="116" x2="110" y2="140" stroke="#6b4f35" stroke-width="2"/><path d="M110.0 140.0 L105.7 131.0 L114.3 131.0 Z" fill="#6b4f35"/><text x="110" y="108" font-size="14" font-weight="bold" fill="#6b4f35" text-anchor="middle">scratched up</text><text x="200" y="250" font-size="15" font-weight="bold" fill="#23261f" text-anchor="middle">Segmented tube, blunt ends</text><text x="200" y="274" font-size="15" fill="#23261f" text-anchor="middle">Often in a scrape, may be covered</text><text x="200" y="296" font-size="14" fill="#6b4f35" text-anchor="middle">Deer hair and bone inside (65%)</text>
</svg>
