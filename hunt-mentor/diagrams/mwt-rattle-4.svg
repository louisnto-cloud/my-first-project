<text x="200" y="22" font-size="16" fill="#23261f" text-anchor="middle" font-weight="bold">4. Wait 20 to 30 minutes, watch downwind</text><rect x="0" y="34" width="400" height="266" fill="#eef0e2"/><path d="M0 34 L140 34 Q 170 160 140 300 L0 300 Z" fill="#2f3a2b" opacity=".85"/><polygon points="60,79.2 44.4,120 75.6,120" fill="#1f2a1c"/><rect x="57.0" y="120" width="6.0" height="9.6" fill="#6b4f35"/><polygon points="100,162.6 85.7,200 114.3,200" fill="#1f2a1c"/><rect x="97.25" y="200" width="5.5" height="8.8" fill="#6b4f35"/><line x1="330" y1="60" x2="380" y2="60" stroke="#4a7fb0" stroke-width="3" stroke-linecap="round"/><polygon points="380.0,60.0 371.9,63.9 371.9,56.1" fill="#4a7fb0"/><text x="330" y="82" font-size="14" fill="#4a7fb0" text-anchor="start" font-weight="bold">Wind</text><circle cx="160" cy="118.0" r="7.0" fill="#4a7fb0"/><rect x="153.0" y="126.0" width="14.0" height="20.0" rx="4.0" fill="#4a7fb0"/><circle cx="280" cy="168.0" r="7.0" fill="#e8590c"/><rect x="273.0" y="176.0" width="14.0" height="20.0" rx="4.0" fill="#e8590c"/><g transform="translate(330 250) scale(0.4 0.4)"><rect x="-41" y="12" width="6" height="40" rx="3" fill="#8b5a2b"/><rect x="-31" y="12" width="6" height="40" rx="3" fill="#8b5a2b"/><rect x="27" y="12" width="6" height="40" rx="3" fill="#8b5a2b"/><rect x="37" y="12" width="6" height="40" rx="3" fill="#8b5a2b"/><ellipse cx="0" cy="0" rx="52" ry="22" fill="#8b5a2b"/><path d="M-30 -10 L-52 -42 L-40 -48 L-18 -14 Z" fill="#8b5a2b"/><ellipse cx="-58" cy="-46" rx="15" ry="8" fill="#8b5a2b"/><path d="M-50 -52 L-44 -64 L-40 -52 Z" fill="#8b5a2b"/><circle cx="-64" cy="-47" r="1.8" fill="#23261f"/><path d="M-48 -54 C -46 -76 -60 -84 -82 -74" fill="none" stroke="#6b4f35" stroke-width="3.2" stroke-linecap="round"/><path d="M-52 -72 l-2 -14 M-62 -79 l-3 -14 M-72 -79 l-4 -11 M-49 -60 l-6 -8" fill="none" stroke="#6b4f35" stroke-width="2.6" stroke-linecap="round"/><path d="M50 -8 C 60 -6 64 6 60 18 C 54 16 50 6 48 -2 Z" fill="#8b5a2b" stroke="#23261f" stroke-width="1"/></g><path d="M380 280 C 340 300 300 270 290 250" fill="none" stroke="#8b5a2b" stroke-width="2" stroke-dasharray="5 5"/><rect x="0" y="272" width="400" height="28" fill="#fffaf0"/><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle" font-weight="bold">Most come slow and sneaky, not charging (Tip).</text>
</svg>
