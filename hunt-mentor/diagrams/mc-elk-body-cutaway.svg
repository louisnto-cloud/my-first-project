<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Cutaway of an elk body. In the chest, above the front legs: the lungs, with the heart low between the front legs. The diaphragm is the wall behind them. Behind that: the liver, then the huge rumen filling most of the belly, then the intestines toward the rear.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Inside an elk</text><g transform="translate(165 175) scale(2.0)"><rect x="-34" y="6" width="7" height="44" rx="3.5" fill="#e6dccb" stroke="#23261f" stroke-width="1.2"/><rect x="-24" y="6" width="7" height="44" rx="3.5" fill="#e6dccb" stroke="#23261f" stroke-width="1.2"/><rect x="24" y="6" width="7" height="44" rx="3.5" fill="#e6dccb" stroke="#23261f" stroke-width="1.2"/><rect x="33" y="6" width="7" height="44" rx="3.5" fill="#e6dccb" stroke="#23261f" stroke-width="1.2"/><ellipse cx="0" cy="0" rx="46" ry="19" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/><path d="M26 -12 L44 -44 L58 -40 L42 8 Z" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5" stroke-linejoin="round"/><ellipse cx="62" cy="-42" rx="16" ry="7" transform="rotate(20 62 -42)" fill="#f4ecdc" stroke="#23261f" stroke-width="1.5"/></g><ellipse cx="226" cy="160" rx="24" ry="19" fill="#e89a9a" stroke="#23261f" stroke-width="1.5"/><ellipse cx="236" cy="193" rx="9" ry="11" fill="#b03a2e" stroke="#23261f" stroke-width="1.5"/><path d="M202 140 Q194 174 204 208" fill="none" stroke="#6b4f35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="186" cy="182" rx="13" ry="16" fill="#7b3f2a" stroke="#23261f" stroke-width="1.5"/><ellipse cx="138" cy="176" rx="40" ry="28" fill="#9bb07a" stroke="#23261f" stroke-width="1.5"/><ellipse cx="94" cy="180" rx="17" ry="17" fill="#d9c27a" stroke="#23261f" stroke-width="1.5"/><line x1="340" y1="155" x2="250" y2="158" stroke="#e8590c" stroke-width="1.5"/><text x="340" y="150" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Lungs</text><line x1="340" y1="220" x2="245" y2="194" stroke="#e8590c" stroke-width="1.5"/><text x="340" y="215" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Heart, low</text><line x1="205" y1="117" x2="202" y2="140" stroke="#e8590c" stroke-width="1.5"/><text x="205" y="112" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Diaphragm</text><line x1="175" y1="271" x2="186" y2="196" stroke="#e8590c" stroke-width="1.5"/><text x="175" y="266" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Liver</text><line x1="115" y1="123" x2="135" y2="150" stroke="#e8590c" stroke-width="1.5"/><text x="115" y="118" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Rumen, huge</text><line x1="50" y1="271" x2="92" y2="196" stroke="#e8590c" stroke-width="1.5"/><text x="50" y="266" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Intestines</text><text x="200" y="292" font-size="14" fill="#6b4f35" text-anchor="middle">Lungs and heart sit forward, in the chest (85%)</text>
</svg>
