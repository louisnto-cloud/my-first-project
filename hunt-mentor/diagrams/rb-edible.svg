<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 598" font-family="sans-serif" role="img" aria-label="A deer, as an example of big game, drawn side on with its edible portions shaded as meat: the neck, the loins along the back, the ribs, the front quarters and the hind quarters, two of each quarter. For big game these must come out of the carcass: neck, ribs, all four quarters and the loins. Game birds: both breasts, shaded on a duck. Wolf, lynx, bobcat and wolverine are exempt. Take the edible portions to your home, a meat cutter or a cold storage plant.">
<rect width="400" height="598" fill="#fffaf0"/>
<defs><clipPath id="rb-edible-body"><path d="M62 128 C62 122 70 116 80 112 L98 102 C104 98 112 98 116 104 C128 118 148 138 172 147 C210 143 270 145 316 149 C330 151 338 157 342 166 C344 188 340 208 330 222 L326 246 L330 296 L320 298 L316 250 C312 236 306 226 300 220 C270 228 222 230 196 222 L194 246 L196 296 L186 298 L184 250 C182 238 178 230 170 226 C158 222 150 212 148 198 C140 174 118 150 100 138 C92 136 80 134 70 134 L62 130z"/></clipPath></defs>
