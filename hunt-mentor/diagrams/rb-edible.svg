<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 292" role="img" aria-label="Outline of a big game animal with the edible portions labelled: neck, ribs, loins, front quarters and hind quarters. Big game: the neck, ribs, all four quarters and the loins. Game birds: both breasts. Wolf, lynx, bobcat and wolverine are exempt. They go to your home, a meat cutter or a cold storage plant." font-family="sans-serif">
  <rect x="0" y="0" width="400" height="292" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#23261f" text-anchor="middle" font-weight="bold">Edible portions: take these out</text>
<ellipse cx="190" cy="120" rx="110" ry="46" fill="#8b5a2b" opacity=".35"/>
<path d="M290 98 L330 50 L352 56 L318 112 Z" fill="#8b5a2b" opacity=".35"/>
<rect x="271.6" y="68" width="36.8" height="24" rx="6" fill="#e8590c" stroke="#e8590c" stroke-width="2"/><text x="290" y="84" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Neck</text>
<rect x="181.6" y="106" width="36.8" height="24" rx="6" fill="#e8590c" stroke="#e8590c" stroke-width="2"/><text x="200" y="122" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Ribs</text>
<rect x="167.0" y="70" width="46.0" height="24" rx="6" fill="#e8590c" stroke="#e8590c" stroke-width="2"/><text x="190" y="86" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Loins</text>
<rect x="203.60000000000002" y="134" width="128.79999999999998" height="24" rx="6" fill="#e8590c" stroke="#e8590c" stroke-width="2"/><text x="268" y="150" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Front quarters</text>
<rect x="50.2" y="134" width="119.6" height="24" rx="6" fill="#e8590c" stroke="#e8590c" stroke-width="2"/><text x="110" y="150" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Hind quarters</text>
<text x="14" y="204" font-size="15" fill="#23261f" text-anchor="start">Big game: neck, ribs, all four quarters, loins.</text>
<text x="14" y="225" font-size="15" fill="#23261f" text-anchor="start">Game birds: both breasts.</text>
<text x="14" y="246" font-size="15" fill="#23261f" text-anchor="start">Wolf, lynx, bobcat, wolverine: exempt.</text>
<text x="14" y="267" font-size="15" fill="#23261f" text-anchor="start">To your home, a meat cutter or cold storage.</text>
</svg>
