<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Ranking of elk senses from a Colorado Parks and Wildlife elk hunting course. 1: the nose. If an elk smells you the hunt is over. 2: the ears. A snapped twig makes it look. 3: the eyes. It sees shapes and motion but little colour or detail, and checks a shape or sound with its nose.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Which sense catches you?</text><text x="20" y="78" font-size="20" fill="#2f3a2b" text-anchor="start" font-weight="bold">1</text><rect x="48" y="54" width="300" height="34" rx="6" fill="#e8590c"/><text x="58" y="77" font-size="16" fill="#fffaf0" text-anchor="start" font-weight="bold">Nose</text><text x="48" y="108" font-size="14" fill="#23261f" text-anchor="start">Smells you: the hunt is over</text><text x="20" y="148" font-size="20" fill="#2f3a2b" text-anchor="start" font-weight="bold">2</text><rect x="48" y="124" width="210" height="34" rx="6" fill="#8b5a2b"/><text x="58" y="147" font-size="16" fill="#fffaf0" text-anchor="start" font-weight="bold">Ears</text><text x="48" y="178" font-size="14" fill="#23261f" text-anchor="start">A snap makes it look</text><text x="20" y="218" font-size="20" fill="#2f3a2b" text-anchor="start" font-weight="bold">3</text><rect x="48" y="194" width="150" height="34" rx="6" fill="#8a9a6b"/><text x="58" y="217" font-size="16" fill="#fffaf0" text-anchor="start" font-weight="bold">Eyes</text><text x="48" y="248" font-size="14" fill="#23261f" text-anchor="start">Shapes and motion, poor detail</text><text x="200" y="268" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">It checks a shape or sound with its nose</text><text x="200" y="290" font-size="14" fill="#6b4f35" text-anchor="middle">Colorado Parks and Wildlife ranking (75%)</text>
</svg>
