<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 592" font-family="sans-serif" role="img" aria-label="Legend of access types. Park: the BC Parks page says firearms are permitted for hunting in open season. WMA, Wildlife Management Area: rules vary, contact the regional office first. Rec site, recreation site: no shooting within 100 metres of camp structures. Permission: private or reserve land, ask first. Closed: no hunting or no shooting.">
<rect x="0" y="0" width="400" height="592" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Access types on these cards</text>
<rect x="16" y="42" width="368" height="116" rx="10" fill="#e9efe0" stroke="#8a9a6b" stroke-width="2.5"/>
<text x="26" y="66" font-size="15" font-weight="bold" fill="#23261f">Park</text>
<circle cx="368.0" cy="60" r="11" fill="#8a9a6b"/><path d="M363.05 60 l3.3 3.8499999999999996 l6.6 -7.699999999999999" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="26" y="84" font-size="14" fill="#2f3a2b">The BC Parks page says firearms are</text>
<text x="26" y="102" font-size="14" fill="#2f3a2b">permitted for hunting in open season.</text>
<g transform="translate(46.0 138) scale(0.62)"><path d="M-26 18 l26 -36 l26 36 z" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2"/><path d="M0 -18 v36 M-6 18 l6 -12 l6 12" stroke="#2f3a2b" stroke-width="2" fill="#fffaf0"/></g>
<rect x="16" y="168" width="368" height="116" rx="10" fill="#f3ead6" stroke="#6b4f35" stroke-width="2.5"/>
<text x="26" y="192" font-size="15" font-weight="bold" fill="#23261f">WMA</text>
<circle cx="368.0" cy="186" r="11" fill="#4a7fb0"/><text x="368" y="190.62" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
<text x="26" y="210" font-size="14" fill="#2f3a2b">Wildlife Management Area: rules vary. Call</text>
<text x="26" y="228" font-size="14" fill="#2f3a2b">the regional office first.</text>
<g transform="translate(46.0 264) scale(0.62)"><rect x="-13" y="-22" width="26" height="44" rx="5" fill="#2f3a2b"/><rect x="-9" y="-16" width="18" height="28" fill="#4a7fb0"/><circle cx="0" cy="17" r="2.5" fill="#fff"/></g>
<rect x="16" y="294" width="368" height="98" rx="10" fill="#f3ead6" stroke="#6b4f35" stroke-width="2.5"/>
<text x="26" y="318" font-size="15" font-weight="bold" fill="#23261f">Rec site</text>
<circle cx="368.0" cy="312" r="11" fill="#4a7fb0"/><text x="368" y="316.62" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
<text x="26" y="336" font-size="14" fill="#2f3a2b">No shooting within 100 m of camp structures.</text>
<g transform="translate(46.0 372) scale(0.62)"><path d="M-26 18 l26 -36 l26 36 z" fill="#8a9a6b" stroke="#2f3a2b" stroke-width="2"/><path d="M0 -18 v36 M-6 18 l6 -12 l6 12" stroke="#2f3a2b" stroke-width="2" fill="#fffaf0"/></g>
<rect x="16" y="402" width="368" height="98" rx="10" fill="#f3ead6" stroke="#6b4f35" stroke-width="2.5"/>
<text x="26" y="426" font-size="15" font-weight="bold" fill="#23261f">Permission</text>
<circle cx="368.0" cy="420" r="11" fill="#4a7fb0"/><text x="368" y="424.62" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">?</text>
<text x="26" y="444" font-size="14" fill="#2f3a2b">Private or reserve land. Ask first.</text>
<g transform="translate(46.0 480) scale(0.62)"><rect x="-20" y="-22" width="40" height="44" rx="3" fill="#fff" stroke="#2f3a2b" stroke-width="2.5"/><path d="M-13 -12 h26 M-13 -4 h26 M-13 4 h18" stroke="#8a9a6b" stroke-width="2.5"/><path d="M8 18 l18 -26 l5 3 l-18 26 l-6 2 z" fill="#e8590c"/></g>
<rect x="16" y="510" width="368" height="58" rx="10" fill="#f6ddd0" stroke="#e8590c" stroke-width="2.5"/>
<text x="26" y="534" font-size="15" font-weight="bold" fill="#23261f">Closed</text>
<circle cx="368.0" cy="528" r="11" fill="#e8590c"/><path d="M363.6 523.6 L372.4 532.4 M372.4 523.6 L363.6 532.4" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
<text x="26" y="552" font-size="14" fill="#2f3a2b">No hunting, or no shooting.</text>
</svg>
