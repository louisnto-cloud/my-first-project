<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Feel a hot spot? Stop now and cover it before it becomes a blister.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="30" cy="32" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="30" y="39" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">3</text>
<text x="56" y="39" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="start">Stop at a hot spot</text>
<path d="M120 200 Q120 120 200 110 Q280 110 290 170 Q290 220 240 220 L150 220 Q120 220 120 200 Z" fill="#e9c9a8" stroke="#6b4f35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="240" cy="160" r="16" fill="#b3261e" opacity="0.6"/><text x="200" y="90" font-family="sans-serif" font-size="16" font-weight="bold" fill="#b3261e" text-anchor="middle">Hot spot</text>
<rect x="10" y="262" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="285.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Stop and cover it now, not later.</text>
</svg>
