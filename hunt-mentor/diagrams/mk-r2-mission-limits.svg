<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1194" font-family="sans-serif" role="img" aria-label="Mission: every row, class and limit. Mule deer (black tailed): Bucks. 2, bucks only (Sept 10 to Dec 15). Black bear: 2 per licence year (Sept 10 to Nov 30). Grouse: sooty, ruffed, spruce: 10 (30), all three together (Sept 10 to Dec 15). Ptarmigan: 5 (15). Not in 2-4 (Sept 10 to Dec 15). Pheasant: Cocks. 2 (6). 2-4 and 2-8 only (Oct 10 to Nov 30, 2026). Ducks: 8 (24) (Oct 10, 2026 to Jan 24, 2027). Coots, snipe: 10 (30) each (Oct 10, 2026 to Jan 24, 2027). Canada and cackling geese: 10 (30) (Oct 10 to Nov 22, then Dec 19 to Jan 10). White fronted geese: 5 (15) (Oct 10, 2026 to Jan 24, 2027). Snow and Ross's geese: 15 a day in 2-4; 2-8: 10 a day, 30 in possession, at most 5 Ross's (85%) (Oct 10, 2026 to Jan 5, 2027). Cougar: 2 (Sept 10 to Mar 31). Bobcat: 1 (Nov 15 to Feb 15). Coyote: NBL (Sept 10 to June 15). Raccoon, skunk: NBL (Sept 1 to Mar 31). Snowshoe hare: 10 a day. 2-8 and 2-19 only (Aug 1 to Apr 30).">
