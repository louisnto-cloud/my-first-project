<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Mistake: a hunter stands up in a small boat to swing on a passing duck and the boat tips. Right: sit to shoot, or shoot from shore, one shooter at a time.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect x="0" y="200" width="400" height="100" fill="#cfe0ea"/>
  <g transform="rotate(14 100 200)"><path d="M40 196 L160 196 L146 220 L54 220 Z" fill="#6b4f35"/><rect x="92" y="130" width="16" height="66" rx="6" fill="#2f3a2b"/><circle cx="100" cy="120" r="11" fill="#2f3a2b"/><path d="M104 140 L160 104" stroke="#6b4f35" stroke-width="5"/></g>
  <path d="M60 60 L140 140 M140 60 L60 140" stroke="#c0392b" stroke-width="6"/>
  <text x="100" y="40" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Standing: tips over</text>
  <path d="M240 196 L360 196 L346 220 L254 220 Z" fill="#6b4f35"/>
  <rect x="284" y="166" width="18" height="30" rx="6" fill="#2f3a2b"/><circle cx="293" cy="156" r="11" fill="#2f3a2b"/>
  <rect x="320" y="176" width="16" height="20" rx="5" fill="#e8590c"/>
  <path d="M296 172 L360 140" stroke="#6b4f35" stroke-width="5"/>
  <path d="M330 70 l12 12 l26 -30" fill="none" stroke="#2f6e3b" stroke-width="6"/>
  <text x="300" y="40" font-size="16" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Sit, one shooter</text>
  <text x="200" y="270" font-size="15" fill="#2f3a2b" text-anchor="middle">Or shoot from shore. PFD zipped</text>
</svg>
