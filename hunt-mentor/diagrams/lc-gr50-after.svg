ze="14" font-weight="bold" fill="#23261f" text-anchor="start">with it</text><rect x="141" y="380" width="48" height="20" rx="10" fill="#4a7fb0"/><text x="165" y="395" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">LAW</text><rect x="20" y="414" width="48" height="20" rx="10" fill="#4a7fb0"/><text x="44" y="429" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">LAW</text><text x="76" y="429" font-size="14" fill="#23261f" text-anchor="start">also law. The rest is wisdom (Tip).</text>
