<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 462" font-family="sans-serif" role="img" aria-label="After the shot: rules 36 to 42. Rule 36: Mark where it stood. Rule 37: Wait 20 minutes, longer if gut shot. Rule 38: Cut the tag before you touch it. Also law. Rule 39: Every reasonable effort. Also law. Rule 40: Guts out within the hour. Rule 41: Evidence of sex stays on. Also law. Rule 42: Record of Receipt travels with it. Also law. Rules without the law badge are wisdom, not law.">
