<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 444" font-family="sans-serif" role="img" aria-label="After the shot: rules 36 to 42. Rule 36: Mark where it stood. Rule 37: Wait 20 minutes, longer if gut shot. Rule 38: Cut the tag before you touch it. Also law. Rule 39: Every reasonable effort. Also law. Rule 40: Guts out within the hour. Rule 41: Evidence of sex stays on. Also law. Rule 42: Record of Receipt travels with it. Also law. Rules without the law badge are wisdom, not law.">
<rect x="0" y="0" width="400" height="444" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">After the shot: rules 36 to 42</text><rect x="10" y="44" width="185" height="84" rx="10" fill="#fff" stroke="#4a7fb0" stroke-width="2"/><circle cx="28" cy="62" r="14" fill="#4a7fb0"/><text x="28" y="67" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">36</text><g transform="translate(36 100) scale(0.8)"><path d="M-12 18 V-18" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12 -18 H14 L8 -10 L14 -2 H-12 Z" fill="#e8590c"/></g><text x="64" y="66" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Mark where it</text><text x="64" y="83" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">stood</text><rect x="205" y="44" width="185" height="84" rx="10" fill="#fff" stroke="#4a7fb0" stroke-width="2"/><circle cx="223" cy="62" r="14" fill="#4a7fb0"/><text x="223" y="67" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">37</text><g transform="translate(231 100) scale(0.8)"><circle r="18" fill="#fff" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 0 V-11 M0 0 L8 5" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="259" y="66" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">Wait 20 minutes,</text><text x="259" y="83" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">longer if gut</text><text x="259" y="100" font-size="14" font-weight="bold" fill="#23261f" text-anchor="start">shot</text><rect x="10" y="136" width="185" height="84" rx="10" fill="#eef3f8" stroke="#4a7fb0" stroke-width="2"/><circle cx="28" cy="154" r="14" fill="#4a7fb0"/><text x="28" y="159" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">38</text><g transform="translate(36 192) scale(0.8)"><path d="M-14 -18 H8 L16 -10 V18 H-14 Z" fill="#fff" stroke="#2f3a2