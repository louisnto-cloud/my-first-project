ight="bold">heart: low</text><line x1="228" y1="136" x2="330" y2="184" stroke="#c0392b" stroke-width="2"/><text x="8" y="196" font-size="14" fill="#6e2c1f" text-anchor="start" font-weight="bold">liver</text><line x1="154" y1="126" x2="44" y2="184" stroke="#6e2c1f" stroke-width="2"/><text x="70" y="50" font-size="14" fill="#6b4f35" text-anchor="middle" font-weight="bold">diaphragm</text><line x1="104" y1="56" x2="174" y2="80" stroke="#6b4f35" stroke-width="2"/><text x="330" y="50" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">hump: muscle</text><line x1="296" y1="56" x2="206" y2="58" stroke="#23261f" stroke-width="2"/><text x="200" y="268" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Lungs and heart sit low, behind the front leg</text><text x="200" y="288" font-size="14" fill="#6b4f35" text-anchor="middle">Simplified, not to scale</text>
