<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 292" font-family="sans-serif" role="img" aria-label="Simplified cutaway of a moose seen from the side. The shoulder hump is muscle over the spine. The lungs fill the chest behind the front leg, the heart sits low between them, the diaphragm separates chest from belly, the liver lies just behind the diaphragm and the large rumen fills the belly. Lungs and heart sit low, behind the front leg. Not to scale.">
<rect x="0" y="0" width="400" height="292" fill="#fffaf0"/>
