<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="sans-serif" role="img" aria-label="Reading a rub. Most rubs sit 30 to 105 cm above the ground. A rub centred 75 cm or higher suggests a mature buck. Tree thickness helps too: 2.5 to 5 cm trees are often yearlings, over 10 cm is usually an older buck. The rubbed side faces where the buck came from.">
  <rect width="400" height="320" fill="#fffaf0"/>
  <text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Reading a rub</text>
  <rect x="0" y="280" width="400" height="40" fill="#dfe6d3"/>
  <rect x="90" y="50" width="18" height="230" fill="#6b4f35"/>
  <rect x="90" y="140" width="18" height="100" fill="#f1e2c0"/>
  <path d="M90 150 l18 8 M90 175 l18 -6 M90 205 l18 7 M90 230 l18 -5" stroke="#c9a36b" stroke-width="2"/>
  <rect x="270" y="50" width="34" height="230" fill="#6b4f35"/>
  <rect x="270" y="110" width="34" height="80" fill="#f1e2c0"/>
  <path d="M270 120 l34 8 M270 150 l34 -6 M270 175 l34 7" stroke="#c9a36b" stroke-width="2"/>
  <g stroke="#2f3a2b" stroke-width="2" fill="none"><path d="M40 280 V65"/><path d="M34 280 h12 M34 240 h12 M34 200 h12 M34 140 h12 M34 65 h12"/></g>
  <g font-size="14" fill="#2f3a2b" text-anchor="end"><text x="30" y="285">0</text><text x="30" y="245">30</text><text x="30" y="205">60</text><text x="30" y="145">105</text><text x="30" y="70">cm</text></g>
  <text x="120" y="200" font-size="15" fill="#2f3a2b">30 to 105 cm:</text>
  <text x="120" y="218" font-size="15" fill="#2f3a2b">most rubs</text>
  <text x="120" y="258" font-size="15" fill="#2f3a2b">2.5 to 5 cm tree:</text>
  <text x="120" y="276" font-size="15" fill="#2f3a2b">often a yearling</text>
  <text x="312" y="130" font-size="15" font-weight="bold" fill="#e8590c">75 cm +</text>
  <text x="312" y="148" font-size="15" fill="#e8590c">mature</text>
  <text x="312" y="166" font-size="15" fill="#e8590c">buck?</text>
  <text x="312" y="220" font-size="15" fill="#2f3a2b">over 10 cm</text>
  <text x="312" y="238" font-size="15" fill="#2f3a2b">tree: older</text>
  <text x="200" y="310" font-size="14" fill="#6b4f35" text-anchor="middle">Height beats tree size (60%)</text>
</svg>
