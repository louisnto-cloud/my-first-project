<text x="140" y="139" font-size="15" font-weight="bold" fill="#8a5a2b">most rubs:</text>
<text x="140" y="157" font-size="15" font-weight="bold" fill="#8a5a2b">30 to 105 cm</text>
<rect x="0" y="268" width="400" height="80" fill="#dfe6d3"/><line x1="0" y1="268" x2="400" y2="268" stroke="#a9b37f" stroke-width="2"/>
