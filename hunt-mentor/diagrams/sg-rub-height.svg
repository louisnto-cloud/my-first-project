<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 314" font-family="sans-serif" role="img" aria-label="Reading a rub, drawn to scale. Most rubs sit 30 to 105 cm above the ground. A rub centred 75 cm or higher suggests a mature buck. Tree thickness helps too: 2.5 to 5 cm trees are often yearlings, over 10 cm is usually an older buck. Height beats tree size, 60 percent. The rubbed side faces where the buck came from.">
