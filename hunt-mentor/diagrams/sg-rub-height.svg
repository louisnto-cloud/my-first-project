<text x="120" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">2.5 to 5 cm tree:</text>
<text x="120" y="307" font-size="15" fill="#2f3a2b" text-anchor="middle">often a yearling</text>
