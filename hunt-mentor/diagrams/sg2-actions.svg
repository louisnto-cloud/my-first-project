<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Three shotgun actions side by side. Pump: you slide the fore end back and forward. Semi auto: gas or recoil works the bolt for you. Over under: two barrels, it breaks open on a hinge.">
