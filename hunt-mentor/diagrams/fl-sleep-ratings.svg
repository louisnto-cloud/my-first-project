<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="Sleeping bag temperature ratings on a scale from warm to cold: Comfort, where you sleep relaxed; Limit, where you sleep curled for 8 hours; Extreme, survival only with risk of hypothermia. Buy for the Comfort number.">
  <rect x="0" y="0" width="400" height="280" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Sleeping bag ratings</text>
<rect x="30" y="120" width="340" height="30" rx="6" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="30" y="120" width="140" height="30" rx="6" fill="#8a9a6b"/><rect x="170" y="120" width="110" height="30" rx="0" fill="#e8590c"/><rect x="280" y="120" width="90" height="30" rx="6" fill="#b3261e"/>
<line x1="170" y1="100" x2="170" y2="160" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round"/>
<text x="170" y="92" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Comfort</text>
<text x="170" y="180" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">sleep relaxed</text>
<line x1="280" y1="78" x2="280" y2="182" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/>
<text x="280" y="70" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="middle">Limit</text>
<text x="280" y="202" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="middle">curled, 8 h</text>
<line x1="370" y1="100" x2="370" y2="160" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/>
<text x="370" y="92" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="end">Extreme</text>
<text x="370" y="180" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="end">survival only</text>
<text x="30" y="112" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="start">Warm</text><text x="370" y="225" font-family="sans-serif" font-size="13" fill="#23261f" text-anchor="end">Colder</text>
<text x="200" y="240" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Buy for the Comfort number (Tip)</text>
<text x="200" y="264" font-family="sans-serif" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle">Never plan on Extreme</text>
</svg>
