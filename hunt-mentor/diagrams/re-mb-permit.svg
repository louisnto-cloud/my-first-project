<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 317" role="img" aria-label="Grid: Federal permit and stamp. Migratory game bird hunting permit: $8.50. Habitat conservation stamp, on the permit: $8.50. BC prints the pair: $17.00. Expires after the date of issue: June 30. Minors, under 18: Free. Where to buy, phone copy: VERIFY." font-family="sans-serif">
<rect x="0" y="0" width="400" height="317" fill="#fffaf0"/>
<text x="200" y="26" font-size="17" font-weight="bold" fill="#23261f" text-anchor="middle">Federal permit and stamp</text>
<text x="200" y="47" font-size="14" fill="#8b5a2b" text-anchor="middle">s. 31 to 34, Schedule 2, page 8</text>
<rect x="6.0" y="69" width="124.0" height="124" rx="9" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<text x="68.0" y="103" font-size="26" font-weight="bold" fill="#4a7fb0" text-anchor="middle">$8.50</text>
<text x="68.0" y="127" font-size="14" fill="#23261f" text-anchor="middle">Migratory game</text>
<text x="68.0" y="145" font-size="14" fill="#23261f" text-anchor="middle">bird hunting</text>
<text x="68.0" y="163" font-size="14" fill="#23261f" text-anchor="middle">permit</text>
<rect x="138.0" y="69" width="124.0" height="124" rx="9" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<text x="200.0" y="103" font-size="26" font-weight="bold" fill="#4a7fb0" text-anchor="middle">$8.50</text>
<text x="200.0" y="127" font-size="14" fill="#23261f" text-anchor="middle">Habitat</text>
<text x="200.0" y="145" font-size="14" fill="#23261f" text-anchor="middle">conservation</text>
<text x="200.0" y="163" font-size="14" fill="#23261f" text-anchor="middle">stamp, on the</text>
<text x="200.0" y="181" font-size="14" fill="#23261f" text-anchor="middle">permit</text>
<rect x="270.0" y="69" width="124.0" height="124" rx="9" fill="#ffffff" stroke="#8b5a2b" stroke-width="2.5"/>
<text x="332.0" y="103" font-size="26" font-weight="bold" fill="#8b5a2b" text-anchor="middle">$17.00</text>
<text x="332.0" y="127" font-size="14" fill="#23261f" text-anchor="middle">BC prints the</text>
<text x="332.0" y="145" font-size="14" fill="#23261f" text-anchor="middle">pair</text>
<rect x="6.0" y="201" width="124.0" height="106" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<text x="68.0" y="235" font-size="26" font-weight="bold" fill="#e8590c" text-anchor="middle">June 30</text>
<text x="68.0" y="259" font-size="14" fill="#23261f" text-anchor="middle">Expires after</text>
<text x="68.0" y="277" font-size="14" fill="#23261f" text-anchor="middle">the date of</text>
<text x="68.0" y="295" font-size="14" fill="#23261f" text-anchor="middle">issue</text>
<rect x="138.0" y="201" width="124.0" height="106" rx="9" fill="#ffffff" stroke="#8a9a6b" stroke-width="2.5"/>
<text x="200.0" y="235" font-size="26" font-weight="bold" fill="#8a9a6b" text-anchor="middle">Free</text>
<text x="200.0" y="259" font-size="14" fill="#23261f" text-anchor="middle">Minors, under</text>
<text x="200.0" y="277" font-size="14" fill="#23261f" text-anchor="middle">18</text>
<rect x="270.0" y="201" width="124.0" height="106" rx="9" fill="#ffffff" stroke="#c92a2a" stroke-width="2.5"/>
<text x="332.0" y="235" font-size="26" font-weight="bold" fill="#c92a2a" text-anchor="middle">VERIFY</text>
<text x="332.0" y="259" font-size="14" fill="#23261f" text-anchor="middle">Where to buy,</text>
<text x="332.0" y="277" font-size="14" fill="#23261f" text-anchor="middle">phone copy</text>
