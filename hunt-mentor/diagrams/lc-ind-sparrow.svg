<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 401" font-family="sans-serif" role="img" aria-label="Timeline. 1982: section 35 of the Constitution Act recognizes and affirms existing Aboriginal and treaty rights, 99 percent. 1990: in Sparrow, the Supreme Court of Canada agreed the Musqueam held an Aboriginal right to fish for food, social and ceremonial purposes, 80 percent. The test: government may limit a right only with a valid objective such as conservation, as little infringement as possible, consultation, and the Crown&#x27;s fiduciary duty, 80 percent.">
<rect x="0" y="0" width="400" height="401" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Section 35 and the Sparrow case</text><line x1="40" y1="60" x2="40" y2="300" stroke="#8a9a6b" stroke-width="4"/><circle cx="40" cy="70" r="9" fill="#e8590c"/><text x="60" y="76" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">1982</text><text x="60" y="98" font-size="15" fill="#23261f" text-anchor="start">Section 35: existing Aboriginal and</text><text x="60" y="117" font-size="15" fill="#23261f" text-anchor="start">treaty rights recognized and affirmed</text><text x="60" y="140" font-size="13" fill="#6b4f35" text-anchor="start">99%</text><circle cx="40" cy="174" r="9" fill="#e8590c"/><text x="60" y="180" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">1990</text><text x="60" y="202" font-size="15" fill="#23261f" text-anchor="start">Sparrow: Musqueam right to fish for</text><text x="60" y="221" font-size="15" fill="#23261f" text-anchor="start">food, social and ceremonial purposes</text><text x="60" y="244" font-size="13" fill="#6b4f35" text-anchor="start">80%</text><circle cx="40" cy="278" r="9" fill="#e8590c"/><text x="60" y="284" font-size="17" font-weight="bold" fill="#e8590c" text-anchor="start">Test</text><text x="60" y="306" font-size="15" fill="#23261f" text-anchor="start">Limits need a valid goal like</text><text x="60" y="325" font-size="15" fill="#23261f" text-anchor="start">conservation, least harm, consultation,</text><text x="60" y="344" font-size="15" fill="#23261f" text-anchor="start">and the Crown&#x27;s duty</text><text x="60" y="367" font-size="13" fill="#6b4f35" text-anchor="start">80%</text>
</svg>
