<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Buck or doe from urine in snow, hunter lore 60 percent. A doe squats, so the yellow stain sits behind the hind prints. A buck dribbles while walking, so the stain sits between or ahead of the hind prints. Travel is up the page.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Urine in snow: doe or buck?</text>
  <rect x="10" y="42" width="185" height="190" rx="10" fill="#eef2f6"/>
  <rect x="205" y="42" width="185" height="190" rx="10" fill="#eef2f6"/>
  <g fill="#6b4f35">
    <g transform="translate(80 100) scale(.8)"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><g transform="translate(125 100) scale(.8)"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g>
    <g transform="translate(275 100) scale(.8)"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><g transform="translate(320 100) scale(.8)"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g>
    <g transform="translate(285 175) scale(.8)"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g><g transform="translate(320 205) scale(.8)"><path d="M-2 -20 C-9 -16 -13 -2 -12 12 C-11 19 -3 20 -2 14 Z"/><path d="M2 -20 C9 -16 13 -2 12 12 C11 19 3 20 2 14 Z"/></g>
  </g>
  <ellipse cx="102" cy="160" rx="24" ry="16" fill="#e0c341" opacity=".8"/>
  <g fill="#e0c341" opacity=".85"><ellipse cx="298" cy="65" rx="6" ry="4"/><ellipse cx="297" cy="100" rx="6" ry="4"/><ellipse cx="300" cy="140" rx="6" ry="4"/><ellipse cx="302" cy="160" rx="5" ry="3"/></g>
  <path d="M30 210 V150" stroke="#e8590c" stroke-width="3"/><path d="M30 142 l-7 12 h14 Z" fill="#e8590c"/>
  <text x="102" y="258" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Doe</text>
  <text x="102" y="280" font-size="14" fill="#2f3a2b" text-anchor="middle">squats: stain behind</text>
  <text x="297" y="258" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Buck</text>
  <text x="297" y="280" font-size="14" fill="#2f3a2b" text-anchor="middle">dribbles: between, ahead</text>
</svg>
