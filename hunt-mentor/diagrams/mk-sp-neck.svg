<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 346" font-family="sans-serif" role="img" aria-label="Neck and head shots: the target size. Brain: small, moving. No. Spine in the neck: pencil sized. No. Lungs: volleyball. Yes. Hunter Ed discourages neck, head and spine shots (85%).">
<rect width="400" height="346" rx="12" fill="#EEF1EA"/>
<text x="16" y="30" font-size="18" font-weight="bold" fill="#1F3D2B">Neck and head shots: the target size</text><g data-tip="Brain|The brain is small and moving (85%)."><rect x="12" y="48" width="120" height="236" rx="10" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="72" y="76" font-size="16" font-weight="bold" fill="#17201A" text-anchor="middle">Brain</text><circle cx="72" cy="160" r="12" fill="#17201A"/><path d="M42 160 h-8 M102 160 h8" stroke="#17201A" stroke-width="2"/><path d="M48 154 l-8 6 l8 6 M96 154 l8 6 l-8 6" stroke="#17201A" stroke-width="2" fill="none"/><text x="72" y="222" font-size="14" fill="#17201A" text-anchor="middle">Small, moving</text><rect x="37" y="248" width="70" height="26" rx="13" fill="#17201A"/><text x="72" y="266" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">No</text></g><g data-tip="Spine in the neck|A pencil sized target under thick muscle and hide (85%). Miss it by a few centimetres: a wounded animal (Tip)."><rect x="140" y="48" width="120" height="236" rx="10" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="2"/><text x="200" y="76" font-size="16" font-weight="bold" fill="#17201A" text-anchor="middle">Spine in</text><text x="200" y="95" font-size="16" font-weight="bold" fill="#17201A" text-anchor="middle">the neck</text><rect x="160" y="156" width="80" height="8" rx="4" fill="#17201A"/><text x="200" y="222" font-size="14" fill="#17201A" text-anchor="middle">Pencil sized</text><rect x="165" y="248" width="70" height="26" rx="13" fill="#17201A"/><text x="200" y="266" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">No</text></g><g data-tip="Lungs|Volleyball sized. The shot to take."><rect x="268" y="48" width="120" height="236" rx="10" fill="#FFFFFF" stroke="#FF6A13" stroke-width="3.5"/><text x="328" y="76" font-size="16" font-weight="bold" fill="#17201A" text-anchor="middle">Lungs</text><circle cx="328" cy="160" r="44" fill="#e9a3a0" stroke="#b55b57" stroke-width="2"/><text x="328" y="222" font-size="14" fill="#17201A" text-anchor="middle">Volleyball</text><rect x="293" y="248" width="70" height="26" rx="13" fill="#FF6A13"/><text x="328" y="266" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Yes</text></g><text x="16" y="310" font-size="14" fill="#1F3D2B">Hunter Ed discourages neck, head and spine shots</text>
<text x="16" y="328" font-size="14" fill="#1F3D2B">(85%).</text>
</svg>
