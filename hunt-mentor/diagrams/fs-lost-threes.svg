<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Signal in threes: 3 whistle blasts, 3 fires, 3 mirror flashes or rock piles. For aircraft, a V or SOS on the ground, 3 metres or bigger.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Signal in threes</text><circle cx="70" cy="90" r="14.0" fill="#e8590c"/><text x="70" y="96" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text><circle cx="110" cy="90" r="14.0" fill="#e8590c"/><text x="110" y="96" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text><circle cx="150" cy="90" r="14.0" fill="#e8590c"/><text x="150" y="96" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text><text x="110" y="130" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3 whistle blasts</text><path d="M251 106 Q248 91 260 78 Q272 91 269 106 Z" fill="#e8590c"/><path d="M256 106 Q254 98 260 90 Q266 98 264 106 Z" fill="#f6c344"/><path d="M291 106 Q288 91 300 78 Q312 91 309 106 Z" fill="#e8590c"/><path d="M296 106 Q294 98 300 90 Q306 98 304 106 Z" fill="#f6c344"/><path d="M331 106 Q328 91 340 78 Q352 91 349 106 Z" fill="#e8590c"/><path d="M336 106 Q334 98 340 90 Q346 98 344 106 Z" fill="#f6c344"/><text x="300" y="130" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3 fires</text><path d="M60 180 L90 250 L120 180" fill="none" stroke="#e8590c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="276" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">V on the ground</text><text x="290" y="230" font-size="40" font-weight="bold" fill="#e8590c" text-anchor="middle">SOS</text><text x="290" y="276" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3 m or bigger</text>
</svg>
