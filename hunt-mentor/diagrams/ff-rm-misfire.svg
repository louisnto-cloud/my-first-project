<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Flowchart for a misfire. Click, no bang. Keep the rifle pointed safely, finger off the trigger, and wait one full minute. Then unload with great care and put the round aside. Look at the primer: a shallow dent or none means a gunsmith visit. Never look down the muzzle.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<line x1="200.0" y1="74" x2="200.0" y2="92" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round"/><path d="M196.5 84.8 L200.0 92 L203.5 84.8" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="200.0" y1="132" x2="200.0" y2="150" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round"/><path d="M196.5 142.8 L200.0 150 L203.5 142.8" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="200.0" y1="190" x2="200.0" y2="208" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round"/><path d="M196.5 200.8 L200.0 208 L203.5 200.8" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="200.0" y1="248" x2="200.0" y2="262" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round"/><path d="M196.5 254.8 L200.0 262 L203.5 254.8" fill="none" stroke="#2f3a2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="110" y="40" width="180" height="34" rx="8" fill="#f8e3cf" stroke="#2f3a2b" stroke-width="1.5"/><text x="200.0" y="62.0" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">Click, no bang</text><rect x="60" y="92" width="280" height="40" rx="8" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="1.5"/><text x="200.0" y="108.5" font-size="14" fill="#23261f" text-anchor="middle">Keep it pointed safe.</text><text x="200.0" y="125.5" font-size="14" fill="#23261f" text-anchor="middle">Finger off. Wait 1 full minute.</text><rect x="60" y="150" width="280" height="40" rx="8" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="1.5"/><text x="200.0" y="166.5" font-size="14" fill="#23261f" text-anchor="middle">Unload with great care:</text><text x="200.0" y="183.5" font-size="14" fill="#23261f" text-anchor="middle">round out, into a pocket</text><rect x="60" y="208" width="280" height="40" rx="8" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="1.5"/><text x="200.0" y="224.5" font-size="14" fill="#23261f" text-anchor="middle">Look at the primer dent.</text><text x="200.0" y="241.5" font-size="14" fill="#23261f" text-anchor="middle">Shallow or none? Gunsmith.</text><rect x="90" y="262" width="220" height="30" rx="8" fill="#2f3a2b" stroke="none" stroke-width="1.5"/><text x="200.0" y="282.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Never peer down the muzzle</text>
</svg>
