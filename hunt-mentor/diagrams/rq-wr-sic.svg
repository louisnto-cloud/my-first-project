<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 344" font-family="sans-serif" role="img" aria-label="Side view in two halves. Left, open ground with deep snow; a deer sinks in it. Right, old Douglas fir whose big crowns catch snow, so the ground beneath has only thin snow and a deer can walk and feed there (80%). Winter range orders protect this snow interception cover.">
