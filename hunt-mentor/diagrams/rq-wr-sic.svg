<rect x="0" y="210" width="150" height="30" fill="#fff" stroke="#d8dde3"/>
<text x="75" y="268" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="middle">Open: deep snow</text>
<polygon points="190,210 230,70 270,210" fill="#3d5a3a"/><rect x="226" y="210" width="8" height="30" fill="#6b4f35"/>
