<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Two halves. Left, open ground with deep snow. Right, old Douglas fir whose big crowns catch snow, so the ground beneath has only thin snow and a deer can walk and feed there. Winter range orders protect this snow interception cover.">
