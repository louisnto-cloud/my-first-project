<polygon points="330,210 370,70 410,210" fill="#3d5a3a"/><rect x="366" y="210" width="8" height="30" fill="#6b4f35"/>
<path d="M342 165 q 28 -14 56 0" stroke="#fff" stroke-width="6" fill="none"/><path d="M352 125 q 18 -10 36 0" stroke="#fff" stroke-width="5" fill="none"/>
<rect x="190" y="232" width="210" height="8" fill="#fff"/>
<text x="300" y="268" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Under old fir: thin snow</text>
<g transform="translate(300 222) scale(0.6)"><ellipse rx="20" ry="9" fill="#8b5a2b"/><circle cx="19" cy="-10" r="6.5" fill="#8b5a2b"/><rect x="-15" y="5" width="3.5" height="14" fill="#8b5a2b"/><rect x="-6" y="5" width="3.5" height="14" fill="#8b5a2b"/><rect x="7" y="5" width="3.5" height="14" fill="#8b5a2b"/><rect x="13" y="5" width="3.5" height="14" fill="#8b5a2b"/><ellipse cx="-20" cy="-2" rx="4" ry="5" fill="#f3ead8"/></g>
