<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Slam fire. Top: a bolt with a free firing pin closing on a round: safe. Bottom: a pin stuck forward in old grease sticks out of the bolt face and hits the primer as the bolt closes: the round fires without the trigger.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Slam fire: why the pin matters</text>
<text x="30.0" y="62.0" font-size="15" font-weight="bold" fill="#2E7D4F" text-anchor="start">Free pin</text><polygon points="30.0,85.0 44.0,72.0 230.0,72.0 230.0,124.0 30.0,124.0" fill="#D9DCD7" stroke="#17201A" stroke-width="1.5" stroke-linejoin="round"/><line x1="34.0" y1="100.6" x2="226.0" y2="100.6" stroke="#2E7D4F" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 4"/><rect x="208.0" y="118.0" width="20.0" height="7.0" rx="0" fill="#59625C" stroke="#17201A" stroke-width="1"/><rect x="232.0" y="91.0" width="47.6" height="14.0" rx="1.5" fill="#C9A227" stroke="#17201A" stroke-width="1.2"/><line x1="235.0" y1="91.0" x2="235.0" y2="105.0" stroke="#17201A" stroke-width="1" stroke-linecap="round"/><path d="M279.6 92.1 Q298.5 93.8 302.0 98.0 Q298.5 102.2 279.6 103.9 Z" fill="#B87333" stroke="#17201A" stroke-width="1.2"/><path d="M295.0 95.5 Q301.3 98.0 295.0 100.5" fill="#9AA0A6" stroke="#17201A" stroke-width="1"/><text x="320.0" y="102.0" font-size="14" font-weight="bold" fill="#2E7D4F" text-anchor="start">safe</text><text x="30.0" y="162.0" font-size="15" font-weight="bold" fill="#B3261E" text-anchor="start">Stuck forward</text><polygon points="30.0,185.0 44.0,172.0 230.0,172.0 230.0,224.0 30.0,224.0" fill="#D9DCD7" stroke="#17201A" stroke-width="1.5" stroke-linejoin="round"/><line x1="44.0" y1="200.6" x2="236.0" y2="200.6" stroke="#FF6A13" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 4"/><rect x="208.0" y="218.0" width="20.0" height="7.0" rx="0" fill="#59625C" stroke="#17201A" stroke-width="1"/><rect x="232.0" y="191.0" width="47.6" height="14.0" rx="1.5" fill="#C9A227" stroke="#17201A" stroke-width="1.2"/><line x1="235.0" y1="191.0" x2="235.0" y2="205.0" stroke="#17201A" stroke-width="1" stroke-linecap="round"/><path d="M279.6 192.1 Q298.5 193.8 302.0 198.0 Q298.5 202.2 279.6 203.9 Z" fill="#B87333" stroke="#17201A" stroke-width="1.2"/><path d="M295.0 195.5 Q301.3 198.0 295.0 200.5" fill="#9AA0A6" stroke="#17201A" stroke-width="1"/><polygon points="226,190 238,198 226,206 232,198" fill="#FF6A13" stroke="#17201A" stroke-width="1"/><text x="320.0" y="202.0" font-size="15" font-weight="bold" fill="#B3261E" text-anchor="start">BANG</text><text x="200.0" y="252.0" font-size="14" fill="#17201A" text-anchor="middle">Pin stuck in old grease pokes the primer</text><text x="200.0" y="272.0" font-size="14" fill="#17201A" text-anchor="middle">as the bolt slams shut.</text>
</svg>
