<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 370" font-family="sans-serif" role="img" aria-label="Seasonal road closures part 2: the rest of the 1 May to 15 November seasonal routes, all in Management Unit 6-24. Hot Lakes Road: from the start of alpine, within 10 metres of either side of the trail. Cassiar Townsite and Quartzrock Creek Access Trail: past the height of land, within 10 metres of the trail and side trails. Midway Mine Access Trail: to 400 metres from its end, Map F32. One Ace mountain mining Access Road: to 400 metres from the end of the trail and side trails.">
<rect width="400" height="370" fill="#fffaf0"/>
<text x="14" y="23" font-size="14" font-weight="bold" fill="#6b5b4b">Seasonal road closures, part 2</text>
<rect x="8" y="32" width="384" height="30" rx="6" fill="#2c5d86"/>
<text x="18" y="53" font-size="15" font-weight="bold" fill="#fffaf0" letter-spacing="1">MAY 1 TO NOV 15, ALL MU 6-24</text>
<rect x="8" y="68" width="384" height="74" rx="6" fill="#f4eedf"/>
<circle cx="41.0" cy="105.0" r="20" fill="#fffaf0" stroke="#2c5d86" stroke-width="2"/>
<g transform="translate(41.0 105.0) scale(0.8)" fill="#2c5d86" stroke="none"><path d="M-12 14 C-12 4 10 4 6 -4 C2 -10 -6 -8 -4 -14" stroke="#2c5d86" stroke-width="4" fill="none" stroke-dasharray="5 3"/></g>
