<text x="101" y="76" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">MU 6-24</text>
<text x="14" y="124" font-size="14" fill="#23261f" text-anchor="start">From the start of</text>
<text x="14" y="142" font-size="14" fill="#23261f" text-anchor="start">alpine: within 10 m of</text>
<text x="14" y="160" font-size="14" fill="#23261f" text-anchor="start">the trail</text>
<rect x="204" y="40" width="190" height="150" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
<path d="M204 50 a10 10 0 0 1 10 -10 h170 a10 10 0 0 1 10 10 v54 h-190 z" fill="#4a7fb0"/>
