<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 308" role="img" aria-label="Four cards, the rest of the 1 May to 15 November seasonal routes, all in Management Unit 6-24. Hot Lakes Road: from the start of alpine, within 10 metres of either side of the trail. Cassiar Townsite and Quartzrock Creek Access Trail: past the height of land, within 10 metres of the trail and side trails. Midway Mine Access Trail: to 400 metres from its end, Map F32. One Ace mountain mining Access Road: to 400 metres from the end of the trail and side trails." font-family="sans-serif">
<rect x="0" y="0" width="400" height="308" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Seasonal road closures, part 2</text>
