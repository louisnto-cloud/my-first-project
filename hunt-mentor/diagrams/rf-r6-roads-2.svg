<text x="78" y="110" font-size="15" fill="#2f3a2b">From the start of alpine: within 10 m of the</text>
<text x="78" y="129" font-size="15" fill="#2f3a2b">trail</text>
<circle cx="41.0" cy="191.0" r="20" fill="#fffaf0" stroke="#2c5d86" stroke-width="2"/>
<g transform="translate(41.0 191.0) scale(0.8)" fill="#2c5d86" stroke="none"><path d="M-12 14 C-12 4 10 4 6 -4 C2 -10 -6 -8 -4 -14" stroke="#2c5d86" stroke-width="4" fill="none" stroke-dasharray="5 3"/></g>
<text x="78" y="167" font-size="16" font-weight="bold" fill="#2f3a2b">Cassiar Townsite, Quartzrock Creek</text>
<text x="78" y="187" font-size="16" font-weight="bold" fill="#2f3a2b">trail</text>
<text x="78" y="206" font-size="15" fill="#2f3a2b">Past the height of land: within 10 m of the</text>
<text x="78" y="225" font-size="15" fill="#2f3a2b">trail and side trails</text>
