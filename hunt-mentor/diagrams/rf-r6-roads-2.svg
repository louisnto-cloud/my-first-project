<text x="14" y="264" font-size="14" fill="#23261f" text-anchor="start">To 400 m from its end.</text>
<text x="14" y="282" font-size="14" fill="#23261f" text-anchor="start">Map F32</text>
<rect x="204" y="198" width="190" height="96" rx="10" fill="#ffffff" stroke="#4a7fb0" stroke-width="2.5"/>
