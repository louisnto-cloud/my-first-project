<text x="78" y="282" font-size="15" fill="#2f3a2b">To 400 m from its end</text>
<circle cx="41.0" cy="324.5" r="20" fill="#fffaf0" stroke="#2c5d86" stroke-width="2"/>
<g transform="translate(41.0 324.5) scale(0.8)" fill="#2c5d86" stroke="none"><path d="M-6 -14 L-14 14 H14 L6 -14z"/><path d="M0 -12 V-6 M0 -1 V5 M0 9 V14" stroke="#fffaf0" stroke-width="2"/></g>
<text x="78" y="320" font-size="16" font-weight="bold" fill="#2f3a2b">One Ace mountain mining road</text>
