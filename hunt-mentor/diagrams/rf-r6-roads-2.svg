<text x="299" y="76" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Quartzrock Creek</text>
<text x="299" y="94" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">trail, MU 6-24</text>
<text x="212" y="124" font-size="14" fill="#23261f" text-anchor="start">Past the height of</text>
