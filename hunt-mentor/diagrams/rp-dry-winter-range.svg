<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side view of a south facing slope in winter with old Douglas fir. Three jobs: 1, the big crowns catch snow, so there is less snow under the trees; 2, the trees drop food, needles, twigs and hanging lichen; 3, the sun hits the south slope. Deer stand under the old fir.">
<rect width="400" height="300" fill="#fffaf0"/>
