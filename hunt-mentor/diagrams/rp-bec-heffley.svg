<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 305" font-family="sans-serif" role="img" aria-label="Schematic side view of the land from Heffley Creek east to Sun Peaks, about 27 km, not to scale. Zone codes read off the BC zone map at points along the way: PPxh2 Ponderosa pine very dry hot in the valley at Heffley Creek, then IDFxh2 and IDFdk2 Interior Douglas fir climbing the slope, MSdm3 Montane spruce on the plateau, IDFmw2 Interior Douglas fir moist warm in a side valley, MSdm3 again, and ESSFdc3 Engelmann spruce and subalpine fir dry cold at Sun Peaks.">
