<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Left: a hunter sits in the open with nothing behind him. Right: a hunter sits with his back against a big tree and brush in front, his outline lost in the background.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="16" y="32" font-family="sans-serif" font-size="18" fill="#2f3a2b" text-anchor="start" font-weight="bold">Sit in front of something bigger</text><rect x="0" y="60" width="400" height="190" rx="0" fill="#dfe6d3" stroke="none" stroke-width="2"/><g transform="translate(100 230) scale(1.2)"><circle cx="0" cy="-30" r="7" fill="#2f3a2b"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" fill="none"/></g><text x="100" y="285" font-family="sans-serif" font-size="14" fill="#c92a2a" text-anchor="middle" font-weight="bold">Open, nothing behind</text><rect x="270" y="80" width="40" height="170" fill="#6b4f35"/><g transform="translate(260 240) scale(1.3)"><circle cx="-14" cy="-10" r="16" fill="#6b7a4a"/><circle cx="10" cy="-16" r="18" fill="#6b7a4a"/><circle cx="24" cy="-4" r="14" fill="#6b7a4a"/><circle cx="0" cy="0" r="16" fill="#6b7a4a"/></g><g transform="translate(300 230) scale(1.2)"><circle cx="0" cy="-30" r="7" fill="#4a4030"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" stroke="#4a4030" stroke-width="4" stroke-linecap="round" fill="none"/></g><text x="300" y="285" font-family="sans-serif" font-size="14" fill="#8a9a6b" text-anchor="middle" font-weight="bold">Back to a big tree</text>
</svg>
