<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Map sketch. A refuge lake with no hunting on the left, a grain field or marsh on the right. Ducks fly from the refuge to the food at dusk and back before dawn. GPS tracked mallards made about 2 flights a day and avoided heavily hunted areas during shooting hours, 80 percent. Hunt the line between safety and food, a tip."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Hunted ducks: safe by day, food by night</text><ellipse cx="90" cy="130" rx="74" ry="50" fill="#4a7fb0" opacity=".7"/><text x="90" y="120" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">No hunting</text><text x="90" y="140" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">refuge</text><rect x="250" y="70" width="140" height="110" rx="6" fill="#d9c27a"/><text x="320" y="120" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Grain field</text><text x="320" y="140" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">or marsh</text><path d="M160 104 Q205 70 248 96" stroke="#2f3a2b" stroke-width="3" fill="none" stroke-dasharray="6 5"/><line x1="240" y1="92" x2="244.85504244572473" y2="94.91302546743484" stroke="#2f3a2b" stroke-width="3" fill="none"/><polygon points="250.0,98.0 243.7,87.2 237.5,97.5" fill="#2f3a2b"/><path d="M248 156 Q205 186 160 158" stroke="#2f3a2b" stroke-width="3" fill="none" stroke-dasharray="6 5"/><line x1="168" y1="162" x2="163.14495755427527" y2="159.08697453256516" stroke="#2f3a2b" stroke-width="3" fill="none"/><polygon points="158.0,156.0 164.3,166.8 170.5,156.5" fill="#2f3a2b"/><text x="205" y="66" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Dusk</text><text x="205" y="196" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Before dawn</text><rect x="10" y="212" width="380" height="80" rx="8" fill="#dfe6d3"/><text x="200" y="234" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">GPS mallards: about 2 flights a day,</text><text x="200" y="254" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">hide from heavy hunting in shooting hours (80%)</text><text x="200" y="276" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Hunt the line between safe and food (Tip)</text></svg>
