<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A colour spectrum from 380 to 700 nanometres with four goose cone peaks at 409 violet, 458 blue, 509 green and 580 orange, 90 percent. People have 3 cone types. Shiny faces, guns and new fabric stand out, a Tip. Waterfowl see from near ultraviolet to red, 80 percent.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Colour: 4 cone types, you have 3</text><defs><linearGradient id="mgs-colour-cones-g" x1="0" x2="1"><stop offset="0" stop-color="#7b2cbf"/><stop offset=".2" stop-color="#3a0ca3"/><stop offset=".4" stop-color="#4a7fb0"/><stop offset=".55" stop-color="#2e7d32"/><stop offset=".72" stop-color="#f9c74f"/><stop offset=".85" stop-color="#e8590c"/><stop offset="1" stop-color="#c0392b"/></linearGradient></defs><rect x="30" y="180" width="340" height="26" rx="4" fill="url(#mgs-colour-cones-g)"/><text x="30" y="224" font-size="14" fill="#23261f" text-anchor="middle">380 nm</text><text x="370" y="224" font-size="14" fill="#23261f" text-anchor="middle">700 nm</text><path d="M21 175 Q61 40 101 175" fill="#7b2cbf" opacity=".45" stroke="#7b2cbf" stroke-width="2"/><text x="60.8125" y="62" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">409</text><path d="M73 175 Q113 40 153 175" fill="#3a0ca3" opacity=".45" stroke="#3a0ca3" stroke-width="2"/><text x="112.875" y="62" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">458</text><path d="M127 175 Q167 40 207 175" fill="#2e7d32" opacity=".45" stroke="#2e7d32" stroke-width="2"/><text x="167.0625" y="62" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">509</text><path d="M202 175 Q242 40 282 175" fill="#e8590c" opacity=".45" stroke="#e8590c" stroke-width="2"/><text x="242.5" y="62" font-size="14" font-weight="bold" fill="#23261f" text-anchor="middle">580</text><text x="200" y="250" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Goose peaks: violet, blue, green, orange (90%)</text><text x="200" y="272" font-size="14" fill="#23261f" text-anchor="middle">Shiny faces, guns and new fabric pop out (Tip)</text><text x="200" y="292" font-size="14" fill="#23261f" text-anchor="middle">Waterfowl see near UV to red (80%)</text>
</svg>
