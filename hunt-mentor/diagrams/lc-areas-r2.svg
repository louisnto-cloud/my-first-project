<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 425" font-family="sans-serif" role="img" aria-label="Region 2 bar charts, average harvest a year by MU (Management Unit). Ducks: MU 2-4 Delta 10,326, MU 2-8 Mission 2,803. Black bear: 2-8 Mission 36, 2-11 35, 2-18 31. Black tailed deer: 2-16 islands 429, 2-11 Pemberton 223, 2-8 Mission 23. Mission is a duck and bear base, not a deer base. Lean.">
