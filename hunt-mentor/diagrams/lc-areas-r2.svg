<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 334" font-family="sans-serif" role="img" aria-label="Region 2 bar charts, average a year. Ducks: MU 2-4 Delta 10,326, MU 2-8 Mission 2,803. Black bear: 2-8 Mission 36, 2-11 35, 2-18 31. Black tailed deer: 2-16 islands 429, 2-11 Pemberton 223, 2-8 Mission 23. Mission is a duck and bear base, not a deer base.">
<rect x="0" y="0" width="400" height="334" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Region 2: Mission is a duck base</text><text x="14" y="52" font-size="15" font-weight="bold" fill="#4a7fb0" text-anchor="start">Ducks a year</text><text x="60" y="74" font-size="13" fill="#23261f" text-anchor="end">2-4</text><rect x="66" y="62" width="184.4" height="16" rx="3" fill="#4a7fb0"/><text x="255.39285714285714" y="74" font-size="13" font-weight="bold" fill="#23261f" text-anchor="start">10,326 Delta</text><text x="60" y="98" font-size="13" fill="#23261f" text-anchor="end">2-8</text><rect x="66" y="86" width="50.1" height="16" rx="3" fill="#4a7fb0"/><text x="121.05357142857143" y="98" font-size="13" font-weight="bold" fill="#23261f" text-anchor="start">2,803 Mission</text><text x="14" y="132" font-size="15" font-weight="bold" fill="#8b5a2b" text-anchor="start">Black bear a year</text><text x="60" y="154" font-size="13" fill="#23261f" text-anchor="end">2-8</text><rect x="66" y="142" width="180.0" height="16" rx="3" fill="#8b5a2b"/><text x="251.0" y="154" font-size="13" font-weight="bold" fill="#23261f" text-anchor="start">36 Mission</text><text x="60" y="178" font-size="13" fill="#23261f" text-anchor="end">2-11</text><rect x="66" y="166" width="175.0" height="16" rx="3" fill="#8b5a2b"/><text x="246.0" y="178" font-size="13" font-weight="bold" fill="#23261f" text-anchor="start">35</text><text x="60" y="202" font-size="13" fill="#23261f" text-anchor="end">2-18</text><rect x="66" y="190" width="155.0" height="16" rx="3" fill="#8b5a2b"/><text x="226.0" y="202" font-size="13" font-weight="bold" fill="#23261f" text-anchor="start">31</text><text x="14" y="236" font-size="15" font-weight="bold" fill="#55663f" text-anchor="start">Black tailed deer a year</text><text x="60" y="258" font-size="13" fill="#23261f" text-anchor="end">2-16</text><rect x="66" y="246" width="178.8" height="16" rx="3" fill="#8a9a6b"/><text x="249.75" y="258" font-size="13" font-weight="bold" fill="#2326