<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 296" font-family="sans-serif" role="img" aria-label="Predator sign to look for. Claw marks on trees: a bear climbed. Torn logs and dug up anthills: a bear fed. Fresh digging: bear after roots. A small scrape of needles: a cougar marked. Ravens, magpies, crows or jays circling: a carcass nearby. Hair on brush: who passed.">
<rect x="0" y="0" width="400" height="296" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Predator sign: what to look for</text>
<rect x="16" y="60" width="180" height="68" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="106" y="88" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Claw marks</text><text x="106" y="112" font-size="14" fill="#23261f" text-anchor="middle">bear climbed (85%)</text><rect x="204" y="60" width="180" height="68" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="294" y="88" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Torn logs, anthills</text><text x="294" y="112" font-size="14" fill="#23261f" text-anchor="middle">bear fed (85%)</text><rect x="16" y="136" width="180" height="68" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="106" y="164" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Fresh digging</text><text x="106" y="188" font-size="14" fill="#23261f" text-anchor="middle">bear, roots (Tip)</text><rect x="204" y="136" width="180" height="68" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="294" y="164" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Needle scrape</text><text x="294" y="188" font-size="14" fill="#23261f" text-anchor="middle">cougar marked (65%)</text><rect x="16" y="212" width="180" height="68" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="106" y="240" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Birds circling</text><text x="106" y="264" font-size="14" fill="#23261f" text-anchor="middle">carcass nearby (85%)</text><rect x="204" y="212" width="180" height="68" rx="10" fill="#fff" stroke="#dfe6d3" stroke-width="1.5"/><text x="294" y="240" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hair on brush</text><text x="294" y="264" font-size="14" fill="#23261f" text-anchor="middle">who passed (Tip)</text>
</svg>
