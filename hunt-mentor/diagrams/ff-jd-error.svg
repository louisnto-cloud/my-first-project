<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A deer with the vital zone circled. You guessed 250 m and held for 28 cm of drop, but the deer is at 300 m where the drop is 48 cm. The bullet lands 20 cm low, under the heart or in a leg.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Guess 250, it is 300: what happens</text><line x1="40" y1="90" x2="380" y2="90" stroke="#2f3a2b" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/><g transform="translate(250 56) scale(1.1)"><ellipse cx="62" cy="50" rx="44" ry="20" fill="#8b5a2b"/><path d="M28 42 L14 14 L24 10 L40 36 Z" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="12" cy="12" rx="13" ry="7" fill="#8b5a2b" transform="rotate(-20 12 12)"/><path d="M14 4 l6 -12 l4 10 Z" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="40" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="82" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="94" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><ellipse cx="104" cy="44" rx="5" ry="8" fill="#f4efe6"/></g><circle cx="296" cy="108" r="16" fill="none" stroke="#2f6e3b" stroke-width="3"/><circle cx="296" cy="134" r="6" fill="#e8590c" stroke="none" stroke-width="2"/><line x1="230" y1="196" x2="288" y2="138" stroke="#e8590c" stroke-width="2" stroke-linecap="round"/><path d="M285.4 145.6 L288 138 L280.4 140.6" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="220" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Held for 250 m (28 cm)</text><text x="110" y="239" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Real drop at 300 m: 48 cm</text><text x="110" y="258" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bullet lands 20 cm low</text><text x="200.0" y="290" font-size="14" fill="#2f3a2b" text-anchor="middle">20 cm low = under the heart or a leg hit</text>
</svg>
