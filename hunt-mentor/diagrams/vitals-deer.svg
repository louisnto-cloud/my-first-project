<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" font-family="sans-serif">
<rect x="0" y="0" width="400" height="640" fill="#fffaf0"/>
<text x="200" y="24" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Deer: where to aim</text>
<g transform="translate(0,34)"><rect x="6" y="2" width="388" height="186" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">1  Broadside</text><text x="388" y="22" font-size="14" fill="#2f3a2b" text-anchor="end">best</text><rect x="214" y="113" width="9" height="36" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="297" y="113" width="9" height="36" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><path d="M216 73 L188 59 L192 75 L208 102 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="182" cy="65" rx="15" ry="9" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M191 58 L198 45 L200 60 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><circle cx="172" cy="65" r="2.2" fill="#23261f"/><path d="M186 56 L184 34 M184 43 L175 36 M184 49 L193 38" fill="none" stroke="#6b4f35" stroke-width="3.1" stroke-linecap="round"/><ellipse cx="262" cy="96" rx="68" ry="27" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M326 86 L342 80 L338 98 Z" fill="#fffaf0" stroke="#23261f" stroke-width="2"/><rect x="221" y="113" width="9" height="36" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="306" y="113" width="9" height="36" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="235" cy="97" rx="16" ry="17" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><circle cx="228" cy="108" r="6" fill="#6b4f35" stroke="#23261f" stroke-width="1.5"/><circle cx="232" cy="105" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="227" y1="105" x2="237" y2="105" stroke="#fffaf0" stroke-width="2"/><line x1="232" y1="100" x2="232" y2="110" stroke="#fffaf0" stroke-width="2"/><text x="248" y="110" font-size="14" font-weight="bold" fill="#e8590c">aim</text><text x="16" y="166" font-size="14" fill="#23261f">Up the back of the front leg, one third up.</text><text x="16" y="183" font-size="14" fill="#23261f">Both lungs, top of the heart.</text></g>
<g transform="translate(0,228)"><rect x="6" y="2" width="388" height="186" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">2  Quartering away</text><text x="388" y="22" font-size="14" fill="#2f3a2b" text-anchor="end">good</text><rect x="235" y="107" width="8" height="32" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="245" y="109" width="8" height="32" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="201" cy="69" rx="14" ry="8" fill="#2f3a2b" stroke="#23261f" stroke-width="2.5"/><path d="M209 63 L215 51 L217 64 Z" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><circle cx="192" cy="69" r="2.0" fill="#23261f"/><path d="M204 61 L203 42 M203 50 L195 43 M203 55 L211 45" fill="none" stroke="#6b4f35" stroke-width="2.8" stroke-linecap="round"/><path d="M239 75 L209 65 L211 77 L233 100 Z" fill="#2f3a2b" stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="272" cy="96" rx="49" ry="27" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="299" cy="102" rx="21" ry="26" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><rect x="287" y="115" width="10" height="36" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="302" y="117" width="10" height="36" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="256" cy="97" rx="14" ry="16" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><line x1="271" y1="104" x2="234" y2="92" stroke="#23261f" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="234" cy="92" r="5" fill="#23261f"/><text x="230" y="114" font-size="13" fill="#23261f" text-anchor="end">far shoulder</text><circle cx="271" cy="104" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="266" y1="104" x2="276" y2="104" stroke="#fffaf0" stroke-width="2"/><line x1="271" y1="99" x2="271" y2="109" stroke="#fffaf0" stroke-width="2"/><text x="287" y="109" font-size="14" font-weight="bold" fill="#e8590c">aim</text><text x="388" y="59" font-size="13" fill="#23261f" text-anchor="end">rump toward you</text><text x="16" y="166" font-size="14" fill="#23261f">Aim farther back. Bullet exits the far shoulder.</text><text x="16" y="183" font-size="14" fill="#23261f">Picture the far front leg.</text></g>
<g transform="translate(0,422)"><rect x="6" y="2" width="388" height="186" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">3  Quartering to</text><text x="388" y="22" font-size="14" fill="#2f3a2b" text-anchor="end">experienced only</text><rect x="233" y="109" width="8" height="32" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="294" y="107" width="8" height="32" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="272" cy="96" rx="49" ry="27" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="242" cy="100" rx="18" ry="26" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M245 71 L217 61 L221 79 L243 106 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="207" cy="67" rx="18" ry="10" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M218 59 L226 44 L228 61 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><circle cx="195" cy="67" r="2.6" fill="#23261f"/><path d="M211 56 L209 31 M209 42 L199 33 M209 48 L220 36" fill="none" stroke="#6b4f35" stroke-width="3.7" stroke-linecap="round"/><rect x="242" y="115" width="10" height="36" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="302" y="113" width="9" height="36" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="257" cy="97" rx="14" ry="16" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><line x1="244" y1="100" x2="284" y2="100" stroke="#23261f" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="244" cy="100" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="239" y1="100" x2="249" y2="100" stroke="#fffaf0" stroke-width="2"/><line x1="244" y1="95" x2="244" y2="105" stroke="#fffaf0" stroke-width="2"/><text x="258" y="90" font-size="14" font-weight="bold" fill="#e8590c">aim</text><rect x="306" y="30" width="78" height="24" rx="5" fill="#e8590c"/><text x="345" y="47" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">WAIT</text><text x="16" y="166" font-size="14" fill="#23261f">Front of the near shoulder. Experienced only.</text><text x="16" y="183" font-size="14" fill="#23261f">Beginner: wait for the turn.</text></g>
<text x="200" y="634" font-size="13" fill="#6b4f35" text-anchor="middle">Shaded: lungs. Dark: heart. Orange: aim point. Not to scale.</text>
</svg>
