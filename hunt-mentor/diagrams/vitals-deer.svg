<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" font-family="sans-serif">
<rect x="0" y="0" width="400" height="620" fill="#fffaf0"/>
<text x="200" y="24" font-size="18" font-weight="bold" fill="#23261f" text-anchor="middle">Deer: where to aim</text>
<g transform="translate(0,34)"><rect x="6" y="2" width="388" height="182" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">1  Broadside: best</text><rect x="169" y="106" width="10" height="50" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="267" y="106" width="10" height="50" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><path d="M167 56 L137 34 L141 50 L159 90 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="131" cy="40" rx="20" ry="11" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M141 32 L149 18 L151 34 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><circle cx="117" cy="40" r="2.5" fill="#23261f"/><path d="M135 30 L133 6 M133 16 L123 8 M133 22 L143 10" fill="none" stroke="#6b4f35" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="225" cy="84" rx="80" ry="32" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M301 74 L317 68 L313 86 Z" fill="#fffaf0" stroke="#23261f" stroke-width="2"/><rect x="177" y="106" width="10" height="50" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="276" y="106" width="10" height="50" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="193" cy="86" rx="19" ry="20" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><circle cx="185" cy="98" r="7" fill="#6b4f35" stroke="#23261f" stroke-width="1.5"/><circle cx="190" cy="95" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="185" y1="95" x2="195" y2="95" stroke="#fffaf0" stroke-width="2"/><line x1="190" y1="90" x2="190" y2="100" stroke="#fffaf0" stroke-width="2"/><text x="206" y="100" font-size="14" font-weight="bold" fill="#e8590c">aim</text><text x="16" y="160" font-size="14" fill="#23261f">Up the back of the front leg, one third up.</text><text x="16" y="177" font-size="14" fill="#23261f">Both lungs, top of the heart.</text></g>
<g transform="translate(0,222)"><rect x="6" y="2" width="388" height="182" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">2  Quartering away: good</text><rect x="192" y="100" width="9" height="45" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="203" y="102" width="9" height="45" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="151" cy="44" rx="17" ry="9" fill="#2f3a2b" stroke="#23261f" stroke-width="2.5"/><path d="M160 37 L167 25 L168 39 Z" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><circle cx="140" cy="44" r="2.1" fill="#23261f"/><path d="M155 36 L153 15 M153 24 L145 17 M153 29 L162 18" fill="none" stroke="#6b4f35" stroke-width="3.0" stroke-linecap="round"/><path d="M193 58 L159 40 L161 52 L187 88 Z" fill="#2f3a2b" stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="235" cy="84" rx="58" ry="32" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="267" cy="90" rx="24" ry="30" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><rect x="252" y="108" width="11" height="50" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="271" y="110" width="11" height="50" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="217" cy="86" rx="16" ry="19" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><line x1="234" y1="93" x2="190" y2="79" stroke="#23261f" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="190" cy="79" r="5" fill="#23261f"/><text x="184" y="69" font-size="13" fill="#23261f" text-anchor="end">far shoulder</text><circle cx="234" cy="93" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="229" y1="93" x2="239" y2="93" stroke="#fffaf0" stroke-width="2"/><line x1="234" y1="88" x2="234" y2="98" stroke="#fffaf0" stroke-width="2"/><text x="250" y="98" font-size="14" font-weight="bold" fill="#e8590c">aim</text><text x="297" y="124" font-size="13" fill="#23261f">rump near you</text><text x="16" y="160" font-size="14" fill="#23261f">Aim farther back. Bullet exits the far shoulder.</text><text x="16" y="177" font-size="14" fill="#23261f">Picture the far front leg.</text></g>
<g transform="translate(0,410)"><rect x="6" y="2" width="388" height="182" rx="8" fill="#fffaf0" stroke="#8a9a6b" stroke-width="1.5"/><text x="16" y="22" font-size="16" font-weight="bold" fill="#23261f">3  Quartering to: experienced only</text><rect x="189" y="102" width="9" height="45" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><rect x="261" y="100" width="9" height="45" rx="4" fill="#2f3a2b" stroke="#23261f" stroke-width="2"/><ellipse cx="235" cy="84" rx="58" ry="32" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><ellipse cx="199" cy="88" rx="21" ry="30" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M203 54 L169 30 L173 48 L200 94 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="159" cy="36" rx="23" ry="13" fill="#8a9a6b" stroke="#23261f" stroke-width="2.5"/><path d="M171 27 L180 11 L182 29 Z" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><circle cx="143" cy="36" r="2.9" fill="#23261f"/><path d="M164 24 L162 -3 M162 8 L150 -1 M162 15 L173 2" fill="none" stroke="#6b4f35" stroke-width="4.0" stroke-linecap="round"/><rect x="199" y="108" width="11" height="50" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><rect x="271" y="106" width="10" height="50" rx="4" fill="#8a9a6b" stroke="#23261f" stroke-width="2"/><ellipse cx="218" cy="86" rx="16" ry="19" fill="#e8590c" fill-opacity="0.35" stroke="#e8590c" stroke-width="1.5"/><line x1="202" y1="89" x2="249" y2="89" stroke="#23261f" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="202" cy="89" r="8" fill="#e8590c" stroke="#23261f" stroke-width="2"/><line x1="197" y1="89" x2="207" y2="89" stroke="#fffaf0" stroke-width="2"/><line x1="202" y1="84" x2="202" y2="94" stroke="#fffaf0" stroke-width="2"/><text x="216" y="79" font-size="14" font-weight="bold" fill="#e8590c">aim</text><text x="297" y="124" font-size="13" fill="#23261f">chest near you</text><rect x="300" y="30" width="84" height="24" rx="5" fill="#e8590c"/><text x="342" y="47" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">WAIT</text><text x="16" y="160" font-size="14" fill="#23261f">Front of the near shoulder. Experienced only.</text><text x="16" y="177" font-size="14" fill="#23261f">Beginner: wait for the turn.</text></g>
<text x="200" y="612" font-size="13" fill="#6b4f35" text-anchor="middle">Shaded: lungs. Dark circle: heart. Orange dot: aim point. Not to scale.</text>
</svg>
