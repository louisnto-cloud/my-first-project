<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" font-family="sans-serif" role="img" aria-label="Deer, broadside, a male with antlers, drawn as a field guide plate with the shoulder blade, lungs, heart and paunch shown through the body. Aim up the back of the front leg, one third up the chest: both lungs, top of the heart. A dashed circle marks the vital zone with margin, about 20 to 25 centimetres, 8 to 10 inches. Three steps: broadside and standing, near leg forward, aim. Below, three top views: broadside is best; quartering away is good, the bullet exits the far shoulder; quartering to is for experienced hunters only, beginners wait.">
  <defs>
    <g id="vitals-deer-top">
      <ellipse cx="0" cy="0" rx="30" ry="11" fill="#a87b52" stroke="#5a3e26" stroke-width="1.4"/>
      <path d="M-26 -4 L-38 -3 L-38 3 L-26 4z" fill="#a87b52" stroke="#5a3e26" stroke-width="1.2"/>
      <ellipse cx="-44" cy="0" rx="7" ry="5" fill="#8f6744" stroke="#5a3e26" stroke-width="1.2"/>
      <ellipse cx="-41" cy="-6" rx="3" ry="2" fill="#8f6744"/><ellipse cx="-41" cy="6" rx="3" ry="2" fill="#8f6744"/>
      <ellipse cx="29" cy="0" rx="4" ry="3" fill="#f3ead8"/>
      <ellipse cx="-12" cy="0" rx="11" ry="8" fill="#e9a3a0" fill-opacity=".85"/>
    </g>
  </defs>
  <rect width="400" height="600" fill="#fffaf0"/>
  <text x="200" y="26" font-size="19" font-weight="bold" fill="#23261f" text-anchor="middle">Deer: aim for both lungs</text>
  <g transform="translate(0 30)">
    <ellipse cx="250" cy="302" rx="120" ry="7" fill="#d8ccb2"/>
    <path d="M200 216 L212 218 L214 260 L216 298 L206 300 L204 262 L198 236z" fill="#7a5638"/>
    <path d="M290 212 L314 216 L318 248 L322 296 L312 298 L306 252 L294 230z" fill="#7a5638"/>
    <path d="M62 128 C62 122 70 116 80 112 L98 102 C104 98 112 98 116 104 C128 118 148 138 172 147 C210 143 270 145 316 149 C330 151 338 157 342 166 C344 188 340 208 330 222 L326 246 L330 296 L320 298 L316 250 C312 236 306 226 300 220 C270 228 222 230 196 222 L194 246 L196 296 L186 298 L184 250 C182 238 178 230 170 226 C158 222 150 212 148 198 C140 174 118 150 100 138 C92 136 80 134 70 134 L62 130z" fill="#a87b52" stroke="#5a3e26" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M200 220 C230 226 270 224 298 216 C290 208 250 214 200 212z" fill="#c9a37a"/>
    <path d="M104 140 C116 150 128 160 136 172 C126 168 114 158 104 148z" fill="#f3ead8"/>
    <path d="M336 160 C344 172 344 196 336 208 C332 196 332 176 336 160z" fill="#f3ead8"/>
    <path d="M340 158 C350 162 352 176 346 186 C342 178 340 168 340 158z" fill="#f3ead8" stroke="#5a3e26" stroke-width="1"/>
    <path d="M110 102 C116 86 126 76 134 72 C134 86 126 100 116 106z" fill="#a87b52" stroke="#5a3e26" stroke-width="1.4"/>
    <circle cx="90" cy="114" r="2.6" fill="#2f241a"/>
    <ellipse cx="64" cy="126" rx="3.4" ry="2.6" fill="#2f241a"/>
    <path d="M104 100 C102 80 108 62 122 50 M108 76 C98 70 94 60 96 50 M118 54 C122 44 132 40 140 40 M122 50 C118 40 118 32 122 26" fill="none" stroke="#6b4f35" stroke-width="3" stroke-linecap="round"/>
    <!-- paunch (rumen) behind the diaphragm -->
    <g data-tip="Paunch (rumen)|The rumen fills the mid belly. Never shoot behind the diaphragm (Tip). A gut hit taints meat near the wound (Tip).">
      <path d="M262 166 C290 158 322 164 326 186 C328 206 304 216 280 214 C262 212 254 196 256 182z" fill="#cdb98a" fill-opacity=".85" stroke="#8a7550" stroke-width="1.2"/>
      <path d="M258 158 C252 176 252 196 262 214" fill="none" stroke="#5a3e26" stroke-width="1.4" stroke-dasharray="4 3"/>
    </g>
    <!-- lungs -->
    <g data-tip="Lungs|Lungs fill the chest behind the shoulder: your target (85%). One bullet through both lungs is a dead animal within sight.">
      <path d="M172 158 C196 150 232 150 250 162 C258 178 246 202 222 210 C204 214 184 210 174 196 C166 184 166 168 172 158z" fill="#e9a3a0" fill-opacity=".9" stroke="#b55b57" stroke-width="1.4"/>
    </g>
    <!-- heart -->
    <g data-tip="Heart|The heart sits low in the chest, roughly level with the elbow (80%). Aim one third up, not higher, to take both lungs and the top of the heart (75%).">
      <path d="M186 198 C186 190 194 188 198 194 C202 188 210 190 208 200 C206 208 198 214 196 216 C192 212 186 206 186 198z" fill="#8e2a2a" stroke="#5e1717" stroke-width="1"/>
    </g>
    <!-- shoulder blade over the front of the lungs -->
    <g data-tip="Shoulder blade|It covers the front of the lungs. Aim tight behind it: a shot through the shoulder blade wastes meat and can deflect (85%).">
      <path d="M176 150 L210 152 L176 202 L162 196z" fill="#efe4cc" fill-opacity=".55" stroke="#5a3e26" stroke-width="1.4" stroke-dasharray="4 3"/>
    </g>
    <!-- near front leg -->
    <g data-tip="Near front leg|Wait for the near leg to step forward. It opens the chest (85%).">
      <path d="M170 226 C178 230 182 238 184 250 L186 298 L196 296 L194 246 L196 222z" fill="#fffaf0" fill-opacity=".01"/>
    </g>
    <!-- vital zone and one third guide -->
    <g data-tip="Vital zone|About 20 to 25 cm (8 to 10 in) across, with margin (75%). Your limit: the range where you hit a 15 cm (6 in) plate 9 of 10 (Tip).">
      <circle cx="202" cy="186" r="21" fill="#fffaf0" fill-opacity=".01" stroke="#2f3a2b" stroke-width="2" stroke-dasharray="4 3"/>
    </g>
    <line x1="198" y1="146" x2="198" y2="222" stroke="#fffaf0" stroke-width="1.2" stroke-dasharray="2 3"/>
    <g>
      <g stroke="#2f3a2b" stroke-width="2"><line x1="146" y1="147" x2="160" y2="147"/><line x1="146" y1="222" x2="160" y2="222"/><line x1="153" y1="147" x2="153" y2="222"/><line x1="146" y1="197" x2="160" y2="197"/></g>
      <text x="140" y="250" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="end">1/3 up</text>
      <line x1="146" y1="200" x2="130" y2="236" stroke="#2f3a2b" stroke-width="1.2"/>
    </g>
    <!-- aim point -->
    <g data-tip="Aim point|Up the back of the front leg, one third up the chest. Both lungs and the top of the heart (85%).">
      <circle cx="198" cy="196" r="8" fill="#e8590c" stroke="#fffaf0" stroke-width="2"/>
      <path d="M198 185 v22 M187 196 h22" stroke="#fffaf0" stroke-width="1.8"/>
      <line x1="204" y1="188" x2="236" y2="66" stroke="#e8590c" stroke-width="2"/>
      <rect x="204" y="34" width="72" height="32" rx="8" fill="#e8590c"/>
      <text x="240" y="57" font-size="18" font-weight="bold" fill="#fffaf0" text-anchor="middle">AIM</text>
    </g>
    <!-- labels -->
    <g font-size="16" font-weight="bold" fill="#2f3a2b">
      <line x1="244" y1="160" x2="300" y2="96" stroke="#2f3a2b" stroke-width="1.2"/><text x="302" y="94">lungs</text>
      <line x1="308" y1="176" x2="340" y2="132" stroke="#2f3a2b" stroke-width="1.2"/><text x="316" y="126">paunch</text>
      <line x1="196" y1="212" x2="232" y2="262" stroke="#2f3a2b" stroke-width="1.2"/><text x="236" y="272">heart</text>
      <line x1="170" y1="160" x2="150" y2="92" stroke="#2f3a2b" stroke-width="1.2"/><text x="150" y="68" text-anchor="middle">shoulder</text><text x="150" y="86" text-anchor="middle">blade</text>
    </g>
  </g>
  <!-- three steps -->
  <g font-size="14" fill="#23261f" text-anchor="middle">
    <g>
      <circle cx="68" cy="364" r="14" fill="#2f3a2b"/><text x="68" y="369" fill="#fffaf0" font-weight="bold" font-size="16">1</text>
      <text x="68" y="396" font-weight="bold">Broadside,</text><text x="68" y="413">standing</text>
      <circle cx="200" cy="364" r="14" fill="#2f3a2b"/><text x="200" y="369" fill="#fffaf0" font-weight="bold" font-size="16">2</text>
      <text x="200" y="396" font-weight="bold">Near leg</text><text x="200" y="413">forward</text>
    </g>
    <circle cx="332" cy="364" r="14" fill="#e8590c"/><text x="332" y="369" fill="#fffaf0" font-weight="bold" font-size="16">3</text>
    <text x="332" y="396" font-weight="bold" fill="#c2410c">Back of leg,</text><text x="332" y="413" fill="#c2410c">1/3 up</text>
    <path d="M88 364 H176 M220 364 H308" stroke="#8a9a6b" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
  <!-- angle cards, top view -->
  <g font-size="14" text-anchor="middle" fill="#2f3a2b" data-tip="Angles|Broadside is best. Quartering away: aim so the bullet exits the far shoulder (85%). Quartering to: not for your first season (Tip).">
    <rect x="12" y="430" width="120" height="132" rx="8" fill="#f2ecdd" stroke="#c9bb9c"/>
    <text x="72" y="450" font-weight="bold">Broadside</text><text x="72" y="468" fill="#2f6e3b" font-weight="bold">best</text>
    <use href="#vitals-deer-top" transform="translate(80 500)"/>
    <line x1="68" y1="550" x2="68" y2="511" stroke="#2f3a2b" stroke-width="1.8"/><line x1="68" y1="511" x2="68" y2="489" stroke="#2f3a2b" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle cx="68" cy="511" r="4" fill="#e8590c"/>
    <rect x="140" y="430" width="120" height="132" rx="8" fill="#f2ecdd" stroke="#c9bb9c"/>
    <text x="200" y="450" font-weight="bold">Quartering away</text><text x="200" y="468" fill="#2f6e3b" font-weight="bold">good</text>
    <use href="#vitals-deer-top" transform="translate(212 506) rotate(35)"/>
    <line x1="201" y1="550" x2="201" y2="511" stroke="#2f3a2b" stroke-width="1.8"/><line x1="201" y1="511" x2="201" y2="487" stroke="#2f3a2b" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle cx="201" cy="511" r="4" fill="#e8590c"/><circle cx="201" cy="487" r="3" fill="#2f3a2b"/>
    <rect x="268" y="430" width="120" height="132" rx="8" fill="#f2ecdd" stroke="#c9bb9c"/>
    <text x="328" y="450" font-weight="bold">Quartering to</text><text x="328" y="468" fill="#c0392b" font-weight="bold">beginners wait</text>
    <use href="#vitals-deer-top" transform="translate(344 492) rotate(-35)"/>
    <line x1="333" y1="550" x2="333" y2="511" stroke="#2f3a2b" stroke-width="1.8"/>
    <circle cx="333" cy="511" r="4" fill="#e8590c"/>
    <rect x="336" y="524" width="48" height="22" rx="4" fill="#c0392b"/><text x="360" y="540" fill="#fffaf0" font-weight="bold">WAIT</text>
  </g>
  <text x="200" y="586" font-size="14" fill="#5d6152" text-anchor="middle">Top views. Orange dot: bullet entry.</text>
</svg>
