<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Comparison. Bone support: the elbow sits right under the rifle, stacked on a knee or the ground, so you can relax and stay steady. Muscle support: the elbow sticks out and the arm holds the weight, so it tires and wobbles. Stack the bones, then relax.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Bone holds still. Muscle shakes.</text><rect x="14" y="44" width="180" height="200" rx="8" fill="#d8ead7" stroke="none" stroke-width="2"/><text x="104.0" y="66" font-size="15" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Bone support</text><text x="104.0" y="88" font-size="14" fill="#23261f" text-anchor="middle">elbow under the rifle</text><text x="104.0" y="106" font-size="14" fill="#23261f" text-anchor="middle">stacked on knee</text><text x="104.0" y="124" font-size="14" fill="#23261f" text-anchor="middle">or ground: relaxed</text><rect x="206" y="44" width="180" height="200" rx="8" fill="#f3d5d2" stroke="none" stroke-width="2"/><text x="296.0" y="66" font-size="15" font-weight="bold" fill="#b3261e" text-anchor="middle">Muscle support</text><text x="296.0" y="88" font-size="14" fill="#23261f" text-anchor="middle">elbow out to the side</text><text x="296.0" y="106" font-size="14" fill="#23261f" text-anchor="middle">arm holds the weight</text><text x="296.0" y="124" font-size="14" fill="#23261f" text-anchor="middle">tires and wobbles</text><line x1="104" y1="226" x2="104" y2="176" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="104" y1="176" x2="150" y2="166" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><circle cx="104" cy="228" r="6" fill="#e8590c" stroke="none" stroke-width="2"/><line x1="250" y1="200" x2="290" y2="176" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><line x1="290" y1="176" x2="336" y2="166" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><path d="M341 213 l18 18 M359 213 l-18 18" fill="none" stroke="#b3261e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="200.0" y="280" font-size="14" fill="#2f3a2b" text-anchor="middle">Stack the bones, then relax</text>
</svg>
