<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Which slope switches to upslope wind first: east faces first with the first sun; south faces strongest, peaking soon after midday; west faces peak mid afternoon; north faces are weakest and start sinking first.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="32" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Which slope flips first (75%)</text><rect x="20" y="55" width="360" height="44" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="36" y="83" font-family="sans-serif" font-size="16" fill="#8a9a6b" text-anchor="start" font-weight="bold">East face</text><text x="150" y="83" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">first sun, upslope starts first</text><rect x="20" y="110" width="360" height="44" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="36" y="138" font-family="sans-serif" font-size="16" fill="#e8590c" text-anchor="start" font-weight="bold">South face</text><text x="150" y="138" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">strongest, peaks soon after midday</text><rect x="20" y="165" width="360" height="44" rx="8" fill="#ffffff" stroke="#c92a2a" stroke-width="2"/><text x="36" y="193" font-family="sans-serif" font-size="16" fill="#c92a2a" text-anchor="start" font-weight="bold">West face</text><text x="150" y="193" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">peaks mid afternoon</text><rect x="20" y="220" width="360" height="44" rx="8" fill="#ffffff" stroke="#4a7fb0" stroke-width="2"/><text x="36" y="248" font-family="sans-serif" font-size="16" fill="#4a7fb0" text-anchor="start" font-weight="bold">North face</text><text x="150" y="248" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">weakest, shade, sinks first</text>
</svg>
