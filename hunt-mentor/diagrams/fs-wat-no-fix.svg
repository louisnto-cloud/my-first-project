<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Some water no method fixes: an algae bloom with scum or a green paint look, chemicals like a fuel sheen or farm runoff, and water from near a mine or dump. Boiling and disinfecting do not remove toxins or chemicals: find other water.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Some water no method fixes</text><rect x="30" y="50" width="340" height="56" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><line x1="55" y1="69" x2="73" y2="87" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/><line x1="73" y1="69" x2="55" y2="87" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/><text x="96" y="74" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Algae bloom</text><text x="96" y="94" font-size="14" fill="#2f3a2b" text-anchor="start">scum, green paint look</text><rect x="30" y="116" width="340" height="56" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><line x1="55" y1="135" x2="73" y2="153" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/><line x1="73" y1="135" x2="55" y2="153" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/><text x="96" y="140" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Chemicals</text><text x="96" y="160" font-size="14" fill="#2f3a2b" text-anchor="start">fuel sheen, runoff</text><rect x="30" y="182" width="340" height="56" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><line x1="55" y1="201" x2="73" y2="219" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/><line x1="73" y1="201" x2="55" y2="219" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/><text x="96" y="206" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="start">Mine or dump</text><text x="96" y="226" font-size="14" fill="#2f3a2b" text-anchor="start">stained, odd colour</text><rect x="7" y="254" width="387" height="30" rx="6" fill="#c0392b"/><text x="200" y="275" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Boiling will not fix it. Find other water</text>
</svg>
