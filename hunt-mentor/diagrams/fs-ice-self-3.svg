  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">3. Arms on, kick flat</text><rect x="0" y="130" width="400" height="30" rx="0" fill="#bfe0f2"/><rect x="150" y="130" width="100" height="170" rx="0" fill="#2f5f88"/><rect x="80" y="120" width="90" height="16" rx="6" fill="#e8590c"/><circle cx="176" cy="126" r="12.0" fill="#d9b48f"/><line x1="230" y1="150" x2="260" y2="170" stroke="#2f3a2b" stroke-width="6" stroke-linecap="round"/><text x="90" y="100" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Picks in</text><rect x="98" y="262" width="204" height="30" rx="6" fill="#2f3a2b"/><text x="200" y="283" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Flat, kick, picks in</text>
