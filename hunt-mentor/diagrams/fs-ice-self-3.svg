<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Self rescue step 3: put your arms on the solid ice, kick your legs behind you to get flat, and dig in with ice picks.">
