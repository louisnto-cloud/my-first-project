<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Halving: pick a point halfway to the deer, judge that distance, say 120 m, and double it to 240 m. Bracketing: decide the deer is more than 200 m and less than 300 m, and call it 250 m.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Halving and bracketing</text><path d="M10 250 L390 250 L320 110 L80 110 Z" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="262" r="8" fill="#2f3a2b" stroke="none" stroke-width="2"/><text x="200" y="290" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">you</text><g transform="translate(186 88) scale(0.25)"><ellipse cx="62" cy="50" rx="44" ry="20" fill="#8b5a2b"/><path d="M28 42 L14 14 L24 10 L40 36 Z" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="12" cy="12" rx="13" ry="7" fill="#8b5a2b" transform="rotate(-20 12 12)"/><path d="M14 4 l6 -12 l4 10 Z" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="40" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="82" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><rect x="94" y="60" width="7" height="44" rx="0" fill="#8b5a2b" stroke="none" stroke-width="2"/><ellipse cx="104" cy="44" rx="5" ry="8" fill="#f4efe6"/></g><line x1="200" y1="250" x2="200" y2="112" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><circle cx="200" cy="180" r="7" fill="#e8590c" stroke="none" stroke-width="2"/><text x="214" y="184" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="start">halfway: 120 m?</text><text x="214" y="204" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="start">double it: 240 m</text><text x="20" y="70" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="start">Bracket: &quot;more than 200,</text><text x="20" y="88" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="start">less than 300&quot;: call 250</text>
</svg>
