<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 322" font-family="sans-serif" role="img" aria-label="Level 4, Guide. Goal: puts others on game and keeps them safe. Law: supervising needs a hunting licence in at least 3 earlier licence years, and at most two youth or initiation hunters at once. Unpaid only: guiding for pay needs a guide licence.">
