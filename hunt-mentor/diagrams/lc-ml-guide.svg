e-width="3"/></g><text x="196" y="147" font-size="14" fill="#23261f" text-anchor="start">Licence in 3 earlier</text><text x="196" y="164" font-size="14" fill="#23261f" text-anchor="start">years: law</text><rect x="146" y="184" width="244" height="50" rx="8" fill="#fff" stroke="#6b4f35" stroke-width="1.5"/><g transform="translate(172 209) scale(0.8)"><circle cx="-9" cy="-10" r="6" fill="#2f3a2b"/><path d="M-18 16 V2 Q-9 -5 0 2 V16 Z" fill="#2f3a2b"/><circle cx="10" cy="-8" r="6" fill="#8a9a6b"/><path d="M1 18 V4 Q10 -3 19 4 V18 Z" fill="#8a9a6b"/></g><text x="196" y="205" font-size="14" fill="#23261f" text-anchor="start">Two new hunters at most:</text><text x="196" y="222" font-size="14" fill="#23261f" text-anchor="start">law</text><rect x="146" y="242" width="244" height="50" rx="8" fill="#fff" stroke="#6b4f35" stroke-width="1.5"/><g transform="translate(172 267) scale(0.8)"><circle r="18" fill="#fff" stroke="#e8590c" stroke-width="3"/><text x="0" y="8" font-size="24" font-weight="bold" fill="#2f3a2b" text-anchor="middle">$</text><line x1="-12" y1="12" x2="12" y2="-12" stroke="#e8590c" stroke-width="3.5"/></g><text x="196" y="263" font-size="14" fill="#23261f" text-anchor="start">Unpaid. Paid is guiding</text><text x="200" y="312" font-size="13" fill="#6b4f35" text-anchor="middle">Opinion: Hunt Mentor&#x27;s ladder, not a BC rank.</text>
