<rect x="41.4" y="56" width="64.0" height="24" rx="4" fill="#8b5a2b"/><text x="73.5" y="73" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">4 pt</text>
<rect x="105.5" y="56" width="94.5" height="24" rx="4" fill="#e8590c"/><text x="152.7" y="73" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">any buck</text>
<rect x="200.0" y="56" width="122.0" height="24" rx="4" fill="#8b5a2b"/><text x="261" y="73" font-size="14" font-weight="bold" fill="#fffaf0" text-anchor="middle">4 pt</text>
