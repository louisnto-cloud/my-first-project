<text x="338.7" y="18" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Dec</text>
<text x="14" y="46" font-size="17" font-weight="bold" fill="#8b5a2b">Mule deer</text>
<text x="386" y="46" font-size="14" fill="#6b5b4b" text-anchor="end">4 pt: 4 point bucks</text>
