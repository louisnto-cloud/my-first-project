<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 376" font-family="sans-serif" role="img" aria-label="Region 3 general deer seasons, MUs 3-12 to 3-20 and 3-26 to 3-44, synopsis page 34, MU 3-27 and 3-28 included (99%). Timeline September to December. Mule deer: 4 point bucks 10 to 30 September, any buck 1 to 31 October, 4 point bucks 1 November to 10 December. White tailed deer: bucks 10 September to 10 December, antlerless 10 to 31 October, bow only either sex 11 to 20 December. Antlerless mule deer: LEH draw only.">
