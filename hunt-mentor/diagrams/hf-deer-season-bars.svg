<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="sans-serif" role="img" aria-label="Region 3 general deer seasons, MUs 3-12 to 3-20 and 3-26 to 3-44, synopsis page 34, MU 3-27 and 3-28 included (99%). Timeline September to December. Mule deer: 4 point bucks 10 to 30 September, any buck 1 to 31 October, 4 point bucks 1 November to 10 December. White tailed deer: bucks 10 September to 10 December, antlerless 10 to 31 October, bow only either sex 11 to 20 December. Antlerless mule deer: LEH draw only.">
<rect width="400" height="440" fill="#fffaf0"/>
<text x="200" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Region 3 deer seasons</text>
<rect x="14.0" y="54" width="91.5" height="290" fill="#f3ecdb"/>
<text x="59.7" y="48" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Sep</text>
<rect x="105.5" y="54" width="94.5" height="290" fill="#faf5ea"/>
<text x="152.7" y="48" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Oct</text>
<rect x="200.0" y="54" width="91.5" height="290" fill="#f3ecdb"/>
<text x="245.7" y="48" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Nov</text>
<rect x="291.5" y="54" width="94.5" height="290" fill="#faf5ea"/>
<text x="338.7" y="48" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Dec</text>
<text x="14" y="76" font-size="17" font-weight="bold" fill="#8b5a2b" stroke="#fffaf0" stroke-width="3" paint-order="stroke">Mule deer</text>
<g data-tip="4 point bucks|10 to 30 September and 1 November to 10 December. At least 4 tines on one antler, not counting the brow tine."><rect x="41.4" y="84" width="64.0" height="32" rx="5" fill="#8b5a2b" stroke="#fffaf0" stroke-width="1.5"/><text x="73.5" y="105.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">4 point</text><rect x="200.0" y="84" width="122.0" height="32" rx="5" fill="#8b5a2b" stroke="#fffaf0" stroke-width="1.5"/><text x="261.0" y="105.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">4 point</text><text x="14" y="136" font-size="15" fill="#c2410c">10 to 30 Sep</text><text x="261.0" y="136" font-size="15" fill="#c2410c" text-anchor="middle">1 Nov to 10 Dec</text></g>
<g data-tip="Any buck|1 to 31 October: any mule deer buck."><rect x="105.5" y="84" width="94.5" height="32" rx="5" fill="#e8590c" stroke="#fffaf0" stroke-width="1.5"/><text x="152.7" y="105.5" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="middle">any buck</text><text x="152.7" y="136" font-size="15" fill="#c2410c" text-anchor="middle">1 to 31 Oct</text></g>
<line x1="14" y1="150" x2="386" y2="150" stroke="#d8ccb4" stroke-width="1.5"/>
<text x="14" y="174" font-size="17" font-weight="bold" fill="#5e6e46" stroke="#fffaf0" stroke-width="3" paint-order="stroke">White tailed deer</text>
<g data-tip="White tailed bucks|Open 10 September to 10 December."><text x="14" y="198" font-size="15" font-weight="bold" fill="#2f3a2b" stroke="#fffaf0" stroke-width="3" paint-order="stroke">bucks</text><text x="386" y="198" font-size="15" fill="#c2410c" text-anchor="end" stroke="#fffaf0" stroke-width="3" paint-order="stroke">10 Sep to 10 Dec</text><rect x="41.4" y="206" width="280.5" height="24" rx="5" fill="#6f7d55" stroke="#fffaf0" stroke-width="1.5"/></g>
<g data-tip="White tailed antlerless|Open 10 to 31 October in Management Units 3-27 and 3-28."><text x="14" y="248" font-size="15" font-weight="bold" fill="#2f3a2b" stroke="#fffaf0" stroke-width="3" paint-order="stroke">antlerless</text><text x="386" y="248" font-size="15" fill="#c2410c" text-anchor="end" stroke="#fffaf0" stroke-width="3" paint-order="stroke">10 to 31 Oct</text><rect x="132.9" y="256" width="67.1" height="24" rx="5" fill="#4a7fb0" stroke="#fffaf0" stroke-width="1.5"/></g>
<g data-tip="Bow only|11 to 20 December, either sex, bow only."><text x="14" y="298" font-size="15" font-weight="bold" fill="#2f3a2b" stroke="#fffaf0" stroke-width="3" paint-order="stroke">bow only, either sex</text><text x="386" y="298" font-size="15" fill="#c2410c" text-anchor="end" stroke="#fffaf0" stroke-width="3" paint-order="stroke">11 to 20 Dec</text><rect x="322.0" y="306" width="30.5" height="24" rx="5" fill="#2f3a2b" stroke="#fffaf0" stroke-width="1.5"/></g>
<g data-tip="Your Management Unit|Heffley Creek east bank is 3-27, the west bank 3-28. Map lines are approximate: check your exact spot. Page 34."><rect x="8" y="350" width="384" height="26" fill="#fffaf0"/><text x="200" y="368" font-size="15" fill="#6b5b4b" text-anchor="middle">Management Units 3-27 and 3-28 included</text></g>
<g data-tip="Limited Entry Hunting|Region 3 deer: 3 in total, only 1 a mule deer. Antlerless mule deer only by Limited Entry Hunting (LEH) draw."><rect x="8" y="382" width="384" height="52" rx="8" fill="#f6e7e2" stroke="#c0392b" stroke-width="1.4"/><text x="200" y="403" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Antlerless mule deer:</text><text x="200" y="424" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Limited Entry Hunting draw only</text></g>
</svg>
