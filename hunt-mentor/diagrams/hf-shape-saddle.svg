<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Map view of a saddle. Two peaks, each a set of closed loops, sit left and right. The lines between them pinch into an hourglass. The low point in the middle is the saddle, and a deer trail crosses the ridge there.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect x="0" y="36" width="400" height="232" fill="#dfe6d3" opacity=".6"/>
  <g fill="none" stroke="#8b5a2b" stroke-width="2.5">
    <ellipse cx="100" cy="150" rx="30" ry="22"/><ellipse cx="100" cy="150" rx="55" ry="45"/>
    <ellipse cx="300" cy="150" rx="30" ry="22"/><ellipse cx="300" cy="150" rx="55" ry="45"/>
    <path d="M200 125 C 170 85, 30 70, 30 150 C 30 230, 170 215, 200 175 C 230 215, 370 230, 370 150 C 370 70, 230 85, 200 125 Z"/>
    <path d="M200 92 C 150 50, 10 40, 10 150 C 10 260, 150 250, 200 208 C 250 250, 390 260, 390 150 C 390 40, 250 50, 200 92 Z"/>
  </g>
  <path d="M200 40 C 210 90, 190 120, 200 150 S 190 220, 205 268" fill="none" stroke="#8b5a2b" stroke-width="3" stroke-dasharray="3 6" stroke-linecap="round"/>
  <circle cx="200" cy="150" r="16" fill="#e8590c" opacity=".85"/>
  <text x="100" y="156" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Peak</text>
  <text x="300" y="156" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Peak</text>
  <text x="12" y="26" font-size="18" font-weight="bold" fill="#2f3a2b">Saddle</text>
  <text x="388" y="26" font-size="14" fill="#2f3a2b" text-anchor="end">dotted = deer trail</text>
  <text x="200" y="292" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Hourglass = low crossing point</text>
</svg>
