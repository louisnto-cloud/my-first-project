<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Four cards. About 1.7 million ducks breed in BC, 75 percent. About 65 percent of them breed in the Interior, 75 percent. Up to 8 million waterfowl migrate through the Interior, 70 percent. More than 60 percent of the world&#x27;s Barrow&#x27;s goldeneyes breed there, 70 percent. Ducks Unlimited estimates on an older survey base."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Ducks in BC: the big numbers</text><rect x="10" y="38" width="380" height="52" rx="8" fill="#f6d7b0"/><text x="22" y="61" font-size="20" fill="#e8590c" text-anchor="start" font-weight="bold">1.7 million</text><text x="22" y="82" font-size="14" fill="#2f3a2b" text-anchor="start">ducks breed in BC (75%)</text><rect x="10" y="98" width="380" height="52" rx="8" fill="#cfe0ef"/><text x="22" y="121" font-size="20" fill="#e8590c" text-anchor="start" font-weight="bold">65%</text><text x="22" y="142" font-size="14" fill="#2f3a2b" text-anchor="start">of them in the Interior (75%)</text><rect x="10" y="158" width="380" height="52" rx="8" fill="#dfe6d3"/><text x="22" y="181" font-size="20" fill="#e8590c" text-anchor="start" font-weight="bold">Up to 8 million</text><text x="22" y="202" font-size="14" fill="#2f3a2b" text-anchor="start">waterfowl pass the Interior (70%)</text><rect x="10" y="218" width="380" height="52" rx="8" fill="#eef2e6"/><text x="22" y="241" font-size="20" fill="#e8590c" text-anchor="start" font-weight="bold">Over 60%</text><text x="22" y="262" font-size="14" fill="#2f3a2b" text-anchor="start">of all Barrow&#x27;s goldeneyes (70%)</text><text x="200" y="292" font-size="14" fill="#2f3a2b" text-anchor="middle">Ducks Unlimited estimates, older survey base</text></svg>
