<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" font-family="sans-serif" role="img" aria-label="Rough timeline of which animals use a burn, years 0 to 20 after the fire. Black bear: spring grazing in the first few years. Elk: peak use about years 1 to 3. Mule deer: about years 2 to 9 as shrubs grow. Moose: about years 3 to 15 in willow and aspen, best in low and medium severity patches. Grouse: years 2 to 15. Woodpeckers: dead trees in the first few years. Based on mixed studies; varies by place.">
<rect width="400" height="310" fill="#fffaf0"/>
<text x="200.0" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Who uses a burn, by year</text><text x="120.0" y="52" font-size="14" fill="#2f3a2b" text-anchor="middle">0</text><line x1="120.0" y1="58" x2="120.0" y2="262" stroke="#dfe6d3" stroke-width="1"/><text x="133.5" y="52" font-size="14" fill="#2f3a2b" text-anchor="middle">1</text><line x1="133.5" y1="58" x2="133.5" y2="262" stroke="#dfe6d3" stroke-width="1"/><text x="147.0" y="52" font-size="14" fill="#2f3a2b" text-anchor="middle">2</text><line x1="147.0" y1="58" x2="147.0" y2="262" stroke="#dfe6d3" stroke-width="1"/><text x="187.5" y="52" font-size="14" fill="#2f3a2b" text-anchor="middle">5</text><line x1="187.5" y1="58" x2="187.5" y2="262" stroke="#dfe6d3" stroke-width="1"/><text x="255.0" y="52" font-size="14" fill="#2f3a2b" text-anchor="middle">10</text><line x1="255.0" y1="58" x2="255.0" y2="262" stroke="#dfe6d3" stroke-width="1"/><text x="322.5" y="52" font-size="14" fill="#2f3a2b" text-anchor="middle">15</text><line x1="322.5" y1="58" x2="322.5" y2="262" stroke="#dfe6d3" stroke-width="1"/><text x="390.0" y="52" font-size="14" fill="#2f3a2b" text-anchor="middle">20</text><line x1="390.0" y1="58" x2="390.0" y2="262" stroke="#dfe6d3" stroke-width="1"/><text x="112" y="84" font-size="14" fill="#2f3a2b" text-anchor="end" font-weight="bold">Black bear</text><rect x="126.75" y="70" width="47.25" height="20" rx="6" fill="#333"/><text x="112" y="116" font-size="14" fill="#2f3a2b" text-anchor="end" font-weight="bold">Elk</text><rect x="133.5" y="102" width="27.0" height="20" rx="6" fill="#8b5a2b"/><text x="112" y="148" font-size="14" fill="#2f3a2b" text-anchor="end" font-weight="bold">Mule deer</text><rect x="147.0" y="134" width="94.5" height="20" rx="6" fill="#a0703a"/><text x="112" y="180" font-size="14" fill="#2f3a2b" text-anchor="end" font-weight="bold">Moose</text><rect x="160.5" y="166" width="162.0" height="20" rx="6" fill="#4a3322"/><text x="112" y="212" font-size="14" fill="#2f3a2b" text-anchor="end" font-weight="bold">Grouse</text><rect x="147.0" y="198" width="175.5" height="20" rx="6" fill="#7a5a3a"/><text x="112" y="244" font-size="14" fill="#2f3a2b" text-anchor="end" font-weight="bold">Woodpeckers</text><rect x="124.05" y="230" width="63.45" height="20" rx="6" fill="#e8590c"/><text x="255" y="284" font-size="14" fill="#6b4f35" text-anchor="middle">years after the fire (rough shape)</text><text x="200.0" y="302" font-size="14" fill="#6b4f35" text-anchor="middle">Mixed studies, varies by place (60 to 75%)</text>
</svg>
