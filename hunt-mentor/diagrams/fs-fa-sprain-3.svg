<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Ankle sprain step 3: raise the foot above the heart, then test: can you take 4 steps? Use the walk out flowchart.">
