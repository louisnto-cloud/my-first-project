<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Reading a UTM grid. Blue grid squares are 1 kilometre each. To give a spot, read right first, the easting, then up, the northing. Below, a strip shows the 120 degrees west line: zone 10U is west, around Kamloops and Heffley Creek, zone 11U is east, around Sun Peaks and the Shuswap.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <rect x="20" y="30" width="240" height="180" fill="#dfe6d3" opacity=".6"/>
  <g stroke="#4a7fb0" stroke-width="2"><line x1="20" y1="30" x2="20" y2="210"/><line x1="100" y1="30" x2="100" y2="210"/><line x1="180" y1="30" x2="180" y2="210"/><line x1="260" y1="30" x2="260" y2="210"/>
  <line x1="20" y1="30" x2="260" y2="30"/><line x1="20" y1="90" x2="260" y2="90"/><line x1="20" y1="150" x2="260" y2="150"/><line x1="20" y1="210" x2="260" y2="210"/></g>
  <circle cx="140" cy="110" r="8" fill="#e8590c"/>
  <path d="M100 196 L140 196" stroke="#e8590c" stroke-width="4"/><polygon points="140,189 140,203 152,196" fill="#e8590c"/>
  <path d="M140 196 L140 124" stroke="#e8590c" stroke-width="4" stroke-dasharray="6 4"/><polygon points="133,126 147,126 140,116" fill="#e8590c"/>
  <text x="104" y="186" font-size="14" font-weight="bold" fill="#e8590c">1 right</text>
  <text x="146" y="160" font-size="14" font-weight="bold" fill="#e8590c">2 up</text>
  <text x="140" y="24" font-size="14" fill="#4a7fb0" text-anchor="middle">each square 1 km</text>
  <text x="272" y="60" font-size="16" font-weight="bold" fill="#2f3a2b">Read right,</text>
  <text x="272" y="80" font-size="16" font-weight="bold" fill="#2f3a2b">then up</text>
  <text x="272" y="110" font-size="14" fill="#2f3a2b">Easting first,</text>
  <text x="272" y="128" font-size="14" fill="#2f3a2b">northing second</text>
  <rect x="20" y="236" width="180" height="50" fill="#8a9a6b"/><rect x="200" y="236" width="180" height="50" fill="#c9b79c"/>
  <line x1="200" y1="228" x2="200" y2="294" stroke="#c0392b" stroke-width="3"/>
  <text x="110" y="258" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Zone 10U</text>
  <text x="110" y="278" font-size="14" fill="#fff" text-anchor="middle">Kamloops, Heffley</text>
  <text x="290" y="258" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Zone 11U</text>
  <text x="290" y="278" font-size="14" fill="#2f3a2b" text-anchor="middle">Sun Peaks, Shuswap</text>
  <text x="206" y="226" font-size="14" fill="#c0392b">120 degrees west</text>
</svg>
