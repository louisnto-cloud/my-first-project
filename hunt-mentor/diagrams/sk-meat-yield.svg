<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Bar chart of meat yield. Average deer: 49 kg field dressed gives 24 kg of boneless meat. Average buck: 59 kg gives 28 kg. Large bull moose: about 430 kg field dressed gives about 225 kg boneless. Deer yield is about 48 percent of field dressed weight.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" text-anchor="middle" fill="#23261f">How much meat comes home</text><text x="20" y="52" font-size="14" font-weight="bold" fill="#2f3a2b">Deer (scale 0 to 60 kg)</text><text x="114" y="88" font-size="14" font-weight="bold" text-anchor="end" fill="#23261f">Deer, avg</text><rect x="120" y="64" width="186.2" height="18" fill="#8a9a6b"/><rect x="120" y="84" width="91.19999999999999" height="18" fill="#e8590c"/><text x="310.2" y="78" font-size="13" font-weight="bold" fill="#23261f">49 kg</text><text x="215.2" y="98" font-size="13" font-weight="bold" fill="#e8590c">24 kg</text><text x="114" y="134" font-size="14" font-weight="bold" text-anchor="end" fill="#23261f">Buck, avg</text><rect x="120" y="110" width="224.2" height="18" fill="#8a9a6b"/><rect x="120" y="130" width="106.39999999999998" height="18" fill="#e8590c"/><text x="348.2" y="124" font-size="13" font-weight="bold" fill="#23261f">59 kg</text><text x="230.39999999999998" y="144" font-size="13" font-weight="bold" fill="#e8590c">28 kg</text><text x="20" y="178" font-size="14" font-weight="bold" fill="#2f3a2b">Bull moose (scale 0 to 450 kg)</text><text x="114" y="214" font-size="14" font-weight="bold" text-anchor="end" fill="#23261f">Large bull</text><rect x="120" y="190" width="249.39999999999998" height="18" fill="#8a9a6b"/><rect x="120" y="210" width="130.5" height="18" fill="#e8590c"/><text x="365.4" y="204" font-size="13" font-weight="bold" text-anchor="end" fill="#fff">430 kg</text><text x="254.5" y="224" font-size="13" font-weight="bold" fill="#e8590c">225 kg (65%)</text><rect x="20" y="250" width="16" height="12" fill="#8a9a6b"/><text x="42" y="261" font-size="13" fill="#23261f">field dressed</text><rect x="150" y="250" width="16" height="12" fill="#e8590c"/><text x="172" y="261" font-size="13" fill="#23261f">boneless meat</text><text x="200" y="288" font-size="14" text-anchor="middle" fill="#2f3a2b">Deer: about 48% of field dressed weight</text>
</svg>
