<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 428" role="img" aria-label="Six silent hand signals to agree with your partner: flat hand up means stop and freeze, a point means game that way, a circling wave means come to me, palm pushed down means get down, thumb up means I see you and all good, crossed arms means done or unloaded. These are suggestions to agree on, not a standard.">
  <rect x="0" y="0" width="400" height="428" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Silent hand signals (agree them first)</text>
<rect x="10.0" y="50" width="185.0" height="106" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="90.5" y="58.099999999999994" width="24" height="34" rx="8" fill="#e9c9a8" stroke="#6b4f35" stroke-width="2"/><line x1="102.5" y1="92.1" x2="102.5" y2="108.1" stroke="#2f3a2b" stroke-width="8" stroke-linecap="round"/>
<text x="102.5" y="126" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Flat hand up</text>
<text x="102.5" y="145" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">stop, freeze</text>
<rect x="205.0" y="50" width="185.0" height="106" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="271.5" y="78.1" width="30" height="22" rx="8" fill="#e9c9a8" stroke="#6b4f35" stroke-width="2"/><line x1="301.5" y1="86.1" x2="327.5" y2="86.1" stroke="#e9c9a8" stroke-width="7" stroke-linecap="round"/><line x1="327.5" y1="72.1" x2="337.5" y2="72.1" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="337.5,72.1 332.1,74.7 332.1,69.5" fill="#e8590c"/>
<text x="297.5" y="126" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Point</text>
<text x="297.5" y="145" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">game, that way</text>
<rect x="10.0" y="166" width="185.0" height="106" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="90.5" y="180.1" width="24" height="30" rx="8" fill="#e9c9a8" stroke="#6b4f35" stroke-width="2"/><path d="M72.5 180.1 q-10 20 0 40" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M132.5 180.1 q10 20 0 40" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="102.5" y="242" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wave in</text>
<text x="102.5" y="261" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">come to me</text>
<rect x="205.0" y="166" width="185.0" height="106" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="277.5" y="190.1" width="40" height="18" rx="8" fill="#e9c9a8" stroke="#6b4f35" stroke-width="2"/><line x1="297.5" y1="210.1" x2="297.5" y2="230.1" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="297.5,230.1 294.5,223.8 300.5,223.8" fill="#e8590c"/>
<text x="297.5" y="242" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Palm down</text>
<text x="297.5" y="261" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">get low</text>
<rect x="10.0" y="282" width="185.0" height="106" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<rect x="90.5" y="310.1" width="24" height="24" rx="7" fill="#e9c9a8" stroke="#6b4f35" stroke-width="2"/><rect x="97.5" y="292.1" width="10" height="20" rx="5" fill="#e9c9a8" stroke="#6b4f35" stroke-width="2"/>
<text x="102.5" y="358" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Thumb up</text>
<text x="102.5" y="377" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">I see you, OK</text>
<rect x="205.0" y="282" width="185.0" height="106" rx="10" fill="#dfe6d3" stroke="#8a9a6b" stroke-width="2"/>
<line x1="279.5" y1="298.1" x2="315.5" y2="334.1" stroke="#e9c9a8" stroke-width="9" stroke-linecap="round"/><line x1="315.5" y1="298.1" x2="279.5" y2="334.1" stroke="#e9c9a8" stroke-width="9" stroke-linecap="round"/>
<text x="297.5" y="358" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Arms crossed</text>
<text x="297.5" y="377" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">done, unloaded</text>
<text x="200" y="416" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle">Tip: a code, not a standard. Practise it</text>
</svg>
