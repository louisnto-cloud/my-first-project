<text x="96" y="233" font-size="15" font-weight="bold" fill="#2f3a2b" stroke="#fffaf0" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">about 3 km (2 mi)</text>
<text x="16" y="270" font-size="16" font-weight="bold" fill="#2f3a2b">Missouri mallards, most moves</text>
<path d="M136.0 274 V304" stroke="#d8d0bc" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M256.0 274 V304" stroke="#d8d0bc" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="16.0" y="276" width="312.0" height="26" rx="4" fill="#2f3a2b"/>
<text x="320" y="295" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="end">under 13 km (8 mi)</text>
<text x="16" y="322" font-size="14" fill="#8b5a2b">Link and others 2011 (85%).</text>
<text x="16" y="341" font-size="14" fill="#8b5a2b">Ducks Unlimited satellite tracking (65%).</text>
