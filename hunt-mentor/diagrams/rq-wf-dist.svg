<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 358" font-family="sans-serif" role="img" aria-label="Bar chart on a real kilometre scale, 0 to 15 km, of how far ducks commute each day. Louisiana mallards move 3.1 to 15 kilometres between day and night sites, Link and others 2011, 85 percent. Missouri mallards: average local move about 3 kilometres (2 miles); most moves are under 13 kilometres (8 miles), Ducks Unlimited satellite tracking, 65 percent.">
<rect width="400" height="358" fill="#fffaf0"/>
<text x="200" y="28" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">How far ducks commute each day</text>
<path d="M16.0 70 v8" stroke="#6b5b4b" stroke-width="1.4"/>
<path d="M40.0 70 v4" stroke="#6b5b4b" stroke-width="1.4"/>
