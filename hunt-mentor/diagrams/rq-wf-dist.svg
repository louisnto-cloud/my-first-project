<path d="M232.0 70 v4" stroke="#6b5b4b" stroke-width="1.4"/>
<path d="M256.0 70 v8" stroke="#6b5b4b" stroke-width="1.4"/>
<path d="M280.0 70 v4" stroke="#6b5b4b" stroke-width="1.4"/>
<path d="M304.0 70 v4" stroke="#6b5b4b" stroke-width="1.4"/>
<path d="M328.0 70 v4" stroke="#6b5b4b" stroke-width="1.4"/>
<path d="M352.0 70 v4" stroke="#6b5b4b" stroke-width="1.4"/>
<path d="M376.0 70 v8" stroke="#6b5b4b" stroke-width="1.4"/>
<text x="16" y="64" font-size="14" font-weight="bold" fill="#6b5b4b">0 km</text>
<text x="136" y="64" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">5 km</text>
<text x="256" y="64" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="middle">10 km</text>
<text x="376" y="64" font-size="14" font-weight="bold" fill="#6b5b4b" text-anchor="end">15 km</text>
<path d="M16.0 70 H376.0" stroke="#6b5b4b" stroke-width="1.4"/>
<text x="16" y="108" font-size="16" font-weight="bold" fill="#2f3a2b">Louisiana mallards</text>
<text x="16" y="128" font-size="14" fill="#6b5b4b">Day sites to night sites</text>
<path d="M136.0 131 V161" stroke="#d8d0bc" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M256.0 131 V161" stroke="#d8d0bc" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="90.4" y="133" width="285.6" height="26" rx="4" fill="#e8590c"/>
<text x="368" y="152" font-size="15" font-weight="bold" fill="#fffaf0" text-anchor="end">3.1 to 15 km</text>
<text x="16" y="189" font-size="16" font-weight="bold" fill="#2f3a2b">Missouri mallards, average</text>
<text x="16" y="209" font-size="14" fill="#6b5b4b">Local move</text>
<path d="M136.0 212 V242" stroke="#d8d0bc" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M256.0 212 V242" stroke="#d8d0bc" stroke-width="1" stroke-dasharray="3 3"/>
