<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Decision chart, labelled as a tip. Permission on a field edge? Yes: sit a stand on the trail at dawn and dusk. If no, thick Crown land bottoms or creek brush? Yes: still hunt midday with the wind in your face. If no, open slopes you can glass? Yes: glass at first light, then stalk. From late October to mid November add grunts and rattling." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="20" font-size="17" fill="#23261f" text-anchor="middle" font-weight="bold">Which method today? (Tip)</text><rect x="10" y="36" width="176" height="50" rx="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2.5"/><text x="98.0" y="58.0" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Permission on a</text><text x="98.0" y="76.0" font-size="14" fill="#23261f" text-anchor="middle">field edge?</text><rect x="220" y="36" width="170" height="50" rx="10" fill="#fbe3d4" stroke="#e8590c" stroke-width="2.5"/><text x="305.0" y="58.0" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Stand on the trail,</text><text x="305.0" y="76.0" font-size="14" fill="#23261f" text-anchor="middle">dawn and dusk</text><rect x="10" y="112" width="176" height="50" rx="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2.5"/><text x="98.0" y="134.0" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Thick Crown bottoms</text><text x="98.0" y="152.0" font-size="14" fill="#23261f" text-anchor="middle">or creek brush?</text><rect x="220" y="112" width="170" height="50" rx="10" fill="#fbe3d4" stroke="#e8590c" stroke-width="2.5"/><text x="305.0" y="134.0" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Still hunt midday,</text><text x="305.0" y="152.0" font-size="14" fill="#23261f" text-anchor="middle">wind in your face</text><rect x="10" y="188" width="176" height="50" rx="10" fill="#fffaf0" stroke="#2f3a2b" stroke-width="2.5"/><text x="98.0" y="210.0" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Open slopes you</text><text x="98.0" y="228.0" font-size="14" fill="#23261f" text-anchor="middle">can glass?</text><rect x="220" y="188" width="170" height="50" rx="10" fill="#fbe3d4" stroke="#e8590c" stroke-width="2.5"/><text x="305.0" y="210.0" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Glass first light,</text><text x="305.0" y="228.0" font-size="14" fill="#23261f" text-anchor="middle">then stalk</text><line x1="188" y1="61" x2="216" y2="61" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="216.0,61.0 207.9,64.9 207.9,57.1" fill="#e8590c"/><line x1="188" y1="137" x2="216" y2="137" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="216.0,137.0 207.9,140.9 207.9,133.1" fill="#e8590c"/><line x1="188" y1="213" x2="216" y2="213" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="216.0,213.0 207.9,216.9 207.9,209.1" fill="#e8590c"/><text x="202" y="54" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">yes</text><text x="202" y="130" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">yes</text><text x="202" y="206" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">yes</text><line x1="98" y1="86" x2="98" y2="108" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round"/><polygon points="98.0,108.0 94.1,99.9 101.9,99.9" fill="#8a9a6b"/><line x1="98" y1="162" x2="98" y2="184" stroke="#8a9a6b" stroke-width="3" stroke-linecap="round"/><polygon points="98.0,184.0 94.1,175.9 101.9,175.9" fill="#8a9a6b"/><text x="108" y="102" font-size="14" fill="#6b4f35" text-anchor="start" font-weight="bold">no</text><text x="108" y="178" font-size="14" fill="#6b4f35" text-anchor="start" font-weight="bold">no</text><rect x="10" y="250" width="380" height="40" rx="10" fill="#e9dcc2" stroke="#6b4f35" stroke-width="2"/><text x="200" y="276" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Late Oct to mid Nov: add grunts and rattling</text>
</svg>
