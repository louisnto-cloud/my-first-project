<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Worked example: from the truck to a bench 3 kilometres away and 400 metres higher, off trail. 3 km at 4 km an hour is 45 minutes, plus 400 m of climb at 600 m an hour is 40 minutes: about 1 hour 25 minutes.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="32" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Example: truck to a bench</text><g transform="translate(50 260)"><rect x="-22" y="-14" width="30" height="14" fill="#2f3a2b"/><path d="M8 -14 h10 l6 7 v7 h-16 Z" fill="#2f3a2b"/><circle cx="-12" cy="2" r="5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/><circle cx="14" cy="2" r="5" fill="#fffaf0" stroke="#2f3a2b" stroke-width="3"/></g><circle cx="340" cy="80" r="9" fill="#e8590c" stroke="none" stroke-width="2"/><text x="340" y="62" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Bench</text><path d="M60 250 C 120 230, 170 200, 220 160 C 260 130, 300 100, 335 85" fill="none" stroke="#e8590c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><rect x="150" y="210" width="236" height="84" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="160" y="232" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">3 km ÷ 4 km/h = 45 min</text><text x="160" y="252" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">400 m ÷ 600 m/h = 40 min</text><text x="160" y="276" font-family="sans-serif" font-size="15" fill="#e8590c" text-anchor="start" font-weight="bold">About 1 h 25 min</text><text x="20" y="120" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">3 km off trail</text><text x="20" y="138" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">400 m climb</text>
</svg>
