<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="A field care clock. At 0 minutes: cancel the licence and photograph it. At 5 minutes: gloves on, plan the cuts around the evidence of sex. By 1 hour: guts out or meat off. By 2 hours: shade, moving air, game bags. Same day: meat below 4 degrees Celsius. Clean, cool, dry.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="26" font-size="19" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Field care clock</text><line x1="60" y1="150" x2="340" y2="150" stroke="#23261f" stroke-width="3"/><circle cx="60" cy="150" r="9" fill="#2f3a2b"/><circle cx="130" cy="150" r="9" fill="#2f3a2b"/><circle cx="200" cy="150" r="9" fill="#e8590c"/><circle cx="270" cy="150" r="9" fill="#2f3a2b"/><circle cx="340" cy="150" r="9" fill="#e8590c"/><text x="60" y="110" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">0 min</text><text x="60" y="130" font-size="14" fill="#23261f" text-anchor="middle">Licence, photo</text><text x="130" y="196" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">5 min</text><text x="130" y="216" font-size="14" fill="#23261f" text-anchor="middle">Gloves, plan cuts</text><text x="200" y="110" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">1 hour</text><text x="200" y="130" font-size="14" fill="#23261f" text-anchor="middle">Guts out or meat off</text><text x="270" y="196" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">2 hours</text><text x="270" y="216" font-size="14" fill="#23261f" text-anchor="middle">Shade, air, bags</text><text x="340" y="110" font-size="15" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Same day</text><text x="340" y="130" font-size="14" fill="#23261f" text-anchor="middle">Below 4°C</text><text x="200" y="286" font-size="14" fill="#6b4f35" text-anchor="middle">80 to 99%. Clean, cool, dry</text>
</svg>
