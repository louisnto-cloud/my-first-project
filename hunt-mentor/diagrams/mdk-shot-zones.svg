<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Side view of a duck with zones. Green, head, neck and spine: the bird drops at once. Light green, front of the body with heart and lungs: fast. Orange, rear of the body with the big belly air sacs and the gut: slow death, often lost. A wing hit alone: the bird swims and dives. One to two pellets in the vitals kill with the right shot size, 70 percent. Tail end hits cripple, a tip."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Where pellets kill fast, and where they cripple</text><path d="M60 160 Q56 120 110 112 L250 108 Q290 106 306 116 Q316 92 334 86 Q358 80 364 98 L378 104 L364 110 Q354 116 340 122 Q332 146 322 168 Q306 206 240 210 L120 210 Q66 204 60 160 Z" fill="#dfe6d3" stroke="#2f3a2b" stroke-width="3"/><path d="M306 116 Q316 92 334 86 Q358 80 364 98 L378 104 L364 110 Q354 116 340 122 Q332 146 322 168 L290 168 Q292 130 306 116Z" fill="#2f6e3b" opacity=".85"/><path d="M200 110 L250 108 Q290 106 306 116 Q292 130 290 168 L322 168 Q306 206 240 210 L200 210 Z" fill="#2f6e3b" opacity=".55"/><path d="M60 160 Q56 120 110 112 L200 110 L200 210 L120 210 Q66 204 60 160 Z" fill="#e8590c" opacity=".55"/><path d="M110 118 Q180 98 300 112 Q250 132 140 132 Z" fill="#d9c27a" stroke="#2f3a2b" stroke-width="2"/><line x1="150" y1="120" x2="118" y2="92" stroke="#2f3a2b" stroke-width="1.5" fill="none"/><text x="356" y="196" font-size="14" fill="#2f6e3b" text-anchor="middle" font-weight="bold">Head, neck</text><text x="356" y="214" font-size="14" fill="#2f6e3b" text-anchor="middle" font-weight="bold">drops now</text><text x="252" y="160" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Heart, lungs</text><text x="252" y="178" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">fast</text><text x="128" y="160" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Belly sacs, gut</text><text x="128" y="178" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">slow, lost</text><text x="118" y="66" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Wing only:</text><text x="118" y="84" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">swims, dives</text><rect x="10" y="226" width="380" height="66" rx="8" fill="#2f3a2b"/><text x="200" y="250" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Front half and head: 1 to 2 pellets in the</text><text x="200" y="270" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">vitals kill, with the right size (70%)</text><text x="200" y="288" font-size="14" fill="#ffd8b5" text-anchor="middle" font-weight="bold">Tail end hits cripple (Tip)</text></svg>
