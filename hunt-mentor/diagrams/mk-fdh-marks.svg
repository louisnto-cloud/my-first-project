<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 406" font-family="sans-serif" role="img" aria-label="Field marks grid, mule deer versus white tailed deer. Antlers: mule deer Fork, then fork again; white tailed deer One main beam, single tines up. Tail: mule deer Thin, rope like, black tip; white tailed deer Wide, brown on top, flags up white. Ears: mule deer Very big; white tailed deer Smaller. Runs: mule deer Bounces on all 4 feet; white tailed deer Gallops to cover. Separate licences and separate rules (99%).">
<rect width="400" height="406" rx="12" fill="#EEF1EA"/>
<text x="16" y="30" font-size="18" font-weight="bold" fill="#1F3D2B">Field marks grid</text><rect x="12" y="44" width="184" height="30" rx="8" fill="#1F3D2B"/><text x="104" y="64" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Mule deer</text><rect x="204" y="44" width="184" height="30" rx="8" fill="#17201A"/><text x="296" y="64" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">White tailed deer</text><g data-tip="Antlers|Mule deer: Fork, then fork again. White tailed deer: One main beam, single tines up. Reliable on clear looks (85%)."><rect x="12" y="82" width="376" height="76" rx="8" fill="#FFFFFF" stroke="#C9D3C4"/><text x="200" y="102" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Antlers</text><path d="M200 110 V152" stroke="#C9D3C4" stroke-width="1.5"/><text x="104" y="128" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">Fork, then fork again</text><text x="296" y="128" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">One main beam, single</text>
<text x="296" y="147" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">tines up</text></g><g data-tip="Tail|Mule deer: Thin, rope like, black tip. White tailed deer: Wide, brown on top, flags up white. Reliable on clear looks (85%)."><rect x="12" y="166" width="376" height="76" rx="8" fill="#FFFFFF" stroke="#C9D3C4"/><text x="200" y="186" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Tail</text><path d="M200 194 V236" stroke="#C9D3C4" stroke-width="1.5"/><text x="104" y="212" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">Thin, rope like,</text>
<text x="104" y="231" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">black tip</text><text x="296" y="212" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">Wide, brown on top,</text>
<text x="296" y="231" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">flags up white</text></g><g data-tip="Ears|Mule deer: Very big. White tailed deer: Smaller. Reliable on clear looks (85%)."><rect x="12" y="250" width="376" height="57" rx="8" fill="#FFFFFF" stroke="#C9D3C4"/><text x="200" y="270" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Ears</text><path d="M200 278 V301" stroke="#C9D3C4" stroke-width="1.5"/><text x="104" y="296" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">Very big</text><text x="296" y="296" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">Smaller</text></g><g data-tip="Runs|Mule deer: Bounces on all 4 feet. White tailed deer: Gallops to cover. Reliable on clear looks (85%)."><rect x="12" y="315" width="376" height="57" rx="8" fill="#FFFFFF" stroke="#C9D3C4"/><text x="200" y="335" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Runs</text><path d="M200 343 V366" stroke="#C9D3C4" stroke-width="1.5"/><text x="104" y="361" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">Bounces on all 4 feet</text><text x="296" y="361" font-size="15" font-weight="bold" fill="#17201A" text-anchor="middle">Gallops to cover</text></g><text x="16" y="392" font-size="14" font-weight="bold" fill="#1F3D2B">Separate licences and separate rules (99%).</text>
</svg>
