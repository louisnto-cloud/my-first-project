<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Top view, labelled as a tip. A partner walks slowly through a willow bottom. A stander, in orange, sits where deer leave the cover. A red wedge from the stander toward the partner marks the no shoot zone: never shoot toward your partner." font-family="sans-serif">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="20" font-size="16" fill="#23261f" text-anchor="middle" font-weight="bold">Partner still hunt to a stander (Tip)</text><rect x="0" y="34" width="400" height="266" fill="#eef0e2"/><path d="M40 60 L300 60 L330 200 L60 220 Z" fill="#2f3a2b" opacity=".75"/><text x="150" y="100" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Willow bottom</text><path d="M60 70 C 100 120 160 150 230 180" fill="none" stroke="#2f3a2b" stroke-width="3" stroke-dasharray="6 6"/><circle cx="60" cy="60.2" r="6.3" fill="#2f3a2b"/><rect x="53.7" y="67.4" width="12.6" height="18.0" rx="3.6" fill="#2f3a2b"/><text x="60" y="50" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Partner, slow</text><circle cx="340" cy="228.0" r="7.0" fill="#e8590c"/><rect x="333.0" y="236.0" width="14.0" height="20.0" rx="4.0" fill="#e8590c"/><text x="340" y="276" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Stander</text><line x1="300" y1="205" x2="330" y2="236" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/><polygon points="330.0,236.0 321.6,232.9 327.2,227.5" fill="#8b5a2b"/><text x="300" y="238" font-size="14" fill="#8b5a2b" text-anchor="end" font-weight="bold">exit</text><path d="M340 230 L180 40 L260 40 Z" fill="#c62828" opacity=".18"/><text x="240" y="290" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold">Red: never shoot toward partner</text>
</svg>
