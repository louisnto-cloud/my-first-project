<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Five changes in October and November. Drakes are back in colour, 9 in 10 by mid November, 75 percent. Pairs form, courtship peaks October to November, 75 percent. Peak passage through the Interior in October, 60 percent. Freeze up: plateau lakes ice over and birds pack onto low valley water, 65 percent. Divers arrive: goldeneyes come with the ice, 75 percent."><rect width="400" height="300" fill="#fffaf0"/><text x="200" y="24" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">What changes in October and November</text><rect x="10" y="36" width="380" height="46" rx="8" fill="#dfe6d3"/><rect x="10" y="36" width="8" height="46" rx="3" fill="#e8590c"/><text x="28" y="56" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Drakes in colour</text><text x="28" y="75" font-size="14" fill="#2f3a2b" text-anchor="start">9 in 10 by mid November (75%)</text><rect x="10" y="88" width="380" height="46" rx="8" fill="#eef2e6"/><rect x="10" y="88" width="8" height="46" rx="3" fill="#e8590c"/><text x="28" y="108" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Pairs form</text><text x="28" y="127" font-size="14" fill="#2f3a2b" text-anchor="start">Courtship peaks Oct to Nov (75%)</text><rect x="10" y="140" width="380" height="46" rx="8" fill="#dfe6d3"/><rect x="10" y="140" width="8" height="46" rx="3" fill="#e8590c"/><text x="28" y="160" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Peak passage</text><text x="28" y="179" font-size="14" fill="#2f3a2b" text-anchor="start">Interior, October (60%)</text><rect x="10" y="192" width="380" height="46" rx="8" fill="#eef2e6"/><rect x="10" y="192" width="8" height="46" rx="3" fill="#e8590c"/><text x="28" y="212" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Freeze up</text><text x="28" y="231" font-size="14" fill="#2f3a2b" text-anchor="start">Plateau lakes ice; birds pack low (65%)</text><rect x="10" y="244" width="380" height="46" rx="8" fill="#dfe6d3"/><rect x="10" y="244" width="8" height="46" rx="3" fill="#e8590c"/><text x="28" y="264" font-size="15" fill="#2f3a2b" text-anchor="start" font-weight="bold">Divers arrive</text><text x="28" y="283" font-size="14" fill="#2f3a2b" text-anchor="start">Goldeneyes come with the ice (75%)</text></svg>
