<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 322" font-family="sans-serif" role="img" aria-label="The cold shot game: a week calendar with one shot a day, scored 1 for a hit and 0 for a miss on a 5 cm dot. Only the first shot of the day counts, no warm up, from a real field position. The deer gets your first shot, so train the first shot."><rect x="0" y="0" width="400" height="322" fill="#EEF1EA"/><text x="200" y="27" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Game 3: one cold shot a day</text><rect x="14" y="50" width="48" height="70" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="38" y="72" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Mon</text><circle cx="38" cy="98" r="12" fill="#1F3D2B"/><text x="38" y="103" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><rect x="68" y="50" width="48" height="70" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="92" y="72" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Tue</text><circle cx="92" cy="98" r="12" fill="#1F3D2B"/><text x="92" y="103" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><rect x="122" y="50" width="48" height="70" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="146" y="72" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Wed</text><circle cx="146" cy="98" r="12" fill="#FF6A13"/><text x="146" y="103" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">0</text><rect x="176" y="50" width="48" height="70" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="200" y="72" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Thu</text><circle cx="200" cy="98" r="12" fill="#1F3D2B"/><text x="200" y="103" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><rect x="230" y="50" width="48" height="70" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="254" y="72" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Fri</text><circle cx="254" cy="98" r="12" fill="#1F3D2B"/><text x="254" y="103" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><rect x="284" y="50" width="48" height="70" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="308" y="72" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Sat</text><circle cx="308" cy="98" r="12" fill="#1F3D2B"/><text x="308" y="103" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><rect x="338" y="50" width="48" height="70" rx="6" fill="#FFFFFF" stroke="#1F3D2B" stroke-width="1.5"/><text x="362" y="72" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F3D2B">Sun</text><circle cx="362" cy="98" r="12" fill="#1F3D2B"/><text x="362" y="103" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><circle cx="26" cy="155" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="160" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text><text x="42" y="160" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">First shot of the day only</text><circle cx="26" cy="181" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="186" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text><text x="42" y="186" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">No warm up, no sighters</text><circle cx="26" cy="207" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="212" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text><text x="42" y="212" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">From the field position you would use</text><circle cx="26" cy="233" r="10" fill="#1F3D2B" stroke="#FFFFFF" stroke-width="1.5"/><text x="26" y="238" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4</text><text x="42" y="238" font-size="15" font-weight="normal" text-anchor="start" fill="#17201A">Score hit or miss on a 5 cm dot</text><rect x="8" y="276" width="384" height="34" rx="9" fill="#1F3D2B"/><text x="200" y="298.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#FFFFFF">The deer gets your first shot. Train it.</text></svg>
