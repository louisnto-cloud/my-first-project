<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 282" role="img" aria-label="Bar chart of Region 7A bird seasons. Dusky grouse in the listed units: 1 September to 15 November. Spruce and ruffed grouse in all units: 1 September to 15 November. Ptarmigan in the listed units: 15 August to 28 February. Ducks, all geese, coots and common snipe in all units: 1 September to 30 November." font-family="sans-serif">
