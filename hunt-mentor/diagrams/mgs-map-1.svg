<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Hunt Map step 1, a phone map with four layers on: Private land in red, Wetlands in light blue, Duck staging and winter waters in dark blue, and Wildlife Management Areas, WMA, in teal.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="24" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Hunt Map step 1: turn on 4 layers</text><rect x="60" y="34" width="280" height="236" rx="14" fill="#e9efe1" stroke="#2f3a2b" stroke-width="3"/><rect x="80" y="80" width="110" height="80" rx="0" fill="#e4472b" opacity=".32"/><text x="135" y="125" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Private land</text><path d="M200 200 Q240 170 300 190 Q320 230 270 245 Q210 250 200 200Z" fill="#4fc3f7" opacity=".55"/><text x="260" y="220" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Wetland</text><rect x="205" y="80" width="120" height="70" rx="6" fill="#1e88e5" opacity=".45"/><text x="265" y="110" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Staging</text><text x="265" y="128" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">water</text><rect x="80" y="175" width="100" height="60" rx="0" fill="#00897b" opacity=".25"/><text x="130" y="210" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">WMA</text><rect x="60" y="34" width="280" height="28" rx="14" fill="#2f3a2b"/><rect x="60" y="48" width="280" height="14" rx="0" fill="#2f3a2b"/><text x="200" y="54" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Layers</text><text x="200" y="292" font-size="14" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Private land, Wetlands, Duck waters, WMA</text>
</svg>
