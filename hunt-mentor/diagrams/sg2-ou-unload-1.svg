<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Over under unloading step 1: safety on, push the top lever right and open fully. Ejectors throw fired hulls out and lift live shells up. Tilt the gun so hulls fly clear of your face.">
<rect width="400" height="300" fill="#EEF1EA"/>
<circle cx="24" cy="22" r="15" fill="#1F3D2B"/><text x="24" y="28" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="46" y="28" font-size="18" font-weight="bold" fill="#1F3D2B">Open fully: hulls fly</text>
<g transform="translate(-30 70) scale(1.25)"><path d="M0 16 L7 14 L92 22 L108 22 L108 38 L97 40 C88 42 81 46 75 53 L6 57 L0 57 Z" fill="#6b5a45" stroke="#17201A" stroke-width="0.7"/><path d="M0 16 L5 15 L5 57 L0 57 Z" fill="#3b4045"/><path d="M108 18 L150 18 L156 24 L156 40 L108 40 Z" fill="#a7aeb3" stroke="#17201A" stroke-width="0.7"/><path d="M100 18 L114 15 L116 18 Z" fill="#3b4045" stroke="#FF6A13" stroke-width="2.2"/><rect x="90" y="19" width="8" height="3" fill="#3b4045" stroke="#FF6A13" stroke-width="2.2"/><g transform="rotate(14 152 37)"><rect x="156" y="19" width="222" height="7.5" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><rect x="156" y="27" width="222" height="7.5" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><line x1="156" y1="26.7" x2="378" y2="26.7" stroke="#a7aeb3" stroke-width="0.8"/><line x1="156" y1="18.4" x2="378" y2="18.4" stroke="#a7aeb3" stroke-width="1.2"/><rect x="366" y="19" width="12" height="15.5" fill="#a7aeb3" stroke="#17201A" stroke-width="0.7"/><circle cx="375" cy="17.2" r="1.6" fill="#ffffff" stroke="#17201A" stroke-width="0.5"/><path d="M160 33 L240 33 L240 42 L168 42 C163 42 160 39 160 36 Z" fill="#6b5a45" stroke="#17201A" stroke-width="0.7"/><rect x="186" y="40" width="10" height="3" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/></g><circle cx="152" cy="37" r="2.6" fill="#3b4045" stroke="#17201A" stroke-width="0.7"/><path d="M116 40 C116 53 138 53 140 40" fill="none" stroke="#3b4045" stroke-width="2"/><line x1="127" y1="40" x2="125" y2="49" stroke="#3b4045" stroke-width="2.2"/></g>
<g transform="translate(157.5 70.0) scale(2.3)"><g transform="translate(0.00 0.00) rotate(-50)"><rect x="0" y="-3.0" width="21" height="6" rx="1" fill="#3b6e8f" stroke="#17201A" stroke-width="0.5"/><rect x="0" y="-3.4" width="4" height="6.8" fill="#c9a227" stroke="#17201A" stroke-width="0.5"/><line x1="20.4" y1="-2.0" x2="20.4" y2="2.0" stroke="#17201A" stroke-width="0.6"/></g></g>
<line x1="87.5" y1="244.0" x2="87.5" y2="95.0" stroke="#1F3D2B" stroke-width="1.6"/><circle cx="87.5" cy="95.0" r="3" fill="#1F3D2B"/><rect x="67.6" y="243.0" width="84.8" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="110.0" y="260.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">safety on</text>
<rect x="232.0" y="59.0" width="136.0" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="300.0" y="76.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">fired hulls eject</text>
<rect x="214.6" y="213.0" width="170.8" height="23.0" rx="5" fill="#ffffff" stroke="#1F3D2B" stroke-width="1.3"/><text x="300.0" y="230.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">tilt it away from you</text>
<text x="200.0" y="290.0" font-size="14" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Citori: live shells lift, you pull them.</text>
</svg>
