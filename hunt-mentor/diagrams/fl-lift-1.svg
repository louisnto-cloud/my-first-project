<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Before you lift: how heavy is it, can you grip it, how do you feel today? Too heavy, split it or get help.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="30" cy="32" r="17" fill="#fffaf0" stroke="#e8590c" stroke-width="3"/><text x="30" y="39" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">1</text>
<text x="56" y="39" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="start">Size up the load</text>
<rect x="174.8" y="150.0" width="50.4" height="70.0" rx="11.2" fill="#8b5a2b"/><rect x="183.2" y="164.0" width="33.599999999999994" height="19.599999999999998" rx="5.6" fill="#6b4f35"/><rect x="169.2" y="200.4" width="61.599999999999994" height="11.2" rx="4.199999999999999" fill="#2f3a2b"/><text x="320" y="120" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e8590c" text-anchor="middle">Too heavy?</text><text x="320" y="144" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="middle">Split it or</text><text x="320" y="164" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="middle">get help</text><text x="80" y="140" font-family="sans-serif" font-size="60" font-weight="bold" fill="#e8590c" text-anchor="middle">?</text>
<rect x="10" y="262" width="380" height="34" rx="8" fill="#2f3a2b"/><text x="200" y="285.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Ask first: can I lift this safely?</text>
</svg>
