<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="You take a bearing from where you stand to a peak you can name on the map: 300 degrees.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<circle cx="26" cy="26" r="17" fill="#e8590c" stroke="none" stroke-width="2"/><text x="26" y="32" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="52" y="32" font-family="sans-serif" font-size="18" fill="#2f3a2b" text-anchor="start" font-weight="bold">Bearing to landmark 1</text><rect x="30" y="60" width="340" height="200" rx="0" fill="#dfe6d3" stroke="#8b5a2b" stroke-width="2"/><polygon points="70,110 90,80 110,110" fill="#8a9a6b"/><text x="55" y="128" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Peak</text><polygon points="300,100 320,72 340,100" fill="#8a9a6b"/><text x="320" y="118" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">Knob</text><g transform="translate(200 240) scale(0.8)"><circle cx="0" cy="-30" r="7" fill="#2f3a2b"/><path d="M0 -23 V2 M0 2 L-7 18 M0 2 L7 18 M0 -16 L-9 -4 M0 -16 L9 -4" stroke="#2f3a2b" stroke-width="4" stroke-linecap="round" fill="none"/></g><line x1="200" y1="215" x2="90" y2="110" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><text x="140" y="280" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="start">Bearing to peak: 300°</text>
</svg>
