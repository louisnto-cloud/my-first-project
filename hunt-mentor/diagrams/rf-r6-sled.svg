<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 236" role="img" aria-label="Chart of snowmobile rules in Region 6. In Management Units 6-4, 6-5, 6-6, 6-8, 6-9, 6-15 and 6-30: never use a snowmobile to hunt; it may haul game, gear, firearms or hunters only 16 December to 31 March. In 6-1, 6-2, 6-3, 6-7, 6-10 to 6-14 and 6-16 to 6-29: snowmobiles may be used as transport while hunting." font-family="sans-serif">
<rect x="0" y="0" width="400" height="236" fill="#fffaf0"/>
<text x="200" y="26" font-size="18" fill="#23261f" text-anchor="middle" font-weight="bold">Snowmobiles and hunting</text>
<rect x="14.0" y="40" width="31.6" height="160" fill="#dfe6d3" opacity=".55"/>
<text x="30" y="54" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">J</text>
<text x="61" y="54" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A</text>
<rect x="77.2" y="40" width="30.6" height="160" fill="#dfe6d3" opacity=".55"/>
<text x="92" y="54" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">S</text>
<text x="124" y="54" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">O</text>
<rect x="139.4" y="40" width="30.6" height="160" fill="#dfe6d3" opacity=".55"/>
<text x="155" y="54" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">N</text>
<text x="186" y="54" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">D</text>
<rect x="201.5" y="40" width="31.6" height="160" fill="#dfe6d3" opacity=".55"/>
<text x="217" y="54" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">J</text>
<text x="247" y="54" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">F</text>
<rect x="261.7" y="40" width="31.6" height="160" fill="#dfe6d3" opacity=".55"/>
<text x="277" y="54" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">M</text>
<text x="309" y="54" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A</text>
<rect x="323.8" y="40" width="31.6" height="160" fill="#dfe6d3" opacity=".55"/>
<text x="340" y="54" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">M</text>
<text x="371" y="54" font-size="14" fill="#2f3a2b" text-anchor="middle" font-weight="bold">J</text>
<text x="14" y="76" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Hunt from it: 6-4 to 6-6, 6-8, 6-9, 6-15, 6-30</text>
<rect x="14.0" y="82" width="372.0" height="20" rx="4" fill="#c92a2a"/>
<text x="200" y="97" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Never</text>
<text x="14" y="122" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">Haul game, gear, hunters: same MUs</text>
<rect x="185.2" y="128" width="108.0" height="20" rx="4" fill="#e8590c"/>
<text x="181" y="143" font-size="14" fill="#23261f" text-anchor="end" font-weight="bold">Dec 16 to Mar 31</text>
<text x="14" y="168" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">All other Skeena MUs: carry hunters, gear, game</text>
<rect x="14.0" y="174" width="372.0" height="20" rx="4" fill="#e8590c"/>
<text x="200" y="189" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Allowed</text>
<rect x="14" y="210" width="14" height="14" rx="3" fill="#c92a2a"/>
<text x="32" y="222" font-size="14" fill="#23261f" text-anchor="start">Not allowed</text>
<rect x="127.4" y="210" width="14" height="14" rx="3" fill="#e8590c"/>
<text x="145" y="222" font-size="14" fill="#23261f" text-anchor="start">Allowed</text>
</svg>
