<text x="22" y="288" font-size="15" font-weight="bold" fill="#FFFFFF">deer</text><text x="165" y="269" font-size="15" fill="#17201A">No season in Region 2</text><text x="165" y="290" font-size="14" fill="#1F3D2B">99%, pages 14 and 27</text></g>
