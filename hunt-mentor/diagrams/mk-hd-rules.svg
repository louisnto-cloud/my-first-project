<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 494" font-family="sans-serif" role="img" aria-label="The rules in MUs 2-8, 2-18, 2-19. General season: Bucks, Sept 10 to Dec 15 (99%, page 28). Bow only: Bucks, Sept 1 to Sept 9 (99%, page 28). Antlerless (doe, fawn): No general season (99%, page 28). White tailed deer: No season in Region 2 (99%, pages 14 and 27). Region 2 deer limit: 2 a licence year, at most 1 antlerless (99%, page 27). Hours: 1 hour before sunrise to 1 hour after sunset (99%, page 11, item 38).">
<rect width="400" height="494" rx="12" fill="#EEF1EA"/>
<text x="16" y="30" font-size="18" font-weight="bold" fill="#1F3D2B">The rules in MUs 2-8, 2-18, 2-19</text>
