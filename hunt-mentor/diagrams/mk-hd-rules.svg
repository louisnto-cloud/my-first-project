<g data-tip="Antlerless (doe, fawn)|No general season in MUs 2-8, 2-18 and 2-19 (99%, page 28)."><rect x="12" y="180" width="376" height="59" rx="8" fill="#FFFFFF" stroke="#FF6A13" stroke-width="3"/><rect x="12" y="180" width="143" height="59" rx="8" fill="#FF6A13"/><rect x="147" y="180" width="8" height="59" fill="#FF6A13"/><text x="22" y="202" font-size="15" font-weight="bold" fill="#17201A">Antlerless</text>
