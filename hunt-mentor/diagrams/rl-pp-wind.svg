<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Map view of a trail through a pinch point, ringed orange. The wind blows from above, across the trail toward the hunter. The hunter sits 100 to 150 m downwind with a clear view of the pinch, not right on the trail.">
  <rect width="400" height="300" fill="#fffaf0"/>
<text x="12" y="24" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="start">Sit the pinch, not on it</text>
  <rect x="0" y="36" width="400" height="232" fill="#dfe6d3" opacity=".7"/>
  <path d="M0 150 C 120 150, 180 140, 200 140 C 220 140, 280 150, 400 150" stroke="#8b5a2b" stroke-width="4" stroke-dasharray="3 6" fill="none"/>
  <circle cx="200" cy="140" r="13" fill="none" stroke="#e8590c" stroke-width="4"/>
  <path d="M200 60 L200 110" stroke="#4a7fb0" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M200 110 L194.8 99.2 L205.2 99.2 Z" fill="#4a7fb0"/><text x="210" y="76" font-size="14" font-weight="bold" fill="#4a7fb0" text-anchor="start">wind</text>
  <g transform="translate(200 238) scale(1)"><circle cy="-22" r="6" fill="#e8590c"/><path d="M0 -16 v16 M0 0 l-6 12 M0 0 l6 12 M0 -12 l-8 6 M0 -12 l8 4" stroke="#e8590c" stroke-width="3.5" stroke-linecap="round"/></g><text x="214" y="236" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="start">you: 100 to 150 m off</text>
  <path d="M190 206 L196 154 M210 206 L204 154" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="4 4"/>
  <g opacity=".4"><g transform="translate(200 116) scale(0.8)"><circle cy="-22" r="6" fill="#8a8a8a"/><path d="M0 -16 v16 M0 0 l-6 12 M0 0 l6 12 M0 -12 l-8 6 M0 -12 l8 4" stroke="#8a8a8a" stroke-width="3.5" stroke-linecap="round"/></g></g><text x="150" y="112" font-size="13" font-weight="bold" fill="#8a8a8a" text-anchor="end">not here</text>
  <text x="200" y="292" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Downwind of the pinch, with a clear lane</text>
</svg>
