<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 372" font-family="sans-serif" role="img" aria-label="Turkey safety in four cards, Tip. Never wear red, white or blue: those are a tom&#x27;s head colours. Sit with your back against a tree wider than your shoulders. Never stalk a gobble: it may be another hunter calling. Wrap a dead bird in blaze orange to carry it out.">
<rect width="400" height="372" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Turkey safety (Tip)</text>
<rect x="8" y="42" width="188" height="158" rx="8" fill="#f4eedf" stroke="#c0392b" stroke-width="2"/>
<text x="102" y="148" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">No red, white, blue</text>
<text x="102" y="168" font-size="15" fill="#2f3a2b" text-anchor="middle">A tom&#x27;s head colours</text>
<rect x="204" y="42" width="188" height="158" rx="8" fill="#f4eedf" stroke="#2f6e3b" stroke-width="2"/>
<text x="298" y="148" font-size="16" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Back to a wide tree</text>
<text x="298" y="168" font-size="15" fill="#2f3a2b" text-anchor="middle">Wider than your</text>
<text x="298" y="186" font-size="15" fill="#2f3a2b" text-anchor="middle">shoulders</text>
<rect x="8" y="206" width="188" height="158" rx="8" fill="#f4eedf" stroke="#c0392b" stroke-width="2"/>
<text x="102" y="312" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Never stalk a gobble</text>
<text x="102" y="332" font-size="15" fill="#2f3a2b" text-anchor="middle">It may be another</text>
<text x="102" y="350" font-size="15" fill="#2f3a2b" text-anchor="middle">hunter calling</text>
<rect x="204" y="206" width="188" height="158" rx="8" fill="#f4eedf" stroke="#2f6e3b" stroke-width="2"/>
<text x="298" y="312" font-size="16" font-weight="bold" fill="#2f6e3b" text-anchor="middle">Blaze orange bag</text>
<text x="298" y="332" font-size="15" fill="#2f3a2b" text-anchor="middle">Wrap the bird to</text>
<text x="298" y="350" font-size="15" fill="#2f3a2b" text-anchor="middle">carry it out</text>
