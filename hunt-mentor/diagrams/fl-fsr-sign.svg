<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A generic resource road entry sign. It shows the road name you call, the RR (resource road) radio channel to use, and the calling instructions. The sign in the field beats any map.">
  <rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="200" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Read the sign at the start of the road</text>
<rect x="0" y="230" width="400" height="70" rx="0" fill="#dfe6d3"/><rect x="150" y="230" width="100" height="70" rx="0" fill="#c9b79c"/>
<rect x="197" y="150" width="6" height="90" rx="1" fill="#6b4f35"/>
<rect x="70" y="50" width="260" height="104" rx="8" fill="#1f5a2f" stroke="#ffffff" stroke-width="3"/>
<text x="200" y="82" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">ROAD NAME</text>
<text x="200" y="110" font-family="sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">RR channel: posted here</text>
<text x="200" y="136" font-family="sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">Call as posted</text>
<text x="200" y="270" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f3a2b" text-anchor="middle">The sign beats any map (95%)</text>
</svg>
