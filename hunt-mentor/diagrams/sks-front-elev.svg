<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="The front sight post, in orange, inside its hood. Turning the post down makes the rifle hit higher; turning it up makes it hit lower. Use the combination tool over the post. Small turns, then shoot again to confirm.">
<rect x="0" y="0" width="400" height="300" fill="#EEF1EA"/>
<text x="200.0" y="26.0" font-size="18" font-weight="bold" fill="#1F3D2B" text-anchor="middle">Zero up and down: the front post</text>
<rect x="140.0" y="140.0" width="120.0" height="60.0" rx="4" fill="#59625C" stroke="#17201A" stroke-width="2"/><rect x="190.0" y="70.0" width="20.0" height="72.0" rx="2" fill="#FF6A13" stroke="#17201A" stroke-width="2"/><path d="M150 140 Q150 52 200 50 Q250 52 250 140" fill="none" stroke="#3A403C" stroke-width="6"/><path d="M162.4 78.3 A40 40 0 0 1 237.6 78.3" fill="none" stroke="#1F3D2B" stroke-width="3" stroke-linecap="round"/><polygon points="239.0,82.1 229.3,71.1 239.2,67.4" fill="#1F3D2B" stroke="#1F3D2B" stroke-width="1" stroke-linejoin="round"/><text x="70.0" y="70.0" font-size="14" font-weight="bold" fill="#2E7D4F" text-anchor="middle">Post DOWN</text><text x="70.0" y="90.0" font-size="14" font-weight="bold" fill="#2E7D4F" text-anchor="middle">= hits HIGHER</text><text x="330.0" y="70.0" font-size="14" font-weight="bold" fill="#B3261E" text-anchor="middle">Post UP</text><text x="330.0" y="90.0" font-size="14" font-weight="bold" fill="#B3261E" text-anchor="middle">= hits LOWER</text><text x="200.0" y="232.0" font-size="14" font-weight="bold" fill="#17201A" text-anchor="middle">Combination tool over the post.</text><text x="200.0" y="252.0" font-size="14" fill="#17201A" text-anchor="middle">Small turns. Shoot again to confirm.</text>
<text x="200.0" y="288.0" font-size="14" fill="#17201A" text-anchor="middle">Move the front sight opposite to the miss.</text>
</svg>
