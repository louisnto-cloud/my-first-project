<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Tourniquet step 1: slide the loop over the arm or leg and move it above the wound, between the wound and the heart, never on a joint.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">1. Slide it on, high</text><rect x="30" y="138" width="300" height="44" rx="22" fill="#d9b48f" stroke="#b08a66" stroke-width="2"/><circle cx="344" cy="160" r="24.0" fill="#d9b48f" stroke="#b08a66" stroke-width="2"/><ellipse cx="250" cy="160" rx="16" ry="7" fill="#c0392b"/><rect x="158" y="130" width="24" height="60" rx="4" fill="#e8590c" stroke="#2f3a2b" stroke-width="2"/><line x1="170" y1="98" x2="170" y2="128" stroke="#2f3a2b" stroke-width="7" stroke-linecap="round"/><line x1="100" y1="95" x2="149" y2="115" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/><polygon points="160,120 152,109 146,122" fill="#e8590c"/><text x="60" y="86" font-size="15" font-weight="bold" fill="#e8590c" text-anchor="start">Heart side</text><text x="330" y="220" font-size="15" fill="#2f3a2b" text-anchor="end">Not on elbow or knee</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Above the wound, heart side</text>
</svg>
