<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Flowchart. Phone dies: 1 stop and sit down. 2 warm the phone inside your jacket. 3 use the power bank. 4 map and compass to a handrail. 5 if lost, stay put and let your trip plan work.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<text x="20" y="30" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Phone dies. Now what?</text><rect x="110" y="45" width="180" height="34" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/><text x="200.0" y="67" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="middle">1 STOP. Sit down.</text><line x1="200" y1="80" x2="200.0" y2="88.3" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><polygon points="200.0,96.0 206.1,85.0 193.9,85.0" fill="#2f3a2b"/><rect x="80" y="98" width="240" height="34" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="200.0" y="120" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="middle">2 Warm it inside your jacket</text><line x1="200" y1="133" x2="200.0" y2="141.3" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><polygon points="200.0,149.0 206.1,138.0 193.9,138.0" fill="#2f3a2b"/><rect x="80" y="151" width="240" height="34" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="200.0" y="173" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="middle">3 Power bank, if you have it</text><line x1="200" y1="186" x2="200.0" y2="194.3" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><polygon points="200.0,202.0 206.1,191.0 193.9,191.0" fill="#2f3a2b"/><rect x="60" y="204" width="280" height="34" rx="8" fill="#ffffff" stroke="#8a9a6b" stroke-width="2"/><text x="200.0" y="226" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="middle">4 Map and compass to a handrail</text><line x1="200" y1="239" x2="200.0" y2="247.3" stroke="#2f3a2b" stroke-width="2" stroke-linecap="round"/><polygon points="200.0,255.0 206.1,244.0 193.9,244.0" fill="#2f3a2b"/><rect x="70" y="257" width="260" height="34" rx="8" fill="#ffffff" stroke="#c92a2a" stroke-width="2"/><text x="200.0" y="279" font-family="sans-serif" font-size="14" fill="#2f3a2b" text-anchor="middle">5 Lost? Stay put. Trip plan works.</text>
</svg>
