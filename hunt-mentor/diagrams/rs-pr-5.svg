<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Step 5: tell your brother, pin it on the map and avoid the area. If people are at risk, call the RAPP line, Report All Poachers and Polluters, 1 877 952 7277.">
<rect x="0" y="0" width="400" height="300" rx="0" fill="#fffaf0"/>
<text x="200" y="28" font-size="19" font-weight="bold" fill="#2f3a2b" text-anchor="middle">5. Tell and report</text>
<rect x="70" y="70" width="260" height="150" rx="10" fill="#fff" stroke="#23261f" stroke-width="1.5"/><text x="200" y="110" font-size="17" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Tell your brother</text><text x="200" y="140" font-size="15" fill="#23261f" text-anchor="middle">Pin it, avoid the area</text><text x="200" y="170" font-size="15" font-weight="bold" fill="#c62828" text-anchor="middle">Danger to people? Call RAPP</text><text x="200" y="196" font-size="16" font-weight="bold" fill="#23261f" text-anchor="middle">1 877 952 7277</text><text x="200" y="260" font-size="14" fill="#6b4f35" text-anchor="middle">RAPP: Report All Poachers and Polluters</text>
</svg>
