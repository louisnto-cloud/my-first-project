<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Top view of a deer bed: an oval of flattened grass about 1 m long, with pellets at one end and a few hairs. The deer faced downhill with the wind at its back. Melted frost or snow in the bed means it is fresh.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">Reading a bed (top view)</text><rect x="0" y="36" width="400" height="264" fill="#dfe6d3"/><ellipse cx="200" cy="160" rx="70" ry="42" fill="#c8b78f" stroke="#6b4f35" stroke-width="2" stroke-dasharray="6 4"/><ellipse cx="150" cy="210" rx="5" ry="4" fill="#3b2a1a"/><ellipse cx="160" cy="216" rx="5" ry="4" fill="#3b2a1a"/><ellipse cx="170" cy="209" rx="5" ry="4" fill="#3b2a1a"/><ellipse cx="156" cy="222" rx="5" ry="4" fill="#3b2a1a"/><path d="M230 150 l10 -4 M236 166 l12 2 M214 176 l8 6" fill="none" stroke="#7d7468" stroke-width="2"/><text x="200" y="165" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">about 1 m</text><line x1="200" y1="116" x2="200" y2="60" stroke="#e8590c" stroke-width="3"/><polygon points="200.0,60.0 204.3,69.0 195.7,69.0" fill="#e8590c"/><text x="210" y="72" font-size="14" fill="#e8590c" text-anchor="start" font-weight="bold">faces downhill</text><line x1="330" y1="260" x2="270" y2="200" stroke="#4a7fb0" stroke-width="3"/><polygon points="270.0,200.0 279.4,203.3 273.3,209.4" fill="#4a7fb0"/><text x="320" y="284" font-size="14" fill="#4a7fb0" text-anchor="middle" font-weight="bold">wind from behind</text><text x="110" y="250" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">pellets</text><text x="282" y="150" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">hair</text><text x="100" y="60" font-size="14" fill="#23261f" text-anchor="middle">Melted frost or</text><text x="100" y="78" font-size="14" fill="#23261f" text-anchor="middle">snow = fresh (Tip)</text>
</svg>
