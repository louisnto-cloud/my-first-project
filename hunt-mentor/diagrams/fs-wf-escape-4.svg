<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Escape step 4, last resort: find bare ground, lie face down low with feet toward the fire, and cover your mouth and nose until it passes.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">4. Cornered: clear, low, covered</text><rect x="0" y="220" width="400" height="80" rx="0" fill="#dfe6d3"/><rect x="100" y="210" width="200" height="10" rx="3" fill="#c8b89a"/><rect x="140" y="196" width="130" height="16" rx="6" fill="#e8590c"/><circle cx="280" cy="204" r="10.0" fill="#d9b48f"/><path d="M47 220 Q43 199 60 181 Q77 199 73 220 Z" fill="#e8590c"/><path d="M54 220 Q52 209 60 198 Q68 209 66 220 Z" fill="#f6c344"/><text x="200" y="140" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Bare ground, face down</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Last resort only</text>
</svg>
