<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Timeline of a fawn. Days 0 to 3: freezes with head flat. Days 4 to 6: hides then bolts. From a week: runs earlier. Weeks 2 to 3: follows its mother. It hides over 95% of the time, the doe stays a few hundred metres away, and it gains 5 to 10% of its birth weight a day. If you find a fawn, leave it.">
<rect width="400" height="300" fill="#fffaf0"/>
<text x="200" y="22" font-size="17" fill="#2f3a2b" text-anchor="middle" font-weight="bold">A fawn&#x27;s first 3 weeks</text><line x1="30" y1="150" x2="370" y2="150" stroke="#23261f" stroke-width="3"/><line x1="30" y1="142" x2="30" y2="158" stroke="#23261f" stroke-width="3"/><text x="30" y="176" font-size="14" fill="#23261f" text-anchor="start" font-weight="bold">day 0</text><line x1="120" y1="142" x2="120" y2="158" stroke="#23261f" stroke-width="3"/><text x="120" y="176" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">day 4</text><line x1="180" y1="142" x2="180" y2="158" stroke="#23261f" stroke-width="3"/><text x="180" y="176" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">day 7</text><line x1="290" y1="142" x2="290" y2="158" stroke="#23261f" stroke-width="3"/><text x="290" y="176" font-size="14" fill="#23261f" text-anchor="middle" font-weight="bold">week 2 to 3</text><rect x="30" y="70" width="90" height="60" rx="8" fill="#8a9a6b"/><text x="75" y="96" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Freeze,</text><text x="75" y="114" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">head flat</text><rect x="124" y="70" width="90" height="60" rx="8" fill="#4a7fb0"/><text x="169" y="96" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Hide,</text><text x="169" y="114" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">then bolt</text><rect x="218" y="70" width="70" height="60" rx="8" fill="#8b5a2b"/><text x="253" y="96" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Runs</text><text x="253" y="114" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">earlier</text><rect x="292" y="70" width="80" height="60" rx="8" fill="#e8590c"/><text x="332" y="96" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">Follows</text><text x="332" y="114" font-size="14" fill="#fffaf0" text-anchor="middle" font-weight="bold">mother</text><text x="200" y="214" font-size="14" fill="#23261f" text-anchor="middle">Hides over 95% of the time (85%)</text><text x="200" y="234" font-size="14" fill="#23261f" text-anchor="middle">Doe stays a few hundred metres away (85%)</text><text x="200" y="254" font-size="14" fill="#23261f" text-anchor="middle">Gains 5 to 10% of birth weight a day (85%)</text><text x="200" y="280" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Found a fawn? Leave it. Mother is near.</text>
</svg>
