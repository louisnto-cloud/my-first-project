<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="sans-serif" role="img" aria-label="Fire build step 5: add pencil, then thumb, then wrist wood only when the smaller size is burning well.">
  <rect width="400" height="300" fill="#fffaf0"/>
  <text x="200" y="26" font-size="18" font-weight="bold" fill="#2f3a2b" text-anchor="middle">5. Feed slowly, up the ladder</text><rect x="0" y="200" width="400" height="100" rx="0" fill="#dfe6d3"/><line x1="164" y1="190" x2="231" y2="179" stroke="#8b5a2b" stroke-width="12.6" stroke-linecap="round"/><line x1="169" y1="179" x2="236" y2="190" stroke="#8b5a2b" stroke-width="12.6" stroke-linecap="round"/><path d="M177 178 Q169 139 200 105 Q231 139 223 178 Z" fill="#e8590c"/><path d="M188 178 Q184 157 200 136 Q216 157 212 178 Z" fill="#f6c344"/><text x="330" y="110" font-size="15" fill="#2f3a2b" text-anchor="middle">Pencil</text><text x="330" y="132" font-size="15" fill="#2f3a2b" text-anchor="middle">then thumb</text><text x="330" y="154" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">then wrist</text><text x="200" y="288" font-size="15" font-weight="bold" fill="#2f3a2b" text-anchor="middle">Next size only when this one roars</text>
</svg>
