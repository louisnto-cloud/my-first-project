<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="You walk easily to a big knob, the attack point, then take a careful short compass bearing from it to the small bench you want.">
<rect x="0" y="0" width="400" height="300" fill="#fffaf0"/>
<rect x="0" y="0" width="400" height="300" rx="0" fill="#dfe6d3" stroke="none" stroke-width="2"/><polygon points="120,120 150,70 180,120" fill="#8a9a6b"/><text x="150" y="58" font-family="sans-serif" font-size="15" fill="#23261f" text-anchor="middle" font-weight="bold">Big knob</text><line x1="40" y1="270" x2="135.5" y2="136.3" stroke="#2f3a2b" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><polygon points="140.0,130.0 128.7,135.4 138.5,142.5" fill="#2f3a2b"/><text x="20" y="200" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">Easy: go to</text><text x="20" y="216" font-family="sans-serif" font-size="14" fill="#23261f" text-anchor="start">the big thing</text><line x1="165" y1="110" x2="293.0" y2="166.9" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/><polygon points="300.0,170.0 292.4,160.0 287.5,171.1" fill="#e8590c"/><circle cx="310" cy="175" r="9" fill="#e8590c" stroke="none" stroke-width="2"/><text x="310" y="205" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="middle" font-weight="bold">Small bench</text><text x="170" y="250" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start">Then a careful</text><text x="170" y="266" font-family="sans-serif" font-size="14" fill="#e8590c" text-anchor="start">short bearing</text><text x="20" y="40" font-family="sans-serif" font-size="17" fill="#2f3a2b" text-anchor="start" font-weight="bold">Attack point: big and easy first</text>
</svg>
