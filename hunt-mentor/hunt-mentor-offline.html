i><strong>Mid morning:<\/strong> walk slowly into the wind, still hunting or checking sign. Eat, drink.<\/li><li><strong>Midday:<\/strong> move spots, scout benches, check trail cameras if you use them.<\/li><li><strong>3 hours before sunset:<\/strong> back on a glassing spot that faces where deer feed.<\/li><li><strong>Sunset plus 60 min:<\/strong> legal light ends. Unload. Walk out with headlamps.<\/li><li>Shot taken late? Mark it, wait, track carefully. See Field Mode \"After the shot\".<\/li><\/ul><div class=\"checklist\" data-list=\"s10-deerday\"><label class=\"check\"><input type=\"checkbox\" data-key=\"s10-deerday:0\"><span>MU and season checked for today<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s10-deerday:1\"><span>Both hunters: licences, species licences, ID on me<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s10-deerday:2\"><span>100 m buffer map on phone<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s10-deerday:3\"><span>Sides and shooting lanes agreed<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s10-deerday:4\"><span>Wind checker in pocket<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s10-deerday:5\"><span>Knife, game bags, headlamp, rope<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s10-deerday:6\"><span>Trip plan left<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s10-deerday:7\"><span>Rifle unloaded on ATV and in vehicle<\/span><\/label><\/div><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>Look at the deer, then look past it. If you cannot see what the bullet will hit after the deer, you do not have a shot.<\/p><\/aside><aside class=\"callout mistake\"><div class=\"callout-t\">Common mistakes<\/div><ul><li>Shooting toward a house you forgot was there. Map the 100 m buffers first.<\/li><li>Keeping a round in the chamber on the ATV \"for a quick shot\".<\/li><li>Walking fast all morning instead of sitting and glassing.<\/li><\/ul><\/aside><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>This week: walk the property line and the Crown edge with your brother. Drop a GPS pin at every house and barn. Draw 100 m circles on the map tonight.<\/p><\/aside>"},{"title":"Sources","html":"<ul><li><a href=\"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/regulations-synopsis\" target=\"_blank\" rel=\"noopener\">BC Hunting and Trapping Regulations Synopsis 2026 to 2028<\/a>, checked 2026-10-01, search preview, loaded firearm, vehicles, roads, edible portions 75 to 80%.<\/li><li><a href=\"https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis-region-3-thompson.pdf\" target=\"_blank\" rel=\"noopener\">Region 3 synopsis<\/a>, checked 2026-10-01, search preview, bag limit 60%.<\/li><li><a href=\"https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/190_84_01\" target=\"_blank\" rel=\"noopener\">BC Hunting Regulation, 100 m rule<\/a>, checked 2026-10-01, search preview, 75%.<\/li><li><a href=\"https://www2.gov.bc.ca/gov/content/industry/crown-land-water/crown-land/crown-land-uses/off-road-vehicles/registration\" target=\"_blank\" rel=\"noopener\">BC off road vehicle registration<\/a>, checked 2026-10-01, search preview, 75%.<\/li><li><a href=\"https://wgfd.wyo.gov/how-much-meat-can-i-get-deer\" target=\"_blank\" rel=\"noopener\">Wyoming Game and Fish: how much meat from a deer<\/a>, checked 2026-10-01, search preview, 75%.<\/li><li><a href=\"https://rokslide.com/forums/threads/weight-of-a-bone-in-mule-deer-hind-quarter.107100/\" target=\"_blank\" rel=\"noopener\">Rokslide: weight of bone in mule deer quarters<\/a>, checked 2026-10-01, hunter reports, 60%.<\/li><li><a href=\"https://bcwf.bc.ca/initiatives/mule-deer-project/\" target=\"_blank\" rel=\"noopener\">BC Wildlife Federation mule deer project<\/a>, checked 2026-10-01, migration, 85%.<\/li><li>Research notes: <code>research/2026-10-01-deer.md<\/code> (ID, habitat, daily pattern, senses).<\/li><li>Note: official pages read through search previews only. Capped at 85%.<\/li><\/ul>"}],"quiz":[{"q":"Your brother's house is on the property. How close to it can you shoot?","options":["Anywhere on his land with his OK","No closer than 100 m to an occupied house or farm building","50 m if the shot is away from it"],"answer":1,"why":"BC bans hunting and shooting within 100 m of an occupied dwelling or farm building. His permission does not change that."},{"q":"On the ATV, when may a round be in the magazine attached to the rifle?","options":["Always, if the chamber is empty","Never. A loaded magazine attached counts as a loaded firearm","Only on FSRs"],"answer":1,"why":"Loaded means a round in the chamber or in an attached magazine. No loaded firearm in or on a motor vehicle, ATV included."},{"q":"The deer bounces away on all 4 feet with a thin black tipped tail. Which licence?","options":["White tailed deer","Mule deer","Either one"],"answer":1,"why":"Stotting and a rope tail with a black tip are mule deer signs. Check the mule deer rules for your MU."},{"q":"It is a cold late afternoon. Which way is air moving on the slope?","options":["Uphill","Downhill","No movement"],"answer":1,"why":"Cooling air sinks. Evening thermals flow downhill, so deer below you can smell you."},{"q":"You shot a deer 8 km in. What must you bring out?","options":["Just the backstraps and antlers","The edible meat: neck, ribs, 4 quarters and loins","Whatever fits in one trip"],"answer":1,"why":"BC requires the edible portions to be removed. Plan 2 trips or bone it out."}],"checklists":["s10-deerday"],"text":" !why late october near heffley creek is a real chance at a deer. a safe, simple plan you can repeat beats a long shot at a far ridge. - two hunters: you and your brother. he has core (conservation and outdoor recreation education), a pal (possession and acquisition licence) and an fwid (fish and wildlife id). - he needs his own bc hunting licence and deer species licence species licences before he hunts (80%). - assumption: your tikka .308 is zeroed (session 5). his rifle: verify what he will carry. mule deer or white tail? mule deer white tailed deer --- --- --- antlers fork, then fork again one main beam, single tines up tail thin, rope like, black tip wide, brown on top, flags up white ears very big smaller runs bounces on all 4 feet gallops to cover - these field marks are reliable on clear looks (85%). - mule deer often stop and look back at 150 to 300 m. hunter lore (65%). - they are separate licences and separate rules . know which one you are looking at before the safety comes off (80%). rules you must check first - your mu (management unit) for the property and the crown land behind it: verify on the official map. - mule deer season dates and antler rules (for example a 4 point rule) in your mu: verify. - white tail season and any antlerless days in your mu: verify. - region 3 deer bag limit: verify. a search preview said 3 deer combined, 1 of them mule deer (60%). - legal hours: 1 hour before sunrise to 1 hour after sunset (80%). !warn no mu, no season dates, no hunt. read the region 3 synopsis table for your exact mu before opening day. where deer are in late october - mule deer are the main deer in the southern interior (85%). - mule deer use steeper, higher, open broken ground. white tails use valley bottoms, creeks and farm fields (85%). - local reading: mule deer on grassland and open douglas fir benches above the valley. white tails in north thompson hayfields and cottonwood bottoms (75%). - many mule deer move toward winter range in october to november. snow and cold push them, not the rut (85%). - late october is early pre rut. bucks start sparring. bachelor groups break up (70%). - deer move most around dawn and dusk (85%). - day beds: timber edges, benches, draws, out of the wind. sunny south and west slopes on cold days (80%). glassing - glassing finds more deer than walking. sit, rest the binoculars, go slow (tip). - split the hillside into squares. scan near first, then far, in a snake pattern (tip). - 1 to 2 minutes per square. then do it again. deer appear (tip). - look for parts, not whole deer: an ear flick, a white rump, a leg line, a horizontal back (tip). - best times: first light and the last 2 hours of light (80%). - binoculars find. the rifle scope is never used to look at people or unknown shapes (tip). wind and thermals - smell is a deer's best sense. keep the wind in your face or across you (85%). - morning: air warms and flows uphill later in the morning. evening: air cools and flows downhill (80%). - so: hunt from above in the evening only if the wind lets you. come from below in late morning (tip). - check wind with a puff bottle or a bit of milkweed fluff every 15 minutes (tip). - wind wrong? leave that spot for today. do not push it (tip). scenario a: the property plus crown behind it - your brother's house is on the 20 acres. neighbours are 100 to 200 m away. - no shooting within 100 m (109 yd) of an occupied house, farm or ranch building (75%). that includes his house. - so the usable area on the 20 acres may be small or zero. the crown land behind is the real option. - map it first: draw a 100 m circle around every house and barn. mark safe shooting lanes and earth backstop backstops (tip). - mark the property line and the crown edge. walk it in daylight with a gps (global positioning system) app (tip). - assign sides: you shoot left of the line, he shoots right. no shots toward any house, road or each other (tip). - pros: close to home, short pack out, easy to repeat dawn and dusk. - cons: small area, people and pets nearby, deer may be few. - odds: fair if deer cross the crown edge. opinion. scenario b: atv on forest service roads - fsr (forest service road) networks reach benches and cutblocks fast. use them to get to glassing spots, then walk. - no loaded firearm in or on a motor vehicle, and that includes an atv (all terrain vehicle) (80%). - loaded means a round in the chamber or in an attached magazine (80%). - no shooting from a motor vehicle , atv included (80%). - no hunting or shooting on or across numbered highways and 2 lane public roads kept by the province, out to 15 m from the road centre (75%). - fsrs are not usually treated as those highways. still never shoot along or across any road (60%, verify). - atv on crown land: needs registration and a plate. helmet required (75%). insurance on fsrs: verify. - motor vehicle closures in region 3: verify on the synopsis maps. - pros: covers ground, easy meat haul, beats walking in the dark. - cons: road hunters push deer back from roads. noise. easy to break rules by accident. - odds: good for finding deer, fair for a shot. opinion. scenario c: walk in 5 to 10 km - quiet country away from roads. fewer hunters (tip). - meat math for a mule deer (us agency figures): - live weight about 68 to 113 kg (150 to 250 lb) for a buck (75%). - field dressed about 54 to 86 kg (120 to 190 lb) (75%). - a forkhorn or doe can give only about 23 kg (50 lb) of boned meat (75%). - bone in quarters for a mature buck: about 41 to 48 kg (90 to 105 lb) total. hunter reports (60%). - two of you, about 20 to 25 kg each per trip: 1 trip boned out, 2 trips bone in (tip). - loaded and off trail you may do 2 km an hour. 8 km out is about 4 hours per trip (tip). - you must bring out the edible meat: neck, ribs, 4 quarters and loins (75%). - pros: best chance at a calm, unpressured deer. great skill builder. - cons: a late shot means packing in the dark. meat must cool fast. - odds: good chance to see deer, hard first kill. opinion. !lean start with a and b together. map the 100 m buffers and hunt the crown edge behind the property at dawn. use the atv mid day to glass new benches. save c for after your first deer, when you know the pack out and the cutting. a hunt day - night before: check legal light, wind, mu (management unit) rules, closures. pack and charge everything. - sunrise minus 90 min: leave the house. rifles unloaded and cased in the vehicle. - sunrise minus 60 min (legal light): sit at the first glassing spot. load only when sitting and ready. - first 3 hours: glass. do not walk much. - mid morning: walk slowly into the wind, still hunting or checking sign. eat, drink. - midday: move spots, scout benches, check trail cameras if you use them. - 3 hours before sunset: back on a glassing spot that faces where deer feed. - sunset plus 60 min: legal light ends. unload. walk out with headlamps. - shot taken late? mark it, wait, track carefully. see field mode \"after the shot\". !rule look at the deer, then look past it. if you cannot see what the bullet will hit after the deer, you do not have a shot. !mistake - shooting toward a house you forgot was there. map the 100 m buffers first. - keeping a round in the chamber on the atv \"for a quick shot\". - walking fast all morning instead of sitting and glassing. !field this week: walk the property line and the crown edge with your brother. drop a gps pin at every house and barn. draw 100 m circles on the map tonight. sources - bc hunting and trapping regulations synopsis 2026 to 2028 (https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/regulations-synopsis), checked 2026-10-01, search preview, loaded firearm, vehicles, roads, edible portions 75 to 80%. - region 3 synopsis (https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis-region-3-thompson.pdf), checked 2026-10-01, search preview, bag limit 60%. - bc hunting regulation, 100 m rule (https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/190_84_01), checked 2026-10-01, search preview, 75%. - bc off road vehicle registration (https://www2.gov.bc.ca/gov/content/industry/crown-land-water/crown-land/crown-land-uses/off-road-vehicles/registration), checked 2026-10-01, search preview, 75%. - wyoming game and fish: how much meat from a deer (https://wgfd.wyo.gov/how-much-meat-can-i-get-deer), checked 2026-10-01, search preview, 75%. - rokslide: weight of bone in mule deer quarters (https://rokslide.com/forums/threads/weight-of-a-bone-in-mule-deer-hind-quarter.107100/), checked 2026-10-01, hunter reports, 60%. - bc wildlife federation mule deer project (https://bcwf.bc.ca/initiatives/mule-deer-project/), checked 2026-10-01, migration, 85%. - research notes: research/2026-10-01-deer.md (id, habitat, daily pattern, senses). - note: official pages read through search previews only. capped at 85%. "},{"id":"first-quail-trip","phase":1,"num":11,"title":"Your first quail trip","minutes":12,"checked":"2026-10-01","steps":[{"title":"Your first quail trip","html":"<aside class=\"callout why\"><div class=\"callout-t\">Why it matters<\/div><p>Quail are fast, fun and live close to farms and homes. Most of the skill is getting permission and keeping every shot safe.<\/p><\/aside><ul><li>Trip: the Okanagan, Region 8. Two hunters with shotguns.<\/li><li>Assumption: no landowner permission yet. No dog.<\/li><li>Residents need only the BC hunting licence for quail. No species licence <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><\/ul>"},{"title":"Season and limits","html":"<ul><li>Region 8 California quail: 1 October to 30 November <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Daily bag 10. Possession 30 <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Open in MUs (Management Units) 8-1 to 8-15 and 8-21 to 8-26 <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Read from a search preview of the Region 8 synopsis. Confirm in the full table before you go: <span class=\"verify\">VERIFY<\/span>.<\/li><li>Legal hours: 1 hour before sunrise to 1 hour after sunset <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Federal lead shot ban covers ducks and geese, not quail <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>. Any BC rule on lead for quail: <span class=\"verify\">VERIFY<\/span>. Steel works fine (Tip).<\/li><li>Each hunter has their own bag. No filling your partner's limit (Tip, <span class=\"verify\">VERIFY<\/span> the exact wording).<\/li><\/ul>"},{"title":"California quail: habitat and habits","html":"<ul><li>In BC, mostly in the Okanagan and Kettle valleys and on southeast Vancouver Island <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>They live in farm and suburban edges with lots of cover, and in brushy creeks, grassland and open forest <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Fall and winter flocks are called coveys. Often family groups, sometimes very large <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>They feed mornings and evenings. They rest in shrubs midday and roost in trees <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>A lookout bird, often a male, watches while the rest feed <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>They would rather <strong>run<\/strong> than fly. When pushed, they burst up with loud whirring wings <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><\/ul>"},{"title":"Where to look","html":"<ul><li>Brushy draws, blackberry and rose thickets, creek edges near grain or orchards (Tip).<\/li><li>Listen at first light. Their call carries far (Tip).<\/li><li>Look for dusting spots and tracks on dirt roads near cover (Tip).<\/li><li>After the first flush, singles hold tighter. Mark where they landed and follow up (Tip).<\/li><\/ul><aside class=\"callout tip\"><div class=\"callout-t\">Tip (opinion)<\/div><p>Best time, my opinion: the first 2 hours after legal light and the last 2 hours before sunset, on calm days. Late October and November, after leaves drop, you can see them better.<\/p><\/aside>"},{"title":"The covey flush","html":"<figure class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 440\" role=\"img\" aria-label=\"Top view of a covey flush. You and a partner walk in a line. Birds fan out ahead. Safe shooting is the wedge straight ahead of you. No shots toward your partner, toward the building, low over the brush, or behind you.\">\n  <rect x=\"0\" y=\"0\" width=\"400\" height=\"440\" fill=\"#fffaf0\"/>\n  <path d=\"M200 330 L80 90 A 135 135 0 0 1 300 90 Z\" fill=\"#dfe6d3\" stroke=\"#8a9a6b\" stroke-width=\"2\"/>\n  <text x=\"190\" y=\"118\" font-family=\"sans-serif\" font-size=\"16\" font-weight=\"bold\" fill=\"#2f3a2b\" text-anchor=\"middle\">SAFE ZONE<\/text>\n  <text x=\"190\" y=\"137\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#2f3a2b\" text-anchor=\"middle\">Birds above head height,<\/text>\n  <text x=\"190\" y=\"154\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#2f3a2b\" text-anchor=\"middle\">open ground beyond<\/text>\n  <g fill=\"#6b4f35\">\n    <ellipse cx=\"190\" cy=\"250\" rx=\"70\" ry=\"22\"/>\n  <\/g>\n  <text x=\"190\" y=\"255\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#fffaf0\" text-anchor=\"middle\">Brush with covey<\/text>\n  <g stroke=\"#23261f\" stroke-width=\"3\" fill=\"none\">\n    <path d=\"M190 232 L120 175\"/>\n    <path d=\"M190 232 L165 170\"/>\n    <path d=\"M190 232 L215 170\"/>\n    <path d=\"M190 232 L262 178\"/>\n    <path d=\"M190 232 L330 220\"/>\n  <\/g>\n  <g fill=\"#23261f\">\n    <circle cx=\"120\" cy=\"175\" r=\"5\"/><circle cx=\"165\" cy=\"170\" r=\"5\"/><circle cx=\"215\" cy=\"170\" r=\"5\"/><circle cx=\"262\" cy=\"178\" r=\"5\"/><circle cx=\"330\" cy=\"220\" r=\"5\"/>\n  <\/g>\n  <rect x=\"332\" y=\"150\" width=\"56\" height=\"44\" fill=\"#6b4f35\"/>\n  <polygon points=\"328,150 360,124 392,150\" fill=\"#23261f\"/>\n  <text x=\"360\" y=\"212\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Building<\/text>\n  <text x=\"330\" y=\"246\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" fill=\"#e8590c\" text-anchor=\"middle\">NO SHOT<\/text>\n  <circle cx=\"200\" cy=\"345\" r=\"13\" fill=\"#2f3a2b\"/>\n  <text x=\"200\" y=\"378\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">You<\/text>\n  <circle cx=\"60\" cy=\"345\" r=\"13\" fill=\"#e8590c\"/>\n  <text x=\"60\" y=\"378\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Partner<\/text>\n  <line x1=\"80\" y1=\"345\" x2=\"180\" y2=\"345\" stroke=\"#e8590c\" stroke-width=\"3\" stroke-dasharray=\"6 5\" fill=\"none\"/>\n  <text x=\"120\" y=\"330\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"bold\" fill=\"#e8590c\" text-anchor=\"middle\">NO SHOT<\/text>\n  <text x=\"200\" y=\"408\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Behind you and low birds: NO SHOT<\/text>\n  <text x=\"200\" y=\"428\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Stay in line. Know where your partner is.<\/text>\n<\/svg>\n<\/figure><ul><li>Walk in a straight line, side by side, 15 to 25 m (16 to 27 yd) apart (Tip).<\/li><li>Each hunter takes birds on their own side of centre (Tip).<\/li><li>Shoot only birds above head height with open ground or sky beyond (Tip).<\/li><li><strong>Never swing through your partner.<\/strong> Stop the swing, gun up, safety on (Tip).<\/li><li>Blaze orange hat and vest on both of you in brush (Tip).<\/li><li>Pick one bird. Shoot it. Then pick another. Shooting at the whole covey misses (Tip).<\/li><\/ul>"},{"title":"Near orchards and buildings","html":"<ul><li><strong>No shooting within 100 m (109 yd) of an occupied house, farm or ranch building<\/strong> <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>That includes barns with animals, packing sheds and worker housing <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Cultivated land, orchards included, needs the owner's or occupant's permission <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Orchards have ladders, irrigation, workers and pickers. Ask where people are today (Tip).<\/li><li>Shot falls back to earth. Never shoot toward a road, house or orchard crew, even far away (Tip).<\/li><li>Local no shooting areas and regional district bylaws are common in the Okanagan: <span class=\"verify\">VERIFY<\/span> on the Region 8 synopsis maps and the local bylaw.<\/li><\/ul>"},{"title":"Asking permission","html":"<ul><li>Go in person, daytime, clean clothes, no guns showing (Tip).<\/li><li>Short script:<ul><li>\"Hi, I'm (name). My brother and I hunt quail. Could we walk your fence lines and brush on a weekday morning?\"<\/li><li>\"We stay 100 m from every building. We close gates. We'll show you our licences.\"<\/li><li>\"Where should we not go? When are workers out?\"<\/li><li>\"Can I write down your OK and a phone number?\"<\/li><\/ul><\/li><li>Get it written: name, date, area, your names. Keep it on you (60%, legal advice from secondary sources).<\/li><li>Bring back a thank you: cleaned birds, a card, or help with a job (Tip).<\/li><\/ul>"},{"title":"Crown land options","html":"<ul><li>Crown land is public land owned by the province. Hunting is often allowed unless closed (Tip).<\/li><li>How to find it: an offline map app with a land ownership layer, or iMapBC. Check before you drive (Tip).<\/li><li>Grazing lease land needs the lease holder's OK while livestock are on it <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>First Nations reserve land is not Crown land. Hunting there needs the Nation's permission: <span class=\"verify\">VERIFY<\/span>.<\/li><li>Parks, ecological reserves and no shooting areas: check each one in the synopsis. <span class=\"verify\">VERIFY<\/span>.<\/li><li>Specific Okanagan Crown spots that hold quail: <span class=\"verify\">VERIFY<\/span> with the local rod and gun club or a BC Wildlife Federation member.<\/li><\/ul>"},{"title":"Chukar note","html":"<ul><li>Chukar live on dry, steep, rocky slopes and talus. In the Thompson, mostly 250 to 500 m elevation <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Best numbers are on low slopes of the Thompson valley from Kamloops to Lytton <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>They run uphill and flush downhill. Hard work for 2 hunters (Tip).<\/li><li>Region 8 and Region 3 chukar: a search preview said 1 October to 30 November, bag 5 <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>. <span class=\"verify\">VERIFY<\/span> both regions in the synopsis.<\/li><\/ul>"},{"title":"Quail at Heffley Creek?","html":"<ul><li>Region 3 California quail season: <span class=\"verify\">VERIFY<\/span>. A search did not find one <span class=\"cert c-tip\" title=\"Certainty\">50%<\/span>. Do not hunt quail there until confirmed.<\/li><li>Heffley Creek is outside the main BC quail range <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>.<\/li><li>See quail at the property? Note it in your journal. Do not shoot.<\/li><\/ul><div class=\"checklist\" data-list=\"s11-quail\"><label class=\"check\"><input type=\"checkbox\" data-key=\"s11-quail:0\"><span>Quail season open today in my exact MU (full synopsis table)<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s11-quail:1\"><span>Written permission in my pocket, or Crown land confirmed on the map<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s11-quail:2\"><span>100 m buffers from every building marked on the map<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s11-quail:3\"><span>Both hunters: blaze orange, eye and ear protection<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s11-quail:4\"><span>Sides agreed. No shots at low birds<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s11-quail:5\"><span>Shells for quail and a game vest or bag<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s11-quail:6\"><span>Cooler with ice for the drive home<\/span><\/label><\/div><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>A low bird is a free bird. Let it go.<\/p><\/aside><aside class=\"callout mistake\"><div class=\"callout-t\">Common mistakes<\/div><ul><li>Hunting an orchard edge without asking because \"it is not fenced.\"<\/li><li>Swinging on a bird that flies between you and your partner.<\/li><li>Shooting into the covey instead of picking one bird.<\/li><\/ul><\/aside><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>Before the trip: list 5 Okanagan farms with brushy edges on the map. Plan to knock on doors in person on day 1, and hunt day 2.<\/p><\/aside>"},{"title":"Sources","html":"<ul><li><a href=\"https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis-region-8-okanagan.pdf\" target=\"_blank\" rel=\"noopener\">Region 8 synopsis<\/a>, checked 2026-10-01, search preview, quail season 70% (from <code>data/regs.json<\/code>), chukar 60%.<\/li><li><a href=\"https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/190_84_01\" target=\"_blank\" rel=\"noopener\">BC Hunting Regulation, 100 m rule<\/a>, checked 2026-10-01, search preview, 75%.<\/li><li><a href=\"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/species-licences\" target=\"_blank\" rel=\"noopener\">BC species licences<\/a>, checked 2026-10-01, search preview, 80%.<\/li><li><a href=\"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/regulations-synopsis\" target=\"_blank\" rel=\"noopener\">BC Hunting and Trapping Regulations Synopsis<\/a>, checked 2026-10-01, search preview, cultivated land and grazing lease 75%.<\/li><li><a href=\"https://www.allaboutbirds.org/guide/California_Quail/lifehistory\" target=\"_blank\" rel=\"noopener\">Cornell All About Birds: California quail<\/a>, checked 2026-10-01, search preview, 75%.<\/li><li><a href=\"https://www.birdatlas.bc.ca/accounts/speciesaccount.jsp?lang=en&amp;sp=CAQU\" target=\"_blank\" rel=\"noopener\">BC Breeding Bird Atlas: California quail<\/a>, checked 2026-10-01, search preview, 75%.<\/li><li><a href=\"https://www.wildlifebc.org/pdfs/WA%2014_2ChukarWeb.pdf\" target=\"_blank\" rel=\"noopener\">Wildlife Afield: chukar in the Thompson<\/a>, checked 2026-10-01, search preview, 75%.<\/li><li><a href=\"https://peaceforage.bc.ca/wp-content/uploads/2021/07/Trespass-to-Private-Land.pdf\" target=\"_blank\" rel=\"noopener\">Peace Region Forage Association: trespass to private land<\/a>, checked 2026-10-01, search preview, 60%.<\/li><li>Note: official pages read through search previews only. Capped at 85%.<\/li><\/ul>"}],"quiz":[{"q":"What do you need to hunt quail as a BC resident?","options":["A quail species licence","The BC hunting licence only","The federal bird permit"],"answer":1,"why":"Residents need no species licence for quail. The BC hunting licence covers it."},{"q":"A quail flushes low between you and your partner. What do you do?","options":["Quick shot before it gets away","No shot. Gun up, safety on","Shoot once it passes your partner"],"answer":1,"why":"Never swing through your partner, and never shoot low birds. Let it go."},{"q":"The orchard is not fenced or posted. Can you hunt it?","options":["Yes, it is open","No. Cultivated land needs the owner's or occupant's permission","Only before 8 am"],"answer":1,"why":"BC requires consent to hunt cultivated land, posted or not."},{"q":"Can you hunt quail on your brother's land at Heffley Creek this October?","options":["Yes, same as the Okanagan","Not until a Region 3 quail season is confirmed in the synopsis","Yes, private land has no seasons"],"answer":1,"why":"Seasons are set by region and MU. No confirmed Region 3 quail season means no hunt."}],"checklists":["s11-quail"],"text":" !why quail are fast, fun and live close to farms and homes. most of the skill is getting permission and keeping every shot safe. - trip: the okanagan, region 8. two hunters with shotguns. - assumption: no landowner permission yet. no dog. - residents need only the bc hunting licence for quail. no species licence (80%). season and limits - region 8 california quail: 1 october to 30 november (70%). - daily bag 10. possession 30 (70%). - open in mus (management units) 8-1 to 8-15 and 8-21 to 8-26 (70%). - read from a search preview of the region 8 synopsis. confirm in the full table before you go: verify. - legal hours: 1 hour before sunrise to 1 hour after sunset (80%). - federal lead shot ban covers ducks and geese, not quail (75%). any bc rule on lead for quail: verify. steel works fine (tip). - each hunter has their own bag. no filling your partner's limit (tip, verify the exact wording). california quail: habitat and habits - in bc, mostly in the okanagan and kettle valleys and on southeast vancouver island (75%). - they live in farm and suburban edges with lots of cover, and in brushy creeks, grassland and open forest (75%). - fall and winter flocks are called coveys. often family groups, sometimes very large (75%). - they feed mornings and evenings. they rest in shrubs midday and roost in trees (75%). - a lookout bird, often a male, watches while the rest feed (75%). - they would rather run than fly. when pushed, they burst up with loud whirring wings (75%). where to look - brushy draws, blackberry and rose thickets, creek edges near grain or orchards (tip). - listen at first light. their call carries far (tip). - look for dusting spots and tracks on dirt roads near cover (tip). - after the first flush, singles hold tighter. mark where they landed and follow up (tip). !tip best time, my opinion: the first 2 hours after legal light and the last 2 hours before sunset, on calm days. late october and november, after leaves drop, you can see them better. the covey flush - walk in a straight line, side by side, 15 to 25 m (16 to 27 yd) apart (tip). - each hunter takes birds on their own side of centre (tip). - shoot only birds above head height with open ground or sky beyond (tip). - never swing through your partner. stop the swing, gun up, safety on (tip). - blaze orange hat and vest on both of you in brush (tip). - pick one bird. shoot it. then pick another. shooting at the whole covey misses (tip). near orchards and buildings - no shooting within 100 m (109 yd) of an occupied house, farm or ranch building (75%). - that includes barns with animals, packing sheds and worker housing (75%). - cultivated land, orchards included, needs the owner's or occupant's permission (75%). - orchards have ladders, irrigation, workers and pickers. ask where people are today (tip). - shot falls back to earth. never shoot toward a road, house or orchard crew, even far away (tip). - local no shooting areas and regional district bylaws are common in the okanagan: verify on the region 8 synopsis maps and the local bylaw. asking permission - go in person, daytime, clean clothes, no guns showing (tip). - short script: - \"hi, i'm (name). my brother and i hunt quail. could we walk your fence lines and brush on a weekday morning?\" - \"we stay 100 m from every building. we close gates. we'll show you our licences.\" - \"where should we not go? when are workers out?\" - \"can i write down your ok and a phone number?\" - get it written: name, date, area, your names. keep it on you (60%, legal advice from secondary sources). - bring back a thank you: cleaned birds, a card, or help with a job (tip). crown land options - crown land is public land owned by the province. hunting is often allowed unless closed (tip). - how to find it: an offline map app with a land ownership layer, or imapbc. check before you drive (tip). - grazing lease land needs the lease holder's ok while livestock are on it (75%). - first nations reserve land is not crown land. hunting there needs the nation's permission: verify. - parks, ecological reserves and no shooting areas: check each one in the synopsis. verify. - specific okanagan crown spots that hold quail: verify with the local rod and gun club or a bc wildlife federation member. chukar note - chukar live on dry, steep, rocky slopes and talus. in the thompson, mostly 250 to 500 m elevation (75%). - best numbers are on low slopes of the thompson valley from kamloops to lytton (75%). - they run uphill and flush downhill. hard work for 2 hunters (tip). - region 8 and region 3 chukar: a search preview said 1 october to 30 november, bag 5 (60%). verify both regions in the synopsis. quail at heffley creek? - region 3 california quail season: verify. a search did not find one (50%). do not hunt quail there until confirmed. - heffley creek is outside the main bc quail range (60%). - see quail at the property? note it in your journal. do not shoot. !rule a low bird is a free bird. let it go. !mistake - hunting an orchard edge without asking because \"it is not fenced.\" - swinging on a bird that flies between you and your partner. - shooting into the covey instead of picking one bird. !field before the trip: list 5 okanagan farms with brushy edges on the map. plan to knock on doors in person on day 1, and hunt day 2. sources - region 8 synopsis (https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis-region-8-okanagan.pdf), checked 2026-10-01, search preview, quail season 70% (from data/regs.json ), chukar 60%. - bc hunting regulation, 100 m rule (https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/190_84_01), checked 2026-10-01, search preview, 75%. - bc species licences (https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/species-licences), checked 2026-10-01, search preview, 80%. - bc hunting and trapping regulations synopsis (https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/regulations-synopsis), checked 2026-10-01, search preview, cultivated land and grazing lease 75%. - cornell all about birds: california quail (https://www.allaboutbirds.org/guide/california_quail/lifehistory), checked 2026-10-01, search preview, 75%. - bc breeding bird atlas: california quail (https://www.birdatlas.bc.ca/accounts/speciesaccount.jsp?lang=en&sp=caqu), checked 2026-10-01, search preview, 75%. - wildlife afield: chukar in the thompson (https://www.wildlifebc.org/pdfs/wa%2014_2chukarweb.pdf), checked 2026-10-01, search preview, 75%. - peace region forage association: trespass to private land (https://peaceforage.bc.ca/wp-content/uploads/2021/07/trespass-to-private-land.pdf), checked 2026-10-01, search preview, 60%. - note: official pages read through search previews only. capped at 85%. "},{"id":"legal-to-shoot","phase":1,"num":12,"title":"Is it legal to shoot?","minutes":10,"checked":"2026-10-01","steps":[{"title":"Is it legal to shoot?","html":"<aside class=\"callout why\"><div class=\"callout-t\">Why it matters<\/div><p>You get about 3 seconds. The 9 questions must be a habit before the animal shows up.<\/p><\/aside><aside class=\"callout warn\"><div class=\"callout-t\">Warning<\/div><p>Study aid only. The official regulations are the law.<\/p><\/aside><ul><li>Same 9 steps as the \"Is it legal to shoot?\" card in the Field tab.<\/li><li>Every answer must be <strong>yes<\/strong>. One no, or one \"not sure\", and you do not shoot.<\/li><li>Practise saying them in order on every walk until they are automatic.<\/li><\/ul>"},{"title":"The flowchart","html":"<figure class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 790\" font-family=\"sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"400\" height=\"790\" fill=\"#fffaf0\"/>\n  <text x=\"200\" y=\"28\" font-size=\"20\" font-weight=\"bold\" fill=\"#23261f\" text-anchor=\"middle\">Is it legal to shoot?<\/text>\n  <defs>\n    <marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#23261f\"/><\/marker>\n    <marker id=\"ahr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#c92a2a\"/><\/marker>\n  <\/defs>\n  <!-- red stop column -->\n  <rect x=\"312\" y=\"48\" width=\"80\" height=\"618\" rx=\"10\" fill=\"#c92a2a\"/>\n  <text transform=\"translate(360 357) rotate(-90)\" font-size=\"26\" font-weight=\"bold\" fill=\"#fffaf0\" text-anchor=\"middle\">DO NOT SHOOT<\/text>\n  <!-- question boxes: y = 48 + i*70, height 44 -->\n  <g font-size=\"15\" fill=\"#23261f\">\n    <rect x=\"8\" y=\"48\" width=\"252\" height=\"44\" rx=\"8\" fill=\"#e9eedd\" stroke=\"#2f3a2b\" stroke-width=\"2\"/>\n    <text x=\"134\" y=\"75\" text-anchor=\"middle\" fill=\"#23261f\">1. Licences on me?<\/text>\n    <rect x=\"8\" y=\"118\" width=\"252\" height=\"44\" rx=\"8\" fill=\"#e9eedd\" stroke=\"#2f3a2b\" stroke-width=\"2\"/>\n    <text x=\"134\" y=\"145\" text-anchor=\"middle\" fill=\"#23261f\">2. Legal hours right now?<\/text>\n    <rect x=\"8\" y=\"188\" width=\"252\" height=\"44\" rx=\"8\" fill=\"#e9eedd\" stroke=\"#2f3a2b\" stroke-width=\"2\"/>\n    <text x=\"134\" y=\"215\" text-anchor=\"middle\" fill=\"#23261f\">3. Season open, MU, sex?<\/text>\n    <rect x=\"8\" y=\"258\" width=\"252\" height=\"44\" rx=\"8\" fill=\"#e9eedd\" stroke=\"#2f3a2b\" stroke-width=\"2\"/>\n    <text x=\"134\" y=\"285\" text-anchor=\"middle\" fill=\"#23261f\">4. 100% sure what it is?<\/text>\n    <rect x=\"8\" y=\"328\" width=\"252\" height=\"44\" rx=\"8\" fill=\"#e9eedd\" stroke=\"#2f3a2b\" stroke-width=\"2\"/>\n    <text x=\"134\" y=\"355\" text-anchor=\"middle\" fill=\"#23261f\">5. Off road, out of vehicle?<\/text>\n    <rect x=\"8\" y=\"398\" width=\"252\" height=\"44\" rx=\"8\" fill=\"#e9eedd\" stroke=\"#2f3a2b\" stroke-width=\"2\"/>\n    <text x=\"134\" y=\"425\" text-anchor=\"middle\" fill=\"#23261f\">6. Over 100 m from buildings?<\/text>\n    <rect x=\"8\" y=\"468\" width=\"252\" height=\"44\" rx=\"8\" fill=\"#e9eedd\" stroke=\"#2f3a2b\" stroke-width=\"2\"/>\n    <text x=\"134\" y=\"495\" text-anchor=\"middle\" fill=\"#23261f\">7. Allowed on this land?<\/text>\n    <rect x=\"8\" y=\"538\" width=\"252\" height=\"44\" rx=\"8\" fill=\"#e9eedd\" stroke=\"#2f3a2b\" stroke-width=\"2\"/>\n    <text x=\"134\" y=\"565\" text-anchor=\"middle\" fill=\"#23261f\">8. Safe backstop?<\/text>\n    <rect x=\"8\" y=\"608\" width=\"252\" height=\"44\" rx=\"8\" fill=\"#e9eedd\" stroke=\"#2f3a2b\" stroke-width=\"2\"/>\n    <text x=\"134\" y=\"635\" text-anchor=\"middle\" fill=\"#23261f\">9. Clean shot, in my range?<\/text>\n  <\/g>\n  <!-- yes arrows down -->\n  <g stroke=\"#23261f\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#ah)\">\n    <line x1=\"134\" y1=\"92\" x2=\"134\" y2=\"116\"/>\n    <line x1=\"134\" y1=\"162\" x2=\"134\" y2=\"186\"/>\n    <line x1=\"134\" y1=\"232\" x2=\"134\" y2=\"256\"/>\n    <line x1=\"134\" y1=\"302\" x2=\"134\" y2=\"326\"/>\n    <line x1=\"134\" y1=\"372\" x2=\"134\" y2=\"396\"/>\n    <line x1=\"134\" y1=\"442\" x2=\"134\" y2=\"466\"/>\n    <line x1=\"134\" y1=\"512\" x2=\"134\" y2=\"536\"/>\n    <line x1=\"134\" y1=\"582\" x2=\"134\" y2=\"606\"/>\n    <line x1=\"134\" y1=\"652\" x2=\"134\" y2=\"690\"/>\n  <\/g>\n  <g font-size=\"14\" font-weight=\"bold\" fill=\"#2f3a2b\">\n    <text x=\"142\" y=\"110\" fill=\"#2f3a2b\">Yes<\/text>\n    <text x=\"142\" y=\"180\" fill=\"#2f3a2b\">Yes<\/text>\n    <text x=\"142\" y=\"250\" fill=\"#2f3a2b\">Yes<\/text>\n    <text x=\"142\" y=\"320\" fill=\"#2f3a2b\">Yes<\/text>\n    <text x=\"142\" y=\"390\" fill=\"#2f3a2b\">Yes<\/text>\n    <text x=\"142\" y=\"460\" fill=\"#2f3a2b\">Yes<\/text>\n    <text x=\"142\" y=\"530\" fill=\"#2f3a2b\">Yes<\/text>\n    <text x=\"142\" y=\"600\" fill=\"#2f3a2b\">Yes<\/text>\n    <text x=\"142\" y=\"676\" fill=\"#2f3a2b\">Yes<\/text>\n  <\/g>\n  <!-- no arrows right -->\n  <g stroke=\"#c92a2a\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#ahr)\">\n    <line x1=\"260\" y1=\"70\" x2=\"310\" y2=\"70\"/>\n    <line x1=\"260\" y1=\"140\" x2=\"310\" y2=\"140\"/>\n    <line x1=\"260\" y1=\"210\" x2=\"310\" y2=\"210\"/>\n    <line x1=\"260\" y1=\"280\" x2=\"310\" y2=\"280\"/>\n    <line x1=\"260\" y1=\"350\" x2=\"310\" y2=\"350\"/>\n    <line x1=\"260\" y1=\"420\" x2=\"310\" y2=\"420\"/>\n    <line x1=\"260\" y1=\"490\" x2=\"310\" y2=\"490\"/>\n    <line x1=\"260\" y1=\"560\" x2=\"310\" y2=\"560\"/>\n    <line x1=\"260\" y1=\"630\" x2=\"310\" y2=\"630\"/>\n  <\/g>\n  <g font-size=\"14\" font-weight=\"bold\" fill=\"#c92a2a\">\n    <text x=\"270\" y=\"63\" fill=\"#c92a2a\">No<\/text>\n    <text x=\"270\" y=\"133\" fill=\"#c92a2a\">No<\/text>\n    <text x=\"270\" y=\"203\" fill=\"#c92a2a\">No<\/text>\n    <text x=\"270\" y=\"273\" fill=\"#c92a2a\">No<\/text>\n    <text x=\"270\" y=\"343\" fill=\"#c92a2a\">No<\/text>\n    <text x=\"270\" y=\"413\" fill=\"#c92a2a\">No<\/text>\n    <text x=\"270\" y=\"483\" fill=\"#c92a2a\">No<\/text>\n    <text x=\"270\" y=\"553\" fill=\"#c92a2a\">No<\/text>\n    <text x=\"270\" y=\"623\" fill=\"#c92a2a\">No<\/text>\n  <\/g>\n  <!-- final -->\n  <rect x=\"8\" y=\"692\" width=\"384\" height=\"86\" rx=\"10\" fill=\"#2f3a2b\"/>\n  <text x=\"200\" y=\"726\" font-size=\"20\" font-weight=\"bold\" fill=\"#fffaf0\" text-anchor=\"middle\">All 9 yes: you may shoot<\/text>\n  <text x=\"200\" y=\"756\" font-size=\"15\" fill=\"#fffaf0\" text-anchor=\"middle\">Any doubt at any step means no.<\/text>\n<\/svg>\n<\/figure><ul><li>Yes goes down. No goes right, to DO NOT SHOOT.<\/li><\/ul>"},{"title":"Steps 1 to 3: paper, clock, season","html":"<ol><li><strong>Licences on me?<\/strong> Photo ID, <button class=\"term\" data-term=\"FWID\">FWID<\/button> (Fish and Wildlife ID) number, the deer species licence, or the federal bird permit for ducks <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Legal hours?<\/strong> Deer and quail: 1 hour before sunrise to 1 hour after sunset <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>. Ducks: 30 minutes before sunrise to 30 minutes after sunset <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Season open for this species, sex and antler type, in this <button class=\"term\" data-term=\"MU\">MU<\/button> (Management Unit), today?<\/strong> Check the synopsis table for your exact MU. Dates: <span class=\"verify\">VERIFY<\/span> in the Rules tab.<\/li><\/ol><ul><li>Antler rules like \"4 point\" mean you count points <strong>before<\/strong> the shot. Tip.<\/li><\/ul>"},{"title":"Steps 4 to 6: target, road, buildings","html":"<ol><li><strong>100% sure what it is?<\/strong> Species, sex, antler points. For ducks: species before you shoot. Not sure means no. Tip.<\/li><li><strong>Off the road, out of the vehicle?<\/strong> No shooting from a motor vehicle or motorboat <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>. No shooting across a road or on the road allowance <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>. No loaded firearm in or on a vehicle or <button class=\"term\" data-term=\"ATV\">ATV<\/button> (all terrain vehicle) <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Over 100 m (109 yd) from any occupied house, farm or ranch building?<\/strong> <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>. This includes your brother's house on the property (80%, my reading).<\/li><\/ol>"},{"title":"Steps 7 to 9: land, backstop, shot","html":"<ol><li><strong>Allowed on this land?<\/strong> <button class=\"term\" data-term=\"Crown land\">Crown land<\/button> that is open, or owner's permission. Not a park closed to hunting, an ecological reserve or a No Shooting Area <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Safe <button class=\"term\" data-term=\"Backstop\">Backstop<\/button>?<\/strong> Earth behind the animal. No skyline. No people, road, livestock or building beyond. Tip, and your safety course rule.<\/li><li><strong>Clean shot inside your tested range?<\/strong> Broadside or quartering away, still animal, steady rest. Tip.<\/li><\/ol><ul><li>Steps 8 and 9 are about safety and ethics. They are not optional.<\/li><\/ul><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>When in doubt, don't. The deer will be there next year. A bad shot follows you forever.<\/p><\/aside><aside class=\"callout mistake\"><div class=\"callout-t\">Common mistakes<\/div><ul><li>Counting antler points after the shot.<\/li><li>Forgetting that ducks start 30 minutes later than deer in the morning.<\/li><li>Shooting from the ATV seat \"because the engine is off\".<\/li><\/ul><\/aside><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>Walking in, say the 9 steps out loud once. At the stand, rangefind the nearest building and the road.<\/p><\/aside><div class=\"checklist\" data-list=\"s12-legal\"><label class=\"check\"><input type=\"checkbox\" data-key=\"s12-legal:0\"><span>I can say all 9 steps from memory<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s12-legal:1\"><span>I know today's legal start and end for deer and for ducks<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s12-legal:2\"><span>I know my MU and today's open seasons<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s12-legal:3\"><span>I rangefinded the house and the road from my stand<\/span><\/label><\/div>"},{"title":"Sources","html":"<ul><li><a href=\"https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis.pdf\" target=\"_blank\" rel=\"noopener\">BC Hunting and Trapping Regulations Synopsis 2026 to 2028<\/a> (search preview), checked 2026-10-01: hours, vehicles, roads, 100 m, parks.<\/li><li><a href=\"https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/190_84_01\" target=\"_blank\" rel=\"noopener\">Hunting Regulation, B.C. Reg. 190/84<\/a> (search preview), checked 2026-10-01: hours.<\/li><li><a href=\"https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/regulations-provincial-territorial-summaries/british-columbia.html\" target=\"_blank\" rel=\"noopener\">ECCC (Environment and Climate Change Canada) BC migratory bird summary<\/a> (search preview), checked 2026-10-01: duck hours.<\/li><li>Steps 4, 8 and 9 are safety and ethics habits (Tip), not quoted law.<\/li><li>Full rule detail and certainty: Phase 2 Session 5, BC rules you must know.<\/li><\/ul>"}],"quiz":[{"q":"Sunrise is in 40 minutes. A buck and a flock of ducks show up. What is legal right now?","options":["Both","The buck only. Duck hours start 30 minutes before sunrise, which is 10 minutes away","Neither"],"answer":1,"why":"Deer hours start 1 hour before sunrise. Duck hours start 30 minutes before sunrise. At 40 minutes before, only the deer is legal (if its season is open)."},{"q":"You think it is a 4 point buck but can only see one side. What now?","options":["Shoot, it is probably legal","Wait. Not sure means no","Shoot and check after"],"answer":1,"why":"Step 4: you must be 100% sure of species, sex and antler points before the shot."},{"q":"A deer stands 80 m from your brother's house. He says go ahead. Can you shoot?","options":["Yes, he gave permission","No. Inside 100 m of an occupied dwelling","Yes if the backstop is safe"],"answer":1,"why":"The 100 m rule protects occupied houses. Owner permission does not lift it."},{"q":"What happens if any one answer is no?","options":["Shoot carefully","Do not shoot","Ask your brother"],"answer":1,"why":"Every step must be yes. One no ends it."}],"checklists":["s12-legal"],"text":" !why you get about 3 seconds. the 9 questions must be a habit before the animal shows up. !warn study aid only. the official regulations are the law. - same 9 steps as the \"is it legal to shoot?\" card in the field tab. - every answer must be yes . one no, or one \"not sure\", and you do not shoot. - practise saying them in order on every walk until they are automatic. the flowchart - yes goes down. no goes right, to do not shoot. steps 1 to 3: paper, clock, season 1. licences on me? photo id, fwid (fish and wildlife id) number, the deer species licence, or the federal bird permit for ducks (85%). 2. legal hours? deer and quail: 1 hour before sunrise to 1 hour after sunset (85%). ducks: 30 minutes before sunrise to 30 minutes after sunset (85%). 3. season open for this species, sex and antler type, in this mu (management unit), today? check the synopsis table for your exact mu. dates: verify in the rules tab. - antler rules like \"4 point\" mean you count points before the shot. tip. steps 4 to 6: target, road, buildings 4. 100% sure what it is? species, sex, antler points. for ducks: species before you shoot. not sure means no. tip. 5. off the road, out of the vehicle? no shooting from a motor vehicle or motorboat (85%). no shooting across a road or on the road allowance (80%). no loaded firearm in or on a vehicle or atv (all terrain vehicle) (85%). 6. over 100 m (109 yd) from any occupied house, farm or ranch building? (85%). this includes your brother's house on the property (80%, my reading). steps 7 to 9: land, backstop, shot 7. allowed on this land? crown land that is open, or owner's permission. not a park closed to hunting, an ecological reserve or a no shooting area (85%). 8. safe backstop ? earth behind the animal. no skyline. no people, road, livestock or building beyond. tip, and your safety course rule. 9. clean shot inside your tested range? broadside or quartering away, still animal, steady rest. tip. - steps 8 and 9 are about safety and ethics. they are not optional. !rule when in doubt, don't. the deer will be there next year. a bad shot follows you forever. !mistake - counting antler points after the shot. - forgetting that ducks start 30 minutes later than deer in the morning. - shooting from the atv seat \"because the engine is off\". !field walking in, say the 9 steps out loud once. at the stand, rangefind the nearest building and the road. sources - bc hunting and trapping regulations synopsis 2026 to 2028 (https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis.pdf) (search preview), checked 2026-10-01: hours, vehicles, roads, 100 m, parks. - hunting regulation, b.c. reg. 190/84 (https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/190_84_01) (search preview), checked 2026-10-01: hours. - eccc (environment and climate change canada) bc migratory bird summary (https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/regulations-provincial-territorial-summaries/british-columbia.html) (search preview), checked 2026-10-01: duck hours. - steps 4, 8 and 9 are safety and ethics habits (tip), not quoted law. - full rule detail and certainty: phase 2 session 5, bc rules you must know. "},{"id":"after-the-shot","phase":1,"num":13,"title":"After the shot","minutes":15,"checked":"2026-10-01","steps":[{"title":"After the shot","html":"<aside class=\"callout why\"><div class=\"callout-t\">Why it matters<\/div><p>The shot is 1 second. The next 3 hours decide if you find the deer and if the meat is good.<\/p><\/aside><aside class=\"callout warn\"><div class=\"callout-t\">Warning<\/div><p>Study aid only. The official regulations are the law.<\/p><\/aside><ul><li>Fast order: <strong>wait, mark, track, approach, notch, evidence, dress, cool, transport, report.<\/strong><\/li><li>Tagging and evidence rules are law. Tracking and dressing steps are skills (Tip).<\/li><li>Your brother hunts too. Each of you notches only your own licence. Tip.<\/li><\/ul>"},{"title":"1. Wait and mark","html":"<ul><li>Stay still. Watch where it runs. Listen for a crash. Tip.<\/li><li>Rifle reloaded and on safe. Watch for 5 minutes in case it stands. Tip.<\/li><li>Drop a phone map pin where you shot from and where the deer stood. Tip.<\/li><li>Note a landmark at the last place you saw it (a tree, a rock). Tip.<\/li><li>Wait about 30 minutes before you follow. Longer if you think the hit was far back. Tip, common hunter practice, not law.<\/li><\/ul>"},{"title":"2. Track","html":"<ul><li>Go to where it stood. Look for blood, hair, scuffed ground. Tip.<\/li><li>Bright pink, bubbly blood often means a lung hit. Dark blood or gut matter: back out and wait hours. Tip.<\/li><li>Mark each blood spot with tape or a phone pin. Tip.<\/li><li>Lost the trail? Go back to the last blood. Search in slow circles. Get your brother to help. Tip.<\/li><li>Trail goes into posted private land, a park or a No Shooting Area: stop. Ask the owner or call a conservation officer <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>. See Phase 2 Session 5.<\/li><li>You must make a real effort to recover wounded game <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>. <span class=\"verify\">VERIFY<\/span> the exact rule.<\/li><\/ul>"},{"title":"3. Approach and notch","html":"<ul><li>Come from behind the back, rifle ready. Touch the eye with a stick. No blink means dead. Tip.<\/li><li><strong>Notch (cancel) the species licence immediately after the kill and before you handle the animal<\/strong> <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Follow the notch instructions printed on the licence <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>. Exact fields: <span class=\"verify\">VERIFY<\/span> on your licence.<\/li><li>Keep the notched licence with you. Carry all licences for the year <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Take photos: the deer, the notched licence, the spot. Tip.<\/li><\/ul>"},{"title":"4. Evidence of sex","html":"<ul><li>Evidence of sex stays <strong>naturally attached<\/strong> to the carcass until home, the meat cutter, cold storage or inspection (75%, secondary).<\/li><li>Buck: the part of the head with antlers, <strong>or<\/strong> testicles or penis plus the tail or a patch of hide (75%, secondary).<\/li><li>Doe: the head part where antlers would be, <strong>or<\/strong> udder or teats plus the tail or a patch of hide (75%, secondary).<\/li><li>Antler restricted season (like 4 point): antlers stay on part of the skull <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Do <strong>not<\/strong> cut these off during field dressing. Plan your cuts around them. Tip.<\/li><\/ul>"},{"title":"5. Field dress (gutted method)","html":"<figure class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 492\" font-family=\"sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"400\" height=\"492\" fill=\"#fffaf0\"/>\n  <text x=\"200\" y=\"26\" font-size=\"19\" font-weight=\"bold\" fill=\"#23261f\" text-anchor=\"middle\">Field dressing: gutted method<\/text>\n  <g transform=\"translate(0,24)\">\n  <!-- deer lying on its back is hard to read; simple standing side outline, head left -->\n  <g stroke=\"#23261f\" stroke-width=\"2.5\" stroke-linejoin=\"round\">\n    <!-- legs -->\n    <rect x=\"120\" y=\"150\" width=\"14\" height=\"70\" rx=\"5\" fill=\"#8a9a6b\"/>\n    <rect x=\"142\" y=\"150\" width=\"14\" height=\"66\" rx=\"5\" fill=\"#8a9a6b\"/>\n    <rect x=\"262\" y=\"150\" width=\"14\" height=\"70\" rx=\"5\" fill=\"#8a9a6b\"/>\n    <rect x=\"284\" y=\"150\" width=\"14\" height=\"66\" rx=\"5\" fill=\"#8a9a6b\"/>\n    <!-- body -->\n    <ellipse cx=\"210\" cy=\"125\" rx=\"110\" ry=\"42\" fill=\"#8a9a6b\"/>\n    <!-- neck -->\n    <path d=\"M118 112 L82 62 L104 52 L142 100 Z\" fill=\"#8a9a6b\"/>\n    <!-- head -->\n    <ellipse cx=\"80\" cy=\"56\" rx=\"30\" ry=\"16\" fill=\"#8a9a6b\"/>\n    <!-- ear -->\n    <path d=\"M96 44 L112 24 L106 48 Z\" fill=\"#8a9a6b\"/>\n    <!-- antler -->\n    <path d=\"M90 42 L94 14 M94 26 L84 16 M94 20 L104 8\" fill=\"none\" stroke=\"#6b4f35\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n    <!-- tail -->\n    <path d=\"M318 108 L334 100 L330 116 Z\" fill=\"#fffaf0\"/>\n  <\/g>\n  <!-- belly cut line -->\n  <line x1=\"150\" y1=\"164\" x2=\"300\" y2=\"160\" stroke=\"#e8590c\" stroke-width=\"3\" stroke-dasharray=\"8 6\"/>\n  <!-- diaphragm line -->\n  <line x1=\"178\" y1=\"88\" x2=\"178\" y2=\"164\" stroke=\"#e8590c\" stroke-width=\"3\" stroke-dasharray=\"6 6\"/>\n  <!-- numbered markers -->\n  <g font-size=\"16\" font-weight=\"bold\" text-anchor=\"middle\">\n    <circle cx=\"60\" cy=\"84\" r=\"14\" fill=\"#2f3a2b\"/><text x=\"60\" y=\"90\" fill=\"#fffaf0\">1<\/text>\n    <circle cx=\"350\" cy=\"140\" r=\"14\" fill=\"#2f3a2b\"/><text x=\"350\" y=\"146\" fill=\"#fffaf0\">2<\/text>\n    <circle cx=\"300\" cy=\"186\" r=\"14\" fill=\"#2f3a2b\"/><text x=\"300\" y=\"192\" fill=\"#fffaf0\">3<\/text>\n    <circle cx=\"225\" cy=\"190\" r=\"14\" fill=\"#2f3a2b\"/><text x=\"225\" y=\"196\" fill=\"#fffaf0\">4<\/text>\n    <circle cx=\"178\" cy=\"66\" r=\"14\" fill=\"#2f3a2b\"/><text x=\"178\" y=\"72\" fill=\"#fffaf0\">5<\/text>\n    <circle cx=\"120\" cy=\"80\" r=\"14\" fill=\"#2f3a2b\"/><text x=\"120\" y=\"86\" fill=\"#fffaf0\">6<\/text>\n    <circle cx=\"210\" cy=\"125\" r=\"14\" fill=\"#2f3a2b\"/><text x=\"210\" y=\"131\" fill=\"#fffaf0\">7<\/text>\n  <\/g>\n  <!-- legend -->\n  <g font-size=\"15\" fill=\"#23261f\">\n    <text x=\"16\" y=\"256\" fill=\"#23261f\">1  Confirm dead. Notch licence first.<\/text>\n    <text x=\"16\" y=\"284\" fill=\"#23261f\">2  Gloves on. Cut around the anus, tie off.<\/text>\n    <text x=\"16\" y=\"312\" fill=\"#23261f\">3  Open hide at the pelvis, blade up.<\/text>\n    <text x=\"16\" y=\"340\" fill=\"#23261f\">4  Cut belly to ribs. Fingers guard blade.<\/text>\n    <text x=\"16\" y=\"368\" fill=\"#23261f\">5  Cut the diaphragm along the ribs.<\/text>\n    <text x=\"16\" y=\"396\" fill=\"#23261f\">6  Reach up, cut windpipe and gullet.<\/text>\n    <text x=\"16\" y=\"424\" fill=\"#23261f\">7  Roll guts out. Prop cavity open to cool.<\/text>\n  <\/g>\n  <text x=\"16\" y=\"456\" font-size=\"14\" fill=\"#6b4f35\">Orange dashes: cut lines. Do not cut the gut.<\/text>\n<\/g>\n<\/svg>\n<\/figure><ul><li>Gloves on. Do not cut the stomach or guts (Washington Department of Fish and Wildlife food safety page, 75%).<\/li><li>If gut contents touch meat, wipe them off right away with a clean cloth <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Do it fast. Remove the guts as quickly as you can <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Leave the evidence of sex attached. Check before each cut. Tip.<\/li><\/ul>"},{"title":"6. Gutless method (overview)","html":"<ul><li>Skin one side down the back. Take the hind quarter, front quarter, back strap. Tip.<\/li><li>Reach in behind the last rib for the tenderloin. Tip.<\/li><li>Flip and repeat. Then neck meat and rib meat. Tip.<\/li><li>You must still take neck, ribs, all four quarters and loins <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>. These are the legal edible portions.<\/li><li>Keep evidence of sex with the meat, naturally attached to one piece. <span class=\"verify\">VERIFY<\/span> how this works with boned meat.<\/li><li>Good for a deer far from the truck. Leave guts and bones at the site <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><\/ul>"},{"title":"7. Cool the meat","html":"<ul><li>Cool it below 4°C (40°F) as fast as you can (75%, Washington Department of Fish and Wildlife).<\/li><li>Best: in a cooler or cold room the same day <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Prop the chest open. Air must move. Shade, off the ground. Tip.<\/li><li><strong>No plastic or tarp<\/strong> on a warm carcass. It holds the heat <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Light game bags keep flies off <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Warm October afternoon in the valley: get it to a cooler fast. Tip.<\/li><\/ul>"},{"title":"8. Transport legally","html":"<ul><li>Carry your notched species licence with the meat <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Anyone moving your deer <strong>without you<\/strong> needs a <strong>Record of Receipt<\/strong> <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Record of Receipt: date and place, your name and address, who gets it, your <button class=\"term\" data-term=\"FWID\">FWID<\/button> (Fish and Wildlife ID), species licence number, species and sex <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Evidence of sex stays attached in transport <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Rifle unloaded in the truck or on the <button class=\"term\" data-term=\"ATV\">ATV<\/button> (all terrain vehicle): chamber and magazine empty <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Region 3 is not in the <button class=\"term\" data-term=\"CWD\">CWD<\/button> (Chronic Wasting Disease) Management Zone, so its parts rules do not apply here <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><\/ul>"},{"title":"9. Report","html":"<ul><li>Compulsory reporting for deer in your <button class=\"term\" data-term=\"MU\">MU<\/button> (Management Unit): <span class=\"verify\">VERIFY<\/span> in the synopsis.<\/li><li>Where it applies: report within 30 days with location, date, days hunted, weapon and more <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>2026 mandatory hunter reports cover elk, moose and caribou licences, not deer <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Write it in your journal tonight. Tip.<\/li><\/ul><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>Notch first, knife second. And never let a warm deer sit in a closed truck.<\/p><\/aside><aside class=\"callout mistake\"><div class=\"callout-t\">Common mistakes<\/div><ul><li>Following too soon and pushing a hit deer out of the country.<\/li><li>Cutting off the evidence of sex while gutting.<\/li><li>Wrapping a warm carcass in a tarp for the drive home.<\/li><\/ul><\/aside><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>Pack: knife, spare blade, gloves, game bags, 10 m of rope, flagging tape, pen, Record of Receipt notes.<\/p><\/aside><div class=\"checklist\" data-list=\"s13-after\"><label class=\"check\"><input type=\"checkbox\" data-key=\"s13-after:0\"><span>Waited and marked the spot<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s13-after:1\"><span>Licence notched before touching<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s13-after:2\"><span>Evidence of sex still attached<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s13-after:3\"><span>Guts out, no gut contents on meat<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s13-after:4\"><span>Cavity open and cooling, no plastic<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s13-after:5\"><span>Record of Receipt filled if someone else moves it<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s13-after:6\"><span>Compulsory reporting checked (<span class=\"verify\">VERIFY<\/span>)<\/span><\/label><\/div>"},{"title":"Sources","html":"<ul><li><a href=\"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/species-licences\" target=\"_blank\" rel=\"noopener\">BC species licences page<\/a> (search preview), checked 2026-10-01: notch immediately, before handling.<\/li><li><a href=\"https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis.pdf\" target=\"_blank\" rel=\"noopener\">BC Hunting and Trapping Regulations Synopsis 2026 to 2028<\/a> (search preview), checked 2026-10-01: edible portions, Record of Receipt, CWD zone.<\/li><li><a href=\"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/compulsory-reporting\" target=\"_blank\" rel=\"noopener\">BC compulsory reporting page<\/a> (search preview), checked 2026-10-01: 30 day reporting.<\/li><li><a href=\"https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/2026_hunting-trapping_regulation_changes_summary.pdf\" target=\"_blank\" rel=\"noopener\">2026 regulation changes summary<\/a> (search preview), checked 2026-10-01: mandatory hunter report species.<\/li><li><a href=\"https://wdfw.wa.gov/hunting/requirements/food-safety\" target=\"_blank\" rel=\"noopener\">Washington Department of Fish and Wildlife, food safety for game meat<\/a> (search preview, not BC law, 75% max), checked 2026-10-01: cooling, gloves, no plastic.<\/li><li>Secondary, 60 to 79% max: <a href=\"https://bcfirearmsacademy.ca/possession-transportation-big-game/\" target=\"_blank\" rel=\"noopener\">BC Firearms Academy, evidence of sex and transport<\/a>; <a href=\"https://www.huntingbc.ca/forum/archive/index.php/t-92535.html\" target=\"_blank\" rel=\"noopener\">HuntingBC forum, wounded game on private land<\/a>. Checked 2026-10-01.<\/li><li>Tracking and dressing steps: common hunter practice (Tip).<\/li><\/ul>"}],"quiz":[{"q":"The deer is down. What is the first legal step?","options":["Field dress it fast","Notch the species licence before you handle it","Drag it to the truck"],"answer":1,"why":"The licence must be cancelled immediately after the kill and before handling the animal."},{"q":"Why not wrap the carcass in a tarp for the drive?","options":["It is illegal","It holds heat and the meat can spoil","It hides the evidence of sex"],"answer":1,"why":"Plastic and tarps trap heat. Meat needs to drop below 4°C fast."},{"q":"Your friend drives your deer home while you stay at camp. What does he need?","options":["Nothing","A Record of Receipt from you","His own deer licence"],"answer":1,"why":"Anyone carrying wildlife killed by another person needs a Record of Receipt."},{"q":"Using the gutless method, what must you take out?","options":["Back straps and hind quarters","Neck, ribs, all four quarters and the loins","Whatever fits in the pack"],"answer":1,"why":"Those are the legal edible portions of big game. Leaving them is wastage."}],"checklists":["s13-after"],"text":" !why the shot is 1 second. the next 3 hours decide if you find the deer and if the meat is good. !warn study aid only. the official regulations are the law. - fast order: wait, mark, track, approach, notch, evidence, dress, cool, transport, report. - tagging and evidence rules are law. tracking and dressing steps are skills (tip). - your brother hunts too. each of you notches only your own licence. tip. 1. wait and mark - stay still. watch where it runs. listen for a crash. tip. - rifle reloaded and on safe. watch for 5 minutes in case it stands. tip. - drop a phone map pin where you shot from and where the deer stood. tip. - note a landmark at the last place you saw it (a tree, a rock). tip. - wait about 30 minutes before you follow. longer if you think the hit was far back. tip, common hunter practice, not law. 2. track - go to where it stood. look for blood, hair, scuffed ground. tip. - bright pink, bubbly blood often means a lung hit. dark blood or gut matter: back out and wait hours. tip. - mark each blood spot with tape or a phone pin. tip. - lost the trail? go back to the last blood. search in slow circles. get your brother to help. tip. - trail goes into posted private land, a park or a no shooting area: stop. ask the owner or call a conservation officer (70%). see phase 2 session 5. - you must make a real effort to recover wounded game (70%). verify the exact rule. 3. approach and notch - come from behind the back, rifle ready. touch the eye with a stick. no blink means dead. tip. - notch (cancel) the species licence immediately after the kill and before you handle the animal (85%). - follow the notch instructions printed on the licence (85%). exact fields: verify on your licence. - keep the notched licence with you. carry all licences for the year (85%). - take photos: the deer, the notched licence, the spot. tip. 4. evidence of sex - evidence of sex stays naturally attached to the carcass until home, the meat cutter, cold storage or inspection (75%, secondary). - buck: the part of the head with antlers, or testicles or penis plus the tail or a patch of hide (75%, secondary). - doe: the head part where antlers would be, or udder or teats plus the tail or a patch of hide (75%, secondary). - antler restricted season (like 4 point): antlers stay on part of the skull (75%). - do not cut these off during field dressing. plan your cuts around them. tip. 5. field dress (gutted method) - gloves on. do not cut the stomach or guts (washington department of fish and wildlife food safety page, 75%). - if gut contents touch meat, wipe them off right away with a clean cloth (75%). - do it fast. remove the guts as quickly as you can (75%). - leave the evidence of sex attached. check before each cut. tip. 6. gutless method (overview) - skin one side down the back. take the hind quarter, front quarter, back strap. tip. - reach in behind the last rib for the tenderloin. tip. - flip and repeat. then neck meat and rib meat. tip. - you must still take neck, ribs, all four quarters and loins (85%). these are the legal edible portions. - keep evidence of sex with the meat, naturally attached to one piece. verify how this works with boned meat. - good for a deer far from the truck. leave guts and bones at the site (85%). 7. cool the meat - cool it below 4°c (40°f) as fast as you can (75%, washington department of fish and wildlife). - best: in a cooler or cold room the same day (75%). - prop the chest open. air must move. shade, off the ground. tip. - no plastic or tarp on a warm carcass. it holds the heat (75%). - light game bags keep flies off (75%). - warm october afternoon in the valley: get it to a cooler fast. tip. 8. transport legally - carry your notched species licence with the meat (85%). - anyone moving your deer without you needs a record of receipt (85%). - record of receipt: date and place, your name and address, who gets it, your fwid (fish and wildlife id), species licence number, species and sex (85%). - evidence of sex stays attached in transport (75%). - rifle unloaded in the truck or on the atv (all terrain vehicle): chamber and magazine empty (85%). - region 3 is not in the cwd (chronic wasting disease) management zone, so its parts rules do not apply here (85%). 9. report - compulsory reporting for deer in your mu (management unit): verify in the synopsis. - where it applies: report within 30 days with location, date, days hunted, weapon and more (85%). - 2026 mandatory hunter reports cover elk, moose and caribou licences, not deer (80%). - write it in your journal tonight. tip. !rule notch first, knife second. and never let a warm deer sit in a closed truck. !mistake - following too soon and pushing a hit deer out of the country. - cutting off the evidence of sex while gutting. - wrapping a warm carcass in a tarp for the drive home. !field pack: knife, spare blade, gloves, game bags, 10 m of rope, flagging tape, pen, record of receipt notes. sources - bc species licences page (https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/species-licences) (search preview), checked 2026-10-01: notch immediately, before handling. - bc hunting and trapping regulations synopsis 2026 to 2028 (https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis.pdf) (search preview), checked 2026-10-01: edible portions, record of receipt, cwd zone. - bc compulsory reporting page (https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/compulsory-reporting) (search preview), checked 2026-10-01: 30 day reporting. - 2026 regulation changes summary (https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/2026_hunting-trapping_regulation_changes_summary.pdf) (search preview), checked 2026-10-01: mandatory hunter report species. - washington department of fish and wildlife, food safety for game meat (https://wdfw.wa.gov/hunting/requirements/food-safety) (search preview, not bc law, 75% max), checked 2026-10-01: cooling, gloves, no plastic. - secondary, 60 to 79% max: bc firearms academy, evidence of sex and transport (https://bcfirearmsacademy.ca/possession-transportation-big-game/); huntingbc forum, wounded game on private land (https://www.huntingbc.ca/forum/archive/index.php/t-92535.html). checked 2026-10-01. - tracking and dressing steps: common hunter practice (tip). "},{"id":"firearm-safety","phase":2,"num":1,"title":"Firearm safety refresher","minutes":12,"checked":"2026-10-01","steps":[{"title":"Firearm safety refresher","html":"<aside class=\"callout why\"><div class=\"callout-t\">Why it matters<\/div><p>You both passed the course. Now there are two loaded guns, two new hunters, cold hands and excitement. That is when habits matter.<\/p><\/aside><aside class=\"callout warn\"><div class=\"callout-t\">Warning<\/div><p>Study aid only. The official regulations are the law.<\/p><\/aside>"},{"title":"ACTS: the Vital Four","html":"<p>The CFSC (Canadian Firearms Safety Course) teaches these as the \"Vital Four ACTS\" <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/p><ul><li><strong>A<\/strong>ssume every firearm is loaded <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>C<\/strong>ontrol the muzzle direction at all times <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>T<\/strong>rigger finger off the trigger and out of the trigger guard <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>S<\/strong>ee that the firearm is unloaded: PROVE it safe <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Wording read in search previews of the course handbook and course provider pages, not the full handbook (see Sources).<\/li><\/ul>"},{"title":"PROVE it safe","html":"<ul><li><strong>P<\/strong>oint the firearm in the safest available direction <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>R<\/strong>emove all cartridges <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>O<\/strong>bserve the chamber <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>V<\/strong>erify the feeding path <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>E<\/strong>xamine the bore for obstructions <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Do ACTS and PROVE every time you pick up, put down, hand over or receive a firearm <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Also when you clean it, and before you store or transport it <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><\/ul><aside class=\"callout tip\"><div class=\"callout-t\">Tip (opinion)<\/div><p>Say each letter out loud when you PROVE it. Have your brother do the same. You each catch the other skipping a step.<\/p><\/aside>"},{"title":"Zones of fire","html":"<ul><li>A zone of fire is the only slice of ground where you may shoot <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Hunter education teaches about 45 degrees straight ahead for each hunter <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Never swing the muzzle outside it, even tracking a running deer <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Every shot also needs a safe <button class=\"term\" data-term=\"Backstop\">Backstop<\/button>. Sky is never one.<\/li><\/ul><figure class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 560\" font-family=\"sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"400\" height=\"560\" fill=\"#fffaf0\"/>\n  <text x=\"200\" y=\"26\" font-size=\"18\" font-weight=\"bold\" fill=\"#23261f\" text-anchor=\"middle\">Walking side by side<\/text>\n  <path d=\"M120,230 L66,100 A140,140 0 0 1 174,100 Z\" fill=\"#8a9a6b\" fill-opacity=\"0.55\" stroke=\"#2f3a2b\" stroke-width=\"2\"/>\n  <path d=\"M280,230 L226,100 A140,140 0 0 1 334,100 Z\" fill=\"#8a9a6b\" fill-opacity=\"0.55\" stroke=\"#2f3a2b\" stroke-width=\"2\"/>\n  <text x=\"120\" y=\"160\" font-size=\"15\" fill=\"#23261f\" text-anchor=\"middle\">A shoots<\/text>\n  <text x=\"120\" y=\"178\" font-size=\"15\" fill=\"#23261f\" text-anchor=\"middle\">here only<\/text>\n  <text x=\"280\" y=\"160\" font-size=\"15\" fill=\"#23261f\" text-anchor=\"middle\">B shoots<\/text>\n  <text x=\"280\" y=\"178\" font-size=\"15\" fill=\"#23261f\" text-anchor=\"middle\">here only<\/text>\n  <path d=\"M174,100 L200,60 L226,100 L200,215 Z\" fill=\"#e8590c\" fill-opacity=\"0.25\" stroke=\"#e8590c\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/>\n  <text x=\"200\" y=\"52\" font-size=\"14\" fill=\"#e8590c\" text-anchor=\"middle\" font-weight=\"bold\">NO SHOT<\/text>\n  <circle cx=\"120\" cy=\"238\" r=\"12\" fill=\"#6b4f35\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <circle cx=\"280\" cy=\"2
