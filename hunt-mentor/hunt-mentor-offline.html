best near the rut, early november (70%) mistakes and rules !mistake - checking the wind once at the truck, then never again. - moving when a deer is staring at you. - wearing loud nylon and a jingling pack. !rule when a deer stamps, you've already lost the eyes. don't lose the ears too. freeze. !rule the deer never makes a mistake with its nose. make yours with the wind in your favour. sources - jacobs and others 1994, deer colour vision (cone peaks), via research notes, checked 2026-10-01 (85%) - d'angelo and others 2007, deer hearing (https://wildlife.onlinelibrary.wiley.com/doi/abs/10.2193/2006-326), checked 2026-10-01 (85%) - stewart and others 2002, deer activity timing (https://academic.oup.com/jmammal/article/84/3/1076/905056), checked 2026-10-01 (85%) - monteith and others 2011, what triggers migration (https://esajournals.onlinelibrary.wiley.com/doi/full/10.1890/es10-00096.1), checked 2026-10-01 (85%) - bc wildlife federation, southern interior mule deer project (https://bcwf.bc.ca/initiatives/mule-deer-project/), checked 2026-10-01 (85%) - lingle 2003, deer group behaviour and predators, via research notes, checked 2026-10-01 (85%) - bc chronic wasting disease page (https://www2.gov.bc.ca/gov/content/environment/plants-animals-ecosystems/wildlife/wildlife-conservation/wildlife-health/chronic-wasting-disease/cwd-bc), search preview, checked 2026-10-01 (80%) - research notes: research/2026-10-01-deer.md . "}],"glossary":{"ACTS":"Firearm safety rules. Assume every firearm is loaded. Control the muzzle direction at all times. Trigger finger off the trigger and out of the trigger guard. See that the firearm is unloaded: PROVE it safe <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.","Antlerless":"A deer with no antlers. Usually a doe or a fawn. Some seasons only allow antlerless.","ATV":"All terrain vehicle. A quad.","Backstop":"What is behind your target that will stop the bullet. Earth is good. Sky is never a backstop.","Bag limit":"Most animals of a kind you may take in one day (birds) or one year (big game).","Bore sight":"Lining up the scope with the barrel before shooting, to get on paper fast.","CORE":"Conservation and Outdoor Recreation Education. BC hunter education course.","Crown land":"Public land owned by the province. Hunting is often allowed unless closed.","CWD":"Chronic Wasting Disease. A fatal brain disease in deer, elk and moose.","ECCC":"Environment and Climate Change Canada. Sets migratory bird rules.","FSR":"Forest Service Road. Gravel resource road on Crown land.","FWID":"Fish and Wildlife ID. Your 9 digit BC hunter number. Replaced the old hunter number card.","Glassing":"Scanning country slowly with binoculars to find animals.","LEH":"Limited Entry Hunting. A draw for special hunts.","MGBHP":"Migratory Game Bird Hunting Permit. Federal permit to hunt ducks and geese. Includes the habitat stamp.","MU":"Management Unit. A numbered hunting area, like 3 17. Rules differ by MU.","PAL":"Possession and Acquisition Licence. Federal licence to own and buy firearms.","Patterning":"Shooting a shotgun at paper to see how the shot spreads.","PFD":"Personal flotation device. A life jacket.","Picatinny rail":"A standard mounting strip with slots, used to attach scope rings.","Species licence":"The BC \"tag\" for a big game animal. Paper, notched when you kill the animal.","Synopsis":"The BC Hunting and Trapping Regulations Synopsis. Plain language summary of the law.","WILD":"Wildlife Information and Licensing Data. BC online system to buy licences.","Zero":"The distance where your bullet hits exactly where the crosshair points.","4 point buck":"A buck with 4 or more points on one antler, not counting the brow tine. Each point at least 2.5 cm long and longer than wide (80%, <span class=\"verify\">VERIFY<\/span> in the synopsis).","Bachelor group":"A small summer group of bucks (2 to 4) that breaks up in fall.","Brow tine":"The short point near the base of the antler, just above the eye.","Browse":"Twigs, buds and leaves of shrubs and trees that deer eat. Also the sign left when they eat them.","Button buck":"A male fawn with small bumps instead of antlers. Counts as antlerless.","Flag":"A white tail's raised, waving white tail when it runs from danger.","Forb":"A small leafy flowering plant that is not a grass.","Metatarsal gland":"A scent patch on the outside of a deer's hind leg. Long on mule deer, small on white tails.","Pre rut":"The weeks before the rut. Bucks spar, rub trees and start checking does.","Rattling":"Clacking antlers together to sound like fighting bucks.","Riparian":"The green strip of land along a river or creek.","Rub":"Bark scraped off a sapling by a buck's antlers.","Rut":"The breeding season. Mule deer mid November to mid December. White tails peak in November.","Scrape":"A pawed bare patch of dirt under a low branch, made by a buck around the rut.","Spot and stalk":"Find the animal with binoculars from far away, then sneak within range.","Stand hunting":"Sitting in one spot, such as a tree stand or ground blind, on a trail and waiting.","Still hunting":"Walking very slowly through cover, stopping often to look and listen.","Stot":"The mule deer bounce. All 4 feet hit the ground and push off together.","Thermals":"Air sliding up a slope as it warms (morning) and down as it cools (evening). They carry your scent.","Tine":"A branch of an antler. Also called a point.","Winter range":"The lower, sunnier slopes where deer spend the winter.","PROVE":"Firearm safety steps. Point the firearm in the safest available direction. Remove all cartridges. Observe the chamber. Verify the feeding path. Examine the bore <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.","Zone of fire":"The slice of ground in front of a hunter where they may shoot, about 45 degrees. Never swing past it.","Cold shock":"The gasp and fast breathing in the first minute in cold water.","1 10 1 principle":"A name for cold water stages: about 1 minute of cold shock, 10 minutes of useful movement, 1 hour to unconsciousness. A guide, not exact timing.","HELP":"Heat Escape Lessening Posture. Knees up and arms crossed in the water to slow heat loss.","PCOC":"Pleasure Craft Operator Card. Proof of competency to run a boat fitted with a motor.","FVPA":"Firearm Violence Prevention Act. BC law in force 1 October 2026 on loaded firearms and shooting from vehicles and boats.","STOP":"Stop, Think, Observe, Plan. What to do when lost, disoriented or hurt.","Trip plan":"A written plan of who, where, route and return time, left with someone at home.","Satellite messenger":"A device that sends SOS and texts by satellite where there is no cell signal.","RAPP":"Report All Poachers and Polluters. BC line to report wildlife and environmental violations: 1 877 952 7277 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.","Tourniquet":"A band tightened above a wound on an arm or leg to stop life threatening bleeding.","SOFTT":"Special Operations Forces Tactical Tourniquet. A commercial windlass tourniquet.","Stalking":"Closing the distance on an animal you have already seen.","Record of Receipt":"A written note that must go with game carried by someone other than the hunter who killed it.","Evidence of sex":"The body part that must stay naturally attached to show if the animal was male or female.","Edible portions":"Meat you must not waste. Big game: neck, ribs, all 4 quarters and the loins. Game birds: both breasts <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.","Loaded":"In BC, live ammunition in the chamber or in a magazine attached to the firearm <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.","Road allowance":"The strip along a road where hunting and shooting are banned <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>. See the BC rules session.","No Shooting Area":"A mapped area where firing a firearm is banned.","Motor Vehicle Closed Area":"An area where some or all motor vehicles are banned.","Ecological reserve":"Protected land. No hunting and no firing a firearm or bow <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.","Enclosed land":"Under the Trespass Act, land with a lawful fence, a natural boundary, or trespass signs at each normal access point.","Non toxic shot":"Shot that is not lead, such as steel, bismuth or tungsten. Required for ducks and geese.","Magazine plug":"A filler that limits a shotgun to 3 shells in total. Must not come out unless the gun is taken apart.","Compulsory reporting":"A required report of a kill within 30 days, for listed species and areas.","Field dressing":"Removing the guts soon after the kill.","Gutless method":"Taking the meat off without opening the body cavity.","Conservation officer":"BC wildlife law enforcement officer.","Puddle duck":"A duck that feeds by tipping up in shallow water and jumps straight up to fly. Mallard, teal, wigeon.","Diver":"A duck that dives for food and runs along the water to take off. Goldeneye, bufflehead.","Jump shooting":"Sneaking up on ducks on small water and shooting as they flush.","Pass shooting":"Shooting ducks as they fly over between roost and feeding areas.","Decoy spread":"The pattern you set decoys in.","J hook":"A decoy spread shaped like a J, with an open landing pocket in front of the hunter.","Landing zone":"The open water in a decoy spread where you want ducks to land.","Steel shot":"Non toxic shotgun pellets made of steel. Legal for ducks.","Choke":"The narrowing at the end of a shotgun barrel that controls the spread of shot. Must be rated for steel to shoot steel.","Power boat":"Under BC rules, a boat with a motor ready to use.","Covey":"A fall or winter flock of quail.","ORV":"Off Road Vehicle. An ATV, dirt bike or side by side under BC law.","Cultivated land":"Farmed land, orchards included. You need permission to hunt it.","Grazing lease":"Crown land leased for livestock. You need the lease holder's OK while livestock are on it."},"regs":{"edition":"BC Hunting and Trapping Regulations Synopsis 2026 to 2028 (in force 1 July 2026 to 30 June 2028)","lastChecked":"2026-10-01","note":"Values marked from search extracts were read in search previews of official pages, not the full page. They are capped at 85% until the full source is read. Blank values are VERIFY.","links":[{"name":"BC Hunting and Trapping Regulations Synopsis","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/regulations-synopsis"},{"name":"BC species licences","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/species-licences"},{"name":"BC Fish and Wildlife ID (FWID)","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/wild-system/fish-wildlife-id"},{"name":"BC hunting FAQ","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/frequently-asked-questions"},{"name":"Federal Migratory Game Bird Hunting Permit","url":"https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/permit.html"},{"name":"ECCC BC migratory bird regulations summary","url":"https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/regulations-provincial-territorial-summaries/british-columbia.html"}],"hours":{"bigGame":{"beforeSunriseMin":60,"afterSunsetMin":60,"certainty":80,"text":"No hunting from 1 hour after sunset to 1 hour before sunrise. Applies to big game and upland birds (all wildlife except migratory game birds)."},"migratory":{"beforeSunriseMin":30,"afterSunsetMin":30,"certainty":85,"text":"Ducks and geese: half an hour before sunrise to half an hour after sunset (south of 60 degrees north)."}},"items":[{"group":"licence","key":"fwid","label":"Hunter number","value":"Now called FWID (Fish and Wildlife ID), 9 digits. Old hunter number plus 3 digits at the front. No physical card.","certainty":85,"source":"BC Fish and Wildlife ID page (search extract)","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/wild-system/fish-wildlife-id","checked":"2026-10-01"},{"group":"licence","key":"carry","label":"What to carry","value":"Photo ID. Know your FWID number. All paper species licences for the year (used and unused). Federal bird permit (paper or phone) for ducks and geese.","certainty":85,"source":"BC hunting FAQ; ECCC permit page (search extracts)","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/frequently-asked-questions","checked":"2026-10-01"},{"group":"licence","key":"huntlic","label":"Resident hunting licence","value":"$25 + $7 surcharge. Electronic only. Bought in WILD online or at Service BC / FrontCounter BC.","note":"GST: VERIFY at checkout.","certainty":80,"source":"BC hunting licences page (search extract)","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/hunting-licences","checked":"2026-10-01"},{"group":"licence","key":"year","label":"Licence year","value":"1 April to 31 March","certainty":85,"source":"Hunting Licensing Regulation, s.1 (search extract)","url":"https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/8_99","checked":"2026-10-01"},{"group":"licence","key":"muledeer","label":"Mule deer species licence","value":"$12 + $3 surcharge","certainty":80,"source":"BC species licences page (search extract)","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/species-licences","checked":"2026-10-01"},{"group":"licence","key":"wtdeer","label":"White tailed deer species licence","value":"$12 + $3 surcharge","certainty":80,"source":"BC species licences page (search extract)","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/species-licences","checked":"2026-10-01"},{"group":"licence","key":"print","label":"Buying species licences","value":"Cannot be printed at home. Online orders are mailed (about 14 days). Hunting soon: buy in person.","certainty":85,"source":"BC species licences page (search extract)","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/species-licences","checked":"2026-10-01"},{"group":"licence","key":"wait","label":"Waiting period after buying","value":"","note":"A 2 day waiting period exists for some species. Does it cover deer? VERIFY.","certainty":50,"source":"BC species licences page","checked":"2026-10-01"},{"group":"licence","key":"upland","label":"Quail and grouse licence (residents)","value":"No species licence. BC hunting licence only.","certainty":80,"source":"BC species licences page (search extract)","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/species-licences","checked":"2026-10-01"},{"group":"migratory","key":"mgbhp","label":"Federal Migratory Game Bird Hunting Permit","value":"$17 + tax, stamp included. 2026 e permit valid 1 Aug 2026 to 30 Jun 2027. Buy online, carry on phone or paper.","certainty":80,"source":"ECCC permit page (search extract)","url":"https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/permit.html","checked":"2026-10-01"},{"group":"safety","key":"dwelling","label":"Shooting near buildings","value":"No hunting or shooting within 100 m of a church, school, playground, regional park, or a dwelling house or farm or ranch building occupied by people or domestic animals. The owner exemption covers slaughtering livestock only, not hunting.","certainty":85,"source":"BC synopsis 2026 to 2028 and B.C. Reg. 190/84 (search preview)","url":"https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/190_84_01","checked":"2026-10-01"},{"group":"safety","key":"companion","label":"Unlicensed companion","value":"May come along and watch, and help pack meat out, if not carrying a firearm or weapon and not hunting. Licensed hunter must stay with the meat unless a transport record is filled in.","certainty":80,"source":"BC hunting FAQ; Wildlife Act s.1 (search extracts)","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/frequently-asked-questions","checked":"2026-10-01"},{"group":"deerR3","key":"r3bag","label":"Region 3 deer bag limit","value":"","note":"Search extract says 3 combined (1 mule deer, 2 white tailed). VERIFY in Region 3 synopsis.","certainty":60,"source":"Region 3 synopsis (search extract)","url":"https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis-region-3-thompson.pdf","checked":"2026-10-01"},{"group":"deerR3","key":"r3mu","label":"MU (Management Unit) for Heffley Creek and Sun Peaks","value":"","note":"VERIFY on official MU map.","certainty":0,"source":"Region 3 synopsis map","checked":"2026-10-01"},{"group":"deerR3","key":"r3mule","label":"Region 3 mule deer season (your MU)","value":"","note":"VERIFY dates and antler rules.","certainty":0,"source":"Region 3 synopsis","checked":"2026-10-01"},{"group":"quail","key":"r8quail","label":"Region 8 California quail","value":"1 Oct to 30 Nov. Daily bag 10, possession 30. MUs 8-1 to 8-15 and 8-21 to 8-26.","certainty":70,"source":"Region 8 synopsis (search extract)","url":"https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis-region-8-okanagan.pdf","checked":"2026-10-01"},{"group":"quail","key":"r3quail","label":"Region 3 California quail","value":"","note":"Is there a season near Heffley Creek? VERIFY.","certainty":0,"source":"Region 3 synopsis","checked":"2026-10-01"},{"group":"safety","key":"fvpa","label":"BC Firearm Violence Prevention Act","value":"In force 1 October 2026. Offences include transporting loaded firearms in a vehicle and shooting from vehicles and boats. Hunting exemptions come by regulation.","note":"Exact hunting exemptions: VERIFY.","certainty":85,"source":"BC news release (search preview)","url":"https://news.gov.bc.ca/releases/2026PSSG0037-000460","checked":"2026-10-01"},{"group":"safety","key":"rapp","label":"Report poaching (RAPP)","value":"1 877 952 7277, 24/7, can stay anonymous","certainty":85,"source":"BC RAPP page (search preview)","url":"https://www2.gov.bc.ca/gov/content/environment/natural-resource-stewardship/natural-resource-law-enforcement/conservation-officer-service/cos-rapp","checked":"2026-10-01"},{"group":"migratory","key":"ducksR3","label":"Duck season near Kamloops","value":"","note":"Search previews gave 3 different date ranges. VERIFY in the ECCC BC summary for your district.","certainty":0,"source":"ECCC BC summary","url":"https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/regulations-provincial-territorial-summaries/british-columbia.html","checked":"2026-10-01"},{"group":"migratory","key":"duckbag","label":"Duck daily bag (BC)","value":"8 ducks a day; at most 4 pintails, 4 canvasbacks, 2 goldeneyes, 2 harlequins. Possession 24.","note":"VERIFY for your district.","certainty":70,"source":"ECCC BC summary (search preview)","url":"https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/regulations-provincial-territorial-summaries/british-columbia.html","checked":"2026-10-01"},{"group":"migratory","key":"plug","label":"Shotgun for ducks","value":"10 gauge or smaller, max 3 shells (chamber + magazine) with a plug that needs disassembly to remove. Non toxic shot only.","certainty":85,"source":"Migratory Birds Regulations, 2022 (search preview)","url":"https://laws-lois.justice.gc.ca/eng/regulations/SOR-2022-105/FullText.html","checked":"2026-10-01"},{"group":"migratory","key":"boat","label":"Ducks from a boat","value":"No hunting migratory birds from a boat moving under motor or sail. Beached, anchored or tied to a fixed blind is OK. A motorboat may be used to retrieve birds.","certainty":80,"source":"Migratory Birds Regulations, 2022 s.41; BC synopsis (search preview)","url":"https://laws-lois.justice.gc.ca/eng/regulations/SOR-2022-105/FullText.html","checked":"2026-10-01"},{"group":"quail","key":"chukar","label":"Chukar (Regions 3 and 8)","value":"","note":"Preview suggests 1 Oct to 30 Nov, bag 5. VERIFY both regions.","certainty":60,"source":"Synopsis (search preview)","checked":"2026-10-01"}]},"bases":[{"id":"heffley","name":"Heffley Creek","lat":50.86,"lon":-120.27,"region":"Region 3 Thompson","note":"Approximate centre point. Seconds of difference only."},{"id":"sunpeaks","name":"Sun Peaks","lat":50.88,"lon":-119.89,"region":"Region 3 Thompson","note":"Approximate village centre."},{"id":"mission","name":"Mission","lat":49.13,"lon":-122.31,"region":"Region 2 Lower Mainland","note":"Approximate city centre."},{"id":"okanagan","name":"Okanagan (Kelowna)","lat":49.89,"lon":-119.49,"region":"Region 8 Okanagan","note":"Approximate city centre."}],"field":{"defaults":{"firstHunt":"2026-10-15"},"legalFlow":[{"q":"Do I have my licences on me?","help":"Photo ID, FWID (Fish and Wildlife ID) number, species licence for this animal (deer), federal bird permit (ducks and geese).","stop":"No licence, no shot. Go get it."},{"q":"Is it within legal hours right now?","help":"Check the Legal light card. Ducks and geese have shorter hours than deer.","stop":"Too early or too late. Wait."},{"q":"Is the season open for this species, sex and antler type in this MU (Management Unit) today?","help":"Check the synopsis table for your exact MU. Antler rules like 4 point count.","stop":"Not open for this animal here today. Let it walk."},{"q":"Am I 100% sure what it is?","help":"Species, sex, and antler points counted. For ducks: species identified before you shoot.","stop":"Not sure means no. Watch it go and learn from it."},{"q":"Am I off the road, out of the vehicle, and not shooting along or across a road?","help":"Engine off, feet on the ground. VERIFY exact road rules in the synopsis.","stop":"Get off the road and out of the vehicle first."},{"q":"Am I more than 100 m from any occupied house, farm or ranch building?","help":"BC rule. Includes your brother's house. 85% (search preview of the synopsis).","stop":"Too close to a building. No shot."},{"q":"Am I allowed to hunt on this land?","help":"Crown land, or written or clear permission from the owner. Not a park or no shooting area.","stop":"No permission or closed area. No shot."},{"q":"Is there a safe backstop and nothing behind it?","help":"Earth behind the animal. No skyline shot. No people, roads, livestock or buildings beyond.","stop":"No safe backstop. Bullets travel kilometres. No shot."},{"q":"Is it a clean, ethical shot within my tested range?","help":"Broadside or quartering away, still animal, steady rest, inside your practised distance.","stop":"Wait for a better angle or get closer. A wounded animal is the worst outcome."}],"cards":[{"id":"emergency","title":"Emergency","sub":"Call, location, bleeding","hot":true,"html":"<h2>Emergency<\/h2><ol><li><strong>Call 911.<\/strong> If no signal, use a satellite messenger or iPhone Emergency SOS via satellite (if your model has it).<\/li><li>Say where you are: GPS (Global Positioning System) coordinates from your map app, nearest road, landmark.<\/li><li>Severe bleeding: firm direct pressure. Tourniquet high and tight on an arm or leg if pressure fails. Note the time.<\/li><li>Stay together. Keep warm. Stay put once help is called.<\/li><\/ol><h3>Numbers<\/h3><ul><li>Emergency: 911<\/li><li>RAPP (Report All Poachers and Polluters): 1 877 952 7277 <span class=\"cert c-mid\">85%<\/span><\/li><li>FrontCounter BC (licences): 1 877 855 3222 <span class=\"cert c-mid\">80%<\/span><\/li><\/ul><p class=\"muted\">Write your brother's number and the land address here on paper too.<\/p>"},{"id":"tag","title":"Tag it","sub":"Steps at the kill","html":"<h2>Right after the kill<\/h2><ol><li>Confirm the animal is dead. Approach from behind, rifle ready.<\/li><li><strong>Cancel (notch) the species licence immediately, before you touch or move the animal.<\/strong> <span class=\"cert c-mid\">85%<\/span><\/li><li>Follow the notch instructions printed on the licence itself (date and month). <span class=\"verify\">VERIFY<\/span> exact fields.<\/li><li>Keep evidence of sex attached: antlers on the head for bucks, or as the regulation lists. <span class=\"cert c-lo\">75%<\/span><\/li><li>Take photos: animal, licence, location.<\/li><li>Check if your MU needs compulsory reporting or inspection. <span class=\"verify\">VERIFY<\/span><\/li><\/ol>"},{"id":"dress","title":"After the shot","sub":"Wait, mark, track","html":"<h2>After the shot<\/h2><ol><li>Stay still. Watch where it runs. Listen.<\/li><li>Mark the spot you shot from and where it stood (phone map pin).<\/li><li>Wait at least 30 minutes before following (tip, opinion).<\/li><li>Go to where it stood. Look for blood, hair, tracks.<\/li><li>Follow the trail slowly. Mark the last blood each time.<\/li><li>Lost the trail? Grid search from the last blood. Get help.<\/li><\/ol><p class=\"muted\">Full field dressing steps come in Session 13.<\/p>"}],"checklists":[{"id":"licences","title":"Licences and paperwork","items":["Find my FWID (Fish and Wildlife ID) in WILD online","BC resident hunting licence 2026 to 2027 bought","Mule deer species licence bought IN PERSON (paper)","White tailed deer species licence bought IN PERSON (paper)","Federal Migratory Game Bird Hunting Permit (e permit on phone)","PAL (Possession and Acquisition Licence) card in wallet","Photo ID in wallet","Brother: his own hunting licence, deer licences and bird permit bought"]},{"id":"before","title":"Before every hunt","items":["Check in season regulation changes (official synopsis page)","Check area closures and fire restrictions (BC Wildfire Service)","Check road and FSR (Forest Service Road) closures","Check CWD (Chronic Wasting Disease) zones and rules","Check the season is open for my MU (Management Unit), species and sex","Legal light times for today","Trip plan left with someone (where, when back)","Weather checked","Phone charged, offline maps downloaded","Licences, ID, permit on me"]},{"id":"after","title":"After the kill","items":["Licence notched before touching the animal","Photos taken","Evidence of sex left attached","Field dressed fast","Meat cooling (open cavity, shade, game bags)","Compulsory reporting checked (VERIFY for my MU)","Journal entry written"]}]},"flashcards":[{"id":"id-mule-vs-wt","deck":"Species ID","front":"Which deer is which? Name the clues.","diagram":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 420\" font-family=\"sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"400\" height=\"420\" fill=\"#fffaf0\"/>\n  <line x1=\"200\" y1=\"10\" x2=\"200\" y2=\"410\" stroke=\"#8a9a6b\" stroke-width=\"2\" stroke-dasharray=\"6 6\" fill=\"none\"/>\n  <text x=\"100\" y=\"30\" font-size=\"18\" font-weight=\"bold\" fill=\"#2f3a2b\" text-anchor=\"middle\">Mule deer<\/text>\n  <text x=\"300\" y=\"30\" font-size=\"18\" font-weight=\"bold\" fill=\"#2f3a2b\" text-anchor=\"middle\">White tail<\/text>\n  <text x=\"200\" y=\"52\" font-size=\"14\" fill=\"#6b4f35\" text-anchor=\"middle\">Antlers (one side, seen from front)<\/text>\n  <!-- mule deer antler: forks that split again -->\n  <g stroke=\"#6b4f35\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\">\n    <path d=\"M100 190 L100 160\"/>\n    <path d=\"M100 160 L70 110\"/>\n    <path d=\"M100 160 L130 110\"/>\n    <path d=\"M70 110 L55 72\"/>\n    <path d=\"M70 110 L85 75\"/>\n    <path d=\"M130 110 L118 74\"/>\n    <path d=\"M130 110 L148 76\"/>\n    <path d=\"M100 178 L86 168\"/>\n  <\/g>\n  <text x=\"100\" y=\"212\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Forks that fork again<\/text>\n  <text x=\"100\" y=\"230\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">(\"Y\" on a \"Y\")<\/text>\n  <!-- whitetail antler: one main beam, tines up -->\n  <g stroke=\"#6b4f35\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\">\n    <path d=\"M250 190 Q240 120 300 100 Q345 90 360 120\"/>\n    <path d=\"M262 140 L258 112\"/>\n    <path d=\"M285 108 L282 72\"/>\n    <path d=\"M315 98 L318 64\"/>\n    <path d=\"M343 102 L350 76\"/>\n  <\/g>\n  <text x=\"300\" y=\"212\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">One main beam,<\/text>\n  <text x=\"300\" y=\"230\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">single tines up<\/text>\n  <text x=\"200\" y=\"262\" font-size=\"14\" fill=\"#6b4f35\" text-anchor=\"middle\">Tail and rump (seen from behind)<\/text>\n  <!-- mule deer rump -->\n  <ellipse cx=\"100\" cy=\"330\" rx=\"48\" ry=\"48\" fill=\"#f3ead8\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <rect x=\"94\" y=\"290\" width=\"12\" height=\"62\" rx=\"6\" fill=\"#f3ead8\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <rect x=\"94\" y=\"340\" width=\"12\" height=\"18\" rx=\"6\" fill=\"#23261f\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <text x=\"100\" y=\"396\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Big white rump,<\/text>\n  <text x=\"100\" y=\"413\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">thin tail, black tip<\/text>\n  <!-- whitetail flag -->\n  <ellipse cx=\"300\" cy=\"345\" rx=\"40\" ry=\"34\" fill=\"#b08a5e\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <path d=\"M300 340 C270 320 268 285 285 275 L300 270 L315 275 C332 285 330 320 300 340 Z\" fill=\"#ffffff\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <text x=\"300\" y=\"300\" font-size=\"12\" fill=\"#6b4f35\" text-anchor=\"middle\">flag up<\/text>\n  <text x=\"300\" y=\"396\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Wide brown tail,<\/text>\n  <text x=\"300\" y=\"413\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">white below, waved up<\/text>\n<\/svg>\n","back":"Left: mule deer. Forked antlers, big ears, thin white tail with a black tip, big white rump. Right: white tailed deer. One main beam with single tines, wide brown tail flagged white when alarmed."},{"id":"id-stot","deck":"Species ID","front":"A deer bounces away on all 4 feet at once. Which species?","back":"Mule deer. The bounce is called stotting. White tails gallop with the tail up."},{"id":"id-duck-shapes","deck":"Duck silhouettes","front":"Name the 4 ducks by shape and flight.","diagram":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 440\" role=\"img\" aria-label=\"Four simple duck flight silhouettes: mallard large with broad wings, teal small and fast in tight flocks, wigeon with white wing patch, goldeneye diver with wings set far back and white sides.\">\n  <rect x=\"0\" y=\"0\" width=\"400\" height=\"440\" fill=\"#fffaf0\"/>\n  <line x1=\"200\" y1=\"10\" x2=\"200\" y2=\"430\" stroke=\"#8a9a6b\" stroke-width=\"2\" fill=\"none\"/>\n  <line x1=\"10\" y1=\"220\" x2=\"390\" y2=\"220\" stroke=\"#8a9a6b\" stroke-width=\"2\" fill=\"none\"/>\n  <!-- Mallard: big body, broad wings -->\n  <g>\n    <path d=\"M30 95 L100 70 L170 95 L100 88 Z\" fill=\"#23261f\"/>\n    <ellipse cx=\"100\" cy=\"100\" rx=\"14\" ry=\"38\" fill=\"#23261f\"/>\n    <circle cx=\"100\" cy=\"56\" r=\"10\" fill=\"#2f3a2b\"/>\n    <rect x=\"66\" y=\"84\" width=\"16\" height=\"6\" fill=\"#4a5fa8\"/>\n    <rect x=\"118\" y=\"84\" width=\"16\" height=\"6\" fill=\"#4a5fa8\"/>\n    <text x=\"100\" y=\"168\" font-family=\"sans-serif\" font-size=\"17\" font-weight=\"bold\" fill=\"#23261f\" text-anchor=\"middle\">Mallard<\/text>\n    <text x=\"100\" y=\"188\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Big. Slow wingbeats.<\/text>\n    <text x=\"100\" y=\"205\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Loose groups.<\/text>\n  <\/g>\n  <!-- Teal: small, flock of three -->\n  <g fill=\"#23261f\">\n    <path d=\"M240 80 L268 68 L296 80 L268 77 Z\"/>\n    <ellipse cx=\"268\" cy=\"84\" rx=\"7\" ry=\"17\"/>\n    <circle cx=\"268\" cy=\"64\" r=\"5\"/>\n    <path d=\"M300 110 L328 98 L356 110 L328 107 Z\"/>\n    <ellipse cx=\"328\" cy=\"114\" rx=\"7\" ry=\"17\"/>\n    <circle cx=\"328\" cy=\"94\" r=\"5\"/>\n    <path d=\"M250 130 L278 118 L306 130 L278 127 Z\"/>\n    <ellipse cx=\"278\" cy=\"134\" rx=\"7\" ry=\"17\"/>\n    <circle cx=\"278\" cy=\"114\" r=\"5\"/>\n  <\/g>\n  <text x=\"300\" y=\"168\" font-family=\"sans-serif\" font-size=\"17\" font-weight=\"bold\" fill=\"#23261f\" text-anchor=\"middle\">Green winged teal<\/text>\n  <text x=\"300\" y=\"188\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Small. Very fast.<\/text>\n  <text x=\"300\" y=\"205\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Tight flock twists.<\/text>\n  <!-- Wigeon: white shoulder patch, pointed tail -->\n  <g>\n    <path d=\"M40 305 L100 282 L160 305 L100 298 Z\" fill=\"#23261f\"/>\n    <ellipse cx=\"100\" cy=\"308\" rx=\"12\" ry=\"32\" fill=\"#23261f\"/>\n    <polygon points=\"94,338 106,338 100,352\" fill=\"#23261f\"/>\n    <circle cx=\"100\" cy=\"270\" r=\"8\" fill=\"#23261f\"/>\n    <rect x=\"96\" y=\"264\" width=\"8\" height=\"5\" fill=\"#fffaf0\"/>\n    <polygon points=\"72,293 90,288 90,296 72,300\" fill=\"#fffaf0\"/>\n    <polygon points=\"128,293 110,288 110,296 128,300\" fill=\"#fffaf0\"/>\n    <text x=\"100\" y=\"378\" font-family=\"sans-serif\" font-size=\"17\" font-weight=\"bold\" fill=\"#23261f\" text-anchor=\"middle\">Wigeon<\/text>\n    <text x=\"100\" y=\"398\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">White wing patch.<\/text>\n    <text x=\"100\" y=\"415\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Whistle call.<\/text>\n  <\/g>\n  <!-- Goldeneye / diver: wings set back, short neck, white sides -->\n  <g>\n    <ellipse cx=\"300\" cy=\"300\" rx=\"14\" ry=\"34\" fill=\"#23261f\"/>\n    <path d=\"M244 318 L300 300 L356 318 L300 312 Z\" fill=\"#23261f\"/>\n    <polygon points=\"262,312 282,307 282,314 262,318\" fill=\"#fffaf0\"/>\n    <polygon points=\"338,312 318,307 318,314 338,318\" fill=\"#fffaf0\"/>\n    <circle cx=\"300\" cy=\"262\" r=\"10\" fill=\"#2f3a2b\"/>\n    <circle cx=\"305\" cy=\"266\" r=\"3\" fill=\"#fffaf0\"/>\n    <text x=\"300\" y=\"378\" font-family=\"sans-serif\" font-size=\"17\" font-weight=\"bold\" fill=\"#23261f\" text-anchor=\"middle\">Goldeneye (diver)<\/text>\n    <text x=\"300\" y=\"398\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Wings set far back.<\/text>\n    <text x=\"300\" y=\"415\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Wings whistle.<\/text>\n  <\/g>\n<\/svg>\n","back":"Mallard: big, slow wingbeats. Green winged teal: small, very fast, flock twists. Wigeon: white wing patch, whistles. Goldeneye: a diver, wings set far back, wings whistle."},{"id":"id-puddle-diver","deck":"Duck silhouettes","front":"Puddle duck or diver: how do they take off?","back":"Puddle ducks (mallard, teal, wigeon) jump straight up. Divers (goldeneye, bufflehead, scaup) run along the water to get airborne."},{"id":"tr-deer","deck":"Tracks","front":"Deer track: which way did it walk, and what are the 2 small dots behind it?","diagram":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" font-family=\"sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"400\" height=\"320\" fill=\"#fffaf0\"/>\n  <text x=\"200\" y=\"26\" font-size=\"18\" font-weight=\"bold\" fill=\"#2f3a2b\" text-anchor=\"middle\">Deer track (front foot)<\/text>\n  <!-- two toes (halves of heart), point = toe tips at top -->\n  <path d=\"M195 70 C180 75 160 110 158 160 C156 200 168 225 185 228 C195 229 197 215 197 200 Z\" fill=\"#6b4f35\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <path d=\"M205 70 C220 75 240 110 242 160 C244 200 232 225 215 228 C205 229 203 215 203 200 Z\" fill=\"#6b4f35\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <!-- dewclaws -->\n  <ellipse cx=\"170\" cy=\"262\" rx=\"8\" ry=\"6\" fill=\"#8a9a6b\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <ellipse cx=\"230\" cy=\"262\" rx=\"8\" ry=\"6\" fill=\"#8a9a6b\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <!-- direction arrow -->\n  <g stroke=\"#e8590c\" stroke-width=\"4\" fill=\"#e8590c\">\n    <line x1=\"320\" y1=\"230\" x2=\"320\" y2=\"90\"/>\n    <path d=\"M320 70 L308 94 L332 94 Z\"/>\n  <\/g>\n  <text x=\"320\" y=\"252\" font-size=\"14\" font-weight=\"bold\" fill=\"#e8590c\" text-anchor=\"middle\">Travel<\/text>\n  <text x=\"320\" y=\"270\" font-size=\"14\" font-weight=\"bold\" fill=\"#e8590c\" text-anchor=\"middle\">direction<\/text>\n  <!-- labels -->\n  <line x1=\"200\" y1=\"66\" x2=\"110\" y2=\"60\" stroke=\"#23261f\" stroke-width=\"1.5\" fill=\"none\"/>\n  <text x=\"20\" y=\"56\" font-size=\"14\" fill=\"#23261f\">Pointed tips<\/text>\n  <text x=\"20\" y=\"72\" font-size=\"14\" fill=\"#23261f\">= front<\/text>\n  <line x1=\"160\" y1=\"160\" x2=\"95\" y2=\"160\" stroke=\"#23261f\" stroke-width=\"1.5\" fill=\"none\"/>\n  <text x=\"20\" y=\"150\" font-size=\"14\" fill=\"#23261f\">2 toes<\/text>\n  <text x=\"20\" y=\"166\" font-size=\"14\" fill=\"#23261f\">(split hoof)<\/text>\n  <line x1=\"185\" y1=\"228\" x2=\"110\" y2=\"215\" stroke=\"#23261f\" stroke-width=\"1.5\" fill=\"none\"/>\n  <text x=\"20\" y=\"210\" font-size=\"14\" fill=\"#23261f\">Round heel<\/text>\n  <line x1=\"162\" y1=\"262\" x2=\"110\" y2=\"270\" stroke=\"#23261f\" stroke-width=\"1.5\" fill=\"none\"/>\n  <text x=\"20\" y=\"268\" font-size=\"14\" fill=\"#23261f\">Dewclaws:<\/text>\n  <text x=\"20\" y=\"284\" font-size=\"14\" fill=\"#23261f\">deep mud, snow,<\/text>\n  <text x=\"20\" y=\"300\" font-size=\"14\" fill=\"#23261f\">or running<\/text>\n  <text x=\"200\" y=\"312\" font-size=\"14\" fill=\"#2f3a2b\" text-anchor=\"middle\">About 6 to 10 cm long<\/text>\n<\/svg>\n","back":"The pointed tips point the way it walked. The 2 dots are dewclaws, which show in soft mud, snow or when running."},{"id":"tr-hare-vs-deer-browse","deck":"Tracks","front":"A twig is bitten off. Clean 45 degree cut, or ragged and torn. Who ate it?","back":"Clean angled cut: hare or rabbit (they have upper incisors). Ragged, torn tip: deer, moose or elk (no upper front teeth, they tear)."},{"id":"th-morning","deck":"Field craft","front":"Morning on a sunny slope. Which way does your scent go, and where should you be?","diagram":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 520\" font-family=\"sans-serif\">\n  <defs>\n    <marker id=\"th-arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\n      <path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#e8590c\"/>\n    <\/marker>\n  <\/defs>\n  <rect x=\"0\" y=\"0\" width=\"400\" height=\"520\" fill=\"#fffaf0\"/>\n  <text x=\"200\" y=\"26\" font-size=\"18\" font-weight=\"bold\" fill=\"#23261f\" text-anchor=\"middle\">Morning: sun warms slope, air rises<\/text>\n  <circle cx=\"350\" cy=\"62\" r=\"16\" fill=\"#e8590c\" fill-opacity=\"0.6\" stroke=\"#e8590c\" stroke-width=\"2\"/>\n  <path d=\"M10,240 L120,200 L260,90 L300,80 L390,150 L390,240 Z\" fill=\"#8a9a6b\" stroke=\"#2f3a2b\" stroke-width=\"2\"/>\n  <path d=\"M90,190 L150,160\" fill=\"none\" stroke=\"#e8590c\" stroke-width=\"3\" marker-end=\"url(#th-arrow)\"/>\n  <path d=\"M160,148 L215,108\" fill=\"none\" stroke=\"#e8590c\" stroke-width=\"3\" marker-end=\"url(#th-arrow)\"/>\n  <path d=\"M225,96 L262,68\" fill=\"none\" stroke=\"#e8590c\" stroke-width=\"3\" marker-end=\"url(#th-arrow)\"/>\n  <circle cx=\"275\" cy=\"76\" r=\"9\" fill=\"#6b4f35\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <text x=\"275\" y=\"60\" font-size=\"15\" fill=\"#23261f\" text-anchor=\"middle\" font-weight=\"bold\">You<\/text>\n  <ellipse cx=\"80\" cy=\"212\" rx=\"14\" ry=\"8\" fill=\"#6b4f35\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <text x=\"62\" y=\"186\" font-size=\"15\" fill=\"#23261f\" text-anchor=\"middle\" font-weight=\"bold\">Deer<\/text>\n  <text x=\"200\" y=\"230\" font-size=\"15\" fill=\"#23261f\" text-anchor=\"middle\">Be ABOVE. Scent goes up, away.<\/text>\n  <line x1=\"20\" y1=\"262\" x2=\"380\" y2=\"262\" stroke=\"#8a9a6b\" stroke-width=\"2\"/>\n  <text x=\"200\" y=\"292\" font-size=\"18\" font-weight=\"bold\" fill=\"#23261f\" text-anchor=\"middle\">Evening: slope cools, air sinks<\/text>\n  <circle cx=\"350\" cy=\"322\" r=\"14\" fill=\"#8a9a6b\" stroke=\"#2f3a2b\" stroke-width=\"2\"/>\n  <path d=\"M10,500 L120,460 L260,350 L300,340 L390,410 L390,500 Z\" fill=\"#8a9a6b\" stroke=\"#2f3a2b\" stroke-width=\"2\"/>\n  <path d=\"M245,352 L195,390\" fill=\"none\" stroke=\"#e8590c\" stroke-width=\"3\" marker-end=\"url(#th-arrow)\"/>\n  <path d=\"M185,400 L135,437\" fill=\"none\" stroke=\"#e8590c\" stroke-width=\"3\" marker-end=\"url(#th-arrow)\"/>\n  <path d=\"M120,450 L70,470\" fill=\"none\" stroke=\"#e8590c\" stroke-width=\"3\" marker-end=\"url(#th-arrow)\"/>\n  <ellipse cx=\"270\" cy=\"338\" rx=\"14\" ry=\"8\" fill=\"#6b4f35\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <text x=\"270\" y=\"320\" font-size=\"15\" fill=\"#23261f\" text-anchor=\"middle\" font-weight=\"bold\">Deer<\/text>\n  <circle cx=\"60\" cy=\"470\" r=\"9\" fill=\"#6b4f35\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <text x=\"48\" y=\"448\" font-size=\"15\" fill=\"#23261f\" text-anchor=\"middle\" font-weight=\"bold\">You<\/text>\n  <text x=\"250\" y=\"485\" font-size=\"15\" fill=\"#23261f\" text-anchor=\"middle\">Be BELOW. Scent sinks, away.<\/text>\n<\/svg>\n","back":"Warming air rises uphill. Be above the deer in the morning, below them in the evening when cooling air sinks."}]};</script>
<script>/* Hunt Mentor app. Vanilla JS, offline first. All user data stays in localStorage. */
(function () {
  'use strict';
  const HM = window.HM;
  const $ = (s, el = document) => el.querySelector(s);
  const view = $('#view');
  const KEY = 'hm.v1';
  const TZ = 'America/Vancouver';

  // ---------- storage ----------
  const blank = { done: {}, pos: {}, quiz: {}, checks: {}, journal: [], settings: { theme: '', firstHunt: '' } };
  let S;
  try { S = Object.assign({}, blank, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { S = JSON.parse(JSON.stringify(blank)); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage blocked */ } };
  const applyTheme = () => { if (S.settings.theme) document.documentElement.dataset.theme = S.settings.theme; else delete document.documentElement.dataset.theme; };
  applyTheme();

  // ---------- helpers ----------
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sessions = HM.sessions;
  const byId = Object.fromEntries(sessions.map((s) => [s.id, s]));
  const phases = [...new Set(sessions.map((s) => s.phase))];
  const phaseNames = { 1: 'Fast Start', 2: 'Foundations', 3: 'Reading the Land', 4: 'Species', 5: 'The Shot and After', 6: 'Mastery' };
  const setTitle = (t) => { $('#top-title').textContent = t; };
  const tab = (name) => document.querySelectorAll('.tabs a').forEach((a) => a.classList.toggle('on', a.dataset.tab === name));
  const firstHunt = () => S.settings.firstHunt || HM.field.defaults.firstHunt;
  const daysTo = (iso) => Math.ceil((new Date(iso + 'T00:00:00') - new Date(new Date().toDateString())) / 864e5);

  function sheet(html) {
    $('#sheet-body').innerHTML = html;
    $('#sheet').hidden = false;
  }
  $('#sheet-close').onclick = () => { $('#sheet').hidden = true; };
  $('#sheet').onclick = (e) => { if (e.target.id === 'sheet') $('#sheet').hidden = true; };
  $('#btn-back').onclick = () => history.back();
  $('#btn-search').onclick = () => { location.hash = '#/search'; };

  // glossary taps, checklist ticks (delegated)
  document.addEventListener('click', (e) => {
    const t = e.target.closest('.term');
    if (t) {
      const k = t.dataset.term;
      const def = HM.glossary[k] || Object.entries(HM.glossary).find(([g]) => g.toLowerCase() === k.toLowerCase())?.[1];
      sheet(`<h2>${esc(k)}<\/h2><p>${def || 'Not in the glossary yet.'}<\/p>`);
    }
  });
  document.addEventListener('change', (e) => {
    const c = e.target.closest('input[data-key]');
    if (c) { S.checks[c.dataset.key] = c.checked; save(); }
  });
  const hydrateChecks = (root) => root.querySelectorAll('input[data-key]').forEach((c) => { c.checked = !!S.checks[c.dataset.key]; });

  // ---------- sun times (NOAA almanac method) ----------
  function sunEvent(date, lat, lon, rising) {
    const rad = Math.PI / 180, deg = 180 / Math.PI;
    const y = date.getFullYear(), m = date.getMonth(), d = date.getDate();
    const N = Math.floor((Date.UTC(y, m, d) - Date.UTC(y, 0, 0)) / 864e5);
    const lngHour = lon / 15;
    const t = N + ((rising ? 6 : 18) - lngHour) / 24;
    const M = 0.9856 * t - 3.289;
    let L = (M + 1.916 * Math.sin(M * rad) + 0.020 * Math.sin(2 * M * rad) + 282.634 + 360) % 360;
    let RA = (Math.atan(0.91764 * Math.tan(L * rad)) * deg + 360) % 360;
    RA = (RA + Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90) / 15;
    const sinDec = 0.39782 * Math.sin(L * rad), cosDec = Math.cos(Math.asin(sinDec));
    const cosH = (Math.cos(90.833 * rad) - sinDec * Math.sin(lat * rad)) / (cosDec * Math.cos(lat * rad));
    if (cosH > 1 || cosH < -1) return null;
    const H = (rising ? 360 - Math.acos(cosH) * deg : Math.acos(cosH) * deg) / 15;
    const T = H + RA - 0.06571 * t - 6.622;
    const UT = ((T - lngHour) % 24 + 24) % 24;
    let when = new Date(Date.UTC(y, m, d) + UT * 36e5);
    const target = new Date(y, m, d).toLocaleDateString('en-CA');
    for (let i = 0; i < 2; i++) {
      const got = when.toLocaleDateString('en-CA', { timeZone: TZ });
      if (got < target) when = new Date(+when + 864e5); else if (got > target) when = new Date(+when - 864e5); else break;
    }
    return when;
  }
  const hhmm = (dt) => dt ? dt.toLocaleTimeString('en-CA', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }) : 'n/a';
  const addMin = (dt, m) => dt ? new Date(+dt + m * 6e4) : null;

  // ---------- views ----------
  function progress(phase) {
    const list = sessions.filter((s) => phase == null || s.phase === phase);
    const done = list.filter((s) => S.done[s.id]).length;
    return { done, total: list.length, pct: list.length ? Math.round((done / list.length) * 100) : 0 };
  }
  const nextSession = () => sessions.find((s) => !S.done[s.id]);

  function home() {
    setTitle('Hunt Mentor'); tab('home');
    const d = daysTo(firstHunt());
    const nx = nextSession();
    const p = progress();
    const misses = Object.entries(S.quiz).filter(([, v]) => !v).length;
    view.innerHTML = `
      <div class="card row">
        <div class="grow"><div class="muted">First hunt<\/div><div class="big">${d > 0 ? d : 0} days<\/div>
        <div class="muted">${esc(firstHunt())}${S.settings.firstHunt ? '' : ' (placeholder date, set yours in More)'}<\/div><\/div>
        <a class="btn primary" href="#/field">Field Mode<\/a>
      <\/div>
      ${nx ? `<a class="card" style="display:block;text-decoration:none;color:inherit" href="#/s/${nx.id}">
        <div class="muted">Next session<\/div><h2>${nx.phase}.${nx.num} ${esc(nx.title)}<\/h2><div class="muted">${nx.minutes} min<\/div><\/a>` : '<div class="card"><h2>All sessions done<\/h2><\/div>'}
      <div class="card"><h2>Progress<\/h2>
        <div class="muted">${p.done} of ${p.total} sessions<\/div><div class="bar"><i style="width:${p.pct}%"><\/i><\/div>
        ${phases.map((ph) => { const q = progress(ph); return `<div style="margin-top:10px"><div class="row"><span class="grow">${ph}. ${phaseNames[ph]}<\/span><span class="muted">${q.done}/${q.total}<\/span><\/div><div class="bar"><i style="width:${q.pct}%"><\/i><\/div><\/div>`; }).join('')}
      <\/div>
      ${misses ? `<a class="btn block" href="#/review">Review ${misses} missed quiz question${misses > 1 ? 's' : ''}<\/a>` : ''}
      <p class="muted">Regulation data last checked: ${esc(HM.regs.lastChecked)}. Content built ${esc(HM.built)}.<\/p>`;

  function learn() {
    setTitle('Learn'); tab('learn');
    view.innerHTML = phases.map((ph) => `<div class="card"><h2>Phase ${ph}: ${phaseNames[ph]}<\/h2><div class="list">
      ${sessions.filter((s) => s.phase === ph).map((s) => `<a class="item ${S.done[s.id] ? 'done' : ''}" href="#/s/${s.id}">
        <span class="num">${S.done[s.id] ? '&#10003;' : s.num}<\/span><span class="grow">${esc(s.title)}<\/span><span class="pill">${s.minutes} min<\/span><\/a>`).join('')}
    <\/div><\/div>`).join('');
  }

  function session(id, stepArg) {
    const s = byId[id]; if (!s) return notFound();
    tab('learn');
    const steps = s.steps.slice();
    if (s.quiz.length) steps.push({ title: 'Quiz', quiz: true });
    let i = stepArg != null ? +stepArg : (S.pos[id] || 0);
    i = Math.max(0, Math.min(i, steps.length - 1));
    S.pos[id] = i; save();
    const st = steps[i];
    setTitle(`${s.phase}.${s.num} ${s.title}`);
    const last = i === steps.length - 1;
    view.innerHTML = `
      <div class="dots">${steps.map((_, n) => `<i class="${n <= i ? 'on' : ''}"><\/i>`).join('')}<\/div>
      <div class="muted">${s.minutes} min. Screen ${i + 1} of ${steps.length}<\/div>
      <article class="step"><h2>${esc(st.title)}<\/h2>${st.quiz ? quizHtml(s) : st.html}<\/article>
      <div class="btn-row">
        ${i > 0 ? `<a class="btn" href="#/s/${id}/${i - 1}">Back<\/a>` : '<a class="btn" href="#/learn">List<\/a>'}
        ${last ? `<button class="btn primary" id="mark">${S.done[id] ? 'Done &#10003;' : 'Mark done'}<\/button>` : `<a class="btn primary" href="#/s/${id}/${i + 1}">Next<\/a>`}
      <\/div>`;
    hydrateChecks(view);
    renderRegs(view);
    if (st.quiz) bindQuiz(s);
    const mk = $('#mark'); if (mk) mk.onclick = () => { S.done[id] = true; save(); const nx = nextSession(); location.hash = nx ? `#/s/${nx.id}` : '#/'; };
    window.scrollTo(0, 0);
  }

  function quizHtml(s, only) {
    return s.quiz.map((q, n) => {
      const qid = `${s.id}#${n}`;
      if (only && !only.includes(qid)) return '';
      return `<div class="q" data-qid="${qid}" data-sid="${s.id}" data-n="${n}"><p><strong>${n + 1}. ${esc(q.q)}<\/strong><\/p>
        ${q.options.map((o, k) => `<button class="opt" data-k="${k}">${esc(o)}<\/button>`).join('')}<div class="why" hidden><\/div><\/div>`;
    }).join('');
  }
  function bindQuiz() {
    view.querySelectorAll('.q').forEach((qel) => {
      const s = byId[qel.dataset.sid]; const q = s.quiz[+qel.dataset.n];
      qel.querySelectorAll('.opt').forEach((b) => b.onclick = () => {
        if (qel.dataset.answered) return;
        qel.dataset.answered = '1';
        const k = +b.dataset.k; const ok = k === q.answer;
        b.classList.add(ok ? 'right' : 'wrong');
        qel.querySelector(`.opt[data-k="${q.answer}"]`).classList.add('right');
        const why = qel.querySelector('.why');
        why.hidden = false; why.innerHTML = `<strong>${ok ? 'Correct.' : 'Not quite.'}<\/strong> ${esc(q.why)}`;
        S.quiz[qel.dataset.qid] = ok; save();
      });
    });
  }

  function review() {
    setTitle('Review'); tab('home');
    const missed = Object.entries(S.quiz).filter(([, v]) => !v).map(([k]) => k);
    if (!missed.length) { view.innerHTML = '<div class="card"><h2>Nothing to review<\/h2><p>Every quiz answer so far is right.<\/p><\/div>'; return; }
    view.innerHTML = '<p class="muted">Questions you missed. Get them right to clear them.<\/p>' +
      [...new Set(missed.map((k) => k.split('#')[0]))].filter((id) => byId[id]).map((id) => `<div class="card"><h2>${esc(byId[id].title)}<\/h2>${quizHtml(byId[id], missed)}<\/div>`).join('');
    bindQuiz();
  }

  // ---------- regs data render ----------

    root.querySelectorAll('[data-regs]').forEach((el) => {
      const keys = el.dataset.regs.split(',');
      const rows = HM.regs.items.filter((r) => keys.some((k) => r.group === k || r.key === k));
      el.innerHTML = rows.length ? `<div class="tbl"><table><thead><tr><th>What<\/th><th>Rule<\/th><th>Certainty<\/th><th>Source<\/th><\/tr><\/thead><tbody>${rows.map((r) => `<tr>
        <td>${esc(r.label)}<\/td><td>${r.value ? esc(r.value) : '<span class="verify">VERIFY<\/span>'}${r.note ? `<div class="muted">${esc(r.note)}<\/div>` : ''}<\/td>
        <td><span class="cert ${r.certainty >= 95 ? 'c-hi' : r.certainty >= 80 ? 'c-mid' : r.certainty >= 60 ? 'c-lo' : 'c-tip'}">${r.certainty}%<\/span><\/td>
        <td>${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.source)}<\/a>` : esc(r.source || '')}${r.page ? `, ${esc(r.page)}` : ''}<div class="muted">checked ${esc(r.checked)}<\/div><\/td><\/tr>`).join('')}<\/tbody><\/table><\/div>`

  // ---------- field mode ----------
  function field(sub) {
    document.body.classList.add('field');
    tab('field');
    const F = HM.field;
    if (!sub) {
      setTitle('Field Mode');
      view.innerHTML = `<div class="fgrid">
        <a class="ftile hot" href="#/field/legal">Legal to shoot?<small>Step by step check<\/small><\/a>
        <a class="ftile" href="#/field/light">Legal light<small>3 bases, offline<\/small><\/a>
        ${F.cards.map((c) => `<a class="ftile ${c.hot ? 'hot' : ''}" href="#/field/c/${c.id}">${esc(c.title)}<small>${esc(c.sub || '')}<\/small><\/a>`).join('')}
      <\/div>`;
      return;
    }
    if (sub === 'legal') return legalFlow(0);
    if (sub === 'light') return lightView();
    if (sub.startsWith('c/')) {
      const c = F.cards.find((x) => x.id === sub.slice(2)); if (!c) return notFound();
      setTitle(c.title);
      view.innerHTML = `<div class="card step">${c.html}<\/div>`;
      hydrateChecks(view);
    }

  function legalFlow(n) {
    const steps = HM.field.legalFlow;
    setTitle('Legal to shoot?');
    if (n >= steps.length) {
      view.innerHTML = `<div class="go">All checks passed. Breathe. Only shoot if the shot is ethical and you are sure.<\/div>
        <div class="btn-row"><button class="btn" id="again">Start again<\/button><\/div>`;
      $('#again').onclick = () => legalFlow(0);
      return;
    }
    const st = steps[n];
    view.innerHTML = `<div class="muted">Check ${n + 1} of ${steps.length}<\/div>
      <div class="flow"><div class="node">${esc(st.q)}<\/div>${st.help ? `<p class="muted">${esc(st.help)}<\/p>` : ''}
      <div class="yesno"><button class="btn primary" id="yes">YES<\/button><button class="btn" id="no">NO<\/button><\/div><\/div>`;
    $('#yes').onclick = () => legalFlow(n + 1);
    $('#no').onclick = () => {
      view.innerHTML = `<div class="stop">DO NOT SHOOT<\/div><p>${esc(st.stop)}<\/p>
        <div class="btn-row"><button class="btn" id="again">Start again<\/button><\/div>`;
      $('#again').onclick = () => legalFlow(0);

  }

  function lightView(dateStr) {
    setTitle('Legal light');
    const today = new Date().toLocaleDateString('en-CA', { timeZone: TZ });
    const ds = dateStr || today;
    const [y, m, d] = ds.split('-').map(Number);
    const date = new Date(y, m - 1, d, 12);
    const H = HM.regs.hours;
    const rows = HM.bases.map((b) => {
      const rise = sunEvent(date, b.lat, b.lon, true), set = sunEvent(date, b.lat, b.lon, false);
      const col = (h) => h && h.beforeSunriseMin != null ? `${hhmm(addMin(rise, -h.beforeSunriseMin))} to ${hhmm(addMin(set, h.afterSunsetMin))}` : '<span class="verify">VERIFY<\/span>';
      return `<tr><td><strong>${esc(b.name)}<\/strong><\/td><td>${hhmm(rise)}<br>${hhmm(set)}<\/td><td>${col(H.bigGame)}<\/td><td>${col(H.migratory)}<\/td><\/tr>`;
    }).join('');
    view.innerHTML = `<div class="card"><label class="f" for="ld">Date<\/label><input type="date" id="ld" value="${ds}"><\/div>
      <div class="tbl light"><table><thead><tr><th>Base<\/th><th>Sunrise / sunset<\/th><th>Big game and upland<\/th><th>Ducks and geese<\/th><\/tr><\/thead><tbody>${rows}<\/tbody><\/table><\/div>
      <aside class="callout warn"><div class="callout-t">Verify with official tables<\/div>
      <p>Calculated on your phone, Pacific time. Can be off by a few minutes in hills and valleys.<\/p>
      <p>Big game rule: ${esc(H.bigGame.text)} ${certBadge(H.bigGame.certainty)}<\/p>
      <p>Migratory birds rule: ${esc(H.migratory.text)} ${certBadge(H.migratory.certainty)}<\/p><\/aside>`;
    $('#ld').onchange = (e) => lightView(e.target.value);
  }
  const certBadge = (v) => v == null ? '<span class="verify">VERIFY<\/span>' : `<span class="cert ${v >= 95 ? 'c-hi' : v >= 80 ? 'c-mid' : v >= 60 ? 'c-lo' : 'c-tip'}">${v}%<\/span>`;

  function download(name, text, type) {

        ${gl.length ? `<div class="card"><h2>Glossary<\/h2>${gl.map((t) => `<p><strong>${esc(t)}<\/strong>: ${HM.glossary[t]}<\/p>`).join('')}<\/div>` : ''}
        ${rg.length ? `<div class="card"><h2>Rules data<\/h2>${rg.map((r) => `<p><strong>${esc(r.label)}<\/strong>: ${r.value ? esc(r.value) : 'VERIFY'} ${certBadge(r.certainty)}<\/p>`).join('')}<\/div>` : ''}

  // ---------- flashcards (Leitner boxes: 0 new, 1 learning, 2 known) ----------
  function allCards() {
    const cards = [];
    for (const [t, d] of Object.entries(HM.glossary)) cards.push({ id: 'g:' + t, deck: 'Terms', front: t, back: d });
    for (const r of HM.regs.items) if (r.value) cards.push({ id: 'r:' + r.key, deck: 'Rules', front: r.label, back: `${esc(r.value)} <span class="cert ${r.certainty >= 95 ? 'c-hi' : r.certainty >= 80 ? 'c-mid' : 'c-lo'}">${r.certainty}%<\/span>` });
    for (const c of (HM.flashcards || [])) cards.push({ id: 'f:' + c.id, deck: c.deck, front: c.front, back: c.back, diagram: c.diagram });
    for (const s of sessions) s.quiz.forEach((q, n) => cards.push({ id: 'q:' + s.id + '#' + n, deck: 'Quiz', front: q.q, back: `<strong>${esc(q.options[q.answer])}<\/strong><br>${esc(q.why)}` }));
    return cards;
  }
  function cards(deckArg) {
    setTitle('Flashcards'); tab('more');
    S.cards = S.cards || {};
    const all = allCards();
    const decks = [...new Set(all.map((c) => c.deck))];
    const deck = deckArg ? decodeURIComponent(deckArg) : null;
    if (!deck) {
      view.innerHTML = `<p class="muted">Tap a deck. Cards you miss come back sooner.<\/p><div class="card list">${decks.map((d) => {
        const n = all.filter((c) => c.deck === d); const k = n.filter((c) => S.cards[c.id] === 2).length;
        return `<a class="item" href="#/cards/${encodeURIComponent(d)}"><span class="grow">${esc(d)}<\/span><span class="pill">${k}/${n.length} known<\/span><\/a>`; }).join('')}<\/div>
        <div class="btn-row"><button class="btn" id="reset-cards">Reset all decks<\/button><\/div>`;
      $('#reset-cards').onclick = () => { S.cards = {}; save(); cards(); };
      return;
    }
    const pool = all.filter((c) => c.deck === deck);
    // due order: box 0 first, then box 1, then box 2 (only when nothing else)
    const order = [0, 1, 2].flatMap((b) => pool.filter((c) => (S.cards[c.id] || 0) === b));
    const due = order.filter((c) => (S.cards[c.id] || 0) < 2);
    const card = (due.length ? due : order)[0];
    if (!card) { view.innerHTML = '<div class="card"><h2>Empty deck<\/h2><\/div>'; return; }
    const known = pool.filter((c) => S.cards[c.id] === 2).length;
    setTitle(deck);
    view.innerHTML = `<div class="muted">${known} of ${pool.length} known${due.length ? '' : '. All known, reviewing.'}<\/div>
      <div class="card fc" id="fc"><div class="fc-front"><h2>${card.front}<\/h2>${card.diagram ? `<figure class="diagram">${card.diagram}<\/figure>` : ''}<p class="muted">Tap to flip<\/p><\/div>
      <div class="fc-back" hidden><p>${card.back}<\/p><\/div><\/div>
      <div class="btn-row" id="fc-btns" hidden><button class="btn" id="fc-no">Missed it<\/button><button class="btn primary" id="fc-yes">Knew it<\/button><\/div>
      <div class="btn-row"><a class="btn" href="#/cards">Decks<\/a><\/div>`;
    const fc = $('#fc');
    fc.onclick = () => { fc.querySelector('.fc-back').hidden = false; $('#fc-btns').hidden = false; };
    $('#fc-yes').onclick = () => { S.cards[card.id] = Math.min(2, (S.cards[card.id] || 0) + 1); save(); cards(deckArg); window.scrollTo(0, 0); };
    $('#fc-no').onclick = () => { S.cards[card.id] = 0; save(); cards(deckArg); window.scrollTo(0, 0); };
  }

  // ---------- print pocket cards ----------
  function printCards() {
    setTitle('Pocket cards'); tab('more');
    const F = HM.field; const H = HM.regs.hours;
    const today = new Date();
    const light = HM.bases.map((b) => { const r = sunEvent(today, b.lat, b.lon, true), s = sunEvent(today, b.lat, b.lon, false); return `<tr><td>${esc(b.name)}<\/td><td>${hhmm(r)} / ${hhmm(s)}<\/td><td>${hhmm(addMin(r, -H.bigGame.beforeSunriseMin))} to ${hhmm(addMin(s, H.bigGame.afterSunsetMin))}<\/td><td>${hhmm(addMin(r, -H.migratory.beforeSunriseMin))} to ${hhmm(addMin(s, H.migratory.afterSunsetMin))}<\/td><\/tr>`; }).join('');
    view.innerHTML = `<p class="muted no-print">Use your browser's Share or Print to make a PDF. Fold and keep in a zip bag. Study aid only.<\/p>
      <div class="print-grid">
      <div class="card"><h2>Legal to shoot? All must be YES<\/h2><ol>${F.legalFlow.map((s) => `<li>${esc(s.q)}<\/li>`).join('')}<\/ol><p><strong>Any NO = no shot.<\/strong><\/p><\/div>
      <div class="card"><h2>Legal light today (${today.toLocaleDateString('en-CA', { timeZone: TZ })})<\/h2><div class="tbl"><table><thead><tr><th>Base<\/th><th>Rise / set<\/th><th>Big game<\/th><th>Ducks<\/th><\/tr><\/thead><tbody>${light}<\/tbody><\/table><\/div><p class="muted">Verify with official tables.<\/p><\/div>
      ${F.cards.map((c) => `<div class="card step">${c.html}<\/div>`).join('')}
      ${F.checklists.map((l) => `<div class="card"><h2>${esc(l.title)}<\/h2><ul>${l.items.map((t) => `<li>&#9744; ${t}<\/li>`).join('')}<\/ul><\/div>`).join('')}
      <\/div>`;
  }

  function notFound() { view.innerHTML = '<div class="card"><h2>Not found<\/h2><a href="#/">Home<\/a><\/div>'; }

  // ---------- router ----------
  function route() {
    document.body.classList.remove('field');
    $('#sheet').hidden = true;
    const h = location.hash.replace(/^#\/?/, '').split('/');
    const [a, b, c] = h;
    if (!a) home();
    else if (a === 'learn') learn();
    else if (a === 's') session(b, c);
    else if (a === 'field') field(h.slice(1).join('/'));
    else if (a === 'lists') lists(b);
    else if (a === 'more') more();
    else if (a === 'glossary') glossary();
    else if (a === 'search') search();
    else if (a === 'review') review();
    else if (a === 'sources') sources();
    else if (a === 'install') install();
    else if (a === 'cards') cards(b);
    else if (a === 'print') printCards();
    else if (a === 'journal') journal(b === 'new' ? -1 : b != null ? +b : undefined);
    else notFound();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body>
</html>
