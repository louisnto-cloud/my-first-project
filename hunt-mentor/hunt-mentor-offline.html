<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f3a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hunt Mentor">
<title>Hunt Mentor</title>


<style>/* Hunt Mentor: rugged field guide. Earth tones, one blaze orange accent. */
:root {
  --bg: #f4efe4; --card: #fffaf0; --ink: #23261f; --muted: #5d6152; --line: #d8cfbc;
  --moss: #2f3a2b; --bark: #6b4f35; --sage: #8a9a6b; --accent: #e8590c; --accent-ink: #fff;
  --ok: #2e7d32; --bad: #b3261e; --warn-bg: #fff1e0; --verify: #b3261e;
  --r: 14px; --fs: 18px;
}
:root[data-theme="dark"] {
  color-scheme: dark; --bg: #161813; --card: #22251e; --ink: #ece6d6; --muted: #aaa792; --line: #3a3d33;
  --moss: #0f120d; --bark: #c9a27a; --sage: #9fb07e; --accent: #ff7a2e; --warn-bg: #3a2614;
}
:root[data-theme="sun"] {
  --bg: #fff; --card: #fff; --ink: #000; --muted: #222; --line: #000;
  --moss: #000; --bark: #000; --sage: #000; --accent: #d14600; --warn-bg: #fff; --fs: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="sun"]) {
    color-scheme: dark; --bg: #161813; --card: #22251e; --ink: #ece6d6; --muted: #aaa792; --line: #3a3d33;
    --moss: #0f120d; --bark: #c9a27a; --sage: #9fb07e; --accent: #ff7a2e; --warn-bg: #3a2614;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: var(--fs)/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(76px + env(safe-area-inset-bottom)); -webkit-text-size-adjust: 100%;
}
a { color: var(--accent); }
.top {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
  background: var(--moss); color: #f4efe4; padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
}
.top h1 { flex: 1; margin: 0; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { background: none; border: 0; color: inherit; font-size: 24px; min-width: 44px; min-height: 44px; }
.banner { background: var(--warn-bg); color: var(--ink); font-size: 13px; padding: 6px 16px; border-bottom: 1px solid var(--line); }
main { max-width: 720px; margin: 0 auto; padding: 16px; }
.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5;
}
.tabs a { flex: 1; text-align: center; color: var(--muted); text-decoration: none; font-size: 12px; padding: 8px 0; min-height: 56px; }
.tabs a span { display: block; font-size: 22px; line-height: 1.2; }
.tabs a.on { color: var(--accent); font-weight: 700; }
.tabs .tab-field span { color: var(--accent); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin: 0 0 14px; }
.card h2 { margin: 0 0 8px; font-size: 20px; }
.muted { color: var(--muted); font-size: 15px; }
.big { font-size: 40px; font-weight: 800; line-height: 1; }
.row { display: flex; gap: 10px; align-items: center; }
.grow { flex: 1; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 52px; padding: 0 18px;
  border-radius: 12px; border: 2px solid var(--moss); background: var(--card); color: var(--ink);
  font-size: 17px; font-weight: 700; text-decoration: none; cursor: pointer;
}
:root[data-theme="dark"] .btn { border-color: var(--line); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.block { display: flex; width: 100%; }
.btn-row { display: flex; gap: 10px; margin-top: 12px; }
.btn-row .btn { flex: 1; }
.bar { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--sage); }
.list a.item {
  display: flex; gap: 12px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--line);
  color: var(--ink); text-decoration: none; min-height: 56px;
}
.num { min-width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--line); font-weight: 800; font-size: 15px; }
.done .num { background: var(--ok); color: #fff; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--line); color: var(--ink); white-space: nowrap; }
.pill.soon { background: var(--accent); color: #fff; }

/* session reader */
.step h2 { font-size: 24px; margin: 4px 0 12px; }
.step ul, .step ol { padding-left: 22px; margin: 6px 0 12px; }
.step li { margin: 4px 0; }
.step p { margin: 8px 0; }
.dots { display: flex; gap: 4px; margin-bottom: 12px; }
.dots i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.dots i.on { background: var(--accent); }
.callout { border-left: 5px solid var(--sage); background: var(--card); border-radius: 0 var(--r) var(--r) 0; padding: 10px 14px; margin: 12px 0; }
.callout-t { font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
.callout.rule { border-color: var(--bark); }
.callout.warn, .callout.law { border-color: var(--accent); background: var(--warn-bg); }
.callout.lean, .callout.tip { border-color: var(--sage); }
.cert { font-size: 12px; font-weight: 800; padding: 1px 6px; border-radius: 6px; margin-left: 2px; white-space: nowrap; }
.c-hi { background: #2e7d32; color: #fff; } .c-mid { background: #7a8f2e; color: #fff; }
.c-lo { background: #c68a00; color: #fff; } .c-tip { background: #888; color: #fff; }
.verify { background: var(--verify); color: #fff; font-weight: 800; font-size: 13px; padding: 1px 6px; border-radius: 6px; }
.term { background: none; border: 0; border-bottom: 2px dotted var(--accent); color: inherit; font: inherit; padding: 0; cursor: pointer; }
.tbl { overflow-x: auto; margin: 10px 0; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { background: var(--line); }
figure.diagram { margin: 12px 0; background: #fffaf0; border-radius: var(--r); padding: 8px; border: 1px solid var(--line); }
figure.diagram svg { width: 100%; height: auto; display: block; }
code { background: var(--line); padding: 0 4px; border-radius: 4px; }

/* quiz */
.q { margin-bottom: 18px; }
.q .opt { display: block; width: 100%; text-align: left; margin: 6px 0; min-height: 52px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-size: 17px; }
.q .opt.right { border-color: var(--ok); background: #e3f2e4; color: #123; }
.q .opt.wrong { border-color: var(--bad); background: #fbe4e2; color: #311; }
.q .why { margin-top: 8px; font-size: 16px; }

/* checklists */
.check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 4px; border-bottom: 1px solid var(--line); min-height: 52px; }
.check input { width: 28px; height: 28px; flex: none; accent-color: var(--accent); }
.check input:checked + span { text-decoration: line-through; color: var(--muted); }

/* field mode */
body.field { --fs: 22px; }
body.field main { padding: 12px; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ftile { display: flex; flex-direction: column; justify-content: center; min-height: 110px; padding: 14px; border-radius: 16px; background: var(--moss); color: #fff; text-decoration: none; font-weight: 800; font-size: 20px; border: 3px solid transparent; }
.ftile.hot { background: var(--accent); }
.ftile small { font-weight: 500; font-size: 14px; opacity: .85; }
.flow .node { border: 3px solid var(--ink); border-radius: 14px; padding: 14px; margin: 10px 0; font-weight: 700; font-size: 21px; }
.flow .yesno { display: flex; gap: 10px; }
.flow .yesno .btn { flex: 1; min-height: 64px; font-size: 22px; }
.stop { background: var(--bad); color: #fff; border-radius: 14px; padding: 18px; font-size: 24px; font-weight: 800; }
.go { background: var(--ok); color: #fff; border-radius: 14px; padding: 18px; font-size: 22px; font-weight: 800; }
.light td, .light th { font-size: 18px; }

input[type="search"], input[type="text"], input[type="date"], textarea, select {
  width: 100%; font-size: 18px; padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink);
}
label.f { display: block; font-weight: 700; margin: 12px 0 4px; font-size: 15px; }
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; z-index: 10; }
.sheet[hidden] { display: none; }
.sheet-card { background: var(--card); width: 100%; max-height: 80vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
.seg { display: flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { flex: 1; min-height: 48px; border: 0; background: var(--card); color: var(--ink); font-size: 16px; }
.seg button.on { background: var(--accent); color: #fff; font-weight: 800; }

@media print {
  .top, .tabs, .banner, .btn-row, .dots { display: none !important; }
  body { padding: 0; background: #fff; color: #000; font-size: 11pt; }
  .card { break-inside: avoid; border: 1px solid #000; }
}
</style>
</head>

<script>window.HM={"built":"2026-10-01","sessions":[{"id":"countdown","phase":1,"num":1,"title":"Countdown to your first hunt","minutes":10,"checked":"2026-10-01","steps":[{"title":"Countdown to your first hunt","html":"<aside class=\"callout why\"><div class=\"callout-t\">Why it matters<\/div><p>About 2 weeks to go. Gear and practice take longer than you think. This is the order that works.<\/p><\/aside>"},{"title":"The big picture","html":"<ul><li><strong>Week 1 (now):<\/strong> licences, buy the shotgun, buy and mount the scope.<\/li><li><strong>Week 2:<\/strong> sight in the rifle, pattern the shotgun, buy clothing, scout on the map.<\/li><li><strong>Hunt week:<\/strong> final checks, pack, go.<\/li><li>Dates are a plan, not a rule. Move them to fit your life.<\/li><\/ul><aside class=\"callout lean\"><div class=\"callout-t\">My lean (opinion)<\/div><p>Licences and the scope come first. Without a sighted in rifle there is no deer hunt. Without a federal permit there is no duck hunt.<\/p><\/aside>"},{"title":"Week 1: paperwork and the big buys","html":"<div class=\"checklist\" data-list=\"cd-w1\"><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w1:0\"><span>Find my FWID (Fish and Wildlife ID) in WILD online<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w1:1\"><span>Buy BC hunting licence online<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w1:2\"><span>Buy mule deer and white tailed deer licences IN PERSON<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w1:3\"><span>Buy the federal Migratory Game Bird Hunting Permit online<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w1:4\"><span>Pick a shotgun (Session 3) and buy it<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w1:5\"><span>Buy steel shot for ducks and lead or steel for quail (Session 6)<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w1:6\"><span>Pick a scope and Picatinny rings (Session 4) and buy them<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w1:7\"><span>Have the shop mount the scope, or mount it with a torque wrench<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w1:8\"><span>Buy .308 ammo: 3 to 4 boxes of the SAME load<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w1:9\"><span>Ask your brother: is his own house on the 20 acres? Where are the neighbours?<\/span><\/label><\/div>"},{"title":"Week 2: practice and kit","html":"<div class=\"checklist\" data-list=\"cd-w2\"><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w2:0\"><span>Bore sight, then zero the rifle at 100 m (Session 5)<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w2:1\"><span>Shoot 3 shot groups from a rest until they are tight<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w2:2\"><span>Shoot from sitting and kneeling with shooting sticks<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w2:3\"><span>Pattern the shotgun on paper with your duck load (Session 5)<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w2:4\"><span>Practice on clay targets, at least 1 session<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w2:5\"><span>Buy clothing, boots, waders (Session 7)<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w2:6\"><span>Build the day pack and car kit (Session 8)<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w2:7\"><span>Download offline maps of the area to your phone<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w2:8\"><span>Scout on the map: slopes, benches, water, roads (Sessions 9 to 11)<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w2:9\"><span>Practice the legal to shoot flowchart in Field Mode<\/span><\/label><\/div>"},{"title":"Hunt week","html":"<div class=\"checklist\" data-list=\"cd-w3\"><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w3:0\"><span>Check in season regulation changes and closures<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w3:1\"><span>Check fire restrictions and road closures<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w3:2\"><span>Check legal light times in Field Mode<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w3:3\"><span>Leave a trip plan with someone<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w3:4\"><span>Pack: licences, ID, permit, ammo, knife, game bags, first aid<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w3:5\"><span>Cooler and ice ready for meat<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w3:6\"><span>Go slow. Watch more than you walk.<\/span><\/label><\/div>"},{"title":"Time savers","html":"<ul><li>Buy where you can handle the gun and get help mounting the scope. (Tip)<\/li><li>Ask the store about a range near Kamloops. Many have sighting in days. (Tip)<\/li><li>One ammo load for the rifle. Do not mix brands after zeroing. (Tip, 85% the zero changes between loads)<\/li><li>Practice loading and unloading at the car until it is boring. (Tip)<\/li><\/ul><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>Buy once, practice twice. The rifle you shot 60 times beats the fancy one you shot 6 times.<\/p><\/aside><aside class=\"callout mistake\"><div class=\"callout-t\">Common mistakes<\/div><ul><li>Mounting the scope the night before the hunt.<\/li><li>Buying 5 kinds of ammo and never zeroing any of them.<\/li><li>Spending every evening shopping and none on the range.<\/li><\/ul><\/aside><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>Tonight: put your hunt date in More. Then tick off the first 3 boxes above.<\/p><\/aside>"},{"title":"Sources","html":"<ul><li>Licence facts: see Session 2 sources.<\/li><li>Everything else in this session is a plan and tips (opinion), not rules.<\/li><\/ul>"}],"quiz":[{"q":"What should you do first this week?","options":["Buy clothing","Sort licences and buy the scope","Scout on the map"],"answer":1,"why":"Deer tags can take time to get and the rifle must be zeroed before you can hunt deer."},{"q":"You zeroed with Brand A. The store is out, so you buy Brand B. What now?","options":["Nothing, .308 is .308","Check the zero again with Brand B","Aim a bit higher"],"answer":1,"why":"Different loads hit different spots. Confirm the zero with the exact ammo you will hunt with."},{"q":"Why pattern the shotgun before duck season?","options":["It is required by law","To see where and how tight your shot hits with your load and choke","To break in the barrel"],"answer":1,"why":"Patterning shows if the gun shoots where you look and how the shot spreads at real distances."}],"checklists":["cd-w1","cd-w2","cd-w3"],"text":" !why about 2 weeks to go. gear and practice take longer than you think. this is the order that works. the big picture - week 1 (now): licences, buy the shotgun, buy and mount the scope. - week 2: sight in the rifle, pattern the shotgun, buy clothing, scout on the map. - hunt week: final checks, pack, go. - dates are a plan, not a rule. move them to fit your life. !lean licences and the scope come first. without a sighted in rifle there is no deer hunt. without a federal permit there is no duck hunt. week 1: paperwork and the big buys week 2: practice and kit hunt week time savers - buy where you can handle the gun and get help mounting the scope. (tip) - ask the store about a range near kamloops. many have sighting in days. (tip) - one ammo load for the rifle. do not mix brands after zeroing. (tip, 85% the zero changes between loads) - practice loading and unloading at the car until it is boring. (tip) !rule buy once, practice twice. the rifle you shot 60 times beats the fancy one you shot 6 times. !mistake - mounting the scope the night before the hunt. - buying 5 kinds of ammo and never zeroing any of them. - spending every evening shopping and none on the range. !field tonight: put your hunt date in more. then tick off the first 3 boxes above. sources - licence facts: see session 2 sources. - everything else in this session is a plan and tips (opinion), not rules. "},{"id":"licences","phase":1,"num":2,"title":"Licences and tags","minutes":12,"checked":"2026-10-01","steps":[{"title":"Licences and tags","html":"<aside class=\"callout why\"><div class=\"callout-t\">Why it matters<\/div><p>No licence, no hunt. Some tags take 14 days by mail. Buy in person now.<\/p><\/aside>"},{"title":"What you need, by animal","html":"<div class=\"tbl\"><table><thead><tr><th>Hunting<\/th><th>You need<\/th><\/tr><\/thead><tbody><tr><td>Deer<\/td><td>BC hunting licence + deer species licence (tag) for that species<\/td><\/tr><tr><td>Ducks and geese<\/td><td>BC hunting licence + federal bird permit<\/td><\/tr><tr><td>Quail and grouse<\/td><td>BC hunting licence only<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Residents need no species licence for quail or grouse <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Ducks and geese need no BC species licence, only the federal permit <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Mule deer and white tailed deer are <strong>separate<\/strong> species licences <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><\/ul>"},{"title":"Your hunter number (FWID)","html":"<ul><li>Your old hunter number is now the <button class=\"term\" data-term=\"FWID\">FWID<\/button> (Fish and Wildlife ID) <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>It is 9 digits: your old number with 3 digits added at the front <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>There is no physical card.<\/strong> You do not need to carry a printout <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>You must carry <strong>photo ID<\/strong> and be able to give your FWID number <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Not sure of yours? Log in to WILD (Wildlife Information and Licensing Data) and tap <strong>Find my FWID<\/strong> <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>No luck? FrontCounter BC: 1 877 855 3222 <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><\/ul>"},{"title":"The hunting licence","html":"<ul><li>One per licence year. Licence year runs 1 April to 31 March <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Adult resident cost: $25 + $7 surcharge <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>. GST (Goods and Services Tax): <span class=\"verify\">VERIFY<\/span>.<\/li><li>It is <strong>electronic only<\/strong>. No paper copy exists <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Buy online in WILD, or at Service BC or FrontCounter BC <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><\/ul>"},{"title":"Deer tags (species licences)","html":"<ul><li>Mule deer: $12 + $3 surcharge. White tailed deer: $12 + $3 surcharge <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li><strong>Cannot be printed at home.<\/strong> They are special waterproof paper <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Online orders are mailed. About 14 days <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Hunting in the next 2 weeks? <strong>Buy in person<\/strong> at Service BC, FrontCounter BC or a licence vendor <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Some species have a 2 day wait after purchase. For deer: <span class=\"verify\">VERIFY<\/span>.<\/li><li>Carry <strong>all<\/strong> your species licences for the year, used and unused <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><\/ul><aside class=\"callout lean\"><div class=\"callout-t\">My lean (opinion)<\/div><p>Buy both a mule deer and a white tailed deer licence. $30 total. You will not know which deer walks out first.<\/p><\/aside>"},{"title":"Federal bird permit (ducks and geese)","html":"<ul><li>Name: Migratory Game Bird Hunting Permit. The habitat stamp is included <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Cost: $17 + tax <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>2026 e permit valid 1 August 2026 to 30 June 2027 <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Buy online any time with a credit card. Save it on your phone <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Carry it every time you hunt ducks or geese, paper or phone <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><\/ul>"},{"title":"Your brother","html":"<ul><li>He can come along and watch <strong>without a licence<\/strong>, as long as he carries no firearm or weapon <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>He can help pack meat out. You must stay with the meat, or fill in a transport record <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>He should not call, chase or drive game toward you. That can count as hunting (65%, my reading of the law).<\/li><li>To hunt himself he needs CORE (Conservation and Outdoor Recreation Education), a PAL (Possession and Acquisition Licence) for firearms, and a hunting licence. That takes weeks. Not this October.<\/li><\/ul>"},{"title":"Buy it this week","html":"<div class=\"checklist\" data-list=\"s2-buy\"><label class=\"check\"><input type=\"checkbox\" data-key=\"s2-buy:0\"><span>Find my FWID in WILD<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s2-buy:1\"><span>Buy BC hunting licence (online is fine, it is electronic)<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s2-buy:2\"><span>Buy mule deer licence IN PERSON<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s2-buy:3\"><span>Buy white tailed deer licence IN PERSON<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s2-buy:4\"><span>Buy federal bird permit online, save to phone<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s2-buy:5\"><span>Photo ID and PAL card in wallet<\/span><\/label><\/div><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>Licences go in a zip bag in the same pocket every time. Check the pocket before you leave the truck.<\/p><\/aside><aside class=\"callout mistake\"><div class=\"callout-t\">Common mistakes<\/div><ul><li>Ordering deer tags online a week before the hunt. They arrive too late.<\/li><li>Thinking the hunting licence covers ducks. You also need the federal permit.<\/li><li>Leaving used tags at home. Carry them all.<\/li><\/ul><\/aside><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>Open WILD tonight. Find your FWID. Write it on the back of your PAL card in pencil.<\/p><\/aside>"},{"title":"Sources","html":"<ul><li><a href=\"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/wild-system/fish-wildlife-id\" target=\"_blank\" rel=\"noopener\">BC Fish and Wildlife ID page<\/a>, checked 2026-10-01<\/li><li><a href=\"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/species-licences\" target=\"_blank\" rel=\"noopener\">BC species licences page<\/a>, checked 2026-10-01<\/li><li><a href=\"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/frequently-asked-questions\" target=\"_blank\" rel=\"noopener\">BC hunting FAQ<\/a>, checked 2026-10-01<\/li><li><a href=\"https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/permit.html\" target=\"_blank\" rel=\"noopener\">ECCC permit page<\/a>, checked 2026-10-01<\/li><li>Note: read through search previews of these official pages. Capped at 85% until the full pages are opened.<\/li><\/ul>"}],"quiz":[{"q":"Do you need to carry a hunter number card?","options":["Yes, always","No. Carry photo ID and know your FWID number","Only for deer"],"answer":1,"why":"BC replaced the card with the FWID. Carry photo ID and be able to give the number."},{"q":"You hunt deer in 10 days. How do you get the species licence?","options":["Order online, it prints at home","Buy in person","You do not need one"],"answer":1,"why":"Species licences cannot be printed at home and online orders are mailed, about 14 days."},{"q":"What do you need to shoot a mallard?","options":["BC hunting licence only","BC hunting licence and the federal Migratory Game Bird Hunting Permit","A duck species licence"],"answer":1,"why":"Ducks are federal. You need the BC hunting licence plus the federal permit."},{"q":"Can your unlicensed brother carry your rifle on the walk in?","options":["Yes if it is unloaded","No. Having a firearm while out after game can count as hunting","Yes on Crown land"],"answer":1,"why":"Under the Wildlife Act, searching for wildlife while in possession of a firearm is hunting. He would need a licence."}],"checklists":["s2-buy"],"text":" !why no licence, no hunt. some tags take 14 days by mail. buy in person now. what you need, by animal hunting you need --- --- deer bc hunting licence + deer species licence (tag) for that species ducks and geese bc hunting licence + federal bird permit quail and grouse bc hunting licence only - residents need no species licence for quail or grouse (80%). - ducks and geese need no bc species licence, only the federal permit (80%). - mule deer and white tailed deer are separate species licences (80%). your hunter number (fwid) - your old hunter number is now the fwid (fish and wildlife id) (85%). - it is 9 digits: your old number with 3 digits added at the front (85%). - there is no physical card. you do not need to carry a printout (85%). - you must carry photo id and be able to give your fwid number (85%). - not sure of yours? log in to wild (wildlife information and licensing data) and tap find my fwid (85%). - no luck? frontcounter bc: 1 877 855 3222 (80%). the hunting licence - one per licence year. licence year runs 1 april to 31 march (85%). - adult resident cost: $25 + $7 surcharge (80%). gst (goods and services tax): verify. - it is electronic only . no paper copy exists (85%). - buy online in wild, or at service bc or frontcounter bc (85%). deer tags (species licences) - mule deer: $12 + $3 surcharge. white tailed deer: $12 + $3 surcharge (80%). - cannot be printed at home. they are special waterproof paper (85%). - online orders are mailed. about 14 days (85%). - hunting in the next 2 weeks? buy in person at service bc, frontcounter bc or a licence vendor (85%). - some species have a 2 day wait after purchase. for deer: verify. - carry all your species licences for the year, used and unused (85%). !lean buy both a mule deer and a white tailed deer licence. $30 total. you will not know which deer walks out first. federal bird permit (ducks and geese) - name: migratory game bird hunting permit. the habitat stamp is included (80%). - cost: $17 + tax (80%). - 2026 e permit valid 1 august 2026 to 30 june 2027 (80%). - buy online any time with a credit card. save it on your phone (85%). - carry it every time you hunt ducks or geese, paper or phone (85%). your brother - he can come along and watch without a licence , as long as he carries no firearm or weapon (80%). - he can help pack meat out. you must stay with the meat, or fill in a transport record (80%). - he should not call, chase or drive game toward you. that can count as hunting (65%, my reading of the law). - to hunt himself he needs core (conservation and outdoor recreation education), a pal (possession and acquisition licence) for firearms, and a hunting licence. that takes weeks. not this october. buy it this week !rule licences go in a zip bag in the same pocket every time. check the pocket before you leave the truck. !mistake - ordering deer tags online a week before the hunt. they arrive too late. - thinking the hunting licence covers ducks. you also need the federal permit. - leaving used tags at home. carry them all. !field open wild tonight. find your fwid. write it on the back of your pal card in pencil. sources - bc fish and wildlife id page (https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/wild-system/fish-wildlife-id), checked 2026-10-01 - bc species licences page (https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/species-licences), checked 2026-10-01 - bc hunting faq (https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/frequently-asked-questions), checked 2026-10-01 - eccc permit page (https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/permit.html), checked 2026-10-01 - note: read through search previews of these official pages. capped at 85% until the full pages are opened. "}],"glossary":{"ACTS":"Firearm safety rule set. Assume every firearm is loaded. Control the muzzle direction at all times. Trigger finger off the trigger and out of the trigger guard. See that the firearm is unloaded: prove it safe. <span class=\"verify\">VERIFY<\/span> wording against the CFSC (Canadian Firearms Safety Course).","Antlerless":"A deer with no antlers. Usually a doe or a fawn. Some seasons only allow antlerless.","ATV":"All terrain vehicle. A quad.","Backstop":"What is behind your target that will stop the bullet. Earth is good. Sky is never a backstop.","Bag limit":"Most animals of a kind you may take in one day (birds) or one year (big game).","Bore sight":"Lining up the scope with the barrel before shooting, to get on paper fast.","CORE":"Conservation and Outdoor Recreation Education. BC hunter education course.","Crown land":"Public land owned by the province. Hunting is often allowed unless closed.","CWD":"Chronic Wasting Disease. A fatal brain disease in deer, elk and moose.","ECCC":"Environment and Climate Change Canada. Sets migratory bird rules.","FSR":"Forest Service Road. Gravel resource road on Crown land.","FWID":"Fish and Wildlife ID. Your 9 digit BC hunter number. Replaced the old hunter number card.","Glassing":"Scanning country slowly with binoculars to find animals.","LEH":"Limited Entry Hunting. A draw for special hunts.","MGBHP":"Migratory Game Bird Hunting Permit. Federal permit to hunt ducks and geese. Includes the habitat stamp.","MU":"Management Unit. A numbered hunting area, like 3 17. Rules differ by MU.","PAL":"Possession and Acquisition Licence. Federal licence to own and buy firearms.","Patterning":"Shooting a shotgun at paper to see how the shot spreads.","PFD":"Personal flotation device. A life jacket.","Picatinny rail":"A standard mounting strip with slots, used to attach scope rings.","Species licence":"The BC \"tag\" for a big game animal. Paper, notched when you kill the animal.","Synopsis":"The BC Hunting and Trapping Regulations Synopsis. Plain language summary of the law.","WILD":"Wildlife Information and Licensing Data. BC online system to buy licences.","Zero":"The distance where your bullet hits exactly where the crosshair points."},"regs":{"edition":"BC Hunting and Trapping Regulations Synopsis 2026 to 2028 (in force 1 July 2026 to 30 June 2028)","lastChecked":"2026-10-01","note":"Values marked from search extracts were read in search previews of official pages, not the full page. They are capped at 85% until the full source is read. Blank values are VERIFY.","links":[{"name":"BC Hunting and Trapping Regulations Synopsis","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/regulations-synopsis"},{"name":"BC species licences","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/species-licences"},{"name":"BC Fish and Wildlife ID (FWID)","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/wild-system/fish-wildlife-id"},{"name":"BC hunting FAQ","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/frequently-asked-questions"},{"name":"Federal Migratory Game Bird Hunting Permit","url":"https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/permit.html"},{"name":"ECCC BC migratory bird regulations summary","url":"https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/regulations-provincial-territorial-summaries/british-columbia.html"}],"hours":{"bigGame":{"beforeSunriseMin":60,"afterSunsetMin":60,"certainty":80,"text":"No hunting from 1 hour after sunset to 1 hour before sunrise. Applies to big game and upland birds (all wildlife except migratory game birds)."},"migratory":{"beforeSunriseMin":30,"afterSunsetMin":30,"certainty":85,"text":"Ducks and geese: half an hour before sunrise to half an hour after sunset (south of 60 degrees north)."}},"items":[{"group":"licence","key":"fwid","label":"Hunter number","value":"Now called FWID (Fish and Wildlife ID), 9 digits. Old hunter number plus 3 digits at the front. No physical card.","certainty":85,"source":"BC Fish and Wildlife ID page (search extract)","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/wild-system/fish-wildlife-id","checked":"2026-10-01"},{"group":"licence","key":"carry","label":"What to carry","value":"Photo ID. Know your FWID number. All paper species licences for the year (used and unused). Federal bird permit (paper or phone) for ducks and geese.","certainty":85,"source":"BC hunting FAQ; ECCC permit page (search extracts)","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/frequently-asked-questions","checked":"2026-10-01"},{"group":"licence","key":"huntlic","label":"Resident hunting licence","value":"$25 + $7 surcharge. Electronic only. Bought in WILD online or at Service BC / FrontCounter BC.","note":"GST: VERIFY at checkout.","certainty":80,"source":"BC hunting licences page (search extract)","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/hunting-licences","checked":"2026-10-01"},{"group":"licence","key":"year","label":"Licence year","value":"1 April to 31 March","certainty":85,"source":"Hunting Licensing Regulation, s.1 (search extract)","url":"https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/8_99","checked":"2026-10-01"},{"group":"licence","key":"muledeer","label":"Mule deer species licence","value":"$12 + $3 surcharge","certainty":80,"source":"BC species licences page (search extract)","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/species-licences","checked":"2026-10-01"},{"group":"licence","key":"wtdeer","label":"White tailed deer species licence","value":"$12 + $3 surcharge","certainty":80,"source":"BC species licences page (search extract)","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/species-licences","checked":"2026-10-01"},{"group":"licence","key":"print","label":"Buying species licences","value":"Cannot be printed at home. Online orders are mailed (about 14 days). Hunting soon: buy in person.","certainty":85,"source":"BC species licences page (search extract)","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/species-licences","checked":"2026-10-01"},{"group":"licence","key":"wait","label":"Waiting period after buying","value":"","note":"A 2 day waiting period exists for some species. Does it cover deer? VERIFY.","certainty":50,"source":"BC species licences page","checked":"2026-10-01"},{"group":"licence","key":"upland","label":"Quail and grouse licence (residents)","value":"No species licence. BC hunting licence only.","certainty":80,"source":"BC species licences page (search extract)","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/species-licences","checked":"2026-10-01"},{"group":"migratory","key":"mgbhp","label":"Federal Migratory Game Bird Hunting Permit","value":"$17 + tax, stamp included. 2026 e permit valid 1 Aug 2026 to 30 Jun 2027. Buy online, carry on phone or paper.","certainty":80,"source":"ECCC permit page (search extract)","url":"https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/permit.html","checked":"2026-10-01"},{"group":"migratory","key":"ducksR3","label":"Duck and goose seasons near Kamloops","value":"","note":"VERIFY from ECCC BC summary 2026 to 2027.","certainty":0,"source":"ECCC BC summary","url":"https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/regulations-provincial-territorial-summaries/british-columbia.html","checked":"2026-10-01"},{"group":"safety","key":"dwelling","label":"Shooting near buildings","value":"No hunting or shooting within 100 m of a church, school, playground, regional park, or a dwelling house or farm or ranch building occupied by people or domestic animals.","certainty":75,"source":"BC Hunting Regulation B.C. Reg. 190/84 (search extract)","url":"https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/190_84_01","checked":"2026-10-01"},{"group":"safety","key":"companion","label":"Unlicensed companion","value":"May come along and watch, and help pack meat out, if not carrying a firearm or weapon and not hunting. Licensed hunter must stay with the meat unless a transport record is filled in.","certainty":80,"source":"BC hunting FAQ; Wildlife Act s.1 (search extracts)","url":"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/frequently-asked-questions","checked":"2026-10-01"},{"group":"deerR3","key":"r3bag","label":"Region 3 deer bag limit","value":"","note":"Search extract says 3 combined (1 mule deer, 2 white tailed). VERIFY in Region 3 synopsis.","certainty":60,"source":"Region 3 synopsis (search extract)","url":"https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis-region-3-thompson.pdf","checked":"2026-10-01"},{"group":"deerR3","key":"r3mu","label":"MU (Management Unit) for Heffley Creek and Sun Peaks","value":"","note":"VERIFY on official MU map.","certainty":0,"source":"Region 3 synopsis map","checked":"2026-10-01"},{"group":"deerR3","key":"r3mule","label":"Region 3 mule deer season (your MU)","value":"","note":"VERIFY dates and antler rules.","certainty":0,"source":"Region 3 synopsis","checked":"2026-10-01"},{"group":"quail","key":"r8quail","label":"Region 8 California quail","value":"1 Oct to 30 Nov. Daily bag 10, possession 30. MUs 8-1 to 8-15 and 8-21 to 8-26.","certainty":70,"source":"Region 8 synopsis (search extract)","url":"https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis-region-8-okanagan.pdf","checked":"2026-10-01"},{"group":"quail","key":"r3quail","label":"Region 3 California quail","value":"","note":"Is there a season near Heffley Creek? VERIFY.","certainty":0,"source":"Region 3 synopsis","checked":"2026-10-01"}]},"bases":[{"id":"heffley","name":"Heffley Creek","lat":50.86,"lon":-120.27,"region":"Region 3 Thompson","note":"Approximate centre point. Seconds of difference only."},{"id":"sunpeaks","name":"Sun Peaks","lat":50.88,"lon":-119.89,"region":"Region 3 Thompson","note":"Approximate village centre."},{"id":"mission","name":"Mission","lat":49.13,"lon":-122.31,"region":"Region 2 Lower Mainland","note":"Approximate city centre."},{"id":"okanagan","name":"Okanagan (Kelowna)","lat":49.89,"lon":-119.49,"region":"Region 8 Okanagan","note":"Approximate city centre."}],"field":{"defaults":{"firstHunt":"2026-10-15"},"legalFlow":[{"q":"Do I have my licences on me?","help":"Photo ID, FWID (Fish and Wildlife ID) number, species licence for this animal (deer), federal bird permit (ducks and geese).","stop":"No licence, no shot. Go get it."},{"q":"Is it within legal hours right now?","help":"Check the Legal light card. Ducks and geese have shorter hours than deer.","stop":"Too early or too late. Wait."},{"q":"Is the season open for this species, sex and antler type in this MU (Management Unit) today?","help":"Check the synopsis table for your exact MU. Antler rules like 4 point count.","stop":"Not open for this animal here today. Let it walk."},{"q":"Am I 100% sure what it is?","help":"Species, sex, and antler points counted. For ducks: species identified before you shoot.","stop":"Not sure means no. Watch it go and learn from it."},{"q":"Am I off the road, out of the vehicle, and not shooting along or across a road?","help":"Engine off, feet on the ground. VERIFY exact road rules in the synopsis.","stop":"Get off the road and out of the vehicle first."},{"q":"Am I more than 100 m from any occupied house, farm or ranch building?","help":"BC rule, 75% until confirmed in the official text.","stop":"Too close to a building. No shot."},{"q":"Am I allowed to hunt on this land?","help":"Crown land, or written or clear permission from the owner. Not a park or no shooting area.","stop":"No permission or closed area. No shot."},{"q":"Is there a safe backstop and nothing behind it?","help":"Earth behind the animal. No skyline shot. No people, roads, livestock or buildings beyond.","stop":"No safe backstop. Bullets travel kilometres. No shot."},{"q":"Is it a clean, ethical shot within my tested range?","help":"Broadside or quartering away, still animal, steady rest, inside your practised distance.","stop":"Wait for a better angle or get closer. A wounded animal is the worst outcome."}],"cards":[{"id":"emergency","title":"Emergency","sub":"Call, location, bleeding","hot":true,"html":"<h2>Emergency<\/h2><ol><li><strong>Call 911.<\/strong> If no signal, use a satellite messenger or iPhone Emergency SOS via satellite (if your model has it).<\/li><li>Say where you are: GPS (Global Positioning System) coordinates from your map app, nearest road, landmark.<\/li><li>Severe bleeding: firm direct pressure. Tourniquet high and tight on an arm or leg if pressure fails. Note the time.<\/li><li>Stay together. Keep warm. Stay put once help is called.<\/li><\/ol><h3>Numbers<\/h3><ul><li>Emergency: 911<\/li><li>RAPP (Report All Poachers and Polluters): <span class=\"verify\">VERIFY<\/span> number from official source<\/li><li>FrontCounter BC (licences): 1 877 855 3222 <span class=\"cert c-mid\">80%<\/span><\/li><\/ul><p class=\"muted\">Write your brother's number and the land address here on paper too.<\/p>"},{"id":"tag","title":"Tag it","sub":"Steps at the kill","html":"<h2>Right after the kill<\/h2><ol><li>Confirm the animal is dead. Approach from behind, rifle ready.<\/li><li><strong>Cancel (notch) the species licence immediately, before you touch or move the animal.<\/strong> <span class=\"cert c-mid\">85%<\/span><\/li><li>Follow the notch instructions printed on the licence itself (date and month). <span class=\"verify\">VERIFY<\/span> exact fields.<\/li><li>Keep evidence of sex attached: antlers on the head for bucks, or as the regulation lists. <span class=\"cert c-lo\">75%<\/span><\/li><li>Take photos: animal, licence, location.<\/li><li>Check if your MU needs compulsory reporting or inspection. <span class=\"verify\">VERIFY<\/span><\/li><\/ol>"},{"id":"dress","title":"After the shot","sub":"Wait, mark, track","html":"<h2>After the shot<\/h2><ol><li>Stay still. Watch where it runs. Listen.<\/li><li>Mark the spot you shot from and where it stood (phone map pin).<\/li><li>Wait at least 30 minutes before following (tip, opinion).<\/li><li>Go to where it stood. Look for blood, hair, tracks.<\/li><li>Follow the trail slowly. Mark the last blood each time.<\/li><li>Lost the trail? Grid search from the last blood. Get help.<\/li><\/ol><p class=\"muted\">Full field dressing steps come in Session 13.<\/p>"}],"checklists":[{"id":"licences","title":"Licences and paperwork","items":["Find my FWID (Fish and Wildlife ID) in WILD online","BC resident hunting licence 2026 to 2027 bought","Mule deer species licence bought IN PERSON (paper)","White tailed deer species licence bought IN PERSON (paper)","Federal Migratory Game Bird Hunting Permit (e permit on phone)","PAL (Possession and Acquisition Licence) card in wallet","Photo ID in wallet","Brother: decide if he only watches or gets licensed"]},{"id":"before","title":"Before every hunt","items":["Check in season regulation changes (official synopsis page)","Check area closures and fire restrictions (BC Wildfire Service)","Check road and FSR (Forest Service Road) closures","Check CWD (Chronic Wasting Disease) zones and rules","Check the season is open for my MU (Management Unit), species and sex","Legal light times for today","Trip plan left with someone (where, when back)","Weather checked","Phone charged, offline maps downloaded","Licences, ID, permit on me"]},{"id":"after","title":"After the kill","items":["Licence notched before touching the animal","Photos taken","Evidence of sex left attached","Field dressed fast","Meat cooling (open cavity, shade, game bags)","Compulsory reporting checked (VERIFY for my MU)","Journal entry written"]}]}};</script>
<script>/* Hunt Mentor app. Vanilla JS, offline first. All user data stays in localStorage. */
(function () {
  'use strict';
  const HM = window.HM;
  const $ = (s, el = document) => el.querySelector(s);
  const view = $('#view');
  const KEY = 'hm.v1';
  const TZ = 'America/Vancouver';

  // ---------- storage ----------
  const blank = { done: {}, pos: {}, quiz: {}, checks: {}, journal: [], settings: { theme: '', firstHunt: '' } };
  let S;
  try { S = Object.assign({}, blank, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { S = JSON.parse(JSON.stringify(blank)); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage blocked */ } };
  const applyTheme = () => { if (S.settings.theme) document.documentElement.dataset.theme = S.settings.theme; else delete document.documentElement.dataset.theme; };
  applyTheme();

  // ---------- helpers ----------
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sessions = HM.sessions;
  const byId = Object.fromEntries(sessions.map((s) => [s.id, s]));
  const phases = [...new Set(sessions.map((s) => s.phase))];
  const phaseNames = { 1: 'Fast Start', 2: 'Foundations', 3: 'Reading the Land', 4: 'Species', 5: 'The Shot and After', 6: 'Mastery' };
  const setTitle = (t) => { $('#top-title').textContent = t; };
  const tab = (name) => document.querySelectorAll('.tabs a').forEach((a) => a.classList.toggle('on', a.dataset.tab === name));
  const firstHunt = () => S.settings.firstHunt || HM.field.defaults.firstHunt;
  const daysTo = (iso) => Math.ceil((new Date(iso + 'T00:00:00') - new Date(new Date().toDateString())) / 864e5);

  function sheet(html) {
    $('#sheet-body').innerHTML = html;
    $('#sheet').hidden = false;
  }
  $('#sheet-close').onclick = () => { $('#sheet').hidden = true; };
  $('#sheet').onclick = (e) => { if (e.target.id === 'sheet') $('#sheet').hidden = true; };
  $('#btn-back').onclick = () => history.back();
  $('#btn-search').onclick = () => { location.hash = '#/search'; };

  // glossary taps, checklist ticks (delegated)
  document.addEventListener('click', (e) => {
    const t = e.target.closest('.term');
    if (t) {
      const k = t.dataset.term;
      const def = HM.glossary[k] || Object.entries(HM.glossary).find(([g]) => g.toLowerCase() === k.toLowerCase())?.[1];
      sheet(`<h2>${esc(k)}<\/h2><p>${def || 'Not in the glossary yet.'}<\/p>`);
    }
  });
  document.addEventListener('change', (e) => {
    const c = e.target.closest('input[data-key]');
    if (c) { S.checks[c.dataset.key] = c.checked; save(); }
  });
  const hydrateChecks = (root) => root.querySelectorAll('input[data-key]').forEach((c) => { c.checked = !!S.checks[c.dataset.key]; });

  // ---------- sun times (NOAA almanac method) ----------
  function sunEvent(date, lat, lon, rising) {
    const rad = Math.PI / 180, deg = 180 / Math.PI;
    const y = date.getFullYear(), m = date.getMonth(), d = date.getDate();
    const N = Math.floor((Date.UTC(y, m, d) - Date.UTC(y, 0, 0)) / 864e5);
    const lngHour = lon / 15;
    const t = N + ((rising ? 6 : 18) - lngHour) / 24;
    const M = 0.9856 * t - 3.289;
    let L = (M + 1.916 * Math.sin(M * rad) + 0.020 * Math.sin(2 * M * rad) + 282.634 + 360) % 360;
    let RA = (Math.atan(0.91764 * Math.tan(L * rad)) * deg + 360) % 360;
    RA = (RA + Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90) / 15;
    const sinDec = 0.39782 * Math.sin(L * rad), cosDec = Math.cos(Math.asin(sinDec));
    const cosH = (Math.cos(90.833 * rad) - sinDec * Math.sin(lat * rad)) / (cosDec * Math.cos(lat * rad));
    if (cosH > 1 || cosH < -1) return null;
    const H = (rising ? 360 - Math.acos(cosH) * deg : Math.acos(cosH) * deg) / 15;
    const T = H + RA - 0.06571 * t - 6.622;
    const UT = ((T - lngHour) % 24 + 24) % 24;
    let when = new Date(Date.UTC(y, m, d) + UT * 36e5);
    const target = new Date(y, m, d).toLocaleDateString('en-CA');
    for (let i = 0; i < 2; i++) {
      const got = when.toLocaleDateString('en-CA', { timeZone: TZ });
      if (got < target) when = new Date(+when + 864e5); else if (got > target) when = new Date(+when - 864e5); else break;
    }
    return when;
  }
  const hhmm = (dt) => dt ? dt.toLocaleTimeString('en-CA', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }) : 'n/a';
  const addMin = (dt, m) => dt ? new Date(+dt + m * 6e4) : null;

  // ---------- views ----------
  function progress(phase) {
    const list = sessions.filter((s) => phase == null || s.phase === phase);
    const done = list.filter((s) => S.done[s.id]).length;
    return { done, total: list.length, pct: list.length ? Math.round((done / list.length) * 100) : 0 };
  }
  const nextSession = () => sessions.find((s) => !S.done[s.id]);

  function home() {
    setTitle('Hunt Mentor'); tab('home');
    const d = daysTo(firstHunt());
    const nx = nextSession();
    const p = progress();
    const misses = Object.entries(S.quiz).filter(([, v]) => !v).length;
    view.innerHTML = `
      <div class="card row">
        <div class="grow"><div class="muted">First hunt<\/div><div class="big">${d > 0 ? d : 0} days<\/div>
        <div class="muted">${esc(firstHunt())}${S.settings.firstHunt ? '' : ' (placeholder date, set yours in More)'}<\/div><\/div>
        <a class="btn primary" href="#/field">Field Mode<\/a>
      <\/div>
      ${nx ? `<a class="card" style="display:block;text-decoration:none;color:inherit" href="#/s/${nx.id}">
        <div class="muted">Next session<\/div><h2>${nx.phase}.${nx.num} ${esc(nx.title)}<\/h2><div class="muted">${nx.minutes} min<\/div><\/a>` : '<div class="card"><h2>All sessions done<\/h2><\/div>'}
      <div class="card"><h2>Progress<\/h2>
        <div class="muted">${p.done} of ${p.total} sessions<\/div><div class="bar"><i style="width:${p.pct}%"><\/i><\/div>
        ${phases.map((ph) => { const q = progress(ph); return `<div style="margin-top:10px"><div class="row"><span class="grow">${ph}. ${phaseNames[ph]}<\/span><span class="muted">${q.done}/${q.total}<\/span><\/div><div class="bar"><i style="width:${q.pct}%"><\/i><\/div><\/div>`; }).join('')}
      <\/div>
      ${misses ? `<a class="btn block" href="#/review">Review ${misses} missed quiz question${misses > 1 ? 's' : ''}<\/a>` : ''}
      <p class="muted">Regulation data last checked: ${esc(HM.regs.lastChecked)}. Content built ${esc(HM.built)}.<\/p>`;
  }

  function learn() {
    setTitle('Learn'); tab('learn');
    view.innerHTML = phases.map((ph) => `<div class="card"><h2>Phase ${ph}: ${phaseNames[ph]}<\/h2><div class="list">
      ${sessions.filter((s) => s.phase === ph).map((s) => `<a class="item ${S.done[s.id] ? 'done' : ''}" href="#/s/${s.id}">
        <span class="num">${S.done[s.id] ? '&#10003;' : s.num}<\/span><span class="grow">${esc(s.title)}<\/span><span class="pill">${s.minutes} min<\/span><\/a>`).join('')}
    <\/div><\/div>`).join('');
  }

  function session(id, stepArg) {
    const s = byId[id]; if (!s) return notFound();
    tab('learn');
    const steps = s.steps.slice();
    if (s.quiz.length) steps.push({ title: 'Quiz', quiz: true });
    let i = stepArg != null ? +stepArg : (S.pos[id] || 0);
    i = Math.max(0, Math.min(i, steps.length - 1));
    S.pos[id] = i; save();
    const st = steps[i];
    setTitle(`${s.phase}.${s.num} ${s.title}`);
    const last = i === steps.length - 1;
    view.innerHTML = `
      <div class="dots">${steps.map((_, n) => `<i class="${n <= i ? 'on' : ''}"><\/i>`).join('')}<\/div>
      <div class="muted">${s.minutes} min. Screen ${i + 1} of ${steps.length}<\/div>
      <article class="step"><h2>${esc(st.title)}<\/h2>${st.quiz ? quizHtml(s) : st.html}<\/article>
      <div class="btn-row">
        ${i > 0 ? `<a class="btn" href="#/s/${id}/${i - 1}">Back<\/a>` : '<a class="btn" href="#/learn">List<\/a>'}
        ${last ? `<button class="btn primary" id="mark">${S.done[id] ? 'Done &#10003;' : 'Mark done'}<\/button>` : `<a class="btn primary" href="#/s/${id}/${i + 1}">Next<\/a>`}
      <\/div>`;
    hydrateChecks(view);
    renderRegs(view);
    if (st.quiz) bindQuiz(s);
    const mk = $('#mark'); if (mk) mk.onclick = () => { S.done[id] = true; save(); const nx = nextSession(); location.hash = nx ? `#/s/${nx.id}` : '#/'; };
    window.scrollTo(0, 0);
  }

  function quizHtml(s, only) {
    return s.quiz.map((q, n) => {
      const qid = `${s.id}#${n}`;
      if (only && !only.includes(qid)) return '';
      return `<div class="q" data-qid="${qid}" data-sid="${s.id}" data-n="${n}"><p><strong>${n + 1}. ${esc(q.q)}<\/strong><\/p>
        ${q.options.map((o, k) => `<button class="opt" data-k="${k}">${esc(o)}<\/button>`).join('')}<div class="why" hidden><\/div><\/div>`;
    }).join('');
  }
  function bindQuiz() {
    view.querySelectorAll('.q').forEach((qel) => {
      const s = byId[qel.dataset.sid]; const q = s.quiz[+qel.dataset.n];
      qel.querySelectorAll('.opt').forEach((b) => b.onclick = () => {
        if (qel.dataset.answered) return;
        qel.dataset.answered = '1';
        const k = +b.dataset.k; const ok = k === q.answer;
        b.classList.add(ok ? 'right' : 'wrong');
        qel.querySelector(`.opt[data-k="${q.answer}"]`).classList.add('right');
        const why = qel.querySelector('.why');
        why.hidden = false; why.innerHTML = `<strong>${ok ? 'Correct.' : 'Not quite.'}<\/strong> ${esc(q.why)}`;
        S.quiz[qel.dataset.qid] = ok; save();
      });
    });
  }

  function review() {
    setTitle('Review'); tab('home');
    const missed = Object.entries(S.quiz).filter(([, v]) => !v).map(([k]) => k);
    if (!missed.length) { view.innerHTML = '<div class="card"><h2>Nothing to review<\/h2><p>Every quiz answer so far is right.<\/p><\/div>'; return; }
    view.innerHTML = '<p class="muted">Questions you missed. Get them right to clear them.<\/p>' +
      [...new Set(missed.map((k) => k.split('#')[0]))].filter((id) => byId[id]).map((id) => `<div class="card"><h2>${esc(byId[id].title)}<\/h2>${quizHtml(byId[id], missed)}<\/div>`).join('');
    bindQuiz();
  }

  // ---------- regs data render ----------
  function renderRegs(root) {
    root.querySelectorAll('[data-regs]').forEach((el) => {
      const keys = el.dataset.regs.split(',');
      const rows = HM.regs.items.filter((r) => keys.some((k) => r.group === k || r.key === k));
      el.innerHTML = rows.length ? `<div class="tbl"><table><thead><tr><th>What<\/th><th>Rule<\/th><th>Certainty<\/th><th>Source<\/th><\/tr><\/thead><tbody>${rows.map((r) => `<tr>
        <td>${esc(r.label)}<\/td><td>${r.value ? esc(r.value) : '<span class="verify">VERIFY<\/span>'}${r.note ? `<div class="muted">${esc(r.note)}<\/div>` : ''}<\/td>
        <td><span class="cert ${r.certainty >= 95 ? 'c-hi' : r.certainty >= 80 ? 'c-mid' : r.certainty >= 60 ? 'c-lo' : 'c-tip'}">${r.certainty}%<\/span><\/td>
        <td>${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.source)}<\/a>` : esc(r.source || '')}${r.page ? `, ${esc(r.page)}` : ''}<div class="muted">checked ${esc(r.checked)}<\/div><\/td><\/tr>`).join('')}<\/tbody><\/table><\/div>`
        : '<p><span class="verify">VERIFY<\/span> No checked data yet.<\/p>';
    });
  }

  // ---------- field mode ----------
  function field(sub) {
    document.body.classList.add('field');
    tab('field');
    const F = HM.field;
    if (!sub) {
      setTitle('Field Mode');
      view.innerHTML = `<div class="fgrid">
        <a class="ftile hot" href="#/field/legal">Legal to shoot?<small>Step by step check<\/small><\/a>
        <a class="ftile" href="#/field/light">Legal light<small>3 bases, offline<\/small><\/a>
        ${F.cards.map((c) => `<a class="ftile ${c.hot ? 'hot' : ''}" href="#/field/c/${c.id}">${esc(c.title)}<small>${esc(c.sub || '')}<\/small><\/a>`).join('')}
      <\/div>`;
      return;
    }
    if (sub === 'legal') return legalFlow(0);
    if (sub === 'light') return lightView();
    if (sub.startsWith('c/')) {
      const c = F.cards.find((x) => x.id === sub.slice(2)); if (!c) return notFound();
      setTitle(c.title);
      view.innerHTML = `<div class="card step">${c.html}<\/div>`;
      hydrateChecks(view);
    }
  }

  function legalFlow(n) {
    const steps = HM.field.legalFlow;
    setTitle('Legal to shoot?');
    if (n >= steps.length) {
      view.innerHTML = `<div class="go">All checks passed. Breathe. Only shoot if the shot is ethical and you are sure.<\/div>
        <div class="btn-row"><button class="btn" id="again">Start again<\/button><\/div>`;
      $('#again').onclick = () => legalFlow(0);
      return;
    }
    const st = steps[n];
    view.innerHTML = `<div class="muted">Check ${n + 1} of ${steps.length}<\/div>
      <div class="flow"><div class="node">${esc(st.q)}<\/div>${st.help ? `<p class="muted">${esc(st.help)}<\/p>` : ''}
      <div class="yesno"><button class="btn primary" id="yes">YES<\/button><button class="btn" id="no">NO<\/button><\/div><\/div>`;
    $('#yes').onclick = () => legalFlow(n + 1);
    $('#no').onclick = () => {
      view.innerHTML = `<div class="stop">DO NOT SHOOT<\/div><p>${esc(st.stop)}<\/p>
        <div class="btn-row"><button class="btn" id="again">Start again<\/button><\/div>`;
      $('#again').onclick = () => legalFlow(0);
    };
  }

  function lightView(dateStr) {
    setTitle('Legal light');
    const today = new Date().toLocaleDateString('en-CA', { timeZone: TZ });
    const ds = dateStr || today;
    const [y, m, d] = ds.split('-').map(Number);
    const date = new Date(y, m - 1, d, 12);
    const H = HM.regs.hours;
    const rows = HM.bases.map((b) => {
      const rise = sunEvent(date, b.lat, b.lon, true), set = sunEvent(date, b.lat, b.lon, false);
      const col = (h) => h && h.beforeSunriseMin != null ? `${hhmm(addMin(rise, -h.beforeSunriseMin))} to ${hhmm(addMin(set, h.afterSunsetMin))}` : '<span class="verify">VERIFY<\/span>';
      return `<tr><td><strong>${esc(b.name)}<\/strong><\/td><td>${hhmm(rise)}<br>${hhmm(set)}<\/td><td>${col(H.bigGame)}<\/td><td>${col(H.migratory)}<\/td><\/tr>`;
    }).join('');
    view.innerHTML = `<div class="card"><label class="f" for="ld">Date<\/label><input type="date" id="ld" value="${ds}"><\/div>
      <div class="tbl light"><table><thead><tr><th>Base<\/th><th>Sunrise / sunset<\/th><th>Big game and upland<\/th><th>Ducks and geese<\/th><\/tr><\/thead><tbody>${rows}<\/tbody><\/table><\/div>
      <aside class="callout warn"><div class="callout-t">Verify with official tables<\/div>
      <p>Calculated on your phone, Pacific time. Can be off by a few minutes in hills and valleys.<\/p>
      <p>Big game rule: ${esc(H.bigGame.text)} ${certBadge(H.bigGame.certainty)}<\/p>
      <p>Migratory birds rule: ${esc(H.migratory.text)} ${certBadge(H.migratory.certainty)}<\/p><\/aside>`;
    $('#ld').onchange = (e) => lightView(e.target.value);
  }
  const certBadge = (v) => v == null ? '<span class="verify">VERIFY<\/span>' : `<span class="cert ${v >= 95 ? 'c-hi' : v >= 80 ? 'c-mid' : v >= 60 ? 'c-lo' : 'c-tip'}">${v}%<\/span>`;

  // ---------- lists ----------
  function lists(id) {
    setTitle('Checklists'); tab('lists');
    const L = HM.field.checklists;
    if (!id) {
      view.innerHTML = `<div class="list card">${L.map((l) => {
        const n = l.items.filter((_, k) => S.checks[`${l.id}:${k}`]).length;
        return `<a class="item" href="#/lists/${l.id}"><span class="grow">${esc(l.title)}<\/span><span class="pill">${n}/${l.items.length}<\/span><\/a>`;
      }).join('')}<\/div>`;
      return;
    }
    const l = L.find((x) => x.id === id); if (!l) return notFound();
    setTitle(l.title);
    view.innerHTML = `<div class="card"><div class="checklist">${l.items.map((t, k) =>
      `<label class="check"><input type="checkbox" data-key="${l.id}:${k}"><span>${t}<\/span><\/label>`).join('')}<\/div>
      <div class="btn-row"><button class="btn" id="reset">Untick all<\/button><\/div><\/div>`;
    hydrateChecks(view);
    $('#reset').onclick = () => { l.items.forEach((_, k) => delete S.checks[`${l.id}:${k}`]); save(); lists(id); };
  }

  // ---------- more ----------
  function more() {
    setTitle('More'); tab('more');
    const th = S.settings.theme;
    view.innerHTML = `
      <div class="card"><h2>Look<\/h2><div class="seg" id="theme">
        ${[['', 'Auto'], ['light', 'Light'], ['dark', 'Dark'], ['sun', 'Sunlight']].map(([v, l]) => `<button data-v="${v}" class="${th === v ? 'on' : ''}">${l}<\/button>`).join('')}<\/div><\/div>
      <div class="card"><h2>First hunt date<\/h2><input type="date" id="fh" value="${esc(firstHunt())}"><\/div>
      <div class="card list">
        <a class="item" href="#/glossary"><span class="grow">Glossary<\/span><\/a>
        <a class="item" href="#/journal"><span class="grow">Hunt journal<\/span><\/a>
        <a class="item" href="#/review"><span class="grow">Review missed questions<\/span><\/a>
        <a class="item" href="#/sources"><span class="grow">Regulation data and sources<\/span><\/a>
        <a class="item" href="#/install"><span class="grow">Install on iPhone or Android<\/span><\/a>
      <\/div>
      <div class="card"><h2>Backup<\/h2><p class="muted">Your progress lives on this phone only. iPhone can clear it if the app goes unused for weeks. Export a backup now and then.<\/p>
        <div class="btn-row"><button class="btn" id="exp">Export backup<\/button><label class="btn">Import<input type="file" id="imp" accept=".json" hidden><\/label><\/div><\/div>`;
    view.querySelectorAll('#theme button').forEach((b) => b.onclick = () => { S.settings.theme = b.dataset.v; save(); applyTheme(); more(); });
    $('#fh').onchange = (e) => { S.settings.firstHunt = e.target.value; save(); };
    $('#exp').onclick = () => download(`hunt-mentor-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(S), 'application/json');
    $('#imp').onchange = (e) => {
      const f = e.target.files[0]; if (!f) return;
      f.text().then((t) => { try { S = Object.assign({}, blank, JSON.parse(t)); save(); applyTheme(); alert('Backup restored.'); more(); } catch (err) { alert('That file is not a Hunt Mentor backup.'); } });
    };
  }
  function download(name, text, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
  }

  function glossary() {
    setTitle('Glossary'); tab('more');
    const terms = Object.keys(HM.glossary).sort((a, b) => a.localeCompare(b));
    view.innerHTML = `<input type="search" id="gq" placeholder="Filter terms"><div class="card" id="gl" style="margin-top:12px"><\/div>`;
    const draw = (q) => { $('#gl').innerHTML = terms.filter((t) => !q || (t + HM.glossary[t]).toLowerCase().includes(q)).map((t) => `<p><strong>${esc(t)}<\/strong>: ${HM.glossary[t]}<\/p>`).join('') || '<p>No match.<\/p>'; };
    $('#gq').oninput = (e) => draw(e.target.value.toLowerCase()); draw('');
  }

  function search() {
    setTitle('Search'); tab('');
    view.innerHTML = `<input type="search" id="q" placeholder="Search sessions, glossary, rules" autofocus><div id="res" style="margin-top:12px"><\/div>`;
    const run = (q) => {
      q = q.trim().toLowerCase(); if (q.length < 2) { $('#res').innerHTML = ''; return; }
      const ses = sessions.filter((s) => s.text.includes(q) || s.title.toLowerCase().includes(q));
      const gl = Object.keys(HM.glossary).filter((t) => (t + HM.glossary[t]).toLowerCase().includes(q));
      const rg = HM.regs.items.filter((r) => (r.label + ' ' + (r.value || '') + ' ' + (r.note || '')).toLowerCase().includes(q));
      $('#res').innerHTML = `
        ${ses.length ? `<div class="card list"><h2>Sessions<\/h2>${ses.map((s) => `<a class="item" href="#/s/${s.id}"><span class="num">${s.num}<\/span><span class="grow">${esc(s.title)}<\/span><\/a>`).join('')}<\/div>` : ''}
        ${gl.length ? `<div class="card"><h2>Glossary<\/h2>${gl.map((t) => `<p><strong>${esc(t)}<\/strong>: ${HM.glossary[t]}<\/p>`).join('')}<\/div>` : ''}
        ${rg.length ? `<div class="card"><h2>Rules data<\/h2>${rg.map((r) => `<p><strong>${esc(r.label)}<\/strong>: ${r.value ? esc(r.value) : 'VERIFY'} ${certBadge(r.certainty)}<\/p>`).join('')}<\/div>` : ''}
        ${!ses.length && !gl.length && !rg.length ? '<p>No results.<\/p>' : ''}`;
    };
    $('#q').oninput = (e) => run(e.target.value);
  }

  function sources() {
    setTitle('Rules data'); tab('more');
    const R = HM.regs;
    view.innerHTML = `<div class="card"><p><strong>Edition:<\/strong> ${esc(R.edition)}<\/p><p><strong>Last checked:<\/strong> ${esc(R.lastChecked)}<\/p>
      <p class="muted">${esc(R.note)}<\/p><\/div><div class="card"><h2>All rules in the app<\/h2><div data-regs="${[...new Set(R.items.map((r) => r.group))].join(',')}"><\/div><\/div>
      <div class="card"><h2>Official links<\/h2>${R.links.map((l) => `<p><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)}<\/a><\/p>`).join('')}<\/div>`;
    renderRegs(view);
  }

  function install() {
    setTitle('Install'); tab('more');
    view.innerHTML = `<div class="card step"><h2>iPhone<\/h2><ol>
      <li>Open this page in <strong>Safari<\/strong> (not Chrome).<\/li><li>Tap the <strong>Share<\/strong> button (square with an arrow up).<\/li>
      <li>Scroll down. Tap <strong>Add to Home Screen<\/strong>.<\/li><li>Tap <strong>Add<\/strong>.<\/li>
      <li>Open it once from the home screen while you have signal. It then works offline.<\/li><\/ol><\/div>
      <div class="card step"><h2>Android<\/h2><ol><li>Open this page in <strong>Chrome<\/strong>.<\/li><li>Tap the three dots menu.<\/li>
      <li>Tap <strong>Install app<\/strong> or <strong>Add to Home screen<\/strong>.<\/li><li>Open it once with signal.<\/li><\/ol><\/div>
      <div class="card"><h2>Test it<\/h2><p>Turn on airplane mode. Open the app. Sessions and Field Mode should still work.<\/p><\/div>`;
  }

  function journal(editIdx) {
    setTitle('Hunt journal'); tab('more');
    const J = S.journal;
    const fields = [['date', 'Date', 'date'], ['place', 'Place or MU (Management Unit)', 'text'], ['species', 'Species hunted', 'text'],
      ['weather', 'Weather and wind', 'text'], ['seen', 'What you saw', 'textarea'], ['result', 'Shots and result', 'text'], ['lesson', 'One lesson', 'textarea']];
    if (editIdx != null) {
      const e = J[editIdx] || { date: new Date().toLocaleDateString('en-CA', { timeZone: TZ }) };
      view.innerHTML = `<div class="card">${fields.map(([k, l, t]) => `<label class="f" for="j-${k}">${l}<\/label>${t === 'textarea' ? `<textarea id="j-${k}" rows="3">${esc(e[k] || '')}<\/textarea>` : `<input type="${t}" id="j-${k}" value="${esc(e[k] || '')}">`}`).join('')}
        <div class="btn-row"><a class="btn" href="#/journal">Cancel<\/a><button class="btn primary" id="js">Save<\/button><\/div><\/div>`;
      $('#js').onclick = () => { const o = {}; fields.forEach(([k]) => { o[k] = $(`#j-${k}`).value; }); if (J[editIdx]) J[editIdx] = o; else J.unshift(o); save(); location.hash = '#/journal'; };
      return;
    }
    view.innerHTML = `<div class="btn-row"><a class="btn primary" href="#/journal/new">New entry<\/a><button class="btn" id="csv">Export CSV<\/button><\/div>
      <div class="list card" style="margin-top:12px">${J.map((e, n) => `<a class="item" href="#/journal/${n}"><span class="grow"><strong>${esc(e.date)}<\/strong> ${esc(e.place || '')}<br><span class="muted">${esc(e.species || '')} ${esc(e.result || '')}<\/span><\/span><\/a>`).join('') || '<p>No entries yet. Log every trip, even blank ones.<\/p>'}<\/div>`;
    $('#csv').onclick = () => {
      const q = (v) => `"${String(v || '').replace(/"/g, '""')}"`;
      download('hunt-journal.csv', [fields.map((f) => q(f[1])).join(','), ...J.map((e) => fields.map(([k]) => q(e[k])).join(','))].join('\n'), 'text/csv');
    };
  }

  function notFound() { view.innerHTML = '<div class="card"><h2>Not found<\/h2><a href="#/">Home<\/a><\/div>'; }

  // ---------- router ----------
  function route() {
    document.body.classList.remove('field');
    $('#sheet').hidden = true;
    const h = location.hash.replace(/^#\/?/, '').split('/');
    const [a, b, c] = h;
    if (!a) home();
    else if (a === 'learn') learn();
    else if (a === 's') session(b, c);
    else if (a === 'field') field(h.slice(1).join('/'));
    else if (a === 'lists') lists(b);
    else if (a === 'more') more();
    else if (a === 'glossary') glossary();
    else if (a === 'search') search();
    else if (a === 'review') review();
    else if (a === 'sources') sources();
    else if (a === 'install') install();
    else if (a === 'journal') journal(b === 'new' ? -1 : b != null ? +b : undefined);
    else notFound();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body>
</html>
