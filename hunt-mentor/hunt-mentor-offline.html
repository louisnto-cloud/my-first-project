38\" r=\"12\" fill=\"#6b4f35\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <text x=\"120\" y=\"273\" font-size=\"16\" fill=\"#23261f\" text-anchor=\"middle\" font-weight=\"bold\">A<\/text>\n  <text x=\"280\" y=\"273\" font-size=\"16\" fill=\"#23261f\" text-anchor=\"middle\" font-weight=\"bold\">B<\/text>\n  <path d=\"M140,262 L260,262\" fill=\"none\" stroke=\"#23261f\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/>\n  <text x=\"200\" y=\"256\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">in sight, in line<\/text>\n  <text x=\"200\" y=\"296\" font-size=\"14\" fill=\"#2f3a2b\" text-anchor=\"middle\">Each arc about 45 degrees, straight ahead<\/text>\n  <line x1=\"20\" y1=\"314\" x2=\"380\" y2=\"314\" stroke=\"#8a9a6b\" stroke-width=\"2\"/>\n  <text x=\"200\" y=\"344\" font-size=\"18\" font-weight=\"bold\" fill=\"#23261f\" text-anchor=\"middle\">Small boat, back to back<\/text>\n  <path d=\"M300,450 L370,400 A86,86 0 0 1 370,500 Z\" fill=\"#8a9a6b\" fill-opacity=\"0.55\" stroke=\"#2f3a2b\" stroke-width=\"2\"/>\n  <path d=\"M100,450 L30,400 A86,86 0 0 0 30,500 Z\" fill=\"#8a9a6b\" fill-opacity=\"0.55\" stroke=\"#2f3a2b\" stroke-width=\"2\"/>\n  <path d=\"M95,425 L280,425 Q330,425 345,450 Q330,475 280,475 L95,475 Z\" fill=\"#6b4f35\" fill-opacity=\"0.35\" stroke=\"#6b4f35\" stroke-width=\"3\"/>\n  <circle cx=\"270\" cy=\"450\" r=\"11\" fill=\"#6b4f35\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <circle cx=\"130\" cy=\"450\" r=\"11\" fill=\"#6b4f35\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <text x=\"270\" y=\"415\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">bow shooter<\/text>\n  <text x=\"130\" y=\"415\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">stern shooter<\/text>\n  <text x=\"372\" y=\"390\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"end\">bow arc<\/text>\n  <text x=\"28\" y=\"390\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"start\">stern arc<\/text>\n  <text x=\"200\" y=\"456\" font-size=\"14\" fill=\"#e8590c\" text-anchor=\"middle\" font-weight=\"bold\">NO SHOT<\/text>\n  <text x=\"200\" y=\"512\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Sit to shoot. Never swing past<\/text>\n  <text x=\"200\" y=\"530\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">your partner. Motor off, anchored.<\/text>\n<\/svg>\n<\/figure>"},{"title":"Two hunters walking side by side","html":"<ul><li>Walk in a line, side by side, always in sight of each other <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Each covers the arc in front. The middle and behind are no shot zones <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>One gets ahead or drops back? Both stop. Fix the line first.<\/li><li>Lose sight of each other? Muzzles up or down, no shooting, call out.<\/li><\/ul><aside class=\"callout tip\"><div class=\"callout-t\">Tip (opinion)<\/div><p>Bright orange on hat and vest helps you see each other in timber. My lean: wear it. Whether BC requires it: not covered here.<\/p><\/aside>"},{"title":"In a blind and in a boat or canoe","html":"<h3>In a blind<\/h3><ul><li>You and your brother agree who takes the left side and who takes the right side before first light.<\/li><li>Shoot only birds or deer on your side. Muzzles out the front, never across your partner.<\/li><li>Guns rest muzzle up or out the front when not shooting. Never leaned on the wall behind you.<\/li><\/ul><h3>In a boat or canoe<\/h3><ul><li>Two hunters sit back to back: bow shooter faces forward, stern shooter faces back (70%, hunter education guidance).<\/li><li>Shoot sitting. Never stand. See the water safety session.<\/li><li>Only one person moves at a time. Unload before anyone changes seats.<\/li><li>Loading in a boat is a legal question too. See the water safety session.<\/li><\/ul>"},{"title":"Fences, logs and ditches","html":"<ul><li>Alone: unload, PROVE it, lay the firearm under or through the fence, muzzle pointed away from you <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Cross well away from the muzzle, then pick it up by the stock <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>With a partner: one unloads and holds both firearms, actions open. The other crosses, then takes both. Then the first crosses (Tip, common hunter education method).<\/li><li>Never climb a fence, log or bank with a loaded firearm in your hands.<\/li><\/ul>"},{"title":"At the car","html":"<ul><li>Load only where you may lawfully shoot. Federal rules allow loading only in such a place <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>In BC, you must not transport, carry or store a loaded firearm in or on a vehicle or boat <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>\"Unloaded\" means no cartridge in the chamber, and none in a magazine attached to or inserted in the firearm <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>So: magazine out, chamber empty, before the firearm goes in the car or on the <button class=\"term\" data-term=\"ATV\">ATV<\/button> <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Leaving the car? Non restricted firearms go locked in the trunk or a lockable compartment. No trunk: out of sight, car locked <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Unload facing away from the car, partner and road. Load the same way, at the start of the walk.<\/li><\/ul><aside class=\"callout warn\"><div class=\"callout-t\">Warning<\/div><p>BC's Firearm Violence Prevention Act (FVPA) came into force 1 October 2026, with hunting exemptions made by regulation <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>. Exact exemption wording: <span class=\"verify\">VERIFY<\/span> before you hunt.<\/p><\/aside>"},{"title":"Two armed hunters: you and your brother","html":"<ul><li>Both of you hold <button class=\"term\" data-term=\"CORE\">CORE<\/button> and a <button class=\"term\" data-term=\"PAL\">PAL<\/button>. Each carries your own licences and tags (owner confirmed).<\/li><li>Before every walk, agree three things: who covers left, who covers right, and the stop signal.<\/li><li>Only one of you shoots at a deer unless you agreed a backup plan first (Tip).<\/li><li>Neither one steps in front of the other's muzzle. Ever.<\/li><li>After a shot, both unload, then walk up together. The shooter leads.<\/li><li>First hunt for him? Swap roles at midday so each practises spotter and shooter (Tip).<\/li><\/ul><h3>General case: a non hunting companion<\/h3><ul><li>A person who only watches carries no firearm (80%, see Licences session).<\/li><li>They walk behind or beside you, never ahead, and freeze on your signal.<\/li><\/ul><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>Grandpa's rule (wisdom): The safety is a mechanical device. Your muzzle and your finger are the real safety.<\/p><\/aside><aside class=\"callout mistake\"><div class=\"callout-t\">Common mistakes<\/div><ul><li>Pointing the muzzle at your partner while you unload at the tailgate.<\/li><li>Leaving a round in the magazine \"because it is not in the chamber\". Attached magazine counts as loaded.<\/li><li>Following a running deer with the muzzle past your shooting arc.<\/li><\/ul><\/aside><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>At the car, each of you runs PROVE out loud while the other watches. Then walk 50 m (55 yd) side by side, unloaded, and point out each other's arc with your arms.<\/p><\/aside>"},{"title":"Sources","html":"<ul><li><a href=\"https://publications.gc.ca/collections/collection_2015/grc-rcmp/PS99-2-2-1-2014-eng.pdf\" target=\"_blank\" rel=\"noopener\">Canadian Firearms Safety Course handbook, RCMP (Royal Canadian Mounted Police), Government of Canada publications<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://www.firearmstraining.ca/actsprove.htm\" target=\"_blank\" rel=\"noopener\">ACTS and PROVE, Canadian Firearms Training<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://rcmp.ca/en/firearms/firearms-safety-training-transport-and-storage/storing-transporting-and-displaying-firearms\" target=\"_blank\" rel=\"noopener\">RCMP: Storing, transporting and displaying firearms<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://laws-lois.justice.gc.ca/eng/regulations/sor-98-209/page-1.html\" target=\"_blank\" rel=\"noopener\">Storage, Display, Transportation and Handling of Firearms by Individuals Regulations, SOR/98-209<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://www2.gov.bc.ca/gov/content/justice/criminal-justice/policing-in-bc/fvpa\" target=\"_blank\" rel=\"noopener\">BC Firearm Violence Prevention Act page<\/a>, section 4, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://news.gov.bc.ca/releases/2026PSSG0037-000460\" target=\"_blank\" rel=\"noopener\">BC news release on FVPA in force 1 October 2026<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://www.hunter-ed.com/national/studyGuide/Determining-Your-Safe-Zone-of-Fire/201099_93020/\" target=\"_blank\" rel=\"noopener\">Hunter Ed: Determining your safe zone of fire<\/a>, checked 2026-10-01 (search preview, United States course material)<\/li><li><a href=\"https://www.hunter-ed.com/national/studyGuide/Crossing-Obstacles-Alone/201099_93010/\" target=\"_blank\" rel=\"noopener\">Hunter Ed: Crossing obstacles alone<\/a>, checked 2026-10-01 (search preview)<\/li><li>Note: all pages read through search previews. Capped at 85% until the full pages are opened.<\/li><\/ul>"}],"quiz":[{"q":"What does the S in ACTS stand for?","options":["Safety on","See that the firearm is unloaded: PROVE it safe","Sight your target"],"answer":1,"why":"The Vital Four ACTS end with: See that the firearm is unloaded, PROVE it safe."},{"q":"Your magazine is in the rifle but the chamber is empty. Is it unloaded for transport?","options":["Yes","No. A cartridge in an attached or inserted magazine means loaded","Only if the safety is on"],"answer":1,"why":"The federal definition of unloaded covers the chamber and any magazine attached to or inserted in the firearm."},{"q":"A deer runs between you and your partner walking side by side. What do you do?","options":["Swing and shoot quickly","Hold fire. It is outside both arcs","Shoot only if it stops"],"answer":1,"why":"The space between two hunters walking abreast is a no shot zone. Never swing past your arc."},{"q":"Crossing a barbed wire fence alone, what comes first?","options":["Hold the rifle high and step over","Unload and PROVE it, then pass it under the fence muzzle away","Put the safety on and climb"],"answer":1,"why":"Never cross an obstacle with a loaded firearm. Unload, lay it through, cross away from the muzzle."},{"q":"You and your brother both carry rifles. What do you agree before the walk?","options":["Nothing, just be careful","Who covers left, who covers right, and a stop signal","Who gets the first deer"],"answer":1,"why":"Agreed arcs and a stop signal keep each muzzle off the other hunter."}],"checklists":[],"text":" !why you both passed the course. now there are two loaded guns, two new hunters, cold hands and excitement. that is when habits matter. !warn study aid only. the official regulations are the law. acts: the vital four the cfsc (canadian firearms safety course) teaches these as the \"vital four acts\" (85%). - a ssume every firearm is loaded (85%). - c ontrol the muzzle direction at all times (85%). - t rigger finger off the trigger and out of the trigger guard (85%). - s ee that the firearm is unloaded: prove it safe (85%). - wording read in search previews of the course handbook and course provider pages, not the full handbook (see sources). prove it safe - p oint the firearm in the safest available direction (85%). - r emove all cartridges (85%). - o bserve the chamber (85%). - v erify the feeding path (85%). - e xamine the bore for obstructions (85%). - do acts and prove every time you pick up, put down, hand over or receive a firearm (80%). - also when you clean it, and before you store or transport it (80%). !tip say each letter out loud when you prove it. have your brother do the same. you each catch the other skipping a step. zones of fire - a zone of fire is the only slice of ground where you may shoot (75%). - hunter education teaches about 45 degrees straight ahead for each hunter (75%). - never swing the muzzle outside it, even tracking a running deer (75%). - every shot also needs a safe backstop . sky is never one. two hunters walking side by side - walk in a line, side by side, always in sight of each other (75%). - each covers the arc in front. the middle and behind are no shot zones (75%). - one gets ahead or drops back? both stop. fix the line first. - lose sight of each other? muzzles up or down, no shooting, call out. !tip bright orange on hat and vest helps you see each other in timber. my lean: wear it. whether bc requires it: not covered here. in a blind and in a boat or canoe in a blind - you and your brother agree who takes the left side and who takes the right side before first light. - shoot only birds or deer on your side. muzzles out the front, never across your partner. - guns rest muzzle up or out the front when not shooting. never leaned on the wall behind you. in a boat or canoe - two hunters sit back to back: bow shooter faces forward, stern shooter faces back (70%, hunter education guidance). - shoot sitting. never stand. see the water safety session. - only one person moves at a time. unload before anyone changes seats. - loading in a boat is a legal question too. see the water safety session. fences, logs and ditches - alone: unload, prove it, lay the firearm under or through the fence, muzzle pointed away from you (75%). - cross well away from the muzzle, then pick it up by the stock (75%). - with a partner: one unloads and holds both firearms, actions open. the other crosses, then takes both. then the first crosses (tip, common hunter education method). - never climb a fence, log or bank with a loaded firearm in your hands. at the car - load only where you may lawfully shoot. federal rules allow loading only in such a place (80%). - in bc, you must not transport, carry or store a loaded firearm in or on a vehicle or boat (80%). - \"unloaded\" means no cartridge in the chamber, and none in a magazine attached to or inserted in the firearm (80%). - so: magazine out, chamber empty, before the firearm goes in the car or on the atv (80%). - leaving the car? non restricted firearms go locked in the trunk or a lockable compartment. no trunk: out of sight, car locked (80%). - unload facing away from the car, partner and road. load the same way, at the start of the walk. !warn bc's firearm violence prevention act (fvpa) came into force 1 october 2026, with hunting exemptions made by regulation (75%). exact exemption wording: verify before you hunt. two armed hunters: you and your brother - both of you hold core and a pal . each carries your own licences and tags (owner confirmed). - before every walk, agree three things: who covers left, who covers right, and the stop signal. - only one of you shoots at a deer unless you agreed a backup plan first (tip). - neither one steps in front of the other's muzzle. ever. - after a shot, both unload, then walk up together. the shooter leads. - first hunt for him? swap roles at midday so each practises spotter and shooter (tip). general case: a non hunting companion - a person who only watches carries no firearm (80%, see licences session). - they walk behind or beside you, never ahead, and freeze on your signal. !rule grandpa's rule (wisdom): the safety is a mechanical device. your muzzle and your finger are the real safety. !mistake - pointing the muzzle at your partner while you unload at the tailgate. - leaving a round in the magazine \"because it is not in the chamber\". attached magazine counts as loaded. - following a running deer with the muzzle past your shooting arc. !field at the car, each of you runs prove out loud while the other watches. then walk 50 m (55 yd) side by side, unloaded, and point out each other's arc with your arms. sources - canadian firearms safety course handbook, rcmp (royal canadian mounted police), government of canada publications (https://publications.gc.ca/collections/collection_2015/grc-rcmp/ps99-2-2-1-2014-eng.pdf), checked 2026-10-01 (search preview) - acts and prove, canadian firearms training (https://www.firearmstraining.ca/actsprove.htm), checked 2026-10-01 (search preview) - rcmp: storing, transporting and displaying firearms (https://rcmp.ca/en/firearms/firearms-safety-training-transport-and-storage/storing-transporting-and-displaying-firearms), checked 2026-10-01 (search preview) - storage, display, transportation and handling of firearms by individuals regulations, sor/98-209 (https://laws-lois.justice.gc.ca/eng/regulations/sor-98-209/page-1.html), checked 2026-10-01 (search preview) - bc firearm violence prevention act page (https://www2.gov.bc.ca/gov/content/justice/criminal-justice/policing-in-bc/fvpa), section 4, checked 2026-10-01 (search preview) - bc news release on fvpa in force 1 october 2026 (https://news.gov.bc.ca/releases/2026pssg0037-000460), checked 2026-10-01 (search preview) - hunter ed: determining your safe zone of fire (https://www.hunter-ed.com/national/studyguide/determining-your-safe-zone-of-fire/201099_93020/), checked 2026-10-01 (search preview, united states course material) - hunter ed: crossing obstacles alone (https://www.hunter-ed.com/national/studyguide/crossing-obstacles-alone/201099_93010/), checked 2026-10-01 (search preview) - note: all pages read through search previews. capped at 85% until the full pages are opened. "},{"id":"water-safety","phase":2,"num":2,"title":"Water safety for hunters","minutes":10,"checked":"2026-10-01","steps":[{"title":"Water safety for hunters","html":"<aside class=\"callout why\"><div class=\"callout-t\">Why it matters<\/div><p>October water in the Interior is cold. A small boat or kayak tips fast. The cold, not swimming skill, is what kills.<\/p><\/aside><aside class=\"callout warn\"><div class=\"callout-t\">Warning<\/div><p>Study aid only. The official regulations are the law.<\/p><\/aside>"},{"title":"Cold water shock and 1 10 1","html":"<ul><li>The \"1 10 1 principle\" is a name, not exact timing. It was made by physiologist Dr. Gordon Giesbrecht <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li><strong>1 minute:<\/strong> cold shock. You gasp and breathe hard. Get your breathing under control <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li><strong>10 minutes:<\/strong> of useful muscle movement before hands and arms stop working <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li><strong>1 hour:<\/strong> before hypothermia makes you unconscious <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Real times vary with water temperature, body and clothing. Some experts say it is too neat <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>The first gasp is the killer. If your head is under water when you gasp, you inhale water <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><\/ul><aside class=\"callout tip\"><div class=\"callout-t\">Tip (opinion)<\/div><p>Use the 10 minutes for one job: get out of the water or onto the hull. Do not swim for shore unless it is very close.<\/p><\/aside>"},{"title":"PFD worn, not stowed","html":"<ul><li>A <button class=\"term\" data-term=\"PFD\">PFD<\/button> (personal flotation device) only works if you are wearing it when you go in.<\/li><li>Canadian law requires an approved PFD or lifejacket of the right size <strong>on board<\/strong> for each person <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Wearing it is not required by law for adults on a private trip <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>. My lean: wear it, zipped, every minute on the water.<\/li><li>About 87% of boaters who drowned were not wearing one, per the Lifesaving Society <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Pick one that fits over your hunting jacket. Try it on with all layers before the trip.<\/li><\/ul>"},{"title":"The boat and the kayak","html":"<ul><li>Any boat fitted with a motor, even a small electric, needs the operator to carry a PCOC (Pleasure Craft Operator Card) <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>10 ft boat: check the capacity plate. Count you, your brother, gear, guns and a deer (<span class=\"verify\">VERIFY<\/span> plate numbers on your own boat).<\/li><li>Load low and in the middle. Heavy items on the floor, centred side to side.<\/li><li>Kayak: one person, guns cased and strapped, dry bag clipped in. Hard to shoot from and easy to tip.<\/li><li>No dog? Retrieve birds with the boat, motor off and gun unloaded, or with a long handled landing net (Tip).<\/li><li>Never lean out over the side to grab a bird. Bring it along the hull to the middle.<\/li><\/ul>"},{"title":"Guns in the boat","html":"<ul><li>BC: you must not transport, carry or store a <strong>loaded<\/strong> firearm in or on a vehicle or boat <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>BC: no shooting from a boat <strong>propelled by a motor<\/strong>. A motor tilted up or disengaged so it is not ready for use does not count as propelling <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Federal, ducks and geese: no hunting from a <strong>moving<\/strong> boat with a motor or sail. Drifting on momentum from the motor still counts as moving <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>BC synopsis, ducks and geese: power boat only if beached, anchored, or tied alongside a fixed blind <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>The FVPA (Firearm Violence Prevention Act) came into force 1 October 2026. Hunting exemptions are set by regulation <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>. Exact wording: <span class=\"verify\">VERIFY<\/span>.<\/li><li>Safe habit: gun unloaded and in a case while moving. Load only once you are stopped and set (Tip). A case is not required by federal law for a non restricted firearm <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><\/ul><aside class=\"callout lean\"><div class=\"callout-t\">My lean (opinion)<\/div><p>Use the boat as a ride to a shore blind or a point. Shoot from land. It removes most of the legal and tipping risk.<\/p><\/aside>"},{"title":"Never stand to shoot","html":"<ul><li>Small boats and canoes tip when weight goes high or to one side.<\/li><li>Recoil pushes you back. Standing turns that into a fall over the side.<\/li><li>Sit square, feet flat, shoot only inside your own arc. See the firearm safety session.<\/li><li>One person moves at a time. Everyone else sits still.<\/li><\/ul>"},{"title":"If you capsize","html":"<ol><li>Expect the gasp. Mouth closed if you can. Float in your PFD and get breathing under control for about 1 minute <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Stay with the boat. It is bigger to see and helps you float <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Climb onto the hull to get as much of your body out of the water as you can <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Can't get out? Use the HELP (Heat Escape Lessening Posture): arms crossed on chest, knees up, ankles crossed <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Two people? Huddle, chests together <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Once out, stay out. Water pulls heat away about 25 times faster than air <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Let the gun go. It is replaceable.<\/li><\/ol><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>Grandpa's rule (wisdom): The PFD in the bow locker is a cushion. The PFD on your chest is a lifejacket.<\/p><\/aside><aside class=\"callout mistake\"><div class=\"callout-t\">Common mistakes<\/div><ul><li>PFD stowed under the seat \"to put on if we tip\". You will not get it on in cold water.<\/li><li>Running the motor to chase a crippled duck with a loaded gun.<\/li><li>Standing up to shoot or to pull in a bird.<\/li><\/ul><\/aside><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>Before launching, both wear PFDs over your hunting layers. In shallow water near shore, practise sitting back to back and swapping who leans for a bird, with the gun unloaded.<\/p><\/aside><div class=\"checklist\" data-list=\"ws-launch\"><label class=\"check\"><input type=\"checkbox\" data-key=\"ws-launch:0\"><span>Both PFDs on and zipped<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"ws-launch:1\"><span>PCOC on board if the motor is fitted<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"ws-launch:2\"><span>Guns unloaded and cased<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"ws-launch:3\"><span>Weight low and centred<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"ws-launch:4\"><span>Trip plan left with someone<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"ws-launch:5\"><span>Dry bag: spare warm layer, lighter, phone<\/span><\/label><\/div>"},{"title":"Sources","html":"<ul><li><a href=\"https://www.lifesavingsociety.com/water-safety/boating-and-lifejackets.aspx\" target=\"_blank\" rel=\"noopener\">Lifesaving Society, boating and lifejackets<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://www.mcgill.ca/oss/article/medical-did-you-know/professor-popsicles-physiological-proof\" target=\"_blank\" rel=\"noopener\">McGill Office for Science and Society, Professor Popsicle (Giesbrecht, 1 10 1)<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://en.wikipedia.org/wiki/Gordon_Giesbrecht\" target=\"_blank\" rel=\"noopener\">Gordon Giesbrecht, Wikipedia<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://www.coldwatersafety.org/1-10-1-myth\" target=\"_blank\" rel=\"noopener\">Cold Water Safety: the 1 10 1 critique<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://en.wikipedia.org/wiki/Heat_escape_lessening_position\" target=\"_blank\" rel=\"noopener\">Heat escape lessening position, Wikipedia<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://www2.gov.bc.ca/gov/content/justice/criminal-justice/policing-in-bc/fvpa\" target=\"_blank\" rel=\"noopener\">BC Firearm Violence Prevention Act page<\/a>, section 4 and 5, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://www.bclaws.gov.bc.ca/civix/document/id/loo62/loo62/190_84\" target=\"_blank\" rel=\"noopener\">BC Hunting Regulation, B.C. Reg. 190/84<\/a>, power boat definition, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://laws-lois.justice.gc.ca/eng/regulations/SOR-2022-105/section-41.html\" target=\"_blank\" rel=\"noopener\">Migratory Birds Regulations, 2022, section 41<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis.pdf\" target=\"_blank\" rel=\"noopener\">BC Hunting and Trapping Regulations Synopsis 2026<\/a>, migratory birds section, checked 2026-10-01 (search preview, page <span class=\"verify\">VERIFY<\/span>)<\/li><li><a href=\"https://en.wikipedia.org/wiki/Pleasure_Craft_Operator_Card\" target=\"_blank\" rel=\"noopener\">Pleasure Craft Operator Card, Wikipedia<\/a>, checked 2026-10-0 breathe hard. get your breathing under control (80%). - 10 minutes: of useful muscle movement before hands and arms stop working (80%). - 1 hour: before hypothermia makes you unconscious (80%). - real times vary with water temperature, body and clothing. some experts say it is too neat (70%). - the first gasp is the killer. if your head is under water when you gasp, you inhale water (75%). !tip use the 10 minutes for one job: get out of the water or onto the hull. do not swim for shore unless it is very close. pfd worn, not stowed - a pfd (personal flotation device) only works if you are wearing it when you go in. - canadian law requires an approved pfd or lifejacket of the right size on board for each person (75%). - wearing it is not required by law for adults on a private trip (75%). my lean: wear it, zipped, every minute on the water. - about 87% of boaters who drowned were not wearing one, per the lifesaving society (75%). - pick one that fits over your hunting jacket. try it on with all layers before the trip. the boat and the kayak - any boat fitted with a motor, even a small electric, needs the operator to carry a pcoc (pleasure craft operator card) (75%). - 10 ft boat: check the capacity plate. count you, your brother, gear, guns and a deer (verify plate numbers on your own boat). - load low and in the middle. heavy items on the floor, centred side to side. - kayak: one person, guns cased and strapped, dry bag clipped in. hard to shoot from and easy to tip. - no dog? retrieve birds with the boat, motor off and gun unloaded, or with a long handled landing net (tip). - never lean out over the side to grab a bird. bring it along the hull to the middle. guns in the boat - bc: you must not transport, carry or store a loaded firearm in or on a vehicle or boat (80%). - bc: no shooting from a boat propelled by a motor . a motor tilted up or disengaged so it is not ready for use does not count as propelling (75%). - federal, ducks and geese: no hunting from a moving boat with a motor or sail. drifting on momentum from the motor still counts as moving (80%). - bc synopsis, ducks and geese: power boat only if beached, anchored, or tied alongside a fixed blind (75%). - the fvpa (firearm violence prevention act) came into force 1 october 2026. hunting exemptions are set by regulation (75%). exact wording: verify. - safe habit: gun unloaded and in a case while moving. load only once you are stopped and set (tip). a case is not required by federal law for a non restricted firearm (70%). !lean use the boat as a ride to a shore blind or a point. shoot from land. it removes most of the legal and tipping risk. never stand to shoot - small boats and canoes tip when weight goes high or to one side. - recoil pushes you back. standing turns that into a fall over the side. - sit square, feet flat, shoot only inside your own arc. see the firearm safety session. - one person moves at a time. everyone else sits still. if you capsize 1. expect the gasp. mouth closed if you can. float in your pfd and get breathing under control for about 1 minute (80%). 2. stay with the boat. it is bigger to see and helps you float (75%). 3. climb onto the hull to get as much of your body out of the water as you can (75%). 4. can't get out? use the help (heat escape lessening posture): arms crossed on chest, knees up, ankles crossed (75%). 5. two people? huddle, chests together (75%). 6. once out, stay out. water pulls heat away about 25 times faster than air (70%). 7. let the gun go. it is replaceable. !rule grandpa's rule (wisdom): the pfd in the bow locker is a cushion. the pfd on your chest is a lifejacket. !mistake - pfd stowed under the seat \"to put on if we tip\". you will not get it on in cold water. - running the motor to chase a crippled duck with a loaded gun. - standing up to shoot or to pull in a bird. !field before launching, both wear pfds over your hunting layers. in shallow water near shore, practise sitting back to back and swapping who leans for a bird, with the gun unloaded. sources - lifesaving society, boating and lifejackets (https://www.lifesavingsociety.com/water-safety/boating-and-lifejackets.aspx), checked 2026-10-01 (search preview) - mcgill office for science and society, professor popsicle (giesbrecht, 1 10 1) (https://www.mcgill.ca/oss/article/medical-did-you-know/professor-popsicles-physiological-proof), checked 2026-10-01 (search preview) - gordon giesbrecht, wikipedia (https://en.wikipedia.org/wiki/gordon_giesbrecht), checked 2026-10-01 (search preview) - cold water safety: the 1 10 1 critique (https://www.coldwatersafety.org/1-10-1-myth), checked 2026-10-01 (search preview) - heat escape lessening position, wikipedia (https://en.wikipedia.org/wiki/heat_escape_lessening_position), checked 2026-10-01 (search preview) - bc firearm violence prevention act page (https://www2.gov.bc.ca/gov/content/justice/criminal-justice/policing-in-bc/fvpa), section 4 and 5, checked 2026-10-01 (search preview) - bc hunting regulation, b.c. reg. 190/84 (https://www.bclaws.gov.bc.ca/civix/document/id/loo62/loo62/190_84), power boat definition, checked 2026-10-01 (search preview) - migratory birds regulations, 2022, section 41 (https://laws-lois.justice.gc.ca/eng/regulations/sor-2022-105/section-41.html), checked 2026-10-01 (search preview) - bc hunting and trapping regulations synopsis 2026 (https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis.pdf), migratory birds section, checked 2026-10-01 (search preview, page verify) - pleasure craft operator card, wikipedia (https://en.wikipedia.org/wiki/pleasure_craft_operator_card), checked 2026-10-01 (search preview, secondary) - paddlebc: the law of lifejackets (https://paddlebc.ca/law-of-lifejackets-in-canada-and-finding-the-right-one-for-you/), checked 2026-10-01 (search preview, secondary) - note: transport canada pages not opened. capped at 85% and lower for secondary sources. "},{"id":"bush-safety","phase":2,"num":3,"title":"Bush safety","minutes":15,"checked":"2026-10-01","steps":[{"title":"Bush safety","html":"<aside class=\"callout why\"><div class=\"callout-t\">Why it matters<\/div><p>Most bad days in the bush start small: a wrong turn, wet socks, dark at 6 pm. A plan and a few tools turn them back into small problems.<\/p><\/aside><aside class=\"callout warn\"><div class=\"callout-t\">Warning<\/div><p>Study aid only. The official regulations are the law.<\/p><\/aside>"},{"title":"STOP when lost","html":"<ul><li>AdventureSmart teaches STOP: Stop, Think, Observe, Plan <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Some AdventureSmart material uses Sit instead of Stop. Same idea <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li><strong>Stop:<\/strong> do not keep walking. Most people make it worse by pushing on.<\/li><li><strong>Think:<\/strong> where did you last know where you were?<\/li><li><strong>Observe:<\/strong> map app, compass, sun, creeks, the sound of a road.<\/li><li><strong>Plan:<\/strong> stay put, or move only if you are sure. Shelter and fire before dark.<\/li><li>Use it when lost, disoriented or hurt <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><\/ul>"},{"title":"The trip plan","html":"<ul><li>AdventureSmart's 3 Ts: Trip planning, Training, Taking the essentials <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Always fill out a trip plan and leave it with someone at home <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>AdventureSmart has a free trip plan app that sends your plan to a contact <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Write: who, vehicle and plate, where you park, route, return time, when to call for help.<\/li><li>Say who to call if you are late: 911, and police will start a search (Tip: confirm with your local police).<\/li><li>Assumption: you hunt from the car, the <button class=\"term\" data-term=\"ATV\">ATV<\/button> and the boat. List all three in the plan.<\/li><\/ul><div class=\"checklist\" data-list=\"bs-tripplan\"><label class=\"check\"><input type=\"checkbox\" data-key=\"bs-tripplan:0\"><span>Trip plan written and sent<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"bs-tripplan:1\"><span>Return time and \"call 911 if not back by\" time set<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"bs-tripplan:2\"><span>Map of the area downloaded for offline use<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"bs-tripplan:3\"><span>Phone and satellite device charged<\/span><\/label><\/div>"},{"title":"Satellite messengers and iPhone","html":"<ul><li>Much of the backcountry near Sun Peaks has no cell signal (Assumption: check with your carrier map).<\/li><li>iPhone 14 or later can send Emergency SOS via satellite in Canada with iOS 16.1 or later <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Messages via satellite and Find My via satellite also work in Canada on iPhone 14 or later <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Apple says it is free for two years from activation of the phone <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>. After that: <span class=\"verify\">VERIFY<\/span>.<\/li><li>It needs open sky. Trees, hills and canyons slow or block it <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>A dedicated satellite messenger (two way texting and SOS) works on any phone. Needs a paid plan.<\/li><\/ul><aside class=\"callout lean\"><div class=\"callout-t\">My lean (opinion)<\/div><p>iPhone 14 or later in both pockets? That covers SOS. Only one does, or an older phone? Buy or rent a satellite messenger so each hunter can call for help alone.<\/p><\/aside>"},{"title":"Hypothermia","html":"<ul><li>Mild: shivering, cold, and the \"umbles\": fumbles, mumbles, stumbles, grumbles <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Moderate: violent shivering, confusion, poor judgment <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Severe: shivering <strong>stops<\/strong>, stiff muscles, glassy stare, slow breathing. This is an emergency <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>First aid: out of wind and wet, dry layers on, cover head and neck, rewarm gently <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Warm sweet drinks only if fully awake and able to swallow (Tip, common first aid advice).<\/li><li>October risk: wet from sweat or rain, then sitting still glassing as the sun drops.<\/li><\/ul>"},{"title":"Weather and wildfire","html":"<ul><li>Interior October can go from sun to sleet in an afternoon. Pack a dry layer and a toque every trip.<\/li><li>Daylight is short. Turn back time = 1 hour before sunset.<\/li><li>Kamloops Fire Centre campfire and open fire rules changed in late September 2026 <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>. Today's status: <span class=\"verify\">VERIFY<\/span> on the BC Wildfire Service app before any fire.<\/li><li>Report a wildfire: 1 800 663 5555 toll free, or *5555 on a cell <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Never park a hot vehicle or <button class=\"term\" data-term=\"ATV\">ATV<\/button> on dry grass. The exhaust can start a fire (Tip).<\/li><\/ul>"},{"title":"Bears and cougars","html":"<ul><li>Black bears live around Kamloops and Sun Peaks <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Grizzlies: the Thompson Nicola region holds about 317 grizzlies <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>. A Sun Peaks visitor site says only black bears at the resort <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>. My lean: carry spray as if both are there.<\/li><li>Bear spray: point it at the ground a few metres in front of the bear, then sweep up to its face <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Do not spray into the wind. It will blow back on you <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Range: about 3 m to 10 m depending on the can. Read your can <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Black bear attack: defensive (cubs or food) is the most common type. Spray. If it makes contact, play dead (75%, Parks Canada).<\/li><li>Predatory attack (stalks you, or at night): spray, stand big, fight back. Do not play dead (75%, Parks Canada).<\/li><li>Cougar: never run, look big, back away slowly, keep eye contact. If attacked, always fight back (75%, WildSafeBC).<\/li><li>A gut pile draws bears. Move the meat away from it fast and watch your back.<\/li><li>Report a dangerous bear or cougar: RAPP (Report All Poachers and Polluters) 1 877 952 7277 <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><\/ul>"},{"title":"First aid kit with a tourniquet","html":"<ul><li>The big killer after a fall, knife slip or gunshot is bleeding from an arm or leg.<\/li><li>Red Cross guidance: firm direct pressure first. If bleeding from a limb is life threatening and pressure fails, use a tourniquet <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Place it about 5 to 10 cm (2 to 4 in) above the wound, between wound and heart. Tighten until bleeding stops. Write the time <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Buy a commercial windlass tourniquet, not a homemade one. The Red Cross training kit uses the SOFTT (Special Operations Forces Tactical Tourniquet) type <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>.<\/li><li>Kit carried by each hunter on the body: tourniquet, gauze, pressure bandage, gloves, emergency blanket, lighter.<\/li><li>Take a first aid course. A kit you do not know how to use is weight.<\/li><\/ul><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>Grandpa's rule (wisdom): Tell someone where you went. Pack like you will sleep out. Leave the bush an hour before dark.<\/p><\/aside><aside class=\"callout mistake\"><div class=\"callout-t\">Common mistakes<\/div><ul><li>No trip plan because \"we are only going up the road\".<\/li><li>Bear spray buried in the pack instead of on the hip belt or chest.<\/li><li>Sweating hard on the climb in, then sitting still in wet clothes to glass.<\/li><\/ul><\/aside><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>Before the first hunt: fill out the AdventureSmart trip plan, test SOS demo mode on your iPhone, and each practise drawing bear spray from the holster in under 2 seconds with the safety clip on.<\/p><\/aside>"},{"title":"Sources","html":"<ul><li><a href=\"https://www.adventuresmart.ca/the-three-ts/\" target=\"_blank\" rel=\"noopener\">AdventureSmart: The Three Ts<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://globalnews.ca/news/9437036/b-c-adventure-smart-safety-plan-stop\" target=\"_blank\" rel=\"noopener\">Global News: BC AdventureSmart safety plan, STOP<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://support.apple.com/en-ca/101573\" target=\"_blank\" rel=\"noopener\">Apple Support: Use Emergency SOS via satellite on your iPhone (Canada)<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://support.apple.com/en-us/120930\" target=\"_blank\" rel=\"noopener\">Apple Support: About Messages via satellite<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://www.redcross.org/take-a-class/resources/learn-first-aid/hypothermia\" target=\"_blank\" rel=\"noopener\">Red Cross: hypothermia<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://www.redcross.ca/training-and-certification/first-aid-tips-and-resources/first-aid-tips/cold-related-emergencies-staying-warm-and-safe-in-canadian-winters\" target=\"_blank\" rel=\"noopener\">Canadian Red Cross: cold related emergencies<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://www.redcross.org/take-a-class/resources/articles/how-to-apply-a-tourniquet\" target=\"_blank\" rel=\"noopener\">Red Cross: how to apply a tourniquet<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://parks.canada.ca/pn-np/mtn/ours-bears/securite-safety/gaz-spray\" target=\"_blank\" rel=\"noopener\">Parks Canada: bear spray, mountain national parks<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://parks.canada.ca/pn-np/nt/nahanni/securite-safety/ours_bears/security-safety\" target=\"_blank\" rel=\"noopener\">Parks Canada: A guide to safety, Nahanni (attack types)<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://www.bcforestsafe.org/wp-content/uploads/2025/04/Safety-Alert-of-the-Month-March-2025-Final.pdf\" target=\"_blank\" rel=\"noopener\">BC Forest Safety Council: bear spray safety alert<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://wildsafebc.com/species/cougar/\" target=\"_blank\" rel=\"noopener\">WildSafeBC: Cougar<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://tnccollaborative.org/in-our-backyard-grizzly-bear/\" target=\"_blank\" rel=\"noopener\">Thompson Nicola Conservation Collaborative: In Our Backyard, Grizzly Bear<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://www.bestsunpeaks.com/bears-in-sun-peaks.html\" target=\"_blank\" rel=\"noopener\">Best Sun Peaks: Bears in Sun Peaks<\/a>, checked 2026-10-01 (search preview, visitor site)<\/li><li><a href=\"https://www2.gov.bc.ca/gov/content/safety/wildfire-status/contact-channels/report-a-wildfire\" target=\"_blank\" rel=\"noopener\">BC Report a wildfire<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://cfjctoday.com/2026/09/29/category-2-and-3-open-fires-permitted-within-the-cariboo-fire-centre/\" target=\"_blank\" rel=\"noopener\">Kamloops Fire Centre open fire update, CFJC Today<\/a>, checked 2026-10-01 (search preview, news)<\/li><li><a href=\"https://www.mission.ca/community-environment/environment-sustainability/bears-wildlife\" target=\"_blank\" rel=\"noopener\">City of Mission: Bears and wildlife (RAPP number)<\/a>, checked 2026-10-01 (search preview, secondary)<\/li><li>Note: all pages read through search previews. Capped at 85%.<\/li><\/ul>"}],"quiz":[{"q":"You realize you do not know where the truck is. First step?","options":["Walk fast downhill","STOP: Stop, Think, Observe, Plan","Fire three shots"],"answer":1,"why":"AdventureSmart teaches STOP. Pushing on is how most people get more lost."},{"q":"Which iPhones can use Emergency SOS via satellite in Canada?","options":["Any iPhone","iPhone 14 or later, with iOS 16.1 or later","Only Pro models"],"answer":1,"why":"Apple lists iPhone 14 or later, all models, with iOS 16.1 or later in Canada."},{"q":"Your brother stops shivering but is confused and stiff. What does that mean?","options":["He has warmed up","Severe hypothermia, an emergency","He is just tired"],"answer":1,"why":"Shivering that stops with confusion and stiffness is a sign of severe hypothermia. Call for help and rewarm gently."},{"q":"A black bear stalks you quietly at dusk and closes in. What do you do?","options":["Play dead","Spray, stand big, fight back if it attacks","Run to the truck"],"answer":1,"why":"Parks Canada: a predatory attack means spray and fight back. Playing dead is only for a defensive attack once contact is made."},{"q":"When do you use a tourniquet?","options":["Any cut","Life threatening bleeding from an arm or leg when direct pressure fails","Only on the head"],"answer":1,"why":"Direct pressure first. A tourniquet goes on a limb when bleeding is life threatening and pressure is not working."}],"checklists":["bs-tripplan"],"text":" !why most bad days in the bush start small: a wrong turn, wet socks, dark at 6 pm. a plan and a few tools turn them back into small problems. ing stops , stiff muscles, glassy stare, slow breathing. this is an emergency (75%). - first aid: out of wind and wet, dry layers on, cover head and neck, rewarm gently (75%). - warm sweet drinks only if fully awake and able to swallow (tip, common first aid advice). - october risk: wet from sweat or rain, then sitting still glassing as the sun drops. weather and wildfire - interior october can go from sun to sleet in an afternoon. pack a dry layer and a toque every trip. - daylight is short. turn back time = 1 hour before sunset. - kamloops fire centre campfire and open fire rules changed in late september 2026 (75%). today's status: verify on the bc wildfire service app before any fire. - report a wildfire: 1 800 663 5555 toll free, or 5555 on a cell (80%). - never park a hot vehicle or atv on dry grass. the exhaust can start a fire (tip). bears and cougars - black bears live around kamloops and sun peaks (75%). - grizzlies: the thompson nicola region holds about 317 grizzlies (65%). a sun peaks visitor site says only black bears at the resort (60%). my lean: carry spray as if both are there. - bear spray: point it at the ground a few metres in front of the bear, then sweep up to its face (70%). - do not spray into the wind. it will blow back on you (70%). - range: about 3 m to 10 m depending on the can. read your can (70%). - black bear attack: defensive (cubs or food) is the most common type. spray. if it makes contact, play dead (75%, parks canada). - predatory attack (stalks you, or at night): spray, stand big, fight back. do not play dead (75%, parks canada). - cougar: never run, look big, back away slowly, keep eye contact. if attacked, always fight back (75%, wildsafebc). - a gut pile draws bears. move the meat away from it fast and watch your back. - report a dangerous bear or cougar: rapp (report all poachers and polluters) 1 877 952 7277 (75%). first aid kit with a tourniquet - the big killer after a fall, knife slip or gunshot is bleeding from an arm or leg. - red cross guidance: firm direct pressure first. if bleeding from a limb is life threatening and pressure fails, use a tourniquet (70%). - place it about 5 to 10 cm (2 to 4 in) above the wound, between wound and heart. tighten until bleeding stops. write the time (70%). - buy a commercial windlass tourniquet, not a homemade one. the red cross training kit uses the softt (special operations forces tactical tourniquet) type (65%). - kit carried by each hunter on the body: tourniquet, gauze, pressure bandage, gloves, emergency blanket, lighter. - take a first aid course. a kit you do not know how to use is weight. !rule grandpa's rule (wisdom): tell someone where you went. pack like you will sleep out. leave the bush an hour before dark. !mistake - no trip plan because \"we are only going up the road\". - bear spray buried in the pack instead of on the hip belt or chest. - sweating hard on the climb in, then sitting still in wet clothes to glass. !field before the first hunt: fill out the adventuresmart trip plan, test sos demo mode on your iphone, and each practise drawing bear spray from the holster in under 2 seconds with the safety clip on. sources - adventuresmart: the three ts (https://www.adventuresmart.ca/the-three-ts/), checked 2026-10-01 (search preview) - global news: bc adventuresmart safety plan, stop (https://globalnews.ca/news/9437036/b-c-adventure-smart-safety-plan-stop), checked 2026-10-01 (search preview) - apple support: use emergency sos via satellite on your iphone (canada) (https://support.apple.com/en-ca/101573), checked 2026-10-01 (search preview) - apple support: about messages via satellite (https://support.apple.com/en-us/120930), checked 2026-10-01 (search preview) - red cross: hypothermia (https://www.redcross.org/take-a-class/resources/learn-first-aid/hypothermia), checked 2026-10-01 (search preview) - canadian red cross: cold related emergencies (https://www.redcross.ca/training-and-certification/first-aid-tips-and-resources/first-aid-tips/cold-related-emergencies-staying-warm-and-safe-in-canadian-winters), checked 2026-10-01 (search preview) - red cross: how to apply a tourniquet (https://www.redcross.org/take-a-class/resources/articles/how-to-apply-a-tourniquet), checked 2026-10-01 (search preview) - parks canada: bear spray, mountain national parks (https://parks.canada.ca/pn-np/mtn/ours-bears/securite-safety/gaz-spray), checked 2026-10-01 (search preview) - parks canada: a guide to safety, nahanni (attack types) (https://parks.canada.ca/pn-np/nt/nahanni/securite-safety/ours_bears/security-safety), checked 2026-10-01 (search preview) - bc forest safety council: bear spray safety alert (https://www.bcforestsafe.org/wp-content/uploads/2025/04/safety-alert-of-the-month-march-2025-final.pdf), checked 2026-10-01 (search preview) - wildsafebc: cougar (https://wildsafebc.com/species/cougar/), checked 2026-10-01 (search preview) - thompson nicola conservation collaborative: in our backyard, grizzly bear (https://tnccollaborative.org/in-our-backyard-grizzly-bear/), checked 2026-10-01 (search preview) - best sun peaks: bears in sun peaks (https://www.bestsunpeaks.com/bears-in-sun-peaks.html), checked 2026-10-01 (search preview, visitor site) - bc report a wildfire (https://www2.gov.bc.ca/gov/content/safety/wildfire-status/contact-channels/report-a-wildfire), checked 2026-10-01 (search preview) - kamloops fire centre open fire update, cfjc today (https://cfjctoday.com/2026/09/29/category-2-and-3-open-fires-permitted-within-the-cariboo-fire-centre/), checked 2026-10-01 (search preview, news) - city of mission: bears and wildlife (rapp number) (https://www.mission.ca/community-environment/environment-sustainability/bears-wildlife), checked 2026-10-01 (search preview, secondary) - note: all pages read through search previews. capped at 85%. "},{"id":"bc-rules","phase":2,"num":5,"title":"BC rules you must know","minutes":20,"checked":"2026-10-01","steps":[{"title":"BC rules you must know","html":"<aside class=\"callout why\"><div class=\"callout-t\">Why it matters<\/div><p>Most fines are for simple things: a round in the chamber in the truck, a shot from the road, a missing tag.<\/p><\/aside><aside class=\"callout warn\"><div class=\"callout-t\">Warning<\/div><p>Study aid only. The official regulations are the law.<\/p><\/aside><ul><li>Every rule below has a certainty %. Under 80% means: read the official text before you rely on it.<\/li><li>Most rules here were read in search previews of official pages. Capped at 85%.<\/li><li>Seasons, bag limits and fees live in the Rules tab, not here.<\/li><\/ul>"},{"title":"Licences: what to carry","html":"<div class=\"tbl\"><table><thead><tr><th>Hunting<\/th><th>Carry<\/th><\/tr><\/thead><tbody><tr><td>Deer<\/td><td>Photo ID, your <button class=\"term\" data-term=\"FWID\">FWID<\/button> (Fish and Wildlife ID) number, every deer species licence for the year <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/td><\/tr><tr><td>Ducks and geese<\/td><td>Photo ID, FWID number, federal <button class=\"term\" data-term=\"MGBHP\">MGBHP<\/button> (Migratory Game Bird Hunting Permit), paper or phone <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/td><\/tr><tr><td>Quail and grouse<\/td><td>Photo ID, FWID number. No species licence for residents <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span><\/td><\/tr><\/tbody><\/table><\/div><ul><li>The BC hunting licence is electronic only. Be able to give your FWID number <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Carry your <button class=\"term\" data-term=\"PAL\">PAL<\/button> (Possession and Acquisition Licence) any time you have a firearm. Tip: habit, not a hunting rule.<\/li><li>Full detail: Phase 1 Session 2, Licences and tags.<\/li><\/ul>"},{"title":"Legal hunting hours","html":"<div class=\"tbl\"><table><thead><tr><th>Game<\/th><th>Earliest<\/th><th>Latest<\/th><\/tr><\/thead><tbody><tr><td>Deer, quail, grouse (all game except migratory birds)<\/td><td>1 hour before sunrise<\/td><td>1 hour after sunset<\/td><\/tr><tr><td>Ducks and geese<\/td><td>30 minutes before sunrise<\/td><td>30 minutes after sunset<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Big game and upland hours: 85%. Ducks and geese hours: 85%.<\/li><li>Ducks get <strong>less<\/strong> light than deer. Check both times every morning.<\/li><li>Sunrise and sunset change by town. Use a local table, not a city 200 km away. Tip.<\/li><\/ul>"},{"title":"\"Loaded\" in BC","html":"<ul><li>BC meaning: live ammunition in the <strong>breech (chamber) or the magazine<\/strong>. A clip with live rounds attached to the firearm counts as the magazine <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>So a full magazine in the rifle with an empty chamber <strong>is loaded<\/strong> in BC <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Federal \"unloaded\": no cartridge in the chamber and none in a magazine attached to or inserted in the firearm <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Loose rounds in your pocket or a detached magazine: not loaded (80%, my reading of both definitions).<\/li><\/ul><aside class=\"callout law\"><div class=\"callout-t\">The rule<\/div><p>No loaded firearm in or on a motor vehicle, railway car, sleigh, aircraft, bicycle or other conveyance. No shooting from one either <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/p><\/aside>"},{"title":"Truck, ATV and boat","html":"<ul><li><strong>Truck:<\/strong> magazine out, chamber empty before the firearm goes in the truck <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>ATV (all terrain vehicle):<\/strong> same rule. It is a motor vehicle or conveyance. Unload before you get on <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Engine off is not enough. Get off the <button class=\"term\" data-term=\"ATV\">ATV<\/button>, step away, then load <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>. Federal rules also say load only where shooting is lawful (75%, secondary).<\/li><li><strong>No shooting wildlife from a motor vehicle or a boat propelled by a motor<\/strong> <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>The 10 ft boat with motor: no deer shot from it, ever <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Kayak: no motor, so the BC motorboat rule does not apply. Ducks: see the duck screen. Deer from a kayak: <span class=\"verify\">VERIFY<\/span>. Tip: do not.<\/li><\/ul>"},{"title":"Roads","html":"<ul><li>No shooting <strong>across<\/strong> a road <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>No hunting or shooting on the road allowance of a public road <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Road allowance: 15 m (16 yd) each side of the middle of a road with under 3 lanes. Or 15 m from the pavement edge on 3 lanes or more. Or to private or cultivated land, if closer <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Which roads count (for example a <button class=\"term\" data-term=\"FSR\">FSR<\/button>, Forest Service Road): <span class=\"verify\">VERIFY<\/span> in the synopsis.<\/li><li>Safe habit: walk at least 15 m off the road, then load. Tip.<\/li><\/ul>"},{"title":"The 100 m rule","html":"<aside class=\"callout law\"><div class=\"callout-t\">The rule<\/div><p>No hunting or shooting within 100 m (109 yd) of a church, school building, school yard, playground, regional district park, or a dwelling house, farm or ranch building occupied by people or domestic animals <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/p><\/aside><ul><li>\"Occupied\" includes animals in a barn <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>100 m is close. A rifle bullet travels kilometres. Use your rangefinder on buildings. Tip.<\/li><li>Owners can slaughter their own livestock near their buildings. That exemption is not for hunting <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Your brother's house on the 20 acre property counts.<\/strong> No shot within 100 m of it, even with his permission (80%, my reading: the only owner exemption is livestock slaughter).<\/li><li>Barns or sheds with animals inside count too <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Field job: rangefind the house from each likely stand. Mark a 100 m ring on your phone map. Tip.<\/li><\/ul>"},{"title":"No Shooting Areas and closed areas","html":"<ul><li>A No Shooting Area: firing a firearm is banned, even outside hunting <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>They are on the regional maps in the <button class=\"term\" data-term=\"Synopsis\">Synopsis<\/button> <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Region 3 synopsis has Kamloops area maps with No Shooting and No Hunting Areas <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>. Exact boundaries near Heffley Creek: <span class=\"verify\">VERIFY<\/span>.<\/li><li>Some towns and regional districts add their own discharge bylaws. Sun Peaks and Heffley Creek: <span class=\"verify\">VERIFY<\/span>.<\/li><li>Check the map <strong>before<\/strong> you go, not on the slope.<\/li><\/ul>"},{"title":"Parks and protected land","html":"<div class=\"tbl\"><table><thead><tr><th>Place<\/th><th>Hunting?<\/th><\/tr><\/thead><tbody><tr><td>Ecological reserve<\/td><td><strong>No.<\/strong> No hunting, no firing a firearm or bow <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/td><\/tr><tr><td>BC park<\/td><td>Only in parks listed for hunting, only in open season <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span><\/td><\/tr><tr><td>BC park road<\/td><td>No shooting within 400 m of the centre line of a park road <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span><\/td><\/tr><tr><td>Wildlife Management Area<\/td><td>Rules differ by area. <span class=\"verify\">VERIFY<\/span> each one<\/td><\/tr><tr><td>First Nations reserve<\/td><td>Private land. Permission from the band office to hunt on <strong>or cross<\/strong> it <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/td><\/tr><\/tbody><\/table><\/div><ul><li>Park closed to hunting: you may not even carry a firearm there, unless a park officer allows it <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Check each park page on bcparks.ca before you go <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><\/ul>"},{"title":"Private land and the Trespass Act","html":"<ul><li>Hunting private land needs the owner's consent <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>. Get it <strong>in writing<\/strong>. Tip.<\/li><li>Under the Trespass Act, \"enclosed land\" includes land with a lawful fence, a natural boundary, or signs <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Signs must be at each normal access point and readable in daylight <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>On enclosed land you are presumed to have <strong>no<\/strong> permission. You must prove you do <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Cultivated land (crops, hay, orchard): treat as no hunting without permission <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>. <span class=\"verify\">VERIFY<\/span> wording.<\/li><li>A \"No Hunting\" sign may not be a trespass sign, but respect it anyway (65%, secondary).<\/li><\/ul>"},{"title":"Motor vehicle closures","html":"<ul><li>Motor Vehicle Closed Areas (old name: Access Management Areas) ban some or all vehicles, or only ATVs or snowmobiles <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Motor Vehicle Hunting Closed Areas ban using a vehicle to hunt, carry hunters, gear or game <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Region 3 maps: <a href=\"https://www.gov.bc.ca/thompsonaccess\" target=\"_blank\" rel=\"noopener\">gov.bc.ca/thompsonaccess<\/a> <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Areas near Heffley Creek and Sun Peaks: <span class=\"verify\">VERIFY<\/span> on the map.<\/li><li>Fire season closures and gates also apply. Check BC Wildfire Service. Tip.<\/li><\/ul>"},{"title":"Banned methods","html":"<div class=\"tbl\"><table><thead><tr><th>Method<\/th><th>Rule<\/th><\/tr><\/thead><tbody><tr><td>Rimfire on big game<\/td><td><strong>Not allowed<\/strong> <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span><\/td><\/tr><tr><td>.22 rimfire on grouse or quail<\/td><td><span class=\"verify\">VERIFY<\/span> in synopsis firearm table<\/td><\/tr><tr><td>Lights or spotlights<\/td><td><strong>Never<\/strong> hunt with a light <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span><\/td><\/tr><tr><td>Night hunting<\/td><td>Banned outside legal hours <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/td><\/tr><tr><td>Drones<\/td><td>No drone on a hunting trip. No drone info from under 6 hours before <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/td><\/tr><tr><td>Electronic calls<\/td><td>Banned, except wolf, coyote, cougar, lynx, bobcat and some listed birds <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/td><\/tr><tr><td>Dogs for deer<\/td><td>Leash only <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>. Grouse and quail: unleashed dog OK <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span><\/td><\/tr><tr><td>Feeding or baiting deer<\/td><td>Banned within 200 m of a home, school yard or playground in Regions 3 and 8 <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>. Bait for deer elsewhere: <span class=\"verify\">VERIFY<\/span><\/td><\/tr><tr><td>Electronic firing mechanism<\/td><td>Not allowed <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span><\/td><\/tr><\/tbody><\/table><\/div>"},{"title":"Ducks and geese (federal)","html":"<ul><li>Non toxic shot only for ducks, geese, coots and snipe. No lead <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Shotgun no larger than 10 gauge <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Holds <strong>3 shells max<\/strong>, chamber plus magazine. Plug must need the gun taken apart to remove <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>No hunting from a <strong>moving<\/strong> boat with a motor or sail <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>OK when the boat is beached, anchored or tied off <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>A motorboat may chase a wounded bird to retrieve it <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Possession limit: 3 times the daily limit, at all times, <strong>including at home<\/strong> <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Daily limits for 2026 to 2027: <span class=\"verify\">VERIFY<\/span> in the Rules tab.<\/li><\/ul>"},{"title":"Ducks: the bird in your cooler","html":"<ul><li>Unpreserved birds keep <strong>one fully feathered wing or the fully feathered head<\/strong> attached <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Store birds so each can be counted and identified. No frozen block of ducks <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>\"Preserved\" means fully processed for storage, for example frozen and plucked. Exact definition: <span class=\"verify\">VERIFY<\/span>.<\/li><li>Tip: leave a wing on until the duck is in your home freezer.<\/li><\/ul>"},{"title":"Deer: tag and evidence","html":"<ul><li>Notch the species licence right after the kill, before you move the animal <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>. See Phase 1 Session 13.<\/li><li>Evidence of sex stays <strong>naturally attached<\/strong> until the meat is home, at a cutter, in cold storage, or inspected (75%, secondary).<\/li><li>Buck: the part of the head with antlers, <strong>or<\/strong> testicles or penis plus the tail or a patch of hide (75%, secondary).<\/li><li>Doe: the part of the head where antlers would be, <strong>or<\/strong> udder or teats plus the tail or a patch of hide (75%, secondary).<\/li><li>Antler restricted season (like 4 point): keep antlers attached to part of the skull <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Exact hide patch size: <span class=\"verify\">VERIFY<\/span>.<\/li><\/ul>"},{"title":"Meat wastage","html":"<ul><li>You must remove the <strong>edible portions<\/strong> <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Deer edible portions: neck, ribs, all four quarters and the loins <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Game birds (ducks, quail, grouse): both breasts <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Leave guts and bones at the kill site, or take them to a landfill <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>You may give the animal to someone who then takes the edible portions out <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><\/ul>"},{"title":"CWD (Chronic Wasting Disease)","html":"<ul><li><button class=\"term\" data-term=\"CWD\">CWD<\/button> is confirmed in the Kootenay Region <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>CWD Management Zone: <button class=\"term\" data-term=\"MU\">MU<\/button> (Management Unit) 4-1 to 4-8 and 4-20 to 4-25 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>In that zone: mandatory CWD test for every deer, elk and moose, within one week <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>No brain or spinal column (tail OK) taken out of that zone <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Region 3 and Region 8 are <strong>not<\/strong> in the zone (85%, from the MU list).<\/li><li>Bringing cervid (deer family) parts in from outside BC is restricted (65%, secondary). <span class=\"verify\">VERIFY<\/span> before any hunt outside BC.<\/li><li>Deer urine lures from outside BC: may be banned <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>. <span class=\"verify\">VERIFY<\/span>. Tip: use none.<\/li><\/ul>"},{"title":"Transporting firearms (federal)","html":"<ul><li>Unloaded while in a vehicle <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Non restricted rifle or shotgun: no case or trigger lock needed while you travel <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Leaving it in the vehicle: lock it in the trunk or a locked compartment. No trunk: out of sight in the <strong>locked<\/strong> vehicle <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>No special permit to carry a non restricted firearm. Your PAL (Possession and Acquisition Licence) is enough <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Ammunition can travel with it, just not in it <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><\/ul>"},{"title":"Giving away meat, and helpers","html":"<ul><li>Anyone carrying your game without you needs a <strong>Record of Receipt<\/strong> <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Record of Receipt shows: date and place, your name and address, who receives it, your FWID (Fish and Wildlife ID), the species licence number, species and sex <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Your brother hunts too. He needs his <strong>own<\/strong> hunting licence, species licences and federal bird permit <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Each hunter notches only his own licence, for the animal he killed. Shooting a deer for the other person's tag: <span class=\"verify\">VERIFY<\/span>. Treat as not allowed.<\/li><li>Ducks: each hunter has his own daily limit. Do not pool birds. Tip.<\/li><li>Carrying his deer while he is not with you: you need his Record of Receipt <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Friends you give meat to at home: write a short Record of Receipt anyway. Tip.<\/li><li>Selling game meat: <span class=\"verify\">VERIFY<\/span>. Treat as not allowed.<\/li><\/ul>"},{"title":"Wounded animal on closed or private land","html":"<ul><li>The Trespass Act has no exception for tracking wounded game (70%, secondary).<\/li><li>Posted or fenced land: ask the owner first. Written permission is best <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Owner says no, or can't be found: call a conservation officer. Tip.<\/li><li>Animal ran into a park or No Shooting Area: do not fire there. Call a conservation officer. Tip.<\/li><li>You must still make a real effort to recover wounded game <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>. <span class=\"verify\">VERIFY<\/span> the exact rule.<\/li><\/ul>"},{"title":"Reporting poaching","html":"<ul><li>RAPP (Report All Poachers and Polluters): 1 877 952 7277 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Cell: #7277 <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Open 24 hours, 7 days. You can stay anonymous <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Note: plate, vehicle, place, time, what you saw. Never confront. Tip.<\/li><\/ul><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>If you have to ask \"is this legal?\", the answer today is no. Find out at home, then come back.<\/p><\/aside><aside class=\"callout mistake\"><div class=\"callout-t\">Common mistakes<\/div><ul><li>A full magazine in the rifle in the truck. That is loaded in BC.<\/li><li>A quick shot from the road or the ATV seat.<\/li><li>Freezing ducks with no wing or head attached.<\/li><\/ul><\/aside><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>Before each trip: open the synopsis map for your MU. Mark No Shooting Areas, closures and buildings on your phone map.<\/p><\/aside><div class=\"checklist\" data-list=\"s5-rules\"><label class=\"check\"><input type=\"checkbox\" data-key=\"s5-rules:0\"><span>Magazine out and chamber empty before the truck or ATV<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s5-rules:1\"><span>Walk 15 m off the road before loading<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s5-rules:2\"><span>Rangefinder check on any building inside 150 m<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s5-rules:3\"><span>100 m ring around my brother's house marked on my map<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s5-rules:4\"><span>No Shooting Areas checked on the synopsis map<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s5-rules:5\"><span>Motor vehicle closures checked for my MU<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s5-rules:6\"><span>Written permission for any private land<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s5-rules:7\"><span>RAPP number saved in my phone<\/span><\/label><\/div>"},{"title":"Sources","html":"<ul><li><a href=\"https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis.pdf\" target=\"_blank\" rel=\"noopener\">BC Hunting and Trapping Regulations Synopsis 2026 to 2028, full PDF<\/a> (search preview), checked 2026-10-01: loaded, vehicles, roads, 100 m, hours, banned methods, parks, edible portions, Record of Receipt.<\/li><li><a href=\"https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis-region-3-thompson.pdf\" target=\"_blank\" rel=\"noopener\">Region 3 Thompson synopsis<\/a> (search preview), checked 2026-10-01: Kamloops maps, closures, baiting.<\/li><li><a href=\"https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis-region-8-okanagan.pdf\" target=\"_blank\" rel=\"noopener\">Region 8 Okanagan synopsis<\/a> (search preview), checked 2026-10-01: baiting.<\/li><li><a href=\"https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/190_84_01\" target=\"_blank\" rel=\"noopener\">Hunting Regulation, B.C. Reg. 190/84<\/a> (search preview), checked 2026-10-01: hours.<\/li><li><a href=\"https://www.bclaws.gov.bc.ca/civix/document/id/consol21/consol21/00_96462_01\" target=\"_blank\" rel=\"noopener\">Trespass Act<\/a> (search preview), checked 2026-10-01.<\/li><li><a href=\"https://www2.gov.bc.ca/gov/content/environment/plants-animals-ecosystems/wildlife/wildlife-conservation/wildlife-health/chronic-wasting-disease/cwd-bc\" target=\"_blank\" rel=\"noopener\">BC CWD page<\/a> (search preview), checked 2026-10-01.<\/li><li><a href=\"https://www2.gov.bc.ca/gov/content/environment/natural-resource-stewardship/natural-resource-law-enforcement/conservation-officer-service/cos-rapp\" target=\"_blank\" rel=\"noopener\">BC RAPP page<\/a> (search preview), checked 2026-10-01.<\/li><li><a href=\"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/frequently-asked-questions\" target=\"_blank\" rel=\"noopener\">BC hunting FAQ<\/a> (search preview), checked 2026-10-01.<\/li><li><a href=\"https://laws-lois.justice.gc.ca/eng/regulations/SOR-2022-105/FullText.html\" target=\"_blank\" rel=\"noopener\">Migratory Birds Regulations, 2022<\/a> (search preview), checked 2026-10-01.<\/li><li><a href=\"https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/regulations-provincial-territorial-summaries/british-columbia.html\" target=\"_blank\" rel=\"noopener\">ECCC (Environment and Climate Change Canada) BC migratory bird summary<\/a> (search preview), checked 2026-10-01.<\/li><li><a href=\"https://rcmp.ca/en/firearms/firearms-safety-training-transport-and-storage/storing-transporting-and-displaying-firearms\" target=\"_blank\" rel=\"noopener\">RCMP (Royal Canadian Mounted Police): storing, transporting and displaying firearms<\/a> (search preview), checked 2026-10-01.<\/li><li><a href=\"https://laws-lois.justice.gc.ca/eng/regulations/SOR-98-209/\" target=\"_blank\" rel=\"noopener\">Storage, Display, Transportation and Handling of Firearms by Individuals Regulations, SOR/98-209<\/a> (search preview), checked 2026-10-01.<\/li><li>Secondary, 60 to 79% max: <a href=\"https://bcfirearmsacademy.ca/possession-transportation-big-game/\" target=\"_blank\" rel=\"noopener\">BC Firearms Academy, evidence of sex<\/a>; <a href=\"https://www.huntingbc.ca/forum/archive/index.php/t-92535.html\" target=\"_blank\" rel=\"noopener\">HuntingBC forum, wounded game on private land<\/a>; <a href=\"https://cwd-info.org/regulations/british-columbia-cwd-regulations/\" target=\"_blank\" rel=\"noopener\">cwd info.org BC page<\/a>; <a href=\"https://www.agcanada.com/daily/b-c-to-block-hunting-attractants-from-out-of-province\" target=\"_blank\" rel=\"noopener\">AgCanada, attractant ban<\/a>. Checked 2026-10-01.<\/li><\/ul>"}],"quiz":[{"q":"Rifle in the truck: chamber empty, full magazine clipped in. Is it loaded in BC?","options":["No, the chamber is empty","Yes. Live rounds in an attached magazine count as loaded","Only if the safety is off"],"answer":1,"why":"BC defines loaded as live ammunition in the breech or the magazine. An attached clip counts as the magazine."},{"q":"A buck stands 60 m from a farmhouse with people home. Can you shoot?","options":["Yes, it is past 50 m","No. Inside 100 m of an occupied dwelling or farm building","Yes with a safe backstop"],"answer":1,"why":"No h
