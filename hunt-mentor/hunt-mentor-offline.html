<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f3a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hunt Mentor">
<title>Hunt Mentor</title>


<style>/* Hunt Mentor: rugged field guide. Earth tones, one blaze orange accent. */
:root {
  --bg: #f4efe4; --card: #fffaf0; --ink: #23261f; --muted: #5d6152; --line: #d8cfbc;
  --moss: #2f3a2b; --bark: #6b4f35; --sage: #8a9a6b; --accent: #e8590c; --accent-ink: #fff;
  --ok: #2e7d32; --bad: #b3261e; --warn-bg: #fff1e0; --verify: #b3261e;
  --r: 14px; --fs: 18px;
}
:root[data-theme="dark"] {
  color-scheme: dark; --bg: #161813; --card: #22251e; --ink: #ece6d6; --muted: #aaa792; --line: #3a3d33;
  --moss: #0f120d; --bark: #c9a27a; --sage: #9fb07e; --accent: #ff7a2e; --warn-bg: #3a2614;
}
:root[data-theme="sun"] {
  --bg: #fff; --card: #fff; --ink: #000; --muted: #222; --line: #000;
  --moss: #000; --bark: #000; --sage: #000; --accent: #d14600; --warn-bg: #fff; --fs: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="sun"]) {
    color-scheme: dark; --bg: #161813; --card: #22251e; --ink: #ece6d6; --muted: #aaa792; --line: #3a3d33;
    --moss: #0f120d; --bark: #c9a27a; --sage: #9fb07e; --accent: #ff7a2e; --warn-bg: #3a2614;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: var(--fs)/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(76px + env(safe-area-inset-bottom)); -webkit-text-size-adjust: 100%;
}
a { color: var(--accent); }
.top {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
  background: var(--moss); color: #f4efe4; padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
}
.top h1 { flex: 1; margin: 0; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { background: none; border: 0; color: inherit; font-size: 24px; min-width: 44px; min-height: 44px; }
.banner { background: var(--warn-bg); color: var(--ink); font-size: 13px; padding: 6px 16px; border-bottom: 1px solid var(--line); }
main { max-width: 720px; margin: 0 auto; padding: 16px; }
.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5;
}
.tabs a { flex: 1; text-align: center; color: var(--muted); text-decoration: none; font-size: 12px; padding: 8px 0; min-height: 56px; }
.tabs a span { display: block; font-size: 22px; line-height: 1.2; }
.tabs a.on { color: var(--accent); font-weight: 700; }
.tabs .tab-field span { color: var(--accent); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin: 0 0 14px; }
.card h2 { margin: 0 0 8px; font-size: 20px; }
.muted { color: var(--muted); font-size: 15px; }
.big { font-size: 40px; font-weight: 800; line-height: 1; }
.row { display: flex; gap: 10px; align-items: center; }
.grow { flex: 1; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 52px; padding: 0 18px;
  border-radius: 12px; border: 2px solid var(--moss); background: var(--card); color: var(--ink);
  font-size: 17px; font-weight: 700; text-decoration: none; cursor: pointer;
}
:root[data-theme="dark"] .btn { border-color: var(--line); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.block { display: flex; width: 100%; }
.btn-row { display: flex; gap: 10px; margin-top: 12px; }
.btn-row .btn { flex: 1; }
.bar { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--sage); }
.list a.item {
  display: flex; gap: 12px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--line);
  color: var(--ink); text-decoration: none; min-height: 56px;
}
.num { min-width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--line); font-weight: 800; font-size: 15px; }
.done .num { background: var(--ok); color: #fff; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--line); color: var(--ink); white-space: nowrap; }
.pill.soon { background: var(--accent); color: #fff; }

/* session reader */
.step h2 { font-size: 24px; margin: 4px 0 12px; }
.step ul, .step ol { padding-left: 22px; margin: 6px 0 12px; }
.step li { margin: 4px 0; }
.step p { margin: 8px 0; }
.dots { display: flex; gap: 4px; margin-bottom: 12px; }
.dots i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.dots i.on { background: var(--accent); }
.callout { border-left: 5px solid var(--sage); background: var(--card); border-radius: 0 var(--r) var(--r) 0; padding: 10px 14px; margin: 12px 0; }
.callout-t { font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
.callout.rule { border-color: var(--bark); }
.callout.warn, .callout.law { border-color: var(--accent); background: var(--warn-bg); }
.callout.lean, .callout.tip { border-color: var(--sage); }
.cert { font-size: 12px; font-weight: 800; padding: 1px 6px; border-radius: 6px; margin-left: 2px; white-space: nowrap; }
.c-hi { background: #2e7d32; color: #fff; } .c-mid { background: #7a8f2e; color: #fff; }
.c-lo { background: #c68a00; color: #fff; } .c-tip { background: #888; color: #fff; }
.verify { background: var(--verify); color: #fff; font-weight: 800; font-size: 13px; padding: 1px 6px; border-radius: 6px; }
.term { background: none; border: 0; border-bottom: 2px dotted var(--accent); color: inherit; font: inherit; padding: 0; cursor: pointer; }
.tbl { overflow-x: auto; margin: 10px 0; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { background: var(--line); }
figure.diagram { margin: 12px 0; background: #fffaf0; border-radius: var(--r); padding: 8px; border: 1px solid var(--line); }
figure.diagram svg { width: 100%; height: auto; display: block; }
code { background: var(--line); padding: 0 4px; border-radius: 4px; }

/* quiz */
.q { margin-bottom: 18px; }
.q .opt { display: block; width: 100%; text-align: left; margin: 6px 0; min-height: 52px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-size: 17px; }
.q .opt.right { border-color: var(--ok); background: #e3f2e4; color: #123; }
.q .opt.wrong { border-color: var(--bad); background: #fbe4e2; color: #311; }
.q .why { margin-top: 8px; font-size: 16px; }

/* checklists */
.check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 4px; border-bottom: 1px solid var(--line); min-height: 52px; }
.check input { width: 28px; height: 28px; flex: none; accent-color: var(--accent); }
.check input:checked + span { text-decoration: line-through; color: var(--muted); }

/* field mode */
body.field { --fs: 22px; }
body.field main { padding: 12px; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ftile { display: flex; flex-direction: column; justify-content: center; min-height: 110px; padding: 14px; border-radius: 16px; background: var(--moss); color: #fff; text-decoration: none; font-weight: 800; font-size: 20px; border: 3px solid transparent; }
.ftile.hot { background: var(--accent); }
.ftile small { font-weight: 500; font-size: 14px; opacity: .85; }
.flow .node { border: 3px solid var(--ink); border-radius: 14px; padding: 14px; margin: 10px 0; font-weight: 700; font-size: 21px; }
.flow .yesno { display: flex; gap: 10px; }
.flow .yesno .btn { flex: 1; min-height: 64px; font-size: 22px; }
.stop { background: var(--bad); color: #fff; border-radius: 14px; padding: 18px; font-size: 24px; font-weight: 800; }
.go { background: var(--ok); color: #fff; border-radius: 14px; padding: 18px; font-size: 22px; font-weight: 800; }
.light td, .light th { font-size: 18px; }

input[type="search"], input[type="text"], input[type="date"], textarea, select {
  width: 100%; font-size: 18px; padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink);
}
label.f { display: block; font-weight: 700; margin: 12px 0 4px; font-size: 15px; }
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; z-index: 10; }
.sheet[hidden] { display: none; }
.sheet-card { background: var(--card); width: 100%; max-height: 80vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
.seg { display: flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { flex: 1; min-height: 48px; border: 0; background: var(--card); color: var(--ink); font-size: 16px; }
.seg button.on { background: var(--accent); color: #fff; font-weight: 800; }

/* flashcards */
.fc { min-height: 220px; cursor: pointer; }
.fc h2 { font-size: 24px; }
.fc-back { border-top: 2px dashed var(--line); margin-top: 10px; padding-top: 10px; font-size: 19px; }
.print-grid .card { page-break-inside: avoid; }

@media print {
  .top, .tabs, .banner, .btn-row, .dots, .no-print { display: none !important; }
  .print-grid { columns: 2; column-gap: 12px; }
  .print-grid .card { font-size: 9pt; padding: 8px; margin: 0 0 8px; break-inside: avoid; }
  .print-grid h2 { font-size: 11pt; }
  body { padding: 0; background: #fff; color: #000; font-size: 11pt; }
  .card { break-inside: avoid; border: 1px solid #000; }
}
</style>
</head>

<script>window.HM={"built":"2026-10-01","sessions":[{"id":"countdown","phase":1,"num":1,"title":"Countdown to your first hunt","minutes":10,"checked":"2026-10-01","steps":[{"title":"Countdown to your first hunt","html":"<aside class=\"callout why\"><div class=\"callout-t\">Why it matters<\/div><p>About 2 weeks to go. Gear and practice take longer than you think. This is the order that works.<\/p><\/aside>"},{"title":"The big picture","html":"<ul><li><strong>Week 1 (now):<\/strong> licences, buy the shotgun, buy and mount the scope.<\/li><li><strong>Week 2:<\/strong> sight in the rifle, pattern the shotgun, buy clothing, scout on the map.<\/li><li><strong>Hunt week:<\/strong> final checks, pack, go.<\/li><li>Dates are a plan, not a rule. Move them to fit your life.<\/li><\/ul><aside class=\"callout lean\"><div class=\"callout-t\">My lean (opinion)<\/div><p>Licences and the scope come first. Without a sighted in rifle there is no deer hunt. Without a federal permit there is no duck hunt.<\/p><\/aside>"},{"title":"Week 1: paperwork and the big buys","html":"<div class=\"checklist\" data-list=\"cd-w1\"><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w1:0\"><span>Find my FWID (Fish and Wildlife ID) in WILD online<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w1:1\"><span>Buy BC hunting licence online<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w1:2\"><span>Buy mule deer and white tailed deer licences IN PERSON<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w1:3\"><span>Buy the federal Migratory Game Bird Hunting Permit online<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w1:4\"><span>Pick a shotgun (Session 3) and buy it<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w1:5\"><span>Buy steel shot for ducks and lead or steel for quail (Session 6)<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w1:6\"><span>Pick a scope and Picatinny rings (Session 4) and buy them<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w1:7\"><span>Have the shop mount the scope, or mount it with a torque wrench<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w1:8\"><span>Buy .308 ammo: 3 to 4 boxes of the SAME load<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w1:9\"><span>Ask your brother: is his own house on the 20 acres? Where are the neighbours?<\/span><\/label><\/div>"},{"title":"Week 2: practice and kit","html":"<div class=\"checklist\" data-list=\"cd-w2\"><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w2:0\"><span>Bore sight, then zero the rifle at 100 m (Session 5)<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w2:1\"><span>Shoot 3 shot groups from a rest until they are tight<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w2:2\"><span>Shoot from sitting and kneeling with shooting sticks<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w2:3\"><span>Pattern the shotgun on paper with your duck load (Session 5)<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w2:4\"><span>Practice on clay targets, at least 1 session<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w2:5\"><span>Buy clothing, boots, waders (Session 7)<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w2:6\"><span>Build the day pack and car kit (Session 8)<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w2:7\"><span>Download offline maps of the area to your phone<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w2:8\"><span>Scout on the map: slopes, benches, water, roads (Sessions 9 to 11)<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w2:9\"><span>Practice the legal to shoot flowchart in Field Mode<\/span><\/label><\/div>"},{"title":"Hunt week","html":"<div class=\"checklist\" data-list=\"cd-w3\"><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w3:0\"><span>Check in season regulation changes and closures<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w3:1\"><span>Check fire restrictions and road closures<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w3:2\"><span>Check legal light times in Field Mode<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w3:3\"><span>Leave a trip plan with someone<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w3:4\"><span>Pack: licences, ID, permit, ammo, knife, game bags, first aid<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w3:5\"><span>Cooler and ice ready for meat<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"cd-w3:6\"><span>Go slow. Watch more than you walk.<\/span><\/label><\/div>"},{"title":"Time savers","html":"<ul><li>Buy where you can handle the gun and get help mounting the scope. (Tip)<\/li><li>Ask the store about a range near Kamloops. Many have sighting in days. (Tip)<\/li><li>One ammo load for the rifle. Do not mix brands after zeroing. (Tip, 85% the zero changes between loads)<\/li><li>Practice loading and unloading at the car until it is boring. (Tip)<\/li><\/ul><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>Buy once, practice twice. The rifle you shot 60 times beats the fancy one you shot 6 times.<\/p><\/aside><aside class=\"callout mistake\"><div class=\"callout-t\">Common mistakes<\/div><ul><li>Mounting the scope the night before the hunt.<\/li><li>Buying 5 kinds of ammo and never zeroing any of them.<\/li><li>Spending every evening shopping and none on the range.<\/li><\/ul><\/aside><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>Tonight: put your hunt date in More. Then tick off the first 3 boxes above.<\/p><\/aside>"},{"title":"Sources","html":"<ul><li>Licence facts: see Session 2 sources.<\/li><li>Everything else in this session is a plan and tips (opinion), not rules.<\/li><\/ul>"}],"quiz":[{"q":"What should you do first this week?","options":["Buy clothing","Sort licences and buy the scope","Scout on the map"],"answer":1,"why":"Deer tags can take time to get and the rifle must be zeroed before you can hunt deer."},{"q":"You zeroed with Brand A. The store is out, so you buy Brand B. What now?","options":["Nothing, .308 is .308","Check the zero again with Brand B","Aim a bit higher"],"answer":1,"why":"Different loads hit different spots. Confirm the zero with the exact ammo you will hunt with."},{"q":"Why pattern the shotgun before duck season?","options":["It is required by law","To see where and how tight your shot hits with your load and choke","To break in the barrel"],"answer":1,"why":"Patterning shows if the gun shoots where you look and how the shot spreads at real distances."}],"checklists":["cd-w1","cd-w2","cd-w3"],"text":" !why about 2 weeks to go. gear and practice take longer than you think. this is the order that works. the big picture - week 1 (now): licences, buy the shotgun, buy and mount the scope. - week 2: sight in the rifle, pattern the shotgun, buy clothing, scout on the map. - hunt week: final checks, pack, go. - dates are a plan, not a rule. move them to fit your life. !lean licences and the scope come first. without a sighted in rifle there is no deer hunt. without a federal permit there is no duck hunt. week 1: paperwork and the big buys week 2: practice and kit hunt week time savers - buy where you can handle the gun and get help mounting the scope. (tip) - ask the store about a range near kamloops. many have sighting in days. (tip) - one ammo load for the rifle. do not mix brands after zeroing. (tip, 85% the zero changes between loads) - practice loading and unloading at the car until it is boring. (tip) !rule buy once, practice twice. the rifle you shot 60 times beats the fancy one you shot 6 times. !mistake - mounting the scope the night before the hunt. - buying 5 kinds of ammo and never zeroing any of them. - spending every evening shopping and none on the range. !field tonight: put your hunt date in more. then tick off the first 3 boxes above. sources - licence facts: see session 2 sources. - everything else in this session is a plan and tips (opinion), not rules. "},{"id":"licences","phase":1,"num":2,"title":"Licences and tags","minutes":12,"checked":"2026-10-01","steps":[{"title":"Licences and tags","html":"<aside class=\"callout why\"><div class=\"callout-t\">Why it matters<\/div><p>No licence, no hunt. Some tags take 14 days by mail. Buy in person now.<\/p><\/aside>"},{"title":"What you need, by animal","html":"<div class=\"tbl\"><table><thead><tr><th>Hunting<\/th><th>You need<\/th><\/tr><\/thead><tbody><tr><td>Deer<\/td><td>BC hunting licence + deer species licence (tag) for that species<\/td><\/tr><tr><td>Ducks and geese<\/td><td>BC hunting licence + federal bird permit<\/td><\/tr><tr><td>Quail and grouse<\/td><td>BC hunting licence only<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Residents need no species licence for quail or grouse <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Ducks and geese need no BC species licence, only the federal permit <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Mule deer and white tailed deer are <strong>separate<\/strong> species licences <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><\/ul>"},{"title":"Your hunter number (FWID)","html":"<ul><li>Your old hunter number is now the <button class=\"term\" data-term=\"FWID\">FWID<\/button> (Fish and Wildlife ID) <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>It is 9 digits: your old number with 3 digits added at the front <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>There is no physical card.<\/strong> You do not need to carry a printout <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>You must carry <strong>photo ID<\/strong> and be able to give your FWID number <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Not sure of yours? Log in to WILD (Wildlife Information and Licensing Data) and tap <strong>Find my FWID<\/strong> <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>No luck? FrontCounter BC: 1 877 855 3222 <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><\/ul>"},{"title":"The hunting licence","html":"<ul><li>One per licence year. Licence year runs 1 April to 31 March <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Adult resident cost: $25 + $7 surcharge <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>. GST (Goods and Services Tax): <span class=\"verify\">VERIFY<\/span>.<\/li><li>It is <strong>electronic only<\/strong>. No paper copy exists <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Buy online in WILD, or at Service BC or FrontCounter BC <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><\/ul>"},{"title":"Deer tags (species licences)","html":"<ul><li>Mule deer: $12 + $3 surcharge. White tailed deer: $12 + $3 surcharge <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li><strong>Cannot be printed at home.<\/strong> They are special waterproof paper <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Online orders are mailed. About 14 days <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Hunting in the next 2 weeks? <strong>Buy in person<\/strong> at Service BC, FrontCounter BC or a licence vendor <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Some species have a 2 day wait after purchase. For deer: <span class=\"verify\">VERIFY<\/span>.<\/li><li>Carry <strong>all<\/strong> your species licences for the year, used and unused <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><\/ul><aside class=\"callout lean\"><div class=\"callout-t\">My lean (opinion)<\/div><p>Buy both a mule deer and a white tailed deer licence. $30 total. You will not know which deer walks out first.<\/p><\/aside>"},{"title":"Federal bird permit (ducks and geese)","html":"<ul><li>Name: Migratory Game Bird Hunting Permit. The habitat stamp is included <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Cost: $17 + tax <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>2026 e permit valid 1 August 2026 to 30 June 2027 <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Buy online any time with a credit card. Save it on your phone <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Carry it every time you hunt ducks or geese, paper or phone <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><\/ul>"},{"title":"Your brother","html":"<ul><li>He has CORE (Conservation and Outdoor Recreation Education), a PAL (Possession and Acquisition Licence) and an FWID. He can hunt too.<\/li><li>He needs his <strong>own<\/strong> BC hunting licence, his <strong>own<\/strong> deer species licences and his <strong>own<\/strong> federal bird permit <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Each hunter fills <strong>their own<\/strong> tags. You cannot notch your tag for his deer (80%, <span class=\"verify\">VERIFY<\/span> party hunting rules).<\/li><li>Anyone without a licence can still come along to watch and help pack out, if they carry no firearm <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><\/ul>"},{"title":"Buy it this week","html":"<div class=\"checklist\" data-list=\"s2-buy\"><label class=\"check\"><input type=\"checkbox\" data-key=\"s2-buy:0\"><span>Find my FWID in WILD<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s2-buy:1\"><span>Buy BC hunting licence (online is fine, it is electronic)<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s2-buy:2\"><span>Buy mule deer licence IN PERSON<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s2-buy:3\"><span>Buy white tailed deer licence IN PERSON<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s2-buy:4\"><span>Buy federal bird permit online, save to phone<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s2-buy:5\"><span>Photo ID and PAL card in wallet<\/span><\/label><\/div><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>Licences go in a zip bag in the same pocket every time. Check the pocket before you leave the truck.<\/p><\/aside><aside class=\"callout mistake\"><div class=\"callout-t\">Common mistakes<\/div><ul><li>Ordering deer tags online a week before the hunt. They arrive too late.<\/li><li>Thinking the hunting licence covers ducks. You also need the federal permit.<\/li><li>Leaving used tags at home. Carry them all.<\/li><\/ul><\/aside><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>Open WILD tonight. Find your FWID. Write it on the back of your PAL card in pencil.<\/p><\/aside>"},{"title":"Sources","html":"<ul><li><a href=\"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/wild-system/fish-wildlife-id\" target=\"_blank\" rel=\"noopener\">BC Fish and Wildlife ID page<\/a>, checked 2026-10-01<\/li><li><a href=\"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/species-licences\" target=\"_blank\" rel=\"noopener\">BC species licences page<\/a>, checked 2026-10-01<\/li><li><a href=\"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/frequently-asked-questions\" target=\"_blank\" rel=\"noopener\">BC hunting FAQ<\/a>, checked 2026-10-01<\/li><li><a href=\"https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/permit.html\" target=\"_blank\" rel=\"noopener\">ECCC permit page<\/a>, checked 2026-10-01<\/li><li>Note: read through search previews of these official pages. Capped at 85% until the full pages are opened.<\/li><\/ul>"}],"quiz":[{"q":"Do you need to carry a hunter number card?","options":["Yes, always","No. Carry photo ID and know your FWID number","Only for deer"],"answer":1,"why":"BC replaced the card with the FWID. Carry photo ID and be able to give the number."},{"q":"You hunt deer in 10 days. How do you get the species licence?","options":["Order online, it prints at home","Buy in person","You do not need one"],"answer":1,"why":"Species licences cannot be printed at home and online orders are mailed, about 14 days."},{"q":"What do you need to shoot a mallard?","options":["BC hunting licence only","BC hunting licence and the federal Migratory Game Bird Hunting Permit","A duck species licence"],"answer":1,"why":"Ducks are federal. You need the BC hunting licence plus the federal permit."},{"q":"Can an unlicensed friend carry your rifle on the walk in?","options":["Yes if it is unloaded","No. Having a firearm while out after game can count as hunting","Yes on Crown land"],"answer":1,"why":"Under the Wildlife Act, searching for wildlife while in possession of a firearm is hunting. They would need a licence."}],"checklists":["s2-buy"],"text":" !why no licence, no hunt. some tags take 14 days by mail. buy in person now. what you need, by animal hunting you need --- --- deer bc hunting licence + deer species licence (tag) for that species ducks and geese bc hunting licence + federal bird permit quail and grouse bc hunting licence only - residents need no species licence for quail or grouse (80%). - ducks and geese need no bc species licence, only the federal permit (80%). - mule deer and white tailed deer are separate species licences (80%). your hunter number (fwid) - your old hunter number is now the fwid (fish and wildlife id) (85%). - it is 9 digits: your old number with 3 digits added at the front (85%). - there is no physical card. you do not need to carry a printout (85%). - you must carry photo id and be able to give your fwid number (85%). - not sure of yours? log in to wild (wildlife information and licensing data) and tap find my fwid (85%). - no luck? frontcounter bc: 1 877 855 3222 (80%). the hunting licence - one per licence year. licence year runs 1 april to 31 march (85%). - adult resident cost: $25 + $7 surcharge (80%). gst (goods and services tax): verify. - it is electronic only . no paper copy exists (85%). - buy online in wild, or at service bc or frontcounter bc (85%). deer tags (species licences) - mule deer: $12 + $3 surcharge. white tailed deer: $12 + $3 surcharge (80%). - cannot be printed at home. they are special waterproof paper (85%). - online orders are mailed. about 14 days (85%). - hunting in the next 2 weeks? buy in person at service bc, frontcounter bc or a licence vendor (85%). - some species have a 2 day wait after purchase. for deer: verify. - carry all your species licences for the year, used and unused (85%). !lean buy both a mule deer and a white tailed deer licence. $30 total. you will not know which deer walks out first. federal bird permit (ducks and geese) - name: migratory game bird hunting permit. the habitat stamp is included (80%). - cost: $17 + tax (80%). - 2026 e permit valid 1 august 2026 to 30 june 2027 (80%). - buy online any time with a credit card. save it on your phone (85%). - carry it every time you hunt ducks or geese, paper or phone (85%). your brother - he has core (conservation and outdoor recreation education), a pal (possession and acquisition licence) and an fwid. he can hunt too. - he needs his own bc hunting licence, his own deer species licences and his own federal bird permit (85%). - each hunter fills their own tags. you cannot notch your tag for his deer (80%, verify party hunting rules). - anyone without a licence can still come along to watch and help pack out, if they carry no firearm (80%). buy it this week !rule licences go in a zip bag in the same pocket every time. check the pocket before you leave the truck. !mistake - ordering deer tags online a week before the hunt. they arrive too late. - thinking the hunting licence covers ducks. you also need the federal permit. - leaving used tags at home. carry them all. !field open wild tonight. find your fwid. write it on the back of your pal card in pencil. sources - bc fish and wildlife id page (https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/wild-system/fish-wildlife-id), checked 2026-10-01 - bc species licences page (https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/species-licences), checked 2026-10-01 - bc hunting faq (https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/frequently-asked-questions), checked 2026-10-01 - eccc permit page (https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/permit.html), checked 2026-10-01 - note: read through search previews of these official pages. capped at 85% until the full pages are opened. "},{"id":"first-duck-hunt","phase":1,"num":9,"title":"Your first duck hunt","minutes":15,"checked":"2026-10-01","steps":[{"title":"Your first duck hunt","html":"<aside class=\"callout why\"><div class=\"callout-t\">Why it matters<\/div><p>Ducks are the fastest way to get real shooting, real ID practice and real meat this October. A simple plan beats a fancy spread.<\/p><\/aside><ul><li>Two hunters: you and your brother. He has CORE (Conservation and Outdoor Recreation Education), a PAL (Possession and Acquisition Licence) and an FWID (Fish and Wildlife ID).<\/li><li>He still needs his own BC hunting licence and federal <button class=\"term\" data-term=\"MGBHP\">MGBHP<\/button> (Migratory Game Bird Hunting Permit) before he carries a shotgun <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Assumption: no dog, a 12 gauge with steel shot, a 10 ft boat and maybe a kayak.<\/li><\/ul>"},{"title":"Season, hours, limits","html":"<ul><li>Seasons are set by <button class=\"term\" data-term=\"ECCC\">ECCC<\/button> (Environment and Climate Change Canada), not the BC synopsis tables. Kamloops area duck dates for 2026 to 2027: <span class=\"verify\">VERIFY<\/span>.<\/li><li>ECCC dates are listed by MU (Management Unit). Find the MU for each pond on the map. Your exact MU and dates: <span class=\"verify\">VERIFY<\/span>.<\/li><li>Daily bag: 8 ducks. Inside that, max 4 pintails, 4 canvasbacks, 2 goldeneyes, 2 harlequins <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Possession: 24 ducks <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Legal hours: half an hour before sunrise to half an hour after sunset <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Deer and quail hours are different (1 hour each side). Do not mix them up <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><\/ul><aside class=\"callout warn\"><div class=\"callout-t\">Warning<\/div><p>Season dates near Kamloops are blank on purpose. Read the ECCC BC summary for 2026 to 2027 before your first hunt.<\/p><\/aside>"},{"title":"Ducks you will see near Kamloops","html":"<ul><li><strong>Mallard.<\/strong> Big. Drake has a green head. Blue wing patch with white edges. Slow, steady wingbeats <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li><strong>Green winged teal.<\/strong> Small and very fast. Tight flocks twist as one unit. Often early migrants <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li><strong>American wigeon.<\/strong> Drake has a white crown stripe. Big white shoulder patch shows in flight. Whistled call <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li><strong>Goldeneye (diver).<\/strong> Black and white. Wings whistle in flight. Bag limit only 2 <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li><strong>Bufflehead.<\/strong> Small black and white diver. Mostly arrives later, into winter <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>.<\/li><li>Mallards and Canada geese are common on the Thompson River all year <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Which species and how many in mid October near Heffley Creek: Tip, varies by year.<\/li><\/ul>"},{"title":"Flight silhouettes","html":"<figure class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 440\" role=\"img\" aria-label=\"Four simple duck flight silhouettes: mallard large with broad wings, teal small and fast in tight flocks, wigeon with white wing patch, goldeneye diver with wings set far back and white sides.\">\n  <rect x=\"0\" y=\"0\" width=\"400\" height=\"440\" fill=\"#fffaf0\"/>\n  <line x1=\"200\" y1=\"10\" x2=\"200\" y2=\"430\" stroke=\"#8a9a6b\" stroke-width=\"2\" fill=\"none\"/>\n  <line x1=\"10\" y1=\"220\" x2=\"390\" y2=\"220\" stroke=\"#8a9a6b\" stroke-width=\"2\" fill=\"none\"/>\n  <!-- Mallard: big body, broad wings -->\n  <g>\n    <path d=\"M30 95 L100 70 L170 95 L100 88 Z\" fill=\"#23261f\"/>\n    <ellipse cx=\"100\" cy=\"100\" rx=\"14\" ry=\"38\" fill=\"#23261f\"/>\n    <circle cx=\"100\" cy=\"56\" r=\"10\" fill=\"#2f3a2b\"/>\n    <rect x=\"66\" y=\"84\" width=\"16\" height=\"6\" fill=\"#4a5fa8\"/>\n    <rect x=\"118\" y=\"84\" width=\"16\" height=\"6\" fill=\"#4a5fa8\"/>\n    <text x=\"100\" y=\"168\" font-family=\"sans-serif\" font-size=\"17\" font-weight=\"bold\" fill=\"#23261f\" text-anchor=\"middle\">Mallard<\/text>\n    <text x=\"100\" y=\"188\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Big. Slow wingbeats.<\/text>\n    <text x=\"100\" y=\"205\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Loose groups.<\/text>\n  <\/g>\n  <!-- Teal: small, flock of three -->\n  <g fill=\"#23261f\">\n    <path d=\"M240 80 L268 68 L296 80 L268 77 Z\"/>\n    <ellipse cx=\"268\" cy=\"84\" rx=\"7\" ry=\"17\"/>\n    <circle cx=\"268\" cy=\"64\" r=\"5\"/>\n    <path d=\"M300 110 L328 98 L356 110 L328 107 Z\"/>\n    <ellipse cx=\"328\" cy=\"114\" rx=\"7\" ry=\"17\"/>\n    <circle cx=\"328\" cy=\"94\" r=\"5\"/>\n    <path d=\"M250 130 L278 118 L306 130 L278 127 Z\"/>\n    <ellipse cx=\"278\" cy=\"134\" rx=\"7\" ry=\"17\"/>\n    <circle cx=\"278\" cy=\"114\" r=\"5\"/>\n  <\/g>\n  <text x=\"300\" y=\"168\" font-family=\"sans-serif\" font-size=\"17\" font-weight=\"bold\" fill=\"#23261f\" text-anchor=\"middle\">Green winged teal<\/text>\n  <text x=\"300\" y=\"188\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Small. Very fast.<\/text>\n  <text x=\"300\" y=\"205\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Tight flock twists.<\/text>\n  <!-- Wigeon: white shoulder patch, pointed tail -->\n  <g>\n    <path d=\"M40 305 L100 282 L160 305 L100 298 Z\" fill=\"#23261f\"/>\n    <ellipse cx=\"100\" cy=\"308\" rx=\"12\" ry=\"32\" fill=\"#23261f\"/>\n    <polygon points=\"94,338 106,338 100,352\" fill=\"#23261f\"/>\n    <circle cx=\"100\" cy=\"270\" r=\"8\" fill=\"#23261f\"/>\n    <rect x=\"96\" y=\"264\" width=\"8\" height=\"5\" fill=\"#fffaf0\"/>\n    <polygon points=\"72,293 90,288 90,296 72,300\" fill=\"#fffaf0\"/>\n    <polygon points=\"128,293 110,288 110,296 128,300\" fill=\"#fffaf0\"/>\n    <text x=\"100\" y=\"378\" font-family=\"sans-serif\" font-size=\"17\" font-weight=\"bold\" fill=\"#23261f\" text-anchor=\"middle\">Wigeon<\/text>\n    <text x=\"100\" y=\"398\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">White wing patch.<\/text>\n    <text x=\"100\" y=\"415\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Whistle call.<\/text>\n  <\/g>\n  <!-- Goldeneye / diver: wings set back, short neck, white sides -->\n  <g>\n    <ellipse cx=\"300\" cy=\"300\" rx=\"14\" ry=\"34\" fill=\"#23261f\"/>\n    <path d=\"M244 318 L300 300 L356 318 L300 312 Z\" fill=\"#23261f\"/>\n    <polygon points=\"262,312 282,307 282,314 262,318\" fill=\"#fffaf0\"/>\n    <polygon points=\"338,312 318,307 318,314 338,318\" fill=\"#fffaf0\"/>\n    <circle cx=\"300\" cy=\"262\" r=\"10\" fill=\"#2f3a2b\"/>\n    <circle cx=\"305\" cy=\"266\" r=\"3\" fill=\"#fffaf0\"/>\n    <text x=\"300\" y=\"378\" font-family=\"sans-serif\" font-size=\"17\" font-weight=\"bold\" fill=\"#23261f\" text-anchor=\"middle\">Goldeneye (diver)<\/text>\n    <text x=\"300\" y=\"398\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Wings set far back.<\/text>\n    <text x=\"300\" y=\"415\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Wings whistle.<\/text>\n  <\/g>\n<\/svg>\n<\/figure><ul><li>Puddle ducks (mallard, teal, wigeon) jump straight up off the water <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Divers (goldeneye, bufflehead) run along the water to take off. Wings sit far back on the body <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Hen ducks look alike. If you cannot tell a goldeneye from a mallard hen, do not shoot until it is identified (Tip).<\/li><\/ul>"},{"title":"Three ways to hunt","html":"<h3>Decoys over water<\/h3><ul><li>Pros: birds come to you, slow and close. Best shots. Best way to learn.<\/li><li>Cons: need decoys (6 to 12 is enough to start), a hide, and a way to fetch birds.<\/li><\/ul><h3>Jump shooting<\/h3><ul><li>Sneak along a creek, slough or pond edge. Ducks flush close.<\/li><li>Pros: cheap, active, no decoys. Good with 2 hunters.<\/li><li>Cons: hard fast shots. Birds may fall into deep or fast water. Safety needs a plan.<\/li><\/ul><h3>Pass shooting<\/h3><ul><li>Stand under a flight line between roost and food.<\/li><li>Pros: no gear.<\/li><li>Cons: long, crossing shots. More wounded birds. Hard for beginners.<\/li><\/ul><aside class=\"callout lean\"><div class=\"callout-t\">My lean (opinion)<\/div><p>Jump shoot small calm water first. Then a small decoy spread on a pond with a shallow shore. Skip pass shooting until you are hitting clay targets well. Pick water where any bird you drop can be reached by wading or by boat.<\/p><\/aside>"},{"title":"The J hook spread","html":"<figure class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 440\" role=\"img\" aria-label=\"J hook decoy spread: wind blows from left to right, the main bunch of decoys sits upwind beside the blind, a tail line trails downwind, ducks fly in against the wind and land in the open pocket in front of the blind.\">\n  <rect x=\"0\" y=\"0\" width=\"400\" height=\"440\" fill=\"#fffaf0\"/>\n  <rect x=\"10\" y=\"60\" width=\"380\" height=\"290\" rx=\"18\" fill=\"#dfe6d3\" stroke=\"#8a9a6b\" stroke-width=\"2\"/>\n  <text x=\"200\" y=\"85\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#2f3a2b\" text-anchor=\"middle\">Open water<\/text>\n  <g>\n    <line x1=\"30\" y1=\"32\" x2=\"150\" y2=\"32\" stroke=\"#e8590c\" stroke-width=\"6\" fill=\"none\"/>\n    <polygon points=\"150,20 174,32 150,44\" fill=\"#e8590c\"/>\n    <text x=\"190\" y=\"38\" font-family=\"sans-serif\" font-size=\"18\" font-weight=\"bold\" fill=\"#e8590c\">WIND<\/text>\n  <\/g>\n  <g fill=\"#6b4f35\">\n    <ellipse cx=\"70\" cy=\"280\" rx=\"11\" ry=\"6\"/>\n    <ellipse cx=\"62\" cy=\"255\" rx=\"11\" ry=\"6\"/>\n    <ellipse cx=\"78\" cy=\"232\" rx=\"11\" ry=\"6\"/>\n    <ellipse cx=\"96\" cy=\"210\" rx=\"11\" ry=\"6\"/>\n    <ellipse cx=\"50\" cy=\"228\" rx=\"11\" ry=\"6\"/>\n    <ellipse cx=\"72\" cy=\"196\" rx=\"11\" ry=\"6\"/>\n    <ellipse cx=\"102\" cy=\"180\" rx=\"11\" ry=\"6\"/>\n    <ellipse cx=\"130\" cy=\"166\" rx=\"11\" ry=\"6\"/>\n    <ellipse cx=\"160\" cy=\"156\" rx=\"11\" ry=\"6\"/>\n    <ellipse cx=\"192\" cy=\"150\" rx=\"11\" ry=\"6\"/>\n    <ellipse cx=\"224\" cy=\"146\" rx=\"11\" ry=\"6\"/>\n    <ellipse cx=\"256\" cy=\"142\" rx=\"11\" ry=\"6\"/>\n    <ellipse cx=\"288\" cy=\"138\" rx=\"11\" ry=\"6\"/>\n    <ellipse cx=\"320\" cy=\"134\" rx=\"11\" ry=\"6\"/>\n  <\/g>\n  <text x=\"26\" y=\"312\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\">Main bunch<\/text>\n  <text x=\"26\" y=\"328\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\">(the hook)<\/text>\n  <text x=\"250\" y=\"118\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\">Tail line<\/text>\n  <ellipse cx=\"190\" cy=\"240\" rx=\"62\" ry=\"40\" fill=\"#fffaf0\" stroke=\"#e8590c\" stroke-width=\"3\" stroke-dasharray=\"8 6\"/>\n  <text x=\"190\" y=\"236\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"bold\" fill=\"#e8590c\" text-anchor=\"middle\">Landing zone<\/text>\n  <text x=\"190\" y=\"254\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">20 to 25 m out<\/text>\n  <g>\n    <path d=\"M370 210 Q 320 200 262 228\" stroke=\"#2f3a2b\" stroke-width=\"4\" fill=\"none\"/>\n    <polygon points=\"262,228 280,214 282,234\" fill=\"#2f3a2b\"/>\n    <text x=\"268\" y=\"300\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#2f3a2b\">Ducks come in<\/text>\n    <text x=\"268\" y=\"317\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#2f3a2b\">against the wind<\/text>\n  <\/g>\n  <rect x=\"10\" y=\"350\" width=\"380\" height=\"80\" fill=\"#c9b79c\"/>\n  <text x=\"300\" y=\"420\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Shore<\/text>\n  <rect x=\"150\" y=\"352\" width=\"80\" height=\"30\" rx=\"6\" fill=\"#2f3a2b\"/>\n  <text x=\"190\" y=\"372\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#fffaf0\" text-anchor=\"middle\">You (blind)<\/text>\n  <text x=\"20\" y=\"404\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\">Wind at your side or back.<\/text>\n  <text x=\"20\" y=\"422\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\">Never in your face.<\/text>\n<\/svg>\n<\/figure><ul><li>Ducks land into the wind <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Main bunch upwind near you. Tail line trailing downwind <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>.<\/li><li>Leave an open pocket 20 to 25 m (22 to 27 yd) out. That is where they land and where you shoot (Tip).<\/li><li>Wind at your side or back. Never in your face.<\/li><li>Keep shots inside about 35 m (38 yd) with steel (Tip).<\/li><\/ul>"},{"title":"Two hunters, one hide","html":"<ul><li>Agree on zones of fire before first light. You take left of centre, he takes right (Tip).<\/li><li>Never swing past your partner. Never shoot across the other person (Tip).<\/li><li>One person calls the shot: \"Take them.\" Then both stand or sit up, shoot your own side.<\/li><li>In the boat, <strong>one shooter at a time<\/strong>. The other runs the boat and watches (Tip).<\/li><\/ul>"},{"title":"Boat and kayak safety","html":"<ul><li><strong>Wear the PFD (Personal Flotation Device), zipped, every minute on the water.<\/strong> Carrying one is the legal minimum. Wearing it saves you <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Cold water: 1 minute to control your breathing, about 10 minutes of useful movement, up to 1 hour before you pass out from cold <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li><strong>Never stand to shoot<\/strong> from a 10 ft boat or a kayak. Sit, or shoot from shore (Tip).<\/li><li>Load the gun only once the boat is stopped and you are in position. Unload before moving (Tip).<\/li><li>Kayak: use it to fetch birds, not to shoot from (Tip).<\/li><li>Waders in a boat can fill if you go in. Wear a belt on them (Tip).<\/li><li>Leave a trip plan. Shore return time.<\/li><\/ul>"},{"title":"Boat rules","html":"<ul><li>No hunting migratory birds from a boat moving under motor or sail power <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Retrieving a downed bird from a moving boat is allowed <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>BC: shooting from a power boat is allowed only beached, anchored, or tied to a fixed blind. A motor tilted up and not ready to use does not count as power <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Do not use a boat to chase or herd ducks <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Motor on the boat? The driver needs a PCOC (Pleasure Craft Operator Card) <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>. Motor size and boat registration: <span class=\"verify\">VERIFY<\/span>.<\/li><li>Required kit for a small boat: a PFD for each person, a 15 m (50 ft) buoyant heaving line, a reboarding device if needed <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>. Full list: <span class=\"verify\">VERIFY<\/span>.<\/li><\/ul>"},{"title":"Fetching birds without a dog","html":"<ul><li><strong>The law:<\/strong> you must have a way to retrieve birds with you before you shoot. A bird you kill must be retrieved as soon as you can. A wounded bird must be killed and retrieved <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Plan the shot around the fetch: only shoot birds that will fall where you can reach them (Tip).<\/li><li>Tools: chest waders, the boat or kayak, a long handled landing net (Tip).<\/li><li>Wounded duck on the water: shoot again right away, on the water, while it is close (Tip).<\/li><li>Mark the fall: pick a tree or rock behind it. Go straight there (Tip).<\/li><li>Fast river current: do not wade. Let it go to shore downstream only if safe (Tip).<\/li><li>Keep one fully feathered wing or the head on each bird until home <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><\/ul>"},{"title":"Steel shot","html":"<ul><li><strong>Lead shot is banned for duck hunting in Canada.<\/strong> Do not even carry it while duck hunting <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Legal types include steel, bismuth and tungsten <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Shotgun: 10 gauge or smaller, max 3 shells in the gun. Magazine must be plugged <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>No rifles for ducks <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Starter load: 12 gauge, steel, size 2 or 3 (Tip). Pattern it first (Session 5).<\/li><li>Steel needs a choke rated for steel. Check the gun manual (Tip).<\/li><\/ul>"},{"title":"Find water you can legally hunt","html":"<ul><li>Do not hunt city water. There is a Kamloops no shooting and hunting area that includes river water near the city. Boundaries: <span class=\"verify\">VERIFY<\/span> on map C7 in the Region 3 synopsis <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Is the North Thompson at Heffley Creek inside that area? <span class=\"verify\">VERIFY<\/span> before you shoot there.<\/li><li>There is a provincial park on the North Thompson at Heffley Creek <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>. Hunting allowed there? <span class=\"verify\">VERIFY<\/span>. Skip it until confirmed.<\/li><li>Private ponds: written permission from the owner (Tip).<\/li><li>Crown land ponds: check the map for private land, parks and no shooting areas (Tip).<\/li><li>100 m (109 yd) from any occupied house or farm building, including your brother's <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><\/ul>"},{"title":"First hunt plan, step by step","html":"<ol><li>Night before: check sunrise, legal start (half an hour before), and the wind forecast.<\/li><li>Pack: licences, ID, both federal permits, steel shells, PFDs, waders, net, game bag, headlamps.<\/li><li>Arrive 1 hour before legal light. Set 6 to 12 decoys in a J hook with flashlights only.<\/li><li>Hide on shore with the wind at your side or back. Unload guns on the walk in until set.<\/li><li>Zones of fire agreed. Phone on silent. Watch the clock: no shot before legal time.<\/li><li>Let ducks commit to the pocket. Call the shot. Shoot your own side only.<\/li><li>Fetch each bird before the next flock if you can. Count birds by species.<\/li><li>Done by 10:00 or at your bag. Pick up every decoy and every empty shell.<\/li><\/ol><div class=\"checklist\" data-list=\"s9-duckday\"><label class=\"check\"><input type=\"checkbox\" data-key=\"s9-duckday:0\"><span>Season open today in my MU (checked ECCC summary)<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s9-duckday:1\"><span>Both hunters: BC licence and federal permit on phone<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s9-duckday:2\"><span>Steel shot only in my pockets<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s9-duckday:3\"><span>Magazine plug in<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s9-duckday:4\"><span>PFDs worn, trip plan left<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s9-duckday:5\"><span>Zones of fire agreed<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s9-duckday:6\"><span>Legal start time written down<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s9-duckday:7\"><span>Way to fetch birds ready (waders, boat, net)<\/span><\/label><\/div><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>If you would not swim for it, do not shoot it. Shoot only where you can fetch.<\/p><\/aside><aside class=\"callout mistake\"><div class=\"callout-t\">Common mistakes<\/div><ul><li>Standing up in a small boat to swing on a passing bird.<\/li><li>Shooting a duck that falls in fast, deep water with no way to reach it.<\/li><li>Shooting before legal light because \"the others started.\"<\/li><\/ul><\/aside><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>This week: drive to two candidate ponds at dawn. Watch where ducks land and which way the wind blows. Count shots you would take that you could also fetch.<\/p><\/aside>"},{"title":"Sources","html":"<ul><li><a href=\"https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/regulations-provincial-territorial-summaries/british-columbia.html\" target=\"_blank\" rel=\"noopener\">ECCC BC migratory bird hunting summary<\/a>, checked 2026-10-01, search preview, bag limits 75%.<\/li><li><a href=\"https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/frequently-asked-questions.html\" target=\"_blank\" rel=\"noopener\">ECCC hunting FAQ<\/a>, checked 2026-10-01, search preview, lead shot and boats 80 to 85%.<\/li><li><a href=\"https://laws.justice.gc.ca/eng/regulations/SOR-2022-105/FullText.html\" target=\"_blank\" rel=\"noopener\">Migratory Birds Regulations, 2022 (Justice Laws)<\/a>, checked 2026-10-01, search preview, retrieval, boats, wing attached 75 to 80%.<\/li><li><a href=\"https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/regulations-synopsis\" target=\"_blank\" rel=\"noopener\">BC Hunting and Trapping Regulations Synopsis 2026 to 2028<\/a>, checked 2026-10-01, search preview, power boat rules 75%.<\/li><li><a href=\"https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis-region-3-thompson.pdf\" target=\"_blank\" rel=\"noopener\">Region 3 synopsis<\/a>, checked 2026-10-01, search preview, Kamloops no shooting area 70%.<\/li><li><a href=\"https://laws-lois.justice.gc.ca/eng/regulations/sor-2010-91/page-4.html\" target=\"_blank\" rel=\"noopener\">Small Vessel Regulations (Justice Laws)<\/a>, checked 2026-10-01, search preview, 70%.<\/li><li><a href=\"https://www.lifesavingsociety.com/water-safety/cold-water-and-ice.aspx\" target=\"_blank\" rel=\"noopener\">Lifesaving Society cold water<\/a>, checked 2026-10-01, search preview, 75%.<\/li><li><a href=\"https://www.ducks.ca/assets/2021/10/waterfowl-ID-guide-2020-EN-reader-spreads.pdf\" target=\"_blank\" rel=\"noopener\">Ducks Unlimited Canada waterfowl ID guide<\/a>, checked 2026-10-01, search preview, 80%.<\/li><li><a href=\"https://www.themeateater.com/hunt/waterfowl/a-primer-on-decoys-and-decoy-spreads-for-puddle-ducks\" target=\"_blank\" rel=\"noopener\">MeatEater decoy spread primer<\/a>, checked 2026-10-01, tactics, 65%.<\/li><li>Note: official pages read through search previews only. Capped at 85%.<\/li><\/ul>"}],"quiz":[{"q":"When can you take your first shot at ducks?","options":["1 hour before sunrise","Half an hour before sunrise","At sunrise only"],"answer":1,"why":"Migratory bird hours are half an hour before sunrise to half an hour after sunset. Deer and quail are 1 hour."},{"q":"A duck drops in deep water and you have no waders, boat or net. What went wrong?","options":["Nothing, leave it","You took a shot you could not fetch. The law says you need a way to retrieve birds with you","You should have used lead"],"answer":1,"why":"You must have a way to retrieve birds before you hunt, and must retrieve them as soon as you can."},{"q":"Which shot can you carry while duck hunting?","options":["Lead or steel","Steel, bismuth or tungsten only","Any shot under size 4"],"answer":1,"why":"Lead shot is banned for most migratory game birds in Canada, even in your pocket."},{"q":"Where should the open landing pocket be in a J hook?","options":["Upwind of all decoys","In front of you, 20 to 25 m out, where ducks land into the wind","Behind you on shore"],"answer":1,"why":"Ducks land into the wind and like an open hole. Put it where you want to shoot."},{"q":"A flock comes in while you are in the 10 ft boat with your brother. What do you do?","options":["Both stand up and shoot","One shooter, seated, motor off and boat stopped","Chase them with the motor"],"answer":1,"why":"Stay seated in small boats. One shooter at a time. Never hunt from a boat moving under power."}],"checklists":["s9-duckday"],"text":" !why ducks are the fastest way to get real shooting, real id practice and real meat this october. a simple plan beats a fancy spread. - two hunters: you and your brother. he has core (conservation and outdoor recreation education), a pal (possession and acquisition licence) and an fwid (fish and wildlife id). - he still needs his own bc hunting licence and federal mgbhp (migratory game bird hunting permit) before he carries a shotgun (80%). - assumption: no dog, a 12 gauge with steel shot, a 10 ft boat and maybe a kayak. season, hours, limits - seasons are set by eccc (environment and climate change canada), not the bc synopsis tables. kamloops area duck dates for 2026 to 2027: verify. - eccc dates are listed by mu (management unit). find the mu for each pond on the map. your exact mu and dates: verify. - daily bag: 8 ducks. inside that, max 4 pintails, 4 canvasbacks, 2 goldeneyes, 2 harlequins (75%). - possession: 24 ducks (70%). - legal hours: half an hour before sunrise to half an hour after sunset (85%). - deer and quail hours are different (1 hour each side). do not mix them up (80%). !warn season dates near kamloops are blank on purpose. read the eccc bc summary for 2026 to 2027 before your first hunt. ducks you will see near kamloops - mallard. big. drake has a green head. blue wing patch with white edges. slow, steady wingbeats (80%). - green winged teal. small and very fast. tight flocks twist as one unit. often early migrants (80%). - american wigeon. drake has a white crown stripe. big white shoulder patch shows in flight. whistled call (80%). - goldeneye (diver). black and white. wings whistle in flight. bag limit only 2 (80%). - bufflehead. small black and white diver. mostly arrives later, into winter (65%). - mallards and canada geese are common on the thompson river all year (70%). - which species and how many in mid october near heffley creek: tip, varies by year. flight silhouettes - puddle ducks (mallard, teal, wigeon) jump straight up off the water (75%). - divers (goldeneye, bufflehead) run along the water to take off. wings sit far back on the body (75%). - hen ducks look alike. if you cannot tell a goldeneye from a mallard hen, do not shoot until it is identified (tip). three ways to hunt decoys over water - pros: birds come to you, slow and close. best shots. best way to learn. - cons: need decoys (6 to 12 is enough to start), a hide, and a way to fetch birds. jump shooting - sneak along a creek, slough or pond edge. ducks flush close. - pros: cheap, active, no decoys. good with 2 hunters. - cons: hard fast shots. birds may fall into deep or fast water. safety needs a plan. pass shooting - stand under a flight line between roost and food. - pros: no gear. - cons: long, crossing shots. more wounded birds. hard for beginners. !lean jump shoot small calm water first. then a small decoy spread on a pond with a shallow shore. skip pass shooting until you are hitting clay targets well. pick water where any bird you drop can be reached by wading or by boat. the j hook spread - ducks land into the wind (75%). - main bunch upwind near you. tail line trailing downwind (65%). - leave an open pocket 20 to 25 m (22 to 27 yd) out. that is where they land and where you shoot (tip). - wind at your side or back. never in your face. - keep shots inside about 35 m (38 yd) with steel (tip). two hunters, one hide - agree on zones of fire before first light. you take left of centre, he takes right (tip). - never swing past your partner. never shoot across the other person (tip). - one person calls the shot: \"take them.\" then both stand or sit up, shoot your own side. - in the boat, one shooter at a time . the other runs the boat and watches (tip). boat and kayak safety - wear the pfd (personal flotation device), zipped, every minute on the water. carrying one is the legal minimum. wearing it saves you (85%). - cold water: 1 minute to control your breathing, about 10 minutes of useful movement, up to 1 hour before you pass out from cold (75%). - never stand to shoot from a 10 ft boat or a kayak. sit, or shoot from shore (tip). - load the gun only once the boat is stopped and you are in position. unload before moving (tip). - kayak: use it to fetch birds, not to shoot from (tip). - waders in a boat can fill if you go in. wear a belt on them (tip). - leave a trip plan. shore return time. boat rules - no hunting migratory birds from a boat moving under motor or sail power (80%). - retrieving a downed bird from a moving boat is allowed (75%). - bc: shooting from a power boat is allowed only beached, anchored, or tied to a fixed blind. a motor tilted up and not ready to use does not count as power (75%). - do not use a boat to chase or herd ducks (75%). - motor on the boat? the driver needs a pcoc (pleasure craft operator card) (75%). motor size and boat registration: verify. - required kit for a small boat: a pfd for each person, a 15 m (50 ft) buoyant heaving line, a reboarding device if needed (70%). full list: verify. fetching birds without a dog - the law: you must have a way to retrieve birds with you before you shoot. a bird you kill must be retrieved as soon as you can. a wounded bird must be killed and retrieved (80%). - plan the shot around the fetch: only shoot birds that will fall where you can reach them (tip). - tools: chest waders, the boat or kayak, a long handled landing net (tip). - wounded duck on the water: shoot again right away, on the water, while it is close (tip). - mark the fall: pick a tree or rock behind it. go straight there (tip). - fast river current: do not wade. let it go to shore downstream only if safe (tip). - keep one fully feathered wing or the head on each bird until home (80%). steel shot - lead shot is banned for duck hunting in canada. do not even carry it while duck hunting (85%). - legal types include steel, bismuth and tungsten (85%). - shotgun: 10 gauge or smaller, max 3 shells in the gun. magazine must be plugged (80%). - no rifles for ducks (80%). - starter load: 12 gauge, steel, size 2 or 3 (tip). pattern it first (session 5). - steel needs a choke rated for steel. check the gun manual (tip). find water you can legally hunt - do not hunt city water. there is a kamloops no shooting and hunting area that includes river water near the city. boundaries: verify on map c7 in the region 3 synopsis (70%). - is the north thompson at heffley creek inside that area? verify before you shoot there. - there is a provincial park on the north thompson at heffley creek (70%). hunting allowed there? verify. skip it until confirmed. - private ponds: written permission from the owner (tip). - crown land ponds: check the map for private land, parks and no shooting areas (tip). - 100 m (109 yd) from any occupied house or farm building, including your brother's (75%). first hunt plan, step by step 1. night before: check sunrise, legal start (half an hour before), and the wind forecast. 2. pack: licences, id, both federal permits, steel shells, pfds, waders, net, game bag, headlamps. 3. arrive 1 hour before legal light. set 6 to 12 decoys in a j hook with flashlights only. 4. hide on shore with the wind at your side or back. unload guns on the walk in until set. 5. zones of fire agreed. phone on silent. watch the clock: no shot before legal time. 6. let ducks commit to the pocket. call the shot. shoot your own side only. 7. fetch each bird before the next flock if you can. count birds by species. 8. done by 10:00 or at your bag. pick up every decoy and every empty shell. !rule if you would not swim for it, do not shoot it. shoot only where you can fetch. !mistake - standing up in a small boat to swing on a passing bird. - shooting a duck that falls in fast, deep water with no way to reach it. - shooting before legal light because \"the others started.\" !field this week: drive to two candidate ponds at dawn. watch where ducks land and which way the wind blows. count shots you would take that you could also fetch. sources - eccc bc migratory bird hunting summary (https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/regulations-provincial-territorial-summaries/british-columbia.html), checked 2026-10-01, search preview, bag limits 75%. - eccc hunting faq (https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/frequently-asked-questions.html), checked 2026-10-01, search preview, lead shot and boats 80 to 85%. - migratory birds regulations, 2022 (justice laws) (https://laws.justice.gc.ca/eng/regulations/sor-2022-105/fulltext.html), checked 2026-10-01, search preview, retrieval, boats, wing attached 75 to 80%. - bc hunting and trapping regulations synopsis 2026 to 2028 (https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/regulations-synopsis), checked 2026-10-01, search preview, power boat rules 75%. - region 3 synopsis (https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis-region-3-thompson.pdf), checked 2026-10-01, search preview, kamloops no shooting area 70%. - small vessel regulations (justice laws) (https://laws-lois.justice.gc.ca/eng/regulations/sor-2010-91/page-4.html), checked 2026-10-01, search preview, 70%. - lifesaving society cold water (https://www.lifesavingsociety.com/water-safety/cold-water-and-ice.aspx), checked 2026-10-01, search preview, 75%. - ducks unlimited canada waterfowl id guide (https://www.ducks.ca/assets/2021/10/waterfowl-id-guide-2020-en-reader-spreads.pdf), checked 2026-10-01, search preview, 80%. - meateater decoy spread primer (https://www.themeateater.com/hunt/waterfowl/a-primer-on-decoys-and-decoy-spreads-for-puddle-ducks), checked 2026-10-01, tactics, 65%. - note: official pages read through search previews only. capped at 85%. "},{"id":"first-deer-hunt","phase":1,"num":10,"title":"Your first deer hunt","minutes":15,"checked":"2026-10-01","steps":[{"title":"Your first deer hunt","html":"<aside class=\"callout why\"><div class=\"callout-t\">Why it matters<\/div><p>Late October near Heffley Creek is a real chance at a deer. A safe, simple plan you can repeat beats a long shot at a far ridge.<\/p><\/aside><ul><li>Two hunters: you and your brother. He has CORE (Conservation and Outdoor Recreation Education), a PAL (Possession and Acquisition Licence) and an FWID (Fish and Wildlife ID).<\/li><li>He needs his own BC hunting licence and deer <button class=\"term\" data-term=\"Species licence\">species licences<\/button> before he hunts <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Assumption: your Tikka .308 is zeroed (Session 5). His rifle: <span class=\"verify\">VERIFY<\/span> what he will carry.<\/li><\/ul>"},{"title":"Mule deer or white tail?","html":"<div class=\"tbl\"><table><thead><tr><th><\/th><th>Mule deer<\/th><th>White tailed deer<\/th><\/tr><\/thead><tbody><tr><td>Antlers<\/td><td>Fork, then fork again<\/td><td>One main beam, single tines up<\/td><\/tr><tr><td>Tail<\/td><td>Thin, rope like, black tip<\/td><td>Wide, brown on top, flags up white<\/td><\/tr><tr><td>Ears<\/td><td>Very big<\/td><td>Smaller<\/td><\/tr><tr><td>Runs<\/td><td>Bounces on all 4 feet<\/td><td>Gallops to cover<\/td><\/tr><\/tbody><\/table><\/div><ul><li>These field marks are reliable on clear looks <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Mule deer often stop and look back at 150 to 300 m. Hunter lore <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>.<\/li><li>They are <strong>separate licences and separate rules<\/strong>. Know which one you are looking at before the safety comes off <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><\/ul>"},{"title":"Rules you must check first","html":"<ul><li>Your MU (Management Unit) for the property and the Crown land behind it: <span class=\"verify\">VERIFY<\/span> on the official map.<\/li><li>Mule deer season dates and antler rules (for example a 4 point rule) in your MU: <span class=\"verify\">VERIFY<\/span>.<\/li><li>White tail season and any antlerless days in your MU: <span class=\"verify\">VERIFY<\/span>.<\/li><li>Region 3 deer bag limit: <span class=\"verify\">VERIFY<\/span>. A search preview said 3 deer combined, 1 of them mule deer <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>.<\/li><li>Legal hours: 1 hour before sunrise to 1 hour after sunset <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><\/ul><aside class=\"callout warn\"><div class=\"callout-t\">Warning<\/div><p>No MU, no season dates, no hunt. Read the Region 3 synopsis table for your exact MU before opening day.<\/p><\/aside>"},{"title":"Where deer are in late October","html":"<ul><li>Mule deer are the main deer in the southern Interior <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Mule deer use steeper, higher, open broken ground. White tails use valley bottoms, creeks and farm fields <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Local reading: mule deer on grassland and open Douglas fir benches above the valley. White tails in North Thompson hayfields and cottonwood bottoms <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Many mule deer move toward winter range in October to November. Snow and cold push them, not the rut <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Late October is early pre rut. Bucks start sparring. Bachelor groups break up <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Deer move most around dawn and dusk <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Day beds: timber edges, benches, draws, out of the wind. Sunny south and west slopes on cold days <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><\/ul>"},{"title":"Glassing","html":"<figure class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 420\" role=\"img\" aria-label=\"A hillside split into a 3 by 3 grid. Scan order runs 1 to 9 in a snake pattern: bottom row left to right, middle row right to left, top row left to right. Start near, finish far.\">\n  <rect x=\"0\" y=\"0\" width=\"400\" height=\"420\" fill=\"#fffaf0\"/>\n  <path d=\"M10 330 L10 120 Q 90 40 170 80 Q 240 30 310 70 Q 360 90 390 80 L390 330 Z\" fill=\"#dfe6d3\" stroke=\"#8a9a6b\" stroke-width=\"2\"/>\n  <g fill=\"#2f3a2b\">\n    <polygon points=\"60,150 70,120 80,150\"/>\n    <polygon points=\"78,160 88,128 98,160\"/>\n    <polygon points=\"250,110 260,82 270,110\"/>\n    <polygon points=\"268,118 278,90 288,118\"/>\n    <polygon points=\"330,250 340,222 350,250\"/>\n  <\/g>\n  <g stroke=\"#6b4f35\" stroke-width=\"2\" stroke-dasharray=\"6 5\" fill=\"none\">\n    <line x1=\"137\" y1=\"80\" x2=\"137\" y2=\"330\"/>\n    <line x1=\"263\" y1=\"60\" x2=\"263\" y2=\"330\"/>\n    <line x1=\"10\" y1=\"160\" x2=\"390\" y2=\"160\"/>\n    <line x1=\"10\" y1=\"245\" x2=\"390\" y2=\"245\"/>\n  <\/g>\n  <g font-family=\"sans-serif\" font-size=\"22\" font-weight=\"bold\" fill=\"#e8590c\" text-anchor=\"middle\">\n    <circle cx=\"73\" cy=\"290\" r=\"17\" fill=\"#fffaf0\" stroke=\"#e8590c\" stroke-width=\"2\"/><text x=\"73\" y=\"298\">1<\/text>\n    <circle cx=\"200\" cy=\"290\" r=\"17\" fill=\"#fffaf0\" stroke=\"#e8590c\" stroke-width=\"2\"/><text x=\"200\" y=\"298\">2<\/text>\n    <circle cx=\"326\" cy=\"290\" r=\"17\" fill=\"#fffaf0\" stroke=\"#e8590c\" stroke-width=\"2\"/><text x=\"326\" y=\"298\">3<\/text>\n    <circle cx=\"326\" cy=\"203\" r=\"17\" fill=\"#fffaf0\" stroke=\"#e8590c\" stroke-width=\"2\"/><text x=\"326\" y=\"211\">4<\/text>\n    <circle cx=\"200\" cy=\"203\" r=\"17\" fill=\"#fffaf0\" stroke=\"#e8590c\" stroke-width=\"2\"/><text x=\"200\" y=\"211\">5<\/text>\n    <circle cx=\"73\" cy=\"203\" r=\"17\" fill=\"#fffaf0\" stroke=\"#e8590c\" stroke-width=\"2\"/><text x=\"73\" y=\"211\">6<\/text>\n    <circle cx=\"110\" cy=\"125\" r=\"17\" fill=\"#fffaf0\" stroke=\"#e8590c\" stroke-width=\"2\"/><text x=\"110\" y=\"133\">7<\/text>\n    <circle cx=\"200\" cy=\"125\" r=\"17\" fill=\"#fffaf0\" stroke=\"#e8590c\" stroke-width=\"2\"/><text x=\"200\" y=\"133\">8<\/text>\n    <circle cx=\"326\" cy=\"125\" r=\"17\" fill=\"#fffaf0\" stroke=\"#e8590c\" stroke-width=\"2\"/><text x=\"326\" y=\"133\">9<\/text>\n  <\/g>\n  <g stroke=\"#e8590c\" stroke-width=\"3\" fill=\"none\">\n    <path d=\"M92 290 L180 290 M219 290 L306 290\"/>\n    <path d=\"M343 290 Q 370 250 343 210\"/>\n    <path d=\"M306 203 L219 203 M180 203 L92 203\"/>\n    <path d=\"M56 203 Q 30 160 92 130\"/>\n    <path d=\"M128 125 L180 125 M219 125 L306 125\"/>\n  <\/g>\n  <text x=\"200\" y=\"40\" font-family=\"sans-serif\" font-size=\"15\" fill=\"#23261f\" text-anchor=\"middle\">Far: ridges, benches, timber edges<\/text>\n  <rect x=\"10\" y=\"330\" width=\"380\" height=\"80\" fill=\"#c9b79c\"/>\n  <circle cx=\"200\" cy=\"358\" r=\"12\" fill=\"#2f3a2b\"/>\n  <rect x=\"186\" y=\"370\" width=\"28\" height=\"22\" rx=\"4\" fill=\"#2f3a2b\"/>\n  <text x=\"200\" y=\"406\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">You, sitting, binoculars on a rest<\/text>\n  <text x=\"20\" y=\"352\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\">Start near<\/text>\n  <text x=\"300\" y=\"352\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\">1 to 2 min<\/text>\n  <text x=\"300\" y=\"368\" font-family=\"sans-serif\" font-size=\"14\" fill=\"#23261f\">per square<\/text>\n<\/svg>\n<\/figure><ul><li><button class=\"term\" data-term=\"Glassing\">Glassing<\/button> finds more deer than walking. Sit, rest the binoculars, go slow (Tip).<\/li><li>Split the hillside into squares. Scan near first, then far, in a snake pattern (Tip).<\/li><li>1 to 2 minutes per square. Then do it again. Deer appear (Tip).<\/li><li>Look for parts, not whole deer: an ear flick, a white rump, a leg line, a horizontal back (Tip).<\/li><li>Best times: first light and the last 2 hours of light <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Binoculars find. The rifle scope is never used to look at people or unknown shapes (Tip).<\/li><\/ul>"},{"title":"Wind and thermals","html":"<ul><li>Smell is a deer's best sense. Keep the wind in your face or across you <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Morning: air warms and flows <strong>uphill<\/strong> later in the morning. Evening: air cools and flows <strong>downhill<\/strong> <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>So: hunt from above in the evening only if the wind lets you. Come from below in late morning (Tip).<\/li><li>Check wind with a puff bottle or a bit of milkweed fluff every 15 minutes (Tip).<\/li><li>Wind wrong? Leave that spot for today. Do not push it (Tip).<\/li><\/ul>"},{"title":"Scenario A: the property plus Crown behind it","html":"<ul><li>Your brother's house is on the 20 acres. Neighbours are 100 to 200 m away.<\/li><li><strong>No shooting within 100 m (109 yd) of an occupied house, farm or ranch building<\/strong> <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>. That includes his house.<\/li><li>So the usable area on the 20 acres may be small or zero. The Crown land behind is the real option.<\/li><li>Map it first: draw a 100 m circle around every house and barn. Mark safe shooting lanes and earth <button class=\"term\" data-term=\"Backstop\">backstops<\/button> (Tip).<\/li><li>Mark the property line and the Crown edge. Walk it in daylight with a GPS (Global Positioning System) app (Tip).<\/li><li>Assign sides: you shoot left of the line, he shoots right. No shots toward any house, road or each other (Tip).<\/li><li>Pros: close to home, short pack out, easy to repeat dawn and dusk.<\/li><li>Cons: small area, people and pets nearby, deer may be few.<\/li><li>Odds: fair if deer cross the Crown edge. Opinion.<\/li><\/ul>"},{"title":"Scenario B: ATV on Forest Service Roads","html":"<ul><li><button class=\"term\" data-term=\"FSR\">FSR<\/button> (Forest Service Road) networks reach benches and cutblocks fast. Use them to get to glassing spots, then walk.<\/li><li><strong>No loaded firearm in or on a motor vehicle, and that includes an <button class=\"term\" data-term=\"ATV\">ATV<\/button> (All Terrain Vehicle)<\/strong> <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Loaded means a round in the chamber <strong>or<\/strong> in an attached magazine <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li><strong>No shooting from a motor vehicle<\/strong>, ATV included <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>No hunting or shooting on or across numbered highways and 2 lane public roads kept by the province, out to 15 m from the road centre <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>FSRs are not usually treated as those highways. Still never shoot along or across any road (60%, <span class=\"verify\">VERIFY<\/span>).<\/li><li>ATV on Crown land: needs registration and a plate. Helmet required <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>. Insurance on FSRs: <span class=\"verify\">VERIFY<\/span>.<\/li><li>Motor vehicle closures in Region 3: <span class=\"verify\">VERIFY<\/span> on the synopsis maps.<\/li><li>Pros: covers ground, easy meat haul, beats walking in the dark.<\/li><li>Cons: road hunters push deer back from roads. Noise. Easy to break rules by accident.<\/li><li>Odds: good for finding deer, fair for a shot. Opinion.<\/li><\/ul>"},{"title":"Scenario C: walk in 5 to 10 km","html":"<ul><li>Quiet country away from roads. Fewer hunters (Tip).<\/li><li>Meat math for a mule deer (US agency figures):<ul><li>Live weight about 68 to 113 kg (150 to 250 lb) for a buck <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Field dressed about 54 to 86 kg (120 to 190 lb) <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>A forkhorn or doe can give only about 23 kg (50 lb) of boned meat <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><\/ul><\/li><li>Bone in quarters for a mature buck: about 41 to 48 kg (90 to 105 lb) total. Hunter reports <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>.<\/li><li>Two of you, about 20 to 25 kg each per trip: 1 trip boned out, 2 trips bone in (Tip).<\/li><li>Loaded and off trail you may do 2 km an hour. 8 km out is about 4 hours per trip (Tip).<\/li><li><strong>You must bring out the edible meat: neck, ribs, 4 quarters and loins<\/strong> <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Pros: best chance at a calm, unpressured deer. Great skill builder.<\/li><li>Cons: a late shot means packing in the dark. Meat must cool fast.<\/li><li>Odds: good chance to see deer, hard first kill. Opinion.<\/li><\/ul><aside class=\"callout lean\"><div class=\"callout-t\">My lean (opinion)<\/div><p>Start with A and B together. Map the 100 m buffers and hunt the Crown edge behind the property at dawn. Use the ATV mid day to glass new benches. Save C for after your first deer, when you know the pack out and the cutting.<\/p><\/aside>"},{"title":"A hunt day","html":"<ul><li><strong>Night before:<\/strong> check legal light, wind, MU (Management Unit) rules, closures. Pack and charge everything.<\/li><li><strong>Sunrise minus 90 min:<\/strong> leave the house. Rifles unloaded and cased in the vehicle.<\/li><li><strong>Sunrise minus 60 min (legal light):<\/strong> sit at the first glassing spot. Load only when sitting and ready.<\/li><li><strong>First 3 hours:<\/strong> glass. Do not walk much.<\/li><l
