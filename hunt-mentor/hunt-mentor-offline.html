unting or shooting within 100 m of an occupied dwelling, farm or ranch building."},{"q":"Ducks in your brother's boat. When can you shoot?","options":["Any time the motor is idling","Only when the boat is beached, anchored or tied off, not moving under motor","Never from any boat"],"answer":1,"why":"Federal rules ban hunting migratory birds from a moving boat with a motor or sail."},{"q":"What must stay on a duck until it is preserved at home?","options":["The feet","One fully feathered wing or the fully feathered head","Nothing"],"answer":1,"why":"Officers use the wing or head to identify the species and count your bag."},{"q":"Which deer parts must you take out as edible portions?","options":["Back straps only","Neck, ribs, all four quarters and the loins","Hind quarters only"],"answer":1,"why":"The synopsis defines edible portions for big game as neck, ribs, four quarters and loins."}],"checklists":["s5-rules"],"text":" !why most fines are for simple things: a round in the chamber in the truck, a shot from the road, a missing tag. !warn study aid only. the official regulations are the law. - every rule below has a certainty %. under 80% means: read the official text before you rely on it. - most rules here were read in search previews of official pages. capped at 85%. - seasons, bag limits and fees live in the rules tab, not here. licences: what to carry hunting carry --- --- deer photo id, your fwid (fish and wildlife id) number, every deer species licence for the year (85%) ducks and geese photo id, fwid number, federal mgbhp (migratory game bird hunting permit), paper or phone (85%) quail and grouse photo id, fwid number. no species licence for residents (80%) - the bc hunting licence is electronic only. be able to give your fwid number (85%). - carry your pal (possession and acquisition licence) any time you have a firearm. tip: habit, not a hunting rule. - full detail: phase 1 session 2, licences and tags. legal hunting hours game earliest latest --- --- --- deer, quail, grouse (all game except migratory birds) 1 hour before sunrise 1 hour after sunset ducks and geese 30 minutes before sunrise 30 minutes after sunset - big game and upland hours: 85%. ducks and geese hours: 85%. - ducks get less light than deer. check both times every morning. - sunrise and sunset change by town. use a local table, not a city 200 km away. tip. \"loaded\" in bc - bc meaning: live ammunition in the breech (chamber) or the magazine . a clip with live rounds attached to the firearm counts as the magazine (85%). - so a full magazine in the rifle with an empty chamber is loaded in bc (85%). - federal \"unloaded\": no cartridge in the chamber and none in a magazine attached to or inserted in the firearm (85%). - loose rounds in your pocket or a detached magazine: not loaded (80%, my reading of both definitions). !law no loaded firearm in or on a motor vehicle, railway car, sleigh, aircraft, bicycle or other conveyance. no shooting from one either (85%). truck, atv and boat - truck: magazine out, chamber empty before the firearm goes in the truck (85%). - atv (all terrain vehicle): same rule. it is a motor vehicle or conveyance. unload before you get on (80%). - engine off is not enough. get off the atv , step away, then load (80%). federal rules also say load only where shooting is lawful (75%, secondary). - no shooting wildlife from a motor vehicle or a boat propelled by a motor (85%). - the 10 ft boat with motor: no deer shot from it, ever (85%). - kayak: no motor, so the bc motorboat rule does not apply. ducks: see the duck screen. deer from a kayak: verify. tip: do not. roads - no shooting across a road (85%). - no hunting or shooting on the road allowance of a public road (80%). - road allowance: 15 m (16 yd) each side of the middle of a road with under 3 lanes. or 15 m from the pavement edge on 3 lanes or more. or to private or cultivated land, if closer (85%). - which roads count (for example a fsr , forest service road): verify in the synopsis. - safe habit: walk at least 15 m off the road, then load. tip. the 100 m rule !law no hunting or shooting within 100 m (109 yd) of a church, school building, school yard, playground, regional district park, or a dwelling house, farm or ranch building occupied by people or domestic animals (85%). - \"occupied\" includes animals in a barn (85%). - 100 m is close. a rifle bullet travels kilometres. use your rangefinder on buildings. tip. - owners can slaughter their own livestock near their buildings. that exemption is not for hunting (85%). - your brother's house on the 20 acre property counts. no shot within 100 m of it, even with his permission (80%, my reading: the only owner exemption is livestock slaughter). - barns or sheds with animals inside count too (85%). - field job: rangefind the house from each likely stand. mark a 100 m ring on your phone map. tip. no shooting areas and closed areas - a no shooting area: firing a firearm is banned, even outside hunting (85%). - they are on the regional maps in the synopsis (85%). - region 3 synopsis has kamloops area maps with no shooting and no hunting areas (80%). exact boundaries near heffley creek: verify. - some towns and regional districts add their own discharge bylaws. sun peaks and heffley creek: verify. - check the map before you go, not on the slope. parks and protected land place hunting? --- --- ecological reserve no. no hunting, no firing a firearm or bow (85%) bc park only in parks listed for hunting, only in open season (80%) bc park road no shooting within 400 m of the centre line of a park road (80%) wildlife management area rules differ by area. verify each one first nations reserve private land. permission from the band office to hunt on or cross it (85%) - park closed to hunting: you may not even carry a firearm there, unless a park officer allows it (80%). - check each park page on bcparks.ca before you go (80%). private land and the trespass act - hunting private land needs the owner's consent (85%). get it in writing . tip. - under the trespass act, \"enclosed land\" includes land with a lawful fence, a natural boundary, or signs (85%). - signs must be at each normal access point and readable in daylight (85%). - on enclosed land you are presumed to have no permission. you must prove you do (85%). - cultivated land (crops, hay, orchard): treat as no hunting without permission (70%). verify wording. - a \"no hunting\" sign may not be a trespass sign, but respect it anyway (65%, secondary). motor vehicle closures - motor vehicle closed areas (old name: access management areas) ban some or all vehicles, or only atvs or snowmobiles (85%). - motor vehicle hunting closed areas ban using a vehicle to hunt, carry hunters, gear or game (85%). - region 3 maps: gov.bc.ca/thompsonaccess (https://www.gov.bc.ca/thompsonaccess) (80%). - areas near heffley creek and sun peaks: verify on the map. - fire season closures and gates also apply. check bc wildfire service. tip. banned methods method rule --- --- rimfire on big game not allowed (80%) .22 rimfire on grouse or quail verify in synopsis firearm table lights or spotlights never hunt with a light (80%) night hunting banned outside legal hours (85%) drones no drone on a hunting trip. no drone info from under 6 hours before (85%) electronic calls banned, except wolf, coyote, cougar, lynx, bobcat and some listed birds (85%) dogs for deer leash only (80%). grouse and quail: unleashed dog ok (80%) feeding or baiting deer banned within 200 m of a home, school yard or playground in regions 3 and 8 (80%). bait for deer elsewhere: verify electronic firing mechanism not allowed (80%) ducks and geese (federal) - non toxic shot only for ducks, geese, coots and snipe. no lead (85%). - shotgun no larger than 10 gauge (85%). - holds 3 shells max , chamber plus magazine. plug must need the gun taken apart to remove (85%). - no hunting from a moving boat with a motor or sail (85%). - ok when the boat is beached, anchored or tied off (80%). - a motorboat may chase a wounded bird to retrieve it (85%). - possession limit: 3 times the daily limit, at all times, including at home (85%). - daily limits for 2026 to 2027: verify in the rules tab. ducks: the bird in your cooler - unpreserved birds keep one fully feathered wing or the fully feathered head attached (85%). - store birds so each can be counted and identified. no frozen block of ducks (80%). - \"preserved\" means fully processed for storage, for example frozen and plucked. exact definition: verify. - tip: leave a wing on until the duck is in your home freezer. deer: tag and evidence - notch the species licence right after the kill, before you move the animal (85%). see phase 1 session 13. - evidence of sex stays naturally attached until the meat is home, at a cutter, in cold storage, or inspected (75%, secondary). - buck: the part of the head with antlers, or testicles or penis plus the tail or a patch of hide (75%, secondary). - doe: the part of the head where antlers would be, or udder or teats plus the tail or a patch of hide (75%, secondary). - antler restricted season (like 4 point): keep antlers attached to part of the skull (75%). - exact hide patch size: verify. meat wastage - you must remove the edible portions (85%). - deer edible portions: neck, ribs, all four quarters and the loins (85%). - game birds (ducks, quail, grouse): both breasts (85%). - leave guts and bones at the kill site, or take them to a landfill (85%). - you may give the animal to someone who then takes the edible portions out (85%). cwd (chronic wasting disease) - cwd is confirmed in the kootenay region (85%). - cwd management zone: mu (management unit) 4-1 to 4-8 and 4-20 to 4-25 (85%). - in that zone: mandatory cwd test for every deer, elk and moose, within one week (85%). - no brain or spinal column (tail ok) taken out of that zone (85%). - region 3 and region 8 are not in the zone (85%, from the mu list). - bringing cervid (deer family) parts in from outside bc is restricted (65%, secondary). verify before any hunt outside bc. - deer urine lures from outside bc: may be banned (60%). verify. tip: use none. transporting firearms (federal) - unloaded while in a vehicle (85%). - non restricted rifle or shotgun: no case or trigger lock needed while you travel (85%). - leaving it in the vehicle: lock it in the trunk or a locked compartment. no trunk: out of sight in the locked vehicle (85%). - no special permit to carry a non restricted firearm. your pal (possession and acquisition licence) is enough (85%). - ammunition can travel with it, just not in it (80%). giving away meat, and helpers - anyone carrying your game without you needs a record of receipt (85%). - record of receipt shows: date and place, your name and address, who receives it, your fwid (fish and wildlife id), the species licence number, species and sex (85%). - your brother hunts too. he needs his own hunting licence, species licences and federal bird permit (85%). - each hunter notches only his own licence, for the animal he killed. shooting a deer for the other person's tag: verify. treat as not allowed. - ducks: each hunter has his own daily limit. do not pool birds. tip. - carrying his deer while he is not with you: you need his record of receipt (85%). - friends you give meat to at home: write a short record of receipt anyway. tip. - selling game meat: verify. treat as not allowed. wounded animal on closed or private land - the trespass act has no exception for tracking wounded game (70%, secondary). - posted or fenced land: ask the owner first. written permission is best (70%). - owner says no, or can't be found: call a conservation officer. tip. - animal ran into a park or no shooting area: do not fire there. call a conservation officer. tip. - you must still make a real effort to recover wounded game (70%). verify the exact rule. reporting poaching - rapp (report all poachers and polluters): 1 877 952 7277 (85%). - cell: 7277 (75%). - open 24 hours, 7 days. you can stay anonymous (85%). - note: plate, vehicle, place, time, what you saw. never confront. tip. !rule if you have to ask \"is this legal?\", the answer today is no. find out at home, then come back. !mistake - a full magazine in the rifle in the truck. that is loaded in bc. - a quick shot from the road or the atv seat. - freezing ducks with no wing or head attached. !field before each trip: open the synopsis map for your mu. mark no shooting areas, closures and buildings on your phone map. sources - bc hunting and trapping regulations synopsis 2026 to 2028, full pdf (https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis.pdf) (search preview), checked 2026-10-01: loaded, vehicles, roads, 100 m, hours, banned methods, parks, edible portions, record of receipt. - region 3 thompson synopsis (https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis-region-3-thompson.pdf) (search preview), checked 2026-10-01: kamloops maps, closures, baiting. - region 8 okanagan synopsis (https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis-region-8-okanagan.pdf) (search preview), checked 2026-10-01: baiting. - hunting regulation, b.c. reg. 190/84 (https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/190_84_01) (search preview), checked 2026-10-01: hours. - trespass act (https://www.bclaws.gov.bc.ca/civix/document/id/consol21/consol21/00_96462_01) (search preview), checked 2026-10-01. - bc cwd page (https://www2.gov.bc.ca/gov/content/environment/plants-animals-ecosystems/wildlife/wildlife-conservation/wildlife-health/chronic-wasting-disease/cwd-bc) (search preview), checked 2026-10-01. - bc rapp page (https://www2.gov.bc.ca/gov/content/environment/natural-resource-stewardship/natural-resource-law-enforcement/conservation-officer-service/cos-rapp) (search preview), checked 2026-10-01. - bc hunting faq (https://www2.gov.bc.ca/gov/content/sports-culture/recreation/fishing-hunting/hunting/frequently-asked-questions) (search preview), checked 2026-10-01. - migratory birds regulations, 2022 (https://laws-lois.justice.gc.ca/eng/regulations/sor-2022-105/fulltext.html) (search preview), checked 2026-10-01. - eccc (environment and climate change canada) bc migratory bird summary (https://www.canada.ca/en/environment-climate-change/services/migratory-game-bird-hunting/regulations-provincial-territorial-summaries/british-columbia.html) (search preview), checked 2026-10-01. - rcmp (royal canadian mounted police): storing, transporting and displaying firearms (https://rcmp.ca/en/firearms/firearms-safety-training-transport-and-storage/storing-transporting-and-displaying-firearms) (search preview), checked 2026-10-01. - storage, display, transportation and handling of firearms by individuals regulations, sor/98-209 (https://laws-lois.justice.gc.ca/eng/regulations/sor-98-209/) (search preview), checked 2026-10-01. - secondary, 60 to 79% max: bc firearms academy, evidence of sex (https://bcfirearmsacademy.ca/possession-transportation-big-game/); huntingbc forum, wounded game on private land (https://www.huntingbc.ca/forum/archive/index.php/t-92535.html); cwd info.org bc page (https://cwd-info.org/regulations/british-columbia-cwd-regulations/); agcanada, attractant ban (https://www.agcanada.com/daily/b-c-to-block-hunting-attractants-from-out-of-province). checked 2026-10-01. "},{"id":"wind-thermals","phase":2,"num":10,"title":"Wind and thermals","minutes":10,"checked":"2026-10-01","steps":[{"title":"Wind and thermals","html":"<aside class=\"callout why\"><div class=\"callout-t\">Why it matters<\/div><p>A deer that smells you is gone before you see it. You cannot hide scent, but you can put it where deer are not.<\/p><\/aside>"},{"title":"How scent moves","html":"<ul><li>Your scent drifts with the air, like smoke from a campfire.<\/li><li>Deer rely heavily on smell to detect danger <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Deer often travel with the wind at their back or side so they can smell behind and look ahead (60%, hunter observation).<\/li><li>Steady wind is your friend. Shifting, light wind is the danger.<\/li><li>Rule of thumb: keep the deer <strong>upwind<\/strong> of you. The wind blows from the deer to you.<\/li><\/ul>"},{"title":"Thermals: morning up, evening down","html":"<ul><li>Thermals are air currents made by the ground warming and cooling <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li><strong>Morning:<\/strong> the sun warms slopes and air rises <strong>uphill<\/strong> <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li><strong>Evening:<\/strong> slopes cool and air sinks <strong>downhill<\/strong>, into draws and valley floors <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Shaded north slopes and timber stay cool longer, so the switch comes later there (Tip).<\/li><li>On calm days, thermals beat the light breeze. In strong wind, the wind wins (Tip).<\/li><\/ul><figure class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 520\" font-family=\"sans-serif\">\n  <defs>\n    <marker id=\"th-arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\n      <path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#e8590c\"/>\n    <\/marker>\n  <\/defs>\n  <rect x=\"0\" y=\"0\" width=\"400\" height=\"520\" fill=\"#fffaf0\"/>\n  <text x=\"200\" y=\"26\" font-size=\"18\" font-weight=\"bold\" fill=\"#23261f\" text-anchor=\"middle\">Morning: sun warms slope, air rises<\/text>\n  <circle cx=\"350\" cy=\"62\" r=\"16\" fill=\"#e8590c\" fill-opacity=\"0.6\" stroke=\"#e8590c\" stroke-width=\"2\"/>\n  <path d=\"M10,240 L120,200 L260,90 L300,80 L390,150 L390,240 Z\" fill=\"#8a9a6b\" stroke=\"#2f3a2b\" stroke-width=\"2\"/>\n  <path d=\"M90,190 L150,160\" fill=\"none\" stroke=\"#e8590c\" stroke-width=\"3\" marker-end=\"url(#th-arrow)\"/>\n  <path d=\"M160,148 L215,108\" fill=\"none\" stroke=\"#e8590c\" stroke-width=\"3\" marker-end=\"url(#th-arrow)\"/>\n  <path d=\"M225,96 L262,68\" fill=\"none\" stroke=\"#e8590c\" stroke-width=\"3\" marker-end=\"url(#th-arrow)\"/>\n  <circle cx=\"275\" cy=\"76\" r=\"9\" fill=\"#6b4f35\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <text x=\"275\" y=\"60\" font-size=\"15\" fill=\"#23261f\" text-anchor=\"middle\" font-weight=\"bold\">You<\/text>\n  <ellipse cx=\"80\" cy=\"212\" rx=\"14\" ry=\"8\" fill=\"#6b4f35\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <text x=\"62\" y=\"186\" font-size=\"15\" fill=\"#23261f\" text-anchor=\"middle\" font-weight=\"bold\">Deer<\/text>\n  <text x=\"200\" y=\"230\" font-size=\"15\" fill=\"#23261f\" text-anchor=\"middle\">Be ABOVE. Scent goes up, away.<\/text>\n  <line x1=\"20\" y1=\"262\" x2=\"380\" y2=\"262\" stroke=\"#8a9a6b\" stroke-width=\"2\"/>\n  <text x=\"200\" y=\"292\" font-size=\"18\" font-weight=\"bold\" fill=\"#23261f\" text-anchor=\"middle\">Evening: slope cools, air sinks<\/text>\n  <circle cx=\"350\" cy=\"322\" r=\"14\" fill=\"#8a9a6b\" stroke=\"#2f3a2b\" stroke-width=\"2\"/>\n  <path d=\"M10,500 L120,460 L260,350 L300,340 L390,410 L390,500 Z\" fill=\"#8a9a6b\" stroke=\"#2f3a2b\" stroke-width=\"2\"/>\n  <path d=\"M245,352 L195,390\" fill=\"none\" stroke=\"#e8590c\" stroke-width=\"3\" marker-end=\"url(#th-arrow)\"/>\n  <path d=\"M185,400 L135,437\" fill=\"none\" stroke=\"#e8590c\" stroke-width=\"3\" marker-end=\"url(#th-arrow)\"/>\n  <path d=\"M120,450 L70,470\" fill=\"none\" stroke=\"#e8590c\" stroke-width=\"3\" marker-end=\"url(#th-arrow)\"/>\n  <ellipse cx=\"270\" cy=\"338\" rx=\"14\" ry=\"8\" fill=\"#6b4f35\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <text x=\"270\" y=\"320\" font-size=\"15\" fill=\"#23261f\" text-anchor=\"middle\" font-weight=\"bold\">Deer<\/text>\n  <circle cx=\"60\" cy=\"470\" r=\"9\" fill=\"#6b4f35\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <text x=\"48\" y=\"448\" font-size=\"15\" fill=\"#23261f\" text-anchor=\"middle\" font-weight=\"bold\">You<\/text>\n  <text x=\"250\" y=\"485\" font-size=\"15\" fill=\"#23261f\" text-anchor=\"middle\">Be BELOW. Scent sinks, away.<\/text>\n<\/svg>\n<\/figure>"},{"title":"Swirls and eddies","html":"<ul><li>Wind swirls in draws, saddles, valleys and thick timber, where air bounces off terrain <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Swirl also happens around the switch time, mid morning and near sunset, as thermals change direction (Tip).<\/li><li>Lakes and creeks: cold air often slides down creek bottoms in the evening (Tip).<\/li><li>In a swirl, no setup is safe. Back out and come back with steadier air.<\/li><\/ul>"},{"title":"How to check the wind","html":"<ul><li><strong>Puffer bottle:<\/strong> a squeeze bottle of unscented powder. One puff shows drift and direction <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li><strong>Milkweed fluff:<\/strong> floats far and shows thermals and swirls over terrain <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li><strong>Lighter flame:<\/strong> quick check, shows only the air right at your hand (Tip). Mind fire risk in dry grass.<\/li><li><strong>Thread<\/strong> on your bow or rifle sling: always on, no hands (Tip).<\/li><li>Check every few minutes and at every new terrain feature, not just at the truck.<\/li><\/ul><aside class=\"callout tip\"><div class=\"callout-t\">Tip (opinion)<\/div><p>Milkweed is the best teacher. Watch one tuft for 30 seconds. You will see it climb, stall and curl back on itself.<\/p><\/aside>"},{"title":"Planning your approach","html":"<ol><li>Check the forecast wind direction and speed the night before.<\/li><li>On the map, mark likely bedding and feeding areas.<\/li><li>Mornings: come in from <strong>above<\/strong> or from the side so rising air carries scent up and away.<\/li><li>Evenings: sit <strong>below<\/strong> or to the side so sinking air carries scent down and away.<\/li><li>Plan an A and B spot for each wind. Wrong wind on the day? Go to B, do not force A.<\/li><li>Walk in with the wind in your face or across you, never at your back toward the deer.<\/li><\/ol><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>Grandpa's rule (wisdom): Hunt the wind you have, not the wind you wanted.<\/p><\/aside><aside class=\"callout mistake\"><div class=\"callout-t\">Common mistakes<\/div><ul><li>Checking wind once at the truck, then hunting a valley where it swirls.<\/li><li>Sitting on a morning ridge above deer that are bedded higher up, so rising air takes your scent right to them.<\/li><li>Ignoring the evening switch and staying at a midday spot as air begins to sink.<\/li><\/ul><\/aside><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>On a scouting day, stand mid slope at 7 am, 12 noon and 5 pm. Puff the bottle or release milkweed each time. Note which way it goes in your journal.<\/p><\/aside>"},{"title":"Sources","html":"<ul><li><a href=\"https://www.themeateater.com/wired-to-hunt/whitetail-hunting/understanding-thermals-in-whitetail-country\" target=\"_blank\" rel=\"noopener\">MeatEater: Understanding thermals in whitetail country<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://realtree.com/articles/big-game-hunting/how-to-read-and-understand-mountain-wind\" target=\"_blank\" rel=\"noopener\">Realtree: How to read and understand mountain wind<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://mossyoakgamekeeper.com/wildlife-management/whitetail-deer/deer-hunting-in-wind-and-thermals/\" target=\"_blank\" rel=\"noopener\">Mossy Oak Gamekeeper: Deer hunting in wind and thermals<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"http://www.buckmasters.com/Hunting/Tips-and-Tactics/Articles/ID/543/Natural-Wind-Detector\" target=\"_blank\" rel=\"noopener\">Buckmasters: Natural wind detector (milkweed)<\/a>, checked 2026-10-01 (search preview)<\/li><li>Hunt Mentor deer research notes, research/2026-10-01-deer.md, thermals line <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span><\/li><li>Note: thermals are basic physics. Hunting use is hunter experience, labelled Tip.<\/li><\/ul>"}],"quiz":[{"q":"Which way do thermals usually move on a sunny morning?","options":["Downhill","Uphill","They do not move"],"answer":1,"why":"The sun warms the slope and the warm air rises uphill."},{"q":"Evening hunt on a calm day. Where do you set up?","options":["Above the deer","Below or beside the deer","Directly downhill in the deer's path, wind at your back"],"answer":1,"why":"Evening air sinks downhill. Sitting below or to the side means your scent sinks away from the deer."},{"q":"Your milkweed drifts left, then curls back to you. What is happening?","options":["Steady wind","A swirl. Your scent is going everywhere","Thermals stopped"],"answer":1,"why":"Curling and doubling back is a swirl. No setup is safe in a swirl."},{"q":"Wind on hunt day is wrong for your planned spot. Best move?","options":["Hunt it anyway","Go to your B spot that fits this wind","Add cover scent"],"answer":1,"why":"Plan an A and B spot for each wind. Forcing a bad wind educates deer."}],"checklists":[],"text":" !why a deer that smells you is gone before you see it. you cannot hide scent, but you can put it where deer are not. how scent moves - your scent drifts with the air, like smoke from a campfire. - deer rely heavily on smell to detect danger (70%). - deer often travel with the wind at their back or side so they can smell behind and look ahead (60%, hunter observation). - steady wind is your friend. shifting, light wind is the danger. - rule of thumb: keep the deer upwind of you. the wind blows from the deer to you. thermals: morning up, evening down - thermals are air currents made by the ground warming and cooling (75%). - morning: the sun warms slopes and air rises uphill (75%). - evening: slopes cool and air sinks downhill , into draws and valley floors (75%). - shaded north slopes and timber stay cool longer, so the switch comes later there (tip). - on calm days, thermals beat the light breeze. in strong wind, the wind wins (tip). swirls and eddies - wind swirls in draws, saddles, valleys and thick timber, where air bounces off terrain (70%). - swirl also happens around the switch time, mid morning and near sunset, as thermals change direction (tip). - lakes and creeks: cold air often slides down creek bottoms in the evening (tip). - in a swirl, no setup is safe. back out and come back with steadier air. how to check the wind - puffer bottle: a squeeze bottle of unscented powder. one puff shows drift and direction (70%). - milkweed fluff: floats far and shows thermals and swirls over terrain (70%). - lighter flame: quick check, shows only the air right at your hand (tip). mind fire risk in dry grass. - thread on your bow or rifle sling: always on, no hands (tip). - check every few minutes and at every new terrain feature, not just at the truck. !tip milkweed is the best teacher. watch one tuft for 30 seconds. you will see it climb, stall and curl back on itself. planning your approach 1. check the forecast wind direction and speed the night before. 2. on the map, mark likely bedding and feeding areas. 3. mornings: come in from above or from the side so rising air carries scent up and away. 4. evenings: sit below or to the side so sinking air carries scent down and away. 5. plan an a and b spot for each wind. wrong wind on the day? go to b, do not force a. 6. walk in with the wind in your face or across you, never at your back toward the deer. !rule grandpa's rule (wisdom): hunt the wind you have, not the wind you wanted. !mistake - checking wind once at the truck, then hunting a valley where it swirls. - sitting on a morning ridge above deer that are bedded higher up, so rising air takes your scent right to them. - ignoring the evening switch and staying at a midday spot as air begins to sink. !field on a scouting day, stand mid slope at 7 am, 12 noon and 5 pm. puff the bottle or release milkweed each time. note which way it goes in your journal. sources - meateater: understanding thermals in whitetail country (https://www.themeateater.com/wired-to-hunt/whitetail-hunting/understanding-thermals-in-whitetail-country), checked 2026-10-01 (search preview) - realtree: how to read and understand mountain wind (https://realtree.com/articles/big-game-hunting/how-to-read-and-understand-mountain-wind), checked 2026-10-01 (search preview) - mossy oak gamekeeper: deer hunting in wind and thermals (https://mossyoakgamekeeper.com/wildlife-management/whitetail-deer/deer-hunting-in-wind-and-thermals/), checked 2026-10-01 (search preview) - buckmasters: natural wind detector (milkweed) (http://www.buckmasters.com/hunting/tips-and-tactics/articles/id/543/natural-wind-detector), checked 2026-10-01 (search preview) - hunt mentor deer research notes, research/2026-10-01-deer.md, thermals line (80%) - note: thermals are basic physics. hunting use is hunter experience, labelled tip. "},{"id":"glassing","phase":2,"num":11,"title":"Glassing","minutes":10,"checked":"2026-10-01","steps":[{"title":"Glassing","html":"<aside class=\"callout why\"><div class=\"callout-t\">Why it matters<\/div><p>In open Interior country you find more deer with your eyes than with your boots. <button class=\"term\" data-term=\"Glassing\">Glassing<\/button> lets you see them before they see you.<\/p><\/aside>"},{"title":"Binocular technique","html":"<ul><li>Set the eye cups and the right eye dial (diopter) once at home. Mark the setting.<\/li><li>Brace. Elbows on knees, back on a tree or pack. Shaking binoculars hide deer.<\/li><li>Hold still and let the view settle. Move the binoculars, not your eyes inside them (Tip).<\/li><li>Look through the binoculars for a long time, rest your eyes for a few seconds, then go back (Tip).<\/li><li>Use a hat brim or hand to cut glare when the sun is low in front of you.<\/li><\/ul>"},{"title":"Tripods","html":"<ul><li>A tripod steadies the binoculars and stops arm fatigue on long sessions <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>.<\/li><li>Many western hunters rate a tripod as a bigger upgrade than better glass (60%, hunter opinion).<\/li><li>A light tripod and a binocular adapter is enough to start.<\/li><li>Steady glass shows small movement: a tail flick at 800 m (875 yd) you would miss handheld (Tip).<\/li><\/ul><aside class=\"callout lean\"><div class=\"callout-t\">My lean (opinion)<\/div><p>Start with the binoculars you have plus a cheap tripod adapter. Upgrade glass later, once you know what you use.<\/p><\/aside>"},{"title":"The grid method","html":"<ol><li>Pick a spot with a wide view and the wind right (see Wind and thermals).<\/li><li>Quick scan first: open slopes, cut blocks, edges where deer are easy to see <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>.<\/li><li>Then split the view into a grid in your head <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>.<\/li><li>Start at one corner. Glass one strip slowly, left to right <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>.<\/li><li>Overlap each binocular view by about a third so nothing falls in a gap <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>.<\/li><li>Drop down one strip and come back right to left <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>.<\/li><li>Then glass it again. Deer stand up, move and turn as light changes.<\/li><\/ol>"},{"title":"What to look for","html":"<ul><li>Do not look for a whole deer. Look for <strong>parts<\/strong> <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>.<\/li><li>A <strong>horizontal line<\/strong> in a world of vertical trees: a back or belly <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>.<\/li><li><strong>Vertical legs<\/strong> under a shape that does not belong <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>.<\/li><li>An <strong>ear flick<\/strong> or tail twitch. Movement is the giveaway.<\/li><li>The <strong>white rump<\/strong> of a mule deer, or the flash of a white tail (Tip).<\/li><li>A shape that is the wrong colour: grey brown body against green or yellow.<\/li><li>Antler tips catching light, or a shiny black nose.<\/li><\/ul>"},{"title":"Best times and places","html":"<ul><li>Deer are most active at dawn and dusk <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Glass first light and the last hour before legal shooting light ends (Tip). Legal shooting hours: see the synopsis. <span class=\"verify\">VERIFY<\/span> times for each date.<\/li><li>Midday: glass shade, timber edges and benches where deer bed (Tip).<\/li><li>Glass from above, with the sun behind you, so deer are lit and you are not (Tip).<\/li><li>Near Sun Peaks: cut blocks, burns, open grass slopes and timber edges (Tip, check on your map).<\/li><\/ul><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>Grandpa's rule (wisdom): Sit longer than you think. When you want to move, glass it one more time.<\/p><\/aside><aside class=\"callout mistake\"><div class=\"callout-t\">Common mistakes<\/div><ul><li>Sweeping the binoculars fast across a hillside, like a camera pan.<\/li><li>Looking only for a whole standing deer in the open.<\/li><li>Glassing straight into a rising or setting sun.<\/li><\/ul><\/aside><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>Pick a hillside. Set a 20 minute timer. Glass it with the grid twice. Write down every thing you thought might be a deer, then check it.<\/p><\/aside>"},{"title":"Sources","html":"<ul><li><a href=\"https://www.gohunt.com/browse/tips-and-tricks/glassing/the-three-pillars-of-glassing-and-how-they-will-help-you-find-more-big-game\" target=\"_blank\" rel=\"noopener\">goHUNT: The three pillars of glassing<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://www.themeateater.com/hunt/general/what-you-need-to-know-about-glassing-terrain\" target=\"_blank\" rel=\"noopener\">MeatEater: What you need to know about glassing terrain<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://www.outdoorbenchmark.com/big-game-hunting/glassing-strategy-guide\" target=\"_blank\" rel=\"noopener\">Outdoor Benchmark: Glassing for big game<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://www.wideopenspaces.com/heres-glass-mule-deer-increase-odds-filling-tag/\" target=\"_blank\" rel=\"noopener\">Wide Open Spaces: How to glass for mule deer<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://www.sitkagear.com/experience/what-colors-can-deer-see\" target=\"_blank\" rel=\"noopener\">Sitka: What colours can deer see (crepuscular activity)<\/a>, checked 2026-10-01 (search preview)<\/li><li>Hunt Mentor deer research notes, research/2026-10-01-deer.md (60%, hunter consensus)<\/li><li>Note: glassing is a skill, not a rule. Most points are hunter experience, labelled Tip.<\/li><\/ul>"}],"quiz":[{"q":"What should you look for when glassing?","options":["A whole deer standing in the open","Parts: a horizontal back, legs, an ear flick, a white rump","Only antlers"],"answer":1,"why":"Deer are usually partly hidden. Look for pieces and movement that do not belong."},{"q":"Why use a tripod?","options":["It looks pro","Steady glass and less fatigue, so you see small movement","It is required"],"answer":1,"why":"A steady view shows a tail flick or ear twitch you miss with shaky hands."},{"q":"How do you glass a hillside with the grid method?","options":["Fast sweeps back and forth","Slow strips with overlap, corner to corner, then repeat","Only the middle"],"answer":1,"why":"Slow overlapping strips leave no gaps. Glass it again because deer move and light changes."},{"q":"When are deer most active?","options":["Midday","Dawn and dusk","Midnight only"],"answer":1,"why":"Deer are most active around dawn and dusk. Be glassing at first light."}],"checklists":[],"text":" !why in open interior country you find more deer with your eyes than with your boots. glassing lets you see them before they see you. binocular technique - set the eye cups and the right eye dial (diopter) once at home. mark the setting. - brace. elbows on knees, back on a tree or pack. shaking binoculars hide deer. - hold still and let the view settle. move the binoculars, not your eyes inside them (tip). - look through the binoculars for a long time, rest your eyes for a few seconds, then go back (tip). - use a hat brim or hand to cut glare when the sun is low in front of you. tripods - a tripod steadies the binoculars and stops arm fatigue on long sessions (65%). - many western hunters rate a tripod as a bigger upgrade than better glass (60%, hunter opinion). - a light tripod and a binocular adapter is enough to start. - steady glass shows small movement: a tail flick at 800 m (875 yd) you would miss handheld (tip). !lean start with the binoculars you have plus a cheap tripod adapter. upgrade glass later, once you know what you use. the grid method 1. pick a spot with a wide view and the wind right (see wind and thermals). 2. quick scan first: open slopes, cut blocks, edges where deer are easy to see (65%). 3. then split the view into a grid in your head (65%). 4. start at one corner. glass one strip slowly, left to right (65%). 5. overlap each binocular view by about a third so nothing falls in a gap (60%). 6. drop down one strip and come back right to left (65%). 7. then glass it again. deer stand up, move and turn as light changes. what to look for - do not look for a whole deer. look for parts (65%). - a horizontal line in a world of vertical trees: a back or belly (65%). - vertical legs under a shape that does not belong (65%). - an ear flick or tail twitch. movement is the giveaway. - the white rump of a mule deer, or the flash of a white tail (tip). - a shape that is the wrong colour: grey brown body against green or yellow. - antler tips catching light, or a shiny black nose. best times and places - deer are most active at dawn and dusk (70%). - glass first light and the last hour before legal shooting light ends (tip). legal shooting hours: see the synopsis. verify times for each date. - midday: glass shade, timber edges and benches where deer bed (tip). - glass from above, with the sun behind you, so deer are lit and you are not (tip). - near sun peaks: cut blocks, burns, open grass slopes and timber edges (tip, check on your map). !rule grandpa's rule (wisdom): sit longer than you think. when you want to move, glass it one more time. !mistake - sweeping the binoculars fast across a hillside, like a camera pan. - looking only for a whole standing deer in the open. - glassing straight into a rising or setting sun. !field pick a hillside. set a 20 minute timer. glass it with the grid twice. write down every thing you thought might be a deer, then check it. sources - gohunt: the three pillars of glassing (https://www.gohunt.com/browse/tips-and-tricks/glassing/the-three-pillars-of-glassing-and-how-they-will-help-you-find-more-big-game), checked 2026-10-01 (search preview) - meateater: what you need to know about glassing terrain (https://www.themeateater.com/hunt/general/what-you-need-to-know-about-glassing-terrain), checked 2026-10-01 (search preview) - outdoor benchmark: glassing for big game (https://www.outdoorbenchmark.com/big-game-hunting/glassing-strategy-guide), checked 2026-10-01 (search preview) - wide open spaces: how to glass for mule deer (https://www.wideopenspaces.com/heres-glass-mule-deer-increase-odds-filling-tag/), checked 2026-10-01 (search preview) - sitka: what colours can deer see (crepuscular activity) (https://www.sitkagear.com/experience/what-colors-can-deer-see), checked 2026-10-01 (search preview) - hunt mentor deer research notes, research/2026-10-01-deer.md (60%, hunter consensus) - note: glassing is a skill, not a rule. most points are hunter experience, labelled tip. "},{"id":"still-hunting","phase":2,"num":12,"title":"Moving quietly","minutes":10,"checked":"2026-10-01","steps":[{"title":"Moving quietly","html":"<aside class=\"callout why\"><div class=\"callout-t\">Why it matters<\/div><p>Most beginners walk through the bush at a hiking pace. Deer hear and see them long before. Slow down and the woods change.<\/p><\/aside>"},{"title":"Still hunting vs stalking","html":"<ul><li><strong>Still hunting:<\/strong> walking very slowly through deer cover, hoping to see a deer before it sees you <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li><strong>Stalking:<\/strong> you have already seen the deer. You close the distance for a shot <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Still hunting suits thick timber and wet, quiet days.<\/li><li>Stalking suits open country after <button class=\"term\" data-term=\"Glassing\">Glassing<\/button>.<\/li><li>Both depend on wind. Read the wind session first.<\/li><\/ul>"},{"title":"Pace","html":"<aside class=\"callout tip\"><div class=\"callout-t\">Tip (opinion)<\/div><p>Move 2 or 3 steps, then stand and look for 20 seconds or more. Some hunters stop for minutes (Tip, hunter method).<\/p><\/aside><ul><li>Look much more than you walk <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>.<\/li><li>Expect to cover very little ground: a few hundred metres an hour is normal (Tip).<\/li><li>Look near as well as far. A bedded deer may be very close <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>.<\/li><li>Before each step, pick where your foot goes next.<\/li><li>Heel down softly, roll to the ball, test before putting weight on it <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>.<\/li><\/ul>"},{"title":"Using cover","html":"<ul><li>Move when the deer's head is down feeding or behind a tree (Tip).<\/li><li>Stay in shade. Avoid the skyline on ridges.<\/li><li>Keep a tree or bush between you and where deer may be, then look around it, not over it (Tip).<\/li><li>Move from one piece of cover to the next. Pause at each.<\/li><li>Freeze when a deer looks up. Wait until it relaxes (Tip).<\/li><\/ul>"},{"title":"Noise: what deer hear best","html":"<ul><li>White tailed deer hear about 0.25 to 30 kilohertz in one study, best at 4 to 8 kilohertz <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>People hear up to about 20 kilohertz. Deer hear higher pitch than we do <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>A second study found deer can hear even higher, past 50 kilohertz <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>.<\/li><li>Sharp, high sounds are the giveaway: zippers, Velcro, nylon scrape, metal on metal (Tip).<\/li><li>A snapped stick can sound like a deer. A steady crunch, crunch rhythm sounds like a person (Tip).<\/li><li>Mule deer hearing studies: none found. Assumption: similar.<\/li><\/ul>"},{"title":"Clothing and kit noise","html":"<ul><li>Wool and brushed fleece are quieter in brush than hard nylon shells (Tip).<\/li><li>Tape or wrap metal parts that clink: sling swivels, buckles, knife sheath (Tip).<\/li><li>Swap Velcro pockets for buttons or magnets, or leave them open.<\/li><li>Before you leave the truck, jump up and down. Fix anything that rattles.<\/li><li>Keep the gun's action and safety quiet. Practise moving the safety slowly at home.<\/li><\/ul><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>Grandpa's rule (wisdom): If you think you are going slow enough, halve it.<\/p><\/aside><aside class=\"callout mistake\"><div class=\"callout-t\">Common mistakes<\/div><ul><li>Walking at hiking pace and calling it still hunting.<\/li><li>Only looking far ahead and walking past a bedded deer at 20 m (22 yd).<\/li><li>A swishing nylon jacket and a Velcro pocket opened next to a feeding deer.<\/li><\/ul><\/aside><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>On your scouting day, still hunt 200 m (219 yd) of timber and time it. Aim for 30 minutes or more. Your brother walks the same line behind you and tells you every noise he hears.<\/p><\/aside>"},{"title":"Sources","html":"<ul><li><a href=\"https://wildlife.onlinelibrary.wiley.com/doi/abs/10.2193/2006-326\" target=\"_blank\" rel=\"noopener\">D'Angelo and others, 2007, Hearing range of white tailed deer by auditory brainstem response, Journal of Wildlife Management<\/a>, checked 2026-10-01 (search preview of abstract)<\/li><li><a href=\"https://www.researchgate.net/publication/42438287_The_behavioral_audiogram_of_whitetail_deer_Odocoileus_virginianus\" target=\"_blank\" rel=\"noopener\">Heffner and Heffner, behavioral audiogram of whitetail deer (ResearchGate)<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://fieldandstream.com/stories/hunting/still-hunting\" target=\"_blank\" rel=\"noopener\">Field and Stream: Mastering still hunting<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://nadeerhunter.com/7-steps-for-still-hunting/\" target=\"_blank\" rel=\"noopener\">North American Deer Hunter: 7 steps for still hunting<\/a>, checked 2026-10-01 (search preview)<\/li><li><a href=\"https://prohunt.com/articles/still-hunting-techniques-guide/\" target=\"_blank\" rel=\"noopener\">ProHunt: Still hunting techniques guide<\/a>, checked 2026-10-01 (search preview)<\/li><li>Note: pace and cover advice is hunter experience, labelled Tip. Hearing figures are from peer reviewed studies.<\/li><\/ul>"}],"quiz":[{"q":"What is the difference between still hunting and stalking?","options":["None","Still hunting is slow walking to find a deer. Stalking is closing in on a deer you have seen","Stalking is done from a blind"],"answer":1,"why":"Still hunting searches. Stalking closes the gap on a deer you already spotted."},{"q":"Which sound most likely spooks a deer?","options":["A low rumble far away","A zipper or Velcro rip close by","Wind in the trees"],"answer":1,"why":"Deer hear high pitch well, better than people. Zippers, Velcro and metal clinks are sharp high sounds."},{"q":"A deer lifts its head and stares your way. What do you do?","options":["Duck down fast","Freeze until it relaxes","Wave to make it move"],"answer":1,"why":"Deer pick up movement. Freezing gives it nothing to react to."},{"q":"A good still hunting pace looks like?","options":["Steady hiking walk","A couple of steps, then a long stop to look","Jogging between trees"],"answer":1,"why":"Look much more than you walk. Short moves, long looks."}],"checklists":[],"text":" !why most beginners walk through the bush at a hiking pace. deer hear and see them long before. slow down and the woods change. still hunting vs stalking - still hunting: walking very slowly through deer cover, hoping to see a deer before it sees you (70%). - stalking: you have already seen the deer. you close the distance for a shot (70%). - still hunting suits thick timber and wet, quiet days. - stalking suits open country after glassing . - both depend on wind. read the wind session first. pace !tip move 2 or 3 steps, then stand and look for 20 seconds or more. some hunters stop for minutes (tip, hunter method). - look much more than you walk (65%). - expect to cover very little ground: a few hundred metres an hour is normal (tip). - look near as well as far. a bedded deer may be very close (65%). - before each step, pick where your foot goes next. - heel down softly, roll to the ball, test before putting weight on it (65%). using cover - move when the deer's head is down feeding or behind a tree (tip). - stay in shade. avoid the skyline on ridges. - keep a tree or bush between you and where deer may be, then look around it, not over it (tip). - move from one piece of cover to the next. pause at each. - freeze when a deer looks up. wait until it relaxes (tip). noise: what deer hear best - white tailed deer hear about 0.25 to 30 kilohertz in one study, best at 4 to 8 kilohertz (75%). - people hear up to about 20 kilohertz. deer hear higher pitch than we do (75%). - a second study found deer can hear even higher, past 50 kilohertz (65%). - sharp, high sounds are the giveaway: zippers, velcro, nylon scrape, metal on metal (tip). - a snapped stick can sound like a deer. a steady crunch, crunch rhythm sounds like a person (tip). - mule deer hearing studies: none found. assumption: similar. clothing and kit noise - wool and brushed fleece are quieter in brush than hard nylon shells (tip). - tape or wrap metal parts that clink: sling swivels, buckles, knife sheath (tip). - swap velcro pockets for buttons or magnets, or leave them open. - before you leave the truck, jump up and down. fix anything that rattles. - keep the gun's action and safety quiet. practise moving the safety slowly at home. !rule grandpa's rule (wisdom): if you think you are going slow enough, halve it. !mistake - walking at hiking pace and calling it still hunting. - only looking far ahead and walking past a bedded deer at 20 m (22 yd). - a swishing nylon jacket and a velcro pocket opened next to a feeding deer. !field on your scouting day, still hunt 200 m (219 yd) of timber and time it. aim for 30 minutes or more. your brother walks the same line behind you and tells you every noise he hears. sources - d'angelo and others, 2007, hearing range of white tailed deer by auditory brainstem response, journal of wildlife management (https://wildlife.onlinelibrary.wiley.com/doi/abs/10.2193/2006-326), checked 2026-10-01 (search preview of abstract) - heffner and heffner, behavioral audiogram of whitetail deer (researchgate) (https://www.researchgate.net/publication/42438287_the_behavioral_audiogram_of_whitetail_deer_odocoileus_virginianus), checked 2026-10-01 (search preview) - field and stream: mastering still hunting (https://fieldandstream.com/stories/hunting/still-hunting), checked 2026-10-01 (search preview) - north american deer hunter: 7 steps for still hunting (https://nadeerhunter.com/7-steps-for-still-hunting/), checked 2026-10-01 (search preview) - prohunt: still hunting techniques guide (https://prohunt.com/articles/still-hunting-techniques-guide/), checked 2026-10-01 (search preview) - note: pace and cover advice is hunter experience, labelled tip. hearing figures are from peer reviewed studies. "},{"id":"mule-deer","phase":4,"num":1,"title":"Mule deer","minutes":20,"checked":"2026-10-01","steps":[{"title":"Mule deer","html":"<aside class=\"callout why\"><div class=\"callout-t\">Why it matters<\/div><p>The mule deer is the deer of the hills around Heffley Creek. Learn its day and you will know where to sit at first light.<\/p><\/aside><ul><li>Mule deer are the main deer of the southern BC Interior <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Your first hunt is mid to late October. That is the <strong>pre rut<\/strong>: bucks start to roam, the big breeding push is still weeks away <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>This session: how to tell one, where it is hour by hour, what it eats, how it hides, and how you hunt it.<\/li><li>The deep dive on senses and alarm is in <a href=\"#/s/deer-mind\">How a deer thinks<\/a>.<\/li><\/ul>"},{"title":"Identify: buck, doe, fawn","html":"<ul><li><strong>Ears:<\/strong> very big, like a mule. That is the name <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Antlers (buck):<\/strong> forks that fork again, like a \"Y\" on a \"Y\" <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Tail:<\/strong> thin, white, rope like, with a <strong>black tip<\/strong> <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Rump:<\/strong> big white patch around the tail <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Doe:<\/strong> same body, no antlers, smaller neck <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Fawn:<\/strong> born in early summer; by October it has lost its spots and is about half the doe's size <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li><strong>Metatarsal gland<\/strong> (scent patch on the outside of the hind leg): long, 10 to 15 cm <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><\/ul><aside class=\"callout tip\"><div class=\"callout-t\">Tip (opinion)<\/div><p>A buck in October has a thick neck. A doe has a thin neck and a long, narrow face. If you can't see antlers clearly, you have not identified a buck.<\/p><\/aside>"},{"title":"Mule deer or white tail?","html":"<figure class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 420\" font-family=\"sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"400\" height=\"420\" fill=\"#fffaf0\"/>\n  <line x1=\"200\" y1=\"10\" x2=\"200\" y2=\"410\" stroke=\"#8a9a6b\" stroke-width=\"2\" stroke-dasharray=\"6 6\" fill=\"none\"/>\n  <text x=\"100\" y=\"30\" font-size=\"18\" font-weight=\"bold\" fill=\"#2f3a2b\" text-anchor=\"middle\">Mule deer<\/text>\n  <text x=\"300\" y=\"30\" font-size=\"18\" font-weight=\"bold\" fill=\"#2f3a2b\" text-anchor=\"middle\">White tail<\/text>\n  <text x=\"200\" y=\"52\" font-size=\"14\" fill=\"#6b4f35\" text-anchor=\"middle\">Antlers (one side, seen from front)<\/text>\n  <!-- mule deer antler: forks that split again -->\n  <g stroke=\"#6b4f35\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\">\n    <path d=\"M100 190 L100 160\"/>\n    <path d=\"M100 160 L70 110\"/>\n    <path d=\"M100 160 L130 110\"/>\n    <path d=\"M70 110 L55 72\"/>\n    <path d=\"M70 110 L85 75\"/>\n    <path d=\"M130 110 L118 74\"/>\n    <path d=\"M130 110 L148 76\"/>\n    <path d=\"M100 178 L86 168\"/>\n  <\/g>\n  <text x=\"100\" y=\"212\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Forks that fork again<\/text>\n  <text x=\"100\" y=\"230\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">(\"Y\" on a \"Y\")<\/text>\n  <!-- whitetail antler: one main beam, tines up -->\n  <g stroke=\"#6b4f35\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\">\n    <path d=\"M250 190 Q240 120 300 100 Q345 90 360 120\"/>\n    <path d=\"M262 140 L258 112\"/>\n    <path d=\"M285 108 L282 72\"/>\n    <path d=\"M315 98 L318 64\"/>\n    <path d=\"M343 102 L350 76\"/>\n  <\/g>\n  <text x=\"300\" y=\"212\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">One main beam,<\/text>\n  <text x=\"300\" y=\"230\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">single tines up<\/text>\n  <text x=\"200\" y=\"262\" font-size=\"14\" fill=\"#6b4f35\" text-anchor=\"middle\">Tail and rump (seen from behind)<\/text>\n  <!-- mule deer rump -->\n  <ellipse cx=\"100\" cy=\"330\" rx=\"48\" ry=\"48\" fill=\"#f3ead8\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <rect x=\"94\" y=\"290\" width=\"12\" height=\"62\" rx=\"6\" fill=\"#f3ead8\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <rect x=\"94\" y=\"340\" width=\"12\" height=\"18\" rx=\"6\" fill=\"#23261f\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <text x=\"100\" y=\"396\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Big white rump,<\/text>\n  <text x=\"100\" y=\"413\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">thin tail, black tip<\/text>\n  <!-- whitetail flag -->\n  <ellipse cx=\"300\" cy=\"345\" rx=\"40\" ry=\"34\" fill=\"#b08a5e\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <path d=\"M300 340 C270 320 268 285 285 275 L300 270 L315 275 C332 285 330 320 300 340 Z\" fill=\"#ffffff\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <text x=\"300\" y=\"300\" font-size=\"12\" fill=\"#6b4f35\" text-anchor=\"middle\">flag up<\/text>\n  <text x=\"300\" y=\"396\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Wide brown tail,<\/text>\n  <text x=\"300\" y=\"413\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">white below, waved up<\/text>\n<\/svg>\n<\/figure><div class=\"tbl\"><table><thead><tr><th>Clue<\/th><th>Mule deer<\/th><th>White tail<\/th><\/tr><\/thead><tbody><tr><td>Antlers<\/td><td>Forks that fork again<\/td><td>One main beam, single tines up<\/td><\/tr><tr><td>Tail<\/td><td>Thin, white, black tip<\/td><td>Wide, brown on top, white under<\/td><\/tr><tr><td>Running away<\/td><td><strong>Stots<\/strong>: all 4 feet hit and push together, bouncing <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/td><td>Gallops, tail up like a white <strong>flag<\/strong> <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/td><\/tr><tr><td>Ears<\/td><td>Very big<\/td><td>Medium<\/td><\/tr><tr><td>Leg gland<\/td><td>Long, 10 to 15 cm <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/td><td>Small <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/td><\/tr><\/tbody><\/table><\/div><ul><li>Both deer live near Heffley Creek. They are <strong>separate tags<\/strong> <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Hybrids exist but are uncommon <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>. When in doubt, do not shoot (Tip).<\/li><\/ul>"},{"title":"A day in the life: late October","html":"<figure class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 300\" font-family=\"sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"400\" height=\"300\" fill=\"#fffaf0\"/>\n  <text x=\"200\" y=\"26\" font-size=\"18\" font-weight=\"bold\" fill=\"#2f3a2b\" text-anchor=\"middle\">A deer day, late October<\/text>\n  <!-- night shading -->\n  <rect x=\"30\" y=\"50\" width=\"99\" height=\"160\" fill=\"#e6e1d3\"/>\n  <rect x=\"285\" y=\"50\" width=\"85\" height=\"160\" fill=\"#e6e1d3\"/>\n  <text x=\"60\" y=\"100\" font-size=\"14\" fill=\"#6b4f35\" text-anchor=\"middle\">dark<\/text>\n  <text x=\"340\" y=\"100\" font-size=\"14\" fill=\"#6b4f35\" text-anchor=\"middle\">dark<\/text>\n  <!-- activity curve -->\n  <path d=\"M30 165 C70 160 95 72 125 72 C150 72 160 178 200 180 C240 178 255 72 290 72 C320 72 335 160 370 165\" fill=\"none\" stroke=\"#e8590c\" stroke-width=\"4\"/>\n  <line x1=\"30\" y1=\"210\" x2=\"370\" y2=\"210\" stroke=\"#23261f\" stroke-width=\"2\" fill=\"none\"/>\n  <!-- ticks: x = 30 + hour*14.17 -->\n  <g font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">\n    <text x=\"30\" y=\"230\">0<\/text>\n    <text x=\"115\" y=\"230\">6<\/text>\n    <text x=\"200\" y=\"230\">12<\/text>\n    <text x=\"285\" y=\"230\">18<\/text>\n    <text x=\"370\" y=\"230\">24<\/text>\n  <\/g>\n  <text x=\"200\" y=\"248\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">hour of day (24 hour clock)<\/text>\n  <text x=\"125\" y=\"62\" font-size=\"14\" font-weight=\"bold\" fill=\"#e8590c\" text-anchor=\"middle\">PEAK<\/text>\n  <text x=\"290\" y=\"62\" font-size=\"14\" font-weight=\"bold\" fill=\"#e8590c\" text-anchor=\"middle\">PEAK<\/text>\n  <text x=\"200\" y=\"203\" font-size=\"14\" fill=\"#2f3a2b\" text-anchor=\"middle\">bedded, chewing cud<\/text>\n  <text x=\"200\" y=\"272\" font-size=\"14\" fill=\"#2f3a2b\" text-anchor=\"middle\">Dawn: feed, then drift to beds<\/text>\n  <text x=\"200\" y=\"292\" font-size=\"14\" fill=\"#2f3a2b\" text-anchor=\"middle\">Dusk: rise, move, feed into the night<\/text>\n<\/svg>\n<\/figure><ul><li><strong>Night (about 21:00 to 04:00):<\/strong> feeds on and off in open grass and brush, rests between bouts <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li><strong>Before first light (04:00 to 07:00):<\/strong> a strong activity peak. Feeding, moving <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Legal light starts:<\/strong> 1 hour before sunrise <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>. Mid to late October sunrise near Kamloops is about 07:30 to 07:50 (calculated) <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>. Use the Legal light screen in Field Mode.<\/li><li><strong>Sunrise to about 09:00:<\/strong> last feeding, then drifts uphill toward cover <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Midday (10:00 to 15:00):<\/strong> bedded. Chews cud. Gets up briefly to stretch, nibble, and re bed <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li><strong>Late afternoon (16:00 to 18:00):<\/strong> rises, browses near the bed, then moves toward open feeding slopes <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li><strong>Sunset (about 17:40 to 18:00) to 21:00:<\/strong> second peak. Out in the open <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Peaks from a telemetry study: about 04:00 to 09:00 and 17:00 to 21:00 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><\/ul><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>Be on your glassing spot 45 minutes before legal light. The first and last hour are when you will see deer.<\/p><\/aside>"},{"title":"How it eats, poops and sleeps","html":"<ul><li><strong>Eats:<\/strong> a browser. Twigs, leaves and buds of shrubs, plus forbs (small leafy plants), with little grass in fall <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Chews cud:<\/strong> a ruminant. It fills up fast, then lies down to chew again <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Poops:<\/strong> piles of oval pellets, about 1 to 1.5 cm long. Firm and dry in fall and winter <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li><strong>How often:<\/strong> roughly 13 to 34 pellet groups a day <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li><strong>Sleeps:<\/strong> in short naps, often with head up or curled, waking often <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li><strong>Walks:<\/strong> slow, stopping to look and listen. Often walks the same trails each day <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li><strong>Drinks:<\/strong> in dry fall weather, near water at dusk or dawn. With green feed and dew, it needs less (Tip).<\/li><\/ul>"},{"title":"Food by season near Kamloops","html":"<ul><li>Study of deer stomachs near Kamloops, September to April <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>:<ul><li>Grass was under 10% of the diet until spring.<\/li><li>More forbs in fall.<\/li><li>Shrubs important in early fall and late winter.<\/li><li>Douglas fir needles peak in December and January.<\/li><\/ul><\/li><li>Key browse: Douglas fir, saskatoon, Oregon grape, red osier dogwood, willow, rose, bitterbrush, rabbitbrush, sagebrush, snowbrush <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li><strong>Late October menu:<\/strong> last green forbs, shrub leaves and twigs, fresh green grass shoots after fall rain <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><\/ul><aside class=\"callout tip\"><div class=\"callout-t\">Tip (opinion)<\/div><p>Learn 3 plants this week: saskatoon, red osier dogwood (red stems) and Oregon grape (holly like leaves). Find them chewed and you are in a feeding area.<\/p><\/aside>"},{"title":"Where they are: BC and near Heffley Creek","html":"<ul><li>Mule deer like steeper, higher, open, broken ground. White tails like valley bottoms and farm fields <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Local reading <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>:<ul><li>Grassland and open Douglas fir benches above the valley.<\/li><li>Up toward Heffley Lake, Paul Lake and Sun Peaks in summer and early fall.<\/li><li>Lower, sunnier slopes as snow comes.<\/li><\/ul><\/li><li>Winter range: south and west facing slopes with old Douglas fir <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>A study of winter range north of Kamloops used slopes below about 760 m <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Rough elevations (Tip, <span class=\"verify\">VERIFY<\/span> on a map): valley 370 to 450 m, Heffley Lake about 950 m, Sun Peaks village about 1,250 m.<\/li><li>Ungulate winter range maps: view the \"Ungulate Winter Range, Approved\" layer in iMapBC <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>. Near Kamloops there may be no approved mule deer areas (<span class=\"verify\">VERIFY<\/span>).<\/li><\/ul><figure class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 340\" font-family=\"sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"400\" height=\"340\" fill=\"#fffaf0\"/>\n  <text x=\"200\" y=\"24\" font-size=\"17\" font-weight=\"bold\" fill=\"#2f3a2b\" text-anchor=\"middle\">Where deer are on a slope<\/text>\n  <!-- ground profile -->\n  <path d=\"M0 300 L110 300 L180 230 L215 222 L250 175 L285 168 L340 80 L400 70 L400 340 L0 340 Z\" fill=\"#d9cfb3\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <!-- trees on bench and upper slope -->\n  <g fill=\"#2f3a2b\">\n    <path d=\"M255 172 L262 145 L269 172 Z\"/>\n    <path d=\"M272 170 L279 140 L286 170 Z\"/>\n    <path d=\"M300 140 L307 112 L314 140 Z\"/>\n    <path d=\"M320 108 L327 80 L334 108 Z\"/>\n    <path d=\"M352 78 L359 52 L366 78 Z\"/>\n  <\/g>\n  <!-- field -->\n  <rect x=\"10\" y=\"292\" width=\"95\" height=\"8\" fill=\"#8a9a6b\"/>\n  <!-- deer dots -->\n  <circle cx=\"40\" cy=\"285\" r=\"6\" fill=\"#6b4f35\"/>\n  <circle cx=\"70\" cy=\"285\" r=\"6\" fill=\"#6b4f35\"/>\n  <circle cx=\"148\" cy=\"254\" r=\"6\" fill=\"#6b4f35\"/>\n  <circle cx=\"265\" cy=\"160\" r=\"6\" fill=\"#e8590c\"/>\n  <circle cx=\"345\" cy=\"70\" r=\"6\" fill=\"#e8590c\"/>\n  <!-- labels -->\n  <text x=\"55\" y=\"322\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Valley fields:<\/text>\n  <text x=\"55\" y=\"338\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">white tails<\/text>\n  <text x=\"185\" y=\"290\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Open grass:<\/text>\n  <text x=\"185\" y=\"306\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">feeding<\/text>\n  <text x=\"275\" y=\"228\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Bench + timber:<\/text>\n  <text x=\"275\" y=\"244\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">day beds<\/text>\n  <text x=\"345\" y=\"44\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Ridge<\/text>\n  <!-- thermals -->\n  <g stroke=\"#e8590c\" stroke-width=\"3\" fill=\"#e8590c\">\n    <line x1=\"60\" y1=\"120\" x2=\"110\" y2=\"80\"/>\n    <path d=\"M110 80 L98 82 L106 92 Z\"/>\n  <\/g>\n  <text x=\"20\" y=\"70\" font-size=\"14\" font-weight=\"bold\" fill=\"#e8590c\">Morning warms:<\/text>\n  <text x=\"20\" y=\"140\" font-size=\"14\" fill=\"#e8590c\">air flows UP<\/text>\n  <g stroke=\"#2f3a2b\" stroke-width=\"3\" fill=\"#2f3a2b\">\n    <line x1=\"230\" y1=\"60\" x2=\"180\" y2=\"100\"/>\n    <path d=\"M180 100 L192 98 L184 88 Z\"/>\n  <\/g>\n  <text x=\"170\" y=\"50\" font-size=\"14\" font-weight=\"bold\" fill=\"#2f3a2b\">Evening cools:<\/text>\n  <text x=\"170\" y=\"122\" font-size=\"14\" fill=\"#2f3a2b\">air flows DOWN<\/text>\n<\/svg>\n<\/figure>"},{"title":"Migration: the big October question","html":"<ul><li>About 74% of tracked mule deer in a southern Interior study migrated <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Average trip about 47 to 55 km one way, up to about 100 km <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>They use the <strong>same route every year<\/strong> <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>What starts the move down: <strong>snow and cold<\/strong>, not the rut <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Timing: back on winter range October to November; in one year nearly all were back by mid October <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Another BC account: interior deer often stay high until December <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Deer avoid snow deeper than about 50 cm <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><\/ul><aside class=\"callout lean\"><div class=\"callout-t\">My lean (opinion)<\/div><p>Early snow up high in October? Hunt the mid slopes below the snow line. No snow yet? Glass the high benches and openings near Heffley Lake and Paul Lake first.<\/p><\/aside>"},{"title":"Senses: what scares and attracts them","html":"<ul><li><strong>Nose:<\/strong> strongest sense. Wind at your back toward the deer ends the hunt <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Ears:<\/strong> hear about 115 Hz (hertz) to 54 kHz (kilohertz), best at 4 to 8 kHz <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>. That is the range of zippers, Velcro, nylon swish and metal clicks.<\/li><li><strong>Eyes:<\/strong> see blues well, no red cone, so blaze orange looks dull to them <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>. They catch <strong>motion and outline<\/strong> fast <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Scares them:<\/strong> human scent, a skyline outline, sudden moves, metal clicks, voices, a slammed truck door (Tip).<\/li><li><strong>Calms them:<\/strong> slow natural walking rhythm, other relaxed deer, steady breeze (Tip).<\/li><li><strong>Attracts them:<\/strong> fresh green feed, does in heat (in the rut), other deer <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Lights: a headlamp beam swinging across a slope will move deer. Use red light and keep it on the ground (Tip).<\/li><li>Full story: <a href=\"#/s/deer-mind\">How a deer thinks<\/a>.<\/li><\/ul>"},{"title":"Social life and the rut","html":"<ul><li>Does live in family groups: mother, daughters and fawns <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Bucks spend summer in <strong>bachelor groups<\/strong> of 2 to 4. These break up in October <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Groups are mostly 5 or fewer. In winter 5 to 8, up to 15 to 30 <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Deer return to the same home range year after year <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Rut<\/strong> (breeding season) for mule deer: mid November to mid December, peak mid November <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li><strong>Late October:<\/strong> bucks spar (push antlers, not real fights), rub small trees, and start checking doe groups <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li><strong>In the rut:<\/strong> a buck tends one doe at a time, follows her, and fights rivals <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>. Bucks get careless in daylight.<\/li><li>Antlers fall off in winter and regrow each year <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><\/ul>"},{"title":"Beds and bedding","html":"<ul><li>Day beds give <strong>hiding cover<\/strong> and <strong>shelter<\/strong> <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Warm days: north facing timber, benches, draws, shade <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Cold days: sunny south and west slopes, out of the wind <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Lore: bucks bed in the top third of a slope, looking down, with wind from behind (hunter lore) <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>.<\/li><li>A bed is an oval of flattened grass or scraped earth, about 1 m long, often with pellets and hair nearby <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Deer bed where they can see danger below and smell danger above (Tip).<\/li><\/ul>"},{"title":"Tracks, scat and sign","html":"<figure class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" font-family=\"sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"400\" height=\"320\" fill=\"#fffaf0\"/>\n  <text x=\"200\" y=\"26\" font-size=\"18\" font-weight=\"bold\" fill=\"#2f3a2b\" text-anchor=\"middle\">Deer track (front foot)<\/text>\n  <!-- two toes (halves of heart), point = toe tips at top -->\n  <path d=\"M195 70 C180 75 160 110 158 160 C156 200 168 225 185 228 C195 229 197 215 197 200 Z\" fill=\"#6b4f35\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <path d=\"M205 70 C220 75 240 110 242 160 C244 200 232 225 215 228 C205 229 203 215 203 200 Z\" fill=\"#6b4f35\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <!-- dewclaws -->\n  <ellipse cx=\"170\" cy=\"262\" rx=\"8\" ry=\"6\" fill=\"#8a9a6b\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <ellipse cx=\"230\" cy=\"262\" rx=\"8\" ry=\"6\" fill=\"#8a9a6b\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <!-- direction arrow -->\n  <g stroke=\"#e8590c\" stroke-width=\"4\" fill=\"#e8590c\">\n    <line x1=\"320\" y1=\"230\" x2=\"320\" y2=\"90\"/>\n    <path d=\"M320 70 L308 94 L332 94 Z\"/>\n  <\/g>\n  <text x=\"320\" y=\"252\" font-size=\"14\" font-weight=\"bold\" fill=\"#e8590c\" text-anchor=\"middle\">Travel<\/text>\n  <text x=\"320\" y=\"270\" font-size=\"14\" font-weight=\"bold\" fill=\"#e8590c\" text-anchor=\"middle\">direction<\/text>\n  <!-- labels -->\n  <line x1=\"200\" y1=\"66\" x2=\"110\" y2=\"60\" stroke=\"#23261f\" stroke-width=\"1.5\" fill=\"none\"/>\n  <text x=\"20\" y=\"56\" font-size=\"14\" fill=\"#23261f\">Pointed tips<\/text>\n  <text x=\"20\" y=\"72\" font-size=\"14\" fill=\"#23261f\">= front<\/text>\n  <line x1=\"160\" y1=\"160\" x2=\"95\" y2=\"160\" stroke=\"#23261f\" stroke-width=\"1.5\" fill=\"none\"/>\n  <text x=\"20\" y=\"150\" font-size=\"14\" fill=\"#23261f\">2 toes<\/text>\n  <text x=\"20\" y=\"166\" font-size=\"14\" fill=\"#23261f\">(split hoof)<\/text>\n  <line x1=\"185\" y1=\"228\" x2=\"110\" y2=\"215\" stroke=\"#23261f\" stroke-width=\"1.5\" fill=\"none\"/>\n  <text x=\"20\" y=\"210\" font-size=\"14\" fill=\"#23261f\">Round heel<\/text>\n  <line x1=\"162\" y1=\"262\" x2=\"110\" y2=\"270\" stroke=\"#23261f\" stroke-width=\"1.5\" fill=\"none\"/>\n  <text x=\"20\" y=\"268\" font-size=\"14\" fill=\"#23261f\">Dewclaws:<\/text>\n  <text x=\"20\" y=\"284\" font-size=\"14\" fill=\"#23261f\">deep mud, snow,<\/text>\n  <text x=\"20\" y=\"300\" font-size=\"14\" fill=\"#23261f\">or running<\/text>\n  <text x=\"200\" y=\"312\" font-size=\"14\" fill=\"#2f3a2b\" text-anchor=\"middle\">About 6 to 10 cm long<\/text>\n<\/svg>\n<\/figure><ul><li>Track: heart shape, 2 toes, pointed end shows direction of travel <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Mule deer front track: about 5.7 to 10 cm long <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>.<\/li><li>You can't tell mule deer from white tail by one track. Too much overlap <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>.<\/li><li>Stotting leaves groups of 4 prints, 2.4 to 4.6 m apart <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>.<\/li><li>Browse sign: deer <strong>tear<\/strong> twigs (no upper front teeth). Hares <strong>cut<\/strong> clean at 45 degrees <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Rubs: mule deer make fewer rubs than white tails, on small conifers and shrubs <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>.<\/li><li>Fresh sign: shiny wet pellets, crisp track edges, green stem ends on browse (Tip).<\/li><\/ul>"},{"title":"Tactics: options","html":"<h3>Option A: spot and stalk<\/h3><ul><li>Glass from a high point at first light, find a buck, then sneak in with the wind in your face.<\/li><li>Pros: the classic mule deer method; you see lots of country (hunter consensus) <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>.<\/li><li>Cons: hard on a beginner; long stalks; easy to bump the deer.<\/li><\/ul><h3>Option B: sit and glass a feeding slope<\/h3><ul><li>Sit at the edge of a grassy slope or opening at dawn or dusk. Let them come.<\/li><li>Pros: quiet, safe, steady shot from a rest, great for learning.<\/li><li>Cons: needs the right spot and patience.<\/li><\/ul><h3>Option C: still hunting through timber<\/h3><ul><li>Walk slowly through bedding cover. 10 steps, stop 1 minute.<\/li><li>Pros: works midday when deer are bedded.<\/li><li>Cons: deer usually see you first; shots are quick and close.<\/li><\/ul><aside class=\"callout lean\"><div class=\"callout-t\">My lean (opinion)<\/div><p>Option B for the first trip. Dawn and dusk on a slope with a long view. Midday, scout with binoculars and learn the trails.<\/p><\/aside>"},{"title":"Rifle, load and range","html":"<ul><li>Your rifle: Tikka T3x Arctic in .308 Winchester. More than enough for deer (Tip).<\/li><li>Load: 150 to 165 grain hunting bullet built to expand, from a known brand. Zero with the same box you hunt with (Tip).<\/li><li>Mule deer do not need magnum power. They need one good hit (Tip).<\/li><\/ul><aside class=\"callout tip\"><div class=\"callout-t\">Tip (opinion)<\/div><p>Your maximum range is the distance where you can hit a 15 cm (6 in) plate 9 times out of 10 from a field rest. For most beginners: 200 m (219 yd). Past that, get closer.<\/p><\/aside><ul><li>Wind, angle and a racing heart make field shots much harder than the bench (Tip).<\/li><\/ul>"},{"title":"Shot placement (brief)","html":"<ul><li>Aim for the heart and lungs: just behind the front leg, one third up the body (standard hunter education advice) <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Wait for the deer to stand <strong>broadside<\/strong> or slightly quartering away (Tip).<\/li><li>No shot at a running deer, a head, a neck, or a deer on the skyline (Tip).<\/li><li>Full lesson with diagram: the shot placement session (coming in a later phase).<\/li><\/ul><aside class=\"callout warn\"><div class=\"callout-t\">Warning<\/div><p>Identify every animal fully before your finger touches the trigger. Know your <button class=\"term\" data-term=\"Backstop\">Backstop<\/button>.<\/p><\/aside>"},{"title":"Legal specifics","html":"<aside class=\"callout warn\"><div class=\"callout-t\">Warning<\/div><p>Study aid only. The official regulations are the law.<\/p><\/aside><ul><li><strong>Your <button class=\"term\" data-term=\"MU\">MU<\/button> (Management Unit) at Heffley Creek and Sun Peaks:<\/strong> <span class=\"verify\">VERIFY<\/span> on the official map.<\/li><li><strong>4 point buck:<\/strong> a buck with at least 4 tines on one antler, <strong>not counting the brow tine<\/strong> (the short point near the base). Each tine at least 2.5 cm and longer than it is wide (search preview) <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li><strong>Region 3 mule deer seasons<\/strong> (search preview, many MUs, <span class=\"verify\">VERIFY<\/span> yours) <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>:<ul><li>10 to 30 September: 4 point bucks or better.<\/li><li><strong>1 to 31 October: any buck.<\/strong><\/li><li>1 November to 10 December: 4 point bucks or better.<\/li><\/ul><\/li><li><button class=\"term\" data-term=\"Antlerless\">Antlerless<\/button> mule deer: <button class=\"term\" data-term=\"LEH\">LEH<\/button> (Limited Entry Hunting) draw only <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li><button class=\"term\" data-term=\"Bag limit\">Bag limit<\/button>: search preview says 3 deer combined, at most 1 mule deer. <span class=\"verify\">VERIFY<\/span> <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>.<\/li><li>Hunting hours: 1 hour before sunrise to 1 hour after sunset <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Scents: BC bans deer, elk, moose and caribou parts or products from outside BC for hunting, because of <button class=\"term\" data-term=\"CWD\">CWD<\/button> (Chronic W
