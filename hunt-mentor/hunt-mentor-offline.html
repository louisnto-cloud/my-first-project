asting Disease) <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>. Skip deer urine lures.<\/li><\/ul><div class=\"regs\" data-regs=\"deerR3\"><\/div><aside class=\"callout lean\"><div class=\"callout-t\">My lean (opinion)<\/div><p>Until you read your MU in the <button class=\"term\" data-term=\"Synopsis\">Synopsis<\/button>, count points on every buck as if the 4 point rule applies.<\/p><\/aside>"},{"title":"Meat care and yield","html":"<ul><li>A field dressed mule deer is about 70% of its live weight <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Boneless meat is about 48% of field dressed weight, or about 34% of live weight <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Average field dressed buck in a Wyoming study: about 52 kg (114 lb), giving about 25 kg (55 lb) of boneless meat <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Cool it fast. Open the body, prop it open, get it in shade (Tip).<\/li><li>Notch your species licence right away <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>. Exact tag and transport steps: <span class=\"verify\">VERIFY<\/span> in the synopsis.<\/li><\/ul>"},{"title":"Beginner mistakes","html":"<aside class=\"callout mistake\"><div class=\"callout-t\">Common mistakes<\/div><ul><li>Walking in at daylight. The deer were already up and leaving.<\/li><li>Hunting with the wind at your back, or ignoring the thermals.<\/li><li>Shooting at a buck you didn't count, in a 4 point season.<\/li><\/ul><\/aside><ul><li>Also: skylining yourself on a ridge, rushing a stalk, and taking a long shot you never practised.<\/li><li>Also: chasing a deer that stotted over the hill. Wait. Glass. It may stop and look back (hunter lore) <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>.<\/li><\/ul>"},{"title":"Grandpa's rules","html":"<aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>Glass more, walk less. The deer you see from far away is the one you can sneak up on.<\/p><\/aside><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>Wind first, then the deer. If the wind is wrong, go somewhere else.<\/p><\/aside><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>When a mule deer bounces off, sit still and count to 60. Mulies love one last look.<\/p><\/aside><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>This week: drive the Heffley Lake road at dusk with binoculars. Note every deer, the time, the slope and which way it faced. Write it in the Journal.<\/p><\/aside><div class=\"checklist\" data-list=\"s4-mule-scout\"><label class=\"check\"><input type=\"checkbox\" data-key=\"s4-mule-scout:0\"><span>Find 2 glassing spots with a long view of open slope<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s4-mule-scout:1\"><span>Learn saskatoon, red osier dogwood and Oregon grape by sight<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s4-mule-scout:2\"><span>Find a deer trail and fresh pellets<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s4-mule-scout:3\"><span>Check wind direction at dawn and dusk on one slope<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s4-mule-scout:4\"><span>Read my MU page in the Region 3 synopsis<\/span><\/label><\/div>"},{"title":"Sources","html":"<ul><li>Alberta Institute for Wildlife Conservation (AIWC), <a href=\"https://www.aiwc.ca/blog/spotting-the-difference-a-guide-to-albertas-mule-deer-and-whitetails/\" target=\"_blank\" rel=\"noopener\">mule deer vs white tail identification<\/a>, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/li><li>University of Nebraska, <a href=\"https://digitalcommons.unl.edu/cgi/viewcontent.cgi?article=1015&amp;context=nebgamepubs\" target=\"_blank\" rel=\"noopener\">deer identification publication<\/a>, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/li><li>BC Ministry of Environment, <a href=\"https://www.env.gov.bc.ca/wld/documents/muledeer.pdf\" target=\"_blank\" rel=\"noopener\">Mule deer in BC<\/a>, search preview, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/li><li>Staudenmaier and others 2021, <a href=\"https://esajournals.onlinelibrary.wiley.com/doi/full/10.1002/ecs2.3813\" target=\"_blank\" rel=\"noopener\">mule deer and white tail habitat<\/a>, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/li><li>BC Wildlife Federation, <a href=\"https://bcwf.bc.ca/initiatives/mule-deer-project/\" target=\"_blank\" rel=\"noopener\">Southern Interior Mule Deer Project<\/a>, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/li><li>Monteith and others 2011, <a href=\"https://esajournals.onlinelibrary.wiley.com/doi/full/10.1890/ES10-00096.1\" target=\"_blank\" rel=\"noopener\">what triggers migration<\/a>, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/li><li>Willms 1976, <a href=\"https://cdnsciencepub.com/doi/pdf/10.4141/cjas76-065\" target=\"_blank\" rel=\"noopener\">deer diet near Kamloops<\/a>, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/li><li>Stewart and others 2002, <a href=\"https://academic.oup.com/jmammal/article/84/3/1076/905056\" target=\"_blank\" rel=\"noopener\">deer activity timing<\/a>, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/li><li>D'Angelo and others 2007, <a href=\"https://wildlife.onlinelibrary.wiley.com/doi/abs/10.2193/2006-326\" target=\"_blank\" rel=\"noopener\">deer hearing<\/a>, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/li><li>BC <a href=\"https://catalogue.data.gov.bc.ca/dataset/ungulate-winter-range-approved\" target=\"_blank\" rel=\"noopener\">ungulate winter range dataset<\/a>, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/li><li>BC <a href=\"https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis-region-3-thompson.pdf\" target=\"_blank\" rel=\"noopener\">Region 3 synopsis 2026 to 2028<\/a>, search preview, checked 2026-10-01 (capped 85%)<\/li><li>BC <a href=\"https://www2.gov.bc.ca/gov/content/environment/plants-animals-ecosystems/wildlife/wildlife-conservation/wildlife-health/chronic-wasting-disease/cwd-bc\" target=\"_blank\" rel=\"noopener\">chronic wasting disease page<\/a> and <a href=\"https://www.agcanada.com/daily/b-c-to-block-hunting-attractants-from-out-of-province\" target=\"_blank\" rel=\"noopener\">AgCanada news on attractant ban<\/a>, search preview, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span><\/li><li>New Mexico Wildlife, <a href=\"https://magazine.wildlife.state.nm.us/the-math-in-the-meat/\" target=\"_blank\" rel=\"noopener\">The math in the meat<\/a> and <a href=\"https://www.backcountrychronicles.com/mule-deer-pack-out-weight/\" target=\"_blank\" rel=\"noopener\">Backcountry Chronicles<\/a>, reporting University of Wyoming carcass studies, checked 2026-10-01 <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span><\/li><li>Region 3 <a href=\"http://lwdrodgun.com/wp-content/uploads/2017/12/Region-3-Mule-Deer-Hunter-Survey-Final-Report-December-2017.pdf\" target=\"_blank\" rel=\"noopener\">mule deer hunter survey 2017<\/a>, checked 2026-10-01 <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span><\/li><li>Research notes: <code>research/2026-10-01-deer.md<\/code>.<\/li><\/ul>"}],"quiz":[{"q":"A deer bounces away with all 4 feet hitting the ground together. What is it?","options":["White tail","Mule deer","Elk"],"answer":1,"why":"That bounce is called stotting. It is a mule deer trademark. White tails gallop with the tail up like a flag."},{"q":"When should you be on your glassing spot in late October?","options":["At 09:00 after the frost lifts","About 45 minutes before legal light","At noon when deer are bedded"],"answer":1,"why":"The morning peak is about 04:00 to 09:00. Arrive early, in the dark, and be still when light comes."},{"q":"In a 4 point season, which buck is legal?","options":["3 tines plus a brow tine on one side","4 tines on one antler, not counting the brow tine","Any buck with 4 points total on both antlers"],"answer":1,"why":"The brow tine does not count. You need 4 or more tines on one antler, each at least 2.5 cm. VERIFY your MU rules in the synopsis."},{"q":"What mostly triggers mule deer to move down to winter range?","options":["The rut","Snow and cold","Hunting pressure on opening day"],"answer":1,"why":"Studies show snow and cold drive the move. The rut comes later, mid November."},{"q":"What do mule deer near Kamloops mostly eat in fall?","options":["Mostly grass","Shrubs and forbs, little grass","Only Douglas fir"],"answer":1,"why":"A Kamloops stomach study found grass under 10% until spring. Fall diet is forbs and shrub browse."}],"checklists":["s4-mule-scout"],"text":" !why the mule deer is the deer of the hills around heffley creek. learn its day and you will know where to sit at first light. - mule deer are the main deer of the southern bc interior (85%). - your first hunt is mid to late october. that is the pre rut : bucks start to roam, the big breeding push is still weeks away (70%). - this session: how to tell one, where it is hour by hour, what it eats, how it hides, and how you hunt it. - the deep dive on senses and alarm is in how a deer thinks ( /s/deer-mind). identify: buck, doe, fawn - ears: very big, like a mule. that is the name (85%). - antlers (buck): forks that fork again, like a \"y\" on a \"y\" (85%). - tail: thin, white, rope like, with a black tip (85%). - rump: big white patch around the tail (85%). - doe: same body, no antlers, smaller neck (85%). - fawn: born in early summer; by october it has lost its spots and is about half the doe's size (75%). - metatarsal gland (scent patch on the outside of the hind leg): long, 10 to 15 cm (85%). !tip a buck in october has a thick neck. a doe has a thin neck and a long, narrow face. if you can't see antlers clearly, you have not identified a buck. mule deer or white tail? clue mule deer white tail --- --- --- antlers forks that fork again one main beam, single tines up tail thin, white, black tip wide, brown on top, white under running away stots : all 4 feet hit and push together, bouncing (85%) gallops, tail up like a white flag (85%) ears very big medium leg gland long, 10 to 15 cm (85%) small (85%) - both deer live near heffley creek. they are separate tags (80%). - hybrids exist but are uncommon (70%). when in doubt, do not shoot (tip). a day in the life: late october - night (about 21:00 to 04:00): feeds on and off in open grass and brush, rests between bouts (75%). - before first light (04:00 to 07:00): a strong activity peak. feeding, moving (85%). - legal light starts: 1 hour before sunrise (80%). mid to late october sunrise near kamloops is about 07:30 to 07:50 (calculated) (75%). use the legal light screen in field mode. - sunrise to about 09:00: last feeding, then drifts uphill toward cover (85%). - midday (10:00 to 15:00): bedded. chews cud. gets up briefly to stretch, nibble, and re bed (80%). - late afternoon (16:00 to 18:00): rises, browses near the bed, then moves toward open feeding slopes (80%). - sunset (about 17:40 to 18:00) to 21:00: second peak. out in the open (85%). - peaks from a telemetry study: about 04:00 to 09:00 and 17:00 to 21:00 (85%). !field be on your glassing spot 45 minutes before legal light. the first and last hour are when you will see deer. how it eats, poops and sleeps - eats: a browser. twigs, leaves and buds of shrubs, plus forbs (small leafy plants), with little grass in fall (85%). - chews cud: a ruminant. it fills up fast, then lies down to chew again (85%). - poops: piles of oval pellets, about 1 to 1.5 cm long. firm and dry in fall and winter (70%). - how often: roughly 13 to 34 pellet groups a day (70%). - sleeps: in short naps, often with head up or curled, waking often (70%). - walks: slow, stopping to look and listen. often walks the same trails each day (75%). - drinks: in dry fall weather, near water at dusk or dawn. with green feed and dew, it needs less (tip). food by season near kamloops - study of deer stomachs near kamloops, september to april (85%): - grass was under 10% of the diet until spring. - more forbs in fall. - shrubs important in early fall and late winter. - douglas fir needles peak in december and january. - key browse: douglas fir, saskatoon, oregon grape, red osier dogwood, willow, rose, bitterbrush, rabbitbrush, sagebrush, snowbrush (80%). - late october menu: last green forbs, shrub leaves and twigs, fresh green grass shoots after fall rain (75%). !tip learn 3 plants this week: saskatoon, red osier dogwood (red stems) and oregon grape (holly like leaves). find them chewed and you are in a feeding area. where they are: bc and near heffley creek - mule deer like steeper, higher, open, broken ground. white tails like valley bottoms and farm fields (85%). - local reading (75%): - grassland and open douglas fir benches above the valley. - up toward heffley lake, paul lake and sun peaks in summer and early fall. - lower, sunnier slopes as snow comes. - winter range: south and west facing slopes with old douglas fir (85%). - a study of winter range north of kamloops used slopes below about 760 m (80%). - rough elevations (tip, verify on a map): valley 370 to 450 m, heffley lake about 950 m, sun peaks village about 1,250 m. - ungulate winter range maps: view the \"ungulate winter range, approved\" layer in imapbc (85%). near kamloops there may be no approved mule deer areas (verify). migration: the big october question - about 74% of tracked mule deer in a southern interior study migrated (85%). - average trip about 47 to 55 km one way, up to about 100 km (85%). - they use the same route every year (85%). - what starts the move down: snow and cold , not the rut (85%). - timing: back on winter range october to november; in one year nearly all were back by mid october (85%). - another bc account: interior deer often stay high until december (80%). - deer avoid snow deeper than about 50 cm (80%). !lean early snow up high in october? hunt the mid slopes below the snow line. no snow yet? glass the high benches and openings near heffley lake and paul lake first. senses: what scares and attracts them - nose: strongest sense. wind at your back toward the deer ends the hunt (85%). - ears: hear about 115 hz (hertz) to 54 khz (kilohertz), best at 4 to 8 khz (85%). that is the range of zippers, velcro, nylon swish and metal clicks. - eyes: see blues well, no red cone, so blaze orange looks dull to them (75%). they catch motion and outline fast (85%). - scares them: human scent, a skyline outline, sudden moves, metal clicks, voices, a slammed truck door (tip). - calms them: slow natural walking rhythm, other relaxed deer, steady breeze (tip). - attracts them: fresh green feed, does in heat (in the rut), other deer (80%). - lights: a headlamp beam swinging across a slope will move deer. use red light and keep it on the ground (tip). - full story: how a deer thinks ( /s/deer-mind). social life and the rut - does live in family groups: mother, daughters and fawns (85%). - bucks spend summer in bachelor groups of 2 to 4. these break up in october (80%). - groups are mostly 5 or fewer. in winter 5 to 8, up to 15 to 30 (75%). - deer return to the same home range year after year (85%). - rut (breeding season) for mule deer: mid november to mid december, peak mid november (80%). - late october: bucks spar (push antlers, not real fights), rub small trees, and start checking doe groups (70%). - in the rut: a buck tends one doe at a time, follows her, and fights rivals (75%). bucks get careless in daylight. - antlers fall off in winter and regrow each year (85%). beds and bedding - day beds give hiding cover and shelter (80%). - warm days: north facing timber, benches, draws, shade (80%). - cold days: sunny south and west slopes, out of the wind (80%). - lore: bucks bed in the top third of a slope, looking down, with wind from behind (hunter lore) (60%). - a bed is an oval of flattened grass or scraped earth, about 1 m long, often with pellets and hair nearby (70%). - deer bed where they can see danger below and smell danger above (tip). tracks, scat and sign - track: heart shape, 2 toes, pointed end shows direction of travel (85%). - mule deer front track: about 5.7 to 10 cm long (60%). - you can't tell mule deer from white tail by one track. too much overlap (60%). - stotting leaves groups of 4 prints, 2.4 to 4.6 m apart (60%). - browse sign: deer tear twigs (no upper front teeth). hares cut clean at 45 degrees (75%). - rubs: mule deer make fewer rubs than white tails, on small conifers and shrubs (60%). - fresh sign: shiny wet pellets, crisp track edges, green stem ends on browse (tip). tactics: options option a: spot and stalk - glass from a high point at first light, find a buck, then sneak in with the wind in your face. - pros: the classic mule deer method; you see lots of country (hunter consensus) (60%). - cons: hard on a beginner; long stalks; easy to bump the deer. option b: sit and glass a feeding slope - sit at the edge of a grassy slope or opening at dawn or dusk. let them come. - pros: quiet, safe, steady shot from a rest, great for learning. - cons: needs the right spot and patience. option c: still hunting through timber - walk slowly through bedding cover. 10 steps, stop 1 minute. - pros: works midday when deer are bedded. - cons: deer usually see you first; shots are quick and close. !lean option b for the first trip. dawn and dusk on a slope with a long view. midday, scout with binoculars and learn the trails. rifle, load and range - your rifle: tikka t3x arctic in .308 winchester. more than enough for deer (tip). - load: 150 to 165 grain hunting bullet built to expand, from a known brand. zero with the same box you hunt with (tip). - mule deer do not need magnum power. they need one good hit (tip). !tip your maximum range is the distance where you can hit a 15 cm (6 in) plate 9 times out of 10 from a field rest. for most beginners: 200 m (219 yd). past that, get closer. - wind, angle and a racing heart make field shots much harder than the bench (tip). shot placement (brief) - aim for the heart and lungs: just behind the front leg, one third up the body (standard hunter education advice) (75%). - wait for the deer to stand broadside or slightly quartering away (tip). - no shot at a running deer, a head, a neck, or a deer on the skyline (tip). - full lesson with diagram: the shot placement session (coming in a later phase). !warn identify every animal fully before your finger touches the trigger. know your backstop . legal specifics !warn study aid only. the official regulations are the law. - your mu (management unit) at heffley creek and sun peaks: verify on the official map. - 4 point buck: a buck with at least 4 tines on one antler, not counting the brow tine (the short point near the base). each tine at least 2.5 cm and longer than it is wide (search preview) (80%). - region 3 mule deer seasons (search preview, many mus, verify yours) (65%): - 10 to 30 september: 4 point bucks or better. - 1 to 31 october: any buck. - 1 november to 10 december: 4 point bucks or better. - antlerless mule deer: leh (limited entry hunting) draw only (75%). - bag limit : search preview says 3 deer combined, at most 1 mule deer. verify (60%). - hunting hours: 1 hour before sunrise to 1 hour after sunset (80%). - scents: bc bans deer, elk, moose and caribou parts or products from outside bc for hunting, because of cwd (chronic wasting disease) (80%). skip deer urine lures. !lean until you read your mu in the synopsis , count points on every buck as if the 4 point rule applies. meat care and yield - a field dressed mule deer is about 70% of its live weight (70%). - boneless meat is about 48% of field dressed weight, or about 34% of live weight (70%). - average field dressed buck in a wyoming study: about 52 kg (114 lb), giving about 25 kg (55 lb) of boneless meat (70%). - cool it fast. open the body, prop it open, get it in shade (tip). - notch your species licence right away (75%). exact tag and transport steps: verify in the synopsis. beginner mistakes !mistake - walking in at daylight. the deer were already up and leaving. - hunting with the wind at your back, or ignoring the thermals. - shooting at a buck you didn't count, in a 4 point season. - also: skylining yourself on a ridge, rushing a stalk, and taking a long shot you never practised. - also: chasing a deer that stotted over the hill. wait. glass. it may stop and look back (hunter lore) (65%). grandpa's rules !rule glass more, walk less. the deer you see from far away is the one you can sneak up on. !rule wind first, then the deer. if the wind is wrong, go somewhere else. !rule when a mule deer bounces off, sit still and count to 60. mulies love one last look. !field this week: drive the heffley lake road at dusk with binoculars. note every deer, the time, the slope and which way it faced. write it in the journal. sources - alberta institute for wildlife conservation (aiwc), mule deer vs white tail identification (https://www.aiwc.ca/blog/spotting-the-difference-a-guide-to-albertas-mule-deer-and-whitetails/), checked 2026-10-01 (85%) - university of nebraska, deer identification publication (https://digitalcommons.unl.edu/cgi/viewcontent.cgi?article=1015&context=nebgamepubs), checked 2026-10-01 (85%) - bc ministry of environment, mule deer in bc (https://www.env.gov.bc.ca/wld/documents/muledeer.pdf), search preview, checked 2026-10-01 (85%) - staudenmaier and others 2021, mule deer and white tail habitat (https://esajournals.onlinelibrary.wiley.com/doi/full/10.1002/ecs2.3813), checked 2026-10-01 (85%) - bc wildlife federation, southern interior mule deer project (https://bcwf.bc.ca/initiatives/mule-deer-project/), checked 2026-10-01 (85%) - monteith and others 2011, what triggers migration (https://esajournals.onlinelibrary.wiley.com/doi/full/10.1890/es10-00096.1), checked 2026-10-01 (85%) - willms 1976, deer diet near kamloops (https://cdnsciencepub.com/doi/pdf/10.4141/cjas76-065), checked 2026-10-01 (85%) - stewart and others 2002, deer activity timing (https://academic.oup.com/jmammal/article/84/3/1076/905056), checked 2026-10-01 (85%) - d'angelo and others 2007, deer hearing (https://wildlife.onlinelibrary.wiley.com/doi/abs/10.2193/2006-326), checked 2026-10-01 (85%) - bc ungulate winter range dataset (https://catalogue.data.gov.bc.ca/dataset/ungulate-winter-range-approved), checked 2026-10-01 (85%) - bc region 3 synopsis 2026 to 2028 (https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis-region-3-thompson.pdf), search preview, checked 2026-10-01 (capped 85%) - bc chronic wasting disease page (https://www2.gov.bc.ca/gov/content/environment/plants-animals-ecosystems/wildlife/wildlife-conservation/wildlife-health/chronic-wasting-disease/cwd-bc) and agcanada news on attractant ban (https://www.agcanada.com/daily/b-c-to-block-hunting-attractants-from-out-of-province), search preview, checked 2026-10-01 (80%) - new mexico wildlife, the math in the meat (https://magazine.wildlife.state.nm.us/the-math-in-the-meat/) and backcountry chronicles (https://www.backcountrychronicles.com/mule-deer-pack-out-weight/), reporting university of wyoming carcass studies, checked 2026-10-01 (70%) - region 3 mule deer hunter survey 2017 (http://lwdrodgun.com/wp-content/uploads/2017/12/region-3-mule-deer-hunter-survey-final-report-december-2017.pdf), checked 2026-10-01 (70%) - research notes: research/2026-10-01-deer.md . "},{"id":"white-tailed-deer","phase":4,"num":2,"title":"White tailed deer","minutes":15,"checked":"2026-10-01","steps":[{"title":"White tailed deer","html":"<aside class=\"callout why\"><div class=\"callout-t\">Why it matters<\/div><p>White tails live in the North Thompson valley bottoms, close to roads and farms. The antlerless season may be open during your October hunt.<\/p><\/aside><ul><li>White tails favour valley bottoms, river edges and farm fields <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Near Heffley Creek: North Thompson hayfields and cottonwood bottoms <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Late October is the start of the white tail rut build up: rubs and scrapes appear <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>.<\/li><li>They are a <strong>separate species licence<\/strong> from mule deer <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Best methods for a beginner: sit on a stand, or still hunt slowly (hunter consensus) <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>.<\/li><\/ul>"},{"title":"Identify: buck, doe, fawn","html":"<ul><li><strong>Antlers (buck):<\/strong> one main beam curving forward, single tines pointing up <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Tail:<\/strong> wide, brown on top, bright white underneath <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Alarm:<\/strong> tail goes straight up and waves, the white <strong>flag<\/strong> <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Runs:<\/strong> a smooth gallop toward cover, not a bounce <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Ears:<\/strong> smaller than a mule deer's <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Leg gland<\/strong> (metatarsal, on the outside of the hind leg): small <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li><strong>Doe and fawn:<\/strong> no antlers. By October fawns have lost their spots <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><\/ul><figure class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 420\" font-family=\"sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"400\" height=\"420\" fill=\"#fffaf0\"/>\n  <line x1=\"200\" y1=\"10\" x2=\"200\" y2=\"410\" stroke=\"#8a9a6b\" stroke-width=\"2\" stroke-dasharray=\"6 6\" fill=\"none\"/>\n  <text x=\"100\" y=\"30\" font-size=\"18\" font-weight=\"bold\" fill=\"#2f3a2b\" text-anchor=\"middle\">Mule deer<\/text>\n  <text x=\"300\" y=\"30\" font-size=\"18\" font-weight=\"bold\" fill=\"#2f3a2b\" text-anchor=\"middle\">White tail<\/text>\n  <text x=\"200\" y=\"52\" font-size=\"14\" fill=\"#6b4f35\" text-anchor=\"middle\">Antlers (one side, seen from front)<\/text>\n  <!-- mule deer antler: forks that split again -->\n  <g stroke=\"#6b4f35\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\">\n    <path d=\"M100 190 L100 160\"/>\n    <path d=\"M100 160 L70 110\"/>\n    <path d=\"M100 160 L130 110\"/>\n    <path d=\"M70 110 L55 72\"/>\n    <path d=\"M70 110 L85 75\"/>\n    <path d=\"M130 110 L118 74\"/>\n    <path d=\"M130 110 L148 76\"/>\n    <path d=\"M100 178 L86 168\"/>\n  <\/g>\n  <text x=\"100\" y=\"212\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Forks that fork again<\/text>\n  <text x=\"100\" y=\"230\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">(\"Y\" on a \"Y\")<\/text>\n  <!-- whitetail antler: one main beam, tines up -->\n  <g stroke=\"#6b4f35\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\">\n    <path d=\"M250 190 Q240 120 300 100 Q345 90 360 120\"/>\n    <path d=\"M262 140 L258 112\"/>\n    <path d=\"M285 108 L282 72\"/>\n    <path d=\"M315 98 L318 64\"/>\n    <path d=\"M343 102 L350 76\"/>\n  <\/g>\n  <text x=\"300\" y=\"212\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">One main beam,<\/text>\n  <text x=\"300\" y=\"230\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">single tines up<\/text>\n  <text x=\"200\" y=\"262\" font-size=\"14\" fill=\"#6b4f35\" text-anchor=\"middle\">Tail and rump (seen from behind)<\/text>\n  <!-- mule deer rump -->\n  <ellipse cx=\"100\" cy=\"330\" rx=\"48\" ry=\"48\" fill=\"#f3ead8\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <rect x=\"94\" y=\"290\" width=\"12\" height=\"62\" rx=\"6\" fill=\"#f3ead8\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <rect x=\"94\" y=\"340\" width=\"12\" height=\"18\" rx=\"6\" fill=\"#23261f\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <text x=\"100\" y=\"396\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Big white rump,<\/text>\n  <text x=\"100\" y=\"413\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">thin tail, black tip<\/text>\n  <!-- whitetail flag -->\n  <ellipse cx=\"300\" cy=\"345\" rx=\"40\" ry=\"34\" fill=\"#b08a5e\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <path d=\"M300 340 C270 320 268 285 285 275 L300 270 L315 275 C332 285 330 320 300 340 Z\" fill=\"#ffffff\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <text x=\"300\" y=\"300\" font-size=\"12\" fill=\"#6b4f35\" text-anchor=\"middle\">flag up<\/text>\n  <text x=\"300\" y=\"396\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Wide brown tail,<\/text>\n  <text x=\"300\" y=\"413\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">white below, waved up<\/text>\n<\/svg>\n<\/figure><aside class=\"callout warn\"><div class=\"callout-t\">Warning<\/div><p>A doe and a \"button buck\" (male fawn with tiny bumps) look alike. Both count as antlerless. Know the rule before you shoot.<\/p><\/aside>"},{"title":"Where they live near Heffley Creek","html":"<ul><li>Valley bottoms, riparian strips (the green belt along rivers and creeks), farm fields <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Local reading: North Thompson hayfields and cottonwood bottoms north of Kamloops <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>They feed in fields at dusk and night, and bed in thick brush, willow and cottonwood close by <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>They do not migrate far like mule deer. Most stay in a small home range year round <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>They live close to houses and roads. Shooting distance rules matter a lot here.<\/li><\/ul><figure class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 340\" font-family=\"sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"400\" height=\"340\" fill=\"#fffaf0\"/>\n  <text x=\"200\" y=\"24\" font-size=\"17\" font-weight=\"bold\" fill=\"#2f3a2b\" text-anchor=\"middle\">Where deer are on a slope<\/text>\n  <!-- ground profile -->\n  <path d=\"M0 300 L110 300 L180 230 L215 222 L250 175 L285 168 L340 80 L400 70 L400 340 L0 340 Z\" fill=\"#d9cfb3\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <!-- trees on bench and upper slope -->\n  <g fill=\"#2f3a2b\">\n    <path d=\"M255 172 L262 145 L269 172 Z\"/>\n    <path d=\"M272 170 L279 140 L286 170 Z\"/>\n    <path d=\"M300 140 L307 112 L314 140 Z\"/>\n    <path d=\"M320 108 L327 80 L334 108 Z\"/>\n    <path d=\"M352 78 L359 52 L366 78 Z\"/>\n  <\/g>\n  <!-- field -->\n  <rect x=\"10\" y=\"292\" width=\"95\" height=\"8\" fill=\"#8a9a6b\"/>\n  <!-- deer dots -->\n  <circle cx=\"40\" cy=\"285\" r=\"6\" fill=\"#6b4f35\"/>\n  <circle cx=\"70\" cy=\"285\" r=\"6\" fill=\"#6b4f35\"/>\n  <circle cx=\"148\" cy=\"254\" r=\"6\" fill=\"#6b4f35\"/>\n  <circle cx=\"265\" cy=\"160\" r=\"6\" fill=\"#e8590c\"/>\n  <circle cx=\"345\" cy=\"70\" r=\"6\" fill=\"#e8590c\"/>\n  <!-- labels -->\n  <text x=\"55\" y=\"322\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Valley fields:<\/text>\n  <text x=\"55\" y=\"338\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">white tails<\/text>\n  <text x=\"185\" y=\"290\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Open grass:<\/text>\n  <text x=\"185\" y=\"306\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">feeding<\/text>\n  <text x=\"275\" y=\"228\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Bench + timber:<\/text>\n  <text x=\"275\" y=\"244\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">day beds<\/text>\n  <text x=\"345\" y=\"44\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Ridge<\/text>\n  <!-- thermals -->\n  <g stroke=\"#e8590c\" stroke-width=\"3\" fill=\"#e8590c\">\n    <line x1=\"60\" y1=\"120\" x2=\"110\" y2=\"80\"/>\n    <path d=\"M110 80 L98 82 L106 92 Z\"/>\n  <\/g>\n  <text x=\"20\" y=\"70\" font-size=\"14\" font-weight=\"bold\" fill=\"#e8590c\">Morning warms:<\/text>\n  <text x=\"20\" y=\"140\" font-size=\"14\" fill=\"#e8590c\">air flows UP<\/text>\n  <g stroke=\"#2f3a2b\" stroke-width=\"3\" fill=\"#2f3a2b\">\n    <line x1=\"230\" y1=\"60\" x2=\"180\" y2=\"100\"/>\n    <path d=\"M180 100 L192 98 L184 88 Z\"/>\n  <\/g>\n  <text x=\"170\" y=\"50\" font-size=\"14\" font-weight=\"bold\" fill=\"#2f3a2b\">Evening cools:<\/text>\n  <text x=\"170\" y=\"122\" font-size=\"14\" fill=\"#2f3a2b\">air flows DOWN<\/text>\n<\/svg>\n<\/figure>"},{"title":"Daily pattern","html":"<ul><li>Same two peaks as mule deer: dawn and dusk <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Feeds in fields from late afternoon through the night <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Slips back into cover at or before first light <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Under hunting pressure, white tails move more at night <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Late October: bucks start moving in daylight as the rut nears <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Legal light starts 1 hour before sunrise and ends 1 hour after sunset <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><\/ul><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>Find the trail between the bedding brush and the field. Look for the most trampled path with the freshest tracks. Sit downwind of it.<\/p><\/aside>"},{"title":"Food, water and cover","html":"<ul><li>Hay and alfalfa regrowth in fall fields <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Browse: willow, red osier dogwood, rose, saskatoon along creeks <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Water is close in valley bottoms, so water is rarely the limit (Tip).<\/li><li>Cover: dense willow, cottonwood thickets, young conifers, brushy draws <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><\/ul>"},{"title":"Rut sign: rubs and scrapes","html":"<ul><li><strong>Rut<\/strong> (breeding season): white tail peak is November. Most does conceive about 13 to 17 November <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li><strong>Rubs:<\/strong> a buck scrapes bark off a sapling with his antlers. Bare, shredded wood at knee to waist height <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>.<\/li><li>White tails make many more rubs than mule deer <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>.<\/li><li><strong>Scrape:<\/strong> a pawed bare patch of dirt, often under a low branch the buck chews and rubs his face on <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>.<\/li><li>Scrapes show up late October to November <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>.<\/li><li>A <strong>rub line<\/strong> is several rubs in a row. It often marks a travel route (Tip).<\/li><\/ul><aside class=\"callout tip\"><div class=\"callout-t\">Tip (opinion)<\/div><p>Fresh rubs ooze sap and the wood is pale. Old rubs are grey. Hunt the fresh ones.<\/p><\/aside>"},{"title":"Tracks and sign","html":"<figure class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 320\" font-family=\"sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"400\" height=\"320\" fill=\"#fffaf0\"/>\n  <text x=\"200\" y=\"26\" font-size=\"18\" font-weight=\"bold\" fill=\"#2f3a2b\" text-anchor=\"middle\">Deer track (front foot)<\/text>\n  <!-- two toes (halves of heart), point = toe tips at top -->\n  <path d=\"M195 70 C180 75 160 110 158 160 C156 200 168 225 185 228 C195 229 197 215 197 200 Z\" fill=\"#6b4f35\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <path d=\"M205 70 C220 75 240 110 242 160 C244 200 232 225 215 228 C205 229 203 215 203 200 Z\" fill=\"#6b4f35\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <!-- dewclaws -->\n  <ellipse cx=\"170\" cy=\"262\" rx=\"8\" ry=\"6\" fill=\"#8a9a6b\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <ellipse cx=\"230\" cy=\"262\" rx=\"8\" ry=\"6\" fill=\"#8a9a6b\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <!-- direction arrow -->\n  <g stroke=\"#e8590c\" stroke-width=\"4\" fill=\"#e8590c\">\n    <line x1=\"320\" y1=\"230\" x2=\"320\" y2=\"90\"/>\n    <path d=\"M320 70 L308 94 L332 94 Z\"/>\n  <\/g>\n  <text x=\"320\" y=\"252\" font-size=\"14\" font-weight=\"bold\" fill=\"#e8590c\" text-anchor=\"middle\">Travel<\/text>\n  <text x=\"320\" y=\"270\" font-size=\"14\" font-weight=\"bold\" fill=\"#e8590c\" text-anchor=\"middle\">direction<\/text>\n  <!-- labels -->\n  <line x1=\"200\" y1=\"66\" x2=\"110\" y2=\"60\" stroke=\"#23261f\" stroke-width=\"1.5\" fill=\"none\"/>\n  <text x=\"20\" y=\"56\" font-size=\"14\" fill=\"#23261f\">Pointed tips<\/text>\n  <text x=\"20\" y=\"72\" font-size=\"14\" fill=\"#23261f\">= front<\/text>\n  <line x1=\"160\" y1=\"160\" x2=\"95\" y2=\"160\" stroke=\"#23261f\" stroke-width=\"1.5\" fill=\"none\"/>\n  <text x=\"20\" y=\"150\" font-size=\"14\" fill=\"#23261f\">2 toes<\/text>\n  <text x=\"20\" y=\"166\" font-size=\"14\" fill=\"#23261f\">(split hoof)<\/text>\n  <line x1=\"185\" y1=\"228\" x2=\"110\" y2=\"215\" stroke=\"#23261f\" stroke-width=\"1.5\" fill=\"none\"/>\n  <text x=\"20\" y=\"210\" font-size=\"14\" fill=\"#23261f\">Round heel<\/text>\n  <line x1=\"162\" y1=\"262\" x2=\"110\" y2=\"270\" stroke=\"#23261f\" stroke-width=\"1.5\" fill=\"none\"/>\n  <text x=\"20\" y=\"268\" font-size=\"14\" fill=\"#23261f\">Dewclaws:<\/text>\n  <text x=\"20\" y=\"284\" font-size=\"14\" fill=\"#23261f\">deep mud, snow,<\/text>\n  <text x=\"20\" y=\"300\" font-size=\"14\" fill=\"#23261f\">or running<\/text>\n  <text x=\"200\" y=\"312\" font-size=\"14\" fill=\"#2f3a2b\" text-anchor=\"middle\">About 6 to 10 cm long<\/text>\n<\/svg>\n<\/figure><ul><li>Heart shaped track, same as mule deer. You can't tell them apart by one track <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>.<\/li><li>Pellets: oval, about 1 to 1.5 cm <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Trails: worn paths from bedding brush to field edges <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Beds: flattened ovals in tall grass or brush near the field edge <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Browse: torn, ragged twig ends <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><\/ul>"},{"title":"Tactics: options","html":"<h3>Option A: stand or ground blind<\/h3><ul><li>Sit on the trail between bedding and food, downwind, before light or 2 hours before dark.<\/li><li>Pros: you are still, deer come to you, easy steady shot.<\/li><li>Cons: needs scouting and permission on farm land; cold; patience.<\/li><\/ul><h3>Option B: still hunting<\/h3><ul><li>Walk 10 steps, stop and look for a minute or more. Wind in your face.<\/li><li>Pros: covers ground; works in thick bottoms midday.<\/li><li>Cons: white tails are hard to sneak on in thick cover; quick close shots.<\/li><\/ul><h3>Option C: rattling and grunting<\/h3><ul><li>Clack antlers together and grunt to sound like bucks fighting.<\/li><li>Pros: can pull a buck in close.<\/li><li>Cons: works best in early November, not mid October. One Texas study saw about 65% of bucks respond, best on cool, calm, overcast mornings <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><\/ul><aside class=\"callout lean\"><div class=\"callout-t\">My lean (opinion)<\/div><p>Option A. Get permission on one hayfield edge, find the main trail, and sit it at dusk.<\/p><\/aside>"},{"title":"Rifle, load and range","html":"<ul><li>Your .308 Winchester with a 150 to 165 grain bullet built to expand is plenty (Tip).<\/li><li>Shots in valley bottoms are often 50 to 150 m (55 to 164 yd) (Tip).<\/li><\/ul><aside class=\"callout tip\"><div class=\"callout-t\">Tip (opinion)<\/div><p>Same limit as mule deer: only shoot as far as you can hit a 15 cm (6 in) plate 9 times out of 10 from a field rest. For most beginners, 200 m (219 yd).<\/p><\/aside><aside class=\"callout warn\"><div class=\"callout-t\">Warning<\/div><p>Flat fields, houses and roads. Before every shot, see a solid earth <button class=\"term\" data-term=\"Backstop\">Backstop<\/button>. No shots toward buildings, livestock or roads.<\/p><\/aside>"},{"title":"Shot placement (brief)","html":"<ul><li>Heart and lungs: tight behind the front leg, one third up the body (standard hunter education advice) <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Wait for broadside or slightly quartering away (Tip).<\/li><li>White tails often run 50 to 100 m after a good hit. Mark where it stood and where it entered cover (Tip).<\/li><li>Full lesson: the shot placement session (coming in a later phase).<\/li><\/ul>"},{"title":"Legal specifics","html":"<aside class=\"callout warn\"><div class=\"callout-t\">Warning<\/div><p>Study aid only. The official regulations are the law.<\/p><\/aside><ul><li><strong>Your <button class=\"term\" data-term=\"MU\">MU<\/button> (Management Unit):<\/strong> <span class=\"verify\">VERIFY<\/span> on the official map.<\/li><li><strong><button class=\"term\" data-term=\"Antlerless\">Antlerless<\/button> white tails:<\/strong> 10 to 31 October in MUs 3-12 to 3-20, 3-26 to 3-44 and 3-46 (search preview, <span class=\"verify\">VERIFY<\/span>) <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li><strong>White tailed buck season in your MU:<\/strong> <span class=\"verify\">VERIFY<\/span>.<\/li><li><strong><button class=\"term\" data-term=\"Bag limit\">Bag limit<\/button>:<\/strong> search preview says 3 deer combined in Region 3, at most 2 white tails. <span class=\"verify\">VERIFY<\/span> <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span>.<\/li><li><strong>Buildings:<\/strong> no hunting or shooting within 100 m of an occupied dwelling, farm or ranch building, church, school, playground or regional park <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li><strong>Private land:<\/strong> get permission before you hunt a farm. Trespass rules: <span class=\"verify\">VERIFY<\/span> in the BC Trespass Act.<\/li><li><strong>Inside city or regional limits:<\/strong> some areas ban shooting. Local discharge bylaw: <span class=\"verify\">VERIFY<\/span>.<\/li><li>Deer parts or scents from outside BC are banned for hunting, because of <button class=\"term\" data-term=\"CWD\">CWD<\/button> (Chronic Wasting Disease) <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><\/ul><div class=\"regs\" data-regs=\"deerR3,safety\"><\/div>"},{"title":"Meat care and yield","html":"<ul><li>Yield for white tails: <span class=\"verify\">VERIFY<\/span>. Expect a similar ratio to mule deer: about one third of live weight as boneless meat (Tip, assumption).<\/li><li>Cool the carcass fast. October days can be warm in the valley (Tip).<\/li><li>Notch your white tailed deer species licence right away <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>. Exact steps: <span class=\"verify\">VERIFY<\/span> in the synopsis.<\/li><\/ul>"},{"title":"Beginner mistakes","html":"<aside class=\"callout mistake\"><div class=\"callout-t\">Common mistakes<\/div><ul><li>Sitting right on the field edge in the open, where every deer sees you walk in.<\/li><li>Hunting a farm without written or clear permission.<\/li><li>Shooting at a flagging white tail running away.<\/li><\/ul><\/aside><ul><li>Also: walking through the bedding brush to get to your stand. Go around.<\/li><li>Also: noisy truck doors and voices near the field at dusk.<\/li><\/ul>"},{"title":"Grandpa's rules","html":"<aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>Hunt the trail, not the field. Big bucks reach the field after dark.<\/p><\/aside><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>Ask the farmer first, thank them after, and bring them a package of sausage.<\/p><\/aside><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>A flag in the air means \"goodbye\". Let it go. It will be back another evening.<\/p><\/aside><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>This week: knock on one farm door in the North Thompson valley. Ask to scout the field edges. Look for trails, rubs and a spot to sit downwind.<\/p><\/aside><div class=\"checklist\" data-list=\"s4-wt-scout\"><label class=\"check\"><input type=\"checkbox\" data-key=\"s4-wt-scout:0\"><span>Get permission on one farm or find legal Crown land in the valley<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s4-wt-scout:1\"><span>Find the main trail from cover to field<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s4-wt-scout:2\"><span>Find fresh rubs or scrapes<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s4-wt-scout:3\"><span>Pick a stand spot downwind of the trail with a safe backstop<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s4-wt-scout:4\"><span>Check distance to every building is over 100 m<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s4-wt-scout:5\"><span>Read antlerless dates for my MU in the synopsis<\/span><\/label><\/div>"},{"title":"Sources","html":"<ul><li>Alberta Institute for Wildlife Conservation (AIWC), <a href=\"https://www.aiwc.ca/blog/spotting-the-difference-a-guide-to-albertas-mule-deer-and-whitetails/\" target=\"_blank\" rel=\"noopener\">mule deer vs white tail identification<\/a>, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/li><li>Staudenmaier and others 2021, <a href=\"https://esajournals.onlinelibrary.wiley.com/doi/full/10.1002/ecs2.3813\" target=\"_blank\" rel=\"noopener\">mule deer and white tail habitat<\/a>, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/li><li>Stewart and others 2002, <a href=\"https://academic.oup.com/jmammal/article/84/3/1076/905056\" target=\"_blank\" rel=\"noopener\">deer activity timing<\/a>, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/li><li>Penn State Extension, white tail breeding dates, via research notes, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span><\/li><li>BC <a href=\"https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis-region-3-thompson.pdf\" target=\"_blank\" rel=\"noopener\">Region 3 synopsis 2026 to 2028<\/a>, search preview, checked 2026-10-01 (capped 85%)<\/li><li>BC <a href=\"https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/190_84_01\" target=\"_blank\" rel=\"noopener\">Hunting Regulation, B.C. Reg. 190/84<\/a>, search preview, checked 2026-10-01 <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span><\/li><li>BC <a href=\"https://www2.gov.bc.ca/gov/content/environment/plants-animals-ecosystems/wildlife/wildlife-conservation/wildlife-health/chronic-wasting-disease/cwd-bc\" target=\"_blank\" rel=\"noopener\">chronic wasting disease page<\/a>, search preview, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span><\/li><li>Research notes: <code>research/2026-10-01-deer.md<\/code>.<\/li><\/ul>"}],"quiz":[{"q":"A deer runs into the willows with a wide white tail held straight up. What is it?","options":["Mule deer","White tailed deer","Can't tell"],"answer":1,"why":"The raised white flag and smooth gallop are white tail signs. Mule deer have a thin black tipped tail and bounce."},{"q":"Where is the best place for your stand?","options":["In the middle of the hayfield","On the trail between bedding cover and the field, downwind","Inside the bedding brush"],"answer":1,"why":"Deer travel that trail at dusk and dawn. Downwind keeps your scent off them. Walking into bedding brush pushes them out."},{"q":"What is a scrape?","options":["Bark rubbed off a sapling","A pawed bare patch of dirt under a low branch","A deer bed"],"answer":1,"why":"Bucks paw the ground and work the branch above with their face and antlers. Bark stripping is a rub."},{"q":"How close to an occupied house or farm building may you shoot?","options":["Any distance with a backstop","Not within 100 m","Not within 50 m"],"answer":1,"why":"BC rules ban hunting or shooting within 100 m of occupied dwellings and farm buildings. VERIFY in the synopsis."},{"q":"When does rattling work best for white tails?","options":["Hot afternoons in September","Cool, calm mornings near the rut in early November","Any time of year"],"answer":1,"why":"Response was best on cool, calm, overcast mornings near the rut. Mid October is early for it."}],"checklists":["s4-wt-scout"],"text":" !why white tails live in the north thompson valley bottoms, close to roads and farms. the antlerless season may be open during your october hunt. - white tails favour valley bottoms, river edges and farm fields (85%). - near heffley creek: north thompson hayfields and cottonwood bottoms (75%). - late october is the start of the white tail rut build up: rubs and scrapes appear (60%). - they are a separate species licence from mule deer (80%). - best methods for a beginner: sit on a stand, or still hunt slowly (hunter consensus) (65%). identify: buck, doe, fawn - antlers (buck): one main beam curving forward, single tines pointing up (85%). - tail: wide, brown on top, bright white underneath (85%). - alarm: tail goes straight up and waves, the white flag (85%). - runs: a smooth gallop toward cover, not a bounce (85%). - ears: smaller than a mule deer's (85%). - leg gland (metatarsal, on the outside of the hind leg): small (85%). - doe and fawn: no antlers. by october fawns have lost their spots (75%). !warn a doe and a \"button buck\" (male fawn with tiny bumps) look alike. both count as antlerless. know the rule before you shoot. where they live near heffley creek - valley bottoms, riparian strips (the green belt along rivers and creeks), farm fields (85%). - local reading: north thompson hayfields and cottonwood bottoms north of kamloops (75%). - they feed in fields at dusk and night, and bed in thick brush, willow and cottonwood close by (75%). - they do not migrate far like mule deer. most stay in a small home range year round (70%). - they live close to houses and roads. shooting distance rules matter a lot here. daily pattern - same two peaks as mule deer: dawn and dusk (85%). - feeds in fields from late afternoon through the night (75%). - slips back into cover at or before first light (75%). - under hunting pressure, white tails move more at night (70%). - late october: bucks start moving in daylight as the rut nears (70%). - legal light starts 1 hour before sunrise and ends 1 hour after sunset (80%). !field find the trail between the bedding brush and the field. look for the most trampled path with the freshest tracks. sit downwind of it. food, water and cover - hay and alfalfa regrowth in fall fields (80%). - browse: willow, red osier dogwood, rose, saskatoon along creeks (75%). - water is close in valley bottoms, so water is rarely the limit (tip). - cover: dense willow, cottonwood thickets, young conifers, brushy draws (75%). rut sign: rubs and scrapes - rut (breeding season): white tail peak is november. most does conceive about 13 to 17 november (80%). - rubs: a buck scrapes bark off a sapling with his antlers. bare, shredded wood at knee to waist height (60%). - white tails make many more rubs than mule deer (60%). - scrape: a pawed bare patch of dirt, often under a low branch the buck chews and rubs his face on (60%). - scrapes show up late october to november (60%). - a rub line is several rubs in a row. it often marks a travel route (tip). !tip fresh rubs ooze sap and the wood is pale. old rubs are grey. hunt the fresh ones. tracks and sign - heart shaped track, same as mule deer. you can't tell them apart by one track (60%). - pellets: oval, about 1 to 1.5 cm (70%). - trails: worn paths from bedding brush to field edges (75%). - beds: flattened ovals in tall grass or brush near the field edge (70%). - browse: torn, ragged twig ends (75%). tactics: options option a: stand or ground blind - sit on the trail between bedding and food, downwind, before light or 2 hours before dark. - pros: you are still, deer come to you, easy steady shot. - cons: needs scouting and permission on farm land; cold; patience. option b: still hunting - walk 10 steps, stop and look for a minute or more. wind in your face. - pros: covers ground; works in thick bottoms midday. - cons: white tails are hard to sneak on in thick cover; quick close shots. option c: rattling and grunting - clack antlers together and grunt to sound like bucks fighting. - pros: can pull a buck in close. - cons: works best in early november, not mid october. one texas study saw about 65% of bucks respond, best on cool, calm, overcast mornings (70%). !lean option a. get permission on one hayfield edge, find the main trail, and sit it at dusk. rifle, load and range - your .308 winchester with a 150 to 165 grain bullet built to expand is plenty (tip). - shots in valley bottoms are often 50 to 150 m (55 to 164 yd) (tip). !tip same limit as mule deer: only shoot as far as you can hit a 15 cm (6 in) plate 9 times out of 10 from a field rest. for most beginners, 200 m (219 yd). !warn flat fields, houses and roads. before every shot, see a solid earth backstop . no shots toward buildings, livestock or roads. shot placement (brief) - heart and lungs: tight behind the front leg, one third up the body (standard hunter education advice) (75%). - wait for broadside or slightly quartering away (tip). - white tails often run 50 to 100 m after a good hit. mark where it stood and where it entered cover (tip). - full lesson: the shot placement session (coming in a later phase). legal specifics !warn study aid only. the official regulations are the law. - your mu (management unit): verify on the official map. - antlerless white tails: 10 to 31 october in mus 3-12 to 3-20, 3-26 to 3-44 and 3-46 (search preview, verify) (70%). - white tailed buck season in your mu: verify. - bag limit : search preview says 3 deer combined in region 3, at most 2 white tails. verify (60%). - buildings: no hunting or shooting within 100 m of an occupied dwelling, farm or ranch building, church, school, playground or regional park (75%). - private land: get permission before you hunt a farm. trespass rules: verify in the bc trespass act. - inside city or regional limits: some areas ban shooting. local discharge bylaw: verify. - deer parts or scents from outside bc are banned for hunting, because of cwd (chronic wasting disease) (80%). meat care and yield - yield for white tails: verify. expect a similar ratio to mule deer: about one third of live weight as boneless meat (tip, assumption). - cool the carcass fast. october days can be warm in the valley (tip). - notch your white tailed deer species licence right away (75%). exact steps: verify in the synopsis. beginner mistakes !mistake - sitting right on the field edge in the open, where every deer sees you walk in. - hunting a farm without written or clear permission. - shooting at a flagging white tail running away. - also: walking through the bedding brush to get to your stand. go around. - also: noisy truck doors and voices near the field at dusk. grandpa's rules !rule hunt the trail, not the field. big bucks reach the field after dark. !rule ask the farmer first, thank them after, and bring them a package of sausage. !rule a flag in the air means \"goodbye\". let it go. it will be back another evening. !field this week: knock on one farm door in the north thompson valley. ask to scout the field edges. look for trails, rubs and a spot to sit downwind. sources - alberta institute for wildlife conservation (aiwc), mule deer vs white tail identification (https://www.aiwc.ca/blog/spotting-the-difference-a-guide-to-albertas-mule-deer-and-whitetails/), checked 2026-10-01 (85%) - staudenmaier and others 2021, mule deer and white tail habitat (https://esajournals.onlinelibrary.wiley.com/doi/full/10.1002/ecs2.3813), checked 2026-10-01 (85%) - stewart and others 2002, deer activity timing (https://academic.oup.com/jmammal/article/84/3/1076/905056), checked 2026-10-01 (85%) - penn state extension, white tail breeding dates, via research notes, checked 2026-10-01 (80%) - bc region 3 synopsis 2026 to 2028 (https://www2.gov.bc.ca/assets/gov/sports-recreation-arts-and-culture/outdoor-recreation/fishing-and-hunting/hunting/regulations/hunting-trapping-synopsis-region-3-thompson.pdf), search preview, checked 2026-10-01 (capped 85%) - bc hunting regulation, b.c. reg. 190/84 (https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/190_84_01), search preview, checked 2026-10-01 (75%) - bc chronic wasting disease page (https://www2.gov.bc.ca/gov/content/environment/plants-animals-ecosystems/wildlife/wildlife-conservation/wildlife-health/chronic-wasting-disease/cwd-bc), search preview, checked 2026-10-01 (80%) - research notes: research/2026-10-01-deer.md . "},{"id":"deer-mind","phase":4,"num":3,"title":"How a deer thinks","minutes":12,"checked":"2026-10-01","steps":[{"title":"How a deer thinks","html":"<aside class=\"callout why\"><div class=\"callout-t\">Why it matters<\/div><p>A deer's whole life is staying alive. If you think like a scared prey animal, you will stop spooking them.<\/p><\/aside><ul><li>A deer trusts its <strong>nose<\/strong> first, then its <strong>ears<\/strong>, then its <strong>eyes<\/strong> (Tip, ranking based on the facts below).<\/li><li>Its nose almost never lies. Its eyes are great at motion, poor at detail <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Wind and <strong>thermals<\/strong> (air sliding up or down a slope) decide where your scent goes <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Alarm has stages: alert, stamp, snort, run. You can sometimes stop it at stage 1 (Tip).<\/li><li>Cougars kill more southern Interior mule deer than any other cause. Deer are built around that fear <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Hunters change deer too: pressure pushes them into thicker cover and night movement <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><\/ul>"},{"title":"Senses ranked","html":"<div class=\"tbl\"><table><thead><tr><th>Rank<\/th><th>Sense<\/th><th>What it catches<\/th><th>Can you beat it?<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Nose<\/td><td>Your scent from far downwind<\/td><td>Only with the wind <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/td><\/tr><tr><td>2<\/td><td>Ears<\/td><td>High clicks, zips, nylon, voices<\/td><td>Yes, with quiet gear and slow feet <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/td><\/tr><tr><td>3<\/td><td>Eyes<\/td><td>Motion and outline, not colour detail<\/td><td>Yes, with stillness and a background <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>You can fool the eyes. You can quiet your feet. You can never fool the nose. Play the wind.<\/p><\/aside>"},{"title":"Eyes","html":"<ul><li>Deer have 2 colour cones, peaking near 455 nm (blue) and 537 nm (green). No red cone <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>So blaze orange looks dull, close to grey or brown, to a deer <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Deer pick up more ultraviolet (UV) light than we do <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Some laundry detergents add UV brighteners that may glow to a deer (Tip) <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>. Use unscented, no brightener soap.<\/li><li>Motion and outline give you away, not colour <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Lights: a moving headlamp or phone screen in the dark is pure motion. Red light, pointed at the ground (Tip).<\/li><\/ul>"},{"title":"Ears","html":"<ul><li>Deer hear about 115 Hz (hertz) to 54 kHz (kilohertz). Best around 4 to 8 kHz <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>That band is exactly zippers, Velcro, nylon swish, metal on metal, and snapping twigs <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Each ear swivels on its own to point at a sound <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Natural sounds (a squirrel, a deer walking, wind) are filtered out. Odd rhythms and metal are not (Tip).<\/li><\/ul><aside class=\"callout tip\"><div class=\"callout-t\">Tip (opinion)<\/div><p>Two legged walking is a steady \"crunch crunch crunch\". A deer walks, stops, walks. Copy that rhythm.<\/p><\/aside>"},{"title":"Nose","html":"<ul><li>Smell is a deer's strongest sense <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>The often quoted \"297 million scent receptors\" figure is folklore, not a measured fact <span class=\"cert c-tip\" title=\"Certainty\">45%<\/span>.<\/li><li>Your scent comes from breath, skin, clothes, boots and your truck (Tip).<\/li><li>Cover scents and scent control help a little. The wind helps a lot (Tip).<\/li><li>Deer and elk urine lures from outside BC are banned for hunting because of <button class=\"term\" data-term=\"CWD\">CWD<\/button> (Chronic Wasting Disease) <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><\/ul>"},{"title":"Wind and thermals","html":"<figure class=\"diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 340\" font-family=\"sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"400\" height=\"340\" fill=\"#fffaf0\"/>\n  <text x=\"200\" y=\"24\" font-size=\"17\" font-weight=\"bold\" fill=\"#2f3a2b\" text-anchor=\"middle\">Where deer are on a slope<\/text>\n  <!-- ground profile -->\n  <path d=\"M0 300 L110 300 L180 230 L215 222 L250 175 L285 168 L340 80 L400 70 L400 340 L0 340 Z\" fill=\"#d9cfb3\" stroke=\"#23261f\" stroke-width=\"2\"/>\n  <!-- trees on bench and upper slope -->\n  <g fill=\"#2f3a2b\">\n    <path d=\"M255 172 L262 145 L269 172 Z\"/>\n    <path d=\"M272 170 L279 140 L286 170 Z\"/>\n    <path d=\"M300 140 L307 112 L314 140 Z\"/>\n    <path d=\"M320 108 L327 80 L334 108 Z\"/>\n    <path d=\"M352 78 L359 52 L366 78 Z\"/>\n  <\/g>\n  <!-- field -->\n  <rect x=\"10\" y=\"292\" width=\"95\" height=\"8\" fill=\"#8a9a6b\"/>\n  <!-- deer dots -->\n  <circle cx=\"40\" cy=\"285\" r=\"6\" fill=\"#6b4f35\"/>\n  <circle cx=\"70\" cy=\"285\" r=\"6\" fill=\"#6b4f35\"/>\n  <circle cx=\"148\" cy=\"254\" r=\"6\" fill=\"#6b4f35\"/>\n  <circle cx=\"265\" cy=\"160\" r=\"6\" fill=\"#e8590c\"/>\n  <circle cx=\"345\" cy=\"70\" r=\"6\" fill=\"#e8590c\"/>\n  <!-- labels -->\n  <text x=\"55\" y=\"322\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Valley fields:<\/text>\n  <text x=\"55\" y=\"338\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">white tails<\/text>\n  <text x=\"185\" y=\"290\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Open grass:<\/text>\n  <text x=\"185\" y=\"306\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">feeding<\/text>\n  <text x=\"275\" y=\"228\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Bench + timber:<\/text>\n  <text x=\"275\" y=\"244\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">day beds<\/text>\n  <text x=\"345\" y=\"44\" font-size=\"14\" fill=\"#23261f\" text-anchor=\"middle\">Ridge<\/text>\n  <!-- thermals -->\n  <g stroke=\"#e8590c\" stroke-width=\"3\" fill=\"#e8590c\">\n    <line x1=\"60\" y1=\"120\" x2=\"110\" y2=\"80\"/>\n    <path d=\"M110 80 L98 82 L106 92 Z\"/>\n  <\/g>\n  <text x=\"20\" y=\"70\" font-size=\"14\" font-weight=\"bold\" fill=\"#e8590c\">Morning warms:<\/text>\n  <text x=\"20\" y=\"140\" font-size=\"14\" fill=\"#e8590c\">air flows UP<\/text>\n  <g stroke=\"#2f3a2b\" stroke-width=\"3\" fill=\"#2f3a2b\">\n    <line x1=\"230\" y1=\"60\" x2=\"180\" y2=\"100\"/>\n    <path d=\"M180 100 L192 98 L184 88 Z\"/>\n  <\/g>\n  <text x=\"170\" y=\"50\" font-size=\"14\" font-weight=\"bold\" fill=\"#2f3a2b\">Evening cools:<\/text>\n  <text x=\"170\" y=\"122\" font-size=\"14\" fill=\"#2f3a2b\">air flows DOWN<\/text>\n<\/svg>\n<\/figure><ul><li>Sun warms the slope in the morning. Warm air rises, so <strong>scent drifts uphill<\/strong> <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Slopes cool in the evening. Cool air sinks, so <strong>scent drifts downhill<\/strong> <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>At dawn before the sun hits, air often still sinks. It flips after sun warms the slope <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span>.<\/li><li>Draws and saddles swirl the air. Your scent can go everywhere (Tip).<\/li><li>Main wind usually beats thermals when it blows hard (Tip).<\/li><\/ul><aside class=\"callout lean\"><div class=\"callout-t\">My lean (opinion)<\/div><p>Morning: approach from above or from the side. Evening: hunt from below or the side, and leave before the cold air drains your scent down to the bedded deer.<\/p><\/aside><aside class=\"callout field\"><div class=\"callout-t\">Do this in the field<\/div><p>Carry a puffer bottle of unscented powder or a thread on your rifle. Check it every 10 minutes.<\/p><\/aside>"},{"title":"When a deer is alarmed","html":"<ol><li><strong>Alert:<\/strong> head up, ears forward, stare. Freeze until it looks away (Tip).<\/li><li><strong>Head bob:<\/strong> drops the head as if to feed, then snaps it up to catch you moving (hunter lore) <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li><strong>Foot stamp:<\/strong> stamps a front hoof. Warns other deer and tries to make you move <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li><strong>Snort or blow:<\/strong> a loud whoosh of air. All deer nearby are now on alert <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li><strong>Escape:<\/strong><ul><li>Mule deer <strong>stot<\/strong>: bounces on all 4 feet, good for steep broken ground <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>White tail <strong>flags<\/strong> and gallops to cover <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><\/ul><\/li><\/ol><ul><li>Mule deer often stop and look back from about 150 to 300 m (hunter lore) <span class=\"cert c-lo\" title=\"Certainty\">65%<\/span>.<\/li><\/ul><aside class=\"callout tip\"><div class=\"callout-t\">Tip (opinion)<\/div><p>If a deer stares at you, do not move a finger. Count to 100. Most deer go back to feeding if nothing else happens.<\/p><\/aside>"},{"title":"Predator pressure","html":"<ul><li>In the southern Interior mule deer project, cougars were the top cause of death, coyotes second <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Wolves have come back to the Thompson area <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>Against cougars (ambush hunters), deer pick spots with long sightlines <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Against wolves and dogs (chase hunters), deer use rugged steep slopes <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>.<\/li><li>Does live in family groups: more eyes and ears <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><li>What this means for you: deer bed where they can <strong>see below and smell above<\/strong> (Tip).<\/li><\/ul>"},{"title":"Human pressure","html":"<ul><li>Pressured deer move more at night and use thicker cover <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span>.<\/li><li>Opening days and weekends push deer away from roads (Tip).<\/li><li>Deer learn sounds: a truck door slam at a pullout can clear a slope (Tip).<\/li><li>Deer return to the same home range year after year, so spooking them is not forever <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span>.<\/li><\/ul><aside class=\"callout lean\"><div class=\"callout-t\">My lean (opinion)<\/div><p>Walk 500 m or more past the road and the pullouts. Park quietly. Close the door with your hip.<\/p><\/aside>"},{"title":"Folklore vs science","html":"<div class=\"tbl\"><table><thead><tr><th>Folklore<\/th><th>What we know<\/th><\/tr><\/thead><tbody><tr><td>Deer can't see blaze orange<\/td><td>Blaze orange looks dull to deer. Motion still gives you away <span class=\"cert c-lo\" title=\"Certainty\">75%<\/span><\/td><\/tr><tr><td>Deer have 297 million scent receptors<\/td><td>Unmeasured folklore. Nose is still their best sense <span class=\"cert c-tip\" title=\"Certainty\">45%<\/span><\/td><\/tr><tr><td>Bucks always bed on the top third of a slope<\/td><td>Often true, not a rule (lore) <span class=\"cert c-lo\" title=\"Certainty\">60%<\/span><\/td><\/tr><tr><td>The rut makes mule deer migrate<\/td><td>Snow and cold trigger migration <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/td><\/tr><tr><td>Deer urine lures are a must<\/td><td>Out of province deer products are banned in BC <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span>. Wind beats lures (Tip)<\/td><\/tr><tr><td>Grunt calls work all season<\/td><td>Rattling and calling work best near the rut, early November <span class=\"cert c-lo\" title=\"Certainty\">70%<\/span><\/td><\/tr><\/tbody><\/table><\/div>"},{"title":"Mistakes and rules","html":"<aside class=\"callout mistake\"><div class=\"callout-t\">Common mistakes<\/div><ul><li>Checking the wind once at the truck, then never again.<\/li><li>Moving when a deer is staring at you.<\/li><li>Wearing loud nylon and a jingling pack.<\/li><\/ul><\/aside><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>When a deer stamps, you've already lost the eyes. Don't lose the ears too. Freeze.<\/p><\/aside><aside class=\"callout rule\"><div class=\"callout-t\">Grandpa's rule (wisdom, not law)<\/div><p>The deer never makes a mistake with its nose. Make yours with the wind in your favour.<\/p><\/aside><div class=\"checklist\" data-list=\"s4-mind-kit\"><label class=\"check\"><input type=\"checkbox\" data-key=\"s4-mind-kit:0\"><span>Wind checker (powder puffer or thread)<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s4-mind-kit:1\"><span>Unscented soap, no UV brightener<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s4-mind-kit:2\"><span>Quiet outer layer (wool or fleece, no nylon swish)<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s4-mind-kit:3\"><span>Tape over any clinking metal on pack and sling<\/span><\/label><label class=\"check\"><input type=\"checkbox\" data-key=\"s4-mind-kit:4\"><span>Red light headlamp<\/span><\/label><\/div>"},{"title":"Sources","html":"<ul><li>Jacobs and others 1994, deer colour vision (cone peaks), via research notes, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/li><li>D'Angelo and others 2007, <a href=\"https://wildlife.onlinelibrary.wiley.com/doi/abs/10.2193/2006-326\" target=\"_blank\" rel=\"noopener\">deer hearing<\/a>, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/li><li>Stewart and others 2002, <a href=\"https://academic.oup.com/jmammal/article/84/3/1076/905056\" target=\"_blank\" rel=\"noopener\">deer activity timing<\/a>, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/li><li>Monteith and others 2011, <a href=\"https://esajournals.onlinelibrary.wiley.com/doi/full/10.1890/ES10-00096.1\" target=\"_blank\" rel=\"noopener\">what triggers migration<\/a>, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/li><li>BC Wildlife Federation, <a href=\"https://bcwf.bc.ca/initiatives/mule-deer-project/\" target=\"_blank\" rel=\"noopener\">Southern Interior Mule Deer Project<\/a>, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/li><li>Lingle 2003, deer group behaviour and predators, via research notes, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">85%<\/span><\/li><li>BC <a href=\"https://www2.gov.bc.ca/gov/content/environment/plants-animals-ecosystems/wildlife/wildlife-conservation/wildlife-health/chronic-wasting-disease/cwd-bc\" target=\"_blank\" rel=\"noopener\">chronic wasting disease page<\/a>, search preview, checked 2026-10-01 <span class=\"cert c-mid\" title=\"Certainty\">80%<\/span><\/li><li>Research notes: <code>research/2026-10-01-deer.md<\/code>.<\/li><\/ul>"}],"quiz":[{"q":"Which sense can you never fully beat?","options":["Eyes","Ears","Nose"],"answer":2,"why":"Smell is a deer's strongest sense. Only the wind protects you."},{"q":"It is 08:30, sun on the slope. Which way does your scent drift?","options":["Uphill","Downhill","Nowhere"],"answer":0,"why":"Sun warms the slope and warm air rises, so scent drifts uphill. Approach from above or the side."},{"q":"A deer stares at you and stamps a hoof. What do you do?","options":["Raise the rifle fast","Freeze completely","Step behind a tree"],"answer":1,"why":"The stamp is a test to make you move. Freeze until it looks away or relaxes."},{"q":"What gives a hunter in blaze orange away?","options":["The bright colour","Motion and outline","Nothing"],"answer":1,"why":"Deer have no red cone, so orange looks dull. They catch motion and shape very fast."},{"q":"What is the top cause of death for southern Interior mule deer?","options":["Hunters","Cougars","Winter starvation"],"answer":1,"why":"In the southern Interior mule deer project, cougars were first and coyotes second."}],"checklists":["s4-mind-kit"],"text":" !why a deer's whole life is staying alive. if you think like a scared prey animal, you will stop spooking them. - a deer trusts its nose first, then its ears , then its eyes (tip, ranking based on the facts below). - its nose almost never lies. its eyes are great at motion, poor at detail (85%). - wind and thermals (air sliding up or down a slope) decide where your scent goes (80%). - alarm has stages: alert, stamp, snort, run. you can sometimes stop it at stage 1 (tip). - cougars kill more southern interior mule deer than any other cause. deer are built around that fear (85%). - hunters change deer too: pressure pushes them into thicker cover and night movement (70%). senses ranked rank sense what it catches can you beat it? --- --- --- --- 1 nose your scent from far downwind only with the wind (85%) 2 ears high clicks, zips, nylon, voices yes, with quiet gear and slow feet (85%) 3 eyes motion and outline, not colour detail yes, with stillness and a background (85%) !rule you can fool the eyes. you can quiet your feet. you can never fool the nose. play the wind. eyes - deer have 2 colour cones, peaking near 455 nm (blue) and 537 nm (green). no red cone (85%). - so blaze orange looks dull, close to grey or brown, to a deer (75%). - deer pick up more ultraviolet (uv) light than we do (75%). - some laundry detergents add uv brighteners that may glow to a deer (tip) (65%). use unscented, no brightener soap. - motion and outline give you away, not colour (85%). - lights: a moving headlamp or phone screen in the dark is pure motion. red light, pointed at the ground (tip). ears - deer hear about 115 hz (hertz) to 54 khz (kilohertz). best around 4 to 8 khz (85%). - that band is exactly zippers, velcro, nylon swish, metal on metal, and snapping twigs (85%). - each ear swivels on its own to point at a sound (75%). - natural sounds (a squirrel, a deer walking, wind) are filtered out. odd rhythms and metal are not (tip). !tip two legged walking is a steady \"crunch crunch crunch\". a deer walks, stops, walks. copy that rhythm. nose - smell is a deer's strongest sense (85%). - the often quoted \"297 million scent receptors\" figure is folklore, not a measured fact (45%). - your scent comes from breath, skin, clothes, boots and your truck (tip). - cover scents and scent control help a little. the wind helps a lot (tip). - deer and elk urine lures from outside bc are banned for hunting because of cwd (chronic wasting disease) (80%). wind and thermals - sun warms the slope in the morning. warm air rises, so scent drifts uphill (80%). - slopes cool in the evening. cool air sinks, so scent drifts downhill (80%). - at dawn before the sun hits, air often still sinks. it flips after sun warms the slope (75%). - draws and saddles swirl the air. your scent can go everywhere (tip). - main wind usually beats thermals when it blows hard (tip). !lean morning: approach from above or from the side. evening: hunt from below or the side, and leave before the cold air drains your scent down to the bedded deer. !field carry a puffer bottle of unscented powder or a thread on your rifle. check it every 10 minutes. when a deer is alarmed 1. alert: head up, ears forward, stare. freeze until it looks away (tip). 2. head bob: drops the head as if to feed, then snaps it up to catch you moving (hunter lore) (70%). 3. foot stamp: stamps a front hoof. warns other deer and tries to make you move (70%). 4. snort or blow: a loud whoosh of air. all deer nearby are now on alert (70%). 5. escape: - mule deer stot : bounces on all 4 feet, good for steep broken ground (85%). - white tail flags and gallops to cover (85%). - mule deer often stop and look back from about 150 to 300 m (hunter lore) (65%). !tip if a deer stares at you, do not move a finger. count to 100. most deer go back to feeding if nothing else happens. predator pressure - in the southern interior mule deer project, cougars were the top cause of death, coyotes second (85%). - wolves have come back to the thompson area (85%). - against cougars (ambush hunters), deer pick spots with long sightlines (80%). - against wolves and dogs (chase hunters), deer use rugged steep slopes (80%). - does live in family groups: more eyes and ears (85%). - what this means for you: deer bed where they can see below and smell above (tip). human pressure - pressured deer move more at night and use thicker cover (70%). - opening days and weekends push deer away from roads (tip). - deer learn sounds: a truck door slam at a pullout can clear a slope (tip). - deer return to the same home range year after year, so spooking them is not forever (85%). !lean walk 500 m or more past the road and the pullouts. park quietly. close the door with your hip. folklore vs science folklore what we know --- --- deer can't see blaze orange blaze orange looks dull to deer. motion still gives you away (75%) deer have 297 million scent receptors unmeasured folklore. nose is still their best sense (45%) bucks always bed on the top third of a slope often true, not a rule (lore) (60%) the rut makes mule deer migrate snow and cold trigger migration (85%) deer urine lures are a must out of province deer products are banned in bc (80%). wind beats lures (tip) grunt calls work all season rattling and calling work
