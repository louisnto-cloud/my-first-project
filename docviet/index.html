> One paragraph = one ý chính. If a paragraph has two main ideas, it wants to be two paragraphs.`,keyWords:[{word:"mở bài",meaning:"essay opening / introduction"},{word:"thân bài",meaning:"essay body"},{word:"kết bài",meaning:"essay conclusion"},{word:"ví dụ",meaning:"example; for example"},{word:"tóm lại",meaning:"in summary"}],exercises:[{id:"e1",kind:"multiple-choice",prompt:"The three parts of a Vietnamese essay are:",options:["title, body, picture","mở bài, thân bài, kết bài","question, answer, quiz","intro, joke, ending"],answer:"mở bài, thân bài, kết bài"},{id:"e2",kind:"multiple-choice",prompt:"Where do your ideas get developed with examples?",options:["mở bài","thân bài","kết bài","tiêu đề"],answer:"thân bài"},{id:"e3",kind:"multiple-choice",prompt:'"Tóm lại" signals:',options:["a new example","a summary is coming","a question","dialogue"],answer:"a summary is coming"},{id:"e4",kind:"multiple-choice",prompt:"How many main ideas should one paragraph carry?",options:["as many as possible","exactly one","at least three","none"],answer:"exactly one"},{id:"e5",kind:"fill-blank",prompt:'Complete the signpost for "for example": ví ___',answer:"dụ"}],writingPrompt:`Outline (don't write!) an essay "Tại sao tôi học tiếng Việt": one mở bài sentence, three thân bài bullet ideas with a ví dụ each, one kết bài sentence.`},{id:"m6w2l2",monthIndex:5,weekIndex:1,lessonIndex:1,title:"Editing & the Diacritic Checklist",kind:"writing",objective:"Proofread Vietnamese like a pro — tones first",audioText:"Writers write; experts rewrite. Vietnamese proofreading has one special weapon: the diacritic sweep. Read your draft once looking ONLY at tone marks and letter hats. Is every ơ horned? Every đ barred? Is it hỏi or ngã? One wrong mark makes a different word: bán, to sell, becomes bàn, a table. Sweep tones first, then spelling, then everything else.",content:`## The three sweeps (in order!)
### 1. Dấu — the diacritic sweep 🎵
Read once looking ONLY at marks:
✓ every **đ** barred? every **ơ/ư** horned? every **â/ê/ô** hatted?
✓ **hỏi ( ̉ ) or ngã (~)**? — the classic mix-up: nghỉ (rest) vs nghĩ (think)!
✓ tone on the right vowel? (ch**à**o not ch**a**ò)
✓ one wrong mark = a different word: **bán** (sell) / **bàn** (table) / **bạn** (friend)

### 2. Chính tả — spelling sweep
✓ c/k, g/gh, ng/ngh before i, e, ê (Month 2's golden rule)
✓ d or gi? tr or ch? s or x? — the homophone traps

### 3. Câu — sentence sweep
✓ capitals at sentence starts, punctuation at ends
✓ paired conjunctions BOTH present (tuy…nhưng)
✓ pronouns consistent (don't drift from em to tôi mid-letter)

## Spot-the-error drill
| Written | Should be | Why |
|---------|-----------|-----|
| Tôi *nghỉ* rằng… | Tôi **nghĩ** rằng… | think = ngã, not hỏi |
| *ngi* ngờ | **nghi** ngờ | ngh before i |
| Tôi *ban* sách. | Tôi **bán** sách. | sell needs sắc |`,keyWords:[{word:"sửa",meaning:"to edit; to fix"},{word:"dấu",meaning:"mark; diacritic"},{word:"lỗi",meaning:"mistake; error"},{word:"nghĩ",meaning:"to think (ngã tone!)"}],exercises:[{id:"e1",kind:"multiple-choice",prompt:"The FIRST proofreading sweep checks:",options:["paragraph order","diacritics and tone marks","handwriting","word count"],answer:"diacritics and tone marks"},{id:"e2",kind:"multiple-choice",prompt:'"Nghỉ" vs "nghĩ" — which means "to think"?',options:["nghỉ (hỏi)","nghĩ (ngã)","both","neither"],answer:"nghĩ (ngã)"},{id:"e3",kind:"multiple-choice",prompt:'"Tôi ban sách" should be "Tôi bán sách" because:',options:["ban is not a word",'"sell" needs the sắc tone',"sách needs a hat","tôi is wrong"],answer:'"sell" needs the sắc tone'},{id:"e4",kind:"multiple-choice",prompt:"Which is spelled correctly?",options:["ngi ngờ","nghi ngờ","ngí ngờ","nqhi ngờ"],answer:"nghi ngờ"},{id:"e5",kind:"multiple-choice",prompt:'"Lỗi" means:',options:["tone","mistake","sentence","draft"],answer:"mistake"}],writingPrompt:"Take any earlier writing response of yours and rewrite it here, improved. Then list two lỗi you found and fixed — at least one involving a diacritic."},{id:"m6w2l3",monthIndex:5,weekIndex:1,lessonIndex:2,title:"Capstone: Your 300-Word Piece",kind:"writing",objective:"Write a complete 300–400 word Vietnamese piece — story, letter, or essay",audioText:"This is it — the final lesson. Six months ago, ă and ơ were mysterious squiggles. Today you will write three hundred words of real Vietnamese. Choose your form: a story with ngày xưa, a letter with kính gửi, or an essay with mở bài, thân bài, kết bài. Plan, write, then run your three sweeps. Your certificate is waiting. Chúc bạn may mắn — good luck!",content:`## Choose ONE form
| Form | Skeleton | Steal from |
|------|----------|-----------|
| 📖 **Câu chuyện** (story) | Ngày xưa… → conflict → cuối cùng… | Month 6 story lessons, the Library |
| ✉️ **Lá thư** (letter) | Kính gửi / thân mến → health → news → closing | Month 5 letters |
| 📝 **Bài luận** (essay) | mở bài → thân bài ×3 → kết bài | Month 6 essay lesson |

## The bar to clear (300–400 words)
✓ every tone mark and hat in place — run the **diacritic sweep**
✓ at least one **vì…nên / tuy…nhưng / nếu…thì** pair
✓ at least one **từ láy** (lấp lánh, vui vẻ…) or **so sánh** (như…)
✓ connectors: và, nhưng, vì, nên — no bare sentence piles
✓ consistent pronouns (tôi/em… pick and hold)

## Plan (5 minutes, in Vietnamese!)
1. Form + topic — one line
2. Three bullet ideas
3. First sentence drafted in your head before you type

## After writing
Run the three sweeps from the editing lesson: dấu → chính tả → câu.
Then breathe. You just wrote hundreds of words in a language you couldn't read six months ago. **Chúc mừng — congratulations, chuyên gia!** 🎓`,keyWords:[{word:"bài luận",meaning:"essay"},{word:"câu chuyện",meaning:"story"},{word:"chúc mừng",meaning:"congratulations"},{word:"may mắn",meaning:"lucky; good luck"}],exercises:[{id:"e1",kind:"multiple-choice",prompt:"The capstone piece should be:",options:["50–100 words","100–200 words","300–400 words","1000+ words"],answer:"300–400 words"},{id:"e2",kind:"multiple-choice",prompt:"Which is NOT one of the three offered forms?",options:["câu chuyện (story)","lá thư (letter)","bài luận (essay)","bài hát (song)"],answer:"bài hát (song)"},{id:"e3",kind:"multiple-choice",prompt:"After drafting, your FIRST sweep checks:",options:["word count","diacritics (dấu)","the title","paragraph count"],answer:"diacritics (dấu)"},{id:"e4",kind:"multiple-choice",prompt:'"Chúc mừng" means:',options:["goodbye","congratulations","please","welcome"],answer:"congratulations"},{id:"e5",kind:"multiple-choice",prompt:"A story form would open with:",options:["Kính gửi","Ngày xưa","Tóm lại","Theo báo"],answer:"Ngày xưa"}],writingPrompt:"Write your capstone: 300–400 words in Vietnamese — a story (ngày xưa…), a letter (kính gửi…), or an essay (mở bài/thân bài/kết bài). Include one paired conjunction, one từ láy or so sánh, and run your three sweeps before finishing. Chúc bạn may mắn! 🎓"}]}]},sn=[Tm,Cm,Em,Lm,Im,_m];function gr(){return sn.flatMap(e=>e.weeks.flatMap(n=>n.lessons))}const yr={red:{bg:"bg-red-600",text:"text-red-600",border:"border-red-300",light:"bg-red-50"},amber:{bg:"bg-amber-500",text:"text-amber-600",border:"border-amber-300",light:"bg-amber-50"},emerald:{bg:"bg-emerald-600",text:"text-emerald-600",border:"border-emerald-300",light:"bg-emerald-50"},orange:{bg:"bg-orange-500",text:"text-orange-600",border:"border-orange-300",light:"bg-orange-50"},rose:{bg:"bg-rose-500",text:"text-rose-600",border:"border-rose-300",light:"bg-rose-50"},viol Mẹ chỉ nói: "Chào con." Bố đọc báo, không nói gì. Anh Minh xem ti vi.

Lan buồn. Lan nghĩ: "Mọi người quên sinh nhật của mình rồi."

Về nhà, Nam kể cho bố: "Chợ vui lắm bố ạ! Tuần sau con muốn đi nữa."`,vocab:[{word:"chợ",meaning:"market"},{word:"đông",meaning:"crowded"},{word:"tươi",meaning:"fresh"},{word:"bánh rán",meaning:"fried doughnut"}],quiz:[{id:"q1",prompt:"When do Nam and his mother go to the market?",options:["Monday morning","Sunday morning","Saturday evening","Friday noon"],answer:"Sunday morning"},{id:"q2",prompt:"What vegetables does the mother buy?",options:["carrots and potatoes","water spinach and tomatoes","cabbage and onions","corn and beans"],answer:"water spinach and tomatoes"},{id:"q3",prompt:"What does Nam choose at the fish stall?",options:["a small fish","a big fish","two fish","a crab"],answer:"a big fish"},{id:"q4",prompt:"What treat does Nam get?",options:["ice cream","a fried doughnut","candy","fruit"],answer:"a fried doughnut"},{id:"q5",prompt:"How does Nam feel about the market?",options:["bored — he never wants to return","happy — he wants to go again","scared of the crowd","tired and hungry"],answer:"happy — he wants to go again"}]},{id:"s4a",level:4,title:"Chuyến Xe Buýt",emoji:"🚌",minutes:4,text:`Mỗi sáng, Hoa đi học bằng xe buýt số 32. Hôm nay, xe rất đông. Hoa may mắn có một chỗ ngồi gần cửa sổ.

Hoa đứng dậy ngay. "Bà ơi, bà ngồi chỗ của cháu ạ," Hoa nói.

Bà cụ cười hiền: "Cảm ơn cháu. Cháu ngoan quá."

Một chú đứng gần đó nhìn thấy. Chú cũng đứng dậy nhường chỗ cho một cô đang bế em bé. Rồi một anh học sinh nhường chỗ cho một ông cụ.

Hoa nghĩ về câu nói ấy suốt cả ngày.`,vocab:[{word:"xe buýt",meaning:"bus"},{word:"bà cụ",meaning:"elderly lady"},{word:"nhường chỗ",meaning:"to give up one's seat"},{word:"hạt giống",meaning:"seed"}],quiz:[{id:"q1",prompt:"How does Hoa get to school?",options:["by bicycle","by bus number 32","on foot","by motorbike"],answer:"by bus number 32"},{id:"q2",prompt:"What does Hoa do when the old lady boards?",options:["looks out the window","gives up her seat","helps carry the bag","moves to the back"],answer:"gives up her seat"},{id:"q3",prompt:"What happens after Hoa's kind act?",options:["nothing changes","other passengers also give up their seats","the bus stops","everyone applauds"],answer:"other passengers also give up their seats"},{id:"q4",prompt:"The old lady compares kindness to:",options:["a warm coat","a seed that grows a garden","a bus ticket","sunshine"],answer:"a seed that grows a garden"},{id:"q5",prompt:"The main idea (ý chính) of this story is:",options:["buses are crowded","one kind act inspires many more","old people ride buses","winter is cold"],answer:"one kind act inspires many more"}]},{id:"s4b",level:4,title:"Bức Thư Của Ông",emoji:"✉️",minutes:4,text:`Chiều thứ bảy, Minh nhận được một bức thư. Thư của ông nội gửi từ quê.

Minh mở thư và đọc:

"Cháu Minh thân mến,

Dạo này cháu có khỏe không? Ông và bà vẫn khỏe. Vườn nhà mình đang mùa ổi chín. Cây ổi cháu trồng năm ngoái đã cao hơn đầu ông rồi!

Con trâu nhà bác Ba mới có nghé con. Nghé nhỏ xíu, chân còn run run mà đã đòi chạy khắp sân.

Hè này cháu về quê chơi nhé. Ông sẽ dạy cháu thả diều ngoài đê. Bà bảo sẽ nấu chè đỗ đen cho cháu ăn.

Ông nhớ cháu lắm.
