const Stickers = {
  earnedIds() {
    return STICKERS.filter(st => { try { return st.got(Store.state); } catch (e) { return false; } }).map(st => st.id);
  },

  // Returns newly-earned stickers since last sync; seeds silently the first time.
  sync() {
    const earned = Stickers.earnedIds();
    if (Store.state.stickersSeen == null) { Store.state.stickersSeen = earned; Store.save(); return []; }
    const seen = new Set(Store.state.stickersSeen);
    const fresh = earned.filter(id => !seen.has(id));
    if (fresh.length) { Store.state.stickersSeen = earned; Store.save(); }
    return fresh.map(id => STICKERS.find(s => s.id === id));
  },

  count() { return Stickers.earnedIds().length; },

  show() {
    const app = document.getElementById('app');
    app.innerHTML = '';
    const screen = U.el('div', 'screen sticker-screen');
    screen.appendChild(Level.topBar('✨ Sticker Book', () => WorldMap.showHome()));
    const earned = new Set(Stickers.earnedIds());
    screen.appendChild(U.el('div', 'sticker-count', `${earned.size} / ${STICKERS.length} collected`));
    const grid = U.el('div', 'sticker-grid');
    STICKERS.forEach(st => {
      const got = earned.has(st.id);
      const cell = U.el('div', 'sticker' + (got ? ' got' : ''));
      cell.innerHTML = `<div class="sticker-face">${got ? st.e : '❓'}</div>
        <div class="sticker-name">${got ? U.esc(st.name) : '???'}</div>
        <div class="sticker-hint">${U.esc(st.hint)}</div>`;
      if (got) cell.addEventListener('click', () => { Audio2.pop(); Audio2.say(st.name + '. ' + st.hint + '.'); });
      grid.appendChild(cell);
    });
    screen.appendChild(grid);
    app.appendChild(screen);
  }
};

/* ---- Mini games: pure play, no learning content ---- */

const MiniGames = {
  play(id) {
    if (id === 'g-draw') MiniGames.drawing();
    else if (id === 'g-music') MiniGames.music();
    else if (id === 'g-dress') Shop.show('style');
  },

  drawing() {
    const app = document.getElementById('app');
    app.innerHTML = '';
    const screen = U.el('div', 'screen game-screen');
    screen.appendChild(Level.topBar('🎨 Doodle Den', () => Shop.show('games')));
    const stage = U.el('div', 'draw-stage');
    const canvas = document.createElement('canvas');
    canvas.className = 'draw-canvas';
    stage.appendChild(canvas);
    screen.appendChild(stage);

    const palette = ['#3d3554', '#ff7a59', '#ffd34d', '#4ecdc4', '#9b8cff', '#f26d9c', '#5fb0f2', '#57b884', '#ffffff'];
    let color = palette[1], size = 8;
    const tools = U.el('div', 'draw-tools');
    palette.forEach(p => {
      const b = U.el('button', 'draw-swatch');
      b.style.background = p;
      b.addEventListener('click', () => { color = p; Audio2.tap(); });
      tools.appendChild(b);
    });
    [['S', 4], ['M', 10], ['L', 24]].forEach(([l, s]) => {
      const b = U.el('button', 'draw-size', l);
      b.addEventListener('click', () => { size = s; Audio2.tap(); });
      tools.appendChild(b);
    });
    const clear = U.el('button', 'ghost-btn', '↺');
    tools.appendChild(clear);
    screen.appendChild(tools);
    app.appendChild(screen);

    const ctx = canvas.getContext('2d');
    setTimeout(() => {
      const r = stage.getBoundingClientRect();
      canvas.width = r.width * devicePixelRatio;
      canvas.height = r.height * devicePixelRatio;
      ctx.scale(devicePixelRatio, devicePixelRatio);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.fillStyle = '#fffaf2';
      ctx.fillRect(0, 0, r.width, r.height);
    }, 60);
    clear.addEventListener('click', () => {
      const r = stage.getBoundingClientRect();
      ctx.fillStyle = '#fffaf2';
      ctx.fillRect(0, 0, r.width, r.height);
    });

    let drawing = false, last = null;
    const pos = e => {
      const r = canvas.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return { x: p.clientX - r.left, y: p.clientY - r.top };
    };
    const start = e => { drawing = true; last = pos(e); e.preventDefault(); };
    const move = e => {
      if (!drawing) return;
      const p = pos(e);
      ctx.strokeStyle = color; ctx.lineWidth = size;
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      last = p; e.preventDefault();
    };
    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', () => drawing = false);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', () => drawing = false);
  },

  music() {
    const app = document.getElementById('app');
    app.innerHTML = '';
    const screen = U.el('div', 'screen game-screen');
    screen.appendChild(Level.topBar('🎹 Melody Maker', () => Shop.show('games')));

    const colors = ['#ff7a59', '#ffb14a', '#ffd34d', '#57b884', '#4ecdc4', '#5fb0f2', '#9b8cff', '#f26d9c'];
    let recording = [], recordStart = null;

    const pads = U.el('div', 'music-pads');
    colors.forEach((c, i) => {
      const b = U.el('button', 'music-pad');
      b.style.background = c;
      b.addEventListener('pointerdown', () => {
        Audio2.note(i);
        b.classList.add('hit');
        setTimeout(() => b.classList.remove('hit'), 250);
        if (recordStart !== null) recording.push({ i, t: Date.now() - recordStart });
      });
      pads.appendChild(b);
    });
    screen.appendChild(pads);

    const row = U.el('div', 'demo-actions');
    const rec = U.el('button', 'ghost-btn', '⏺ Record');
    const play = U.el('button', 'primary-btn', '▶ Play it back');
    rec.addEventListener('click', () => {
      if (recordStart === null) {
        recording = []; recordStart = Date.now();
        rec.textContent = '⏹ Stop'; rec.classList.add('recording');
      } else {
        recordStart = null;
        rec.textContent = '⏺ Record'; rec.classList.remove('recording');
      }
    });
    play.addEventListener('click', () => {
      recording.forEach(n => setTimeout(() => {
        Audio2.note(n.i);
        const pad = pads.children[n.i];
        pad.classList.add('hit');
        setTimeout(() => pad.classList.remove('hit'), 200);
      }, n.t));
    });
    row.appendChild(rec); row.appendChild(play);
    screen.appendChild(row);
    app.appendChild(screen);
  }
};


/* LearnQuest — level flow: Show me → Try it → Prove it.
   Also runs Review Mix, Boss Challenges, and Fast Track samplers. */
'use strict';

const Level = {
  current: null,

  /* Entry points ------------------------------------------------------- */

  playSkill(level) {
    Level.current = { kind: 'skill', level };
    Level.showDemo(level);
  },

  playReview(level) {
    Level.current = { kind: 'review', level };
    const qs = Quest.forReview(level, 6);
    Level.runQuiz({
      title: 'Review Mix',
      icon: '🔄',
      intro: 'Review time! A little bit of everything you have learned. Show me what you remember!',
      questions: qs,
      passRatio: 0.8,
      practice: false,
      onDone: (acc, passed) => Level.finishLevel(level, acc, passed)
    });
  },

  playBoss(region) {
    Level.current = { kind: 'boss', region };
    const qs = Quest.forRegion(region, 15);
    Level.runQuiz({
      title: 'Boss Challenge',
      icon: '👑',
      intro: `This is it — the ${region.name} Boss Challenge! Fifteen questions from everything in this land. You have got this!`,
      questions: qs,
      passRatio: 0.85,
      practice: false,
      boss: true,
      onDone: (acc, passed) => {
        if (passed) {
          const coins = Store.passBoss(region.id);
          Celebrate.boss(region, acc, coins);
        } else {
          Celebrate.tryAgain(
            'So close to the crown!',
            'The boss is tough — that is what makes it epic. Play a level or two, then come back stronger!',
            () => WorldMap.showRegion(region.id)
          );
        }
      }
    });
  },

  playFastTrack(region) {
    Level.current = { kind: 'fast', region };
    const qs = Quest.forRegion(region, 10);
    Level.runQuiz({
      title: 'Lightning Trial',
      icon: '⚡',
      intro: `A bonus challenge! Ten questions from all of ${region.name}. Ace nine of them and you conquer the whole land at once!`,
      questions: qs,
      passRatio: 0.9,
      practice: false,
      boss: true,
      onDone: (acc, passed) => {
        if (passed) {
          Store.fastTrack(region.id, region);
          Celebrate.fastTrack(region, acc);
        } else {
          Celebrate.tryAgain(
            'What a brave try!',
            'That lightning trial was fierce. No worries — the path through ' + region.name + ' is full of fun. Every level makes you stronger!',
            () => WorldMap.showRegion(region.id)
          );
        }
      }
    });
  },

  /* Phase 1 — Show me ----------------------------------------------------- */

  showDemo(level) {
    const app = document.getElementById('app');
    const sample = Quest.make(level.gen, level.params);
    app.innerHTML = '';
    const screen = U.el('div', 'screen level-screen demo-screen');
    screen.appendChild(Level.topBar(level.icon + ' ' + level.name, () => WorldMap.showRegion(level.region.id)));

    const card = U.el('div', 'demo-card');
    card.innerHTML = `
      <div class="phase-chip">👀 Show me</div>
      <div class="demo-stage">
        ${sample.visual || `<div class="demo-big">${level.icon}</div>`}
        <div class="demo-prompt">${sample.passage ? passageHTML(sample.passage) : ''}${U.esc(sample.prompt)}</div>
        <div class="demo-answer" id="demo-answer"></div>
      </div>`;
    screen.appendChild(card);

    const row = U.el('div', 'demo-actions');
    const replay = U.el('button', 'ghost-btn', '🔊 Hear it again');
    const go = U.el('button', 'primary-btn', 'My turn! →');
    row.appendChild(replay);
    row.appendChild(go);
    screen.appendChild(row);
    app.appendChild(screen);

    // Reveal the answer visually after a beat — a worked example, not a lecture.
    // Sort/match/trace demos have no single "answer" to reveal; the explanation carries them.
    const answerText = sample.format === 'numpad' || sample.format === 'typed' || sample.format === 'numberline' ? String(sample.answer)
      : sample.format === 'tap' ? (sample.choices.find(c => c.correct).label || null)
      : sample.format === 'sequence' ? sample.sequence.join(' ')
      : sample.format === 'blank' ? sample.answer
      : null;
    setTimeout(() => {
      const da = document.getElementById('demo-answer');
      if (da && answerText) { da.innerHTML = `<span class="demo-reveal">${U.esc(answerText)}</span>`; }
    }, 1600);

    const narration = `${level.name}! Watch first. ${sample.say || sample.prompt} ... ` +
      (answerText ? `The answer is ${answerText}. ` : '') +
      `${sample.explain || ''} Now you try!`;
    const speak = () => Audio2.say(narration);
    speak();
    replay.addEventListener('click', speak);
    go.addEventListener('click', () => {
      Audio2.stop();
      Level.practice(level);
    });
  },

  /* Phase 2 — Try it (guided, unlimited attempts) ---------------------------- */

  practice(level) {
    const questions = Quest.forLevel(level, 3);
    let idx = 0;

    const next = () => {
      if (idx >= questions.length) { Level.prove(level); return; }
      Level.renderQuestion({
        q: questions[idx],
        title: level.icon + ' ' + level.name,
        phase: { label: '🧪 Try it', cls: 'phase-try' },
        progress: { done: idx, total: questions.length },
        hints: true,
        backTo: () => WorldMap.showRegion(level.region.id),
        onCorrect: () => {
          idx++;
          Celebrate.smallWin(() => next());
        },
        onWrong: (q, replayQuestion) => {
          // Gentle teaching: explain, then let her try the same idea again
          Celebrate.gentleExplain(q.explain, () => {
            questions[idx] = Quest.make(level.gen, level.params);
            replayQuestion(questions[idx]);
          });
        }
      });
    };
    next();
  },

  /* Phase 3 — Prove it (unaided, 80%) --------------------------------------- */

  prove(level) {
    const qs = Quest.forLevel(level, 6);
    Level.runQuiz({
      title: level.icon + ' ' + level.name,
      icon: '🛡️',
      intro: 'Prove it time! No hints now — you know this. Six questions. Go!',
      questions: qs,
      passRatio: 0.8,
      onDone: (acc, passed) => Level.finishLevel(level, acc, passed)
    });
  },

  finishLevel(level, acc, passed) {
    if (passed) {
      const stars = acc >= 0.99 ? 3 : acc >= 0.85 ? 2 : 1;
      const res = Store.completeLevel(level.id, stars);
      Celebrate.levelWin(level, stars, res.coinsEarned);
    } else {
      Celebrate.tryAgain(
        'Almost there!',
        'Let\'s warm up with a little more practice — then you will crush it.',
        () => {
          if (level.type === 'review') Level.playReview(level);
          else Level.practice(level);
        }
      );
    }
  },

  /* Quiz runner (prove / review / boss / fast-track) -------------------------- */

  runQuiz(cfg) {
    let idx = 0, correct = 0, combo = 0;
    const total = cfg.questions.length;

    const intro = () => {
      const app = document.getElementById('app');
      app.innerHTML = '';
      const screen = U.el('div', 'screen quiz-intro' + (cfg.boss ? ' boss-intro' : ''));
      screen.appendChild(Level.topBar(cfg.title, () => { Audio2.stop(); WorldMap.back(); }));
      const card = U.el('div', 'intro-card');
      card.innerHTML = `<div class="intro-icon">${cfg.icon}</div>
        <h2>${U.esc(cfg.title)}</h2>
        <div class="intro-sub">${total} questions</div>`;
      const go = U.el('button', 'primary-btn big-go', cfg.boss ? '⚔️ Begin!' : 'Ready! →');
      const replay = U.el('button', 'ghost-btn', '🔊');
      const row = U.el('div', 'demo-actions');
      row.appendChild(replay); row.appendChild(go);
      card.appendChild(row);
      screen.appendChild(card);
      app.appendChild(screen);
      Audio2.say(cfg.intro);
      replay.addEventListener('click', () => Audio2.say(cfg.intro));
      go.addEventListener('click', () => { Audio2.stop(); if (cfg.boss) Audio2.fanfare(); ask(); });
    };

    const ask = () => {
      if (idx >= total) {
        const acc = correct / total;
        cfg.onDone(acc, acc >= cfg.passRatio - 0.0001);
        return;
      }
      Level.renderQuestion({
        q: cfg.questions[idx],
        title: cfg.title,
        phase: { label: cfg.boss ? '👑 ' + (idx + 1) + ' / ' + total : '🛡️ Prove it', cls: 'phase-prove' },
        progress: { done: idx, total },
        score: { correct, total: idx },
        hints: false,
        backTo: () => WorldMap.back(),
        onCorrect: () => {
          correct++; idx++; combo++;
          if (combo >= 3) Audio2.combo(combo);
          Celebrate.smallWin(() => ask(), combo);
        },
        onWrong: (q) => {
          idx++; combo = 0;
          // Teach, never punish — then move on
          Celebrate.gentleExplain(q.explain, () => ask());
        }
      });
    };

    intro();
  },

  /* Question renderer --------------------------------------------------------- */

  renderQuestion(opts) {
    const app = document.getElementById('app');
    app.innerHTML = '';
    const q = opts.q;
    const screen = U.el('div', 'screen level-screen');
    screen.appendChild(Level.topBar(opts.title, () => { Audio2.stop(); opts.backTo(); }));

    // progress beads
    const beads = U.el('div', 'beads');
    for (let i = 0; i < opts.progress.total; i++) {
      beads.appendChild(U.el('span', 'bead' + (i < opts.progress.done ? ' done' : i === opts.progress.done ? ' now' : '')));
    }
    screen.appendChild(beads);

    const card = U.el('div', 'question-card');
    card.appendChild(U.el('div', 'phase-chip ' + (opts.phase.cls || ''), opts.phase.label));

    if (q.passage) {
      card.insertAdjacentHTML('beforeend', passageHTML(q.passage));
    }
    if (q.visual) {
      const v = U.el('div', 'q-visual');
      v.innerHTML = q.visual;
      card.appendChild(v);
    }

    const promptRow = U.el('div', 'prompt-row');
    const replay = U.el('button', 'replay-btn', '🔊');
    replay.setAttribute('aria-label', 'Hear the question again');
    replay.addEventListener('click', () => Activities.speakQuestion(q));
    promptRow.appendChild(replay);
    promptRow.appendChild(U.el('div', 'prompt-text', U.esc(q.prompt)));
    card.appendChild(promptRow);

    const answerBox = U.el('div', 'answer-box');
    card.appendChild(answerBox);

    if (opts.hints) {
      const hintBtn = U.el('button', 'hint-btn', '💡 Hint');
      hintBtn.addEventListener('click', () => {
        Audio2.say(q.explain || q.say || q.prompt);
        const h = U.el('div', 'hint-bubble', U.esc(q.explain || ''));
        card.appendChild(h);
        hintBtn.disabled = true;
      });
      card.appendChild(hintBtn);
    }

    screen.appendChild(card);
    app.appendChild(screen);

    let answered = false;
    const replayQuestion = (newQ) => {
      Level.renderQuestion(Object.assign({}, opts, { q: newQ || q }));
    };

    Activities.render(answerBox, q, (ok) => {
      if (answered) return;
      if (ok) {
        answered = true;
        Audio2.correct();
        opts.onCorrect();
      } else {
        Audio2.wrong();
        if (!opts.hints) {
          // Prove/quiz mode: one attempt per question
          answered = true;
          opts.onWrong(q, replayQuestion);
        }
        // Practice mode with format that allows retry in place (tap etc.): stay put.
        else if (q.format !== 'tap') {
          answered = true;
          opts.onWrong(q, replayQuestion);
        } else {
          // tap format: let her keep trying — explain gently in audio AND on screen
          Audio2.say(q.explain || 'Try another one!');
          if (q.explain && !card.querySelector('.hint-bubble')) {
            card.appendChild(U.el('div', 'hint-bubble', U.esc(q.explain)));
          }
        }
      }
    });

    // Auto-narrate per region audio policy: early regions read everything aloud,
    // later regions only audio-based questions — the replay button always works.
    const audioLevel = (Level.current && (Level.current.level ? Level.current.level.region.audio
      : Level.current.region ? Level.current.region.audio : 'full')) || 'full';
    if (audioLevel === 'full' || audioLevel === 'partial' && q.format !== 'tap' || q.audioOnly) {
      Activities.speakQuestion(q);
    }
  },

  topBar(title, onBack) {
    Activities.unbindKeys(); // drop any keyboard handler from a previous question
    const bar = U.el('div', 'top-bar');
    const back = U.el('button', 'back-btn', '←');
    back.setAttribute('aria-label', 'Go back');
    back.addEventListener('click', onBack);
    bar.appendChild(back);
    bar.appendChild(U.el('div', 'top-title', title));
    const hud = U.el('div', 'top-hud',
      `<span class="hud-chip">⭐ ${Store.state.totalStars}</span><span class="hud-chip">🪙 ${Store.state.coins}</span>`);
    bar.appendChild(hud);
    return bar;
  }
};

function passageHTML(p) {
  return `<div class="passage"><div class="passage-title">${p.emoji || '📖'} ${U.esc(p.title)}</div><div class="passage-text">${U.esc(p.text)}</div></div>`;
}


/* LearnQuest — world map navigation: home → continent → region path of level nodes.
   Fully visual: icons, colour, and audio — no reading required to navigate. */
'use strict';

const WorldMap = {
  lastRegion: null,

  // Ambient drifting scenery so each region feels like a place, not a menu
  sceneLayer(scene) {
    const layer = U.el('div', 'scene-layer');
    if (U.reduceMotion()) return layer;
    (scene || []).forEach((emo, i) => {
      for (let k = 0; k < 2; k++) {
        const s = U.el('span', 'scene-item', emo);
        s.style.left = U.ri(2, 92) + '%';
        s.style.top = U.ri(4, 88) + '%';
        s.style.fontSize = U.ri(22, 44) + 'px';
        s.style.animationDuration = U.ri(6, 12) + 's';
        s.style.animationDelay = (i * 0.9 + k * 2.1) + 's';
        layer.appendChild(s);
      }
    });
    return layer;
  },

  back() {
    if (WorldMap.lastRegion) WorldMap.showRegion(WorldMap.lastRegion);
    else WorldMap.showHome();
  },

  // The next level to play: first unlocked, not-yet-done level, preferring
  // the world the child last visited. Returns a level object or null.
  nextLevel() {
    const wid = Store.state.lastWorld;
    const worlds = wid && CURRICULUM.find(w => w.id === wid)
      ? [CURRICULUM.find(w => w.id === wid)].concat(CURRICULUM.filter(w => w.id !== wid))
      : CURRICULUM;
    for (const world of worlds) {
      for (const region of world.regions) {
        if (!Store.isRegionUnlocked(world, region)) break;
        for (let i = 0; i < region.levels.length; i++) {
          const lv = region.levels[i];
          if (Store.isLevelUnlocked(world, region, i) && !Store.state.completed[lv.id]) return lv;
        }
      }
    }
    return null;
  },

  /* ---- Home: two continents + companion + shop/trophies/parent ---- */

  showHome() {
    WorldMap.lastRegion = null;
    const app = document.getElementById('app');
    app.innerHTML = '';
    const screen = U.el('div', 'screen home-screen');

    // HUD
    const hud = U.el('div', 'home-hud');
    const streak = Store.currentStreak();
    hud.innerHTML = `
      <span class="hud-chip big">⭐ ${Store.state.totalStars}</span>
      <span class="hud-chip big">🪙 ${Store.state.coins}</span>
      <span class="hud-chip big${streak > 0 ? ' fire' : ''}">🔥 ${streak}</span>`;
    const soundBtn = U.el('button', 'icon-btn', Audio2.muted ? '🔇' : '🔊');
    soundBtn.setAttribute('aria-label', 'Toggle sound');
    soundBtn.addEventListener('click', () => {
      Audio2.muted = !Audio2.muted;
      Store.state.settings.muted = Audio2.muted;
      Store.save();
      if (Audio2.muted) Audio2.stop();
      soundBtn.textContent = Audio2.muted ? '🔇' : '🔊';
    });
    hud.appendChild(soundBtn);
    screen.appendChild(hud);

    // Companion greeting
    const buddyRow = U.el('div', 'home-buddy');
    buddyRow.innerHTML = `<button class="buddy-btn" aria-label="Your buddy">${Avatar.svg(110)}</button>
      <div class="buddy-bubble">Where to today?</div>`;
    buddyRow.querySelector('.buddy-btn').addEventListener('click', () => {
      Audio2.say(U.pick([
        'Hi! I\'m ' + Avatar.name() + '! Tap a world to explore!',
        'Ready for an adventure? Pick a world!',
        'You have ' + Store.state.coins + ' coins! Visit the shop to dress me up!'
      ]));
      Audio2.pop();
    });
    screen.appendChild(buddyRow);

    // Continue where you left off — one tap back into learning
    const nxt = WorldMap.nextLevel();
    if (nxt) {
      const cont = U.el('button', 'continue-btn');
      cont.innerHTML = `<span class="cont-play">▶</span>
        <span class="cont-text"><span class="cont-kicker">Keep learning</span>
        <span class="cont-name">${nxt.icon} ${U.esc(nxt.name)}</span></span>`;
      cont.addEventListener('click', () => {
        Audio2.whoosh();
        Store.state.lastWorld = nxt.world.id; Store.save();
        if (nxt.type === 'review') Level.playReview(nxt);
        else Level.playSkill(nxt);
      });
      screen.appendChild(cont);
    }

    // Daily goal ring
    const goal = Store.state.dailyGoal || 3;
    const doneToday = Store.levelsToday();
    const goalRow = U.el('div', 'goal-row');
    goalRow.innerHTML = `<div class="goal-ring-wrap">${U.goalRingSVG(doneToday, goal)}</div>
      <div class="goal-text">${doneToday >= goal ? "Today's goal complete! 🎉" : `Today's goal · ${doneToday} of ${goal} levels`}</div>`;
    screen.appendChild(goalRow);

    // Continents
    const worlds = U.el('div', 'world-cards');
    CURRICULUM.forEach(world => {
      const done = world.regions.filter(r => Store.state.bossPassed[r.id]).length;
      const card = U.el('button', 'world-card ' + world.id);
      card.innerHTML = `
        <div class="world-emoji">${world.emoji}</div>
        <div class="world-name">${U.esc(world.name)}</div>
        <div class="world-progress">${'●'.repeat(done)}${'○'.repeat(world.regions.length - done)}</div>`;
      card.addEventListener('click', () => { Audio2.whoosh(); WorldMap.showWorld(world.id); });
      worlds.appendChild(card);
    });
    screen.appendChild(worlds);

    // Decorations earned
    if (Store.state.decorOwned.length) {
      const dec = U.el('div', 'home-decor');
      Store.state.decorOwned.forEach(id => {
        const d = Avatar.decor.find(x => x.id === id);
        if (d) dec.appendChild(U.el('span', 'decor-item float', d.icon));
      });
      screen.appendChild(dec);
    }

    // Bottom nav (icons only)
    const nav = U.el('div', 'bottom-nav');
    const mk = (icon, label, fn) => {
      const b = U.el('button', 'nav-btn', icon);
      b.setAttribute('aria-label', label);
      b.addEventListener('click', () => { Audio2.tap(); fn(); });
      return b;
    };
    nav.appendChild(mk('🛍️', 'Shop', () => Shop.show()));
    nav.appendChild(mk('🏆', 'Trophies', () => Trophies.show()));
    const stickerBtn = mk('✨', 'Sticker Book', () => Stickers.show());
    const stCount = Stickers.count();
    if (stCount) stickerBtn.appendChild(U.el('span', 'nav-badge', String(stCount)));
    nav.appendChild(stickerBtn);
    nav.appendChild(mk('🎮', 'Games', () => Shop.show('games')));
    screen.appendChild(nav);

    // Parent corner: small, hold 3 seconds
    const parentBtn = U.el('button', 'parent-btn', '👤');
    parentBtn.setAttribute('aria-label', 'Parent view — press and hold');
    let holdTimer = null, holdRing = null;
    const startHold = (e) => {
      e.preventDefault();
      parentBtn.classList.add('holding');
      holdTimer = setTimeout(() => { parentBtn.classList.remove('holding'); Parent.show(); }, 3000);
    };
    const cancelHold = () => { clearTimeout(holdTimer); parentBtn.classList.remove('holding'); };
    parentBtn.addEventListener('pointerdown', startHold);
    parentBtn.addEventListener('pointerup', cancelHold);
    parentBtn.addEventListener('pointerleave', cancelHold);
    screen.appendChild(parentBtn);

    app.appendChild(screen);

    // Daily goal reached today, not yet celebrated → reward once per day
    if (doneToday >= goal && Store.state.lastGoalDay !== U.todayKey()) {
      Store.state.lastGoalDay = U.todayKey();
      Store.state.coins += 15;
      Store.save();
      setTimeout(() => Celebrate.goalReached(goal), 400);
    }

    // Celebrate any stickers earned since the last time we were home
    const fresh = Stickers.sync();
    if (fresh.length) setTimeout(() => Celebrate.stickerToast(fresh), fresh && doneToday >= goal ? 2200 : 500);
  },

  /* ---- Continent view: 8 regions as islands ---- */

  showWorld(worldId) {
    WorldMap.lastRegion = null;
    Store.state.lastWorld = worldId; Store.save();
    const world = CURRICULUM.find(w => w.id === worldId);
    const app = document.getElementById('app');
    app.innerHTML = '';
    const screen = U.el('div', 'screen world-screen ' + worldId);
    screen.appendChild(WorldMap.sceneLayer(world.regions.slice(0, 4).map(r => r.emoji)));
    screen.appendChild(Level.topBar(world.emoji + ' ' + world.name, () => WorldMap.showHome()));

    const trail = U.el('div', 'region-trail');
    world.regions.forEach((region, i) => {
      const unlocked = Store.isRegionUnlocked(world, region);
      const complete = Store.isRegionComplete(region);
      const prog = Store.regionProgress(region);
      const node = U.el('button', 'region-island' + (unlocked ? '' : ' locked') + (complete ? ' complete' : '') + (i % 2 ? ' right' : ' left'));
      node.style.setProperty('--tint', region.tint);
      node.innerHTML = `
        <div class="island-emoji">${unlocked ? region.emoji : '🔒'}</div>
        <div class="island-name">${U.esc(region.name)}</div>
        <div class="island-badge">${complete ? '🏆' : unlocked ? `${prog.done}/${prog.total}` : ''}</div>`;
      if (unlocked) {
        node.addEventListener('click', () => { Audio2.whoosh(); WorldMap.showRegion(region.id); });
      } else {
        node.addEventListener('click', () => {
          Audio2.say(`This land is still hidden! Beat the ${world.regions[i - 1].name} Boss Challenge to open it.`);
          node.classList.add('shake');
          setTimeout(() => node.classList.remove('shake'), 500);
        });
      }
      trail.appendChild(node);
    });
    screen.appendChild(trail);
    app.appendChild(screen);
  },

  /* ---- Region view: level path + fast track + boss ---- */

  showRegion(regionId) {
    const found = findRegion(regionId);
    if (!found) { WorldMap.showHome(); return; }
    const { world, region } = found;
    WorldMap.lastRegion = regionId;

    const app = document.getElementById('app');
    app.innerHTML = '';
    const screen = U.el('div', 'screen region-screen');
    screen.style.setProperty('--tint', region.tint);
    screen.appendChild(WorldMap.sceneLayer(region.scene));
    screen.appendChild(Level.topBar(region.emoji + ' ' + region.name, () => WorldMap.showWorld(world.id)));

    // Region banner: emoji, grade, progress bar, stars collected here
    const prog = Store.regionProgress(region);
    const regionStars = region.levels.reduce((a, lv) => a + (Store.state.stars[lv.id] || 0), 0);
    const maxStars = region.levels.length * 3;
    const pct = prog.total ? Math.round(prog.done / prog.total * 100) : 0;
    const banner = U.el('div', 'region-banner');
    banner.innerHTML = `
      <div class="rb-emoji">${region.emoji}</div>
      <div class="rb-info">
        <div class="rb-name">${U.esc(region.name)}</div>
        <div class="rb-grade">Grade ${region.grade} · ${world.id === 'math' ? 'Math' : 'Words'}${Store.isRegionComplete(region) ? ' · 🏆 mastered' : ''}</div>
        <div class="rb-bar"><span style="width:${pct}%"></span></div>
        <div class="rb-stats">${prog.done}/${prog.total} levels · ⭐ ${regionStars}/${maxStars}</div>
      </div>`;
    screen.appendChild(banner);

    const path = U.el('div', 'level-path');
    // Lit-path progress fill: the trail glows up to how far you've come
    const litFrac = prog.total ? prog.done / prog.total : 0;
    const fill = U.el('div', 'path-fill');
    fill.style.height = Math.round(litFrac * 100) + '%';
    path.appendChild(fill);

    // Fast Track gate at region entrance (bonus challenge, until region complete)
    if (!Store.isRegionComplete(region)) {
      const ft = U.el('button', 'fast-track-node');
      ft.innerHTML = `<span class="ft-bolt">⚡</span><span class="ft-label">Lightning Trial</span><span class="ft-sub">Bonus challenge!</span>`;
      ft.addEventListener('click', () => {
        Audio2.whoosh();
        Level.playFastTrack(region);
      });
      path.appendChild(ft);
    }

    region.levels.forEach((lv, i) => {
      const unlocked = Store.isLevelUnlocked(world, region, i);
      const stars = Store.state.stars[lv.id] || 0;
      const done = !!Store.state.completed[lv.id];
      const node = U.el('button', 'level-node' + (unlocked ? '' : ' locked') + (done ? ' done' : '') +
        (lv.type === 'review' ? ' review-node' : '') + (i % 2 ? ' zig' : ' zag'));
      node.innerHTML = `
        <span class="node-icon">${unlocked ? lv.icon : '🔒'}</span>
        <span class="node-stars">${done ? '★'.repeat(stars) + '<span class="dim">' + '★'.repeat(3 - stars) + '</span>' : ''}</span>
        <span class="node-name">${U.esc(lv.name)}</span>`;
      if (unlocked) {
        node.addEventListener('click', () => {
          Audio2.pop();
          if (lv.type === 'review') Level.playReview(lv);
          else Level.playSkill(lv);
        });
      } else {
        node.addEventListener('click', () => {
          Audio2.say('Finish the level before this one first!');
          node.classList.add('shake');
          setTimeout(() => node.classList.remove('shake'), 500);
        });
      }
      path.appendChild(node);
    });

    // Boss node at the end
    const bossOpen = Store.bossUnlocked(region);
    const bossDone = Store.isRegionComplete(region);
    const boss = U.el('button', 'boss-node' + (bossOpen ? '' : ' locked') + (bossDone ? ' done' : ''));
    boss.innerHTML = `<span class="boss-crown">${bossDone ? '🏆' : bossOpen ? '👑' : '🔒'}</span>
      <span class="node-name">Boss Challenge</span>`;
    boss.addEventListener('click', () => {
      if (!bossOpen) {
        Audio2.say('The boss waits at the end of the path! Finish every level first.');
        boss.classList.add('shake');
        setTimeout(() => boss.classList.remove('shake'), 500);
        return;
      }
      Audio2.fanfare();
      Level.playBoss(region);
    });
    path.appendChild(boss);

    screen.appendChild(path);
    app.appendChild(screen);
  }
};

/* LearnQuest — boot */
'use strict';

window.addEventListener('DOMContentLoaded', () => {
  Store.load();
  Audio2.init();

  // Offline support when served over HTTP(S); file:// already works offline
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // Don't keep narrating into a hidden tab / sleeping iPad
  document.addEventListener('visibilitychange', () => { if (document.hidden) Audio2.stop(); });

  // Honour reduced-motion preference (OS setting or parent toggle)
  const applyMotion = () => document.body.classList.toggle('reduce-motion', U.reduceMotion());
  applyMotion();
  window.applyMotionPref = applyMotion;

  if (!Store.state.name) {
    // First run: pick a buddy name — spoken, tap to choose
    const app = document.getElementById('app');
    app.innerHTML = '';
    const screen = U.el('div', 'screen welcome-screen');
    screen.innerHTML = `
      <div class="welcome-logo">🗺️</div>
      <h1 class="welcome-title">LearnQuest</h1>
      <div class="welcome-buddy">${Avatar.svg(140)}</div>
      <div class="welcome-sub">Choose your buddy's name!</div>`;
    const grid = U.el('div', 'name-grid');
    U.pickN(EN.avatarNames, 4).forEach(n => {
      const b = U.el('button', 'name-btn', n);
      b.addEventListener('click', () => {
        Store.state.name = n;
        Store.save();
        Audio2.pop();
        Audio2.say(`${n}! I love it! Hi, I'm ${n}, your adventure buddy. Let's explore! Tap a world to start.`);
        Celebrate.confetti(30);
        WorldMap.showHome();
      });
      // Speak the name on first hover/long-press via a small speaker
      const sp = U.el('span', 'name-speak', '🔊');
      sp.addEventListener('click', (e) => { e.stopPropagation(); Audio2.say(n); });
      b.appendChild(sp);
      grid.appendChild(b);
    });
    screen.appendChild(grid);
    app.appendChild(screen);
    // Speak after the first user gesture (browser autoplay rules)
    const speakIntro = () => {
      Audio2.say('Welcome to Learn Quest! First, choose a name for your buddy. Tap the little speaker to hear each name.');
      document.removeEventListener('pointerdown', speakIntro);
    };
    document.addEventListener('pointerdown', speakIntro, { once: true });
  } else {
    WorldMap.showHome();
  }
});

</script>
</body>
</html>
