<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2542">
<title>LearnQuest — Math & Word Worlds</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🗺️</text></svg>">
<style>
/* LearnQuest — visual design system
   Duolingo × Toca Boca × Monument Valley: warm saturated palette,
   rounded flat illustration, gentle motion. Age-neutral, never babyish. */

:root {
  --ink: #3d3554;
  --ink-soft: #5b5570;
  --paper: #fffaf2;
  --cream: #f7f1e5;
  --coral: #ff7a59;
  --coral-dark: #e5603f;
  --teal: #4ecdc4;
  --gold: #ffd34d;
  --amber: #ffb14a;
  --violet: #9b8cff;
  --sky: #5fb0f2;
  --rose: #f26d9c;
  --night1: #2b2542;
  --night2: #453a6b;
  --shadow: 0 8px 24px rgba(61, 53, 84, .18);
  --radius: 24px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  font-family: 'Avenir Next', 'Nunito', 'Segoe UI', -apple-system, system-ui, sans-serif;
  background: linear-gradient(160deg, var(--night1) 0%, var(--night2) 55%, #5d4f8c 100%) fixed;
  color: var(--ink);
  overflow-x: hidden;
  user-select: none;
  -webkit-user-select: none;
}

button { font-family: inherit; border: none; cursor: pointer; background: none; color: inherit; }
button:active { transform: scale(.96); }
button:focus-visible, input:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}

#app { min-height: 100vh; display: flex; flex-direction: column; }

.screen {
  flex: 1;
  max-width: 880px;
  width: 100%;
  margin: 0 auto;
  padding: 16px 16px 40px;
  display: flex;
  flex-direction: column;
  animation: screen-in .35s ease both;
}
@keyframes screen-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---------- Top bar ---------- */

.top-bar { display: flex; align-items: center; gap: 12px; padding: 6px 0 14px; }
.back-btn {
  width: 64px; height: 64px; border-radius: 20px;
  background: rgba(255, 250, 242, .14); color: #fff;
  font-size: 28px; font-weight: 800; flex: none;
  transition: background .2s;
}
.back-btn:hover { background: rgba(255, 250, 242, .28); }
.top-title { color: #fff; font-size: 22px; font-weight: 800; flex: 1; text-shadow: 0 2px 8px rgba(0,0,0,.25); }
.top-hud { display: flex; gap: 8px; }
.hud-chip {
  background: rgba(255, 250, 242, .16); color: #fff;
  border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 15px;
}
.hud-chip.big { font-size: 17px; padding: 12px 18px; }
.hud-chip.fire { background: linear-gradient(135deg, #ff7a59, #ffb14a); }

.icon-btn { width: 64px; height: 64px; border-radius: 20px; background: rgba(255,250,242,.16); font-size: 26px; }

/* ---------- Home ---------- */

.home-screen { justify-content: flex-start; gap: 10px; position: relative; }
.home-hud { display: flex; gap: 10px; align-items: center; justify-content: center; padding-top: 10px; flex-wrap: wrap; }

.home-buddy { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 8px; }
.buddy-btn { animation: float 3.4s ease-in-out infinite; }
.buddy-bubble {
  background: var(--paper); border-radius: 20px 20px 20px 4px;
  padding: 12px 18px; font-weight: 800; font-size: 17px; box-shadow: var(--shadow);
  animation: pop-in .5s ease .3s both;
}
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

.world-cards { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.world-card {
  width: min(340px, 44vw); min-width: 260px; min-height: 220px;
  border-radius: 32px; padding: 26px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  box-shadow: var(--shadow);
  transition: transform .25s ease, box-shadow .25s;
  position: relative; overflow: hidden;
}
.world-card:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 16px 36px rgba(0,0,0,.3); }
.world-card.math { background: linear-gradient(150deg, #ff9d7e, #ff7a59 55%, #e5603f); }
.world-card.english { background: linear-gradient(150deg, #b3a7ff, #9b8cff 55%, #7a67e0); }
.world-emoji { font-size: 74px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.25)); animation: float 4s ease-in-out infinite; }
.world-name { color: #fff; font-size: 26px; font-weight: 900; text-shadow: 0 2px 6px rgba(0,0,0,.25); }
.world-progress { color: rgba(255,255,255,.9); font-size: 15px; letter-spacing: 4px; }

.continue-btn {
  display: flex; align-items: center; gap: 14px; justify-content: center;
  margin: 8px auto 0; padding: 12px 26px 12px 16px;
  background: linear-gradient(135deg, #4ecdc4, #37b3aa);
  border-radius: 24px; box-shadow: 0 6px 0 #2b8f88; color: #fff;
  transition: transform .15s;
}
.continue-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #2b8f88; }
.cont-play {
  width: 48px; height: 48px; flex: none; border-radius: 50%;
  background: rgba(255,255,255,.22); display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.cont-text { display: flex; flex-direction: column; text-align: left; }
.cont-kicker { font-size: 12px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; opacity: .85; }
.cont-name { font-size: 19px; font-weight: 900; }

.goal-row {
  display: flex; align-items: center; gap: 14px; justify-content: center;
  background: rgba(255,250,242,.10); border-radius: 22px; padding: 10px 20px 10px 12px;
  margin: 6px auto 0; width: fit-content; max-width: 92%;
}
.goal-ring { width: 62px; height: 62px; }
.goal-ring circle:nth-child(2) { transition: stroke-dashoffset .6s ease; }
.goal-text { color: #fff; font-weight: 800; font-size: 15.5px; }
.goal-toast { border-left-color: var(--teal); }

.home-decor { display: flex; gap: 14px; justify-content: center; margin-top: 6px; font-size: 34px; }
.decor-item.float { animation: float 3.8s ease-in-out infinite; }
.decor-item.float:nth-child(2n) { animation-delay: .7s; }
.decor-item.float:nth-child(3n) { animation-delay: 1.3s; }

.bottom-nav { display: flex; gap: 16px; justify-content: center; margin-top: auto; padding-top: 22px; }
.nav-btn {
  width: 76px; height: 76px; font-size: 34px;
  background: var(--paper); border-radius: 26px; box-shadow: var(--shadow);
  transition: transform .2s;
}
.nav-btn:hover { transform: translateY(-4px) rotate(-3deg); }

.parent-btn {
  position: absolute; top: 14px; right: 14px;
  width: 44px; height: 44px; border-radius: 14px;
  background: rgba(255,250,242,.10); font-size: 18px; opacity: .65;
}
.parent-btn.holding { animation: hold-pulse 3s linear; }
@keyframes hold-pulse {
  0% { box-shadow: 0 0 0 0 rgba(255,211,77,.8); }
  100% { box-shadow: 0 0 0 14px rgba(255,211,77,0); background: var(--gold); opacity: 1; }
}

/* ---------- Welcome ---------- */

.welcome-screen { align-items: center; justify-content: center; gap: 14px; text-align: center; }
.welcome-logo { font-size: 64px; animation: float 3s ease-in-out infinite; }
.welcome-title { color: #fff; font-size: 44px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 4px 14px rgba(0,0,0,.3); }
.welcome-buddy { animation: pop-in .6s ease both; }
.welcome-sub { color: rgba(255,255,255,.92); font-size: 20px; font-weight: 700; }
.name-grid { display: grid; grid-template-columns: repeat(2, minmax(140px, 200px)); gap: 14px; margin-top: 10px; }
.name-btn {
  min-height: 72px; background: var(--paper); border-radius: 22px;
  font-size: 24px; font-weight: 900; box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: transform .2s;
}
.name-btn:hover { transform: scale(1.05); }
.name-speak { font-size: 18px; opacity: .7; }

/* ---------- Ambient scenery ---------- */

.scene-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.scene-item {
  position: absolute; opacity: .16;
  filter: saturate(.9);
  animation: scene-drift ease-in-out infinite alternate;
}
@keyframes scene-drift {
  from { transform: translateY(0) rotate(-4deg); }
  to { transform: translateY(-26px) rotate(5deg); }
}
.region-screen > *:not(.scene-layer), .world-screen > *:not(.scene-layer) { position: relative; z-index: 1; }

/* ---------- Continent view ---------- */

.world-screen .region-trail {
  display: flex; flex-direction: column; gap: 6px; padding: 20px 0 40px;
  position: relative;
}
.region-trail::before {
  content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
  width: 6px; transform: translateX(-50%);
  background: repeating-linear-gradient(to bottom, rgba(255,250,242,.35) 0 14px, transparent 14px 30px);
  border-radius: 3px;
}
.region-island {
  width: min(320px, 78vw); min-height: 96px;
  background: var(--paper); border-radius: 28px; box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 14px; padding: 14px 20px;
  position: relative; z-index: 1;
  border-left: 10px solid var(--tint, var(--teal));
  transition: transform .2s;
}
.region-island:hover { transform: scale(1.04); }
.region-island.left { align-self: flex-start; margin-left: 4%; }
.region-island.right { align-self: flex-end; margin-right: 4%; }
.region-island.locked { filter: grayscale(.85); opacity: .6; }
.region-island.complete { background: linear-gradient(135deg, #fff8e0, #fff); }
.island-emoji { font-size: 44px; }
.island-name { font-weight: 900; font-size: 19px; flex: 1; text-align: left; }
.island-badge { font-weight: 800; color: var(--ink-soft); font-size: 15px; }

/* ---------- Region view: level path ---------- */

.region-banner {
  display: flex; align-items: center; gap: 16px;
  background: var(--paper); border-radius: 24px; box-shadow: var(--shadow);
  padding: 16px 20px; margin: 4px auto 0; width: 100%; max-width: 560px;
  border-left: 10px solid var(--tint, var(--teal));
}
.rb-emoji { font-size: 48px; flex: none; }
.rb-info { flex: 1; min-width: 0; }
.rb-name { font-size: 21px; font-weight: 900; color: var(--ink); }
.rb-grade { font-size: 13.5px; font-weight: 700; color: var(--ink-soft); margin: 2px 0 8px; }
.rb-bar { height: 12px; background: #ece5d6; border-radius: 6px; overflow: hidden; }
.rb-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--tint, var(--teal)), #ffd34d); border-radius: 6px; transition: width .5s ease; }
.rb-stats { font-size: 13px; font-weight: 800; color: var(--ink-soft); margin-top: 6px; }

.region-screen .level-path {
  display: flex; flex-direction: column; align-items: center; gap: 22px;
  padding: 26px 0 60px; position: relative;
}
.level-path::before {
  content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 6px;
  transform: translateX(-50%);
  background: repeating-linear-gradient(to bottom, rgba(255,250,242,.3) 0 12px, transparent 12px 26px);
  border-radius: 3px;
}
.path-fill {
  position: absolute; left: 50%; top: 0; width: 6px; transform: translateX(-50%);
  background: linear-gradient(to bottom, var(--tint, var(--teal)), #ffd34d);
  border-radius: 3px; box-shadow: 0 0 12px var(--tint, var(--teal));
  transition: height .6s ease; z-index: 0;
}
.level-node {
  width: 148px; min-height: 128px; z-index: 1;
  background: var(--paper); border-radius: 30px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  padding: 12px; border-bottom: 8px solid var(--tint, var(--teal));
  transition: transform .2s;
}
.level-node:hover { transform: scale(1.06) rotate(-1deg); }
.level-node.zig { transform: translateX(-70px); }
.level-node.zag { transform: translateX(70px); }
.level-node.zig:hover { transform: translateX(-70px) scale(1.06); }
.level-node.zag:hover { transform: translateX(70px) scale(1.06); }
.level-node.locked { filter: grayscale(.9); opacity: .55; }
.level-node.done { background: linear-gradient(160deg, #fffdf5, #fff4d6); }
.level-node.review-node { border-bottom-color: var(--violet); background: linear-gradient(160deg, #f4f1ff, #fff); }
.node-icon { font-size: 40px; }
.node-stars { color: var(--gold); font-size: 17px; min-height: 20px; text-shadow: 0 1px 2px rgba(0,0,0,.15); }
.node-stars .dim { color: #ddd4c4; }
.node-name { font-weight: 800; font-size: 13.5px; text-align: center; color: var(--ink-soft); }

.fast-track-node {
  z-index: 1; width: min(320px, 80vw); min-height: 76px;
  background: linear-gradient(135deg, #ffe9a8, #ffd34d);
  border-radius: 24px; box-shadow: 0 8px 24px rgba(255, 211, 77, .35);
  display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
  font-weight: 900; padding: 12px;
  animation: shimmer 2.6s ease-in-out infinite;
}
@keyframes shimmer { 0%,100% { box-shadow: 0 8px 24px rgba(255,211,77,.3); } 50% { box-shadow: 0 8px 34px rgba(255,211,77,.65); } }
.ft-bolt { font-size: 30px; }
.ft-label { font-size: 19px; }
.ft-sub { width: 100%; text-align: center; font-size: 13px; font-weight: 700; color: rgba(61,53,84,.7); }

.boss-node {
  z-index: 1; width: 190px; min-height: 150px;
  background: linear-gradient(150deg, #6a5bd8, #4a3fa8);
  border-radius: 34px; box-shadow: 0 12px 30px rgba(74, 63, 168, .5);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  color: #fff;
}
.boss-node .node-name { color: rgba(255,255,255,.95); font-size: 16px; }
.boss-node.locked { filter: grayscale(.8); opacity: .6; }
.boss-node.done { background: linear-gradient(150deg, #f0b73d, #d99a18); }
.boss-crown { font-size: 52px; animation: float 2.8s ease-in-out infinite; }

.shake { animation: shake .45s ease; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

/* ---------- Level / question screens ---------- */

.beads { display: flex; gap: 8px; justify-content: center; padding: 4px 0 12px; }
.bead { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,250,242,.25); }
.bead.done { background: var(--gold); }
.bead.now { background: var(--paper); transform: scale(1.25); }

.question-card, .demo-card, .intro-card {
  background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 22px; display: flex; flex-direction: column; gap: 16px; align-items: center;
}

.phase-chip {
  align-self: flex-start;
  background: var(--cream); border-radius: 999px; padding: 8px 16px;
  font-weight: 800; font-size: 14px; color: var(--ink-soft);
}
.phase-chip.phase-try { background: #e2f6f4; color: #1f7f78; }
.phase-chip.phase-prove { background: #f0edff; color: #5d4fc0; }

.prompt-row { display: flex; align-items: center; gap: 12px; width: 100%; }
.prompt-text { font-size: clamp(19px, 3vw, 25px); font-weight: 800; flex: 1; }
.replay-btn {
  width: 64px; height: 64px; flex: none; border-radius: 50%;
  background: var(--teal); color: #fff; font-size: 26px;
  box-shadow: 0 5px 0 #2fa89f;
  transition: transform .15s;
}
.replay-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #2fa89f; }

.q-visual { display: flex; justify-content: center; width: 100%; overflow-x: auto; }

.passage {
  background: var(--cream); border-radius: 18px; padding: 16px 18px; width: 100%;
  border-left: 6px solid var(--amber);
}
.passage-title { font-weight: 900; margin-bottom: 6px; font-size: 16px; }
.passage-text { font-size: 17px; line-height: 1.65; color: var(--ink); user-select: text; -webkit-user-select: text; }

.answer-box { width: 100%; }

.hint-btn {
  background: #fff3d6; border-radius: 999px; padding: 12px 22px;
  font-weight: 800; font-size: 16px; color: #9a7016; min-height: 48px;
}
.hint-btn:disabled { opacity: .5; }
.hint-bubble {
  background: #fff8e6; border-radius: 16px; padding: 12px 16px;
  font-size: 15.5px; color: var(--ink-soft); animation: pop-in .3s ease both;
}

/* choice grid */
.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; width: 100%; }
.choice-grid.big { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.choice-btn {
  min-height: 76px; background: #fff; border: 3px solid #eee4d4; border-radius: 20px;
  font-size: 19px; font-weight: 800; padding: 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  transition: transform .15s, border-color .15s, background .2s;
  box-shadow: 0 4px 0 #eee4d4;
}
.choice-btn:hover { border-color: var(--teal); }
.choice-grid.big .choice-btn { font-size: 30px; min-height: 96px; }
.choice-emoji { font-size: 40px; }
.choice-label { line-height: 1.3; }
.choice-btn.is-correct { background: #e2f8ee; border-color: #3fbf8a; box-shadow: 0 4px 0 #3fbf8a; animation: pop 0.4s ease; }
.choice-btn.is-wrong { background: #fdeceb; border-color: #e8837a; animation: shake .5s ease; }
@keyframes pop { 50% { transform: scale(1.08); } }

/* visuals */
.emoji-group { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 380px; font-size: 32px; }
.eg-item { animation: pop-in .4s ease both; }
.eg-item.crossed { opacity: .35; position: relative; }
.eg-item.crossed::after { content: '✖'; position: absolute; inset: 0; color: #d5543f; font-size: 22px; display: flex; align-items: center; justify-content: center; }
.two-rows { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.ghost-row { opacity: .45; }
.add-visual { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }
.op-sign { font-size: 40px; font-weight: 900; color: var(--coral); }
.groups-visual { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.group-box { border: 3px dashed #dccfb8; border-radius: 16px; padding: 8px; }
.group-box .emoji-group { font-size: 22px; max-width: 140px; }
.pattern-row { display: flex; gap: 8px; font-size: 38px; flex-wrap: wrap; justify-content: center; }
.pat-item { animation: pop-in .35s ease both; }
.pat-q { opacity: .8; }
.big-number, .big-letter, .big-word { font-size: 58px; font-weight: 900; letter-spacing: 4px; color: var(--ink); }
.big-word { font-size: 44px; letter-spacing: 6px; }
.hint-emoji { font-size: 64px; text-align: center; }
.story-icon { font-size: 58px; animation: float 3s ease-in-out infinite; }
.balance { font-size: 54px; }
.clock-svg, .frac-svg, .spinner-svg { width: 150px; height: 150px; }
.frac-bar-svg { width: 260px; }
.angle-svg { width: 190px; }
.grid-svg { width: 200px; }
.chart-svg { width: min(320px, 80vw); }
.numline-svg { width: min(340px, 85vw); }
.rect-svg { width: 180px; }
.thermo-svg { width: 130px; height: 210px; }
.shape-svg { width: 92px; height: 92px; }
.dec-grid { display: grid; grid-template-columns: repeat(10, 16px); gap: 2px; }
.dec-cell { width: 16px; height: 16px; background: #f3eee6; border-radius: 3px; }
.dec-cell.filled { background: var(--amber); }
.coins-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 400px; }
.coin {
  width: 58px; height: 58px; border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, #fff8, var(--cc) 62%, #0002);
  border: 2px solid rgba(0,0,0,.18);
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 15px; color: #3d3554;
  box-shadow: 0 3px 6px rgba(0,0,0,.18); animation: pop-in .3s ease both;
}
.data-table { border-collapse: collapse; font-size: 18px; }
.data-table caption { font-weight: 900; padding-bottom: 6px; }
.data-table td { border: 2px solid #eee4d4; padding: 8px 18px; }

/* numpad */
.numpad-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.numpad-display {
  min-width: 170px; min-height: 64px; background: var(--cream); border-radius: 18px;
  font-size: 34px; font-weight: 900; display: flex; align-items: center; justify-content: center;
  padding: 6px 20px;
}
.np-placeholder { color: #cdc2ae; }
.numpad { display: grid; grid-template-columns: repeat(3, 76px); gap: 10px; }
.np-key {
  width: 76px; height: 66px; background: #fff; border: 3px solid #eee4d4; border-radius: 18px;
  font-size: 26px; font-weight: 900; box-shadow: 0 4px 0 #eee4d4;
}
.np-key:active { transform: translateY(3px); box-shadow: 0 1px 0 #eee4d4; }
.np-del { background: #fdf0ee; }
.np-empty { visibility: hidden; }

.check-btn {
  min-height: 64px; padding: 0 34px; border-radius: 22px;
  background: var(--coral); color: #fff; font-size: 21px; font-weight: 900;
  box-shadow: 0 6px 0 var(--coral-dark);
}
.check-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--coral-dark); }
.check-btn.ready { animation: shimmer 1.6s ease-in-out infinite; }

.typed-wrap { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.typed-input {
  min-height: 64px; font-size: 26px; font-weight: 800; text-align: center;
  border: 3px solid #eee4d4; border-radius: 18px; padding: 8px 18px; width: min(300px, 70vw);
  font-family: inherit; color: var(--ink); background: #fff; outline: none;
}
.typed-input:focus { border-color: var(--teal); }

/* sort */
.sort-wrap { display: flex; flex-direction: column; gap: 16px; align-items: center; }
.sort-items { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.sort-item {
  min-width: 68px; min-height: 64px; padding: 10px 16px;
  background: #fff; border: 3px solid #eee4d4; border-radius: 16px;
  font-size: 21px; font-weight: 900; box-shadow: 0 4px 0 #eee4d4;
}
.sort-item.sel { border-color: var(--coral); background: #fff1ec; transform: scale(1.08); }
.sort-item.placed { pointer-events: none; box-shadow: none; min-height: 44px; min-width: 0; padding: 4px 10px; font-size: 16px; margin: 2px; }
.sort-bins { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.sort-bin {
  min-width: 150px; min-height: 130px; background: var(--cream);
  border: 3px dashed #dccfb8; border-radius: 20px; padding: 12px; text-align: center; cursor: pointer;
}
.bin-emoji { font-size: 32px; }
.bin-label { font-weight: 900; font-size: 16px; margin: 4px 0; }
.bin-slot { display: flex; flex-wrap: wrap; justify-content: center; }
.sort-hint { font-size: 13.5px; color: var(--ink-soft); font-weight: 700; }

/* sequence */
.seq-wrap { display: flex; flex-direction: column; gap: 16px; align-items: center; }
.seq-target { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; min-height: 70px;
  background: var(--cream); border-radius: 18px; padding: 12px; width: 100%; }
.seq-slot { width: 64px; height: 56px; border: 3px dashed #dccfb8; border-radius: 14px; }
.seq-bank { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.seq-tile {
  min-width: 64px; min-height: 60px; padding: 10px 16px;
  background: #fff; border: 3px solid #eee4d4; border-radius: 16px;
  font-size: 19px; font-weight: 800; box-shadow: 0 4px 0 #eee4d4;
}
.seq-tile.in-target { border-color: var(--teal); background: #ecfaf8; }
.seq-tile.used { opacity: .4; }

/* match */
.match-wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; width: 100%; }
.match-card {
  min-height: 76px; background: #fff; border: 3px solid #eee4d4; border-radius: 18px;
  font-size: 24px; font-weight: 900; box-shadow: 0 4px 0 #eee4d4;
}
.match-card.sel { border-color: var(--sky); background: #ecf5fe; }
.match-card.locked { border-color: #3fbf8a; background: #e2f8ee; box-shadow: none; animation: pop .4s ease; }

/* blank */
.blank-wrap { display: flex; flex-direction: column; gap: 16px; align-items: center; }
.blank-sentence { font-size: 23px; font-weight: 800; line-height: 1.7; text-align: center; }
.blank-slot {
  display: inline-block; min-width: 90px; min-height: 38px; vertical-align: middle;
  border-bottom: 4px solid var(--amber); margin: 0 6px; text-align: center;
  font-weight: 900; color: var(--coral-dark); cursor: pointer;
}
.blank-bank { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* number line */
.nl-wrap { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 10px 8px 0; width: 100%; }
.nl-value {
  min-width: 72px; min-height: 52px; padding: 6px 20px; background: var(--cream);
  border-radius: 16px; font-size: 30px; font-weight: 900; color: var(--coral-dark);
  display: flex; align-items: center; justify-content: center;
}
.nl-track {
  position: relative; width: min(94%, 460px); height: 10px; margin: 34px 0 14px;
  background: #e9e0d0; border-radius: 6px; touch-action: none; cursor: pointer;
}
.nl-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--teal); border-radius: 6px; }
.nl-tick { position: absolute; top: 50%; width: 2px; height: 10px; background: #c7bca8; transform: translate(-50%, -50%); }
.nl-tick.major { height: 18px; width: 3px; background: #a99f8a; }
.nl-lab { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 800; color: var(--ink-soft); }
.nl-marker {
  position: absolute; top: -30px; left: 0; transform: translateX(-50%);
  color: var(--coral); font-size: 30px; line-height: 1; transition: left .08s ease; pointer-events: none;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,.25));
}
.nl-marker.placed { color: var(--coral-dark); }
.nl-arrow { display: block; }

/* trace */
.trace-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.trace-stage { position: relative; width: min(320px, 82vw); height: min(320px, 82vw); background: #fff;
  border-radius: 24px; border: 3px solid #eee4d4; overflow: hidden; touch-action: none; }
.trace-guide {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 220px; font-weight: 900; color: #efe7d7; pointer-events: none;
  font-family: 'Comic Sans MS', 'Chalkboard SE', 'Avenir Next', sans-serif;
}
.trace-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.trace-buttons { display: flex; gap: 14px; }

/* ---------- Demo ---------- */

.demo-stage { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 8px; }
.demo-big { font-size: 96px; animation: float 3s ease-in-out infinite; }
.demo-prompt { font-size: 23px; font-weight: 800; text-align: center; }
.demo-answer { min-height: 64px; display: flex; align-items: center; }
.demo-reveal {
  background: linear-gradient(135deg, #ffe9a8, var(--gold)); border-radius: 18px;
  padding: 12px 28px; font-size: 30px; font-weight: 900;
  animation: pop-in .6s cubic-bezier(.2, 1.6, .4, 1) both;
}
.demo-actions { display: flex; gap: 14px; justify-content: center; padding-top: 18px; flex-wrap: wrap; }

.primary-btn {
  min-height: 68px; padding: 0 36px; border-radius: 24px;
  background: var(--coral); color: #fff; font-size: 22px; font-weight: 900;
  box-shadow: 0 6px 0 var(--coral-dark);
}
.primary-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--coral-dark); }
.ghost-btn {
  min-height: 68px; padding: 0 26px; border-radius: 24px;
  background: var(--cream); font-size: 19px; font-weight: 800; color: var(--ink-soft);
}
.ghost-btn.recording { background: #fdeceb; color: #c0392b; animation: shimmer 1.2s infinite; }
.big-go { font-size: 26px; min-height: 76px; }

/* ---------- Quiz intro ---------- */

.quiz-intro .intro-card { text-align: center; gap: 10px; margin-top: 30px; }
.intro-icon { font-size: 84px; animation: float 2.6s ease-in-out infinite; }
.intro-card h2 { font-size: 30px; font-weight: 900; }
.intro-sub { color: var(--ink-soft); font-weight: 800; font-size: 17px; }
.boss-intro .intro-card { background: linear-gradient(160deg, #fff, #f0edff); }

/* ---------- Overlays & celebration ---------- */

.overlay {
  position: fixed; inset: 0; background: rgba(43, 37, 66, .55);
  display: flex; align-items: center; justify-content: center; z-index: 50;
  backdrop-filter: blur(3px); padding: 18px;
}
.modal-card {
  background: var(--paper); border-radius: 30px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
  padding: 30px; max-width: 460px; width: 100%; text-align: center;
  display: flex; flex-direction: column; gap: 14px; align-items: center;
  max-height: 90vh; overflow-y: auto;
}
.modal-card h2 { font-size: 26px; font-weight: 900; }
.pop-in { animation: pop-in .45s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes pop-in { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }

.explain-title { font-weight: 900; font-size: 21px; color: var(--coral-dark); }
.explain-text { font-size: 17.5px; line-height: 1.6; color: var(--ink-soft); font-weight: 600; }
.explain-buddy.big { animation: float 2.6s ease-in-out infinite; }

.flash-overlay {
  /* Blocks input for its short lifetime so taps can't race the next question */
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  z-index: 60;
}
.flash-card {
  background: var(--paper); border-radius: 28px; box-shadow: 0 16px 44px rgba(0,0,0,.3);
  padding: 22px 34px; display: flex; align-items: center; gap: 14px;
}
.flash-word { font-size: 32px; font-weight: 900; color: var(--coral); }
.flash-card.combo {
  background: linear-gradient(135deg, #fff6dc, #ffe9a8);
  box-shadow: 0 16px 44px rgba(255, 211, 77, .5);
}
.flash-card.combo .flash-word {
  background: linear-gradient(90deg, #e5603f, #e0a223);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

.win-stars { display: flex; gap: 10px; font-size: 58px; }
.win-star { color: #e4dccb; animation: star-pop .5s cubic-bezier(.2, 1.8, .4, 1) both; }
.win-star.lit { color: var(--gold); text-shadow: 0 4px 14px rgba(255, 211, 77, .6); }
@keyframes star-pop { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
.coin-burst { font-size: 26px; font-weight: 900; color: #b8860b; animation: pop-in .5s ease .6s both; }
.trophy-pop { font-size: 90px; animation: star-pop .7s cubic-bezier(.2, 1.8, .4, 1) both; }

.confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }
.confetti {
  position: absolute; top: -20px; width: 12px; height: 12px; border-radius: 3px;
  animation: confetti-fall 1.8s ease-in forwards;
}
@keyframes confetti-fall {
  to { transform: translateY(105vh) rotate(720deg); opacity: .7; }
}

/* ---------- Shop ---------- */

.shop-hero { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.shop-hero-name { color: #fff; font-weight: 900; font-size: 21px; text-shadow: 0 2px 6px rgba(0,0,0,.3); }
.shop-tabs { display: flex; gap: 10px; justify-content: center; padding: 14px 0; }
.shop-tab { width: 72px; height: 64px; border-radius: 20px; background: rgba(255,250,242,.15); font-size: 28px; }
.shop-tab.active { background: var(--paper); }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.shop-item {
  background: var(--paper); border-radius: 22px; padding: 16px 12px; text-align: center;
  display: flex; flex-direction: column; gap: 8px; align-items: center; box-shadow: var(--shadow);
}
.shop-item.equipped { outline: 4px solid var(--gold); }
.shop-item.locked-item { opacity: .6; filter: grayscale(.5); }
.shop-item.rare-item {
  background: linear-gradient(160deg, #fff, #fff2d0);
  box-shadow: 0 6px 20px rgba(255, 179, 64, .4);
  outline: 2px solid var(--gold);
}
.shop-item.rare-item .shop-name::after { content: ' ✦'; color: var(--amber); }
.shop-icon { font-size: 40px; }
.shop-name { font-weight: 900; font-size: 15px; }
.shop-desc { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; }
.shop-btn {
  min-height: 48px; padding: 0 18px; border-radius: 16px; width: 100%;
  background: var(--teal); color: #fff; font-weight: 900; font-size: 16px;
  box-shadow: 0 4px 0 #2fa89f;
}
.shop-btn.owned { background: var(--violet); box-shadow: 0 4px 0 #7a67e0; }
.shop-note { grid-column: 1 / -1; text-align: center; color: rgba(255,250,242,.85); font-weight: 700; padding: 10px; }

/* ---------- Trophies ---------- */

.trophy-shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
.trophy { background: rgba(255,250,242,.12); border-radius: 20px; padding: 18px 12px; text-align: center; color: rgba(255,250,242,.75); }
.trophy.won { background: var(--paper); color: var(--ink); box-shadow: var(--shadow); }
.trophy-cup { font-size: 44px; }
.trophy.won .trophy-cup { animation: float 3s ease-in-out infinite; }
.trophy-name { font-weight: 900; font-size: 14.5px; margin-top: 6px; }
.trophy-grade { font-size: 12.5px; font-weight: 700; opacity: .75; margin-top: 2px; }
.streak-banner {
  margin-top: 18px; text-align: center; background: linear-gradient(135deg, #ff7a59, #ffb14a);
  color: #fff; font-weight: 900; font-size: 19px; border-radius: 20px; padding: 16px;
}

/* ---------- Sticker book ---------- */

.nav-badge {
  position: absolute; top: -4px; right: -4px;
  min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px;
  background: var(--coral); color: #fff; font-size: 12px; font-weight: 900;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,.3);
}
.nav-btn { position: relative; }
.sticker-count { text-align: center; color: #fff; font-weight: 800; font-size: 17px; padding: 4px 0 14px; }
.sticker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.sticker {
  background: rgba(255,250,242,.10); border-radius: 20px; padding: 16px 10px; text-align: center;
  color: rgba(255,250,242,.6); border: 2px dashed rgba(255,250,242,.2);
}
.sticker.got {
  background: var(--paper); color: var(--ink); border: none; box-shadow: var(--shadow);
  animation: pop-in .4s ease both;
}
.sticker-face { font-size: 44px; filter: grayscale(1) opacity(.5); }
.sticker.got .sticker-face { filter: none; }
.sticker.got .sticker-face { animation: float 3.6s ease-in-out infinite; }
.sticker-name { font-weight: 900; font-size: 14.5px; margin-top: 6px; }
.sticker-hint { font-size: 12px; font-weight: 600; margin-top: 3px; opacity: .8; line-height: 1.35; }

.sticker-toast {
  position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
  z-index: 80; background: var(--paper); border-radius: 20px;
  box-shadow: 0 12px 40px rgba(0,0,0,.35); padding: 14px 22px 14px 16px;
  display: flex; align-items: center; gap: 14px; border-left: 8px solid var(--gold);
  transition: transform .4s cubic-bezier(.2,1.4,.4,1), opacity .4s;
}
.sticker-toast.leaving { transform: translateX(-50%) translateY(120px); opacity: 0; }
.st-face { font-size: 40px; }
.st-kicker { font-size: 12px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: var(--amber); }
.st-name { font-size: 19px; font-weight: 900; color: var(--ink); }

/* ---------- Certificate ---------- */

.cert-shelf-btn {
  display: block; width: 100%; margin-top: 16px; min-height: 62px;
  background: linear-gradient(135deg, #ffe9a8, var(--gold));
  border-radius: 20px; font-weight: 900; font-size: 17px; color: #7a5a12;
  box-shadow: 0 6px 0 #d9a92e; animation: shimmer 2.6s ease-in-out infinite;
}
.cert-shelf-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d9a92e; }

.cert-screen { align-items: center; }
.certificate {
  position: relative; width: 100%; max-width: 560px; margin: 8px auto;
  background: linear-gradient(160deg, #fffdf6, #fff6e2);
  border: 6px solid var(--gold); border-radius: 22px;
  box-shadow: 0 16px 44px rgba(0,0,0,.3), inset 0 0 0 2px #fff;
  padding: 30px 26px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.cert-corner { position: absolute; font-size: 20px; color: var(--amber); }
.cert-corner.tl { top: 10px; left: 14px; } .cert-corner.tr { top: 10px; right: 14px; }
.cert-corner.bl { bottom: 10px; left: 14px; } .cert-corner.br { bottom: 10px; right: 14px; }
.cert-seal { font-size: 56px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.2)); }
.cert-kicker { font-size: 15px; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; color: var(--amber); }
.cert-avatar { margin: 4px 0; }
.cert-name { font-size: 32px; font-weight: 900; color: var(--ink); }
.cert-body { font-size: 15px; color: var(--ink-soft); font-weight: 600; }
.cert-world { font-size: 26px; font-weight: 900; color: var(--coral); }
.cert-subject { font-size: 14px; font-weight: 700; color: var(--ink-soft); }
.cert-stats { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 8px; font-weight: 800; font-size: 15px; color: var(--ink); }
.cert-stats span { background: #fff; border-radius: 999px; padding: 8px 14px; box-shadow: var(--shadow); }
.cert-date { margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--ink-soft); font-style: italic; }

@media print {
  body { background: #fff; }
  .top-bar, .demo-actions, .scene-layer, .confetti-layer { display: none !important; }
  .certificate { box-shadow: none; }
}

/* ---------- Mini games ---------- */

.game-screen { gap: 14px; }
.draw-stage { flex: 1; min-height: 46vh; border-radius: 24px; overflow: hidden; box-shadow: var(--shadow); position: relative; touch-action: none; }
.draw-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.draw-tools { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 6px; }
.draw-swatch { width: 48px; height: 48px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.draw-size { width: 48px; height: 48px; border-radius: 14px; background: var(--paper); font-weight: 900; }
.music-pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 20px 0; }
.music-pad { height: 110px; border-radius: 22px; box-shadow: 0 6px 0 rgba(0,0,0,.2); transition: transform .1s; }
.music-pad.hit { transform: scale(.92); filter: brightness(1.25); }

/* ---------- Parent view ---------- */

.parent-wrap { display: flex; flex-direction: column; gap: 14px; }
.parent-card { background: var(--paper); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); }
.parent-card h3 { font-size: 19px; margin-bottom: 12px; }
.parent-sub { font-weight: 600; font-size: 13.5px; color: var(--ink-soft); }
.parent-row {
  display: flex; justify-content: space-between; gap: 12px; padding: 9px 0;
  border-bottom: 1.5px solid #f0e9db; font-size: 15.5px; color: var(--ink-soft);
}
.parent-row b { color: var(--ink); text-align: right; }
.parent-row:last-child { border-bottom: none; }
.week-chart { display: flex; gap: 10px; align-items: flex-end; justify-content: space-around; padding-top: 8px; }
.week-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
.week-bar { width: 100%; max-width: 44px; background: linear-gradient(to top, var(--teal), #7eded7); border-radius: 8px 8px 4px 4px; }
.week-count { font-weight: 900; font-size: 13px; min-height: 17px; }
.week-day { font-size: 12px; font-weight: 700; color: var(--ink-soft); }

.setting-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1.5px solid #f0e9db; font-size: 15.5px; font-weight: 700; color: var(--ink-soft); }
.setting-row:last-child { border-bottom: none; }
.seg-btns { display: flex; gap: 6px; }
.seg-btn { min-height: 44px; padding: 0 14px; border-radius: 12px; background: var(--cream); font-weight: 800; font-size: 14px; color: var(--ink-soft); }
.seg-btn.on { background: var(--teal); color: #fff; }
.toggle { min-height: 44px; min-width: 66px; padding: 0 18px; border-radius: 12px; background: #e7e0d2; font-weight: 800; color: var(--ink-soft); }
.toggle.on { background: var(--teal); color: #fff; }
.manage-btn { display: block; width: 100%; min-height: 56px; margin-top: 10px; border-radius: 16px; background: var(--cream); font-weight: 800; font-size: 16px; color: var(--ink); }
.manage-btn.danger { background: #fdeceb; color: #c0392b; }
.manage-btn.armed { background: #e74c3c; color: #fff; animation: shimmer 0.8s ease-in-out infinite; }
.parent-note-sm { font-size: 12.5px; color: var(--ink-soft); margin-top: 10px; line-height: 1.5; }

/* ---------- Responsive ---------- */

@media (max-width: 640px) {
  .level-node.zig { transform: translateX(-42px); }
  .level-node.zag { transform: translateX(42px); }
  .level-node.zig:hover { transform: translateX(-42px) scale(1.05); }
  .level-node.zag:hover { transform: translateX(42px) scale(1.05); }
  .world-card { width: 100%; }
  .numpad { grid-template-columns: repeat(3, 68px); }
  .np-key { width: 68px; height: 60px; }
}
@media (min-width: 900px) {
  .screen { padding-top: 26px; }
}

/* ---------- Reduced motion ---------- */

body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after {
  animation-duration: 0.001ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: 0.001ms !important;
}
body.reduce-motion .scene-layer { display: none; }
@media (prefers-reduced-motion: reduce) {
  .scene-item, .buddy-btn, .world-emoji, .demo-big, .boss-crown, .intro-icon,
  .story-icon, .trophy.won .trophy-cup, .decor-item.float { animation: none !important; }
}

<div id="app" aria-live="polite"></div>
<script>
/* LearnQuest — shared utilities */
'use strict';

const U = {
  // Random helpers
  ri(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  pickN(arr, n) { return U.shuffle(arr.slice()).slice(0, n); },
  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  },
  // Build a set of wrong numeric choices near the answer
  distractors(answer, count, min = 0, max = Infinity) {
    const set = new Set();
    let guard = 0;
    while (set.size < count && guard++ < 200) {
      let d = answer + U.pick([-3, -2, -1, 1, 2, 3, U.ri(-10, 10) || 1]);
      if (d !== answer && d >= min && d <= max) set.add(d);
    }
    let extra = answer + count + 1;
    while (set.size < count) { if (extra !== answer && extra >= min) set.add(extra); extra++; }
    return [...set];
  },
  // Make multiple-choice list from answer + distractors
  choicesFrom(answer, wrongs, fmt) {
    fmt = fmt || (x => String(x));
    const ch = wrongs.map(w => ({ label: fmt(w), correct: false }));
    ch.push({ label: fmt(answer), correct: true });
    return U.shuffle(ch);
  },
  el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  },
  esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
  // True when the child (or parent setting) prefers less animation
  reduceMotion() {
    if (typeof Store !== 'undefined' && Store.state && Store.state.settings.reduceMotion) return true;
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  },
  gcd(a, b) { return b ? U.gcd(b, a % b) : a; },
  round(n, d) { const f = Math.pow(10, d); return Math.round(n * f) / f; },
  todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  },
  dayKeyOffset(offset) {
    const d = new Date();
    d.setDate(d.getDate() + offset);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  },
  numberWord(n) {
    const words = ['zero','one','two','three','four','five','six','seven','eight','nine','ten',
      'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
    return n <= 20 ? words[n] : String(n);
  },
  emojiGroup(emoji, n, wrap) {
    let h = '<div class="emoji-group' + (wrap === false ? ' nowrap' : '') + '">';
    for (let i = 0; i < n; i++) h += '<span class="eg-item" style="animation-delay:' + (i * 60) + 'ms">' + emoji + '</span>';
    return h + '</div>';
  },
  clockSVG(h, m) {
    const cx = 60, cy = 60, r = 54;
    const mAng = (m / 60) * 2 * Math.PI - Math.PI / 2;
    const hAng = ((h % 12) / 12 + m / 720) * 2 * Math.PI - Math.PI / 2;
    let ticks = '';
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * 2 * Math.PI - Math.PI / 2;
      const nx = cx + Math.cos(a) * (r - 11), ny = cy + Math.sin(a) * (r - 11) + 4;
      ticks += `<text x="${nx}" y="${ny}" text-anchor="middle" font-size="11" font-weight="700" fill="#5b5570">${i === 0 ? 12 : i}</text>`;
    }
    return `<svg viewBox="0 0 120 120" class="clock-svg" aria-hidden="true">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="#fffaf2" stroke="#e8ded0" stroke-width="4"/>${ticks}
      <line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(hAng) * 26}" y2="${cy + Math.sin(hAng) * 26}" stroke="#3d3554" stroke-width="5" stroke-linecap="round"/>
      <line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(mAng) * 40}" y2="${cy + Math.sin(mAng) * 40}" stroke="#ff7a59" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="4" fill="#3d3554"/></svg>`;
  },
  angleSVG(deg) {
    const cx = 70, cy = 90, len = 62;
    const a = -deg * Math.PI / 180;
    const x2 = cx + Math.cos(a) * len, y2 = cy + Math.sin(a) * len;
    const arcR = 22;
    const ax = cx + arcR, ay = cy;
    const bx = cx + Math.cos(a) * arcR, by = cy + Math.sin(a) * arcR;
    const large = deg > 180 ? 1 : 0;
    return `<svg viewBox="0 0 140 110" class="angle-svg" aria-hidden="true">
      <line x1="${cx}" y1="${cy}" x2="${cx + len}" y2="${cy}" stroke="#3d3554" stroke-width="4" stroke-linecap="round"/>
      <line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#3d3554" stroke-width="4" stroke-linecap="round"/>
      <path d="M ${ax} ${ay} A ${arcR} ${arcR} 0 ${large} 0 ${bx} ${by}" fill="none" stroke="#ff7a59" stroke-width="3"/>
      <circle cx="${cx}" cy="${cy}" r="4" fill="#3d3554"/></svg>`;
  },
  gridSVG(px, py, showPoint) {
    let lines = '', labels = '';
    const S = 24, O = 30, N = 6;
    for (let i = 0; i <= N; i++) {
      lines += `<line x1="${O + i * S}" y1="${O}" x2="${O + i * S}" y2="${O + N * S}" stroke="#e3dcec" stroke-width="1"/>`;
      lines += `<line x1="${O}" y1="${O + i * S}" x2="${O + N * S}" y2="${O + i * S}" stroke="#e3dcec" stroke-width="1"/>`;
      labels += `<text x="${O + i * S}" y="${O + N * S + 16}" text-anchor="middle" font-size="10" fill="#5b5570">${i}</text>`;
      labels += `<text x="${O - 12}" y="${O + (N - i) * S + 4}" text-anchor="middle" font-size="10" fill="#5b5570">${i}</text>`;
    }
    const pt = showPoint ? `<circle cx="${O + px * S}" cy="${O + (N - py) * S}" r="7" fill="#ff7a59" stroke="#fff" stroke-width="2"/>` : '';
    return `<svg viewBox="0 0 210 210" class="grid-svg" aria-hidden="true">
      ${lines}
      <line x1="${O}" y1="${O + N * S}" x2="${O + N * S}" y2="${O + N * S}" stroke="#3d3554" stroke-width="2.5"/>
      <line x1="${O}" y1="${O}" x2="${O}" y2="${O + N * S}" stroke="#3d3554" stroke-width="2.5"/>
      ${labels}${pt}</svg>`;
  },
  fractionSVG(num, den, kind) {
    kind = kind || 'circle';
    if (kind === 'circle') {
      const cx = 55, cy = 55, r = 48;
      let paths = '';
      for (let i = 0; i < den; i++) {
        const a1 = (i / den) * 2 * Math.PI - Math.PI / 2;
        const a2 = ((i + 1) / den) * 2 * Math.PI - Math.PI / 2;
        const x1 = cx + Math.cos(a1) * r, y1 = cy + Math.sin(a1) * r;
        const x2 = cx + Math.cos(a2) * r, y2 = cy + Math.sin(a2) * r;
        const fill = i < num ? '#ffb14a' : '#f3eee6';
        if (den === 1) { paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="#c9a36a" stroke-width="2"/>`; }
        else paths += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2} Z" fill="${fill}" stroke="#c9a36a" stroke-width="2"/>`;
      }
      return `<svg viewBox="0 0 110 110" class="frac-svg" aria-hidden="true">${paths}</svg>`;
    }
    // bar
    let rects = '';
    const w = 200 / den;
    for (let i = 0; i < den; i++) {
      rects += `<rect x="${5 + i * w}" y="8" width="${w}" height="44" fill="${i < num ? '#ffb14a' : '#f3eee6'}" stroke="#c9a36a" stroke-width="2" rx="4"/>`;
    }
    return `<svg viewBox="0 0 210 60" class="frac-bar-svg" aria-hidden="true">${rects}</svg>`;
  },
  barChartSVG(data) {
    // data: [{label, emoji, value}]
    const max = Math.max(...data.map(d => d.value));
    const bw = 44, gap = 22, H = 130, base = 150;
    let bars = '';
    data.forEach((d, i) => {
      const h = Math.max(8, (d.value / max) * H);
      const x = 20 + i * (bw + gap);
      bars += `<rect x="${x}" y="${base - h}" width="${bw}" height="${h}" rx="8" fill="${['#ff7a59','#4ecdc4','#ffb14a','#9b8cff'][i % 4]}"/>`;
      bars += `<text x="${x + bw / 2}" y="${base + 22}" text-anchor="middle" font-size="18">${d.emoji}</text>`;
      bars += `<text x="${x + bw / 2}" y="${base - h - 7}" text-anchor="middle" font-size="13" font-weight="700" fill="#3d3554">${d.value}</text>`;
    });
    const w = 20 + data.length * (bw + gap);
    return `<svg viewBox="0 0 ${w + 10} 185" class="chart-svg" aria-hidden="true"><line x1="14" y1="${base}" x2="${w}" y2="${base}" stroke="#3d3554" stroke-width="2.5"/>${bars}</svg>`;
  },
  lineGraphSVG(points, labels) {
    const W = 240, H = 140, O = 34;
    const max = Math.max(...points);
    const step = (W - O - 10) / (points.length - 1);
    let path = '', dots = '', lbl = '';
    points.forEach((v, i) => {
      const x = O + i * step, y = 14 + (H - 34) * (1 - v / max);
      path += (i ? ' L ' : 'M ') + x + ' ' + y;
      dots += `<circle cx="${x}" cy="${y}" r="4.5" fill="#ff7a59" stroke="#fff" stroke-width="1.5"/>`;
      dots += `<text x="${x}" y="${y - 9}" text-anchor="middle" font-size="11" font-weight="700" fill="#3d3554">${v}</text>`;
      lbl += `<text x="${x}" y="${H + 8}" text-anchor="middle" font-size="10" fill="#5b5570">${labels[i]}</text>`;
    });
    return `<svg viewBox="0 0 ${W + 6} ${H + 16}" class="chart-svg" aria-hidden="true">
      <line x1="${O - 6}" y1="${H - 18}" x2="${W}" y2="${H - 18}" stroke="#c9c2d6" stroke-width="1.5"/>
      <path d="${path}" fill="none" stroke="#4ecdc4" stroke-width="3" stroke-linecap="round"/>${dots}${lbl}</svg>`;
  },
  spinnerSVG(sections) {
    // sections: [{color, emoji, count}] — draws wedges
    const total = sections.reduce((s, x) => s + x.count, 0);
    const cx = 60, cy = 60, r = 52;
    let paths = '', idx = 0;
    sections.forEach(sec => {
      for (let k = 0; k < sec.count; k++) {
        const a1 = (idx / total) * 2 * Math.PI - Math.PI / 2;
        const a2 = ((idx + 1) / total) * 2 * Math.PI - Math.PI / 2;
        const mid = (a1 + a2) / 2;
        const x1 = cx + Math.cos(a1) * r, y1 = cy + Math.sin(a1) * r;
        const x2 = cx + Math.cos(a2) * r, y2 = cy + Math.sin(a2) * r;
        paths += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2} Z" fill="${sec.color}" stroke="#fff" stroke-width="2"/>`;
        paths += `<text x="${cx + Math.cos(mid) * r * 0.62}" y="${cy + Math.sin(mid) * r * 0.62 + 5}" text-anchor="middle" font-size="14">${sec.emoji}</text>`;
        idx++;
      }
    });
    return `<svg viewBox="0 0 120 120" class="spinner-svg" aria-hidden="true">${paths}<polygon points="60,2 54,16 66,16" fill="#3d3554"/></svg>`;
  },
  thermometerSVG(temp, min, max) {
    const top = 18, bot = 166, cx = 34, w = 16;
    const level = bot - (temp - min) / (max - min) * (bot - top);
    let marks = '';
    for (let v = min; v <= max; v += 10) {
      const y = bot - (v - min) / (max - min) * (bot - top);
      marks += `<line x1="${cx + w / 2}" y1="${y}" x2="${cx + w / 2 + 6}" y2="${y}" stroke="#8a8298" stroke-width="1.5"/>`;
      marks += `<text x="${cx + w / 2 + 10}" y="${y + 4}" font-size="11" font-weight="700" fill="#5b5570">${v}°</text>`;
    }
    return `<svg viewBox="0 0 110 200" class="thermo-svg" aria-hidden="true">
      <rect x="${cx - w / 2}" y="${top}" width="${w}" height="${bot - top + 6}" rx="${w / 2}" fill="#f3eee6" stroke="#c9c2b4" stroke-width="2"/>
      <rect x="${cx - w / 2 + 4}" y="${level}" width="${w - 8}" height="${bot - level + 6}" rx="${(w - 8) / 2}" fill="#ff6b52"/>
      <circle cx="${cx}" cy="${bot + 16}" r="17" fill="#ff6b52" stroke="#e0503a" stroke-width="2"/>
      ${marks}</svg>`;
  },

  goalRingSVG(done, goal) {
    const pct = Math.max(0, Math.min(1, goal ? done / goal : 0));
    const r = 32, c = 2 * Math.PI * r;
    const off = c * (1 - pct);
    const complete = done >= goal;
    return `<svg viewBox="0 0 80 80" class="goal-ring" aria-hidden="true">
      <circle cx="40" cy="40" r="${r}" fill="none" stroke="rgba(255,250,242,.18)" stroke-width="8"/>
      <circle cx="40" cy="40" r="${r}" fill="none" stroke="${complete ? '#ffd34d' : '#4ecdc4'}" stroke-width="8"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
        transform="rotate(-90 40 40)"/>
      <text x="40" y="37" text-anchor="middle" font-size="19">${complete ? '⭐' : '🎯'}</text>
      <text x="40" y="55" text-anchor="middle" font-size="15" font-weight="900" fill="#fff">${done}/${goal}</text>
    </svg>`;
  },

  numberLineSVG(min, max, mark) {
    const W = 280, O = 16;
    const step = (W - 2 * O) / (max - min);
    let ticks = '';
    for (let v = min; v <= max; v++) {
      const x = O + (v - min) * step;
      ticks += `<line x1="${x}" y1="30" x2="${x}" y2="${v % 5 === 0 || max - min <= 12 ? 20 : 25}" stroke="#3d3554" stroke-width="1.5"/>`;
      if (v % (max - min > 12 ? 5 : 1) === 0) ticks += `<text x="${x}" y="52" text-anchor="middle" font-size="11" fill="#5b5570">${v}</text>`;
    }
    const mx = O + (mark - min) * step;
    return `<svg viewBox="0 0 ${W} 60" class="numline-svg" aria-hidden="true">
      <line x1="${O - 6}" y1="30" x2="${W - O + 6}" y2="30" stroke="#3d3554" stroke-width="2.5"/>${ticks}
      <circle cx="${mx}" cy="30" r="7" fill="#ff7a59" stroke="#fff" stroke-width="2"/></svg>`;
  }
};


/* LearnQuest — narration (SpeechSynthesis) and sound effects (WebAudio) */
'use strict';

const Audio2 = {
  ctx: null,
  muted: false,
  voice: null,
  _primed: false,

  pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices();
    if (!vs.length) return;
    // Prefer a friendly natural English voice
    Audio2.voice =
      vs.find(v => /en/i.test(v.lang) && /female|samantha|karen|zira|jenny|aria|natural/i.test(v.name)) ||
      vs.find(v => /^en/i.test(v.lang)) || vs[0];
  },

  init() {
    Audio2.pickVoice();
    if (typeof speechSynthesis !== 'undefined') {
      speechSynthesis.onvoiceschanged = Audio2.pickVoice;
      // Some engines populate voices lazily — retry a few times
      let tries = 0;
      const iv = setInterval(() => {
        if (Audio2.voice || ++tries > 10) clearInterval(iv);
        else Audio2.pickVoice();
      }, 300);
    }
    Audio2.armUnlock();
  },

  // Browsers block audio until a user gesture. On the first interaction,
  // resume the AudioContext and prime SpeechSynthesis so the very first
  // sound and narration actually play.
  armUnlock() {
    const evs = ['pointerdown', 'touchstart', 'keydown', 'click'];
    const unlock = () => {
      try { Audio2.ac(); } catch (e) { /* ignore */ }
      if ('speechSynthesis' in window && !Audio2._primed) {
        Audio2._primed = true;
        try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) { /* ignore */ }
      }
      if (!Audio2.voice) Audio2.pickVoice();
      evs.forEach(ev => document.removeEventListener(ev, unlock));
    };
    evs.forEach(ev => document.addEventListener(ev, unlock, { passive: true }));
  },

  ac() {
    if (!Audio2.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) Audio2.ctx = new AC();
    }
    if (Audio2.ctx && Audio2.ctx.state === 'suspended') Audio2.ctx.resume();
    return Audio2.ctx;
  },

  say(text, opts) {
    opts = opts || {};
    // opts.force lets audio-only questions speak even when muted — they are
    // unanswerable otherwise. Mute still silences all other narration and SFX.
    if ((Audio2.muted && !opts.force) || !('speechSynthesis' in window) || !text) return;
    if (!Audio2.voice) Audio2.pickVoice();  // last-chance retry if voices loaded late
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (Audio2.voice) u.voice = Audio2.voice;
    const savedRate = (typeof Store !== 'undefined' && Store.state && Store.state.settings.narrationRate) || 0.92;
    u.rate = opts.rate || savedRate;
    u.pitch = opts.pitch || 1.05;
    // Guard against engines that throw on rapid cancel/speak cycles
    try { speechSynthesis.speak(u); } catch (e) { /* ignore */ }
  },

  stop() { if ('speechSynthesis' in window) speechSynthesis.cancel(); },

  tone(freq, dur, type, vol, when) {
    const ctx = Audio2.ac();
    if (!ctx || Audio2.muted) return;
    const t = ctx.currentTime + (when || 0);
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ctx.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
  },

  pop()   { Audio2.tone(520, 0.09, 'triangle', 0.15); Audio2.tone(780, 0.07, 'sine', 0.1, 0.03); },
  tap()   { Audio2.tone(340, 0.05, 'sine', 0.08); },
  correct() {
    [523, 659, 784].forEach((f, i) => Audio2.tone(f, 0.16, 'triangle', 0.16, i * 0.09));
  },
  // Rising pitch with the combo count — the streak audibly climbs
  combo(n) {
    const lift = Math.pow(1.06, Math.min(n, 8));
    [523, 659, 784, 1046].forEach((f, i) => Audio2.tone(f * lift, 0.14, 'triangle', 0.16, i * 0.07));
  },
  wrong() { Audio2.tone(280, 0.22, 'sine', 0.10); Audio2.tone(220, 0.3, 'sine', 0.08, 0.12); },
  coin()  { Audio2.tone(880, 0.08, 'square', 0.07); Audio2.tone(1320, 0.18, 'square', 0.07, 0.08); },
  star()  { [660, 880, 1100, 1320].forEach((f, i) => Audio2.tone(f, 0.12, 'triangle', 0.12, i * 0.07)); },
  fanfare() {
    [523, 659, 784, 1046, 784, 1046].forEach((f, i) => Audio2.tone(f, 0.22, 'triangle', 0.16, i * 0.13));
    Audio2.tone(261, 1.0, 'sine', 0.07, 0.1);
  },
  whoosh() {
    const ctx = Audio2.ac();
    if (!ctx || Audio2.muted) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(200, t);
    o.frequency.exponentialRampToValueAtTime(900, t + 0.25);
    g.gain.setValueAtTime(0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(g).connect(ctx.destination);
    o.start(t); o.stop(t + 0.35);
  },
  note(i) {
    const scale = [261.6, 293.7, 329.6, 392, 440, 523.3, 587.3, 659.3];
    Audio2.tone(scale[i % scale.length], 0.35, 'triangle', 0.18);
  }
};


/* LearnQuest — progress engine backed by localStorage */
'use strict';

const Store = {
  KEY: 'learnquest-v1',
  state: null,

  defaults() {
    return {
      coins: 0,
      totalStars: 0,
      stars: {},          // levelId -> 1..3
      completed: {},      // levelId -> true
      bossPassed: {},     // regionId -> true
      fastTracked: {},    // regionId -> true
      trophies: [],       // regionIds in order earned
      avatar: { equipped: {}, owned: ['base'] },
      decorOwned: [],
      gamesOwned: [],
      streak: { count: 0, last: null, best: 0 },
      activity: {},       // 'YYYY-MM-DD' -> levels completed that day
      settings: { muted: false, narrationRate: 0.92, reduceMotion: false },
      dailyGoal: 3,       // levels per day the goal ring celebrates
      lastGoalDay: null,  // day key the daily goal was last celebrated
      stickersSeen: null, // null = seed silently on first sync
      lastWorld: null,    // world the child last visited, for Continue
      name: ''
    };
  },

  load() {
    const d = Store.defaults();
    try {
      const raw = localStorage.getItem(Store.KEY);
      const saved = raw ? JSON.parse(raw) : null;
      if (saved && typeof saved === 'object') {
        // Deep-merge one level so old saves keep working when new nested
        // fields are added to the schema in future versions.
        Object.keys(saved).forEach(k => {
          if (d[k] && typeof d[k] === 'object' && !Array.isArray(d[k]) &&
              saved[k] && typeof saved[k] === 'object' && !Array.isArray(saved[k])) {
            d[k] = Object.assign({}, d[k], saved[k]);
          } else if (saved[k] !== undefined) {
            d[k] = saved[k];
          }
        });
      }
      Store.state = d;
    } catch (e) {
      Store.state = d;
    }
    Audio2.muted = !!Store.state.settings.muted;
    return Store.state;
  },

  save() {
    try { localStorage.setItem(Store.KEY, JSON.stringify(Store.state)); } catch (e) { /* storage full/blocked */ }
  },

  // Streak as it stands right now: 0 if the chain lapsed (no play yesterday or today)
  currentStreak() {
    const s = Store.state.streak;
    if (s.last === U.todayKey() || s.last === U.dayKeyOffset(-1)) return s.count;
    return 0;
  },

  touchStreak() {
    const s = Store.state.streak;
    const today = U.todayKey();
    if (s.last === today) return;
    s.count = (s.last === U.dayKeyOffset(-1)) ? s.count + 1 : 1;
    s.last = today;
    if (s.count > s.best) s.best = s.count;
    Store.save();
  },

  logActivity() {
    const k = U.todayKey();
    Store.state.activity[k] = (Store.state.activity[k] || 0) + 1;
    // prune entries older than 60 days
    const cutoff = U.dayKeyOffset(-60);
    Object.keys(Store.state.activity).forEach(d => { if (d < cutoff) delete Store.state.activity[d]; });
    Store.save();
  },

  // Record a level result. Returns {newStars, coinsEarned}
  completeLevel(levelId, stars) {
    const st = Store.state;
    const prev = st.stars[levelId] || 0;
    const gained = Math.max(0, stars - prev);
    // Replays with no new stars still earn a little — practice always pays
    const coinsEarned = gained * 10 + (prev === 0 ? 5 : 0) + (gained === 0 && prev > 0 ? 3 : 0);
    st.stars[levelId] = Math.max(prev, stars);
    st.completed[levelId] = true;
    st.totalStars += gained;
    st.coins += coinsEarned;
    Store.touchStreak();
    Store.logActivity();
    Store.save();
    return { newStars: stars, coinsEarned };
  },

  passBoss(regionId) {
    const st = Store.state;
    if (!st.bossPassed[regionId]) {
      st.bossPassed[regionId] = true;
      st.trophies.push(regionId);
      st.coins += 50;
      Store.touchStreak();
      Store.logActivity();
      Store.save();
      return 50;
    }
    Store.save();
    return 0;
  },

  fastTrack(regionId, region) {
    const st = Store.state;
    st.fastTracked[regionId] = true;
    // mark all region levels complete with 3 stars
    region.levels.forEach(lv => {
      if (!st.completed[lv.id]) {
        st.completed[lv.id] = true;
        st.stars[lv.id] = 3;
        st.totalStars += 3;
      }
    });
    if (!st.bossPassed[regionId]) { st.bossPassed[regionId] = true; st.trophies.push(regionId); }
    st.coins += 80;
    Store.touchStreak();
    Store.logActivity();
    Store.save();
  },

  spend(amount) {
    if (Store.state.coins < amount) return false;
    Store.state.coins -= amount;
    Store.save();
    return true;
  },

  isLevelUnlocked(world, region, idx) {
    if (!Store.isRegionUnlocked(world, region)) return false;
    if (idx === 0) return true;
    const prev = region.levels[idx - 1];
    return !!Store.state.completed[prev.id];
  },

  isRegionUnlocked(world, region) {
    const regions = world.regions;
    const i = regions.indexOf(region);
    if (i === 0) return true;
    return !!Store.state.bossPassed[regions[i - 1].id];
  },

  isRegionComplete(region) {
    return !!Store.state.bossPassed[region.id];
  },

  regionProgress(region) {
    const done = region.levels.filter(lv => Store.state.completed[lv.id]).length;
    return { done, total: region.levels.length };
  },

  bossUnlocked(region) {
    return region.levels.every(lv => Store.state.completed[lv.id]);
  },

  levelsToday() {
    return Store.state.activity[U.todayKey()] || 0;
  },

  last7Days() {
    const out = [];
    for (let i = 6; i >= 0; i--) {
      const k = U.dayKeyOffset(-i);
      out.push({ day: k, count: Store.state.activity[k] || 0 });
    }
    return out;
  },

  reset() {
    localStorage.removeItem(Store.KEY);
    Store.load();
  }
};
