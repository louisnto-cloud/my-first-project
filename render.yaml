# Render Blueprint: one click after connecting the repo.
# Creates the API (with hosted Postgres) and the static portal.

databases:
  - name: etop-db
    plan: free

services:
  - type: web
    name: etop-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace packages/domain
    startCommand: npm start --workspace apps/api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: etop-db
          property: connectionString
      - key: ETOP_WEB_ORIGIN
        value: https://etop-portal.onrender.com

  - type: web
    name: etop-portal
    runtime: static
    buildCommand: npm install && VITE_API_URL=https://etop-api.onrender.com npm run build --workspace apps/web
    staticPublishPath: apps/web/dist
