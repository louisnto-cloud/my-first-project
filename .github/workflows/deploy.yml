name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/english-center-app-yylgv3
      - claude/pilgrimage-catholic-app-t572l3
      - claude/vietnamese-autism-learning-app-ndhztn
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The E'TOP app (repo root) — built for main deploys.
      - name: Build E'TOP
        if: github.ref == 'refs/heads/main' || hashFiles('pilgrimage/package.json') == ''
        run: |
          npm ci
          npm run build

      # The Pilgrimage (pilgrimage/) — served under /pilgrimage. Built only on
      # main and on its own feature branch (not on unrelated feature branches).
      - name: Build The Pilgrimage
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/pilgrimage-catholic-app-t572l3') && hashFiles('pilgrimage/package.json') != ''
        working-directory: pilgrimage
        env:
          NEXT_PUBLIC_BASE_PATH: /my-first-project/pilgrimage
        run: |
          npm ci
          npm run build

      # On main: publish the whole site (E'TOP at the root, Pilgrimage under
      # /pilgrimage, Khu Vườn Nhỏ under /vuon). Publishing to the gh-pages
      # branch auto-enables GitHub Pages, which the github-pages deployment API
      # is not allowed to do with the default workflow token.
      - name: Assemble full site (main)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist/pilgrimage dist/vuon dist/docviet
          if [ -d pilgrimage/out ]; then cp -r pilgrimage/out/. dist/pilgrimage/; fi
          # Khu Vườn Nhỏ is a static app — copy it as-is (no build step).
          cp -r vuon/index.html vuon/css vuon/js dist/vuon/
          # Đọc & Viết is a single self-contained static page — copy it as-is.
          cp docviet/index.html dist/docviet/
      - name: Publish full site
        if: github.ref == 'refs/heads/main' || hashFiles('pilgrimage/package.json') == ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      # On the pilgrimage feature branch: overlay only /pilgrimage, leaving
      # whatever is deployed at the site root untouched.
      - name: Publish /pilgrimage only (feature branch)
        if: github.ref == 'refs/heads/claude/pilgrimage-catholic-app-t572l3' && hashFiles('pilgrimage/package.json') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pilgrimage/out
          destination_dir: pilgrimage
          keep_files: true

      # On the Khu Vườn Nhỏ feature branch: assemble the static app and overlay
      # only /vuon, leaving the site root and /pilgrimage untouched.
      - name: Assemble /vuon (feature branch)
        if: github.ref == 'refs/heads/claude/vietnamese-autism-learning-app-ndhztn'
        run: |
          mkdir -p vuon_dist
          cp -r vuon/index.html vuon/css vuon/js vuon_dist/
      - name: Publish /vuon only (feature branch)
        if: github.ref == 'refs/heads/claude/vietnamese-autism-learning-app-ndhztn'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./vuon_dist
          destination_dir: vuon
          keep_files: true

      # On the Vietnamese learning feature branch: overlay only /docviet
      # (Đọc & Viết — a single self-contained static page), leaving the site
      # root, /pilgrimage and /vuon untouched.
      - name: Assemble /docviet (feature branch)
        if: github.ref == 'refs/heads/claude/vietnamese-autism-learning-app-ndhztn'
        run: |
          mkdir -p docviet_dist
          cp docviet/index.html docviet_dist/
      - name: Publish /docviet only (feature branch)
        if: github.ref == 'refs/heads/claude/vietnamese-autism-learning-app-ndhztn'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docviet_dist
          destination_dir: docviet
          keep_files: true
