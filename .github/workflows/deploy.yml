name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/english-center-app-yylgv3
      - main
  workflow_dispatch:

permissions:
  contents: write

# Own concurrency group: the sibling apps on this repo (Pilgrimage, …)
# use group 'pages' with cancel-in-progress, and their frequent deploys
# kept cancelling ours mid-run. A separate per-branch group means only a
# newer E'TOP push supersedes an E'TOP deploy. keep_files below makes
# concurrent publishes to gh-pages additive, not destructive.
concurrency:
  group: etop-pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx turbo run build test
      # The prototype is the site root; the new platform UI is published
      # under /platform/ as a FULLY INTERACTIVE demo (VITE_DEMO=1 routes
      # every call to an in-browser engine — no server needed).
      - run: VITE_DEMO=1 npm run build --workspace apps/web
      - run: mkdir -p apps/web-prototype/dist/platform && cp -r apps/web/dist/* apps/web-prototype/dist/platform/
      # Publishing to the gh-pages branch auto-enables GitHub Pages,
      # which the github-pages deployment API is not allowed to do
      # with the default workflow token.
      #
      # keep_files: the gh-pages site is shared with The Pilgrimage app
      # (deployed under /pilgrimage by main and its own branch). Overlay
      # this build instead of replacing the whole tree, so the two apps
      # coexist.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/web-prototype/dist
          keep_files: true
