name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/english-center-app-yylgv3
      - claude/pilgrimage-catholic-app-t572l3
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # The Pilgrimage lives alongside the E'TOP app, under /pilgrimage.
      - name: Build The Pilgrimage
        if: hashFiles('pilgrimage/package.json') != ''
        working-directory: pilgrimage
        env:
          NEXT_PUBLIC_BASE_PATH: /my-first-project/pilgrimage
        run: |
          npm ci
          npm run build
          mkdir -p ../dist/pilgrimage
          cp -r out/. ../dist/pilgrimage/
      # Publishing to the gh-pages branch auto-enables GitHub Pages,
      # which the github-pages deployment API is not allowed to do
      # with the default workflow token.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
