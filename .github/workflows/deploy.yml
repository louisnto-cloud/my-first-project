name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/english-center-app-yylgv3
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx turbo run build test
      # The prototype is the site root; the new platform UI is published
      # under /platform/ as a visual preview until the API is hosted.
      - run: mkdir -p apps/web-prototype/dist/platform && cp -r apps/web/dist/* apps/web-prototype/dist/platform/
      # Publishing to the gh-pages branch auto-enables GitHub Pages,
      # which the github-pages deployment API is not allowed to do
      # with the default workflow token.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/web-prototype/dist
