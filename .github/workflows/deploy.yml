name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/english-center-app-yylgv3
      - claude/pilgrimage-catholic-app-t572l3
      - claude/nimble-trainer-app-auzsuy
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The E'TOP app (repo root) — built for main deploys.
      - name: Build E'TOP
        if: github.ref == 'refs/heads/main' || hashFiles('pilgrimage/package.json') == ''
        run: |
          npm ci
          npm run build

      # The Pilgrimage (pilgrimage/) — served under /pilgrimage.
      - name: Build The Pilgrimage
        if: hashFiles('pilgrimage/package.json') != '' && github.ref != 'refs/heads/claude/nimble-trainer-app-auzsuy'
        working-directory: pilgrimage
        env:
          NEXT_PUBLIC_BASE_PATH: /my-first-project/pilgrimage
        run: |
          npm ci
          npm run build

      # On main: publish the whole site (E'TOP at the root, Pilgrimage under
      # /pilgrimage). Publishing to the gh-pages branch auto-enables GitHub
      # Pages, which the github-pages deployment API is not allowed to do
      # with the default workflow token.
      - name: Assemble full site (main)
        if: github.ref == 'refs/heads/main' && hashFiles('pilgrimage/package.json') != ''
        run: |
          mkdir -p dist/pilgrimage
          cp -r pilgrimage/out/. dist/pilgrimage/
      - name: Include Nimble web build (main)
        if: github.ref == 'refs/heads/main' && hashFiles('nimble/web/index.html') != ''
        run: |
          mkdir -p dist/nimble
          cp -r nimble/web/. dist/nimble/
      - name: Publish full site
        if: github.ref == 'refs/heads/main' || hashFiles('pilgrimage/package.json') == ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      # On the nimble feature branch: overlay only /nimble (static, no build),
      # leaving the rest of the site untouched.
      - name: Publish /nimble only (feature branch)
        if: github.ref == 'refs/heads/claude/nimble-trainer-app-auzsuy'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./nimble/web
          destination_dir: nimble
          keep_files: true

      # On the pilgrimage feature branch: overlay only /pilgrimage, leaving
      # whatever is deployed at the site root untouched.
      - name: Publish /pilgrimage only (feature branch)
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/claude/nimble-trainer-app-auzsuy' && hashFiles('pilgrimage/package.json') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pilgrimage/out
          destination_dir: pilgrimage
          keep_files: true
