name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/pilgrimage-catholic-app-t572l3
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Sparkling Daily forecast model is a single self-contained HTML
      # file plus the Excel workbook — nothing to build, just stage it.
      - name: Stage the forecast model (site root)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp organika_sparkling_daily_model.html dist/index.html
          cp Organika_Sparkling_Daily_1YR_Scenario_Model.xlsx dist/
          cp MODEL.md dist/

      - uses: actions/setup-node@v4
        if: hashFiles('pilgrimage/package.json') != ''
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pilgrimage/package-lock.json

      # The Pilgrimage (pilgrimage/) — served under /pilgrimage.
      - name: Build The Pilgrimage
        if: hashFiles('pilgrimage/package.json') != ''
        working-directory: pilgrimage
        env:
          NEXT_PUBLIC_BASE_PATH: /my-first-project/pilgrimage
        run: |
          npm ci
          npm run build

      # On main: publish the whole site (forecast model at the root,
      # Pilgrimage under /pilgrimage). Publishing to the gh-pages branch
      # auto-enables GitHub Pages, which the github-pages deployment API is
      # not allowed to do with the default workflow token.
      - name: Assemble full site (main)
        if: github.ref == 'refs/heads/main' && hashFiles('pilgrimage/package.json') != ''
        run: |
          mkdir -p dist/pilgrimage
          cp -r pilgrimage/out/. dist/pilgrimage/

      - name: Publish full site
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      # On the pilgrimage feature branch: overlay only /pilgrimage, leaving
      # whatever is deployed at the site root untouched.
      - name: Publish /pilgrimage only (feature branch)
        if: github.ref != 'refs/heads/main' && hashFiles('pilgrimage/package.json') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pilgrimage/out
          destination_dir: pilgrimage
          keep_files: true
