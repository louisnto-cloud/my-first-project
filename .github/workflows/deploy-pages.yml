name: Deploy LearnQuest to GitHub Pages

# Publishes the learnquest/ folder as a public website.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# After that, every push to main (or a manual run) deploys automatically.

on:
  push:
    branches: [main]
    paths:
      - 'learnquest/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # The learnquest folder becomes the site root, so the app loads
          # at the top level and all its relative paths keep working.
          path: learnquest
      - id: deployment
        uses: actions/deploy-pages@v4
