<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#a7c4a0" />
  <meta name="description" content="Khu Vườn Nhỏ — ứng dụng học Số và Chữ cái tiếng Việt, thiết kế cho trẻ tự kỷ." />
  <title>Khu Vườn Nhỏ</title>

  <!-- Rounded fonts with full Vietnamese diacritic support. Loaded from
       Google Fonts on first visit, then cached. If unavailable/offline the
       CSS falls back to system fonts that also render diacritics correctly,
       so the app never depends on the network. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="app"></div>
  <div id="overlay-layer"></div>

  <!-- Classic scripts, loaded in order. No build step, no modules, no fetch:
       the app runs fully offline, even directly from the file system. -->
  <script src="./js/util.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/strings.js"></script>
  <script src="./js/illustrations.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/audio.js"></script>
  <script src="./js/components.js"></script>
  <script src="./js/engine.js"></script>
  <script src="./js/screens.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
