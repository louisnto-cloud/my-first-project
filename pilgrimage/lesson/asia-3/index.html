\"$1\",\"c\",{\"children\":[\"$L5\",null,[\"$\",\"$L6\",null,{\"children\":[\"$L7\",[\"$\",\"$L8\",null,{\"promise\":\"$@9\"}]]}]]}],{},null,false]},null,false]},null,false]},null,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[[\"$\",\"$La\",null,{\"children\":\"$Lb\"}],null],[\"$\",\"$Lc\",null,{\"children\":[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$d\",null,{\"fallback\":null,\"children\":\"$Le\"}]}]}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[]],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"10:I[730,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"363\",\"static/chunks/363-2fcb9d3b70c81328.js\",\"948\",\"static/chunks/948-b583405fadf45103.js\",\"617\",\"static/chunks/617-416c6a8a829cd65b.js\",\"799\",\"static/chunks/app/lesson/%5Bid%5D/page-5297eade789f8a39.js\"],\"LessonPlayer\"]\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L10\",null,{\"world\":{\"id\":\"asia\",\"name\":{\"en\":\"Saints of Asia\",\"vi\":\"Các Thánh Á châu\",\"viStatus\":\"unverified\"},\"church\":{\"en\":\"The shrines of Việt Nam\",\"vi\":\"Các đền thánh Việt Nam\",\"viStatus\":\"unverified\"},\"place\":{\"en\":\"Việt Nam\",\"vi\":\"Việt Nam\",\"viStatus\":\"unverified\"},\"theme\":{\"en\":\"Saints who speak your language\",\"vi\":\"Các vị thánh nói tiếng của bạn\",\"viStatus\":\"unverified\"},\"lessons\":[{\"id\":\"asia-1\",\"title\":{\"en\":\"The Hundred and Seventeen\",\"vi\":\"Một trăm mười bảy vị\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"asia-lanterns\",\"line\":{\"en\":\"A bonus road, lit by lanterns: the saints who speak your language.\",\"vi\":\"Một con đường thêm, thắp sáng bằng đèn lồng: các vị thánh nói tiếng của bạn.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"martyrs-palm\",\"text\":{\"en\":\"Between 1745 and 1862, in waves of persecution, an enormous number of Vietnamese Catholics — some estimates say over one hundred thousand — died rather than abandon the faith. The Church has formally named 117 of them.\",\"vi\":\"Từ năm 1745 đến 1862, qua những đợt bách hại, một số lượng rất lớn người Công giáo Việt Nam — có ước tính nói hơn một trăm ngàn — đã chết chứ không bỏ đạo. Giáo hội đã chính thức tuyên phong 117 vị trong số đó.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"asia-lanterns\",\"text\":{\"en\":\"Read who they were: 8 bishops, 50 priests — and 59 lay people. Farmers, fishermen, a tailor, soldiers, mothers, catechists. Most of the 117 were ordinary Vietnamese believers, people who would have understood your life.\",\"vi\":\"Hãy xem các ngài là ai: 8 giám mục, 50 linh mục — và 59 giáo dân. Nông dân, ngư phủ, một người thợ may, binh lính, những người mẹ, các thầy giảng. Phần lớn trong 117 vị là tín hữu Việt Nam bình thường, những con người hẳn sẽ hiểu được cuộc sống của bạn.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"martyrs-palm\",\"text\":{\"en\":\"In 1988, Pope John Paul II canonized all 117 together as “Anrê Dũng Lạc and companions.” Their feast, November 24, is kept by the whole world — a Vietnamese day on every Catholic calendar on earth.\",\"vi\":\"Năm 1988, Đức Giáo hoàng Gioan Phaolô II tuyên thánh cả 117 vị cùng lúc, với danh hiệu “Anrê Dũng Lạc và các bạn tử đạo.” Lễ kính các ngài, ngày 24 tháng 11, được cả thế giới cử hành — một ngày của Việt Nam trên mọi cuốn lịch Công giáo trên trái đất.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":1,\"prompt\":{\"en\":\"Who made up the largest group among the 117?\",\"vi\":\"Nhóm đông nhất trong 117 vị là ai?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Bishops\",\"vi\":\"Các giám mục\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Ordinary lay people\",\"vi\":\"Những giáo dân bình thường\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"Holiness is not a job title. The majority were people with families, boats, fields, and markets.\",\"vi\":\"Sự thánh thiện không phải một chức danh. Đa số là những người có gia đình, có thuyền, có ruộng, có phiên chợ.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"art\",\"art\":\"asia-lanterns\",\"title\":{\"en\":\"Lanterns on the water\",\"vi\":\"Đèn lồng trên mặt nước\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"On their feast day, Vietnamese parishes around the world fill with áo dài, incense, and drums. If you are ever flying on November 24, find one. It will feel like home, because it is.\",\"vi\":\"Vào ngày lễ các ngài, các giáo xứ Việt Nam khắp thế giới rợp áo dài, hương trầm và tiếng trống. Nếu ngày 24 tháng 11 nào đó bạn đang bay, hãy tìm một giáo xứ như thế. Bạn sẽ thấy như ở nhà — vì đúng là nhà.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"What does it mean that ordinary people can be saints?\",\"vi\":\"Việc những người bình thường có thể nên thánh nói với bạn điều gì?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[2473],\"note\":{\"en\":\"On martyrdom as witness.\",\"vi\":\"Về tử đạo là chứng tá.\",\"viStatus\":\"unverified\"}}},{\"id\":\"asia-2\",\"title\":{\"en\":\"The Lady of La Vang\",\"vi\":\"Đức Mẹ La Vang\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"visitation\",\"line\":{\"en\":\"1798. A forest in central Việt Nam, families hiding from persecution — and a visitor in the leaves.\",\"vi\":\"Năm 1798. Một khu rừng ở miền Trung Việt Nam, những gia đình trốn cơn bách hại — và một vị khách giữa tán lá.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"lake-evening\",\"text\":{\"en\":\"Catholic families fled into the deep forest of La Vang to escape persecution. They were sick, hungry, and afraid. At night they gathered under a great tree to pray the rosary — the only thing they had carried with them.\",\"vi\":\"Các gia đình Công giáo trốn vào rừng sâu La Vang để tránh cơn bách hại. Họ bệnh tật, đói khát và sợ hãi. Đêm đêm họ tụ dưới một tán cây lớn để lần chuỗi Mân Côi — điều duy nhất họ kịp mang theo.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"visitation\",\"text\":{\"en\":\"There, the story tells, a Lady appeared in the branches, radiant, holding a child, with words of comfort: she had heard their prayers; she taught them to boil the leaves around them for medicine; she promised her protection in that place.\",\"vi\":\"Tại đó, câu chuyện kể, một Bà đẹp rạng ngời hiện ra giữa tán cây, tay bồng một hài nhi, với những lời an ủi: Bà đã nghe lời họ khẩn cầu; Bà chỉ cho họ nấu lá cây quanh đó làm thuốc; Bà hứa chở che họ ở chốn ấy.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"cathedral-hanoi\",\"text\":{\"en\":\"La Vang became Việt Nam’s great shrine of Mary. Millions make pilgrimage there. Notice the pattern of the story: she came not to the comfortable, but to the hunted, and she came while they prayed the prayer you now know how to pray.\",\"vi\":\"La Vang trở thành trung tâm hành hương Đức Mẹ lớn nhất của Việt Nam. Hàng triệu người tuôn về đó. Hãy để ý nét đẹp của câu chuyện: Mẹ không đến với người an nhàn, mà đến với những người bị săn đuổi — và Mẹ đến đang lúc họ đọc lời kinh mà giờ đây bạn đã biết nguyện.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":1,\"prompt\":{\"en\":\"What were the families doing when the Lady came?\",\"vi\":\"Các gia đình đang làm gì khi Đức Bà hiện đến?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Praying the rosary together\",\"vi\":\"Cùng nhau lần chuỗi Mân Côi\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Building a church\",\"vi\":\"Xây một nhà thờ\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"The rosary in your bag is the same prayer that filled that forest. It has been Việt Nam’s prayer in the dark for centuries.\",\"vi\":\"Chuỗi Mân Côi trong túi bạn chính là lời kinh đã vang trong khu rừng ấy. Bao thế kỷ qua, đó là lời kinh của Việt Nam trong đêm tối.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"practice\",\"title\":{\"en\":\"One Hail Mary for Việt Nam\",\"vi\":\"Một Kinh Kính Mừng cho Việt Nam\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"Tonight, pray one Hail Mary for your homeland and your family — the prayer of La Vang, prayed by a daughter of Việt Nam. Đức Mẹ La Vang, cầu cho chúng con.\",\"vi\":\"Tối nay, hãy đọc một Kinh Kính Mừng cho quê hương và gia đình bạn — lời kinh của La Vang, được một người con gái Việt Nam dâng lên. Đức Mẹ La Vang, cầu cho chúng con.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Where would you want her to find you?\",\"vi\":\"Bạn muốn Mẹ tìm thấy bạn ở nơi nào?\",\"viStatus\":\"unverified\"}},{\"id\":\"asia-3\",\"title\":{\"en\":\"A Mother Among the Martyrs\",\"vi\":\"Một người mẹ giữa các thánh tử đạo\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"asia-lanterns\",\"line\":{\"en\":\"Anê Lê Thị Thành: grandmother, mother of six, and the first Vietnamese woman named a saint.\",\"vi\":\"Anê Lê Thị Thành: một người bà, người mẹ của sáu đứa con, và người phụ nữ Việt Nam đầu tiên được tuyên thánh.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"incense-altar\",\"text\":{\"en\":\"She was no missionary and no nun — a farmer’s wife from Phát Diệm, known for raising her children well and for hiding hunted priests in her home. In 1841, at around sixty years old, she was arrested for it.\",\"vi\":\"Bà không phải nhà truyền giáo, cũng không phải nữ tu — chỉ là vợ một nông dân ở Phát Diệm, nổi tiếng vì nuôi dạy con cái tốt và vì giấu các linh mục bị truy lùng trong nhà mình. Năm 1841, khi đã khoảng sáu mươi tuổi, bà bị bắt vì điều đó.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"martyrs-palm\",\"text\":{\"en\":\"In prison she was beaten until her clothes were soaked with blood. When her daughter visited and wept at the sight, her mother smiled and said words Việt Nam has never forgotten: “Don’t cry, child. I am wearing the roses the Lord has sent me.”\",\"vi\":\"Trong ngục, bà bị đánh đến áo đẫm máu. Khi con gái vào thăm và bật khóc, người mẹ mỉm cười nói những lời mà Việt Nam không bao giờ quên: “Con đừng khóc. Mẹ đang mặc áo hoa hồng Chúa gửi cho mẹ đấy.”\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"heaven-light\",\"text\":{\"en\":\"She died in prison in 1844, still praying. Her path to holiness was cooking, raising children, opening her door — and one final act of courage. Holiness, it turns out, can look exactly like a Vietnamese mother.\",\"vi\":\"Bà qua đời trong ngục năm 1844, miệng vẫn còn cầu nguyện. Con đường nên thánh của bà là nấu ăn, nuôi con, mở cửa nhà mình — và một hành vi can đảm sau cùng. Hóa ra, sự thánh thiện có thể mang đúng dáng hình một người mẹ Việt Nam.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":1,\"prompt\":{\"en\":\"What did she call the blood on her clothes?\",\"vi\":\"Bà gọi những vết máu trên áo mình là gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Roses the Lord had sent her\",\"vi\":\"Áo hoa hồng Chúa gửi cho bà\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"A debt to be repaid\",\"vi\":\"Một món nợ phải đòi\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"A mother comforting her child, even from inside her own suffering. That is the fourth commandment and the eighth beatitude in one sentence.\",\"vi\":\"Một người mẹ an ủi con mình, ngay từ trong chính nỗi đau của bà. Đó là điều răn thứ tư và mối phúc thứ tám trong cùng một câu nói.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"practice\",\"title\":{\"en\":\"A name for the journey\",\"vi\":\"Một cái tên cho hành trình\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"If you are still wondering about a confirmation name — here is a Vietnamese mother, a saint of the ordinary, who hid the hunted and comforted her daughter from a prison floor. Anê. It would suit a brave traveler.\",\"vi\":\"Nếu bạn vẫn đang phân vân về tên thánh Thêm sức — đây là một người mẹ Việt Nam, vị thánh của đời thường, người đã che giấu kẻ bị săn đuổi và an ủi con gái mình từ nền nhà ngục. Anê. Cái tên ấy rất hợp với một lữ khách can đảm.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Who is the holiest ordinary person you know?\",\"vi\":\"Người bình thường thánh thiện nhất bạn biết là ai?\",\"viStatus\":\"unverified\"}}]},\"lesson\":\"$5:props:world:lessons:2\"}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#1C2647\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"The Pilgrimage\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A quiet road through places you have stood.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/my-first-project/pilgrimage/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
