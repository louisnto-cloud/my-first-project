 con phố ồn ào bên ngoài.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"cathedral-door\",\"text\":{\"en\":\"People built this place for someone. For more than a hundred years, they have come through these doors to meet him.\",\"vi\":\"Người ta xây nơi này cho một Đấng. Hơn một trăm năm qua, họ bước qua những cánh cửa này để gặp Ngài.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"creation-light\",\"text\":{\"en\":\"Catholics call him God. Not a force. Not an idea. Someone — who knows you, and made you, and wanted you to exist.\",\"vi\":\"Người Công giáo gọi Đấng ấy là Thiên Chúa. Không phải một sức mạnh vô hình. Không phải một ý niệm. Mà là một Đấng — biết bạn, dựng nên bạn, và muốn bạn hiện hữu.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"creation-light\",\"text\":{\"en\":\"The Bible says it in three small words.\",\"vi\":\"Kinh Thánh nói điều ấy trong mấy chữ thật ngắn.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"1 John 4:8\",\"verse\":{\"en\":\"God is love.\",\"vi\":\"Thiên Chúa là tình yêu.\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"Everything else the Church teaches begins here. Before anything existed, there was love. God does not just have love — he is love.\",\"vi\":\"Mọi điều Giáo hội dạy đều bắt đầu từ đây. Trước khi có bất cứ điều gì, đã có tình yêu. Thiên Chúa không chỉ có tình yêu — Ngài chính là tình yêu.\",\"viStatus\":\"unverified\"},\"bridge\":{\"en\":\"The peace you felt inside the churches you visited — that was not the stone. It was the one the stone was built for.\",\"vi\":\"Sự bình an bạn cảm nhận trong những ngôi nhà thờ bạn đã ghé thăm — không phải từ đá. Mà từ Đấng mà những viên đá ấy được xây nên cho Ngài.\",\"viStatus\":\"unverified\"}}},{\"id\":\"c5\",\"art\":\"cathedral-door\",\"text\":{\"en\":\"Jesus gave God another name. He said: call him Father.\",\"vi\":\"Chúa Giêsu cho chúng ta một tên gọi khác của Thiên Chúa. Ngài nói: hãy gọi Ngài là Cha.\",\"viStatus\":\"unverified\"},\"branch\":{\"prompt\":{\"en\":\"If you could ask one thing at this door, what would it be?\",\"vi\":\"Nếu được hỏi một điều nơi cánh cửa này, bạn sẽ hỏi gì?\",\"viStatus\":\"unverified\"},\"choices\":[{\"label\":{\"en\":\"“Are you really there?”\",\"vi\":\"“Ngài có thật không?”\",\"viStatus\":\"unverified\"},\"response\":{\"en\":\"An honest question. The whole road ahead is the answer, walked one step at a time. You are allowed to ask it the entire way.\",\"vi\":\"Một câu hỏi chân thành. Cả con đường phía trước là câu trả lời, đi từng bước một. Bạn được phép hỏi câu ấy suốt cả hành trình.\",\"viStatus\":\"unverified\"}},{\"label\":{\"en\":\"“Do you know my family?”\",\"vi\":\"“Ngài có biết gia đình con không?”\",\"viStatus\":\"unverified\"},\"response\":{\"en\":\"He does. Every name you pray for when you ask for their safety — he hears each one.\",\"vi\":\"Ngài biết. Mỗi cái tên bạn nhắc đến khi cầu mong bình an cho họ — Ngài nghe từng tên một.\",\"viStatus\":\"unverified\"}},{\"label\":{\"en\":\"“Why am I here?”\",\"vi\":\"“Sao con lại ở đây?”\",\"viStatus\":\"unverified\"},\"response\":{\"en\":\"Maybe the same reason the doors are open. Some invitations are quiet.\",\"vi\":\"Có lẽ cùng một lý do khiến những cánh cửa kia rộng mở. Có những lời mời rất thầm lặng.\",\"viStatus\":\"unverified\"}}]}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":3,\"prompt\":{\"en\":\"What do Catholics believe God is, before anything else?\",\"vi\":\"Trước hết, người Công giáo tin Thiên Chúa là gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"A set of rules\",\"vi\":\"Một bộ luật lệ\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Love itself\",\"vi\":\"Chính là tình yêu\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"A distant force\",\"vi\":\"Một sức mạnh xa vời\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"“God is love” — the rest of the faith grows out of this one line.\",\"vi\":\"“Thiên Chúa là tình yêu” — mọi điều khác của đức tin lớn lên từ câu này.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"choice\",\"prompt\":{\"en\":\"What name did Jesus tell us to use for God?\",\"vi\":\"Chúa Giêsu dạy chúng ta gọi Thiên Chúa bằng tên nào?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Master\",\"vi\":\"Chủ nhân\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Judge\",\"vi\":\"Quan tòa\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Father\",\"vi\":\"Cha\",\"viStatus\":\"unverified\"}}],\"answer\":2,\"why\":{\"en\":\"Father. Not a far-away king — family.\",\"vi\":\"Cha. Không phải một vị vua xa cách — mà là người nhà.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"prayer\",\"prayerId\":\"sign-of-the-cross\",\"note\":{\"en\":\"Your first prayer. Touch your forehead, your heart, your left shoulder, your right. You are tracing a cross over yourself — a quiet way of saying: I am here, with him.\",\"vi\":\"Lời kinh đầu tiên của bạn. Chạm trán, chạm ngực, vai trái, rồi vai phải. Bạn đang vẽ một Thánh giá trên chính mình — một cách thầm lặng để nói: con đang ở đây, với Ngài.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"What stayed with you today?\",\"vi\":\"Điều gì còn đọng lại trong bạn hôm nay?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[218,221,239],\"note\":{\"en\":\"On God as love and as Father.\",\"vi\":\"Về Thiên Chúa là tình yêu và là Cha.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hanoi-2\",\"title\":{\"en\":\"In the Beginning\",\"vi\":\"Lúc khởi đầu\",\"viStatus\":\"unverified\"},\"minutes\":5,\"door\":{\"art\":\"creation-light\",\"line\":{\"en\":\"Before the city, before the sea, before light itself. The very first story.\",\"vi\":\"Trước thành phố, trước biển khơi, trước cả ánh sáng. Câu chuyện đầu tiên của muôn loài.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"creation-light\",\"text\":{\"en\":\"The Bible opens with darkness. No stars, no sky, no sound. And then a voice.\",\"vi\":\"Kinh Thánh mở đầu bằng bóng tối. Không sao trời, không bầu trời, không một âm thanh. Rồi một tiếng nói vang lên.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"Genesis 1:1–3\",\"verse\":{\"en\":\"In the beginning, God made the heavens and the earth. God said, “Let there be light” — and there was light.\",\"vi\":\"Lúc khởi đầu, Thiên Chúa dựng nên trời và đất. Thiên Chúa phán: “Phải có ánh sáng” — và liền có ánh sáng.\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"Everything that exists began as a gift. God did not need the world. He wanted it.\",\"vi\":\"Mọi sự hiện hữu đều khởi đầu như một món quà. Thiên Chúa không cần thế giới này. Ngài muốn nó.\",\"viStatus\":\"unverified\"},\"original\":\"In the beginning God created heaven, and earth. … And God said: Be light made. And light was made. (Douay–Rheims)\"}},{\"id\":\"c2\",\"art\":\"creation-world\",\"text\":{\"en\":\"Day by day, the story unfolds like a song. Sky and sea. Land and green things growing. Sun, moon, and a sky full of stars.\",\"vi\":\"Ngày qua ngày, câu chuyện mở ra như một bài ca. Bầu trời và biển cả. Đất liền và cây cỏ xanh tươi. Mặt trời, mặt trăng, và một bầu trời đầy sao.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"creation-world\",\"text\":{\"en\":\"Then fish for the seas, birds for the air, animals for the land. And after each day, God looks at what he has made and says the same thing: it is good.\",\"vi\":\"Rồi cá cho biển, chim cho trời, muông thú cho mặt đất. Sau mỗi ngày, Thiên Chúa nhìn những gì Ngài đã dựng nên và nói cùng một điều: thật là tốt đẹp.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"sky-flight\",\"text\":{\"en\":\"You have seen the earth the way few people ever see it — from above, with the clouds below you like a white sea. The story says all of it was spoken into being, with care.\",\"vi\":\"Bạn đã thấy trái đất theo cách ít ai từng thấy — từ trên cao, với mây trắng trải dưới chân như một biển bông. Câu chuyện kể rằng tất cả được tạo thành bằng lời phán, với tình thương.\",\"viStatus\":\"unverified\"}},{\"id\":\"c5\",\"art\":\"creation-people\",\"text\":{\"en\":\"And last of all, God makes people. Not as servants. As his own image in the world. We will open that part of the story tomorrow.\",\"vi\":\"Và sau cùng, Thiên Chúa dựng nên con người. Không phải làm tôi tớ. Mà là hình ảnh của chính Ngài giữa trần gian. Ngày mai chúng ta sẽ mở phần ấy của câu chuyện.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"order\",\"afterCard\":2,\"prompt\":{\"en\":\"Put the days of creation in order.\",\"vi\":\"Sắp xếp các ngày tạo dựng theo thứ tự.\",\"viStatus\":\"unverified\"},\"items\":[{\"en\":\"Light\",\"vi\":\"Ánh sáng\",\"viStatus\":\"unverified\"},{\"en\":\"Sky and sea\",\"vi\":\"Bầu trời và biển\",\"viStatus\":\"unverified\"},{\"en\":\"Land and plants\",\"vi\":\"Đất liền và cây cỏ\",\"viStatus\":\"unverified\"},{\"en\":\"Sun, moon, and stars\",\"vi\":\"Mặt trời, mặt trăng và các vì sao\",\"viStatus\":\"unverified\"},{\"en\":\"Fish, birds, and animals\",\"vi\":\"Cá, chim và muông thú\",\"viStatus\":\"unverified\"}],\"why\":{\"en\":\"The story builds like a home being prepared — light first, then rooms, then the ones who will live in it.\",\"vi\":\"Câu chuyện được dựng như một ngôi nhà đang được chuẩn bị — ánh sáng trước, rồi các gian phòng, rồi những ai sẽ sống trong đó.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"choice\",\"prompt\":{\"en\":\"After each day of creating, what does God say?\",\"vi\":\"Sau mỗi ngày tạo dựng, Thiên Chúa nói gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"“It is good.”\",\"vi\":\"“Thật là tốt đẹp.”\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"“It is finished.”\",\"vi\":\"“Thế là xong.”\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"“It needs more work.”\",\"vi\":\"“Vẫn còn dang dở.”\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"Goodness is the world’s first review. The world is not an accident — it is a gift, and gifts are given with love.\",\"vi\":\"Lời khen đầu tiên của thế giới là “tốt đẹp”. Thế giới không phải ngẫu nhiên — mà là một món quà, và quà thì được trao bằng tình thương.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"art\",\"art\":\"creation-light\",\"title\":{\"en\":\"Let there be light\",\"vi\":\"Phải có ánh sáng\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"For centuries, artists have painted this moment as gold breaking into deep blue — the same colors of a cathedral at evening when the candles are lit.\",\"vi\":\"Suốt nhiều thế kỷ, các nghệ sĩ vẽ khoảnh khắc này như ánh vàng bừng lên giữa nền xanh thẳm — cũng là màu của một nhà thờ lúc chiều tối khi nến được thắp lên.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Where have you seen the world look like a gift?\",\"vi\":\"Bạn đã thấy thế giới giống một món quà ở nơi nào?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[290,299],\"note\":{\"en\":\"On creation as good and as gift.\",\"vi\":\"Về việc tạo dựng là tốt đẹp và là quà tặng.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hanoi-3\",\"title\":{\"en\":\"Made for Love\",\"vi\":\"Được dựng nên cho tình yêu\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"creation-people\",\"line\":{\"en\":\"The last thing made, and the most loved.\",\"vi\":\"Điều được dựng nên sau cùng, và được yêu thương nhất.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"creation-people\",\"text\":{\"en\":\"On the last day of the story, God makes something different. Not spoken from far away — shaped close, with care.\",\"vi\":\"Vào ngày cuối của câu chuyện, Thiên Chúa làm nên một điều khác biệt. Không phán từ xa — mà nắn nót thật gần, với tất cả ân cần.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"Genesis 1:27\",\"verse\":{\"en\":\"God created humanity in his own image. In the image of God he created them.\",\"vi\":\"Thiên Chúa dựng nên con người theo hình ảnh Ngài. Theo hình ảnh Thiên Chúa, Ngài đã dựng nên họ.\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"Every person carries a family resemblance to God. That is why every person matters — including you, exactly as you are.\",\"vi\":\"Mỗi con người đều mang nét giống với Thiên Chúa, như con giống cha mẹ. Vì thế mỗi người đều quý giá — kể cả bạn, đúng như bạn là.\",\"viStatus\":\"unverified\"},\"bridge\":{\"en\":\"In Việt Nam we say con nhà tông không giống lông cũng giống cánh — a child of the family always carries its likeness. The Bible says the whole human family carries God’s.\",\"vi\":\"Người Việt có câu: con nhà tông không giống lông cũng giống cánh. Kinh Thánh nói cả gia đình nhân loại mang nét giống của Thiên Chúa.\",\"viStatus\":\"unverified\"}}},{\"id\":\"c2\",\"art\":\"creation-people\",\"text\":{\"en\":\"Made in his image means: able to love, able to choose, able to know truth and make beauty. A mirror, small but real, of the one who is love.\",\"vi\":\"Mang hình ảnh Ngài nghĩa là: biết yêu thương, biết tự do chọn lựa, biết nhận ra sự thật và tạo nên cái đẹp. Một tấm gương nhỏ bé nhưng có thật, phản chiếu Đấng là tình yêu.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"candle-single\",\"text\":{\"en\":\"This is why no person is ever worthless to God. Not the stranger in seat 47C. Not the difficult passenger. Not you on your worst day.\",\"vi\":\"Vì thế không một ai là vô giá trị trước mặt Thiên Chúa. Không phải người lạ ở ghế 47C. Không phải hành khách khó tính. Không phải bạn trong ngày tồi tệ nhất của mình.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"cathedral-hanoi\",\"text\":{\"en\":\"The woman you saw crying at Mass — she was not crying because she was worthless. Perhaps she had just remembered that she was not.\",\"vi\":\"Người phụ nữ bạn thấy khóc trong Thánh lễ — chị ấy không khóc vì thấy mình vô giá trị. Có lẽ chị vừa chợt nhớ ra điều ngược lại.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":1,\"prompt\":{\"en\":\"What does “made in God’s image” mean?\",\"vi\":\"“Được dựng nên theo hình ảnh Thiên Chúa” nghĩa là gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"People look like God physically\",\"vi\":\"Con người trông giống Thiên Chúa về ngoại hình\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"People can love, choose, and know truth, like him\",\"vi\":\"Con người biết yêu thương, chọn lựa và nhận ra sự thật, giống như Ngài\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Only very good people are God’s image\",\"vi\":\"Chỉ người thật tốt mới là hình ảnh của Chúa\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"The likeness is in the heart, not the face — and every person carries it, always.\",\"vi\":\"Nét giống ấy ở trong tâm hồn, không phải gương mặt — và mỗi người đều mang nó, mãi mãi.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"fill\",\"prompt\":{\"en\":\"Complete your first prayer.\",\"vi\":\"Hoàn thành lời kinh đầu tiên của bạn.\",\"viStatus\":\"unverified\"},\"before\":{\"en\":\"In the name of the Father, and of the Son,\",\"vi\":\"Nhân danh Cha, và Con,\",\"viStatus\":\"unverified\"},\"after\":{\"en\":\"Amen.\",\"vi\":\"Amen.\",\"viStatus\":\"unverified\"},\"options\":[{\"en\":\"and of the Holy Spirit.\",\"vi\":\"và Thánh Thần.\",\"viStatus\":\"unverified\"},{\"en\":\"and of the angels.\",\"vi\":\"và các thiên thần.\",\"viStatus\":\"unverified\"},{\"en\":\"and of the Church.\",\"vi\":\"và Giáo hội.\",\"viStatus\":\"unverified\"}],\"answer\":0,\"why\":{\"en\":\"Father, Son, and Holy Spirit — one God, a family of love. The little prayer holds the whole mystery.\",\"vi\":\"Cha, Con và Thánh Thần — một Thiên Chúa, một gia đình tình yêu. Lời kinh nhỏ bé chứa cả mầu nhiệm lớn lao.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"practice\",\"title\":{\"en\":\"A practice for this week\",\"vi\":\"Một bài thực hành cho tuần này\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"Once this week, look at one stranger — on a train, on a flight, in a queue — and silently think: you are made in the image of God. Watch what it changes in you.\",\"vi\":\"Một lần trong tuần này, hãy nhìn một người xa lạ — trên tàu, trên chuyến bay, trong hàng chờ — và thầm nghĩ: bạn được dựng nên theo hình ảnh Thiên Chúa. Hãy xem điều đó thay đổi gì trong chính bạn.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Who came to mind today?\",\"vi\":\"Hôm nay bạn chợt nghĩ đến ai?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[355,357],\"note\":{\"en\":\"On the dignity of being made in God’s image.\",\"vi\":\"Về phẩm giá của con người mang hình ảnh Thiên Chúa.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hanoi-4\",\"title\":{\"en\":\"You Already Pray\",\"vi\":\"Bạn vẫn luôn cầu nguyện\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"prayer-night\",\"line\":{\"en\":\"A quiet hotel room, far from home. A thought rises for the people you love.\",\"vi\":\"Một căn phòng khách sạn yên tĩnh, xa nhà. Một ý nghĩ dâng lên, hướng về những người bạn thương.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"prayer-night\",\"text\":{\"en\":\"Your mother taught you something true: pray for the health and safety of the people you love. Never for money. Just for them.\",\"vi\":\"Mẹ bạn đã dạy một điều rất thật: hãy cầu cho những người mình thương được mạnh khỏe, bình an. Đừng cầu tiền bạc. Chỉ cầu cho họ.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"prayer-night\",\"text\":{\"en\":\"Here is something you should know: that is real {{prayer}}. Not practice for prayer. Not almost-prayer. The real thing.\",\"vi\":\"Đây là điều bạn nên biết: đó chính là {{prayer}} thật. Không phải tập dượt. Không phải gần giống. Mà là cầu nguyện thật sự.\",\"viStatus\":\"unverified\"},\"terms\":[\"prayer\"]},{\"id\":\"c3\",\"art\":\"teacher-hill\",\"text\":{\"en\":\"The Church says prayer is simply lifting the heart to God. A long ceremony can be prayer. So can three words whispered over the ocean at 3 a.m.\",\"vi\":\"Giáo hội nói cầu nguyện đơn giản là nâng tâm hồn lên cùng Thiên Chúa. Một nghi lễ dài có thể là cầu nguyện. Ba lời thì thầm trên đại dương lúc 3 giờ sáng cũng vậy.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"teacher-hill\",\"text\":{\"en\":\"Jesus promised that this kind of asking is never wasted.\",\"vi\":\"Chúa Giêsu hứa rằng lời cầu xin như thế không bao giờ vô ích.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"Matthew 7:7\",\"verse\":{\"en\":\"Ask, and it will be given to you. Seek, and you will find. Knock, and the door will be opened.\",\"vi\":\"Hãy xin thì sẽ được. Hãy tìm thì sẽ thấy. Hãy gõ cửa thì cửa sẽ mở cho.\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"God is not annoyed by your asking. He is a Father — he wants to be asked, the way parents want to hear from their children.\",\"vi\":\"Thiên Chúa không phiền lòng khi bạn cầu xin. Ngài là Cha — Ngài muốn được nghe con cái xin, như cha mẹ mong nghe tiếng con mình.\",\"viStatus\":\"unverified\"},\"bridge\":{\"en\":\"You knock on a door that is already being held open from the inside.\",\"vi\":\"Bạn gõ một cánh cửa vốn đã được giữ mở sẵn từ bên trong.\",\"viStatus\":\"unverified\"}}},{\"id\":\"c5\",\"art\":\"candle-single\",\"text\":{\"en\":\"So nothing you have done needs to be thrown away. From here, the road only adds: new words, new friends to pray with, and a clearer face for the one listening.\",\"vi\":\"Vậy nên không điều gì bạn từng làm phải bỏ đi cả. Từ đây, con đường chỉ thêm vào: những lời kinh mới, những người bạn cùng cầu nguyện, và một gương mặt rõ hơn của Đấng đang lắng nghe.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":2,\"prompt\":{\"en\":\"What is prayer, at its heart?\",\"vi\":\"Cốt lõi của cầu nguyện là gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Saying perfect words in church\",\"vi\":\"Đọc những lời thật chuẩn trong nhà thờ\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Lifting your heart to God\",\"vi\":\"Nâng tâm hồn lên cùng Thiên Chúa\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Asking for wealth and success\",\"vi\":\"Cầu xin giàu sang và thành công\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"Words help, but the heart is the prayer. Yours has been praying for years.\",\"vi\":\"Lời kinh giúp ích, nhưng tấm lòng mới là lời cầu nguyện. Lòng bạn đã cầu nguyện từ nhiều năm rồi.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"predict\",\"prompt\":{\"en\":\"A friend says: “I only ever pray for my family’s safety. Is that allowed?” What would the Church say?\",\"vi\":\"Một người bạn nói: “Tôi chỉ biết cầu cho gia đình được bình an. Vậy có được không?” Giáo hội sẽ trả lời thế nào?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"“That is real prayer. Begin there.”\",\"vi\":\"“Đó là cầu nguyện thật. Hãy bắt đầu từ đó.”\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"“No — only official prayers count.”\",\"vi\":\"“Không — chỉ kinh chính thức mới được tính.”\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"Love for others is where prayer most often begins. The official prayers are gifts added on top, not gates in front.\",\"vi\":\"Tình thương dành cho người khác thường là nơi cầu nguyện bắt đầu. Các kinh nguyện là quà tặng thêm vào, không phải cánh cổng chắn trước.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"practice\",\"title\":{\"en\":\"Tonight\",\"vi\":\"Tối nay\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"Pray for your loved ones exactly the way you always have. Then add one small thing at the end: the Sign of the Cross. Your old prayer and your first Catholic prayer, together.\",\"vi\":\"Hãy cầu cho những người bạn thương đúng như bạn vẫn làm. Rồi thêm một điều nhỏ ở cuối: Dấu Thánh Giá. Lời cầu quen thuộc của bạn và lời kinh Công giáo đầu tiên, cùng nhau.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Who do you always pray for?\",\"vi\":\"Bạn vẫn luôn cầu nguyện cho ai?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[2559,2560],\"note\":{\"en\":\"On what prayer is.\",\"vi\":\"Về cầu nguyện là gì.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hanoi-5\",\"title\":{\"en\":\"The Prayer Jesus Taught\",\"vi\":\"Lời kinh Chúa Giêsu dạy\",\"viStatus\":\"unverified\"},\"minutes\":5,\"door\":{\"art\":\"teacher-hill\",\"line\":{\"en\":\"One day his friends watched Jesus praying. When he finished, they asked him for something.\",\"vi\":\"Một ngày kia, các bạn hữu thấy Chúa Giêsu cầu nguyện. Khi Ngài xong, họ xin Ngài một điều.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"teacher-hill\",\"text\":{\"en\":\"“Lord, teach us to pray.” They had watched him slip away to quiet places, and come back changed. They wanted what he had.\",\"vi\":\"“Thưa Thầy, xin dạy chúng con cầu nguyện.” Họ từng thấy Ngài lánh vào nơi thanh vắng, rồi trở lại như được đổi mới. Họ muốn điều Ngài đang có.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"teacher-hill\",\"text\":{\"en\":\"He did not give them a long ceremony. He gave them a few lines, short enough to carry anywhere. It begins: Our Father.\",\"vi\":\"Ngài không trao cho họ một nghi lễ dài. Ngài trao vài dòng ngắn, đủ gọn để mang theo bất cứ đâu. Kinh ấy mở đầu: Lạy Cha chúng con.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"creation-light\",\"text\":{\"en\":\"“Our Father, who art in heaven, hallowed be thy name.” In plain words: Father of us all, your name is holy — may the whole world come to treasure it.\",\"vi\":\"“Lạy Cha chúng con ở trên trời, chúng con nguyện danh Cha cả sáng.” Nói đơn giản: Cha của tất cả chúng con, danh Cha là thánh — xin cho cả thế giới biết quý trọng danh ấy.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"creation-world\",\"text\":{\"en\":\"“Give us this day our daily bread.” Not riches. Just what we need for today — food, strength, enough. Your mother would recognize this prayer.\",\"vi\":\"“Xin Cha cho chúng con hôm nay lương thực hằng ngày.” Không phải giàu sang. Chỉ là điều cần cho hôm nay — cơm ăn, sức khỏe, vừa đủ. Mẹ bạn hẳn sẽ nhận ra lời cầu này.\",\"viStatus\":\"unverified\"}},{\"id\":\"c5\",\"art\":\"cross-dawn\",\"text\":{\"en\":\"“Forgive us, as we forgive others.” The hardest line, and the most freeing. We ask for mercy and pass mercy on, like a light handed from candle to candle.\",\"vi\":\"“Xin tha nợ chúng con, như chúng con cũng tha kẻ có nợ chúng con.” Dòng khó nhất, và cũng giải thoát nhất. Ta xin lòng thương xót và trao tiếp lòng thương xót, như ngọn lửa chuyền từ nến này sang nến khác.\",\"viStatus\":\"unverified\"}},{\"id\":\"c6\",\"art\":\"prayer-night\",\"text\":{\"en\":\"Catholics have prayed these lines every day for two thousand years, in every language on earth — including Vietnamese, in your own city, every evening.\",\"vi\":\"Người Công giáo đã đọc những dòng này mỗi ngày suốt hai ngàn năm, bằng mọi ngôn ngữ trên trái đất — kể cả tiếng Việt, trong chính thành phố của bạn, mỗi buổi chiều.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"fill\",\"afterCard\":3,\"prompt\":{\"en\":\"Complete the line.\",\"vi\":\"Hoàn thành câu kinh.\",\"viStatus\":\"unverified\"},\"before\":{\"en\":\"Give us this day our daily\",\"vi\":\"Xin Cha cho chúng con hôm nay\",\"viStatus\":\"unverified\"},\"after\":{\"en\":\"…\",\"vi\":\"…\",\"viStatus\":\"unverified\"},\"options\":[{\"en\":\"bread.\",\"vi\":\"lương thực hằng ngày.\",\"viStatus\":\"unverified\"},{\"en\":\"gold.\",\"vi\":\"vàng bạc.\",\"viStatus\":\"unverified\"},{\"en\":\"plans.\",\"vi\":\"kế hoạch.\",\"viStatus\":\"unverified\"}],\"answer\":0,\"why\":{\"en\":\"Daily bread — just enough for today. The prayer trusts tomorrow to the Father.\",\"vi\":\"Lương thực hằng ngày — vừa đủ cho hôm nay. Lời kinh phó thác ngày mai cho Cha.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"choice\",\"prompt\":{\"en\":\"In the Our Father, what do we ask God to forgive?\",\"vi\":\"Trong Kinh Lạy Cha, chúng ta xin Chúa tha điều gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Our trespasses — the wrongs we have done\",\"vi\":\"Nợ của chúng ta — những lỗi lầm ta đã phạm\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Our questions\",\"vi\":\"Những câu hỏi của chúng ta\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Our slowness\",\"vi\":\"Sự chậm chạp của chúng ta\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"And in the same breath we promise to forgive others. Mercy received becomes mercy given.\",\"vi\":\"Và trong cùng một hơi thở, ta hứa tha thứ cho người khác. Lòng thương xót nhận được trở thành lòng thương xót trao đi.\",\"viStatus\":\"unverified\"}},{\"id\":\"q3\",\"kind\":\"order\",\"prompt\":{\"en\":\"Put the opening of the Our Father in order.\",\"vi\":\"Sắp xếp phần mở đầu Kinh Lạy Cha theo thứ tự.\",\"viStatus\":\"unverified\"},\"items\":[{\"en\":\"Our Father, who art in heaven,\",\"vi\":\"Lạy Cha chúng con ở trên trời,\",\"viStatus\":\"unverified\"},{\"en\":\"hallowed be thy name.\",\"vi\":\"chúng con nguyện danh Cha cả sáng,\",\"viStatus\":\"unverified\"},{\"en\":\"Thy kingdom come,\",\"vi\":\"nước Cha trị đến,\",\"viStatus\":\"unverified\"},{\"en\":\"thy will be done on earth as it is in heaven.\",\"vi\":\"ý Cha thể hiện dưới đất cũng như trên trời.\",\"viStatus\":\"unverified\"}],\"why\":{\"en\":\"First we look at the Father; only then do we ask. The order itself is a small lesson.\",\"vi\":\"Trước hết ta hướng nhìn lên Cha; rồi mới cầu xin. Chính thứ tự ấy cũng là một bài học nhỏ.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"prayer\",\"prayerId\":\"our-father\",\"note\":{\"en\":\"The whole prayer now rests in your chapel. One line a day is enough — it has been memorized that way for twenty centuries.\",\"vi\":\"Trọn lời kinh giờ đây được giữ trong nhà nguyện của bạn. Mỗi ngày một câu là đủ — hai mươi thế kỷ qua người ta vẫn thuộc kinh theo cách ấy.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Which line of the Our Father feels most like yours?\",\"vi\":\"Câu nào trong Kinh Lạy Cha nghe giống lời của chính bạn nhất?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[2759,2761],\"note\":{\"en\":\"The Our Father as the summary of the whole Gospel.\",\"vi\":\"Kinh Lạy Cha là bản tóm lược của cả Tin Mừng.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hanoi-6\",\"title\":{\"en\":\"The Family Altar\",\"vi\":\"Bàn thờ gia đình\",\"viStatus\":\"unverified\"},\"minutes\":5,\"door\":{\"art\":\"incense-altar\",\"line\":{\"en\":\"A small shrine at home. Photographs, fruit, and the smell of incense. You know this room.\",\"vi\":\"Một bàn thờ nhỏ trong nhà. Di ảnh, hoa quả, và mùi hương trầm. Bạn biết rõ căn phòng này.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"incense-altar\",\"text\":{\"en\":\"In your family’s home there is a shrine. Incense is lit. The dead are remembered with love and respect. You grew up inside this.\",\"vi\":\"Trong nhà của gia đình bạn có một bàn thờ. Hương được thắp lên. Người đã khuất được tưởng nhớ bằng tình thương và lòng kính trọng. Bạn lớn lên giữa những điều ấy.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"incense-altar\",\"text\":{\"en\":\"Here is something that may surprise you: this instinct has a home in the Catholic Church too.\",\"vi\":\"Có một điều có thể khiến bạn ngạc nhiên: tấm lòng ấy cũng có một mái nhà trong Giáo hội Công giáo.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"candle-single\",\"text\":{\"en\":\"Catholics also remember and honor their beloved dead. We pray for them. We light candles for them. We believe death does not cut the thread of the family.\",\"vi\":\"Người Công giáo cũng tưởng nhớ và tôn kính người thân đã khuất. Chúng ta cầu nguyện cho họ. Thắp nến cho họ. Chúng ta tin sự chết không cắt đứt sợi dây gia đình.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"incense-altar\",\"text\":{\"en\":\"The Church calls this the {{communion-of-saints}}: one family — the living on earth, and those who live with God — still connected, still caring for one another.\",\"vi\":\"Giáo hội gọi điều này là {{communion-of-saints}}: một gia đình — người đang sống ở trần gian, và những người đang sống với Thiên Chúa — vẫn liên kết, vẫn yêu thương nhau.\",\"viStatus\":\"unverified\"},\"terms\":[\"communion-of-saints\"]},{\"id\":\"c5\",\"art\":\"incense-altar\",\"text\":{\"en\":\"Even the incense is at home in church. The Bible pictures prayers rising to God exactly like its smoke.\",\"vi\":\"Ngay cả hương trầm cũng quen thuộc trong nhà thờ. Kinh Thánh hình dung lời cầu nguyện bay lên tới Thiên Chúa đúng như làn khói hương.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"Revelation 8:4\",\"verse\":{\"en\":\"The smoke of the incense rose up before God, together with the prayers of his people.\",\"vi\":\"Khói hương quyện theo lời cầu nguyện của dân Chúa, bay lên trước nhan Thiên Chúa.\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"When you watched incense curl upward at the family shrine, you were looking at the Bible’s own picture of prayer.\",\"vi\":\"Khi bạn nhìn khói hương uốn mình bay lên nơi bàn thờ gia đình, bạn đang nhìn chính hình ảnh mà Kinh Thánh dùng để nói về cầu nguyện.\",\"viStatus\":\"unverified\"}}},{\"id\":\"c6\",\"art\":\"cross-dawn\",\"text\":{\"en\":\"One distinction matters, and it is a kind one. Catholics {{venerate}} the saints and the dead — deep honor, like bowing to your elders. Worship belongs to God alone. Honor for the family; worship for the Father.\",\"vi\":\"Có một phân biệt quan trọng, và rất nhân hậu. Người Công giáo {{venerate}} các thánh và người đã khuất — lòng tôn kính sâu xa, như cúi mình trước bậc trưởng thượng. Còn thờ phượng thì chỉ dành cho một mình Thiên Chúa. Tôn kính dành cho gia đình; thờ phượng dành cho Cha.\",\"viStatus\":\"unverified\"},\"terms\":[\"venerate\"]}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":3,\"prompt\":{\"en\":\"Do Catholics worship the saints and the dead?\",\"vi\":\"Người Công giáo có thờ phượng các thánh và người đã khuất không?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Yes — saints are small gods\",\"vi\":\"Có — các thánh là những vị thần nhỏ\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"No — they honor them and ask them to pray; worship is for God alone\",\"vi\":\"Không — họ tôn kính và xin các ngài cầu nguyện; thờ phượng chỉ dành cho Thiên Chúa\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"Honor and worship are different rooms. Saints are family, asked to pray for us — the way you might ask your mother to pray for you.\",\"vi\":\"Tôn kính và thờ phượng là hai điều khác nhau. Các thánh là người nhà, được xin cầu nguyện cho ta — như bạn có thể xin mẹ cầu nguyện cho mình.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"match\",\"prompt\":{\"en\":\"Match each symbol to its meaning.\",\"vi\":\"Ghép mỗi biểu tượng với ý nghĩa của nó.\",\"viStatus\":\"unverified\"},\"pairs\":[{\"symbol\":\"symbol-incense\",\"label\":{\"en\":\"Incense\",\"vi\":\"Hương\",\"viStatus\":\"unverified\"},\"meaning\":{\"en\":\"Prayers rising to God\",\"vi\":\"Lời cầu nguyện bay lên tới Thiên Chúa\",\"viStatus\":\"unverified\"}},{\"symbol\":\"symbol-light\",\"label\":{\"en\":\"Light\",\"vi\":\"Ánh sáng\",\"viStatus\":\"unverified\"},\"meaning\":{\"en\":\"Christ present in the dark\",\"vi\":\"Chúa Kitô hiện diện giữa bóng tối\",\"viStatus\":\"unverified\"}},{\"symbol\":\"symbol-water\",\"label\":{\"en\":\"Water\",\"vi\":\"Nước\",\"viStatus\":\"unverified\"},\"meaning\":{\"en\":\"Washing clean; new life\",\"vi\":\"Rửa sạch; sự sống mới\",\"viStatus\":\"unverified\"}},{\"symbol\":\"symbol-cross\",\"label\":{\"en\":\"The Cross\",\"vi\":\"Thánh giá\",\"viStatus\":\"unverified\"},\"meaning\":{\"en\":\"Love that gives everything\",\"vi\":\"Tình yêu trao hiến tất cả\",\"viStatus\":\"unverified\"}}]}],\"treasure\":{\"kind\":\"word\",\"termId\":\"communion-of-saints\",\"note\":{\"en\":\"A word for something you have always known: the family does not end at death. Your shrine at home and the candles in a cathedral are nearer to each other than you thought.\",\"vi\":\"Một từ cho điều bạn vốn đã luôn biết: gia đình không kết thúc nơi sự chết. Bàn thờ ở nhà bạn và những ngọn nến trong nhà thờ gần nhau hơn bạn tưởng.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Who would you light a candle for?\",\"vi\":\"Bạn muốn thắp một ngọn nến cho ai?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[946,957,958],\"note\":{\"en\":\"On the communion of saints and prayer for the dead.\",\"vi\":\"Về Các Thánh thông công và việc cầu nguyện cho người đã khuất.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hanoi-7\",\"title\":{\"en\":\"The Faith Comes to Việt Nam\",\"vi\":\"Đức tin đến Việt Nam\",\"viStatus\":\"unverified\"},\"minutes\":5,\"door\":{\"art\":\"martyrs-palm\",\"line\":{\"en\":\"Four hundred years ago, small boats reached the coast of Việt Nam carrying a story.\",\"vi\":\"Bốn trăm năm trước, những con thuyền nhỏ cập bờ biển Việt Nam, mang theo một câu chuyện.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"lake-evening\",\"text\":{\"en\":\"In the 1600s, missionaries came to Việt Nam with the {{gospel}}. Among them was Alexandre de Rhodes — the priest whose work helped shape chữ Quốc ngữ, the very alphabet you write with today.\",\"vi\":\"Vào thế kỷ 17, các nhà truyền giáo đến Việt Nam mang theo {{gospel}}. Trong số đó có cha Alexandre de Rhodes — vị linh mục mà công trình của ngài góp phần hình thành chữ Quốc ngữ, chính bộ chữ bạn đang viết hôm nay.\",\"viStatus\":\"unverified\"},\"terms\":[\"gospel\"]},{\"id\":\"c2\",\"art\":\"lake-evening\",\"text\":{\"en\":\"The faith took root. Villages of fishermen and farmers heard that God is a Father, that the dead are not lost, that every person is loved — and they believed.\",\"vi\":\"Đức tin bén rễ. Những làng chài, làng ruộng nghe rằng Thiên Chúa là Cha, rằng người đã khuất không hề mất đi, rằng mỗi con người đều được yêu thương — và họ đã tin.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"martyrs-palm\",\"text\":{\"en\":\"Then came the hard years. For long stretches of the 1700s and 1800s, being Catholic in Việt Nam could cost you your life. Many were asked to step on a cross to deny their faith. Many would not.\",\"vi\":\"Rồi đến những năm tháng khắc nghiệt. Trong nhiều giai đoạn của thế kỷ 18 và 19, là người Công giáo ở Việt Nam có thể phải trả giá bằng mạng sống. Nhiều người bị buộc bước qua thập giá để chối đạo. Nhiều người đã không làm.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"martyrs-palm\",\"text\":{\"en\":\"One of them was Anrê Dũng Lạc — a poor boy from the north who became a priest, was arrested for it, and gave his life in Hà Nội in 1839. Your city.\",\"vi\":\"Một trong số đó là cha Anrê Dũng Lạc — cậu bé nghèo miền Bắc trở thành linh mục, bị bắt vì điều ấy, và đã hiến mạng sống tại Hà Nội năm 1839. Chính thành phố của bạn.\",\"viStatus\":\"unverified\"}},{\"id\":\"c5\",\"art\":\"martyrs-palm\",\"text\":{\"en\":\"In 1988, the Church named 117 of these Vietnamese {{martyr}}s as saints — St. Andrew Dũng Lạc and his companions. People from your homeland now stand among the saints of the whole world.\",\"vi\":\"Năm 1988, Giáo hội tuyên phong 117 vị {{martyr}} Việt Nam lên bậc hiển thánh — Thánh Anrê Dũng Lạc và các bạn tử đạo. Những người con của quê hương bạn nay đứng giữa Các Thánh của toàn thế giới.\",\"viStatus\":\"unverified\"},\"terms\":[\"martyr\"]},{\"id\":\"c6\",\"art\":\"cathedral-hanoi\",\"text\":{\"en\":\"Today millions of Vietnamese Catholics fill churches from Hà Nội to Sài Gòn. St. Joseph’s Cathedral — your cathedral — was built in 1886 and has never stopped singing. This story is not foreign. It is yours, too, if you want it.\",\"vi\":\"Ngày nay hàng triệu người Công giáo Việt Nam quy tụ trong các nhà thờ từ Hà Nội đến Sài Gòn. Nhà thờ Lớn — nhà thờ của bạn — được xây năm 1886 và chưa bao giờ ngừng vang tiếng hát. Câu chuyện này không xa lạ. Nó cũng là của bạn, nếu bạn muốn.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":0,\"prompt\":{\"en\":\"What did Alexandre de Rhodes help shape, besides the early Church in Việt Nam?\",\"vi\":\"Ngoài Giáo hội sơ khai tại Việt Nam, cha Alexandre de Rhodes còn góp phần hình thành điều gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Chữ Quốc ngữ — the Vietnamese alphabet\",\"vi\":\"Chữ Quốc ngữ — bộ chữ tiếng Việt\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"The railway system\",\"vi\":\"Hệ thống đường sắt\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"The old citadel of Hà Nội\",\"vi\":\"Hoàng thành Thăng Long\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"Every Vietnamese word you write touches this history.\",\"vi\":\"Mỗi chữ tiếng Việt bạn viết đều chạm vào dòng lịch sử này.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"predict\",\"prompt\":{\"en\":\"Soldiers placed a cross on the ground and told the Christians: step on it and go free. What did Anrê Dũng Lạc do?\",\"vi\":\"Quan quân đặt thập giá xuống đất và bảo các tín hữu: bước qua thì được tha. Cha Anrê Dũng Lạc đã làm gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"He would not step on it, whatever it cost\",\"vi\":\"Ngài không bước qua, dù phải trả giá nào\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"He stepped on it and apologized later\",\"vi\":\"Ngài bước qua rồi xin lỗi sau\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"He knew what the cross meant: the one who had given everything for him. He would not trade that love for safety.\",\"vi\":\"Ngài biết thập giá nghĩa là gì: Đấng đã trao tất cả vì ngài. Ngài không đổi tình yêu ấy lấy sự an toàn.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"art\",\"art\":\"martyrs-palm\",\"title\":{\"en\":\"The palm of the martyrs\",\"vi\":\"Cành lá của các thánh tử đạo\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"In sacred art, a palm branch marks a martyr — a sign of victory, not defeat. The feast of the Vietnamese Martyrs is November 24. Your homeland has a day on the calendar of the whole Church.\",\"vi\":\"Trong nghệ thuật thánh, cành lá vạn tuế là dấu chỉ của một vị tử đạo — dấu của chiến thắng, không phải thất bại. Lễ Các Thánh tử đạo Việt Nam là ngày 24 tháng 11. Quê hương bạn có một ngày riêng trên lịch của toàn thể Giáo hội.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"What does it mean to you that saints came from your homeland?\",\"vi\":\"Việc quê hương bạn có các vị thánh có ý nghĩa gì với bạn?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[2473],\"note\":{\"en\":\"On martyrdom as the supreme witness to the truth.\",\"vi\":\"Về tử đạo là chứng tá cao cả nhất cho sự thật.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hanoi-vigil\",\"vigil\":true,\"title\":{\"en\":\"Vigil: Evening at the Great Cathedral\",\"vi\":\"Canh thức: Chiều tối nơi Nhà thờ Lớn\",\"viStatus\":\"unverified\"},\"minutes\":6,\"door\":{\"art\":\"lake-evening\",\"line\":{\"en\":\"No questions tonight. Only the story, the lights on the lake, and the bells.\",\"vi\":\"Tối nay không có câu hỏi. Chỉ có câu chuyện, ánh đèn trên mặt hồ, và tiếng chuông.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"lake-evening\",\"text\":{\"en\":\"Walk with me once more through Hà Nội at dusk. Past the lake, where the lamps are coming on one by one, like candles.\",\"vi\":\"Hãy cùng đi một lần nữa qua Hà Nội lúc chạng vạng. Ngang mặt hồ, nơi những ngọn đèn đang sáng lên từng chiếc một, như những ngọn nến.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"cathedral-hanoi\",\"text\":{\"en\":\"The cathedral rises out of the evening like a ship. Inside, someone is practicing the organ. The sound spills out onto the square.\",\"vi\":\"Nhà thờ Lớn vươn lên giữa buổi chiều như một con tàu. Bên trong, ai đó đang tập đàn organ. Tiếng đàn tràn ra quảng trường.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"creation-light\",\"text\":{\"en\":\"You have learned the beginning of everything: a God who is love, who spoke light into darkness, and called the world good.\",\"vi\":\"Bạn đã học về khởi đầu của muôn loài: một Thiên Chúa là tình yêu, Đấng phán ánh sáng vào bóng tối, và gọi thế giới là tốt đẹp.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"creation-people\",\"text\":{\"en\":\"You have learned what you are: his image. Not a servant, not an accident. A daughter.\",\"vi\":\"Bạn đã học mình là gì: hình ảnh của Ngài. Không phải tôi tớ, không phải tình cờ. Mà là một người con.\",\"viStatus\":\"unverified\"}},{\"id\":\"c5\",\"art\":\"prayer-night\",\"text\":{\"en\":\"You have learned that your prayers were always real, and you have been given the prayer Jesus taught, and the small cross traced over your heart.\",\"vi\":\"Bạn đã biết những lời cầu của mình vẫn luôn là thật, và bạn đã được trao lời kinh Chúa Giêsu dạy, cùng dấu Thánh giá nhỏ vẽ trên trái tim mình.\",\"viStatus\":\"unverified\"}},{\"id\":\"c6\",\"art\":\"incense-altar\",\"text\":{\"en\":\"You have learned that the incense of your childhood rises in churches too, and that the family — living and dead — is held in one communion.\",\"vi\":\"Bạn đã biết làn hương của tuổi thơ mình cũng bay lên trong các nhà thờ, và rằng gia đình — người sống lẫn người đã khuất — được giữ trong cùng một mối hiệp thông.\",\"viStatus\":\"unverified\"}},{\"id\":\"c7\",\"art\":\"martyrs-palm\",\"text\":{\"en\":\"And you have met the saints of your own soil, who loved this story enough to die rather than let it go.\",\"vi\":\"Và bạn đã gặp các vị thánh của chính quê hương mình, những người yêu câu chuyện này đến mức thà chết chứ không buông bỏ.\",\"viStatus\":\"unverified\"}},{\"id\":\"c8\",\"art\":\"cathedral-hanoi\",\"text\":{\"en\":\"The first page of your passport is ready for its stamp. The road now turns west — toward a small basilica in Bruges, and the story of a man named Jesus.\",\"vi\":\"Trang đầu tiên trong hộ chiếu của bạn đã sẵn sàng để đóng dấu. Con đường giờ rẽ về hướng tây — đến một vương cung thánh đường nhỏ ở Bruges, và câu chuyện về một người tên là Giêsu.\",\"viStatus\":\"unverified\"}}],\"questions\":[],\"treasure\":{\"kind\":\"art\",\"art\":\"cathedral-hanoi\",\"title\":{\"en\":\"Your first church\",\"vi\":\"Ngôi nhà thờ đầu tiên của bạn\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"Built in 1886, modeled on Notre-Dame de Paris — the church you will reach later on this same road. Hà Nội and Paris have always been looking at each other.\",\"vi\":\"Xây năm 1886, phỏng theo Nhà thờ Đức Bà Paris — ngôi nhà thờ bạn sẽ đến sau này trên chính con đường ấy. Hà Nội và Paris vẫn luôn nhìn về nhau.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Looking back on this first stretch of road — what surprised you?\",\"vi\":\"Nhìn lại đoạn đường đầu tiên này — điều gì khiến bạn ngạc nhiên?\",\"viStatus\":\"unverified\"}}]},\"lesson\":\"$5:props:world:lessons:0\"}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#1C2647\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"The Pilgrimage\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A quiet road through places you have stood.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/my-first-project/pilgrimage/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
