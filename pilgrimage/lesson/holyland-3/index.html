at dusk. For thirty years, God’s life on earth looked exactly like ordinary life.\",\"vi\":\"Một thị trấn nhỏ trên đồi xứ Galilê. Một xưởng mộc thơm mùi vỏ bào. Nước gánh từ giếng về, bánh nướng trong lò, lời kinh đọc lúc chiều tà. Suốt ba mươi năm, cuộc sống của Thiên Chúa nơi trần gian trông y hệt một cuộc sống bình thường.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"annunciation\",\"text\":{\"en\":\"Today the great Basilica of the Annunciation stands over a small cave-house — held by tradition as Mary’s home, the room of the yes. Pilgrims from every nation queue to look into one ordinary room.\",\"vi\":\"Ngày nay, Vương cung thánh đường Truyền Tin đứng trên một ngôi nhà hang đá nhỏ — được lưu truyền là nhà của Đức Mẹ Maria, căn phòng của tiếng xin vâng. Khách hành hương từ mọi dân tộc xếp hàng chỉ để nhìn vào một căn phòng bình thường.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"candle-single\",\"text\":{\"en\":\"The hidden years are a doctrine in disguise: if God spent thirty years doing laundry, carpentry, and family dinners, then no ordinary day of yours — no layover, no early call time — is too small to be holy.\",\"vi\":\"Những năm ẩn dật là một bài giáo lý trá hình: nếu Thiên Chúa dành ba mươi năm cho việc giặt giũ, nghề mộc và những bữa cơm gia đình, thì không một ngày bình thường nào của bạn — không một chặng nghỉ, không một ca trực sớm nào — là quá nhỏ bé để nên thánh.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":2,\"prompt\":{\"en\":\"What do the hidden years of Nazareth teach?\",\"vi\":\"Những năm ẩn dật ở Nadarét dạy điều gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Ordinary life can be holy\",\"vi\":\"Cuộc sống bình thường có thể nên thánh\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Only public years matter\",\"vi\":\"Chỉ những năm hoạt động công khai mới đáng kể\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"Thirty hidden years against three public ones. God’s own ratio says most of holiness is quiet.\",\"vi\":\"Ba mươi năm ẩn dật so với ba năm công khai. Tỷ lệ của chính Thiên Chúa nói rằng phần lớn sự thánh thiện là thầm lặng.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"practice\",\"title\":{\"en\":\"A Nazareth day\",\"vi\":\"Một ngày Nadarét\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"Choose one chore this week — packing your case, making tea, ironing a uniform — and do it the Nazareth way: unhurried, with love, as if it mattered. It does.\",\"vi\":\"Hãy chọn một việc nhỏ trong tuần này — xếp vali, pha trà, là phẳng bộ đồng phục — và làm theo cách của Nadarét: không vội vã, với tình yêu, như thể nó quan trọng. Vì nó quan trọng thật.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"What is your most “Nazareth” hour of the day?\",\"vi\":\"Giờ nào trong ngày của bạn “Nadarét” nhất?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[531,533],\"note\":{\"en\":\"On the hidden life of Nazareth.\",\"vi\":\"Về đời sống ẩn dật ở Nadarét.\",\"viStatus\":\"unverified\"}}},{\"id\":\"holyland-2\",\"title\":{\"en\":\"The Lake\",\"vi\":\"Biển Hồ\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"storm-sea\",\"line\":{\"en\":\"The Sea of Galilee: thirteen miles of water where half the Gospel happened.\",\"vi\":\"Biển Hồ Galilê: hai mươi cây số mặt nước nơi một nửa Tin Mừng đã diễn ra.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"storm-sea\",\"text\":{\"en\":\"It is still there, and still working: fishermen still cast nets at dawn on the Sea of Galilee. On these shores Jesus called Peter and Andrew mid-haul: “Follow me, and I will make you fishers of men.”\",\"vi\":\"Hồ ấy vẫn còn đó, và vẫn đang lao động: những ngư phủ vẫn quăng lưới lúc rạng đông trên Biển Hồ Galilê. Trên những bờ hồ này, Chúa Giêsu đã gọi Phêrô và Anrê giữa mẻ lưới: “Hãy theo Thầy, Thầy sẽ làm cho các con thành những kẻ lưới người.”\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"loaves-fishes\",\"text\":{\"en\":\"Around this one lake: the hillside of the Beatitudes, the grass where five thousand ate, the waves he walked on, the shore where the risen Jesus cooked breakfast and asked Peter three times, “Do you love me?”\",\"vi\":\"Quanh một hồ nước này: sườn đồi của các Mối Phúc, bãi cỏ nơi năm ngàn người được ăn no, những con sóng Ngài đã bước lên, và bờ hồ nơi Chúa Phục Sinh nướng bữa sáng và hỏi Phêrô ba lần: “Con có yêu mến Thầy không?”\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"sky-flight\",\"text\":{\"en\":\"Pilgrims say the lake is the place where the Gospel feels nearest — because water does not change. The waves you would see are the waves they saw. Some places hold their stories the way the sky holds yours.\",\"vi\":\"Khách hành hương nói Biển Hồ là nơi Tin Mừng gần gũi nhất — vì nước không thay đổi. Những con sóng bạn sẽ thấy chính là những con sóng họ đã thấy. Có những nơi giữ câu chuyện của mình, như bầu trời đang giữ câu chuyện của bạn.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":1,\"prompt\":{\"en\":\"What did the risen Jesus ask Peter on this shore?\",\"vi\":\"Trên bờ hồ này, Chúa Phục Sinh hỏi Phêrô điều gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"“Do you love me?” — three times\",\"vi\":\"“Con có yêu mến Thầy không?” — ba lần\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"“Where were you on Friday?”\",\"vi\":\"“Hôm thứ Sáu con ở đâu?”\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"One question for each denial. Mercy does not interrogate the past; it asks about love, today.\",\"vi\":\"Một câu hỏi cho mỗi lần chối. Lòng thương xót không tra khảo quá khứ; nó chỉ hỏi về tình yêu, hôm nay.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"art\",\"art\":\"storm-sea\",\"title\":{\"en\":\"The Sea of Galilee\",\"vi\":\"Biển Hồ Galilê\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"Two hundred meters below sea level, ringed by hills — which is why storms drop onto it so suddenly, exactly as the Gospels describe. The geography keeps vouching for the story.\",\"vi\":\"Thấp hơn mực nước biển hai trăm mét, bốn bề là đồi núi — vì thế những cơn bão ập xuống hồ rất đột ngột, đúng như các sách Tin Mừng mô tả. Chính địa hình vẫn đang làm chứng cho câu chuyện.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Which lakeside story would you want to stand inside?\",\"vi\":\"Bạn muốn được đứng trong câu chuyện nào bên hồ?\",\"viStatus\":\"unverified\"}},{\"id\":\"holyland-3\",\"title\":{\"en\":\"The Empty Tomb, Today\",\"vi\":\"Ngôi mộ trống, hôm nay\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"tomb-morning\",\"line\":{\"en\":\"In the middle of Jerusalem’s old city stands a church built around a tomb — because of what is not in it.\",\"vi\":\"Giữa lòng phố cổ Giêrusalem là một ngôi nhà thờ xây quanh một ngôi mộ — vì điều không còn ở trong đó.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"cathedral-door\",\"text\":{\"en\":\"The Church of the Holy Sepulchre covers both Golgotha and the tomb — the hill of the cross and the garden grave, a hundred meters apart, under one roof since the year 335.\",\"vi\":\"Nhà thờ Mộ Thánh bao trùm cả Gôngôtha lẫn ngôi mộ — ngọn đồi thập giá và phần mộ trong vườn, cách nhau trăm mét, dưới cùng một mái từ năm 335.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"tomb-morning\",\"text\":{\"en\":\"Pilgrims queue for hours to stoop into a small stone room and touch a shelf of rock where, for one Sabbath, the body of Jesus lay. The room is famous for being empty.\",\"vi\":\"Khách hành hương xếp hàng nhiều giờ để cúi mình bước vào một gian đá nhỏ và chạm vào phiến đá nơi thân xác Chúa Giêsu đã nằm, trong một ngày Sabát duy nhất. Căn phòng ấy nổi tiếng vì nó trống không.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"candle-single\",\"text\":{\"en\":\"Every Easter, the church fills for the ancient vigil; candles pass flame to flame out the doors and into the streets — the same gesture as your baptism night, at the place where the morning began.\",\"vi\":\"Mỗi lễ Phục Sinh, nhà thờ chật kín cho đêm canh thức cổ xưa; những ngọn nến chuyền lửa cho nhau ra tận cửa và tràn xuống các con phố — cùng một cử chỉ như đêm Rửa tội của bạn, tại chính nơi buổi sáng ấy đã bắt đầu.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"sky-flight\",\"text\":{\"en\":\"Maybe one day a roster change puts Tel Aviv on your schedule. But even if it never does: every altar you will ever kneel at is connected to that empty shelf of stone. The pilgrimage you finished in this app is the same road, walked from the other end.\",\"vi\":\"Có thể một ngày nào đó lịch bay đưa bạn đến Tel Aviv. Nhưng dù điều đó không bao giờ xảy ra: mọi bàn thờ bạn sẽ quỳ trước đều nối liền với phiến đá trống ấy. Cuộc hành hương bạn đã hoàn thành trong ứng dụng này chính là con đường đó, đi từ đầu bên kia.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":1,\"prompt\":{\"en\":\"Why is the small stone room the most visited place in Christianity?\",\"vi\":\"Vì sao gian đá nhỏ ấy là nơi được viếng thăm nhiều nhất của Kitô giáo?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Because of what is not in it\",\"vi\":\"Vì điều không còn ở trong đó\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Because of its architecture\",\"vi\":\"Vì kiến trúc của nó\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"Every other shrine on earth holds something. This one holds an absence — and the absence is the good news.\",\"vi\":\"Mọi đền thánh khác trên đời đều lưu giữ một điều gì đó. Nơi này lưu giữ một sự trống vắng — và chính sự trống vắng ấy là Tin Mừng.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"art\",\"art\":\"tomb-morning\",\"title\":{\"en\":\"The morning that never ends\",\"vi\":\"Buổi sáng không bao giờ tàn\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"The bonus roads end here, where the main road’s story began its forever. Wherever you fly next, you carry the whole map now.\",\"vi\":\"Những con đường thêm kết thúc tại đây, nơi câu chuyện của con đường chính bắt đầu sự vĩnh cửu của nó. Dù bạn bay đến đâu tiếp theo, giờ đây bạn đã mang theo trọn tấm bản đồ.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"The road is walked. What will you keep?\",\"vi\":\"Con đường đã đi qua. Bạn sẽ giữ lại điều gì?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[640],\"note\":{\"en\":\"On the empty tomb as the first sign.\",\"vi\":\"Về ngôi mộ trống là dấu chỉ đầu tiên.\",\"viStatus\":\"unverified\"}}}]},\"lesson\":\"$5:props:world:lessons:2\"}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#1C2647\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"The Pilgrimage\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A quiet road through places you have stood.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/my-first-project/pilgrimage/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
