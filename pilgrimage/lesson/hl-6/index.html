\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"Every other shrine on earth holds something. This one holds an absence — and the absence is the good news.\",\"vi\":\"Mọi đền thánh khác trên đời đều lưu giữ một điều gì đó. Nơi này lưu giữ một sự trống vắng — và chính sự trống vắng ấy là Tin Mừng.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"art\",\"art\":\"tomb-morning\",\"title\":{\"en\":\"The morning that never ends\",\"vi\":\"Buổi sáng không bao giờ tàn\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"Pilgrimages to the Holy Land all end here, where the story began its forever. Wherever you live, you carry the map now.\",\"vi\":\"Mọi cuộc hành hương Đất Thánh đều kết thúc tại đây, nơi câu chuyện bắt đầu sự vĩnh cửu của nó. Dù bạn sống ở đâu, giờ đây bạn đã mang theo tấm bản đồ.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"The tomb is empty. What would change if you believed it?\",\"vi\":\"Ngôi mộ trống không. Điều gì sẽ thay đổi nếu bạn tin điều ấy?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[640],\"note\":{\"en\":\"On the empty tomb as the first sign.\",\"vi\":\"Về ngôi mộ trống là dấu chỉ đầu tiên.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hl-13\",\"title\":{\"en\":\"The Blood of Bruges\",\"vi\":\"Máu Thánh Bruges\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"basilica-bruges\",\"line\":{\"en\":\"Far from Jerusalem, in Belgium, a small basilica keeps a relic of this very story.\",\"vi\":\"Xa Giêrusalem, ở nước Bỉ, một vương cung thánh đường nhỏ gìn giữ một thánh tích của chính câu chuyện này.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"basilica-bruges\",\"text\":{\"en\":\"On a quiet square in Bruges, Belgium, stands the Basilica of the Holy Blood. Travelers wander in between the canals and the chocolate shops — and upstairs, in a side chapel, a priest holds out a crystal vial.\",\"vi\":\"Trên một quảng trường yên tĩnh ở Bruges, nước Bỉ, là Vương cung thánh đường Máu Thánh. Du khách tình cờ ghé vào giữa những con kênh và những tiệm sô-cô-la — và trên lầu, trong một nhà nguyện nhỏ, một linh mục nâng một ống pha lê.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"relic-blood\",\"text\":{\"en\":\"Inside is a cloth said to hold the blood of Jesus, brought from Jerusalem after the Crusades, honored there for more than eight hundred years. It is a {{relic}} — and now you know whose blood, and what it bought.\",\"vi\":\"Bên trong là tấm vải được tin là thấm Máu Chúa Giêsu, đưa về từ Giêrusalem sau các cuộc Thập tự chinh, được tôn kính tại đó hơn tám trăm năm. Đó là một {{relic}} — và giờ bạn đã biết là máu của ai, và máu ấy đã đổi lấy điều gì.\",\"viStatus\":\"unverified\"},\"terms\":[\"relic\"]},{\"id\":\"c3\",\"art\":\"relic-blood\",\"text\":{\"en\":\"Why do Catholics keep relics? For the same reason families keep a late grandparent’s ring, or a box of childhood photographs. Love holds onto what belonged to the beloved. It is the family-altar instinct again, written in gold and crystal.\",\"vi\":\"Vì sao người Công giáo gìn giữ thánh tích? Cũng vì lý do các gia đình giữ chiếc nhẫn của ông bà đã khuất, hay chiếc hộp đựng những tấm ảnh thuở nhỏ. Tình yêu luôn giữ lại những gì thuộc về người mình yêu. Lại là tấm lòng của bàn thờ gia đình — viết bằng vàng và pha lê.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"relic-blood\",\"text\":{\"en\":\"Pilgrims queue, touch the glass, and often feel something they have no words for. The Church would say: grace gets there before the explanations. If that has ever happened to you, in any holy place — now the explanations have caught up.\",\"vi\":\"Khách hành hương xếp hàng, chạm vào mặt kính, và thường cảm nhận một điều không gọi được thành tên. Giáo hội sẽ nói: Ơn Chúa luôn đến trước những lời giải thích. Nếu điều ấy từng xảy đến với bạn, ở bất cứ nơi thánh nào — thì giờ đây những lời giải thích đã theo kịp.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":2,\"prompt\":{\"en\":\"Why do Catholics honor relics?\",\"vi\":\"Vì sao người Công giáo tôn kính thánh tích?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"They are magic objects with powers\",\"vi\":\"Vì đó là những vật phép thuật có quyền năng\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Love keeps what belonged to the beloved\",\"vi\":\"Vì tình yêu giữ lại những gì thuộc về người mình yêu\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"A relic is honored, never worshiped — like your family’s photographs and incense. The love passes through the object to the person.\",\"vi\":\"Thánh tích được tôn kính, không bao giờ bị thờ phượng — như di ảnh và nén hương của gia đình bạn. Tình yêu đi xuyên qua kỷ vật để đến với con người.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"choice\",\"prompt\":{\"en\":\"Whose blood does the Bruges relic honor — and what did it do?\",\"vi\":\"Thánh tích ở Bruges tôn kính máu của ai — và máu ấy đã làm gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"A king’s blood, which won a war\",\"vi\":\"Máu của một vị vua, đã thắng một cuộc chiến\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Jesus’ blood, poured out in love on the cross\",\"vi\":\"Máu Chúa Giêsu, đã đổ ra vì yêu thương trên thập giá\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"“This is my blood, poured out for you.” The vial in Bruges points straight back to that Thursday table and that Friday hill.\",\"vi\":\"“Đây là Máu Thầy, đổ ra cho các con.” Ống pha lê ở Bruges chỉ thẳng về bàn tiệc đêm thứ Năm và ngọn đồi chiều thứ Sáu ấy.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"word\",\"termId\":\"relic\",\"note\":{\"en\":\"If your road ever passes through Bruges, you can climb those stairs knowing the whole story — from a garden, through a cross, to a crystal vial on a quiet square.\",\"vi\":\"Nếu con đường của bạn có ngày đi qua Bruges, bạn có thể bước lên những bậc thang ấy với trọn câu chuyện trong lòng — từ một khu vườn, qua một thập giá, đến ống pha lê trên một quảng trường yên tĩnh.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Have you ever touched something that felt holy? What was it?\",\"vi\":\"Bạn từng chạm vào điều gì mang cảm giác thánh thiêng chưa? Đó là gì?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[1674],\"note\":{\"en\":\"On the veneration of relics in Catholic life.\",\"vi\":\"Về việc tôn kính thánh tích trong đời sống Công giáo.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hl-vigil\",\"vigil\":true,\"title\":{\"en\":\"Vigil: He Goes Before You\",\"vi\":\"Canh thức: Ngài đi trước bạn\",\"viStatus\":\"unverified\"},\"minutes\":6,\"door\":{\"art\":\"emmaus-road\",\"line\":{\"en\":\"No questions tonight. Only the road, the stranger who walks it with us, and the second stamp.\",\"vi\":\"Tối nay không có câu hỏi. Chỉ có con đường, người khách lạ cùng đi với chúng ta, và con dấu thứ hai.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"emmaus-road\",\"text\":{\"en\":\"Easter evening. Two heartbroken friends walk home to a village called Emmaus, talking about everything they lost on Friday. A stranger falls in step beside them.\",\"vi\":\"Chiều ngày Phục Sinh. Hai môn đệ tan nát cõi lòng đi bộ về làng Emmau, vừa đi vừa nói về tất cả những gì họ đã mất hôm thứ Sáu. Một người khách lạ rảo bước đi cùng họ.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"emmaus-road\",\"text\":{\"en\":\"Mile after mile, the stranger opens the scriptures to them — the garden, the prophets, the promise — showing how the whole story pointed to the cross and through it. Their hearts burn, and they do not know why.\",\"vi\":\"Suốt chặng đường dài, người khách lạ mở Kinh Thánh cho họ — khu vườn, các ngôn sứ, lời hứa — cho thấy cả câu chuyện đều hướng về thập giá và đi xuyên qua nó. Lòng họ bừng cháy, mà không hiểu vì sao.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"last-supper\",\"text\":{\"en\":\"At their table that evening, the stranger takes the bread, gives thanks, breaks it, gives it. Four movements. Their eyes are opened — it is him — and he vanishes. They run the whole road back in the dark, to tell the others.\",\"vi\":\"Bên bàn ăn tối hôm ấy, người khách lạ cầm lấy bánh, tạ ơn, bẻ ra, trao đi. Bốn động tác. Mắt họ mở ra — chính là Ngài — rồi Ngài biến mất. Họ chạy ngược cả quãng đường trong đêm tối, để báo tin cho các bạn.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"tomb-morning\",\"text\":{\"en\":\"For forty days he appears: to the fearful friends behind locked doors, to doubting Thomas who needed to touch the wounds, to seven tired fishermen at dawn with breakfast already cooking on the shore.\",\"vi\":\"Suốt bốn mươi ngày, Ngài hiện đến: với các môn đệ sợ hãi sau cửa khóa, với Tôma cứng lòng cần chạm vào các vết thương, với bảy ngư phủ mệt nhoài lúc rạng đông — bữa sáng đã dọn sẵn trên bờ.\",\"viStatus\":\"unverified\"}},{\"id\":\"c5\",\"art\":\"ascension\",\"text\":{\"en\":\"Then, on a hilltop, he blesses them and is lifted from their sight, into the cloud of God’s presence. His last promise still stands: “I am with you always, until the end of the world.”\",\"vi\":\"Rồi, trên một ngọn đồi, Ngài chúc lành cho họ và được cất lên khỏi tầm mắt, vào đám mây của sự hiện diện Thiên Chúa. Lời hứa cuối của Ngài vẫn còn nguyên: “Thầy ở cùng các con mọi ngày cho đến tận thế.”\",\"viStatus\":\"unverified\"}},{\"id\":\"c6\",\"art\":\"relic-blood\",\"text\":{\"en\":\"You have walked the whole arc now: a garden lost, a promise kept, a yes, a birth, water into wine, mercy running down a road, bread broken, a cross, a silence, and a morning that never ends.\",\"vi\":\"Bạn đã đi trọn vòng cung câu chuyện: một khu vườn đánh mất, một lời hứa được giữ, một tiếng xin vâng, một hài nhi, nước hóa thành rượu, lòng thương xót chạy ra giữa đường, tấm bánh được bẻ ra, một thập giá, một sự thinh lặng, và một buổi sáng không bao giờ tàn.\",\"viStatus\":\"unverified\"}},{\"id\":\"c7\",\"art\":\"basilica-bruges\",\"text\":{\"en\":\"The second page of your passport is ready. The road turns now toward Paris — toward an organ you have heard with your own ears, and the question of what the Church actually is.\",\"vi\":\"Trang thứ hai trong hộ chiếu của bạn đã sẵn sàng. Con đường giờ hướng về Paris — về cây đàn organ bạn đã nghe bằng chính đôi tai mình, và câu hỏi: Giáo hội thật ra là gì.\",\"viStatus\":\"unverified\"}}],\"questions\":[],\"treasure\":{\"kind\":\"art\",\"art\":\"emmaus-road\",\"title\":{\"en\":\"The road to Emmaus\",\"vi\":\"Đường Emmau\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"The Church’s favorite picture of itself: people walking a road, hearts burning, recognizing him in the breaking of the bread. You are on that road now.\",\"vi\":\"Bức tranh Giáo hội yêu thích nhất về chính mình: những con người đi trên một con đường, lòng bừng cháy, nhận ra Ngài khi bánh được bẻ ra. Bạn đang ở trên con đường ấy.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Looking back over the whole story of Jesus — what stays with you most?\",\"vi\":\"Nhìn lại trọn câu chuyện của Chúa Giêsu — điều gì ở lại trong bạn nhiều nhất?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[641,659],\"note\":{\"en\":\"On the appearances of the Risen Lord and the Ascension.\",\"vi\":\"Về các lần hiện ra của Chúa Phục Sinh và việc Chúa Lên Trời.\",\"viStatus\":\"unverified\"}}}]},\"lesson\":\"$5:props:world:lessons:6\"}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#1C2647\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"The Pilgrimage\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A quiet pilgrimage through the world’s holy places.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"The Pilgrimage\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/my-first-project/pilgrimage/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"5\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"6\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Pilgrimage\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"black-translucent\"}],[\"$\",\"link\",\"8\",{\"rel\":\"icon\",\"href\":\"/my-first-project/pilgrimage/icon-192.png\",\"sizes\":\"192x192\",\"type\":\"image/png\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/my-first-project/pilgrimage/icon-512.png\",\"sizes\":\"512x512\",\"type\":\"image/png\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/my-first-project/pilgrimage/apple-touch-icon.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L11\",\"11\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
