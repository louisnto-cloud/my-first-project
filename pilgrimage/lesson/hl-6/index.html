he Fall\",\"vi\":\"Khu vườn và sự sa ngã\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"eden-tree\",\"line\":{\"en\":\"Before Jerusalem, before everything — a garden, a gift, and a choice.\",\"vi\":\"Trước Giêrusalem, trước tất cả — một khu vườn, một món quà, và một lựa chọn.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"eden-tree\",\"text\":{\"en\":\"The story begins in a garden. The first people had everything: the world, each other, and God walking close to them, like family.\",\"vi\":\"Câu chuyện bắt đầu trong một khu vườn. Những con người đầu tiên có tất cả: thế giới, có nhau, và Thiên Chúa ở thật gần, như người nhà.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"eden-tree\",\"text\":{\"en\":\"One thing was asked of them: trust me. One tree was not theirs to take. And a quiet voice — the serpent — whispered: God is holding out on you. Take it, and you will not need him.\",\"vi\":\"Chỉ một điều được yêu cầu nơi họ: hãy tin Ta. Một cái cây không phải của họ. Và một tiếng nói thầm — con rắn — rỉ tai: Thiên Chúa đang giấu các ngươi điều tốt. Cứ hái đi, rồi các ngươi sẽ không cần Ngài nữa.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"eden-tree\",\"text\":{\"en\":\"They took it. And something tore. Not the fruit — the trust. Shame came in, and hiding, and blame. The Church calls this wound {{sin}}.\",\"vi\":\"Họ đã hái. Và một điều gì đó rạn vỡ. Không phải trái cây — mà là lòng tin. Xấu hổ kéo đến, rồi trốn tránh, rồi đổ lỗi. Giáo hội gọi vết thương ấy là {{sin}}.\",\"viStatus\":\"unverified\"},\"terms\":[\"sin\"]},{\"id\":\"c4\",\"art\":\"prayer-night\",\"text\":{\"en\":\"You know this tear. Everyone does — the distance between the person we want to be and what we actually do. The story is not about two people long ago. It is about all of us.\",\"vi\":\"Bạn biết vết rạn này. Ai cũng biết — khoảng cách giữa con người ta muốn trở thành và điều ta thật sự làm. Câu chuyện không chỉ về hai người thuở xưa. Mà về tất cả chúng ta.\",\"viStatus\":\"unverified\"}},{\"id\":\"c5\",\"art\":\"creation-light\",\"text\":{\"en\":\"But listen to what God does next. He does not abandon the garden. Standing in the wreckage, he makes a promise: one day, someone born of a woman will crush the serpent.\",\"vi\":\"Nhưng hãy nghe điều Thiên Chúa làm tiếp theo. Ngài không bỏ rơi khu vườn. Đứng giữa đổ nát, Ngài hứa: một ngày kia, một người con sinh bởi người nữ sẽ đạp nát đầu con rắn.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"Genesis 3:15\",\"verse\":{\"en\":\"I will put enmity between you and the woman, between your offspring and hers. He will strike at your head.\",\"vi\":\"Ta sẽ đặt mối thù giữa ngươi và người nữ, giữa dòng dõi ngươi và dòng dõi người ấy. Người sẽ đạp nát đầu ngươi.\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"On the worst day in the story, God already speaks of a rescue. The whole Bible after this page is the keeping of that promise.\",\"vi\":\"Ngay trong ngày tồi tệ nhất của câu chuyện, Thiên Chúa đã nói về một cuộc giải cứu. Cả phần Kinh Thánh sau trang này là việc Ngài giữ lời hứa ấy.\",\"viStatus\":\"unverified\"}}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"predict\",\"afterCard\":2,\"prompt\":{\"en\":\"The first people have broken trust with God. What does he do?\",\"vi\":\"Những con người đầu tiên đã đánh mất lòng tin với Thiên Chúa. Ngài sẽ làm gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"He destroys the garden and walks away\",\"vi\":\"Ngài phá hủy khu vườn và bỏ đi\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"He promises a rescue\",\"vi\":\"Ngài hứa một cuộc giải cứu\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"This is the pattern of the whole story: where we break things, God begins repairs.\",\"vi\":\"Đây là khuôn mẫu của cả câu chuyện: nơi chúng ta làm đổ vỡ, Thiên Chúa bắt đầu chữa lành.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"choice\",\"prompt\":{\"en\":\"What was actually broken in the garden?\",\"vi\":\"Điều gì thật sự bị đổ vỡ trong khu vườn?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"A rule about fruit\",\"vi\":\"Một luật lệ về trái cây\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Trust between God and his children\",\"vi\":\"Lòng tin giữa Thiên Chúa và con cái Ngài\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"Sin is never really about the fruit. It is the turning away from someone who loves us.\",\"vi\":\"Tội lỗi không bao giờ thật sự là chuyện trái cây. Mà là sự quay lưng với Đấng yêu thương mình.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"art\",\"art\":\"eden-tree\",\"title\":{\"en\":\"The tree and the serpent\",\"vi\":\"Cái cây và con rắn\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"Artists paint this scene in every cathedral, because the next chapters make no sense without it. Remember the tree — at the end of this world, you will see another one, shaped like a cross.\",\"vi\":\"Các nghệ sĩ vẽ cảnh này trong mọi nhà thờ lớn, vì những chương sau sẽ vô nghĩa nếu thiếu nó. Hãy nhớ cái cây này — cuối chặng đường này, bạn sẽ thấy một cái cây khác, mang hình Thánh giá.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Where have you felt that tear between who you want to be and what you do?\",\"vi\":\"Bạn từng cảm thấy vết rạn giữa con người mình muốn trở thành và điều mình làm ở đâu?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[397,410,411],\"note\":{\"en\":\"On the fall, and the first promise of a Savior.\",\"vi\":\"Về sự sa ngã, và lời hứa đầu tiên về Đấng Cứu Thế.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hl-2\",\"title\":{\"en\":\"The Long Waiting\",\"vi\":\"Sự chờ đợi dài lâu\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"prophet-night\",\"line\":{\"en\":\"Centuries pass. A people keeps watch in the dark, holding one promise.\",\"vi\":\"Hàng thế kỷ trôi qua. Một dân tộc canh thức trong đêm tối, ôm giữ một lời hứa.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"prophet-night\",\"text\":{\"en\":\"God chose a small people, Israel, to carry his promise through history. They were freed from slavery, given a land, and they waited.\",\"vi\":\"Thiên Chúa chọn một dân tộc nhỏ bé, Israel, để mang lời hứa của Ngài xuyên qua lịch sử. Họ được giải thoát khỏi kiếp nô lệ, được ban một vùng đất, và họ chờ đợi.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"prophet-night\",\"text\":{\"en\":\"When they forgot, God sent {{prophet}}s — men and women who spoke for him. Again and again the prophets pointed ahead: someone is coming.\",\"vi\":\"Khi họ quên, Thiên Chúa sai các {{prophet}} — những người nam nữ nói thay Ngài. Hết lần này đến lần khác, các ngôn sứ chỉ về phía trước: có một Đấng đang đến.\",\"viStatus\":\"unverified\"},\"terms\":[\"prophet\"]},{\"id\":\"c3\",\"art\":\"creation-light\",\"text\":{\"en\":\"Seven hundred years before Bethlehem, Isaiah wrote it down.\",\"vi\":\"Bảy trăm năm trước Bêlem, ngôn sứ Isaia đã viết xuống.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"Isaiah 9:6\",\"verse\":{\"en\":\"For a child is born to us, a son is given to us. He will be called Wonderful Counselor, Mighty God, Prince of Peace.\",\"vi\":\"Vì một trẻ thơ đã chào đời để cứu ta, một người con đã được ban tặng cho ta. Người sẽ được gọi là Cố Vấn Kỳ Diệu, Thiên Chúa Quyền Năng, Hoàng Tử Bình An.\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"The rescue would not arrive as an army. It would arrive as a baby. No one expected that.\",\"vi\":\"Cuộc giải cứu sẽ không đến như một đạo quân. Mà đến như một em bé. Không ai ngờ được điều đó.\",\"viStatus\":\"unverified\"},\"bridge\":{\"en\":\"Like waiting at an arrivals gate for years, holding a name on a sign.\",\"vi\":\"Như đứng đợi ở cửa đến của sân bay suốt nhiều năm, tay cầm tấm bảng ghi một cái tên.\",\"viStatus\":\"unverified\"}}},{\"id\":\"c4\",\"art\":\"lake-evening\",\"text\":{\"en\":\"Waiting is its own kind of faith. Advent — the season before Christmas — keeps this waiting alive every year, so we never forget what it cost to hope.\",\"vi\":\"Chờ đợi cũng là một dạng đức tin. Mùa Vọng — mùa trước Giáng Sinh — giữ cho sự chờ đợi này sống lại mỗi năm, để ta không bao giờ quên niềm hy vọng đã phải trả giá thế nào.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":1,\"prompt\":{\"en\":\"What was a prophet’s job?\",\"vi\":\"Công việc của một ngôn sứ là gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"To predict the lottery\",\"vi\":\"Đoán số trúng thưởng\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"To speak for God and keep hope alive\",\"vi\":\"Nói thay Thiên Chúa và giữ niềm hy vọng sống mãi\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"To rule as kings\",\"vi\":\"Cai trị như vua chúa\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"Prophets were the keepers of the promise — lamps in a long night.\",\"vi\":\"Các ngôn sứ là người canh giữ lời hứa — những ngọn đèn trong đêm dài.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"fill\",\"prompt\":{\"en\":\"You learned this line in Hà Nội. Complete it.\",\"vi\":\"Bạn đã học câu này ở Hà Nội. Hãy hoàn thành.\",\"viStatus\":\"unverified\"},\"before\":{\"en\":\"Our Father, who art in heaven,\",\"vi\":\"Lạy Cha chúng con ở trên trời,\",\"viStatus\":\"unverified\"},\"after\":{\"en\":\"…\",\"vi\":\"…\",\"viStatus\":\"unverified\"},\"options\":[{\"en\":\"hallowed be thy name.\",\"vi\":\"chúng con nguyện danh Cha cả sáng,\",\"viStatus\":\"unverified\"},{\"en\":\"blessed be the morning.\",\"vi\":\"chúng con chúc tụng buổi sáng,\",\"viStatus\":\"unverified\"},{\"en\":\"listen to our plans.\",\"vi\":\"xin nghe các kế hoạch của chúng con,\",\"viStatus\":\"unverified\"}],\"answer\":0,\"why\":{\"en\":\"Israel’s long waiting was exactly this prayer: may your name be known, may your kingdom come.\",\"vi\":\"Sự chờ đợi dài lâu của Israel chính là lời kinh này: nguyện danh Cha cả sáng, nước Cha trị đến.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"word\",\"termId\":\"prophet\",\"note\":{\"en\":\"A word for the watchers in the dark. When you next stand in a night airport, think of them: people who kept believing the light would come.\",\"vi\":\"Một từ dành cho những người canh thức trong đêm. Lần tới khi bạn đứng trong sân bay lúc nửa đêm, hãy nghĩ đến họ: những người không ngừng tin rằng ánh sáng sẽ đến.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"What are you waiting for, honestly?\",\"vi\":\"Thật lòng, bạn đang chờ đợi điều gì?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[522],\"note\":{\"en\":\"On the long preparation for the coming of Christ.\",\"vi\":\"Về sự chuẩn bị dài lâu cho việc Chúa Kitô đến.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hl-3\",\"title\":{\"en\":\"Mary’s Yes\",\"vi\":\"Tiếng \\\"Xin Vâng\\\" của Mẹ Maria\",\"viStatus\":\"unverified\"},\"minutes\":5,\"door\":{\"art\":\"annunciation\",\"line\":{\"en\":\"A village girl, an ordinary morning, and a visitor who bows to her.\",\"vi\":\"Một thiếu nữ làng quê, một buổi sáng bình thường, và một vị khách cúi chào cô.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"annunciation\",\"text\":{\"en\":\"Her name is Maria — Mary. She is young, poor, engaged to a carpenter named Joseph, in a town too small for maps. Heaven chooses her.\",\"vi\":\"Tên cô là Maria. Cô trẻ tuổi, nghèo, đã đính hôn với một bác thợ mộc tên Giuse, ở một thị trấn nhỏ đến mức bản đồ không ghi. Và Trời cao đã chọn cô.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"annunciation\",\"text\":{\"en\":\"An angel stands before her. “Hail, full of grace. The Lord is with you.” Mary is troubled — what kind of greeting is this, for a girl like her?\",\"vi\":\"Một thiên thần đứng trước mặt cô. “Kính mừng Bà đầy ơn phúc. Đức Chúa Trời ở cùng Bà.” Maria bối rối — lời chào này nghĩa là gì, với một thiếu nữ như cô?\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"annunciation\",\"text\":{\"en\":\"The angel tells her: you will bear a son, and name him Jesus. He will be called Son of the Most High. The promise of every prophet lands on her shoulders.\",\"vi\":\"Thiên thần nói: Bà sẽ sinh một con trai, và đặt tên là Giêsu. Người sẽ được gọi là Con Đấng Tối Cao. Lời hứa của mọi ngôn sứ đặt xuống đôi vai cô.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"annunciation\",\"text\":{\"en\":\"She could have said no. Nothing forced her. That is the astonishing part: God waited on the free yes of a young woman.\",\"vi\":\"Cô đã có thể nói không. Không gì ép buộc cô cả. Đó là điều kỳ diệu: Thiên Chúa chờ đợi tiếng xin vâng tự do của một người thiếu nữ.\",\"viStatus\":\"unverified\"},\"branch\":{\"prompt\":{\"en\":\"Standing where Mary stood — what would rise in you first?\",\"vi\":\"Nếu đứng ở nơi Maria đứng — điều gì sẽ trào dâng trong bạn trước tiên?\",\"viStatus\":\"unverified\"},\"choices\":[{\"label\":{\"en\":\"Fear\",\"vi\":\"Sợ hãi\",\"viStatus\":\"unverified\"},\"response\":{\"en\":\"The angel’s first words were “Do not be afraid.” Fear is allowed in this story. It always has been.\",\"vi\":\"Lời đầu tiên của thiên thần là “Đừng sợ.” Nỗi sợ được phép có mặt trong câu chuyện này. Xưa nay vẫn vậy.\",\"viStatus\":\"unverified\"}},{\"label\":{\"en\":\"Questions\",\"vi\":\"Những câu hỏi\",\"viStatus\":\"unverified\"},\"response\":{\"en\":\"Mary asked one too: “How can this be?” Asking is not doubting. She asked, and then she trusted.\",\"vi\":\"Maria cũng đã hỏi: “Việc ấy xảy ra thế nào được?” Hỏi không phải là nghi ngờ. Cô đã hỏi, rồi cô tin.\",\"viStatus\":\"unverified\"}},{\"label\":{\"en\":\"A quiet yes\",\"vi\":\"Một tiếng xin vâng lặng lẽ\",\"viStatus\":\"unverified\"},\"response\":{\"en\":\"Then you already understand her. The greatest yes in history was spoken quietly, in a small room.\",\"vi\":\"Vậy là bạn đã hiểu cô ấy. Tiếng xin vâng vĩ đại nhất lịch sử được thốt lên thật khẽ, trong một căn phòng nhỏ.\",\"viStatus\":\"unverified\"}}]}},{\"id\":\"c5\",\"art\":\"annunciation\",\"text\":{\"en\":\"And Mary answers.\",\"vi\":\"Và Maria trả lời.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"Luke 1:38\",\"verse\":{\"en\":\"Behold, I am the servant of the Lord. Let it be done to me according to your word.\",\"vi\":\"Vâng, tôi đây là nữ tỳ của Chúa. Xin Chúa cứ làm cho tôi như lời sứ thần nói.\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"Her yes undid the old no of the garden. Where trust was broken, trust was given back — freely, completely.\",\"vi\":\"Tiếng xin vâng của Mẹ tháo gỡ tiếng \\\"không\\\" xưa kia trong khu vườn. Nơi lòng tin từng đổ vỡ, lòng tin được trao lại — tự do, trọn vẹn.\",\"viStatus\":\"unverified\"},\"bridge\":{\"en\":\"Your own baptism will be a yes like this one: never demanded, only invited.\",\"vi\":\"Bí tích Rửa tội của chính bạn cũng sẽ là một tiếng xin vâng như thế: không bao giờ bị đòi hỏi, chỉ được mời gọi.\",\"viStatus\":\"unverified\"}}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"tapArt\",\"afterCard\":2,\"prompt\":{\"en\":\"Look closer at the Annunciation.\",\"vi\":\"Hãy nhìn gần hơn bức Truyền Tin.\",\"viStatus\":\"unverified\"},\"art\":\"annunciation\",\"hotspots\":[{\"x\":27,\"y\":60,\"label\":{\"en\":\"The angel Gabriel\",\"vi\":\"Sứ thần Gabriel\",\"viStatus\":\"unverified\"},\"meaning\":{\"en\":\"God’s messenger. His wings are gold — painters used real gold to say: heaven touches earth here.\",\"vi\":\"Sứ giả của Thiên Chúa. Đôi cánh màu vàng — các họa sĩ dùng vàng thật để nói: nơi đây trời chạm đất.\",\"viStatus\":\"unverified\"}},{\"x\":75,\"y\":62,\"label\":{\"en\":\"Mary\",\"vi\":\"Đức Mẹ Maria\",\"viStatus\":\"unverified\"},\"meaning\":{\"en\":\"She bows, but she is the most important person in the room. Heaven is waiting for her answer.\",\"vi\":\"Mẹ cúi mình, nhưng Mẹ là người quan trọng nhất trong căn phòng. Cả thiên đàng đang đợi câu trả lời của Mẹ.\",\"viStatus\":\"unverified\"}},{\"x\":50,\"y\":21,\"label\":{\"en\":\"The dove\",\"vi\":\"Chim bồ câu\",\"viStatus\":\"unverified\"},\"meaning\":{\"en\":\"The Holy Spirit, descending on a ray of light. The child will be conceived by God’s own power.\",\"vi\":\"Chúa Thánh Thần, ngự xuống trên một tia sáng. Hài nhi sẽ được thụ thai bởi quyền năng của chính Thiên Chúa.\",\"viStatus\":\"unverified\"}},{\"x\":52,\"y\":84,\"label\":{\"en\":\"The lily\",\"vi\":\"Hoa huệ\",\"viStatus\":\"unverified\"},\"meaning\":{\"en\":\"The painter’s signature for purity. Wherever you see a lily in sacred art, Mary is near.\",\"vi\":\"Dấu hiệu của sự thanh khiết trong hội họa. Ở đâu có hoa huệ trong nghệ thuật thánh, ở đó có Mẹ Maria.\",\"viStatus\":\"unverified\"}}]},{\"id\":\"q2\",\"kind\":\"choice\",\"prompt\":{\"en\":\"Why does Mary’s yes matter so much?\",\"vi\":\"Vì sao tiếng xin vâng của Mẹ Maria quan trọng đến thế?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"It was free — God invited, never forced\",\"vi\":\"Vì nó tự do — Thiên Chúa mời gọi, không hề ép buộc\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"She had no other choice\",\"vi\":\"Vì cô không còn lựa chọn nào khác\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"Love that is forced is not love. The whole rescue of the world waited on a freely given yes.\",\"vi\":\"Tình yêu bị ép buộc thì không phải tình yêu. Cả cuộc giải cứu thế giới đã chờ một tiếng xin vâng tự nguyện.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"prayer\",\"prayerId\":\"hail-mary\",\"note\":{\"en\":\"The prayer of your own rosary. Its first words are the angel’s greeting you just heard. When you pray it, you stand in that small room.\",\"vi\":\"Lời kinh của chính chuỗi Mân Côi bạn đang có. Những lời đầu là lời chào của thiên thần bạn vừa nghe. Khi đọc kinh này, bạn đang đứng trong căn phòng nhỏ ấy.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"What would you need, to say a yes like hers?\",\"vi\":\"Bạn cần điều gì để có thể nói một tiếng xin vâng như thế?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[494],\"note\":{\"en\":\"On Mary’s free obedience of faith.\",\"vi\":\"Về sự vâng phục tự do trong đức tin của Mẹ Maria.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hl-4\",\"title\":{\"en\":\"The Night in Bethlehem\",\"vi\":\"Đêm Bêlem\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"nativity\",\"line\":{\"en\":\"No room at the inn. A stable, a star, and the promise arriving with a newborn’s cry.\",\"vi\":\"Quán trọ hết chỗ. Một chuồng gia súc, một ngôi sao, và lời hứa đến trong tiếng khóc của một hài nhi.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"nativity\",\"text\":{\"en\":\"A census forces Joseph and Mary to travel to Bethlehem while she is heavily pregnant. The town is full. The only shelter left is where the animals sleep.\",\"vi\":\"Một cuộc kiểm tra dân số buộc Giuse và Maria phải về Bêlem khi Mẹ đang gần ngày sinh. Thị trấn chật kín. Chỗ trú duy nhất còn lại là nơi gia súc ngủ.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"nativity\",\"text\":{\"en\":\"And there, in the night, the child is born. The one the prophets promised. God himself, small enough to hold.\",\"vi\":\"Và tại đó, trong đêm, hài nhi chào đời. Đấng các ngôn sứ đã hứa. Chính Thiên Chúa, bé nhỏ đến mức có thể ẵm trên tay.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"Luke 2:7\",\"verse\":{\"en\":\"She gave birth to her firstborn son, wrapped him in cloth, and laid him in a manger, because there was no room for them at the inn.\",\"vi\":\"Bà sinh con trai đầu lòng, lấy tã bọc con, rồi đặt nằm trong máng cỏ, vì hai ông bà không tìm được chỗ trong nhà trọ.\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"The King of everything arrived with nothing. God chose to enter the world from below, so that no one would ever be beneath him.\",\"vi\":\"Vua của muôn loài đã đến mà không có gì cả. Thiên Chúa chọn bước vào thế giới từ chỗ thấp nhất, để không ai bị xem là thấp hơn Ngài.\",\"viStatus\":\"unverified\"}}},{\"id\":\"c3\",\"art\":\"nativity\",\"text\":{\"en\":\"The first guests were not kings or priests. They were shepherds — night workers, low on every list. Angels filled their sky with song and sent them running to a feeding trough.\",\"vi\":\"Những vị khách đầu tiên không phải vua chúa hay tư tế. Mà là những người chăn chiên — người làm đêm, đứng cuối mọi danh sách. Các thiên thần hát vang trời và bảo họ chạy đến bên một máng cỏ.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"nativity\",\"text\":{\"en\":\"Christmas is this night, kept forever. Every crib scene in every church window you have ever passed is this stable, still glowing.\",\"vi\":\"Giáng Sinh chính là đêm này, được lưu giữ mãi mãi. Mỗi hang đá trong mỗi ô cửa nhà thờ bạn từng đi qua đều là chuồng gia súc này, vẫn đang tỏa sáng.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":2,\"prompt\":{\"en\":\"Who did the angels invite first to meet the newborn King?\",\"vi\":\"Các thiên thần mời ai đến gặp vị Vua mới sinh trước tiên?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"The emperor’s officials\",\"vi\":\"Các quan chức của hoàng đế\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Shepherds working the night shift\",\"vi\":\"Những người chăn chiên làm ca đêm\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"The innkeeper\",\"vi\":\"Chủ quán trọ\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"God’s guest list starts from the bottom. It always has.\",\"vi\":\"Danh sách khách mời của Thiên Chúa luôn bắt đầu từ những người bé nhỏ nhất. Xưa nay vẫn thế.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"fill\",\"prompt\":{\"en\":\"Complete the angel’s greeting you received as a treasure.\",\"vi\":\"Hoàn thành lời chào của thiên thần mà bạn đã nhận làm kho báu.\",\"viStatus\":\"unverified\"},\"before\":{\"en\":\"Hail Mary, full of\",\"vi\":\"Kính mừng Maria đầy\",\"viStatus\":\"unverified\"},\"after\":{\"en\":\"…\",\"vi\":\"…\",\"viStatus\":\"unverified\"},\"options\":[{\"en\":\"grace,\",\"vi\":\"ơn phúc,\",\"viStatus\":\"unverified\"},{\"en\":\"songs,\",\"vi\":\"bài ca,\",\"viStatus\":\"unverified\"},{\"en\":\"light,\",\"vi\":\"ánh sáng,\",\"viStatus\":\"unverified\"}],\"answer\":0,\"why\":{\"en\":\"Full of grace — full of God’s own gift. The prayer keeps the angel’s exact word.\",\"vi\":\"Đầy ơn phúc — đầy chính quà tặng của Thiên Chúa. Lời kinh giữ đúng từng chữ của thiên thần.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"art\",\"art\":\"nativity\",\"title\":{\"en\":\"The Nativity\",\"vi\":\"Chúa Giáng Sinh\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"Painters like Giotto put real night into this scene — deep blue, one star, gold only around the child. The colors of this entire app come from that night.\",\"vi\":\"Các họa sĩ như Giotto đã đưa màn đêm thật vào cảnh này — xanh thẳm, một ngôi sao, sắc vàng chỉ quanh hài nhi. Màu sắc của cả ứng dụng này đến từ đêm ấy.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Where were you the last time something felt holy?\",\"vi\":\"Lần gần nhất bạn cảm thấy điều gì đó thánh thiêng, bạn đang ở đâu?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[525],\"note\":{\"en\":\"On the humility of the Nativity.\",\"vi\":\"Về sự khiêm hạ của đêm Giáng Sinh.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hl-naz\",\"title\":{\"en\":\"Nazareth, the Hidden Years\",\"vi\":\"Nadarét, những năm ẩn dật\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"parish-home\",\"line\":{\"en\":\"Thirty of Jesus’ thirty-three years were spent here — and the Gospels say almost nothing about them.\",\"vi\":\"Ba mươi trong ba mươi ba năm của Chúa Giêsu trôi qua ở đây — và các sách Tin Mừng hầu như không nói gì về chúng.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"parish-home\",\"text\":{\"en\":\"A small hill town in Galilee. A workshop smelling of wood shavings. Water carried from the well, bread baked, prayers said at dusk. For thirty years, God’s life on earth looked exactly like ordinary life.\",\"vi\":\"Một thị trấn nhỏ trên đồi xứ Galilê. Một xưởng mộc thơm mùi vỏ bào. Nước gánh từ giếng về, bánh nướng trong lò, lời kinh đọc lúc chiều tà. Suốt ba mươi năm, cuộc sống của Thiên Chúa nơi trần gian trông y hệt một cuộc sống bình thường.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"annunciation\",\"text\":{\"en\":\"Today the great Basilica of the Annunciation stands over a small cave-house — held by tradition as Mary’s home, the room of the yes. Pilgrims from every nation queue to look into one ordinary room.\",\"vi\":\"Ngày nay, Vương cung thánh đường Truyền Tin đứng trên một ngôi nhà hang đá nhỏ — được lưu truyền là nhà của Đức Mẹ Maria, căn phòng của tiếng xin vâng. Khách hành hương từ mọi dân tộc xếp hàng chỉ để nhìn vào một căn phòng bình thường.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"candle-single\",\"text\":{\"en\":\"The hidden years are a doctrine in disguise: if God spent thirty years doing laundry, carpentry, and family dinners, then no ordinary day of yours — no errand, no commute — is too small to be holy.\",\"vi\":\"Những năm ẩn dật là một bài giáo lý trá hình: nếu Thiên Chúa dành ba mươi năm cho việc giặt giũ, nghề mộc và những bữa cơm gia đình, thì không một ngày bình thường nào của bạn — không một việc vặt, một chuyến đi làm nào — là quá nhỏ bé để nên thánh.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":2,\"prompt\":{\"en\":\"What do the hidden years of Nazareth teach?\",\"vi\":\"Những năm ẩn dật ở Nadarét dạy điều gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Ordinary life can be holy\",\"vi\":\"Cuộc sống bình thường có thể nên thánh\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Only public years matter\",\"vi\":\"Chỉ những năm hoạt động công khai mới đáng kể\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"Thirty hidden years against three public ones. God’s own ratio says most of holiness is quiet.\",\"vi\":\"Ba mươi năm ẩn dật so với ba năm công khai. Tỷ lệ của chính Thiên Chúa nói rằng phần lớn sự thánh thiện là thầm lặng.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"practice\",\"title\":{\"en\":\"A Nazareth day\",\"vi\":\"Một ngày Nadarét\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"Choose one chore this week — washing dishes, making tea, folding clothes — and do it the Nazareth way: unhurried, with love, as if it mattered. It does.\",\"vi\":\"Hãy chọn một việc nhỏ trong tuần này — rửa chén, pha trà, gấp quần áo — và làm theo cách của Nadarét: không vội vã, với tình yêu, như thể nó quan trọng. Vì nó quan trọng thật.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"What is your most “Nazareth” hour of the day?\",\"vi\":\"Giờ nào trong ngày của bạn “Nadarét” nhất?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[531,533],\"note\":{\"en\":\"On the hidden life of Nazareth.\",\"vi\":\"Về đời sống ẩn dật ở Nadarét.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hl-5\",\"title\":{\"en\":\"Water into Wine\",\"vi\":\"Nước hóa thành rượu\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"cana-jars\",\"line\":{\"en\":\"Thirty years later. A wedding, an empty cellar, and a mother who notices.\",\"vi\":\"Ba mươi năm sau. Một tiệc cưới, hầm rượu cạn, và một người mẹ tinh ý.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"cana-jars\",\"text\":{\"en\":\"Jesus has grown up. At a village wedding in Cana, the unthinkable happens: the wine runs out. For the young couple, this means public shame on the happiest day of their lives.\",\"vi\":\"Chúa Giêsu đã trưởng thành. Tại một tiệc cưới làng quê ở Cana, điều khó xử xảy ra: rượu hết. Với đôi tân hôn, đó là nỗi xấu hổ trước mọi người, ngay trong ngày hạnh phúc nhất đời.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"cana-jars\",\"text\":{\"en\":\"Mary notices first — mothers always do. She tells Jesus simply: “They have no wine.” Then she turns to the servants with the best advice ever given: “Do whatever he tells you.”\",\"vi\":\"Mẹ Maria nhận ra trước tiên — những người mẹ luôn vậy. Mẹ nói với Chúa Giêsu thật ngắn: “Họ hết rượu rồi.” Rồi Mẹ quay sang các gia nhân với lời khuyên hay nhất từng có: “Người bảo gì, các anh cứ làm theo.”\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"cana-jars\",\"text\":{\"en\":\"Jesus points to six huge stone jars. “Fill them with water.” The servants pour — six hundred liters. And somewhere between the jar and the cup, the water becomes wine. The best wine of the feast.\",\"vi\":\"Chúa Giêsu chỉ vào sáu chum đá lớn. “Hãy đổ đầy nước.” Các gia nhân đổ vào — sáu trăm lít. Và đâu đó giữa chum và chén, nước đã trở thành rượu. Thứ rượu ngon nhất của bữa tiệc.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"cana-jars\",\"text\":{\"en\":\"This is the first {{miracle}} — and look where it happens: not in a temple, but at a party. Saving two newlyweds from embarrassment. God cares about joy.\",\"vi\":\"Đây là {{miracle}} đầu tiên — và hãy xem nó xảy ra ở đâu: không phải trong đền thờ, mà giữa một bữa tiệc. Để cứu đôi tân hôn khỏi ngượng ngùng. Thiên Chúa quan tâm đến niềm vui.\",\"viStatus\":\"unverified\"},\"terms\":[\"miracle\"]},{\"id\":\"c5\",\"art\":\"sky-flight\",\"text\":{\"en\":\"You are planning a wedding too. This story is the Church’s favorite to tell engaged couples: invite him, and the feast does not run dry.\",\"vi\":\"Bạn cũng đang chuẩn bị một đám cưới. Đây là câu chuyện Giáo hội thích kể nhất cho các đôi sắp cưới: hãy mời Ngài đến, và bữa tiệc sẽ không bao giờ cạn.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"predict\",\"afterCard\":1,\"prompt\":{\"en\":\"The wine is gone. What will Jesus do?\",\"vi\":\"Rượu đã hết. Chúa Giêsu sẽ làm gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Tell everyone to go home\",\"vi\":\"Bảo mọi người về nhà\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Quietly save the feast\",\"vi\":\"Lặng lẽ cứu lấy bữa tiệc\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"Quietly is the key. Only the servants knew. His greatest works rarely announce themselves.\",\"vi\":\"“Lặng lẽ” là từ then chốt. Chỉ các gia nhân biết. Những việc lớn nhất của Ngài hiếm khi phô trương.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"choice\",\"prompt\":{\"en\":\"What does Cana show about God?\",\"vi\":\"Tiệc cưới Cana cho thấy điều gì về Thiên Chúa?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"He only cares about serious religious things\",\"vi\":\"Ngài chỉ quan tâm đến những việc đạo nghiêm trang\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Human joy matters to him\",\"vi\":\"Niềm vui của con người quan trọng với Ngài\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"The first miracle protected a celebration. Joy is not a distraction from faith — it is one of its homes.\",\"vi\":\"Phép lạ đầu tiên là để gìn giữ một niềm vui. Niềm vui không làm xao lãng đức tin — nó là một mái nhà của đức tin.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"practice\",\"title\":{\"en\":\"Mary’s advice\",\"vi\":\"Lời khuyên của Mẹ Maria\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"“Do whatever he tells you.” Five words to carry anywhere. When you do not know how to pray, simply tell him what is missing — “they have no wine” — and leave it with him.\",\"vi\":\"“Người bảo gì, cứ làm theo.” Một câu để mang theo bất cứ đâu. Khi không biết cầu nguyện thế nào, bạn chỉ cần nói với Ngài điều đang thiếu — “họ hết rượu rồi” — và phó thác cho Ngài.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"What is running low in your life right now?\",\"vi\":\"Điều gì trong đời bạn đang dần cạn?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[1613,2618],\"note\":{\"en\":\"On Cana, marriage, and Mary’s intercession.\",\"vi\":\"Về Cana, hôn nhân, và lời chuyển cầu của Mẹ Maria.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hl-6\",\"title\":{\"en\":\"The Father Who Runs\",\"vi\":\"Người cha chạy ra đón\",\"viStatus\":\"unverified\"},\"minutes\":5,\"door\":{\"art\":\"prodigal-embrace\",\"line\":{\"en\":\"Jesus told stories. This one, people say, is the most beautiful short story ever written.\",\"vi\":\"Chúa Giêsu kể chuyện. Câu chuyện này, người ta nói, là truyện ngắn đẹp nhất từng được viết.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"prodigal-embrace\",\"text\":{\"en\":\"A {{parable}}: a man has two sons. The younger one says: give me my inheritance now. In that culture, it meant: Father, to me you are already dead.\",\"vi\":\"Một {{parable}}: người kia có hai con trai. Đứa em nói: xin cha chia gia tài cho con bây giờ. Trong văn hóa ấy, câu đó nghĩa là: thưa cha, với con, cha như đã chết rồi.\",\"viStatus\":\"unverified\"},\"terms\":[\"parable\"]},{\"id\":\"c2\",\"art\":\"samaritan-road\",\"text\":{\"en\":\"The father lets him go. The son travels far, spends everything, and ends up feeding pigs — hungry enough to envy their food. At the bottom, he rehearses a speech: Father, I am not worthy to be called your son. Take me as a servant.\",\"vi\":\"Người cha để con đi. Đứa con đi xa, tiêu sạch tất cả, rồi phải đi chăn heo — đói đến mức thèm cả thức ăn của heo. Dưới đáy vực, cậu tập dượt một bài nói: Thưa cha, con không đáng được gọi là con của cha nữa. Xin nhận con như một người làm công.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"prodigal-embrace\",\"text\":{\"en\":\"He turns toward home. And then, the line that changes everything.\",\"vi\":\"Cậu quay về nhà. Và rồi, câu văn thay đổi tất cả.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"Luke 15:20\",\"verse\":{\"en\":\"While he was still far away, his father saw him and was filled with compassion. He ran to his son, embraced him, and kissed him.\",\"vi\":\"Khi cậu còn ở đằng xa, người cha đã trông thấy, chạnh lòng thương, chạy ra ôm chầm lấy con mà hôn.\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"“While he was still far away” — the father had been watching the road the whole time. Dignified old men did not run in that world. This one runs.\",\"vi\":\"“Khi cậu còn ở đằng xa” — nghĩa là người cha đã dõi nhìn con đường ấy suốt bao ngày. Ở xứ đó, các bậc trưởng lão không bao giờ chạy. Người cha này đã chạy.\",\"viStatus\":\"unverified\"}}},{\"id\":\"c4\",\"art\":\"prodigal-embrace\",\"text\":{\"en\":\"The son starts his speech — and the father talks over him. Bring the best robe! A ring! A feast! The rehearsed words about being a servant are never finished. He came back a servant; he is received as a son.\",\"vi\":\"Đứa con bắt đầu bài nói đã tập — nhưng người cha nói át đi. Mau đem áo đẹp nhất ra đây! Xỏ nhẫn vào tay! Mở tiệc ăn mừng! Những lời tập dượt về việc làm công không bao giờ được nói hết. Cậu trở về như một người làm công; cậu được đón nhận như một người con.\",\"viStatus\":\"unverified\"}},{\"id\":\"c5\",\"art\":\"prodigal-embrace\",\"text\":{\"en\":\"Jesus is describing his Father. Yours. This is what God is like when someone turns around: not arms crossed, but arms open, already running. The Church calls it {{mercy}}.\",\"vi\":\"Chúa Giêsu đang mô tả Cha của Ngài. Cũng là Cha của bạn. Thiên Chúa là như thế khi một người quay về: không khoanh tay, mà dang rộng vòng tay, và đã chạy ra từ trước. Giáo hội gọi đó là {{mercy}}.\",\"viStatus\":\"unverified\"},\"terms\":[\"mercy\"]}],\"questions\":[{\"id\":\"q1\",\"kind\":\"predict\",\"afterCard\":1,\"prompt\":{\"en\":\"The son is coming home with his speech prepared. How will the father receive him?\",\"vi\":\"Đứa con đang về nhà với bài nói đã chuẩn bị. Người cha sẽ đón cậu thế nào?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"He runs to embrace him before the speech\",\"vi\":\"Ông chạy ra ôm con trước cả khi nghe bài nói\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"He listens, then accepts him as a servant\",\"vi\":\"Ông lắng nghe, rồi nhận cậu làm người làm công\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"He turns him away to teach a lesson\",\"vi\":\"Ông đuổi đi để dạy cho một bài học\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"Mercy does not wait for the apology to finish. It is already running down the road.\",\"vi\":\"Lòng thương xót không đợi lời xin lỗi nói xong. Nó đã chạy ra giữa đường từ trước.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"choice\",\"prompt\":{\"en\":\"What is this parable really about?\",\"vi\":\"Dụ ngôn này thật ra nói về điều gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"How to manage an inheritance\",\"vi\":\"Cách quản lý gia tài\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"What God the Father is like\",\"vi\":\"Thiên Chúa Cha là Đấng như thế nào\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"Every parable is a window. This one looks straight into the Father’s heart.\",\"vi\":\"Mỗi dụ ngôn là một ô cửa sổ. Ô cửa này nhìn thẳng vào trái tim của Chúa Cha.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"word\",\"termId\":\"mercy\",\"note\":{\"en\":\"The most important word in this whole world of lessons. If you remember one thing from this road, let it be the father, running.\",\"vi\":\"Từ quan trọng nhất trong cả chặng đường này. Nếu bạn chỉ nhớ một điều từ con đường này, hãy nhớ hình ảnh người cha đang chạy.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Is there a road you have been afraid to walk back down?\",\"vi\":\"Có con đường nào bạn vẫn sợ phải quay bước trở về?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[1439],\"note\":{\"en\":\"The prodigal son as the picture of conversion and mercy.\",\"vi\":\"Dụ ngôn người con hoang đàng là bức tranh về sự hoán cải và lòng thương xót.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hl-7\",\"title\":{\"en\":\"The Stranger on the Road\",\"vi\":\"Người lạ trên đường\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"samaritan-road\",\"line\":{\"en\":\"“And who is my neighbor?” a lawyer asks, hoping for a short list. Jesus answers with a road.\",\"vi\":\"“Nhưng ai là người thân cận của tôi?” một luật sĩ hỏi, mong nhận được một danh sách ngắn. Chúa Giêsu trả lời bằng một con đường.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"samaritan-road\",\"text\":{\"en\":\"A man travels the steep road from Jerusalem to Jericho. Robbers beat him, take everything, and leave him half dead in the dust.\",\"vi\":\"Một người đi trên con đường dốc từ Giêrusalem xuống Giêricô. Bọn cướp đánh ông, lấy sạch mọi thứ, và bỏ mặc ông dở sống dở chết bên vệ đường.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"samaritan-road\",\"text\":{\"en\":\"A priest comes by — and crosses to the other side. A temple worker does the same. Both are respectable. Both are busy. Both keep walking.\",\"vi\":\"Một tư tế đi ngang — và tránh sang bên kia đường. Một thầy trợ tế cũng làm y như vậy. Cả hai đều đáng kính. Cả hai đều bận rộn. Cả hai đều bước tiếp.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"samaritan-road\",\"text\":{\"en\":\"Then comes a Samaritan — a foreigner, from a people the listeners despised. He sees the wounded man, and he stops. He cleans the wounds, lifts him onto his own donkey, pays for his lodging, and promises to return.\",\"vi\":\"Rồi một người Samari đi tới — một người ngoại bang, thuộc dân tộc mà người nghe vốn khinh ghét. Ông thấy người bị nạn, và ông dừng lại. Ông rửa vết thương, đỡ người ấy lên lưng lừa của mình, trả tiền trọ, và hứa sẽ quay lại.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"samaritan-road\",\"text\":{\"en\":\"“Which of the three was a neighbor to the wounded man?” Jesus asks. The lawyer cannot even say “the Samaritan” — he answers, “the one who showed mercy.” Jesus says: Go and do the same.\",\"vi\":\"“Trong ba người, ai là người thân cận của kẻ bị nạn?” Chúa Giêsu hỏi. Vị luật sĩ thậm chí không nói nổi chữ “người Samari” — ông đáp: “kẻ đã tỏ lòng thương.” Chúa Giêsu nói: Hãy đi và làm như vậy.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"Luke 10:36–37\",\"verse\":{\"en\":\"“Which one was a neighbor to the man?” — “The one who showed him mercy.” — “Go and do the same.”\",\"vi\":\"“Ai là người thân cận của người ấy?” — “Kẻ đã tỏ lòng thương với ông ta.” — “Hãy đi, và cũng làm như vậy.”\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"Jesus flips the question. Not “who counts as my neighbor?” but “will I be one?” A neighbor is not found. A neighbor is chosen — by stopping.\",\"vi\":\"Chúa Giêsu lật ngược câu hỏi. Không phải “ai đáng là người thân cận của tôi?” mà là “tôi có trở thành người thân cận không?” Người thân cận không phải được tìm thấy. Mà được chọn — bằng việc dừng lại.\",\"viStatus\":\"unverified\"},\"bridge\":{\"en\":\"You work in a metal tube full of strangers. Few people on earth get more chances to stop for someone than you do.\",\"vi\":\"Bạn làm việc trong một ống kim loại đầy người xa lạ. Ít ai trên đời có nhiều cơ hội dừng lại vì một người như bạn.\",\"viStatus\":\"unverified\"}}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"predict\",\"afterCard\":1,\"prompt\":{\"en\":\"Two respected religious men have passed by. Who will stop?\",\"vi\":\"Hai người đạo mạo đáng kính đã đi qua. Ai sẽ là người dừng lại?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"A third, even holier priest\",\"vi\":\"Một vị tư tế thứ ba, thánh thiện hơn nữa\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"A despised foreigner\",\"vi\":\"Một người ngoại bang bị khinh miệt\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"Jesus chose the hero his listeners would least accept. Mercy ignores every border we draw.\",\"vi\":\"Chúa Giêsu chọn người hùng mà thính giả khó chấp nhận nhất. Lòng thương xót không màng mọi ranh giới ta vạch ra.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"order\",\"prompt\":{\"en\":\"Put the Samaritan’s mercy in order.\",\"vi\":\"Sắp xếp các bước của lòng thương xót theo thứ tự.\",\"viStatus\":\"unverified\"},\"items\":[{\"en\":\"He sees the wounded man\",\"vi\":\"Ông thấy người bị nạn\",\"viStatus\":\"unverified\"},{\"en\":\"He stops\",\"vi\":\"Ông dừng lại\",\"viStatus\":\"unverified\"},{\"en\":\"He treats the wounds\",\"vi\":\"Ông băng bó vết thương\",\"viStatus\":\"unverified\"},{\"en\":\"He carries him to safety\",\"vi\":\"Ông đưa người ấy đến nơi an toàn\",\"viStatus\":\"unverified\"},{\"en\":\"He promises to come back\",\"vi\":\"Ông hứa sẽ quay lại\",\"viStatus\":\"unverified\"}],\"why\":{\"en\":\"Mercy is a sequence, and it starts small: seeing, then stopping. Everything else follows from those two.\",\"vi\":\"Lòng thương xót là một chuỗi hành động, bắt đầu thật nhỏ: nhìn thấy, rồi dừng lại. Mọi điều khác đều theo sau hai bước ấy.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"practice\",\"title\":{\"en\":\"This week: stop once\",\"vi\":\"Tuần này: dừng lại một lần\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"One passenger, one stranger, one colleague having a hidden bad day. See them. Stop for thirty seconds. That is the whole assignment.\",\"vi\":\"Một hành khách, một người lạ, một đồng nghiệp đang âm thầm có một ngày tồi tệ. Hãy nhìn thấy họ. Dừng lại ba mươi giây. Bài tập chỉ có vậy thôi.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Who stopped for you, once?\",\"vi\":\"Ai đã từng dừng lại vì bạn?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[1825],\"note\":{\"en\":\"On love of neighbor, even the enemy.\",\"vi\":\"Về tình yêu người thân cận, kể cả kẻ thù.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hl-8\",\"title\":{\"en\":\"Bread on the Hill, Feet on the Sea\",\"vi\":\"Bánh trên đồi, bước chân trên biển\",\"viStatus\":\"unverified\"},\"minutes\":5,\"door\":{\"art\":\"loaves-fishes\",\"line\":{\"en\":\"Five thousand hungry people, one boy’s lunch, and a night of high waves.\",\"vi\":\"Năm ngàn người đói, phần ăn trưa của một cậu bé, và một đêm sóng lớn.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"teacher-hill\",\"text\":{\"en\":\"Crowds follow Jesus everywhere now — the sick, the curious, the hopeful. One evening, far from any town, five thousand of them are hungry, and there is nothing to eat.\",\"vi\":\"Giờ đây đám đông theo Chúa Giêsu khắp nơi — người bệnh, người tò mò, người hy vọng. Một buổi chiều, xa mọi làng mạc, năm ngàn người đói, và chẳng có gì để ăn.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"loaves-fishes\",\"text\":{\"en\":\"All they can find is one boy’s lunch: five small loaves, two fish. Jesus takes it, gives thanks, breaks the bread — and the baskets keep filling. Everyone eats. Twelve baskets are left over.\",\"vi\":\"Tất cả những gì tìm được là phần ăn của một cậu bé: năm chiếc bánh nhỏ, hai con cá. Chúa Giêsu cầm lấy, tạ ơn, bẻ bánh — và những chiếc giỏ cứ đầy mãi. Mọi người đều được ăn no. Còn dư mười hai giỏ.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"loaves-fishes\",\"text\":{\"en\":\"Notice the pattern: he takes, gives thanks, breaks, and gives. Hold onto those four movements. You will meet them again at every Mass for the rest of your life.\",\"vi\":\"Hãy để ý trình tự: Ngài cầm lấy, tạ ơn, bẻ ra, và trao đi. Hãy ghi nhớ bốn động tác ấy. Bạn sẽ gặp lại chúng trong mỗi Thánh lễ suốt cả cuộc đời.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"storm-sea\",\"text\":{\"en\":\"That same night, the friends row across the lake without him. A storm rises. Hours of fighting the waves, going nowhere. Then, through the spray, they see a figure — walking on the sea.\",\"vi\":\"Ngay đêm đó, các môn đệ chèo thuyền qua hồ mà không có Ngài. Bão nổi lên. Hàng giờ vật lộn với sóng, không tiến được. Rồi, qua màn nước tung tóe, họ thấy một bóng người — đang đi trên mặt biển.\",\"viStatus\":\"unverified\"}},{\"id\":\"c5\",\"art\":\"storm-sea\",\"text\":{\"en\":\"They scream. And the figure speaks.\",\"vi\":\"Họ kêu thét lên. Và bóng người ấy cất tiếng.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"Matthew 14:27\",\"verse\":{\"en\":\"Take courage. It is I. Do not be afraid.\",\"vi\":\"Cứ yên tâm, chính Thầy đây, đừng sợ!\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"The storm does not stop right away — but suddenly they are not alone in it. That changes everything before anything changes.\",\"vi\":\"Cơn bão chưa dừng ngay — nhưng bỗng nhiên họ không còn đơn độc giữa bão nữa. Điều đó thay đổi tất cả, trước cả khi điều gì khác thay đổi.\",\"viStatus\":\"unverified\"},\"bridge\":{\"en\":\"You have flown through storms and told frightened passengers, with a calm voice, that it will be all right. That voice, in the storm, is his specialty.\",\"vi\":\"Bạn đã từng bay qua giông bão và trấn an hành khách bằng một giọng nói bình tĩnh rằng mọi sự sẽ ổn. Giọng nói ấy, giữa cơn bão, chính là điều Ngài làm giỏi nhất.\",\"viStatus\":\"unverified\"}}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"order\",\"afterCard\":2,\"prompt\":{\"en\":\"Put the four movements of the bread in order.\",\"vi\":\"Sắp xếp bốn động tác với tấm bánh theo thứ tự.\",\"viStatus\":\"unverified\"},\"items\":[{\"en\":\"He takes the bread\",\"vi\":\"Ngài cầm lấy bánh\",\"viStatus\":\"unverified\"},{\"en\":\"He gives thanks\",\"vi\":\"Ngài tạ ơn\",\"viStatus\":\"unverified\"},{\"en\":\"He breaks it\",\"vi\":\"Ngài bẻ ra\",\"viStatus\":\"unverified\"},{\"en\":\"He gives it away\",\"vi\":\"Ngài trao đi\",\"viStatus\":\"unverified\"}],\"why\":{\"en\":\"Take, thank, break, give. The Mass repeats these exact movements — this hillside was the rehearsal.\",\"vi\":\"Cầm lấy, tạ ơn, bẻ ra, trao đi. Thánh lễ lặp lại đúng những động tác này — sườn đồi ấy là buổi tập dượt.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"choice\",\"prompt\":{\"en\":\"What did Jesus say to the terrified friends in the boat?\",\"vi\":\"Chúa Giêsu nói gì với các môn đệ đang hoảng sợ trên thuyền?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"“Why did you sail without me?”\",\"vi\":\"“Sao các con ra khơi mà không có Thầy?”\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"“It is I. Do not be afraid.”\",\"vi\":\"“Chính Thầy đây, đừng sợ!”\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"“Row harder.”\",\"vi\":\"“Chèo mạnh nữa lên.”\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"“Do not be afraid” is the most repeated sentence in the whole Bible. Someone knew we would need to hear it often.\",\"vi\":\"“Đừng sợ” là câu được lặp lại nhiều nhất trong cả Kinh Thánh. Hẳn có Đấng biết chúng ta cần nghe câu ấy thường xuyên.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"art\",\"art\":\"loaves-fishes\",\"title\":{\"en\":\"The loaves and the fish\",\"vi\":\"Bánh và cá\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"One of the oldest Christian artworks in the world is a simple mosaic of loaves and fish, laid on a church floor at Tabgha by the very lake of this story, sixteen centuries ago.\",\"vi\":\"Một trong những tác phẩm Kitô giáo cổ nhất thế giới là bức khảm đơn sơ hình bánh và cá, đặt trên nền một nhà thờ ở Tabgha, ngay bên bờ hồ của câu chuyện này, từ mười sáu thế kỷ trước.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"What storm would you want him to walk into?\",\"vi\":\"Bạn muốn Ngài bước vào cơn bão nào của đời mình?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[547,548],\"note\":{\"en\":\"On miracles as signs of the kingdom, not magic.\",\"vi\":\"Về phép lạ là dấu chỉ của Nước Trời, không phải ma thuật.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hl-lake\",\"title\":{\"en\":\"The Lake\",\"vi\":\"Biển Hồ\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"storm-sea\",\"line\":{\"en\":\"The Sea of Galilee: thirteen miles of water where half the Gospel happened.\",\"vi\":\"Biển Hồ Galilê: hai mươi cây số mặt nước nơi một nửa Tin Mừng đã diễn ra.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"storm-sea\",\"text\":{\"en\":\"It is still there, and still working: fishermen still cast nets at dawn on the Sea of Galilee. On these shores Jesus called Peter and Andrew mid-haul: “Follow me, and I will make you fishers of men.”\",\"vi\":\"Hồ ấy vẫn còn đó, và vẫn đang lao động: những ngư phủ vẫn quăng lưới lúc rạng đông trên Biển Hồ Galilê. Trên những bờ hồ này, Chúa Giêsu đã gọi Phêrô và Anrê giữa mẻ lưới: “Hãy theo Thầy, Thầy sẽ làm cho các con thành những kẻ lưới người.”\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"loaves-fishes\",\"text\":{\"en\":\"Around this one lake: the hillside of the Beatitudes, the grass where five thousand ate, the waves he walked on, the shore where the risen Jesus cooked breakfast and asked Peter three times, “Do you love me?”\",\"vi\":\"Quanh một hồ nước này: sườn đồi của các Mối Phúc, bãi cỏ nơi năm ngàn người được ăn no, những con sóng Ngài đã bước lên, và bờ hồ nơi Chúa Phục Sinh nướng bữa sáng và hỏi Phêrô ba lần: “Con có yêu mến Thầy không?”\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"lake-evening\",\"text\":{\"en\":\"Pilgrims say the lake is the place where the Gospel feels nearest — because water does not change. The waves a pilgrim sees today are the waves they saw. Some places hold their stories the way the night sky holds its stars.\",\"vi\":\"Khách hành hương nói Biển Hồ là nơi Tin Mừng gần gũi nhất — vì nước không thay đổi. Những con sóng người hành hương thấy hôm nay chính là những con sóng họ đã thấy. Có những nơi giữ câu chuyện của mình như bầu trời đêm giữ những vì sao.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":1,\"prompt\":{\"en\":\"What did the risen Jesus ask Peter on this shore?\",\"vi\":\"Trên bờ hồ này, Chúa Phục Sinh hỏi Phêrô điều gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"“Do you love me?” — three times\",\"vi\":\"“Con có yêu mến Thầy không?” — ba lần\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"“Where were you on Friday?”\",\"vi\":\"“Hôm thứ Sáu con ở đâu?”\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"One question for each denial. Mercy does not interrogate the past; it asks about love, today.\",\"vi\":\"Một câu hỏi cho mỗi lần chối. Lòng thương xót không tra khảo quá khứ; nó chỉ hỏi về tình yêu, hôm nay.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"art\",\"art\":\"storm-sea\",\"title\":{\"en\":\"The Sea of Galilee\",\"vi\":\"Biển Hồ Galilê\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"Two hundred meters below sea level, ringed by hills — which is why storms drop onto it so suddenly, exactly as the Gospels describe. The geography keeps vouching for the story.\",\"vi\":\"Thấp hơn mực nước biển hai trăm mét, bốn bề là đồi núi — vì thế những cơn bão ập xuống hồ rất đột ngột, đúng như các sách Tin Mừng mô tả. Chính địa hình vẫn đang làm chứng cho câu chuyện.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Which lakeside story would you want to stand inside?\",\"vi\":\"Bạn muốn được đứng trong câu chuyện nào bên hồ?\",\"viStatus\":\"unverified\"}},{\"id\":\"hl-9\",\"title\":{\"en\":\"The King on a Donkey\",\"vi\":\"Vị Vua trên lưng lừa\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"palm-gate\",\"line\":{\"en\":\"Holy Week begins. The city sings — and the shadow of a cross already falls across the gate.\",\"vi\":\"Tuần Thánh bắt đầu. Cả thành phố hát vang — và bóng của một cây thập giá đã đổ xuống cổng thành.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"palm-gate\",\"text\":{\"en\":\"Jerusalem, the great feast of Passover. Jesus rides into the city — not on a warhorse, but on a young donkey, the animal of peace.\",\"vi\":\"Giêrusalem, đại lễ Vượt Qua. Chúa Giêsu tiến vào thành — không trên chiến mã, mà trên một con lừa con, loài vật của hòa bình.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"palm-gate\",\"text\":{\"en\":\"The crowds explode with joy. They tear branches from the palm trees and lay their cloaks on the road like a carpet for a king. “Hosanna!” they sing. “Blessed is he who comes in the name of the Lord!”\",\"vi\":\"Đám đông vỡ òa trong niềm vui. Họ bẻ cành lá vạn tuế, trải áo choàng xuống đường như thảm đón vua. “Hoan hô!” họ hát. “Chúc tụng Đấng nhân danh Chúa mà đến!”\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"palm-gate\",\"text\":{\"en\":\"This is Palm Sunday. Every year, one week before Easter, Catholics around the world hold real palm branches and sing those same words. The Church does not just remember this story — she walks into it.\",\"vi\":\"Đây là Chúa nhật Lễ Lá. Mỗi năm, một tuần trước Phục Sinh, người Công giáo khắp thế giới cầm cành lá thật trên tay và hát chính những lời ấy. Giáo hội không chỉ nhớ lại câu chuyện này — mà bước hẳn vào trong nó.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"lake-evening\",\"text\":{\"en\":\"But Jesus weeps as he rides. He knows what crowds are. Many voices singing Hosanna today will shout something very different by Friday.\",\"vi\":\"Nhưng Chúa Giêsu đã khóc khi tiến vào. Ngài biết lòng đám đông. Nhiều tiếng hát Hoan hô hôm nay, đến thứ Sáu sẽ gào lên những lời rất khác.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":1,\"prompt\":{\"en\":\"Why a donkey and not a warhorse?\",\"vi\":\"Vì sao là một con lừa mà không phải chiến mã?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"It was all he could afford\",\"vi\":\"Vì Ngài không đủ tiền thuê ngựa\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"He came as a king of peace, not of armies\",\"vi\":\"Vì Ngài đến như vị vua hòa bình, không phải vua chinh chiến\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"The prophets had promised exactly this: your king comes to you humble, riding on a donkey.\",\"vi\":\"Các ngôn sứ đã hứa đúng như vậy: vua của ngươi đến với ngươi cách khiêm hạ, cưỡi trên lưng lừa.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"predict\",\"prompt\":{\"en\":\"The whole city is singing his praise. What is coming next?\",\"vi\":\"Cả thành đang ca tụng Ngài. Điều gì sẽ đến tiếp theo?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"A coronation in the palace\",\"vi\":\"Một lễ đăng quang trong cung điện\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"The hardest week in the world’s story\",\"vi\":\"Tuần lễ khốc liệt nhất trong lịch sử thế giới\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"Between the palms and the cross lie only five days. The Church calls them Holy Week, and we will walk them slowly.\",\"vi\":\"Giữa cành lá và thập giá chỉ có năm ngày. Giáo hội gọi đó là Tuần Thánh, và chúng ta sẽ đi qua từng ngày thật chậm.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"art\",\"art\":\"palm-gate\",\"title\":{\"en\":\"The entry into Jerusalem\",\"vi\":\"Tiến vào Giêrusalem\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"In Giotto’s famous fresco of this scene, children climb the trees to see him. Look for the palms in any Catholic home — many keep them folded behind a cross all year.\",\"vi\":\"Trong bức bích họa nổi tiếng của Giotto về cảnh này, trẻ em trèo lên cây để nhìn Ngài. Hãy để ý những cành lá trong các gia đình Công giáo — nhiều nhà gài lá sau thánh giá suốt cả năm.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"When has a crowd swept you along — for good or not?\",\"vi\":\"Có khi nào đám đông cuốn bạn đi — theo hướng tốt hay không tốt?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[559,560],\"note\":{\"en\":\"On the messianic entrance into Jerusalem.\",\"vi\":\"Về cuộc tiến vào Giêrusalem của Đấng Mêsia.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hl-10\",\"title\":{\"en\":\"The Last Supper\",\"vi\":\"Bữa Tiệc Ly\",\"viStatus\":\"unverified\"},\"minutes\":5,\"door\":{\"art\":\"last-supper\",\"line\":{\"en\":\"Thursday night. An upstairs room, twelve friends, and a gift that will outlast the world.\",\"vi\":\"Đêm thứ Năm. Một căn phòng trên lầu, mười hai người bạn, và một món quà sẽ tồn tại lâu hơn cả thế giới.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"last-supper\",\"text\":{\"en\":\"Jesus knows it is his last evening. He gathers his closest friends for the Passover meal — the ancient supper remembering the night God freed Israel from slavery.\",\"vi\":\"Chúa Giêsu biết đây là buổi tối cuối cùng của mình. Ngài quy tụ những người bạn thân nhất cho bữa tiệc Vượt Qua — bữa ăn cổ xưa tưởng nhớ đêm Thiên Chúa giải thoát Israel khỏi kiếp nô lệ.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"last-supper\",\"text\":{\"en\":\"First, he does something shocking: he kneels and washes their feet — the job of the lowest servant. “I have given you an example,” he says. “Love one another as I have loved you.”\",\"vi\":\"Trước hết, Ngài làm một điều gây sửng sốt: Ngài quỳ xuống rửa chân cho họ — việc của người đầy tớ thấp nhất. “Thầy đã nêu gương cho các con,” Ngài nói. “Các con hãy yêu thương nhau như Thầy đã yêu thương các con.”\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"last-supper\",\"text\":{\"en\":\"Then he takes the bread. Takes, gives thanks, breaks, gives — the four movements from the hillside.\",\"vi\":\"Rồi Ngài cầm lấy bánh. Cầm lấy, tạ ơn, bẻ ra, trao đi — bốn động tác từ sườn đồi năm xưa.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"Luke 22:19–20\",\"verse\":{\"en\":\"“This is my body, given for you. Do this in memory of me.” And with the cup: “This is my blood, poured out for you.”\",\"vi\":\"“Đây là Mình Thầy, hiến dâng vì các con. Các con hãy làm việc này mà nhớ đến Thầy.” Và với chén rượu: “Đây là Máu Thầy, đổ ra cho các con.”\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"Not “this represents.” He says: this IS. Catholics have taken him at his word for two thousand years. This gift is the {{eucharist}} — and tomorrow, on the cross, he will keep the promise these words make tonight.\",\"vi\":\"Không phải “cái này tượng trưng.” Ngài nói: đây LÀ. Hai ngàn năm qua, người Công giáo tin đúng theo lời Ngài. Món quà này là {{eucharist}} — và ngày mai, trên thập giá, Ngài sẽ giữ trọn lời hứa mà những lời này nói ra đêm nay.\",\"viStatus\":\"unverified\"}},\"terms\":[\"eucharist\"]},{\"id\":\"c4\",\"art\":\"last-supper\",\"text\":{\"en\":\"“Do this in memory of me.” That one sentence built every Mass ever celebrated — including the Dutch one that moved you before you understood a word, and every Mass in Vietnamese tonight in Hà Nội.\",\"vi\":\"“Hãy làm việc này mà nhớ đến Thầy.” Một câu nói ấy đã dựng nên mọi Thánh lễ từng được cử hành — kể cả Thánh lễ tiếng Hà Lan từng làm bạn xúc động khi chưa hiểu một lời, và mọi Thánh lễ tiếng Việt đêm nay ở Hà Nội.\",\"viStatus\":\"unverified\"}},{\"id\":\"c5\",\"art\":\"gethsemane\",\"text\":{\"en\":\"They sing a hymn and walk out into the night, toward an olive garden called Gethsemane. One of the twelve has already slipped away, carrying thirty silver coins’ worth of betrayal.\",\"vi\":\"Họ hát một bài thánh ca rồi bước ra màn đêm, hướng về khu vườn ô liu tên là Ghếtsêmani. Một người trong nhóm mười hai đã lẻn đi từ trước, mang theo sự phản bội đáng giá ba mươi đồng bạc.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"tapArt\",\"afterCard\":3,\"prompt\":{\"en\":\"Look closer at the table.\",\"vi\":\"Hãy nhìn gần hơn bàn tiệc.\",\"viStatus\":\"unverified\"},\"art\":\"last-supper\",\"hotspots\":[{\"x\":50,\"y\":50,\"label\":{\"en\":\"The cup\",\"vi\":\"Chén rượu\",\"viStatus\":\"unverified\"},\"meaning\":{\"en\":\"Lifted at the center: “This is my blood.” At Mass, this moment is the holiest point of the week.\",\"vi\":\"Được nâng lên ở trung tâm: “Đây là Máu Thầy.” Trong Thánh lễ, đây là khoảnh khắc thánh thiêng nhất của cả tuần.\",\"viStatus\":\"unverified\"}},{\"x\":30,\"y\":64,\"label\":{\"en\":\"The bread\",\"vi\":\"Tấm bánh\",\"viStatus\":\"unverified\"},\"meaning\":{\"en\":\"Broken to be shared. The early Christians called the whole Mass simply “the breaking of the bread.”\",\"vi\":\"Được bẻ ra để chia sẻ. Các Kitô hữu đầu tiên gọi cả Thánh lễ đơn giản là “lễ bẻ bánh.”\",\"viStatus\":\"unverified\"}},{\"x\":50,\"y\":25,\"label\":{\"en\":\"The window\",\"vi\":\"Ô cửa sổ\",\"viStatus\":\"unverified\"},\"meaning\":{\"en\":\"Night outside. Everything that happens next happens in darkness — which makes this lamplit table glow brighter.\",\"vi\":\"Bên ngoài là đêm. Mọi điều xảy ra tiếp theo đều diễn ra trong bóng tối — càng làm bàn tiệc thắp đèn này sáng hơn.\",\"viStatus\":\"unverified\"}}]},{\"id\":\"q2\",\"kind\":\"choice\",\"prompt\":{\"en\":\"What did Jesus say over the bread?\",\"vi\":\"Chúa Giêsu nói gì trên tấm bánh?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"“This is a symbol of my body”\",\"vi\":\"“Đây là biểu tượng của Mình Thầy”\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"“This is my body, given for you”\",\"vi\":\"“Đây là Mình Thầy, hiến dâng vì các con”\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"The plain word “is” carries the whole Catholic faith in the Eucharist. We will spend a whole world (Paris) on what it means.\",\"vi\":\"Chữ “là” đơn sơ ấy mang trọn niềm tin Công giáo về Thánh Thể. Chúng ta sẽ dành cả một chặng đường (Paris) để hiểu ý nghĩa của nó.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"word\",\"termId\":\"eucharist\",\"note\":{\"en\":\"The word means “thanksgiving.” You now know where it was born: at a table, among friends, the night before the cross.\",\"vi\":\"Từ này có nghĩa là “tạ ơn.” Giờ bạn đã biết nó sinh ra ở đâu: nơi một bàn tiệc, giữa những người bạn, đêm trước thập giá.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Whose feet would you find hardest to wash?\",\"vi\":\"Bạn thấy khó nhất khi phải rửa chân cho ai?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[1337,1339,1340],\"note\":{\"en\":\"On the institution of the Eucharist.\",\"vi\":\"Về việc Chúa Giêsu thiết lập Bí tích Thánh Thể.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hl-11\",\"title\":{\"en\":\"The Garden and the Cross\",\"vi\":\"Khu vườn và Thánh giá\",\"viStatus\":\"unverified\"},\"minutes\":6,\"door\":{\"art\":\"gethsemane\",\"line\":{\"en\":\"The hardest part of the story. Walk it slowly. He walked it for you.\",\"vi\":\"Phần khó nhất của câu chuyện. Hãy đi thật chậm. Ngài đã đi quãng đường này vì bạn.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"gethsemane\",\"text\":{\"en\":\"In the olive garden, Jesus is afraid. Truly afraid — he sweats, he trembles, he asks his Father if there is any other way. Remember this when you are afraid: he knows the feeling from inside.\",\"vi\":\"Trong vườn ô liu, Chúa Giêsu sợ hãi. Sợ thật sự — Ngài đổ mồ hôi, run rẩy, và hỏi Cha xem có con đường nào khác không. Hãy nhớ điều này khi bạn sợ hãi: Ngài biết cảm giác ấy từ bên trong.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"gethsemane\",\"text\":{\"en\":\"Then he prays the bravest prayer there is: “Father, not my will, but yours be done.” Mary’s yes, spoken again in the dark. Torches appear among the trees. The betrayer greets him with a kiss.\",\"vi\":\"Rồi Ngài thưa lời cầu nguyện can đảm nhất: “Lạy Cha, xin đừng theo ý con, mà xin theo ý Cha.” Tiếng xin vâng của Mẹ Maria, được thốt lên lần nữa trong bóng tối. Đuốc sáng xuất hiện giữa rặng cây. Kẻ phản bội chào Ngài bằng một nụ hôn.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"cross-passion\",\"text\":{\"en\":\"The night collapses quickly: a rushed trial, false witnesses, an exhausted governor washing his hands. The crowd that sang Hosanna is given a choice — and shouts for a criminal to go free instead of him.\",\"vi\":\"Đêm ấy sụp đổ rất nhanh: một phiên xử vội vã, những nhân chứng giả, một quan tổng trấn mệt mỏi rửa tay chối bỏ trách nhiệm. Đám đông từng hát Hoan hô được trao quyền chọn — và đã gào lên đòi tha một tên tội phạm thay vì Ngài.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"cross-passion\",\"text\":{\"en\":\"They beat him, crown him with thorns, and make him carry his own cross up a hill called Golgotha. There, at noon, they nail him to it. He is thirty-three years old.\",\"vi\":\"Họ đánh đòn Ngài, đội vòng gai lên đầu Ngài, và bắt Ngài vác chính thập giá của mình lên ngọn đồi tên Gôngôtha. Tại đó, giữa trưa, họ đóng đinh Ngài vào thập giá. Ngài ba mươi ba tuổi.\",\"viStatus\":\"unverified\"}},{\"id\":\"c5\",\"art\":\"cross-passion\",\"text\":{\"en\":\"And from the cross, while they mock him, he speaks.\",\"vi\":\"Và từ trên thập giá, giữa những lời nhạo báng, Ngài cất tiếng.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"Luke 23:34\",\"verse\":{\"en\":\"Father, forgive them. They do not know what they are doing.\",\"vi\":\"Lạy Cha, xin tha cho họ, vì họ không biết việc họ làm.\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"His first words from the cross are mercy for the people killing him. This is the Father who runs — running even here.\",\"vi\":\"Những lời đầu tiên của Ngài trên thập giá là lòng thương xót dành cho chính những kẻ đang giết Ngài. Đây là người cha chạy ra đón — vẫn đang chạy, ngay cả ở đây.\",\"viStatus\":\"unverified\"}}},{\"id\":\"c6\",\"art\":\"cross-passion\",\"text\":{\"en\":\"At three in the afternoon, he cries out: “It is finished.” And he gives up his spirit. The sky darkens. A Roman soldier — a foreigner, an executioner — is the one who says it aloud: truly, this man was the Son of God.\",\"vi\":\"Ba giờ chiều, Ngài kêu lớn: “Mọi sự đã hoàn tất.” Và Ngài trao phó linh hồn. Bầu trời tối sầm. Một người lính Rôma — kẻ ngoại bang, kẻ hành hình — lại là người nói lớn điều ấy: quả thật, người này là Con Thiên Chúa.\",\"viStatus\":\"unverified\"}},{\"id\":\"c7\",\"art\":\"cross-dawn\",\"text\":{\"en\":\"Why did he do it? The Church’s answer is one sentence: there is no greater love than to lay down your life for those you love. The tree of the garden broke the world. This tree begins to mend it.\",\"vi\":\"Vì sao Ngài làm vậy? Câu trả lời của Giáo hội gói trong một câu: không có tình yêu nào lớn hơn tình yêu của người hiến mạng sống vì người mình yêu. Cái cây trong khu vườn xưa làm thế giới đổ vỡ. Cây thập giá này bắt đầu chữa lành nó.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":4,\"prompt\":{\"en\":\"What were Jesus’ first words from the cross?\",\"vi\":\"Lời đầu tiên của Chúa Giêsu trên thập giá là gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"“Father, forgive them”\",\"vi\":\"“Lạy Cha, xin tha cho họ”\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"“Why have you done this?”\",\"vi\":\"“Sao các ngươi làm điều này?”\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"“You will regret this”\",\"vi\":\"“Các ngươi sẽ phải hối hận”\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"Forgiveness, before anything else. The cross is mercy at full strength.\",\"vi\":\"Tha thứ, trước mọi điều khác. Thập giá là lòng thương xót ở mức trọn vẹn nhất.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"fill\",\"prompt\":{\"en\":\"The hardest line of the Our Father belongs to this day. Complete it.\",\"vi\":\"Câu khó nhất của Kinh Lạy Cha thuộc về ngày này. Hãy hoàn thành.\",\"viStatus\":\"unverified\"},\"before\":{\"en\":\"And forgive us our trespasses, as we\",\"vi\":\"Và tha nợ chúng con, như chúng con cũng\",\"viStatus\":\"unverified\"},\"after\":{\"en\":\"…\",\"vi\":\"…\",\"viStatus\":\"unverified\"},\"options\":[{\"en\":\"forgive those who trespass against us.\",\"vi\":\"tha kẻ có nợ chúng con.\",\"viStatus\":\"unverified\"},{\"en\":\"forget those who hurt us.\",\"vi\":\"quên những ai làm tổn thương mình.\",\"viStatus\":\"unverified\"},{\"en\":\"avoid those who trespass against us.\",\"vi\":\"tránh xa kẻ có lỗi với chúng con.\",\"viStatus\":\"unverified\"}],\"answer\":0,\"why\":{\"en\":\"He did not just teach the line. On Friday afternoon, he showed what it costs — and that it is possible.\",\"vi\":\"Ngài không chỉ dạy câu kinh ấy. Chiều thứ Sáu hôm đó, Ngài cho thấy cái giá của nó — và cho thấy nó là điều có thể.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"practice\",\"title\":{\"en\":\"For the hard days\",\"vi\":\"Cho những ngày khó khăn\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"A prayer of five words, for turbulence of any kind: “Father, into your hands.” It is the last thing Jesus said. It fits in one breath, anywhere.\",\"vi\":\"Một lời nguyện năm chữ, cho mọi loại giông bão: “Lạy Cha, trong tay Cha.” Đó là lời sau cùng của Chúa Giêsu. Vừa vặn trong một hơi thở, ở bất cứ đâu.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Stay with one image from this day. Which one?\",\"vi\":\"Hãy ở lại với một hình ảnh của ngày này. Hình ảnh nào?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[612,616,617],\"note\":{\"en\":\"On the agony, and the love that gave the cross its power.\",\"vi\":\"Về cơn hấp hối, và tình yêu làm nên sức mạnh của thập giá.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hl-12\",\"title\":{\"en\":\"The Silence and the Morning\",\"vi\":\"Sự thinh lặng và buổi sáng\",\"viStatus\":\"unverified\"},\"minutes\":5,\"door\":{\"art\":\"tomb-morning\",\"line\":{\"en\":\"Saturday: the longest silence in history. And then, before sunrise on the third day —\",\"vi\":\"Thứ Bảy: sự thinh lặng dài nhất lịch sử. Và rồi, trước bình minh ngày thứ ba —\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"prayer-night\",\"text\":{\"en\":\"They take his body down and lay it in a borrowed tomb, sealed with a great stone. Then comes Saturday. Nothing happens. God is silent. The friends hide behind locked doors, hollowed out by grief.\",\"vi\":\"Người ta hạ xác Ngài xuống, đặt trong một ngôi mộ mượn, chặn lại bằng tảng đá lớn. Rồi đến thứ Bảy. Không gì xảy ra. Thiên Chúa thinh lặng. Các môn đệ trốn sau những cánh cửa cài then, lòng rỗng hoác vì đau buồn.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"prayer-night\",\"text\":{\"en\":\"The Church keeps this silence every year on Holy Saturday. No Mass, bare altars. Because everyone, sooner or later, lives a Saturday: the day after the worst day, when heaven seems empty. The story honors that day instead of skipping it.\",\"vi\":\"Mỗi năm, Giáo hội giữ sự thinh lặng này vào Thứ Bảy Tuần Thánh. Không Thánh lễ, bàn thờ trống trơn. Vì ai rồi cũng có một ngày thứ Bảy như thế: ngày sau ngày tồi tệ nhất, khi trời cao dường như trống rỗng. Câu chuyện trân trọng ngày ấy thay vì bỏ qua nó.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"tomb-morning\",\"text\":{\"en\":\"Sunday, before dawn. Women come to the tomb with burial spices — Mary Magdalene first. She finds the great stone rolled away, and the tomb empty, and the cloth folded.\",\"vi\":\"Chúa nhật, trước rạng đông. Các phụ nữ mang dầu thơm ra mộ — bà Maria Mácđala đi đầu. Bà thấy tảng đá lớn đã lăn sang một bên, ngôi mộ trống không, và khăn liệm được xếp gọn.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"tomb-morning\",\"text\":{\"en\":\"She stands weeping in the garden, and a man she takes for the gardener asks why. Then he says one word: “Mary.” And she knows the voice.\",\"vi\":\"Bà đứng khóc trong khu vườn, và một người bà ngỡ là người làm vườn hỏi vì sao bà khóc. Rồi người ấy gọi một tiếng: “Maria.” Và bà nhận ra giọng nói ấy.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"John 20:16\",\"verse\":{\"en\":\"Jesus said to her, “Mary.” She turned and cried out, “Teacher!”\",\"vi\":\"Chúa Giêsu gọi bà: “Maria.” Bà quay lại và reo lên: “Lạy Thầy!”\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"Risen from death — not a ghost, not a memory, but alive, with a voice that says your name. This is the {{resurrection}}: the hinge on which all Christian hope turns.\",\"vi\":\"Sống lại từ cõi chết — không phải bóng ma, không phải ký ức, mà là Đấng đang sống, với giọng nói gọi đúng tên bạn. Đây là {{resurrection}}: bản lề mà mọi niềm hy vọng Kitô giáo xoay quanh.\",\"viStatus\":\"unverified\"}},\"terms\":[\"resurrection\"]},{\"id\":\"c5\",\"art\":\"tomb-morning\",\"text\":{\"en\":\"This morning is why churches face the sunrise, why Sunday is the Christian day, why the woman you saw crying at Mass can cry with hope. Death does not get the last word. He does.\",\"vi\":\"Buổi sáng này là lý do các nhà thờ hướng về phía mặt trời mọc, lý do Chúa nhật là ngày của Kitô hữu, lý do người phụ nữ bạn thấy khóc trong Thánh lễ có thể khóc trong hy vọng. Sự chết không có tiếng nói cuối cùng. Ngài mới có.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"order\",\"afterCard\":3,\"prompt\":{\"en\":\"Put the three sacred days in order.\",\"vi\":\"Sắp xếp ba ngày thánh theo thứ tự.\",\"viStatus\":\"unverified\"},\"items\":[{\"en\":\"Friday: the cross\",\"vi\":\"Thứ Sáu: thập giá\",\"viStatus\":\"unverified\"},{\"en\":\"Saturday: the silence\",\"vi\":\"Thứ Bảy: sự thinh lặng\",\"viStatus\":\"unverified\"},{\"en\":\"Sunday: the empty tomb\",\"vi\":\"Chúa nhật: ngôi mộ trống\",\"viStatus\":\"unverified\"}],\"why\":{\"en\":\"Cross, silence, morning. The Church calls these the Triduum — the three days at the heart of everything.\",\"vi\":\"Thập giá, thinh lặng, buổi sáng. Giáo hội gọi đó là Tam Nhật Thánh — ba ngày ở trung tâm của tất cả.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"choice\",\"prompt\":{\"en\":\"How did Mary Magdalene recognize the risen Jesus?\",\"vi\":\"Bà Maria Mácđala nhận ra Chúa Phục Sinh bằng cách nào?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"He said her name\",\"vi\":\"Ngài gọi tên bà\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"He showed identification\",\"vi\":\"Ngài đưa giấy tờ chứng minh\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"She saw the angels first\",\"vi\":\"Bà thấy các thiên thần trước\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"One name, spoken with love. The risen Lord still introduces himself this way — personally.\",\"vi\":\"Một cái tên, được gọi bằng tình yêu. Chúa Phục Sinh đến nay vẫn tỏ mình theo cách ấy — với từng người một.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"prayer\",\"prayerId\":\"glory-be\",\"note\":{\"en\":\"The Church’s shortest shout of joy, born from this morning. Pray it when something good and undeserved happens — a safe arrival, an unexpected sunrise.\",\"vi\":\"Tiếng reo vui ngắn nhất của Giáo hội, sinh ra từ buổi sáng này. Hãy đọc kinh ấy khi một điều tốt lành bất ngờ xảy đến — một chuyến đi bình an, một bình minh không hẹn trước.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"What would change, if death does not get the last word?\",\"vi\":\"Điều gì sẽ thay đổi, nếu sự chết không có tiếng nói cuối cùng?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[624,638,640],\"note\":{\"en\":\"On Holy Saturday and the empty tomb.\",\"vi\":\"Về Thứ Bảy Tuần Thánh và ngôi mộ trống.\",\"viStatus\":\"unverified\"}}},{\"id\":\"hl-tomb\",\"title\":{\"en\":\"The Empty Tomb, Today\",\"vi\":\"Ngôi mộ trống, hôm nay\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"jerusalem-city\",\"line\":{\"en\":\"In the middle of Jerusalem’s old city stands a church built around a tomb — because of what is not in it.\",\"vi\":\"Giữa lòng phố cổ Giêrusalem là một ngôi nhà thờ xây quanh một ngôi mộ — vì điều không còn ở trong đó.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"jerusalem-city\",\"text\":{\"en\":\"The Church of the Holy Sepulchre covers both Golgotha and the tomb — the hill of the cross and the garden grave, a hundred meters apart, under one roof since the year 335.\",\"vi\":\"Nhà thờ Mộ Thánh bao trùm cả Gôngôtha lẫn ngôi mộ — ngọn đồi thập giá và phần mộ trong vườn, cách nhau trăm mét, dưới cùng một mái từ năm 335.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"tomb-morning\",\"text\":{\"en\":\"Pilgrims queue for hours to stoop into a small stone room and touch a shelf of rock where, for one Sabbath, the body of Jesus lay. The room is famous for being empty.\",\"vi\":\"Khách hành hương xếp hàng nhiều giờ để cúi mình bước vào một gian đá nhỏ và chạm vào phiến đá nơi thân xác Chúa Giêsu đã nằm, trong một ngày Sabát duy nhất. Căn phòng ấy nổi tiếng vì nó trống không.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"candle-single\",\"text\":{\"en\":\"Every Easter, the church fills for the ancient vigil; candles pass flame to flame out the doors and into the streets — the same gesture as every baptism night, at the place where the morning began.\",\"vi\":\"Mỗi lễ Phục Sinh, nhà thờ chật kín cho đêm canh thức cổ xưa; những ngọn nến chuyền lửa cho nhau ra tận cửa và tràn xuống các con phố — cùng một cử chỉ như mọi đêm Rửa tội, tại chính nơi buổi sáng ấy đã bắt đầu.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"cathedral-door\",\"text\":{\"en\":\"Few pilgrims ever stand in Jerusalem in person. It does not matter as much as it sounds: every altar in the world is connected to that empty shelf of stone. Whoever kneels at one has already arrived.\",\"vi\":\"Ít người hành hương có dịp đặt chân đến Giêrusalem. Nhưng điều đó không quan trọng như ta tưởng: mọi bàn thờ trên thế giới đều nối liền với phiến đá trống ấy. Ai quỳ trước một bàn thờ là đã đến nơi rồi.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":1,\"prompt\":{\"en\":\"Why is the small stone room the most visited place in Christianity?\",\"vi\":\"Vì sao gian đá nhỏ ấy là nơi được viếng thăm nhiều nhất của Kitô giáo?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Because of what is not in it\",\"vi\":\"Vì điều không còn ở trong đó\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Because of its architecture\",\"vi\":\"Vì kiến trúc của nó\",
