me\":{\"en\":\"Beginning\",\"vi\":\"Khởi đầu\",\"viStatus\":\"unverified\"},\"church\":{\"en\":\"Mount Sinai\",\"vi\":\"Núi Sinai\",\"viStatus\":\"unverified\"},\"place\":{\"en\":\"The Desert\",\"vi\":\"Sa mạc\",\"viStatus\":\"unverified\"},\"theme\":{\"en\":\"Who is God?\",\"vi\":\"Thiên Chúa là ai?\",\"viStatus\":\"unverified\"},\"lessons\":[{\"id\":\"sinai-1\",\"title\":{\"en\":\"The Burning Bush\",\"vi\":\"Bụi gai bốc cháy\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"sinai-bush\",\"line\":{\"en\":\"Night in the desert. A bush is on fire — and it is not burning away.\",\"vi\":\"Đêm giữa sa mạc. Một bụi gai đang bốc cháy — mà không hề tàn lụi.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"sinai-mountain\",\"text\":{\"en\":\"Every pilgrimage starts somewhere. Ours starts at the foot of a mountain in the desert, where a shepherd named Moses saw something impossible and walked toward it.\",\"vi\":\"Mọi cuộc hành hương đều khởi đầu từ một nơi nào đó. Hành trình của chúng ta bắt đầu dưới chân một ngọn núi giữa sa mạc, nơi một người chăn chiên tên Môsê thấy một điều không thể tin nổi — và đã bước về phía nó.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"sinai-bush\",\"text\":{\"en\":\"A bush, on fire, yet not consumed. And out of the fire, a voice that knew his name: “Moses, Moses. Take off your sandals — the ground you stand on is holy.”\",\"vi\":\"Một bụi gai, bốc cháy, mà không hề thiêu rụi. Và từ giữa ngọn lửa, một tiếng nói biết rõ tên ông: “Môsê, Môsê. Hãy cởi dép ra — nơi ngươi đang đứng là đất thánh.”\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"sinai-bush\",\"text\":{\"en\":\"Moses asked the fire its name. The answer was unlike anything ever spoken: “I AM WHO AM.” Not a force. Not an idea. Someone — who is, who knows you, and who wanted you to exist.\",\"vi\":\"Môsê hỏi tên của ngọn lửa. Câu trả lời không giống bất cứ điều gì từng được nói ra: “TA LÀ ĐẤNG HẰNG HỮU.” Không phải một sức mạnh vô hình. Không phải một ý niệm. Mà là một Đấng — đang hiện hữu, biết rõ bạn, và muốn bạn hiện hữu.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"creation-light\",\"text\":{\"en\":\"Centuries later, the Bible would say who this someone is, in three small words.\",\"vi\":\"Nhiều thế kỷ sau, Kinh Thánh sẽ nói rõ Đấng ấy là ai, trong mấy chữ thật ngắn.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"1 John 4:8\",\"verse\":{\"en\":\"God is love.\",\"vi\":\"Thiên Chúa là tình yêu.\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"Everything else the Church teaches begins here. Before anything existed, there was love. God does not just have love — he is love.\",\"vi\":\"Mọi điều Giáo hội dạy đều bắt đầu từ đây. Trước khi có bất cứ điều gì, đã có tình yêu. Thiên Chúa không chỉ có tình yêu — Ngài chính là tình yêu.\",\"viStatus\":\"unverified\"},\"bridge\":{\"en\":\"The peace some people feel inside a great church, or under a night sky — that is not the stone or the stars. It is the one they were made by.\",\"vi\":\"Sự bình an mà nhiều người cảm nhận trong một ngôi nhà thờ lớn, hay dưới bầu trời đêm — không đến từ đá hay những vì sao. Mà từ Đấng đã làm nên chúng.\",\"viStatus\":\"unverified\"}}},{\"id\":\"c5\",\"art\":\"sinai-bush\",\"text\":{\"en\":\"Jesus gave God another name. He said: call him Father.\",\"vi\":\"Chúa Giêsu cho chúng ta một tên gọi khác của Thiên Chúa. Ngài nói: hãy gọi Ngài là Cha.\",\"viStatus\":\"unverified\"},\"branch\":{\"prompt\":{\"en\":\"If you could ask one thing at this fire, what would it be?\",\"vi\":\"Nếu được hỏi một điều bên ngọn lửa này, bạn sẽ hỏi gì?\",\"viStatus\":\"unverified\"},\"choices\":[{\"label\":{\"en\":\"“Are you really there?”\",\"vi\":\"“Ngài có thật không?”\",\"viStatus\":\"unverified\"},\"response\":{\"en\":\"An honest question. The whole road ahead is the answer, walked one step at a time. You are allowed to ask it the entire way.\",\"vi\":\"Một câu hỏi chân thành. Cả con đường phía trước là câu trả lời, đi từng bước một. Bạn được phép hỏi câu ấy suốt cả hành trình.\",\"viStatus\":\"unverified\"}},{\"label\":{\"en\":\"“Do you know my family?”\",\"vi\":\"“Ngài có biết gia đình con không?”\",\"viStatus\":\"unverified\"},\"response\":{\"en\":\"He does. Every name you pray for when you ask for their safety — he hears each one.\",\"vi\":\"Ngài biết. Mỗi cái tên bạn nhắc đến khi cầu mong bình an cho họ — Ngài nghe từng tên một.\",\"viStatus\":\"unverified\"}},{\"label\":{\"en\":\"“Why am I here?”\",\"vi\":\"“Sao con lại ở đây?”\",\"viStatus\":\"unverified\"},\"response\":{\"en\":\"Maybe the same reason the bush kept burning. Some invitations are quiet.\",\"vi\":\"Có lẽ cùng một lý do khiến bụi gai cứ cháy mãi. Có những lời mời rất thầm lặng.\",\"viStatus\":\"unverified\"}}]}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":3,\"prompt\":{\"en\":\"What do Catholics believe God is, before anything else?\",\"vi\":\"Trước hết, người Công giáo tin Thiên Chúa là gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"A set of rules\",\"vi\":\"Một bộ luật lệ\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Love itself\",\"vi\":\"Chính là tình yêu\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"A distant force\",\"vi\":\"Một sức mạnh xa vời\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"“God is love” — the rest of the faith grows out of this one line.\",\"vi\":\"“Thiên Chúa là tình yêu” — mọi điều khác của đức tin lớn lên từ câu này.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"choice\",\"prompt\":{\"en\":\"What name did Jesus tell us to use for God?\",\"vi\":\"Chúa Giêsu dạy chúng ta gọi Thiên Chúa bằng tên nào?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Master\",\"vi\":\"Chủ nhân\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Judge\",\"vi\":\"Quan tòa\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Father\",\"vi\":\"Cha\",\"viStatus\":\"unverified\"}}],\"answer\":2,\"why\":{\"en\":\"Father. Not a far-away king — family.\",\"vi\":\"Cha. Không phải một vị vua xa cách — mà là người nhà.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"prayer\",\"prayerId\":\"sign-of-the-cross\",\"note\":{\"en\":\"Your first prayer. Touch your forehead, your heart, your left shoulder, your right. You are tracing a cross over yourself — a quiet way of saying: I am here, with him.\",\"vi\":\"Lời kinh đầu tiên của bạn. Chạm trán, chạm ngực, vai trái, rồi vai phải. Bạn đang vẽ một Thánh giá trên chính mình — một cách thầm lặng để nói: con đang ở đây, với Ngài.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"What stayed with you today?\",\"vi\":\"Điều gì còn đọng lại trong bạn hôm nay?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[205,218,221,239],\"note\":{\"en\":\"On the name of God, and God as love and as Father.\",\"vi\":\"Về danh Thiên Chúa, và Thiên Chúa là tình yêu và là Cha.\",\"viStatus\":\"unverified\"}}},{\"id\":\"sinai-2\",\"title\":{\"en\":\"In the Beginning\",\"vi\":\"Lúc khởi đầu\",\"viStatus\":\"unverified\"},\"minutes\":5,\"door\":{\"art\":\"creation-light\",\"line\":{\"en\":\"Before the city, before the sea, before light itself. The very first story.\",\"vi\":\"Trước thành phố, trước biển khơi, trước cả ánh sáng. Câu chuyện đầu tiên của muôn loài.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"creation-light\",\"text\":{\"en\":\"The Bible opens with darkness. No stars, no sky, no sound. And then a voice.\",\"vi\":\"Kinh Thánh mở đầu bằng bóng tối. Không sao trời, không bầu trời, không một âm thanh. Rồi một tiếng nói vang lên.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"Genesis 1:1–3\",\"verse\":{\"en\":\"In the beginning, God made the heavens and the earth. God said, “Let there be light” — and there was light.\",\"vi\":\"Lúc khởi đầu, Thiên Chúa dựng nên trời và đất. Thiên Chúa phán: “Phải có ánh sáng” — và liền có ánh sáng.\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"Everything that exists began as a gift. God did not need the world. He wanted it.\",\"vi\":\"Mọi sự hiện hữu đều khởi đầu như một món quà. Thiên Chúa không cần thế giới này. Ngài muốn nó.\",\"viStatus\":\"unverified\"},\"original\":\"In the beginning God created heaven, and earth. … And God said: Be light made. And light was made. (Douay–Rheims)\"}},{\"id\":\"c2\",\"art\":\"creation-world\",\"text\":{\"en\":\"Day by day, the story unfolds like a song. Sky and sea. Land and green things growing. Sun, moon, and a sky full of stars.\",\"vi\":\"Ngày qua ngày, câu chuyện mở ra như một bài ca. Bầu trời và biển cả. Đất liền và cây cỏ xanh tươi. Mặt trời, mặt trăng, và một bầu trời đầy sao.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"creation-world\",\"text\":{\"en\":\"Then fish for the seas, birds for the air, animals for the land. And after each day, God looks at what he has made and says the same thing: it is good.\",\"vi\":\"Rồi cá cho biển, chim cho trời, muông thú cho mặt đất. Sau mỗi ngày, Thiên Chúa nhìn những gì Ngài đã dựng nên và nói cùng một điều: thật là tốt đẹp.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"sky-flight\",\"text\":{\"en\":\"You have seen the earth the way few people ever see it — from above, with the clouds below you like a white sea. The story says all of it was spoken into being, with care.\",\"vi\":\"Bạn đã thấy trái đất theo cách ít ai từng thấy — từ trên cao, với mây trắng trải dưới chân như một biển bông. Câu chuyện kể rằng tất cả được tạo thành bằng lời phán, với tình thương.\",\"viStatus\":\"unverified\"}},{\"id\":\"c5\",\"art\":\"creation-people\",\"text\":{\"en\":\"And last of all, God makes people. Not as servants. As his own image in the world. We will open that part of the story tomorrow.\",\"vi\":\"Và sau cùng, Thiên Chúa dựng nên con người. Không phải làm tôi tớ. Mà là hình ảnh của chính Ngài giữa trần gian. Ngày mai chúng ta sẽ mở phần ấy của câu chuyện.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"order\",\"afterCard\":2,\"prompt\":{\"en\":\"Put the days of creation in order.\",\"vi\":\"Sắp xếp các ngày tạo dựng theo thứ tự.\",\"viStatus\":\"unverified\"},\"items\":[{\"en\":\"Light\",\"vi\":\"Ánh sáng\",\"viStatus\":\"unverified\"},{\"en\":\"Sky and sea\",\"vi\":\"Bầu trời và biển\",\"viStatus\":\"unverified\"},{\"en\":\"Land and plants\",\"vi\":\"Đất liền và cây cỏ\",\"viStatus\":\"unverified\"},{\"en\":\"Sun, moon, and stars\",\"vi\":\"Mặt trời, mặt trăng và các vì sao\",\"viStatus\":\"unverified\"},{\"en\":\"Fish, birds, and animals\",\"vi\":\"Cá, chim và muông thú\",\"viStatus\":\"unverified\"}],\"why\":{\"en\":\"The story builds like a home being prepared — light first, then rooms, then the ones who will live in it.\",\"vi\":\"Câu chuyện được dựng như một ngôi nhà đang được chuẩn bị — ánh sáng trước, rồi các gian phòng, rồi những ai sẽ sống trong đó.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"choice\",\"prompt\":{\"en\":\"After each day of creating, what does God say?\",\"vi\":\"Sau mỗi ngày tạo dựng, Thiên Chúa nói gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"“It is good.”\",\"vi\":\"“Thật là tốt đẹp.”\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"“It is finished.”\",\"vi\":\"“Thế là xong.”\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"“It needs more work.”\",\"vi\":\"“Vẫn còn dang dở.”\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"Goodness is the world’s first review. The world is not an accident — it is a gift, and gifts are given with love.\",\"vi\":\"Lời khen đầu tiên của thế giới là “tốt đẹp”. Thế giới không phải ngẫu nhiên — mà là một món quà, và quà thì được trao bằng tình thương.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"art\",\"art\":\"creation-light\",\"title\":{\"en\":\"Let there be light\",\"vi\":\"Phải có ánh sáng\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"For centuries, artists have painted this moment as gold breaking into deep blue — the same colors of a cathedral at evening when the candles are lit.\",\"vi\":\"Suốt nhiều thế kỷ, các nghệ sĩ vẽ khoảnh khắc này như ánh vàng bừng lên giữa nền xanh thẳm — cũng là màu của một nhà thờ lúc chiều tối khi nến được thắp lên.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Where have you seen the world look like a gift?\",\"vi\":\"Bạn đã thấy thế giới giống một món quà ở nơi nào?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[290,299],\"note\":{\"en\":\"On creation as good and as gift.\",\"vi\":\"Về việc tạo dựng là tốt đẹp và là quà tặng.\",\"viStatus\":\"unverified\"}}},{\"id\":\"sinai-3\",\"title\":{\"en\":\"Made for Love\",\"vi\":\"Được dựng nên cho tình yêu\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"creation-people\",\"line\":{\"en\":\"The last thing made, and the most loved.\",\"vi\":\"Điều được dựng nên sau cùng, và được yêu thương nhất.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"creation-people\",\"text\":{\"en\":\"On the last day of the story, God makes something different. Not spoken from far away — shaped close, with care.\",\"vi\":\"Vào ngày cuối của câu chuyện, Thiên Chúa làm nên một điều khác biệt. Không phán từ xa — mà nắn nót thật gần, với tất cả ân cần.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"Genesis 1:27\",\"verse\":{\"en\":\"God created humanity in his own image. In the image of God he created them.\",\"vi\":\"Thiên Chúa dựng nên con người theo hình ảnh Ngài. Theo hình ảnh Thiên Chúa, Ngài đã dựng nên họ.\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"Every person carries a family resemblance to God. That is why every person matters — including you, exactly as you are.\",\"vi\":\"Mỗi con người đều mang nét giống với Thiên Chúa, như con giống cha mẹ. Vì thế mỗi người đều quý giá — kể cả bạn, đúng như bạn là.\",\"viStatus\":\"unverified\"},\"bridge\":{\"en\":\"Almost every language has a saying about children carrying the family likeness. The Bible says the whole human family carries God’s.\",\"vi\":\"Hầu như ngôn ngữ nào cũng có câu nói về con cái mang nét giống gia đình — như câu “con nhà tông không giống lông cũng giống cánh”. Kinh Thánh nói cả gia đình nhân loại mang nét giống của Thiên Chúa.\",\"viStatus\":\"unverified\"}}},{\"id\":\"c2\",\"art\":\"creation-people\",\"text\":{\"en\":\"Made in his image means: able to love, able to choose, able to know truth and make beauty. A mirror, small but real, of the one who is love.\",\"vi\":\"Mang hình ảnh Ngài nghĩa là: biết yêu thương, biết tự do chọn lựa, biết nhận ra sự thật và tạo nên cái đẹp. Một tấm gương nhỏ bé nhưng có thật, phản chiếu Đấng là tình yêu.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"candle-single\",\"text\":{\"en\":\"This is why no person is ever worthless to God. Not the stranger in the crowd. Not the difficult neighbor. Not you on your worst day.\",\"vi\":\"Vì thế không một ai là vô giá trị trước mặt Thiên Chúa. Không phải người xa lạ giữa đám đông. Không phải người hàng xóm khó tính. Không phải bạn trong ngày tồi tệ nhất của mình.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"candle-single\",\"text\":{\"en\":\"Perhaps you have seen someone cry quietly in a church. They were not crying because they were worthless. Perhaps they had just remembered that they were not.\",\"vi\":\"Có lẽ bạn từng thấy ai đó lặng lẽ khóc trong một nhà thờ. Họ không khóc vì thấy mình vô giá trị. Có lẽ họ vừa chợt nhớ ra điều ngược lại.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":1,\"prompt\":{\"en\":\"What does “made in God’s image” mean?\",\"vi\":\"“Được dựng nên theo hình ảnh Thiên Chúa” nghĩa là gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"People look like God physically\",\"vi\":\"Con người trông giống Thiên Chúa về ngoại hình\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"People can love, choose, and know truth, like him\",\"vi\":\"Con người biết yêu thương, chọn lựa và nhận ra sự thật, giống như Ngài\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Only very good people are God’s image\",\"vi\":\"Chỉ người thật tốt mới là hình ảnh của Chúa\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"The likeness is in the heart, not the face — and every person carries it, always.\",\"vi\":\"Nét giống ấy ở trong tâm hồn, không phải gương mặt — và mỗi người đều mang nó, mãi mãi.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"fill\",\"prompt\":{\"en\":\"Complete your first prayer.\",\"vi\":\"Hoàn thành lời kinh đầu tiên của bạn.\",\"viStatus\":\"unverified\"},\"before\":{\"en\":\"In the name of the Father, and of the Son,\",\"vi\":\"Nhân danh Cha, và Con,\",\"viStatus\":\"unverified\"},\"after\":{\"en\":\"Amen.\",\"vi\":\"Amen.\",\"viStatus\":\"unverified\"},\"options\":[{\"en\":\"and of the Holy Spirit.\",\"vi\":\"và Thánh Thần.\",\"viStatus\":\"unverified\"},{\"en\":\"and of the angels.\",\"vi\":\"và các thiên thần.\",\"viStatus\":\"unverified\"},{\"en\":\"and of the Church.\",\"vi\":\"và Giáo hội.\",\"viStatus\":\"unverified\"}],\"answer\":0,\"why\":{\"en\":\"Father, Son, and Holy Spirit — one God, a family of love. The little prayer holds the whole mystery.\",\"vi\":\"Cha, Con và Thánh Thần — một Thiên Chúa, một gia đình tình yêu. Lời kinh nhỏ bé chứa cả mầu nhiệm lớn lao.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"practice\",\"title\":{\"en\":\"A practice for this week\",\"vi\":\"Một bài thực hành cho tuần này\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"Once this week, look at one stranger — on a train, on a flight, in a queue — and silently think: you are made in the image of God. Watch what it changes in you.\",\"vi\":\"Một lần trong tuần này, hãy nhìn một người xa lạ — trên tàu, trên chuyến bay, trong hàng chờ — và thầm nghĩ: bạn được dựng nên theo hình ảnh Thiên Chúa. Hãy xem điều đó thay đổi gì trong chính bạn.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Who came to mind today?\",\"vi\":\"Hôm nay bạn chợt nghĩ đến ai?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[355,357],\"note\":{\"en\":\"On the dignity of being made in God’s image.\",\"vi\":\"Về phẩm giá của con người mang hình ảnh Thiên Chúa.\",\"viStatus\":\"unverified\"}}},{\"id\":\"sinai-4\",\"title\":{\"en\":\"You Already Pray\",\"vi\":\"Bạn vẫn luôn cầu nguyện\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"prayer-night\",\"line\":{\"en\":\"A quiet room, late at night. A thought rises for the people you love.\",\"vi\":\"Một căn phòng yên tĩnh, đêm khuya. Một ý nghĩ dâng lên, hướng về những người bạn thương.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"prayer-night\",\"text\":{\"en\":\"Perhaps someone taught you this — a mother, a grandmother: pray for the health and safety of the people you love. Never for money. Just for them.\",\"vi\":\"Có lẽ ai đó đã dạy bạn điều này — một người mẹ, một người bà: hãy cầu cho những người mình thương được mạnh khỏe, bình an. Đừng cầu tiền bạc. Chỉ cầu cho họ.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"prayer-night\",\"text\":{\"en\":\"Here is something you should know: that is real {{prayer}}. Not practice for prayer. Not almost-prayer. The real thing.\",\"vi\":\"Đây là điều bạn nên biết: đó chính là {{prayer}} thật. Không phải tập dượt. Không phải gần giống. Mà là cầu nguyện thật sự.\",\"viStatus\":\"unverified\"},\"terms\":[\"prayer\"]},{\"id\":\"c3\",\"art\":\"teacher-hill\",\"text\":{\"en\":\"The Church says prayer is simply lifting the heart to God. A long ceremony can be prayer. So can three words whispered in the dark at 3 a.m.\",\"vi\":\"Giáo hội nói cầu nguyện đơn giản là nâng tâm hồn lên cùng Thiên Chúa. Một nghi lễ dài có thể là cầu nguyện. Ba lời thì thầm trong bóng đêm lúc 3 giờ sáng cũng vậy.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"teacher-hill\",\"text\":{\"en\":\"Jesus promised that this kind of asking is never wasted.\",\"vi\":\"Chúa Giêsu hứa rằng lời cầu xin như thế không bao giờ vô ích.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"Matthew 7:7\",\"verse\":{\"en\":\"Ask, and it will be given to you. Seek, and you will find. Knock, and the door will be opened.\",\"vi\":\"Hãy xin thì sẽ được. Hãy tìm thì sẽ thấy. Hãy gõ cửa thì cửa sẽ mở cho.\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"God is not annoyed by your asking. He is a Father — he wants to be asked, the way parents want to hear from their children.\",\"vi\":\"Thiên Chúa không phiền lòng khi bạn cầu xin. Ngài là Cha — Ngài muốn được nghe con cái xin, như cha mẹ mong nghe tiếng con mình.\",\"viStatus\":\"unverified\"},\"bridge\":{\"en\":\"You knock on a door that is already being held open from the inside.\",\"vi\":\"Bạn gõ một cánh cửa vốn đã được giữ mở sẵn từ bên trong.\",\"viStatus\":\"unverified\"}}},{\"id\":\"c5\",\"art\":\"candle-single\",\"text\":{\"en\":\"So nothing you have done needs to be thrown away. From here, the road only adds: new words, new friends to pray with, and a clearer face for the one listening.\",\"vi\":\"Vậy nên không điều gì bạn từng làm phải bỏ đi cả. Từ đây, con đường chỉ thêm vào: những lời kinh mới, những người bạn cùng cầu nguyện, và một gương mặt rõ hơn của Đấng đang lắng nghe.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":2,\"prompt\":{\"en\":\"What is prayer, at its heart?\",\"vi\":\"Cốt lõi của cầu nguyện là gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Saying perfect words in church\",\"vi\":\"Đọc những lời thật chuẩn trong nhà thờ\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Lifting your heart to God\",\"vi\":\"Nâng tâm hồn lên cùng Thiên Chúa\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Asking for wealth and success\",\"vi\":\"Cầu xin giàu sang và thành công\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"Words help, but the heart is the prayer. Yours has been praying for years.\",\"vi\":\"Lời kinh giúp ích, nhưng tấm lòng mới là lời cầu nguyện. Lòng bạn đã cầu nguyện từ nhiều năm rồi.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"predict\",\"prompt\":{\"en\":\"A friend says: “I only ever pray for my family’s safety. Is that allowed?” What would the Church say?\",\"vi\":\"Một người bạn nói: “Tôi chỉ biết cầu cho gia đình được bình an. Vậy có được không?” Giáo hội sẽ trả lời thế nào?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"“That is real prayer. Begin there.”\",\"vi\":\"“Đó là cầu nguyện thật. Hãy bắt đầu từ đó.”\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"“No — only official prayers count.”\",\"vi\":\"“Không — chỉ kinh chính thức mới được tính.”\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"Love for others is where prayer most often begins. The official prayers are gifts added on top, not gates in front.\",\"vi\":\"Tình thương dành cho người khác thường là nơi cầu nguyện bắt đầu. Các kinh nguyện là quà tặng thêm vào, không phải cánh cổng chắn trước.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"practice\",\"title\":{\"en\":\"Tonight\",\"vi\":\"Tối nay\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"Pray for your loved ones exactly the way you always have. Then add one small thing at the end: the Sign of the Cross. Your old prayer and your first Catholic prayer, together.\",\"vi\":\"Hãy cầu cho những người bạn thương đúng như bạn vẫn làm. Rồi thêm một điều nhỏ ở cuối: Dấu Thánh Giá. Lời cầu quen thuộc của bạn và lời kinh Công giáo đầu tiên, cùng nhau.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Who do you always pray for?\",\"vi\":\"Bạn vẫn luôn cầu nguyện cho ai?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[2559,2560],\"note\":{\"en\":\"On what prayer is.\",\"vi\":\"Về cầu nguyện là gì.\",\"viStatus\":\"unverified\"}}},{\"id\":\"sinai-5\",\"title\":{\"en\":\"The Prayer Jesus Taught\",\"vi\":\"Lời kinh Chúa Giêsu dạy\",\"viStatus\":\"unverified\"},\"minutes\":5,\"door\":{\"art\":\"teacher-hill\",\"line\":{\"en\":\"One day his friends watched Jesus praying. When he finished, they asked him for something.\",\"vi\":\"Một ngày kia, các bạn hữu thấy Chúa Giêsu cầu nguyện. Khi Ngài xong, họ xin Ngài một điều.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"teacher-hill\",\"text\":{\"en\":\"“Lord, teach us to pray.” They had watched him slip away to quiet places, and come back changed. They wanted what he had.\",\"vi\":\"“Thưa Thầy, xin dạy chúng con cầu nguyện.” Họ từng thấy Ngài lánh vào nơi thanh vắng, rồi trở lại như được đổi mới. Họ muốn điều Ngài đang có.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"teacher-hill\",\"text\":{\"en\":\"He did not give them a long ceremony. He gave them a few lines, short enough to carry anywhere. It begins: Our Father.\",\"vi\":\"Ngài không trao cho họ một nghi lễ dài. Ngài trao vài dòng ngắn, đủ gọn để mang theo bất cứ đâu. Kinh ấy mở đầu: Lạy Cha chúng con.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"creation-light\",\"text\":{\"en\":\"“Our Father, who art in heaven, hallowed be thy name.” In plain words: Father of us all, your name is holy — may the whole world come to treasure it.\",\"vi\":\"“Lạy Cha chúng con ở trên trời, chúng con nguyện danh Cha cả sáng.” Nói đơn giản: Cha của tất cả chúng con, danh Cha là thánh — xin cho cả thế giới biết quý trọng danh ấy.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"creation-world\",\"text\":{\"en\":\"“Give us this day our daily bread.” Not riches. Just what we need for today — food, strength, enough. Whoever taught you to pray for people, not money, would recognize this prayer.\",\"vi\":\"“Xin Cha cho chúng con hôm nay lương thực hằng ngày.” Không phải giàu sang. Chỉ là điều cần cho hôm nay — cơm ăn, sức khỏe, vừa đủ. Người từng dạy bạn cầu cho con người chứ đừng cầu tiền bạc hẳn sẽ nhận ra lời cầu này.\",\"viStatus\":\"unverified\"}},{\"id\":\"c5\",\"art\":\"cross-dawn\",\"text\":{\"en\":\"“Forgive us, as we forgive others.” The hardest line, and the most freeing. We ask for mercy and pass mercy on, like a light handed from candle to candle.\",\"vi\":\"“Xin tha nợ chúng con, như chúng con cũng tha kẻ có nợ chúng con.” Dòng khó nhất, và cũng giải thoát nhất. Ta xin lòng thương xót và trao tiếp lòng thương xót, như ngọn lửa chuyền từ nến này sang nến khác.\",\"viStatus\":\"unverified\"}},{\"id\":\"c6\",\"art\":\"prayer-night\",\"text\":{\"en\":\"Catholics have prayed these lines every day for two thousand years, in every language on earth — somewhere, someone is praying them this very evening.\",\"vi\":\"Người Công giáo đã đọc những dòng này mỗi ngày suốt hai ngàn năm, bằng mọi ngôn ngữ trên trái đất — ngay buổi chiều hôm nay, ở đâu đó, vẫn đang có người đọc lên những lời ấy.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"fill\",\"afterCard\":3,\"prompt\":{\"en\":\"Complete the line.\",\"vi\":\"Hoàn thành câu kinh.\",\"viStatus\":\"unverified\"},\"before\":{\"en\":\"Give us this day our daily\",\"vi\":\"Xin Cha cho chúng con hôm nay\",\"viStatus\":\"unverified\"},\"after\":{\"en\":\"…\",\"vi\":\"…\",\"viStatus\":\"unverified\"},\"options\":[{\"en\":\"bread.\",\"vi\":\"lương thực hằng ngày.\",\"viStatus\":\"unverified\"},{\"en\":\"gold.\",\"vi\":\"vàng bạc.\",\"viStatus\":\"unverified\"},{\"en\":\"plans.\",\"vi\":\"kế hoạch.\",\"viStatus\":\"unverified\"}],\"answer\":0,\"why\":{\"en\":\"Daily bread — just enough for today. The prayer trusts tomorrow to the Father.\",\"vi\":\"Lương thực hằng ngày — vừa đủ cho hôm nay. Lời kinh phó thác ngày mai cho Cha.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"choice\",\"prompt\":{\"en\":\"In the Our Father, what do we ask God to forgive?\",\"vi\":\"Trong Kinh Lạy Cha, chúng ta xin Chúa tha điều gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Our trespasses — the wrongs we have done\",\"vi\":\"Nợ của chúng ta — những lỗi lầm ta đã phạm\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Our questions\",\"vi\":\"Những câu hỏi của chúng ta\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Our slowness\",\"vi\":\"Sự chậm chạp của chúng ta\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"And in the same breath we promise to forgive others. Mercy received becomes mercy given.\",\"vi\":\"Và trong cùng một hơi thở, ta hứa tha thứ cho người khác. Lòng thương xót nhận được trở thành lòng thương xót trao đi.\",\"viStatus\":\"unverified\"}},{\"id\":\"q3\",\"kind\":\"order\",\"prompt\":{\"en\":\"Put the opening of the Our Father in order.\",\"vi\":\"Sắp xếp phần mở đầu Kinh Lạy Cha theo thứ tự.\",\"viStatus\":\"unverified\"},\"items\":[{\"en\":\"Our Father, who art in heaven,\",\"vi\":\"Lạy Cha chúng con ở trên trời,\",\"viStatus\":\"unverified\"},{\"en\":\"hallowed be thy name.\",\"vi\":\"chúng con nguyện danh Cha cả sáng,\",\"viStatus\":\"unverified\"},{\"en\":\"Thy kingdom come,\",\"vi\":\"nước Cha trị đến,\",\"viStatus\":\"unverified\"},{\"en\":\"thy will be done on earth as it is in heaven.\",\"vi\":\"ý Cha thể hiện dưới đất cũng như trên trời.\",\"viStatus\":\"unverified\"}],\"why\":{\"en\":\"First we look at the Father; only then do we ask. The order itself is a small lesson.\",\"vi\":\"Trước hết ta hướng nhìn lên Cha; rồi mới cầu xin. Chính thứ tự ấy cũng là một bài học nhỏ.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"prayer\",\"prayerId\":\"our-father\",\"note\":{\"en\":\"The whole prayer now rests in your chapel. One line a day is enough — it has been memorized that way for twenty centuries.\",\"vi\":\"Trọn lời kinh giờ đây được giữ trong nhà nguyện của bạn. Mỗi ngày một câu là đủ — hai mươi thế kỷ qua người ta vẫn thuộc kinh theo cách ấy.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Which line of the Our Father feels most like yours?\",\"vi\":\"Câu nào trong Kinh Lạy Cha nghe giống lời của chính bạn nhất?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[2759,2761],\"note\":{\"en\":\"The Our Father as the summary of the whole Gospel.\",\"vi\":\"Kinh Lạy Cha là bản tóm lược của cả Tin Mừng.\",\"viStatus\":\"unverified\"}}},{\"id\":\"sinai-6\",\"title\":{\"en\":\"The Family Altar\",\"vi\":\"Bàn thờ gia đình\",\"viStatus\":\"unverified\"},\"minutes\":5,\"door\":{\"art\":\"incense-altar\",\"line\":{\"en\":\"A small shrine at home. Photographs, fruit, and the smell of incense. Many of us know this room.\",\"vi\":\"Một bàn thờ nhỏ trong nhà. Di ảnh, hoa quả, và mùi hương trầm. Nhiều người trong chúng ta biết rõ căn phòng này.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"incense-altar\",\"text\":{\"en\":\"In millions of homes — in Việt Nam, in China, in Korea, in Mexico — there is a family altar. Incense is lit. The dead are remembered with love and respect. Perhaps you grew up with one; perhaps you have stood before one.\",\"vi\":\"Trong hàng triệu mái nhà — ở Việt Nam, Trung Quốc, Hàn Quốc, Mexico — có một bàn thờ gia đình. Hương được thắp lên. Người đã khuất được tưởng nhớ bằng tình thương và lòng kính trọng. Có lẽ bạn đã lớn lên bên một bàn thờ như thế; có lẽ bạn từng đứng trước một bàn thờ như thế.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"incense-altar\",\"text\":{\"en\":\"Here is something that may surprise you: this instinct has a home in the Catholic Church too.\",\"vi\":\"Có một điều có thể khiến bạn ngạc nhiên: tấm lòng ấy cũng có một mái nhà trong Giáo hội Công giáo.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"candle-single\",\"text\":{\"en\":\"Catholics also remember and honor their beloved dead. We pray for them. We light candles for them. We believe death does not cut the thread of the family.\",\"vi\":\"Người Công giáo cũng tưởng nhớ và tôn kính người thân đã khuất. Chúng ta cầu nguyện cho họ. Thắp nến cho họ. Chúng ta tin sự chết không cắt đứt sợi dây gia đình.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"incense-altar\",\"text\":{\"en\":\"The Church calls this the {{communion-of-saints}}: one family — the living on earth, and those who live with God — still connected, still caring for one another.\",\"vi\":\"Giáo hội gọi điều này là {{communion-of-saints}}: một gia đình — người đang sống ở trần gian, và những người đang sống với Thiên Chúa — vẫn liên kết, vẫn yêu thương nhau.\",\"viStatus\":\"unverified\"},\"terms\":[\"communion-of-saints\"]},{\"id\":\"c5\",\"art\":\"incense-altar\",\"text\":{\"en\":\"Even the incense is at home in church. The Bible pictures prayers rising to God exactly like its smoke.\",\"vi\":\"Ngay cả hương trầm cũng quen thuộc trong nhà thờ. Kinh Thánh hình dung lời cầu nguyện bay lên tới Thiên Chúa đúng như làn khói hương.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"Revelation 8:4\",\"verse\":{\"en\":\"The smoke of the incense rose up before God, together with the prayers of his people.\",\"vi\":\"Khói hương quyện theo lời cầu nguyện của dân Chúa, bay lên trước nhan Thiên Chúa.\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"If you have ever watched incense curl upward at a family altar, you were looking at the Bible’s own picture of prayer.\",\"vi\":\"Nếu bạn từng nhìn khói hương uốn mình bay lên nơi một bàn thờ gia đình, bạn đã nhìn thấy chính hình ảnh mà Kinh Thánh dùng để nói về cầu nguyện.\",\"viStatus\":\"unverified\"}}},{\"id\":\"c6\",\"art\":\"cross-dawn\",\"text\":{\"en\":\"One distinction matters, and it is a kind one. Catholics {{venerate}} the saints and the dead — deep honor, like bowing to your elders. Worship belongs to God alone. Honor for the family; worship for the Father.\",\"vi\":\"Có một phân biệt quan trọng, và rất nhân hậu. Người Công giáo {{venerate}} các thánh và người đã khuất — lòng tôn kính sâu xa, như cúi mình trước bậc trưởng thượng. Còn thờ phượng thì chỉ dành cho một mình Thiên Chúa. Tôn kính dành cho gia đình; thờ phượng dành cho Cha.\",\"viStatus\":\"unverified\"},\"terms\":[\"venerate\"]}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":3,\"prompt\":{\"en\":\"Do Catholics worship the saints and the dead?\",\"vi\":\"Người Công giáo có thờ phượng các thánh và người đã khuất không?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Yes — saints are small gods\",\"vi\":\"Có — các thánh là những vị thần nhỏ\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"No — they honor them and ask them to pray; worship is for God alone\",\"vi\":\"Không — họ tôn kính và xin các ngài cầu nguyện; thờ phượng chỉ dành cho Thiên Chúa\",\"viStatus\":\"unverified\"}}],\"answer\":1,\"why\":{\"en\":\"Honor and worship are different rooms. Saints are family, asked to pray for us — the way you might ask your mother to pray for you.\",\"vi\":\"Tôn kính và thờ phượng là hai điều khác nhau. Các thánh là người nhà, được xin cầu nguyện cho ta — như bạn có thể xin mẹ cầu nguyện cho mình.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"match\",\"prompt\":{\"en\":\"Match each symbol to its meaning.\",\"vi\":\"Ghép mỗi biểu tượng với ý nghĩa của nó.\",\"viStatus\":\"unverified\"},\"pairs\":[{\"symbol\":\"symbol-incense\",\"label\":{\"en\":\"Incense\",\"vi\":\"Hương\",\"viStatus\":\"unverified\"},\"meaning\":{\"en\":\"Prayers rising to God\",\"vi\":\"Lời cầu nguyện bay lên tới Thiên Chúa\",\"viStatus\":\"unverified\"}},{\"symbol\":\"symbol-light\",\"label\":{\"en\":\"Light\",\"vi\":\"Ánh sáng\",\"viStatus\":\"unverified\"},\"meaning\":{\"en\":\"Christ present in the dark\",\"vi\":\"Chúa Kitô hiện diện giữa bóng tối\",\"viStatus\":\"unverified\"}},{\"symbol\":\"symbol-water\",\"label\":{\"en\":\"Water\",\"vi\":\"Nước\",\"viStatus\":\"unverified\"},\"meaning\":{\"en\":\"Washing clean; new life\",\"vi\":\"Rửa sạch; sự sống mới\",\"viStatus\":\"unverified\"}},{\"symbol\":\"symbol-cross\",\"label\":{\"en\":\"The Cross\",\"vi\":\"Thánh giá\",\"viStatus\":\"unverified\"},\"meaning\":{\"en\":\"Love that gives everything\",\"vi\":\"Tình yêu trao hiến tất cả\",\"viStatus\":\"unverified\"}}]}],\"treasure\":{\"kind\":\"word\",\"termId\":\"communion-of-saints\",\"note\":{\"en\":\"A word for something many hearts have always known: the family does not end at death. A family altar at home and the candles in a cathedral are nearer to each other than they look.\",\"vi\":\"Một từ cho điều mà bao trái tim vốn đã luôn biết: gia đình không kết thúc nơi sự chết. Bàn thờ gia đình ở nhà và những ngọn nến trong nhà thờ gần nhau hơn vẻ ngoài của chúng.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Who would you light a candle for?\",\"vi\":\"Bạn muốn thắp một ngọn nến cho ai?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[946,957,958],\"note\":{\"en\":\"On the communion of saints and prayer for the dead.\",\"vi\":\"Về Các Thánh thông công và việc cầu nguyện cho người đã khuất.\",\"viStatus\":\"unverified\"}}},{\"id\":\"sinai-vigil\",\"vigil\":true,\"title\":{\"en\":\"Vigil: Night on the Mountain\",\"vi\":\"Canh thức: Đêm trên núi thánh\",\"viStatus\":\"unverified\"},\"minutes\":6,\"door\":{\"art\":\"sinai-mountain\",\"line\":{\"en\":\"No questions tonight. Only the desert, the stars, and everything you have learned.\",\"vi\":\"Tối nay không có câu hỏi. Chỉ có sa mạc, những vì sao, và tất cả những gì bạn đã học.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"sinai-mountain\",\"text\":{\"en\":\"Night falls on the desert. At the foot of the mountain, the ancient monastery lights one window, like a candle. Pilgrims have climbed this path for seventeen centuries.\",\"vi\":\"Đêm buông trên sa mạc. Dưới chân núi, tu viện cổ thắp sáng một ô cửa sổ, như một ngọn nến. Mười bảy thế kỷ qua, khách hành hương vẫn leo lên con đường này.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"sinai-bush\",\"text\":{\"en\":\"You began at a fire that did not consume, and a voice that knew a shepherd’s name. It knows yours too.\",\"vi\":\"Bạn đã khởi đầu bên một ngọn lửa không thiêu rụi, và một tiếng nói biết tên người chăn chiên. Tiếng nói ấy cũng biết tên bạn.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"creation-light\",\"text\":{\"en\":\"You have learned the beginning of everything: a God who is love, who spoke light into darkness, and called the world good.\",\"vi\":\"Bạn đã học về khởi đầu của muôn loài: một Thiên Chúa là tình yêu, Đấng phán ánh sáng vào bóng tối, và gọi thế giới là tốt đẹp.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"creation-people\",\"text\":{\"en\":\"You have learned what you are: his image. Not a servant, not an accident. A child of the family.\",\"vi\":\"Bạn đã học mình là gì: hình ảnh của Ngài. Không phải tôi tớ, không phải tình cờ. Mà là một người con trong gia đình.\",\"viStatus\":\"unverified\"}},{\"id\":\"c5\",\"art\":\"prayer-night\",\"text\":{\"en\":\"You have learned that your prayers were always real, and you have been given the prayer Jesus taught, and the small cross traced over your heart.\",\"vi\":\"Bạn đã biết những lời cầu của mình vẫn luôn là thật, và bạn đã được trao lời kinh Chúa Giêsu dạy, cùng dấu Thánh giá nhỏ vẽ trên trái tim mình.\",\"viStatus\":\"unverified\"}},{\"id\":\"c6\",\"art\":\"incense-altar\",\"text\":{\"en\":\"You have learned that incense rising for the beloved dead rises in churches too, and that the family — living and dead — is held in one communion.\",\"vi\":\"Bạn đã biết làn hương dâng lên cho người thân đã khuất cũng bay lên trong các nhà thờ, và rằng gia đình — người sống lẫn người đã khuất — được giữ trong cùng một mối hiệp thông.\",\"viStatus\":\"unverified\"}},{\"id\":\"c7\",\"art\":\"sinai-mountain\",\"text\":{\"en\":\"The first page of your passport is ready for its stamp. The road now leaves the desert — toward Jerusalem, and the story of a man named Jesus.\",\"vi\":\"Trang đầu tiên trong hộ chiếu của bạn đã sẵn sàng để đóng dấu. Con đường giờ rời sa mạc — hướng về Giêrusalem, và câu chuyện về một người tên là Giêsu.\",\"viStatus\":\"unverified\"}}],\"questions\":[],\"treasure\":{\"kind\":\"art\",\"art\":\"sinai-mountain\",\"title\":{\"en\":\"The mountain of the name\",\"vi\":\"Ngọn núi của Danh Thánh\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"St. Catherine’s Monastery at the foot of Sinai has kept a chapel of the Burning Bush since the year 330 — one of the oldest continuously used churches on earth. The fire, so to speak, has never gone out.\",\"vi\":\"Tu viện Thánh Catarina dưới chân núi Sinai gìn giữ nhà nguyện Bụi Gai Cháy từ năm 330 — một trong những nhà thờ được sử dụng liên tục lâu đời nhất trái đất. Có thể nói: ngọn lửa ấy chưa bao giờ tắt.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Looking back on this first stretch of road — what surprised you?\",\"vi\":\"Nhìn lại đoạn đường đầu tiên này — điều gì khiến bạn ngạc nhiên?\",\"viStatus\":\"unverified\"}}]},\"lesson\":\"$5:props:world:lessons:0\"}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#1C2647\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[622,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"The Pilgrimage\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A quiet pilgrimage through the world’s holy places.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"The Pilgrimage\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/my-first-project/pilgrimage/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"apple-mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"5\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"6\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Pilgrimage\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"black-translucent\"}],[\"$\",\"link\",\"8\
