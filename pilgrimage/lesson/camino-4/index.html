\"name\":{\"en\":\"The Way\",\"vi\":\"Con Đường\",\"viStatus\":\"unverified\"},\"church\":{\"en\":\"Santiago de Compostela\",\"vi\":\"Santiago de Compostela\",\"viStatus\":\"unverified\"},\"place\":{\"en\":\"The Camino, Spain\",\"vi\":\"Đường Camino, Tây Ban Nha\",\"viStatus\":\"unverified\"},\"theme\":{\"en\":\"Living as a pilgrim, every day\",\"vi\":\"Sống như người hành hương, mỗi ngày\",\"viStatus\":\"unverified\"},\"lessons\":[{\"id\":\"camino-1\",\"title\":{\"en\":\"The Greatest Commandment\",\"vi\":\"Điều răn lớn nhất\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"camino-way\",\"line\":{\"en\":\"The last road is the longest and the plainest: ordinary life, walked like a pilgrim.\",\"vi\":\"Chặng đường cuối là chặng dài nhất và bình dị nhất: cuộc sống thường ngày, được bước đi như một người hành hương.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"parish-home\",\"text\":{\"en\":\"A scholar once asked Jesus to name the greatest commandment of the hundreds in the law. He answered with two that are really one.\",\"vi\":\"Một nhà thông luật từng xin Chúa Giêsu nêu điều răn lớn nhất giữa hàng trăm điều trong lề luật. Ngài trả lời bằng hai điều mà thật ra là một.\",\"viStatus\":\"unverified\"},\"scripture\":{\"ref\":\"Matthew 22:37–39\",\"verse\":{\"en\":\"Love the Lord your God with all your heart, soul, and mind. And love your neighbor as yourself.\",\"vi\":\"Hãy yêu mến Chúa là Thiên Chúa ngươi hết lòng, hết linh hồn và hết trí khôn. Và hãy yêu người thân cận như chính mình.\",\"viStatus\":\"unverified\"},\"plain\":{\"en\":\"Everything the Church asks of anyone hangs on these two lines. The rest is commentary, guard rails, and help.\",\"vi\":\"Mọi điều Giáo hội mời gọi nơi bất cứ ai đều treo trên hai dòng này. Phần còn lại là chú giải, lan can bảo vệ, và sự trợ giúp.\",\"viStatus\":\"unverified\"}}},{\"id\":\"c2\",\"art\":\"commandments-tablets\",\"text\":{\"en\":\"Perhaps someone taught you a version of this long before any catechism: pray for people, be good to people, never pray for money. Whoever taught you that was closer to the heart of it than many lifelong believers.\",\"vi\":\"Có lẽ ai đó đã dạy bạn một phiên bản của điều này từ trước mọi sách giáo lý: cầu nguyện cho người khác, sống tốt với người khác, đừng bao giờ cầu tiền bạc. Người đã dạy bạn điều ấy gần với cốt lõi hơn nhiều người giữ đạo cả đời.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"samaritan-road\",\"text\":{\"en\":\"Notice the order, though: God first, neighbor second — not because people matter less, but because love needs a source. A lamp must be plugged in before it can light a room.\",\"vi\":\"Nhưng hãy để ý thứ tự: Thiên Chúa trước, người thân cận sau — không phải vì con người kém quan trọng, mà vì tình yêu cần một nguồn mạch. Ngọn đèn phải được cắm điện trước khi soi sáng căn phòng.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":0,\"prompt\":{\"en\":\"What does everything else in Christian living hang on?\",\"vi\":\"Mọi điều khác trong đời sống Kitô hữu treo trên điều gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Love God; love your neighbor\",\"vi\":\"Yêu mến Thiên Chúa; yêu người thân cận\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Memorizing all the rules\",\"vi\":\"Thuộc lòng mọi luật lệ\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"Two lines. If a rule ever seems to contradict love, you have misunderstood either the rule or love.\",\"vi\":\"Hai dòng. Nếu một luật lệ nào đó có vẻ nghịch với tình yêu, thì bạn đã hiểu sai hoặc luật ấy, hoặc tình yêu.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"predict\",\"prompt\":{\"en\":\"Jesus is asked for ONE commandment. Why answer with two?\",\"vi\":\"Người ta xin MỘT điều răn. Vì sao Chúa Giêsu trả lời bằng hai?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Because they cannot be separated\",\"vi\":\"Vì hai điều ấy không thể tách rời\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Because he misheard the question\",\"vi\":\"Vì Ngài nghe nhầm câu hỏi\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"Love of God that ignores people is fantasy; love of people that ignores God runs out of fuel. They are one movement.\",\"vi\":\"Yêu Chúa mà bỏ quên con người là ảo tưởng; yêu con người mà bỏ quên Thiên Chúa thì cạn nhiên liệu. Đó là một chuyển động duy nhất.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"practice\",\"title\":{\"en\":\"The two-line examination\",\"vi\":\"Xét mình bằng hai dòng\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"Tonight, instead of counting faults, ask two questions: where did I love today? Where did I hold love back? That is the oldest Christian evening practice, in its simplest form.\",\"vi\":\"Tối nay, thay vì đếm lỗi, hãy hỏi hai câu: hôm nay tôi đã yêu thương ở đâu? Tôi đã giữ tình yêu lại ở đâu? Đó là việc xét mình buổi tối cổ xưa nhất của Kitô giáo, trong hình thức đơn sơ nhất.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Where did you love today?\",\"vi\":\"Hôm nay bạn đã yêu thương ở đâu?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[2055,1822],\"note\":{\"en\":\"On the great commandment and charity.\",\"vi\":\"Về điều răn lớn nhất và đức ái.\",\"viStatus\":\"unverified\"}}},{\"id\":\"camino-2\",\"title\":{\"en\":\"Ten Words of Freedom\",\"vi\":\"Mười lời của tự do\",\"viStatus\":\"unverified\"},\"minutes\":5,\"door\":{\"art\":\"commandments-tablets\",\"line\":{\"en\":\"The Ten Commandments — not a cage, but the fence at the cliff edge.\",\"vi\":\"Mười Điều Răn — không phải chiếc lồng, mà là hàng rào nơi mép vực.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"commandments-tablets\",\"text\":{\"en\":\"They were given to people who had just been freed from slavery — that matters. The Ten Commandments are not how to earn God’s love. They are how freed people stay free.\",\"vi\":\"Mười Điều Răn được trao cho một dân vừa thoát kiếp nô lệ — điều đó rất quan trọng. Mười Điều Răn không phải cách kiếm tình yêu của Thiên Chúa. Mà là cách những người đã được tự do giữ lấy tự do.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"commandments-tablets\",\"text\":{\"en\":\"The first three guard love of God: no other gods, no contempt for his name, keep his day holy. The other seven guard love of people: honor your parents; do not kill, betray, steal, lie, or let envy eat you.\",\"vi\":\"Ba điều đầu gìn giữ tình yêu với Thiên Chúa: không thờ thần nào khác, không xúc phạm danh Ngài, giữ ngày của Ngài nên thánh. Bảy điều sau gìn giữ tình yêu với con người: thảo kính cha mẹ; chớ giết người, chớ phản bội, chớ trộm cắp, chớ làm chứng dối, chớ để lòng ghen tị gặm nhấm mình.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"incense-altar\",\"text\":{\"en\":\"“Honor your father and your mother” — the fourth word — sounds familiar in many languages. Whole cultures are built on it: Việt Nam, China, Korea and many others have kept the fourth commandment beautifully for centuries.\",\"vi\":\"“Thảo kính cha mẹ” — lời thứ tư — nghe thật quen thuộc trong nhiều ngôn ngữ. Cả những nền văn hóa được xây trên đó: Việt Nam, Trung Quốc, Hàn Quốc và nhiều nơi khác đã giữ điều răn thứ tư một cách tuyệt đẹp suốt bao thế kỷ.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"teacher-hill\",\"text\":{\"en\":\"Jesus did not cancel the ten — he deepened them. Not only do not kill, but do not nurse contempt. Not only do not lie, but let your yes mean yes. The fence became a compass.\",\"vi\":\"Chúa Giêsu không hủy bỏ mười điều — Ngài đào sâu chúng. Không chỉ chớ giết người, mà đừng nuôi lòng khinh ghét. Không chỉ chớ nói dối, mà hãy để tiếng “có” của con thật là có. Hàng rào trở thành la bàn.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":0,\"prompt\":{\"en\":\"Who first received the Ten Commandments?\",\"vi\":\"Ai là những người đầu tiên nhận Mười Điều Răn?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"People just freed from slavery\",\"vi\":\"Một dân vừa được giải thoát khỏi kiếp nô lệ\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Kings who needed laws for others\",\"vi\":\"Các vị vua cần luật cho người khác\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"Freedom came first; the commandments came to protect it. The order tells you what kind of God this is.\",\"vi\":\"Tự do đến trước; các điều răn đến để gìn giữ nó. Thứ tự ấy cho bạn biết Thiên Chúa là Đấng thế nào.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"choice\",\"prompt\":{\"en\":\"Which commandment have many cultures been keeping all along?\",\"vi\":\"Điều răn nào nhiều nền văn hóa vẫn luôn gìn giữ?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Honor your father and your mother\",\"vi\":\"Thảo kính cha mẹ\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Keep holy the Sabbath\",\"vi\":\"Giữ ngày Chúa nhật\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"The family shrine, the anniversaries of the dead, the deep bow to elders — the fourth word, lived for centuries.\",\"vi\":\"Bàn thờ gia đình, ngày giỗ, cái cúi đầu sâu trước bậc trưởng thượng — lời thứ tư, được sống suốt bao thế kỷ.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"art\",\"art\":\"commandments-tablets\",\"title\":{\"en\":\"The ten words\",\"vi\":\"Mười lời\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"In Hebrew they are simply called “the ten words.” Artists draw them as two tablets: three lines and seven, with one heart over both.\",\"vi\":\"Trong tiếng Híp-ri, chúng được gọi đơn giản là “mười lời.” Các nghệ sĩ vẽ hai bia đá: ba dòng và bảy dòng, với một trái tim phủ trên cả hai.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Which of the ten is hardest for you, honestly?\",\"vi\":\"Thật lòng, điều nào trong mười điều là khó nhất với bạn?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[2057,2196],\"note\":{\"en\":\"On the commandments as the way of freedom and love.\",\"vi\":\"Về các điều răn là con đường của tự do và tình yêu.\",\"viStatus\":\"unverified\"}}},{\"id\":\"camino-3\",\"title\":{\"en\":\"Blessed Are…\",\"vi\":\"Phúc cho ai…\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"teacher-hill\",\"line\":{\"en\":\"On a hillside, Jesus described the kind of person heaven recognizes. None of it is what anyone expected.\",\"vi\":\"Trên một sườn đồi, Chúa Giêsu mô tả mẫu người mà Thiên đàng nhận ra. Không điều nào như người ta mong đợi.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"teacher-hill\",\"text\":{\"en\":\"Blessed are the poor in spirit. Blessed are those who mourn. The merciful. The pure of heart. The peacemakers. Those who hunger for justice. Those persecuted for doing right.\",\"vi\":\"Phúc cho ai có tâm hồn nghèo khó. Phúc cho ai sầu khổ. Người có lòng thương xót. Người có tâm hồn trong sạch. Người xây dựng hòa bình. Người đói khát sự công chính. Người bị bách hại vì lẽ phải.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"teacher-hill\",\"text\":{\"en\":\"Notice who is missing: the rich, the powerful, the winners, the loud. The Beatitudes are heaven’s upside-down guest list — and the self-portrait of Jesus himself.\",\"vi\":\"Hãy để ý ai vắng mặt: người giàu, kẻ quyền thế, người chiến thắng, kẻ ồn ào. Các Mối Phúc là danh sách khách mời lộn ngược của Thiên đàng — và là bức chân dung tự họa của chính Chúa Giêsu.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"martyrs-palm\",\"text\":{\"en\":\"The Ten Commandments are the floor — the minimum that keeps love safe. The Beatitudes are the ceiling opened to the sky: what a life can become. The martyrs of your homeland lived the last beatitude to the end.\",\"vi\":\"Mười Điều Răn là sàn nhà — mức tối thiểu giữ cho tình yêu an toàn. Các Mối Phúc là trần nhà mở ra bầu trời: một đời người có thể trở thành gì. Các thánh tử đạo của quê hương bạn đã sống mối phúc cuối cùng cho đến tận cùng.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":1,\"prompt\":{\"en\":\"Whose portrait are the Beatitudes, most of all?\",\"vi\":\"Các Mối Phúc là chân dung của ai, trước hết?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Jesus himself\",\"vi\":\"Chính Chúa Giêsu\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Successful religious leaders\",\"vi\":\"Các lãnh đạo tôn giáo thành đạt\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"Poor, mourning, merciful, pure, peacemaking, persecuted — he was describing the life he was about to live.\",\"vi\":\"Nghèo khó, sầu khổ, thương xót, trong sạch, xây dựng hòa bình, bị bách hại — Ngài đang mô tả chính cuộc đời Ngài sắp sống.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"fill\",\"prompt\":{\"en\":\"Complete the beatitude.\",\"vi\":\"Hoàn thành mối phúc.\",\"viStatus\":\"unverified\"},\"before\":{\"en\":\"Blessed are the merciful,\",\"vi\":\"Phúc cho ai có lòng thương xót,\",\"viStatus\":\"unverified\"},\"after\":{\"en\":\"…\",\"vi\":\"…\",\"viStatus\":\"unverified\"},\"options\":[{\"en\":\"for they will be shown mercy.\",\"vi\":\"vì họ sẽ được xót thương.\",\"viStatus\":\"unverified\"},{\"en\":\"for they will be famous.\",\"vi\":\"vì họ sẽ nổi danh.\",\"viStatus\":\"unverified\"},{\"en\":\"for they will be safe.\",\"vi\":\"vì họ sẽ được an toàn.\",\"viStatus\":\"unverified\"}],\"answer\":0,\"why\":{\"en\":\"What you give is what you receive back, pressed down and overflowing. Mercy is the only investment with that guarantee.\",\"vi\":\"Điều bạn trao đi là điều bạn nhận lại, được đong đầy và tràn trề. Lòng thương xót là khoản đầu tư duy nhất có bảo đảm ấy.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"practice\",\"title\":{\"en\":\"One beatitude, one week\",\"vi\":\"Một mối phúc, một tuần\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"Pick the beatitude that names something you already long for — peace, mercy, justice — and let it be your compass for one week. The Beatitudes are not assignments; they are invitations.\",\"vi\":\"Hãy chọn mối phúc gọi đúng tên điều bạn vốn khao khát — bình an, lòng thương xót, sự công chính — và để nó làm la bàn cho bạn trong một tuần. Các Mối Phúc không phải bài tập; chúng là những lời mời.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Which beatitude already sounds like you?\",\"vi\":\"Mối phúc nào nghe đã giống bạn rồi?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[1716,1717],\"note\":{\"en\":\"On the Beatitudes as the heart of Jesus’ preaching.\",\"vi\":\"Về các Mối Phúc là trái tim lời rao giảng của Chúa Giêsu.\",\"viStatus\":\"unverified\"}}},{\"id\":\"camino-4\",\"title\":{\"en\":\"The Family Rhythm\",\"vi\":\"Nhịp sống của gia đình\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"parish-home\",\"line\":{\"en\":\"Five small habits that keep a Catholic connected — the minimum heartbeat, explained plainly.\",\"vi\":\"Năm thói quen nhỏ giữ người Công giáo gắn kết — nhịp tim tối thiểu, được giải thích đơn sơ.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"parish-home\",\"text\":{\"en\":\"Every family has rhythms that hold it together: Sunday dinners, Tết visits, calls home. The Church has five, called the precepts. They are floors, not ceilings.\",\"vi\":\"Mỗi gia đình đều có những nhịp sống giữ mình gắn bó: bữa cơm Chúa nhật, thăm nhau ngày Tết, những cuộc gọi về nhà. Giáo hội có năm nhịp như thế, gọi là các điều luật Hội Thánh. Chúng là sàn nhà, không phải trần nhà.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"mass-altar\",\"text\":{\"en\":\"One: Mass on Sundays and the great feasts. Two: confession at least once a year. Three: communion at least each Easter season. Four: the Church’s days of fasting. Five: help support the Church’s needs, each as they are able.\",\"vi\":\"Một: dự Thánh lễ Chúa nhật và các lễ buộc. Hai: xưng tội ít là mỗi năm một lần. Ba: rước lễ ít là trong mùa Phục Sinh. Bốn: giữ các ngày ăn chay kiêng thịt của Giáo hội. Năm: góp phần nâng đỡ các nhu cầu của Giáo hội, tùy khả năng mỗi người.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"sky-flight\",\"text\":{\"en\":\"A note for travelers: nobody is graded down for distance. When a journey puts you far from home on a Sunday, the obligation bends — and any Mass in any city in any language counts. The family table is everywhere.\",\"vi\":\"Một ghi chú cho người lữ hành: không ai bị trừ điểm vì khoảng cách. Khi một chuyến đi đặt bạn xa nhà vào ngày Chúa nhật, luật buộc được nhường bước — và bất cứ Thánh lễ nào, ở bất cứ thành phố nào, bằng bất cứ ngôn ngữ nào, đều được kể. Bàn ăn của gia đình này có mặt khắp nơi.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":1,\"prompt\":{\"en\":\"What are the precepts of the Church for?\",\"vi\":\"Các điều luật Hội Thánh để làm gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"The minimum rhythm that keeps the connection alive\",\"vi\":\"Nhịp tối thiểu giữ cho sự gắn kết sống động\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Tests to qualify for heaven\",\"vi\":\"Các bài kiểm tra để đủ điều kiện vào Thiên đàng\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"Like calling your mother: the point is not the rule, the point is not drifting apart.\",\"vi\":\"Như việc gọi điện cho mẹ: vấn đề không phải là luật, mà là để không dần xa nhau.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"choice\",\"prompt\":{\"en\":\"You find yourself far from home on a Sunday. Which Mass counts?\",\"vi\":\"Bạn ở xa nhà vào một ngày Chúa nhật. Thánh lễ nào được kể?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Any Catholic Mass, in any language\",\"vi\":\"Bất cứ Thánh lễ Công giáo nào, bằng bất cứ ngôn ngữ nào\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Only one in Vietnamese\",\"vi\":\"Chỉ Thánh lễ tiếng Việt\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"A Mass in a language you do not speak still counts — and it can still move you. Now you know why.\",\"vi\":\"Một Thánh lễ bằng ngôn ngữ bạn không biết vẫn được kể — và vẫn có thể làm bạn xúc động. Giờ bạn đã hiểu vì sao.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"practice\",\"title\":{\"en\":\"The traveler’s habit\",\"vi\":\"Thói quen của người lữ hành\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"Before your next journey, look up one church near where you will stay. Even ten minutes inside, on a weekday, with no Mass at all — the red lamp will be burning. You know what it means now.\",\"vi\":\"Trước chuyến đi tới, hãy tìm một nhà thờ gần nơi bạn sẽ ở. Dù chỉ mười phút ghé vào, ngày thường, không có Thánh lễ — ngọn đèn đỏ vẫn đang cháy. Giờ thì bạn đã biết nó nghĩa là gì.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"What rhythm already holds your life together?\",\"vi\":\"Nhịp sống nào đang giữ đời bạn gắn kết?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[2041,2042,2043],\"note\":{\"en\":\"On the precepts of the Church.\",\"vi\":\"Về các điều luật Hội Thánh.\",\"viStatus\":\"unverified\"}}},{\"id\":\"camino-5\",\"title\":{\"en\":\"The Living Calendar\",\"vi\":\"Cuốn lịch sống\",\"viStatus\":\"unverified\"},\"minutes\":5,\"door\":{\"art\":\"liturgical-wheel\",\"line\":{\"en\":\"The Church keeps time differently. Once you see the wheel, every Mass makes more sense.\",\"vi\":\"Giáo hội đếm thời gian theo cách khác. Một khi thấy được bánh xe ấy, mỗi Thánh lễ sẽ dễ hiểu hơn nhiều.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"liturgical-wheel\",\"text\":{\"en\":\"The Church’s year is a wheel that retells the whole story annually. It begins not in January but with Advent — four weeks of waiting, the prophets’ longing compressed into a month.\",\"vi\":\"Năm của Giáo hội là một bánh xe kể lại trọn câu chuyện mỗi năm. Nó không bắt đầu vào tháng Giêng mà bằng Mùa Vọng — bốn tuần chờ đợi, nỗi khát mong của các ngôn sứ nén lại trong một tháng.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"nativity\",\"text\":{\"en\":\"Then Christmas — not one day, but a whole season of light. Then a stretch of Ordinary Time: green, steady, the long middle where most of life happens.\",\"vi\":\"Rồi Giáng Sinh — không phải một ngày, mà cả một mùa ánh sáng. Rồi một quãng Mùa Thường Niên: màu xanh lá, đều đặn, khúc giữa dài nơi phần lớn cuộc sống diễn ra.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"cross-passion\",\"text\":{\"en\":\"Then Lent: forty days of honesty and simplicity, walking with Jesus toward Jerusalem. Then the Triduum — the three days you know. Then Easter, fifty days of it, ending in the fire of Pentecost.\",\"vi\":\"Rồi Mùa Chay: bốn mươi ngày thành thật và giản dị, cùng Chúa Giêsu tiến về Giêrusalem. Rồi Tam Nhật Thánh — ba ngày bạn đã biết. Rồi mùa Phục Sinh, năm mươi ngày, kết thúc trong ngọn lửa lễ Ngũ Tuần.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"liturgical-wheel\",\"text\":{\"en\":\"The colors of the vestments tell you where you are: purple for waiting and turning back, white and gold for feasts, red for the Spirit and the martyrs, green for the growing season. Today’s banner on your app’s home screen now follows this wheel.\",\"vi\":\"Màu phẩm phục cho bạn biết mình đang ở đâu: tím cho mùa đợi chờ và hoán cải, trắng và vàng cho lễ trọng, đỏ cho Chúa Thánh Thần và các thánh tử đạo, xanh lá cho mùa tăng trưởng. Dòng chữ trên màn hình Hôm nay của ứng dụng giờ cũng đi theo bánh xe này.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"order\",\"afterCard\":2,\"prompt\":{\"en\":\"Put the Church’s year in order, starting from Advent.\",\"vi\":\"Sắp xếp năm phụng vụ theo thứ tự, bắt đầu từ Mùa Vọng.\",\"viStatus\":\"unverified\"},\"items\":[{\"en\":\"Advent: the waiting\",\"vi\":\"Mùa Vọng: chờ đợi\",\"viStatus\":\"unverified\"},{\"en\":\"Christmas: the light arrives\",\"vi\":\"Giáng Sinh: ánh sáng đến\",\"viStatus\":\"unverified\"},{\"en\":\"Lent: forty days toward Jerusalem\",\"vi\":\"Mùa Chay: bốn mươi ngày về Giêrusalem\",\"viStatus\":\"unverified\"},{\"en\":\"Easter: fifty days of morning\",\"vi\":\"Phục Sinh: năm mươi ngày của buổi sáng\",\"viStatus\":\"unverified\"},{\"en\":\"Pentecost: the fire\",\"vi\":\"Hiện Xuống: ngọn lửa\",\"viStatus\":\"unverified\"}],\"why\":{\"en\":\"Waiting, light, desert, morning, fire. You have walked this exact arc on the road — the calendar walks it every year.\",\"vi\":\"Chờ đợi, ánh sáng, hoang mạc, buổi sáng, ngọn lửa. Bạn đã đi đúng vòng cung này trên con đường — cuốn lịch đi lại nó mỗi năm.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"choice\",\"prompt\":{\"en\":\"What does purple mean when you see it at Mass?\",\"vi\":\"Màu tím trong Thánh lễ có nghĩa gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"A season of waiting or turning back: Advent or Lent\",\"vi\":\"Mùa của đợi chờ hoặc hoán cải: Mùa Vọng hay Mùa Chay\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"A royal visitor is expected\",\"vi\":\"Sắp có khách hoàng gia đến thăm\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"One glance at the priest’s vestments and you will know what month of the story you are standing in.\",\"vi\":\"Chỉ một cái nhìn vào phẩm phục của linh mục, bạn sẽ biết mình đang đứng ở tháng nào của câu chuyện.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"art\",\"art\":\"liturgical-wheel\",\"title\":{\"en\":\"The wheel of the year\",\"vi\":\"Bánh xe năm phụng vụ\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"A year-shaped catechism. Live inside it for a few cycles, and the story of Jesus stops being something you know and becomes something you keep.\",\"vi\":\"Một cuốn giáo lý mang hình một năm. Sống trong đó vài vòng, câu chuyện Chúa Giêsu sẽ thôi là điều bạn biết, và trở thành điều bạn gìn giữ.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Which season is your life in right now?\",\"vi\":\"Cuộc đời bạn đang ở mùa nào?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[1163,1168,1171],\"note\":{\"en\":\"On the liturgical year.\",\"vi\":\"Về năm phụng vụ.\",\"viStatus\":\"unverified\"}}},{\"id\":\"camino-6\",\"title\":{\"en\":\"The Cloud of Witnesses\",\"vi\":\"Đám mây nhân chứng\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"martyrs-palm\",\"line\":{\"en\":\"Mary, the saints, your rosary, and the family that prays for you by name.\",\"vi\":\"Mẹ Maria, các thánh, chuỗi Mân Côi của bạn, và gia đình đang cầu nguyện cho bạn bằng chính tên bạn.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"annunciation\",\"text\":{\"en\":\"Mary is not a goddess and was never meant to be. She is the first and best disciple — the first to say yes, the last at the cross, praying at Pentecost. Catholics ask her to pray for us, exactly as you would ask your own mother.\",\"vi\":\"Đức Mẹ Maria không phải nữ thần và chưa bao giờ là thế. Mẹ là người môn đệ đầu tiên và tuyệt hảo nhất — người đầu tiên thưa xin vâng, người cuối cùng dưới chân thập giá, người cầu nguyện trong ngày Ngũ Tuần. Người Công giáo xin Mẹ cầu nguyện cho mình, đúng như bạn xin mẹ ruột của bạn.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"asia-lanterns\",\"text\":{\"en\":\"Around her, the saints: the family album of the Church, faces from every century and continent — including 117 from Việt Nam. They are not dead heroes. They are living relatives, and the rosary in your bag is a phone line.\",\"vi\":\"Quanh Mẹ là Các Thánh: cuốn album gia đình của Giáo hội, những gương mặt từ mọi thế kỷ và châu lục — trong đó có 117 vị từ Việt Nam. Họ không phải anh hùng đã khuất. Họ là người thân đang sống, và chuỗi Mân Côi trong túi bạn là một đường dây liên lạc.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"incense-altar\",\"text\":{\"en\":\"Your family shrine taught you the truth of this years ago: the dead are not gone, love still flows both ways, and remembering is a form of presence. The Church simply adds: and in Christ, the line is never busy.\",\"vi\":\"Bàn thờ gia đình đã dạy bạn sự thật này từ nhiều năm trước: người khuất không hề mất, tình thương vẫn chảy hai chiều, và tưởng nhớ là một hình thức hiện diện. Giáo hội chỉ thêm rằng: trong Chúa Kitô, đường dây ấy không bao giờ bận.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":0,\"prompt\":{\"en\":\"What do Catholics ask of Mary?\",\"vi\":\"Người Công giáo xin gì nơi Đức Mẹ Maria?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"To pray for us, as a mother would\",\"vi\":\"Xin Mẹ cầu nguyện cho chúng ta, như một người mẹ\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"To be worshiped as a goddess\",\"vi\":\"Tôn thờ Mẹ như một nữ thần\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"“Pray for us sinners” — the Hail Mary you know says it exactly. Worship belongs to God alone; mothers get asked for prayers.\",\"vi\":\"“Cầu cho chúng con là kẻ có tội” — Kinh Kính Mừng bạn thuộc đã nói thật chính xác. Thờ phượng chỉ dành cho Thiên Chúa; còn các bà mẹ thì được xin lời cầu nguyện.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"choice\",\"prompt\":{\"en\":\"What is the rosary, now that you can pray it?\",\"vi\":\"Chuỗi Mân Côi là gì, giờ đây khi bạn đã biết nguyện?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Walking the Gospel stories, with Mary, bead by bead\",\"vi\":\"Đi qua các câu chuyện Tin Mừng, cùng Mẹ Maria, từng hạt một\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"A counting exercise\",\"vi\":\"Một bài tập đếm số\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"Every decade holds a scene you have walked: the angel, the hill country, the stable, the temple. The beads are a pilgrimage you can hold.\",\"vi\":\"Mỗi chục kinh giữ một khung cảnh bạn đã đi qua: thiên thần, miền đồi núi, máng cỏ, Đền Thánh. Chuỗi hạt là một cuộc hành hương bạn cầm được trên tay.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"practice\",\"title\":{\"en\":\"One decade tonight\",\"vi\":\"Một chục kinh tối nay\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"Take the rosary he gave you, open the trainer in My Chapel, and pray just one decade — the Annunciation. Ten Hail Marys, one small room, and you.\",\"vi\":\"Hãy cầm chuỗi Mân Côi anh ấy tặng, mở phần hướng dẫn trong Nhà nguyện, và nguyện một chục kinh thôi — mầu nhiệm Truyền Tin. Mười Kinh Kính Mừng, một căn phòng nhỏ, và bạn.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Which saint feels closest to you so far?\",\"vi\":\"Đến giờ, vị thánh nào gần gũi với bạn nhất?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[971,2030],\"note\":{\"en\":\"On Mary and the witness of the saints.\",\"vi\":\"Về Đức Mẹ Maria và chứng tá Các Thánh.\",\"viStatus\":\"unverified\"}}},{\"id\":\"camino-7\",\"title\":{\"en\":\"The Hope\",\"vi\":\"Niềm Hy Vọng\",\"viStatus\":\"unverified\"},\"minutes\":5,\"door\":{\"art\":\"heaven-light\",\"line\":{\"en\":\"Death, heaven, purgatory — the last things, held in the warmest light the Church has.\",\"vi\":\"Sự chết, Thiên đàng, luyện ngục — những điều sau hết, được nâng niu trong thứ ánh sáng ấm áp nhất Giáo hội có.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"heaven-light\",\"text\":{\"en\":\"You pray for the health and safety of the people you love. Underneath that prayer has always been a harder question: and then what? What happens to the people we cannot keep safe forever?\",\"vi\":\"Bạn vẫn cầu cho những người mình thương được mạnh khỏe, bình an. Bên dưới lời cầu ấy luôn là một câu hỏi khó hơn: rồi sao nữa? Điều gì xảy ra với những người ta không thể gìn giữ mãi mãi?\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"tomb-morning\",\"text\":{\"en\":\"The Church’s answer begins at the empty tomb: death is real, and death does not win. Heaven is not clouds and boredom — it is seeing God face to face, with everyone who let themselves be loved by him. Home, with no flight back.\",\"vi\":\"Câu trả lời của Giáo hội bắt đầu nơi ngôi mộ trống: cái chết là thật, và cái chết không thắng. Thiên đàng không phải mây trắng và sự buồn tẻ — mà là được thấy Thiên Chúa mặt đối mặt, cùng tất cả những ai đã để Ngài yêu thương mình. Là nhà, không còn chuyến bay trở ra.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"candle-single\",\"text\":{\"en\":\"And {{purgatory}}? Not a small hell. A final kindness: whoever dies in God’s friendship but still carrying dust gets washed clean before the feast. This is why Catholics pray for their dead — our prayers keep helping them, the way incense keeps rising.\",\"vi\":\"Còn {{purgatory}}? Không phải một hỏa ngục thu nhỏ. Mà là lòng nhân hậu sau cùng: ai qua đời trong tình nghĩa với Chúa nhưng còn vương bụi đường thì được rửa sạch trước khi vào bàn tiệc. Vì thế người Công giáo cầu nguyện cho người đã khuất — lời cầu của chúng ta vẫn tiếp tục nâng đỡ họ, như làn hương vẫn tiếp tục bay lên.\",\"viStatus\":\"unverified\"},\"terms\":[\"purgatory\"]},{\"id\":\"c4\",\"art\":\"incense-altar\",\"text\":{\"en\":\"So your family shrine was never far from the truth. Your incense, your remembering, your care for the dead — the Church receives all of it, and adds one word your heart has been waiting for: reunion.\",\"vi\":\"Vậy nên bàn thờ gia đình của bạn chưa bao giờ xa sự thật. Nén hương, sự tưởng nhớ, tấm lòng với người đã khuất — Giáo hội đón nhận tất cả, và thêm một từ mà trái tim bạn vẫn chờ: đoàn tụ.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"choice\",\"afterCard\":2,\"prompt\":{\"en\":\"What is purgatory?\",\"vi\":\"Luyện ngục là gì?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"A final, loving purification before heaven\",\"vi\":\"Sự thanh luyện cuối cùng, đầy yêu thương, trước Thiên đàng\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"A smaller version of hell\",\"vi\":\"Một phiên bản thu nhỏ của hỏa ngục\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"Like washing your hands before a wedding banquet — not punishment, preparation. And our prayers help.\",\"vi\":\"Như rửa tay trước khi vào tiệc cưới — không phải hình phạt, mà là sự chuẩn bị. Và lời cầu nguyện của chúng ta giúp được.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"choice\",\"prompt\":{\"en\":\"Why do Catholics pray for the dead?\",\"vi\":\"Vì sao người Công giáo cầu nguyện cho người đã khuất?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Because love still reaches them, and helps\",\"vi\":\"Vì tình thương vẫn chạm tới họ, và nâng đỡ họ\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"Because it is a polite custom only\",\"vi\":\"Chỉ vì đó là một phong tục lịch sự\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"The communion of saints, one last time: the family is not broken by death, so neither is the helping.\",\"vi\":\"Các Thánh thông công, một lần cuối: gia đình không bị cái chết cắt đứt, nên sự nâng đỡ cũng không.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"word\",\"termId\":\"purgatory\",\"note\":{\"en\":\"A word that turns grief into a task love can still do. Tonight, name your beloved dead before God — your incense already taught you how.\",\"vi\":\"Một từ biến nỗi tiếc thương thành việc mà tình yêu vẫn còn làm được. Tối nay, hãy dâng tên những người thân đã khuất lên trước Thiên Chúa — nén hương của bạn đã dạy bạn cách làm từ lâu.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Who do you most hope to see again?\",\"vi\":\"Bạn mong gặp lại ai nhất?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[1023,1030,1032],\"note\":{\"en\":\"On heaven, purgatory, and prayer for the dead.\",\"vi\":\"Về Thiên đàng, luyện ngục, và cầu nguyện cho người đã khuất.\",\"viStatus\":\"unverified\"}}},{\"id\":\"camino-8\",\"title\":{\"en\":\"The Road to the Font\",\"vi\":\"Con đường đến giếng Rửa tội\",\"viStatus\":\"unverified\"},\"minutes\":4,\"door\":{\"art\":\"font-water\",\"line\":{\"en\":\"The RCIA path, step by step — so nothing ahead is unknown.\",\"vi\":\"Hành trình RCIA, từng bước một — để không còn điều gì phía trước là ẩn số.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"parish-home\",\"text\":{\"en\":\"RCIA — the Rite of Christian Initiation of Adults — is simply the ancient road into the Church, walked at a parish, at your pace, with a priest who knows your name. It has a few marked gates.\",\"vi\":\"RCIA — nghi thức khai tâm Kitô giáo cho người trưởng thành — đơn giản là con đường cổ xưa dẫn vào Giáo hội, được đi tại một giáo xứ, theo nhịp của bạn, cùng một linh mục biết tên bạn. Con đường ấy có vài cánh cổng được đánh dấu.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"cathedral-door\",\"text\":{\"en\":\"First, the Rite of Acceptance: you stand at the church door, are signed with the cross, and the community welcomes you in. From then on you are a catechumen — an official traveler, already belonging to the household.\",\"vi\":\"Trước hết là Nghi thức Tiếp nhận: bạn đứng nơi cửa nhà thờ, được ghi dấu thánh giá, và cộng đoàn đón bạn vào. Từ đó bạn là dự tòng — một lữ khách chính thức, đã thuộc về gia đình này.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"bible-open\",\"text\":{\"en\":\"Then the catechumenate: weeks of stories, questions, and Sundays — much of what this app has walked beside you. Near Lent comes the Rite of Election: the bishop writes your name in the Book of the Elect.\",\"vi\":\"Rồi đến thời kỳ dự tòng: những tuần lễ của câu chuyện, câu hỏi, và những ngày Chúa nhật — phần lớn những gì ứng dụng này đã cùng bạn đi qua. Gần Mùa Chay là Nghi thức Tuyển chọn: giám mục ghi tên bạn vào Sách Tuyển Chọn.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"font-water\",\"text\":{\"en\":\"In Lent, three quiet Sundays called the scrutinies — prayers of strengthening, nothing to fear. And then the night you have already rehearsed: the fire, the water, the white garment. In My Chapel you can enter the real dates as your parish gives them.\",\"vi\":\"Trong Mùa Chay là ba Chúa nhật lặng lẽ gọi là các nghi thức khảo hạch — những lời nguyện thêm sức mạnh, không có gì phải sợ. Và rồi đến đêm bạn đã được tập dượt: ngọn lửa, dòng nước, tấm áo trắng. Trong Nhà nguyện, bạn có thể ghi các ngày thật khi giáo xứ thông báo.\",\"viStatus\":\"unverified\"}}],\"questions\":[{\"id\":\"q1\",\"kind\":\"order\",\"afterCard\":3,\"prompt\":{\"en\":\"Put the RCIA road in order.\",\"vi\":\"Sắp xếp hành trình RCIA theo thứ tự.\",\"viStatus\":\"unverified\"},\"items\":[{\"en\":\"Rite of Acceptance: the door\",\"vi\":\"Nghi thức Tiếp nhận: cánh cửa\",\"viStatus\":\"unverified\"},{\"en\":\"Catechumenate: the learning seasons\",\"vi\":\"Thời kỳ dự tòng: những mùa học hỏi\",\"viStatus\":\"unverified\"},{\"en\":\"Rite of Election: your name in the book\",\"vi\":\"Nghi thức Tuyển chọn: tên bạn trong sách\",\"viStatus\":\"unverified\"},{\"en\":\"The scrutinies: three Sundays of prayer\",\"vi\":\"Các nghi thức khảo hạch: ba Chúa nhật cầu nguyện\",\"viStatus\":\"unverified\"},{\"en\":\"The Easter Vigil: the font\",\"vi\":\"Đêm Vọng Phục Sinh: giếng Rửa tội\",\"viStatus\":\"unverified\"}],\"why\":{\"en\":\"Door, road, book, prayers, water. Every gate on this path is an embrace, not an exam.\",\"vi\":\"Cánh cửa, con đường, cuốn sách, những lời nguyện, dòng nước. Mỗi cánh cổng trên hành trình này là một vòng tay, không phải một kỳ thi.\",\"viStatus\":\"unverified\"}},{\"id\":\"q2\",\"kind\":\"choice\",\"prompt\":{\"en\":\"Who leads this journey?\",\"vi\":\"Ai dẫn dắt hành trình này?\",\"viStatus\":\"unverified\"},\"options\":[{\"text\":{\"en\":\"Your parish and your priest; this app just walks beside you\",\"vi\":\"Giáo xứ và cha xứ của bạn; ứng dụng này chỉ đồng hành bên bạn\",\"viStatus\":\"unverified\"}},{\"text\":{\"en\":\"This app\",\"vi\":\"Ứng dụng này\",\"viStatus\":\"unverified\"}}],\"answer\":0,\"why\":{\"en\":\"Exactly as it has said from the beginning. The real road is made of people.\",\"vi\":\"Đúng như đã nói từ thuở đầu. Con đường thật được làm nên từ những con người.\",\"viStatus\":\"unverified\"}}],\"treasure\":{\"kind\":\"practice\",\"title\":{\"en\":\"Enter your milestones\",\"vi\":\"Ghi các cột mốc của bạn\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"Open My Chapel → Your RCIA road, and add the dates your parish has given you — even if it is only the next one. The app will keep gentle count beside you.\",\"vi\":\"Mở Nhà nguyện → Hành trình RCIA của bạn, và ghi những ngày giáo xứ đã cho biết — dù chỉ là ngày kế tiếp. Ứng dụng sẽ lặng lẽ đếm ngày cùng bạn.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Which gate are you standing before right now?\",\"vi\":\"Bạn đang đứng trước cánh cổng nào?\",\"viStatus\":\"unverified\"},\"deeper\":{\"ccc\":[1247,1248],\"note\":{\"en\":\"On the catechumenate.\",\"vi\":\"Về thời kỳ dự tòng.\",\"viStatus\":\"unverified\"}}},{\"id\":\"camino-vigil\",\"vigil\":true,\"title\":{\"en\":\"Vigil: Compostela\",\"vi\":\"Canh thức: Compostela\",\"viStatus\":\"unverified\"},\"minutes\":6,\"door\":{\"art\":\"santiago\",\"line\":{\"en\":\"The last vigil of the main road. No questions — only the arrival, and the turn toward home.\",\"vi\":\"Đêm canh thức cuối của con đường chính. Không câu hỏi — chỉ có sự cập bến, và bước chân quay về nhà.\",\"viStatus\":\"unverified\"}},\"cards\":[{\"id\":\"c1\",\"art\":\"camino-way\",\"text\":{\"en\":\"For a thousand years, pilgrims have walked the Camino — weeks of dust, blisters, strangers turned friends — following scallop shells to Santiago. The last hill is called Monte do Gozo: the Mount of Joy, where the towers first come into view.\",\"vi\":\"Suốt một ngàn năm, những người hành hương đã đi đường Camino — hàng tuần bụi đường, những vết phồng chân, những người xa lạ thành bạn hữu — lần theo vỏ sò dẫn về Santiago. Ngọn đồi cuối cùng tên là Monte do Gozo: Đồi Hoan Lạc, nơi những ngọn tháp lần đầu hiện ra.\",\"viStatus\":\"unverified\"}},{\"id\":\"c2\",\"art\":\"santiago\",\"text\":{\"en\":\"Look back once at your own road. The desert, where a fire knew your name. Jerusalem, where the whole story of Jesus was walked, from the garden to the empty tomb.\",\"vi\":\"Hãy nhìn lại con đường của chính bạn. Sa mạc, nơi một ngọn lửa biết tên bạn. Giêrusalem, nơi trọn câu chuyện Chúa Giêsu đã được bước qua, từ khu vườn đến ngôi mộ trống.\",\"viStatus\":\"unverified\"}},{\"id\":\"c3\",\"art\":\"st-peters\",\"text\":{\"en\":\"Rome, where the Church became a family with four marks and a fisherman’s grave at its heart. Lourdes, where seven doors of grace opened — the font, the oil, the mercy room, the rings.\",\"vi\":\"Rôma, nơi Giáo hội hiện ra như một gia đình với bốn dấu chỉ và ngôi mộ người ngư phủ ở trung tâm. Lộ Đức, nơi bảy cánh cửa ân sủng mở ra — giếng nước, dầu thánh, căn phòng thương xót, những chiếc nhẫn.\",\"viStatus\":\"unverified\"}},{\"id\":\"c4\",\"art\":\"camino-way\",\"text\":{\"en\":\"And this last road: the commandments as freedom, the Beatitudes as a portrait, the year as a wheel, the saints as family, hope stronger than death — the Way, walked in ordinary days.\",\"vi\":\"Và chặng đường cuối này: các điều răn như tự do, các Mối Phúc như một bức chân dung, năm phụng vụ như một bánh xe, các thánh như người nhà, niềm hy vọng mạnh hơn sự chết — Con Đường, được bước đi giữa những ngày thường.\",\"viStatus\":\"unverified\"}},{\"id\":\"c5\",\"art\":\"parish-home\",\"text\":{\"en\":\"Here is the pilgrim’s secret, kept for the last card: the true Compostela was never in Spain. It is the church nearest your home — your own parish, where a font waits, where a community will learn your face, where the ordinary Sundays carry you the rest of the way.\",\"vi\":\"Đây là bí mật của người hành hương, được giữ cho tấm thẻ cuối: Compostela đích thực chưa bao giờ ở Tây Ban Nha. Nó là ngôi nhà thờ gần nhà bạn nhất — giáo xứ của chính bạn, nơi một giếng nước đang đợi, nơi cộng đoàn sẽ quen gương mặt bạn, nơi những Chúa nhật bình thường sẽ đưa bạn đi nốt quãng đường còn lại.\",\"viStatus\":\"unverified\"}},{\"id\":\"c6\",\"art\":\"font-water\",\"text\":{\"en\":\"The fifth stamp is ready. The last page of your passport stays faintly embossed, reserved — for a day of fire and water, whenever your free yes brings it. This app will be walking beside you until that page is stamped, and after.\",\"vi\":\"Con dấu thứ năm đã sẵn sàng. Trang cuối của cuốn hộ chiếu vẫn in chìm mờ nhạt, được dành riêng — cho một ngày của lửa và nước, bất cứ khi nào tiếng xin vâng tự do của bạn đưa nó đến. Ứng dụng này sẽ đồng hành bên bạn đến khi trang ấy được đóng dấu, và cả sau đó nữa.\",\"viStatus\":\"unverified\"}}],\"questions\":[],\"treasure\":{\"kind\":\"art\",\"art\":\"santiago\",\"title\":{\"en\":\"The road ahead\",\"vi\":\"Con đường phía trước\",\"viStatus\":\"unverified\"},\"note\":{\"en\":\"Bonus roads are open on the map: the saints of Asia, the Holy Land, Rome’s deeper treasures. A pilgrim never really finishes — she just learns to walk in light.\",\"vi\":\"Những con đường thêm đã mở trên bản đồ: các thánh Á châu và những kho tàng sâu hơn của con đường. Người hành hương không bao giờ thật sự kết thúc — chỉ học cách bước đi trong ánh sáng.\",\"viStatus\":\"unverified\"}},\"reflection\":{\"en\":\"Write a few lines to the person who will finish this road — to yourself, a little further on.\",\"vi\":\"Hãy viết vài dòng cho người sẽ đi hết con đường này — cho chính bạn, ở một quãng xa hơn.\",\"viStatus\":\"unverified\"}}]},\"lesson\":\"$5:props:world:lessons:3\"}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\
