{id:'s05',title:'Discussing MOQ and Pack Configuration',titleVi:'Thảo Luận Số Lượng Tối Thiểu',context:'Discussing minimum order quantity and pack formats for Organika Sparkling Electrolyte. The buyer wants to start small.',culturalNote:'Always allow a buyer to start small. The trial order builds trust and proves your product. A Vietnamese buyer who says let me try first is a serious buyer.',lines:[
{role:'Michael (You)',you:true,vi:'Đơn hàng tối thiểu tiêu chuẩn là 60 thùng, tức 20 thùng mỗi hương vị.',en:'Standard minimum order is 60 cases, meaning 20 cases per flavor.',ph:'duhn hahng toy thyew tyew chwun lah 60 thoong tuhk 20 thoong moy huhng vee'},
{role:'Buyer (Chi Mai)',you:false,vi:'Chúng tôi muốn thử nhỏ hơn trước. Có thể bắt đầu từ 30 thùng không?',en:'We want to start with a smaller trial. Can we start from 30 cases?',ph:'choong toy mwon thuh nyaw huhn truhk kaw thay bat doh tuh 30 thoong khohng'},
{role:'Michael (You)',you:true,vi:'Cho đơn thử, tôi có thể sắp xếp 30 thùng — 10 thùng mỗi hương vị mâm xôi, chanh xanh chanh vàng, và chanh dây thơm.',en:'For a trial order, I can arrange 30 cases — 10 cases each of Raspberry, Lime Lemon, and Passion Fruit Pineapple.',ph:'chaw duhn thuh toy kaw thay sap sayp 30 thoong 10 thoong moy huhng vee mum soy chan san chan vahng vah chan yay thuhm'},
{role:'Buyer (Chi Mai)',you:false,vi:'Tốt. Cả vỉ 4 lon lẫn lon đơn lẻ chứ?',en:'Good. Both 4-packs and single cans right?',ph:'toht kah vee 4 lawn lun lawn duhn leh chuh'},
{role:'Michael (You)',you:true,vi:'Đúng. Anh/Chị muốn tỉ lệ như thế nào giữa vỉ 4 lon và lon đơn?',en:'Correct. What ratio would you like between 4-packs and single cans?',ph:'doong an/chee mwon tee lay nyuh thay now yuh-ah vee 4 lawn vah lawn duhn'},
{role:'Buyer (Chi Mai)',you:false,vi:'70% vỉ 4 lon, 30% lon đơn.',en:'70% 4-packs, 30% single cans.',ph:'70 vee 4 lawn 30 lawn duhn'},
{role:'Michael (You)',you:true,vi:'Được. Tôi có thể giao hàng trong 5 đến 7 ngày làm việc sau khi nhận cọc.',en:'Understood. I can deliver within 5 to 7 working days after receiving the deposit.',ph:'duhk toy kaw thay yow hahng trawng 5 dayn 7 ngeye lahm vyek soh khee nyun kawk'},
{role:'Buyer (Chi Mai)',you:false,vi:'Khi nào tôi nhận được báo giá chính thức?',en:'When will I receive the official quotation?',ph:'khee now toy nyun duhk bow yah chin thuhk'}
]},
{id:'s06',title:'Arranging Delivery and Lead Time',titleVi:'Sắp Xếp Giao Hàng',context:'The buyer has a deadline and needs to know if you can deliver on time. You must be honest and give ranges, never a hard commitment.',culturalNote:'Never promise a specific date you cannot guarantee. Give ranges and explain what factors affect timing. If something delays, inform the buyer immediately. Surprises destroy trust in Vietnam.',lines:[
{role:'Buyer (Anh Long)',you:false,vi:'Thời gian giao hàng thông thường của các anh là bao lâu?',en:'What is your usual delivery time?',ph:'thuh-ee yahn yow hahng thohng thuhng koo-ah kahk an lah bow loh'},
{role:'Michael (You)',you:true,vi:'Với hàng có sẵn trong kho Việt Nam, thường từ 5 đến 7 ngày làm việc.',en:'For goods already in our Vietnam warehouse, usually 5 to 7 working days.',ph:'vuh-ee hahng kaw san trawng khaw vyet nahm thuhng tuh 5 dayn 7 ngeye lahm vyek'},
{role:'Buyer (Anh Long)',you:false,vi:'Chúng tôi cần hàng trước ngày 15 tháng 8.',en:'We need the goods before August 15.',ph:'choong toy kun hahng truhk ngeye 15 thahng 8'},
{role:'Michael (You)',you:true,vi:'Nếu anh xác nhận đơn hàng và chuyển cọc trước ngày 28 tháng 7, chúng tôi có thể đảm bảo giao trước ngày 10 tháng 8.',en:'If you confirm the order and transfer the deposit before July 28, we can ensure delivery before August 10.',ph:'nay-oo an sahk nyun duhn hahng vah chwyen kawk truhk ngeye 28 thahng 7 choong toy kaw thay dahm bow yow truhk ngeye 10 thahng 8'},
{role:'Buyer (Anh Long)',you:false,vi:'Nếu giao trễ thì sao?',en:'What if delivery is late?',ph:'nay-oo yow tray thee sow'},
{role:'Michael (You)',you:true,vi:'Chúng tôi cam kết thông báo ngay nếu có rủi ro chậm trễ và cập nhật tình trạng đơn hàng hàng ngày.',en:'We commit to notifying you immediately if there is any delay risk and updating you on order status daily.',ph:'choong toy kahm kayt thohng bow ngeye nay-oo kaw roo-ee raw chum tray vah kup nyut tin trahng duhn hahng hahng ngeye'},
{role:'Buyer (Anh Long)',you:false,vi:'Hàng giao đến kho hay đến từng cửa hàng?',en:'Is delivery to our warehouse or to individual stores?',ph:'hahng yow dayn khaw heye dayn tuhng kuh-ah hahng'},
{role:'Michael (You)',you:true,vi:'Giao đến kho trung tâm của anh/chị. Phí vận chuyển nội thành TPHCM miễn phí cho đơn từ 60 thùng trở lên.',en:'Delivery to your central warehouse. Shipping within HCMC is free for orders of 60 cases or more.',ph:'yow dayn khaw troong tum koo-ah an/chee fee vun chwyen noy than TPHCM myen fee chaw duhn tuh 60 thoong truh layn'}
]},
{id:'s07',title:'Pitching Organika Sparkling Electrolyte',titleVi:'Giới Thiệu Sản Phẩm Organika',context:'A retail floor pitch of Organika Sparkling Electrolyte. Use the real product, real flavors, real formats. This is your core sales script.',culturalNote:'Lead with the benefit, not the brand. Vietnamese buyers want to know what it does for their customers first. Then explain why Organika is the right source for that benefit. Canadian origin is a trust anchor.',lines:[
{role:'Michael (You)',you:true,vi:'Hôm nay tôi muốn giới thiệu Organika Sparkling Electrolyte — đồ uống chức năng có ga từ Canada.',en:'Today I would like to introduce Organika Sparkling Electrolyte, a functional sparkling drink from Canada.',ph:'hohm neye toy mwon yuh-ee thyew Organika Sparkling Electrolyte doh wohng chuhk nang kaw gah tuh Canada'},
{role:'Buyer (Chi Phuong)',you:false,vi:'Sản phẩm này khác gì so với nước có ga thông thường?',en:'How is this product different from regular sparkling water?',ph:'sahn fum neye khahk yee saw vuh-ee nuhk kaw gah thohng thuhng'},
{role:'Michael (You)',you:true,vi:'Organika Sparkling Electrolyte bổ sung chất điện giải thiết yếu, hỗ trợ miễn dịch và bù nước hiệu quả — không đường, không chất bảo quản nhân tạo.',en:'Organika Sparkling Electrolyte replenishes essential electrolytes, supports immunity and rehydrates effectively — no sugar, no artificial preservatives.',ph:'Organika Sparkling Electrolyte boh soong chut dyen yeye thyet yew hoh truh myen yik vah boo nuhk hyew kwah khohng duhng khohng chut bow kwahn nyun tow'},
{role:'Buyer (Chi Phuong)',you:false,vi:'Có những hương vị nào?',en:'What flavors are available?',ph:'kaw nyuhng huhng vee now'},
{role:'Michael (You)',you:true,vi:'Có ba hương vị: mâm xôi, chanh xanh và chanh vàng, và chanh dây với thơm.',en:'Three flavors: Raspberry, Lime and Lemon, and Passion Fruit with Pineapple.',ph:'kaw bah huhng vee mum soy chan san vah chan vahng vah chan yay vuh-ee thuhm'},
{role:'Buyer (Chi Phuong)',you:false,vi:'Có dạng đóng gói gì?',en:'What packaging formats are available?',ph:'kaw yahng dawng goy yee'},
{role:'Michael (You)',you:true,vi:'Có vỉ 4 lon và lon đơn lẻ. Vỉ 4 lon rất phù hợp để trưng bày trên kệ siêu thị và bán rất tốt trên Shopee và TikTok Shop.',en:'4-packs and single cans. The 4-pack is ideal for supermarket shelf display and sells very well on Shopee and TikTok Shop.',ph:'kaw vee 4 lawn vah lawn duhn leh vee 4 lawn rut foo huhp day truhng beye trayn kay syew thee vah bahn rut toht trayn Shopee vah TikTok Shop'},
{role:'Buyer (Chi Phuong)',you:false,vi:'Người tiêu dùng mục tiêu là ai?',en:'Who is the target consumer?',ph:'nguh-uh-ee tyew yoong mook tyew lah eye'},
{role:'Michael (You)',you:true,vi:'Người tiêu dùng năng động, quan tâm đến sức khỏe, từ 20 đến 45 tuổi — đặc biệt phụ nữ và người đi làm tại TPHCM.',en:'Active, health-conscious consumers aged 20 to 45 — especially women and working professionals in HCMC.',ph:'nguh-uh-ee tyew yoong nang dohng kwahn tum dayn suhk khweh tuh 20 dayn 45 too-oy dak byet foo nuh vah nguh-uh-ee dee lahm teye TPHCM'},
{role:'Buyer (Chi Phuong)',you:false,vi:'Anh có kế hoạch hỗ trợ marketing gì không?',en:'Do you have any marketing support plans?',ph:'anh co keh hwak hoh tro marketing yee khong'},
{role:'Michael (You)',you:true,vi:'Dạ, chúng tôi hỗ trợ 3% doanh thu cho ngân sách marketing, bao gồm POSM, sampling tại điểm bán và hỗ trợ chạy quảng cáo trên Shopee.',en:'Yes, we provide 3% of revenue as marketing budget, covering POSM materials, in-store sampling, and Shopee advertising support.',ph:'yah choong toy hoh truh 3 ywan thoo chaw ngun sik marketing bow gohm POSM sampling teye dyem bahn vah hoh truh cheye kwahng kow trayn Shopee'}
]},
{id:'s08',title:'Taking and Confirming an Order',titleVi:'Nhận và Xác Nhận Đơn Hàng',context:'The buyer is ready to place an order. Confirm all details precisely, then confirm payment terms.',culturalNote:'Repeat the order back verbatim to avoid misunderstandings. Misquantities are common. Always confirm in writing (Zalo or email) after the verbal confirmation.',lines:[
{role:'Buyer (Chi Ngoc)',you:false,vi:'Tôi muốn đặt 30 thùng mâm xôi, 20 thùng chanh xanh chanh vàng, và 10 thùng chanh dây thơm.',en:'I want to order 30 cases Raspberry, 20 cases Lime Lemon, and 10 cases Passion Fruit Pineapple.',ph:'toy mwon dat 30 thoong mum soy 20 thoong chan san chan vahng vah 10 thoong chan yay thuhm'},
{role:'Michael (You)',you:true,vi:'Dạ, để tôi xác nhận lại: 30 thùng mâm xôi, 20 thùng chanh xanh chanh vàng, 10 thùng chanh dây thơm. Tổng cộng 60 thùng.',en:'Yes, let me confirm: 30 cases Raspberry, 20 cases Lime Lemon, 10 cases Passion Fruit Pineapple. Total 60 cases.',ph:'yah day toy sahk nyun leye 30 thoong mum soy 20 thoong chan san chan vahng 10 thoong chan yay thuhm tohng kohng 60 thoong'},
{role:'Buyer (Chi Ngoc)',you:false,vi:'Đúng rồi. Điều khoản thanh toán thế nào?',en:'Correct. What are the payment terms?',ph:'doong roy dyew khwahn than twahn thay now'},
{role:'Michael (You)',you:true,vi:'Tiêu chuẩn là đặt cọc 30% khi xác nhận đơn, và thanh toán 70% còn lại khi nhận hàng.',en:'Standard is 30% deposit when confirming the order, and 70% balance on delivery.',ph:'tyew chwun lah dat kawk 30 khee sahk nyun duhn vah than twahn 70 kawn leye khee nyun hahng'},
{role:'Buyer (Chi Ngoc)',you:false,vi:'Chúng tôi muốn thanh toán 30 ngày sau khi nhận hàng.',en:'We want to pay 30 days after receiving the goods.',ph:'choong toy mwon than twahn 30 ngeye soh khee nyun hahng'},
{role:'Michael (You)',you:true,vi:'Cho đơn đầu tiên, chúng tôi áp dụng điều khoản tiêu chuẩn. Sau khi có 2 đến 3 tháng hợp tác tốt, chúng ta hoàn toàn có thể xem xét điều khoản tốt hơn.',en:'For the first order we apply standard terms. After 2 to 3 months of good cooperation, we can certainly revisit better terms.',ph:'chaw duhn doh tyen choong toy ahp yoong dyew khwahn tyew chwun soh khee kaw 2 dayn 3 thahng huhp tahk toht choong tah hwahn twahn kaw thay sem set dyew khwahn toht huhn'},
{role:'Buyer (Chi Ngoc)',you:false,vi:'Được. Khi nào tôi nhận được đơn đặt hàng chính thức?',en:'Okay. When will I receive the official purchase order?',ph:'duhk khee now toy nyun duhk duhn dat hahng chin thuhk'},
{role:'Michael (You)',you:true,vi:'Tôi sẽ gửi đơn đặt hàng và hóa đơn cọc qua email và Zalo trong vòng 2 giờ.',en:'I will send the purchase order and deposit invoice by email and Zalo within 2 hours.',ph:'toy seh guh-ee duhn dat hahng vah hwah duhn kawk kwah email vah Zalo trawng vawng 2 yuh'}
]},
{id:'s09',title:'Closing and Confirming Next Steps',titleVi:'Chốt Lại và Bước Tiếp Theo',context:'The meeting is ending well. You want to close on a high note and set clear next steps that maintain momentum.',culturalNote:'Always close with concrete next steps and a timeline. Vague meetings lead to vague follow-through. Vietnamese business relationships need momentum. Silences after a meeting suggest disinterest.',lines:[
{role:'Michael (You)',you:true,vi:'Tôi rất vui vì chúng ta có buổi thảo luận hiệu quả hôm nay.',en:'I am very pleased we had such a productive discussion today.',ph:'toy rut voo-ee vee choong tah kaw boo-oy thow lwun hyew kwah hohm neye'},
{role:'Buyer (Chi Lan)',you:false,vi:'Tôi cũng vậy. Sản phẩm có tiềm năng tốt cho thị trường TPHCM.',en:'Same here. The product has good potential for the HCMC market.',ph:'toy koong vay sahn fum kaw tyem nang toht chaw thee truhng TPHCM'},
{role:'Michael (You)',you:true,vi:'Bước tiếp theo là tôi sẽ gửi đề xuất chính thức và mẫu thử trong vòng 3 ngày làm việc. Chị có muốn nhận mẫu thử không?',en:'Next step: I will send the official proposal and product samples within 3 working days. Would you like to receive samples?',ph:'buhk tyep thay-oh lah toy seh guh-ee day swut chin thuhk vah moh thuh trawng vawng 3 ngeye lahm vyek chee kaw mwon nyun moh thuh khohng'},
{role:'Buyer (Chi Lan)',you:false,vi:'Dạ, tôi muốn thử sản phẩm trước khi quyết định.',en:'Yes, I want to try the product before deciding.',ph:'yah toy mwon thuh sahn fum truhk khee kwyet din'},
{role:'Michael (You)',you:true,vi:'Tôi sẽ gửi mẫu cả ba hương vị. Chị có thể chia sẻ phản hồi sau 5 ngày dùng thử được không?',en:'I will send samples of all three flavors. Can you share feedback after 5 days of trial?',ph:'toy seh guh-ee moh kah bah huhng vee chee kaw thay chee-uh seh fahn hoy soh 5 ngeye yoong thuh duhk khohng'},
{role:'Buyer (Chi Lan)',you:false,vi:'Được. Liên lạc qua Zalo nhé, tôi phản hồi nhanh hơn.',en:'Okay. Contact me via Zalo, I respond faster there.',ph:'duhk lyen lahk kwah Zalo nyeh toy fahn hoy nyan huhn'},
{role:'Michael (You)',you:true,vi:'Dạ, tôi sẽ gửi số Zalo ngay bây giờ. Cảm ơn chị rất nhiều về thời gian và sự cởi mở hôm nay.',en:'Yes, I will send my Zalo right now. Thank you very much for your time and openness today.',ph:'yah toy seh guh-ee soh Zalo ngeye bay yuh kahm uhn chee rut nyyew vay thuh-ee yahn vah suh kuh-ee muh hohm neye'},
{role:'Buyer (Chi Lan)',you:false,vi:'Cảm ơn anh Michael. Hẹn gặp lại anh sớm!',en:'Thank you Michael. See you again soon!',ph:'kahm uhn an Michael hen gap leye an suhm'}
]},
{id:'s10',title:'Small Talk Over Coffee or a Meal',titleVi:'Nói Chuyện Trong Bữa Ăn',context:'You are having lunch or coffee with a business contact before or after a meeting. This is where relationships are actually built in Vietnam.',culturalNote:'Sharing a meal is how Vietnamese business relationships are cemented. Accept everything offered. Try all the food. The host pays — do not fight for the bill. Ask about family, city, their opinion on things. Pivot to business naturally, not abruptly. The person who relaxes first signals trust.',lines:[
{role:'Michael (You)',you:true,vi:'Cảm ơn anh/chị đã mời ăn trưa. Nhà hàng này ngon quá!',en:'Thank you for inviting me to lunch. This restaurant is so delicious!',ph:'kahm uhn an/chee dah muh-ee an truh-ah nyah hahng neye ngawn kwah'},
{role:'Buyer (Anh Minh)',you:false,vi:'Anh ăn được đồ Việt Nam không? Cay không ngại chứ?',en:'Can you eat Vietnamese food? Not afraid of spicy right?',ph:'an an duhk doh vyet nahm khohng keye khohng ngeye chuh'},
{role:'Michael (You)',you:true,vi:'Tôi rất thích đồ Việt Nam, đặc biệt là phở và bún bò Huế. Cay vừa vừa là được.',en:'I love Vietnamese food, especially pho and Bun Bo Hue. Moderately spicy is fine.',ph:'toy rat thik doh Vyet Nam, dat byet la foh va bun boh Hweh. kay vuh-a vuh-a la dook'},
{role:'Buyer (Anh Minh)',you:false,vi:'Anh thích Sài Gòn không? So với Canada thế nào?',en:'Do you like Saigon? How does it compare to Canada?',ph:'an thik seye gawn khohng saw vuh-ee Canada thay now'},
{role:'Michael (You)',you:true,vi:'Thích lắm! Sài Gòn năng động và đầy sức sống. Canada đẹp nhưng yên tĩnh hơn nhiều. Ở đây tôi cảm thấy nhiều cơ hội hơn.',en:'Very much! Saigon is dynamic and full of energy. Canada is beautiful but much quieter. Here I feel more opportunities.',ph:'thik lam seye gawn nang dohng vah day suhk sohng Canada dep nyuhng yen tin huhn nyyew uh day toy kahm thay nyyew kuh hoy huhn'},
{role:'Buyer (Anh Minh)',you:false,vi:'Gia đình anh có ở đây không?',en:'Is your family here with you?',ph:'yah din an kaw uh day khohng'},
{role:'Michael (You)',you:true,vi:'Không, vợ và hai con tôi ở Vancouver. Nhưng họ rất muốn đến Sài Gòn thăm. Nói anh nghe, vợ tôi rất muốn ăn bánh mì Sài Gòn.',en:'No, my wife and two children are in Vancouver. But they really want to visit Saigon. My wife especially wants to eat Saigon banh mi.',ph:'khohng vuh vah heye kawn toy uh Vancouver nyuhng haw rut mwon dayn seye gawn tham noy an ngeh vuh toy rut mwon an ban mee seye gawn'},
{role:'Buyer (Anh Minh)',you:false,vi:'Mời cả gia đình sang chơi nhé! Sài Gòn luôn chào đón.',en:'Invite the whole family to come visit! Saigon always welcomes.',ph:'muh-ee kah yah din sahng chuh-ee nyeh seye gawn lwon chow dawn'},
{role:'Michael (You)',you:true,vi:'Cảm ơn anh! Nhân tiện, anh thấy người tiêu dùng TPHCM đang thay đổi thói quen như thế nào sau COVID?',en:'Thank you! By the way, how do you see HCMC consumers changing their habits after COVID?',ph:'kahm uhn an nyun tyen an thay nguh-uh-ee tyew yoong TPHCM dahng theye doy thoy kwen nyuh thay now soh COVID'},
{role:'Buyer (Anh Minh)',you:false,vi:'Thay đổi rất nhiều. Người ta quan tâm đến sức khỏe hơn, sẵn sàng trả nhiều hơn cho sản phẩm chất lượng. Thị trường cho anh đang mở ra đó.',en:'Changing a lot. People care more about health, willing to pay more for quality products. The market is opening up for you.',ph:'theye doy rut nyyew nguh-uh-ee tah kwahn tum dayn suhk khweh huhn san sahng trah nyyew huhn chaw sahn fum chut luhng thee truhng chaw an dahng muh rah daw'}
]}
,{id:'s11',title:'Handling a Damaged Shipment Complaint',titleVi:'Xử Lý Khiếu Nại Hàng Hỏng',context:'Your GT distributor calls: a pallet arrived with dented cans. How you handle the first complaint defines the relationship. Vietnamese partners watch how you take responsibility.',culturalNote:'Never argue about fault first. Acknowledge, apologize for the inconvenience (even before investigating), commit to a concrete next step with a date, then investigate. Saving the partner\'s face and showing ownership matters more than the money involved.',lines:[
{role:'Distributor (Anh Quốc)',you:false,vi:'Anh Michael, lô hàng hôm qua có vấn đề. Khoảng 20 thùng bị móp lon.',en:'Michael, yesterday\'s shipment has a problem. About 20 cases have dented cans.',ph:'an Michael loh hahng hohm kwah kaw vun day khwahng 20 thoong bee mawp lawn'},
{role:'Michael (You)',you:true,vi:'Dạ, em xin lỗi anh về sự bất tiện này. Anh có thể chụp hình những thùng bị móp gửi em qua Zalo được không?',en:'I am sorry for this inconvenience. Could you photograph the dented cases and send them to me on Zalo?',ph:'yah em seen loy an vay suh but tyen neye an kaw thay choop hin nyuhng thoong bee mawp guh-ee em kwah Zalo duhk khohng'},
{role:'Distributor (Anh Quốc)',you:false,vi:'Được, tôi gửi ngay. Bên anh xử lý thế nào?',en:'Okay, sending now. How will your side handle it?',ph:'duhk toy guh-ee ngeye bayn an suh lee thay now'},
{role:'Michael (You)',you:true,vi:'Em cam kết đổi toàn bộ hàng hỏng trong vòng 5 ngày làm việc, và bên em chịu chi phí vận chuyển.',en:'I commit to replacing all damaged goods within 5 working days, and we cover the shipping cost.',ph:'em kahm kayt doy twahn boh hahng hawng trawng vawng 5 ngeye lahm vyek vah bayn em chew chee fee vun chwyen'},
{role:'Distributor (Anh Quốc)',you:false,vi:'Tốt. Nhưng tôi cần hàng gấp vì cuối tuần có chương trình khuyến mãi.',en:'Good. But I need the goods urgently because there is a promotion this weekend.',ph:'toht nyuhng toy kun hahng gup vee koo-oy twun kaw chuhng trin khwyen meye'},
{role:'Michael (You)',you:true,vi:'Em hiểu. Em sẽ ưu tiên giao 20 thùng thay thế trước thứ Sáu. Em xác nhận lại với anh trong hôm nay.',en:'I understand. I will prioritize delivering the 20 replacement cases before Friday. I will confirm with you today.',ph:'em hyew em seh uh-oo tyen yow 20 thoong theye thay truhk thuh soh em sahk nyun leye vuh-ee an trawng hohm neye'},
{role:'Distributor (Anh Quốc)',you:false,vi:'Cảm ơn anh xử lý nhanh. Làm ăn với bên anh yên tâm.',en:'Thanks for handling it quickly. Doing business with your side is reassuring.',ph:'kahm uhn an suh lee nyan lahm an vuh-ee bayn an yen tum'},
{role:'Michael (You)',you:true,vi:'Dạ, uy tín là quan trọng nhất với Organika. Em cũng sẽ kiểm tra khâu đóng gói để việc này không lặp lại.',en:'Reputation is most important to Organika. I will also check the packing process so this does not happen again.',ph:'yah wee teen lah kwahn trawng nyut vuh-ee Organika em koong seh kyem trah khoh dawng goy day vyek neye khohng lap leye'}
]},
{id:'s12',title:'Quarterly Review with Your Distributor',titleVi:'Họp Đánh Giá Quý',context:'End of quarter review with your HCMC distributor: results versus target, what worked, next quarter plan. This meeting keeps the partnership accountable and warm at the same time.',culturalNote:'Open with appreciation before numbers. Deliver a miss as "we" not "you". Pair every request (higher target, more coverage) with support you bring (trade budget, sampling, training). Close with the relationship, not the spreadsheet.',lines:[
{role:'Michael (You)',you:true,vi:'Cảm ơn chị Thảo và đội ngũ đã làm việc rất chăm chỉ quý vừa rồi. Chúng ta cùng xem kết quả nhé.',en:'Thank you Ms. Thao and the team for working very hard last quarter. Let us look at the results together.',ph:'kahm uhn chee thow vah doy ngoo dah lahm vyek rut cham chee kwee vuh-ah roy choong tah koong sem kayt kwah nyeh'},
{role:'Distributor (Chị Thảo)',you:false,vi:'Quý này bên em đạt 85% chỉ tiêu. Kênh siêu thị tốt, nhưng kênh cửa hàng tiện lợi còn yếu.',en:'This quarter we reached 85% of target. Supermarkets are good, but convenience stores are still weak.',ph:'kwee neye bayn em daht 85 chee tyew kayn syew thee toht nyuhng kayn kuh-ah hahng tyen luh-ee kawn yew'},
{role:'Michael (You)',you:true,vi:'85% trong quý đầu là nền tảng tốt. Chúng ta cùng tìm cách cải thiện kênh tiện lợi. Theo chị, khó khăn chính là gì?',en:'85% in the first quarter is a good foundation. Let us find ways to improve the convenience channel together. In your view, what is the main difficulty?',ph:'85 trawng kwee doh lah nayn tahng toht choong tah koong teem kik keye thyen kayn tyen luh-ee thay-oh chee khaw khan chin lah yee'},
{role:'Distributor (Chị Thảo)',you:false,vi:'Giá lẻ hơi cao so với mặt bằng cửa hàng tiện lợi, và nhân viên chưa hiểu sản phẩm.',en:'The retail price is a bit high for convenience stores, and staff do not understand the product yet.',ph:'yah leh huh-ee kow saw vuh-ee mat bang kuh-ah hahng tyen luh-ee vah nyun vyen chuh-ah hyew sahn fum'},
{role:'Michael (You)',you:true,vi:'Về giá, em đề xuất thử gói lẻ 1 lon cho kênh này. Về đào tạo, em sẽ tổ chức buổi training cho nhân viên bán hàng vào tháng sau.',en:'On price, I propose trying the single-can format for this channel. On training, I will organize a session for the sales staff next month.',ph:'vay yah em day swut thuh goy leh 1 lawn chaw kayn neye vay dow tow em seh toh chuhk boo-oy training chaw nyun vyen bahn hahng vow thahng soh'},
{role:'Distributor (Chị Thảo)',you:false,vi:'Vậy tốt quá. Chỉ tiêu quý sau bên anh muốn thế nào?',en:'That is great. What target does your side want for next quarter?',ph:'vay toht kwah chee tyew kwee soh bayn an mwon thay now'},
{role:'Michael (You)',you:true,vi:'Em đề xuất tăng 15%, kèm ngân sách khuyến mãi thương mại 8% doanh thu và chương trình dùng thử cuối tuần.',en:'I propose a 15% increase, paired with a trade promotion budget of 8% of revenue and weekend sampling programs.',ph:'em day swut tang 15 kem ngun sik khwyen meye thuhng meye 8 ywan thoo vah chuhng trin yoong thuh koo-oy twun'},
{role:'Distributor (Chị Thảo)',you:false,vi:'Hợp lý. Bên em đồng ý. Cảm ơn anh luôn hỗ trợ tận tình.',en:'Reasonable. We agree. Thank you for always supporting us so attentively.',ph:'huhp lee bayn em dohng ee kahm uhn an lwon hoh truh tun tin'},
{role:'Michael (You)',you:true,vi:'Cảm ơn chị. Thành công của chị cũng là thành công của Organika. Tối nay mời cả đội đi ăn mừng nhé!',en:'Thank you. Your success is Organika\'s success too. Tonight I invite the whole team to a celebration dinner!',ph:'kahm uhn chee than kohng koo-ah chee koong lah than kohng koo-ah Organika toy neye muh-ee kah doy dee an muhng nyeh'}
]}
,{id:'s13',title:'Tet Visit to a Key Account',titleVi:'Thăm Đối Tác Dịp Tết',context:'The week before Tet you visit your most important buyer with a gift basket. No selling today — this visit is pure relationship, and skipping it would be noticed.',culturalNote:'Bring a gift basket (imported items score well) with both hands. Wish health, prosperity, and family happiness before anything business. Do not discuss problems or negotiate. Expect lucky-money customs for staff (li xi). The goodwill from a proper Tet visit carries the whole year.',lines:[
{role:'Michael (You)',you:true,vi:'Chào chị Linh! Em ghé chúc Tết chị và cả nhà trước khi nghỉ lễ.',en:'Hello Ms. Linh! I stopped by to wish you and your family a happy Tet before the holiday.',ph:'chow chee lin em geh chook tayt chee vah kah nyah truhk khee ngee lay'},
{role:'Buyer (Chị Linh)',you:false,vi:'Ôi, anh Michael! Quý hóa quá. Mời anh vào uống trà.',en:'Oh, Michael! How thoughtful. Come in for tea.',ph:'oy an Michael kwee hwah kwah muh-ee an vow wohng trah'},
{role:'Michael (You)',you:true,vi:'Em có món quà nhỏ từ Canada, chúc chị năm mới sức khỏe dồi dào, vạn sự như ý.',en:'I have a small gift from Canada — wishing you abundant health and everything as you wish in the new year.',ph:'em kaw mawn kwah nyaw tuh Canada chook chee nam muh-ee suhk khweh yoy yow vahn suh nyuh ee'},
{role:'Buyer (Chị Linh)',you:false,vi:'Cảm ơn anh nhiều! Anh chu đáo quá. Năm nay anh ăn Tết ở Việt Nam hả?',en:'Thank you so much! You are so considerate. Are you spending Tet in Vietnam this year?',ph:'kahm uhn an nyyew an choo dow kwah nam neye an an tayt uh vyet nahm hah'},
{role:'Michael (You)',you:true,vi:'Dạ, năm nay em ở lại Sài Gòn ăn Tết. Em muốn hiểu văn hóa Tết hơn.',en:'Yes, this year I am staying in Saigon for Tet. I want to understand Tet culture better.',ph:'yah nam neye em uh leye seye gawn an tayt em mwon hyew van hwah tayt huhn'},
{role:'Buyer (Chị Linh)',you:false,vi:'Hay quá! Mùng Ba anh ghé nhà tôi ăn Tết với gia đình nhé.',en:'Wonderful! On the third day of Tet, come to my house to celebrate with my family.',ph:'heye kwah moong bah an geh nyah toy an tayt vuh-ee yah din nyeh'},
{role:'Michael (You)',you:true,vi:'Em rất vinh dự! Em sẽ mang theo chút quà cho các cháu.',en:'I would be honored! I will bring small gifts for the children.',ph:'em rut vin yuh em seh mahng thay-oh choot kwah chaw kahk choh'},
{role:'Buyer (Chị Linh)',you:false,vi:'Khỏi khách sáo! Chúc Organika năm mới phát tài, hợp tác của chúng ta ngày càng bền chặt.',en:'No need for formalities! Wishing Organika prosperity in the new year, and that our cooperation grows ever stronger.',ph:'khoy khik sow chook Organika nam muh-ee faht teye huhp tahk koo-ah choong tah ngeye kahng bayn chat'},
{role:'Michael (You)',you:true,vi:'Dạ, chúc mừng năm mới! An khang thịnh vượng!',en:'Happy new year! Peace, health and prosperity!',ph:'yah chook muhng nam muh-ee ahn khahng thin vuhng'}
]}
,{id:'s14',title:'Trade Show Booth Pitch',titleVi:'Giới Thiệu Tại Hội Chợ',context:'You are working the Organika booth at a food and beverage expo in HCMC. A visitor with a retailer badge slows down. You have sixty seconds to earn a business card.',culturalNote:'Trade show Vietnamese is fast and informal. Offer a chilled sample immediately — tasting beats talking. Ask what channel they are in before pitching. Get the Zalo or card early; follow up within 48 hours or the lead is dead.',lines:[
{role:'Michael (You)',you:true,vi:'Chào anh! Mời anh dùng thử nước điện giải có ga từ Canada — lạnh lắm, đã lắm!',en:'Hello! Try our sparkling electrolyte water from Canada — ice cold, super refreshing!',ph:'chow an muh-ee an yoong thuh nuhk dyen yeye kaw gah tuh Canada lan lam dah lam'},
{role:'Visitor (Anh Tú)',you:false,vi:'Ừ, thử xem. Vị gì đây?',en:'Sure, let me try. What flavor is this?',ph:'uh thuh sem vee yee day'},
{role:'Michael (You)',you:true,vi:'Đây là vị chanh dây thơm — bán chạy nhất của tụi em. Còn có mâm xôi và chanh nữa.',en:'This is passion fruit pineapple — our best seller. There is also raspberry and lime lemon.',ph:'day lah vee chan yay thuhm bahn cheye nyut koo-ah too-ee em kawn kaw mum soy vah chan nuh-ah'},
{role:'Visitor (Anh Tú)',you:false,vi:'Ngon đó! Uống nhẹ, không ngọt gắt. Bên em phân phối chưa?',en:'Tasty! Light, not cloyingly sweet. Do you have distribution yet?',ph:'ngawn daw wohng nyeh khohng ngawt gat bayn em fun foy chuh-ah'},
{role:'Michael (You)',you:true,vi:'Dạ có ở WinMart và Long Châu rồi. Anh đang làm kênh nào ạ?',en:'Yes, we are in WinMart and Long Chau already. Which channel are you in?',ph:'yah kaw uh WinMart vah lawng choh roy an dahng lahm kayn now ah'},
{role:'Visitor (Anh Tú)',you:false,vi:'Tôi có chuỗi 30 cửa hàng tiện lợi ở Bình Dương và Đồng Nai.',en:'I have a chain of 30 convenience stores in Binh Duong and Dong Nai.',ph:'toy kaw choo-oy 30 kuh-ah hahng tyen luh-ee uh bin yuhng vah dohng neye'},
{role:'Michael (You)',you:true,vi:'Hay quá! Lon đơn của tụi em rất hợp kênh tiện lợi. Anh cho em xin Zalo, em gửi bảng giá và mẫu thử tuần này luôn.',en:'Excellent! Our single cans fit convenience stores perfectly. May I get your Zalo? I will send the price list and samples this week.',ph:'heye kwah lawn duhn koo-ah too-ee em rut huhp kayn tyen luh-ee an chaw em seen Zalo em guh-ee bahng yah vah moh thuh twun neye lwon'},
{role:'Visitor (Anh Tú)',you:false,vi:'Được, đây số tôi. Gửi sớm nhé, tháng sau tôi chốt danh mục hàng mới.',en:'Okay, here is my number. Send it soon — I finalize the new product list next month.',ph:'duhk day soh toy guh-ee suhm nyeh thahng soh toy choht yan mook hahng muh-ee'},
{role:'Michael (You)',you:true,vi:'Dạ, em gửi trong 48 tiếng. Cảm ơn anh Tú, chúc anh tham quan hội chợ vui vẻ!',en:'I will send it within 48 hours. Thank you Tu, enjoy the rest of the expo!',ph:'yah em guh-ee trawng 48 tyeng kahm uhn an too chook an thahm kwahn hoy chuh voo-ee veh'}
]}
,{id:'s15',title:'Hiring a Sales Rep',titleVi:'Tuyển Nhân Viên Bán Hàng',context:'You are interviewing a candidate for a Ho Chi Minh City sales rep role covering general trade. You want someone with route relationships and hunger, not just a resume.',culturalNote:'Vietnamese candidates may undersell themselves out of modesty. Ask about specific stores and relationships, not abstractions. Salary talk is direct here; commission structure matters more than base to a good GT rep. Warmth in the interview signals you are a good boss to work for.',lines:[
{role:'Michael (You)',you:true,vi:'Chào em, cảm ơn em đã đến. Em giới thiệu một chút về kinh nghiệm bán hàng của em nhé.',en:'Hello, thanks for coming. Tell me a bit about your sales experience.',ph:'chow em kahm uhn em dah dayn em yuh-ee thyew moht choot veh kin ngyem bahn hahng koo-ah em nyeh'},
{role:'Candidate (Em Phúc)',you:false,vi:'Dạ em có ba năm làm nhân viên bán hàng cho một hãng nước giải khát, phụ trách quận 4 và quận 8.',en:'I have three years as a sales rep for a beverage brand, covering Districts 4 and 8.',ph:'yah em kaw bah nam lahm nyan vyen bahn hahng chaw moht hahng nook yeye khaht foo trahk kwun 4 vah kwun 8'},
{role:'Michael (You)',you:true,vi:'Tốt. Em có mối quan hệ với các cửa hàng tiện lợi trong khu vực đó không?',en:'Good. Do you have relationships with the convenience stores in that area?',ph:'toht em kaw moy kwahn heh vuh-ee kahk koo-ah hahng tyen luh-ee trawng khoo vook daw khohng'},
{role:'Candidate (Em Phúc)',you:false,vi:'Dạ có. Em quen chủ nhiều cửa hàng, em biết cách trưng bày và đẩy hàng bán chạy.',en:'Yes. I know many store owners, and I know how to merchandise and move stock.',ph:'yah kaw em kwen choo nyew koo-ah hahng em byet kahk truhng bye vah day hahng bahn chye'},
{role:'Michael (You)',you:true,vi:'Rất tốt. Công việc này lương cứng cộng hoa hồng theo doanh số. Em nghĩ sao về cách tính đó?',en:'Excellent. This role is base salary plus commission on sales. How do you feel about that structure?',ph:'rut toht kohng vyek nye luhng koong kohng hwah hohng theo ywahn soh em ngee sow veh kahk tin daw'},
{role:'Candidate (Em Phúc)',you:false,vi:'Dạ em thích có hoa hồng, vì em tự tin vào khả năng bán hàng của mình.',en:'I like having commission, because I am confident in my selling ability.',ph:'yah em thik kaw hwah hohng vee em too tin vow khah nang bahn hahng koo-ah min'},
{role:'Michael (You)',you:true,vi:'Anh thích tinh thần đó. Organika sẽ đào tạo em về sản phẩm và hỗ trợ em hết mình.',en:'I like that attitude. Organika will train you on the product and support you fully.',ph:'an thik tin thun daw Organika seh dow tow em veh sahn fum vah hoh truh em het min'},
{role:'Candidate (Em Phúc)',you:false,vi:'Dạ em cảm ơn anh. Khi nào em có thể bắt đầu ạ?',en:'Thank you. When can I start?',ph:'yah em kahm uhn an khee now em kaw theh baht dow ah'},
{role:'Michael (You)',you:true,vi:'Anh sẽ trao đổi với phòng nhân sự và báo em trong tuần này. Rất mong được làm việc với em.',en:'I will discuss with HR and let you know this week. I look forward to working with you.',ph:'an seh trow doy vuh-ee fawng nyan suh vah bow em trawng twun nye rut mawng duhk lahm vyek vuh-ee em'}
]}
,{id:'s16',title:'Placing an Online Reorder',titleVi:'Đặt Hàng Lại Online',context:'A pharmacy buyer messages you on Zalo to reorder. Fast, friendly, and accurate — this is where recurring revenue lives. Confirm everything in writing.',culturalNote:'Zalo is the real B2B order channel in Vietnam. Keep replies quick and warm. Always confirm SKU, quantity, price, and delivery date back to the buyer in one clean message so there is a written record. A same-day reply keeps you ahead of competitors.',lines:[
{role:'Buyer (Chị Hằng)',you:false,vi:'Anh Michael ơi, bên em muốn đặt lại hàng. Còn hương vị chanh dây thơm không anh?',en:'Michael, we want to reorder. Do you still have the passion fruit pineapple flavor?',ph:'an Michael uh-ee ben em mwon daht lye hahng kawn huhng vee chanh yay thuhm khohng an'},
{role:'Michael (You)',you:true,vi:'Dạ còn hàng chị. Chị muốn đặt bao nhiêu thùng ạ?',en:'Yes, in stock. How many cases would you like?',ph:'yah kawn hahng chee chee mwon daht bow nyew thoong ah'},
{role:'Buyer (Chị Hằng)',you:false,vi:'Cho em 30 thùng chanh dây thơm và 20 thùng mâm xôi nhé.',en:'Give me 30 cases of passion fruit pineapple and 20 of raspberry.',ph:'chaw em 30 thoong chanh yay thuhm vah 20 thoong mum soy nyeh'},
{role:'Michael (You)',you:true,vi:'Dạ em xác nhận: 30 thùng chanh dây thơm, 20 thùng mâm xôi, giá cũ, giao thứ Năm. Đúng không chị?',en:'Confirming: 30 cases passion fruit pineapple, 20 raspberry, same price, delivery Thursday. Correct?',ph:'yah em sahk nyun 30 thoong chanh yay thuhm 20 thoong mum soy yah koo yow thoo nam doong khohng chee'},
{role:'Buyer (Chị Hằng)',you:false,vi:'Đúng rồi. Thanh toán vẫn 30 ngày như cũ nhé.',en:'Correct. Payment still 30 days as before.',ph:'doong roy thahn twahn vun 30 ngye nyoo koo nyeh'},
{role:'Michael (You)',you:true,vi:'Dạ chuẩn. Em gửi xác nhận đơn qua Zalo ngay bây giờ. Cảm ơn chị đã tin tưởng Organika!',en:'Perfect. I will send the order confirmation on Zalo right now. Thank you for trusting Organika!',ph:'yah chwun em guh-ee sahk nyun duhn kwah Zalo ngye bay yuh kahm uhn chee dah tin tuhng Organika'},
{role:'Buyer (Chị Hằng)',you:false,vi:'Cảm ơn anh. Lần nào anh cũng nhanh và rõ ràng, làm việc rất thoải mái.',en:'Thank you. You are always fast and clear, very easy to work with.',ph:'kahm uhn an lun now an koong nyanh vah raw rahng lahm vyek rut thwye my'}
]}
];

const PRIMER=[
{id:'p01',title:'Pronouns and Address',content:`
<p>Vietnamese has no single word for "I" or "you" — the right word depends on <strong>your age relative to the person you are speaking to</strong>. Getting this right signals respect and cultural fluency.</p>
<table class="primer-table">
<tr><th>Term</th><th>Means</th><th>Use When</th></tr>
<tr><td><strong>Anh</strong></td><td>Older brother / you (male)</td><td>Speaking to or about a male buyer, partner, or contact similar age or older than you</td></tr>
<tr><td><strong>Chị</strong></td><td>Older sister / you (female)</td><td>Speaking to or about a female buyer, partner, or contact similar age or older</td></tr>
<tr><td><strong>Em</strong></td><td>Younger sibling / I (deferential)</td><td>Use as "I" when speaking to someone clearly senior or older; shows respect</td></tr>
<tr><td><strong>Tôi</strong></td><td>I (neutral)</td><td>Safe neutral "I" in business settings when age difference unclear</td></tr>
<tr><td><strong>Mình</strong></td><td>I / we (informal)</td><td>Used in casual and friendly conversation after rapport is established</td></tr>
<tr><td><strong>Chúng tôi</strong></td><td>We (excludes listener)</td><td>Our company, our team — standard in business presentations</td></tr>
<tr><td><strong>Bạn</strong></td><td>Friend / you</td><td>Peers and friends your age; less formal; avoid with senior buyers until relationship is warm</td></tr>
</table>
<p class="tip">Rule of thumb: If unsure of age, use <strong>Anh</strong> for men and <strong>Chị</strong> for women. It is always safer to be slightly deferential in Vietnam.</p>
`},
{id:'p02',title:'Southern vs. Northern Dialect',content:`
<p>You are operating in Ho Chi Minh City (South Vietnam). Southern Vietnamese has several key differences from the Northern dialect (Hanoi standard).</p>
<table class="primer-table">
<tr><th>Feature</th><th>Northern (Hanoi)</th><th>Southern (HCMC) 🌴</th></tr>
<tr><td>Letter "v"</td><td>Pronounced like English "v"</td><td>Often sounds like "y" in casual speech</td></tr>
<tr><td>Letter "d"</td><td>Pronounced "z"</td><td>Pronounced "y" (same as gi)</td></tr>
<tr><td>Tone count</td><td>6 distinct tones</td><td>6 tones, but hỏi and ngã often merge</td></tr>
<tr><td>Vocabulary</td><td>Standard dictionary terms</td><td>Some different words (e.g. trái vs. quả for fruit)</td></tr>
<tr><td>Pace</td><td>Moderate</td><td>Faster, more energetic</td></tr>
<tr><td>Formality</td><td>Slightly more formal default</td><td>More direct and relaxed in business</td></tr>
</table>
<p class="tip">Phonetics in this app reflect Southern pronunciation. Your HCMC partners will understand you perfectly — do not worry about accent. Clarity and respect matter more than perfection.</p>
`},
{id:'p03',title:'Register: Formal vs. Informal',content:`
<p>Vietnamese business language has clear register levels. Matching register to context shows sophistication.</p>
<table class="primer-table">
<tr><th>Register</th><th>When to Use</th><th>Example Signal Words</th></tr>
<tr><td><strong>Formal</strong></td><td>First meetings, senior executives, written proposals</td><td>Kính gửi, Trân trọng, Xin phép, Tôi xin</td></tr>
<tr><td><strong>Business Neutral</strong></td><td>Regular buyer meetings, negotiation, follow-up</td><td>Tôi muốn, Chúng tôi đề xuất, Anh/Chị có thể</td></tr>
<tr><td><strong>Warm / Friendly</strong></td><td>After rapport established, meals, Zalo messages</td><td>Mình, Bạn, thật ra, thật sự, nhé</td></tr>
</table>
<p>Key particles that soften and warm your speech:</p>
<ul>
<li><strong>nhé</strong> — adds friendliness, signals shared understanding ("okay?" / "right?")</li>
<li><strong>ạ</strong> — adds deference and politeness (used at end of sentences to elders)</li>
<li><strong>dạ</strong> — Southern polite "yes", used at start of response to show respect</li>

<li><strong>thôi</strong> — signals conclusion or resignation ("okay then", "that's enough")</li>
</ul>
`},
{id:'p04',title:'Six Tones of Vietnamese',content:`
<p>Vietnamese is a tonal language. The same syllable with different tones is a completely different word. HCMC South uses all 6 tones.</p>
<table class="primer-table">
<tr><th>Tone</th><th>Mark</th><th>Description</th><th>Example</th><th>Meaning</th></tr>

<tr><td>Rising (sắc)</td><td>á</td><td>High, rising sharply</td><td>má</td><td>cheek / mom (South)</td></tr>
<tr><td>Dipping (hỏi)</td><td>ả</td><td>Mid, dips then rises</td><td>mả</td><td>tomb</td></tr>
<tr><td>Broken (ngã)</td><td>ã</td><td>Rising with glottal break (South: often like sắc)</td><td>mã</td><td>horse / code</td></tr>

<p class="tip">Do not let tones paralyze you. In business context, your partners will understand from context. Focus on the tones of your key vocabulary: numbers, product names, and polite particles matter most.</p>\n<button class="btn-primary full-w" style="margin-top:10px" onclick="S.toneSet=null;S.toneRight=0;S.toneTotal=0;go('tones')">🎵 Practice hearing tones</button>

<tr><td>đ</td><td>d</td><td>đồng → dohng</td></tr>

<tr><td>th</td><td>t with a puff of air</td><td>thơm → thuhm</td></tr>
<tr><td>x, s</td><td>s</td><td>xin → seen</td></tr>
<tr><td>ê</td><td>ay</td><td>tết → tayt</td></tr>

<tr><td>ô</td><td>oh</td><td>số → soh</td></tr>
<tr><td>o</td><td>aw</td><td>to → taw</td></tr>
<tr><td>i, y</td><td>ee</td><td>chị → chee</td></tr>

// Update vocab object on VOCAB array directly
function getV(id){return VOCAB.find(v=>v.id===id);}

// ── UTILITY ──────────────────────────────────────────────────────────────────
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rand(a){return a[Math.floor(Math.random()*a.length)];}
function today(){return new Date().toISOString().slice(0,10);}

function rolloverDay(){
  const td=today();
  if(S.xpDay!==td){S.xpDay=td;S.todayXP=0;}
}
function markDay(){
  S.days=S.days||[];
  const td=today();
  if(!S.days.includes(td)){
    S.days.push(td);
    if(S.days.length>60) S.days=S.days.slice(-60);
  }
}
function onCorrect(v){
  v.correct++;
  v.box=Math.min(v.box+1,5);
  const xp=[0,5,8,12,18,25][v.box]||5;
  rolloverDay(); markDay();
  S.xp+=xp; S.todayXP+=xp;
  S.sessionRight++; S.sessionXP+=xp;
  if(navigator.vibrate) navigator.vibrate(10);
  checkStreak();
  saveState();
}
function onWrong(v){
  v.wrong++;
  v.box=Math.max(v.box-1,1);
  S.sessionWrong++;
  if(navigator.vibrate) navigator.vibrate([30,40,30]);
  requeueMiss(v);
  saveState();
}
// a missed card returns once at the end of the same session
function requeueMiss(v){
  if(!v) return;
  if(!['flashcard','quiz','type','build'].includes(S.screen)) return;
  S.requeued=S.requeued||[];
  if(S.requeued.includes(v.id)) return;
  if(!S.activeLesson.includes(v.id)) return;
  S.requeued.push(v.id);
  S.activeLesson.push(v.id);
  if(S.mixedActive&&S.mixedModes) S.mixedModes.push(rand(['flashcard','quiz','type','build']));
  if(S.requeued.length===1) toast("You'll see that one again before the session ends.");
}
function toggleStar(id){
  const v=getV(id);
  if(v){v.starred=!v.starred;saveState();render();}
}

// ── PERSISTENCE ──────────────────────────────────────────────────────────────
// Auto-save to localStorage (works on the hosted site). Export/Import remains
// as a manual backup and a way to move progress between devices.
const SAVE_KEY='organika-academy-v1';
function snapshot(){
  return {v:1,
    state:{xp:S.xp,streak:S.streak,lastDay:S.lastDay,todayXP:S.todayXP,xpDay:S.xpDay,dailyGoal:S.dailyGoal,doneSits:S.doneSits||[],sessionLen:S.sessionLen||20,days:S.days||[],listenFirst:S.listenFirst},
    vocab:VOCAB.filter(v=>v.correct||v.wrong||v.starred||v.lastSeen)
      .map(v=>({id:v.id,box:v.box,correct:v.correct,wrong:v.wrong,lastSeen:v.lastSeen,starred:v.starred}))};
}
function applySnapshot(d){
  if(!d||!d.state) return;
  Object.assign(S,d.state);
  (d.vocab||[]).forEach(sv=>{
    const v=getV(sv.id);
    if(v){v.box=sv.box||1;v.correct=sv.correct||0;v.wrong=sv.wrong||0;v.lastSeen=sv.lastSeen||null;v.starred=!!sv.starred;}
  });
}
function saveState(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(snapshot()));}catch(e){}
}
function loadState(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(raw) applySnapshot(JSON.parse(raw));
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveState();});
function toggleSpeed(){S.audioSlow=!S.audioSlow;render();}
function speedChip(){
  return `<button class="speed-chip${S.audioSlow?' on':''}" onclick="event.stopPropagation();toggleSpeed()">${S.audioSlow?'🐢 Slow':'▶ Normal'}</button>`;
}
function checkStreak(){
  const td=today();
  if(S.lastDay===td) return;
  const yd=new Date(Date.now()-86400000).toISOString().slice(0,10);
  S.streak=(S.lastDay===yd)?S.streak+1:1;
  S.lastDay=td;
}

// Days until card is due again (simple Leitner intervals)
const BOX_DAYS=[0,0,1,3,7,14,30];
function isDue(v){
  if(!v.lastSeen) return true;
  const diff=(Date.now()-v.lastSeen)/86400000;
  return diff>=(BOX_DAYS[v.box]||0);
}

// Build lesson queue from filtered due cards
function buildLesson(tier='all',cat='all'){
  let pool=VOCAB.filter(v=>{
    const tOk=tier==='all'||v.tier===tier;
    const cOk=cat==='all'||v.category===cat;
    return tOk&&cOk&&isDue(v);
  });
  if(pool.length<5) pool=VOCAB.filter(v=>{
    const tOk=tier==='all'||v.tier===tier;
    const cOk=cat==='all'||v.category===cat;
    return tOk&&cOk;
  });
  return shuffle(pool).slice(0,S.sessionLen||20).map(v=>v.id);
}

// ── TONE ENGINE ──────────────────────────────────────────────────────────────
// Vietnamese spelling encodes the tone. These arrows are DERIVED from the
// diacritics, never hand-written, so they are always correct.
function toneOf(word){
  const n=word.normalize('NFD');
  if(n.includes('\u0301')) return {a:'\u2197',n:'rising',k:'t-rise'};
  if(n.includes('\u0300')) return {a:'\u2198',n:'falling',k:'t-fall'};
  if(n.includes('\u0309')) return {a:'\u2193\u2197',n:'dip then rise',k:'t-dip'};
  if(n.includes('\u0303')) return {a:'~\u2197',n:'break then rise',k:'t-break'};
  if(n.includes('\u0323')) return {a:'\u2193.',n:'low, cut short',k:'t-stop'};
  return {a:'\u2192',n:'flat and level',k:'t-flat'};
}
function toneStrip(vi,small){
  const words=vi.split(/\s+/).map(w=>w.replace(/[.,!?;:"()]/g,'')).filter(w=>/[a-zA-Z\u00C0-\u1EF9\u0111\u0110]/.test(w));
  if(!words.length) return '';
  return '<div class="tone-strip'+(small?' small':'')+'">'+words.map(w=>{
    const t=toneOf(w);
    return `<button class="tsyl ${t.k}" title="${t.n}" onclick="event.stopPropagation();speak('${w.replace(/'/g,"\\'")}')"><i>${t.a}</i>${w}</button>`;
  }).join('')+'<button class="tsyl tkey" onclick="event.stopPropagation();toneLegend()">? tones</button></div>';
}
// Bottom-sheet legend: the six Vietnamese tones, each with a live example word.
const TONE_KEY=[
  {a:'\u2192',k:'t-flat',n:'Flat (ngang)',d:'Stay level, like holding a note',ex:'ba',en:'three'},
  {a:'\u2198',k:'t-fall',n:'Falling (huy\u1EC1n)',d:'Start mid, slide down',ex:'b\u00E0',en:'but / lady'},
  {a:'\u2197',k:'t-rise',n:'Rising (s\u1EAFc)',d:'Push up sharply',ex:'b\u00E1',en:'to cling'},
  {a:'\u2193\u2197',k:'t-dip',n:'Dip-rise (h\u1ECFi)',d:'Dip down then come back up',ex:'b\u1EA3',en:'poison'},
  {a:'~\u2197',k:'t-break',n:'Break-rise (ng\u00E3)',d:'Rise with a catch in the middle',ex:'b\u00E3',en:'residue'},
  {a:'\u2193.',k:'t-stop',n:'Low-stop (n\u1EB7ng)',d:'Drop low and cut it off hard',ex:'b\u1EA1',en:'random'},
];
function toneLegend(){
  if(document.getElementById('tone-legend')) return;
  const d=document.createElement('div');
  d.id='tone-legend';
  d.className='sheet-overlay';
  d.onclick=e=>{if(e.target===d)d.remove();};
  d.innerHTML='<div class="sheet"><div class="sheet-title">The 6 tones</div>'+
    '<p class="sheet-sub">The arrow over each word tells your voice what to do. Tap a row to hear it.</p>'+
    TONE_KEY.map(t=>`<button class="tone-row ${t.k}" onclick="speak('${t.ex}')">
      <span class="tr-arrow">${t.a}</span>
      <span class="tr-body"><b>${t.n}</b><span>${t.d}</span></span>
      <span class="tr-ex">${t.ex} \uD83D\uDD0A</span></button>`).join('')+
    '<button class="btn-primary full-w" style="margin-top:12px" onclick="document.getElementById(\'tone-legend\').remove()">Got it</button></div>';
  document.body.appendChild(d);
}

// ── SPEECH ───────────────────────────────────────────────────────────────────
// Primary engine: Google Translate's Vietnamese neural voice (needs internet,
// sounds native). Fallback: a device voice, but ONLY if it is genuinely
// Vietnamese — an English or Chinese voice reading Vietnamese is worse than
// silence, so in that case we show an install tip instead of speaking.
let _voices=[];
function loadVoices(){_voices=speechSynthesis.getVoices();}
if(typeof speechSynthesis!=='undefined'){
  loadVoices();
  speechSynthesis.addEventListener('voiceschanged',loadVoices);
}
function getViVoice(){
  if(!_voices.length) loadVoices();
  const vi=_voices.filter(v=>(v.lang||'').toLowerCase().replace('_','-').startsWith('vi'));
  if(!vi.length) return null;
  const score=v=>{
    const n=(v.name||'').toLowerCase(); let s=0;
    if(n.includes('linh')) s+=4;               // iOS Vietnamese voice
    if(n.includes('google')) s+=3;             // Android/Chrome neural voice
    if(n.includes('enhanced')||n.includes('premium')||n.includes('natural')) s+=3;
    return s;
  };
  return vi.sort((a,b)=>score(b)-score(a))[0];
}
// Audio strategy, in order:
//   1. Google's Vietnamese neural voice (translate.googleapis.com, verified
//      working). We wait for a real 'playing' event — if sound has not
//      actually started within 1.5s we fall back, because a request that
//      silently stalls is indistinguishable from success otherwise.
//   2. Device speech synthesis. On iOS the voices list is often EMPTY until
//      after the first utterance, so if no Vietnamese voice is listed we
//      still speak with lang='vi-VN' and let iOS route to its built-in
//      Vietnamese voice (Linh). Refusing to speak here was the old bug.
const APP_VERSION='v50';
let _player=null,_speakSeq=0,_lastPath='none';
function getPlayer(){
  if(!_player){
    _player=new Audio();
    _player.setAttribute('playsinline','');
    _player.preload='auto';
  }
  return _player;
}
function stopAudio(){
  try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();}catch(e){}
  if(_player){try{_player.pause();}catch(e){}}
}
// Sanitize display text for the voice: a slash (anh/chị) or ellipsis would
// be read out loud; spoken form should be plain words only.
function cleanTts(t){
  return t.replace(/\//g,' ').replace(/…/g,', ').replace(/\s+/g,' ').trim();
}
function ttsUrl(text){
  // Normal speed matches the Google Translate app exactly (ttsspeed 1);
  // the slow toggle mirrors its turtle button.
  const spd=S.audioSlow?0.3:1;
  return 'https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=vi&ttsspeed='+spd+'&q='+encodeURIComponent(cleanTts(text));
}
let _pre=null,_preText='';
function preloadAudio(){
  // warm the HTTP cache for the word the user is about to hear
  let t=null;
  if(S.screen==='flashcard'){const v=getV(S.activeLesson[S.lessonIdx]);t=v&&v.vi;}
  else if(S.screen==='drill'){const v=getV(S.drillQueue[S.drillIdx]);t=v&&v.vi;}
  else if(S.screen==='type'){const v=getV(S.activeLesson[S.lessonIdx]);t=v&&v.vi;}
  if(t&&navigator.onLine!==false&&_preText!==t){
    _preText=t;
    _pre=_pre||new Audio();
    _pre.preload='auto';
    _pre.src=ttsUrl(t);
  }
}
function speak(text){
  stopAudio();
  const seq=++_speakSeq;
  if(navigator.onLine===false){speakLocal(text,seq,true);return;}
  const p=getPlayer();
  let mode='trying'; // 'google' once network audio really plays, 'local' once fallback starts
  const useLocal=()=>{
    if(mode!=='trying'||seq!==_speakSeq) return;
    mode='local';
    speakLocal(text,seq,true);
  };
  p.onplaying=()=>{
    if(seq!==_speakSeq){p.pause();return;}
    if(mode==='local'){p.pause();return;} // device voice already talking — no overlap
    mode='google';_lastPath='Google voice';setStatus('Playing: Google Vietnamese voice');
  };
  p.onerror=useLocal;
  p.src=ttsUrl(text);
  const pr=p.play();
  if(pr&&pr.catch) pr.catch(useLocal);
  setTimeout(useLocal,2500);
}
let _accentWarned=false;
function speakLocal(text,seq,force){
  if(seq!==undefined&&seq!==_speakSeq&&!force) return;
  if(!('speechSynthesis' in window)){setStatus('This browser has no speech support');return;}
  try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();}catch(e){}
  const u=new SpeechSynthesisUtterance(cleanTts(text));
  const vv=getViVoice();
  if(vv){u.voice=vv;u.lang=vv.lang;_lastPath='Device voice: '+vv.name;}
  else{
    u.lang='vi-VN';_lastPath='Device voice (lang vi-VN)';
    if(!_accentWarned){
      _accentWarned=true;
      toast('For a proper Vietnamese accent offline: Settings › Accessibility › Spoken Content › Voices › Vietnamese › download Linh');
    }
  }
  u.rate=S.audioSlow?0.55:0.85; u.pitch=1; u.volume=1;
  u.onstart=()=>setStatus('Playing: '+_lastPath);
  u.onerror=()=>setStatus('Speech failed — check silent switch and volume');
  speechSynthesis.speak(u);
  // iOS sometimes leaves the queue paused; nudge it
  setTimeout(()=>{try{if(speechSynthesis.paused)speechSynthesis.resume();}catch(e){}},120);
}
let _echo=null;
function echoWord(t){
  stopAudio(); clearTimeout(_echo);
  let n=0;
  const step=()=>{ if(n>=3){_echo=null;return;} n++; speak(t); _echo=setTimeout(step, S.audioSlow?3200:2300); };
  step();
}
function toast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;left:12px;right:12px;bottom:80px;z-index:998;background:#1A2721;color:#fff;border-radius:12px;padding:12px 16px;font-size:12px;line-height:1.55;box-shadow:0 6px 24px rgba(0,0,0,.3);animation:rise .25s ease';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{if(t.parentNode)t.remove();},7000);
}
function setStatus(msg){
  const el=document.getElementById('audio-status');
  if(el) el.textContent=msg;
}
// iOS unlock: the first real tap warms up the speech engine and voice list
let _warmed=false;
document.addEventListener('touchend',warmUp,{once:true});
document.addEventListener('click',warmUp,{once:true});
function warmUp(){
  if(_warmed) return; _warmed=true;
  try{

}

// Each screen change is pushed into browser history so the phone's back
// button / swipe-back moves within the app instead of leaving it.
const LESSON_SCREENS=['flashcard','quiz','type','build','drill','summary'];
function go(screen,extra={}){
  if(typeof stopPlayAll==='function') stopPlayAll();

}

    case 'primer':      app.innerHTML=renderPrimer(); break;
    case 'placement':   app.innerHTML=renderPlacement(); break;

  }

function buildQuiz(){
  const id=S.activeLesson[S.lessonIdx];
  const v=getV(id);
  if(!v) return;
  S.quizAnswer=null;
  // distractors from same category are far harder to guess than random ones
  const sameCat=shuffle(VOCAB.filter(x=>x.id!==id&&x.category===v.category));
  const sameTier=shuffle(VOCAB.filter(x=>x.id!==id&&x.category!==v.category&&x.tier===v.tier));
  const rest=shuffle(VOCAB.filter(x=>x.id!==id&&x.category!==v.category&&x.tier!==v.tier));
  const distractors=[...sameCat,...sameTier,...rest].slice(0,3);
  const opts=shuffle([v,...distractors]);
  S.quizOptions=opts.map(o=>o.id);
  if(S.quizDir==='listen') setTimeout(()=>speak(v.vi),250);
}

// Play the whole dialogue hands-free. Advancing is timer-based (estimated
// from line length) so it works identically for network audio and the
// device voice, with no event wiring into speak()'s fallback chain.
let _playAll=null;
function playAllDialogue(){
  const sit=SITUATIONS.find(s=>s.id===S.situationId);
  if(!sit) return;
  S.hideMyLines=false;
  _playAll={id:sit.id,i:S.situationLine,timer:null};
  playAllStep();
}
function playAllStep(){
  if(!_playAll) return;
  const sit=SITUATIONS.find(s=>s.id===_playAll.id);
  if(!sit||_playAll.i>=sit.lines.length){stopPlayAll();return;}
  S.situationLine=_playAll.i;
  render();
  const line=sit.lines[_playAll.i];
  speak(line.vi);
  const est=1400+line.vi.length*(S.audioSlow?150:95);
  _playAll.timer=setTimeout(()=>{if(_playAll){_playAll.i++;playAllStep();}},est);
}
function stopPlayAll(){
  if(!_playAll) return;
  clearTimeout(_playAll.timer);
  _playAll=null;
  stopAudio();
  if(S.screen==='scenario') render();
}
function markSitDone(id){
  S.doneSits=S.doneSits||[];
  if(!S.doneSits.includes(id)){
    S.doneSits.push(id);
    rolloverDay();
    S.xp+=15; S.todayXP+=15;   // completing a full dialogue earns a bonus
    checkStreak(); saveState();
  }
  go('situations');
}
function advanceLine(){
  const sit=SITUATIONS.find(s=>s.id===S.situationId);
  if(!sit) return;
  S.situationLine++;
  S.lineRevealed=false;
  const l=sit.lines[S.situationLine];
  // auto-play the new line unless it is your hidden practice line
  if(l&&!(S.hideMyLines&&l.you)) speak(l.vi);
  render();
}

function buildRound(){
  const v=getV(S.activeLesson[S.lessonIdx]);
  if(!v) return;
  // build from the example sentence when it is a manageable length,
  // otherwise from the term itself
  const exWords=v.example_vi.split(/\s+/);
  const src=(exWords.length>=3&&exWords.length<=10)?v.example_vi:v.vi;
  S.buildSource=src;
  S.buildWords=shuffle(src.split(/\s+/).map((w,i)=>({w,orig:i})));
  S.buildPicked=[];
  S.buildChecked=null;
}
function renderBuild(){
  if(!S.activeLesson.length) return `<div class="screen"><div class="empty-state">No terms available.</div><button class="btn-back" onclick="go('practice')">Back</button></div>`;
  const v=getV(S.activeLesson[S.lessonIdx]);
  if(!v){go('practice');return '';}
  const prog=S.lessonIdx+1,total=S.activeLesson.length;
  const en=(S.buildSource===v.vi)?v.en:v.example_en;
  const allPicked=S.buildPicked.length===S.buildWords.length;
  return `<div class="screen">
  <div class="lesson-header">
    <button class="btn-back" onclick="go('practice')">✕</button>
    <div class="lesson-progress"><div class="lp-bar"><div class="lp-fill" style="width:${Math.round(prog/total*100)}%"></div></div><span>${prog}/${total}</span></div>
  </div>
  <main class="main-scroll" style="padding:16px">
    <div class="quiz-prompt-label">Build the Vietnamese</div>
    <div class="quiz-prompt" style="font-size:18px">${en}</div>
    <div class="build-answer">${S.buildPicked.length
      ?S.buildPicked.map((bi,pos)=>`<button class="chip picked" onclick="unpickWord(${pos})">${S.buildWords[bi].w}</button>`).join('')
      :'<span class="build-hint">Tap the words below in order</span>'}</div>
    <div class="build-pool">${S.buildWords.map((o,i)=>S.buildPicked.includes(i)
      ?`<span class="chip ghost">${o.w}</span>`
      :`<button class="chip" onclick="pickWord(${i})">${o.w}</button>`).join('')}</div>
    ${S.buildChecked===null
      ?`<button class="btn-primary full-w" style="margin-top:18px${allPicked?'':';opacity:.4'}" ${allPicked?'':'disabled'} onclick="checkBuild()">Check</button>`
      :`<div class="quiz-feedback ${S.buildChecked?'correct-fb':'wrong-fb'}">
          ${S.buildChecked?'Perfect! +XP':'Not quite. Correct order:'}
          <div class="quiz-reveal" style="font-size:16px">${S.buildSource}</div>
          ${toneStrip(S.buildSource,true)}
          <button class="speak-inline lg" onclick="speak('${S.buildSource.replace(/'/g,"\\'")}')">🔊 Listen</button>
          <button class="btn-primary" style="margin-top:12px" onclick="nextBuild()">Continue</button>
        </div>`}
  </main>
  </div>`;
}
function pickWord(i){if(S.buildChecked!==null)return;S.buildPicked.push(i);render();}
function unpickWord(pos){if(S.buildChecked!==null)return;S.buildPicked.splice(pos,1);render();}
function checkBuild(){
  if(S.buildPicked.length!==S.buildWords.length) return;
  const got=S.buildPicked.map(i=>S.buildWords[i].w).join(' ');
  const ok=got===S.buildSource.split(/\s+/).join(' ');

  const v=getV(S.activeLesson[S.lessonIdx]);
  if(v){v.lastSeen=Date.now();ok?onCorrect(v):onWrong(v);}

}

// ── PRICE LISTENING TRAINER ──────────────────────────────────────────────────
// Converts a number to spoken Vietnamese so the TTS reads real prices.
const VN_DIG=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
function twoDigVi(n){
  if(n<10) return VN_DIG[n];
  const t=Math.floor(n/10),u=n%10;
  let s=(t===1?'mười':VN_DIG[t]+' mươi');
  if(u===0) return s;
  if(u===1&&t>1) s+=' mốt';
  else if(u===5) s+=' lăm';
  else s+=' '+VN_DIG[u];
  return s;
}
function threeDigVi(n){
  const h=Math.floor(n/100),r=n%100;
  if(h===0) return twoDigVi(r);
  let s=VN_DIG[h]+' trăm';
  if(r===0) return s;
  if(r<10) s+=' lẻ '+VN_DIG[r];
  else s+=' '+twoDigVi(r);
  return s;
}
function numToVi(n){
  if(n>=1e6){
    const m=Math.floor(n/1e6),r=n%1e6;
    let s=threeDigVi(m)+' triệu';
    if(r){
      const k=Math.floor(r/1000);
      if(k) s+=' '+threeDigVi(k)+' nghìn';
      if(r%1000) s+=' '+threeDigVi(r%1000);
    }
    return s;
  }
  if(n>=1000){
    const k=Math.floor(n/1000),r=n%1000;
    let s=threeDigVi(k)+' nghìn';
    if(r) s+=' '+threeDigVi(r);
    return s;
  }
  return threeDigVi(n);
}
const PRICE_POOL=[15000,20000,25000,35000,45000,55000,65000,85000,95000,
  120000,125000,150000,180000,220000,250000,350000,450000,500000,750000,850000,
  1200000,1500000,2500000,3500000,5000000,12000000,25000000];
function fmtVnd(n){return n.toLocaleString('en-US')+' ₫';}
function newPriceRound(){

  S.priceOpts=shuffle([target,...others]);
  S.priceAnswer=null;
}
function speakPrice(){speak(numToVi(S.priceTarget)+' đồng');}
function renderPrices(){

  return `<div class="screen">
  <div class="lesson-header">
    <button class="btn-back" onclick="S.priceTarget=0;S.priceRight=0;S.priceTotal=0;go('home')">‹</button>

    const recText=pct>=80?'Tier C and D':pct>=50?'Tier B and C':'Tier A and B';
    return `<div class="screen">

  }

  if(S.placementFor!==id){
    S.placementFor=id;
    let pool=VOCAB.filter(x=>x.id!==id);
    const dist=shuffle(pool).slice(0,3);
    S.quizOptions=shuffle([v,...dist]).map(o=>o.id);
    S.quizAnswer=null;
  }
  return `<div class="screen">
  <div class="lesson-header">
    <button class="btn-back" onclick="S.placementPool=[];go('home')">✕</button>
    <span class="screen-title">Placement Check</span>
    <span style="font-size:12px;color:var(--tx2)">${S.placementQ+1}/${S.placementPool.length}</span>
  </div>
  <main class="main-scroll" style="padding:16px">
    <div class="quiz-prompt-label">English</div>
    <div class="quiz-prompt">${v.en}</div>
    <div class="quiz-prompt-sub">Select the Vietnamese translation</div>
    <div class="quiz-options">
      ${S.quizOptions.map(oid=>{
        const ov=getV(oid);if(!ov)return'';
        let cls='quiz-opt';
        if(S.quizAnswer!==null){if(oid===id)cls+=' correct';else if(oid===S.quizAnswer)cls+=' wrong';else cls+=' faded';}
        return `<button class="${cls}" onclick="answerPlacement('${oid}')">${ov.vi}</button>`;
      }).join('')}
    </div>
    ${S.quizAnswer!==null?`<div class="quiz-feedback ${S.quizAnswer===id?'correct-fb':'wrong-fb'}">
      ${v.vi} — ${v.en}
      <button class="btn-primary" style="margin-top:12px" onclick="S.placementQ++;S.quizAnswer=null;S.quizOptions=[];render()">Next</button>
    </div>`:''}
  </main>
  </div>`;
}
function answerPlacement(oid){
  if(S.quizAnswer!==null) return;
  S.quizAnswer=oid;
  const id=S.placementPool[S.placementQ];
  const v=getV(id);
  if(v&&oid===id){onCorrect(v);S.placementScore++;}
  if(v) speak(v.vi);
  render();
  scrollToFeedback();
}

// ── INIT ─────────────────────────────────────────────────────────────────────
(function init(){
  // ensure all VOCAB has defaults
  VOCAB.forEach(v=>{
    if(!v.box) v.box=1;
    if(!v.correct) v.correct=0;
    if(!v.wrong) v.wrong=0;
    if(!v.lastSeen) v.lastSeen=null;
    if(!v.starred) v.starred=false;
  });
  // restore saved progress, then set today for streak baseline
  loadState();
  rolloverDay();
  if(!S.lastDay) S.lastDay=today();
  try{history.replaceState({s:'home'},'');}catch(e){}
  render();
})();
</script>
</body>
</html>
