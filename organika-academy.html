// Update vocab object on VOCAB array directly
function getV(id){return VOCAB.find(v=>v.id===id);}

// ── UTILITY ──────────────────────────────────────────────────────────────────
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rand(a){return a[Math.floor(Math.random()*a.length)];}
function today(){return new Date().toISOString().slice(0,10);}

function rolloverDay(){
  const td=today();
  if(S.xpDay!==td){S.xpDay=td;S.todayXP=0;}
}
function onCorrect(v){
  v.correct++;
  v.box=Math.min(v.box+1,5);
  const xp=[0,5,8,12,18,25][v.box]||5;
  rolloverDay();
  S.xp+=xp; S.todayXP+=xp;
  S.sessionRight++; S.sessionXP+=xp;
  if(navigator.vibrate) navigator.vibrate(10);
  checkStreak();
  saveState();
}
function onWrong(v){
  v.wrong++;
  v.box=Math.max(v.box-1,1);
  S.sessionWrong++;
  if(navigator.vibrate) navigator.vibrate([30,40,30]);
  saveState();
}
function toggleStar(id){
  const v=getV(id);
  if(v){v.starred=!v.starred;saveState();render();}
}

// ── PERSISTENCE ──────────────────────────────────────────────────────────────
// Auto-save to localStorage (works on the hosted site). Export/Import remains
// as a manual backup and a way to move progress between devices.
const SAVE_KEY='organika-academy-v1';
function snapshot(){
  return {v:1,
    state:{xp:S.xp,streak:S.streak,lastDay:S.lastDay,todayXP:S.todayXP,xpDay:S.xpDay,dailyGoal:S.dailyGoal,doneSits:S.doneSits||[],sessionLen:S.sessionLen||20},
    vocab:VOCAB.filter(v=>v.correct||v.wrong||v.starred||v.lastSeen)
      .map(v=>({id:v.id,box:v.box,correct:v.correct,wrong:v.wrong,lastSeen:v.lastSeen,starred:v.starred}))};
}
function applySnapshot(d){
  if(!d||!d.state) return;
  Object.assign(S,d.state);
  (d.vocab||[]).forEach(sv=>{
    const v=getV(sv.id);
    if(v){v.box=sv.box||1;v.correct=sv.correct||0;v.wrong=sv.wrong||0;v.lastSeen=sv.lastSeen||null;v.starred=!!sv.starred;}
  });
}
function saveState(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(snapshot()));}catch(e){}
}
function loadState(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(raw) applySnapshot(JSON.parse(raw));
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveState();});
function toggleSpeed(){S.audioSlow=!S.audioSlow;render();}
function speedChip(){
  return `<button class="speed-chip${S.audioSlow?' on':''}" onclick="event.stopPropagation();toggleSpeed()">${S.audioSlow?'🐢 Slow':'▶ Normal'}</button>`;
}
function checkStreak(){
  const td=today();
  if(S.lastDay===td) return;
  const yd=new Date(Date.now()-86400000).toISOString().slice(0,10);
  S.streak=(S.lastDay===yd)?S.streak+1:1;
  S.lastDay=td;
}

// Days until card is due again (simple Leitner intervals)
const BOX_DAYS=[0,0,1,3,7,14,30];
function isDue(v){
  if(!v.lastSeen) return true;
  const diff=(Date.now()-v.lastSeen)/86400000;
  return diff>=(BOX_DAYS[v.box]||0);
}

// Build lesson queue from filtered due cards
function buildLesson(tier='all',cat='all'){
  let pool=VOCAB.filter(v=>{
    const tOk=tier==='all'||v.tier===tier;
    const cOk=cat==='all'||v.category===cat;
    return tOk&&cOk&&isDue(v);
  });
  if(pool.length<5) pool=VOCAB.filter(v=>{
    const tOk=tier==='all'||v.tier===tier;
    const cOk=cat==='all'||v.category===cat;
    return tOk&&cOk;
  });
  return shuffle(pool).slice(0,S.sessionLen||20).map(v=>v.id);
}

// ── SPEECH ───────────────────────────────────────────────────────────────────
// Primary engine: Google Translate's Vietnamese neural voice (needs internet,
// sounds native). Fallback: a device voice, but ONLY if it is genuinely
// Vietnamese — an English or Chinese voice reading Vietnamese is worse than
// silence, so in that case we show an install tip instead of speaking.
let _voices=[];
function loadVoices(){_voices=speechSynthesis.getVoices();}
if(typeof speechSynthesis!=='undefined'){
  loadVoices();
  speechSynthesis.addEventListener('voiceschanged',loadVoices);
}
function getViVoice(){
  if(!_voices.length) loadVoices();
  const vi=_voices.filter(v=>(v.lang||'').toLowerCase().replace('_','-').startsWith('vi'));
  if(!vi.length) return null;
  const score=v=>{
    const n=(v.name||'').toLowerCase(); let s=0;
    if(n.includes('linh')) s+=4;               // iOS Vietnamese voice
    if(n.includes('google')) s+=3;             // Android/Chrome neural voice
    if(n.includes('enhanced')||n.includes('premium')||n.includes('natural')) s+=3;
    return s;
  };
  return vi.sort((a,b)=>score(b)-score(a))[0];
}
// Audio strategy, in order:
//   1. Google's Vietnamese neural voice (translate.googleapis.com, verified
//      working). We wait for a real 'playing' event — if sound has not
//      actually started within 1.5s we fall back, because a request that
//      silently stalls is indistinguishable from success otherwise.
//   2. Device speech synthesis. On iOS the voices list is often EMPTY until
//      after the first utterance, so if no Vietnamese voice is listed we
//      still speak with lang='vi-VN' and let iOS route to its built-in
//      Vietnamese voice (Linh). Refusing to speak here was the old bug.
const APP_VERSION='v34';
let _player=null,_speakSeq=0,_lastPath='none';
function getPlayer(){
  if(!_player){
    _player=new Audio();
    _player.setAttribute('playsinline','');
    _player.preload='auto';
  }
  return _player;
}
function stopAudio(){
  try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();}catch(e){}
  if(_player){try{_player.pause();}catch(e){}}
}
// Sanitize display text for the voice: a slash (anh/chị) or ellipsis would
// be read out loud; spoken form should be plain words only.
function cleanTts(t){
  return t.replace(/\//g,' ').replace(/…/g,', ').replace(/\s+/g,' ').trim();
}
function ttsUrl(text){
  // Normal speed matches the Google Translate app exactly (ttsspeed 1);
  // the slow toggle mirrors its turtle button.
  const spd=S.audioSlow?0.3:1;
  return 'https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=vi&ttsspeed='+spd+'&q='+encodeURIComponent(cleanTts(text));
}
let _pre=null,_preText='';
function preloadAudio(){
  // warm the HTTP cache for the word the user is about to hear
  let t=null;
  if(S.screen==='flashcard'){const v=getV(S.activeLesson[S.lessonIdx]);t=v&&v.vi;}
  else if(S.screen==='drill'){const v=getV(S.drillQueue[S.drillIdx]);t=v&&v.vi;}
  else if(S.screen==='type'){const v=getV(S.activeLesson[S.lessonIdx]);t=v&&v.vi;}
  if(t&&navigator.onLine!==false&&_preText!==t){
    _preText=t;
    _pre=_pre||new Audio();
    _pre.preload='auto';
    _pre.src=ttsUrl(t);
  }
}
function speak(text){
  stopAudio();
  const seq=++_speakSeq;
  if(navigator.onLine===false){speakLocal(text,seq,true);return;}
  const p=getPlayer();
  let mode='trying'; // 'google' once network audio really plays, 'local' once fallback starts
  const useLocal=()=>{
    if(mode!=='trying'||seq!==_speakSeq) return;
    mode='local';
    speakLocal(text,seq,true);
  };
  p.onplaying=()=>{
    if(seq!==_speakSeq){p.pause();return;}
    if(mode==='local'){p.pause();return;} // device voice already talking — no overlap
    mode='google';_lastPath='Google voice';setStatus('Playing: Google Vietnamese voice');
  };
  p.onerror=useLocal;
  p.src=ttsUrl(text);
  const pr=p.play();
  if(pr&&pr.catch) pr.catch(useLocal);
  setTimeout(useLocal,2500);
}
let _accentWarned=false;
function speakLocal(text,seq,force){
  if(seq!==undefined&&seq!==_speakSeq&&!force) return;
  if(!('speechSynthesis' in window)){setStatus('This browser has no speech support');return;}
  try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();}catch(e){}
  const u=new SpeechSynthesisUtterance(cleanTts(text));
  const vv=getViVoice();
  if(vv){u.voice=vv;u.lang=vv.lang;_lastPath='Device voice: '+vv.name;}
  else{
    u.lang='vi-VN';_lastPath='Device voice (lang vi-VN)';
    if(!_accentWarned){
      _accentWarned=true;
      toast('For a proper Vietnamese accent offline: Settings › Accessibility › Spoken Content › Voices › Vietnamese › download Linh');
    }
  }
  u.rate=S.audioSlow?0.55:0.85; u.pitch=1; u.volume=1;
  u.onstart=()=>setStatus('Playing: '+_lastPath);
  u.onerror=()=>setStatus('Speech failed — check silent switch and volume');
  speechSynthesis.speak(u);
  // iOS sometimes leaves the queue paused; nudge it
  setTimeout(()=>{try{if(speechSynthesis.paused)speechSynthesis.resume();}catch(e){}},120);
}
function toast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;left:12px;right:12px;bottom:80px;z-index:998;background:#1A2721;color:#fff;border-radius:12px;padding:12px 16px;font-size:12px;line-height:1.55;box-shadow:0 6px 24px rgba(0,0,0,.3);animation:rise .25s ease';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{if(t.parentNode)t.remove();},7000);
}
function setStatus(msg){
  const el=document.getElementById('audio-status');
  if(el) el.textContent=msg;
}
// iOS unlock: the first real tap warms up the speech engine and voice list
let _warmed=false;
document.addEventListener('touchend',warmUp,{once:true});
document.addEventListener('click',warmUp,{once:true});
function warmUp(){
  if(_warmed) return; _warmed=true;
  try{
    const u=new SpeechSynthesisUtterance(' ');
    u.volume=0; speechSynthesis.speak(u);
  }catch(e){}
  loadVoices();
  setTimeout(loadVoices,500);
}
function showAudioHelp(){
  if(document.getElementById('audio-help')) return;
  const nv=(typeof speechSynthesis!=='undefined')?speechSynthesis.getVoices().length:0;
  const vi=getViVoice();

  d.style.cssText='position:fixed;left:12px;right:12px;bottom:80px;z-index:999;background:#1A2721;color:#fff;border-radius:14px;padding:16px;font-size:13px;line-height:1.65;box-shadow:0 8px 30px rgba(0,0,0,.35)';
  d.innerHTML='<b>🔇 No sound? Check these in order:</b><br>'+
    '1. Flip the <b>ring/silent switch</b> on the side of your iPhone — orange showing means silent mode, which mutes speech.<br>'+
    '2. Press <b>volume up</b> while the app is open.<br>'+
    '3. Turn off Bluetooth if sound may be going to earbuds or a car.<br>'+
    '4. Best offline voice: Settings › Accessibility › Spoken Content › Voices › Vietnamese › <b>Linh</b>.<br>'+
    '<div id="audio-status" style="margin-top:8px;padding:8px 10px;background:rgba(255,255,255,.1);border-radius:8px;font-size:12px">App '+APP_VERSION+' · Voices: '+nv+(vi?' · Vietnamese: '+vi.name:' · No Vietnamese voice listed')+' · Tap Test</div>'+
    '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">'+
    '<button onclick="speak(\'Xin chào! Rất vui được gặp bạn.\')" style="background:#2D6A4F;border:none;color:#fff;border-radius:10px;padding:9px 16px;font-weight:700;font-family:inherit">🔊 Test sound</button>'+
    '<button onclick="document.getElementById(\'audio-help\').remove()" style="background:#52B788;border:none;color:#fff;border-radius:10px;padding:9px 16px;font-weight:700;font-family:inherit">Close</button></div>';
  document.body.appendChild(d);
}

// ── NAV ──────────────────────────────────────────────────────────────────────

function startLesson(mode){

  S.mixedActive=(mode==='mixed');
  if(mode==='mixed'){
    const pool=['flashcard','quiz','type','build'];
    S.mixedModes=S.activeLesson.map(()=>rand(pool));
    mixedGo();
  }
  else if(mode==='flashcard'){S.activeCard=S.activeLesson[0]; go('flashcard');}
  else if(mode==='quiz'){buildQuiz(); go('quiz');}
  else if(mode==='type'){S.typeChecked=null; go('type');}

}

}

// ── QUIZ ─────────────────────────────────────────────────────────────────────
function buildQuiz(){
  const id=S.activeLesson[S.lessonIdx];
  const v=getV(id);
  if(!v) return;
  S.quizAnswer=null;
  // distractors from same category are far harder to guess than random ones
  const sameCat=shuffle(VOCAB.filter(x=>x.id!==id&&x.category===v.category));
  const sameTier=shuffle(VOCAB.filter(x=>x.id!==id&&x.category!==v.category&&x.tier===v.tier));
  const rest=shuffle(VOCAB.filter(x=>x.id!==id&&x.category!==v.category&&x.tier!==v.tier));
  const distractors=[...sameCat,...sameTier,...rest].slice(0,3);
  const opts=shuffle([v,...distractors]);
  S.quizOptions=opts.map(o=>o.id);
  if(S.quizDir==='listen') setTimeout(()=>speak(v.vi),250);
}
function renderQuiz(){
  if(!S.activeLesson.length) return `<div class="screen"><button onclick="go('practice')">Back</button></div>`;
  const id=S.activeLesson[S.lessonIdx];
  const v=getV(id);
  if(!v){go('practice');return '';}
  const prog=S.lessonIdx+1;
  const total=S.activeLesson.length;
  const listen=S.quizDir==='listen';
  const prompt=S.quizDir==='en2vi'?v.en:v.vi;
  const promptLabel=S.quizDir==='en2vi'?'English':listen?'Listen':'Vietnamese';
  return `<div class="screen">
  <div class="lesson-header">
    <button class="btn-back" onclick="go('practice')">✕</button>
    <div class="lesson-progress"><div class="lp-bar"><div class="lp-fill" style="width:${Math.round(prog/total*100)}%"></div></div><span>${prog}/${total}</span></div>
  </div>
  <main class="main-scroll" style="padding:16px">
    <div class="quiz-prompt-label">${promptLabel}</div>
    ${listen
      ?`<div class="price-play-wrap" style="margin:4px 0 14px"><button class="price-play" onclick="speak('${v.vi.replace(/'/g,"\\'")}')">🔊<br><span>Play</span></button>${speedChip()}</div>`
      :`<div class="quiz-prompt">${prompt}
      ${S.quizDir==='vi2en'?`<button class="speak-inline" onclick="speak('${v.vi.replace(/'/g,"\\'")}','vi-VN')">🔊</button>`:''}
    </div>`}
    <div class="quiz-prompt-sub">${listen?'What did you hear? Pick the English meaning':'Select the '+(S.quizDir==='en2vi'?'Vietnamese':'English')+' translation'}</div>
    <div class="quiz-options">
      ${S.quizOptions.map(oid=>{
        const ov=getV(oid);
        if(!ov) return '';
        const label=S.quizDir==='en2vi'?ov.vi:ov.en;
        let cls='quiz-opt';
        if(S.quizAnswer!==null){
          if(oid===id) cls+=' correct';
          else if(oid===S.quizAnswer) cls+=' wrong';
          else cls+=' faded';
        }
        return `<button class="${cls}" onclick="answerQuiz('${oid}')">${label}</button>`;
      }).join('')}
    </div>
    ${S.quizAnswer!==null?`<div class="quiz-feedback ${S.quizAnswer===id?'correct-fb':'wrong-fb'}">
      ${S.quizAnswer===id?'Correct! +XP':'Incorrect'}
      <div class="quiz-reveal">${v.vi} — ${v.en}</div>
      ${v.phonetic?`<div class="quiz-ph">/ ${v.phonetic} /</div>`:''}
      <button class="speak-inline lg" onclick="speak('${v.vi.replace(/'/g,"\\'")}','vi-VN')">🔊 Listen</button>
      <button class="btn-primary" style="margin-top:12px" onclick="nextQuiz()">Continue</button>
    </div>`:''}
  </main>
  </div>`;
}
function answerQuiz(oid){
  if(S.quizAnswer!==null) return;
  S.quizAnswer=oid;
  const id=S.activeLesson[S.lessonIdx];
  const v=getV(id);
  if(v){v.lastSeen=Date.now(); oid===id?onCorrect(v):onWrong(v); speak(v.vi);}
  render();
  scrollToFeedback();
}
function nextQuiz(){
  S.lessonIdx++;
  if(S.lessonIdx>=S.activeLesson.length){go('summary');}
  else if(S.mixedActive){mixedGo();}
  else{buildQuiz();render();}
}

          <div class="dlg-role">${l.role}</div>

// Play the whole dialogue hands-free. Advancing is timer-based (estimated
// from line length) so it works identically for network audio and the
// device voice, with no event wiring into speak()'s fallback chain.
let _playAll=null;
function playAllDialogue(){
  const sit=SITUATIONS.find(s=>s.id===S.situationId);
  if(!sit) return;
  S.hideMyLines=false;
  _playAll={id:sit.id,i:S.situationLine,timer:null};
  playAllStep();
}
function playAllStep(){
  if(!_playAll) return;
  const sit=SITUATIONS.find(s=>s.id===_playAll.id);
  if(!sit||_playAll.i>=sit.lines.length){stopPlayAll();return;}
  S.situationLine=_playAll.i;
  render();
  const line=sit.lines[_playAll.i];
  speak(line.vi);
  const est=1400+line.vi.length*(S.audioSlow?150:95);
  _playAll.timer=setTimeout(()=>{if(_playAll){_playAll.i++;playAllStep();}},est);
}
function stopPlayAll(){
  if(!_playAll) return;
  clearTimeout(_playAll.timer);
  _playAll=null;
  stopAudio();
  if(S.screen==='scenario') render();
}
function markSitDone(id){
  S.doneSits=S.doneSits||[];
  if(!S.doneSits.includes(id)){
    S.doneSits.push(id);
    rolloverDay();
    S.xp+=15; S.todayXP+=15;   // completing a full dialogue earns a bonus
    checkStreak(); saveState();
  }
  go('situations');
}
function advanceLine(){
  const sit=SITUATIONS.find(s=>s.id===S.situationId);
  if(!sit) return;
  S.situationLine++;
  S.lineRevealed=false;
  const l=sit.lines[S.situationLine];
  // auto-play the new line unless it is your hidden practice line
  if(l&&!(S.hideMyLines&&l.you)) speak(l.vi);
  render();
}

// ── PROGRESS ─────────────────────────────────────────────────────────────────
function renderProgress(){
  const total=VOCAB.length;
  const byTier={A:0,B:0,C:0,D:0,E:0};
  const mastByTier={A:0,B:0,C:0,D:0,E:0};
  VOCAB.forEach(v=>{byTier[v.tier]=(byTier[v.tier]||0)+1;if(v.box>=4)(mastByTier[v.tier]=(mastByTier[v.tier]||0)+1);});
  // weakest categories: enough attempts to matter, ranked by miss rate
  const catStats={};
  VOCAB.forEach(v=>{
    const n=v.correct+v.wrong;
    if(!n) return;
    catStats[v.category]=catStats[v.category]||{right:0,wrong:0,ids:[]};
    catStats[v.category].right+=v.correct;
    catStats[v.category].wrong+=v.wrong;
    if(v.wrong>0) catStats[v.category].ids.push(v.id);
  });

function buildRound(){
  const v=getV(S.activeLesson[S.lessonIdx]);

  // build from the example sentence when it is a manageable length,
  // otherwise from the term itself
  const exWords=v.example_vi.split(/\s+/);

  S.buildSource=src;
  S.buildWords=shuffle(src.split(/\s+/).map((w,i)=>({w,orig:i})));
  S.buildPicked=[];
  S.buildChecked=null;
}
function renderBuild(){
  if(!S.activeLesson.length) return `<div class="screen"><div class="empty-state">No terms available.</div><button class="btn-back" onclick="go('practice')">Back</button></div>`;
  const v=getV(S.activeLesson[S.lessonIdx]);
  if(!v){go('practice');return '';}
  const prog=S.lessonIdx+1,total=S.activeLesson.length;
  const en=(S.buildSource===v.vi)?v.en:v.example_en;
  const allPicked=S.buildPicked.length===S.buildWords.length;
  return `<div class="screen">

    <div class="build-answer">${S.buildPicked.length
      ?S.buildPicked.map((bi,pos)=>`<button class="chip picked" onclick="unpickWord(${pos})">${S.buildWords[bi].w}</button>`).join('')
      :'<span class="build-hint">Tap the words below in order</span>'}</div>
    <div class="build-pool">${S.buildWords.map((o,i)=>S.buildPicked.includes(i)
      ?`<span class="chip ghost">${o.w}</span>`
      :`<button class="chip" onclick="pickWord(${i})">${o.w}</button>`).join('')}</div>
    ${S.buildChecked===null
      ?`<button class="btn-primary full-w" style="margin-top:18px${allPicked?'':';opacity:.4'}" ${allPicked?'':'disabled'} onclick="checkBuild()">Check</button>`
      :`<div class="quiz-feedback ${S.buildChecked?'correct-fb':'wrong-fb'}">
          ${S.buildChecked?'Perfect! +XP':'Not quite. Correct order:'}

}

  if(S.buildPicked.length!==S.buildWords.length) return;
  const got=S.buildPicked.map(i=>S.buildWords[i].w).join(' ');

// Converts a number to spoken Vietnamese so the TTS reads real prices.
const VN_DIG=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
function twoDigVi(n){
  if(n<10) return VN_DIG[n];
  const t=Math.floor(n/10),u=n%10;
  let s=(t===1?'mười':VN_DIG[t]+' mươi');
  if(u===0) return s;
  if(u===1&&t>1) s+=' mốt';
  else if(u===5) s+=' lăm';
  else s+=' '+VN_DIG[u];
  return s;
}
function threeDigVi(n){
  const h=Math.floor(n/100),r=n%100;
  if(h===0) return twoDigVi(r);
  let s=VN_DIG[h]+' trăm';
  if(r===0) return s;
  if(r<10) s+=' lẻ '+VN_DIG[r];
  else s+=' '+twoDigVi(r);
  return s;
}
function numToVi(n){
  if(n>=1e6){
    const m=Math.floor(n/1e6),r=n%1e6;
    let s=threeDigVi(m)+' triệu';
    if(r){
      const k=Math.floor(r/1000);
      if(k) s+=' '+threeDigVi(k)+' nghìn';
      if(r%1000) s+=' '+threeDigVi(r%1000);
    }
    return s;
  }
  if(n>=1000){
    const k=Math.floor(n/1000),r=n%1000;
    let s=threeDigVi(k)+' nghìn';
    if(r) s+=' '+threeDigVi(r);
    return s;
  }
  return threeDigVi(n);
}
const PRICE_POOL=[15000,20000,25000,35000,45000,55000,65000,85000,95000,
  120000,125000,150000,180000,220000,250000,350000,450000,500000,750000,850000,

  const hits=all.slice(0,40);
  box.innerHTML=q?(hits.length
      ?`<div class="section-label">${all.length} match${all.length===1?'':'es'}${all.length>40?' — showing first 40':''}</div>`+hits.map(v=>renderReviewCard(v)).join('')
      :`<div class="empty-state">No matches</div>`)
    :`<div class="empty-state">Type to search all ${VOCAB.length} terms.</div>`;
}

// ── EXPORT / IMPORT ──────────────────────────────────────────────────────────
function renderExport(){
  return `<div class="screen">
  <div class="lesson-header">
    <button class="btn-back" onclick="go('progress')">‹</button>
    <span class="screen-title">Save and Load</span>
    <span></span>
  </div>
  <main class="main-scroll" style="padding:16px">
    <div class="export-section">
      <div class="export-label">Save Progress</div>
      <p class="export-desc">Your progress already saves automatically on this device. Use this backup to move progress to another phone or protect against clearing browser data: copy the text and keep it in your notes.</p>
      <textarea id="export-box" class="export-box" readonly onclick="this.select()">${exportProgress()}</textarea>
      <button class="btn-primary full-w" onclick="copyExport(this)">Copy to Clipboard</button>
    </div>
    <div class="export-section" style="margin-top:24px">
      <div class="export-label">Load Progress</div>
      <p class="export-desc">Paste your saved progress text below and tap Import.</p>
      <textarea id="import-box" class="export-box" placeholder="Paste saved progress here..."></textarea>
      <button class="btn-primary full-w" onclick="importProgress()">Import Progress</button>
      <div id="import-msg" style="margin-top:8px;color:var(--g);font-weight:600;text-align:center"></div>
    </div>
    <div style="height:30px"></div>
  </main>
  </div>`;
}
function exportProgress(){
  return JSON.stringify(snapshot());
}
function copyExport(btn){
  const box=document.getElementById('export-box');
  const done=()=>{btn.textContent='✓ Copied!';setTimeout(()=>{btn.textContent='Copy to Clipboard';},2000);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(box.value).then(done).catch(()=>{box.select();document.execCommand('copy');done();});
  }else{box.select();document.execCommand('copy');done();}
}
function importProgress(){
  const raw=document.getElementById('import-box').value.trim();
  const msg=document.getElementById('import-msg');
  try{
    const d=JSON.parse(raw);
    if(!d.vocab||!d.state) throw new Error('Invalid format');
    applySnapshot(d);
    saveState();
    msg.textContent='Progress loaded successfully!';
    msg.style.color='var(--g)';
    setTimeout(()=>go('progress'),1200);
  }catch(e){
    msg.textContent='Error: invalid save data. Please try again.';
    msg.style.color='#c0392b';
  }
}

// ── PRIMER ───────────────────────────────────────────────────────────────────
function renderPrimer(){
  return `<div class="screen">
  <div class="lesson-header">
    <button class="btn-back" onclick="go('home')">‹</button>
    <span class="screen-title">Pronoun and Register Guide</span>
    <span></span>
  </div>
  <main class="main-scroll" style="padding:16px">
    ${PRIMER.map(p=>`<div class="primer-block">

    </div>`).join('')}
    <div style="height:30px"></div>

// ── PLACEMENT QUIZ ───────────────────────────────────────────────────────────
function renderPlacement(){
  if(!S.placementPool.length){
    S.placementPool=shuffle([...shuffle(VOCAB.filter(v=>v.tier==='A')).slice(0,6),...shuffle(VOCAB.filter(v=>v.tier==='B')).slice(0,5),...shuffle(VOCAB.filter(v=>v.tier==='C')).slice(0,4)]).map(v=>v.id);
    S.placementQ=0;S.quizAnswer=null;S.placementScore=0;
  }
  if(S.placementQ>=S.placementPool.length){
    const score=S.placementScore;
    const pct=Math.round(score/S.placementPool.length*100);
    const recText=pct>=80?'Tier C and D':pct>=50?'Tier B and C':'Tier A and B';
    return `<div class="screen">
    <div class="lesson-header"><button class="btn-back" onclick="S.placementPool=[];go('home')">‹</button><span class="screen-title">Placement Result</span><span></span></div>
    <main class="main-scroll centered" style="padding:32px 16px">
      <div class="placement-result">
        <div class="placement-score">${pct}%</div>
        <div class="placement-label">${score} of ${S.placementPool.length} correct</div>
        <div class="placement-rec">Recommended start: <strong>${recText}</strong></div>
        <p>Set your tier filter in Practice to match your level and begin building vocabulary.</p>
        <button class="btn-primary" onclick="S.placementPool=[];go('practice')">Go to Practice</button>
      </div>
    </main>
    </div>`;
  }
  const id=S.placementPool[S.placementQ];
  const v=getV(id);
  if(!v){S.placementQ++;render();return '';}
  if(S.placementFor!==id){
    S.placementFor=id;
    let pool=VOCAB.filter(x=>x.id!==id);
    const dist=shuffle(pool).slice(0,3);
    S.quizOptions=shuffle([v,...dist]).map(o=>o.id);
    S.quizAnswer=null;
  }
  return `<div class="screen">
  <div class="lesson-header">
    <button class="btn-back" onclick="S.placementPool=[];go('home')">✕</button>
    <span class="screen-title">Placement Check</span>
    <span style="font-size:12px;color:var(--tx2)">${S.placementQ+1}/${S.placementPool.length}</span>
  </div>
  <main class="main-scroll" style="padding:16px">
    <div class="quiz-prompt-label">English</div>
    <div class="quiz-prompt">${v.en}</div>
    <div class="quiz-prompt-sub">Select the Vietnamese translation</div>
    <div class="quiz-options">
      ${S.quizOptions.map(oid=>{
        const ov=getV(oid);if(!ov)return'';
        let cls='quiz-opt';
        if(S.quizAnswer!==null){if(oid===id)cls+=' correct';else if(oid===S.quizAnswer)cls+=' wrong';else cls+=' faded';}
        return `<button class="${cls}" onclick="answerPlacement('${oid}')">${ov.vi}</button>`;
      }).join('')}
    </div>
    ${S.quizAnswer!==null?`<div class="quiz-feedback ${S.quizAnswer===id?'correct-fb':'wrong-fb'}">
      ${v.vi} — ${v.en}
      <button class="btn-primary" style="margin-top:12px" onclick="S.placementQ++;S.quizAnswer=null;S.quizOptions=[];render()">Next</button>
    </div>`:''}
  </main>
  </div>`;
}
function answerPlacement(oid){
  if(S.quizAnswer!==null) return;
  S.quizAnswer=oid;
  const id=S.placementPool[S.placementQ];
  const v=getV(id);
  if(v&&oid===id){onCorrect(v);S.placementScore++;}
  if(v) speak(v.vi);
  render();
  scrollToFeedback();
}

// ── INIT ─────────────────────────────────────────────────────────────────────
(function init(){
  // ensure all VOCAB has defaults
  VOCAB.forEach(v=>{
    if(!v.box) v.box=1;
    if(!v.correct) v.correct=0;
    if(!v.wrong) v.wrong=0;
    if(!v.lastSeen) v.lastSeen=null;
    if(!v.starred) v.starred=false;
  });
  // restore saved progress, then set today for streak baseline
  loadState();
  rolloverDay();
  if(!S.lastDay) S.lastDay=today();
  try{history.replaceState({s:'home'},'');}catch(e){}
  render();
})();
</script>
