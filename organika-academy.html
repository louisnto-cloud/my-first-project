<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D6A4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Organika VN">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232D6A4F'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EO%3C/text%3E%3C/svg%3E">
<title>Organika Vietnamese Business Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{--g:#2D6A4F;--gl:#52B788;--gp:#D8F3DC;--t:#C47C5A;--tp:#FCEEE6;--bg:#F7F5F0;--wh:#FFF;--tx:#1A2721;--tx2:#5C6B64;--bd:#E5E0D8;--shd:0 2px 14px rgba(0,0,0,.08);--r:14px;--rs:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button{-webkit-user-select:none;user-select:none;touch-action:manipulation}
html{height:100%;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
#root{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.app-wrap{display:flex;flex-direction:column;flex:1;min-height:100vh}
.app-header{background:var(--g);color:var(--wh);padding:14px 16px 0;position:sticky;top:0;z-index:100;flex-shrink:0}
.app-header h1{font-size:11px;font-weight:700;letter-spacing:1px;opacity:.7;text-transform:uppercase;margin-bottom:4px}
.header-row{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px}
.header-title{font-size:17px;font-weight:800;color:var(--wh)}
.hdr-badges{display:flex;gap:8px;align-items:center}
.badge{background:rgba(255,255,255,.18);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--wh)}
.bot-nav{position:sticky;bottom:0;z-index:100;display:flex;background:var(--wh);border-top:1.5px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;border:none;background:transparent;padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:9px;font-weight:700;color:var(--tx2);letter-spacing:.3px;text-transform:uppercase;transition:color .15s}
.nav-btn.active{color:var(--g)}
.nav-btn .ni{font-size:18px;line-height:1}
.content{flex:1;overflow-y:auto;padding:16px;padding-bottom:4px}
.card{background:var(--wh);border-radius:var(--r);box-shadow:var(--shd);padding:16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:var(--rs);cursor:pointer;font-size:15px;font-weight:700;padding:13px 20px;transition:opacity .15s,transform .1s;min-height:50px;width:100%;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn-g{background:var(--g);color:var(--wh)}
.btn-t{background:var(--t);color:var(--wh)}
.btn-out{background:transparent;color:var(--g);border:2px solid var(--g)}
.btn-ghost{background:var(--gp);color:var(--g)}
.btn-sm{padding:9px 14px;font-size:13px;min-height:38px}
.btn-icon{width:48px;height:48px;border-radius:50%;font-size:20px;padding:0;min-height:unset;width:48px;flex-shrink:0}
.tier-A{background:#D8F3DC;color:#1B4332}.tier-B{background:#DBE8F7;color:#1A3A5C}
.tier-C{background:#FBE8D0;color:#7A3900}.tier-D{background:#F3D8F3;color:#4A1A5C}
.tier-E{background:#F7D8D8;color:#5C1A1A}
.tier-badge{display:inline-block;border-radius:6px;padding:3px 9px;font-size:11px;font-weight:800;letter-spacing:.5px}
.tier-header{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:10px;margin-bottom:10px;border-left:4px solid var(--g);background:var(--wh);box-shadow:var(--shd)}
.tier-header h3{font-size:14px;font-weight:800;margin-bottom:2px}
.tier-header p{font-size:12px;color:var(--tx2);line-height:1.4}
.lesson-card{display:flex;align-items:center;gap:12px;background:var(--wh);border-radius:12px;padding:14px 14px;margin-bottom:8px;box-shadow:var(--shd);cursor:pointer;transition:transform .15s;border-left:4px solid transparent}
.lesson-card:active{transform:scale(.98)}
.lesson-card.done{border-left-color:var(--gl)}
.lesson-card.locked{opacity:.45;cursor:not-allowed}
.lesson-ring{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--gp);flex-shrink:0}
.lesson-ring.done{background:var(--gl)}
.lesson-info{flex:1;min-width:0}
.l-num{font-size:10px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px}
.l-name{font-size:14px;font-weight:700;margin:2px 0}
.l-meta{font-size:12px;color:var(--tx2)}
.card-scene{perspective:1200px;width:100%;margin-bottom:16px}
.card-wrap{position:relative;width:100%;height:250px;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;cursor:pointer}
.card-wrap.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;height:100%;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;box-shadow:var(--shd)}
.card-front{background:var(--g);color:var(--wh)}
.card-back{background:var(--wh);transform:rotateY(180deg);align-items:flex-start;text-align:left;overflow:hidden}
.card-en{font-size:24px;font-weight:800;line-height:1.3;margin-bottom:8px}
.card-hint{font-size:13px;opacity:.7;margin-top:6px}
.card-vi{font-size:26px;font-weight:800;color:var(--g);line-height:1.3;margin-bottom:4px}
.card-phonetic{font-size:14px;color:var(--tx2);font-style:italic;margin-bottom:10px}
.card-ex{font-size:13px;color:var(--tx);line-height:1.6;border-top:1px solid var(--bd);padding-top:10px;margin-top:4px;width:100%}
.speak-btn{background:none;border:none;cursor:pointer;font-size:22px;padding:6px;border-radius:8px;line-height:1;transition:transform .15s;display:inline-flex}
.speak-btn:active{transform:scale(.85)}
.speed-row{display:flex;gap:8px;margin-bottom:14px;justify-content:center}
.spd-btn{background:var(--gp);border:none;border-radius:20px;padding:7px 16px;font-size:12px;font-weight:700;color:var(--g);cursor:pointer;font-family:inherit}
.spd-btn.on{background:var(--g);color:var(--wh)}
.quiz-q{font-size:18px;font-weight:700;line-height:1.5;margin-bottom:20px;text-align:center}
.quiz-opt{display:block;width:100%;background:var(--wh);border:2.5px solid var(--bd);border-radius:10px;padding:14px 16px;text-align:left;font-size:15px;cursor:pointer;margin-bottom:10px;transition:border-color .2s,background .2s;font-family:inherit;font-weight:600;line-height:1.4}
.quiz-opt:active{background:var(--gp)}
.quiz-opt.correct{border-color:var(--gl);background:#F0FBF4;color:#1B4332}
.quiz-opt.wrong{border-color:#E07070;background:#FEF0F0;color:#8B0000}
.situation-card{display:flex;gap:12px;background:var(--wh);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--shd);cursor:pointer;align-items:flex-start;transition:transform .15s}
.situation-card:active{transform:scale(.98)}
.sit-num{width:44px;height:44px;background:var(--tp);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--t);flex-shrink:0}
.sit-info h4{font-size:15px;font-weight:700;margin-bottom:4px}
.sit-info p{font-size:12px;color:var(--tx2);line-height:1.4}
.scene-ctx{background:var(--gp);border-radius:10px;padding:12px;font-size:13px;color:#1B4332;line-height:1.6;margin-bottom:16px}
.scene-ctx h4{font-weight:700;margin-bottom:4px;font-size:14px}
.cultural-note{background:var(--tp);border-radius:10px;padding:12px;font-size:13px;color:#7A3900;line-height:1.6;margin-bottom:16px;border-left:3px solid var(--t)}
.cultural-note h4{font-weight:700;margin-bottom:4px}
.dl-line{margin-bottom:14px;border-radius:10px;padding:14px}
.dl-line.buyer{background:#F0FBF4;border-left:3px solid var(--gl)}
.dl-line.you{background:var(--tp);border-left:3px solid var(--t)}
.dl-role{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
.dl-vi{font-size:16px;font-weight:700;line-height:1.55;margin-bottom:3px}
.dl-ph{font-size:12px;color:var(--tx2);font-style:italic;margin-bottom:3px}
.dl-en{font-size:13px;color:var(--tx2);line-height:1.5}
.dl-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.intel-card{display:flex;gap:14px;background:var(--wh);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--shd);cursor:pointer;align-items:center;transition:transform .15s}
.intel-card:active{transform:scale(.98)}
.intel-icon{width:52px;height:52px;background:var(--gp);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.intel-card h3{font-size:15px;font-weight:700;margin-bottom:4px}
.intel-card p{font-size:12px;color:var(--tx2);line-height:1.4}
.intel-point{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd);font-size:14px;line-height:1.65}
.intel-point:last-child{border-bottom:none}
.intel-dot{color:var(--g);font-weight:800;flex-shrink:0;margin-top:1px}
.intel-tag{display:inline-block;background:var(--tp);color:var(--t);border-radius:4px;padding:2px 6px;font-size:11px;font-weight:700;margin-right:4px;white-space:nowrap}
.stat-row{display:flex;gap:10px;margin-bottom:12px}
.stat-box{flex:1;background:var(--wh);border-radius:12px;padding:14px 10px;text-align:center;box-shadow:var(--shd)}
.stat-val{font-size:30px;font-weight:900;color:var(--g)}
.stat-lbl{font-size:10px;color:var(--tx2);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.pbar{height:10px;background:var(--bd);border-radius:5px;overflow:hidden;margin:8px 0}
.pbar-fill{height:100%;background:var(--gl);border-radius:5px;transition:width .4s}
.acc-flag{background:#FEF3D0;color:#8A5F00;border:1px solid #F5D250;border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700;display:inline-block}
.s-flag{background:var(--gp);color:#1B4332;border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700;display:inline-block}
.reg-note{background:var(--tp);border-radius:8px;padding:9px 12px;font-size:12px;color:#7A3900;margin-top:8px;line-height:1.55}
.south-note{background:var(--gp);border-radius:8px;padding:8px 11px;font-size:12px;color:#1B4332;margin-top:6px;line-height:1.5}
.no-voice{background:#FFF8E1;border-radius:8px;padding:9px 12px;font-size:12px;color:#7A5F00;margin-bottom:12px;display:none}
.no-voice.show{display:block}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:var(--wh);border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:440px;max-height:82vh;overflow-y:auto}
.modal-box h3{font-size:18px;font-weight:800;margin-bottom:16px}
textarea{width:100%;border:2px solid var(--bd);border-radius:var(--rs);padding:12px;font-size:13px;font-family:monospace;resize:vertical;min-height:110px;background:var(--bg);outline:none}
textarea:focus{border-color:var(--g)}
.sec-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--tx2);margin-bottom:12px}
.warning{background:#FFF3D0;border:1px solid #F5C842;border-radius:8px;padding:10px 14px;font-size:13px;color:#6B4E00;margin-bottom:12px;line-height:1.5}
.info{background:var(--gp);border-radius:8px;padding:12px;font-size:13px;line-height:1.6;color:#1B4332;margin-bottom:12px}
.back-btn{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--g);background:none;border:none;cursor:pointer;padding:2px 0;margin-bottom:16px;font-family:inherit}
.mode-row{display:flex;gap:8px;margin-bottom:16px}
.mode-btn{flex:1;background:var(--wh);border:2px solid var(--bd);border-radius:10px;padding:12px 8px;cursor:pointer;font-size:13px;font-weight:700;color:var(--tx2);text-align:center;transition:all .2s;font-family:inherit}
.mode-btn.on{background:var(--g);border-color:var(--g);color:var(--wh)}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.qc{background:var(--wh);border-radius:var(--r);padding:14px;box-shadow:var(--shd);cursor:pointer;transition:transform .15s;border:none;text-align:left;font-family:inherit;width:100%}
.qc:active{transform:scale(.96)}
.qc-icon{font-size:26px;margin-bottom:6px;display:block}
.qc-title{font-size:14px;font-weight:700;display:block;margin-bottom:2px}
.qc-sub{font-size:12px;color:var(--tx2);display:block}
.primer-row{padding:14px 0;border-bottom:1px solid var(--bd);display:flex;gap:12px;align-items:flex-start}
.primer-row:last-child{border-bottom:none}
.primer-term{font-size:22px;font-weight:800;color:var(--g);width:80px;flex-shrink:0}
.primer-info h4{font-size:14px;font-weight:700;margin-bottom:4px}
.primer-info p{font-size:13px;color:var(--tx2);line-height:1.55}
.score-banner{background:var(--gp);border-radius:var(--r);padding:20px;text-align:center;margin-bottom:16px}
.score-banner .big{font-size:48px;font-weight:900;color:var(--g)}
.score-banner p{font-size:14px;color:var(--tx2);margin-top:4px}
.drill-card{background:var(--g);border-radius:var(--r);padding:32px 24px;text-align:center;margin-bottom:16px;color:var(--wh)}
.drill-vi{font-size:28px;font-weight:800;margin-bottom:8px;line-height:1.3}
.drill-ph{font-size:14px;opacity:.75;font-style:italic}
.mastery-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0}
.m-l{background:var(--bd)}.m-f{background:var(--gl)}.m-m{background:var(--g)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .22s ease}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}

/* ── LAYOUT ── */
.screen{display:flex;flex-direction:column;min-height:100vh;background:var(--bg)}
.main-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.main-scroll.centered{display:flex;flex-direction:column;align-items:center}

/* ── APP HEADER ── */
.app-header{background:var(--g);color:var(--wh);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:50}
.header-logo{display:flex;align-items:center;gap:8px}
.brand-name{font-size:16px;font-weight:800;letter-spacing:-.3px}
.header-stats{display:flex;gap:8px}
.streak-chip,.xp-chip{background:rgba(255,255,255,.2);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700}
.screen-header{background:var(--g);color:var(--wh);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.screen-title{font-size:17px;font-weight:800}
.screen-intro{font-size:14px;color:var(--tx2);line-height:1.6;margin-bottom:16px}

/* ── BOTTOM NAV ── */
.bottom-nav{position:sticky;bottom:0;z-index:100;display:flex;background:var(--wh);border-top:1.5px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-btn{flex:1;border:none;background:transparent;padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:9px;font-weight:700;color:var(--tx2);letter-spacing:.3px;text-transform:uppercase;transition:color .15s;font-family:inherit}
.nav-btn.active{color:var(--g)}
.nav-icon{font-size:18px;line-height:1}
.nav-label{font-size:9px}

/* ── HERO / HOME ── */
.hero-card{background:var(--g);border-radius:var(--r);padding:20px;margin:16px 16px 12px;color:var(--wh)}
.hero-title{font-size:22px;font-weight:900;margin-bottom:2px}
.hero-sub{font-size:13px;opacity:.8;margin-bottom:14px}
.goal-bar-wrap{width:100%}
.goal-bar-label{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:6px;opacity:.85}
.goal-bar{height:8px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}
.goal-fill{height:100%;background:var(--gl);border-radius:4px;transition:width .5s}

/* ── STAT CARDS ── */
.stat-row{display:flex;gap:10px;padding:0 16px 12px}
.stat-card{flex:1;background:var(--wh);border-radius:12px;padding:14px 10px;text-align:center;box-shadow:var(--shd)}
.stat-card.accent{background:var(--tp)}
.stat-n{font-size:28px;font-weight:900;color:var(--g)}
.stat-card.accent .stat-n{color:var(--t)}
.stat-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--tx2);margin-top:2px}
.section-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--tx2);padding:0 16px;margin-bottom:8px}

/* ── ACTION GRID ── */
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.action-card{background:var(--wh);border-radius:var(--r);padding:16px 12px;box-shadow:var(--shd);cursor:pointer;border:none;display:flex;flex-direction:column;align-items:flex-start;gap:4px;transition:transform .15s;font-family:inherit;text-align:left}
.action-card:active{transform:scale(.96)}
.action-card.primary{background:var(--g);color:var(--wh)}
.ac-icon{font-size:26px;line-height:1;margin-bottom:2px}
.ac-label{font-size:14px;font-weight:800}
.ac-sub{font-size:12px;opacity:.7}
.action-card.primary .ac-sub{color:rgba(255,255,255,.75)}

/* ── EXPLORE LIST ── */
.explore-list{display:flex;flex-direction:column;gap:8px;padding:0 16px 16px}
.explore-row{display:flex;align-items:center;gap:12px;background:var(--wh);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shd);cursor:pointer;border:none;font-size:14px;font-weight:600;color:var(--tx);font-family:inherit;transition:transform .15s}
.explore-row:active{transform:scale(.98)}
.explore-row .arrow{margin-left:auto;color:var(--tx2);font-size:18px}

/* ── LESSON HEADER ── */
.lesson-header{background:var(--wh);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);flex-shrink:0}
.lesson-progress{display:flex;align-items:center;gap:8px;flex:1;margin:0 12px}
.lp-bar{flex:1;height:6px;background:var(--bd);border-radius:3px;overflow:hidden}
.lp-fill{height:100%;background:var(--g);border-radius:3px;transition:width .4s}

/* ── BUTTONS ── */
.btn-back{background:none;border:none;cursor:pointer;font-size:16px;color:var(--tx2);padding:6px;border-radius:8px;font-family:inherit;font-weight:700}
.btn-primary{display:block;width:100%;background:var(--g);color:var(--wh);border:none;border-radius:var(--rs);padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:opacity .15s}
.btn-primary:active{opacity:.85}
.btn-sec{background:var(--gp);color:var(--g);border:none;border-radius:var(--rs);padding:13px 20px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-danger{display:block;width:100%;background:#FDECEA;color:#C0392B;border:none;border-radius:var(--rs);padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.full-w{width:100%}
.empty-state{text-align:center;color:var(--tx2);padding:40px 20px;font-size:14px;line-height:1.7}

/* ── MODE PILLS ── */
.mode-pills{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.mode-pills.scroll-x{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.pill{background:var(--wh);border:2px solid var(--bd);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--tx2);cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit}
.pill.active{background:var(--g);border-color:var(--g);color:var(--wh)}

/* ── FLASHCARD ── */
.card-tier-badge{background:rgba(255,255,255,.2);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:800;letter-spacing:.5px;margin-bottom:12px}
.card-cat{font-size:11px;opacity:.7;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.card-main-text{font-size:28px;font-weight:800;line-height:1.3;text-align:center}
.card-back .card-main-text{font-size:22px;color:var(--g);text-align:left}
.card-phonetic{font-size:14px;opacity:.8;font-style:italic;margin-top:6px}
.card-example{font-size:13px;color:var(--tx);line-height:1.6;margin-top:12px;padding-top:10px;border-top:1px solid var(--bd);width:100%}
.card-example-en{font-size:12px;color:var(--tx2);line-height:1.5;margin-top:4px}
.card-south-note{background:var(--gp);border-radius:6px;padding:6px 10px;font-size:11px;color:#1B4332;margin-top:8px;width:100%}
.speak-btn{background:rgba(255,255,255,.15);border:none;cursor:pointer;font-size:20px;padding:8px;border-radius:8px;line-height:1;display:inline-flex;align-items:center;justify-content:center;margin-top:8px}
.speak-btn-back{background:var(--gp);margin-top:10px}
.tap-hint{color:var(--tx2);font-size:13px;text-align:center;margin-top:8px}
.grade-row{display:flex;gap:10px;padding:0 16px 20px;width:100%}
.grade-btn{flex:1;border:none;border-radius:var(--rs);padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.grade-btn.wrong{background:#FDECEA;color:#C0392B}
.grade-btn.hard{background:#FFF8E1;color:#8A5F00}
.grade-btn.ok{background:#D8F3DC;color:#1B4332}

/* ── QUIZ ── */
.quiz-prompt-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--tx2);margin-bottom:6px}
.quiz-prompt{font-size:22px;font-weight:800;line-height:1.4;margin-bottom:4px;color:var(--tx)}
.quiz-prompt-sub{font-size:13px;color:var(--tx2);margin-bottom:20px}
.quiz-options{display:flex;flex-direction:column;gap:10px}
.quiz-opt{width:100%;background:var(--wh);border:2.5px solid var(--bd);border-radius:10px;padding:14px 16px;text-align:left;font-size:15px;cursor:pointer;transition:border-color .2s,background .2s;font-family:inherit;font-weight:600;line-height:1.4}
.quiz-opt.correct{border-color:var(--gl);background:#F0FBF4;color:#1B4332}
.quiz-opt.wrong{border-color:#E07070;background:#FEF0F0;color:#8B0000}
.quiz-opt.faded{opacity:.45}
.quiz-feedback{background:var(--wh);border-radius:var(--r);padding:16px;margin-top:16px;box-shadow:var(--shd)}
.correct-fb{border-top:3px solid var(--gl)}
.wrong-fb{border-top:3px solid #E07070}
.quiz-reveal{font-size:18px;font-weight:700;color:var(--g);margin:8px 0 4px}
.quiz-ph{font-size:13px;color:var(--tx2);font-style:italic;margin-bottom:10px}
.speak-inline{background:var(--gp);border:none;border-radius:var(--rs);padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:700;color:var(--g)}
.speak-inline.lg{font-size:14px;padding:10px 18px}

/* ── DRILL ── */
.drill-card{background:var(--g);border-radius:var(--r);padding:32px 24px;text-align:center;color:var(--wh);box-shadow:var(--shd);width:100%;max-width:380px}
.drill-en{font-size:14px;opacity:.8;margin-bottom:8px;font-weight:600}
.drill-vi{font-size:28px;font-weight:800;margin-bottom:6px;line-height:1.3}
.drill-ph{font-size:14px;opacity:.75;font-style:italic;margin-bottom:8px}
.drill-south{font-size:12px;background:rgba(255,255,255,.15);border-radius:6px;padding:6px 10px;margin-bottom:12px;display:inline-block}
.speak-big{background:rgba(255,255,255,.2);border:none;border-radius:var(--rs);padding:12px 24px;font-size:15px;font-weight:700;cursor:pointer;color:var(--wh);margin:10px 0;font-family:inherit}
.drill-hint{font-size:12px;opacity:.7;margin-top:8px}

/* ── SITUATIONS ── */
.sit-card{display:flex;align-items:center;gap:12px;background:var(--wh);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--shd);cursor:pointer;border:none;width:100%;font-family:inherit;text-align:left;transition:transform .15s}
.sit-card:active{transform:scale(.98)}
.sit-num{width:40px;height:40px;background:var(--tp);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--t);flex-shrink:0}
.sit-info{flex:1;display:flex;flex-direction:column;gap:2px}
.sit-title{font-size:14px;font-weight:700;color:var(--tx)}
.sit-titlevi{font-size:12px;color:var(--tx2)}
.sit-context{background:var(--gp);border-radius:10px;padding:12px;font-size:13px;color:#1B4332;line-height:1.6;margin-bottom:12px}
.sit-culture{background:var(--tp);border-radius:10px;padding:12px;font-size:13px;color:#7A3900;line-height:1.6;margin-bottom:16px;border-left:3px solid var(--t)}
.dialogue-wrap{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.dlg-line{border-radius:10px;padding:14px;transition:opacity .3s}
.dlg-line.you{background:var(--tp);border-left:3px solid var(--t)}
.dlg-line.them{background:var(--gp);border-left:3px solid var(--gl)}
.dlg-line.future{opacity:.3}
.dlg-line.past{opacity:.7}
.dlg-role{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--tx2);margin-bottom:6px}
.dlg-vi{font-size:15px;font-weight:700;line-height:1.55;margin-bottom:3px}
.dlg-en{font-size:12px;color:var(--tx2);line-height:1.5;margin-top:4px}
.dlg-ph{font-size:11px;color:var(--tx2);font-style:italic;margin-top:2px}
.speak-micro{background:none;border:none;cursor:pointer;font-size:16px;padding:2px;line-height:1;margin-left:4px;vertical-align:middle}
.scenario-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:8px}

/* ── INTEL ── */
.intel-card{display:flex;align-items:center;gap:14px;background:var(--wh);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--shd);cursor:pointer;border:none;width:100%;font-family:inherit;text-align:left;transition:transform .15s}
.intel-card:active{transform:scale(.98)}
.intel-icon{font-size:28px;width:52px;height:52px;background:var(--gp);border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.intel-title{flex:1;font-size:15px;font-weight:700;color:var(--tx)}
.intel-section{margin-bottom:14px;background:var(--wh);border-radius:16px;padding:14px 16px;box-shadow:var(--shd);border:1px solid rgba(29,58,45,.05)}
.intel-sh{font-size:15px;font-weight:800;color:var(--g);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--gp)}
.intel-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.intel-list li{font-size:13.5px;line-height:1.7;color:var(--tx);padding-left:18px;position:relative}
.intel-list li::before{content:'·';color:var(--g);font-weight:900;position:absolute;left:4px}

/* ── REVIEW ── */
.rv-card{background:var(--wh);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--shd)}
.rv-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.rv-en{font-size:14px;font-weight:700;color:var(--tx)}
.rv-tier{font-size:11px;background:var(--gp);color:var(--g);border-radius:4px;padding:2px 7px;font-weight:700}
.rv-vi{font-size:17px;font-weight:800;color:var(--g);margin-bottom:2px}
.rv-ph{font-size:12px;color:var(--tx2);font-style:italic;margin-bottom:4px}
.rv-stats{font-size:11px;color:var(--tx2)}

/* ── PROGRESS ── */
.prog-hero{background:var(--g);border-radius:var(--r);padding:24px;margin-bottom:16px;text-align:center;color:var(--wh)}
.prog-xp{font-size:48px;font-weight:900;line-height:1}
.prog-streak{font-size:16px;margin-top:4px;opacity:.85}
.tier-prog-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tier-label{font-size:13px;font-weight:700;width:50px}
.tier-bar{flex:1;height:10px;background:var(--bd);border-radius:5px;overflow:hidden}
.tier-fill{height:100%;background:var(--g);border-radius:5px;transition:width .5s}
.tier-pct{font-size:12px;color:var(--tx2);width:40px;text-align:right}

/* ── EXPORT ── */
.export-section{background:var(--wh);border-radius:var(--r);padding:16px;box-shadow:var(--shd)}
.export-label{font-size:15px;font-weight:800;margin-bottom:6px;color:var(--tx)}
.export-desc{font-size:13px;color:var(--tx2);line-height:1.6;margin-bottom:12px}
.export-box{width:100%;height:120px;border:2px solid var(--bd);border-radius:var(--rs);padding:12px;font-size:12px;font-family:monospace;resize:none;background:var(--bg);margin-bottom:10px;outline:none}
.export-box:focus{border-color:var(--g)}

/* ── PRIMER ── */
.primer-block{background:var(--wh);border-radius:var(--r);padding:16px;margin-bottom:16px;box-shadow:var(--shd)}
.primer-title{font-size:16px;font-weight:800;color:var(--g);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--gp)}
.primer-body p{font-size:13px;line-height:1.7;color:var(--tx);margin-bottom:10px}
.primer-body ul{padding-left:18px;display:flex;flex-direction:column;gap:8px}
.primer-body ul li{font-size:13px;line-height:1.65;color:var(--tx)}
.primer-body{overflow-x:auto}
.primer-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px;min-width:280px}
.primer-table th{background:var(--gp);color:#1B4332;font-weight:700;padding:8px;text-align:left;border-bottom:2px solid var(--bd)}
.primer-table td{padding:8px;border-bottom:1px solid var(--bd);line-height:1.5}
.primer-table tr:last-child td{border-bottom:none}
.tip{background:var(--tp);border-radius:8px;padding:10px 12px;font-size:12px;color:#7A3900;line-height:1.6;border-left:3px solid var(--t)}

/* ── NEW COMPONENTS ── */
.star-btn{position:absolute;top:10px;right:10px;background:none;border:none;font-size:26px;color:#E8B931;cursor:pointer;padding:6px;line-height:1;z-index:2}
.rv-star{background:none;border:none;font-size:20px;color:#E8B931;cursor:pointer;padding:2px 6px;vertical-align:middle}
.speed-chip{background:var(--gp);border:none;border-radius:20px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--g);cursor:pointer;font-family:inherit;white-space:nowrap}
.speed-chip.on{background:var(--t);color:var(--wh)}
.card-audio-row{display:flex;align-items:center;gap:10px;margin-top:10px;width:100%}
.practice-toggle-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.summary-card{background:var(--wh);border-radius:var(--r);padding:32px 24px;box-shadow:var(--shd);text-align:center;width:100%;max-width:360px}
.summary-emoji{font-size:52px;margin-bottom:8px}
.summary-msg{font-size:18px;font-weight:800;color:var(--tx);margin-bottom:4px}
.summary-pct{font-size:56px;font-weight:900;color:var(--g);line-height:1.1;margin-bottom:16px}
.summary-stats{display:flex;gap:10px;justify-content:center;margin-bottom:24px}
.sum-stat{flex:1;background:var(--bg);border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.sum-n{font-size:24px;font-weight:900}
.sum-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--tx2)}
.dict-input{width:100%;border:2px solid var(--bd);border-radius:var(--rs);padding:14px 16px;font-size:16px;background:var(--wh);outline:none;margin-bottom:14px;font-family:inherit}
.dict-input:focus{border-color:var(--g)}
.price-play-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:8px 0 20px}
.price-play{width:110px;height:110px;border-radius:50%;background:var(--g);color:var(--wh);border:none;cursor:pointer;font-size:34px;font-family:inherit;box-shadow:var(--shd);transition:transform .12s;line-height:1.2}
.price-play span{font-size:11px;font-weight:700;display:block;margin-top:2px}
.price-play:active{transform:scale(.93)}
.price-opt{font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;text-align:center}

/* ── PLACEMENT ── */
.placement-result{text-align:center;padding:20px;max-width:340px}
.placement-score{font-size:64px;font-weight:900;color:var(--g);line-height:1}
.placement-label{font-size:16px;color:var(--tx2);margin:6px 0}
.placement-rec{font-size:15px;color:var(--tx);margin-bottom:16px;line-height:1.5}
.placement-rec strong{color:var(--g)}
.placement-result p{font-size:13px;color:var(--tx2);line-height:1.65;margin-bottom:20px}

/* ════════════════ UI POLISH LAYER ════════════════ */
:root{--r:18px;--rs:12px;
  --grad:linear-gradient(135deg,#1E4D38 0%,#2D6A4F 55%,#37855F 100%);
  --gradT:linear-gradient(135deg,#B06A48 0%,#C47C5A 60%,#D89272 100%);
  --shd:0 4px 20px rgba(29,58,45,.10);
  --shd-lg:0 10px 34px rgba(29,58,45,.16)}
body,button,input,textarea{font-family:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}

/* screen transitions */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.screen{animation:rise .28s cubic-bezier(.22,.9,.3,1)}

/* headers */
.app-header,.screen-header{background:var(--grad);padding:16px;box-shadow:0 4px 18px rgba(29,58,45,.25)}
.brand-name{letter-spacing:-.4px;font-weight:900}
.streak-chip,.xp-chip{background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18)}

/* hero */
.hero-card{background:var(--grad);position:relative;overflow:hidden;box-shadow:var(--shd-lg)}
.hero-card::before{content:'';position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.07);top:-70px;right:-50px}
.hero-card::after{content:'';position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.05);bottom:-50px;left:-30px}
.hero-title{letter-spacing:-.5px;font-weight:900;position:relative}
.hero-sub,.goal-bar-wrap{position:relative}
.goal-bar{height:10px;border-radius:5px}
.goal-fill{background:linear-gradient(90deg,#52B788,#8FE3B0);box-shadow:0 0 10px rgba(82,183,136,.6);transition:width .7s cubic-bezier(.22,.9,.3,1)}

/* stat + action cards */
.stat-card{border:1px solid rgba(29,58,45,.05);border-radius:16px}
.stat-n{letter-spacing:-1px}
.action-card{border-radius:var(--r);border:1px solid rgba(29,58,45,.05);transition:transform .15s,box-shadow .15s}
.action-card:active{transform:scale(.95);box-shadow:var(--shd-lg)}
.action-card.primary{background:var(--grad)}
.explore-row{border-radius:16px;border:1px solid rgba(29,58,45,.05);font-weight:700}

/* buttons */
.btn-primary{background:var(--grad);border-radius:14px;box-shadow:0 6px 18px rgba(45,106,79,.35);letter-spacing:.2px;transition:transform .12s,box-shadow .12s}
.btn-primary:active{transform:translateY(1px) scale(.98);box-shadow:0 3px 10px rgba(45,106,79,.3)}
.btn-sec{border-radius:14px}
.btn-danger{border-radius:14px}
.pill{border-radius:22px;transition:all .18s}
.pill.active{background:var(--grad);border-color:transparent;box-shadow:0 4px 12px rgba(45,106,79,.3)}

/* progress bars */
.lp-fill,.tier-fill{background:linear-gradient(90deg,#2D6A4F,#52B788);transition:width .5s cubic-bezier(.22,.9,.3,1)}

/* flashcards */
.card-wrap{height:280px}
.card-face{border-radius:22px;box-shadow:var(--shd-lg)}
.card-front{background:var(--grad)}
.card-front::before{content:'';position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.06);top:-60px;right:-40px}
.card-tier-badge{border:1px solid rgba(255,255,255,.25)}
.card-main-text{letter-spacing:-.4px}

/* quiz */
.quiz-opt{border-radius:16px;border-width:2px;transition:transform .12s,border-color .2s,background .2s}
.quiz-opt:active{transform:scale(.98)}
.quiz-prompt{letter-spacing:-.4px;font-weight:900}
.quiz-feedback{border-radius:18px;animation:rise .25s ease}
.grade-btn{border-radius:14px;transition:transform .12s}
.grade-btn:active{transform:scale(.95)}

/* drill + price */
.drill-card{background:var(--grad);border-radius:22px;box-shadow:var(--shd-lg);position:relative;overflow:hidden}
.drill-card::before{content:'';position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.06);top:-60px;left:-50px}
.price-play{background:var(--grad);box-shadow:0 10px 28px rgba(45,106,79,.4),0 0 0 10px rgba(45,106,79,.08)}
.price-play:active{box-shadow:0 4px 14px rgba(45,106,79,.35),0 0 0 16px rgba(45,106,79,.05)}

/* dialogues + intel + review */
.sit-card,.intel-card,.rv-card,.primer-block,.export-section{border-radius:var(--r);border:1px solid rgba(29,58,45,.05)}
.sit-num{background:var(--gradT);color:#fff}
.intel-icon{border-radius:16px}
.dlg-line{border-radius:14px;transition:opacity .3s,transform .3s}
.dlg-line.curr{transform:scale(1.01);box-shadow:var(--shd)}

/* summary */
.summary-card{border-radius:24px;box-shadow:var(--shd-lg);animation:rise .35s cubic-bezier(.22,.9,.3,1)}
.summary-pct{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sum-stat{border-radius:14px}

/* bottom nav */
.bottom-nav{background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(29,58,45,.08);box-shadow:0 -4px 20px rgba(29,58,45,.06)}
.nav-btn{position:relative;padding:10px 4px 8px}
.nav-btn .nav-icon{transition:transform .18s}
.nav-btn.active .nav-icon{transform:translateY(-1px) scale(1.12)}
.nav-btn.active::after{content:'';position:absolute;top:3px;left:50%;transform:translateX(-50%);width:16px;height:3px;border-radius:2px;background:var(--g)}

/* inputs */
.dict-input,.export-box{border-radius:14px}
.dict-input:focus{box-shadow:0 0 0 4px rgba(45,106,79,.12)}

/* flashcard redesign */
.card-wrap{height:340px}
.card-hint2{font-size:13px;opacity:.75;margin-top:14px;background:rgba(255,255,255,.12);border-radius:20px;padding:7px 14px}
.card-back{justify-content:flex-start;overflow-y:auto;padding:20px 18px;-webkit-overflow-scrolling:touch}
.vi-label{font-size:12px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;padding-right:36px}
.vi-word{font-size:30px;font-weight:900;color:var(--g);line-height:1.25;letter-spacing:-.4px;margin-bottom:8px;padding-right:36px}
.vi-say{background:var(--tp);border-radius:12px;padding:9px 13px;font-size:14px;color:#7A3900;line-height:1.5;width:100%;margin-bottom:10px}
.vi-say b{font-size:15px}
.hear-btn{background:var(--grad);color:#fff;border:none;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(45,106,79,.3)}
.hear-btn:active{transform:scale(.96)}
.card-back .card-audio-row{margin:0 0 12px}
.card-back .card-example{border-top:1px solid var(--bd);padding-top:10px;font-size:13px}
.card-reg-note{background:#F0F4FB;border-radius:8px;padding:8px 11px;font-size:11.5px;color:#1A3A5C;margin-top:8px;width:100%;line-height:1.55}
.goal-adjust{display:flex;align-items:center;gap:14px;background:var(--wh);border-radius:16px;padding:12px 16px;box-shadow:var(--shd);justify-content:center}
.goal-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--gp);color:var(--g);font-size:24px;font-weight:800;cursor:pointer;font-family:inherit}
.goal-btn:active{transform:scale(.92)}
.goal-val{font-size:16px;font-weight:800;color:var(--tx);min-width:120px;text-align:center}
.smart-start{margin-top:14px;width:100%;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:14px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;position:relative;backdrop-filter:blur(4px);transition:transform .12s,background .15s}
.smart-start:active{transform:scale(.97);background:rgba(255,255,255,.28)}
.build-answer{min-height:64px;background:var(--wh);border:2px dashed var(--bd);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.build-hint{color:var(--tx2);font-size:13px;padding:6px}
.build-pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--wh);border:2px solid var(--bd);border-radius:12px;padding:9px 14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--tx);transition:transform .1s;box-shadow:0 2px 6px rgba(29,58,45,.06)}
.chip:active{transform:scale(.94)}
.chip.picked{background:var(--gp);border-color:var(--gl);color:#1B4332}
.chip.ghost{background:var(--bg);border-color:transparent;color:transparent;box-shadow:none;pointer-events:none}
.weak-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--wh);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shd)}
.weak-info{display:flex;flex-direction:column;gap:2px}
.weak-cat{font-size:14px;font-weight:700;color:var(--tx)}
.weak-pct{font-size:12px;color:#C0392B;font-weight:700}
.mode-list{display:flex;flex-direction:column;gap:8px}
.mode-row-btn{display:flex;align-items:center;gap:12px;background:var(--wh);border:2px solid var(--bd);border-radius:16px;padding:12px 14px;cursor:pointer;font-family:inherit;text-align:left;transition:border-color .15s,transform .12s;width:100%}
.mode-row-btn:active{transform:scale(.98)}
.mode-row-btn.active{border-color:var(--g);background:var(--gp)}
.mr-icon{font-size:24px;width:36px;text-align:center}
.mr-txt{flex:1;display:flex;flex-direction:column;gap:1px}
.mr-name{font-size:15px;font-weight:800;color:var(--tx)}
.mr-desc{font-size:12px;color:var(--tx2)}
.mr-check{font-size:18px;font-weight:900;color:var(--g)}
.filters-toggle{display:block;width:100%;background:none;border:none;color:var(--tx2);font-size:13px;font-weight:700;padding:14px 4px 10px;cursor:pointer;font-family:inherit;text-align:center}
.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ach{background:var(--wh);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shd);border:1px solid rgba(29,58,45,.05)}
.ach.locked{opacity:.42;filter:grayscale(.8)}
.ach.got{border-color:var(--gl)}
.ach-icon{font-size:24px}
.ach-name{font-size:13px;font-weight:800;color:var(--tx)}
.ach-desc{font-size:11px;color:var(--tx2)}
.welcome-card{margin:0 16px 12px;background:var(--tp);border-radius:var(--r);padding:16px;border-left:4px solid var(--t)}
.welcome-title{font-size:16px;font-weight:800;color:#7A3900;margin-bottom:4px}
.welcome-card p{font-size:13px;color:#7A3900;line-height:1.5}
</style>

['a02','A','G','Hello (to older or same-age female)','Xin chào chị','sin chow chi','Xin chào chị Linh, rất vui được gặp chị.','Hello Ms. Linh, very pleased to meet you.','Same nationwide. Chị for women older or similar age.','Use chị for female buyers and partners. Never use bạn in business.',0],

['a04','A','G','Good afternoon','Chào buổi chiều','chow boo-ee chyew','Chào buổi chiều chị, hôm nay trời nóng quá nhỉ!','Good afternoon, it is very hot today!','Same nationwide.','Use after noon. Adding anh or chị is respectful.',0],
['a05','A','G','Goodbye','Tạm biệt','tahm byeet','Tạm biệt anh, hẹn gặp lại vào tuần sau.','Goodbye, see you again next week.','Same nationwide. Informal South may say Thôi nhé or Đi nha.','Standard formal farewell. Fine for all business contexts.',0],
['a06','A','G','See you again','Hẹn gặp lại','hen gap lie','Hẹn gặp lại chị vào thứ Tư nhé.','See you again on Wednesday.','Same nationwide. Southerners often add nhé at the end.','Positive and warm closing phrase. Shows intent to continue relationship.',0],
['a07','A','G','Nice to meet you','Rất vui được gặp anh/chị','rat voo-ee dook gap anh/chi','Rất vui được gặp anh, tôi đã nghe nói nhiều về công ty của anh.','Very pleased to meet you, I have heard a lot about your company.','Same nationwide.','Adjust anh/chị based on who you are addressing.',0],
['a08','A','G','My name is','Tôi tên là','toy ten la','Tôi tên là Michael, tôi là Giám đốc Bán hàng tại Organika.','My name is Michael, I am Sales Manager at Organika.','Same nationwide.','Tôi is neutral first person. Em is more humble if buyer is older.',0],
['a09','A','G','I work for Organika','Tôi làm việc cho Organika','toy lam vyeck cho Organika','Tôi làm việc cho Organika Health Canada, phụ trách thị trường Việt Nam.','I work for Organika Health Canada, responsible for the Vietnam market.','Same nationwide.','Key intro sentence. Learn this cold.',0],
['a10','A','G','Please have a seat','Mời ngồi','moy ngoy','Mời anh ngồi, chúng ta bắt đầu cuộc họp nhé.','Please have a seat, let us start the meeting.','Same nationwide.','Hosting phrase. You may hear this from the buyer too.',0],
['a11','A','G','What is your name','Anh/Chị tên là gì','anh/chi ten la zee','Xin hỏi anh tên là gì ạ?','May I ask, what is your name?','Same nationwide. Ạ at end adds respect.','Use xin hỏi before a question for extra politeness.',0],
['a12','A','G','I am from Canada','Tôi đến từ Canada','toy den too Canada','Tôi đến từ Vancouver, Canada — nơi đặt trụ sở Organika.','I am from Vancouver, Canada — where Organika is headquartered.','Same nationwide.','Mentioning Vancouver specifically reinforces the clean Canadian origin story.',0],

['a14','A','G','Business card','Danh thiếp','zanh thyep','Đây là danh thiếp của tôi, mong anh/chị giữ liên lạc.','Here is my business card, I hope we can stay in touch.','Same nationwide.','Offer and receive business cards with both hands. Study the card before putting it away. Never write on it.',0],

// Numbers
['a16','A','N','1 — one','một','mote','Tôi cần đặt một thùng mẫu thử.','I need to order one sample case.','Same nationwide. Tone: nặng (heavy, cut-off).','',0],
['a17','A','N','2 — two','hai','high','Hai hương vị bán chạy nhất là mâm xôi và chanh xanh chanh vàng.','The two best-selling flavors are Raspberry and Lime Lemon.','Same nationwide. Level tone.','',0],

{role:'Michael (You)',you:true,vi:'30 ngày kể từ ngày giao hàng cho đơn đầu tiên. Sau đó chúng ta có thể xem xét linh hoạt hơn.',en:'30 days from delivery date for the first order. After that we can consider more flexibility.',ph:'30 ngay keh too ngay yow hang cho don dow tyen'},
{role:'Buyer (Chi Ha)',you:false,vi:'Được. Để tôi trình lên ban giám đốc và phản hồi anh trong tuần này.',en:'Okay. Let me present to the board and get back to you this week.',ph:'dook. deh toy trinh len ban yam dok va fan hoy anh trong twan nay'}
]},
{id:'s04',title:'Handling "Your Price Is Too High"',titleVi:'Xử Lý Phản Đối Giá Cao',context:'A retail buyer says your product is too expensive compared to competitors. You need to defend your value without being defensive.',culturalNote:'Never argue. Acknowledge the concern first with tôi hiểu. Then pivot to value, not price. Use data where possible. Offer to send supporting materials rather than making claims in the room.',lines:[
{role:'Buyer (Anh Duc)',you:false,vi:'Giá của anh cao hơn đối thủ cạnh tranh đến 30%.',en:'Your price is 30% higher than competitors.',ph:'ya kwa anh cow hon doi thoo kan tranh den 30 fun tram'},
{role:'Michael (You)',you:true,vi:'Tôi hiểu sự lo ngại của anh. Cho phép tôi giải thích giá trị đằng sau con số đó.',en:'I understand your concern. Allow me to explain the value behind that number.',ph:'toy hyew soo lo ngai kwa anh. cho fep toy yai thik ya tri dang sau kon so do'},
{role:'Buyer (Anh Duc)',you:false,vi:'Vâng, tôi đang lắng nghe.',en:'Yes, I am listening.',ph:'vang, toy dang lang ngeh'},
{role:'Michael (You)',you:true,vi:'Organika là thương hiệu Canada với chứng nhận GMP quốc tế, thành phần tự nhiên, không đường và không chất bảo quản.',en:'Organika is a Canadian brand with international GMP certification, natural ingredients, no sugar and no preservatives.',ph:'Organika la thuh-ung hyew Canada voi choong nyan GMP kwok teh, tanh fun too nyen, khong duh-ung va khong chat bow kwan'},
{role:'Buyer (Anh Duc)',you:false,vi:'Nhưng khách hàng của chúng tôi nhạy cảm về giá.',en:'But our customers are price-sensitive.',ph:'nyoong khach hang kwa choong toy nyai kam veh ya'},
{role:'Michael (You)',you:true,vi:'Đúng, nhưng phân khúc sản phẩm chức năng cao cấp tại TPHCM đang tăng trưởng 20% mỗi năm. Đây là cơ hội.',en:'True, but the premium functional product segment in HCMC is growing 20% per year. This is an opportunity.',ph:'dung, nyoong fan khook san fam chook nang cow kap tai TPHCM dang tang troong 20 fun tram moi nam'},
{role:'Buyer (Anh Duc)',you:false,vi:'Anh có dữ liệu thị trường không?',en:'Do you have market data?',ph:'anh co zoo lyew thi truh-ung khong'},
{role:'Michael (You)',you:true,vi:'Dạ, tôi sẽ gửi báo cáo thị trường chi tiết và kết quả thử nghiệm tại các thị trường khác cho anh sau buổi họp này.',en:'Yes, I will send you a detailed market report and test market results from other markets after this meeting.',ph:'ya, toy seh gwee bow cow thi truh-ung chi tyeet va ket kwa thoo ngem tai cac thi truh-ung khac cho anh sau bwoi hop nay'}
]},
{id:'s05',title:'Discussing MOQ and Pack Configuration',titleVi:'Thảo Luận Số Lượng Tối Thiểu',context:'Discussing minimum order quantity and pack formats for Organika Sparkling Electrolyte. The buyer wants to start small.',culturalNote:'Always allow a buyer to start small. The trial order builds trust and proves your product. A Vietnamese buyer who says let me try first is a serious buyer.',lines:[
{role:'Michael (You)',you:true,vi:'Đơn hàng tối thiểu tiêu chuẩn là 60 thùng, tức 20 thùng mỗi hương vị.',en:'Standard minimum order is 60 cases, meaning 20 cases per flavor.',ph:'don hang toy thyew tyew chwan la 60 thoong, took 20 thoong moi hoong vee'},
{role:'Buyer (Chi Mai)',you:false,vi:'Chúng tôi muốn thử nhỏ hơn trước. Có thể bắt đầu từ 30 thùng không?',en:'We want to start with a smaller trial. Can we start from 30 cases?',ph:'choong toy mwon thoo nyo hon trook. co theh bat dow too 30 thoong khong'},
{role:'Michael (You)',you:true,vi:'Cho đơn thử, tôi có thể sắp xếp 30 thùng — 10 thùng mỗi hương vị mâm xôi, chanh xanh chanh vàng, và chanh dây thơm.',en:'For a trial order, I can arrange 30 cases — 10 cases each of Raspberry, Lime Lemon, and Passion Fruit Pineapple.',ph:'cho don thoo, toy co theh sap sep 30 thoong — 10 thoong moi hoong vee mam soy, chanh sang chanh vang, va chanh zay thom'},
{role:'Buyer (Chi Mai)',you:false,vi:'Tốt. Cả vỉ 4 lon lẫn lon đơn lẻ chứ?',en:'Good. Both 4-packs and single cans right?',ph:'tot. ca vee bon lon lan lon don leh choo'},
{role:'Michael (You)',you:true,vi:'Đúng. Anh/Chị muốn tỉ lệ như thế nào giữa vỉ 4 lon và lon đơn?',en:'Correct. What ratio would you like between 4-packs and single cans?',ph:'dung. anh/chi mwon tee leh nyoo theh now yuh-a vee bon lon va lon don'},
{role:'Buyer (Chi Mai)',you:false,vi:'70% vỉ 4 lon, 30% lon đơn.',en:'70% 4-packs, 30% single cans.',ph:'70 fun tram vee bon lon, 30 fun tram lon don'},
{role:'Michael (You)',you:true,vi:'Được. Tôi có thể giao hàng trong 5 đến 7 ngày làm việc sau khi nhận cọc.',en:'Understood. I can deliver within 5 to 7 working days after receiving the deposit.',ph:'dook. toy co theh yow hang trong 5 den 7 ngay lam vyeck sau khi nyan kok'},
{role:'Buyer (Chi Mai)',you:false,vi:'Khi nào tôi nhận được báo giá chính thức?',en:'When will I receive the official quotation?',ph:'khi now toy nyan dook bow ya chinh thook'}
]},
{id:'s06',title:'Arranging Delivery and Lead Time',titleVi:'Sắp Xếp Giao Hàng',context:'The buyer has a deadline and needs to know if you can deliver on time. You must be honest and give ranges, never a hard commitment.',culturalNote:'Never promise a specific date you cannot guarantee. Give ranges and explain what factors affect timing. If something delays, inform the buyer immediately. Surprises destroy trust in Vietnam.',lines:[
{role:'Buyer (Anh Long)',you:false,vi:'Thời gian giao hàng thông thường của các anh là bao lâu?',en:'What is your usual delivery time?',ph:'thoy zan yow hang thong thuh-ung kwa cac anh la bow low'},
{role:'Michael (You)',you:true,vi:'Với hàng có sẵn trong kho Việt Nam, thường từ 5 đến 7 ngày làm việc.',en:'For goods already in our Vietnam warehouse, usually 5 to 7 working days.',ph:'voi hang co san trong kho Vyet Nam, thuh-ung too 5 den 7 ngay lam vyeck'},
{role:'Buyer (Anh Long)',you:false,vi:'Chúng tôi cần hàng trước ngày 15 tháng 8.',en:'We need the goods before August 15.',ph:'choong toy kan hang trook ngay 15 thang 8'},
{role:'Michael (You)',you:true,vi:'Nếu anh xác nhận đơn hàng và chuyển cọc trước ngày 28 tháng 7, chúng tôi có thể đảm bảo giao trước ngày 10 tháng 8.',en:'If you confirm the order and transfer the deposit before July 28, we can ensure delivery before August 10.',ph:'new anh sak nyan don hang va chween kok trook ngay 28 thang 7, choong toy co theh dam bow yow trook ngay 10 thang 8'},
{role:'Buyer (Anh Long)',you:false,vi:'Nếu giao trễ thì sao?',en:'What if delivery is late?',ph:'new yow treh thi sow'},
{role:'Michael (You)',you:true,vi:'Chúng tôi cam kết thông báo ngay nếu có rủi ro chậm trễ và cập nhật tình trạng đơn hàng hàng ngày.',en:'We commit to notifying you immediately if there is any delay risk and updating you on order status daily.',ph:'choong toy kam ket thong bow ngay new co roo ee ro cham treh va cap nhat tinh trang don hang hang ngay'},
{role:'Buyer (Anh Long)',you:false,vi:'Hàng giao đến kho hay đến từng cửa hàng?',en:'Is delivery to our warehouse or to individual stores?',ph:'hang yow den kho hay den toong kua hang'},
{role:'Michael (You)',you:true,vi:'Giao đến kho trung tâm của anh/chị. Phí vận chuyển nội thành TPHCM miễn phí cho đơn từ 60 thùng trở lên.',en:'Delivery to your central warehouse. Shipping within HCMC is free for orders of 60 cases or more.',ph:'yow den kho troong tam kwa anh/chi. fee van chween noi tanh TPHCM myen fee cho don too 60 thoong tro len'}
]},
{id:'s07',title:'Pitching Organika Sparkling Electrolyte',titleVi:'Giới Thiệu Sản Phẩm Organika',context:'A retail floor pitch of Organika Sparkling Electrolyte. Use the real product, real flavors, real formats. This is your core sales script.',culturalNote:'Lead with the benefit, not the brand. Vietnamese buyers want to know what it does for their customers first. Then explain why Organika is the right source for that benefit. Canadian origin is a trust anchor.',lines:[
{role:'Michael (You)',you:true,vi:'Hôm nay tôi muốn giới thiệu Organika Sparkling Electrolyte — đồ uống chức năng có ga từ Canada.',en:'Today I would like to introduce Organika Sparkling Electrolyte, a functional sparkling drink from Canada.',ph:'hom nay toy mwon yoy thyew Organika Sparkling Electrolyte — doh oong chook nang co ga too Canada'},
{role:'Buyer (Chi Phuong)',you:false,vi:'Sản phẩm này khác gì so với nước có ga thông thường?',en:'How is this product different from regular sparkling water?',ph:'san fam nay khac yee so voi nook co ga thong thuh-ung'},
{role:'Michael (You)',you:true,vi:'Organika Sparkling Electrolyte bổ sung chất điện giải thiết yếu, hỗ trợ miễn dịch và bù nước hiệu quả — không đường, không chất bảo quản nhân tạo.',en:'Organika Sparkling Electrolyte replenishes essential electrolytes, supports immunity and rehydrates effectively — no sugar, no artificial preservatives.',ph:'Organika Sparkling Electrolyte boh soong chat dyen yai thyeet yew, hoh tro myen zik va boo nook hyew kwa — khong duh-ung, khong chat bow kwan nyan tow'},
{role:'Buyer (Chi Phuong)',you:false,vi:'Có những hương vị nào?',en:'What flavors are available?',ph:'co nyoong hoong vee now'},
{role:'Michael (You)',you:true,vi:'Có ba hương vị: mâm xôi, chanh xanh và chanh vàng, và chanh dây với thơm.',en:'Three flavors: Raspberry, Lime and Lemon, and Passion Fruit with Pineapple.',ph:'co ba hoong vee: mam soy, chanh sang va chanh vang, va chanh zay voi thom'},
{role:'Buyer (Chi Phuong)',you:false,vi:'Có dạng đóng gói gì?',en:'What packaging formats are available?',ph:'co zang dong goy yee'},
{role:'Michael (You)',you:true,vi:'Có vỉ 4 lon và lon đơn lẻ. Vỉ 4 lon rất phù hợp để trưng bày trên kệ siêu thị và bán rất tốt trên Shopee và TikTok Shop.',en:'4-packs and single cans. The 4-pack is ideal for supermarket shelf display and sells very well on Shopee and TikTok Shop.',ph:'co vee bon lon va lon don leh. vee bon lon rat foo hop deh troong bay tren keh syew thi'},
{role:'Buyer (Chi Phuong)',you:false,vi:'Người tiêu dùng mục tiêu là ai?',en:'Who is the target consumer?',ph:'ngoo-ee tyew zoong mook tyew la ai'},
{role:'Michael (You)',you:true,vi:'Người tiêu dùng năng động, quan tâm đến sức khỏe, từ 20 đến 45 tuổi — đặc biệt phụ nữ và người đi làm tại TPHCM.',en:'Active, health-conscious consumers aged 20 to 45 — especially women and working professionals in HCMC.',ph:'ngoo-ee tyew zoong nang dong, kwan tam den sook khweh, too 20 den 45 twoy — dat byet foo noo va ngoo-ee dee lam tai TPHCM'},
{role:'Buyer (Chi Phuong)',you:false,vi:'Anh có kế hoạch hỗ trợ marketing gì không?',en:'Do you have any marketing support plans?',ph:'anh co keh hwak hoh tro marketing yee khong'},
{role:'Michael (You)',you:true,vi:'Dạ, chúng tôi hỗ trợ 3% doanh thu cho ngân sách marketing, bao gồm POSM, sampling tại điểm bán và hỗ trợ chạy quảng cáo trên Shopee.',en:'Yes, we provide 3% of revenue as marketing budget, covering POSM materials, in-store sampling, and Shopee advertising support.',ph:'ya, choong toy hoh tro 3 fun tram zwanh thu cho ngan sach marketing, bow gom POSM, sampling tai dyem ban va hoh tro chay kwang cao tren Shopee'}
]},
{id:'s08',title:'Taking and Confirming an Order',titleVi:'Nhận và Xác Nhận Đơn Hàng',context:'The buyer is ready to place an order. Confirm all details precisely, then confirm payment terms.',culturalNote:'Repeat the order back verbatim to avoid misunderstandings. Misquantities are common. Always confirm in writing (Zalo or email) after the verbal confirmation.',lines:[
{role:'Buyer (Chi Ngoc)',you:false,vi:'Tôi muốn đặt 30 thùng mâm xôi, 20 thùng chanh xanh chanh vàng, và 10 thùng chanh dây thơm.',en:'I want to order 30 cases Raspberry, 20 cases Lime Lemon, and 10 cases Passion Fruit Pineapple.',ph:'toy mwon dat 30 thoong mam soy, 20 thoong chanh sang chanh vang, va 10 thoong chanh zay thom'},
{role:'Michael (You)',you:true,vi:'Dạ, để tôi xác nhận lại: 30 thùng mâm xôi, 20 thùng chanh xanh chanh vàng, 10 thùng chanh dây thơm. Tổng cộng 60 thùng.',en:'Yes, let me confirm: 30 cases Raspberry, 20 cases Lime Lemon, 10 cases Passion Fruit Pineapple. Total 60 cases.',ph:'ya, deh toy sak nyan lie: 30 thoong mam soy, 20 thoong chanh sang chanh vang, 10 thoong chanh zay thom. tong kong 60 thoong'},
{role:'Buyer (Chi Ngoc)',you:false,vi:'Đúng rồi. Điều khoản thanh toán thế nào?',en:'Correct. What are the payment terms?',ph:'dung roi. dyew khwan tanh twan theh now'},
{role:'Michael (You)',you:true,vi:'Tiêu chuẩn là đặt cọc 30% khi xác nhận đơn, và thanh toán 70% còn lại khi nhận hàng.',en:'Standard is 30% deposit when confirming the order, and 70% balance on delivery.',ph:'tyew chwan la dat kok 30 fun tram khi sak nyan don, va tanh twan 70 fun tram kon lie khi nyan hang'},
{role:'Buyer (Chi Ngoc)',you:false,vi:'Chúng tôi muốn thanh toán 30 ngày sau khi nhận hàng.',en:'We want to pay 30 days after receiving the goods.',ph:'choong toy mwon tanh twan 30 ngay sau khi nyan hang'},
{role:'Michael (You)',you:true,vi:'Cho đơn đầu tiên, chúng tôi áp dụng điều khoản tiêu chuẩn. Sau khi có 2 đến 3 tháng hợp tác tốt, chúng ta hoàn toàn có thể xem xét điều khoản tốt hơn.',en:'For the first order we apply standard terms. After 2 to 3 months of good cooperation, we can certainly revisit better terms.',ph:'cho don dow tyen, choong toy ap zoong dyew khwan tyew chwan. sau khi co 2 den 3 thang hop tak tot'},
{role:'Buyer (Chi Ngoc)',you:false,vi:'Được. Khi nào tôi nhận được đơn đặt hàng chính thức?',en:'Okay. When will I receive the official purchase order?',ph:'dook. khi now toy nyan dook don dat hang chinh thook'},
{role:'Michael (You)',you:true,vi:'Tôi sẽ gửi đơn đặt hàng và hóa đơn cọc qua email và Zalo trong vòng 2 giờ.',en:'I will send the purchase order and deposit invoice by email and Zalo within 2 hours.',ph:'toy seh gwee don dat hang va hwa don kok kwa email va Zalo trong vong 2 yo'}
]},
{id:'s09',title:'Closing and Confirming Next Steps',titleVi:'Chốt Lại và Bước Tiếp Theo',context:'The meeting is ending well. You want to close on a high note and set clear next steps that maintain momentum.',culturalNote:'Always close with concrete next steps and a timeline. Vague meetings lead to vague follow-through. Vietnamese business relationships need momentum. Silences after a meeting suggest disinterest.',lines:[
{role:'Michael (You)',you:true,vi:'Tôi rất vui vì chúng ta có buổi thảo luận hiệu quả hôm nay.',en:'I am very pleased we had such a productive discussion today.',ph:'toy rat voy vi choong ta co bwoi thao lwan hyew kwa hom nay'},
{role:'Buyer (Chi Lan)',you:false,vi:'Tôi cũng vậy. Sản phẩm có tiềm năng tốt cho thị trường TPHCM.',en:'Same here. The product has good potential for the HCMC market.',ph:'toy koong vay. san fam co tyem nang tot cho thi truh-ung TPHCM'},
{role:'Michael (You)',you:true,vi:'Bước tiếp theo là tôi sẽ gửi đề xuất chính thức và mẫu thử trong vòng 3 ngày làm việc. Chị có muốn nhận mẫu thử không?',en:'Next step: I will send the official proposal and product samples within 3 working days. Would you like to receive samples?',ph:'book tyep thew la toy seh gwee deh swat chinh thook va mow thoo trong vong 3 ngay lam vyeck'},
{role:'Buyer (Chi Lan)',you:false,vi:'Dạ, tôi muốn thử sản phẩm trước khi quyết định.',en:'Yes, I want to try the product before deciding.',ph:'ya, toy mwon thoo san fam trook khi kwiyet dinh'},
{role:'Michael (You)',you:true,vi:'Tôi sẽ gửi mẫu cả ba hương vị. Chị có thể chia sẻ phản hồi sau 5 ngày dùng thử được không?',en:'I will send samples of all three flavors. Can you share feedback after 5 days of trial?',ph:'toy seh gwee mow ca ba hoong vee. chi co theh chia seh fan hoy sau 5 ngay zoong thoo dook khong'},
{role:'Buyer (Chi Lan)',you:false,vi:'Được. Liên lạc qua Zalo nhé, tôi phản hồi nhanh hơn.',en:'Okay. Contact me via Zalo, I respond faster there.',ph:'dook. lyen lak kwa Zalo nyeh, toy fan hoy nhanh hon'},
{role:'Michael (You)',you:true,vi:'Dạ, tôi sẽ gửi số Zalo ngay bây giờ. Cảm ơn chị rất nhiều về thời gian và sự cởi mở hôm nay.',en:'Yes, I will send my Zalo right now. Thank you very much for your time and openness today.',ph:'ya, toy seh gwee so Zalo ngay bay yoh. kahm un chi rat nyew veh thoy zan va soo koy moh hom nay'},
{role:'Buyer (Chi Lan)',you:false,vi:'Cảm ơn anh Michael. Hẹn gặp lại anh sớm!',en:'Thank you Michael. See you again soon!',ph:'kahm un anh Michael. hen gap lie anh som'}
]},
{id:'s10',title:'Small Talk Over Coffee or a Meal',titleVi:'Nói Chuyện Trong Bữa Ăn',context:'You are having lunch or coffee with a business contact before or after a meeting. This is where relationships are actually built in Vietnam.',culturalNote:'Sharing a meal is how Vietnamese business relationships are cemented. Accept everything offered. Try all the food. The host pays — do not fight for the bill. Ask about family, city, their opinion on things. Pivot to business naturally, not abruptly. The person who relaxes first signals trust.',lines:[
{role:'Michael (You)',you:true,vi:'Cảm ơn anh/chị đã mời ăn trưa. Nhà hàng này ngon quá!',en:'Thank you for inviting me to lunch. This restaurant is so delicious!',ph:'kahm un anh/chi da moy an truh-a. nya hang nay ngon kwa'},
{role:'Buyer (Anh Minh)',you:false,vi:'Anh ăn được đồ Việt Nam không? Cay không ngại chứ?',en:'Can you eat Vietnamese food? Not afraid of spicy right?',ph:'anh an dook doh Vyet Nam khong? kay khong ngai choo'},
{role:'Michael (You)',you:true,vi:'Tôi rất thích đồ Việt Nam, đặc biệt là phở và bún bò Huế. Cay vừa vừa là được.',en:'I love Vietnamese food, especially pho and Bun Bo Hue. Moderately spicy is fine.',ph:'toy rat thik doh Vyet Nam, dat byet la foh va bun boh Hweh. kay vuh-a vuh-a la dook'},
{role:'Buyer (Anh Minh)',you:false,vi:'Anh thích Sài Gòn không? So với Canada thế nào?',en:'Do you like Saigon? How does it compare to Canada?',ph:'anh thik Sai Gon khong? so voi Canada theh now'},
{role:'Michael (You)',you:true,vi:'Thích lắm! Sài Gòn năng động và đầy sức sống. Canada đẹp nhưng yên tĩnh hơn nhiều. Ở đây tôi cảm thấy nhiều cơ hội hơn.',en:'Very much! Saigon is dynamic and full of energy. Canada is beautiful but much quieter. Here I feel more opportunities.',ph:'thik lam! Sai Gon nang dong va dai sook song. Canada dep nyoong yen tinh hun nyew. uh dai toy kam thay nyew kuh hoy hun'},
{role:'Buyer (Anh Minh)',you:false,vi:'Gia đình anh có ở đây không?',en:'Is your family here with you?',ph:'ya dinh anh co oh day khong'},
{role:'Michael (You)',you:true,vi:'Không, vợ và hai con tôi ở Vancouver. Nhưng họ rất muốn đến Sài Gòn thăm. Nói anh nghe, vợ tôi rất muốn ăn bánh mì Sài Gòn.',en:'No, my wife and two children are in Vancouver. But they really want to visit Saigon. My wife especially wants to eat Saigon banh mi.',ph:'khong, vuh va high kon toy uh Vancouver. nyoong hoh rat mwon den Sai Gon tham. noy anh nge, vuh toy rat mwon an banh mee Sai Gon'},
{role:'Buyer (Anh Minh)',you:false,vi:'Mời cả gia đình sang chơi nhé! Sài Gòn luôn chào đón.',en:'Invite the whole family to come visit! Saigon always welcomes.',ph:'moy ca ya dinh sang choy nyeh! Sai Gon lwan chow don'},
{role:'Michael (You)',you:true,vi:'Cảm ơn anh! Nhân tiện, anh thấy người tiêu dùng TPHCM đang thay đổi thói quen như thế nào sau COVID?',en:'Thank you! By the way, how do you see HCMC consumers changing their habits after COVID?',ph:'kahm un anh! nyan tyen, anh thay ngoo-ee tyew zoong TPHCM dang thay doy thoy kwen nyoo theh now sau COVID'},
{role:'Buyer (Anh Minh)',you:false,vi:'Thay đổi rất nhiều. Người ta quan tâm đến sức khỏe hơn, sẵn sàng trả nhiều hơn cho sản phẩm chất lượng. Thị trường cho anh đang mở ra đó.',en:'Changing a lot. People care more about health, willing to pay more for quality products. The market is opening up for you.',ph:'thay doy rat nyew. ngoo-ee ta kwan tam den sook khweh hon, san sang tra nyew hon cho san fam chat loog'}
]}
,{id:'s11',title:'Handling a Damaged Shipment Complaint',titleVi:'Xử Lý Khiếu Nại Hàng Hỏng',context:'Your GT distributor calls: a pallet arrived with dented cans. How you handle the first complaint defines the relationship. Vietnamese partners watch how you take responsibility.',culturalNote:'Never argue about fault first. Acknowledge, apologize for the inconvenience (even before investigating), commit to a concrete next step with a date, then investigate. Saving the partner\'s face and showing ownership matters more than the money involved.',lines:[

const PRIMER=[
{id:'p01',title:'Pronouns and Address',content:`
<p>Vietnamese has no single word for "I" or "you" — the right word depends on <strong>your age relative to the person you are speaking to</strong>. Getting this right signals respect and cultural fluency.</p>
<table class="primer-table">
<tr><th>Term</th><th>Means</th><th>Use When</th></tr>
<tr><td><strong>Anh</strong></td><td>Older brother / you (male)</td><td>Speaking to or about a male buyer, partner, or contact similar age or older than you</td></tr>
<tr><td><strong>Chị</strong></td><td>Older sister / you (female)</td><td>Speaking to or about a female buyer, partner, or contact similar age or older</td></tr>
<tr><td><strong>Em</strong></td><td>Younger sibling / I (deferential)</td><td>Use as "I" when speaking to someone clearly senior or older; shows respect</td></tr>
<tr><td><strong>Tôi</strong></td><td>I (neutral)</td><td>Safe neutral "I" in business settings when age difference unclear</td></tr>
<tr><td><strong>Mình</strong></td><td>I / we (informal)</td><td>Used in casual and friendly conversation after rapport is established</td></tr>
<tr><td><strong>Chúng tôi</strong></td><td>We (excludes listener)</td><td>Our company, our team — standard in business presentations</td></tr>
<tr><td><strong>Bạn</strong></td><td>Friend / you</td><td>Peers and friends your age; less formal; avoid with senior buyers until relationship is warm</td></tr>
</table>
<p class="tip">Rule of thumb: If unsure of age, use <strong>Anh</strong> for men and <strong>Chị</strong> for women. It is always safer to be slightly deferential in Vietnam.</p>
`},
{id:'p02',title:'Southern vs. Northern Dialect',content:`
<p>You are operating in Ho Chi Minh City (South Vietnam). Southern Vietnamese has several key differences from the Northern dialect (Hanoi standard).</p>
<table class="primer-table">
<tr><th>Feature</th><th>Northern (Hanoi)</th><th>Southern (HCMC) 🌴</th></tr>
<tr><td>Letter "v"</td><td>Pronounced like English "v"</td><td>Often sounds like "y" in casual speech</td></tr>
<tr><td>Letter "d"</td><td>Pronounced "z"</td><td>Pronounced "y" (same as gi)</td></tr>
<tr><td>Tone count</td><td>6 distinct tones</td><td>6 tones, but hỏi and ngã often merge</td></tr>
<tr><td>Vocabulary</td><td>Standard dictionary terms</td><td>Some different words (e.g. trái vs. quả for fruit)</td></tr>
<tr><td>Pace</td><td>Moderate</td><td>Faster, more energetic</td></tr>
<tr><td>Formality</td><td>Slightly more formal default</td><td>More direct and relaxed in business</td></tr>
</table>
<p class="tip">Phonetics in this app reflect Southern pronunciation. Your HCMC partners will understand you perfectly — do not worry about accent. Clarity and respect matter more than perfection.</p>
`},
{id:'p03',title:'Register: Formal vs. Informal',content:`
<p>Vietnamese business language has clear register levels. Matching register to context shows sophistication.</p>
<table class="primer-table">
<tr><th>Register</th><th>When to Use</th><th>Example Signal Words</th></tr>
<tr><td><strong>Formal</strong></td><td>First meetings, senior executives, written proposals</td><td>Kính gửi, Trân trọng, Xin phép, Tôi xin</td></tr>
<tr><td><strong>Business Neutral</strong></td><td>Regular buyer meetings, negotiation, follow-up</td><td>Tôi muốn, Chúng tôi đề xuất, Anh/Chị có thể</td></tr>
<tr><td><strong>Warm / Friendly</strong></td><td>After rapport established, meals, Zalo messages</td><td>Mình, Bạn, thật ra, thật sự, nhé</td></tr>
</table>
<p>Key particles that soften and warm your speech:</p>
<ul>
<li><strong>nhé</strong> — adds friendliness, signals shared understanding ("okay?" / "right?")</li>
<li><strong>ạ</strong> — adds deference and politeness (used at end of sentences to elders)</li>
<li><strong>dạ</strong> — Southern polite "yes", used at start of response to show respect</li>
<li><strong>vâng</strong> — Northern polite "yes" (avoid in HCMC, use dạ instead)</li>
<li><strong>thôi</strong> — signals conclusion or resignation ("okay then", "that's enough")</li>
</ul>
`},
{id:'p04',title:'Six Tones of Vietnamese',content:`
<p>Vietnamese is a tonal language. The same syllable with different tones is a completely different word. HCMC South uses all 6 tones.</p>
<table class="primer-table">
<tr><th>Tone</th><th>Mark</th><th>Description</th><th>Example</th><th>Meaning</th></tr>
<tr><td>Flat (ngang)</td><td>(none)</td><td>Mid, level, held steady</td><td>ma</td><td>ghost</td></tr>
<tr><td>Falling (huyền)</td><td>à</td><td>Low, falling, slightly creaky</td><td>mà</td><td>but / which</td></tr>
<tr><td>Rising (sắc)</td><td>á</td><td>High, rising sharply</td><td>má</td><td>cheek / mom (South)</td></tr>
<tr><td>Dipping (hỏi)</td><td>ả</td><td>Mid, dips then rises</td><td>mả</td><td>tomb</td></tr>
<tr><td>Broken (ngã)</td><td>ã</td><td>Rising with glottal break (South: often like sắc)</td><td>mã</td><td>horse / code</td></tr>
<tr><td>Heavy (nặng)</td><td>ạ</td><td>Low, falling, cut short</td><td>mạ</td><td>rice seedling</td></tr>
</table>
<p class="tip">Do not let tones paralyze you. In business context, your partners will understand from context. Focus on the tones of your key vocabulary: numbers, product names, and polite particles matter most.</p>\n<button class="btn-primary full-w" style="margin-top:10px" onclick="S.toneSet=null;S.toneRight=0;S.toneTotal=0;go('tones')">🎵 Practice hearing tones</button>
`},
